<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>지식맵 · 이걸 이해하려면 — aTTo 학습앱</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* Atom Green 스킨 — 학습앱 index.html 변수와 같은 계열. 크기 사다리 12/14/16/20, 라운드 8/12/16 (DESIGN.md) */
:root{--bg:#F4F7F4;--card:#FFFFFF;--ink:#111814;--sub:#6B7570;--line:#E1E7E2;--acc:#4F9A35;--acc-soft:#E8F3E3;
 --known:#30B457;--shaky:#E0A100;--unknown:#E5484D;--unrated:#9AA19C;--sh:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0A0F0C;--card:#141B16;--ink:#F1F6F2;--sub:#9AA59E;--line:#263129;--acc:#5CAB3F;--acc-soft:#173019;
 --known:#4ADE80;--shaky:#FBBF24;--unknown:#FF6B6B;--unrated:#6B736E;--sh:none}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:10px}
header .back{font-size:14px;color:var(--sub)}header h1{font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{scroll-margin-top:60px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.card h2{font-size:16px;margin:0 0 8px;font-weight:700}.card h2 small{font-size:12px;color:var(--sub);font-weight:500;margin-left:6px}
.bar{display:grid;grid-template-columns:52px 1fr 44px;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin:4px 0}
.bar .tr{height:8px;border-radius:999px;background:var(--line);overflow:hidden}.bar .fl{height:100%;border-radius:999px;background:var(--acc);transition:width .3s}
.bar.mast .fl{background:var(--known)}.bar b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub);margin-top:6px}.meta b{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.tabs{display:flex;gap:14px;border-bottom:1px solid var(--line);margin-bottom:6px}.tabs button{background:none;border:0;padding:6px 2px;font-size:14px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer;font-family:inherit}.tabs button.on{color:var(--ink);border-color:var(--acc)}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.item:last-child{border:0}
.item .no{flex:none;width:34px;height:34px;border-radius:8px;background:var(--acc-soft);color:var(--acc);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.item .t{font-weight:600}.item .d{font-size:12px;color:var(--sub);margin-top:2px}.item.on .t{color:var(--acc)}
.item .st{margin-left:auto;flex:none;font-size:12px;color:var(--sub);white-space:nowrap}
.lvl{margin:10px 0 4px;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.02em;text-transform:uppercase}
.nodes{display:flex;flex-wrap:wrap;gap:6px}
.node{position:relative;border:1.5px solid var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 12%,var(--card));border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;cursor:pointer;line-height:1.3}
.node .h{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.node.gap{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--unknown)}.node.gap::before{content:"여기부터";position:absolute;top:-9px;left:8px;background:var(--unknown);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}
.node.next::before{content:"다음 평가";position:absolute;top:-9px;left:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}
.node.target{outline:2px dashed var(--acc);outline-offset:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:8px 0 2px}
.empty{color:var(--sub);font-size:14px;padding:14px 0;text-align:center}
.arrow{color:var(--sub);text-align:center;font-size:12px;margin:2px 0 -2px}
/* 카드 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:9}.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:14px 16px 28px;z-index:10;transform:translateY(105%);transition:transform .25s;max-width:640px;margin:0 auto}
.sheet.on{transform:none}.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-size:20px;margin:0;font-weight:700}.sheet .lv{font-size:12px;color:var(--sub);margin:2px 0 10px}
.sec{margin:10px 0}.sec h4{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 4px;letter-spacing:.02em}.sec p{margin:0;white-space:pre-wrap;font-size:14px}
.sec.easy{background:var(--acc-soft);border-radius:12px;padding:10px 12px}.sec.easy h4{color:var(--acc)}
.sec ol{margin:0;padding-left:18px}.sec li{margin:2px 0}
.pre{display:flex;flex-wrap:wrap;gap:6px}.pre .node{font-size:12px;padding:4px 8px}
.self{display:flex;align-items:center;gap:10px;margin:6px 0}.self input{flex:1;accent-color:var(--acc)}.self b{width:64px;text-align:right;font-size:14px}
.q{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}.q .qq{font-weight:600;margin-bottom:6px}
.q label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer}.q label input{margin-top:3px;accent-color:var(--acc)}
.q.ok{border-color:var(--known)}.q.bad{border-color:var(--unknown)}.q .why{font-size:12px;color:var(--sub);margin-top:6px;display:none}.q.done .why{display:block}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:700;padding:12px;margin-top:12px;cursor:pointer;font-family:inherit}.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
/* 스앵님 판정(2026-09-29) */
.judge{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--acc-soft);margin:0 0 10px}
.judge img{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 14%;background:#1b2a21}
.judge .jb{flex:1;min-width:0}.judge .jn{font-size:12px;font-weight:700;color:var(--acc);margin-bottom:2px}
.judge ul{list-style:none;margin:0;padding:0}.judge li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;flex-wrap:wrap}
.judge li .s{flex:none;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:2px 8px}.judge li .w{color:var(--sub);font-size:12px}
.judge li a{margin-left:auto;flex:none;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:34px;display:inline-flex;align-items:center;background:var(--card);color:var(--ink)}
.why2{font-size:14px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}.toast.on{opacity:1}
.src{font-size:12px;color:var(--sub);margin-top:8px}
details.prog{margin-bottom:10px}details.prog summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}details.prog summary::after{content:"▾";color:var(--sub)}details.prog[open] summary::after{content:"▴"}
details.prog ul{margin:6px 0 0;padding-left:18px;font-size:14px}details.prog li{margin:2px 0}

/* 마인드맵 v2 (MINDMAP2, 2026-10-02) — 과목 → 장 → 핵심 개념 */
#mapCard .mapbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.judge[hidden]{display:none!important}
.mapseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mapseg button{border:0;background:var(--card);color:var(--sub);font:inherit;font-size:13px;padding:7px 12px;cursor:pointer;min-height:36px}
.mapseg button.on{background:var(--acc-soft);color:var(--acc);font-weight:700}
#mapCard{width:min(1000px,calc(100vw - 28px));margin-left:calc((100% - min(1000px,calc(100vw - 28px)))/2)}
#mapWrap{position:relative;margin-top:6px}
#mmLines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#mmLines path{fill:none;stroke-width:2;stroke-linecap:round;opacity:.55}
.mm{display:grid;grid-template-columns:150px 1fr;gap:0 44px;align-items:center;position:relative}
.mm-root{align-self:center;background:var(--ink);color:var(--card);border-radius:16px;padding:16px 14px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.mm-root b{display:block;font-size:17px;letter-spacing:-.01em}
.mm-root span{display:block;font-size:12px;opacity:.75;margin-top:4px}
.mm-brs{display:flex;flex-direction:column;gap:16px}
.mm-br{display:grid;grid-template-columns:200px 1fr;gap:0 40px;align-items:center}
.mm-unit{background:color-mix(in srgb,var(--c) 12%,var(--card));border:1.5px solid var(--c);border-radius:14px;padding:10px 12px}
.mm-unit .mm-uh{display:flex;align-items:baseline;gap:6px}
.mm-unit b{font-size:14px;color:var(--ink)}
.mm-unit small{display:block;font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.35}
.mm-unit .mm-pg{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.mm-unit .mm-bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--c) 18%,transparent);margin-top:7px;overflow:hidden}
.mm-unit .mm-bar i{display:block;height:100%;background:var(--c)}
.mm-right{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mm-leaf{display:inline-flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--card);border-radius:10px;padding:7px 11px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;min-height:36px;box-shadow:var(--sh)}
.mm-leaf:hover{background:color-mix(in srgb,var(--c) 7%,var(--card))}
.mm-leaf .d{flex:none;width:9px;height:9px;border-radius:50%;background:var(--unrated)}
.mm-leaf.known .d{background:var(--known)}.mm-leaf.shaky .d{background:var(--shaky)}.mm-leaf.unknown .d{background:var(--unknown)}
.mm-leaf.dim{opacity:.38}
.mm-none{font-size:12.5px;color:var(--sub);padding:6px 2px}
.mm-base{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px;align-self:stretch}
.mm-base>span{font-size:11px;font-weight:700;color:var(--sub);margin-right:2px}
.mm-chip{border:1px dashed var(--line);background:transparent;color:var(--sub);border-radius:99px;padding:3px 9px;font:inherit;font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.mm-chip .d{width:7px;height:7px;border-radius:50%;background:var(--unrated)}
.mm-chip.known .d{background:var(--known)}.mm-chip.shaky .d{background:var(--shaky)}.mm-chip.unknown .d{background:var(--unknown)}
.mm-br.plan .mm-unit{border-style:dashed;opacity:.8}
@media (max-width:680px){
 .mm{grid-template-columns:1fr;gap:12px}
 .mm-root{justify-self:start;padding:10px 14px;text-align:left}
 .mm-br{grid-template-columns:1fr;gap:8px;border-left:3px solid var(--c);padding-left:10px}
 #mmLines{display:none}
}
</style>
</head>
<body>
<div class="wrap">
 <header><a class="back" href="./">‹ 학습앱</a><h1>이걸 이해하려면</h1><a class="back" href="coverage.html" title="과목별 진도 입력 현황">진도표</a><span id="mode" style="font-size:12px;color:var(--sub)"></span></header>
 <div class="chips" id="chips"></div>
 <details class="prog card" id="prog" style="display:none"><summary>진도 현황</summary><div id="progBody"></div></details>
 <div class="card" id="sum">
  <h2 id="sumTitle">과목을 고르세요</h2>
  <div class="bar"><span>학습도</span><div class="tr"><div class="fl" id="bStudy" style="width:0"></div></div><b id="vStudy">–</b></div>
  <div class="bar mast"><span>이해도</span><div class="tr"><div class="fl" id="bMast" style="width:0"></div></div><b id="vMast">–</b></div>
  <div class="meta" id="sumMeta"></div>
 </div>
 <div class="card">
  <div class="tabs"><button id="tabW" class="on">주차</button><button id="tabP">과제·문제</button></div>
  <div id="list"></div>
 </div>
 <div class="card" id="mapCard" style="display:none">
  <h2>개념 마인드맵</h2>
  <div class="judge" id="judge" hidden></div>
  <div class="mapbar">
   <span class="mapseg" id="mapScope"><button data-v="mid" class="on">중간 범위</button><button data-v="all">전체</button><button data-v="sel">선택한 주차</button></span>
   <span class="meta" id="mapMeta"></span>
  </div>
  <div class="legend"><span><i class="dot" style="background:var(--known)"></i>안다</span><span><i class="dot" style="background:var(--shaky)"></i>흔들림</span><span><i class="dot" style="background:var(--unknown)"></i>모름</span><span><i class="dot" style="background:var(--unrated)"></i>아직 안 풀어 봄</span></div>
  <div id="mapWrap"><svg id="mmLines" aria-hidden="true"></svg><div id="mm"></div></div>
 </div>
 <div class="card" id="treeCard" style="display:none">
  <h2 id="treeTitle"></h2>
  <div class="meta" id="treeMeta"></div>
  <div class="legend"><span><i class="dot" style="background:var(--known)"></i>안다</span><span><i class="dot" style="background:var(--shaky)"></i>흔들림</span><span><i class="dot" style="background:var(--unknown)"></i>모름</span><span><i class="dot" style="background:var(--unrated)"></i>미평가</span></div>
  <div id="tree"></div>
 </div>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>/* TJ-START */
/* 김주영 스앵님 판정 (대표님 2026-09-29 「개념 마인드맵은 스앵님이 학습을 통해 내가 뭘 알고 뭘 모르는지 알아서 파악」) — 원본은 이 파일 하나.
   빌더가 교실·수업 노트·학습 덱·암기노트 페이지에 그대로 넣고(__JUDGE__), learn.html 은 patch_learn_judge.py 가 TJ-START~TJ-END 사이를 이 파일로 갈아 끼운다.
   기록 = localStorage atto.evidence [{t, k, n:[노드], ok, v, lid, sid, qid, a, clean}] (최대 4000건 — 넘치면 읽기·질문 기록부터 버리고 노드마다 최근 문제 6건은 남긴다)
     k: quiz(ok) 확인 문제 · read(clean) 챕터·섹션 끝(다시 설명·질문 없이 끝났으면 clean) · again 다시 설명 · ask 질문 · memo(ok) 암기노트 외움 · self(v) 카드 자가평가
     a: 같은 시도 표시(카드 「다시 저장」) — 같은 a·qid 는 새 기록으로 바꿔 넣는다(정답 수가 늘지 않는다)
   판정 = 노드마다 atto.mastery[id] = {quiz:{correct,total,ts}, self, sts, ts, score, state, auto} — learn.html 은 TJ.score 로 같은 식을 쓴다.
     quiz = 최근 6번 · self(설명할 수 있나 1~5) = 읽음 4 · 다시 설명·질문 2번 이상이면 3 · 외움 +1 · 카드 자가평가가 더 최근이면 그 값
     → 문제 없이 읽기만 하면 최대 「흔들림」, 「안다」는 문제로만. 점수식 = (0.5·정답률·감쇠(quiz.ts) + 0.2·self/5·감쇠(sts))/0.7, 문제 없으면 self/5·0.6·감쇠(sts)
     감쇠 = 60일에 걸쳐 1 → 0.4 (최저 0.4). 정답 근거와 읽기·암기 근거를 따로 감쇠한다 — 오늘 암기 체크 하나로 90일 전 정답이 새것처럼 되지 않게(오타 .91 설계 검수 ⑦)
   저장이 막히면(용량·사생활 모드) 이 페이지 안에서는 메모리 사본으로 이어 가고 rec 은 false 를 돌려준다. */
(function(g){
  var EK="atto.evidence", MK="atto.mastery", CAP=4000, KEEPQ=6, MEM={}, DIRTY={};
  function rd(k,d){ if(DIRTY[k]) return MEM[k]; try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return v==null?d:v; }catch(e){ return DIRTY[k]?MEM[k]:d; } }
  function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); DIRTY[k]=false; return true; }catch(e){ MEM[k]=v; DIRTY[k]=true; return false; } }
  function decay(ts){ if(!ts) return 1; var d=Math.max(0,(Date.now()/1000-ts)/86400); return Math.max(.4,1-d/60); }
  function score(e){ if(!e||typeof e!=="object") return {score:0,state:"unrated"};
    var q=e.quiz||{}, tot=+q.total||0, cor=+q.correct||0, sv=e.self==null?null:Math.max(1,Math.min(5,+e.self));
    if(tot<=0&&sv==null) return {score:0,state:"unrated"};
    var dq=decay(+q.ts||+e.ts||0), ds=decay(+e.sts||+e.ts||0);
    var raw=tot>0?(0.5*(cor/tot)*dq+0.2*((sv||0)/5)*ds)/0.7:(sv/5)*0.6*ds, s=Math.min(1,raw), st;
    if(tot<=0) st=(sv>=4&&s>=.4)?"shaky":"unknown"; else st=s>=.7?"known":s>=.4?"shaky":"unknown";
    return {score:Math.round(s*1000)/1000,state:st}; }
  function why(evs){ var qz=evs.filter(function(e){return e.k==="quiz";}).slice(-KEEPQ), r={q:qz.length,c:qz.filter(function(e){return e.ok;}).length,
      read:evs.filter(function(e){return e.k==="read";}).length, clean:evs.filter(function(e){return e.k==="read"&&e.clean;}).length,
      conf:evs.filter(function(e){return (e.k==="again"||e.k==="ask")&&Date.now()-e.t<21*864e5;}).length,
      memo:null, self:null, last:0, selfLast:0};
    evs.forEach(function(e){ if(e.k==="memo") r.memo=!!e.ok; if(e.k==="self") r.self={v:+e.v,t:e.t}; if(e.t>r.last) r.last=e.t; if(e.k!=="quiz"&&e.t>r.selfLast) r.selfLast=e.t; });
    return r; }
  function judgeOne(id,L,M){ var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); if(!evs.length) return;
    var r=why(evs), e=Object.assign({},M[id]||{}), qz=evs.filter(function(x){return x.k==="quiz";}).slice(-KEEPQ);
    var self=null; if(r.read||r.conf||r.memo!=null){ self=r.read?4:3; if(r.conf>=2) self=3; if(r.memo) self=Math.min(5,self+1); }
    var autoLast=0; evs.forEach(function(x){ if(x.k!=="self"&&x.t>autoLast) autoLast=x.t; });

        (bl.length?'<div class="mm-base"><span>필요한 기초</span>'+bl.slice(0,8).map(function(p){return '<button class="mm-chip '+st(p)+'" data-id="'+p+'"><i class="d"></i>'+esc(mmName(p))+'</button>'}).join("")+(bl.length>8?'<span>+'+(bl.length-8)+'</span>':'')+'</div>':'')+

  [].forEach.call(document.querySelectorAll("#mm [data-id]"),function(g){g.onclick=function(){openCard(g.getAttribute("data-id"))}});

function mmLines(){var w=$("#mapWrap"),svg=$("#mmLines"),root=$("#mmRoot");if(!w||!svg||!root)return;

  var P=function(r,side){return {x:(side==="r"?r.right:r.left)-W.left,y:r.top+r.height/2-W.top}};
  var cv=function(a,b,c){var mx=(a.x+b.x)/2;return '<path stroke="'+c+'" d="M'+a.x+' '+a.y+' C'+mx+' '+a.y+' '+mx+' '+b.y+' '+b.x+' '+b.y+'"/>'};
  [].forEach.call(document.querySelectorAll("#mm .mm-br"),function(br){var c=getComputedStyle(br).getPropertyValue("--c").trim()||"#999",u=br.querySelector(".mm-unit");
    h+=cv(P(R,"r"),P(u.getBoundingClientRect(),"l"),c);

  svg.setAttribute("width",W.width);svg.setAttribute("height",W.height);svg.innerHTML=h}

/* 김주영 스앵님 판정: 학습 기록으로 판정된 노드 중 모름·흔들림, 점수 낮은 순 3개 — 근거와 그 개념을 배운 교실 */
var LINKS={};
function whyText(a){if(!a)return"";var w=[];if(a.q)w.push("문제 "+a.c+"/"+a.q);if(a.conf)w.push("다시 설명·질문 "+a.conf);if(a.read&&!a.q)w.push("읽기만");if(a.memo)w.push("외움");return w.join(" · ")}
function renderJudge(){var el=$("#judge");if(!el)return;var rows=subjectNodes(SUBJ).map(function(id){return {id:id,e:M[id]}}).filter(function(x){return x.e&&x.e.auto&&(x.e.state==="unknown"||x.e.state==="shaky")}).sort(function(a,b){return (+a.e.score||0)-(+b.e.score||0)}).slice(0,3);

/* ── 카드 시트: 쉬운 설명 + 자가평가 + 퀴즈 → 저장 ── */
var CARDS={};
function getCard(id){if(CARDS[id]!==undefined)return Promise.resolve(CARDS[id]);return fetch("knowledge/cards/"+id+".json").then(function(r){return r.ok?r.json():null}).catch(function(){return null}).then(function(c){CARDS[id]=c;return c})}

    if(c){h+='<div class="sec easy"><h4>쉽게 말하면</h4><p>'+esc(c.easy)+'</p></div><div class="sec"><h4>핵심</h4><p>'+esc(c.core)+'</p></div>';
      if(c.example)h+='<div class="sec"><h4>예제 — '+esc(c.example.q)+'</h4><ol>'+(c.example.steps||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol></div>';
      if(c.pitfall)h+='<div class="sec"><h4>흔한 실수</h4><p>'+esc(c.pitfall)+'</p></div>'}
    else h+='<div class="sec"><h4>카드</h4><p style="color:var(--sub)">카드 준비 중</p></div>';
    {var rs=window.TJ?TJ.reasons(id):null;h+='<div class="sec"><h4>스앵님 판정</h4><p class="why2">'+(rs?esc(whyText({q:rs.q,c:rs.c,conf:rs.conf,read:rs.read,memo:rs.memo})||"읽은 기록"):"기록 없음")+'</p></div>'}
    if(c&&c.quiz&&c.quiz.length)h+='<div class="sec"><h4>퀴즈 '+c.quiz.length+'문항</h4>'+c.quiz.map(function(q,i){return '<div class="q" data-i="'+i+'"><div class="qq">'+(i+1)+'. '+esc(q.q)+'</div>'+q.options.map(function(o,j){return '<label><input type="radio" name="q'+i+'" value="'+j+'"><span>'+esc(o)+'</span></label>'}).join("")+'<div class="why"></div></div>'}).join("")+'</div>';
    h+=(c&&c.quiz&&c.quiz.length?'<button class="btn" id="saveBtn">채점</button>':'')+'<button class="btn ghost" id="closeBtn">닫기</button>'+(n.src?'<div class="src">근거: '+esc(n.src)+'</div>':"");
    var sh=$("#sheet");sh.innerHTML=h;sh.classList.add("on");$("#sheetBg").classList.add("on");
    $("#closeBtn").onclick=closeCard;
    [].forEach.call(sh.querySelectorAll(".pre .node"),function(el){el.onclick=function(){openCard(el.dataset.id)}});
    var att=String(Date.now());var sb=$("#saveBtn");if(sb)sb.onclick=function(){var upd={},u={seen:true};

        if(miss){toast(miss+"문항이 비어 있어요");return}u.quiz={correct:cor,total:c.quiz.length}}
      /* 카드 퀴즈도 스앵님 판정 기록 — 문항마다 quiz 한 건 */
      if(u.quiz&&window.TJ){c.quiz.forEach(function(q,i){var r=sh.querySelector('input[name="q'+i+'"]:checked');if(r)TJ.rec({k:"quiz",ok:+r.value===q.answer,n:[id],lid:"card",qid:id+"#"+i,a:att})});try{var J=JSON.parse(localStorage.getItem("atto.mastery")||"{}");if(J[id])u=Object.assign({},J[id],{seen:true})}catch(e){}}
      upd[id]=u;this.disabled=true;var btn=this;saveM(upd).then(function(){var r=score(M[id]);renderJudge();toast((u.quiz?"퀴즈 "+u.quiz.correct+"/"+u.quiz.total+" · ":"")+({known:"안다",shaky:"흔들림",unknown:"모름"})[r.state]+" "+Math.round(r.score*100)+"%");renderSummary();renderList();renderTree();btn.disabled=false;btn.textContent="저장됨 — 다시 저장";}).catch(function(){toast("저장 실패");btn.disabled=false})}})}
