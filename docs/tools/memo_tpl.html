<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<!-- 암기노트 템플릿 v1 (대표님 2026-09-29 「암기해야 하는 것 · 이해해야 하는 것 구분 · 암기노트 따로」). build_memo.py 가 자리를 채운다.
     항목 = 수업 노트 원문의 공식 상자 + 「외울 것」 상자를 나눈 것. 가리기 = 답만 흐리게(누르면 보임). ✓ = 외움 → localStorage mc-memo-<약칭> · 스앵님 판정 기록(atto.evidence memo). 화면에 설명 문장 금지(지침 §24). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--ink:#1F2A44;--ink-2:#55627A;--ink-3:#6B7689;--line:rgba(31,42,68,.14);--paper:rgba(255,255,255,.78);--am:#B45309;--am-soft:rgba(217,119,6,.08);--ok:#15803D;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html{background:linear-gradient(160deg,#F4EFE6 0%,#F2F5F0 50%,#EDF2EE 100%) fixed}
body{margin:0;font-family:var(--f);font-size:17px;line-height:1.7;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
#top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid rgba(31,42,68,.08)}
#top .in{max-width:820px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#top .ttl{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
#top .ttl i{font-style:normal;font-size:12px;font-weight:800;color:#fff;background:var(--am);border-radius:99px;padding:4px 10px;line-height:1}
#top .sp{flex:1}
#cnt{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tb{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
.tb[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#bar{height:4px;background:rgba(31,42,68,.08)}#bar i{display:block;height:100%;width:0;background:var(--am);transition:width .3s}
main{max-width:820px;margin:0 auto;padding:14px 18px 90px}
#dates{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}#dates::-webkit-scrollbar{display:none}
#dates a{flex:0 0 auto;text-decoration:none;color:var(--ink);font-size:14px;font-weight:700;border:1.5px solid var(--line);background:rgba(255,255,255,.7);border-radius:99px;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;font-variant-numeric:tabular-nums}
#dates a.all{border-color:rgba(21,128,61,.4);color:var(--ok)}
.ls{margin:14px 0 22px;scroll-margin-top:84px}
.ls>h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:20px;line-height:1.35;margin:0 0 8px;letter-spacing:-.01em}
.ls>h2 .dt{font-size:13.5px;font-weight:700;color:var(--am);white-space:nowrap}
.ls>h2 .go{margin-left:auto;font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;min-height:36px;display:inline-flex;align-items:center;background:#fff}
.ch{margin:10px 0 14px;padding:12px 14px 6px;border-radius:16px;background:var(--paper);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(20,40,60,.06)}
.ch h3{margin:0 0 8px;font-size:15.5px;color:var(--ink-2)}
.it{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ch h3+.it{border-top:0}
.it .c{flex:1;min-width:0}
.it .k{font-weight:800}.it .sep{color:var(--ink-3);margin:0 2px}
.it.f .c{padding:2px 0 2px 12px;border-left:4px solid #D97706;background:var(--am-soft);border-radius:0 10px 10px 0}
.it .ck{flex:0 0 44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;color:transparent;font-size:18px;font-weight:900;cursor:pointer;display:grid;place-items:center}
.it .ck::before{content:"";width:16px;height:9px;border-left:3px solid #C3C9D2;border-bottom:3px solid #C3C9D2;transform:translateY(-2px) rotate(-45deg)}
.it.done .ck{background:var(--ok);border-color:var(--ok)}.it.done .ck::before{border-color:#fff}
.it.done .c{opacity:.62}
body.hide .it:not(.show) .ans{filter:blur(7px);-webkit-user-select:none;user-select:none;cursor:pointer}
body.hide .it:not(.show) .c{cursor:pointer}
body.left .it.done{display:none}body.left .ch.alldone,body.left .ls.alldone{display:none}
.katex-display{margin:6px 0;overflow-x:auto;overflow-y:hidden}
.katex{white-space:nowrap}
#empty{display:none;text-align:center;color:var(--ink-3);padding:40px 0}
body.left.none #empty{display:block}
@media(prefers-color-scheme:dark){
  :root{--ink:#F1F6F2;--ink-2:#B7C2BB;--ink-3:#95A29B;--line:rgba(255,255,255,.14);--paper:rgba(18,26,24,.7);--am-soft:rgba(217,119,6,.14)}
  html{background:linear-gradient(160deg,#0B1020 0%,#0E1A16 50%,#0B1412 100%) fixed}
  #top{background:rgba(18,26,24,.8);border-bottom-color:rgba(255,255,255,.08)}
  .tb,.ls>h2 .go,#dates a,.it .ck{background:rgba(255,255,255,.06)}
  .tb[aria-pressed="true"]{background:#F1F6F2;color:#0B1412;border-color:#F1F6F2}
  .ch{border-color:rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.35)}
}
.acts{display:flex;gap:8px}
@media(max-width:640px){body{font-size:16.5px}#top .in{padding:8px 12px;row-gap:8px}.acts{width:100%}.acts .tb{flex:1}main{padding:10px 12px 80px}.ls>h2{font-size:18px}.ch{padding:10px 12px 4px}}
</style>
</head>
<body>
<div id="top"><div class="in"><span class="ttl">__COURSE__ <i>암기</i></span><span class="sp"></span><span id="cnt"></span><span class="acts"><button type="button" class="tb" id="bHide" aria-pressed="false">가리기</button><button type="button" class="tb" id="bLeft" aria-pressed="false">못 외운 것</button></span></div><div id="bar"><i id="barI"></i></div></div>
<main><nav id="dates"></nav><div id="list"></div><div id="empty">전부 외움</div></main>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script>__JUDGE__</script>
<script>__SPLITTEX__</script>
<script>
const D=__DATA__, KEY="mc-memo-"+D.slug;
const $=s=>document.querySelector(s), $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ST={}; try{ ST=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ ST={}; }
let UI={hide:false,left:false}; try{ UI=Object.assign(UI,JSON.parse(localStorage.getItem(KEY+"-ui")||"{}")); }catch(e){}
const CH={}; D.lessons.forEach(l=>l.chs.forEach(c=>{ CH[l.date+"|"+c.sid]=c; }));
function ev(k,x){ try{ if(window.TJ){ const o=Object.assign({k:k},x||{}); if(o.n&&o.n.length) TJ.rec(o); } }catch(e){} }
function itemHTML(it){ return '<div class="it '+(it.t==="f"?"f":"m")+(ST[it.id]?" done":"")+'" data-id="'+esc(it.id)+'"><div class="c">'+(it.k?'<span class="k">'+it.k+'</span><span class="sep">'+esc(it.s)+'</span> ':'')+'<span class="ans">'+splitDisplays(it.a,innerWidth<700)+'</span></div><button type="button" class="ck" aria-label="외움" aria-pressed="'+(ST[it.id]?"true":"false")+'"></button></div>'; }
function render(){
  $("#dates").innerHTML=D.lessons.map(l=>'<a href="#d'+l.date+'">'+esc(l.label.split(" · ")[0])+'</a>').join("");
  $("#list").innerHTML=D.lessons.map(l=>'<section class="ls" id="d'+l.date+'" data-date="'+l.date+'"><h2><span class="dt">'+esc(l.label)+'</span>'+esc(l.title)+'<a class="go" href="'+esc(l.classroom)+'">교실</a></h2>'+
    l.chs.map(c=>'<div class="ch" data-k="'+l.date+"|"+esc(c.sid)+'"><h3>'+esc(c.title)+'</h3>'+c.items.map(itemHTML).join("")+'</div>').join("")+'</section>').join("");
  try{ renderMathInElement($("#list"),{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  fit(); bind(); stat(); }
/* 식은 한 줄 — 넘치면 글자를 줄여서(14px 까지), 그래도 넘치면 식 안에서 밀어 본다 */
function fit(){ $$(".katex-display").forEach(k=>{ k.style.fontSize=""; const cw=k.clientWidth, sw=k.scrollWidth; if(!(cw>0&&sw>cw+1)) return; const kx=k.querySelector(".katex"), fz=parseFloat(getComputedStyle(kx||k).fontSize)||20, lo=Math.min(1,Math.max(.6,14/fz)); k.style.fontSize=Math.max(lo,Math.floor(cw/sw*100)/100)+"em"; });
  $$(".katex").forEach(k=>{ if(k.closest(".katex-display")) return; k.style.fontSize=""; const box=k.closest(".c"); if(!box) return; const cw=box.clientWidth, w=k.getBoundingClientRect().width; if(cw>0&&w>cw-2){ const fs=parseFloat(getComputedStyle(k).fontSize)||17; k.style.fontSize=Math.max(14,Math.floor(fs*(cw-6)/w))+"px"; } }); }
function stat(){ const all=$$(".it"), dn=all.filter(x=>x.classList.contains("done")).length; $("#cnt").textContent="외움 "+dn+"/"+all.length; $("#barI").style.width=(all.length?Math.round(dn/all.length*100):0)+"%";
  $$(".ch").forEach(c=>c.classList.toggle("alldone",$$(".it",c).every(x=>x.classList.contains("done"))));
  $$(".ls").forEach(l=>l.classList.toggle("alldone",$$(".ch",l).every(c=>c.classList.contains("alldone"))));
  document.body.classList.toggle("none",all.length>0&&dn===all.length); }
function bind(){ $$(".it").forEach(el=>{ const id=el.dataset.id, ch=el.closest(".ch"), c=CH[ch.dataset.k]||{}, date=ch.dataset.k.split("|")[0];
  el.querySelector(".c").onclick=()=>{ if(document.body.classList.contains("hide")) el.classList.toggle("show"); };
  el.querySelector(".ck").onclick=()=>{ const on=!ST[id]; if(on) ST[id]=1; else delete ST[id]; try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){}
    el.classList.toggle("done",on); el.querySelector(".ck").setAttribute("aria-pressed",on?"true":"false"); stat();
    ev("memo",{ok:on,n:c.n||[],lid:D.slug+"-"+date,sid:c.sid}); }; }); }
function ui(){ document.body.classList.toggle("hide",UI.hide); document.body.classList.toggle("left",UI.left); $("#bHide").setAttribute("aria-pressed",UI.hide?"true":"false"); $("#bLeft").setAttribute("aria-pressed",UI.left?"true":"false");
  $$(".it.show").forEach(x=>x.classList.remove("show")); try{ localStorage.setItem(KEY+"-ui",JSON.stringify(UI)); }catch(e){} }
$("#bHide").onclick=()=>{ UI.hide=!UI.hide; ui(); }; $("#bLeft").onclick=()=>{ UI.left=!UI.left; ui(); };
window.addEventListener("resize",fit,{passive:true});
function boot(){ render(); ui(); const h=location.hash; if(h&&/^#d\d{4}-\d{2}-\d{2}$/.test(h)){ const el=document.querySelector(h); if(el) setTimeout(()=>el.scrollIntoView(),60); }
  try{ document.fonts.ready.then(fit); }catch(e){} }
(function wait(){ if(window.renderMathInElement) boot(); else setTimeout(wait,40); })();
</script>
</body>
</html>
