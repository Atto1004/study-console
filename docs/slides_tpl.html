<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0F1720;--stage:#FFFFFF;--ink:#1B2430;--ink-2:#3F4C5A;--ink-3:#6E7B88;--line:#DCE2E6;--acc:#4E5FB5;--acc-soft:#E8EAF7;--acc-ink:#36418C;
  --warn:#B9791A;--warn-soft:#FBF1DD;--warn-ink:#7A4E0B;--ok:#3D7A4E;--ok-soft:#E5F1E7;--crit:#B2483F;--crit-soft:#F8E6E3;--ans:#F0F3F5;--hl:#FFF176;
  --font-display:"Gowun Batang","Noto Serif KR",Georgia,serif;--font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);word-break:keep-all;overflow-wrap:anywhere}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
mjx-container{color:inherit}
#stage{position:relative;width:min(100vw - 24px, calc((100vh - 84px) * 16 / 9));aspect-ratio:16/9;background:var(--stage);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3);font-family:var(--font-mono);letter-spacing:.06em}
#top b{color:var(--acc);font-weight:500}
#bar{flex:1;height:5px;background:var(--line);border-radius:5px;overflow:hidden}#bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
#body{flex:1;min-height:0;overflow:auto;padding:20px 30px 16px;font-size:clamp(14px,1.9vw,19px);line-height:1.7}
#body h1{font-family:var(--font-display);font-size:clamp(24px,3.4vw,40px);margin:8px 0 12px;line-height:1.2}
#body h2{font-family:var(--font-display);font-size:clamp(19px,2.4vw,27px);margin:0 0 10px;line-height:1.3}
#body .kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--acc);text-transform:uppercase}
#body .why{background:var(--acc-soft);color:var(--acc-ink);border-radius:12px;padding:10px 14px;margin:8px 0 10px}
#body .concept{border:2px solid var(--acc);border-radius:12px;padding:10px 16px;margin:8px 0 10px}
#body .one{border-left:4px solid var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0;font-weight:600}
#body .say{font-size:.92em;color:var(--ink-2);background:var(--ans);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0}
#body .say b{color:var(--acc-ink)}
#body .hl{background:var(--hl);padding:0 3px;border-radius:3px}#body .red{color:var(--crit);font-weight:700}#body .star{color:var(--warn);font-weight:700}
#body .term{border-bottom:1px dashed var(--acc);color:var(--acc-ink)}
#body .tw{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:10px}
#body table{border-collapse:collapse;width:100%;font-size:.9em}#body th,#body td{padding:7px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}#body thead th{border-top:0;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);background:var(--ans)}
#body ul,#body ol{margin:0 0 8px;padding-left:22px}#body li{margin:3px 0}#body p{margin:0 0 8px}
.q-kind{display:inline-block;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;border-radius:5px;padding:2px 8px;color:#fff;background:var(--ok);margin-right:8px}.q-kind.a{background:var(--warn)}
.ans{background:var(--ans);border-radius:12px;padding:12px 16px;margin-top:12px;border-left:4px solid var(--acc)}
.ans.hidden{display:none}
.myans{margin-top:12px}.myans label{display:block;font-size:13px;color:var(--ink-2,#555);margin-bottom:4px}.myans .hint{font-weight:400;opacity:.7}
.myans textarea{width:100%;box-sizing:border-box;font:inherit;font-size:20px;line-height:1.4;padding:10px 14px;border:2px solid var(--acc);border-radius:12px;background:#fff;resize:none;outline:none}
.myans textarea:focus{box-shadow:0 0 0 3px rgba(60,90,200,.15)}
.myans-show{margin-top:12px;border:2px dashed var(--acc);border-radius:12px;padding:8px 14px}.myans-txt{font-size:20px;white-space:pre-wrap;word-break:keep-all}
.btn[disabled]{opacity:.45;cursor:default}
.cover{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px}
.cover .big{font-family:var(--font-display);font-size:clamp(30px,5vw,60px);line-height:1.15;margin:6px 0}
.cover .sub{color:var(--ink-2);font-size:1.05em}
.center{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:10px 0;width:100%}
.score .c{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.score .c b{display:block;font-size:2em;font-family:var(--font-mono)}
.score .c.ok{border-color:var(--ok);background:var(--ok-soft)}.score .c.warn{border-color:var(--warn);background:var(--warn-soft)}.score .c.crit{border-color:var(--crit);background:var(--crit-soft)}
#foot{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line);background:#fff}
#foot .act{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font-size:14px;font-family:inherit;cursor:pointer;color:var(--ink)}
.btn.a{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.crit{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.btn:disabled{opacity:.4;cursor:default}
.nav{width:46px;height:46px;border-radius:999px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-size:22px;cursor:pointer;display:grid;place-items:center;transition:opacity .2s,transform .2s}
.nav.next{background:var(--acc);color:#fff}
.nav.locked{opacity:.18;transform:scale(.9);pointer-events:none}
.nav.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.done-tag{font-family:var(--font-mono);font-size:11px;color:var(--ok);letter-spacing:.08em}
#parts{display:flex;gap:6px;flex-wrap:wrap}
#parts span{font-family:var(--font-mono);font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--ans);color:var(--ink-3)}
#parts span.cur{background:var(--acc);color:#fff}#parts span.done{background:var(--ok-soft);color:var(--ok)}
@media(orientation:portrait){#hint{display:block}}
#hint{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--warn);color:#fff;text-align:center;font-size:13px;padding:6px}
</style>
</head>
<body>
<div id="stage">
  <div id="top"><b>__TITLE__</b><span id="pos"></span><div id="bar"><i></i></div><div id="parts"></div></div>
  <div id="body"></div>
  <div id="foot"><button class="nav prev" id="prev" aria-label="이전">←</button><div class="act" id="act"></div><span class="done-tag" id="doneTag"></span><button class="nav next locked" id="next" aria-label="다음">→</button></div>
</div>
<div id="hint">아이패드를 가로로 돌리면 화면이 넓어집니다</div>
<script>
const DECK_ID="__DECK_ID__";
const SLIDES=__SLIDES__;
const PARTS=__PARTS__;
const KEY="mc-slides-"+DECK_ID;
let ST={idx:0,done:{},correct:{},revealed:{},answer:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&typeof s==="object") ST=Object.assign(ST,s); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function partScore(p){ const qs=SLIDES.filter(s=>s.type==="q"&&s.part===p); const b=qs.filter(q=>q.kind==="기초"), a=qs.filter(q=>q.kind==="응용");
  const cnt=arr=>({n:arr.length,ok:arr.filter(q=>ST.correct[q.id]===true).length,done:arr.filter(q=>ST.done[q.id]).length});
  return {b:cnt(b),a:cnt(a)}; }
function partDone(p){ return SLIDES.filter(s=>s.part===p&&s.type!=="result").every(s=>ST.done[s.id]); }
function render(){
  const i=Math.max(0,Math.min(ST.idx,SLIDES.length-1)); ST.idx=i; const s=SLIDES[i]; const body=$("#body"), act=$("#act");
  $("#pos").textContent=(i+1)+" / "+SLIDES.length; $("#bar i").style.width=((i+1)/SLIDES.length*100)+"%";
  $("#parts").innerHTML=PARTS.map(p=>'<span class="'+(p.n===s.part?"cur":partDone(p.n)?"done":"")+'">'+p.n+'</span>').join("");
  act.innerHTML=""; $("#doneTag").textContent=ST.done[s.id]?"완료":"";
  if(s.type==="start"){
    body.innerHTML='<div class="cover"><div class="kicker">학습 슬라이드 · 가로 화면</div><div class="big">__TITLE__</div><div class="sub">한 페이지를 끝내면 오른쪽 아래 <b>→</b>가 켜집니다. 개념 페이지는 「읽었어요」, 문제 페이지는 「답 보기」 뒤 맞음/틀림을 고릅니다. 진행과 정답률은 이 기기에 저장됩니다.</div>'+
      '<div class="sub">파트 '+PARTS.length+'개 · 문제 '+SLIDES.filter(x=>x.type==="q").length+'개</div></div>';
    act.innerHTML='<button class="btn a" id="go">시작</button>'+(Object.keys(ST.done).length?'<button class="btn" id="reset">처음부터(기록 지우기)</button>':'');
    $("#go").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };
    const r=$("#reset"); if(r) r.onclick=()=>{ if(confirm("진행 기록을 지울까요?")){ ST={idx:0,done:{},correct:{},revealed:{},answer:{}}; save(); render(); } };
  } else if(s.type==="cover"){
    body.innerHTML='<div class="cover"><div class="kicker">'+esc(s.no)+'</div><div class="big">'+esc(s.title)+(s.star?' <span class="star">★</span>':'')+'</div><div class="sub">개념 → 기초 문제 → 응용 문제 순서로 갑니다.</div></div>';
    act.innerHTML='<button class="btn a" id="ok">시작</button>'; $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };
  } else if(s.type==="concept"){
    body.innerHTML='<div class="kicker">'+(s.part?'파트 '+s.part+' · 개념':'')+'</div><h2>'+esc(s.title)+'</h2>'+s.html;
    act.innerHTML='<button class="btn ok" id="ok">'+(ST.done[s.id]?"다시 읽음 표시":"읽었어요 — 이해했습니다")+'</button>';
    $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); render(); };
  } else if(s.type==="q"){
    const rev=!!ST.revealed[s.id];
    ST.answer=ST.answer||{}; const my=ST.answer[s.id]||"";
    body.innerHTML='<div class="kicker">파트 '+s.part+'</div><h2><span class="q-kind'+(s.kind==="응용"?" a":"")+'">'+s.kind+'</span>'+esc(s.qn)+'</h2><div class="qbody">'+s.html+'</div>'+
      (rev
        ? '<div class="myans-show"><div class="kicker">내 답</div><div class="myans-txt">'+esc(my)+'</div></div>'
        : '<div class="myans"><label for="myans">내 답 <span class="hint">— 풀이 과정 말고 답만. 행렬은 [1 2; 3 4]처럼, 여러 개면 쉼표로</span></label><textarea id="myans" rows="2" placeholder="여기에 답을 쓰고 「답 확인」">'+esc(my)+'</textarea></div>')+
      '<div class="ans'+(rev?"":" hidden")+'"><div class="kicker">답 · 풀이</div>'+s.ans+'</div>';
    if(!rev){
      act.innerHTML='<button class="btn a" id="reveal" disabled>답 확인</button>';
      const ta=$("#myans"), rb=$("#reveal");
      const sync=()=>{ ST.answer[s.id]=ta.value; rb.disabled=!ta.value.trim(); };
      ta.oninput=sync; ta.onchange=()=>{ sync(); save(); }; sync();
      rb.onclick=()=>{ if(!ta.value.trim()){ ta.focus(); return; } ST.answer[s.id]=ta.value.trim(); ST.revealed[s.id]=true; save(); render(); };
      ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); rb.click(); } };
      setTimeout(()=>ta.focus(),50);
    }
    else { const c=ST.correct[s.id];
      act.innerHTML='<button class="btn ok" id="yes">맞았어요'+(c===true?" ✓":"")+'</button><button class="btn crit" id="no">틀렸어요 · 다시'+(c===false?" ✓":"")+'</button>';
      $("#yes").onclick=()=>{ ST.correct[s.id]=true; ST.done[s.id]=true; save(); render(); };
      $("#no").onclick=()=>{ ST.correct[s.id]=false; ST.done[s.id]=true; save(); render(); }; }
  } else if(s.type==="result"){
    const sc=partScore(s.part), pct=(o)=>o.n?Math.round(o.ok/o.n*100):0;
    const passB=sc.b.n===0||sc.b.ok===sc.b.n, passA=sc.a.n===0||sc.a.ok*3>=sc.a.n*2;
    body.innerHTML='<div class="center"><div class="kicker">파트 '+s.part+' 결과</div><h1>'+esc(s.title)+'</h1><div class="score">'+
      '<div class="c '+(passB?"ok":"warn")+'"><b>'+sc.b.ok+'/'+sc.b.n+'</b>기초 · '+pct(sc.b)+'%</div>'+
      '<div class="c '+(passA?"ok":"warn")+'"><b>'+sc.a.ok+'/'+sc.a.n+'</b>응용 · '+pct(sc.a)+'%</div></div>'+
      '<p>'+(passB&&passA?'<b>파트 완료.</b> 기준(기초 전부 + 응용 2/3 이상)을 넘었습니다.':'기준은 <b>기초 전부 + 응용 2/3 이상</b>. 틀린 문제는 개념 페이지로 돌아가 다시 읽고 하루 뒤 다시 풀어 보세요. 그래도 다음으로 갈 수 있습니다.')+'</p></div>';
    act.innerHTML='<button class="btn" id="back">이 파트 처음으로</button><button class="btn a" id="ok">확인</button>';
    $("#back").onclick=()=>{ ST.idx=SLIDES.findIndex(x=>x.id==="p"+s.part+"-cover"); save(); render(); };
    $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); render(); };
  } else if(s.type==="final"){
    const all=PARTS.map(p=>({p,sc:partScore(p.n)}));
    const tb=all.reduce((a,x)=>a+x.sc.b.ok,0), tbn=all.reduce((a,x)=>a+x.sc.b.n,0), ta=all.reduce((a,x)=>a+x.sc.a.ok,0), tan=all.reduce((a,x)=>a+x.sc.a.n,0);
    body.innerHTML='<div class="center"><div class="kicker">전체 결과</div><h1>'+(tb===tbn&&ta*3>=tan*2?'학습 완료':'거의 다 왔습니다')+'</h1><div class="score">'+
      '<div class="c '+(tb===tbn?"ok":"warn")+'"><b>'+tb+'/'+tbn+'</b>기초</div><div class="c '+(ta*3>=tan*2?"ok":"warn")+'"><b>'+ta+'/'+tan+'</b>응용</div></div>'+
      '<div class="tw" style="width:100%"><table><thead><tr><th>파트</th><th>기초</th><th>응용</th><th>상태</th></tr></thead><tbody>'+
      all.map(x=>'<tr><td>'+x.p.n+' '+esc(x.p.title)+'</td><td>'+x.sc.b.ok+'/'+x.sc.b.n+'</td><td>'+x.sc.a.ok+'/'+x.sc.a.n+'</td><td>'+((x.sc.b.n===0||x.sc.b.ok===x.sc.b.n)&&(x.sc.a.n===0||x.sc.a.ok*3>=x.sc.a.n*2)?'완료':'재시도')+'</td></tr>').join("")+
      '</tbody></table></div><p class="say">틀린 문제만 다시 풀려면 아래 「틀린 문제 다시」. 아톰이 이 결과를 보고 다음 난이도를 정합니다.</p></div>';
    const wrong=SLIDES.filter(x=>x.type==="q"&&ST.correct[x.id]===false);
    act.innerHTML='<button class="btn a" id="retry"'+(wrong.length?'':' disabled')+'>틀린 문제 다시 ('+wrong.length+')</button><button class="btn" id="first">처음으로</button>';
    $("#retry").onclick=()=>{ if(!wrong.length) return; wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; }); ST.idx=SLIDES.indexOf(wrong[0]); save(); render(); };
    $("#first").onclick=()=>{ ST.idx=0; save(); render(); };
    ST.done[s.id]=true; save();
  }
  const nxt=$("#next"), prv=$("#prev");
  const unlocked=!!ST.done[s.id]&&i<SLIDES.length-1;
  nxt.classList.toggle("locked",!unlocked); nxt.classList.toggle("pulse",unlocked);
  prv.classList.toggle("locked",i===0);
  $("#body").scrollTop=0;
  if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([body]).catch(()=>{});
}
function go(d){ const n=ST.idx+d; if(n<0||n>=SLIDES.length) return; if(d>0&&!ST.done[SLIDES[ST.idx].id]) return; ST.idx=n; save(); render(); }
$("#next").onclick=()=>go(1); $("#prev").onclick=()=>go(-1);
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"||e.key===" ") go(1); else if(e.key==="ArrowLeft") go(-1); });
let tx=null; document.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>70) go(dx<0?1:-1); tx=null; });
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},startup:{pageReady:()=>MathJax.startup.defaultPageReady().then(render)}};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<noscript>자바스크립트가 필요합니다.</noscript>
</body>
</html>
