<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일반물리학2 · 중간고사 대비 (21 전하 · 22 전기장 · 23 가우스 · 24 전위 · 25 전기용량)</title>
<!-- 학습게임 지침(학습게임_미적분2.md) v4 템플릿 · 오타 디자인 검토(2026-09-17, RED 14건) 반영
     폰트 2종: 본문 손글씨(Nanum Pen Script, display=block) + 수식·숫자 정자(KaTeX). 5색 고정. 16:10. 상단 진행점·챕터명·n/N, 하단 [힌트] [확인/다음]. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 5색 고정 (지침 §2) */
  --memory:#FFE45C; --caution:#E03131; --concept:#1971C2; --exam:#FF4D8D; --example:#2F9E44;
  /* 무채색 — 종이·글자·선 (의미색 아님) */
  --paper:#FFFFFF; --ink:#111111; --muted:#5F5F5F; --line:#D8D8D8; --soft:#F5F5F5; --bg:#EDEDED;
  /* 폰트 2종 (지침 §1) */
  --font-hand:'Nanum Pen Script','NanumPen',sans-serif;
  --font-num:'KaTeX_Main','Times New Roman',serif;
  /* 글자 크기 3단계 (지침 §1) */
  --fs-title:31px; --fs-body:22px; --fs-note:17px;
}
*{box-sizing:border-box}
:where(h1,h2,h3,h4,p,ul,ol,li,dl,dt,dd,pre,blockquote,figure,figcaption,table,th,td,button,input,textarea,label){margin:0;padding:0;text-indent:0;word-break:keep-all;overflow-wrap:break-word}
html,body{height:100%;width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-hand);font-size:var(--fs-body);line-height:1.45;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
body{display:grid;place-items:center;padding:12px}
.katex{font-size:1em}
#stage{position:relative;width:min(calc(100vw - 24px),calc((100dvh - 24px) * 1.6));aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
/* 상단: 진행점 · 챕터명 · n/N */
#top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) auto;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:var(--fs-note)}
#progress{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.dot{flex:0 0 12px;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.dot.done{background:var(--ink)}
.dot.exam{border-color:var(--exam);background:var(--exam)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
#chapter{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pos{font-family:var(--font-num);white-space:nowrap}
/* 작업 영역 */
#body{min-height:0;overflow:hidden;padding:18px 24px 12px;font-size:var(--fs-body);line-height:1.45}
#body[data-ready="false"]{visibility:hidden}
#body.scrollable{overflow:auto}   /* 시작 위치 장만 — 학습 내용이 아니라 목록이라 스크롤 허용 */
#body h1,#body h2{font-size:var(--fs-title);line-height:1.2;margin-bottom:8px}
#body h3{font-size:var(--fs-body)}
.num{font-family:var(--font-num)}
#fontWarn{position:absolute;left:22px;right:22px;top:58px;border:2px solid var(--caution);background:var(--paper);padding:6px 12px;font-size:var(--fs-note);z-index:12}
#fontWarn[hidden]{display:none}
#body .kicker{font-size:var(--fs-note);color:var(--muted)}
#body p,#body li{margin:0}
#body p+p{margin-top:6px}
#body ul,#body ol{padding-left:22px}
#body :is(.why,.concept,.one,.say,.extra),.ans,.myans-show,.mu>div{margin:8px 0 0;padding:10px 14px}
#body .why,#body .concept{border:2px solid var(--concept)}
#body .say{border-left:4px solid var(--concept);background:var(--soft)}
#body .say b{color:var(--concept)}
#body .one{border-left:4px solid var(--ink);background:var(--soft)}
#body .term{color:var(--concept);border-bottom:1px dashed var(--concept)}
#body .hl{background:var(--memory);padding:0 4px}
#body .red{color:var(--caution)}
#body .star{color:var(--exam)}
#body .tw{overflow:hidden;margin:8px 0 0;border:1px solid var(--line)}
#body table{border-collapse:collapse;width:100%;font-size:var(--fs-body)}
#body th,#body td{padding:3px 10px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
#body thead th{border-top:0;font-size:var(--fs-note);color:var(--muted)}
#body pre{white-space:pre-wrap;font-family:var(--font-num);font-size:var(--fs-note);line-height:1.35}
#body code{font-family:var(--font-num)}
/* 시험 언급 — 최우선 (지침 §3) */
.exam-callout{border:4px solid var(--exam);padding:10px 14px;margin:0 0 10px;background:var(--paper)}
.exam-label{font-size:var(--fs-note);color:var(--exam)}
.exam-label b{color:var(--ink)}
.exam-quote{font-size:var(--fs-body)}
/* 표지·결과 */
.cover .big{font-size:var(--fs-title);line-height:1.2;margin:6px 0 10px}
.cover .sub{font-size:var(--fs-body)}
.score{display:flex;gap:14px;margin:10px 0}
.score .c{border:2px solid var(--ink);padding:10px 16px}
.score .c b{display:block;font-family:var(--font-num);font-size:var(--fs-title)}
/* 암기 vs 이해 */
.mu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mu>div{min-width:0}
.mu-mem{background:var(--memory);border:2px solid var(--memory)}
.mu-und{border:2px solid var(--concept)}
.mu-h{margin-bottom:4px}.mu-h .hint{font-size:var(--fs-note);color:var(--muted);margin-left:6px}
.mu li{margin:2px 0}
/* 문제 */
.q-kind{display:inline-block;font-size:var(--fs-note);border:1px solid var(--ink);padding:0 8px;margin-right:8px;vertical-align:middle}
#body.q-mode{display:flex;flex-direction:column}
#body.q-mode>*{flex:0 0 auto}
.pad{flex:1 1 auto!important;min-height:100px;display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);overflow:hidden;background:var(--paper)}
.pad-bar{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:var(--fs-note);background:var(--soft);flex-wrap:wrap}
.pad-bar .hint{color:var(--muted);margin-right:auto}
.pad-bar button{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.pad-bar button.on{background:var(--ink);color:var(--paper)}
.pad canvas{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:24px 24px}
/* V4-PADPANEL 필기 판 — 「+ 필기」로 여닫음, 문제 아래쪽을 덮는다 */
#padPanel{position:absolute;left:24px;right:24px;top:38%;bottom:72px;background:var(--paper);border:2px solid var(--ink);display:none;flex-direction:column;z-index:16}
#padPanel.on{display:flex}
#padPanel .pad{flex:1 1 auto;margin:0;border:0;min-height:0}
#padBtn.on{background:var(--ink);color:var(--paper)}
/* V4-ANSLB 답·풀이 판 — 작업 영역 전체 */
#anslb{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);display:none;flex-direction:column;z-index:18;padding:14px 24px;overflow:hidden}
#anslb.on{display:flex}
#anslb .ans{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:8px}
#anslb .ans-top{display:flex;align-items:center;gap:10px}
#anslb .ans-top .kicker{margin-right:auto}
.myans{margin-top:8px}.myans label{display:block;font-size:var(--fs-note);color:var(--muted)}
.myans textarea{width:100%;font-family:var(--font-num);font-size:var(--fs-body);line-height:1.35;padding:6px 12px;border:2px solid var(--ink);background:var(--paper);resize:none;outline:none}
.myans textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.myans-show{border:2px dashed var(--ink)}
.myans-txt{font-family:var(--font-num);white-space:pre-wrap}
.ans{border:2px solid var(--example)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;font:inherit;font-size:var(--fs-body);padding:6px 12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:48px}
.choice .cn{flex:0 0 28px;height:28px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:var(--fs-note)}
.choice .ct{min-width:0}
.choice.sel{border-color:var(--ink);border-width:3px}
.choice.ok{border-color:var(--example)}.choice.ok .cn{background:var(--example);border-color:var(--example);color:var(--paper)}
.choice.bad{border-color:var(--caution)}.choice.bad .cn{background:var(--caution);border-color:var(--caution);color:var(--paper)}
.choice[disabled]{cursor:default}
.verdict{padding:6px 14px;border:2px solid var(--ink)}.verdict.ok{border-color:var(--example)}.verdict.bad{border-color:var(--caution);color:var(--caution)}
/* 시작 위치 */
.jump-h{font-size:var(--fs-note);color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jump-part{display:flex;gap:10px;align-items:flex-start;margin:2px 0}
.jump-pt{flex:0 0 220px;font-size:var(--fs-note);padding-top:6px}
.jump-items{display:flex;flex-wrap:wrap;gap:4px}
.jp{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.jp.done{background:var(--ink);color:var(--paper)}.jp.skip{color:var(--muted);text-decoration:line-through;border-color:var(--line)}.jp.cur{border:3px solid var(--ink)}
/* 하단: [이전] [힌트] · 출처 · 동작 · [확인/다음] */
#foot{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:var(--fs-body);min-height:48px;padding:4px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.xs{font-size:var(--fs-note);min-height:36px;padding:2px 12px}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#act{display:flex;gap:8px;align-items:center;margin-left:auto}#act .hint{font-size:var(--fs-note);color:var(--muted)}
#next{margin-left:8px}
#next.undone{background:var(--paper);color:var(--ink);border-style:dashed}
#doneTag{font-size:var(--fs-note);color:var(--muted)}
/* 출처 썸네일 · 확대 */
#srcs{display:flex;gap:6px}
.src-th{position:relative;width:48px;height:48px;padding:0;border:2px solid var(--ink);overflow:hidden;background:var(--paper);cursor:pointer;flex:0 0 auto}
.src-th img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.src-th .src-n{position:absolute;right:0;bottom:0;font-family:var(--font-num);font-size:var(--fs-note);background:var(--ink);color:var(--paper);padding:0 4px}
#srclb{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:20;padding:12px 18px}
#srclb.on{display:flex}
.src-top{display:flex;align-items:center;gap:10px;font-size:var(--fs-note);padding-bottom:8px}.src-top b{color:var(--ink)}.src-top .src-pos{margin-left:auto;font-family:var(--font-num)}
.src-x{font:inherit;font-size:var(--fs-body);min-width:48px;min-height:44px;border:2px solid var(--ink);background:var(--paper);cursor:pointer}
.src-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);touch-action:pan-x pan-y pinch-zoom}
.src-body img{width:100%;height:auto;display:block;cursor:zoom-in}
.src-body img.zoom{width:190%;max-width:none;cursor:zoom-out}
.src-foot{display:flex;align-items:center;gap:10px;padding-top:8px}.src-foot .hint{margin:0 auto;font-size:var(--fs-note);color:var(--muted)}
/* 힌트 상자 */
#hintBox{position:absolute;left:22px;right:22px;bottom:76px;background:var(--paper);border:2px solid var(--ink);padding:10px 14px;z-index:15}
#hintBox[hidden]{display:none}
/* 검사 모드 표시 */
#chk{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);overflow:auto;padding:20px;z-index:30;font-size:var(--fs-note);display:none}

/* ===== V6 UI — 조작부 재설계 (아토 2026-09-21). 본문(손글씨·5색)은 그대로, 조작부만 정자·평면 ===== */
:root{--ui:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;--accent:#4F9A35;--accent-soft:#EAF4E6;--bad:#D23B3B;--bad-soft:#FBEAEA;--line:#E3E8E5;--soft:#F4F6F5;--bg:#EEF1EF;--muted:#6B7570;--ink-3:#8A9490}
body{background:var(--bg)}
#stage{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
/* 상단: 분절 진행 막대 + 정자 라벨 */
#top{padding:12px 20px;gap:14px;font-family:var(--ui);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:#fff}
#progress{gap:3px;flex-wrap:nowrap;overflow:hidden}
.dot{flex:1 1 0;width:auto;min-width:6px;max-width:28px;height:6px;border:0;border-radius:3px;background:var(--line)}
.dot.done{background:var(--accent)}.dot.cur{background:#B7DBA8;outline:0;box-shadow:inset 0 0 0 1px var(--accent)}.dot.exam{background:#FFC2D8}.dot.exam.done{background:var(--exam)}
#chapter{font-family:var(--ui);font-size:13px;font-weight:600;color:#1F2A24}
#pos{font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
/* 본문 상자: 두꺼운 파란 테두리 → 좌측 바 */
#body .why,#body .concept{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
#body .one{border-radius:0 10px 10px 0}#body .say{border-radius:0 10px 10px 0}
#body .tw{border-radius:10px}
.mu-mem{border:0;border-left:3px solid #E5C400;background:#FFF9D6;border-radius:0 10px 10px 0}.mu-und{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
.q-kind{font-family:var(--ui);font-size:12px;font-weight:600;border:0;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
#body .kicker{font-family:var(--ui);font-size:12px;letter-spacing:0;color:var(--ink-3)}
/* 보기 카드 */
.choices{gap:10px;margin-top:12px}
.choice{font-family:var(--font-hand);border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;min-height:56px;transition:border-color .12s,background .12s}
.choice:hover{border-color:#B9C4BE;background:var(--soft)}
.choice .cn{flex:0 0 28px;width:28px;height:28px;border:0;border-radius:50%;background:var(--soft);color:#1F2A24;font-family:var(--ui);font-size:13px;font-weight:600}
.choice.sel{border:2px solid var(--accent);padding:11px 13px}.choice.sel .cn{background:var(--accent);color:#fff}
.choice.ok{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}.choice.ok .cn{background:var(--accent);color:#fff}
.choice.bad{border:2px solid var(--bad);background:var(--bad-soft);padding:11px 13px}.choice.bad .cn{background:var(--bad);color:#fff}
.choice[disabled]:not(.ok):not(.bad){opacity:.55}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 주관식 */
.myans label{font-family:var(--ui);font-size:12px;color:var(--muted)}
.myans textarea{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--ui);font-size:16px;background:#fff}
.myans textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.myans-show{border:1px dashed #B9C4BE;border-radius:12px;background:var(--soft)}
.myans-txt{font-family:var(--ui);font-size:16px}
.myans-note{margin-top:8px}
/* 판정·안내 */
.verdict{font-family:var(--ui);font-size:13px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:var(--soft);color:#1F2A24}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}
#act .hint{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
#doneTag{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
/* 하단 바 · 버튼 */
#foot{padding:10px 16px;gap:8px;border-top:1px solid var(--line);background:#fff}
.btn{font-family:var(--ui);font-size:14px;font-weight:600;min-height:40px;padding:6px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1F2A24;box-shadow:none}
.btn:hover{background:var(--soft)}
.btn.xs{font-size:13px;min-height:36px;padding:4px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
#next{min-width:96px}
#next.undone{background:#fff;color:var(--accent);border:1px solid var(--accent);border-style:solid}
.btn[disabled]{opacity:.35}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#padBtn.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
/* 출처 썸네일 */
#srcs{gap:6px}
.src-th{width:40px;height:40px;border:1px solid var(--line);border-radius:8px}
.src-th .src-n{font-family:var(--ui);font-size:11px;padding:0 5px;border-radius:6px 0 6px 0}
.src-x{font-family:var(--ui);font-size:14px;border:1px solid var(--line);border-radius:10px;min-height:40px}
.src-top{font-family:var(--ui);font-size:13px}.src-body{border-radius:12px}
.src-foot .hint{font-family:var(--ui);font-size:12px}
/* 힌트 · 필기 · 풀이 판 · 글꼴 경고 */
#hintBox{border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
#padPanel{border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
.pad-bar{font-family:var(--ui);font-size:12px;padding:6px 10px;background:var(--soft);border-radius:14px 14px 0 0}
.pad-bar button{font-family:var(--ui);font-size:12px;font-weight:600;min-height:32px;padding:2px 10px;border:1px solid var(--line);border-radius:8px}
.pad-bar button.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
#anslb{padding:16px 24px}
#anslb .ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
.ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
#anslb .ans-top .kicker{font-family:var(--ui);font-size:12px}
#fontWarn{border:1px solid var(--bad);border-radius:10px;font-family:var(--ui);font-size:12px}
.score .c.ok b{color:var(--accent)}.score .c.bad b{color:var(--bad)}.rs-rule{font-family:var(--ui);font-size:13px;color:var(--muted);margin-top:4px}.rs-pass{color:var(--accent)}.rs-fail{color:var(--bad)}
.rs-list{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.rs-list .kicker{flex:0 0 100%}
.rs-q{font:inherit;font-size:var(--fs-note);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 12px;cursor:pointer}.rs-q:hover{background:var(--soft)}
/* 시작 위치 목록 · 결과 */
.jp{font-family:var(--ui);font-size:13px;border:1px solid var(--line);border-radius:8px;min-height:34px}
.jp.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}.jp.cur{border:2px solid var(--accent)}
.score{gap:12px}.score .c{border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:12px 18px;min-width:120px}
.score .c b{font-family:var(--ui);font-weight:700;font-size:28px;line-height:1.1}
.cover .kicker{font-family:var(--ui);font-size:12px;color:var(--ink-3)}

/* ===== V6C 여백 제거 (아토 2026-09-21) ===== */
:root{--fs-title:clamp(26px,3.6vh,36px);--fs-body:clamp(18px,2.7vh,26px);--fs-note:clamp(13px,1.9vh,18px)}
body{padding:0;display:block}
#stage{width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none;margin:0}
@media(min-width:1480px){#stage{width:1400px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#top{padding:10px clamp(16px,3vw,40px)}
#foot{padding:10px clamp(16px,3vw,40px)}
#body{padding:clamp(14px,3vh,28px) clamp(20px,4vw,56px) clamp(10px,2vh,20px)}

#body:not(.q-mode):not(.scrollable)>*{flex:0 0 auto}
#body:not(.q-mode):not(.scrollable){--cs:1;font-size:calc(var(--fs-body)*var(--cs))}

#body:not(.q-mode):not(.scrollable) :is(.why,.concept,.one,.say,.extra,.mu>div){padding:calc(12px*var(--cs)) calc(16px*var(--cs))}
@media(min-height:680px) and (min-width:900px){#body:not(.q-mode):not(.scrollable){--cs:1.12}}
@media(min-height:760px) and (min-width:1100px){#body:not(.q-mode):not(.scrollable){--cs:1.22}}
@media(min-width:1300px){#body{padding-left:max(56px,calc((100% - 1180px)/2));padding-right:max(56px,calc((100% - 1180px)/2))}}
#body.q-mode{--qs:1}
@media(min-height:680px) and (min-width:900px){#body.q-mode{--qs:1.15}}
@media(min-height:760px) and (min-width:1000px){#body.q-mode{--qs:1.3}}
@media(min-height:900px) and (min-width:1100px){#body.q-mode{--qs:1.45}}
#body.q-mode h2{font-size:calc(var(--fs-title)*var(--qs))}
#body.q-mode .qbody{font-size:calc(var(--fs-body)*1.1*var(--qs));margin-top:8px}
#body.q-mode{justify-content:safe center}
#body.q-mode .choices{flex:0 1 auto;min-height:0;grid-auto-rows:minmax(72px,auto);margin-top:calc(18px*var(--qs));gap:calc(14px*var(--qs))}
#body.q-mode .choice{min-height:calc(72px*var(--qs));padding:calc(16px*var(--qs)) calc(20px*var(--qs));font-size:calc(var(--fs-body)*1.12*var(--qs))}
#body.q-mode .choice .cn{flex:0 0 32px;width:32px;height:32px;font-size:14px}
#body.q-mode .myans textarea{font-size:calc(18px*var(--qs))}
#body.q-mode .myans{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#body.q-mode .myans textarea{flex:1 1 auto;min-height:88px}
.cover .big{font-size:calc(var(--fs-title)*1.25)}
.cover .sub{max-width:60ch}
@media(max-width:700px){.choices{grid-template-columns:minmax(0,1fr)}#body{padding:14px 16px 10px;overflow:auto}#body.q-mode{justify-content:flex-start}#top,#foot{padding-left:12px;padding-right:12px}#srcs{display:none}#foot{gap:6px}.btn{white-space:nowrap;padding:6px 12px}#act .hint{display:none}#chapter{display:none}}

/* ===== V6D 본문 서체: Gowun Dodum (아토 2026-09-21 "손글씨 대신 더 이쁜 대안") ===== */
:root{--font-hand:'Gowun Dodum',Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;--fs-title:clamp(24px,3.2vh,32px);--fs-body:clamp(17px,2.4vh,23px);--fs-note:clamp(13px,1.8vh,16px)}
html,body{line-height:1.55}
#body h1,#body h2{font-weight:700;letter-spacing:-.01em}
#body .why,#body .concept,#body .one,#body .say{line-height:1.6}

/* ===== V6F 글래스 (대표님 2026-09-24) — 치수 불변, 색·투명·모서리만 ===== */
:root{--gl:rgba(255,255,255,.60);--gl-2:rgba(255,255,255,.42);--gl-3:rgba(255,255,255,.82);--gl-line:rgba(255,255,255,.80);--gl-hi:inset 0 1px 0 rgba(255,255,255,.85);--gl-blur:blur(18px) saturate(140%);--line:rgba(17,17,17,.14);--soft:rgba(255,255,255,.40)}
html{background:linear-gradient(160deg,#E9F0F5 0%,#F2F5F0 48%,#EDF2EE 100%) fixed}
body{background:transparent;position:relative}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;pointer-events:none;filter:blur(60px)}
body::before{width:52vw;height:52vw;max-width:640px;max-height:640px;left:-14vw;top:-18vh;background:radial-gradient(circle at 40% 40%,rgba(74,222,128,.32),transparent 68%)}
body::after{width:60vw;height:60vw;max-width:760px;max-height:760px;right:-20vw;bottom:-24vh;background:radial-gradient(circle at 50% 50%,rgba(96,165,250,.30),transparent 66%)}
#stage{position:relative;z-index:1;background:var(--gl-2);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);border-color:var(--gl-line)}
#top{background:var(--gl-2);border-bottom:1px solid var(--gl-line)}
#foot{background:var(--gl-2);border-top:1px solid var(--gl-line)}
.dot{background:rgba(255,255,255,.7)}
.btn{background:var(--gl);border-color:rgba(17,17,17,.55);border-radius:12px;box-shadow:var(--gl-hi)}
.btn.primary{background:#15803D;border-color:#15803D;color:#fff;box-shadow:0 4px 12px rgba(21,128,61,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.choice{background:var(--gl);border-color:rgba(255,255,255,.85);border-radius:14px;box-shadow:0 2px 10px rgba(20,40,60,.06),var(--gl-hi)}
.choice.sel{border-color:var(--ink)}
.choice .cn{background:rgba(255,255,255,.7)}
#body .why,#body .concept{background:var(--gl-2);border-color:rgba(25,113,194,.38);border-radius:14px}
#body .say,#body .one{background:var(--gl-2);border-radius:0 12px 12px 0}
#body .tw{border-radius:10px;background:var(--gl-2)}
.exam-callout{background:rgba(255,77,141,.08);border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mu>div{border-radius:14px}
.score .c{border-radius:14px;background:var(--gl-2)}
.q-kind{border-radius:8px;background:var(--gl-2)}
.verdict{border-radius:12px;background:var(--gl)}
.jp{border-radius:10px;background:var(--gl)}
.myans textarea{border-radius:12px;background:var(--gl)}
#anslb,#padPanel{background:var(--gl-3);-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%)}
#padPanel{border-radius:16px;border-color:rgba(17,17,17,.45)}
.pad{border-radius:10px;background:rgba(255,255,255,.85)}
#hintBox{border-radius:14px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#stage{background:#FAFBFA}.choice,.btn,#top,#foot,#body .why,#body .concept{background:#FFFFFF}}
</style>
</head>
<body>
<div id="stage">

  <div id="chk"></div>
</div>
<script>
const DECK_ID="phys2-mid";
const SLIDES=[{"id": "start", "type": "start"}, {"id": "jump", "type": "jump", "part": 0}, {"id": "p1-cover", "type": "cover", "part": 1, "no": "파트 1 · 9/4", "title": "21장 전하와 쿨롱 법칙 · 전기장의 정의 ★", "star": true}, {"id": "p1-concept", "type": "concept", "part": 1, "title": "전기의 소스는 전하, 전기장은 +1 C이 받는 힘 (1/3)", "html": "<div class=\"why\">전기 파트 전체(21~25장)는 <b>정전기학</b> — 전하가 시간에 따라 변하지 않는다. 전하 → 전기장 → 가우스 법칙 → 전위 → 축전기 순서로 쌓인다.</div>\n  <div class=\"concept\"><p><b>전하</b>: 양자화 \\(q=ne\\), \\(e=1.6\\times10^{-19}\\) C. 시험전하는 \\(+1\\) C(전자 약 \\(6\\times10^{18}\\)개). 전하 밀도 기호: 선 \\(\\lambda=dq/ds\\) · 면 \\(\\sigma=dq/dA\\) · 부피 \\(\\rho\\).</p></div>", "exam": [{"level": "범위", "when": "9/4·9/18 40:48", "quote": "중간고사 범위 = 21장 전하 ~ 27장 RC 회로까지(28장 제외). \"중간고사를 포기하면 뒤를 포기하는 것\""}]}, {"id": "p1-concept-2", "type": "concept", "part": 1, "title": "전기의 소스는 전하, 전기장은 +1 C이 받는 힘 (2/3)", "html": "<div class=\"concept\"><p><b>쿨롱 법칙</b>: \\[\\vec F=\\frac{1}{4\\pi\\varepsilon_0}\\frac{qq'}{r^2}\\hat r,\\qquad \\frac{1}{4\\pi\\varepsilon_0}=k\\approx9\\times10^9\\ \\mathrm{N\\,m^2/C^2},\\ \\varepsilon_0=8.854\\times10^{-12}\\] 교수는 \\(k\\) 대신 <b>\\(1/4\\pi\\varepsilon_0\\)</b> 표기를 쓴다. \\(\\varepsilon_0\\) = 진공 유전율(가장 작다 → 진공에서 전기력이 최대). \\(\\mu_0=4\\pi\\times10^{-7}\\) 투자율, \\(c=1/\\sqrt{\\varepsilon_0\\mu_0}\\).</p></div><div class=\"concept\"><p><b>전기장의 정의</b>: 단위 양전하(+1 C 시험전하)가 받는 전기력. \\(\\vec E=\\lim_{q'\\to0}\\vec F/q'\\). 시험전하는 원래 장을 흐트러뜨리지 않도록 미소전하로 본다.</p></div><div class=\"concept\"><p><b>전기력선</b>: 양전하에서 나와 음전하로. 선의 밀도 = 장의 세기. 전기장 구하기는 전하 분포가 <b>불연속(Σ)</b>이냐 <b>연속(∫)</b>이냐로 갈린다.</p></div><div class=\"concept\"><p>자하(자기 홀극)는 분리되지 않는다 → 자기의 소스는 전류(기말 범위).</p></div>", "exam": []}, {"id": "p1-concept-3", "type": "concept", "part": 1, "title": "전기의 소스는 전하, 전기장은 +1 C이 받는 힘 (3/3)", "html": "<div class=\"one\">한 줄: q = ne, F = (1/4πε₀)qq'/r², E = 단위 양전하가 받는 힘, 밀도 기호 λ·σ·ρ.</div>\n  ", "exam": []}, {"id": "p1-mu", "type": "mu", "part": 1, "title": "21장 전하와 쿨롱 법칙 · 전기장의 정의 ★", "mem": ["\\(e=1.6\\times10^{-19}\\) C · \\(1/4\\pi\\varepsilon_0=9\\times10^9\\) · \\(\\varepsilon_0=8.854\\times10^{-12}\\)", "쿨롱 법칙 \\(F=\\frac{1}{4\\pi\\varepsilon_0}\\frac{qq'}{r^2}\\)", "밀도 기호: 선 λ · 면 σ · 부피 ρ"], "und": ["전기장이 \"힘/시험전하\"인 이유와 시험전하를 미소전하로 두는 이유", "\\(k=1/4\\pi\\varepsilon_0\\)로 쓰는 이유(가우스 법칙에서 \\(\\varepsilon_0\\)가 그대로 나온다)", "정전기(21~25장)와 동전기(26장~)의 경계"]}, {"id": "p1-b1", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-1 · 전하의 양자화", "html": "<p>어떤 물체의 알짜 전하가 \\(-3.2\\times10^{-19}\\) C이다. 이 물체는 전자가 몇 개 남거나 부족한가? (\\(e=1.6\\times10^{-19}\\) C)</p>", "ans": "\\(q=ne\\) → \\(n=3.2/1.6=2\\). 음전하이므로 전자가 <b>남는</b> 것.", "choices": [{"html": "전자 2개가 남는다(잉여)", "ok": true}, {"html": "전자 2개가 부족하다", "ok": false}, {"html": "전자 1개가 남는다", "ok": false}, {"html": "전자 20개가 남는다", "ok": false}], "exam": []}, {"id": "p1-b2", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-2 · 쿨롱 힘", "html": "<p>\\(+1\\,\\mu\\)C 점전하 두 개가 1 m 떨어져 있다. 서로에게 작용하는 힘의 크기와 종류는? (\\(1/4\\pi\\varepsilon_0=9\\times10^9\\))</p>", "ans": "\\(F=9\\times10^9\\times\\frac{(10^{-6})^2}{1^2}=9\\times10^{-3}\\) N. 같은 부호 → 척력.", "choices": [{"html": "\\(9\\times10^{-3}\\) N, 척력", "ok": true}, {"html": "\\(9\\times10^{-9}\\) N, 척력", "ok": false}, {"html": "\\(9\\times10^{3}\\) N, 인력", "ok": false}, {"html": "\\(9\\times10^{-3}\\) N, 인력", "ok": false}], "exam": []}, {"id": "p1-b3", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-3 · 전기장의 정의", "html": "<p>어떤 점의 전기장 \\(\\vec E\\)의 정의로 옳은 것은?</p>", "ans": "\\(\\vec E=\\vec F/q'\\), \\(q'\\to0\\)인 +1 C 시험전하 기준. 방향 = 양전하가 받는 힘의 방향.", "choices": [{"html": "그 점에 놓인 <b>단위 양전하(+1 C 시험전하)</b>가 받는 전기력", "ok": true}, {"html": "그 점에 놓인 단위 음전하가 받는 전기력", "ok": false}, {"html": "그 점을 지나는 전기력선의 총 개수", "ok": false}, {"html": "그 점에 전하를 놓는 데 필요한 에너지", "ok": false}], "exam": []}, {"id": "p1-b4", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-4 · 밀도 기호", "html": "<p>전하 밀도 기호의 짝이 맞는 것은?</p>", "ans": "\\(\\lambda=dq/ds\\)(직선·고리), \\(\\sigma=dq/dA\\)(원판·평면), \\(\\rho\\)(부피, 가우스 법칙의 부도체구). 답에 기호를 바꿔 쓰면 감점.", "choices": [{"html": "선 \\(\\lambda\\) · 면 \\(\\sigma\\) · 부피 \\(\\rho\\)", "ok": true}, {"html": "선 \\(\\sigma\\) · 면 \\(\\lambda\\) · 부피 \\(\\rho\\)", "ok": false}, {"html": "선 \\(\\rho\\) · 면 \\(\\sigma\\) · 부피 \\(\\lambda\\)", "ok": false}, {"html": "선 \\(\\lambda\\) · 면 \\(\\rho\\) · 부피 \\(\\sigma\\)", "ok": false}], "exam": []}, {"id": "p1-a5", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-1 · 두 전하 사이 힘", "html": "<p>원점에 \\(q_1=+2\\,\\mu\\)C, \\(x=1\\) m에 \\(q_2=-2\\,\\mu\\)C가 있다. \\(q_1\\)이 받는 힘 \\(\\vec F\\)의 크기와 방향을 구하라. (\\(1/4\\pi\\varepsilon_0=9\\times10^9\\))</p>", "ans": "\\(F=9\\times10^9\\times\\frac{(2\\times10^{-6})^2}{1^2}=3.6\\times10^{-2}\\) N. 부호가 다르므로 인력 → \\(q_1\\)은 \\(q_2\\) 쪽(\\(+x\\) 방향)으로 당겨진다.", "choices": null, "exam": []}, {"id": "p1-a6", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-2 · 전기력 / 중력", "html": "<p>수소 원자에서 전자와 양성자 사이 전기력과 중력의 비 \\(F_e/F_g\\)를 구하라. \\(e=1.6\\times10^{-19}\\) C, \\(m_e=9.11\\times10^{-31}\\) kg, \\(m_p=1.67\\times10^{-27}\\) kg, \\(G=6.67\\times10^{-11}\\), \\(1/4\\pi\\varepsilon_0=9\\times10^9\\).</p>", "ans": "거리는 약분된다. \\(\\dfrac{F_e}{F_g}=\\dfrac{k e^2}{G m_e m_p}=\\dfrac{9\\times10^9\\times(1.6\\times10^{-19})^2}{6.67\\times10^{-11}\\times9.11\\times10^{-31}\\times1.67\\times10^{-27}}\\approx2.3\\times10^{39}\\). 전기력이 압도적 — 원자 세계에서 중력은 무시한다.", "choices": null, "exam": []}, {"id": "p1-result", "type": "result", "part": 1, "title": "21장 전하와 쿨롱 법칙 · 전기장의 정의 ★"}, {"id": "p2-cover", "type": "cover", "part": 2, "no": "파트 2 · 9/9·9/11", "title": "22장 전기장 계산 — 불연속(Σ) · 연속(∫) 6종 ★★", "star": true}, {"id": "p2-concept", "type": "concept", "part": 2, "title": "분포가 불연속이면 Σ, 연속이면 ∫ — 대칭성으로 성분을 죽인다 (1/4)", "html": "<div class=\"why\">22장은 \"전하 분포 6종의 전기장\"이다. 점전하·점전하군·쌍극자는 <b>합(Σ)</b>, 직선·원형·원판은 <b>적분(∫)</b>. 세 적분은 모두 \\(dq\\to dE\\to\\) 대칭으로 살아남는 성분만 \\(\\int\\)의 수순.</div>\n  ", "exam": [{"level": "필수", "when": "9/11", "quote": "점전하 벡터식 \\(\\vec E=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r^3}\\vec r\\) — \"시험 문제 내면 반드시 써야 된다\""}, {"level": "강조", "when": "9/11", "quote": "원형 도선 공식 — \"이거는 시험 볼 때 쓰려니까\". 무한 평면 \\(E=\\sigma/2\\varepsilon_0\\)는 거리와 무관"}]}, {"id": "p2-concept-2", "type": "concept", "part": 2, "title": "분포가 불연속이면 Σ, 연속이면 ∫ — 대칭성으로 성분을 죽인다 (2/4)", "html": "<div class=\"concept\"><p><b>① 점전하</b> \\[\\vec E=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r^2}\\hat r=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r^3}\\vec r\\] 벡터 꼴로 쓸 것. \\(q&gt;0\\)이면 밖으로.</p></div><div class=\"concept\"><p><b>② 점전하군</b>(중첩): \\(\\vec E=\\sum_i\\vec E_i\\) — 각 전하의 장을 <b>벡터</b>로 더한다(크기 합 ✗). 성분으로 나눠 합한 뒤 크기·각.</p></div><div class=\"concept\"><p><b>③ 전기 쌍극자</b>: \\(\\vec p=q\\vec d\\)(−q→+q). 축에서 \\(z\\gg d\\)이면 \\(E\\approx\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{2p}{z^3}\\) — <b>\\(1/z^3\\)</b>으로 감소(±q가 멀리서 상쇄).</p></div>", "exam": []}, {"id": "p2-concept-3", "type": "concept", "part": 2, "title": "분포가 불연속이면 Σ, 연속이면 ∫ — 대칭성으로 성분을 죽인다 (3/4)", "html": "<div class=\"concept\"><p><b>④ 직선 도선</b>(길이 L, 전하 q, 연장선에서 끝까지 a): \\(dq=\\lambda dx\\), \\(dE_x=\\frac{1}{4\\pi\\varepsilon_0}\\frac{\\lambda dx}{x^2}\\), \\(\\int_a^{a+L}\\) → \\[E=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{a(a+L)}\\] 검산: \\(a\\gg L\\)이면 점전하 \\(q/a^2\\)로 돌아간다.</p></div><div class=\"concept\"><p><b>⑤ 원형 도선</b>(반지름 R, 축에서 z): \\(dq=\\lambda ds\\), 정반대편 조각과 수평 성분이 상쇄되어 <b>z 성분만</b> 남는다. \\(\\cos\\theta=z/\\sqrt{z^2+R^2}\\), \\(\\int_0^{2\\pi R}ds\\) → \\[E_z=\\frac{1}{4\\pi\\varepsilon_0}\\frac{qz}{(z^2+R^2)^{3/2}}\\]</p></div>", "exam": []}, {"id": "p2-concept-4", "type": "concept", "part": 2, "title": "분포가 불연속이면 Σ, 연속이면 ∫ — 대칭성으로 성분을 죽인다 (4/4)", "html": "<div class=\"concept\"><p><b>⑥ 원판</b>(반지름 R, 면밀도 σ) = 원형 도선을 \\(0\\to R\\) 적분: \\(dq=\\sigma\\,2\\pi r\\,dr\\), 치환 \\(A^2=r^2+z^2\\) → \\[E=\\frac{\\sigma}{2\\varepsilon_0}\\Big(1-\\frac{z}{\\sqrt{z^2+R^2}}\\Big)\\] <b>무한 평면</b>(\\(R\\to\\infty\\)): \\(E=\\sigma/2\\varepsilon_0\\) — 거리 z와 무관.</p></div><div class=\"one\">한 줄: 점전하는 벡터식 q r⃗/r³, 연속 분포는 dq → dE → 대칭 → ∫. 원판 R→∞ = σ/2ε₀.</div>\n  ", "exam": []}, {"id": "p2-mu", "type": "mu", "part": 2, "title": "22장 전기장 계산 — 불연속(Σ) · 연속(∫) 6종 ★★", "mem": ["\\(\\vec E=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r^3}\\vec r\\) (벡터 꼴)", "원형 도선 \\(E_z=\\frac{1}{4\\pi\\varepsilon_0}\\frac{qz}{(z^2+R^2)^{3/2}}\\) · 원판 \\(\\frac{\\sigma}{2\\varepsilon_0}(1-\\frac{z}{\\sqrt{z^2+R^2}})\\) · 무한 평면 \\(\\sigma/2\\varepsilon_0\\)", "쌍극자 축: \\(\\propto1/z^3\\)"], "und": ["원형 도선에서 수평 성분이 사라지는 대칭 논증", "원판 = 고리를 쌓은 것, 치환 \\(A^2=r^2+z^2\\)의 구간 변화", "직선 도선 극한 \\(a\\gg L\\)이 점전하로 돌아가는 검산"]}, {"id": "p2-b1", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-1 · 점전하 벡터식", "html": "<p>점전하 \\(q\\)에서 위치벡터 \\(\\vec r\\)만큼 떨어진 점의 전기장으로 옳은 것은?</p>", "ans": "\\(\\hat r=\\vec r/r\\)이므로 \\(\\frac{q}{r^2}\\hat r=\\frac{q}{r^3}\\vec r\\). \\(\\frac{q}{r^2}\\vec r\\)은 차원이 틀리다.", "choices": [{"html": "\\(\\vec E=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q}{r^3}\\vec r\\)", "ok": true}, {"html": "\\(\\vec E=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q}{r^2}\\vec r\\)", "ok": false}, {"html": "\\(\\vec E=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q}{r}\\hat r\\)", "ok": false}, {"html": "\\(\\vec E=\\dfrac{q}{\\varepsilon_0 r^2}\\hat r\\)", "ok": false}], "exam": []}, {"id": "p2-b2", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-2 · 원형 도선의 대칭", "html": "<p>균일하게 대전된 원형 고리의 중심축에서 전기장을 구할 때 살아남는 성분과 그 이유는?</p>", "ans": "\"가운데를 중심으로 정반대쪽에 똑같은 게 또 하나 있다\" → 수평 성분 상쇄, \\(dE_z=dE\\cos\\theta\\)만 한 바퀴 적분.", "choices": [{"html": "축(z) 성분만 — 정반대편 조각의 수평 성분이 서로 상쇄", "ok": true}, {"html": "수평 성분만 — 축 성분이 상쇄", "ok": false}, {"html": "모든 성분 — 상쇄되는 것이 없다", "ok": false}, {"html": "아무 성분도 없다 — 고리 축에서는 항상 0", "ok": false}], "exam": []}, {"id": "p2-b3", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-3 · 무한 평면", "html": "<p>면전하밀도 \\(\\sigma\\)인 무한 평면에서 거리 z인 점의 전기장은?</p>", "ans": "원판 결과에서 \\(R\\to\\infty\\) → 둘째 항이 0 → \\(\\sigma/2\\varepsilon_0\\). (도체 표면 한쪽만 볼 때의 \\(\\sigma/\\varepsilon_0\\)와 구별 — 23장.)", "choices": [{"html": "\\(\\sigma/2\\varepsilon_0\\), z와 무관", "ok": true}, {"html": "\\(\\sigma/\\varepsilon_0\\), z와 무관", "ok": false}, {"html": "\\(\\sigma/(2\\varepsilon_0 z^2)\\)", "ok": false}, {"html": "\\(\\sigma/(2\\varepsilon_0 z)\\)", "ok": false}], "exam": []}, {"id": "p2-b4", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-4 · 직선 도선의 극한", "html": "<p>길이 L, 전하 q인 직선 도선의 연장선에서 끝으로부터 a 떨어진 점의 전기장 \\(E=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{a(a+L)}\\)에서 \\(a\\gg L\\)이면 어떻게 되는가?</p>", "ans": "\\(a+L\\approx a\\) → \\(q/a^2\\). 멀리서 보면 도선도 점전하 — 유도 결과의 검산 방법.", "choices": [{"html": "\\(\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{a^2}\\) — 점전하와 같아진다", "ok": true}, {"html": "\\(\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{aL}\\)", "ok": false}, {"html": "0", "ok": false}, {"html": "\\(\\frac{\\lambda}{2\\pi\\varepsilon_0 a}\\)", "ok": false}], "exam": []}, {"id": "p2-b5", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-5 · 쌍극자", "html": "<p>전기 쌍극자의 축에서 멀리(\\(z\\gg d\\)) 떨어진 점의 전기장 크기는 거리 z에 대해 어떻게 변하는가?</p>", "ans": "\\(E=\\frac{1}{4\\pi\\varepsilon_0}\\big[\\frac{q}{(z-d/2)^2}-\\frac{q}{(z+d/2)^2}\\big]\\approx\\frac{1}{4\\pi\\varepsilon_0}\\frac{2qd}{z^3}\\). ±q가 멀리서 상쇄되어 점전하(\\(1/z^2\\))보다 빨리 줄어든다.", "choices": [{"html": "\\(1/z^3\\)에 비례", "ok": true}, {"html": "\\(1/z^2\\)에 비례", "ok": false}, {"html": "\\(1/z\\)에 비례", "ok": false}, {"html": "z와 무관", "ok": false}], "exam": []}, {"id": "p2-a6", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-1 · 점전하군 (강의노트 필수문제 1)", "html": "<p>\\(q_1=20\\) C이 원점, \\(q_2=-3\\) C이 \\((4,0)\\) m, \\(q_3=-4\\) C이 \\((0,3)\\) m에 있다. \\(q_1\\)이 받는 알짜 힘 \\(\\vec F\\)를 \\(k=1/4\\pi\\varepsilon_0\\)로 나타내라.</p>", "ans": "\\(q_2\\)의 힘: 인력, \\(+x\\) 방향, 크기 \\(k\\cdot60/16=\\frac{15}{4}k\\). \\(q_3\\)의 힘: 인력, \\(+y\\) 방향, 크기 \\(k\\cdot80/9\\). \\(\\vec F=k\\big(\\tfrac{15}{4}\\hat i+\\tfrac{80}{9}\\hat j\\big)\\) N. 벡터로 더한다(크기 합 ✗).", "choices": null, "exam": []}, {"id": "p2-a7", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-2 · 원판 → 무한 평면", "html": "<p>반지름 R, 면밀도 σ인 원판의 축에서 거리 z인 점의 전기장이 \\(E=\\frac{\\sigma}{2\\varepsilon_0}\\big(1-\\frac{z}{\\sqrt{z^2+R^2}}\\big)\\)이다. 이 식을 얻는 수순(치환 포함)을 쓰고, \\(R\\to\\infty\\)일 때의 결과와 물리적 의미를 쓰라.</p>", "ans": "고리 띠 \\(dq=\\sigma\\,2\\pi r\\,dr\\) → \\(dE_z=\\frac{1}{4\\pi\\varepsilon_0}\\frac{\\sigma 2\\pi r dr}{r^2+z^2}\\cdot\\frac{z}{\\sqrt{r^2+z^2}}=\\frac{\\sigma z}{2\\varepsilon_0}\\frac{r\\,dr}{(r^2+z^2)^{3/2}}\\). 치환 \\(A^2=r^2+z^2\\), \\(A\\,dA=r\\,dr\\), 구간 \\(z\\to\\sqrt{z^2+R^2}\\) → \\(\\frac{\\sigma z}{2\\varepsilon_0}\\big[\\frac1z-\\frac{1}{\\sqrt{z^2+R^2}}\\big]\\). \\(R\\to\\infty\\): \\(E=\\sigma/2\\varepsilon_0\\) — 무한 평면의 장은 거리와 무관(전기력선이 평행).", "choices": null, "exam": []}, {"id": "p2-result", "type": "result", "part": 2, "title": "22장 전기장 계산 — 불연속(Σ) · 연속(∫) 6종 ★★"}, {"id": "p3-cover", "type": "cover", "part": 3, "no": "파트 3 · 9/11·9/16", "title": "23장 가우스 법칙 — 가우스면 3종 · 도체구 · 부도체구 ★★", "star": true}, {"id": "p3-concept", "type": "concept", "part": 3, "title": "가상의 폐곡면에 전기력선을 세면 전기장이 나온다 (1/3)", "html": "<div class=\"why\">가우스 법칙은 전기장을 <b>대칭성으로 쉽게</b> 구하는 법칙이다. 실질적으로는 알짜전하를 세는 것. 축구공 비유: 중심의 +1 C이 전기력선 N개를 뿜고, 공 표면의 미소면적 da마다 법선벡터 \\(\\hat n\\)이 하나 — 전기력선과 법선벡터는 <b>평행</b>.</div>\n  ", "exam": [{"level": "필수", "when": "9/16 19:09·42:24", "quote": "\"도체구와 부도체구 응용 — 시험 문제는 이거에서 산수 계산하는 거에서 많이 나와요. 이 앞에서 했던 건 안 나와\" · 교재 670쪽 연습문제 + 강의노트 범위별 전기장 \"100% 시험 문제\""}, {"level": "개념", "when": "9/16 38:18", "quote": "\"가우스 법칙에서 나오는 값은 전부 스칼라\""}]}, {"id": "p3-concept-2", "type": "concept", "part": 3, "title": "가상의 폐곡면에 전기력선을 세면 전기장이 나온다 (2/3)", "html": "<div class=\"concept\"><p><b>정의</b> \\[\\oint\\vec E\\cdot\\hat n\\,da=\\frac{q_{enc}}{\\varepsilon_0}\\] 평행 → \\(\\vec E\\cdot\\hat n=E\\) → \\(E\\oint da=q/\\varepsilon_0\\). 결과는 스칼라.</p></div><div class=\"concept\"><p><b>가우스면은 딱 3개</b>(표면적을 쉽게 구할 수 있는 것만): 면 \\(A\\) · 원통 <b>옆면만</b> \\(2\\pi rL\\) · 구 \\(4\\pi r^2\\).</p></div><div class=\"concept\"><p><b>재유도</b>: 무한 평면 — 전기력선이 양쪽으로 나가므로 \\(2A\\): \\(E\\cdot2A=q/\\varepsilon_0\\) → \\(E=\\sigma/2\\varepsilon_0\\) ✓. 직선 도선 — 원통: \\(E\\cdot2\\pi rL=q/\\varepsilon_0\\) → \\(E=\\lambda/(2\\pi\\varepsilon_0 r)\\). 도체 표면 한쪽만이면 \\(EA=q/\\varepsilon_0\\) → \\(\\sigma/\\varepsilon_0\\).</p></div><div class=\"concept\"><p><b>도체구</b>(고립도체, 전하는 표면에만): \\(r&lt;R\\) 내부 <b>\\(E=0\\)</b> · \\(r\\ge R\\) \\(E=\\dfrac{q}{4\\pi\\varepsilon_0 r^2}\\)(점전하와 같다).</p></div>", "exam": []}, {"id": "p3-concept-3", "type": "concept", "part": 3, "title": "가상의 폐곡면에 전기력선을 세면 전기장이 나온다 (3/3)", "html": "<div class=\"concept\"><p><b>부도체구</b>(전하 q가 부피에 균일): 외부 \\(E=\\dfrac{q}{4\\pi\\varepsilon_0 r^2}\\) · 내부는 가우스면 안 전하 \\(q'=\\dfrac{r^3}{R^3}q\\)만 → \\[E_{in}=\\frac{q\\,r}{4\\pi\\varepsilon_0R^3}\\quad(r\\text{에 비례})\\] E–r 그래프: 내부 직선 증가, r=R에서 꺾여 \\(1/r^2\\) 감소.</p></div><div class=\"concept\"><p><b>범위별 문제</b>(교재 31번·강의노트 필수문제): 부도체구 + 동심 도체 껍질. 영역마다 \\(q_{enc}\\)가 달라진다 — 껍질 안쪽 표면에는 안의 전하와 반대 부호가 유도되고, 도체 내부는 0.</p></div><div class=\"one\">한 줄: ∮E·n da = q/ε₀, 가우스면은 면·원통(옆면)·구뿐. 도체구 안 0, 부도체구 안 ∝ r, 밖은 둘 다 q/4πε₀r².</div>\n  ", "exam": []}, {"id": "p3-mu", "type": "mu", "part": 3, "title": "23장 가우스 법칙 — 가우스면 3종 · 도체구 · 부도체구 ★★", "mem": ["\\(\\oint\\vec E\\cdot\\hat n\\,da=q_{enc}/\\varepsilon_0\\)", "넓이: 면 \\(A\\) · 원통 \\(2\\pi rL\\) · 구 \\(4\\pi r^2\\) · 무한 평면은 \\(2A\\)", "도체구 안 \\(E=0\\) · 부도체구 안 \\(E=\\frac{qr}{4\\pi\\varepsilon_0R^3}\\) · 밖 \\(\\frac{q}{4\\pi\\varepsilon_0r^2}\\)"], "und": ["법선벡터와 전기력선이 평행이라 내적이 그냥 E가 되는 것", "부도체구 내부에서 \\(q'=(r^3/R^3)q\\)가 되는 이유(밀도 일정)", "도체의 전하가 표면에만 있는 이유(자유전자, 고립도체)"]}, {"id": "p3-b1", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-1 · 가우스 법칙", "html": "<p>가우스 법칙으로 옳은 것은?</p>", "ans": "폐곡면(가우스면)에 대한 면적분 = 안의 알짜전하/ε₀. 선적분 \\(\\int\\vec E\\cdot d\\vec r\\)은 전위(24장).", "choices": [{"html": "\\(\\oint\\vec E\\cdot\\hat n\\,da=q_{enc}/\\varepsilon_0\\)", "ok": true}, {"html": "\\(\\oint\\vec E\\cdot\\hat n\\,da=\\varepsilon_0 q_{enc}\\)", "ok": false}, {"html": "\\(\\oint\\vec E\\,da=q_{enc}\\)", "ok": false}, {"html": "\\(\\int\\vec E\\cdot d\\vec r=q_{enc}/\\varepsilon_0\\)", "ok": false}], "exam": []}, {"id": "p3-b2", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-2 · 가우스면 3종", "html": "<p>교수님이 \"이것뿐\"이라고 한 가우스면 3종과 그 넓이는?</p>", "ans": "원통은 <b>옆면만</b>(윗면·아랫면은 전기력선과 평행이라 기여 0). 구는 표면적 \\(4\\pi r^2\\)(부피 \\(\\frac43\\pi r^3\\) 아님).", "choices": [{"html": "면 \\(A\\) · 원통 옆면 \\(2\\pi rL\\) · 구 \\(4\\pi r^2\\)", "ok": true}, {"html": "면 \\(A\\) · 원통 \\(2\\pi r^2+2\\pi rL\\) · 구 \\(4\\pi r^2\\)", "ok": false}, {"html": "정육면체 \\(6a^2\\) · 원통 \\(2\\pi rL\\) · 구 \\(4\\pi r^2\\)", "ok": false}, {"html": "면 \\(A\\) · 원뿔 · 구 \\(\\frac43\\pi r^3\\)", "ok": false}], "exam": []}, {"id": "p3-b3", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-3 · 도체구 내부", "html": "<p>반지름 R, 전하 q인 도체구의 내부(\\(r&lt;R\\))에서 전기장 E는?</p>", "ans": "고립도체의 전하는 표면에만 → 내부 가우스면 안 \\(q_{enc}=0\\) → \\(E=0\\). 외부는 점전하와 같다.", "choices": [{"html": "0 — 전하가 표면에만 있어 가우스면 안 전하가 없다", "ok": true}, {"html": "\\(q/(4\\pi\\varepsilon_0 r^2)\\)", "ok": false}, {"html": "\\(qr/(4\\pi\\varepsilon_0 R^3)\\)", "ok": false}, {"html": "\\(q/(4\\pi\\varepsilon_0 R^2)\\), 일정", "ok": false}], "exam": []}, {"id": "p3-b4", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-4 · 부도체구 내부", "html": "<p>반지름 R에 전하 q가 <b>균일하게</b> 퍼진 부도체구의 내부(\\(r&lt;R\\))에서 전기장 E는?</p>", "ans": "가우스면(반지름 r) 안 전하 \\(q'=\\frac{r^3}{R^3}q\\) → \\(E\\cdot4\\pi r^2=q'/\\varepsilon_0\\) → \\(E=\\frac{qr}{4\\pi\\varepsilon_0R^3}\\). 그래프는 원점에서 직선으로 올라가 r=R에서 꺾인다.", "choices": [{"html": "\\(\\dfrac{qr}{4\\pi\\varepsilon_0R^3}\\) — r에 비례", "ok": true}, {"html": "0", "ok": false}, {"html": "\\(\\dfrac{q}{4\\pi\\varepsilon_0 r^2}\\)", "ok": false}, {"html": "\\(\\dfrac{q}{4\\pi\\varepsilon_0 R^2}\\), 일정", "ok": false}], "exam": []}, {"id": "p3-b5", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-5 · 무한 평면에 2A", "html": "<p>무한 평면(부도체, 면밀도 σ)에 가우스 법칙을 쓸 때 넓이를 \\(2A\\)로 잡는 이유는?</p>", "ans": "\\(E\\cdot2A=q/\\varepsilon_0\\) → \\(E=q/(2\\varepsilon_0A)=\\sigma/2\\varepsilon_0\\) — 22장 원판 \\(R\\to\\infty\\) 결과와 일치. 도체 표면 한쪽만 보면 \\(EA=q/\\varepsilon_0\\) → \\(\\sigma/\\varepsilon_0\\).", "choices": [{"html": "전기력선이 평면 양쪽으로 나가므로 가우스면(앞·뒤 두 장)을 모두 지난다", "ok": true}, {"html": "평면이 두 장이기 때문", "ok": false}, {"html": "전하가 두 배이기 때문", "ok": false}, {"html": "원판 공식의 2를 맞추기 위한 약속", "ok": false}], "exam": []}, {"id": "p3-a6", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-1 · 부도체구 + 도체 껍질 (교재 23장 31번 유형, \"100% 출제\")", "html": "<p>반지름 a인 부도체 공에 전하 \\(+q\\)가 균일하게 분포하고, 안쪽 반지름 \\(2a\\)·바깥 반지름 \\(2.4a\\)인 동심 도체 껍질의 알짜전하가 \\(-q\\)이다. (a) \\(r=a/2\\) (b) \\(r=1.5a\\) (c) \\(r=2.3a\\) (d) \\(r=3.5a\\)에서 전기장 E의 크기와, (e) 껍질 안쪽 표면 (f) 바깥쪽 표면의 전하를 구하라.</p>", "ans": "(a) 부도체 내부: \\(E=\\frac{q(a/2)}{4\\pi\\varepsilon_0a^3}=\\frac{q}{8\\pi\\varepsilon_0a^2}\\). (b) \\(a\\le r<2a\\): \\(E=\\frac{q}{4\\pi\\varepsilon_0(1.5a)^2}=\\frac{q}{9\\pi\\varepsilon_0a^2}\\). (c) 도체 내부: \\(E=0\\). (d) \\(q_{enc}=q-q=0\\) → \\(E=0\\). (e) 도체 내부 \\(E=0\\)이 되려면 안쪽 표면에 \\(-q\\). (f) 알짜 \\(-q\\) 중 \\(-q\\)가 안쪽에 갔으므로 바깥 표면은 \\(0\\). 영역마다 \\(q_{enc}\\)를 다시 센다.", "choices": null, "exam": []}, {"id": "p3-a7", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-2 · 직선 도선을 가우스 법칙으로", "html": "<p>선전하밀도 λ인 무한 직선 도선에서 거리 r인 점의 전기장 E를 가우스 법칙(원통 가우스면, 길이 L)으로 유도하라.</p>", "ans": "원통 옆면에서 \\(\\vec E\\parallel\\hat n\\), 윗면·아랫면은 기여 0. \\(E\\cdot2\\pi rL=\\frac{\\lambda L}{\\varepsilon_0}\\) → \\(E=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}\\). 22장의 적분 결과와 같다 — 대칭이 있으면 가우스 법칙이 훨씬 빠르다.", "choices": null, "exam": []}, {"id": "p3-result", "type": "result", "part": 3, "title": "23장 가우스 법칙 — 가우스면 3종 · 도체구 · 부도체구 ★★"}, {"id": "p4-cover", "type": "cover", "part": 4, "no": "파트 4 · 9/18", "title": "24장 전기 퍼텐셜(전위) — 점전하 · 여러 점전하 · 증명 3제 ★★", "star": true}, {"id": "p4-exam-1", "type": "concept", "part": 4, "title": "시험 언급 (1/2)", "html": "", "exam": [{"level": "필수", "when": "9/18 27:00·29:23", "quote": "\"세 개(쌍극자·직선 도선·원판 전위) 중 하나가 20점짜리 문제. 전부 증명하고 물리적 의미까지\" — 아토 손메모 「3중 1개 나옴」"}, {"level": "강조", "when": "9/18 12:43", "quote": "여러 점전하의 전위 \\(V=\\frac{1}{4\\pi\\varepsilon_0}\\sum q_i/r_i\\) — \"시험 문제 많이 나오는 놈. 내겠다는 얘기\" — 아토 손메모 「시험문제 출제」"}]}, {"id": "p4-exam-2", "type": "concept", "part": 4, "title": "시험 언급 (2/2)", "html": "", "exam": [{"level": "공식 제공", "when": "9/18 19:03", "quote": "직선 도선 적분 \\(\\int dx/\\sqrt{x^2+a^2}=\\ln(x+\\sqrt{x^2+a^2})\\)은 시험지에 준다"}]}, {"id": "p4-concept", "type": "concept", "part": 4, "title": "무한대로 보내서 가져온 일 = 전위. 스칼라라서 그냥 더한다 (1/3)", "html": "<div class=\"why\">중력 위치 에너지(13장)와 같은 틀. 다른 점 하나 — 중력은 안쪽으로 당기지만 같은 부호 전하는 밖으로 민다. 전위는 <b>스칼라</b>라 전기장(벡터)보다 계산이 쉽고, 25장 축전기의 부품이다.</div>\n  <div class=\"concept\"><p><b>전기 위치 에너지</b>: 점전하 q에서 거리 r에 시험전하 \\(q_0\\). \\(W=\\int_r^\\infty\\frac{1}{4\\pi\\varepsilon_0}\\frac{q_0q}{r^2}dr=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q_0q}{r}=-\\Delta U\\), \\(U(\\infty)=0\\) → \\[U(r)=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q_0q}{r}\\ [\\mathrm J]\\]</p></div><div class=\"concept\"><p><b>전위</b> \\(V=U/q_0\\): \\[V(r)=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r}\\ [\\mathrm{J/C=V}]\\] 실질적으로는 전위<b>차</b>. \\(\\Delta V=-\\int_i^f\\vec E\\cdot d\\vec r\\).</p></div><div class=\"concept\"><p><b>여러 점전하</b>: \\(V=\\dfrac{1}{4\\pi\\varepsilon_0}\\sum_i\\dfrac{q_i}{r_i}\\) — <span class=\"red\">단위벡터를 붙이면 안 된다</span>, 방향 없는 스칼라 합(부호 포함).</p></div>", "exam": []}, {"id": "p4-concept-2", "type": "concept", "part": 4, "title": "무한대로 보내서 가져온 일 = 전위. 스칼라라서 그냥 더한다 (2/3)", "html": "<div class=\"concept\"><p><b>쌍극자</b>(증명 1): \\(V=V_++V_-=\\frac{q}{4\\pi\\varepsilon_0}\\frac{r_--r_+}{r_+r_-}\\). 핵심 — 삼각형이 이등변이라 정확히 수직이 아니므로 \\(r\\gg d\\) 근사: \\(r_+r_-\\approx r^2\\), \\(r_--r_+\\approx d\\cos\\theta\\) → \\[V=\\frac{1}{4\\pi\\varepsilon_0}\\frac{p\\cos\\theta}{r^2},\\quad p=qd\\]</p></div><div class=\"concept\"><p><b>직선 도선</b>(증명 2, 도선을 x축 0~L, 점은 수직거리 a): \\(dV=\\frac{1}{4\\pi\\varepsilon_0}\\frac{\\lambda dx}{\\sqrt{x^2+a^2}}\\) → \\[V=\\frac{\\lambda}{4\\pi\\varepsilon_0}\\ln\\frac{L+\\sqrt{L^2+a^2}}{a}\\]</p></div><div class=\"concept\"><p><b>원형 도선</b>(교재에 없음): 모든 dq까지 거리가 같아 \\(V=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q}{\\sqrt{z^2+R^2}}\\) — 점전하 꼴(r² 아님).</p></div>", "exam": []}, {"id": "p4-concept-3", "type": "concept", "part": 4, "title": "무한대로 보내서 가져온 일 = 전위. 스칼라라서 그냥 더한다 (3/3)", "html": "<div class=\"concept\"><p><b>원판</b>(증명 3): \\(dq=\\sigma2\\pi r dr\\), \\(u=\\sqrt{z^2+r^2}\\), 치환 \\(a^2=z^2+r^2\\) → \\[V=\\frac{\\sigma}{2\\varepsilon_0}\\big(\\sqrt{z^2+R^2}-z\\big)\\] 물리적 의미: \\(R\\to\\infty\\) 무한 평면이면 \\(E=\\sigma/2\\varepsilon_0\\)(가우스 법칙과 연결) — 시험에 같이 쓴다.</p></div><div class=\"one\">한 줄: V = (1/4πε₀)q/r [V], 여러 점전하는 스칼라 합. 증명 3제(쌍극자 p cosθ/r² · 직선 ln · 원판 √−z) 중 1문제 20점.</div>\n  ", "exam": []}, {"id": "p4-mu", "type": "mu", "part": 4, "title": "24장 전기 퍼텐셜(전위) — 점전하 · 여러 점전하 · 증명 3제 ★★", "mem": ["\\(V=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r}\\), \\(U=q_0V\\), 단위 V = J/C", "\\(V=\\frac{1}{4\\pi\\varepsilon_0}\\sum q_i/r_i\\) (단위벡터 ✗)", "증명 3제 결과: 쌍극자 \\(\\frac{p\\cos\\theta}{4\\pi\\varepsilon_0r^2}\\) · 직선 \\(\\frac{\\lambda}{4\\pi\\varepsilon_0}\\ln\\frac{L+\\sqrt{L^2+a^2}}{a}\\) · 원판 \\(\\frac{\\sigma}{2\\varepsilon_0}(\\sqrt{z^2+R^2}-z)\\)", "\\(\\Delta V=-\\int\\vec E\\cdot d\\vec r\\)"], "und": ["쌍극자 증명의 핵심 — 이등변이라 수직이 아니어서 \\(r\\gg d\\) 근사가 필요한 것", "원형 도선의 전위가 점전하 꼴인 이유(거리가 전부 같고 스칼라라 상쇄가 없다)", "원판 전위 \\(R\\to\\infty\\)와 무한 평면 전기장의 연결"]}, {"id": "p4-b1", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-1 · 전위의 단위", "html": "<p>전위 V의 단위로 옳은 것은?</p>", "ans": "\\(V=U/q_0\\) → J/C = 볼트. N/C은 전기장, C/V = F는 전기 용량.", "choices": [{"html": "J/C = V(볼트)", "ok": true}, {"html": "N/C", "ok": false}, {"html": "J·C", "ok": false}, {"html": "C/V", "ok": false}], "exam": []}, {"id": "p4-b2", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-2 · 여러 점전하", "html": "<p>여러 점전하가 만드는 전위를 구할 때 옳은 것은?</p>", "ans": "전위는 스칼라 — \"단위벡터 붙이면 안 된다\". \\(1/r_i^2\\)은 전기장. 음전하는 음의 전위로 더한다.", "choices": [{"html": "\\(V=\\frac{1}{4\\pi\\varepsilon_0}\\sum q_i/r_i\\) — 부호를 넣어 <b>스칼라</b>로 더한다", "ok": true}, {"html": "각 전하의 전위를 벡터로 더한다", "ok": false}, {"html": "\\(V=\\frac{1}{4\\pi\\varepsilon_0}\\sum q_i/r_i^2\\)", "ok": false}, {"html": "크기만 더하고 부호는 무시한다", "ok": false}], "exam": []}, {"id": "p4-b3", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-3 · 쌍극자 전위", "html": "<p>쌍극자 모멘트 p인 전기 쌍극자에서 \\(r\\gg d\\)인 점(축과 각 θ)의 전위는?</p>", "ans": "\\(V\\propto1/r^2\\)(전위), 축의 전기장은 \\(\\propto1/r^3\\)(22장) — 헷갈리기 쉬운 짝. \\(\\theta=90^\\circ\\)면 0.", "choices": [{"html": "\\(\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{p\\cos\\theta}{r^2}\\)", "ok": true}, {"html": "\\(\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{p\\cos\\theta}{r^3}\\)", "ok": false}, {"html": "\\(\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{p}{r}\\)", "ok": false}, {"html": "\\(\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{2p}{r^3}\\)", "ok": false}], "exam": []}, {"id": "p4-b4", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-4 · 원형 도선의 전위", "html": "<p>반지름 R, 전하 q인 원형 고리의 축에서 거리 z인 점의 전위 V는?</p>", "ans": "고리의 모든 dq에서 점까지 거리가 \\(\\sqrt{z^2+R^2}\\)로 같고 스칼라라 상쇄 없이 더한다 → 점전하 꼴. \\(\\frac{qz}{(z^2+R^2)^{3/2}}\\)은 전기장.", "choices": [{"html": "\\(\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q}{\\sqrt{z^2+R^2}}\\)", "ok": true}, {"html": "\\(\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{qz}{(z^2+R^2)^{3/2}}\\)", "ok": false}, {"html": "\\(\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q}{z^2+R^2}\\)", "ok": false}, {"html": "\\(\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q}{z}\\)", "ok": false}], "exam": []}, {"id": "p4-b5", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-5 · 증명 3제", "html": "<p>교수님이 \"셋 중 하나가 20점 주관식\"이라고 한 증명 3제는?</p>", "ans": "판서_8 「★전기쌍극자 / ★직선도선 / ★원판」 + 손메모 「3중 1개 나옴」. 과정을 쭉 쓰고 물리적 의미까지.", "choices": [{"html": "전기 쌍극자의 전위 · 직선 도선의 전위 · 원판의 전위", "ok": true}, {"html": "점전하의 전위 · 원형 도선의 전위 · 무한 평면의 전기장", "ok": false}, {"html": "가우스 법칙 · 쿨롱 법칙 · 전위 정의", "ok": false}, {"html": "평행판 · 원통형 · 구형 축전기", "ok": false}], "exam": []}, {"id": "p4-a6", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-1 · 전하 4개의 전위", "html": "<p>한 변 \\(a=0.10\\) m인 정사각형의 네 꼭짓점에 각각 \\(+2.0\\,\\mu\\)C이 있다. 정사각형 중심의 전위 V를 구하라. (\\(1/4\\pi\\varepsilon_0=9\\times10^9\\))</p>", "ans": "중심까지 거리 \\(r=a/\\sqrt2=0.0707\\) m(네 개 모두 같다). \\(V=4\\times\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r}=4\\times9\\times10^9\\times\\frac{2.0\\times10^{-6}}{0.0707}\\approx1.0\\times10^6\\) V. 스칼라 합이라 방향을 생각할 필요가 없다(전기장은 대칭으로 0).", "choices": null, "exam": []}, {"id": "p4-a7", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-2 · 증명 — 쌍극자의 전위", "html": "<p>\\(+q\\), \\(-q\\)가 거리 d로 놓인 쌍극자에서, 중심으로부터 거리 r(축과 각 θ)인 점 P의 전위 V가 \\(\\frac{1}{4\\pi\\varepsilon_0}\\frac{p\\cos\\theta}{r^2}\\)임을 증명하라(\\(r\\gg d\\), \\(p=qd\\)). 핵심 근사가 왜 필요한지도 쓰라.</p>", "ans": "겹침: \\(V=\\frac{q}{4\\pi\\varepsilon_0}\\big(\\frac{1}{r_+}-\\frac{1}{r_-}\\big)=\\frac{q}{4\\pi\\varepsilon_0}\\frac{r_--r_+}{r_+r_-}\\). +q에서 \\(r_-\\)에 수선을 내리면 거리 차가 \\(d\\cos\\theta\\)가 되어야 하지만 삼각형이 이등변이라 정확히 수직이 아니다 → \\(r\\gg d\\)에서 \\(r_--r_+\\approx d\\cos\\theta\\), \\(r_+r_-\\approx r^2\\). \\(V=\\frac{1}{4\\pi\\varepsilon_0}\\frac{qd\\cos\\theta}{r^2}=\\frac{1}{4\\pi\\varepsilon_0}\\frac{p\\cos\\theta}{r^2}\\). (교수: \"물리적 의미는 없다. 틀리면 절대 안 된다.\")", "choices": null, "exam": []}, {"id": "p4-a8", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-3 · 증명 — 원판의 전위와 물리적 의미", "html": "<p>반지름 R, 면밀도 σ인 원판의 축에서 거리 z인 점의 전위 V를 유도하고, \\(E=-dV/dz\\)로 전기장을 구해 22장 결과와 비교하라. \\(R\\to\\infty\\)의 의미도 쓰라.</p>", "ans": "고리 띠 \\(dq=\\sigma2\\pi r dr\\), \\(dV=\\frac{1}{4\\pi\\varepsilon_0}\\frac{dq}{\\sqrt{z^2+r^2}}\\) → \\(V=\\frac{\\sigma}{2\\varepsilon_0}\\int_0^R\\frac{r dr}{\\sqrt{z^2+r^2}}\\), 치환 \\(a^2=z^2+r^2\\), \\(a\\,da=r\\,dr\\), 구간 \\(z\\to\\sqrt{z^2+R^2}\\) → \\(V=\\frac{\\sigma}{2\\varepsilon_0}(\\sqrt{z^2+R^2}-z)\\). \\(E=-\\frac{dV}{dz}=\\frac{\\sigma}{2\\varepsilon_0}\\big(1-\\frac{z}{\\sqrt{z^2+R^2}}\\big)\\) — 22장 원판 전기장과 일치. \\(R\\to\\infty\\): \\(E=\\sigma/2\\varepsilon_0\\) 무한 평면(가우스 법칙 2A와 연결).", "choices": null, "exam": []}, {"id": "p4-result", "type": "result", "part": 4, "title": "24장 전기 퍼텐셜(전위) — 점전하 · 여러 점전하 · 증명 3제 ★★"}, {"id": "p5-cover", "type": "cover", "part": 5, "no": "파트 5 · 9/18·9/23", "title": "25장 전기 용량 — 축전기 3종 · 고립 도체구 · 유전체 ★", "star": true}, {"id": "p5-concept", "type": "concept", "part": 5, "title": "C = q/ΔV — 전하는 가우스 법칙으로, 전위차는 선적분으로 (1/3)", "html": "<div class=\"why\">축전기(C, 전기 에너지 저장) ↔ 유도기(L, 자기 에너지 저장, 기말). 전기 용량을 구하는 순서는 언제나 같다: ① 가우스 법칙으로 E ② \\(\\Delta V=-\\int E\\,dr\\) ③ \\(C=q/\\Delta V\\). 가우스면 3종이 곧 축전기 3종.</div>\n  <div class=\"concept\"><p><b>정의</b> \\(C=\\dfrac{q}{\\Delta V}\\) [C/V = F], <b>\\(1\\,\\mu\\mathrm F=10^{-6}\\) F</b>. 일반식 \\(C=\\dfrac{\\varepsilon_0\\oint\\vec E\\cdot\\hat n\\,da}{-\\int_i^f\\vec E\\cdot d\\vec r}\\).</p></div>", "exam": [{"level": "필수", "when": "9/18 36:52", "quote": "\"1 μF = 10⁻⁶ F — 정확히 기억해라\" · \"당장 시험이면 25장만 공부하면 된다 — 가우스 법칙도 전위 계산도 다 들어 있다\""}]}, {"id": "p5-concept-2", "type": "concept", "part": 5, "title": "C = q/ΔV — 전하는 가우스 법칙으로, 전위차는 선적분으로 (2/3)", "html": "<div class=\"concept\"><p><b>평행판</b>(넓이 A, 간격 d): \\(EA=q/\\varepsilon_0\\) → \\(E=\\sigma/\\varepsilon_0\\), \\(\\Delta V=Ed\\) → \\[C=\\varepsilon_0\\frac{A}{d}\\]</p></div><div class=\"concept\"><p><b>원통형</b>(길이 L, 안 a, 밖 b): \\(E\\cdot2\\pi rL=q/\\varepsilon_0\\), \\(\\Delta V=\\frac{q}{2\\pi\\varepsilon_0L}\\ln\\frac ba\\) → \\[C=\\frac{2\\pi\\varepsilon_0L}{\\ln(b/a)}\\]</p></div><div class=\"concept\"><p><b>구형</b>(안 a, 밖 b): \\(E=\\frac{q}{4\\pi\\varepsilon_0r^2}\\), \\(\\Delta V=\\frac{q}{4\\pi\\varepsilon_0}\\big(\\frac1a-\\frac1b\\big)\\) → \\[C=4\\pi\\varepsilon_0\\frac{ab}{b-a}\\] \\(b\\to\\infty\\): <b>고립 도체구</b> \\(C=4\\pi\\varepsilon_0a\\).</p></div>", "exam": []}, {"id": "p5-concept-3", "type": "concept", "part": 5, "title": "C = q/ΔV — 전하는 가우스 법칙으로, 전위차는 선적분으로 (3/3)", "html": "<div class=\"concept\"><p><b>유전체</b>(q 고정): 판 사이에 넣으면 분극으로 유도 전하 \\(\\mp q'\\)가 생겨 내부 장이 준다. \\(E=\\dfrac{q-q'}{\\varepsilon_0A}=\\dfrac{E_0}{\\kappa}\\), 유전 상수 \\(\\kappa=\\varepsilon/\\varepsilon_0&gt;1\\). \\(V=V_0/\\kappa\\), \\[C=\\kappa C_0,\\qquad q'=\\Big(1-\\frac1\\kappa\\Big)q\\]</p></div><div class=\"one\">한 줄: C = q/ΔV [F], 1 μF = 10⁻⁶ F. 평행판 ε₀A/d · 원통 2πε₀L/ln(b/a) · 구 4πε₀ab/(b−a) · 고립구 4πε₀a · 유전체 C = κC₀.</div>\n  ", "exam": []}, {"id": "p5-mu", "type": "mu", "part": 5, "title": "25장 전기 용량 — 축전기 3종 · 고립 도체구 · 유전체 ★", "mem": ["\\(C=q/\\Delta V\\), \\(1\\,\\mu F=10^{-6}\\) F", "축전기 3종 공식 + 고립 도체구 \\(4\\pi\\varepsilon_0a\\)", "유전체: \\(C=\\kappa C_0\\), \\(E=E_0/\\kappa\\), \\(q'=(1-1/\\kappa)q\\)"], "und": ["가우스면 3종 → 축전기 3종의 대응", "구형에서 \\(b\\to\\infty\\)가 고립 도체구가 되는 극한", "유전체를 넣으면 왜 E가 줄고 C가 느는지(유도 전하가 반대 방향 장을 만든다)"]}, {"id": "p5-b1", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-1 · 단위", "html": "<p>\\(1\\,\\mu\\)F는 몇 F인가?</p>", "ans": "μ(마이크로) = \\(10^{-6}\\). 교수가 \"제일 중요\"하다며 정확히 기억하라고 한 것.", "choices": [{"html": "\\(10^{-6}\\) F", "ok": true}, {"html": "\\(10^{-3}\\) F", "ok": false}, {"html": "\\(10^{-9}\\) F", "ok": false}, {"html": "\\(10^{6}\\) F", "ok": false}], "exam": []}, {"id": "p5-b2", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-2 · 평행판", "html": "<p>판 넓이 \\(A=0.010\\ \\mathrm{m^2}\\), 간격 \\(d=1.0\\) mm인 평행판 축전기의 전기 용량 C는? (\\(\\varepsilon_0=8.85\\times10^{-12}\\))</p>", "ans": "\\(C=\\varepsilon_0A/d=8.85\\times10^{-12}\\times0.010/0.0010=8.85\\times10^{-11}\\) F. mm를 m로 바꾸는 것을 잊지 말 것.", "choices": [{"html": "약 \\(8.9\\times10^{-11}\\) F (89 pF)", "ok": true}, {"html": "약 \\(8.9\\times10^{-14}\\) F", "ok": false}, {"html": "약 \\(8.9\\times10^{-8}\\) F", "ok": false}, {"html": "약 \\(1.1\\times10^{10}\\) F", "ok": false}], "exam": []}, {"id": "p5-b3", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-3 · 유전체", "html": "<p>전하 q를 고정한 평행판 축전기에 유전 상수 κ인 유전체를 채우면?</p>", "ans": "유도 전하 \\(-q'\\)가 판 전하와 반대 방향 장을 만들어 \\(E=(q-q')/\\varepsilon_0A=E_0/\\kappa\\), \\(V=V_0/\\kappa\\) → \\(C=q/V=\\kappa C_0\\).", "choices": [{"html": "전기장은 \\(E_0/\\kappa\\)로 줄고 전기 용량은 \\(\\kappa C_0\\)로 는다", "ok": true}, {"html": "전기장이 \\(\\kappa E_0\\)로 늘고 전기 용량은 \\(C_0/\\kappa\\)로 준다", "ok": false}, {"html": "전기장·전기 용량 모두 변하지 않는다", "ok": false}, {"html": "전하가 \\(\\kappa q\\)로 는다", "ok": false}], "exam": []}, {"id": "p5-b4", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-4 · 고립 도체구", "html": "<p>반지름 a인 고립 도체구의 전기 용량 C는?</p>", "ans": "구형 축전기 \\(4\\pi\\varepsilon_0\\frac{ab}{b-a}=4\\pi\\varepsilon_0\\frac{a}{1-a/b}\\)에서 \\(b\\to\\infty\\) → \\(4\\pi\\varepsilon_0a\\). 단위 확인: F/m × m = F.", "choices": [{"html": "\\(4\\pi\\varepsilon_0a\\)", "ok": true}, {"html": "\\(4\\pi\\varepsilon_0a^2\\)", "ok": false}, {"html": "\\(\\varepsilon_0/a\\)", "ok": false}, {"html": "\\(2\\pi\\varepsilon_0a\\)", "ok": false}], "exam": []}, {"id": "p5-a5", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-1 · 원통형 축전기 유도", "html": "<p>길이 L, 안쪽 반지름 a, 바깥 반지름 b인 동축 원통 축전기(안쪽 +q)의 전기 용량 C를 유도하라.</p>", "ans": "① 가우스(원통 옆면): \\(E\\cdot2\\pi rL=q/\\varepsilon_0\\) → \\(E=\\frac{q}{2\\pi\\varepsilon_0L}\\frac1r\\). ② \\(\\Delta V=-\\int_b^a E\\,dr=\\frac{q}{2\\pi\\varepsilon_0L}\\ln\\frac ba\\). ③ \\(C=q/\\Delta V=\\dfrac{2\\pi\\varepsilon_0L}{\\ln(b/a)}\\). q가 약분되어 기하(L, a, b)만 남는다.", "choices": null, "exam": []}, {"id": "p5-a6", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-2 · 유도 전하", "html": "<p>전하 \\(q=6.0\\,\\mu\\)C으로 충전된 평행판 축전기에 \\(\\kappa=3\\)인 유전체를 채웠다. 유전체 표면의 유도 전하 \\(q'\\)와, 전기장이 원래의 몇 배가 되는지 구하라.</p>", "ans": "\\(q'=(1-\\frac1\\kappa)q=(1-\\frac13)\\times6.0=4.0\\,\\mu\\)C. 전기장 \\(E=E_0/\\kappa\\) → 원래의 \\(1/3\\). 내부 장은 \\((q-q')/\\varepsilon_0A=2.0\\,\\mu\\mathrm C/\\varepsilon_0A\\)로도 확인된다.", "choices": null, "exam": []}, {"id": "p5-result", "type": "result", "part": 5, "title": "25장 전기 용량 — 축전기 3종 · 고립 도체구 · 유전체 ★"}, {"id": "final", "type": "final"}];
const PARTS=[{"n": 1, "title": "21장 전하와 쿨롱 법칙 · 전기장의 정의 ★", "hint": "한 줄: q = ne, F = (1/4πε₀)qq'/r², E = 단위 양전하가 받는 힘, 밀도 기호 λ·σ·ρ."}, {"n": 2, "title": "22장 전기장 계산 — 불연속(Σ) · 연속(∫) 6종 ★★", "hint": "한 줄: 점전하는 벡터식 q r⃗/r³, 연속 분포는 dq → dE → 대칭 → ∫. 원판 R→∞ = σ/2ε₀."}, {"n": 3, "title": "23장 가우스 법칙 — 가우스면 3종 · 도체구 · 부도체구 ★★", "hint": "한 줄: ∮E·n da = q/ε₀, 가우스면은 면·원통(옆면)·구뿐. 도체구 안 0, 부도체구 안 ∝ r, 밖은 둘 다 q/4πε₀r²."}, {"n": 4, "title": "24장 전기 퍼텐셜(전위) — 점전하 · 여러 점전하 · 증명 3제 ★★", "hint": "한 줄: V = (1/4πε₀)q/r [V], 여러 점전하는 스칼라 합. 증명 3제(쌍극자 p cosθ/r² · 직선 ln · 원판 √−z) 중 1문제 20점."}, {"n": 5, "title": "25장 전기 용량 — 축전기 3종 · 고립 도체구 · 유전체 ★", "hint": "한 줄: C = q/ΔV [F], 1 μF = 10⁻⁶ F. 평행판 ε₀A/d · 원통 2πε₀L/ln(b/a) · 구 4πε₀ab/(b−a) · 고립구 4πε₀a · 유전체 C = κC₀."}];
/* V6E-QUIZ: #quiz 로 열면 문제 장만(시작·전체 결과 포함). 저장 키를 분리하고 이어서-학습 위치는 건드리지 않는다 (대표님 2026-09-24 시험 대비) */

}

function partScore(p){ ST.skip=ST.skip||{}; const qs=SLIDES.filter(s=>s.type==="q"&&s.part===p&&!ST.skip[s.id]); const b=qs.filter(q=>q.kind==="기초"), a=qs.filter(q=>q.kind==="응용");
  const cnt=arr=>({n:arr.length,ok:arr.filter(q=>ST.correct[q.id]===true).length,done:arr.filter(q=>ST.done[q.id]).length});
  return {b:cnt(b),a:cnt(a)}; }

/* ---------- 수식: KaTeX (지침 §1). 렌더 끝나기 전엔 작업 영역을 감춘다(§0 raw LaTeX 노출 금지) ---------- */
function typeset(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true},{left:"$$",right:"$$",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  }
  const cl=el.cloneNode(true); cl.querySelectorAll(".katex,.katex-display").forEach(k=>k.remove());
  const raw=/\\\(|\\\[|\\frac|\\vec|\\begin\{|\$\$/.test(cl.textContent||"");
  el.dataset.raw=raw?"1":"0";
  if(raw&&el.id==="body"){ el.dataset.ready="false"; el.innerHTML='<div class="kicker">수식 오류</div><h2>이 장의 수식이 그대로 드러나 표시를 멈췄습니다</h2><p>정리노트의 수식 표기를 고쳐 다시 만들어야 합니다.</p>'; }
  el.dataset.ready="true";
  return !raw;
}

/* ---------- 풀이 메모장 (손글씨 캔버스 · 애플펜슬) ---------- */
const PAD={tool:"pen",cv:null,ctx:null,id:null,cur:null,ro:null,dpr:1,W:0,H:0};
function padStrokes(id){ ST.ink=ST.ink||{}; if(!ST.ink[id]) ST.ink[id]={strokes:[]}; return ST.ink[id].strokes; }
function padResize(){ const cv=PAD.cv; if(!cv||!cv.isConnected) return; const r=cv.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  PAD.dpr=Math.min(3,window.devicePixelRatio||1); PAD.W=r.width; PAD.H=r.height; cv.width=Math.round(r.width*PAD.dpr); cv.height=Math.round(r.height*PAD.dpr);
  PAD.ctx=cv.getContext("2d"); PAD.ctx.setTransform(PAD.dpr,0,0,PAD.dpr,0,0); PAD.ctx.lineCap="round"; PAD.ctx.lineJoin="round"; padRedraw(); }
function padLine(ctx,t,x0,y0,x1,y1,p){ if(!ctx) return; const W=PAD.W; ctx.globalCompositeOperation=t==="e"?"destination-out":"source-over"; ctx.strokeStyle="#111111";
  ctx.lineWidth=t==="e"?W*0.03:Math.max(1.2,W*0.0035*(0.6+(p||0.5)*1.2)); ctx.beginPath(); ctx.moveTo(x0*W,y0*W); ctx.lineTo(x1*W,y1*W); ctx.stroke(); }
function padRedraw(){ const ctx=PAD.ctx; if(!ctx) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,PAD.cv.width,PAD.cv.height); ctx.restore();
  for(const st of padStrokes(PAD.id)){ const c=st.c; if(c.length<3) continue; if(c.length===3){ padLine(ctx,st.t,c[0],c[1],c[0]+0.0005,c[1],c[2]); continue; }
    for(let i=3;i<c.length;i+=3) padLine(ctx,st.t,c[i-3],c[i-2],c[i],c[i+1],c[i+2]); } }
function padPt(e){ const r=PAD.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/PAD.W*1000)/1000, Math.round((e.clientY-r.top)/PAD.W*1000)/1000, Math.round((e.pressure||0.5)*100)/100]; }
function padAllowed(e){ return e.pointerType==="pen"||e.pointerType==="mouse"||(e.pointerType==="touch"&&ST.finger); }
function mountPad(id){
  const cv=$("#pad"); if(!cv) return; PAD.cv=cv; PAD.id=id; PAD.cur=null;
  cv.onpointerdown=e=>{ if(!padAllowed(e)) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} const pt=padPt(e); PAD.cur={t:PAD.tool==="eraser"?"e":"p",c:pt.slice()}; padLine(PAD.ctx,PAD.cur.t,pt[0],pt[1],pt[0]+0.0005,pt[1],pt[2]); };
  cv.onpointermove=e=>{ if(!PAD.cur||!padAllowed(e)) return; e.preventDefault(); const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(const ev of evs){ const pt=padPt(ev), c=PAD.cur.c, n=c.length; padLine(PAD.ctx,PAD.cur.t,c[n-3],c[n-2],pt[0],pt[1],pt[2]); c.push(pt[0],pt[1],pt[2]); } };
  const end=()=>{ if(!PAD.cur) return; padStrokes(id).push(PAD.cur); PAD.cur=null; save(); };
  cv.onpointerup=end; cv.onpointercancel=end; cv.onpointerleave=e=>{ if(PAD.cur&&e.pointerType!=="pen") end(); };
  cv.oncontextmenu=e=>e.preventDefault();
  const bar=cv.previousElementSibling;
  bar.querySelectorAll("[data-tool]").forEach(b=>{ b.onclick=()=>{ PAD.tool=b.dataset.tool; bar.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b)); }; });
  bar.querySelector('[data-act="undo"]').onclick=()=>{ padStrokes(id).pop(); save(); padRedraw(); };
  bar.querySelector('[data-act="clear"]').onclick=()=>{ if(!padStrokes(id).length||confirm("이 문제의 풀이 메모를 지울까요?")){ ST.ink[id]={strokes:[]}; save(); padRedraw(); } };
  bar.querySelector('[data-act="finger"]').onclick=function(){ ST.finger=!ST.finger; save(); this.classList.toggle("on",ST.finger); };
  if(window.ResizeObserver){ PAD.ro=new ResizeObserver(()=>padResize()); PAD.ro.observe(cv); }
  setTimeout(padResize,30);
}

/* ---------- 시작 위치 점프 ---------- */
function startFrom(id,mode){
  const n=SLIDES.findIndex(x=>x.id===id); if(n<0) return;
  ST.skip=ST.skip||{}; mode=mode||"skip";
  if(mode!=="at") SLIDES.forEach((x,i)=>{ if(i<n&&x.type!=="start"&&x.type!=="jump"&&!ST.done[x.id]){ ST.done[x.id]=true; if(mode==="skip") ST.skip[x.id]=true; } });
  ST.idx=n; save(); render();
}
function unskipAll(){ ST.skip=ST.skip||{}; Object.keys(ST.skip).forEach(k=>{ delete ST.done[k]; }); ST.skip={}; save(); render(); }
function jumpListHTML(){
  ST.skip=ST.skip||{};
  const rows=[]; let cur=null;
  SLIDES.forEach((x,i)=>{
    if(x.type==="cover"){ cur={part:x.part,title:x.title,items:[]}; rows.push(cur); return; }
    if(!cur) return;
    if(x.type==="concept"||x.type==="mu"||x.type==="q"){
      const lab= x.type==="concept"?(x.title||"개념"): x.type==="mu"?"암기 vs 이해": x.qn;
      const st= ST.skip[x.id]?"skip": ST.done[x.id]?"done": (i===ST.idx?"cur":"");
      cur.items.push('<button class="jp '+st+'" data-jump="'+x.id+'">'+esc(lab)+'</button>');
    }
  });
  const nSkip=Object.keys(ST.skip).length;
  return '<div class="jump"><div class="jump-h">아는 부분은 건너뛰고 막히는 곳부터. 누른 장 앞은 전부 「건너뜀」이 되고 채점에서 빠진다.'+
    (nSkip?'<button class="btn xs" id="unskip">건너뜀 '+num(nSkip)+'장 되돌리기</button>':'')+'</div>'+
    rows.map(r=>'<div class="jump-part"><div class="jump-pt">파트 '+num(r.part)+' · '+esc(String(r.title).replace(/[\s★]+$/,""))+'</div><div class="jump-items">'+r.items.join("")+'</div></div>').join("")+'</div>';
}

    act.innerHTML='<button class="btn" id="ok">시작</button>'; $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };

    const sc=partScore(s.part);

    const wrong=qs.filter(q=>ST.correct[q.id]===false), left=qs.filter(q=>!ST.done[q.id]||ST.correct[q.id]==null&&!ST.revealed[q.id]);

      '<p class="rs-rule">통과 기준: '+esc(rule||'문제 없음')+' · 지금 '+(passB&&passA?'<b class="rs-pass">통과</b>':'<b class="rs-fail">미달</b>')+' (기초 '+sc.b.ok+'/'+sc.b.n+' · 응용 '+sc.a.ok+'/'+sc.a.n+')</p>'+
      (wrong.length?'<div class="rs-list"><div class="kicker">틀린 문제</div>'+wrong.map(q=>'<button class="rs-q" data-go="'+q.id+'"><span class="q-kind">'+esc(q.kind||"")+'</span>'+esc(q.qn||q.id)+'</button>').join("")+'</div>':'')+
      (left.length&&!wrong.length?'<div class="rs-list"><div class="kicker">안 푼 문제</div>'+left.map(q=>'<button class="rs-q" data-go="'+q.id+'"><span class="q-kind">'+esc(q.kind||"")+'</span>'+esc(q.qn||q.id)+'</button>').join("")+'</div>':'');
    body.querySelectorAll(".rs-q").forEach(b=>{ b.onclick=()=>startFrom(b.dataset.go,"at"); });
    const nextPart=PARTS.find(p=>p.n===s.part+1);
    let primary;
    if(wrong.length) primary='<button class="btn primary" id="rsGo">틀린 문제 복습</button>';
    else if(left.length) primary='<button class="btn primary" id="rsGo">안 푼 문제 풀기</button>';
    else primary='<button class="btn primary" id="rsGo">'+(nextPart?'다음 파트':'전체 결과')+'</button>';
    act.innerHTML='<button class="btn xs" id="back">이 파트 처음으로</button>'+(wrong.length&&left.length?'<button class="btn xs" id="rsLeft">안 푼 문제 '+left.length+'개</button>':'')+primary;
    $("#back").onclick=()=>{ ST.idx=SLIDES.findIndex(x=>x.id==="p"+s.part+"-cover"); save(); render(); };
    const rl=$("#rsLeft"); if(rl) rl.onclick=()=>startFrom(left[0].id,"at");
    $("#rsGo").onclick=()=>{ ST.done[s.id]=true; save();
      if(wrong.length){ wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; }); save(); startFrom(wrong[0].id,"at"); }
      else if(left.length) startFrom(left[0].id,"at");
      else go(1); };
  } else if(s.type==="final"){
    const qs=SLIDES.filter(x=>x.type==="q"&&!(ST.skip||{})[x.id]); const ok=qs.filter(q=>ST.correct[q.id]===true).length, done=qs.filter(q=>ST.done[q.id]).length;
    const wrong=SLIDES.filter(x=>x.type==="q"&&ST.correct[x.id]===false);
    body.innerHTML='<div class="kicker">전체 결과</div><h1>일반물리학2 · 중간고사 대비 (21 전하 · 22 전기장 · 23 가우스 · 24 전위 · 25 전기용량)</h1><div class="score"><div class="c"><b>'+ok+'/'+qs.length+'</b>정답 · 푼 문제 '+num(done)+'</div><div class="c"><b>'+wrong.length+'</b>틀린 문제</div></div>'+
      '<p>'+(wrong.length?'틀린 문제: '+wrong.slice(0,6).map(w=>esc(w.qn)).join(", ")+(wrong.length>6?' 외 '+num(wrong.length-6)+'개':''):'틀린 문제가 없습니다.')+'</p>';
    act.innerHTML='<button class="btn xs" id="retry"'+(wrong.length?"":" disabled")+'>틀린 문제만 다시</button><button class="btn xs" id="first">처음으로</button>';
    $("#retry").onclick=()=>{ if(!wrong.length) return; wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; }); ST.idx=SLIDES.indexOf(wrong[0]); save(); render(); };
    $("#first").onclick=()=>{ ST.idx=0; save(); render(); };
    ST.done[s.id]=true; save();
  }
  renderSrc(s);
  const h=hintFor(s); const hb=$("#hintBtn"); hb.disabled=!h; hb.title=h?"":"이 장에는 힌트가 없습니다";
  const nxt=$("#next"), prv=$("#prev");
  const unlocked=i<SLIDES.length-1;
  nxt.disabled=!unlocked; nxt.classList.toggle("undone",!ST.done[s.id]&&unlocked); prv.disabled=(i===0);
  typeset(body);
  body.scrollTop=0;
}
function go(d){ const n=ST.idx+d; if(n<0||n>=SLIDES.length) return; ST.idx=n; save(); render(); }
$("#next").onclick=()=>go(1); $("#prev").onclick=()=>go(-1);
$("#padBtn").onclick=()=>{ const s=SLIDES[ST.idx]; if(s.type!=="q") return; if($("#padPanel").classList.contains("on")) closePad(); else openPad(s.id); };
$("#hintBtn").onclick=()=>{ const s=SLIDES[ST.idx], h=hintFor(s); if(!h) return; const hb=$("#hintBox"); if(!hb.hidden){ hb.hidden=true; return; } hb.innerHTML='<div class="kicker">힌트 · 파트 '+num(s.part)+' 한 줄</div><div>'+esc(h)+'</div>'; hb.hidden=false; typeset(hb); };
document.addEventListener("keydown",e=>{ const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||(t&&t.isContentEditable)) return; if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); });

/* ---------- 검사 모드 (#check): 전 장을 돌며 오버플로·raw LaTeX를 잰다. 빌드 뒤 헤드리스로 캡처해 확인한다 ---------- */
async function runCheck(){
  try{ await document.fonts.ready; }catch(e){}
  const body=$("#body"); const fails=[]; const saved=JSON.stringify(ST);
  const foot=$("#foot"), stage=$("#stage");
  const measure=(tag)=>{ const over=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(body.scrollHeight>body.clientHeight||body.scrollWidth>body.clientWidth); const fo=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(foot.scrollWidth>foot.clientWidth||stage.scrollHeight>stage.clientHeight); const raw=body.dataset.raw==="1"; if(over||fo||raw) fails.push(SLIDES[ST.idx].id+tag+(over?" 넘침 "+body.scrollHeight+">"+body.clientHeight:"")+(fo?" 하단/무대 넘침":"")+(raw?" rawLaTeX":"")); };
  for(let i=0;i<SLIDES.length;i++){
    const s=SLIDES[i];
    ST.idx=i; delete ST.revealed[s.id]; render(); await new Promise(r=>setTimeout(r,20)); measure("");
    if(s.type==="q"){ /* 답 공개 상태 */ ST.revealed[s.id]=true; ST.answer[s.id]=Array.isArray(s.choices)&&s.choices.length?"0":"x"; ST.correct[s.id]=false; render(); await new Promise(r=>setTimeout(r,20)); measure(" [답공개]"); { const al=$("#anslb"); if(al&&al.classList.contains("on")){ const a=al.querySelector(".ans"); if(a&&(a.scrollHeight>a.clientHeight||al.scrollHeight>al.clientHeight)) fails.push(s.id+" [풀이판] 넘침 "+a.scrollHeight+">"+a.clientHeight); al.classList.remove("on"); } }
      /* 힌트 열림 */ $("#hintBtn").click(); await new Promise(r=>setTimeout(r,20)); const hb=$("#hintBox"); if(!hb.hidden&&hb.getBoundingClientRect().top<body.getBoundingClientRect().top) fails.push(s.id+" [힌트] 상단 침범"); hb.hidden=true; }
  }
  try{ ST=JSON.parse(saved); }catch(e){}
  const c=$("#chk"); c.style.display="block";
  c.innerHTML='<h2 id="chkTitle">검사: '+SLIDES.length+'장 · 실패 '+fails.length+'</h2><pre id="chkList">'+esc(fails.join("\n"))+'</pre>';
  window.CHECK_RESULT={n:SLIDES.length,fails};
}
/* V5B-CTX: 학습 질문 패널용 문맥 (아토 2026-09-21). 앱이 gen 을 주기 전엔 보내지 않는다 — 이전 창의 늦은 메시지를 앱이 gen 으로 걸러낸다 */
let CTX_GEN=null;
const ctxPlain=(h,n)=>{ const t=String(h||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim(); return t.length>n?t.slice(0,n)+"…(잘림)":t; };
function postCtx(){
  try{
    if(location.hash==="#check"||!CTX_GEN||window.parent===window) return;
    const s=SLIDES[Math.max(0,Math.min(ST.idx,SLIDES.length-1))]; if(!s) return;
    const p=s.part?PARTS.find(x=>x.n===s.part):null; const li=lastInfo()||{};
    const msg={type:"mc-slide",v:1,gen:CTX_GEN,deck:DECK_ID,title:String(document.title).slice(0,80),sid:s.id,stype:s.type,part:s.part||null,
      partTitle:p?String(p.title).replace(/[\s★]+$/,"").slice(0,60):"",label:String(li.where||"").slice(0,80),q:null};
    if(s.type==="q"){
      const rev=!!ST.revealed[s.id], mc=Array.isArray(s.choices)&&s.choices.length>0, my=(ST.answer||{})[s.id];
      msg.q={qn:String(s.qn||"").slice(0,80),kind:String(s.kind||"").slice(0,10),text:ctxPlain(s.html,600),
        choices:mc?s.choices.slice(0,6).map(c=>ctxPlain(c.html,120)):[],
        my: my==null||my===""?null:(mc?(s.choices[+my]?ctxPlain(s.choices[+my].html,120):null):String(my).slice(0,200)),
        revealed:rev, correct: rev&&typeof ST.correct[s.id]==="boolean"?ST.correct[s.id]:null,
        answer: rev&&mc?(s.choices.map((c,i)=>c.ok?i+1:0).filter(Boolean).join(",")||null):null};
    } else if(s.type==="concept"||s.type==="mu"){ msg.q={qn:String(s.title||"").slice(0,80),kind:s.type==="mu"?"암기·이해":"개념",text:ctxPlain(s.type==="mu"?[].concat(s.mem||[],s.und||[]).join(" · "):s.html,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }
    window.parent.postMessage(msg, location.origin);
  }catch(e){}
}
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; postCtx(); } });
const _renderV5b=render; render=function(){ _renderV5b(); postCtx(); };
function boot(){
  { const m=/^#(from|done|at)=([\w-]+)(?:,pad)?$/.exec(location.hash||""); if(m){ startFrom(m[2], m[1]==="from"?"skip":m[1]); if(/,pad$/.test(location.hash)) setTimeout(()=>$("#padBtn").click(),300); return; } }
  if(location.hash==="#check"){ runCheck(); return; }
  if(location.hash==="#resume"){ render(); save(); return; }   /* V5A: 저장된 위치 그대로 */
  render();
  if(location.hash==="#src"){ setTimeout(()=>{ const b=$("#srcs .src-th"); if(b) b.click(); },400); }
}
function fontCheck(){ try{ const ok=document.fonts.check("22px 'Gowun Dodum'"); if(ok){ const w0=$("#fontWarn"); if(w0) w0.hidden=true; return; } setTimeout(fontCheck,3000); /* V6B: 늦게 로드되면 경고를 지운다 */ if(!ok){ let w=$("#fontWarn"); if(!w){ w=document.createElement("div"); w.id="fontWarn"; $("#stage").appendChild(w); } w.hidden=false; w.textContent="손글씨 글꼴을 불러오지 못해 대체 글꼴로 보입니다. 인터넷 연결을 확인하고 새로 고침하세요."; } }catch(e){} }
function whenReady(){ if(window.renderMathInElement){ fontCheck(); boot(); } else setTimeout(whenReady,40); }
document.addEventListener("DOMContentLoaded",()=>{ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(whenReady,whenReady); });
</script>
