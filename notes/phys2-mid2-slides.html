%\">eq</tspan> = R<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> + R<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> + R<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text><path d=\"M340.0 52.0 L370.0 52.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M370.0 52.0 L390.0 52.0 L396.7 59.0 L403.3 45.0 L410.0 59.0 L416.7 45.0 L423.3 59.0 L430.0 52.0 L450.0 52.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"410.0\" y=\"38.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text><path d=\"M450.0 52.0 L480.0 52.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M340.0 96.0 L370.0 96.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M370.0 96.0 L390.0 96.0 L396.7 103.0 L403.3 89.0 L410.0 103.0 L416.7 89.0 L423.3 103.0 L430.0 96.0 L450.0 96.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"410.0\" y=\"82.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text><path d=\"M450.0 96.0 L480.0 96.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M340.0 140.0 L370.0 140.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M370.0 140.0 L390.0 140.0 L396.7 147.0 L403.3 133.0 L410.0 147.0 L416.7 133.0 L423.3 147.0 L430.0 140.0 L450.0 140.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"410.0\" y=\"126.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text><path d=\"M450.0 140.0 L480.0 140.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M340.0 52.0 L340.0 140.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M480.0 52.0 L480.0 140.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"304\" cy=\"96\" r=\"4\" fill=\"#fff\" stroke=\"#1F2A44\" stroke-width=\"2\"></circle><path d=\"M308.0 96.0 L340.0 96.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M480.0 96.0 L512.0 96.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"516\" cy=\"96\" r=\"4\" fill=\"#fff\" stroke=\"#1F2A44\" stroke-width=\"2\"></circle><circle cx=\"340\" cy=\"96\" r=\"3.6\" fill=\"#1F2A44\"></circle><circle cx=\"480\" cy=\"96\" r=\"3.6\" fill=\"#1F2A44\"></circle><text x=\"410\" y=\"178\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">병렬 — 전위차가 같다</text><text x=\"410\" y=\"198\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">1/R<tspan baseline-shift=\"sub\" font-size=\"72%\">eq</tspan> = 1/R<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> + 1/R<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> + 1/R<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">직렬은 같은 전류가 차례로, 병렬은 같은 전위차 아래 전류가 나뉜다.</figcaption></figure></div>", "exam": []}, {"id": "p5-concept-3", "type": "concept", "part": 5, "title": "미지 전류 수만큼 식을 세운다 — 전류법칙 + 전압법칙 (3/6)", "html": "<div class=\"concept\"><p><b>병렬 연결</b>: 저항들의 두 끝이 같은 두 점에 붙어 있어 <b>전위차가 모두 같다</b>. 각 전류 \\(i_k=V/R_k\\), 전체 전류 \\(i=\\sum i_k\\) → \\(\\dfrac{V}{R_{eq}}=\\dfrac{V}{R_1}+\\dfrac{V}{R_2}+\\cdots\\) → \\[\\frac{1}{R_{eq}}=\\frac1{R_1}+\\frac1{R_2}+\\frac1{R_3}+\\cdots\\] 두 개면 \\(R_{eq}=\\dfrac{R_1R_2}{R_1+R_2}\\). 병렬 등가저항은 가장 작은 저항보다도 작다(길이 늘어나는 것이 아니라 단면적이 넓어지는 것).</p></div><div class=\"concept\"><p><b>다중 고리 풀이 순서</b> ① 갈래마다 전류 이름과 방향을 아무렇게나 정한다 ② 접합점 식(접합점 수 − 1개) ③ 서로 독립인 고리 식(부족한 수만큼 — 이미 쓴 식끼리 더하거나 빼서 나오지 않는 고리) ④ 연립해서 푼다(크래머 법칙 — 미적2 행렬식) ⑤ 음수가 나오면 실제 방향이 가정과 반대.</p></div>", "exam": []}, {"id": "p5-concept-4", "type": "concept", "part": 5, "title": "미지 전류 수만큼 식을 세운다 — 전류법칙 + 전압법칙 (4/6)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"twoloop\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 232\" width=\"560\" height=\"232\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M110.0 56.0 L110.0 128.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"110\" y1=\"128\" x2=\"110.0\" y2=\"143.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"110.0\" y1=\"153.0\" x2=\"110\" y2=\"168\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"96.0\" y1=\"143.0\" x2=\"124.0\" y2=\"143.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"103.0\" y1=\"153.0\" x2=\"117.0\" y2=\"153.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"131.0\" y=\"139.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"90.0\" y=\"152.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> = 10 V</text><path d=\"M110.0 168.0 L110.0 206.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M110.0 56.0 L150.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M150.0 56.0 L175.0 56.0 L181.7 63.0 L188.3 49.0 L195.0 63.0 L201.7 49.0 L208.3 63.0 L215.0 56.0 L240.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"195.0\" y=\"42.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> = 2 Ω</text><path d=\"M240.0 56.0 L280.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M280.0 56.0 L320.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M320.0 56.0 L345.0 56.0 L351.7 63.0 L358.3 49.0 L365.0 63.0 L371.7 49.0 L378.3 63.0 L385.0 56.0 L410.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"365.0\" y=\"42.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 2 Ω</text><path d=\"M410.0 56.0 L450.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M450.0 56.0 L450.0 128.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"450\" y1=\"128\" x2=\"450.0\" y2=\"143.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"450.0\" y1=\"153.0\" x2=\"450\" y2=\"168\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"436.0\" y1=\"143.0\" x2=\"464.0\" y2=\"143.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"443.0\" y1=\"153.0\" x2=\"457.0\" y2=\"153.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"429.0\" y=\"139.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"470.0\" y=\"152.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 5 V</text><path d=\"M450.0 168.0 L450.0 206.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M110.0 206.0 L450.0 206.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M280.0 56.0 L280.0 86.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M280.0 86.0 L280.0 111.0 L287.0 117.7 L273.0 124.3 L287.0 131.0 L273.0 137.7 L287.0 144.3 L280.0 151.0 L280.0 176.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"294.0\" y=\"135.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan> = 4 Ω</text><path d=\"M280.0 176.0 L280.0 206.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"280\" cy=\"56\" r=\"3.6\" fill=\"#1F2A44\"></circle><text x=\"287\" y=\"49\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a</text><circle cx=\"280\" cy=\"206\" r=\"3.6\" fill=\"#1F2A44\"></circle><text x=\"287\" y=\"223\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b</text><line x1=\"110\" y1=\"112\" x2=\"110\" y2=\"76\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"119.0\" y=\"98.55\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text><line x1=\"450\" y1=\"112\" x2=\"450\" y2=\"76\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"441.0\" y=\"98.55\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text><line x1=\"280\" y1=\"180\" x2=\"280\" y2=\"202\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"271.0\" y=\"195.55\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text><path d=\"M179.4 163.0 A 18 18 0 1 1 179.4 181.0\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></path><path d=\"M380.6 163.0 A 18 18 0 1 0 380.6 181.0\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></path></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">예제 회로. 전류 방향은 일단 정해 두고(빨강), 왼쪽 고리는 시계·오른쪽 고리는 반시계로 돈다(초록).</figcaption></figure></div>", "exam": []}, {"id": "p5-concept-5", "type": "concept", "part": 5, "title": "미지 전류 수만큼 식을 세운다 — 전류법칙 + 전압법칙 (5/6)", "html": "<div class=\"concept\"><p><b>예제</b>: 접합점 a: \\(i_1+i_2=i_3\\). 왼쪽 고리(b에서 시계 방향): \\(+10-2i_1-4i_3=0\\). 오른쪽 고리(b에서 반시계 방향): \\(+5-2i_2-4i_3=0\\). \\(i_3\\)를 넣어 정리하면 \\(6i_1+4i_2=10\\), \\(4i_1+6i_2=5\\).</p></div><div class=\"concept\"><p><b>크래머 법칙(미적2 행렬식)</b>: 연립방정식 \\(ax+by=u,\\ cx+dy=v\\)에서 \\(D=ad-bc\\neq0\\)이면 \\(x=\\dfrac{ud-bv}{D}\\), \\(y=\\dfrac{av-cu}{D}\\).</p></div><div class=\"concept\"><p><b>예제에 적용</b>: 계수 행렬식 \\(D=6\\cdot6-4\\cdot4=20\\) → \\(i_1=\\dfrac{10\\cdot6-4\\cdot5}{20}=2.0\\) A, \\(i_2=\\dfrac{6\\cdot5-4\\cdot10}{20}=-0.50\\) A, \\(i_3=i_1+i_2=1.5\\) A. \\(i_2\\)가 음수 → 실제로는 오른쪽 갈래를 <b>아래로</b> 0.50 A 흐른다(전지 2는 거꾸로 밀려 충전된다).</p></div>", "exam": []}, {"id": "p5-concept-6", "type": "concept", "part": 5, "title": "미지 전류 수만큼 식을 세운다 — 전류법칙 + 전압법칙 (6/6)", "html": "<div class=\"concept\"><p><b>전류계와 전압계</b>: 전류계는 재려는 갈래에 <b>직렬</b>로 넣고 자기 저항 \\(R_A\\)가 아주 작아야 한다(원래 전류를 바꾸지 않게). 전압계는 재려는 두 점에 <b>병렬</b>로 대고 저항 \\(R_V\\)가 아주 커야 한다(전류를 빼앗지 않게). 둘을 합친 것이 멀티미터.</p></div><div class=\"one\">한 줄: 접합점: 들어온 합 = 나간 합 · 병렬 \\(1/R_{eq}=\\sum1/R\\), 전위차가 같다 · 미지 전류 수만큼 식 · 음수 = 반대 방향 · 전류계 직렬(작은 R) · 전압계 병렬(큰 R).</div>\n  ", "exam": []}, {"id": "p5-mu", "type": "mu", "part": 5, "title": "27장 ② 다중 고리 회로 · 병렬 · 전류계와 전압계", "mem": ["병렬 \\(\\dfrac1{R_{eq}}=\\sum\\dfrac1{R_k}\\), 둘이면 \\(\\dfrac{R_1R_2}{R_1+R_2}\\)", "직렬 = 전류가 같다 · 병렬 = 전위차가 같다", "풀이 순서 5단계, 음수 = 반대 방향", "전류계 직렬·작은 저항 / 전압계 병렬·큰 저항"], "und": ["병렬로 저항을 더하면 등가저항이 줄어드는 이유", "식이 몇 개 필요한지 세는 법(미지수 = 식 수)", "계기의 내부저항 조건이 그렇게 정해진 이유"]}, {"id": "p5-b1", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-1 · 병렬 등가저항", "html": "<p>6.0 Ω과 3.0 Ω 저항을 병렬로 연결했다. 등가저항은?</p>", "ans": "\\(R_{eq}=\\dfrac{6.0\\times3.0}{6.0+3.0}=\\dfrac{18}{9.0}=2.0\\ \\Omega\\). 가장 작은 3.0 Ω보다 작은지 확인 ✓. \\(1/R_{eq}=1/6+1/3=1/2\\)만 하고 멈추면 0.50이 나온다 — 뒤집어야 한다.", "choices": [{"html": "9.0 Ω", "ok": false, "k": 1}, {"html": "4.5 Ω", "ok": false, "k": 2}, {"html": "2.0 Ω", "ok": true, "k": 0}, {"html": "0.50 Ω", "ok": false, "k": 3}], "exam": []}, {"id": "p5-b2", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-2 · 병렬 전류", "html": "<p>12 V 이상적 전지에 4.0 Ω과 6.0 Ω 저항을 병렬로 연결했다. 전지에서 나오는 전류는?</p>", "ans": "병렬이라 두 저항 모두 12 V. \\(i_1=12/4.0=3.0\\) A, \\(i_2=12/6.0=2.0\\) A → 합 5.0 A. 검산: \\(R_{eq}=2.4\\ \\Omega\\) → \\(12/2.4=5.0\\) A ✓. 1.2 A는 직렬로 착각한 값.", "choices": [{"html": "3.0 A", "ok": false, "k": 2}, {"html": "1.2 A", "ok": false, "k": 1}, {"html": "5.0 A", "ok": true, "k": 0}, {"html": "2.0 A", "ok": false, "k": 3}], "exam": []}, {"id": "p5-b3", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-3 · 계기 연결", "html": "<p>회로의 한 저항에 흐르는 전류와 그 저항 양 끝의 전위차를 재려 한다. 옳은 연결은?</p>", "ans": "전류계는 같은 전류가 지나가야 하니 직렬, 끼워도 전류가 안 바뀌게 저항이 거의 0. 전압계는 두 점의 전위를 비교하니 병렬, 전류를 빼앗지 않게 저항이 아주 크다.", "choices": [{"html": "전류계는 저항과 직렬(내부저항 아주 작게), 전압계는 저항과 병렬(내부저항 아주 크게)", "ok": true, "k": 0}, {"html": "둘 다 직렬, 내부저항은 작을수록 좋다", "ok": false, "k": 2}, {"html": "둘 다 병렬, 내부저항은 클수록 좋다", "ok": false, "k": 3}, {"html": "전류계는 병렬(내부저항 크게), 전압계는 직렬(내부저항 작게)", "ok": false, "k": 1}], "exam": []}, {"id": "p5-b4", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-4 · 음수 전류", "html": "<p>다중 고리 회로를 연립해서 풀었더니 한 갈래의 전류가 \\(-0.5\\) A로 나왔다. 뜻은?</p>", "ans": "방향은 아무렇게나 정해도 된다. 반대로 정했으면 크기는 같고 부호만 음수로 나온다. 다시 풀 필요 없다.", "choices": [{"html": "계산이 틀렸으니 방향을 바꿔 다시 풀어야 한다", "ok": false, "k": 1}, {"html": "실제 전류는 처음 정한 방향과 반대로 0.5 A 흐른다", "ok": true, "k": 0}, {"html": "그 갈래가 에너지를 만들어 낸다", "ok": false, "k": 3}, {"html": "그 갈래의 전류가 0.5 A만큼 줄어든다", "ok": false, "k": 2}], "exam": []}, {"id": "p5-b5", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-5 · 직렬과 병렬 비교", "html": "<p>전압 \\(V\\)인 이상적 전지에 같은 저항 \\(R\\) 두 개를 (가) 직렬로 (나) 병렬로 연결한다. 전지에서 나오는 전류의 비 (나):(가)는?</p>", "ans": "(가) \\(R_{eq}=2R\\) → \\(i=V/2R\\). (나) \\(R_{eq}=R/2\\) → \\(i=2V/R\\). 비 \\(\\dfrac{2V/R}{V/2R}=4\\) → 4 : 1.", "choices": [{"html": "1 : 4", "ok": false, "k": 3}, {"html": "1 : 1", "ok": false, "k": 2}, {"html": "2 : 1", "ok": false, "k": 1}, {"html": "4 : 1", "ok": true, "k": 0}], "exam": []}, {"id": "p5-a6", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-1 · 세 갈래 회로", "html": "<p>그림 회로에서 \\(\\varepsilon_1=9.0\\) V, \\(\\varepsilon_2=3.0\\) V(둘 다 이상적, +극이 위), \\(R_1=R_2=1.0\\ \\Omega\\), \\(R_3=2.0\\ \\Omega\\)이다. 전류 \\(i_1\\)(왼쪽 갈래 위로), \\(i_2\\)(오른쪽 갈래 위로), \\(i_3\\)(가운데 갈래 아래로)를 구하라.</p><figure class=\"fig\" data-fig=\"q-twoloop\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 232\" width=\"560\" height=\"232\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M110.0 56.0 L110.0 128.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"110\" y1=\"128\" x2=\"110.0\" y2=\"143.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"110.0\" y1=\"153.0\" x2=\"110\" y2=\"168\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"96.0\" y1=\"143.0\" x2=\"124.0\" y2=\"143.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"103.0\" y1=\"153.0\" x2=\"117.0\" y2=\"153.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"131.0\" y=\"139.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"90.0\" y=\"152.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> = 9.0 V</text><path d=\"M110.0 168.0 L110.0 206.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M110.0 56.0 L150.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M150.0 56.0 L175.0 56.0 L181.7 63.0 L188.3 49.0 L195.0 63.0 L201.7 49.0 L208.3 63.0 L215.0 56.0 L240.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"195.0\" y=\"42.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> = 1.0 Ω</text><path d=\"M240.0 56.0 L280.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M280.0 56.0 L320.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M320.0 56.0 L345.0 56.0 L351.7 63.0 L358.3 49.0 L365.0 63.0 L371.7 49.0 L378.3 63.0 L385.0 56.0 L410.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"365.0\" y=\"42.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 1.0 Ω</text><path d=\"M410.0 56.0 L450.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M450.0 56.0 L450.0 128.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"450\" y1=\"128\" x2=\"450.0\" y2=\"143.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"450.0\" y1=\"153.0\" x2=\"450\" y2=\"168\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"436.0\" y1=\"143.0\" x2=\"464.0\" y2=\"143.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"443.0\" y1=\"153.0\" x2=\"457.0\" y2=\"153.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"429.0\" y=\"139.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"470.0\" y=\"152.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 3.0 V</text><path d=\"M450.0 168.0 L450.0 206.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M110.0 206.0 L450.0 206.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M280.0 56.0 L280.0 86.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M280.0 86.0 L280.0 111.0 L287.0 117.7 L273.0 124.3 L287.0 131.0 L273.0 137.7 L287.0 144.3 L280.0 151.0 L280.0 176.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"294.0\" y=\"135.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan> = 2.0 Ω</text><path d=\"M280.0 176.0 L280.0 206.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"280\" cy=\"56\" r=\"3.6\" fill=\"#1F2A44\"></circle><text x=\"287\" y=\"49\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a</text><circle cx=\"280\" cy=\"206\" r=\"3.6\" fill=\"#1F2A44\"></circle><text x=\"287\" y=\"223\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b</text><line x1=\"110\" y1=\"112\" x2=\"110\" y2=\"76\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"119.0\" y=\"98.55\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text><line x1=\"450\" y1=\"112\" x2=\"450\" y2=\"76\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"441.0\" y=\"98.55\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text><line x1=\"280\" y1=\"180\" x2=\"280\" y2=\"202\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"271.0\" y=\"195.55\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text><path d=\"M179.4 163.0 A 18 18 0 1 1 179.4 181.0\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></path><path d=\"M380.6 163.0 A 18 18 0 1 0 380.6 181.0\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></path></svg></figure>", "ans": "① 접합점 a: \\(i_1+i_2=i_3\\). ② 왼쪽 고리(b에서 시계 방향): \\(+9.0-1.0i_1-2.0i_3=0\\). ③ 오른쪽 고리(b에서 반시계 방향): \\(+3.0-1.0i_2-2.0i_3=0\\). ④ \\(i_3\\)을 넣으면 \\(3i_1+2i_2=9\\), \\(2i_1+3i_2=3\\). ⑤ 크래머: \\(D=3\\cdot3-2\\cdot2=5\\), \\(i_1=\\dfrac{9\\cdot3-2\\cdot3}{5}=4.2\\) A, \\(i_2=\\dfrac{3\\cdot3-2\\cdot9}{5}=-1.8\\) A, \\(i_3=4.2-1.8=2.4\\) A. ⑥ \\(i_2\\) 음수 → 실제로는 오른쪽 갈래를 <b>아래로</b> 1.8 A. 검산(바깥 큰 고리): \\(9.0-4.2\\times1.0+(-1.8)\\times1.0-3.0=0\\) ✓.", "choices": null, "exam": []}, {"id": "p5-a7", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-2 · 전구 세 개", "html": "<p>세 전구는 모두 「100 V에서 50 W」 규격이다. 그림처럼 전구 1과, 서로 병렬인 전구 2·3을 직렬로 이어 100 V에 연결했다. 전구 저항은 일정하다고 할 때 (a) 세 전구가 쓰는 전체 전력 (b) 가장 밝은 전구와 그 전력을 구하라.</p><figure class=\"fig\" data-fig=\"q-bulbs\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 470 176\" width=\"470\" height=\"176\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M70.0 160.0 L70.0 124.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"70\" y1=\"124\" x2=\"70.0\" y2=\"109.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"70.0\" y1=\"99.0\" x2=\"70\" y2=\"84\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"56.0\" y1=\"99.0\" x2=\"84.0\" y2=\"99.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"63.0\" y1=\"109.0\" x2=\"77.0\" y2=\"109.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"91.0\" y=\"95.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"50.0\" y=\"108.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">100 V</text><path d=\"M70.0 84.0 L70.0 50.0 L110.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"110\" y1=\"50\" x2=\"133.0\" y2=\"50.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"157.0\" y1=\"50.0\" x2=\"180\" y2=\"50\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><circle cx=\"145.0\" cy=\"50.0\" r=\"12\" fill=\"#FFF9DB\" stroke=\"#1F2A44\" stroke-width=\"2\"></circle><line x1=\"136.6\" y1=\"41.6\" x2=\"153.4\" y2=\"58.4\" stroke=\"#1F2A44\" stroke-width=\"1.6\"></line><line x1=\"136.6\" y1=\"58.4\" x2=\"153.4\" y2=\"41.6\" stroke=\"#1F2A44\" stroke-width=\"1.6\"></line><text x=\"145.0\" y=\"32.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전구 1</text><path d=\"M180.0 50.0 L230.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"230\" cy=\"50\" r=\"3.6\" fill=\"#1F2A44\"></circle><path d=\"M230.0 50.0 L270.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"270\" y1=\"50\" x2=\"293.0\" y2=\"50.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"317.0\" y1=\"50.0\" x2=\"340\" y2=\"50\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><circle cx=\"305.0\" cy=\"50.0\" r=\"12\" fill=\"#FFF9DB\" stroke=\"#1F2A44\" stroke-width=\"2\"></circle><line x1=\"296.6\" y1=\"41.6\" x2=\"313.4\" y2=\"58.4\" stroke=\"#1F2A44\" stroke-width=\"1.6\"></line><line x1=\"296.6\" y1=\"58.4\" x2=\"313.4\" y2=\"41.6\" stroke=\"#1F2A44\" stroke-width=\"1.6\"></line><text x=\"305.0\" y=\"32.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전구 2</text><path d=\"M340.0 50.0 L380.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M230.0 50.0 L230.0 110.0 L270.0 110.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"270\" y1=\"110\" x2=\"293.0\" y2=\"110.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"317.0\" y1=\"110.0\" x2=\"340\" y2=\"110\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><circle cx=\"305.0\" cy=\"110.0\" r=\"12\" fill=\"#FFF9DB\" stroke=\"#1F2A44\" stroke-width=\"2\"></circle><line x1=\"296.6\" y1=\"101.6\" x2=\"313.4\" y2=\"118.4\" stroke=\"#1F2A44\" stroke-width=\"1.6\"></line><line x1=\"296.6\" y1=\"118.4\" x2=\"313.4\" y2=\"101.6\" stroke=\"#1F2A44\" stroke-width=\"1.6\"></line><text x=\"305.0\" y=\"138.4\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전구 3</text><path d=\"M340.0 110.0 L380.0 110.0 L380.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"380\" cy=\"50\" r=\"3.6\" fill=\"#1F2A44\"></circle><path d=\"M380.0 50.0 L420.0 50.0 L420.0 160.0 L70.0 160.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path></svg></figure>", "ans": "① 규격에서 저항: \\(R=\\dfrac{V^2}{P}=\\dfrac{100^2}{50}=200\\ \\Omega\\). ② 전구 2·3 병렬 = 100 Ω, 전구 1과 직렬 → \\(R_{eq}=300\\ \\Omega\\). (a) \\(P=\\dfrac{V^2}{R_{eq}}=\\dfrac{10000}{300}\\approx33\\) W. (b) 전체 전류 \\(i=100/300=1/3\\) A가 전구 1을 모두 지나고, 2·3에는 반씩(1/6 A). 전구 1: \\(i^2R=\\frac19\\times200\\approx22\\) W, 전구 2·3: 각 \\(\\frac1{36}\\times200\\approx5.6\\) W → <b>전구 1이 가장 밝다</b>. 합 22.2 + 5.6 + 5.6 ≈ 33 W ✓.", "choices": null, "exam": []}, {"id": "p5-a8", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-3 · 저항마다 전력", "html": "<p>그림처럼 기전력 18 V인 이상적 전지에 2.0 Ω 저항이 직렬로, 그 뒤에 3.0 Ω과 6.0 Ω 저항이 병렬로 연결되어 있다. 각 저항에서 소모되는 전력을 구하고, 합이 전지가 내는 전력과 같은지 확인하라.</p><figure class=\"fig\" data-fig=\"q-sp\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 450 186\" width=\"450\" height=\"186\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M70.0 170.0 L70.0 130.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"70\" y1=\"130\" x2=\"70.0\" y2=\"115.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"70.0\" y1=\"105.0\" x2=\"70\" y2=\"90\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"56.0\" y1=\"105.0\" x2=\"84.0\" y2=\"105.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"63.0\" y1=\"115.0\" x2=\"77.0\" y2=\"115.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"91.0\" y=\"101.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"50.0\" y=\"114.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">18 V</text><path d=\"M70.0 90.0 L70.0 50.0 L100.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M100.0 50.0 L125.0 50.0 L131.7 57.0 L138.3 43.0 L145.0 57.0 L151.7 43.0 L158.3 57.0 L165.0 50.0 L190.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"145.0\" y=\"36.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">2.0 Ω</text><path d=\"M190.0 50.0 L250.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"250\" cy=\"50\" r=\"3.6\" fill=\"#1F2A44\"></circle><path d=\"M250.0 50.0 L250.0 76.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M250.0 76.0 L250.0 91.0 L257.0 97.7 L243.0 104.3 L257.0 111.0 L243.0 117.7 L257.0 124.3 L250.0 131.0 L250.0 146.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"264.0\" y=\"115.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">3.0 Ω</text><path d=\"M250.0 146.0 L250.0 170.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M250.0 50.0 L360.0 50.0 L360.0 76.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M360.0 76.0 L360.0 91.0 L367.0 97.7 L353.0 104.3 L367.0 111.0 L353.0 117.7 L367.0 124.3 L360.0 131.0 L360.0 146.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"374.0\" y=\"115.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">6.0 Ω</text><path d=\"M360.0 146.0 L360.0 170.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M360.0 170.0 L70.0 170.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"250\" cy=\"170\" r=\"3.6\" fill=\"#1F2A44\"></circle></svg></figure>", "ans": "① 병렬 부분 \\(\\dfrac{3.0\\times6.0}{3.0+6.0}=2.0\\ \\Omega\\) → 전체 \\(R_{eq}=4.0\\ \\Omega\\). ② 전체 전류 \\(i=18/4.0=4.5\\) A. ③ 2.0 Ω: \\(i^2R=4.5^2\\times2.0=40.5\\) W. ④ 병렬 부분 전위차 \\(4.5\\times2.0=9.0\\) V → 3.0 Ω: \\(9.0^2/3.0=27\\) W, 6.0 Ω: \\(9.0^2/6.0=13.5\\) W. ⑤ 합 \\(40.5+27+13.5=81\\) W, 전지 \\(i\\varepsilon=4.5\\times18=81\\) W ✓(에너지 보존).", "choices": null, "exam": []}, {"id": "p5-result", "type": "result", "part": 5, "title": "27장 ② 다중 고리 회로 · 병렬 · 전류계와 전압계"}, {"id": "p6-cover", "type": "cover", "part": 6, "no": "파트 6 · 교재 선행", "title": "27장 ③ RC 회로 — 충전 · 방전 · 시간 상수", "star": false}, {"id": "p6-concept", "type": "concept", "part": 6, "title": "축전기가 끼면 전류가 시간에 따라 변한다 — 지수함수 하나로 (1/7)", "html": "<div class=\"why\">빈 축전기는 처음엔 도선처럼 전류를 받아들이다가, 전하가 찰수록 전류를 막는다. 이 변화는 \\(e^{-t/RC}\\) 하나로 모두 설명된다. 교수님 강의노트 Part-07 마지막 절(전류의 크기가 시간에 따라 변하는 회로)이 중간 범위의 끝이다.</div>\n  <div class=\"concept\"><p><b>[고등 수학 복습] 지수·로그</b>: \\(e\\approx2.718\\). \\(e^{-x}\\)는 \\(x=0\\)에서 1이고 \\(x\\)가 1 늘 때마다 약 0.37배로 준다. \\(e^{-1}\\approx0.37\\), \\(1-e^{-1}\\approx0.63\\). \\(\\ln\\)은 그 역: \\(e^{-x}=\\frac12\\) ↔ \\(x=\\ln2\\approx0.69\\).</p></div>", "exam": []}, {"id": "p6-concept-2", "type": "concept", "part": 6, "title": "축전기가 끼면 전류가 시간에 따라 변한다 — 지수함수 하나로 (2/7)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"rc\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 520 206\" width=\"520\" height=\"206\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M70.0 186.0 L70.0 150.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"70\" y1=\"150\" x2=\"70.0\" y2=\"135.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"70.0\" y1=\"125.0\" x2=\"70\" y2=\"110\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"56.0\" y1=\"125.0\" x2=\"84.0\" y2=\"125.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"63.0\" y1=\"135.0\" x2=\"77.0\" y2=\"135.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"91.0\" y=\"121.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"50.0\" y=\"134.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε</text><path d=\"M70.0 110.0 L70.0 56.0 L150.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"154\" cy=\"56\" r=\"4\" fill=\"#fff\" stroke=\"#1F2A44\" stroke-width=\"2\"></circle><text x=\"154\" y=\"45\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a</text><circle cx=\"154\" cy=\"116\" r=\"4\" fill=\"#fff\" stroke=\"#1F2A44\" stroke-width=\"2\"></circle><text x=\"143\" y=\"120.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b</text><path d=\"M154.0 120.0 L154.0 186.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"154\" cy=\"186\" r=\"3.6\" fill=\"#1F2A44\"></circle><circle cx=\"214\" cy=\"86\" r=\"4\" fill=\"#1F2A44\"></circle><line x1=\"214\" y1=\"86\" x2=\"158\" y2=\"58\" stroke=\"#1F2A44\" stroke-width=\"2.4\"></line><text x=\"222\" y=\"76\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">S</text><path d=\"M214.0 86.0 L250.0 86.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M250.0 86.0 L275.0 86.0 L281.7 93.0 L288.3 79.0 L295.0 93.0 L301.7 79.0 L308.3 93.0 L315.0 86.0 L340.0 86.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"295.0\" y=\"72.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R</text><path d=\"M340.0 86.0 L420.0 86.0 L420.0 110.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"420\" y1=\"110\" x2=\"420.0\" y2=\"130.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"420.0\" y1=\"140.0\" x2=\"420\" y2=\"160\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"407.0\" y1=\"130.0\" x2=\"433.0\" y2=\"130.0\" stroke=\"#1F2A44\" stroke-width=\"3\"></line><line x1=\"407.0\" y1=\"140.0\" x2=\"433.0\" y2=\"140.0\" stroke=\"#1F2A44\" stroke-width=\"3\"></line><text x=\"439.0\" y=\"139.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">C</text><path d=\"M420.0 160.0 L420.0 186.0 L70.0 186.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">S를 a에 두면 전지가 축전기를 충전, b로 옮기면 전지 없이 축전기가 R을 통해 방전한다.</figcaption></figure></div>", "exam": []}, {"id": "p6-concept-3", "type": "concept", "part": 6, "title": "축전기가 끼면 전류가 시간에 따라 변한다 — 지수함수 하나로 (3/7)", "html": "<div class=\"concept\"><p><b>충전(스위치 a)</b>: 시계 방향 전압법칙 \\(\\varepsilon-iR-\\dfrac qC=0\\)(축전기 두 판의 전위차는 25장 \\(V=q/C\\)). 여기서 \\(i=\\dfrac{dq}{dt}\\)이므로 \\[R\\frac{dq}{dt}+\\frac qC=\\varepsilon\\] 충전 방정식이다. 공업수학1 1장의 1계 선형 미분방정식이고, 변수분리(1.3)로 풀린다. 처음에는 비어 있다: \\(q(0)=0\\).</p></div><div class=\"concept\"><p><b>풀이</b>: \\(\\dfrac{dq}{dt}=\\dfrac{C\\varepsilon-q}{RC}\\) → \\(\\dfrac{dq}{C\\varepsilon-q}=\\dfrac{dt}{RC}\\) → 양변을 0부터 적분 \\(-\\ln(C\\varepsilon-q)+\\ln(C\\varepsilon)=\\dfrac{t}{RC}\\) → \\(\\ln\\dfrac{C\\varepsilon-q}{C\\varepsilon}=-\\dfrac{t}{RC}\\) → \\[q=C\\varepsilon\\left(1-e^{-t/RC}\\right)\\]</p></div><div class=\"concept\"><p><b>전류와 전위차</b>: \\(i=\\dfrac{dq}{dt}=\\dfrac{\\varepsilon}{R}e^{-t/RC}\\). 축전기 \\(V_C=\\dfrac qC=\\varepsilon(1-e^{-t/RC})\\), 저항 \\(V_R=iR=\\varepsilon e^{-t/RC}\\). 언제나 \\(V_C+V_R=\\varepsilon\\).</p></div>", "exam": []}, {"id": "p6-concept-4", "type": "concept", "part": 6, "title": "축전기가 끼면 전류가 시간에 따라 변한다 — 지수함수 하나로 (4/7)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"rcgraph\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 206\" width=\"560\" height=\"206\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><line x1=\"60\" y1=\"160\" x2=\"270\" y2=\"160\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><line x1=\"60\" y1=\"160\" x2=\"60\" y2=\"20\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><text x=\"268\" y=\"178\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" st ke-width=\"3\" stroke-linejoin=\"round\">충전: 전하 q(t)</text><line x1=\"330\" y1=\"160\" x2=\"540\" y2=\"160\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><line x1=\"330\" y1=\"160\" x2=\"330\" y2=\"20\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><text x=\"538\" y=\"178\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">t</text><text x=\"322\" y=\"30\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i</text><text x=\"322\" y=\"47\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε/R</text><path d=\"M330.0 42.0 L333.3 51.0 L336.7 59.3 L340.0 67.0 L343.3 74.1 L346.7 80.7 L350.0 86.7 L353.3 92.3 L356.7 97.5 L360.0 102.2 L363.3 106.6 L366.7 110.7 L370.0 114.5 L373.3 117.9 L376.7 121.2 L380.0 124.1 L383.3 126.9 L386.7 129.4 L390.0 131.7 L393.3 133.9 L396.7 135.9 L400.0 137.7 L403.3 139.4 L406.7 141.0 L410.0 142.4 L413.3 143.8 L416.7 145.0 L420.0 146.2 L423.3 147.2 L426.7 148.2 L430.0 149.1 L433.3 149.9 L436.7 150.7 L440.0 151.4 L443.3 152.1 L446.7 152.7 L450.0 153.2 L453.3 153.7 L456.7 154.2 L460.0 154.7 L463.3 155.1 L466.7 155.4 L470.0 155.8 L473.3 156.1 L476.7 156.4 L480.0 156.7 L483.3 156.9 L486.7 157.2 L490.0 157.4 L493.3 157.6 L496.7 157.8 L500.0 157.9 L503.3 158.1 L506.7 158.2 L510.0 158.4 L513.3 158.5 L516.7 158.6 L520.0 158.7 L523.3 158.8 L526.7 158.9 L530.0 159.0\" fill=\"none\" stroke=\"#E03131\" stroke-width=\"2.2\"></path><line x1=\"372\" y1=\"160\" x2=\"372\" y2=\"116.5902259417698\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"></line><circle cx=\"372\" cy=\"116.5902259417698\" r=\"4\" fill=\"#1F2A44\"></circle><text x=\"380\" y=\"108.5902259417698\" font-size=\"12\" fill=\"#E03131\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">37%</text><text x=\"372\" y=\"178\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">τ</text><text x=\"430.0\" y=\"196\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">충전: 전류 i(t)</text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">\\(t=\\tau=RC\\)에서 전하는 최종값의 63%, 전류는 처음의 37%.</figcaption></figure></div>", "exam": []}, {"id": "p6-concept-5", "type": "concept", "part": 6, "title": "축전기가 끼면 전류가 시간에 따라 변한다 — 지수함수 하나로 (5/7)", "html": "<div class=\"concept\"><p><b>시간 상수</b> \\(\\tau=RC\\)(교수님 \\(\\tau_C\\), 단위 Ω·F = s): \\(t=\\tau\\)에서 \\(q=(1-e^{-1})C\\varepsilon\\approx0.63\\,C\\varepsilon\\), 전류는 처음의 37%. \\(\\tau\\)가 작을수록 빨리 찬다. \\(5\\tau\\)면 99% 이상.</p></div><div class=\"concept\"><p><b>처음과 충분히 오래 지난 뒤</b>: 처음 비어 있던 축전기는 연결 직후(\\(t=0\\)) 전위차가 0 → <b>도선처럼</b>, 전류 \\(\\varepsilon/R\\). \\(t\\to\\infty\\) 가득 찬 축전기는 전류가 0 → <b>끊긴 도선처럼</b>, \\(q=C\\varepsilon\\), \\(V_C=\\varepsilon\\).</p></div>", "exam": []}, {"id": "p6-concept-6", "type": "concept", "part": 6, "title": "축전기가 끼면 전류가 시간에 따라 변한다 — 지수함수 하나로 (6/7)", "html": "<div class=\"concept\"><p><b>방전(스위치 b, 전지 없음)</b>: \\(iR+\\dfrac qC=0\\) → \\(R\\dfrac{dq}{dt}+\\dfrac qC=0\\), \\(q(0)=q_0\\). 변수분리 \\(\\dfrac{dq}{q}=-\\dfrac{dt}{RC}\\) → 0부터 적분 \\(\\ln\\dfrac{q}{q_0}=-\\dfrac{t}{RC}\\) → \\[q=q_0e^{-t/RC},\\qquad i=\\frac{dq}{dt}=-\\frac{q_0}{RC}e^{-t/RC}\\] 음수 = 충전 때와 반대 방향으로 흐른다.</p></div><div class=\"concept\"><p><b>비율로 구하는 시간</b>: 방전으로 절반 \\(t=RC\\ln2\\) · 1/3 \\(t=RC\\ln3\\) · 1/4 \\(t=RC\\ln4=2RC\\ln2\\) · 충전 중 \\(V_C=V_R\\)가 되는 때 \\(e^{-t/RC}=\\frac12\\) → \\(t=RC\\ln2\\) · 99% 충전 \\(1-e^{-t/RC}=0.99\\) → \\(t=RC\\ln100=2RC\\ln10\\approx4.6RC\\).</p></div>", "exam": []}, {"id": "p6-concept-7", "type": "concept", "part": 6, "title": "축전기가 끼면 전류가 시간에 따라 변한다 — 지수함수 하나로 (7/7)", "html": "<div class=\"one\">한 줄: 충전 \\(q=C\\varepsilon(1-e^{-t/RC})\\), \\(i=\\frac\\varepsilon Re^{-t/RC}\\) · 방전 \\(q=q_0e^{-t/RC}\\) · \\(\\tau=RC\\)(63%·37%) · 처음(빈) 축전기 = 도선처럼, 충분히 지난 뒤 = 끊긴 도선처럼.</div>\n  ", "exam": []}, {"id": "p6-mu", "type": "mu", "part": 6, "title": "27장 ③ RC 회로 — 충전 · 방전 · 시간 상수", "mem": ["충전 \\(q=C\\varepsilon(1-e^{-t/RC})\\), \\(i=\\dfrac\\varepsilon Re^{-t/RC}\\)", "방전 \\(q=q_0e^{-t/RC}\\)", "\\(\\tau=RC\\): 63% 충전 · 전류 37%", "절반 \\(RC\\ln2\\) · 99% \\(2RC\\ln10\\)"], "und": ["처음 전류가 \\(\\varepsilon/R\\)인 이유(빈 축전기의 전위차 0)", "충전이 점점 느려지는 이유(\\(q/C\\)가 \\(\\varepsilon\\)에 가까워져 \\(R\\)의 전위차가 준다)", "충전 방정식이 1계 선형 ODE인 것(공수1 연결)"]}, {"id": "p6-b1", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-1 · 시간 상수", "html": "<p>저항 2.0 kΩ과 전기 용량 50 μF 축전기로 만든 RC 회로의 시간 상수는?</p>", "ans": "접두어부터: 2.0 kΩ \\(=2.0\\times10^3\\ \\Omega\\), 50 μF \\(=50\\times10^{-6}\\) F. \\(\\tau=RC=2.0\\times10^3\\times5.0\\times10^{-5}=0.10\\) s.", "choices": [{"html": "100 s", "ok": false, "k": 1}, {"html": "\\(1.0\\times10^{-4}\\) s", "ok": false, "k": 2}, {"html": "0.10 s", "ok": true, "k": 0}, {"html": "40 s", "ok": false, "k": 3}], "exam": []}, {"id": "p6-b2", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-2 · 63%", "html": "<p>처음에 비어 있는 축전기를 \\(t=0\\)에 스위치를 닫아 RC 회로로 충전한다. 시간 상수 \\(\\tau\\)만큼 지났을 때 축전기 전하는 최종값의 몇 %인가?</p>", "ans": "\\(q/C\\varepsilon=1-e^{-1}\\approx1-0.37=0.63\\). 37%는 그때의 전류 비율(\\(e^{-1}\\))이다.", "choices": [{"html": "100%", "ok": false, "k": 3}, {"html": "50%", "ok": false, "k": 2}, {"html": "약 37%", "ok": false, "k": 1}, {"html": "약 63%", "ok": true, "k": 0}], "exam": []}, {"id": "p6-b3", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-3 · 스위치를 닫는 순간", "html": "<p>비어 있는 축전기, 저항 10 Ω, 기전력 20 V인 이상적 전지가 직렬로 연결된다. 스위치를 닫는 순간의 전류는?</p>", "ans": "\\(t=0\\)에서 \\(q=0\\) → 축전기 전위차 0 → 도선과 같다. 전압법칙 \\(20-10i=0\\) → \\(i=2.0\\) A \\(=\\varepsilon/R\\).", "choices": [{"html": "2.0 A", "ok": true, "k": 0}, {"html": "0.50 A", "ok": false, "k": 3}, {"html": "0", "ok": false, "k": 1}, {"html": "200 A", "ok": false, "k": 2}], "exam": []}, {"id": "p6-b4", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-4 · 오래 지난 뒤", "html": "<p>저항 \\(R\\), 기전력 \\(\\varepsilon\\)인 RC 직렬 충전 회로에서 스위치를 닫고 충분히 오래 지난 뒤의 전류와 축전기 전위차는?</p>", "ans": "\\(e^{-t/RC}\\to0\\) → \\(i\\to0\\), \\(q\\to C\\varepsilon\\), \\(V_C\\to\\varepsilon\\). 가득 찬 축전기는 끊긴 도선처럼 전류를 막는다.", "choices": [{"html": "전류가 끝없이 커진다", "ok": false, "k": 3}, {"html": "전류 0, 축전기 전위차 \\(\\varepsilon\\)", "ok": true, "k": 0}, {"html": "전류 \\(\\varepsilon/2R\\), 전위차 \\(\\varepsilon/2\\)", "ok": false, "k": 2}, {"html": "전류 \\(\\varepsilon/R\\), 전위차 0", "ok": false, "k": 1}], "exam": []}, {"id": "p6-b5", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-5 · 방전 절반", "html": "<p>RC 방전 회로에서 축전기 전하가 처음의 절반이 되는 시간은?</p>", "ans": "\\(q_0e^{-t/RC}=\\frac12q_0\\) → \\(e^{-t/RC}=\\frac12\\) → 양변 ln: \\(-t/RC=-\\ln2\\) → \\(t=RC\\ln2\\approx0.69RC\\). \\(RC\\ln\\frac12\\)은 음수라 시간이 될 수 없다.", "choices": [{"html": "\\(RC/2\\)", "ok": false, "k": 1}, {"html": "\\(RC\\ln\\frac12\\)", "ok": false, "k": 3}, {"html": "\\(RC\\ln2\\)", "ok": true, "k": 0}, {"html": "\\(2RC\\)", "ok": false, "k": 2}], "exam": []}, {"id": "p6-b6", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-6 · 축전기 두 개 직렬", "html": "<p>2.0 μF과 8.0 μF 축전기를 직렬로 잇고 0.20 MΩ 저항과 연결한 RC 회로의 시간 상수는?</p>", "ans": "25장: 직렬 축전기는 \\(\\dfrac1{C_{eq}}=\\dfrac1{C_1}+\\dfrac1{C_2}\\) → \\(C_{eq}=\\dfrac{2.0\\times8.0}{10}=1.6\\ \\mu\\)F. \\(\\tau=RC_{eq}=0.20\\times10^6\\times1.6\\times10^{-6}=0.32\\) s. 병렬처럼 더하면(10 μF) 2.0 s가 나온다.", "choices": [{"html": "0.32 s", "ok": true, "k": 0}, {"html": "2.0 s", "ok": false, "k": 1}, {"html": "1.6 s", "ok": false, "k": 3}, {"html": "0.40 s", "ok": false, "k": 2}], "exam": []}, {"id": "p6-a7", "type": "q", "part": 6, "kind": "응용", "qn": "응용 6-1 · RC 충전과 방전 한 세트", "html": "<p>비어 있는 축전기(전기 용량 50 μF), 저항 200 kΩ, 기전력 12 V인 이상적 전지와 스위치가 직렬로 연결되어 있다. ① 스위치를 닫은 뒤 전류 \\(i\\), 축전기 전하 \\(q\\)로 전압법칙 식을 쓰라. ② 시간 상수와 그 뜻 ③ 축전기에 쌓이는 최대 전하 ④ 스위치를 닫고 5.0 s 뒤의 전류 ⑤ 가득 찬 뒤 전지를 빼고 같은 저항으로 방전시킬 때 전하가 처음의 1/3이 되는 시간을 구하라.</p>", "ans": "① \\(\\varepsilon-\\dfrac qC-iR=0\\). ② \\(\\tau=RC=2.0\\times10^5\\times5.0\\times10^{-5}=10\\) s — 최대 전하의 \\(1-1/e\\approx63\\%\\)까지 차는 시간. ③ \\(q_{max}=C\\varepsilon=5.0\\times10^{-5}\\times12=6.0\\times10^{-4}\\) C. ④ \\(i=\\dfrac\\varepsilon Re^{-t/\\tau}=\\dfrac{12}{2.0\\times10^5}e^{-5/10}=6.0\\times10^{-5}e^{-1/2}\\approx3.6\\times10^{-5}\\) A. ⑤ \\(q_0e^{-t/\\tau}=\\frac13q_0\\) → \\(t=\\tau\\ln3=10\\ln3\\approx11\\) s.", "choices": null, "exam": []}, {"id": "p6-a8", "type": "q", "part": 6, "kind": "응용", "qn": "응용 6-2 · 스위치를 열 때", "html": "<p>그림 회로(\\(\\varepsilon=12\\) V, \\(R_1=2\\ \\Omega\\), \\(R_2=4\\ \\Omega\\), \\(R_3=2\\ \\Omega\\), 전기 용량 \\(C=1.0\\) F)에서 스위치 S를 오랫동안 닫아 두어 축전기가 완전히 충전되었다. ① 각 저항의 전류 ② 축전기 전하 ③ \\(t=0\\)에 S를 열 때 \\(R_2\\)를 지나는 전류를 시간의 함수로 ④ 축전기 전하가 처음의 1/4이 되는 시간을 구하라.</p><figure class=\"fig\" data-fig=\"q-rcsw\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 534 204\" width=\"534\" height=\"204\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M84.0 186.0 L84.0 140.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"84\" y1=\"140\" x2=\"84.0\" y2=\"125.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"84.0\" y1=\"115.0\" x2=\"84\" y2=\"100\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"70.0\" y1=\"115.0\" x2=\"98.0\" y2=\"115.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"77.0\" y1=\"125.0\" x2=\"91.0\" y2=\"125.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"105.0\" y=\"111.0\" #1F2A44\"></circle></svg></figure>", "ans": "① 오래 지나 충전이 끝나면 축전기 갈래(\\(R_3\\)–\\(C\\))에는 전류가 없다. 전류는 \\(R_1\\) → \\(R_2\\)로만: \\(I_1=I_2=\\dfrac{12}{2+4}=2.0\\) A, \\(I_3=0\\). ② 축전기 전위차 = \\(R_2\\) 전위차(\\(R_3\\)에 전류가 없어 전위 변화 0) \\(=2.0\\times4=8.0\\) V → \\(Q=CV=1.0\\times8.0=8.0\\) C. ③ S를 열면 전지 쪽 길이 끊겨, 축전기가 \\(R_3\\)와 \\(R_2\\)를 직렬로 지나 방전한다: \\(\\tau=(R_2+R_3)C=6.0\\) s. \\(q(t)=8.0e^{-t/6}\\) C. 축전기의 +판(위, \\(R_3\\) 쪽)에서 나온 전류가 \\(R_3\\) → P → \\(R_2\\)를 지나 아래 접합점으로 흐르므로 \\(R_2\\)에서는 P에서 아래로: \\(i_2(t)=\\left|\\dfrac{dq}{dt}\\right|=\\dfrac{8.0}{6.0}e^{-t/6}=\\dfrac43e^{-t/6}\\) A. ④ \\(e^{-t/6}=\\frac14\\) → \\(t=6\\ln4=12\\ln2\\approx8.3\\) s.", "choices": null, "exam": []}, {"id": "p6-a9", "type": "q", "part": 6, "kind": "응용", "qn": "응용 6-3 · 두 전위차가 같아지는 때", "html": "<p>저항 5.0 kΩ, 전기 용량 \\(C=2.0\\ \\mu\\)F, 기전력 10 V인 RC 직렬 충전 회로가 있다. 처음 축전기는 비어 있고 \\(t=0\\)에 스위치를 닫는다. (a) 축전기 전위차와 저항 전위차가 같아지는 시각 (b) 축전기가 최대 전하의 99%까지 차는 시각을 구하라.</p>", "ans": "\\(\\tau=RC=5.0\\times10^3\\times2.0\\times10^{-6}=0.010\\) s. (a) \\(V_C=V_R\\) ↔ \\(\\varepsilon(1-e^{-t/\\tau})=\\varepsilon e^{-t/\\tau}\\) ↔ \\(e^{-t/\\tau}=\\frac12\\) → \\(t=\\tau\\ln2\\approx6.9\\times10^{-3}\\) s. (b) \\(1-e^{-t/\\tau}=0.99\\) → \\(e^{-t/\\tau}=0.01\\) → \\(t=\\tau\\ln100=2\\tau\\ln10\\approx0.046\\) s(약 \\(4.6\\tau\\)).", "choices": null, "exam": []}, {"id": "p6-result", "type": "result", "part": 6, "title": "27장 ③ RC 회로 — 충전 · 방전 · 시간 상수"}, {"id": "final", "type": "final"}];

/* ---------- 수식: KaTeX (지침 §1). 렌더 끝나기 전엔 작업 영역을 감춘다(§0 raw LaTeX 노출 금지) ---------- */
function typeset(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true},{left:"$$",right:"$$",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  }
  const cl=el.cloneNode(true); cl.querySelectorAll(".katex,.katex-display").forEach(k=>k.remove());
  const raw=/\\\(|\\\[|\\frac|\\vec|\\begin\{|\$\$/.test(cl.textContent||"");
  el.dataset.raw=raw?"1":"0";
  if(raw&&el.id==="body"){ el.dataset.ready="false"; el.innerHTML='<div class="kicker">수식 오류</div><h2>이 장의 수식이 그대로 드러나 표시를 멈췄습니다</h2><p>정리노트의 수식 표기를 고쳐 다시 만들어야 합니다.</p>'; }
  el.dataset.ready="true";
  return !raw;
}

/* ---------- 풀이 메모장 (손글씨 캔버스 · 애플펜슬) ---------- */
const PAD={tool:"pen",cv:null,ctx:null,id:null,cur:null,ro:null,dpr:1,W:0,H:0};
function padStrokes(id){ ST.ink=ST.ink||{}; if(!ST.ink[id]) ST.ink[id]={strokes:[]}; return ST.ink[id].strokes; }
function padResize(){ const cv=PAD.cv; if(!cv||!cv.isConnected) return; const r=cv.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  PAD.dpr=Math.min(3,window.devicePixelRatio||1); PAD.W=r.width; PAD.H=r.height; cv.width=Math.round(r.width*PAD.dpr); cv.height=Math.round(r.height*PAD.dpr);
  PAD.ctx=cv.getContext("2d"); PAD.ctx.setTransform(PAD.dpr,0,0,PAD.dpr,0,0); PAD.ctx.lineCap="round"; PAD.ctx.lineJoin="round"; padRedraw(); }
function padLine(ctx,t,x0,y0,x1,y1,p){ if(!ctx) return; const W=PAD.W; ctx.globalCompositeOperation=t==="e"?"destination-out":"source-over"; ctx.strokeStyle="#111111";
  ctx.lineWidth=t==="e"?W*0.03:Math.max(1.2,W*0.0035*(0.6+(p||0.5)*1.2)); ctx.beginPath(); ctx.moveTo(x0*W,y0*W); ctx.lineTo(x1*W,y1*W); ctx.stroke(); }
function padRedraw(){ const ctx=PAD.ctx; if(!ctx) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,PAD.cv.width,PAD.cv.height); ctx.restore();
  for(const st of padStrokes(PAD.id)){ const c=st.c; if(c.length<3) continue; if(c.length===3){ padLine(ctx,st.t,c[0],c[1],c[0]+0.0005,c[1],c[2]); continue; }
    for(let i=3;i<c.length;i+=3) padLine(ctx,st.t,c[i-3],c[i-2],c[i],c[i+1],c[i+2]); } }
function padPt(e){ const r=PAD.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/PAD.W*1000)/1000, Math.round((e.clientY-r.top)/PAD.W*1000)/1000, Math.round((e.pressure||0.5)*100)/100]; }
function padAllowed(e){ return e.pointerType==="pen"||e.pointerType==="mouse"||(e.pointerType==="touch"&&ST.finger); }
function mountPad(id){
  const cv=$("#pad"); if(!cv) return; PAD.cv=cv; PAD.id=id; PAD.cur=null;
  cv.onpointerdown=e=>{ if(!padAllowed(e)) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} const pt=padPt(e); PAD.cur={t:PAD.tool==="eraser"?"e":"p",c:pt.slice()}; padLine(PAD.ctx,PAD.cur.t,pt[0],pt[1],pt[0]+0.0005,pt[1],pt[2]); };
  cv.onpointermove=e=>{ if(!PAD.cur||!padAllowed(e)) return; e.preventDefault(); const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(const ev of evs){ const pt=padPt(ev), c=PAD.cur.c, n=c.length; padLine(PAD.ctx,PAD.cur.t,c[n-3],c[n-2],pt[0],pt[1],pt[2]); c.push(pt[0],pt[1],pt[2]); } };
  const end=()=>{ if(!PAD.cur) return; padStrokes(id).push(PAD.cur); PAD.cur=null; save(); };
  cv.onpointerup=end; cv.onpointercancel=end; cv.onpointerleave=e=>{ if(PAD.cur&&e.pointerType!=="pen") end(); };
  cv.oncontextmenu=e=>e.preventDefault();
  const bar=cv.previousElementSibling;
  bar.querySelectorAll("[data-tool]").forEach(b=>{ b.onclick=()=>{ PAD.tool=b.dataset.tool; bar.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b)); }; });
  bar.querySelector('[data-act="undo"]').onclick=()=>{ padStrokes(id).pop(); save(); padRedraw(); };
  bar.querySelector('[data-act="clear"]').onclick=()=>{ if(!padStrokes(id).length||confirm("이 문제의 풀이 메모를 지울까요?")){ ST.ink[id]={strokes:[]}; save(); padRedraw(); } };
  bar.querySelector('[data-act="finger"]').onclick=function(){ ST.finger=!ST.finger; save(); this.classList.toggle("on",ST.finger); };
  if(window.ResizeObserver){ PAD.ro=new ResizeObserver(()=>padResize()); PAD.ro.observe(cv); }
  setTimeout(padResize,30);
}

/* v7: 보기는 빌드 때 섞인다(quizmix). 저장값 = 원문 순서 k → 화면 칸 찾기 */
const ckey=(c,i)=>String(c&&c.k!=null?c.k:i), cpick=(s,my)=>(s.choices||[]).findIndex((c,i)=>my!=null&&my!==""&&ckey(c,i)===String(my));
function openAns(s){
  let lb=$("#anslb"); if(!lb){ lb=document.createElement("div"); lb.id="anslb"; $("#stage").appendChild(lb); }
  const my=(ST.answer||{})[s.id]; const mc=Array.isArray(s.choices)&&s.choices.length>0;
  const mi=mc?cpick(s,my):-1; const mine= mc ? (mi>=0?'<span class="num">'+(mi+1)+'</span>번 — '+s.choices[mi].html:'') : esc(my||"");
  lb.innerHTML='<div class="ans-top"><span class="kicker">'+esc(s.qn)+'</span><span class="verdict '+(ST.correct[s.id]===true?"ok":ST.correct[s.id]===false?"bad":"")+'">'+(ST.correct[s.id]===true?"정답":ST.correct[s.id]===false?"오답":"내 답")+'</span><button class="src-x" id="ansX" aria-label="닫기">✕</button></div>'+
    '<div class="myans-show"><div class="kicker">내 답</div><div class="myans-txt">'+mine+'</div></div>'+
    '<div class="ans"><div class="kicker">답 · 풀이</div>'+s.ans+'</div>';
  lb.classList.add("on"); $("#ansX").onclick=()=>lb.classList.remove("on"); typeset(lb);
}
/* ---------- 상단 진행점 (파트 안의 단계 · 시험 언급은 핑크) ---------- */
function renderTop(s){
  const inPart=s.part?SLIDES.filter(x=>x.part===s.part&&x.type!=="cover"&&x.type!=="result"):[];
  $("#progress").innerHTML=inPart.map(x=>'<span class="dot'+(ST.done[x.id]?" done":"")+(Array.isArray(x.exam)&&x.exam.length?" exam":"")+(x.id===s.id?" cur":"")+'"></span>').join("");
  const p=partOf(s.part); $("#chapter").textContent=p?("파트 "+p.n+" · "+String(p.title).replace(/[\s★]+$/,"")):"일반물리학2 · 중간고사 대비 26 전류와 저항 · 27 회로 (교재 선행)";
  $("#pos").textContent=(ST.idx+1)+" / "+SLIDES.length;
}

/* ---------- 힌트: 문제 장에서는 그 파트의 한 줄 요약, 개념 장에서는 없음 ---------- */
function hintFor(s){ const p=partOf(s.part); if(s.type==="q"&&p&&p.hint) return p.hint; return null; }

function render(){
  const i=Math.max(0,Math.min(ST.idx,SLIDES.length-1)); ST.idx=i; const s=SLIDES[i]; const body=$("#body"), act=$("#act");
  body.dataset.ready="false"; $("#hintBox").hidden=true; { const al=$("#anslb"); if(al) al.classList.remove("on"); } /* V4-ANSLB */
  act.innerHTML=""; ST.skip=ST.skip||{}; $("#doneTag").textContent=ST.skip[s.id]?"건너뜀":ST.done[s.id]?"완료":"";
  body.classList.remove("q-mode","rev","scrollable"); closePad(); $("#padBtn").hidden=true;
  renderTop(s); if(s.scroll) body.classList.add("scrollable");   /* --soft 임시 덱: 넘친 장만 스크롤 */

            '<div class="sub">'+(QUIZ?'문제 '+num(SLIDES.filter(x=>x.type==="q").length)+'개':'파트 '+num(PARTS.length)+'개 · 문제 '+num(SLIDES.filter(x=>x.type==="q").length)+'개')+'</div></div>';

    $("#ok").onclick=()=>{ const was=!!ST.done[s.id]; ST.done[s.id]=true; save(); render(); if(!was) ev("read",{sid:s.id,n:pNd(s),clean:true}); };

      '<div class="mu"><div class="mu-mem"><div class="mu-h">암기</div><ul>'+li(s.mem)+'</ul></div>'+

  } else if(s.type==="q"){
    const rev=!!ST.revealed[s.id];

    const choiceHTML=()=>'<div class="choices'+(rev?" rev":"")+'">'+s.choices.map((c,i)=>{ const sel=my!=null&&my!==""&&String(my)===ckey(c,i); const cls=(sel?" sel":"")+(rev?(c.ok?" ok":(sel?" bad":"")):"");
      return '<button class="choice'+cls+'" data-ci="'+i+'"'+(rev?" disabled":"")+'><span class="cn">'+(i+1)+'</span><span class="ct">'+c.html+'</span></button>'; }).join("")+'</div>';
    body.innerHTML=examHTML(s)+'<div class="kicker">파트 '+num(s.part)+'</div><h2><span class="q-kind">'+s.kind+'</span>'+esc(s.qn)+'</h2><div class="qbody">'+s.html+'</div>'+

    if(rev){ if(ST.correct[s.id]!==true) openAns(s); /* V5A: 정답이면 풀이 판을 띄우지 않는다 (아토 2026-09-21) */ const sa=$("#showAns"); if(sa) sa.onclick=()=>openAns(s); }
    closePad(); $("#padBtn").hidden=false;
    if(mc&&!rev){
      /* V5A: 보기를 누르는 순간 제출·채점 (아토 2026-09-21 "객관식은 고르면 바로 정답으로 제출") */
      act.innerHTML='';

    } else if(mc&&rev){
      const c=ST.correct[s.id];
      act.innerHTML='<span class="verdict '+(c?"ok":"bad")+'">'+(c?"정답":"오답 — 풀이를 읽고 다시")+'</span><button class="btn xs" id="retry1">다시 풀기</button>';
      $("#retry1").onclick=()=>{ delete ST.revealed[s.id]; delete ST.done[s.id]; delete ST.correct[s.id]; delete ST.answer[s.id]; save(); render(); };
    } else if(!rev){
      act.innerHTML='<button class="btn primary" id="reveal" disabled>답 확인</button>';
      const ta=$("#myans"), rb=$("#reveal");
      const sync=()=>{ ST.answer[s.id]=ta.value; rb.disabled=!ta.value.trim(); };
      ta.oninput=sync; ta.onchange=()=>{ sync(); save(); }; sync();
      rb.onclick=()=>{ if(!ta.value.trim()){ ta.focus(); return; } ST.answer[s.id]=ta.value.trim(); ST.revealed[s.id]=true; save(); render(); };
      ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); rb.click(); } };
      setTimeout(()=>{ try{ ta.focus({preventScroll:true}); }catch(e){} },50);
    } else {
      const c=ST.correct[s.id];
      act.innerHTML='<button class="btn" id="yes">맞았어요'+(c===true?" ✓":"")+'</button><button class="btn" id="no">틀렸어요 · 다시'+(c===false?" ✓":"")+'</button>';
      $("#yes").onclick=()=>{ ST.correct[s.id]=true; ST.done[s.id]=true; save(); render(); ev("quiz",{qid:s.id,ok:true,n:qNd(s)}); };
      $("#no").onclick=()=>{ ST.correct[s.id]=false; ST.done[s.id]=true; save(); render(); ev("quiz",{qid:s.id,ok:false,n:qNd(s)}); };
    }
  } else if(s.type==="result"){
    /* V6B-RESULT: 정답·오답·안 푼 3칸 + 숫자 기준 + 틀린 문제 목록 + 주버튼 하나 (브리프 v49 r3 §3) */
    const sc=partScore(s.part);
    const qs=SLIDES.filter(x=>x.type==="q"&&x.part===s.part&&!ST.skip[x.id]);
    const wrong=qs.filter(q=>ST.correct[q.id]===false), left=qs.filter(q=>!ST.done[q.id]||ST.correct[q.id]==null&&!ST.revealed[q.id]);
    const okN=qs.filter(q=>ST.correct[q.id]===true).length;
    const passB=sc.b.n===0||sc.b.ok===sc.b.n, needA=Math.ceil(sc.a.n*2/3), passA=sc.a.n===0||sc.a.ok>=needA;
    const rule=(sc.b.n?'기초 '+sc.b.n+'문제 전부 정답':'')+(sc.b.n&&sc.a.n?' + ':'')+(sc.a.n?'응용 '+sc.a.n+'문제 중 '+needA+'문제 이상':'');
    body.classList.add("scrollable");
    body.innerHTML='<div class="kicker">파트 '+num(s.part)+' 결과</div><h1>'+esc(String(s.title).replace(/[\s★]+$/,""))+'</h1>'+
      '<div class="score"><div class="c ok"><b>'+okN+'</b>정답</div><div class="c bad"><b>'+wrong.length+'</b>오답</div><div class="c"><b>'+left.length+'</b>안 푼 문제</div></div>'+
      '<p class="rs-rule">통과 기준: '+esc(rule||'문제 없음')+' · 지금 '+(passB&&passA?'<b class="rs-pass">통과</b>':'<b class="rs-fail">미달</b>')+' (기초 '+sc.b.ok+'/'+sc.b.n+' · 응용 '+sc.a.ok+'/'+sc.a.n+')</p>'+
      (wrong.length?'<div class="rs-list"><div class="kicker">틀린 문제</div>'+wrong.map(q=>'<button class="rs-q" data-go="'+q.id+'"><span class="q-kind">'+esc(q.kind||"")+'</span>'+esc(q.qn||q.id)+'</button>').join("")+'</div>':'')+
      (left.length&&!wrong.length?'<div class="rs-list"><div class="kicker">안 푼 문제</div>'+left.map(q=>'<button class="rs-q" data-go="'+q.id+'"><span class="q-kind">'+esc(q.kind||"")+'</span>'+esc(q.qn||q.id)+'</button>').join("")+'</div>':'');
    body.querySelectorAll(".rs-q").forEach(b=>{ b.onclick=()=>startFrom(b.dataset.go,"at"); });
    const nextPart=PARTS.find(p=>p.n===s.part+1);
    let primary;
    if(wrong.length) primary='<button class="btn primary" id="rsGo">틀린 문제 복습</button>';
    else if(left.length) primary='<button class="btn primary" id="rsGo">안 푼 문제 풀기</button>';
    else primary='<button class="btn primary" id="rsGo">'+(nextPart?'다음 파트':'전체 결과')+'</button>';
    act.innerHTML='<button class="btn xs" id="back">이 파트 처음으로</button>'+(wrong.length&&left.length?'<button class="btn xs" id="rsLeft">안 푼 문제 '+left.length+'개</button>':'')+primary;
    $("#back").onclick=()=>{ ST.idx=SLIDES.findIndex(x=>x.id==="p"+s.part+"-cover"); save(); render(); };
    const rl=$("#rsLeft"); if(rl) rl.onclick=()=>startFrom(left[0].id,"at");
    $("#rsGo").onclick=()=>{ ST.done[s.id]=true; save();
      if(wrong.length){ wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; }); save(); startFrom(wrong[0].id,"at"); }
      else if(left.length) startFrom(left[0].id,"at");
      else go(1); };
  } else if(s.type==="final"){
    const qs=SLIDES.filter(x=>x.type==="q"&&!(ST.skip||{})[x.id]); const ok=qs.filter(q=>ST.correct[q.id]===true).length, done=qs.filter(q=>ST.done[q.id]).length;
    const wrong=SLIDES.filter(x=>x.type==="q"&&ST.correct[x.id]===false);
    body.innerHTML='<div class="kicker">전체 결과</div><h1>일반물리학2 · 중간고사 대비 26 전류와 저항 · 27 회로 (교재 선행)</h1><div class="score"><div class="c"><b>'+ok+'/'+qs.length+'</b>정답 · 푼 문제 '+num(done)+'</div><div class="c"><b>'+wrong.length+'</b>틀린 문제</div></div>'+
      '<p>'+(wrong.length?'틀린 문제: '+wrong.slice(0,6).map(w=>esc(w.qn)).join(", ")+(wrong.length>6?' 외 '+num(wrong.length-6)+'개':''):'틀린 문제가 없습니다.')+'</p>';
    act.innerHTML='<button class="btn xs" id="retry"'+(wrong.length?"":" disabled")+'>틀린 문제만 다시</button><button class="btn xs" id="first">처음으로</button>';
    $("#retry").onclick=()=>{ if(!wrong.length) return; wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; }); ST.idx=SLIDES.indexOf(wrong[0]); save(); render(); };
    $("#first").onclick=()=>{ ST.idx=0; save(); render(); };

  }
  renderSrc(s);
  const h=hintFor(s); const hb=$("#hintBtn"); hb.disabled=!h; hb.title=h?"":"이 장에는 힌트가 없습니다";
  const nxt=$("#next"), prv=$("#prev");
  const unlocked=i<SLIDES.length-1;
  nxt.disabled=!unlocked; nxt.classList.toggle("undone",!ST.done[s.id]&&unlocked); prv.disabled=(i===0);
  typeset(body);
  body.scrollTop=0;
}
function go(d){ const n=ST.idx+d; if(n<0||n>=SLIDES.length) return; ST.idx=n; save(); render(); }
$("#next").onclick=()=>go(1); $("#prev").onclick=()=>go(-1);
$("#padBtn").onclick=()=>{ const s=SLIDES[ST.idx]; if(s.type!=="q") return; if($("#padPanel").classList.contains("on")) closePad(); else openPad(s.id); };
$("#hintBtn").onclick=()=>{ const s=SLIDES[ST.idx], h=hintFor(s); if(!h) return; const hb=$("#hintBox"); if(!hb.hidden){ hb.hidden=true; return; } hb.innerHTML='<div class="kicker">힌트 · 파트 '+num(s.part)+' 한 줄</div><div>'+esc(h)+'</div>'; hb.hidden=false; typeset(hb); };
document.addEventListener("keydown",e=>{ const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||(t&&t.isContentEditable)) return; if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); });

/* ---------- 검사 모드 (#check): 전 장을 돌며 오버플로·raw LaTeX를 잰다. 빌드 뒤 헤드리스로 캡처해 확인한다 ---------- */
async function runCheck(){
  try{ await document.fonts.ready; }catch(e){}
  const body=$("#body"); const fails=[]; const saved=JSON.stringify(ST);
  const foot=$("#foot"), stage=$("#stage");
  const measure=(tag)=>{ const over=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(body.scrollHeight>body.clientHeight||body.scrollWidth>body.clientWidth); const fo=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(foot.scrollWidth>foot.clientWidth||stage.scrollHeight>stage.clientHeight); const raw=body.dataset.raw==="1"; if(over||fo||raw) fails.push(SLIDES[ST.idx].id+tag+(over?" 넘침 "+body.scrollHeight+">"+body.clientHeight:"")+(fo?" 하단/무대 넘침":"")+(raw?" rawLaTeX":"")); };
  for(let i=0;i<SLIDES.length;i++){
    const s=SLIDES[i];
    ST.idx=i; delete ST.revealed[s.id]; render(); await new Promise(r=>setTimeout(r,20)); measure("");
    if(s.type==="q"){ /* 답 공개 상태 */ ST.revealed[s.id]=true; ST.answer[s.id]=Array.isArray(s.choices)&&s.choices.length?"0":"x"; ST.correct[s.id]=false; render(); await new Promise(r=>setTimeout(r,20)); measure(" [답공개]"); { const al=$("#anslb"); if(al&&al.classList.contains("on")){ const a=al.querySelector(".ans"); if(a&&(a.scrollHeight>a.clientHeight||al.scrollHeight>al.clientHeight)) fails.push(s.id+" [풀이판] 넘침 "+a.scrollHeight+">"+a.clientHeight); al.classList.remove("on"); } }
      /* 힌트 열림 */ $("#hintBtn").click(); await new Promise(r=>setTimeout(r,20)); const hb=$("#hintBox"); if(!hb.hidden&&hb.getBoundingClientRect().top<body.getBoundingClientRect().top) fails.push(s.id+" [힌트] 상단 침범"); hb.hidden=true; }
  }
  try{ ST=JSON.parse(saved); }catch(e){}
  const c=$("#chk"); c.style.display="block";
  c.innerHTML='<h2 id="chkTitle">검사: '+SLIDES.length+'장 · 실패 '+fails.length+'</h2><pre id="chkList">'+esc(fails.join("\n"))+'</pre>';
  window.CHECK_RESULT={n:SLIDES.length,fails};
}
/* V5B-CTX: 학습 질문 패널용 문맥 (아토 2026-09-21). 앱이 gen 을 주기 전엔 보내지 않는다 — 이전 창의 늦은 메시지를 앱이 gen 으로 걸러낸다 */
let CTX_GEN=null;
const ctxPlain=(h,n)=>{ const t=String(h||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim(); return t.length>n?t.slice(0,n)+"…(잘림)":t; };
function postCtx(){
  try{
    if(location.hash==="#check"||!CTX_GEN||window.parent===window) return;
    const s=SLIDES[Math.max(0,Math.min(ST.idx,SLIDES.length-1))]; if(!s) return;
    const p=s.part?PARTS.find(x=>x.n===s.part):null; const li=lastInfo()||{};
    const msg={type:"mc-slide",v:1,gen:CTX_GEN,deck:DECK_ID,title:String(document.title).slice(0,80),sid:s.id,stype:s.type,part:s.part||null,
      partTitle:p?String(p.title).replace(/[\s★]+$/,"").slice(0,60):"",label:String(li.where||"").slice(0,80),q:null};
    if(s.type==="q"){
      const rev=!!ST.revealed[s.id], mc=Array.isArray(s.choices)&&s.choices.length>0, my=(ST.answer||{})[s.id];
      msg.q={qn:String(s.qn||"").slice(0,80),kind:String(s.kind||"").slice(0,10),text:ctxPlain(s.html,600),
        choices:mc?s.choices.slice(0,6).map(c=>ctxPlain(c.html,120)):[],
        my: my==null||my===""?null:(mc?(cpick(s,my)>=0?ctxPlain(s.choices[cpick(s,my)].html,120):null):String(my).slice(0,200)),
        revealed:rev, correct: rev&&typeof ST.correct[s.id]==="boolean"?ST.correct[s.id]:null,
        answer: rev&&mc?(s.choices.map((c,i)=>c.ok?i+1:0).filter(Boolean).join(",")||null):null};
    } else if(s.type==="concept"||s.type==="mu"){ msg.q={qn:String(s.title||"").slice(0,80),kind:s.type==="mu"?"암기·이해":"개념",text:ctxPlain(s.type==="mu"?[].concat(s.mem||[],s.und||[]).join(" · "):s.html,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }
    window.parent.postMessage(msg, location.origin);
  }catch(e){}
}
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; postCtx(); } });
const _renderV5b=render; render=function(){ _renderV5b(); postCtx(); };
function boot(){
  { const m=/^#(from|done|at)=([\w-]+)(?:,pad)?$/.exec(location.hash||""); if(m){ startFrom(m[2], m[1]==="from"?"skip":m[1]); if(/,pad$/.test(location.hash)) setTimeout(()=>$("#padBtn").click(),300); return; } }
  if(location.hash==="#check"){ runCheck(); return; }
  if(location.hash==="#resume"){ render(); save(); return; }   /* V5A: 저장된 위치 그대로 */
  render();
  if(location.hash==="#src"){ setTimeout(()=>{ const b=$("#srcs .src-th"); if(b) b.click(); },400); }
}
function fontCheck(){ try{ const ok=document.fonts.check("22px 'Gowun Dodum'"); if(ok){ const w0=$("#fontWarn"); if(w0) w0.hidden=true; return; } setTimeout(fontCheck,3000); /* V6B: 늦게 로드되면 경고를 지운다 */ if(!ok){ let w=$("#fontWarn"); if(!w){ w=document.createElement("div"); w.id="fontWarn"; $("#stage").appendChild(w); } w.hidden=false; w.textContent="손글씨 글꼴을 불러오지 못해 대체 글꼴로 보입니다. 인터넷 연결을 확인하고 새로 고침하세요."; } }catch(e){} }
function whenReady(){ if(window.renderMathInElement){ fontCheck(); boot(); } else setTimeout(whenReady,40); }
document.addEventListener("DOMContentLoaded",()=>{ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(whenReady,whenReady); });
</script>
