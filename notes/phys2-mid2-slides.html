const SLIDES=[{"id": "start", "type": "start"}, {"id": "jump", "type": "jump", "part": 0}, {"id": "p1-cover", "type": "cover", "part": 1, "no": "파트 1 · 교재 선행", "title": "26장 ① 전류와 전류밀도 — 전하가 흐르는 양", "star": false}, {"id": "p1-concept", "type": "concept", "part": 1, "title": "전류 = 1초에 단면을 지나는 전하량, 전류밀도 = 넓이 1 m²당 전류 (1/7)", "html": "<div class=\"why\">21~25장은 멈춰 있는 전하(정전기학)였다. 26장부터 전하가 도선 속을 흐른다. 도선 양 끝에 전위차를 걸면 도선 안에 전기장이 생기고, 그 전기장이 자유전자를 한 방향으로 민다. 이 흐름이 전류다.</div>\n  <div class=\"concept\"><p><b>[중2 과학 복습] 전류의 세기</b> = 1초 동안 도선의 한 단면을 지나가는 전하의 양. 단위는 암페어 A이고 \\(1\\,\\mathrm A=1\\,\\mathrm{C/s}\\)다.</p></div>", "exam": [{"level": "범위", "when": "9/18 40:48", "quote": "중간고사 범위는 27장 RC 회로까지, 28장은 제외"}]}, {"id": "p1-concept-2", "type": "concept", "part": 1, "title": "전류 = 1초에 단면을 지나는 전하량, 전류밀도 = 넓이 1 m²당 전류 (2/7)", "html": "<div class=\"concept\"><p><b>정의</b>: 아주 짧은 시간 \\(dt\\) 동안 단면을 지나간 전하가 \\(dq\\)이면 \\[i=\\frac{dq}{dt}\\] 거꾸로 전하량은 \\(q=\\int_0^t i\\,dt\\), 전류가 일정하면 \\(q=it\\)다.</p></div><div class=\"concept\"><p><b>전류의 방향</b> = <b>양전하가 알짜로 움직이는 방향</b>. 저항·도선 속에서는 높은 전위 → 낮은 전위로 흐른다(전류를 내보내는 — 방전 중인 — 전지 속에서는 거꾸로 낮은 쪽 → 높은 쪽으로 밀려 올라간다). 금속에서 실제로 움직이는 것은 음전하인 전자라서 <b>전자는 전류와 반대 방향</b>으로 간다.</p></div><div class=\"concept\"><p>전류는 <b>스칼라</b>(수 하나로 나타내는 양)다. 도선을 따라 화살표로 흐르는 쪽만 표시할 뿐, 벡터(크기와 방향이 함께 있는 양)처럼 성분으로 나눠 더하지 않는다.</p></div>", "exam": []}, {"id": "p1-concept-3", "type": "concept", "part": 1, "title": "전류 = 1초에 단면을 지나는 전하량, 전류밀도 = 넓이 1 m²당 전류 (3/7)", "html": "<div class=\"concept\"><p><b>갈림길(접합점)</b>에서 전하는 생기거나 없어지지 않는다(전하 보존). 그래서 들어온 전류의 합 = 나간 전류의 합, 예를 들어 \\(i_0=i_1+i_2\\). 27장 전류법칙의 뿌리다.</p></div>", "exam": []}, {"id": "p1-concept-4", "type": "concept", "part": 1, "title": "전류 = 1초에 단면을 지나는 전하량, 전류밀도 = 넓이 1 m²당 전류 (4/7)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"wire\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 196\" width=\"560\" height=\"196\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><line x1=\"70\" y1=\"60\" x2=\"490\" y2=\"60\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"70\" y1=\"124\" x2=\"490\" y2=\"124\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><ellipse cx=\"70\" cy=\"92\" rx=\"12\" ry=\"32\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"2\"></ellipse><ellipse cx=\"490\" cy=\"92\" rx=\"12\" ry=\"32\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></ellipse><ellipse cx=\"250\" cy=\"92\" rx=\"12\" ry=\"32\" fill=\"rgba(255,77,141,.16)\" stroke=\"#FF4D8D\" stroke-width=\"2\"></ellipse><ellipse cx=\"370\" cy=\"92\" rx=\"12\" ry=\"32\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"></ellipse><text x=\"250\" y=\"48\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">단면 (넓이 A)</text><circle cx=\"288\" cy=\"78\" r=\"9\" fill=\"#fff\"></circle><circle cx=\"288\" cy=\"78\" r=\"9\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"></circle><text x=\"288\" y=\"81.2\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1971C2\">−</text><line x1=\"277\" y1=\"78\" x2=\"261\" y2=\"78\" stroke=\"#1971C2\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"></line><circle cx=\"318\" cy=\"106\" r=\"9\" fill=\"#fff\"></circle><circle cx=\"318\" cy=\"106\" r=\"9\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"></circle><text x=\"318\" y=\"109.2\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1971C2\">−</text><line x1=\"307\" y1=\"106\" x2=\"291\" y2=\"106\" stroke=\"#1971C2\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"></line><circle cx=\"344\" cy=\"80\" r=\"9\" fill=\"#fff\"></circle><circle cx=\"344\" cy=\"80\" r=\"9\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"></circle><text x=\"344\" y=\"83.2\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1971C2\">−</text><line x1=\"333\" y1=\"80\" x2=\"317\" y2=\"80\" stroke=\"#1971C2\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"></line><text x=\"482\" y=\"48\" font-size=\"12\" fill=\"#1971C2\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">← 전자의 유동속도 v<tspan baseline-shift=\"sub\" font-size=\"72%\">d</tspan></text><circle cx=\"140\" cy=\"104\" r=\"9\" fill=\"#fff\"></circle><circle cx=\"140\" cy=\"104\" r=\"9\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"></circle><text x=\"140\" y=\"107.2\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1971C2\">−</text><line x1=\"129\" y1=\"104\" x2=\"113\" y2=\"104\" stroke=\"#1971C2\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"></line><circle cx=\"196\" cy=\"80\" r=\"9\" fill=\"#fff\"></circle><circle cx=\"196\" cy=\"80\" r=\"9\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"></circle><text x=\"196\" y=\"83.2\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1971C2\">−</text><line x1=\"185\" y1=\"80\" x2=\"169\" y2=\"80\" stroke=\"#1971C2\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"></line><circle cx=\"440\" cy=\"104\" r=\"9\" fill=\"#fff\"></circle><circle cx=\"440\" cy=\"104\" r=\"9\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"></circle><text x=\"440\" y=\"107.2\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1971C2\">−</text><line x1=\"429\" y1=\"104\" x2=\"413\" y2=\"104\" stroke=\"#1971C2\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"></line><line x1=\"250\" y1=\"146\" x2=\"370\" y2=\"146\" stroke=\"#8A97A6\" stroke-width=\"1.2\"></line><line x1=\"250\" y1=\"142\" x2=\"250\" y2=\"150\" stroke=\"#8A97A6\" stroke-width=\"1.2\"></line><line x1=\"370\" y1=\"142\" x2=\"370\" y2=\"150\" stroke=\"#8A97A6\" stroke-width=\"1.2\"></line><text x=\"310.0\" y=\"162\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">v<tspan baseline-shift=\"sub\" font-size=\"72%\">d</tspan> dt</text><line x1=\"40\" y1=\"178\" x2=\"120\" y2=\"178\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"128\" y=\"183\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전류 i (전자와 반대)</text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">시간 \\(dt\\) 동안 단면 A를 지나는 전자는 길이 \\(v_d\\,dt\\) 원기둥 안에 있던 전자: \\(dN=nAv_d\\,dt\\).</figcaption></figure></div>", "exam": []}, {"id": "p1-concept-5", "type": "concept", "part": 1, "title": "전류 = 1초에 단면을 지나는 전하량, 전류밀도 = 넓이 1 m²당 전류 (5/7)", "html": "<div class=\"concept\"><p><b>전류밀도</b> \\(\\vec J\\): 단면의 넓이 1 m²마다 흐르는 전류. 단면에서 고르게 흐르면 \\[J=\\frac{i}{A}\\quad[\\mathrm{A/m^2}]\\] 방향이 있는 <b>벡터</b>이고 양전하가 가는 방향을 가리킨다. 고르지 않으면 \\(i=\\int\\vec J\\cdot d\\vec A\\) — 내적 \\(\\vec J\\cdot d\\vec A\\)는 작은 넓이 \\(dA\\)를 수직으로 지나가는 성분만 골라 더한다는 뜻이다.</p></div><div class=\"concept\"><p><b>유동속도</b> \\(v_d\\)(drift velocity): 전자 하나하나는 약 \\(10^6\\) m/s로 마구 움직이지만 평균하면 0이다. 전기장이 걸리면 전자 무리 전체가 한쪽으로 아주 느리게 밀려가는데, 그 평균 속도가 \\(v_d\\)다.</p></div>", "exam": []}, {"id": "p1-concept-6", "type": "concept", "part": 1, "title": "전류 = 1초에 단면을 지나는 전하량, 전류밀도 = 넓이 1 m²당 전류 (6/7)", "html": "<div class=\"concept\"><p><b>수밀도</b> \\(n\\) = 부피 1 m³ 안의 전하 운반자(자유전자) 개수, \\(n=dN/dV\\). 그림처럼 \\(dt\\) 동안 단면을 지나는 전자는 길이 \\(v_d\\,dt\\), 넓이 \\(A\\)인 원기둥 안에 있던 것이다.</p></div><div class=\"concept\"><p><b>교수님 유도</b>: \\(dN=n\\,dV=nAv_d\\,dt\\) → 전하량 \\(dq=e\\,dN=neAv_d\\,dt\\) → \\[i=\\frac{dq}{dt}=neAv_d,\\qquad J=\\frac{i}{A}=nev_d\\] 여기서 \\(e=1.6\\times10^{-19}\\) C은 기본 전하의 <b>크기</b>(양수)이고 전자 한 개의 전하는 \\(-e\\)다. 그래서 벡터로는 \\(\\vec J=-ne\\vec v_d\\) — 전자의 유동속도는 전류밀도와 반대 방향이다.</p></div>", "exam": []}, {"id": "p1-concept-7", "type": "concept", "part": 1, "title": "전류 = 1초에 단면을 지나는 전하량, 전류밀도 = 넓이 1 m²당 전류 (7/7)", "html": "<div class=\"concept\"><p><b>크기 감각</b>: 구리(\\(n\\approx8.5\\times10^{28}\\ \\mathrm{/m^3}\\)) 1 mm² 도선에 1 A → \\(v_d\\approx7\\times10^{-5}\\) m/s. 1 m 가는 데 4시간쯤 걸린다. 그래도 스위치를 켜면 불이 거의 바로 켜진다. 전기장의 변화가 빛에 가까운 속도로 도선을 따라 전해져, 도선 곳곳의 전자가 곧바로 차례차례 밀리기 시작하기 때문이다(스위치 쪽 전자가 전구까지 달려오는 것이 아니다).</p></div><div class=\"one\">한 줄: \\(i=dq/dt\\) [A] · 전류 방향 = 양전하 방향(전자와 반대) · \\(J=i/A\\) · \\(i=neAv_d\\), \\(J=nev_d\\).</div>\n  ", "exam": []}, {"id": "p1-mu", "type": "mu", "part": 1, "title": "26장 ① 전류와 전류밀도 — 전하가 흐르는 양", "mem": ["\\(i=\\dfrac{dq}{dt}\\), \\(1\\,\\mathrm A=1\\,\\mathrm{C/s}\\)", "\\(J=\\dfrac iA\\) [A/m²] — 벡터", "\\(i=neAv_d\\), \\(J=nev_d\\) (교수님 필수문제 ①②)", "전류 방향 = 양전하 방향, 전자는 반대"], "und": ["\\(dN=nAv_d\\,dt\\): 왜 길이 \\(v_d\\,dt\\) 원기둥인지", "\\(v_d\\)가 그렇게 느린데 불이 바로 켜지는 이유", "전류는 스칼라, 전류밀도는 벡터인 이유"]}, {"id": "p1-b1", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-1 · 전류의 정의", "html": "<p>도선의 한 단면을 2.0 s 동안 6.0 C의 전하가 일정하게 지나갔다. 전류의 세기는?</p>", "ans": "전류가 일정하면 \\(i=\\dfrac{q}{t}=\\dfrac{6.0\\ \\mathrm C}{2.0\\ \\mathrm s}=3.0\\) A. 곱하면 12가 나오는데, 단위가 C·s라 전류가 아니다.", "choices": [{"html": "12 A", "ok": false, "k": 1}, {"html": "3.0 A", "ok": true, "k": 0}, {"html": "6.0 A", "ok": false, "k": 3}, {"html": "0.33 A", "ok": false, "k": 2}], "exam": []}, {"id": "p1-b2", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-2 · 전류의 방향", "html": "<p>구리 도선 안에서 자유전자가 오른쪽으로 움직인다. 전류의 방향과, 도선 두 끝 중 전위가 높은 쪽은?</p>", "ans": "① 전류 방향 = 양전하가 가는 방향 = 전자와 반대 → <b>왼쪽</b>. ② 전류는 높은 전위에서 낮은 전위로 흐르므로, 왼쪽으로 흐른다는 것은 <b>오른쪽 끝이 높다</b>는 뜻이다. (음전하인 전자는 거꾸로 전위가 높은 쪽으로 끌려간다 — 같은 결론.)", "choices": [{"html": "전류는 오른쪽 · 왼쪽 끝의 전위가 높다", "ok": false, "k": 1}, {"html": "전류는 왼쪽 · 왼쪽 끝의 전위가 높다", "ok": false, "k": 3}, {"html": "전류는 왼쪽 · 오른쪽 끝의 전위가 높다", "ok": true, "k": 0}, {"html": "전류는 오른쪽 · 오른쪽 끝의 전위가 높다", "ok": false, "k": 2}], "exam": []}, {"id": "p1-b3", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-3 · 접합점", "html": "<p>도선의 갈림길로 5.0 A가 들어오고, 갈래 하나로 2.0 A가 나간다. 나머지 갈래로 나가는 전류는?</p>", "ans": "전하 보존: 들어온 합 = 나간 합 → \\(5.0=2.0+i\\) → \\(i=3.0\\) A. 전류는 스칼라라 그냥 더하고 뺀다.", "choices": [{"html": "7.0 A", "ok": false, "k": 1}, {"html": "10 A", "ok": false, "k": 3}, {"html": "2.5 A", "ok": false, "k": 2}, {"html": "3.0 A", "ok": true, "k": 0}], "exam": []}, {"id": "p1-b4", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-4 · 전류밀도", "html": "<p>반지름 1.0 mm인 원형 단면 도선에 3.14 A가 단면 전체에 고르게 흐른다. 전류밀도의 크기 \\(J\\)는?</p>", "ans": "① mm를 m로: \\(r=1.0\\times10^{-3}\\) m. ② 넓이 \\(A=\\pi r^2=3.14\\times(10^{-3})^2=3.14\\times10^{-6}\\ \\mathrm{m^2}\\). ③ \\(J=\\dfrac{i}{A}=\\dfrac{3.14}{3.14\\times10^{-6}}=1.0\\times10^{6}\\ \\mathrm{A/m^2}\\). \\(r\\)를 제곱하지 않으면 \\(10^3\\)이 나온다.", "choices": [{"html": "\\(1.0\\times10^{6}\\ \\mathrm{A/m^2}\\)", "ok": true, "k": 0}, {"html": "\\(1.0\\times10^{9}\\ \\mathrm{A/m^2}\\)", "ok": false, "k": 3}, {"html": "\\(1.0\\times10^{3}\\ \\mathrm{A/m^2}\\)", "ok": false, "k": 1}, {"html": "\\(3.1\\times10^{6}\\ \\mathrm{A/m^2}\\)", "ok": false, "k": 2}], "exam": []}, {"id": "p1-b5", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-5 · 유동속도로 쓴 전류", "html": "<p>단위 부피당 \\(n\\)개의 전하 운반자(각 전하량 \\(q\\))가 유동속도 \\(v_d\\)로 움직이는, 단면적 \\(A\\)인 도선이 있다. 전류 \\(i\\)와 전류밀도 \\(J\\)는?</p>", "ans": "\\(dt\\) 동안 지나는 운반자 수 \\(dN=nAv_d\\,dt\\) → 전하 \\(dq=q\\,dN\\) → \\(i=dq/dt=nqAv_d\\). \\(J=i/A=nqv_d\\). 단위 확인: (1/m³)·C·m²·(m/s) = C/s = A.", "choices": [{"html": "\\(i=qv_d/(nA),\\ J=qv_d/n\\)", "ok": false, "k": 3}, {"html": "\\(i=nqAv_d,\\ J=nqv_d\\)", "ok": true, "k": 0}, {"html": "\\(i=nqv_d/A,\\ J=nqAv_d\\)", "ok": false, "k": 1}, {"html": "\\(i=nAv_d,\\ J=nv_d/q\\)", "ok": false, "k": 2}], "exam": []}, {"id": "p1-a6", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-1 · 유동속도의 크기", "html": "<p>한 변이 2.0 mm인 정사각형 단면의 구리 도선에 0.50 A의 전류가 흐른다. 구리의 자유전자 수밀도는 \\(n=8.5\\times10^{28}\\ \\mathrm{/m^3}\\), 기본 전하는 \\(e=1.6\\times10^{-19}\\) C이다. 전자의 유동속도 \\(v_d\\)를 구하고, 이 속도로 1.0 m를 가는 데 걸리는 시간을 구하라.</p>", "ans": "① 단면적 \\(A=(2.0\\times10^{-3})^2=4.0\\times10^{-6}\\ \\mathrm{m^2}\\). ② \\(i=neAv_d\\) 를 \\(v_d\\)에 대해 풀면 \\(v_d=\\dfrac{i}{neA}\\). ③ 분모 \\(neA=8.5\\times10^{28}\\times1.6\\times10^{-19}\\times4.0\\times10^{-6}=5.44\\times10^{4}\\) C/m. ④ \\(v_d=\\dfrac{0.50}{5.44\\times10^4}\\approx9.2\\times10^{-6}\\) m/s(약 9.2 μm/s). ⑤ 시간 \\(t=\\dfrac{1.0}{9.2\\times10^{-6}}\\approx1.1\\times10^{5}\\) s — 약 30시간.", "choices": null, "exam": []}, {"id": "p1-a7", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-2 · 굵기가 다른 도선 잇기", "html": "<p>반지름 1.0 mm인 구리 도선의 끝에 반지름 0.50 mm인 구리 도선을 용접해 이었다. 이 도선에 2.0 A가 흐를 때 각 도선의 전류밀도를 구하고, 가는 도선 속 유동속도가 굵은 도선의 몇 배인지 구하라.</p>", "ans": "① 전하 보존: 이어진 도선이라 두 곳의 전류는 똑같이 2.0 A. ② 굵은 쪽 \\(A_1=\\pi(1.0\\times10^{-3})^2=3.14\\times10^{-6}\\ \\mathrm{m^2}\\) → \\(J_1=2.0/(3.14\\times10^{-6})\\approx6.4\\times10^{5}\\ \\mathrm{A/m^2}\\). ③ 가는 쪽 \\(A_2=\\pi(0.50\\times10^{-3})^2=7.85\\times10^{-7}\\ \\mathrm{m^2}\\) → \\(J_2\\approx2.5\\times10^{6}\\ \\mathrm{A/m^2}\\). ④ 같은 구리라 \\(n\\)이 같으므로 \\(v_d=J/ne\\propto J\\) → 반지름 절반 → 넓이 1/4 → <b>4배</b>. (물이 좁은 관에서 빨라지는 것과 같다.)", "choices": null, "exam": []}, {"id": "p1-result", "type": "result", "part": 1, "title": "26장 ① 전류와 전류밀도 — 전하가 흐르는 양"}, {"id": "p2-cover", "type": "cover", "part": 2, "no": "파트 2 · 교재 선행", "title": "26장 ② 저항 · 비저항 · 옴의 법칙", "star": false}, {"id": "p2-concept", "type": "concept", "part": 2, "title": "저항은 물체의 성질, 비저항은 물질의 성질 — R = ρL/A (1/9)", "html": "<div class=\"why\">같은 전압을 걸어도 도선마다 흐르는 전류가 다르다. 전류를 방해하는 정도가 저항이다. 저항은 모양·크기에 따라 달라지는 <b>물체</b>의 성질이고, 비저항은 구리냐 철이냐로 정해지는 <b>물질</b>의 성질이다.</div>\n  <div class=\"concept\"><p><b>[중2 과학 복습] 옴의 법칙</b> 전압 = 전류 × 저항. 저항의 정의는 \\[R=\\frac{V}{i}\\quad[\\Omega=\\mathrm{V/A}]\\] 1 Ω은 1 V를 걸 때 1 A가 흐르는 저항이다.</p></div><div class=\"concept\"><p><b>교수님 표기</b>: 거시적 옴의 법칙 \\(V=iR\\)(도선 전체) ↔ 미시적 옴의 법칙 \\(|\\vec J|=\\sigma|\\vec E|\\)(도선 속 한 점). 물질 속 한 점에서는 전기장이 전류밀도를 만든다.</p></div>", "exam": []}, {"id": "p2-concept-2", "type": "concept", "part": 2, "title": "저항은 물체의 성질, 비저항은 물질의 성질 — R = ρL/A (2/9)", "html": "<div class=\"concept\"><p><b>비저항</b> \\(\\rho\\): \\(\\vec E=\\rho\\vec J\\)의 비례 상수, 단위 Ω·m. <b>전기전도도(전도율)</b> \\(\\sigma=1/\\rho\\), 단위 \\((\\Omega\\cdot\\mathrm m)^{-1}\\). 방향에 따라 성질이 같은 물질(등방성)에서 성립한다.</p></div>", "exam": []}, {"id": "p2-concept-3", "type": "concept", "part": 2, "title": "저항은 물체의 성질, 비저항은 물질의 성질 — R = ρL/A (3/9)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"rod\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 170\" width=\"560\" height=\"170\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><line x1=\"120\" y1=\"50\" x2=\"440\" y2=\"50\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"120\" y1=\"104\" x2=\"440\" y2=\"104\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><ellipse cx=\"120\" cy=\"77\" rx=\"11\" ry=\"27\" fill=\"rgba(255,77,141,.14)\" stroke=\"#1F2A44\" stroke-width=\"2\"></ellipse><ellipse cx=\"440\" cy=\"77\" rx=\"11\" ry=\"27\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></ellipse><text x=\"120\" y=\"36\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">넓이 A</text><line x1=\"200\" y1=\"77\" x2=\"360\" y2=\"77\" stroke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"></line><text x=\"280.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\">E</text><line x1=\"30\" y1=\"77\" x2=\"100\" y2=\"77\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"65.0\" y=\"68.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i</text><line x1=\"460\" y1=\"77\" x2=\"530\" y2=\"77\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"495.0\" y=\"68.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i</text><line x1=\"120\" y1=\"128\" x2=\"440\" y2=\"128\" stroke=\"#8A97A6\" stroke-width=\"1.2\"></line><line x1=\"120\" y1=\"124\" x2=\"120\" y2=\"132\" stroke=\"#8A97A6\" stroke-width=\"1.2\"></line><line x1=\"440\" y1=\"124\" x2=\"440\" y2=\"132\" stroke=\"#8A97A6\" stroke-width=\"1.2\"></line><text x=\"280.0\" y=\"144\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">길이 L</text><text x=\"120\" y=\"162\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전위 높음 (a)</text><text x=\"440\" y=\"162\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전위 낮음 (b)</text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">균일한 도선: \\(V_a-V_b=EL\\), \\(E=\\rho J\\), \\(J=i/A\\) → \\(R=\\rho L/A\\).</figcaption></figure></div>", "exam": []}, {"id": "p2-concept-4", "type": "concept", "part": 2, "title": "저항은 물체의 성질, 비저항은 물질의 성질 — R = ρL/A (4/9)", "html": "<div class=\"concept\"><p><b>유도(교수님 순서)</b>: 길이 \\(L\\), 단면적 \\(A\\)인 도선의 두 끝 a(높은 쪽)·b(낮은 쪽)에 전위차를 걸면 안의 전기장은 균일하고, 전압 강하의 크기는 \\(\\Delta V=V_a-V_b=EL\\)이다(a → b로 가며 전위가 \\(EL\\)만큼 내려간다). 여기에 \\(E=\\rho J\\), \\(J=i/A\\)를 넣으면 \\(\\Delta V=\\rho\\frac{i}{A}L\\). 양변을 \\(i\\)로 나누면 \\[R=\\frac{\\Delta V}{i}=\\rho\\frac{L}{A}\\]</p></div><div class=\"concept\"><p>길이에 비례, 단면적에 반비례한다. 물 호스로 생각하면 길고 가는 호스일수록 물이 덜 흐르는 것과 같다.</p></div>", "exam": []}, {"id": "p2-concept-5", "type": "concept", "part": 2, "title": "저항은 물체의 성질, 비저항은 물질의 성질 — R = ρL/A (5/9)", "html": "<div class=\"concept\"><p><b>비저항 크기</b>(Ω·m, 20 °C): 은 \\(1.6\\times10^{-8}\\) · 구리 \\(1.7\\times10^{-8}\\) · 철 \\(9.7\\times10^{-8}\\)(금속) ≪ 순수 규소 \\(2.5\\times10^{3}\\)(반도체) ≪ 유리 \\(10^{10}\\sim10^{14}\\)(절연체).</p></div><div class=\"concept\"><p><b>온도</b>: 금속의 비저항은 온도가 오르면 거의 직선으로 커진다. \\[\\rho-\\rho_0=\\rho_0\\alpha(T-T_0)\\] \\(\\alpha\\) = 비저항의 온도 계수, \\(T_0\\)는 보통 293 K(20 °C). 반도체는 반대로 온도가 오르면 작아진다.</p></div>", "exam": []}, {"id": "p2-concept-6", "type": "concept", "part": 2, "title": "저항은 물체의 성질, 비저항은 물질의 성질 — R = ρL/A (6/9)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"vi\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><line x1=\"40\" y1=\"100\" x2=\"250\" y2=\"100\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><line x1=\"145\" y1=\"172\" x2=\"145\" y2=\"22\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><text x=\"246\" y=\"118\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">V</text><text x=\"136\" y=\"30\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i</text><path d=\"M75.0 158.0 L215.0 42.0\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"2.4\"></path><text x=\"145\" y=\"190\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">옴성 (저항기): 직선</text><line x1=\"320\" y1=\"100\" x2=\"530\" y2=\"100\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><line x1=\"425\" y1=\"172\" x2=\"425\" y2=\"22\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><text x=\"526\" y=\"118\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">V</text><text x=\"416\" y=\"30\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i</text><path d=\"M330.0 100.0 L425.0 100.0 L428.0 99.8 L431.0 99.5 L434.0 99.2 L437.0 98.8 L440.0 98.3 L443.0 97.7 L446.0 97.0 L449.0 96.1 L452.0 94.9 L455.0 93.6 L458.0 91.8 L461.0 89.7 L464.0 87.1 L467.0 83.9 L470.0 79.9 L473.0 75.0 L476.0 68.9 L479.0 61.5 L482.0 52.3 L485.0 40.9\" fill=\"none\" stroke=\"#E03131\" stroke-width=\"2.4\"></path><text x=\"425\" y=\"190\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">비옴성 (다이오드): 곡선</text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">옴의 법칙을 따르는 소자는 \\(V\\)–\\(i\\) 그래프가 원점을 지나는 직선(기울기 일정 → \\(R\\) 일정).</figcaption></figure></div>", "exam": []}, {"id": "p2-concept-7", "type": "concept", "part": 2, "title": "저항은 물체의 성질, 비저항은 물질의 성질 — R = ρL/A (7/9)", "html": "<div class=\"concept\"><p><b>옴의 법칙의 정확한 뜻</b>: 소자에 흐르는 전류가 걸어 준 전위차에 <b>비례</b>한다는 성질, 즉 \\(R\\)이 전압의 크기·방향과 무관하다는 것이다. 모든 소자가 따르지는 않는다. 도선·저항기는 온도가 일정한 범위에서 따르고(옴성), 다이오드는 따르지 않는다(비옴성). \\(R=V/i\\)는 정의라서 비옴성 소자에도 쓸 수 있지만 그때 \\(R\\)은 전압마다 달라진다.</p></div>", "exam": []}, {"id": "p2-concept-8", "type": "concept", "part": 2, "title": "저항은 물체의 성질, 비저항은 물질의 성질 — R = ρL/A (8/9)", "html": "<div class=\"concept\"><p><b>미시적 관점(교수님 「전도의 미시적 이론」)</b>: 전하 운반자(질량 \\(m\\), 전하 \\(q\\))에 전기력 \\(qE\\)와, 속도에 비례하는 마찰(충돌) 효과 \\(-bv\\)(\\(b\\): 마찰 계수)가 작용한다. \\[m\\frac{dv}{dt}=qE-bv\\] 시간이 지나 두 힘이 같아지면 속도가 일정해진다(종속도): \\(v_d=\\dfrac{qE}{b}\\).</p></div>", "exam": []}, {"id": "p2-concept-9", "type": "concept", "part": 2, "title": "저항은 물체의 성질, 비저항은 물질의 성질 — R = ρL/A (9/9)", "html": "<div class=\"concept\"><p>완화시간 \\(\\tau=m/b\\)(전자가 충돌 없이 움직이는 평균 시간)로 쓰면 \\(v_d=\\dfrac{q\\tau}{m}E\\). 이것을 \\(J=nqv_d\\)에 넣으면 \\(J=\\dfrac{nq^2\\tau}{m}E\\) → \\[\\rho=\\frac{m}{nq^2\\tau}\\] 온도가 일정해 \\(n\\)과 \\(\\tau\\)가 변하지 않는 범위에서는 \\(\\rho\\)가 전기장과 무관하므로 금속은 옴의 법칙을 따른다.</p></div><div class=\"one\">한 줄: \\(R=V/i\\) [Ω] · \\(R=\\rho L/A\\) · \\(\\vec E=\\rho\\vec J\\) (\\(\\sigma=1/\\rho\\)) · \\(\\rho-\\rho_0=\\rho_0\\alpha(T-T_0)\\) · 옴성 = 전류가 전압에 비례.</div>\n  ", "exam": []}, {"id": "p2-mu", "type": "mu", "part": 2, "title": "26장 ② 저항 · 비저항 · 옴의 법칙", "mem": ["\\(R=V/i\\), \\(1\\ \\Omega=1\\ \\mathrm{V/A}\\)", "\\(R=\\rho\\dfrac LA\\), \\(\\sigma=\\dfrac1\\rho\\), \\(E=\\rho J\\)", "\\(\\rho-\\rho_0=\\rho_0\\alpha(T-T_0)\\)", "비저항: 금속 ≪ 반도체 ≪ 절연체"], "und": ["저항(물체)과 비저항(물질)의 차이", "\\(\\Delta V=EL\\)에서 \\(R=\\rho L/A\\)가 나오는 과정", "옴의 법칙이 모든 소자의 법칙이 아닌 이유", "마찰력이 속도에 비례하면 \\(v_d\\propto E\\)가 되는 이유"]}, {"id": "p2-b1", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-1 · 저항의 정의", "html": "<p>어떤 저항기에 12 V를 걸었더니 0.50 A가 흘렀다. 저항은?</p>", "ans": "\\(R=\\dfrac{V}{i}=\\dfrac{12}{0.50}=24\\ \\Omega\\). 곱하면 6.0이 나오는데, 그것은 전력(W)이다.", "choices": [{"html": "12.5 Ω", "ok": false, "k": 3}, {"html": "0.042 Ω", "ok": false, "k": 2}, {"html": "6.0 Ω", "ok": false, "k": 1}, {"html": "24 Ω", "ok": true, "k": 0}], "exam": []}, {"id": "p2-b2", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-2 · 늘인 도선의 저항", "html": "<p>단면이 고른 금속 도선을 부피는 그대로 둔 채 길이만 2배로 늘였다(비저항은 변하지 않고 단면은 여전히 고르다). 저항은 처음의 몇 배가 되는가?</p>", "ans": "부피 \\(=AL\\)이 일정하므로 길이가 2배면 단면적은 1/2배. \\(R=\\rho\\dfrac{L}{A}\\)에서 분자 2배, 분모 1/2배 → \\(2\\div\\frac12=\\) <b>4배</b>. 비저항이 변하지 않는다고 했으니 \\(\\rho\\)는 그대로.", "choices": [{"html": "1/2배", "ok": false, "k": 3}, {"html": "1배(변화 없음)", "ok": false, "k": 2}, {"html": "4배", "ok": true, "k": 0}, {"html": "2배", "ok": false, "k": 1}], "exam": []}, {"id": "p2-b3", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-3 · 미시적 옴의 법칙", "html": "<p>비저항 \\(\\rho=2.0\\times10^{-8}\\ \\Omega\\cdot\\mathrm m\\)인 도선 안의 전류밀도가 \\(J=5.0\\times10^{6}\\ \\mathrm{A/m^2}\\)이다. 도선 안 전기장의 크기 \\(E\\)는?</p>", "ans": "\\(E=\\rho J=2.0\\times10^{-8}\\times5.0\\times10^{6}=0.10\\) V/m. 나누면(\\(J/\\rho\\)) 전도도 식과 헷갈린 것.", "choices": [{"html": "0.10 V/m", "ok": true, "k": 0}, {"html": "10 V/m", "ok": false, "k": 3}, {"html": "\\(2.5\\times10^{14}\\) V/m", "ok": false, "k": 1}, {"html": "\\(4.0\\times10^{-15}\\) V/m", "ok": false, "k": 2}], "exam": []}, {"id": "p2-b4", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-4 · 옴성 판정", "html": "<p>두 소자에 전압을 바꿔 걸며 전류를 쟀다. 소자 가: (2 V, 4.0 A) · (4 V, 8.0 A) · (6 V, 12 A). 소자 나: (2 V, 1.0 A) · (4 V, 1.5 A) · (6 V, 1.8 A). 옴의 법칙을 따르지 않는 소자는?</p>", "ans": "\\(R=V/i\\)를 계산한다. 가: 0.5 · 0.5 · 0.5 Ω → 일정(옴성). 나: 2.0 · 2.7 · 3.3 Ω → 전압마다 달라짐(비옴성).", "choices": [{"html": "소자 가", "ok": false, "k": 1}, {"html": "둘 다 따른다", "ok": false, "k": 3}, {"html": "둘 다", "ok": false, "k": 2}, {"html": "소자 나", "ok": true, "k": 0}], "exam": []}, {"id": "p2-b5", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-5 · 온도와 비저항", "html": "<p>상온 근처에서 금속 도선의 온도를 올리면 비저항은?</p>", "ans": "\\(\\rho-\\rho_0=\\rho_0\\alpha(T-T_0)\\), 금속은 \\(\\alpha>0\\) → 온도가 오르면 원자 진동이 커져 전자가 더 자주 부딪힌다(완화시간 \\(\\tau\\) 감소). 작아지는 것은 반도체, 0이 되는 것은 초전도체.", "choices": [{"html": "작아진다", "ok": false, "k": 1}, {"html": "0이 된다", "ok": false, "k": 3}, {"html": "온도에 거의 비례해 커진다", "ok": true, "k": 0}, {"html": "변하지 않는다", "ok": false, "k": 2}], "exam": []}, {"id": "p2-a6", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-1 · 직육면체의 두 방향 저항", "html": "<p>크기가 2.0 cm × 2.0 cm × 40 cm인 탄소 막대가 있다(비저항 \\(\\rho=3.5\\times10^{-5}\\ \\Omega\\cdot\\mathrm m\\)). (가) 두 정사각형 면 사이의 저항과 (나) 마주 보는 두 직사각형 면 사이의 저항을 구하라.</p>", "ans": "전류가 지나가는 방향의 길이가 \\(L\\), 전류가 지나는 면의 넓이가 \\(A\\)다. (가) \\(L=0.40\\) m, \\(A=0.020\\times0.020=4.0\\times10^{-4}\\ \\mathrm{m^2}\\) → \\(R=3.5\\times10^{-5}\\times\\dfrac{0.40}{4.0\\times10^{-4}}=0.035\\ \\Omega\\). (나) \\(L=0.020\\) m, \\(A=0.020\\times0.40=8.0\\times10^{-3}\\ \\mathrm{m^2}\\) → \\(R=3.5\\times10^{-5}\\times\\dfrac{0.020}{8.0\\times10^{-3}}\\approx8.8\\times10^{-5}\\ \\Omega\\). 같은 막대라도 방향에 따라 400배 다르다 — 물체의 성질인 이유.", "choices": null, "exam": []}, {"id": "p2-a7", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-2 · 도선 속 전기장 · 전위차 · 저항", "html": "<p>반지름 1.0 mm, 길이 100 m인 구리 도선(비저항 \\(1.7\\times10^{-8}\\ \\Omega\\cdot\\mathrm m\\))에 2.0 A가 흐른다. (a) 도선 안 전기장의 크기 (b) 도선 양 끝의 전위차 (c) 도선의 저항을 구하라.</p>", "ans": "(a) 넓이 \\(A=\\pi(10^{-3})^2=3.14\\times10^{-6}\\ \\mathrm{m^2}\\) → \\(J=i/A=6.37\\times10^{5}\\ \\mathrm{A/m^2}\\) → \\(E=\\rho J=1.7\\times10^{-8}\\times6.37\\times10^{5}\\approx1.1\\times10^{-2}\\) V/m. (b) \\(\\Delta V=EL\\approx1.08\\times10^{-2}\\times100\\approx1.1\\) V. (c) \\(R=\\Delta V/i\\approx0.54\\ \\Omega\\). 검산: \\(R=\\rho L/A=(1.7\\times10^{-8}\\times100)/(3.14\\times10^{-6})\\approx0.54\\ \\Omega\\) ✓.", "choices": null, "exam": []}, {"id": "p2-result", "type": "result", "part": 2, "title": "26장 ② 저항 · 비저항 · 옴의 법칙"}, {"id": "p3-cover", "type": "cover", "part": 3, "no": "파트 3 · 교재 선행", "title": "26장 ③ 전력(일률)과 줄의 법칙 · 반도체 · 초전도체", "star": false}, {"id": "p3-concept", "type": "concept", "part": 3, "title": "P = iV — 저항에서는 P = i²R = V²/R (1/3)", "html": "<div class=\"why\">전류가 저항을 지나면 전하가 높은 전위에서 낮은 전위로 내려가며 전기 위치 에너지를 잃는다. 그 에너지가 열(전열기)·빛(전구)·운동(전동기)이 된다. 1초에 바뀌는 에너지가 전력(일률) \\(P\\)다.</div>\n  <div class=\"concept\"><p><b>유도</b>: 전하 \\(dq\\)가 전위차 \\(V\\)만큼 내려가면 잃는 위치 에너지는 \\(dU=dq\\,V\\)(24장 \\(U=qV\\)). 1초당으로 나누면 \\[P=\\frac{dU}{dt}=\\frac{dq}{dt}V=iV\\quad[\\mathrm W=\\mathrm{J/s}=\\mathrm{V\\cdot A}]\\] 교수님 표기로 「전기 에너지 전달률」. 저항·전동기·전구 어디에나 쓴다.</p></div>", "exam": []}, {"id": "p3-concept-2", "type": "concept", "part": 3, "title": "P = iV — 저항에서는 P = i²R = V²/R (2/3)", "html": "<div class=\"concept\"><p><b>줄의 법칙(저항 소모율)</b>: 저항에서는 \\(V=iR\\)를 넣어 \\[P=i^2R=\\frac{V^2}{R}\\] 이 에너지는 전부 열(줄 열)이 된다.</p></div><div class=\"concept\"><p><b>어느 식을 쓰나</b>: 전류가 고정이면(직렬로 같은 전류) \\(i^2R\\), 전압이 고정이면(병렬·같은 콘센트) \\(V^2/R\\). 같은 콘센트에 꽂는 전열기는 저항이 작을수록 더 뜨겁다.</p></div><div class=\"concept\"><p><b>에너지</b> = 전력 × 시간: \\(W=Pt\\). 전기 요금의 1 kWh = \\(1000\\ \\mathrm W\\times3600\\ \\mathrm s=3.6\\times10^{6}\\) J.</p></div><div class=\"concept\"><p><b>얼마나 변하나(교재 확인문제)</b>: \\(R\\) 고정에 전압 2배 → \\(V^2\\) 때문에 4배. \\(R\\) 고정에 전류 2배 → 4배. 전압 고정에 \\(R\\) 2배 → 1/2배. 전류 고정에 \\(R\\) 2배 → 2배.</p></div>", "exam": []}, {"id": "p3-concept-3", "type": "concept", "part": 3, "title": "P = iV — 저항에서는 P = i²R = V²/R (3/3)", "html": "<div class=\"concept\"><p><b>반도체</b>: 전하 운반자 수 \\(n\\)이 금속보다 훨씬 적어 비저항이 크다. 온도가 오르면 \\(n\\)이 늘어 비저항이 작아진다. 불순물을 넣어(도핑) \\(n\\)을 조절한 것이 트랜지스터·다이오드다.</p></div><div class=\"concept\"><p><b>초전도체</b>: 어떤 온도(임계 온도) 아래에서 비저항이 정확히 0이 된다. 전류가 열 손실 없이 흐른다(MRI 전자석 등).</p></div><div class=\"one\">한 줄: \\(P=iV\\)(모든 소자) · 저항은 \\(P=i^2R=V^2/R\\)(줄 열) · \\(W=Pt\\) · 초전도체는 임계 온도 아래 \\(\\rho=0\\).</div>\n  ", "exam": []}, {"id": "p3-mu", "type": "mu", "part": 3, "title": "26장 ③ 전력(일률)과 줄의 법칙 · 반도체 · 초전도체", "mem": ["\\(P=iV\\) [W], \\(1\\ \\mathrm W=1\\ \\mathrm{J/s}=1\\ \\mathrm{V\\cdot A}\\)", "\\(P=i^2R=V^2/R\\) (줄의 법칙)", "\\(W=Pt\\), 1 kWh \\(=3.6\\times10^6\\) J"], "und": ["\\(P=iV\\)가 \\(U=qV\\)에서 나오는 과정", "\\(i^2R\\)과 \\(V^2/R\\) 중 무엇이 고정인지 보고 고르기", "같은 전압에서 저항을 반으로 자르면 전력이 커지는 이유"]}, {"id": "p3-b1", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-1 · 전력의 정의", "html": "<p>12 V 전지가 회로에 2.0 A를 내보낸다. 전지가 회로에 공급하는 전력은?</p>", "ans": "\\(P=iV=2.0\\times12=24\\) W. 144는 \\(V^2\\)만 계산한 값이다.", "choices": [{"html": "24 W", "ok": true, "k": 0}, {"html": "6.0 W", "ok": false, "k": 1}, {"html": "0.17 W", "ok": false, "k": 3}, {"html": "144 W", "ok": false, "k": 2}], "exam": []}, {"id": "p3-b2", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-2 · 전압이 주어졌을 때", "html": "<p>저항 30 Ω인 전열선에 120 V를 걸었다. 소모 전력은?</p>", "ans": "전압이 주어졌으니 \\(P=\\dfrac{V^2}{R}=\\dfrac{120^2}{30}=480\\) W. 검산: \\(i=120/30=4.0\\) A → \\(i^2R=16\\times30=480\\) W ✓. 4.0은 전류다.", "choices": [{"html": "3600 W", "ok": false, "k": 2}, {"html": "480 W", "ok": true, "k": 0}, {"html": "120 W", "ok": false, "k": 3}, {"html": "4.0 W", "ok": false, "k": 1}], "exam": []}, {"id": "p3-b3", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-3 · 전압을 2배로", "html": "<p>저항은 그대로 두고 걸어 준 전압을 2배로 올렸다. 저항에서 소모되는 전력은 처음의 몇 배인가?</p>", "ans": "\\(P=V^2/R\\)에서 \\(V\\)가 2배 → \\(V^2\\)은 4배 → <b>4배</b>. 전류도 2배가 되므로 \\(P=iV\\)로 봐도 \\(2\\times2=4\\)배.", "choices": [{"html": "2배", "ok": false, "k": 1}, {"html": "1/2배", "ok": false, "k": 2}, {"html": "변하지 않는다", "ok": false, "k": 3}, {"html": "4배", "ok": true, "k": 0}], "exam": []}, {"id": "p3-b4", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-4 · 초전도체", "html": "<p>임계 온도보다 낮은 온도에서 초전도체의 비저항은?</p>", "ans": "초전도 상태의 비저항은 정확히 0 → 전류가 흘러도 \\(i^2R=0\\), 열이 생기지 않는다.", "choices": [{"html": "온도에 비례한다", "ok": false, "k": 2}, {"html": "무한대다", "ok": false, "k": 1}, {"html": "0이다", "ok": true, "k": 0}, {"html": "구리와 같다", "ok": false, "k": 3}], "exam": []}, {"id": "p3-a5", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-1 · 늘인 열선의 전력", "html": "<p>원통형 전열선을 100 V에 연결했더니 전력이 500 W였다. 부피는 그대로 두고 길이만 3배로 늘인 뒤 300 V에 연결하면 전력은 얼마인가? (비저항은 변하지 않고 단면은 고르다)</p>", "ans": "① 부피 \\(AL\\) 일정 → 길이 3배면 넓이 1/3배. ② \\(R=\\rho L/A\\) → \\(3\\div\\frac13=\\) 9배, \\(R'=9R\\). ③ 전압 3배 → \\(V'^2=9V^2\\). ④ \\(P'=\\dfrac{V'^2}{R'}=\\dfrac{9V^2}{9R}=P=500\\) W. 저항이 9배 되는 만큼 전압 제곱도 9배라 그대로다.", "choices": null, "exam": []}, {"id": "p3-a6", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-2 · 전열선 자르기", "html": "<p>길이 6.0 m, 저항 36 Ω인 니크롬선이 있다(단면이 고르고, 비저항은 온도에 따라 변하지 않는다고 한다). 콘센트 전압은 120 V다. (가) 선 전체를 120 V에 연결할 때 (나) 선을 반으로 잘라 한 토막만 120 V에 연결할 때 (다) 두 토막을 나란히(병렬) 120 V에 연결할 때 전체 전력을 각각 구하라.</p>", "ans": "전압이 120 V로 고정이므로 \\(P=V^2/R\\), \\(V^2=14400\\). (가) \\(R=36\\ \\Omega\\) → \\(P=14400/36=400\\) W. (나) 반 토막 \\(R=18\\ \\Omega\\) → \\(P=14400/18=800\\) W. (다) 두 토막 각각 800 W가 동시에 → 1600 W. 저항을 줄이면 같은 전압에서 전류가 커져 더 뜨거워진다(단, 선이 녹을 수 있다).", "choices": null, "exam": []}, {"id": "p3-result", "type": "result", "part": 3, "title": "26장 ③ 전력(일률)과 줄의 법칙 · 반도체 · 초전도체"}, {"id": "p4-cover", "type": "cover", "part": 4, "no": "파트 4 · 교재 선행", "title": "27장 ① 기전력 · 전압법칙(고리 규칙) · 단일 고리 회로", "star": false}, {"id": "p4-concept", "type": "concept", "part": 4, "title": "한 바퀴 돌면 전위 변화의 합은 0 — 부호 규칙 4가지 (1/8)", "html": "<div class=\"why\">저항에서는 전하가 전위를 내려가며 에너지를 잃는다. 회로가 계속 돌려면 누군가 전하를 다시 높은 전위로 올려 줘야 한다. 그 전하 펌프가 전지 같은 기전력 장치다. 회로 계산은 「한 바퀴 돌아 제자리에 오면 전위도 제자리」라는 한 문장에서 나온다.</div>\n  <div class=\"concept\"><p><b>기전력</b> \\(\\varepsilon\\)(교재는 ℰ로 쓴다): 기전력 장치가 전하 \\(dq\\)를 −극에서 +극으로 옮기며 해 준 일 \\(dW\\)에 대해 \\[\\varepsilon=\\frac{dW}{dq}\\quad[\\mathrm{J/C}=\\mathrm V]\\] 화학(전지)·빛(태양전지)·운동(발전기) 에너지를 전기 위치 에너지로 바꾼다. 회로 기호는 긴 가는 판이 +극, 짧은 굵은 판이 −극.</p></div>", "exam": []}, {"id": "p4-concept-2", "type": "concept", "part": 4, "title": "한 바퀴 돌면 전위 변화의 합은 0 — 부호 규칙 4가지 (2/8)", "html": "<div class=\"concept\"><p><b>이상적인 전지</b>는 내부저항이 0이라 두 극 사이 전위차가 늘 \\(\\varepsilon\\)이다. <b>실제 전지</b>는 이상적 \\(\\varepsilon\\)에 작은 내부저항 \\(r\\)이 직렬로 붙은 것으로 본다.</p></div><div class=\"concept\"><p><b>키르히호프 법칙(교수님 표)</b> ① 전류법칙(KIL, 접합점, 전하 보존): 한 점에 들어온 전류의 합 = 나간 전류의 합. 들어오는 것을 +, 나가는 것을 −로 세면 \\(\\sum i=0\\). ② 전압법칙(KVL, 고리, 에너지 보존): 닫힌 회로를 한 바퀴 돌며 소자마다 부호를 붙인 전위 변화를 더하면 \\(\\sum\\Delta V=0\\).</p></div><div class=\"concept\"><p>교수님 표의 \\(\\varepsilon=\\sum V\\)는 같은 말을 「기전력의 합 = 저항들에서 내려간 전위의 합」으로 쓴 것이다. 전압법칙은 닫힌 회로에만 쓴다.</p></div>", "exam": []}, {"id": "p4-concept-3", "type": "concept", "part": 4, "title": "한 바퀴 돌면 전위 변화의 합은 0 — 부호 규칙 4가지 (3/8)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"sign\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 172\" width=\"560\" height=\"172\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><text x=\"280\" y=\"20\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">초록 화살표 = 고리를 도는 방향</text><line x1=\"20\" y1=\"70\" x2=\"65.0\" y2=\"70.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"75.0\" y1=\"70.0\" x2=\"120\" y2=\"70\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"75.0\" y1=\"56.0\" x2=\"75.0\" y2=\"84.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"65.0\" y1=\"63.0\" x2=\"65.0\" y2=\"77.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"85.0\" y=\"53.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><line x1=\"30\" y1=\"104\" x2=\"110\" y2=\"104\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></line><text x=\"70\" y=\"136\" font-size=\"17\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+ε</text><text x=\"70\" y=\"158\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−극 → +극</text><line x1=\"160\" y1=\"70\" x2=\"205.0\" y2=\"70.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"215.0\" y1=\"70.0\" x2=\"260\" y2=\"70\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"205.0\" y1=\"56.0\" x2=\"205.0\" y2=\"84.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"215.0\" y1=\"63.0\" x2=\"215.0\" y2=\"77.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"195.0\" y=\"53.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><line x1=\"170\" y1=\"104\" x2=\"250\" y2=\"104\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></line><text x=\"210\" y=\"136\" font-size=\"17\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−ε</text><text x=\"210\" y=\"158\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+극 → −극</text><line x1=\"140\" y1=\"34\" x2=\"140\" y2=\"166\" stroke=\"#DDE3EA\" stroke-width=\"1\"></line><path d=\"M300.0 70.0 L330.0 70.0 L336.7 77.0 L343.3 63.0 L350.0 77.0 L356.7 63.0 L363.3 77.0 L370.0 70.0 L400.0 70.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"328\" y1=\"46\" x2=\"372\" y2=\"46\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"380\" y=\"40\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i</text><line x1=\"310\" y1=\"104\" x2=\"390\" y2=\"104\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></line><text x=\"350\" y=\"136\" font-size=\"17\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−iR</text><text x=\"350\" y=\"158\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전류와 같은 방향</text><line x1=\"280\" y1=\"34\" x2=\"280\" y2=\"166\" stroke=\"#DDE3EA\" stroke-width=\"1\"></line><path d=\"M440.0 70.0 L470.0 70.0 L476.7 77.0 L483.3 63.0 L490.0 77.0 L496.7 63.0 L503.3 77.0 L510.0 70.0 L540.0 70.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"512\" y1=\"46\" x2=\"468\" y2=\"46\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"520\" y=\"40\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i</text><line x1=\"450\" y1=\"104\" x2=\"530\" y2=\"104\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></line><text x=\"490\" y=\"136\" font-size=\"17\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+iR</text><text x=\"490\" y=\"158\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전류와 반대 방향</text><line x1=\"420\" y1=\"34\" x2=\"420\" y2=\"166\" stroke=\"#DDE3EA\" stroke-width=\"1\"></line></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">교수님 표기 \\(V=V_f-V_i\\): 지나간 뒤 전위 − 지나가기 전 전위. 한 바퀴 더하면 0(전압법칙).</figcaption></figure></div>", "exam": []}, {"id": "p4-concept-4", "type": "concept", "part": 4, "title": "한 바퀴 돌면 전위 변화의 합은 0 — 부호 규칙 4가지 (4/8)", "html": "<div class=\"concept\"><p><b>부호 규칙</b>: 고리를 도는 방향으로 소자를 지날 때 ① 전지를 −극 → +극으로: \\(+\\varepsilon\\) ② +극 → −극으로: \\(-\\varepsilon\\) ③ 저항을 전류와 같은 방향으로: \\(-iR\\)(전류는 높은 곳 → 낮은 곳) ④ 전류와 반대 방향으로: \\(+iR\\).</p></div><div class=\"concept\"><p><b>왜 0인가</b>: 전위는 위치마다 값이 하나로 정해진다(24장). 출발점으로 돌아오면 전위도 같으니 변화의 합은 0이다. 산을 한 바퀴 돌아 제자리에 오면 오르막 합 = 내리막 합인 것과 같다.</p></div>", "exam": []}, {"id": "p4-concept-5", "type": "concept", "part": 4, "title": "한 바퀴 돌면 전위 변화의 합은 0 — 부호 규칙 4가지 (5/8)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"loop\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 520 226\" width=\"520\" height=\"226\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M110.0 60.0 L110.0 84.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M110.0 84.0 L110.0 90.0 L117.0 94.7 L103.0 99.3 L117.0 104.0 L103.0 108.7 L117.0 113.3 L110.0 118.0 L110.0 124.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"96.0\" y=\"108.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r</text><line x1=\"110\" y1=\"124\" x2=\"110.0\" y2=\"139.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"110.0\" y1=\"149.0\" x2=\"110\" y2=\"164\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"96.0\" y1=\"139.0\" x2=\"124.0\" y2=\"139.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"103.0\" y1=\"149.0\" x2=\"117.0\" y2=\"149.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"131.0\" y=\"135.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"90.0\" y=\"148.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε</text><path d=\"M110.0 164.0 L110.0 190.0 L410.0 190.0 L410.0 60.0 L320.0 60.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M320.0 60.0 L280.0 60.0 L273.3 67.0 L266.7 53.0 L260.0 67.0 L253.3 53.0 L246.7 67.0 L240.0 60.0 L200.0 60.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"260.0\" y=\"46.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R</text><path d=\"M200.0 60.0 L110.0 60.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><rect x=\"60\" y=\"74\" width=\"88\" height=\"100\" rx=\"6\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"></rect><text x=\"104\" y=\"212\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">실제 전지 = ε + r</text><line x1=\"150\" y1=\"60\" x2=\"185\" y2=\"60\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"167.5\" y=\"51.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i</text><path d=\"M240.9 114.0 A 22 22 0 1 1 240.9 136.0\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></path><text x=\"262\" y=\"166\" font-size=\"12\" fill=\"#2F9E44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">고리 방향</text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">시계 방향으로 한 바퀴: \\(+\\varepsilon-ir-iR=0\\) → \\(i=\\dfrac{\\varepsilon}{R+r}\\).</figcaption></figure></div>", "exam": []}, {"id": "p4-concept-6", "type": "concept", "part": 4, "title": "한 바퀴 돌면 전위 변화의 합은 0 — 부호 규칙 4가지 (6/8)", "html": "<div class=\"concept\"><p><b>단일 고리</b>: 시계 방향으로 한 바퀴 → \\(+\\varepsilon-ir-iR=0\\) → \\[i=\\frac{\\varepsilon}{R+r}\\] <b>단자 전압</b>(전지 두 극 사이 실제 전위차): 전지가 전류를 내보낼 때(방전) \\(V=\\varepsilon-ir\\)로 \\(\\varepsilon\\)보다 작고, 다른 전지에 밀려 전류가 +극으로 들어갈 때(충전) \\(V=\\varepsilon+ir\\)로 \\(\\varepsilon\\)보다 크다.</p></div><div class=\"concept\"><p><b>에너지로 봐도 같다(교재 에너지 방법)</b>: 시간 \\(dt\\) 동안 전지가 한 일 \\(\\varepsilon\\,dq=\\varepsilon i\\,dt\\) = 저항들의 열 \\(i^2(R+r)\\,dt\\) → 같은 식.</p></div>", "exam": []}, {"id": "p4-concept-7", "type": "concept", "part": 4, "title": "한 바퀴 돌면 전위 변화의 합은 0 — 부호 규칙 4가지 (7/8)", "html": "<div class=\"concept\"><p><b>직렬 연결</b>: 같은 전류가 차례로 지난다. 한 바퀴 \\(\\varepsilon-iR_1-iR_2-iR_3=0\\) → \\(i=\\varepsilon/(R_1+R_2+R_3)\\) → \\[R_{eq}=R_1+R_2+R_3+\\cdots\\]</p></div><div class=\"concept\"><p><b>두 점 사이 전위차</b>: 한 점에서 다른 점까지 회로를 <b>아무 길로나</b> 따라가며 부호 규칙대로 더한다. \\(V_b-V_a\\) = (a에서 b까지 변화의 합). 어느 길로 가도 답이 같다(검산에 쓴다). 전류가 흐르지 않는 갈래의 저항은 전위 변화가 0.</p></div><div class=\"concept\"><p><b>일률</b>: 기전력 장치가 전하에 주는 일률 \\(P_{emf}=i\\varepsilon\\), 내부저항에서 열로 나가는 \\(P_r=i^2r\\), 바깥 회로로 가는 \\(P=iV\\) (\\(i\\varepsilon=i^2r+iV\\)).</p></div>", "exam": []}, {"id": "p4-concept-8", "type": "concept", "part": 4, "title": "한 바퀴 돌면 전위 변화의 합은 0 — 부호 규칙 4가지 (8/8)", "html": "<div class=\"one\">한 줄: \\(\\varepsilon=dW/dq\\) [V] · 한 바퀴 합 = 0 · 전지 −→+ \\(+\\varepsilon\\) · 저항을 전류 방향으로 \\(-iR\\) · \\(i=\\varepsilon/(R+r)\\) · 방전 단자 전압 \\(V=\\varepsilon-ir\\) · 직렬 \\(R_{eq}=\\sum R\\).</div>\n  ", "exam": []}, {"id": "p4-mu", "type": "mu", "part": 4, "title": "27장 ① 기전력 · 전압법칙(고리 규칙) · 단일 고리 회로", "mem": ["부호 4가지: −→+ \\(+\\varepsilon\\) · +→− \\(-\\varepsilon\\) · 전류 방향 \\(-iR\\) · 반대 \\(+iR\\)", "\\(i=\\dfrac{\\varepsilon}{R+r}\\), 단자 전압 방전 \\(V=\\varepsilon-ir\\) · 충전 \\(V=\\varepsilon+ir\\)", "직렬 \\(R_{eq}=R_1+R_2+\\cdots\\)", "\\(P_{emf}=i\\varepsilon\\), \\(P_r=i^2r\\)"], "und": ["전압법칙 = 에너지 보존(전위는 위치마다 하나)", "전류 방향을 반대로 가정해도 답이 음수로 나올 뿐인 이유", "단자 전압이 방전 때는 기전력보다 작고 충전 때는 큰 이유", "두 점 전위차를 어느 길로 구해도 같은 이유"]}, {"id": "p4-b1", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-1 · 기전력의 정의", "html": "<p>전지가 2.0 C의 전하를 −극에서 +극으로 옮기며 18 J의 일을 했다. 이 전지의 기전력은?</p>", "ans": "\\(\\varepsilon=\\dfrac{W}{q}=\\dfrac{18\\ \\mathrm J}{2.0\\ \\mathrm C}=9.0\\) V. 기전력은 전하 1 C당 해 준 일이다.", "choices": [{"html": "9.0 V", "ok": true, "k": 0}, {"html": "16 V", "ok": false, "k": 3}, {"html": "36 V", "ok": false, "k": 1}, {"html": "0.11 V", "ok": false, "k": 2}], "exam": []}, {"id": "p4-b2", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-2 · 저항을 지날 때", "html": "<p>고리를 도는 방향으로 저항 \\(R\\)을 지나는데, 그 저항에 흐르는 전류 \\(i\\)도 같은 방향이다. 전위 변화는?</p>", "ans": "전류는 높은 전위 → 낮은 전위로 흐른다. 전류와 같은 방향으로 가면 전위가 내려가므로 \\(-iR\\).", "choices": [{"html": "\\(+iR\\)", "ok": false, "k": 1}, {"html": "\\(-iR\\)", "ok": true, "k": 0}, {"html": "\\(-i/R\\)", "ok": false, "k": 3}, {"html": "0", "ok": false, "k": 2}], "exam": []}, {"id": "p4-b3", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-3 · 전지를 지날 때", "html": "<p>고리를 도는 방향으로 이상적인 전지(기전력 \\(\\varepsilon\\))를 +극에서 −극 쪽으로 지난다. 전위 변화는?</p>", "ans": "+극이 −극보다 전위가 \\(\\varepsilon\\)만큼 높다. 높은 쪽에서 낮은 쪽으로 가므로 \\(-\\varepsilon\\). 전류 방향과는 상관없다(이상적 전지).", "choices": [{"html": "\\(+\\varepsilon\\)", "ok": false, "k": 1}, {"html": "\\(-\\varepsilon\\)", "ok": true, "k": 0}, {"html": "0", "ok": false, "k": 2}, {"html": "\\(+2\\varepsilon\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p4-b4", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-4 · 내부저항과 단자 전압", "html": "<p>기전력 12 V, 내부저항 1.0 Ω인 전지에 5.0 Ω 저항을 연결했다. 회로의 전류와 전지의 단자 전압은?</p>", "ans": "① \\(i=\\dfrac{\\varepsilon}{R+r}=\\dfrac{12}{5.0+1.0}=2.0\\) A. ② 단자 전압 \\(V=\\varepsilon-ir=12-2.0\\times1.0=10\\) V(= \\(iR=2.0\\times5.0\\) ✓). 내부저항을 빼먹으면 2.4 A가 나온다.", "choices": [{"html": "2.0 A, 12 V", "ok": false, "k": 2}, {"html": "3.0 A, 9.0 V", "ok": false, "k": 3}, {"html": "2.4 A, 12 V", "ok": false, "k": 1}, {"html": "2.0 A, 10 V", "ok": true, "k": 0}], "exam": []}, {"id": "p4-b5", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-5 · 직렬 연결", "html": "<p>저항 \\(R_1&gt;R_2&gt;R_3\\)인 세 저항을 전지에 직렬로 연결했다. 옳은 것은?</p>", "ans": "직렬은 한 길이라 전류가 모두 같다(전하 보존). 전위차 \\(V=iR\\)는 \\(i\\)가 같으니 \\(R\\)이 큰 순서: \\(R_1\\) 양 끝이 가장 크다.", "choices": [{"html": "세 저항의 전류는 같고, 전위차는 \\(R_1\\) 양 끝이 가장 크다", "ok": true, "k": 0}, {"html": "전류는 \\(R_3\\)이 가장 크고, 전위차는 셋이 같다", "ok": false, "k": 1}, {"html": "전류는 \\(R_1\\)이 가장 작고, 전위차는 \\(R_3\\)이 가장 크다", "ok": false, "k": 3}, {"html": "전류와 전위차 모두 \\(R_1\\)이 가장 크다", "ok": false, "k": 2}], "exam": []}, {"id": "p4-a6", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-1 · 두 전지가 마주 보는 고리", "html": "<p>그림처럼 전지 1(기전력 6.0 V, 내부저항 1.0 Ω)과 전지 2(기전력 2.0 V, 내부저항 1.0 Ω)가 +극끼리 같은 쪽(위)을 향하게 연결되고, 위쪽 전선에 저항 \\(R=6.0\\ \\Omega\\)이 있다. (a) 회로의 전류 크기와 방향 (b) 전지 1과 전지 2 각각의 단자 전압을 구하라.</p><figure class=\"fig\" data-fig=\"q-twobat\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 540 206\" width=\"540\" height=\"206\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M130.0 56.0 L130.0 66.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"130\" y1=\"106\" x2=\"130.0\" y2=\"91.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"130.0\" y1=\"81.0\" x2=\"130\" y2=\"66\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"116.0\" y1=\"81.0\" x2=\"144.0\" y2=\"81.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"123.0\" y1=\"91.0\" x2=\"137.0\" y2=\"91.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"151.0\" y=\"77.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"110.0\" y=\"90.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> = 6.0 V</text><path d=\"M130.0 106.0 L130.0 116.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M130.0 116.0 L130.0 123.5 L137.0 129.3 L123.0 135.2 L137.0 141.0 L123.0 146.8 L137.0 152.7 L130.0 158.5 L130.0 166.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"116.0\" y=\"145.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> = 1.0 Ω</text><path d=\"M130.0 166.0 L130.0 190.0 L410.0 190.0 L410.0 166.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M410.0 166.0 L410.0 158.5 L417.0 152.7 L403.0 146.8 L417.0 141.0 L403.0 135.2 L417.0 129.3 L410.0 123.5 L410.0 116.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"424.0\" y=\"145.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 1.0 Ω</text><path d=\"M410.0 116.0 L410.0 106.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"410\" y1=\"106\" x2=\"410.0\" y2=\"91.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"410.0\" y1=\"81.0\" x2=\"410\" y2=\"66\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"396.0\" y1=\"81.0\" x2=\"424.0\" y2=\"81.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"403.0\" y1=\"91.0\" x2=\"417.0\" y2=\"91.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"389.0\" y=\"77.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"430.0\" y=\"90.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 2.0 V</text><path d=\"M410.0 66.0 L410.0 56.0 L320.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M320.0 56.0 L290.0 56.0 L283.3 63.0 L276.7 49.0 L270.0 63.0 L263.3 49.0 L256.7 63.0 L250.0 56.0 L220.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"270.0\" y=\"42.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R = 6.0 Ω</text><path d=\"M220.0 56.0 L130.0 56.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path></svg></figure>", "ans": "(a) 전지 1은 전류를 시계 방향(왼쪽 변 위로)으로, 전지 2는 반시계 방향(오른쪽 변 위로)으로 밀어 서로 반대다. 시계 방향 전류 \\(i\\)를 가정하고 왼쪽 아래에서 시계 방향으로 한 바퀴(그림 순서대로): \\(r_1\\)을 전류 방향으로 \\(-1.0i\\), 전지 1을 −→+로 \\(+6.0\\), \\(R\\)을 \\(-6.0i\\), 전지 2를 +→−로 \\(-2.0\\), \\(r_2\\)를 \\(-1.0i\\) → \\(6.0-2.0-8.0i=0\\) → \\(i=0.50\\) A, 양수라 가정대로 <b>시계 방향</b>. (b) 전지 1: 전류가 −극에서 +극으로 나오므로 \\(V_1=\\varepsilon_1-ir_1=6.0-0.50=5.5\\) V. 전지 2: 전류가 +극으로 들어가 거꾸로 밀리므로(충전되는 쪽) \\(V_2=\\varepsilon_2+ir_2=2.0+0.50=2.5\\) V. 검산: 바깥 저항 전위차 \\(iR=3.0\\) V \\(=V_1-V_2\\) ✓.", "choices": null, "exam": []}, {"id": "p4-a7", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-2 · 열린 단자 사이 전위차", "html": "<p>그림에서 기전력 \\(\\varepsilon=9.0\\) V인 이상적 전지와 저항 \\(R_1=1.0\\ \\Omega\\), \\(R_2=2.0\\ \\Omega\\)이 고리를 이룬다. 점 P에서 기전력 \\(\\varepsilon'=2.0\\) V인 이상적 전지(+극이 단자 a 쪽)를 거쳐 단자 a로, 점 Q에서 저항 \\(R_3=5.0\\ \\Omega\\)을 거쳐 단자 b로 선이 나와 있고 a·b에는 아무것도 연결되어 있지 않다. \\(\\Delta V_{ab}=V_b-V_a\\)를 구하라.</p><figure class=\"fig\" data-fig=\"q-open\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 520 222\" width=\"520\" height=\"222\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M90.0 186.0 L90.0 150.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"90\" y1=\"150\" x2=\"90.0\" y2=\"135.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"90.0\" y1=\"125.0\" x2=\"90\" y2=\"110\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"76.0\" y1=\"125.0\" x2=\"104.0\" y2=\"125.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"83.0\" y1=\"135.0\" x2=\"97.0\" y2=\"135.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"111.0\" y=\"121.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"70.0\" y=\"134.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε = 9.0 V</text><path d=\"M90.0 110.0 L90.0 50.0 L130.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M130.0 50.0 L155.0 50.0 L161.7 57.0 L168.3 43.0 L175.0 57.0 L181.7 43.0 L188.3 57.0 L195.0 50.0 L220.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"175.0\" y=\"36.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> = 1.0 Ω</text><path d=\"M220.0 50.0 L280.0 50.0 L280.0 80.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M280.0 80.0 L280.0 98.0 L287.0 104.7 L273.0 111.3 L287.0 118.0 L273.0 124.7 L287.0 131.3 L280.0 138.0 L280.0 156.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"266.0\" y=\"122.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 2.0 Ω</text><path d=\"M280.0 156.0 L280.0 186.0 L90.0 186.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"280\" cy=\"50\" r=\"3.6\" fill=\"#1F2A44\"></circle><text x=\"273\" y=\"43\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">P</text><circle cx=\"280\" cy=\"186\" r=\"3.6\" fill=\"#1F2A44\"></circle><text x=\"273\" y=\"203\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">Q</text><path d=\"M280.0 50.0 L330.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><line x1=\"330\" y1=\"50\" x2=\"350.0\" y2=\"50.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"360.0\" y1=\"50.0\" x2=\"380\" y2=\"50\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"360.0\" y1=\"36.0\" x2=\"360.0\" y2=\"64.0\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"350.0\" y1=\"43.0\" x2=\"350.0\" y2=\"57.0\" stroke=\"#1F2A44\" stroke-width=\"4.5\"></line><text x=\"370.0\" y=\"33.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+</text><text x=\"355.0\" y=\"77.4\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ε' = 2.0 V</text><path d=\"M380.0 50.0 L456.0 50.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"460\" cy=\"50\" r=\"4\" fill=\"#fff\" stroke=\"#1F2A44\" stroke-width=\"2\"></circle><text x=\"471\" y=\"54.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a</text><path d=\"M280.0 186.0 L330.0 186.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M330.0 186.0 L350.0 186.0 L356.7 193.0 L363.3 179.0 L370.0 193.0 L376.7 179.0 L383.3 193.0 L390.0 186.0 L410.0 186.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><text x=\"370.0\" y=\"210.4\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan> = 5.0 Ω</text><path d=\"M410.0 186.0 L456.0 186.0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><circle cx=\"460\" cy=\"186\" r=\"4\" fill=\"#fff\" stroke=\"#1F2A44\" stroke-width=\"2\"></circle><text x=\"471\" y=\"190.55\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b</text></svg></figure>", "ans": "① a·b가 열려 있으니 그 두 갈래에는 전류가 없다. 전류는 고리에만: \\(i=\\dfrac{9.0}{1.0+2.0}=3.0\\) A(시계 방향, \\(R_2\\)를 P → Q로 내려감). ② \\(V_P-V_Q=iR_2=6.0\\) V. ③ P → a: 전지 \\(\\varepsilon'\\)을 −극 → +극으로 지나므로 \\(V_a=V_P+2.0\\). ④ Q → b: \\(R_3\\)에 전류가 없으니 \\(V_b=V_Q\\). ⑤ \\(V_b-V_a=V_Q-V_P-2.0=-6.0-2.0=\\) <b>−8.0 V</b>(a가 8.0 V 높다).", "choices": null, "exam": []}, {"id": "p4-result", "type": "result", "part": 4, "title": "27장 ① 기전력 · 전압법칙(고리 규칙) · 단일 고리 회로"}, {"id": "p5-cover", "type": "cover", "part": 5, "no": "파트 5 · 교재 선행", "title": "27장 ② 다중 고리 회로 · 병렬 · 전류계와 전압계", "star": false}, {"id": "p5-concept", "type": "concept", "part": 5, "title": "미지 전류 수만큼 식을 세운다 — 전류법칙 + 전압법칙 (1/6)", "html": "<div class=\"why\">갈림길이 있는 회로에는 갈래마다 전류가 다르다. 모르는 전류가 몇 개인지 세고, 그 수만큼 식을 전류법칙(접합점)과 전압법칙(고리)으로 만든 뒤 연립해서 푼다.</div>\n  <div class=\"concept\"><p><b>전류법칙(접합점 규칙)</b>: 한 접합점에 들어온 전류의 합 = 나간 전류의 합. 전하가 쌓이지도 사라지지도 않기 때문이다(전하 보존).</p></div>", "exam": []}, {"id": "p5-concept-2", "type": "concept", "part": 5, "title": "미지 전류 수만큼 식을 세운다 — 전류법칙 + 전압법칙 (2/6)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"sp\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 208\" width=\"560\" height=\"208\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><circle cx=\"30\" cy=\"96\" r=\"4\" fill=\"
