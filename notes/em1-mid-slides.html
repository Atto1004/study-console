<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공업수학1 · 중간고사 대비 (1장 1계 ODE · 2.1~2.3 · 2.5 오일러-코시)</title>
<!-- 학습게임 지침(학습게임_미적분2.md) v4 템플릿 · 오타 디자인 검토(2026-09-17, RED 14건) 반영
     폰트 2종: 본문 손글씨(Nanum Pen Script, display=block) + 수식·숫자 정자(KaTeX). 5색 고정. 16:10. 상단 진행점·챕터명·n/N, 하단 [힌트] [확인/다음]. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 5색 고정 (지침 §2) */
  --memory:#FFE45C; --caution:#E03131; --concept:#1971C2; --exam:#FF4D8D; --example:#2F9E44;
  /* 무채색 — 종이·글자·선 (의미색 아님) */
  --paper:#FFFFFF; --ink:#111111; --muted:#5F5F5F; --line:#D8D8D8; --soft:#F5F5F5; --bg:#EDEDED;
  /* 폰트 2종 (지침 §1) */
  --font-hand:'Nanum Pen Script','NanumPen',sans-serif;
  --font-num:'KaTeX_Main','Times New Roman',serif;
  /* 글자 크기 3단계 (지침 §1) */
  --fs-title:31px; --fs-body:22px; --fs-note:17px;
}
*{box-sizing:border-box}
:where(h1,h2,h3,h4,p,ul,ol,li,dl,dt,dd,pre,blockquote,figure,figcaption,table,th,td,button,input,textarea,label){margin:0;padding:0;text-indent:0;word-break:keep-all;overflow-wrap:break-word}
html,body{height:100%;width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-hand);font-size:var(--fs-body);line-height:1.45;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
body{display:grid;place-items:center;padding:12px}
.katex{font-size:1em}
#stage{position:relative;width:min(calc(100vw - 24px),calc((100dvh - 24px) * 1.6));aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
/* 상단: 진행점 · 챕터명 · n/N */
#top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) auto;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:var(--fs-note)}
#progress{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.dot{flex:0 0 12px;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.dot.done{background:var(--ink)}
.dot.exam{border-color:var(--exam);background:var(--exam)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
#chapter{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pos{font-family:var(--font-num);white-space:nowrap}
/* 작업 영역 */
#body{min-height:0;overflow:hidden;padding:18px 24px 12px;font-size:var(--fs-body);line-height:1.45}
#body[data-ready="false"]{visibility:hidden}
#body.scrollable{overflow:auto}   /* 시작 위치 장만 — 학습 내용이 아니라 목록이라 스크롤 허용 */
#body h1,#body h2{font-size:var(--fs-title);line-height:1.2;margin-bottom:8px}
#body h3{font-size:var(--fs-body)}
.num{font-family:var(--font-num)}
#fontWarn{position:absolute;left:22px;right:22px;top:58px;border:2px solid var(--caution);background:var(--paper);padding:6px 12px;font-size:var(--fs-note);z-index:12}
#fontWarn[hidden]{display:none}
#body .kicker{font-size:var(--fs-note);color:var(--muted)}
#body p,#body li{margin:0}
#body p+p{margin-top:6px}
#body ul,#body ol{padding-left:22px}
#body :is(.why,.concept,.one,.say,.extra),.ans,.myans-show,.mu>div{margin:8px 0 0;padding:10px 14px}
#body .why,#body .concept{border:2px solid var(--concept)}
#body .say{border-left:4px solid var(--concept);background:var(--soft)}
#body .say b{color:var(--concept)}
#body .one{border-left:4px solid var(--ink);background:var(--soft)}
#body .term{color:var(--concept);border-bottom:1px dashed var(--concept)}
#body .hl{background:var(--memory);padding:0 4px}
#body .red{color:var(--caution)}
#body .star{color:var(--exam)}
#body .tw{overflow:hidden;margin:8px 0 0;border:1px solid var(--line)}
#body table{border-collapse:collapse;width:100%;font-size:var(--fs-body)}
#body th,#body td{padding:3px 10px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
#body thead th{border-top:0;font-size:var(--fs-note);color:var(--muted)}
#body pre{white-space:pre-wrap;font-family:var(--font-num);font-size:var(--fs-note);line-height:1.35}
#body code{font-family:var(--font-num)}
/* 시험 언급 — 최우선 (지침 §3) */
.exam-callout{border:4px solid var(--exam);padding:10px 14px;margin:0 0 10px;background:var(--paper)}
.exam-label{font-size:var(--fs-note);color:var(--exam)}
.exam-label b{color:var(--ink)}
.exam-quote{font-size:var(--fs-body)}
/* 표지·결과 */
.cover .big{font-size:var(--fs-title);line-height:1.2;margin:6px 0 10px}
.cover .sub{font-size:var(--fs-body)}
.score{display:flex;gap:14px;margin:10px 0}
.score .c{border:2px solid var(--ink);padding:10px 16px}
.score .c b{display:block;font-family:var(--font-num);font-size:var(--fs-title)}
/* 암기 vs 이해 */
.mu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mu>div{min-width:0}
.mu-mem{background:var(--memory);border:2px solid var(--memory)}
.mu-und{border:2px solid var(--concept)}
.mu-h{margin-bottom:4px}.mu-h .hint{font-size:var(--fs-note);color:var(--muted);margin-left:6px}
.mu li{margin:2px 0}
/* 문제 */
.q-kind{display:inline-block;font-size:var(--fs-note);border:1px solid var(--ink);padding:0 8px;margin-right:8px;vertical-align:middle}
#body.q-mode{display:flex;flex-direction:column}
#body.q-mode>*{flex:0 0 auto}
.pad{flex:1 1 auto!important;min-height:100px;display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);overflow:hidden;background:var(--paper)}
.pad-bar{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:var(--fs-note);background:var(--soft);flex-wrap:wrap}
.pad-bar .hint{color:var(--muted);margin-right:auto}
.pad-bar button{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.pad-bar button.on{background:var(--ink);color:var(--paper)}
.pad canvas{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:24px 24px}
/* V4-PADPANEL 필기 판 — 「+ 필기」로 여닫음, 문제 아래쪽을 덮는다 */
#padPanel{position:absolute;left:24px;right:24px;top:38%;bottom:72px;background:var(--paper);border:2px solid var(--ink);display:none;flex-direction:column;z-index:16}
#padPanel.on{display:flex}
#padPanel .pad{flex:1 1 auto;margin:0;border:0;min-height:0}
#padBtn.on{background:var(--ink);color:var(--paper)}
/* V4-ANSLB 답·풀이 판 — 작업 영역 전체 */
#anslb{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);display:none;flex-direction:column;z-index:18;padding:14px 24px;overflow:hidden}
#anslb.on{display:flex}
#anslb .ans{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:8px}
#anslb .ans-top{display:flex;align-items:center;gap:10px}
#anslb .ans-top .kicker{margin-right:auto}
.myans{margin-top:8px}.myans label{display:block;font-size:var(--fs-note);color:var(--muted)}
.myans textarea{width:100%;font-family:var(--font-num);font-size:var(--fs-body);line-height:1.35;padding:6px 12px;border:2px solid var(--ink);background:var(--paper);resize:none;outline:none}
.myans textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.myans-show{border:2px dashed var(--ink)}
.myans-txt{font-family:var(--font-num);white-space:pre-wrap}
.ans{border:2px solid var(--example)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;font:inherit;font-size:var(--fs-body);padding:6px 12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:48px}
.choice .cn{flex:0 0 28px;height:28px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:var(--fs-note)}
.choice .ct{min-width:0}
.choice.sel{border-color:var(--ink);border-width:3px}
.choice.ok{border-color:var(--example)}.choice.ok .cn{background:var(--example);border-color:var(--example);color:var(--paper)}
.choice.bad{border-color:var(--caution)}.choice.bad .cn{background:var(--caution);border-color:var(--caution);color:var(--paper)}
.choice[disabled]{cursor:default}
.verdict{padding:6px 14px;border:2px solid var(--ink)}.verdict.ok{border-color:var(--example)}.verdict.bad{border-color:var(--caution);color:var(--caution)}
/* 시작 위치 */
.jump-h{font-size:var(--fs-note);color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jump-part{display:flex;gap:10px;align-items:flex-start;margin:2px 0}
.jump-pt{flex:0 0 220px;font-size:var(--fs-note);padding-top:6px}
.jump-items{display:flex;flex-wrap:wrap;gap:4px}
.jp{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.jp.done{background:var(--ink);color:var(--paper)}.jp.skip{color:var(--muted);text-decoration:line-through;border-color:var(--line)}.jp.cur{border:3px solid var(--ink)}
/* 하단: [이전] [힌트] · 출처 · 동작 · [확인/다음] */
#foot{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:var(--fs-body);min-height:48px;padding:4px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.xs{font-size:var(--fs-note);min-height:36px;padding:2px 12px}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#act{display:flex;gap:8px;align-items:center;margin-left:auto}#act .hint{font-size:var(--fs-note);color:var(--muted)}
#next{margin-left:8px}
#next.undone{background:var(--paper);color:var(--ink);border-style:dashed}
#doneTag{font-size:var(--fs-note);color:var(--muted)}
/* 출처 썸네일 · 확대 */
#srcs{display:flex;gap:6px}
.src-th{position:relative;width:48px;height:48px;padding:0;border:2px solid var(--ink);overflow:hidden;background:var(--paper);cursor:pointer;flex:0 0 auto}
.src-th img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.src-th .src-n{position:absolute;right:0;bottom:0;font-family:var(--font-num);font-size:var(--fs-note);background:var(--ink);color:var(--paper);padding:0 4px}
#srclb{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:20;padding:12px 18px}
#srclb.on{display:flex}
.src-top{display:flex;align-items:center;gap:10px;font-size:var(--fs-note);padding-bottom:8px}.src-top b{color:var(--ink)}.src-top .src-pos{margin-left:auto;font-family:var(--font-num)}
.src-x{font:inherit;font-size:var(--fs-body);min-width:48px;min-height:44px;border:2px solid var(--ink);background:var(--paper);cursor:pointer}
.src-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);touch-action:pan-x pan-y pinch-zoom}
.src-body img{width:100%;height:auto;display:block;cursor:zoom-in}
.src-body img.zoom{width:190%;max-width:none;cursor:zoom-out}
.src-foot{display:flex;align-items:center;gap:10px;padding-top:8px}.src-foot .hint{margin:0 auto;font-size:var(--fs-note);color:var(--muted)}
/* 힌트 상자 */
#hintBox{position:absolute;left:22px;right:22px;bottom:76px;background:var(--paper);border:2px solid var(--ink);padding:10px 14px;z-index:15}
#hintBox[hidden]{display:none}
/* 검사 모드 표시 */
#chk{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);overflow:auto;padding:20px;z-index:30;font-size:var(--fs-note);display:none}

/* ===== V6 UI — 조작부 재설계 (아토 2026-09-21). 본문(손글씨·5색)은 그대로, 조작부만 정자·평면 ===== */
:root{--ui:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;--accent:#4F9A35;--accent-soft:#EAF4E6;--bad:#D23B3B;--bad-soft:#FBEAEA;--line:#E3E8E5;--soft:#F4F6F5;--bg:#EEF1EF;--muted:#6B7570;--ink-3:#8A9490}
body{background:var(--bg)}
#stage{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
/* 상단: 분절 진행 막대 + 정자 라벨 */
#top{padding:12px 20px;gap:14px;font-family:var(--ui);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:#fff}
#progress{gap:3px;flex-wrap:nowrap;overflow:hidden}
.dot{flex:1 1 0;width:auto;min-width:6px;max-width:28px;height:6px;border:0;border-radius:3px;background:var(--line)}
.dot.done{background:var(--accent)}.dot.cur{background:#B7DBA8;outline:0;box-shadow:inset 0 0 0 1px var(--accent)}.dot.exam{background:#FFC2D8}.dot.exam.done{background:var(--exam)}
#chapter{font-family:var(--ui);font-size:13px;font-weight:600;color:#1F2A24}
#pos{font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
/* 본문 상자: 두꺼운 파란 테두리 → 좌측 바 */
#body .why,#body .concept{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
#body .one{border-radius:0 10px 10px 0}#body .say{border-radius:0 10px 10px 0}
#body .tw{border-radius:10px}
.mu-mem{border:0;border-left:3px solid #E5C400;background:#FFF9D6;border-radius:0 10px 10px 0}.mu-und{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
.q-kind{font-family:var(--ui);font-size:12px;font-weight:600;border:0;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
#body .kicker{font-family:var(--ui);font-size:12px;letter-spacing:0;color:var(--ink-3)}
/* 보기 카드 */
.choices{gap:10px;margin-top:12px}
.choice{font-family:var(--font-hand);border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;min-height:56px;transition:border-color .12s,background .12s}
.choice:hover{border-color:#B9C4BE;background:var(--soft)}
.choice .cn{flex:0 0 28px;width:28px;height:28px;border:0;border-radius:50%;background:var(--soft);color:#1F2A24;font-family:var(--ui);font-size:13px;font-weight:600}
.choice.sel{border:2px solid var(--accent);padding:11px 13px}.choice.sel .cn{background:var(--accent);color:#fff}
.choice.ok{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}.choice.ok .cn{background:var(--accent);color:#fff}
.choice.bad{border:2px solid var(--bad);background:var(--bad-soft);padding:11px 13px}.choice.bad .cn{background:var(--bad);color:#fff}
.choice[disabled]:not(.ok):not(.bad){opacity:.55}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 주관식 */
.myans label{font-family:var(--ui);font-size:12px;color:var(--muted)}
.myans textarea{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--ui);font-size:16px;background:#fff}
.myans textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.myans-show{border:1px dashed #B9C4BE;border-radius:12px;background:var(--soft)}
.myans-txt{font-family:var(--ui);font-size:16px}
.myans-note{margin-top:8px}
/* 판정·안내 */
.verdict{font-family:var(--ui);font-size:13px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:var(--soft);color:#1F2A24}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}
#act .hint{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
#doneTag{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
/* 하단 바 · 버튼 */
#foot{padding:10px 16px;gap:8px;border-top:1px solid var(--line);background:#fff}
.btn{font-family:var(--ui);font-size:14px;font-weight:600;min-height:40px;padding:6px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1F2A24;box-shadow:none}
.btn:hover{background:var(--soft)}
.btn.xs{font-size:13px;min-height:36px;padding:4px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
#next{min-width:96px}
#next.undone{background:#fff;color:var(--accent);border:1px solid var(--accent);border-style:solid}
.btn[disabled]{opacity:.35}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#padBtn.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
/* 출처 썸네일 */
#srcs{gap:6px}
.src-th{width:40px;height:40px;border:1px solid var(--line);border-radius:8px}
.src-th .src-n{font-family:var(--ui);font-size:11px;padding:0 5px;border-radius:6px 0 6px 0}
.src-x{font-family:var(--ui);font-size:14px;border:1px solid var(--line);border-radius:10px;min-height:40px}
.src-top{font-family:var(--ui);font-size:13px}.src-body{border-radius:12px}
.src-foot .hint{font-family:var(--ui);font-size:12px}
/* 힌트 · 필기 · 풀이 판 · 글꼴 경고 */
#hintBox{border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
#padPanel{border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
.pad-bar{font-family:var(--ui);font-size:12px;padding:6px 10px;background:var(--soft);border-radius:14px 14px 0 0}
.pad-bar button{font-family:var(--ui);font-size:12px;font-weight:600;min-height:32px;padding:2px 10px;border:1px solid var(--line);border-radius:8px}
.pad-bar button.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
#anslb{padding:16px 24px}
#anslb .ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
.ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
#anslb .ans-top .kicker{font-family:var(--ui);font-size:12px}
#fontWarn{border:1px solid var(--bad);border-radius:10px;font-family:var(--ui);font-size:12px}

<script>
const DECK_ID="em1-mid";
const SLIDES=[{"id": "start", "type": "start"}, {"id": "jump", "type": "jump", "part": 0}, {"id": "p1-cover", "type": "cover", "part": 1, "no": "파트 1 · 9/2·9/4", "title": "1.1~1.3 기본 개념 · 초기값 문제 · 변수분리 · 동차형 ★", "star": true}, {"id": "p1-concept", "type": "concept", "part": 1, "title": "분리 → 적분 → 상수 정리 → (조건) 대입 (1/3)", "html": "<div class=\"why\">1장은 1계 ODE 해법 5종의 창고다. 어떤 해법을 쓸지 <b>형태를 보고 판별</b>하는 것이 곧 실력(교수 플로차트).</div>\n  <div class=\"concept\"><p><b>기본 용어</b>: 계수(order) = 최고 도함수의 차수. <b>선형</b> = \\(y\\)와 그 도함수에 거듭제곱·곱이 없다(\\(y'+p(x)y=r(x)\\)); \\(y^2\\), \\(yy'\\)가 있으면 비선형. 일반해(적분상수 포함) → 초기조건 대입 → 특수해. n계 → 상수 n개 → 조건 n개.</p></div>", "exam": [{"level": "강조", "when": "9/4", "quote": "풀기 전에 \"선형이야 비선형이야?\" 판별부터 — 뒷자리 학생을 지목해 묻는다. 특이해·비선형은 거의 안 다룬다"}]}, {"id": "p1-concept-2", "type": "concept", "part": 1, "title": "분리 → 적분 → 상수 정리 → (조건) 대입 (2/3)", "html": "<div class=\"concept\"><p><b>모델화 3단계</b>: 모델 설정 → 해법 → 해석. 예: 방사능 붕괴 \\(y'=-ky\\), \\(y(0)=0.5\\) → \\(y=0.5e^{-kt}\\).</p></div><div class=\"concept\"><p><b>변수분리형</b> \\(g(y)\\,dy=f(x)\\,dx\\) → 양변 적분 \\(\\int g(y)dy=\\int f(x)dx+c\\). 자주 쓰는 적분: \\(\\int\\frac{du}{u^2+a^2}=\\frac1a\\tan^{-1}\\frac ua\\) · 부분분수 · 부분적분.</p></div><div class=\"concept\"><p>예: \\(y'=1+y^2\\) → \\(\\frac{dy}{1+y^2}=dx\\) → \\(\\tan^{-1}y=x+c\\) → \\(y=\\tan(x+c)\\). \\(y'=3y\\) → \\(\\ln y=3x+c\\) → \\(y=ce^{3x}\\).</p></div><div class=\"concept\"><p><b>동차형(확장)</b>: 그대로는 분리가 안 되지만 \\(y'=f(y/x)\\) 꼴이면 \\(y=ux\\) 치환: \\(y'=u'x+u\\) → \\(\\dfrac{du}{f(u)-u}=\\dfrac{dx}{x}\\). 동차함수 판정 \\(f(tx,ty)=t^nf(x,y)\\) — 상수항이 있으면 동차가 아니다.</p></div>", "exam": []}, {"id": "p1-concept-3", "type": "concept", "part": 1, "title": "분리 → 적분 → 상수 정리 → (조건) 대입 (3/3)", "html": "<div class=\"concept\"><p>예: \\(2xyy'=y^2-x^2\\) → \\(y'=\\frac12(u-\\frac1u)\\) → \\(\\frac{2u}{u^2+1}du=-\\frac{dx}{x}\\) → \\(u^2+1=c/x\\) → \\(x^2+y^2=cx\\).</p></div><div class=\"one\">한 줄: 선형 판별 → 분리되면 적분, 안 되면 y=ux 치환 → 상수 정리 → 조건 대입.</div>\n  ", "exam": []}, {"id": "p1-mu", "type": "mu", "part": 1, "title": "1.1~1.3 기본 개념 · 초기값 문제 · 변수분리 · 동차형 ★", "mem": ["\\(\\int\\frac{du}{u^2+a^2}=\\frac1a\\tan^{-1}\\frac ua\\)", "\\(y=ux\\) ⇒ \\(y'=u'x+u\\)", "\\(y'=ky\\) ⇒ \\(y=ce^{kx}\\)"], "und": ["선형/비선형이 왜 해법을 가르는지(선형에만 공식·중첩이 있다)", "\\(e^{c}\\)를 새 상수 \\(c\\)로 다시 쓰는 습관", "동차형이 치환으로 변수분리가 되는 이유(\\(f(y/x)\\)가 \\(u\\)만의 함수)"]}, {"id": "p1-b1", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-1 · 계수와 선형", "html": "<p>\\(y''+x^2y'-y=e^x\\)는 몇 계이며 선형인가?</p>", "ans": "최고 도함수 \\(y''\\) → 2계. \\(y, y', y''\\)가 1차로만 있고 계수는 \\(x\\)의 함수 → 선형. 우변 \\(e^x\\ne0\\) → 비제차.", "choices": [{"html": "2계 · 선형(비제차)", "ok": true}, {"html": "2계 · 비선형", "ok": false}, {"html": "1계 · 선형", "ok": false}, {"html": "3계 · 비선형", "ok": false}], "exam": []}, {"id": "p1-b2", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-2 · 변수분리", "html": "<p>\\(y'=3y\\)의 일반해는?</p>", "ans": "\\(\\frac{dy}{y}=3dx\\) → \\(\\ln|y|=3x+c\\) → \\(y=e^{c}e^{3x}=ce^{3x}\\). 검산 \\(y'=3ce^{3x}=3y\\) ✓.", "choices": [{"html": "\\(y=ce^{3x}\\)", "ok": true}, {"html": "\\(y=3e^{x}\\)", "ok": false}, {"html": "\\(y=ce^{x/3}\\)", "ok": false}, {"html": "\\(y=3x+c\\)", "ok": false}], "exam": []}, {"id": "p1-b3", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-3 · 역탄젠트", "html": "<p>\\(y'=1+y^2\\)의 일반해는?</p>", "ans": "\\(\\frac{dy}{1+y^2}=dx\\) → \\(\\tan^{-1}y=x+c\\) → \\(y=\\tan(x+c)\\). 적분 공식 \\(\\int\\frac{du}{u^2+a^2}=\\frac1a\\tan^{-1}\\frac ua\\)의 \\(a=1\\).", "choices": [{"html": "\\(y=\\tan(x+c)\\)", "ok": true}, {"html": "\\(y=\\tan^{-1}(x+c)\\)", "ok": false}, {"html": "\\(y=x+\\frac{y^3}{3}+c\\)", "ok": false}, {"html": "\\(y=ce^{x}\\)", "ok": false}], "exam": []}, {"id": "p1-b4", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-4 · 동차함수 판정", "html": "<p>다음 중 <b>동차함수가 아닌</b> 것은?</p>", "ans": "\\(f(tx,ty)=t^nf(x,y)\\)여야 한다. 상수항 4 때문에 \\(x^2+y^2+4\\)는 안 된다. 나머지는 각각 1차·4차·0차 동차.", "choices": [{"html": "\\(x^2+y^2+4\\)", "ok": true}, {"html": "\\(x-\\sqrt{xy}+3y\\)", "ok": false}, {"html": "\\(x^4-x^2y^2+8y^4\\)", "ok": false}, {"html": "\\(y/x+1\\)", "ok": false}], "exam": []}, {"id": "p1-a5", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-1 · 초기값 문제 (Ex.4)", "html": "<p>\\(y'=3y\\), \\(y(0)=5.7\\)의 특수해를 구하라.</p>", "ans": "Step 1 일반해 \\(y=ce^{3x}\\). Step 2 \\(y(0)=c=5.7\\) → \\(y=5.7e^{3x}\\). Step 3 검산 \\(y'=17.1e^{3x}=3y\\) ✓, \\(y(0)=5.7\\) ✓.", "choices": null, "exam": []}, {"id": "p1-a6", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-2 · 동차형 (Ex.8)", "html": "<p>\\(2xyy'=y^2-x^2\\)의 일반해를 구하라.</p>", "ans": "\\(y'=\\frac12\\big(\\frac yx-\\frac xy\\big)\\) → \\(y=ux\\): \\(u'x+u=\\frac12(u-\\frac1u)\\) → \\(u'x=-\\frac{u^2+1}{2u}\\) → \\(\\frac{2u}{u^2+1}du=-\\frac{dx}{x}\\) → \\(\\ln(u^2+1)=-\\ln|x|+c\\) → \\(u^2+1=\\frac cx\\) → \\(\\frac{y^2}{x^2}+1=\\frac cx\\) → \\(x^2+y^2=cx\\) (원점을 지나고 중심이 x축에 있는 원들).", "choices": null, "exam": []}, {"id": "p1-result", "type": "result", "part": 1, "title": "1.1~1.3 기본 개념 · 초기값 문제 · 변수분리 · 동차형 ★"}, {"id": "p2-cover", "type": "cover", "part": 2, "no": "파트 2 · 9/9·9/11", "title": "1.4 완전미분방정식 · 적분인자 정리 1·2 ★★", "star": true}, {"id": "p2-concept", "type": "concept", "part": 2, "title": "M dx + N dy = 0 이 어떤 u의 전미분이면 u = c 가 해 (1/4)", "html": "<div class=\"why\">완전미분방정식은 해가 <b>u(x,y) = c</b>로 바로 나온다. 완전이 아니면 적분인자 F를 곱해 완전으로 만든다 — 그 F를 찾는 공식 두 개가 시험 공식이다.</div>\n  ", "exam": [{"level": "정정", "when": "9/11", "quote": "\"지난 시간에 틀린 게 하나 있어요. 이게 p가 아니라 q로 고치세요\" — 정리 1(F(x))의 분모는 Q"}, {"level": "강조", "when": "9/9 슬라이드·9/16", "quote": "교수 풀이 Step 형식(판별 → 해 → 검증)이 곧 채점 형식. 1장 해법 총정리에서 적분인자는 \"시간이 많이 걸린다 — 선형이면 공식으로\""}]}, {"id": "p2-concept-2", "type": "concept", "part": 2, "title": "M dx + N dy = 0 이 어떤 u의 전미분이면 u = c 가 해 (2/4)", "html": "<div class=\"concept\"><p><b>완전(exact)</b>: \\(M\\,dx+N\\,dy=0\\)에서 \\(M=u_x\\), \\(N=u_y\\)인 \\(u\\)가 있으면 \\(du=0\\) → \\(u(x,y)=c\\).</p></div><div class=\"concept\"><p><b>판별</b> \\[\\frac{\\partial M}{\\partial y}=\\frac{\\partial N}{\\partial x}\\] <b>해법</b> Case 1: \\(u=\\int M\\,dx+k(y)\\) → \\(u_y=N\\)에서 \\(k'(y)\\) → \\(k\\). Case 2: \\(u=\\int N\\,dy+l(x)\\) → \\(u_x=M\\). 적분이 쉬운 쪽으로. 적분상수 함수는 <b>k(y)</b>로 쓴다.</p></div><div class=\"concept\"><p>예(Ex.1): \\(\\cos(x+y)dx+(3y^2+2y+\\cos(x+y))dy=0\\): \\(M_y=-\\sin(x+y)=N_x\\) ✓ → \\(u=\\sin(x+y)+k(y)\\) → \\(u_y=\\cos(x+y)+k'=N\\) → \\(k=y^3+y^2\\) → \\(\\sin(x+y)+y^3+y^2=c\\).</p></div>", "exam": []}, {"id": "p2-concept-3", "type": "concept", "part": 2, "title": "M dx + N dy = 0 이 어떤 u의 전미분이면 u = c 가 해 (3/4)", "html": "<div class=\"concept\"><p><b>적분인자</b>: 완전이 아니면 \\(F\\)를 곱해 완전으로. 예(Ex.3) \\(-y\\,dx+x\\,dy=0\\)에 \\(1/x^2\\)을 곱하면 \\(-\\frac{y}{x^2}dx+\\frac1x dy=0\\) → \\(u=y/x=c\\).</p></div><div class=\"concept\"><p><b>정리 1·2</b>(식을 \\(P\\,dx+Q\\,dy=0\\)으로 쓴다): \\[R(x)=\\frac1Q\\Big(\\frac{\\partial P}{\\partial y}-\\frac{\\partial Q}{\\partial x}\\Big)\\ \\text{가 }x\\text{만의 함수}\\ \\Rightarrow\\ F(x)=e^{\\int R\\,dx}\\] \\[R^*(y)=\\frac1P\\Big(\\frac{\\partial Q}{\\partial x}-\\frac{\\partial P}{\\partial y}\\Big)\\ \\text{가 }y\\text{만의 함수}\\ \\Rightarrow\\ F^*(y)=e^{\\int R^*dy}\\] 외우는 법: 분모는 \"곱해지지 않는 쪽\", 괄호 안 부호는 서로 반대.</p></div><div class=\"concept\"><p>수순: 판별 → \\(R\\) 시도 → 안 되면 \\(R^*\\) → 곱해서 재검증 → \\(u\\) → (초기조건) 특수해.</p></div>", "exam": []}, {"id": "p2-concept-4", "type": "concept", "part": 2, "title": "M dx + N dy = 0 이 어떤 u의 전미분이면 u = c 가 해 (4/4)", "html": "<div class=\"one\">한 줄: M_y = N_x 면 완전 → u = ∫M dx + k(y). 아니면 R = (1/Q)(P_y − Q_x) 또는 R* = (1/P)(Q_x − P_y) 로 적분인자.</div>\n  ", "exam": []}, {"id": "p2-mu", "type": "mu", "part": 2, "title": "1.4 완전미분방정식 · 적분인자 정리 1·2 ★★", "mem": ["판별 \\(M_y=N_x\\)", "정리 1 \\(R=\\frac1Q(P_y-Q_x)\\), \\(F=e^{\\int R dx}\\) · 정리 2 \\(R^*=\\frac1P(Q_x-P_y)\\), \\(F^*=e^{\\int R^*dy}\\)", "\\(u=\\int M dx+k(y)\\), 상수 함수는 \\(k(y)\\)"], "und": ["판별식이 \\(u_{xy}=u_{yx}\\)에서 나오는 것", "적분인자를 곱하면 왜 완전이 되는지(\\(F\\)가 한 변수 함수일 때의 유도)", "Case 1·2 중 적분이 쉬운 쪽을 고르는 감각"]}, {"id": "p2-b1", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-1 · 완전 판별과 해", "html": "<p>\\((x^3+y^3)dx+3xy^2dy=0\\)은 완전미분방정식인가? 맞다면 일반해는?</p>", "ans": "\\(M=x^3+y^3\\), \\(N=3xy^2\\): \\(M_y=3y^2=N_x\\) ✓. \\(u=\\int M dx=\\frac{x^4}{4}+xy^3+k(y)\\), \\(u_y=3xy^2+k'=N\\) → \\(k'=0\\). \\(\\frac{x^4}{4}+xy^3=c\\).", "choices": [{"html": "완전(\\(M_y=N_x=3y^2\\)), \\(\\frac{x^4}{4}+xy^3=c\\)", "ok": true}, {"html": "완전, \\(x^4+y^4=c\\)", "ok": false}, {"html": "완전이 아님(\\(M_y\\ne N_x\\))", "ok": false}, {"html": "완전, \\(\\frac{x^4}{4}+\\frac{y^4}{4}=c\\)", "ok": false}], "exam": []}, {"id": "p2-b2", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-2 · 정리 1 공식", "html": "<p>\\(P\\,dx+Q\\,dy=0\\)이 완전이 아닐 때, \\(x\\)만의 함수인 적분인자 \\(F(x)\\)를 주는 공식은?</p>", "ans": "분모 \\(Q\\)(9/11 교수 정정 \"p가 아니라 q\"), 괄호는 \\(P_y-Q_x\\). \\(y\\)만의 함수면 분모 \\(P\\), 괄호 부호 반대 \\((Q_x-P_y)\\).", "choices": [{"html": "\\(R=\\frac1Q(P_y-Q_x)\\), \\(F=e^{\\int R\\,dx}\\)", "ok": true}, {"html": "\\(R=\\frac1P(P_y-Q_x)\\), \\(F=e^{\\int R\\,dx}\\)", "ok": false}, {"html": "\\(R=\\frac1Q(Q_x-P_y)\\), \\(F=e^{\\int R\\,dx}\\)", "ok": false}, {"html": "\\(R=P_y-Q_x\\), \\(F=\\int R\\,dx\\)", "ok": false}], "exam": []}, {"id": "p2-b3", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-3 · 적분인자 찾기 (Ex.3)", "html": "<p>\\(-y\\,dx+x\\,dy=0\\)을 완전미분방정식으로 만드는 적분인자 \\(F\\)는?</p>", "ans": "\\(P=-y, Q=x\\): \\(R^*=\\frac1P(Q_x-P_y)=\\frac{1-(-1)}{-y}=-\\frac2y\\)… 대신 정리 1: \\(R=\\frac1Q(P_y-Q_x)=\\frac{-1-1}{x}=-\\frac2x\\) → \\(F=e^{-2\\ln x}=1/x^2\\). 곱하면 \\(-\\frac{y}{x^2}dx+\\frac1xdy=0\\), \\(u=y/x=c\\).", "choices": [{"html": "\\(1/x^2\\)", "ok": true}, {"html": "\\(1/x\\)", "ok": false}, {"html": "\\(x^2\\)", "ok": false}, {"html": "\\(xy\\)", "ok": false}], "exam": []}, {"id": "p2-b4", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-4 · Ex.1 의 답", "html": "<p>\\(\\cos(x+y)dx+(3y^2+2y+\\cos(x+y))dy=0\\)의 일반해는?</p>", "ans": "\\(u=\\int\\cos(x+y)dx=\\sin(x+y)+k(y)\\), \\(u_y=\\cos(x+y)+k'=3y^2+2y+\\cos(x+y)\\) → \\(k=y^3+y^2\\). 검증: \\(x\\)로 미분하면 원식으로 돌아온다.", "choices": [{"html": "\\(\\sin(x+y)+y^3+y^2=c\\)", "ok": true}, {"html": "\\(\\cos(x+y)+y^3+y^2=c\\)", "ok": false}, {"html": "\\(\\sin(x+y)+3y^2+2y=c\\)", "ok": false}, {"html": "\\(-\\sin(x+y)+y^3+y^2=c\\)", "ok": false}], "exam": []}, {"id": "p2-a5", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-1 · 적분인자 + 초기값 (Ex.5, 과제·시험 유형)", "html": "<p>\\((e^{x+y}+ye^y)dx+(xe^y-1)dy=0\\), \\(y(0)=-1\\)을 풀라.</p>", "ans": "Step 1 \\(P_y=e^{x+y}+e^y+ye^y\\), \\(Q_x=e^y\\) → 완전 아님. Step 2 \\(R=\\frac{P_y-Q_x}{Q}\\)는 \\(x\\)만의 함수 아님 → \\(R^*=\\frac{Q_x-P_y}{P}=\\frac{-e^{x+y}-ye^y}{e^{x+y}+ye^y}=-1\\) → \\(F^*=e^{-y}\\). 곱하면 \\((e^x+y)dx+(x-e^{-y})dy=0\\), 재검증 \\(1=1\\) ✓. Step 3 \\(u=e^x+xy+k(y)\\), \\(u_y=x+k'=x-e^{-y}\\) → \\(k=e^{-y}\\) → \\(e^x+xy+e^{-y}=c\\). Step 4 \\(y(0)=-1\\): \\(1+0+e=c\\) → \\(e^x+xy+e^{-y}=1+e\\approx3.72\\).", "choices": null, "exam": []}, {"id": "p2-a6", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-2 · 완전미분방정식 (슬라이드 예제 (2))", "html": "<p>\\((\\sin y-y\\sin x)dx+(\\cos x+x\\cos y+2y)dy=0\\)의 일반해를 구하라.</p>", "ans": "\\(M_y=\\cos y-\\sin x=N_x\\) ✓ 완전. \\(u=\\int M dx=x\\sin y+y\\cos x+k(y)\\), \\(u_y=x\\cos y+\\cos x+k'=N\\) → \\(k'=2y\\) → \\(k=y^2\\). \\(x\\sin y+y\\cos x+y^2=c\\). 검산 \\(u_x=\\sin y-y\\sin x=M\\) ✓.", "choices": null, "exam": []}, {"id": "p2-result", "type": "result", "part": 2, "title": "1.4 완전미분방정식 · 적분인자 정리 1·2 ★★"}, {"id": "p3-cover", "type": "cover", "part": 3, "no": "파트 3 · 9/11·9/16", "title": "1.5 선형 ODE 공식 · 베르누이 · 치환 ★★", "star": true}, {"id": "p3-concept", "type": "concept", "part": 3, "title": "선형이면 공식 한 방 — 표준형부터 (1/5)", "html": "<div class=\"why\">1계 선형은 완전미분·적분인자를 거치지 않고 <b>공식</b>으로 끝난다(\"적분인자는 시간이 너무 많이 걸려\"). 베르누이·치환은 비선형을 선형/변수분리로 바꾸는 기술.</div>\n  ", "exam": [{"level": "필수", "when": "9/11", "quote": "\"이거 하고 이거는 기억을 하라\" — 표준형 \\(y'+p(x)y=r(x)\\), \\(h=\\int p\\,dx\\), \\(y=e^{-h}[\\int e^h r\\,dx+c]\\). 판서에 네모+별표"}, {"level": "공식 제공", "when": "9/11", "quote": "\\(\\int\\tan x\\,dx=\\ln|\\sec x|\\) 같은 특수 적분은 \"외울 필요 없어요. 중간·기말에 나오면 내가 공식을 알려줄 거예요\""}]}, {"id": "p3-concept-2", "type": "concept", "part": 3, "title": "선형이면 공식 한 방 — 표준형부터 (2/5)", "html": "<div class=\"concept\"><p><b>표준형</b> \\(y'+p(x)y=r(x)\\) — \\(y'\\)의 계수를 1로. \\(r=0\\) 제차 → \\(y=ce^{-\\int p dx}\\). \\(r\\ne0\\) 비제차 → \\[h=\\int p(x)dx,\\qquad y=e^{-h}\\Big[\\int e^{h}r(x)\\,dx+c\\Big]\\] \\(r\\) = 입력(구동함수), \\(y\\) = 출력(응답).</p></div><div class=\"concept\"><p>예(Ex.1 ★): \\(y'+y\\tan x=\\sin2x\\), \\(y(0)=1\\): \\(p=\\tan x\\), \\(h=-\\ln\\cos x\\), \\(e^{-h}=\\cos x\\), \\(e^h=\\sec x\\) → \\(y=\\cos x[\\int\\sec x\\cdot2\\sin x\\cos x\\,dx+c]=\\cos x[-2\\cos x+c]\\) → \\(y(0)=1\\): \\(c=3\\) → \\(y=3\\cos x-2\\cos^2x\\).</p></div>", "exam": []}, {"id": "p3-concept-3", "type": "concept", "part": 3, "title": "선형이면 공식 한 방 — 표준형부터 (3/5)", "html": "<div class=\"concept\"><p>연습(9/11): (1) \\(xy'+2y=3\\) → \\(y'+\\frac2xy=\\frac3x\\), \\(h=2\\ln x\\) → \\(y=\\frac32+\\frac{c}{x^2}\\). (2) \\(y'=\\frac{1}{x+y^2}\\) → 역수를 취해 \\(\\frac{dx}{dy}=x+y^2\\) → \\(x'-x=y^2\\), \\(y\\)에 대한 선형 → \\(x=-y^2-2y-2+ce^y\\). (3) \\((1+e^x)y'+e^xy=0\\) → \\(y=\\frac{c}{1+e^x}\\). RL 회로 \\(Li'+Ri=E\\)도 같은 공식.</p></div><div class=\"concept\"><p><b>베르누이</b> \\(y'+p(x)y=g(x)y^a\\) (\\(a\\ne0,1\\)): \\(u=y^{1-a}\\) → \\[u'+(1-a)p\\,u=(1-a)g\\] → 선형 공식(또는 변수분리) → \\(u\\)를 \\(y\\)로 되돌린다(\"이게 끝이 아니죠\").</p></div>", "exam": []}, {"id": "p3-concept-4", "type": "concept", "part": 3, "title": "선형이면 공식 한 방 — 표준형부터 (4/5)", "html": "<div class=\"concept\"><p>연습(9/16): (1) \\(xy'+y=1/y^2\\) → \\(a=-2\\), \\(u=y^3\\), \\(u'+\\frac3xu=\\frac3x\\) → \\(u=1+\\frac{c}{x^3}\\) → \\(y^3=1+\\frac{c}{x^3}\\). (2) \\(y'=(x+y+2)^2\\) → \\(u=x+y+2\\), \\(u'=1+u^2\\) → \\(\\tan^{-1}(x+y+2)=x+c\\). (3) \\(y'=1+e^{y-x+3}\\) → \\(u=y-x+3\\), \\(u'=e^u\\) → \\(e^{-(y-x+3)}+x+c=0\\).</p></div><div class=\"concept\"><p><b>1장 플로차트</b>: \\(M_y=N_x\\)? → 완전 / 동차? → \\(y=ux\\) / 적분인자 / 선형 \\(y'+py=r\\)? → 공식 / 베르누이 → \\(u=y^{1-a}\\) / 치환형 \\(y'=f(ax+by+c)\\) → \\(u=ax+by+c\\).</p></div>", "exam": []}, {"id": "p3-concept-5", "type": "concept", "part": 3, "title": "선형이면 공식 한 방 — 표준형부터 (5/5)", "html": "<div class=\"one\">한 줄: 표준형 → h = ∫p dx → y = e^{−h}[∫e^h r dx + c]. 베르누이는 u = y^{1−a}로 선형화하고 마지막에 y로.</div>\n  ", "exam": []}, {"id": "p3-mu", "type": "mu", "part": 3, "title": "1.5 선형 ODE 공식 · 베르누이 · 치환 ★★", "mem": ["\\(y'+py=r\\), \\(h=\\int p dx\\), \\(y=e^{-h}[\\int e^hr dx+c]\\)", "베르누이 \\(u=y^{1-a}\\) → \\(u'+(1-a)pu=(1-a)g\\)", "치환형 \\(y'=f(ax+by+c)\\) → \\(u=ax+by+c\\), \\(u'=a+by'\\)"], "und": ["공식이 적분인자 \\(e^{\\int p dx}\\)에서 나온 것(유도는 \"알면 좋지만 필수 아님\")", "\\(y'=1/(x+y^2)\\)를 뒤집으면 선형이 되는 이유(독립변수를 y로)", "연습 2·3이 베르누이가 아니라 치환 → 변수분리인 이유"]}, {"id": "p3-b1", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-1 · 표준형", "html": "<p>\\(xy'+2y=3\\)을 표준형 \\(y'+p(x)y=r(x)\\)로 고치면 \\(p(x)\\)와 \\(r(x)\\)는?</p>", "ans": "양변을 \\(x\\)로 나눈다: \\(y'+\\frac2xy=\\frac3x\\). \"\\(y'\\)에 어떤 계수도 붙지 않아야\" 표준형.", "choices": [{"html": "\\(p=\\frac2x\\), \\(r=\\frac3x\\)", "ok": true}, {"html": "\\(p=2\\), \\(r=3\\)", "ok": false}, {"html": "\\(p=2x\\), \\(r=3x\\)", "ok": false}, {"html": "\\(p=\\frac{2}{x}\\), \\(r=3\\)", "ok": false}], "exam": []}, {"id": "p3-b2", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-2 · 해 공식", "html": "<p>비제차 선형 \\(y'+p(x)y=r(x)\\)의 일반해 공식으로 옳은 것은? (\\(h=\\int p\\,dx\\))</p>", "ans": "판서 네모+별표. 제차(\\(r=0\\))면 \\(y=ce^{-h}\\)로 줄어든다. 부호(\\(e^{-h}\\) 밖, \\(e^{h}\\) 안)를 바꾸면 틀린다.", "choices": [{"html": "\\(y=e^{-h}\\big[\\int e^{h}r\\,dx+c\\big]\\)", "ok": true}, {"html": "\\(y=e^{h}\\big[\\int e^{-h}r\\,dx+c\\big]\\)", "ok": false}, {"html": "\\(y=e^{-h}\\int r\\,dx+c\\)", "ok": false}, {"html": "\\(y=ce^{-h}+r\\)", "ok": false}], "exam": []}, {"id": "p3-b3", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-3 · 베르누이 치환", "html": "<p>\\(xy'+y=\\dfrac{1}{y^2}\\)를 베르누이 꼴로 보면 \\(a\\)와 치환 \\(u\\)는?</p>", "ans": "표준형 \\(y'+\\frac1xy=\\frac1xy^{-2}\\) → \\(a=-2\\) → \\(u=y^{1-a}=y^{3}\\). \\(u'=3y^2y'\\)를 대입하면 \\(u'+\\frac3xu=\\frac3x\\).", "choices": [{"html": "\\(a=-2\\), \\(u=y^{3}\\)", "ok": true}, {"html": "\\(a=2\\), \\(u=y^{-1}\\)", "ok": false}, {"html": "\\(a=-2\\), \\(u=y^{-2}\\)", "ok": false}, {"html": "\\(a=3\\), \\(u=y^{-2}\\)", "ok": false}], "exam": []}, {"id": "p3-b4", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-4 · 연습 (1)", "html": "<p>\\(xy'+2y=3\\)의 일반해는?</p>", "ans": "\\(h=\\int\\frac2xdx=2\\ln x\\), \\(e^h=x^2\\) → \\(y=x^{-2}[\\int x^2\\cdot\\frac3xdx+c]=x^{-2}[\\frac32x^2+c]=\\frac32+\\frac{c}{x^2}\\). 검산: \\(xy'+2y=-\\frac{2c}{x^2}+3+\\frac{2c}{x^2}=3\\) ✓.", "choices": [{"html": "\\(y=\\frac32+\\frac{c}{x^2}\\)", "ok": true}, {"html": "\\(y=\\frac32+cx^2\\)", "ok": false}, {"html": "\\(y=3+\\frac cx\\)", "ok": false}, {"html": "\\(y=ce^{-2x}+\\frac32\\)", "ok": false}], "exam": []}, {"id": "p3-a5", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-1 · 교재 예제 1 ★ (판서 별표)", "html": "<p>\\(y'+y\\tan x=\\sin2x\\), \\(y(0)=1\\)의 특수해를 구하라. (\\(\\int\\tan x\\,dx=-\\ln\\cos x\\), \\(\\sin2x=2\\sin x\\cos x\\))</p>", "ans": "\\(p=\\tan x\\), \\(r=\\sin2x\\). \\(h=-\\ln\\cos x\\) → \\(e^{-h}=\\cos x\\), \\(e^{h}=\\frac1{\\cos x}\\). \\(y=\\cos x\\big[\\int\\frac{2\\sin x\\cos x}{\\cos x}dx+c\\big]=\\cos x[-2\\cos x+c]=c\\cos x-2\\cos^2x\\). \\(y(0)=c-2=1\\) → \\(c=3\\). \\(y=3\\cos x-2\\cos^2x\\). 검산: \\(y'=-3\\sin x+4\\cos x\\sin x\\), \\(y\\tan x=3\\sin x-2\\cos x\\sin x\\) → 합 \\(2\\sin x\\cos x=\\sin2x\\) ✓.", "choices": null, "exam": []}, {"id": "p3-a6", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-2 · 베르누이 (연습 1)", "html": "<p>\\(xy'+y=\\dfrac1{y^2}\\)의 일반해를 구하라.</p>", "ans": "\\(u=y^3\\), \\(u'=3y^2y'=3y^2(-\\frac yx+\\frac{1}{xy^2})=-\\frac{3u}{x}+\\frac3x\\) → \\(u'+\\frac3xu=\\frac3x\\). 변수분리 \\(\\frac{du}{u-1}=-\\frac{3}{x}dx\\) → \\(\\ln|u-1|=-3\\ln x+c\\) → \\(u=1+\\frac{c}{x^3}\\). 되돌리기: \\(y^3=1+\\dfrac{c}{x^3}\\). (선형 공식 \\(h=3\\ln x\\)로 풀어도 같다.)", "choices": null, "exam": []}, {"id": "p3-result", "type": "result", "part": 3, "title": "1.5 선형 ODE 공식 · 베르누이 · 치환 ★★"}, {"id": "p4-cover", "type": "cover", "part": 4, "no": "파트 4 · 9/16·9/23", "title": "2.1 2계 선형 — 중첩 원리 · 1차독립 · 기저 · 차수축소 · 론스키안 ★", "star": true}, {"id": "p4-concept", "type": "concept", "part": 4, "title": "해 두 개(기저)의 1차결합이 일반해 — 하나를 알면 차수축소로 나머지를 (1/4)", "html": "<div class=\"why\">2계 제차 선형 ODE의 해 공간은 2차원이다. 그래서 필요한 것: 해 둘, 그 둘이 독립인지(기저), 초기조건 둘. 하나만 알 때 나머지를 만드는 도구가 차수축소법.</div>\n  ", "exam": [{"level": "정정", "when": "9/16 50:14", "quote": "\"비례 관계가 되면 1차 종속, 비례 관계가 없으면 1차 독립. 반대로 얘기했어요\" — 판서 5 별표·취소선"}, {"level": "강조", "when": "9/23 판서 ☆", "quote": "\\(W(y_1,y_2)\\ne0\\) → 1차독립 (교수 별표) · 정리 1(중첩)은 \"제차 선형에만\" — 교재 빨간 글씨"}]}, {"id": "p4-concept-2", "type": "concept", "part": 4, "title": "해 두 개(기저)의 1차결합이 일반해 — 하나를 알면 차수축소로 나머지를 (2/4)", "html": "<div class=\"concept\"><p><b>표준형</b> \\(y''+p(x)y'+q(x)y=r(x)\\). \\(r=0\\) 제차. 예: \\(xy''+y'+xy=0\\) → \\(y''+\\frac1xy'+y=0\\) 제차. \\(yy''+y'^2=0\\)은 비선형.</p></div><div class=\"concept\"><p><b>정리 1 중첩(선형성) 원리</b>: 제차 선형 ODE의 해 \\(y_1,y_2\\)에 대해 \\(c_1y_1+c_2y_2\\)도 해. <span class=\"red\">제차 선형에만</span> — 반례: \\(y''+y=1\\)의 해 \\(1+\\cos x\\), \\(1+\\sin x\\)는 합이 해가 아니다; 비선형 \\(y''y-xy'=0\\)의 \\(x^2\\), \\(1\\)도 마찬가지.</p></div><div class=\"concept\"><p><b>IVP</b>: 조건 두 개 \\(y(x_0)=K_0\\), \\(y'(x_0)=K_1\\). 예(Ex.4) \\(y''+y=0\\), \\(y(0)=3.0\\), \\(y'(0)=-0.5\\) → \\(y=c_1\\cos x+c_2\\sin x\\) → \\(y=3.0\\cos x-0.5\\sin x\\).</p></div>", "exam": []}, {"id": "p4-concept-3", "type": "concept", "part": 4, "title": "해 두 개(기저)의 1차결합이 일반해 — 하나를 알면 차수축소로 나머지를 (3/4)", "html": "<div class=\"concept\"><p><b>1차독립</b>: \\(k_1y_1+k_2y_2=0\\)이 \\(k_1=k_2=0\\)일 때만 → 독립. 판별: \\(y_1/y_2\\)가 <b>상수(비례)면 종속</b>, 아니면 독립. 독립인 두 해 = <b>기저</b>. 예: \\(y''-y=0\\)의 \\(e^x, e^{-x}\\): 비 \\(e^{2x}\\) 상수 아님 → 기저. \\(\\cosh x,\\sinh x\\)도 기저.</p></div><div class=\"concept\"><p><b>차수축소법</b>: 해 \\(y_1\\)을 알 때 \\(y_2=uy_1\\) → \\(u''y_1+u'(2y_1'+py_1)=0\\) → \\(U=u'\\) 1계 → \\[y_2=y_1\\int\\frac{1}{y_1^2}e^{-\\int p\\,dx}\\,dx\\] 예(Ex.7) \\((x^2-x)y''-xy'+y=0\\), \\(y_1=x\\): \\(p=-\\frac{x}{x^2-x}=-\\frac{1}{x-1}\\) → \\(U=\\frac{1}{x^2}e^{\\ln|x-1|}=\\frac{x-1}{x^2}=\\frac1x-\\frac1{x^2}\\) → \\(y_2=x(\\ln|x|+\\frac1x)=x\\ln|x|+1\\).</p></div>", "exam": []}, {"id": "p4-concept-4", "type": "concept", "part": 4, "title": "해 두 개(기저)의 1차결합이 일반해 — 하나를 알면 차수축소로 나머지를 (4/4)", "html": "<div class=\"concept\"><p><b>론스키안</b>(9/23): \\(W(y_1,y_2)=\\begin{vmatrix}y_1&amp;y_2\\\\y_1'&amp;y_2'\\end{vmatrix}\\). \\(W\\ne0\\) → 1차독립(기저). 예: \\(W(\\cos\\omega x,\\sin\\omega x)=\\omega\\), \\(W(e^x,xe^x)=e^{2x}\\).</p></div><div class=\"one\">한 줄: 제차 선형이면 c₁y₁+c₂y₂. 비례 안 하면(W≠0) 기저. y₁ 알면 y₂ = y₁∫e^{−∫p}/y₁² dx.</div>\n  ", "exam": []}, {"id": "p4-mu", "type": "mu", "part": 4, "title": "2.1 2계 선형 — 중첩 원리 · 1차독립 · 기저 · 차수축소 · 론스키안 ★", "mem": ["차수축소 \\(y_2=y_1\\int\\frac{e^{-\\int p dx}}{y_1^2}dx\\) (지수에 마이너스)", "\\(W=y_1y_2'-y_2y_1'\\), \\(W\\ne0\\) ⇒ 독립", "비례 ⇒ 종속, 비례 ✗ ⇒ 독립"], "und": ["중첩 원리가 비제차·비선형에서 깨지는 이유(반례 두 개)", "\\(y_2=uy_1\\) 대입 시 \\(u\\) 항이 사라지는 이유(\\(y_1\\)이 해)", "초기조건이 두 개인 이유(적분상수 두 개)"]}, {"id": "p4-b1", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-1 · 중첩 원리", "html": "<p>\"두 해의 1차결합도 해\"라는 중첩 원리가 성립하는 방정식은?</p>", "ans": "교재 빨간 글씨 — 제차 선형에만. 반례 \\(y''+y=1\\): \\(1+\\cos x\\), \\(1+\\sin x\\) 각각은 해지만 합 \\(2+\\cos x+\\sin x\\)를 넣으면 \\(2\\ne1\\).", "choices": [{"html": "제차 선형 ODE (\\(y''+py'+qy=0\\))", "ok": true}, {"html": "비제차 선형 ODE (\\(y''+py'+qy=r\\), \\(r\\ne0\\))", "ok": false}, {"html": "비선형 ODE", "ok": false}, {"html": "모든 2계 ODE", "ok": false}], "exam": []}, {"id": "p4-b2", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-2 · 기저 판정", "html": "<p>\\(y''-y=0\\)에서 \\(e^x\\), \\(e^{-x}\\)가 기저인 이유로 옳은 것은?</p>", "ans": "비례하지 않으면 독립(9/16 정정). \\(W(e^x,e^{-x})=-1-1=-2\\ne0\\)으로도 확인. \\(\\cosh x,\\sinh x\\)도 같은 방정식의 기저.", "choices": [{"html": "각각 해이고, 비 \\(e^x/e^{-x}=e^{2x}\\)가 상수가 아니라 1차독립", "ok": true}, {"html": "각각 해이고, 비 \\(e^{2x}\\)가 상수라 1차독립", "ok": false}, {"html": "둘의 합이 0이기 때문", "ok": false}, {"html": "둘 다 지수함수이기 때문", "ok": false}], "exam": []}, {"id": "p4-b3", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-3 · 초기값 문제 (Ex.4)", "html": "<p>\\(y''+y=0\\), \\(y(0)=3.0\\), \\(y'(0)=-0.5\\)의 특수해는?</p>", "ans": "일반해 \\(c_1\\cos x+c_2\\sin x\\). \\(y(0)=c_1=3.0\\), \\(y'(0)=c_2=-0.5\\).", "choices": [{"html": "\\(y=3.0\\cos x-0.5\\sin x\\)", "ok": true}, {"html": "\\(y=3.0\\sin x-0.5\\cos x\\)", "ok": false}, {"html": "\\(y=3.0e^{x}-0.5e^{-x}\\)", "ok": false}, {"html": "\\(y=-0.5\\cos x+3.0\\sin x\\)", "ok": false}], "exam": []}, {"id": "p4-b4", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-4 · 론스키안", "html": "<p>\\(y_1=\\cos\\omega x\\), \\(y_2=\\sin\\omega x\\)의 론스키안 \\(W(y_1,y_2)\\)는?</p>", "ans": "\\(W=\\cos\\omega x\\cdot\\omega\\cos\\omega x-\\sin\\omega x\\cdot(-\\omega\\sin\\omega x)=\\omega(\\cos^2+\\sin^2)=\\omega\\). 9/23 eg1.", "choices": [{"html": "\\(\\omega\\) (≠0 → 1차독립)", "ok": true}, {"html": "0 (→ 1차종속)", "ok": false}, {"html": "\\(1\\)", "ok": false}, {"html": "\\(\\omega\\cos2\\omega x\\)", "ok": false}], "exam": []}, {"id": "p4-a5", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-1 · 차수축소법 (Ex.7)", "html": "<p>\\((x^2-x)y''-xy'+y=0\\)의 한 해가 \\(y_1=x\\)이다. 차수축소법으로 두 번째 해 \\(y_2\\)를 구하라.</p>", "ans": "표준형: \\(y''-\\frac{x}{x^2-x}y'+\\frac{1}{x^2-x}y=0\\) → \\(p=-\\frac{1}{x-1}\\). \\(U=\\frac{1}{y_1^2}e^{-\\int p dx}=\\frac{1}{x^2}e^{\\ln|x-1|}=\\frac{x-1}{x^2}=\\frac1x-\\frac1{x^2}\\). \\(y_2=y_1\\int U dx=x\\big(\\ln|x|+\\frac1x\\big)=x\\ln|x|+1\\). 기저 \\(\\{x,\\ x\\ln|x|+1\\}\\).", "choices": null, "exam": []}, {"id": "p4-a6", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-2 · 중근과 론스키안 (9/23 eg2)", "html": "<p>\\(y''-2y'+y=0\\)의 일반해를 구하고, 두 기저 해의 론스키안 \\(W\\)로 1차독립임을 보여라.</p>", "ans": "\\(\\lambda^2-2\\lambda+1=(\\lambda-1)^2=0\\) → 중근 1 → \\(y=(c_1+c_2x)e^x\\). \\(y_1=e^x\\), \\(y_2=xe^x\\): \\(W=e^x(x+1)e^x-xe^x\\cdot e^x=e^{2x}\\ne0\\) → 독립.", "choices": null, "exam": []}, {"id": "p4-result", "type": "result", "part": 4, "title": "2.1 2계 선형 — 중첩 원리 · 1차독립 · 기저 · 차수축소 · 론스키안 ★"}, {"id": "p5-cover", "type": "cover", "part": 5, "no": "파트 5 · 9/18 (슬라이드 보강)", "title": "2.2 상수계수 · 특성방정식 세 경우 · 2.3 미분연산자 ★★", "star": true}, {"id": "p5-concept", "type": "concept", "part": 5, "title": "y = e^{λx} 를 넣으면 2차방정식 — 근의 종류가 해의 꼴을 정한다 (1/4)", "html": "<div class=\"why\">9/18 결석분 — 교수 슬라이드 p.20~26으로 재구성(3주차 과제 2.2 #4·8·14 · 2.3 #8이 이 범위). 외울 것은 표 하나, 나머지는 대입.</div>\n  <div class=\"concept\"><p>\\(y''+ay'+by=0\\) → \\(y=e^{\\lambda x}\\) → <b>특성방정식</b> \\(\\lambda^2+a\\lambda+b=0\\).</p></div>", "exam": []}, {"id": "p5-concept-2", "type": "concept", "part": 5, "title": "y = e^{λx} 를 넣으면 2차방정식 — 근의 종류가 해의 꼴을 정한다 (2/4)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>판별 \\(a^2-4b\\)</th><th>근</th><th>일반해</th></tr></thead><tbody>\n      <tr><td>\\(&gt;0\\)</td><td>서로 다른 실근 \\(\\lambda_1,\\lambda_2\\)</td><td>\\(y=c_1e^{\\lambda_1x}+c_2e^{\\lambda_2x}\\)</td></tr>\n      <tr><td>\\(=0\\)</td><td>이중근 \\(\\lambda=-a/2\\)</td><td>\\(y=(c_1+c_2x)e^{-ax/2}\\)</td></tr>\n      <tr><td>\\(&lt;0\\)</td><td>공액복소근 \\(-\\frac a2\\pm i\\omega\\), \\(\\omega=\\sqrt{b-a^2/4}\\)</td><td>\\(y=e^{-ax/2}(A\\cos\\omega x+B\\sin\\omega x)\\)</td></tr>\n    </tbody></table></div></div>", "exam": []}, {"id": "p5-concept-3", "type": "concept", "part": 5, "title": "y = e^{λx} 를 넣으면 2차방정식 — 근의 종류가 해의 꼴을 정한다 (3/4)", "html": "<div class=\"concept\"><p>이중근에 \\(x\\)가 붙는 이유 = 차수축소법(\\(y_2=uy_1\\) → \\(u''=0\\) → \\(u=x\\)). 복소근은 오일러 공식 \\(e^{it}=\\cos t+i\\sin t\\)로 실수 해 두 개.</p></div><div class=\"concept\"><p>예: Ex.2 \\(y''+y'-2y=0\\), \\(y(0)=4\\), \\(y'(0)=-5\\): \\(\\lambda=1,-2\\) → \\(c_1+c_2=4\\), \\(c_1-2c_2=-5\\) → \\(y=e^x+3e^{-2x}\\). Ex.4 \\(y''+y'+0.25y=0\\), \\(y(0)=3\\), \\(y'(0)=-3.5\\): 중근 \\(-0.5\\) → \\(y=(3-2x)e^{-0.5x}\\). Ex.5 \\(y''+0.4y'+9.04y=0\\), \\(y(0)=0\\), \\(y'(0)=3\\): \\(-0.2\\pm3i\\) → \\(y=e^{-0.2x}\\sin3x\\).</p></div>", "exam": []}, {"id": "p5-concept-4", "type": "concept", "part": 5, "title": "y = e^{λx} 를 넣으면 2차방정식 — 근의 종류가 해의 꼴을 정한다 (4/4)", "html": "<div class=\"concept\"><p><b>미분연산자</b> \\(D=\\frac{d}{dx}\\): \\(y''+ay'+by=(D^2+aD+b)y=P(D)y=0\\). \\(P(D)\\)를 인수분해하면 특성근. 예(Ex.1) \\(D^2-3D-40=(D-8)(D+5)\\) → \\(y=c_1e^{8x}+c_2e^{-5x}\\).</p></div><div class=\"one\">한 줄: λ²+aλ+b=0 → 실근 두 지수 / 중근 (c₁+c₂x)e^{λx} / 복소근 e^{px}(A cos ωx + B sin ωx). P(D) 인수분해 = 특성근.</div>\n  ", "exam": []}, {"id": "p5-mu", "type": "mu", "part": 5, "title": "2.2 상수계수 · 특성방정식 세 경우 · 2.3 미분연산자 ★★", "mem": ["세 경우 일반해 표", "\\(\\omega=\\sqrt{b-a^2/4}\\), 실수부 \\(-a/2\\)", "오일러 \\(e^{it}=\\cos t+i\\sin t\\)"], "und": ["중근에서 \\(x\\)가 붙는 이유(차수축소)", "복소근에서 \\(\\cos\\)·\\(\\sin\\) 실수 해가 나오는 과정", "연산자 인수분해가 특성방정식과 같은 이유"]}, {"id": "p5-b1", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-1 · 특성방정식", "html": "<p>\\(y''+y'-2y=0\\)의 특성근은?</p>", "ans": "\\(\\lambda^2+\\lambda-2=(\\lambda-1)(\\lambda+2)=0\\). 일반해 \\(y=c_1e^x+c_2e^{-2x}\\).", "choices": [{"html": "\\(\\lambda=1,\\ -2\\)", "ok": true}, {"html": "\\(\\lambda=-1,\\ 2\\)", "ok": false}, {"html": "\\(\\lambda=1,\\ 2\\)", "ok": false}, {"html": "\\(\\lambda=-1\\) (중근)", "ok": false}], "exam": []}, {"id": "p5-b2", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-2 · 이중근", "html": "<p>특성방정식이 이중근 \\(\\lambda=-a/2\\)를 가질 때 일반해의 꼴은?</p>", "ans": "해가 하나뿐이라 \\(y_2=xe^{-ax/2}\\)를 차수축소로 만든다. Ex.4 \\(y''+y'+0.25y=0\\) → \\((c_1+c_2x)e^{-0.5x}\\).", "choices": [{"html": "\\(y=(c_1+c_2x)e^{-ax/2}\\)", "ok": true}, {"html": "\\(y=c_1e^{-ax/2}+c_2e^{ax/2}\\)", "ok": false}, {"html": "\\(y=c_1e^{-ax/2}\\)", "ok": false}, {"html": "\\(y=e^{-ax/2}(A\\cos x+B\\sin x)\\)", "ok": false}], "exam": []}, {"id": "p5-b3", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-3 · 복소근", "html": "<p>\\(y''+0.4y'+9.04y=0\\)의 일반해는?</p>", "ans": "\\(\\lambda^2+0.4\\lambda+9.04=0\\): 판별 \\(0.16-36.16=-36\\) → \\(\\lambda=-0.2\\pm3i\\) → \\(\\omega=3\\). \\(y(0)=0,y'(0)=3\\)이면 \\(y=e^{-0.2x}\\sin3x\\).", "choices": [{"html": "\\(y=e^{-0.2x}(A\\cos3x+B\\sin3x)\\)", "ok": true}, {"html": "\\(y=e^{0.2x}(A\\cos3x+B\\sin3x)\\)", "ok": false}, {"html": "\\(y=(A+Bx)e^{-0.2x}\\)", "ok": false}, {"html": "\\(y=Ae^{-0.2x}+Be^{3x}\\)", "ok": false}], "exam": []}, {"id": "p5-b4", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-4 · 미분연산자", "html": "<p>\\(P(D)=D^2-3D-40\\)을 인수분해하고 \\(P(D)y=0\\)의 일반해를 고르라.</p>", "ans": "\\(\\lambda^2-3\\lambda-40=(\\lambda-8)(\\lambda+5)\\). 근 \\(8,-5\\) 서로 다른 실근 → 두 지수의 합. 과제 2.3 #8 유형.", "choices": [{"html": "\\((D-8)(D+5)\\), \\(y=c_1e^{8x}+c_2e^{-5x}\\)", "ok": true}, {"html": "\\((D+8)(D-5)\\), \\(y=c_1e^{-8x}+c_2e^{5x}\\)", "ok": false}, {"html": "\\((D-4)(D+10)\\), \\(y=c_1e^{4x}+c_2e^{-10x}\\)", "ok": false}, {"html": "\\((D-8)(D+5)\\), \\(y=(c_1+c_2x)e^{8x}\\)", "ok": false}], "exam": []}, {"id": "p5-a5", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-1 · 초기값 문제 (Ex.2)", "html": "<p>\\(y''+y'-2y=0\\), \\(y(0)=4\\), \\(y'(0)=-5\\)를 풀라.</p>", "ans": "Step 1 \\(\\lambda=1,-2\\) → \\(y=c_1e^x+c_2e^{-2x}\\). Step 2 \\(y(0)=c_1+c_2=4\\), \\(y'(0)=c_1-2c_2=-5\\) → 빼면 \\(3c_2=9\\), \\(c_2=3\\), \\(c_1=1\\). \\(y=e^x+3e^{-2x}\\). Step 3 검산: \\(y''+y'-2y=(e^x+12e^{-2x})+(e^x-6e^{-2x})-2e^x-6e^{-2x}=0\\) ✓.", "choices": null, "exam": []}, {"id": "p5-a6", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-2 · 이중근 초기값 (Ex.4)", "html": "<p>\\(y''+y'+0.25y=0\\), \\(y(0)=3.0\\), \\(y'(0)=-3.5\\)를 풀라.</p>", "ans": "\\(\\lambda^2+\\lambda+0.25=(\\lambda+0.5)^2\\) → \\(y=(c_1+c_2x)e^{-0.5x}\\). \\(y(0)=c_1=3\\). \\(y'=c_2e^{-0.5x}-0.5(c_1+c_2x)e^{-0.5x}\\) → \\(y'(0)=c_2-1.5=-3.5\\) → \\(c_2=-2\\). \\(y=(3-2x)e^{-0.5x}\\).", "choices": null, "exam": []}, {"id": "p5-result", "type": "result", "part": 5, "title": "2.2 상수계수 · 특성방정식 세 경우 · 2.3 미분연산자 ★★"}, {"id": "p6-cover", "type": "cover", "part": 6, "no": "파트 6 · 9/23", "title": "2.5 오일러-코시 방정식 — 보조방정식 · 세 경우 ★", "star": true}, {"id": "p6-concept", "type": "concept", "part": 6, "title": "x²y'' + axy' + by = 0 은 y = x^m 을 넣는다 (1/4)", "html": "<div class=\"why\">상수계수와 짝을 이루는 \"변수계수인데 풀리는\" 특별한 방정식. 세 경우의 구조는 2.2와 같고, \\(e^{\\lambda x}\\) 자리에 \\(x^m\\), \\(x\\) 자리에 \\(\\ln x\\)가 온다.</div>\n  <div class=\"concept\"><p>\\(x^2y''+axy'+by=0\\), \\(y=x^m\\) → <b>보조방정식</b> \\[m^2+(a-1)m+b=0\\]</p></div>", "exam": [{"level": "강조", "when": "9/23 판서 ☆", "quote": "\\(x^{iq}=e^{iq\\ln x}=\\cos(q\\ln x)+i\\sin(q\\ln x)\\) — 교수 별표(오일러 공식) · 4주차 과제 2.5 #3·5·7·13"}]}, {"id": "p6-concept-2", "type": "concept", "part": 6, "title": "x²y'' + axy' + by = 0 은 y = x^m 을 넣는다 (2/4)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>근</th><th>일반해</th></tr></thead><tbody>\n      <tr><td>서로 다른 실근 \\(m_1,m_2\\)</td><td>\\(y=c_1x^{m_1}+c_2x^{m_2}\\)</td></tr>\n      <tr><td>중근 \\(m=\\frac{1-a}{2}\\)</td><td>\\(y=(c_1+c_2\\ln x)\\,x^{m}\\)</td></tr>\n      <tr><td>복소근 \\(p\\pm iq\\)</td><td>\\(y=x^{p}[c_1\\cos(q\\ln x)+c_2\\sin(q\\ln x)]\\)</td></tr>\n    </tbody></table></div></div>", "exam": []}, {"id": "p6-concept-3", "type": "concept", "part": 6, "title": "x²y'' + axy' + by = 0 은 y = x^m 을 넣는다 (3/4)", "html": "<div class=\"concept\"><p>중근 유도(9/23 판서): \\(y_2=uy_1\\) 차수축소 → \\(u''x^2+u'x=0\\) → \\(u'=1/x\\) → \\(u=\\ln x\\). 복소근: \\(x^{iq}=e^{iq\\ln x}=\\cos(q\\ln x)+i\\sin(q\\ln x)\\) → 선형성으로 실수 해 \\(x^p\\cos(q\\ln x)\\), \\(x^p\\sin(q\\ln x)\\).</p></div><div class=\"concept\"><p>예(9/23): (1) \\(x^2y''-3xy'+4y=0\\) → \\(m^2-4m+4=0\\) → \\(m=2\\) 중근 → \\(y=(c_1+c_2\\ln x)x^2\\). (2) \\(x^2y''-4xy'+6y=0\\) → \\(m^2-5m+6=0\\) → \\(m=2,3\\) → \\(y=c_1x^2+c_2x^3\\). (3) \\(x^2y''+7xy'+13y=0\\) → \\(m^2+6m+13=0\\) → \\(m=-3\\pm2i\\) → \\(y=x^{-3}[c_1\\cos(2\\ln x)+c_2\\sin(2\\ln x)]\\).</p></div>", "exam": []}, {"id": "p6-concept-4", "type": "concept", "part": 6, "title": "x²y'' + axy' + by = 0 은 y = x^m 을 넣는다 (4/4)", "html": "<div class=\"one\">한 줄: 보조방정식 m²+(a−1)m+b=0. 실근 x^m 둘 / 중근 (c₁+c₂ ln x)x^m / 복소근 x^p[cos(q ln x), sin(q ln x)].</div>\n  ", "exam": []}, {"id": "p6-mu", "type": "mu", "part": 6, "title": "2.5 오일러-코시 방정식 — 보조방정식 · 세 경우 ★", "mem": ["\\(m^2+(a-1)m+b=0\\) — \\((a-1)\\)에 주의", "중근 → \\(\\ln x\\), 복소근 → \\(\\cos(q\\ln x),\\sin(q\\ln x)\\)"], "und": ["\\(y=x^m\\)을 넣으면 왜 \\(m(m-1)+am+b\\)가 되는지", "중근에서 \\(\\ln x\\)가 붙는 이유(차수축소 \\(u'=1/x\\))"]}, {"id": "p6-b1", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-1 · 보조방정식", "html": "<p>\\(x^2y''+axy'+by=0\\)에 \\(y=x^m\\)을 대입해 얻는 보조방정식은?</p>", "ans": "\\(y'=mx^{m-1}\\), \\(y''=m(m-1)x^{m-2}\\) → \\(x^m[m(m-1)+am+b]=0\\) → \\(m^2+(a-1)m+b=0\\). 상수계수의 \\(\\lambda^2+a\\lambda+b\\)와 \\(a-1\\)이 다르다.", "choices": [{"html": "\\(m^2+(a-1)m+b=0\\)", "ok": true}, {"html": "\\(m^2+am+b=0\\)", "ok": false}, {"html": "\\(m^2+(a+1)m+b=0\\)", "ok": false}, {"html": "\\(m(m-1)+b=0\\)", "ok": false}], "exam": []}, {"id": "p6-b2", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-2 · 실근", "html": "<p>\\(x^2y''-4xy'+6y=0\\)의 일반해는?</p>", "ans": "\\(a=-4,b=6\\): \\(m^2-5m+6=(m-2)(m-3)=0\\) → \\(m=2,3\\). 지수함수가 아니라 거듭제곱.", "choices": [{"html": "\\(y=c_1x^2+c_2x^3\\)", "ok": true}, {"html": "\\(y=c_1e^{2x}+c_2e^{3x}\\)", "ok": false}, {"html": "\\(y=(c_1+c_2\\ln x)x^2\\)", "ok": false}, {"html": "\\(y=c_1x^{-2}+c_2x^{-3}\\)", "ok": false}], "exam": []}, {"id": "p6-b3", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-3 · 중근", "html": "<p>\\(x^2y''-3xy'+4y=0\\)의 일반해는?</p>", "ans": "\\(m^2-4m+4=(m-2)^2=0\\) → 중근 2 → 두 번째 해는 \\(x^2\\ln x\\)(상수계수의 \\(xe^{\\lambda x}\\) 대응).", "choices": [{"html": "\\(y=(c_1+c_2\\ln x)x^2\\)", "ok": true}, {"html": "\\(y=(c_1+c_2x)x^2\\)", "ok": false}, {"html": "\\(y=c_1x^2+c_2x^{-2}\\)", "ok": false}, {"html": "\\(y=(c_1+c_2\\ln x)x^{-2}\\)", "ok": false}], "exam": []}, {"id": "p6-b4", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-4 · 복소근", "html": "<p>\\(x^2y''+7xy'+13y=0\\)의 일반해는?</p>", "ans": "\\(m^2+6m+13=0\\) → \\(m=-3\\pm2i\\) → \\(p=-3\\), \\(q=2\\). 판서 예제 (3).", "choices": [{"html": "\\(y=x^{-3}[c_1\\cos(2\\ln x)+c_2\\sin(2\\ln x)]\\)", "ok": true}, {"html": "\\(y=e^{-3x}[c_1\\cos2x+c_2\\sin2x]\\)", "ok": false}, {"html": "\\(y=x^{3}[c_1\\cos(2\\ln x)+c_2\\sin(2\\ln x)]\\)", "ok": false}, {"html": "\\(y=c_1x^{-3}+c_2x^{2}\\)", "ok": false}], "exam": []}, {"id": "p6-a5", "type": "q", "part": 6, "kind": "응용", "qn": "응용 6-1 · 중근 유도", "html": "<p>오일러-코시 방정식의 보조방정식이 중근 \\(m\\)을 가질 때 두 번째 해가 \\(x^m\\ln x\\)인 이유를 차수축소법으로 설명하라(핵심 단계만).</p>", "ans": "\\(y_1=x^m\\), \\(y_2=uy_1\\)을 대입하면 \\(u\\) 항은 \\(y_1\\)이 해라서 사라지고 \\(u''x^2y_1+u'x(2xy_1'+ay_1)=0\\). 중근이면 \\(2xy_1'+ay_1=y_1\\)이 되어 \\(u''x^2+u'x=0\\) → \\(\\frac{u''}{u'}=-\\frac1x\\) → \\(u'=\\frac1x\\) → \\(u=\\ln x\\). ∴ \\(y_2=x^m\\ln x\\).", "choices": null, "exam": []}, {"id": "p6-a6", "type": "q", "part": 6, "kind": "응용", "qn": "응용 6-2 · 직접 풀기", "html": "<p>\\(x^2y''+xy'-y=0\\)의 일반해를 구하라.</p>", "ans": "\\(a=1,b=-1\\): \\(m^2+0\\cdot m-1=0\\) → \\(m=\\pm1\\) → \\(y=c_1x+\\dfrac{c_2}{x}\\). 검산 \\(y=1/x\\): \\(x^2\\cdot\\frac{2}{x^3}+x\\cdot(-\\frac1{x^2})-\\frac1x=\\frac2x-\\frac1x-\\frac1x=0\\) ✓.", "choices": null, "exam": []}, {"id": "p6-result", "type": "result", "part": 6, "title": "2.5 오일러-코시 방정식 — 보조방정식 · 세 경우 ★"}, {"id": "final", "type": "final"}];
const PARTS=[{"n": 1, "title": "1.1~1.3 기본 개념 · 초기값 문제 · 변수분리 · 동차형 ★", "hint": "한 줄: 선형 판별 → 분리되면 적분, 안 되면 y=ux 치환 → 상수 정리 → 조건 대입."}, {"n": 2, "title": "1.4 완전미분방정식 · 적분인자 정리 1·2 ★★", "hint": "한 줄: M_y = N_x 면 완전 → u = ∫M dx + k(y). 아니면 R = (1/Q)(P_y − Q_x) 또는 R* = (1/P)(Q_x − P_y) 로 적분인자."}, {"n": 3, "title": "1.5 선형 ODE 공식 · 베르누이 · 치환 ★★", "hint": "한 줄: 표준형 → h = ∫p dx → y = e^{−h}[∫e^h r dx + c]. 베르누이는 u = y^{1−a}로 선형화하고 마지막에 y로."}, {"n": 4, "title": "2.1 2계 선형 — 중첩 원리 · 1차독립 · 기저 · 차수축소 · 론스키안 ★", "hint": "한 줄: 제차 선형이면 c₁y₁+c₂y₂. 비례 안 하면(W≠0) 기저. y₁ 알면 y₂ = y₁∫e^{−∫p}/y₁² dx."}, {"n": 5, "title": "2.2 상수계수 · 특성방정식 세 경우 · 2.3 미분연산자 ★★", "hint": "한 줄: λ²+aλ+b=0 → 실근 두 지수 / 중근 (c₁+c₂x)e^{λx} / 복소근 e^{px}(A cos ωx + B sin ωx). P(D) 인수분해 = 특성근."}, {"n": 6, "title": "2.5 오일러-코시 방정식 — 보조방정식 · 세 경우 ★", "hint": "한 줄: 보조방정식 m²+(a−1)m+b=0. 실근 x^m 둘 / 중근 (c₁+c₂ ln x)x^m / 복소근 x^p[cos(q ln x), sin(q ln x)]."}];
/* V6E-QUIZ: #quiz 로 열면 문제 장만(시작·전체 결과 포함). 저장 키를 분리하고 이어서-학습 위치는 건드리지 않는다 (대표님 2026-09-24 시험 대비) */

}
const save=()=>{ if(location.hash==="#check") return; /* 빌드 검사 상태는 저장하지 않는다(오타 RED 2026-09-21) */ try{ localStorage.setItem(KEY,JSON.stringify(ST)); const li=QUIZ?null:lastInfo(); if(li){ const j=JSON.stringify(li); localStorage.setItem(LAST_KEY,j); localStorage.setItem(LAST_KEY+"-"+DECK_ID,j); } }catch(e){} };

function partScore(p){ ST.skip=ST.skip||{}; const qs=SLIDES.filter(s=>s.type==="q"&&s.part===p&&!ST.skip[s.id]); const b=qs.filter(q=>q.kind==="기초"), a=qs.filter(q=>q.kind==="응용");
  const cnt=arr=>({n:arr.length,ok:arr.filter(q=>ST.correct[q.id]===true).length,done:arr.filter(q=>ST.done[q.id]).length});

/* ---------- 수식: KaTeX (지침 §1). 렌더 끝나기 전엔 작업 영역을 감춘다(§0 raw LaTeX 노출 금지) ---------- */
function typeset(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true},{left:"$$",right:"$$",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  }
  const cl=el.cloneNode(true); cl.querySelectorAll(".katex,.katex-display").forEach(k=>k.remove());
  const raw=/\\\(|\\\[|\\frac|\\vec|\\begin\{|\$\$/.test(cl.textContent||"");
  el.dataset.raw=raw?"1":"0";
  if(raw&&el.id==="body"){ el.dataset.ready="false"; el.innerHTML='<div class="kicker">수식 오류</div><h2>이 장의 수식이 그대로 드러나 표시를 멈췄습니다</h2><p>정리노트의 수식 표기를 고쳐 다시 만들어야 합니다.</p>'; }
  el.dataset.ready="true";
  return !raw;
}

/* ---------- 풀이 메모장 (손글씨 캔버스 · 애플펜슬) ---------- */
const PAD={tool:"pen",cv:null,ctx:null,id:null,cur:null,ro:null,dpr:1,W:0,H:0};
function padStrokes(id){ ST.ink=ST.ink||{}; if(!ST.ink[id]) ST.ink[id]={strokes:[]}; return ST.ink[id].strokes; }
function padResize(){ const cv=PAD.cv; if(!cv||!cv.isConnected) return; const r=cv.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  PAD.dpr=Math.min(3,window.devicePixelRatio||1); PAD.W=r.width; PAD.H=r.height; cv.width=Math.round(r.width*PAD.dpr); cv.height=Math.round(r.height*PAD.dpr);
  PAD.ctx=cv.getContext("2d"); PAD.ctx.setTransform(PAD.dpr,0,0,PAD.dpr,0,0); PAD.ctx.lineCap="round"; PAD.ctx.lineJoin="round"; padRedraw(); }
function padLine(ctx,t,x0,y0,x1,y1,p){ if(!ctx) return; const W=PAD.W; ctx.globalCompositeOperation=t==="e"?"destination-out":"source-over"; ctx.strokeStyle="#111111";
  ctx.lineWidth=t==="e"?W*0.03:Math.max(1.2,W*0.0035*(0.6+(p||0.5)*1.2)); ctx.beginPath(); ctx.moveTo(x0*W,y0*W); ctx.lineTo(x1*W,y1*W); ctx.stroke(); }
function padRedraw(){ const ctx=PAD.ctx; if(!ctx) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,PAD.cv.width,PAD.cv.height); ctx.restore();
  for(const st of padStrokes(PAD.id)){ const c=st.c; if(c.length<3) continue; if(c.length===3){ padLine(ctx,st.t,c[0],c[1],c[0]+0.0005,c[1],c[2]); continue; }
    for(let i=3;i<c.length;i+=3) padLine(ctx,st.t,c[i-3],c[i-2],c[i],c[i+1],c[i+2]); } }
function padPt(e){ const r=PAD.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/PAD.W*1000)/1000, Math.round((e.clientY-r.top)/PAD.W*1000)/1000, Math.round((e.pressure||0.5)*100)/100]; }
function padAllowed(e){ return e.pointerType==="pen"||e.pointerType==="mouse"||(e.pointerType==="touch"&&ST.finger); }
function mountPad(id){
  const cv=$("#pad"); if(!cv) return; PAD.cv=cv; PAD.id=id; PAD.cur=null;
  cv.onpointerdown=e=>{ if(!padAllowed(e)) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} const pt=padPt(e); PAD.cur={t:PAD.tool==="eraser"?"e":"p",c:pt.slice()}; padLine(PAD.ctx,PAD.cur.t,pt[0],pt[1],pt[0]+0.0005,pt[1],pt[2]); };
  cv.onpointermove=e=>{ if(!PAD.cur||!padAllowed(e)) return; e.preventDefault(); const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(const ev of evs){ const pt=padPt(ev), c=PAD.cur.c, n=c.length; padLine(PAD.ctx,PAD.cur.t,c[n-3],c[n-2],pt[0],pt[1],pt[2]); c.push(pt[0],pt[1],pt[2]); } };
  const end=()=>{ if(!PAD.cur) return; padStrokes(id).push(PAD.cur); PAD.cur=null; save(); };
  cv.onpointerup=end; cv.onpointercancel=end; cv.onpointerleave=e=>{ if(PAD.cur&&e.pointerType!=="pen") end(); };
  cv.oncontextmenu=e=>e.preventDefault();
  const bar=cv.previousElementSibling;
  bar.querySelectorAll("[data-tool]").forEach(b=>{ b.onclick=()=>{ PAD.tool=b.dataset.tool; bar.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b)); }; });
  bar.querySelector('[data-act="undo"]').onclick=()=>{ padStrokes(id).pop(); save(); padRedraw(); };
  bar.querySelector('[data-act="clear"]').onclick=()=>{ if(!padStrokes(id).length||confirm("이 문제의 풀이 메모를 지울까요?")){ ST.ink[id]={strokes:[]}; save(); padRedraw(); } };
  bar.querySelector('[data-act="finger"]').onclick=function(){ ST.finger=!ST.finger; save(); this.classList.toggle("on",ST.finger); };
  if(window.ResizeObserver){ PAD.ro=new ResizeObserver(()=>padResize()); PAD.ro.observe(cv); }
  setTimeout(padResize,30);
}

function openPad(id){ const pp=$("#padPanel"); pp.classList.add("on"); $("#padBtn").classList.add("on"); const fb=pp.querySelector('[data-act="finger"]'); if(fb) fb.classList.toggle("on",!!ST.finger); mountPad(id); const cb=pp.querySelector('[data-act="close"]'); if(cb) cb.onclick=closePad; }

/* ---------- 시작 위치 점프 ---------- */
function startFrom(id,mode){
  const n=SLIDES.findIndex(x=>x.id===id); if(n<0) return;
  ST.skip=ST.skip||{}; mode=mode||"skip";
  if(mode!=="at") SLIDES.forEach((x,i)=>{ if(i<n&&x.type!=="start"&&x.type!=="jump"&&!ST.done[x.id]){ ST.done[x.id]=true; if(mode==="skip") ST.skip[x.id]=true; } });
  ST.idx=n; save(); render();
}
function unskipAll(){ ST.skip=ST.skip||{}; Object.keys(ST.skip).forEach(k=>{ delete ST.done[k]; }); ST.skip={}; save(); render(); }
function jumpListHTML(){
  ST.skip=ST.skip||{};
  const rows=[]; let cur=null;
  SLIDES.forEach((x,i)=>{
    if(x.type==="cover"){ cur={part:x.part,title:x.title,items:[]}; rows.push(cur); return; }
    if(!cur) return;
    if(x.type==="concept"||x.type==="mu"||x.type==="q"){
      const lab= x.type==="concept"?(x.title||"개념"): x.type==="mu"?"암기 vs 이해": x.qn;
      const st= ST.skip[x.id]?"skip": ST.done[x.id]?"done": (i===ST.idx?"cur":"");
      cur.items.push('<button class="jp '+st+'" data-jump="'+x.id+'">'+esc(lab)+'</button>');
    }
  });
  const nSkip=Object.keys(ST.skip).length;
  return '<div class="jump"><div class="jump-h">아는 부분은 건너뛰고 막히는 곳부터. 누른 장 앞은 전부 「건너뜀」이 되고 채점에서 빠진다.'+
    (nSkip?'<button class="btn xs" id="unskip">건너뜀 '+num(nSkip)+'장 되돌리기</button>':'')+'</div>'+
    rows.map(r=>'<div class="jump-part"><div class="jump-pt">파트 '+num(r.part)+' · '+esc(String(r.title).replace(/[\s★]+$/,""))+'</div><div class="jump-items">'+r.items.join("")+'</div></div>').join("")+'</div>';
}

/* ---------- 출처 발췌 ---------- */

/* ---------- 답·풀이 판 ---------- */

  lb.innerHTML='<div class="ans-top"><span class="kicker">'+esc(s.qn)+'</span><span class="verdict '+(ST.correct[s.id]===true?"ok":ST.correct[s.id]===false?"bad":"")+'">'+(ST.correct[s.id]===true?"정답":ST.correct[s.id]===false?"오답":"내 답")+'</span><button class="src-x" id="ansX" aria-label="닫기">✕</button></div>'+

/* ---------- 상단 진행점 (파트 안의 단계 · 시험 언급은 핑크) ---------- */

/* ---------- 힌트: 문제 장에서는 그 파트의 한 줄 요약, 개념 장에서는 없음 ---------- */

function render(){
  const i=Math.max(0,Math.min(ST.idx,SLIDES.length-1)); ST.idx=i; const s=SLIDES[i]; const body=$("#body"), act=$("#act");
  body.dataset.ready="false"; $("#hintBox").hidden=true; { const al=$("#anslb"); if(al) al.classList.remove("on"); } /* V4-ANSLB */
  act.innerHTML=""; ST.skip=ST.skip||{}; $("#doneTag").textContent=ST.skip[s.id]?"건너뜀":ST.done[s.id]?"완료":"";
  body.classList.remove("q-mode","rev","scrollable"); closePad(); $("#padBtn").hidden=true;

      '<div class="sub">오른쪽 아래 「다음」으로 언제든 넘어갈 수 있고, 페이지를 끝내면 「다음」이 실선이 됩니다. 기초 문제는 보기를 누르고, 답이 여러 개인 문제는 답을 씁니다. 왼쪽 아래 「힌트」는 그 파트의 한 줄 요약, 작은 사진은 출처(학습지·내 풀이본)입니다.</div>'+
      '<div class="sub">'+(QUIZ?'문제 '+num(SLIDES.filter(x=>x.type==="q").length)+'개 · 보기를 누르면 바로 채점 · 끝 장에서 틀린 문제만 다시':'파트 '+num(PARTS.length)+'개 · 문제 '+num(SLIDES.filter(x=>x.type==="q").length)+'개')+'</div></div>';
    act.innerHTML='<button class="btn xs" id="reset">진행 기록 지우기</button>';

    act.innerHTML='<button class="btn" id="ok">처음부터 차례로</button>'; $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };
    ST.done[s.id]=true;
  } else if(s.type==="cover"){
    body.innerHTML=examHTML(s)+'<div class="cover"><div class="kicker">'+esc(s.no)+'</div><div class="big">'+esc(String(s.title).replace(/[\s★]+$/,""))+'</div><div class="sub">개념 → 암기 vs 이해 → 기초 문제 → 응용 문제 순서로 갑니다.</div></div>';
    act.innerHTML='<button class="btn" id="ok">시작</button>'; $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };
  } else if(s.type==="concept"){
    body.innerHTML=examHTML(s)+'<div class="kicker">'+(s.part?'파트 '+num(s.part)+' · 개념':'')+'</div><h2>'+esc(s.title)+'</h2>'+s.html;
    act.innerHTML='<button class="btn" id="ok">'+(ST.done[s.id]?"다시 읽음 표시":"읽었어요 — 이해했습니다")+'</button>';
    $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); render(); };
  } else if(s.type==="mu"){
    const li=xs=>xs.map(x=>'<li>'+x+'</li>').join("");
    body.innerHTML=examHTML(s)+'<div class="kicker">파트 '+num(s.part)+' · 암기 vs 이해</div><h2>'+esc(String(s.title).replace(/[\s★]+$/,""))+' — 무엇을 외우고 무엇을 이해하나</h2>'+
      '<div class="mu"><div class="mu-mem"><div class="mu-h">암기할 것 <span class="hint">외워서 바로 나와야</span></div><ul>'+li(s.mem)+'</ul></div>'+
      '<div class="mu-und"><div class="mu-h">이해할 것 <span class="hint">왜 그런지 설명할 수 있어야</span></div><ul>'+li(s.und)+'</ul></div></div>';
    act.innerHTML='<button class="btn" id="ok">'+(ST.done[s.id]?"다시 확인 표시":"구분했어요")+'</button>';
    $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); render(); };
  } else if(s.type==="q"){
    const rev=!!ST.revealed[s.id];
    ST.answer=ST.answer||{}; ST.ink=ST.ink||{}; const my=ST.answer[s.id]||"";
    const mc=Array.isArray(s.choices)&&s.choices.length>0;
    body.classList.add("q-mode"); body.classList.toggle("rev",rev);
    const choiceHTML=()=>'<div class="choices'+(rev?" rev":"")+'">'+s.choices.map((c,i)=>{ const sel=String(my)===String(i); const cls=(sel?" sel":"")+(rev?(c.ok?" ok":(sel?" bad":"")):"");
      return '<button class="choice'+cls+'" data-ci="'+i+'"'+(rev?" disabled":"")+'><span class="cn">'+(i+1)+'</span><span class="ct">'+c.html+'</span></button>'; }).join("")+'</div>';
    body.innerHTML=examHTML(s)+'<div class="kicker">파트 '+num(s.part)+'</div><h2><span class="q-kind">'+s.kind+'</span>'+esc(s.qn)+'</h2><div class="qbody">'+s.html+'</div>'+
      (mc ? choiceHTML() : rev
        ? '<div class="myans-show"><div class="kicker">내 답</div><div class="myans-txt">'+esc(my)+'</div></div>'
        : '<div class="myans"><label for="myans">내 답 — 답만. 행렬은 [1 2; 3 4]처럼, 여러 개면 쉼표로</label><textarea id="myans" rows="2" placeholder="여기에 답을 쓰고 「답 확인」">'+esc(my)+'</textarea></div>')+
      (rev?'<div class="myans-note"><button class="btn xs" id="showAns">답 · 풀이 다시 보기</button></div>':'');
    if(rev){ if(ST.correct[s.id]!==true) openAns(s); /* V5A: 정답이면 풀이 판을 띄우지 않는다 (아토 2026-09-21) */ const sa=$("#showAns"); if(sa) sa.onclick=()=>openAns(s); }
    closePad(); $("#padBtn").hidden=false;
    if(mc&&!rev){
      /* V5A: 보기를 누르는 순간 제출·채점 (아토 2026-09-21 "객관식은 고르면 바로 정답으로 제출") */
      act.innerHTML='<span class="hint">보기를 누르면 바로 채점됩니다</span>';
      body.querySelectorAll(".choice").forEach(b=>{ b.onclick=()=>{ const ci=b.dataset.ci; if(ST.revealed[s.id]) return; const ok=!!(s.choices[+ci]&&s.choices[+ci].ok); ST.answer[s.id]=ci; ST.revealed[s.id]=true; ST.correct[s.id]=ok; ST.done[s.id]=true; save(); render(); }; });
    } else if(mc&&rev){
      const c=ST.correct[s.id];
      act.innerHTML='<span class="verdict '+(c?"ok":"bad")+'">'+(c?"정답":"오답 — 풀이를 읽고 다시")+'</span><button class="btn xs" id="retry1">다시 풀기</button>';
      $("#retry1").onclick=()=>{ delete ST.revealed[s.id]; delete ST.done[s.id]; delete ST.correct[s.id]; delete ST.answer[s.id]; save(); render(); };
    } else if(!rev){
      act.innerHTML='<button class="btn primary" id="reveal" disabled>답 확인</button>';
      const ta=$("#myans"), rb=$("#reveal");
      const sync=()=>{ ST.answer[s.id]=ta.value; rb.disabled=!ta.value.trim(); };
      ta.oninput=sync; ta.onchange=()=>{ sync(); save(); }; sync();
      rb.onclick=()=>{ if(!ta.value.trim()){ ta.focus(); return; } ST.answer[s.id]=ta.value.trim(); ST.revealed[s.id]=true; save(); render(); };
      ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); rb.click(); } };
      setTimeout(()=>{ try{ ta.focus({preventScroll:true}); }catch(e){} },50);
    } else {
      const c=ST.correct[s.id];
      act.innerHTML='<button class="btn" id="yes">맞았어요'+(c===true?" ✓":"")+'</button><button class="btn" id="no">틀렸어요 · 다시'+(c===false?" ✓":"")+'</button>';
      $("#yes").onclick=()=>{ ST.correct[s.id]=true; ST.done[s.id]=true; save(); render(); };
      $("#no").onclick=()=>{ ST.correct[s.id]=false; ST.done[s.id]=true; save(); render(); };
    }
  } else if(s.type==="result"){
    /* V6B-RESULT: 정답·오답·안 푼 3칸 + 숫자 기준 + 틀린 문제 목록 + 주버튼 하나 (브리프 v49 r3 §3) */
    const sc=partScore(s.part);
    const qs=SLIDES.filter(x=>x.type==="q"&&x.part===s.part&&!ST.skip[x.id]);
    const wrong=qs.filter(q=>ST.correct[q.id]===false), left=qs.filter(q=>!ST.done[q.id]||ST.correct[q.id]==null&&!ST.revealed[q.id]);

    const passB=sc.b.n===0||sc.b.ok===sc.b.n, needA=Math.ceil(sc.a.n*2/3), passA=sc.a.n===0||sc.a.ok>=needA;
    const rule=(sc.b.n?'기초 '+sc.b.n+'문제 전부 정답':'')+(sc.b.n&&sc.a.n?' + ':'')+(sc.a.n?'응용 '+sc.a.n+'문제 중 '+needA+'문제 이상':'');

      '<div class="score"><div class="c ok"><b>'+okN+'</b>정답</div><div class="c bad"><b>'+wrong.length+'</b>오답</div><div class="c"><b>'+left.length+'</b>안 푼 문제</div></div>'+
      '<p class="rs-rule">통과 기준: '+esc(rule||'문제 없음')+' · 지금 '+(passB&&passA?'<b class="rs-pass">통과</b>':'<b class="rs-fail">미달</b>')+' (기초 '+sc.b.ok+'/'+sc.b.n+' · 응용 '+sc.a.ok+'/'+sc.a.n+')</p>'+
      (wrong.length?'<div class="rs-list"><div class="kicker">틀린 문제</div>'+wrong.map(q=>'<button class="rs-q" data-go="'+q.id+'"><span class="q-kind">'+esc(q.kind||"")+'</span>'+esc(q.qn||q.id)+'</button>').join("")+'</div>':'')+
      (left.length&&!wrong.length?'<div class="rs-list"><div class="kicker">안 푼 문제</div>'+left.map(q=>'<button class="rs-q" data-go="'+q.id+'"><span class="q-kind">'+esc(q.kind||"")+'</span>'+esc(q.qn||q.id)+'</button>').join("")+'</div>':'');
    body.querySelectorAll(".rs-q").forEach(b=>{ b.onclick=()=>startFrom(b.dataset.go,"at"); });
    const nextPart=PARTS.find(p=>p.n===s.part+1);
    let primary;
    if(wrong.length) primary='<button class="btn primary" id="rsGo">틀린 문제 복습</button>';
    else if(left.length) primary='<button class="btn primary" id="rsGo">안 푼 문제 풀기</button>';
    else primary='<button class="btn primary" id="rsGo">'+(nextPart?'다음 파트':'전체 결과')+'</button>';
    act.innerHTML='<button class="btn xs" id="back">이 파트 처음으로</button>'+(wrong.length&&left.length?'<button class="btn xs" id="rsLeft">안 푼 문제 '+left.length+'개</button>':'')+primary;
    $("#back").onclick=()=>{ ST.idx=SLIDES.findIndex(x=>x.id==="p"+s.part+"-cover"); save(); render(); };
    const rl=$("#rsLeft"); if(rl) rl.onclick=()=>startFrom(left[0].id,"at");
    $("#rsGo").onclick=()=>{ ST.done[s.id]=true; save();
      if(wrong.length){ wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; }); save(); startFrom(wrong[0].id,"at"); }
      else if(left.length) startFrom(left[0].id,"at");
      else go(1); };
  } else if(s.type==="final"){
    const qs=SLIDES.filter(x=>x.type==="q"&&!(ST.skip||{})[x.id]); const ok=qs.filter(q=>ST.correct[q.id]===true).length, done=qs.filter(q=>ST.done[q.id]).length;
    const wrong=SLIDES.filter(x=>x.type==="q"&&ST.correct[x.id]===false);
    body.innerHTML='<div class="kicker">전체 결과</div><h1>공업수학1 · 중간고사 대비 (1장 1계 ODE · 2.1~2.3 · 2.5 오일러-코시)</h1><div class="score"><div class="c"><b>'+ok+'/'+qs.length+'</b>정답 · 푼 문제 '+num(done)+'</div><div class="c"><b>'+wrong.length+'</b>틀린 문제</div></div>'+
      '<p>'+(wrong.length?'틀린 문제: '+wrong.slice(0,6).map(w=>esc(w.qn)).join(", ")+(wrong.length>6?' 외 '+num(wrong.length-6)+'개':''):'틀린 문제가 없습니다.')+'</p>';
    act.innerHTML='<button class="btn xs" id="retry"'+(wrong.length?"":" disabled")+'>틀린 문제만 다시</button><button class="btn xs" id="first">처음으로</button>';
    $("#retry").onclick=()=>{ if(!wrong.length) return; wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; }); ST.idx=SLIDES.indexOf(wrong[0]); save(); render(); };
    $("#first").onclick=()=>{ ST.idx=0; save(); render(); };
    ST.done[s.id]=true; save();
  }
  renderSrc(s);
  const h=hintFor(s); const hb=$("#hintBtn"); hb.disabled=!h; hb.title=h?"":"이 장에는 힌트가 없습니다";
  const nxt=$("#next"), prv=$("#prev");
  const unlocked=i<SLIDES.length-1;
  nxt.disabled=!unlocked; nxt.classList.toggle("undone",!ST.done[s.id]&&unlocked); prv.disabled=(i===0);
  typeset(body);
  body.scrollTop=0;
}
function go(d){ const n=ST.idx+d; if(n<0||n>=SLIDES.length) return; ST.idx=n; save(); render(); }
$("#next").onclick=()=>go(1); $("#prev").onclick=()=>go(-1);
$("#padBtn").onclick=()=>{ const s=SLIDES[ST.idx]; if(s.type!=="q") return; if($("#padPanel").classList.contains("on")) closePad(); else openPad(s.id); };
$("#hintBtn").onclick=()=>{ const s=SLIDES[ST.idx], h=hintFor(s); if(!h) return; const hb=$("#hintBox"); if(!hb.hidden){ hb.hidden=true; return; } hb.innerHTML='<div class="kicker">힌트 · 파트 '+num(s.part)+' 한 줄</div><div>'+esc(h)+'</div>'; hb.hidden=false; typeset(hb); };
document.addEventListener("keydown",e=>{ const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||(t&&t.isContentEditable)) return; if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); });

/* ---------- 검사 모드 (#check): 전 장을 돌며 오버플로·raw LaTeX를 잰다. 빌드 뒤 헤드리스로 캡처해 확인한다 ---------- */
async function runCheck(){
  try{ await document.fonts.ready; }catch(e){}
  const body=$("#body"); const fails=[]; const saved=JSON.stringify(ST);
  const foot=$("#foot"), stage=$("#stage");
  const measure=(tag)=>{ const over=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(body.scrollHeight>body.clientHeight||body.scrollWidth>body.clientWidth); const fo=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(foot.scrollWidth>foot.clientWidth||stage.scrollHeight>stage.clientHeight); const raw=body.dataset.raw==="1"; if(over||fo||raw) fails.push(SLIDES[ST.idx].id+tag+(over?" 넘침 "+body.scrollHeight+">"+body.clientHeight:"")+(fo?" 하단/무대 넘침":"")+(raw?" rawLaTeX":"")); };
  for(let i=0;i<SLIDES.length;i++){
    const s=SLIDES[i];
    ST.idx=i; delete ST.revealed[s.id]; render(); await new Promise(r=>setTimeout(r,20)); measure("");
    if(s.type==="q"){ /* 답 공개 상태 */ ST.revealed[s.id]=true; ST.answer[s.id]=Array.isArray(s.choices)&&s.choices.length?"0":"x"; ST.correct[s.id]=false; render(); await new Promise(r=>setTimeout(r,20)); measure(" [답공개]"); { const al=$("#anslb"); if(al&&al.classList.contains("on")){ const a=al.querySelector(".ans"); if(a&&(a.scrollHeight>a.clientHeight||al.scrollHeight>al.clientHeight)) fails.push(s.id+" [풀이판] 넘침 "+a.scrollHeight+">"+a.clientHeight); al.classList.remove("on"); } }
      /* 힌트 열림 */ $("#hintBtn").click(); await new Promise(r=>setTimeout(r,20)); const hb=$("#hintBox"); if(!hb.hidden&&hb.getBoundingClientRect().top<body.getBoundingClientRect().top) fails.push(s.id+" [힌트] 상단 침범"); hb.hidden=true; }
  }
  try{ ST=JSON.parse(saved); }catch(e){}
  const c=$("#chk"); c.style.display="block";
  c.innerHTML='<h2 id="chkTitle">검사: '+SLIDES.length+'장 · 실패 '+fails.length+'</h2><pre id="chkList">'+esc(fails.join("\n"))+'</pre>';
  window.CHECK_RESULT={n:SLIDES.length,fails};
}
/* V5B-CTX: 학습 질문 패널용 문맥 (아토 2026-09-21). 앱이 gen 을 주기 전엔 보내지 않는다 — 이전 창의 늦은 메시지를 앱이 gen 으로 걸러낸다 */
let CTX_GEN=null;
const ctxPlain=(h,n)=>{ const t=String(h||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim(); return t.length>n?t.slice(0,n)+"…(잘림)":t; };
function postCtx(){
  try{
    if(location.hash==="#check"||!CTX_GEN||window.parent===window) return;
    const s=SLIDES[Math.max(0,Math.min(ST.idx,SLIDES.length-1))]; if(!s) return;
    const p=s.part?PARTS.find(x=>x.n===s.part):null; const li=lastInfo()||{};
    const msg={type:"mc-slide",v:1,gen:CTX_GEN,deck:DECK_ID,title:String(document.title).slice(0,80),sid:s.id,stype:s.type,part:s.part||null,
      partTitle:p?String(p.title).replace(/[\s★]+$/,"").slice(0,60):"",label:String(li.where||"").slice(0,80),q:null};
    if(s.type==="q"){
      const rev=!!ST.revealed[s.id], mc=Array.isArray(s.choices)&&s.choices.length>0, my=(ST.answer||{})[s.id];
      msg.q={qn:String(s.qn||"").slice(0,80),kind:String(s.kind||"").slice(0,10),text:ctxPlain(s.html,600),
        choices:mc?s.choices.slice(0,6).map(c=>ctxPlain(c.html,120)):[],
        my: my==null||my===""?null:(mc?(s.choices[+my]?ctxPlain(s.choices[+my].html,120):null):String(my).slice(0,200)),
        revealed:rev, correct: rev&&typeof ST.correct[s.id]==="boolean"?ST.correct[s.id]:null,
        answer: rev&&mc?(s.choices.map((c,i)=>c.ok?i+1:0).filter(Boolean).join(",")||null):null};
    } else if(s.type==="concept"||s.type==="mu"){ msg.q={qn:String(s.title||"").slice(0,80),kind:s.type==="mu"?"암기·이해":"개념",text:ctxPlain(s.type==="mu"?[].concat(s.mem||[],s.und||[]).join(" · "):s.html,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }
    window.parent.postMessage(msg, location.origin);
  }catch(e){}
}
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; postCtx(); } });
const _renderV5b=render; render=function(){ _renderV5b(); postCtx(); };
function boot(){
  { const m=/^#(from|done|at)=([\w-]+)(?:,pad)?$/.exec(location.hash||""); if(m){ startFrom(m[2], m[1]==="from"?"skip":m[1]); if(/,pad$/.test(location.hash)) setTimeout(()=>$("#padBtn").click(),300); return; } }
  if(location.hash==="#check"){ runCheck(); return; }
  if(location.hash==="#resume"){ render(); save(); return; }   /* V5A: 저장된 위치 그대로 */
  render();
  if(location.hash==="#src"){ setTimeout(()=>{ const b=$("#srcs .src-th"); if(b) b.click(); },400); }
}
function fontCheck(){ try{ const ok=document.fonts.check("22px 'Gowun Dodum'"); if(ok){ const w0=$("#fontWarn"); if(w0) w0.hidden=true; return; } setTimeout(fontCheck,3000); /* V6B: 늦게 로드되면 경고를 지운다 */ if(!ok){ let w=$("#fontWarn"); if(!w){ w=document.createElement("div"); w.id="fontWarn"; $("#stage").appendChild(w); } w.hidden=false; w.textContent="손글씨 글꼴을 불러오지 못해 대체 글꼴로 보입니다. 인터넷 연결을 확인하고 새로 고침하세요."; } }catch(e){} }
function whenReady(){ if(window.renderMathInElement){ fontCheck(); boot(); } else setTimeout(whenReady,40); }
document.addEventListener("DOMContentLoaded",()=>{ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(whenReady,whenReady); });
</script>
