<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공업수학1 · 중간고사 대비 2 (2.4 자유진동 · 2.7~2.10 비제차 · 3장 고계) — 교재 선행</title>
<!-- 학습게임 지침(학습게임_미적분2.md) v4 템플릿 · 오타 디자인 검토(2026-09-17, RED 14건) 반영
     폰트 2종: 본문 손글씨(Nanum Pen Script, display=block) + 수식·숫자 정자(KaTeX). 5색 고정. 16:10. 상단 진행점·챕터명·n/N, 하단 [힌트] [확인/다음]. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 5색 고정 (지침 §2) */
  --memory:#FFE45C; --caution:#E03131; --concept:#1971C2; --exam:#FF4D8D; --example:#2F9E44;
  /* 무채색 — 종이·글자·선 (의미색 아님) */
  --paper:#FFFFFF; --ink:#111111; --muted:#5F5F5F; --line:#D8D8D8; --soft:#F5F5F5; --bg:#EDEDED;
  /* 폰트 2종 (지침 §1) */
  --font-hand:'Nanum Pen Script','NanumPen',sans-serif;
  --font-num:'KaTeX_Main','Times New Roman',serif;
  /* 글자 크기 3단계 (지침 §1) */
  --fs-title:31px; --fs-body:22px; --fs-note:17px;
}
*{box-sizing:border-box}
:where(h1,h2,h3,h4,p,ul,ol,li,dl,dt,dd,pre,blockquote,figure,figcaption,table,th,td,button,input,textarea,label){margin:0;padding:0;text-indent:0;word-break:keep-all;overflow-wrap:break-word}
html,body{height:100%;width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-hand);font-size:var(--fs-body);line-height:1.45;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
body{display:grid;place-items:center;padding:12px}
.katex{font-size:1em}
#stage{position:relative;width:min(calc(100vw - 24px),calc((100dvh - 24px) * 1.6));aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
/* 상단: 진행점 · 챕터명 · n/N */
#top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) auto;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:var(--fs-note)}
#progress{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.dot{flex:0 0 12px;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.dot.done{background:var(--ink)}
.dot.exam{border-color:var(--exam);background:var(--exam)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
#chapter{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pos{font-family:var(--font-num);white-space:nowrap}
/* 작업 영역 */
#body{min-height:0;overflow:hidden;padding:18px 24px 12px;font-size:var(--fs-body);line-height:1.45}
#body[data-ready="false"]{visibility:hidden}
#body.scrollable{overflow:auto}   /* 시작 위치 장만 — 학습 내용이 아니라 목록이라 스크롤 허용 */
#body h1,#body h2{font-size:var(--fs-title);line-height:1.2;margin-bottom:8px}
#body h3{font-size:var(--fs-body)}
.num{font-family:var(--font-num)}
#fontWarn{position:absolute;left:22px;right:22px;top:58px;border:2px solid var(--caution);background:var(--paper);padding:6px 12px;font-size:var(--fs-note);z-index:12}
#fontWarn[hidden]{display:none}
#body .kicker{font-size:var(--fs-note);color:var(--muted)}
#body p,#body li{margin:0}
#body p+p{margin-top:6px}
#body ul,#body ol{padding-left:22px}
#body :is(.why,.concept,.one,.say,.extra),.ans,.myans-show,.mu>div{margin:8px 0 0;padding:10px 14px}
#body .why,#body .concept{border:2px solid var(--concept)}
#body .say{border-left:4px solid var(--concept);background:var(--soft)}
#body .say b{color:var(--concept)}
#body .one{border-left:4px solid var(--ink);background:var(--soft)}
#body .term{color:var(--concept);border-bottom:1px dashed var(--concept)}
#body .hl{background:var(--memory);padding:0 4px}
#body .red{color:var(--caution)}
#body .star{color:var(--exam)}
#body .tw{overflow:hidden;margin:8px 0 0;border:1px solid var(--line)}
#body table{border-collapse:collapse;width:100%;font-size:var(--fs-body)}
#body th,#body td{padding:3px 10px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
#body thead th{border-top:0;font-size:var(--fs-note);color:var(--muted)}
#body pre{white-space:pre-wrap;font-family:var(--font-num);font-size:var(--fs-note);line-height:1.35}
#body code{font-family:var(--font-num)}
/* 시험 언급 — 최우선 (지침 §3) */
.exam-callout{border:4px solid var(--exam);padding:10px 14px;margin:0 0 10px;background:var(--paper)}
.exam-label{font-size:var(--fs-note);color:var(--exam)}
.exam-label b{color:var(--ink)}
.exam-quote{font-size:var(--fs-body)}
/* 표지·결과 */
.cover .big{font-size:var(--fs-title);line-height:1.2;margin:6px 0 10px}
.cover .sub{font-size:var(--fs-body)}
.score{display:flex;gap:14px;margin:10px 0}
.score .c{border:2px solid var(--ink);padding:10px 16px}
.score .c b{display:block;font-family:var(--font-num);font-size:var(--fs-title)}
/* 암기 vs 이해 */
.mu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mu>div{min-width:0}
.mu-mem{background:var(--memory);border:2px solid var(--memory)}
.mu-und{border:2px solid var(--concept)}
.mu-h{margin-bottom:4px}.mu-h .hint{font-size:var(--fs-note);color:var(--muted);margin-left:6px}
.mu li{margin:2px 0}
/* 문제 */
.q-kind{display:inline-block;font-size:var(--fs-note);border:1px solid var(--ink);padding:0 8px;margin-right:8px;vertical-align:middle}
#body.q-mode{display:flex;flex-direction:column}
#body.q-mode>*{flex:0 0 auto}
.pad{flex:1 1 auto!important;min-height:100px;display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);overflow:hidden;background:var(--paper)}
.pad-bar{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:var(--fs-note);background:var(--soft);flex-wrap:wrap}
.pad-bar .hint{color:var(--muted);margin-right:auto}
.pad-bar button{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.pad-bar button.on{background:var(--ink);color:var(--paper)}
.pad canvas{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:24px 24px}
/* V4-PADPANEL 필기 판 — 「+ 필기」로 여닫음, 문제 아래쪽을 덮는다 */
#padPanel{position:absolute;left:24px;right:24px;top:38%;bottom:72px;background:var(--paper);border:2px solid var(--ink);display:none;flex-direction:column;z-index:16}
#padPanel.on{display:flex}
#padPanel .pad{flex:1 1 auto;margin:0;border:0;min-height:0}
#padBtn.on{background:var(--ink);color:var(--paper)}
/* V4-ANSLB 답·풀이 판 — 작업 영역 전체 */
#anslb{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);display:none;flex-direction:column;z-index:18;padding:14px 24px;overflow:hidden}
#anslb.on{display:flex}
#anslb .ans{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:8px}
#anslb .ans-top{display:flex;align-items:center;gap:10px}
#anslb .ans-top .kicker{margin-right:auto}
.myans{margin-top:8px}.myans label{display:block;font-size:var(--fs-note);color:var(--muted)}
.myans textarea{width:100%;font-family:var(--font-num);font-size:var(--fs-body);line-height:1.35;padding:6px 12px;border:2px solid var(--ink);background:var(--paper);resize:none;outline:none}
.myans textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.myans-show{border:2px dashed var(--ink)}
.myans-txt{font-family:var(--font-num);white-space:pre-wrap}
.ans{border:2px solid var(--example)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;font:inherit;font-size:var(--fs-body);padding:6px 12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:48px}
.choice .cn{flex:0 0 28px;height:28px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:var(--fs-note)}
.choice .ct{min-width:0}
.choice.sel{border-color:var(--ink);border-width:3px}
.choice.ok{border-color:var(--example)}.choice.ok .cn{background:var(--example);border-color:var(--example);color:var(--paper)}
.choice.bad{border-color:var(--caution)}.choice.bad .cn{background:var(--caution);border-color:var(--caution);color:var(--paper)}
.choice[disabled]{cursor:default}
.verdict{padding:6px 14px;border:2px solid var(--ink)}.verdict.ok{border-color:var(--example)}.verdict.bad{border-color:var(--caution);color:var(--caution)}
/* 시작 위치 */
.jump-h{font-size:var(--fs-note);color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jump-part{display:flex;gap:10px;align-items:flex-start;margin:2px 0}
.jump-pt{flex:0 0 220px;font-size:var(--fs-note);padding-top:6px}
.jump-items{display:flex;flex-wrap:wrap;gap:4px}
.jp{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.jp.done{background:var(--ink);color:var(--paper)}.jp.skip{color:var(--muted);text-decoration:line-through;border-color:var(--line)}.jp.cur{border:3px solid var(--ink)}
/* 하단: [이전] [힌트] · 출처 · 동작 · [확인/다음] */
#foot{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:var(--fs-body);min-height:48px;padding:4px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.xs{font-size:var(--fs-note);min-height:36px;padding:2px 12px}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#act{display:flex;gap:8px;align-items:center;margin-left:auto}#act .hint{font-size:var(--fs-note);color:var(--muted)}
#next{margin-left:8px}
#next.undone{background:var(--paper);color:var(--ink);border-style:dashed}
#doneTag{font-size:var(--fs-note);color:var(--muted)}
/* 출처 썸네일 · 확대 */
#srcs{display:flex;gap:6px}
.src-th{position:relative;width:48px;height:48px;padding:0;border:2px solid var(--ink);overflow:hidden;background:var(--paper);cursor:pointer;flex:0 0 auto}
.src-th img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.src-th .src-n{position:absolute;right:0;bottom:0;font-family:var(--font-num);font-size:var(--fs-note);background:var(--ink);color:var(--paper);padding:0 4px}
#srclb{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:20;padding:12px 18px}
#srclb.on{display:flex}
.src-top{display:flex;align-items:center;gap:10px;font-size:var(--fs-note);padding-bottom:8px}.src-top b{color:var(--ink)}.src-top .src-pos{margin-left:auto;font-family:var(--font-num)}
.src-x{font:inherit;font-size:var(--fs-body);min-width:48px;min-height:44px;border:2px solid var(--ink);background:var(--paper);cursor:pointer}
.src-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);touch-action:pan-x pan-y pinch-zoom}
.src-body img{width:100%;height:auto;display:block;cursor:zoom-in}
.src-body img.zoom{width:190%;max-width:none;cursor:zoom-out}
.src-foot{display:flex;align-items:center;gap:10px;padding-top:8px}.src-foot .hint{margin:0 auto;font-size:var(--fs-note);color:var(--muted)}
/* 힌트 상자 */
#hintBox{position:absolute;left:22px;right:22px;bottom:76px;background:var(--paper);border:2px solid var(--ink);padding:10px 14px;z-index:15}
#hintBox[hidden]{display:none}
/* 검사 모드 표시 */
#chk{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);overflow:auto;padding:20px;z-index:30;font-size:var(--fs-note);display:none}

/* ===== V6 UI — 조작부 재설계 (아토 2026-09-21). 본문(손글씨·5색)은 그대로, 조작부만 정자·평면 ===== */
:root{--ui:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;--accent:#4F9A35;--accent-soft:#EAF4E6;--bad:#D23B3B;--bad-soft:#FBEAEA;--line:#E3E8E5;--soft:#F4F6F5;--bg:#EEF1EF;--muted:#6B7570;--ink-3:#8A9490}
body{background:var(--bg)}
#stage{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
/* 상단: 분절 진행 막대 + 정자 라벨 */
#top{padding:12px 20px;gap:14px;font-family:var(--ui);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:#fff}
#progress{gap:3px;flex-wrap:nowrap;overflow:hidden}
.dot{flex:1 1 0;width:auto;min-width:6px;max-width:28px;height:6px;border:0;border-radius:3px;background:var(--line)}
.dot.done{background:var(--accent)}.dot.cur{background:#B7DBA8;outline:0;box-shadow:inset 0 0 0 1px var(--accent)}.dot.exam{background:#FFC2D8}.dot.exam.done{background:var(--exam)}
#chapter{font-family:var(--ui);font-size:13px;font-weight:600;color:#1F2A24}
#pos{font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
/* 본문 상자: 두꺼운 파란 테두리 → 좌측 바 */
#body .why,#body .concept{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
#body .one{border-radius:0 10px 10px 0}#body .say{border-radius:0 10px 10px 0}
#body .tw{border-radius:10px}
.mu-mem{border:0;border-left:3px solid #E5C400;background:#FFF9D6;border-radius:0 10px 10px 0}.mu-und{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
.q-kind{font-family:var(--ui);font-size:12px;font-weight:600;border:0;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
#body .kicker{font-family:var(--ui);font-size:12px;letter-spacing:0;color:var(--ink-3)}
/* 보기 카드 */
.choices{gap:10px;margin-top:12px}
.choice{font-family:var(--font-hand);border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;min-height:56px;transition:border-color .12s,background .12s}
.choice:hover{border-color:#B9C4BE;background:var(--soft)}
.choice .cn{flex:0 0 28px;width:28px;height:28px;border:0;border-radius:50%;background:var(--soft);color:#1F2A24;font-family:var(--ui);font-size:13px;font-weight:600}
.choice.sel{border:2px solid var(--accent);padding:11px 13px}.choice.sel .cn{background:var(--accent);color:#fff}
.choice.ok{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}.choice.ok .cn{background:var(--accent);color:#fff}
.choice.bad{border:2px solid var(--bad);background:var(--bad-soft);padding:11px 13px}.choice.bad .cn{background:var(--bad);color:#fff}
.choice[disabled]:not(.ok):not(.bad){opacity:.55}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 주관식 */
.myans label{font-family:var(--ui);font-size:12px;color:var(--muted)}
.myans textarea{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--ui);font-size:16px;background:#fff}
.myans textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.myans-show{border:1px dashed #B9C4BE;border-radius:12px;background:var(--soft)}
.myans-txt{font-family:var(--ui);font-size:16px}
.myans-note{margin-top:8px}
/* 판정·안내 */
.verdict{font-family:var(--ui);font-size:13px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:var(--soft);color:#1F2A24}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}
#act .hint{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
#doneTag{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
/* 하단 바 · 버튼 */
#foot{padding:10px 16px;gap:8px;border-top:1px solid var(--line);background:#fff}
.btn{font-family:var(--ui);font-size:14px;font-weight:600;min-height:40px;padding:6px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1F2A24;box-shadow:none}
.btn:hover{background:var(--soft)}
.btn.xs{font-size:13px;min-height:36px;padding:4px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
#next{min-width:96px}
#next.undone{background:#fff;color:var(--accent);border:1px solid var(--accent);border-style:solid}
.btn[disabled]{opacity:.35}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#padBtn.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
/* 출처 썸네일 */
#srcs{gap:6px}
.src-th{width:40px;height:40px;border:1px solid var(--line);border-radius:8px}
.src-th .src-n{font-family:var(--ui);font-size:11px;padding:0 5px;border-radius:6px 0 6px 0}
.src-x{font-family:var(--ui);font-size:14px;border:1px solid var(--line);border-radius:10px;min-height:40px}
.src-top{font-family:var(--ui);font-size:13px}.src-body{border-radius:12px}
.src-foot .hint{font-family:var(--ui);font-size:12px}
/* 힌트 · 필기 · 풀이 판 · 글꼴 경고 */
#hintBox{border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
#padPanel{border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
.pad-bar{font-family:var(--ui);font-size:12px;padding:6px 10px;background:var(--soft);border-radius:14px 14px 0 0}
.pad-bar button{font-family:var(--ui);font-size:12px;font-weight:600;min-height:32px;padding:2px 10px;border:1px solid var(--line);border-radius:8px}
.pad-bar button.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
#anslb{padding:16px 24px}
#anslb .ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
.ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
#anslb .ans-top .kicker{font-family:var(--ui);font-size:12px}
#fontWarn{border:1px solid var(--bad);border-radius:10px;font-family:var(--ui);font-size:12px}

:root{--gl:rgba(255,255,255,.60);--gl-2:rgba(255,255,255,.42);--gl-3:rgba(255,255,255,.82);--gl-line:rgba(255,255,255,.80);--gl-hi:inset 0 1px 0 rgba(255,255,255,.85);--gl-blur:blur(18px) saturate(140%);--line:rgba(17,17,17,.14);--soft:rgba(255,255,255,.40)}

  <div id="chk"></div>
</div>
<script>/* 김주영 스앵님 판정 (대표님 2026-09-29 「개념 마인드맵은 스앵님이 학습을 통해 내가 뭘 알고 뭘 모르는지 알아서 파악」) — 원본은 이 파일 하나.
   빌더가 교실·수업 노트·학습 덱·암기노트 페이지에 그대로 넣고(__JUDGE__), learn.html 은 patch_learn_judge.py 가 TJ-START~TJ-END 사이를 이 파일로 갈아 끼운다.
   기록 = localStorage atto.evidence [{t, k, n:[노드], ok, v, lid, sid, qid, a, clean}] (최대 4000건 — 넘치면 읽기·질문 기록부터 버리고 노드마다 최근 문제 6건은 남긴다)
     k: quiz(ok) 확인 문제 · read(clean) 챕터·섹션 끝(다시 설명·질문 없이 끝났으면 clean) · again 다시 설명 · ask 질문 · memo(ok) 암기노트 외움 · self(v) 카드 자가평가
     a: 같은 시도 표시(카드 「다시 저장」) — 같은 a·qid 는 새 기록으로 바꿔 넣는다(정답 수가 늘지 않는다)
   판정 = 노드마다 atto.mastery[id] = {quiz:{correct,total,ts}, self, sts, ts, score, state, auto} — learn.html 은 TJ.score 로 같은 식을 쓴다.
     quiz = 최근 6번 · self(설명할 수 있나 1~5) = 읽음 4 · 다시 설명·질문 2번 이상이면 3 · 외움 +1 · 카드 자가평가가 더 최근이면 그 값
     → 문제 없이 읽기만 하면 최대 「흔들림」, 「안다」는 문제로만. 점수식 = (0.5·정답률·감쇠(quiz.ts) + 0.2·self/5·감쇠(sts))/0.7, 문제 없으면 self/5·0.6·감쇠(sts)
     감쇠 = 60일에 걸쳐 1 → 0.4 (최저 0.4). 정답 근거와 읽기·암기 근거를 따로 감쇠한다 — 오늘 암기 체크 하나로 90일 전 정답이 새것처럼 되지 않게(오타 .91 설계 검수 ⑦)
   저장이 막히면(용량·사생활 모드) 이 페이지 안에서는 메모리 사본으로 이어 가고 rec 은 false 를 돌려준다. */
(function(g){
  var EK="atto.evidence", MK="atto.mastery", CAP=4000, KEEPQ=6, MEM={}, DIRTY={};
  function rd(k,d){ if(DIRTY[k]) return MEM[k]; try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return v==null?d:v; }catch(e){ return DIRTY[k]?MEM[k]:d; } }
  function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); DIRTY[k]=false; return true; }catch(e){ MEM[k]=v; DIRTY[k]=true; return false; } }
  function decay(ts){ if(!ts) return 1; var d=Math.max(0,(Date.now()/1000-ts)/86400); return Math.max(.4,1-d/60); }
  function score(e){ if(!e||typeof e!=="object") return {score:0,state:"unrated"};
    var q=e.quiz||{}, tot=+q.total||0, cor=+q.correct||0, sv=e.self==null?null:Math.max(1,Math.min(5,+e.self));
    if(tot<=0&&sv==null) return {score:0,state:"unrated"};
    var dq=decay(+q.ts||+e.ts||0), ds=decay(+e.sts||+e.ts||0);
    var raw=tot>0?(0.5*(cor/tot)*dq+0.2*((sv||0)/5)*ds)/0.7:(sv/5)*0.6*ds, s=Math.min(1,raw), st;
    if(tot<=0) st=(sv>=4&&s>=.4)?"shaky":"unknown"; else st=s>=.7?"known":s>=.4?"shaky":"unknown";
    return {score:Math.round(s*1000)/1000,state:st}; }
  function why(evs){ var qz=evs.filter(function(e){return e.k==="quiz";}).slice(-KEEPQ), r={q:qz.length,c:qz.filter(function(e){return e.ok;}).length,
      read:evs.filter(function(e){return e.k==="read";}).length, clean:evs.filter(function(e){return e.k==="read"&&e.clean;}).length,
      conf:evs.filter(function(e){return (e.k==="again"||e.k==="ask")&&Date.now()-e.t<21*864e5;}).length,
      memo:null, self:null, last:0, selfLast:0};
    evs.forEach(function(e){ if(e.k==="memo") r.memo=!!e.ok; if(e.k==="self") r.self={v:+e.v,t:e.t}; if(e.t>r.last) r.last=e.t; if(e.k!=="quiz"&&e.t>r.selfLast) r.selfLast=e.t; });
    return r; }
  function judgeOne(id,L,M){ var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); if(!evs.length) return;
    var r=why(evs), e=Object.assign({},M[id]||{}), qz=evs.filter(function(x){return x.k==="quiz";}).slice(-KEEPQ);
    var self=null; if(r.read||r.conf||r.memo!=null){ self=r.read?4:3; if(r.conf>=2) self=3; if(r.memo) self=Math.min(5,self+1); }
    var autoLast=0; evs.forEach(function(x){ if(x.k!=="self"&&x.t>autoLast) autoLast=x.t; });
    if(r.self&&r.self.t>=autoLast) self=r.self.v;
    e.quiz=qz.length?{correct:r.c,total:qz.length,ts:Math.round(qz[qz.length-1].t/1000)}:undefined; if(!e.quiz) delete e.quiz;
    e.self=self; if(self==null){ delete e.self; delete e.sts; } else e.sts=Math.round(r.selfLast/1000);
    e.ts=Math.round(r.last/1000); e.auto={by:"tutor",q:r.q,c:r.c,read:r.read,clean:r.clean,conf:r.conf,memo:r.memo};
    var s=score(e); e.score=s.score; e.state=s.state; M[id]=e; }
  function judge(ids){ var L=rd(EK,[]), M=rd(MK,{}); if(!Array.isArray(L)) L=[]; if(!M||typeof M!=="object") M={}; (ids||[]).forEach(function(id){ judgeOne(id,L,M); });
    wr(MK,M); return M; }
  function all(){ var L=rd(EK,[]), o={}; if(Array.isArray(L)) L.forEach(function(e){ (e&&e.n||[]).forEach(function(i){ o[i]=1; }); }); return judge(Object.keys(o)); }
  /* 상한 넘침: 노드마다 최근 문제 KEEPQ 건은 지키고, 나머지(읽기·질문·오래된 문제)에서 오래된 것부터 버린다 — 다른 노드 활동으로 정답 기록이 사라지지 않게 */
  function trim(L,cap){ cap=cap||CAP; if(L.length<=cap) return L; var seen={}, keep=[], rest=[], i;
    for(i=L.length-1;i>=0;i--){ var e=L[i], k=false; if(e&&e.k==="quiz") (e.n||[]).forEach(function(id){ seen[id]=(seen[id]||0)+1; if(seen[id]<=KEEPQ) k=true; }); (k?keep:rest).push(e); }
    keep.reverse(); rest.reverse(); rest=rest.slice(Math.max(0,rest.length-Math.max(0,cap-keep.length)));
    return keep.concat(rest).sort(function(a,b){ return (a.t||0)-(b.t||0); }); }
  function rec(ev){ if(!ev||!Array.isArray(ev.n)||!ev.n.length) return false; var L=rd(EK,[]); if(!Array.isArray(L)) L=[];
    ev.t=Date.now();
    if(ev.a!=null&&ev.qid!=null){ for(var i=L.length-1;i>=0;i--){ var x=L[i]; if(x&&x.k===ev.k&&x.qid===ev.qid&&x.a===ev.a){ L.splice(i,1); break; } } }
    L.push(ev); L=trim(L);
    /* 저장 실패 → 절반 상한으로 다시(이때도 노드마다 최근 정답은 지킨다, 오타 설계 2차) · 그래도 실패면 메모리 사본은 자르지 않은 전체로 */
    var ok=wr(EK,L); if(!ok){ var half=trim(L,Math.floor(CAP/2)); if(wr(EK,half)){ L=half; ok=true; } else { MEM[EK]=L; DIRTY[EK]=true; } }
    judge(ev.n); return ok; }
  function reasons(id){ var L=rd(EK,[]); if(!Array.isArray(L)) return null; var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); return evs.length?why(evs):null; }
  g.TJ={rec:rec,judge:judge,all:all,score:score,reasons:reasons,trim:trim};
})(typeof window!=="undefined"?window:this);
</script>
<script>
const DECK_ID="em1-mid2";

const SLIDES=[{"id": "start", "type": "start"}, {"id": "jump", "type": "jump", "part": 0}, {"id": "p1-cover", "type": "cover", "part": 1, "no": "파트 1 · 교재 선행", "title": "2.4 모델화: 자유진동 — 질량-용수철 시스템", "star": false}, {"id": "p1-concept", "type": "concept", "part": 1, "title": "my'' + cy' + ky = 0 — c² 과 4mk 를 비교해 운동 모양이 갈린다 (1/8)", "html": "<div class=\"why\">2.2에서 배운 상수계수 2계 제차 ODE가 실제로 어디에 쓰이는지 보여 주는 절이다. 용수철에 매단 물체의 운동은 특성방정식의 근이 실근이냐 중근이냐 복소근이냐에 따라 전혀 다른 모양이 된다.</div>\n  <div class=\"concept\"><p><b>[물리 선수 개념]</b> 뉴턴 제2법칙: 질량 × 가속도 = 힘(\\(my''=F\\), \\(y''\\)는 변위를 시간으로 두 번 미분한 가속도). 훅의 법칙: 용수철 힘은 늘어난 길이에 비례하고 반대 방향(\\(F=-ky\\), \\(k\\): 용수철 상수).</p></div>", "exam": []}, {"id": "p1-concept-2", "type": "concept", "part": 1, "title": "my'' + cy' + ky = 0 — c² 과 4mk 를 비교해 운동 모양이 갈린다 (2/8)", "html": "<div class=\"concept\"><p><b>정적 평형</b>: 물체를 매달면 용수철이 \\(s_0\\)만큼 늘어나 멈춘다. 용수철 힘 \\(F_0=-ks_0\\)와 무게 \\(W=mg\\)가 맞선다: \\(F_0+W=-ks_0+mg=0\\). 그래서 변위 \\(y\\)를 <b>평형 위치에서</b> 재면 무게와 \\(ks_0\\)가 서로 지워진다.</p></div>", "exam": []}, {"id": "p1-concept-3", "type": "concept", "part": 1, "title": "my'' + cy' + ky = 0 — c² 과 4mk 를 비교해 운동 모양이 갈린다 (3/8)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"spring\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 206\" width=\"560\" height=\"206\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><line x1=\"60\" y1=\"30\" x2=\"300\" y2=\"30\" stroke=\"#1F2A44\" stroke-width=\"3\"></line><line x1=\"70\" y1=\"30\" x2=\"60\" y2=\"20\" stroke=\"#8A97A6\" stroke-width=\"1.2\"></line><line x1=\"88\" y1=\"30\" x2=\"78\" y2=\"20\" stroke=\"#8A97A6\" stroke-width=\"1.2\"></line><line x1=\"106\" y1=\"30\" x2=\"9 h=\"2\"></path><text x=\"246\" y=\"86\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">c</text><rect x=\"96\" y=\"124\" width=\"148\" height=\"44\" rx=\"6\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"2\"></rect><text x=\"170.0\" y=\"151.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">m</text><line x1=\"270\" y1=\"146\" x2=\"330\" y2=\"146\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"></line><text x=\"338\" y=\"150\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">평형 위치</text><line x1=\"300\" y1=\"146\" x2=\"300\" y2=\"196\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"></line><text x=\"308\" y=\"188\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y (아래로 +)</text><text x=\"420\" y=\"50\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">Hooke: F₁ = −ky</text><text x=\"420\" y=\"72\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">감쇠력: F₂ = −cy'</text><text x=\"420\" y=\"98\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">my'' = F₁ + F₂</text><text x=\"420\" y=\"120\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">→ my'' + cy' + ky = 0</text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">평형 위치에서 잰 변위 \\(y\\). 용수철 복원력 \\(-ky\\), 감쇠력 \\(-cy'\\) → \\(my''+cy'+ky=0\\) (감쇠 없으면 \\(c=0\\)).</figcaption></figure></div>", "exam": []}, {"id": "p1-concept-4", "type": "concept", "part": 1, "title": "my'' + cy' + ky = 0 — c² 과 4mk 를 비교해 운동 모양이 갈린다 (4/8)", "html": "<div class=\"concept\"><p><b>비감쇠</b>(\\(c=0\\)): 복원력 \\(F_1=-ky\\), \\(my''=F_1\\) → \\[my''+ky=0\\] 특성방정식 \\(m\\lambda^2+k=0\\) → \\(\\lambda=\\pm i\\omega_0\\), \\(\\omega_0=\\sqrt{k/m}\\). 해 \\(y(t)=A\\cos\\omega_0t+B\\sin\\omega_0t=C\\cos(\\omega_0t-\\delta)\\) — 조화진동. \\(C=\\sqrt{A^2+B^2}\\)(진폭), \\(\\tan\\delta=B/A\\).</p></div><div class=\"concept\"><p><b>[보충] 복소근 → 삼각함수</b>: 2.2에서 본 것처럼 \\(\\lambda=\\pm i\\omega_0\\)이면 오일러 공식 \\(e^{i\\theta}=\\cos\\theta+i\\sin\\theta\\) 때문에 실수 해 \\(\\cos\\omega_0t\\), \\(\\sin\\omega_0t\\)가 기저가 된다. 고유 주파수는 \\(\\omega_0/2\\pi\\)(1초에 몇 번 흔들리나).</p></div>", "exam": []}, {"id": "p1-concept-5", "type": "concept", "part": 1, "title": "my'' + cy' + ky = 0 — c² 과 4mk 를 비교해 운동 모양이 갈린다 (5/8)", "html": "<div class=\"concept\"><p><b>감쇠</b>: 속도에 비례해 운동을 방해하는 감쇠력 \\(F_2=-cy'\\)(\\(c&gt;0\\): 감쇠 상수). \\(my''=F_1+F_2\\) → \\[my''+cy'+ky=0\\] 양변을 \\(m\\)으로 나눈 특성방정식 \\(\\lambda^2+\\frac cm\\lambda+\\frac km=0\\)의 근은 \\(\\lambda_{1,2}=-\\alpha\\pm\\beta\\), \\(\\alpha=\\dfrac{c}{2m}\\), \\(\\beta=\\dfrac{\\sqrt{c^2-4mk}}{2m}\\).</p></div><div class=\"concept\"><p><b>과감쇠</b> \\(c^2&gt;4mk\\)(서로 다른 실근): \\(y=c_1e^{-(\\alpha-\\beta)t}+c_2e^{-(\\alpha+\\beta)t}\\). 두 지수가 모두 음수라 진동 없이 0으로 간다.</p></div><div class=\"concept\"><p><b>임계감쇠</b> \\(c^2=4mk\\)(실중근 \\(\\lambda=-\\alpha\\)): \\(y=(c_1+c_2t)e^{-\\alpha t}\\). 진동하지 않는 경계로, 진동 없이 가장 빨리 평형으로 돌아온다.</p></div>", "exam": []}, {"id": "p1-concept-6", "type": "concept", "part": 1, "title": "my'' + cy' + ky = 0 — c² 과 4mk 를 비교해 운동 모양이 갈린다 (6/8)", "html": "<div class=\"concept\"><p><b>저감쇠</b> \\(c^2&lt;4mk\\)(복소근 \\(\\lambda=-\\alpha\\pm i\\omega^*\\)): \\(y=e^{-\\alpha t}(A\\cos\\omega^*t+B\\sin\\omega^*t)=Ce^{-\\alpha t}\\cos(\\omega^*t-\\delta)\\), \\(\\omega^*=\\dfrac{\\sqrt{4mk-c^2}}{2m}=\\sqrt{\\dfrac km-\\dfrac{c^2}{4m^2}}\\). 진폭이 \\(e^{-\\alpha t}\\)로 줄며 진동한다.</p></div>", "exam": []}, {"id": "p1-concept-7", "type": "concept", "part": 1, "title": "my'' + cy' + ky = 0 — c² 과 4mk 를 비교해 운동 모양이 갈린다 (7/8)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"damp\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 560 206\" width=\"560\" height=\"206\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><line x1=\"60\" y1=\"110\" x2=\"514\" y2=\"110\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><line x1=\"60\" y1=\"196\" x2=\"60\" y2=\"22\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><text x=\"510\" y=\"128\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">t</text><text x=\"52\" y=\"32\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y</text><path d=\"M60.0 30.0 L64.9 23.9 L69.8 19.7 L74.7 16.9 L79.6 15.3 L84.4 14.8 L89.3 15.0 L94.2 15.8 L99.1 17.2 L104.0 18.9 L108.9 20.9 L113.8 23.2 L118.7 25.6 L123.6 28.1 L128.4 30.8 L133.3 33.4 L138.2 36.1 L143.1 38.7 L148.0 41.4 L152.9 44.0 L157.8 46.5 L162.7 49.0 L167.6 51.4 L172.4 53.8 L177.3 56.1 L182.2 58.3 L187.1 60.4 L192.0 62.5 L196.9 64.5 L201.8 66.4 L206.7 68.2 L211.6 70.0 L216.4 71.7 L221.3 73.3 L226.2 74.9 L231.1 76.4 L236.0 77.8 L240.9 79.2 L245.8 80.5 L250.7 81.8 L255.6 83.0 L260.4 84.2 L265.3 85.3 L270.2 86.4 L275.1 87.4 L280.0 88.4 L284.9 89.3 L289.8 90.2 L294.7 91.1 L299.6 91.9 L304.4 92.7 L309.3 93.4 L314. \"3\" stroke-linejoin=\"round\">과감쇠 (c² &gt; 4mk)</text><text x=\"300\" y=\"74\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">임계감쇠 (c² = 4mk)</text><text x=\"300\" y=\"170\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">저감쇠 (c² &lt; 4mk)</text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">같은 처음 변위에서 출발: 과감쇠·임계감쇠는 진동 없이 0으로, 저감쇠는 진폭이 \\(e^{-\\alpha t}\\)로 줄며 진동한다.</figcaption></figure></div>", "exam": []}, {"id": "p1-concept-8", "type": "concept", "part": 1, "title": "my'' + cy' + ky = 0 — c² 과 4mk 를 비교해 운동 모양이 갈린다 (8/8)", "html": "<div class=\"one\">한 줄: \\(my''+cy'+ky=0\\) · 비감쇠 \\(\\omega_0=\\sqrt{k/m}\\), \\(y=C\\cos(\\omega_0t-\\delta)\\) · \\(c^2\\gtrless4mk\\)로 과감쇠·임계감쇠·저감쇠.</div>\n  ", "exam": []}, {"id": "p1-mu", "type": "mu", "part": 1, "title": "2.4 모델화: 자유진동 — 질량-용수철 시스템", "mem": ["\\(my''+cy'+ky=0\\), \\(\\omega_0^2=k/m\\)", "\\(\\alpha=\\dfrac{c}{2m}\\), \\(\\beta=\\dfrac{\\sqrt{c^2-4mk}}{2m}\\)", "과감쇠 \\(c^2>4mk\\) · 임계 \\(c^2=4mk\\) · 저감쇠 \\(c^2<4mk\\) 의 해 모양 셋", "\\(\\omega^*=\\sqrt{k/m-c^2/4m^2}\\)"], "und": ["평형 위치에서 재면 무게가 식에서 사라지는 이유", "특성근의 종류(2.2)가 곧 운동의 종류인 것", "\\(A\\cos+B\\sin\\)을 \\(C\\cos(\\omega t-\\delta)\\) 하나로 합치는 이유(진폭이 보인다)"]}, {"id": "p1-b1", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-1 · 고유 각진동수", "html": "<p>질량 \\(m=2\\) kg인 물체가 용수철 상수 \\(k=8\\) N/m인 용수철에 매달려 감쇠 없이 진동한다. \\(\\omega_0\\)는?</p>", "ans": "\\(\\omega_0=\\sqrt{k/m}=\\sqrt{8/2}=\\sqrt4=2\\) rad/s. 제곱근을 빼먹으면 4가 나온다. 주기는 \\(2\\pi/\\omega_0=\\pi\\) s.", "choices": [{"html": "16 rad/s", "ok": false, "k": 2}, {"html": "4 rad/s", "ok": false, "k": 1}, {"html": "0.5 rad/s", "ok": false, "k": 3}, {"html": "2 rad/s", "ok": true, "k": 0}], "exam": []}, {"id": "p1-b2", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-2 · 감쇠 판별", "html": "<p>\\(m=1\\), \\(k=4\\), \\(c=5\\)인 감쇠 진동 \\(y''+5y'+4y=0\\)의 운동 종류는?</p>", "ans": "\\(c^2=25\\), \\(4mk=16\\) → \\(c^2>4mk\\) → 과감쇠. 특성근 \\(\\lambda^2+5\\lambda+4=(\\lambda+1)(\\lambda+4)=0\\) → \\(-1,-4\\) 서로 다른 음의 실근 ✓.", "choices": [{"html": "과감쇠", "ok": true, "k": 0}, {"html": "비감쇠", "ok": false, "k": 3}, {"html": "임계감쇠", "ok": false, "k": 1}, {"html": "저감쇠", "ok": false, "k": 2}], "exam": []}, {"id": "p1-b3", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-3 · 임계 감쇠 상수", "html": "<p>\\(m=1\\), \\(k=4\\)인 질량-용수철 시스템이 임계감쇠가 되는 감쇠 상수 \\(c\\)는?</p>", "ans": "임계감쇠 \\(c^2=4mk=16\\) → \\(c=4\\)(\\(c>0\\)). 16은 \\(c^2\\)이다.", "choices": [{"html": "2", "ok": false, "k": 1}, {"html": "4", "ok": true, "k": 0}, {"html": "16", "ok": false, "k": 2}, {"html": "8", "ok": false, "k": 3}], "exam": []}, {"id": "p1-b4", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-4 · 저감쇠의 해", "html": "<p>\\(y''+2y'+5y=0\\)의 일반해는?</p>", "ans": "\\(\\lambda^2+2\\lambda+5=0\\) → \\(\\lambda=\\dfrac{-2\\pm\\sqrt{4-20}}{2}=-1\\pm2i\\). 실수부 \\(-1\\)이 감쇠(\\(\\alpha=1\\)), 허수부 2가 \\(\\omega^*\\). 공식으로도 \\(\\omega^*=\\sqrt{5-1}=2\\) ✓.", "choices": [{"html": "\\(Ae^{-t}+Be^{-5t}\\)", "ok": false, "k": 2}, {"html": "\\(e^{-2t}(A\\cos t+B\\sin t)\\)", "ok": false, "k": 1}, {"html": "\\(e^{-t}(A\\cos2t+B\\sin2t)\\)", "ok": true, "k": 0}, {"html": "\\((A+Bt)e^{-t}\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p1-a5", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-1 · 비감쇠 초기값 문제", "html": "<p>\\(m=2\\) kg, \\(k=8\\) N/m인 비감쇠 질량-용수철 시스템에서 처음 변위 \\(y(0)=0.1\\) m, 처음 속도 \\(y'(0)=0.4\\) m/s이다. \\(y(t)\\)와 진폭을 구하라.</p>", "ans": "Step 1 일반해: \\(2y''+8y=0\\) → \\(\\omega_0=2\\), \\(y=A\\cos2t+B\\sin2t\\). Step 2 특수해(초기조건 적용): \\(y(0)=A=0.1\\). \\(y'=-2A\\sin2t+2B\\cos2t\\) → \\(y'(0)=2B=0.4\\) → \\(B=0.2\\). ∴ \\(y=0.1\\cos2t+0.2\\sin2t\\). 진폭 \\(C=\\sqrt{0.1^2+0.2^2}=\\sqrt{0.05}\\approx0.22\\) m.", "choices": null, "exam": []}, {"id": "p1-a6", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-2 · 임계감쇠 초기값 문제", "html": "<p>\\(y''+4y'+4y=0\\), \\(y(0)=1\\), \\(y'(0)=0\\)을 풀고 운동 종류를 쓰라.</p>", "ans": "Step 1 일반해: \\(\\lambda^2+4\\lambda+4=(\\lambda+2)^2=0\\) → 중근 \\(-2\\) → 임계감쇠(\\(c^2=16=4mk\\)). \\(y=(c_1+c_2t)e^{-2t}\\). Step 2 특수해(초기조건 적용): \\(y(0)=c_1=1\\). \\(y'=c_2e^{-2t}-2(c_1+c_2t)e^{-2t}\\) → \\(y'(0)=c_2-2c_1=0\\) → \\(c_2=2\\). ∴ \\(y=(1+2t)e^{-2t}\\) — 진동 없이 0으로 간다.", "choices": null, "exam": []}, {"id": "p1-result", "type": "result", "part": 1, "title": "2.4 모델화: 자유진동 — 질량-용수철 시스템"}, {"id": "p2-cover", "type": "cover", "part": 2, "no": "파트 2 · 교재 선행", "title": "2.7 비제차 상미분방정식 — 미정계수법", "star": false}, {"id": "p2-concept", "type": "concept", "part": 2, "title": "일반해 = 제차 일반해 y_h + 특수해 y_p — y_p 는 표 2.1로 모양을 정하고 계수를 맞춘다 (1/6)", "html": "<div class=\"why\">지금까지는 오른쪽이 0인 제차 방정식만 풀었다. 오른쪽에 \\(r(x)\\)(외부 입력)가 붙으면 비제차다. 풀이는 두 조각: 입력이 없을 때의 답 \\(y_h\\) + 입력 때문에 생기는 답 하나 \\(y_p\\).</div>\n  <div class=\"concept\"><p><b>비제차 선형 ODE</b>: \\(y''+p(x)y'+q(x)y=r(x)\\), \\(r(x)\\neq0\\). \\(r(x)\\)가 0이면 제차(2.1~2.6).</p></div><div class=\"concept\"><p><b>해 사이의 관계(교수님 슬라이드)</b>: ① 비제차의 두 해의 차는 제차의 해다(빼면 \\(r\\)이 지워진다). ② 비제차의 해 + 제차의 해 = 비제차의 해.</p></div>", "exam": []}, {"id": "p2-concept-2", "type": "concept", "part": 2, "title": "일반해 = 제차 일반해 y_h + 특수해 y_p — y_p 는 표 2.1로 모양을 정하고 계수를 맞춘다 (2/6)", "html": "<div class=\"concept\"><p><b>정의) 일반해</b>: \\[y(x)=y_h(x)+y_p(x)\\] \\(y_h=c_1y_1+c_2y_2\\)는 제차 방정식의 일반해, \\(y_p\\)는 임의의 상수를 포함하지 않는 비제차 방정식의 해 하나.</p></div><div class=\"concept\"><p><b>미정계수법</b>: <b>상수계수</b> 방정식 \\(y''+ay'+by=r(x)\\)에서 \\(r(x)\\)가 지수·다항식·사인·코사인과 그 곱이면, \\(y_p\\)도 같은 꼴에 모르는 계수를 붙여 가정하고 원식에 넣어 계수를 맞춘다. 표 2.1(교수님 슬라이드):</p></div>", "exam": []}, {"id": "p2-concept-3", "type": "concept", "part": 2, "title": "일반해 = 제차 일반해 y_h + 특수해 y_p — y_p 는 표 2.1로 모양을 정하고 계수를 맞춘다 (3/6)", "html": "<div class=\"concept\"><table><tr><th>\\(r(x)\\)의 항</th><th>\\(y_p\\) 선택</th></tr>\n<tr><td>\\(ke^{\\gamma x}\\)</td><td>\\(Ce^{\\gamma x}\\)</td></tr>\n<tr><td>\\(kx^n\\ (n=0,1,\\dots)\\)</td><td>\\(K_nx^n+\\dots+K_1x+K_0\\)</td></tr>\n<tr><td>\\(k\\cos\\omega x\\), \\(k\\sin\\omega x\\)</td><td>\\(K\\cos\\omega x+M\\sin\\omega x\\)</td></tr>\n<tr><td>\\(ke^{\\alpha x}\\cos\\omega x\\), \\(ke^{\\alpha x}\\sin\\omega x\\)</td><td>\\(e^{\\alpha x}(K\\cos\\omega x+M\\sin\\omega x)\\)</td></tr></table></div>", "exam": []}, {"id": "p2-concept-4", "type": "concept", "part": 2, "title": "일반해 = 제차 일반해 y_h + 특수해 y_p — y_p 는 표 2.1로 모양을 정하고 계수를 맞춘다 (4/6)", "html": "<div class=\"concept\"><p><b>선택 규칙 셋</b> ① <b>기본 규칙</b>: \\(r(x)\\)가 표의 왼쪽 함수면 오른쪽 꼴로 \\(y_p\\)를 잡는다. ② <b>변형 규칙</b>: 잡은 \\(y_p\\)의 항이 제차 해와 겹치면 \\(x\\)를 곱한다(특성방정식의 이중근과 겹치면 \\(x^2\\)). ③ <b>합 규칙</b>: \\(r(x)\\)가 여러 항의 합이면 각각의 \\(y_p\\)를 더한다.</p></div><div class=\"concept\"><p><b>예(기본 규칙)</b>: \\(y''-3y'+2y=4x\\). Step 1 제차 일반해: \\(\\lambda^2-3\\lambda+2=(\\lambda-1)(\\lambda-2)=0\\) → \\(y_h=c_1e^x+c_2e^{2x}\\). Step 2 비제차 특수해: \\(r=4x\\)(1차 다항식) → \\(y_p=K_1x+K_0\\), \\(y_p'=K_1\\), \\(y_p''=0\\).</p></div>", "exam": []}, {"id": "p2-concept-5", "type": "concept", "part": 2, "title": "일반해 = 제차 일반해 y_h + 특수해 y_p — y_p 는 표 2.1로 모양을 정하고 계수를 맞춘다 (5/6)", "html": "<div class=\"concept\"><p>원식에 대입: \\(0-3K_1+2(K_1x+K_0)=4x\\) → \\(x\\)의 계수 \\(2K_1=4\\) → \\(K_1=2\\), 상수항 \\(-3K_1+2K_0=0\\) → \\(K_0=3\\). ∴ \\(y=c_1e^x+c_2e^{2x}+2x+3\\).</p></div><div class=\"concept\"><p><b>예(변형 규칙)</b>: \\(y''-3y'+2y=e^x\\). 표대로 \\(Ce^x\\)를 잡으면 \\(e^x\\)가 이미 \\(y_h\\)에 있어 대입하면 0이 된다 → \\(y_p=Cxe^x\\). \\(y_p'=C(1+x)e^x\\), \\(y_p''=C(2+x)e^x\\) → 대입 \\(C[(2+x)-3(1+x)+2x]e^x=-Ce^x=e^x\\) → \\(C=-1\\), \\(y_p=-xe^x\\).</p></div>", "exam": []}, {"id": "p2-concept-6", "type": "concept", "part": 2, "title": "일반해 = 제차 일반해 y_h + 특수해 y_p — y_p 는 표 2.1로 모양을 정하고 계수를 맞춘다 (6/6)", "html": "<div class=\"one\">한 줄: \\(y=y_h+y_p\\) · 표 2.1로 \\(y_p\\) 모양 · 겹치면 \\(x\\)(이중근이면 \\(x^2\\))를 곱한다 · 합이면 따로 구해 더한다 · Step 1 → 2 → 3.</div>\n  ", "exam": []}, {"id": "p2-mu", "type": "mu", "part": 2, "title": "2.7 비제차 상미분방정식 — 미정계수법", "mem": ["\\(y=y_h+y_p\\)", "표 2.1 네 줄: \\(e^{\\gamma x}\\) · \\(x^n\\) · \\(\\cos,\\sin\\) · \\(e^{\\alpha x}\\cos,\\sin\\)", "기본·변형(\\(x\\), 이중근 \\(x^2\\))·합 규칙", "풀이 형식 Step 1 제차 일반해 → Step 2 비제차 특수해 → Step 3 초기조건 적용"], "und": ["두 비제차 해의 차가 제차 해인 이유(선형성)", "겹치는 항을 그대로 쓰면 대입했을 때 0이 되는 이유", "초기조건은 \\(y_h+y_p\\) 전체에 적용해야 하는 이유"]}, {"id": "p2-b1", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-1 · 기본 규칙", "html": "<p>\\(y''+y=5e^{3x}\\)에서 미정계수법으로 잡을 \\(y_p\\)의 꼴은?</p>", "ans": "제차 해는 \\(\\cos x,\\sin x\\)라 \\(e^{3x}\\)와 겹치지 않는다 → 기본 규칙 \\(Ce^{3x}\\). 대입하면 \\(9C+C=5\\) → \\(C=\\frac12\\).", "choices": [{"html": "\\(C\\cos3x+M\\sin3x\\)", "ok": false, "k": 2}, {"html": "\\(K_1x+K_0\\)", "ok": false, "k": 3}, {"html": "\\(Ce^{3x}\\)", "ok": true, "k": 0}, {"html": "\\(Cxe^{3x}\\)", "ok": false, "k": 1}], "exam": []}, {"id": "p2-b2", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-2 · 변형 규칙", "html": "<p>\\(y''-y'-2y=3e^{2x}\\)의 특수해 \\(y_p\\)는?</p>", "ans": "특성근 \\(\\lambda^2-\\lambda-2=(\\lambda-2)(\\lambda+1)=0\\) → 2, −1. \\(e^{2x}\\)가 제차 해(단순근) → \\(y_p=Cxe^{2x}\\). \\(y_p'=C(1+2x)e^{2x}\\), \\(y_p''=C(4+4x)e^{2x}\\) → 대입 \\(C[(4+4x)-(1+2x)-2x]e^{2x}=3Ce^{2x}=3e^{2x}\\) → \\(C=1\\).", "choices": [{"html": "\\(e^{2x}\\)", "ok": false, "k": 1}, {"html": "\\(xe^{2x}\\)", "ok": true, "k": 0}, {"html": "\\(3e^{2x}\\)", "ok": false, "k": 3}, {"html": "\\(x^2e^{2x}\\)", "ok": false, "k": 2}], "exam": []}, {"id": "p2-b3", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-3 · 합 규칙", "html": "<p>\\(y''+3y'+2y=4e^x+2x\\)에서 잡을 \\(y_p\\)의 꼴은?</p>", "ans": "\\(r\\)이 \\(4e^x\\)와 \\(2x\\)의 합 → 각각 \\(Ce^x\\), \\(K_1x+K_0\\)(1차 다항식은 상수항까지)을 더한다. 특성근 −1, −2라 겹침 없음.", "choices": [{"html": "\\(Cxe^x+K_1x+K_0\\)", "ok": false, "k": 2}, {"html": "\\(Ce^x+K_1x\\)", "ok": false, "k": 1}, {"html": "\\((K_1x+K_0)e^x\\)", "ok": false, "k": 3}, {"html": "\\(Ce^x+K_1x+K_0\\)", "ok": true, "k": 0}], "exam": []}, {"id": "p2-b4", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-4 · 초기조건은 어디에", "html": "<p>비제차 초기값 문제에서 초기조건 \\(y(0),y'(0)\\)을 넣는 대상은?</p>", "ans": "초기조건은 실제 운동 \\(y\\)에 대한 조건이라 \\(y_h+y_p\\) 전체에 넣어 \\(c_1,c_2\\)를 정한다(교수님 Step 3). \\(y_h\\)에만 넣으면 \\(y_p\\)의 값이 빠져 틀린다.", "choices": [{"html": "일반해 \\(y=y_h+y_p\\) 전체", "ok": true, "k": 0}, {"html": "특수해 \\(y_p\\)만", "ok": false, "k": 2}, {"html": "제차 해 \\(y_h\\)만", "ok": false, "k": 1}, {"html": "원래 방정식의 \\(r(x)\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p2-a5", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-1 · Step 1~3", "html": "<p>\\(y''+4y=8x^2\\), \\(y(0)=0\\), \\(y'(0)=2\\)를 풀어라.</p>", "ans": "Step 1 제차 일반해: \\(\\lambda^2+4=0\\) → \\(\\pm2i\\) → \\(y_h=A\\cos2x+B\\sin2x\\). Step 2 비제차 특수해: \\(y_p=K_2x^2+K_1x+K_0\\) → \\(y_p''=2K_2\\) → \\(2K_2+4(K_2x^2+K_1x+K_0)=8x^2\\) → \\(K_2=2\\), \\(K_1=0\\), \\(2K_2+4K_0=0\\) → \\(K_0=-1\\) → \\(y_p=2x^2-1\\). Step 3 초기조건 적용: \\(y(0)=A-1=0\\) → \\(A=1\\), \\(y'(0)=2B=2\\) → \\(B=1\\). ∴ \\(y=\\cos2x+\\sin2x+2x^2-1\\).", "choices": null, "exam": []}, {"id": "p2-a6", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-2 · 이중근과 겹칠 때", "html": "<p>\\(y''-4y'+4y=6e^{2x}\\)의 일반해를 구하라.</p>", "ans": "Step 1: \\((\\lambda-2)^2=0\\) → 이중근 2 → \\(y_h=(c_1+c_2x)e^{2x}\\). Step 2: \\(e^{2x}\\)도 \\(xe^{2x}\\)도 제차 해 → 변형 규칙(이중근)으로 \\(y_p=Cx^2e^{2x}\\). \\(y_p'=C(2x+2x^2)e^{2x}\\), \\(y_p''=C(2+8x+4x^2)e^{2x}\\) → 대입 \\(C[(2+8x+4x^2)-4(2x+2x^2)+4x^2]e^{2x}=2Ce^{2x}=6e^{2x}\\) → \\(C=3\\). ∴ \\(y=(c_1+c_2x)e^{2x}+3x^2e^{2x}\\).", "choices": null, "exam": []}, {"id": "p2-a7", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-3 · 합 규칙 계산", "html": "<p>\\(y''+3y'+2y=4e^x+2x\\)의 특수해 \\(y_p\\)를 구하라.</p>", "ans": "\\(y_p=Ce^x+K_1x+K_0\\). ① \\(e^x\\) 부분: \\((1+3+2)C=6C=4\\) → \\(C=\\frac23\\). ② 다항식 부분: \\(3K_1+2(K_1x+K_0)=2x\\) → \\(2K_1=2\\) → \\(K_1=1\\), \\(3K_1+2K_0=0\\) → \\(K_0=-\\frac32\\). ∴ \\(y_p=\\frac23e^x+x-\\frac32\\).", "choices": null, "exam": []}, {"id": "p2-result", "type": "result", "part": 2, "title": "2.7 비제차 상미분방정식 — 미정계수법"}, {"id": "p3-cover", "type": "cover", "part": 3, "no": "파트 3 · 교재 선행", "title": "2.8 강제진동 · 공진 · 맥놀이 + 2.9 RLC 회로", "star": false}, {"id": "p3-concept", "type": "concept", "part": 3, "title": "my'' + cy' + ky = F₀cos ωt — 입력 주파수가 고유 주파수에 가까울수록 크게 흔들린다 (1/6)", "html": "<div class=\"why\">2.4의 용수철에 바깥에서 주기적으로 힘을 주면(강제진동) 방정식이 비제차가 된다. 2.7의 미정계수법으로 \\(y_p\\)를 구하면 공진·맥놀이 같은 현상이 식에서 바로 보인다. 전기 회로(RLC)도 똑같은 방정식이다.</div>\n  <div class=\"concept\"><p><b>자유운동</b>(외력 없음): \\(my''+cy'+ky=0\\). <b>강제운동</b>(외력 있음): \\(my''+cy'+ky=r(t)\\). \\(r(t)\\) = 입력(구동력), \\(y(t)\\) = 출력(시스템의 응답).</p></div><div class=\"concept\"><p><b>주기적인 외력</b> \\(r(t)=F_0\\cos\\omega t\\)(감쇠가 있거나 \\(\\omega\\neq\\omega_0\\)일 때): 미정계수법으로 \\(y_p=a\\cos\\omega t+b\\sin\\omega t\\), \\[a=F_0\\frac{m(\\omega_0^2-\\omega^2)}{m^2(\\omega_0^2-\\omega^2)^2+\\omega^2c^2},\\qquad b=F_0\\frac{\\omega c}{m^2(\\omega_0^2-\\omega^2)^2+\\omega^2c^2}\\]</p></div>", "exam": []}, {"id": "p3-concept-2", "type": "concept", "part": 3, "title": "my'' + cy' + ky = F₀cos ωt — 입력 주파수가 고유 주파수에 가까울수록 크게 흔들린다 (2/6)", "html": "<div class=\"concept\"><p><b>비감쇠</b>(\\(c=0\\), \\(\\omega\\neq\\omega_0\\)): \\(y_p=\\dfrac{F_0}{m(\\omega_0^2-\\omega^2)}\\cos\\omega t\\), 일반해 \\(y=C\\cos(\\omega_0t-\\delta)+\\dfrac{F_0}{m(\\omega_0^2-\\omega^2)}\\cos\\omega t\\) — 고유 진동(주파수 \\(\\omega_0/2\\pi\\))과 구동 진동(\\(\\omega/2\\pi\\))의 중첩.</p></div><div class=\"concept\"><p><b>공진</b> \\(\\omega=\\omega_0\\): 분모가 0이 되어 위 \\(y_p\\)를 쓸 수 없다. \\(\\cos\\omega_0t\\)가 제차 해와 겹치므로 변형 규칙(\\(t\\) 곱)으로 \\(y_p=\\dfrac{F_0}{2m\\omega_0}t\\sin\\omega_0t\\) — 진폭이 \\(t\\)에 비례해 끝없이 커진다.</p></div><div class=\"concept\"><p><b>맥놀이</b>(\\(\\omega\\)가 \\(\\omega_0\\)에 가깝지만 다를 때, 처음 정지 \\(y(0)=y'(0)=0\\)): \\(y=\\dfrac{F_0}{m(\\omega_0^2-\\omega^2)}(\\cos\\omega t-\\cos\\omega_0t)=\\dfrac{2F_0}{m(\\omega_0^2-\\omega^2)}\\sin\\dfrac{(\\omega_0+\\omega)t}{2}\\sin\\dfrac{(\\omega_0-\\omega)t}{2}\\) — 빠른 진동의 진폭이 느린 사인으로 커졌다 작아졌다 한다.</p></div>", "exam": []}, {"id": "p3-concept-3", "type": "concept", "part": 3, "title": "my'' + c{F_0}{m(\\omega_0^2-\\omega^2)}\\cos\\omega t\\)", "공진 \\(\\omega=\\omega_0\\): \\(y_p=\\dfrac{F_0}{2m\\omega_0}t\\sin\\omega_0t\\)", "과도해 = \\(y_h\\), 정상상태해 = \\(y_p\\)", "RLC: \\(LI''+RI'+I/C=E'(t)\\), \\(S=\\omega L-\\frac1{\\omega C}\\), \\(I_0=E_0/\\sqrt{R^2+S^2}\\)", "상사: \\(L\\)–\\(m\\), \\(R\\)–\\(c\\), \\(1/C\\)–\\(k\\)"], "und": ["공진에서 \\(t\\)가 곱해지는 이유(변형 규칙)", "맥놀이가 두 진동의 합에서 생기는 이유", "감쇠가 있으면 과도해가 사라지는 이유(\\(e^{-\\alpha t}\\))"]}, {"id": "p3-b1", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-1 · 비감쇠 강제진동", "html": "<p>\\(y''+9y=16\\cos t\\)의 특수해 \\(y_p\\)는? (\\(m=1\\), \\(\\omega_0=3\\), \\(\\omega=1\\))</p>", "ans": "\\(y_p=\\dfrac{F_0}{m(\\omega_0^2-\\omega^2)}\\cos\\omega t=\\dfrac{16}{1\\cdot(9-1)}\\cos t=2\\cos t\\). 검산: \\(-2\\cos t+18\\cos t=16\\cos t\\) ✓.", "choices": [{"html": "\\(16\\cos t\\)", "ok": false, "k": 1}, {"html": "\\(2\\cos t\\)", "ok": true, "k": 0}, {"html": "\\(8t\\sin t\\)", "ok": false, "k": 3}, {"html": "\\(\\frac{16}{9}\\cos t\\)", "ok": false, "k": 2}], "exam": []}, {"id": "p3-b2", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-2 · 공진", "html": "<p>\\(y''+4y=8\\cos2t\\)의 특수해는?</p>", "ans": "\\(\\omega=\\omega_0=2\\) → 공진. \\(y_p=\\dfrac{F_0}{2m\\omega_0}t\\sin\\omega_0t=\\dfrac{8}{2\\cdot1\\cdot2}t\\sin2t=2t\\sin2t\\). 진폭 \\(2t\\)가 시간에 비례해 커진다.", "choices": [{"html": "\\(2t\\sin2t\\)", "ok": true, "k": 0}, {"html": "\\(\\frac{8}{3}\\cos2t\\)", "ok": false, "k": 2}, {"html": "\\(2\\cos2t\\)", "ok": false, "k": 1}, {"html": "\\(4t\\cos2t\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p3-b3", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-3 · 과도해와 정상상태해", "html": "<p>감쇠가 있는 강제진동 \\(my''+cy'+ky=F_0\\cos\\omega t\\)(\\(c&gt;0\\))에서 충분히 시간이 지난 뒤 남는 것은?</p>", "ans": "\\(y_h\\)는 \\(e^{-\\alpha t}\\)가 붙어 0으로 사라지는 과도해, \\(y_p\\)는 외력과 같은 주파수로 계속 남는 정상상태해.", "choices": [{"html": "과도해 \\(y_h\\)", "ok": false, "k": 1}, {"html": "\\(y_h\\)와 \\(y_p\\) 둘 다 0", "ok": false, "k": 2}, {"html": "처음 변위 \\(y(0)\\)", "ok": false, "k": 3}, {"html": "정상상태해 \\(y_p\\)", "ok": true, "k": 0}], "exam": []}, {"id": "p3-b4", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-4 · 상사성", "html": "<p>RLC 회로 \\(LI''+RI'+\\frac1CI=E'(t)\\)와 \\(my''+cy'+ky=r(t)\\)를 비교할 때 저항 \\(R\\)에 대응하는 것은?</p>", "ans": "같은 자리의 계수끼리: \\(L\\leftrightarrow m\\)(2계 미분 앞), \\(R\\leftrightarrow c\\)(1계 미분 앞, 에너지를 열로 버림), \\(1/C\\leftrightarrow k\\).", "choices": [{"html": "질량 \\(m\\)", "ok": false, "k": 1}, {"html": "변위 \\(y\\)", "ok": false, "k": 3}, {"html": "감쇠 상수 \\(c\\)", "ok": true, "k": 0}, {"html": "용수철 상수 \\(k\\)", "ok": false, "k": 2}], "exam": []}, {"id": "p3-a5", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-1 · 감쇠 강제진동의 정상상태", "html": "<p>\\(y''+2y'+5y=10\\cos t\\)의 정상상태해를 구하고 그 진폭을 구하라.</p>", "ans": "\\(m=1\\), \\(c=2\\), \\(k=5\\) → \\(\\omega_0^2=5\\), \\(\\omega=1\\), \\(F_0=10\\). 분모 \\(m^2(\\omega_0^2-\\omega^2)^2+\\omega^2c^2=16+4=20\\). \\(a=10\\cdot\\dfrac{1\\cdot4}{20}=2\\), \\(b=10\\cdot\\dfrac{1\\cdot2}{20}=1\\) → \\(y_p=2\\cos t+\\sin t\\). 검산(직접 대입): \\(y_p''=-2\\cos t-\\sin t\\), \\(2y_p'=-4\\sin t+2\\cos t\\), \\(5y_p=10\\cos t+5\\sin t\\) → 합 \\(10\\cos t\\) ✓. 진폭 \\(\\sqrt{2^2+1^2}=\\sqrt5\\).", "choices": null, "exam": []}, {"id": "p3-a6", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-2 · RLC 정상상태 전류", "html": "<p>\\(R=4\\ \\Omega\\), \\(L=1\\) H, 전기 용량 \\(C=\\frac13\\) F, 기전력 \\(E(t)=10\\sin t\\) V인 RLC 직렬 회로의 정상상태 전류 \\(I_p\\)와 진폭 \\(I_0\\)를 구하라.</p>", "ans": "① \\(\\omega=1\\), \\(E_0=10\\). 리액턴스 \\(S=\\omega L-\\dfrac1{\\omega C}=1-3=-2\\). ② \\(R^2+S^2=16+4=20\\). ③ \\(a=\\dfrac{-E_0S}{R^2+S^2}=\\dfrac{20}{20}=1\\), \\(b=\\dfrac{E_0R}{R^2+S^2}=\\dfrac{40}{20}=2\\) → \\(I_p=\\cos t+2\\sin t\\). ④ \\(I_0=\\dfrac{E_0}{\\sqrt{R^2+S^2}}=\\dfrac{10}{\\sqrt{20}}=\\sqrt5\\) A(\\(=\\sqrt{1^2+2^2}\\) ✓). 검산: \\(I''+4I'+3I=10\\cos t\\) 에 넣으면 성립.", "choices": null, "exam": []}, {"id": "p3-result", "type": "result", "part": 3, "title": "2.8 강제진동 · 공진 · 맥놀이 + 2.9 RLC 회로"}, {"id": "p4-cover", "type": "cover", "part": 4, "no": "파트 4 · 교재 선행", "title": "2.10 매개변수변환법 — 어떤 r(x)에도 쓰는 공식", "star": false}, {"id": "p4-concept", "type": "concept", "part": 4, "title": "y_p = −y₁∫(y₂r/W)dx + y₂∫(y₁r/W)dx — 표준형에서만 (1/2)", "html": "<div class=\"why\">미정계수법은 \\(r(x)\\)가 표 2.1에 있는 함수일 때만 된다. \\(\\sec x\\), \\(\\csc x\\), \\(e^x/x\\)처럼 표에 없는 입력이면 매개변수변환법(변수변분법)을 쓴다. 대신 적분 계산이 따라온다.</div>\n  <div class=\"concept\"><p><b>적용 조건</b>: 구간 \\(I\\)에서 연속인 \\(p(x),q(x),r(x)\\)를 갖는 \\(y''+p(x)y'+q(x)y=r(x)\\). 반드시 <b>표준형</b>(\\(y''\\)의 계수가 1)으로 쓴 뒤 적용한다 — \\(x^2y''+\\dots\\)이면 먼저 \\(x^2\\)으로 나눈다.</p></div><div class=\"concept\"><p><b>아이디어</b>: 제차 일반해 \\(y_h=c_1y_1+c_2y_2\\)의 상수 \\(c_1,c_2\\)를 함수 \\(u(x),v(x)\\)로 바꿔 \\(y_p=u(x)y_1+v(x)y_2\\)로 놓는다. 조건 \\(u'y_1+v'y_2=0\\)을 붙이고 원식에 넣으면 \\(u'y_1'+v'y_2'=r(x)\\).</p></div>", "exam": []}, {"id": "p4-concept-2", "type": "concept", "part": 4, "title": "y_p = −y₁∫(y₂r/W)dx + y₂∫(y₁r/W)dx — 표준형에서만 (2/2)", "html": "<div class=\"concept\"><p><b>연립해서</b>(크래머, 분모가 론스키안 \\(W=y_1y_2'-y_2y_1'\\)): \\(u'=-\\dfrac{y_2r}{W}\\), \\(v'=\\dfrac{y_1r}{W}\\) → \\[y_p(x)=-y_1\\int\\frac{y_2r}{W}dx+y_2\\int\\frac{y_1r}{W}dx\\] 적분상수는 붙이지 않는다(\\(y_h\\)에 이미 들어 있다).</p></div><div class=\"concept\"><p><b>예</b>: \\(y''+y=\\csc x\\)(\\(\\sin x\\neq0\\)인 구간). 기저 \\(y_1=\\cos x\\), \\(y_2=\\sin x\\), \\(W=\\cos^2x+\\sin^2x=1\\). \\(y_p=-\\cos x\\int\\sin x\\csc x\\,dx+\\sin x\\int\\cos x\\csc x\\,dx=-\\cos x\\int1\\,dx+\\sin x\\int\\cot x\\,dx=-x\\cos x+\\sin x\\ln|\\sin x|\\).</p></div><div class=\"concept\"><p><b>[보충] 적분</b>: \\(\\int\\cot x\\,dx=\\ln|\\sin x|\\)(분모 \\(\\sin x\\)의 미분이 분자 \\(\\cos x\\)), \\(\\int\\tan x\\,dx=-\\ln|\\cos x|\\).</p></div><div class=\"one\">한 줄: 표준형 · \\(W=y_1y_2'-y_2y_1'\\) · \\(y_p=-y_1\\int\\frac{y_2r}{W}dx+y_2\\int\\frac{y_1r}{W}dx\\) · 적분상수 없음.</div>\n  ", "exam": []}, {"id": "p4-mu", "type": "mu", "part": 4, "title": "2.10 매개변수변환법 — 어떤 r(x)에도 쓰는 공식", "mem": ["\\(y_p=-y_1\\int\\dfrac{y_2r}{W}dx+y_2\\int\\dfrac{y_1r}{W}dx\\) (앞 항이 −)", "\\(W=y_1y_2'-y_2y_1'\\)", "표준형(\\(y''\\) 계수 1)에서만"], "und": ["상수를 함수로 바꾼다는 이름의 뜻", "\\(u'y_1+v'y_2=0\\) 조건을 붙이는 이유(2계 도함수가 생기지 않게)", "미정계수법과 언제 무엇을 쓰는지"]}, {"id": "p4-b1", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-1 · 어느 방법", "html": "<p>\\(y''+4y=\\sec2x\\)의 특수해를 구하려 한다. 알맞은 방법은?</p>", "ans": "\\(\\sec2x=1/\\cos2x\\)는 미분할수록 새 꼴(\\(\\sec\\tan\\) …)이 생겨 유한 개의 계수로 맞출 수 없다 → 매개변수변환법.", "choices": [{"html": "미정계수법 — \\(y_p=K\\cos2x+M\\sin2x\\)", "ok": false, "k": 2}, {"html": "차수축소법만 쓸 수 있다", "ok": false, "k": 3}, {"html": "미정계수법 — \\(y_p=K\\sec2x\\)", "ok": false, "k": 1}, {"html": "매개변수변환법 — \\(\\sec2x\\)는 표 2.1에 없다", "ok": true, "k": 0}], "exam": []}, {"id": "p4-b2", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-2 · 론스키안", "html": "<p>\\(y''+4y=0\\)의 기저 \\(y_1=\\cos2x\\), \\(y_2=\\sin2x\\)의 론스키안은?</p>", "ans": "\\(W=y_1y_2'-y_2y_1'=\\cos2x\\cdot2\\cos2x-\\sin2x\\cdot(-2\\sin2x)=2(\\cos^22x+\\sin^22x)=2\\).", "choices": [{"html": "\\(\\cos4x\\)", "ok": false, "k": 2}, {"html": "1", "ok": false, "k": 1}, {"html": "2", "ok": true, "k": 0}, {"html": "0", "ok": false, "k": 3}], "exam": []}, {"id": "p4-b3", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-3 · 표준형", "html": "<p>\\(x^2y''-xy'+y=x^3\\)(\\(x&gt;0\\))에 매개변수변환법을 쓸 때 공식에 넣는 \\(r(x)\\)는?</p>", "ans": "표준형으로 \\(x^2\\)으로 나눈다: \\(y''-\\frac1xy'+\\frac1{x^2}y=x\\) → \\(r(x)=x\\). 나누지 않고 \\(x^3\\)을 넣으면 틀린다.", "choices": [{"html": "\\(x\\)", "ok": true, "k": 0}, {"html": "\\(1/x\\)", "ok": false, "k": 3}, {"html": "\\(x^3\\)", "ok": false, "k": 1}, {"html": "\\(x^5\\)", "ok": false, "k": 2}], "exam": []}, {"id": "p4-a4", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-1 · sec 입력", "html": "<p>\\(y''+4y=\\sec2x\\)(\\(\\cos2x\\neq0\\)인 구간)의 일반해를 구하라.</p>", "ans": "① \\(y_1=\\cos2x\\), \\(y_2=\\sin2x\\), \\(W=2\\). ② \\(-y_1\\int\\dfrac{y_2r}{W}dx=-\\cos2x\\int\\dfrac{\\sin2x\\sec2x}{2}dx=-\\cos2x\\int\\dfrac{\\tan2x}{2}dx=-\\cos2x\\cdot\\left(-\\dfrac14\\ln|\\cos2x|\\right)\\). ③ \\(y_2\\int\\dfrac{y_1r}{W}dx=\\sin2x\\int\\dfrac12dx=\\dfrac x2\\sin2x\\). ∴ \\(y=c_1\\cos2x+c_2\\sin2x+\\dfrac14\\cos2x\\ln|\\cos2x|+\\dfrac x2\\sin2x\\).", "choices": null, "exam": []}, {"id": "p4-a5", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-2 · 이중근 기저", "html": "<p>\\(y''-2y'+y=\\dfrac{e^x}{x}\\)(\\(x&gt;0\\))의 일반해를 구하라.</p>", "ans": "① \\((\\lambda-1)^2=0\\) → \\(y_1=e^x\\), \\(y_2=xe^x\\). ② \\(W=e^x(e^x+xe^x)-xe^x\\cdot e^x=e^{2x}\\). ③ \\(-y_1\\int\\dfrac{xe^x\\cdot e^x/x}{e^{2x}}dx=-e^x\\int1\\,dx=-xe^x\\). ④ \\(y_2\\int\\dfrac{e^x\\cdot e^x/x}{e^{2x}}dx=xe^x\\int\\dfrac1xdx=xe^x\\ln x\\). ∴ \\(y=(c_1+c_2x)e^x-xe^x+xe^x\\ln x\\) — \\(-xe^x\\)는 \\(y_h\\)에 흡수해 \\(y=(c_1+c_2x)e^x+xe^x\\ln x\\)로 써도 된다.", "choices": null, "exam": []}, {"id": "p4-result", "type": "result", "part": 4, "title": "2.10 매개변수변환법 — 어떤 r(x)에도 쓰는 공식"}, {"id": "p5-cover", "type": "cover", "part": 5, "no": "파트 5 · 교재 선행", "title": "3.1~3.2 고계 제차 선형 ODE — n계 이론 · 상수계수 · 고계 오일러-코시", "star": false}, {"id": "p5-concept", "type": "concept", "part": 5, "title": "2계에서 배운 것을 n계로 — 해 n개, n×n 론스키안, 특성방정식 n차 (1/5)", "html": "<div class=\"why\">3장은 새 방법이 아니라 2장을 n계로 넓힌 것이다. 해가 n개 필요하고, 1차독립 판정은 n×n 론스키안(행렬식), 상수계수면 n차 특성방정식의 근으로 기저를 만든다.</div>\n  <div class=\"concept\"><p><b>n계 선형 ODE</b>: \\(y^{(n)}+p_{n-1}(x)y^{(n-1)}+\\dots+p_1(x)y'+p_0(x)y=r(x)\\)(표준형: \\(y^{(n)}\\)의 계수 1). \\(r=0\\)이면 제차, \\(r\\neq0\\)이면 비제차.</p></div><div class=\"concept\"><p><b>정리 1(기본 정리)</b>: 제차 선형 방정식의 해들의 합과 상수배도 해다(중첩). 비제차·비선형에서는 성립하지 않는다.</p></div>", "exam": []}, {"id": "p5-concept-2", "type": "concept", "part": 5, "title": "2계에서 배운 것을 n계로 — 해 n개, n×n 론스키안, 특성방정식 n차 (2/5)", "html": "<div class=\"concept\"><p><b>일반해</b> \\(y=c_1y_1+\\dots+c_ny_n\\), <b>기저</b> = 1차독립인 해 \\(y_1,\\dots,y_n\\) 한 벌, <b>특수해</b> = \\(c_1,\\dots,c_n\\)에 특정한 값을 준 것. 초기값 문제는 초기조건 n개(\\(y(x_0),y'(x_0),\\dots,y^{(n-1)}(x_0)\\))로, 계수가 구간 \\(I\\)에서 연속이고 \\(x_0\\)가 \\(I\\) 안에 있으면 해가 하나로 정해진다(존재·유일성 — 2.6 정리 1의 확장).</p></div><div class=\"concept\"><p><b>1차독립</b>: \\(k_1y_1+\\dots+k_ny_n=0\\)이 구간 전체에서 성립하는 것은 \\(k_1=\\dots=k_n=0\\)뿐일 때. 하나라도 0이 아닌 \\(k\\)로 성립하면 1차종속.</p></div>", "exam": []}, {"id": "p5-concept-3", "type": "concept", "part": 5, "title": "2계에서 배운 것을 n계로 — 해 n개, n×n 론스키안, 특성방정식 n차 (3/5)", "html": "<div class=\"concept\"><p><b>론스키안</b>: \\(W(y_1,\\dots,y_n)\\) = 1행에 \\(y_1\\dots y_n\\), 2행에 도함수, …, n행에 \\((n-1)\\)계 도함수를 쓴 n×n 행렬식. 해들이 1차종속 ⟺ 어떤 \\(x_0\\)에서 \\(W=0\\)(그러면 \\(I\\) 전체에서 \\(W\\equiv0\\)). \\(W\\neq0\\)인 점이 하나라도 있으면 1차독립 → 기저.</p></div><div class=\"concept\"><p><b>[미적2 연결] 3×3 행렬식</b>은 1행 여인수 전개로 계산한다: \\(\\begin{vmatrix}a&amp;b&amp;c\\\\d&amp;e&amp;f\\\\g&amp;h&amp;i\\end{vmatrix}=a(ei-fh)-b(di-fg)+c(dh-eg)\\).</p></div><div class=\"concept\"><p><b>정리 4·5</b>: 계수가 연속이면 일반해가 존재하고, 일반해는 모든 해를 포함한다(특이해가 없다).</p></div><div class=\"concept\"><p><b>상수계수</b> \\(y^{(n)}+a_{n-1}y^{(n-1)}+\\dots+a_0y=0\\): \\(y=e^{\\lambda x}\\)를 넣으면 특성방정식 \\(\\lambda^n+a_{n-1}\\lambda^{n-1}+\\dots+a_0=0\\). 근의 종류대로 기저를 모은다.</p></div>", "exam": []}, {"id": "p5-concept-4", "type": "concept", "part": 5, "title": "2계에서 배운 것을 n계로 — 해 n개, n×n 론스키안, 특성방정식 n차 (4/5)", "html": "<div class=\"concept\"><p>① 서로 다른 실근 \\(\\lambda_1,\\dots\\): \\(e^{\\lambda_1x},\\dots\\) ② 단순 복소근 \\(\\gamma\\pm i\\omega\\): \\(e^{\\gamma x}\\cos\\omega x\\), \\(e^{\\gamma x}\\sin\\omega x\\) ③ m중 실근 \\(\\lambda\\): \\(e^{\\lambda x},xe^{\\lambda x},\\dots,x^{m-1}e^{\\lambda x}\\) ④ 복소 이중근: \\(e^{\\gamma x}\\cos\\omega x,e^{\\gamma x}\\sin\\omega x,xe^{\\gamma x}\\cos\\omega x,xe^{\\gamma x}\\sin\\omega x\\).</p></div><div class=\"concept\"><p><b>[보충] 3차 방정식 풀기</b>: 상수항의 약수(±1, ±2, …)를 넣어 0이 되는 근을 하나 찾고, 그 1차식으로 나눠(조립제법) 2차식으로 만든다.</p></div><div class=\"concept\"><p><b>고계 오일러-코시</b>: \\(x^3y'''+ax^2y''+bxy'+cy=0\\) 꼴(\\(x&gt;0\\))은 \\(y=x^m\\)을 넣는다(\\(x^3y'''=m(m-1)(m-2)x^m\\) …). 보조방정식의 근이 서로 다른 실근이면 \\(x^{m_1},x^{m_2},x^{m_3}\\), 중근 \\(m\\)이면 \\(x^m,(\\ln x)x^m\\), 삼중근이면 \\((\\ln x)^2x^m\\)까지, 복소근 \\(p\\pm iq\\)면 \\(x^p\\cos(q\\ln x),x^p\\sin(q\\ln x)\\).</p></div>", "exam": []}, {"id": "p5-concept-5", "type": "concept", "part": 5, "title": "2계에서 배운 것을 n계로 — 해 n개, n×n 론스키안, 특성방정식 n차 (5/5)", "html": "<div class=\"one\">한 줄: 해 n개 · n×n 론스키안 ≠ 0이면 기저 · 특성방정식 n차: 서로 다른 근·복소근·m중근(\\(x^ke^{\\lambda x}\\)) · 오일러-코시는 \\(x^m\\), 중근이면 \\(\\ln x\\) 곱.</div>\n  ", "exam": []}, {"id": "p5-mu", "type": "mu", "part": 5, "title": "3.1~3.2 고계 제차 선형 ODE — n계 이론 · 상수계수 · 고계 오일러-코시", "mem": ["m중 실근 → \\(e^{\\lambda x},xe^{\\lambda x},\\dots,x^{m-1}e^{\\lambda x}\\)", "복소근 \\(\\gamma\\pm i\\omega\\) → \\(e^{\\gamma x}\\cos\\omega x,e^{\\gamma x}\\sin\\omega x\\)(중근이면 \\(x\\)도 곱)", "\\(W\\)의 모양(행마다 한 번 더 미분)", "오일러-코시: 중근 \\((\\ln x)x^m\\), 삼중근 \\((\\ln x)^2x^m\\)"], "und": ["n계면 초기조건이 n개 필요한 이유", "\\(W=0\\)과 1차종속의 관계", "2장 규칙이 그대로 n계로 늘어나는 것"]}, {"id": "p5-b1", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-1 · 서로 다른 실근", "html": "<p>\\(y'''-6y''+11y'-6y=0\\)의 일반해는?</p>", "ans": "특성방정식 \\(\\lambda^3-6\\lambda^2+11\\lambda-6=0\\). \\(\\lambda=1\\)을 넣으면 \\(1-6+11-6=0\\) → \\((\\lambda-1)(\\lambda^2-5\\lambda+6)=(\\lambda-1)(\\lambda-2)(\\lambda-3)\\) → 근 1, 2, 3.", "choices": [{"html": "\\(c_1e^{-x}+c_2e^{-2x}+c_3e^{-3x}\\)", "ok": false, "k": 1}, {"html": "\\(c_1e^x+c_2e^{2x}+c_3e^{3x}\\)", "ok": true, "k": 0}, {"html": "\\((c_1+c_2x+c_3x^2)e^x\\)", "ok": false, "k": 2}, {"html": "\\(c_1e^x+c_2e^{6x}+c_3e^{11x}\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p5-b2", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-2 · 중근이 섞일 때", "html": "<p>\\(y'''-3y'+2y=0\\)의 일반해는?</p>", "ans": "\\(\\lambda^3-3\\lambda+2\\)에 \\(\\lambda=1\\): \\(1-3+2=0\\) → \\((\\lambda-1)(\\lambda^2+\\lambda-2)=(\\lambda-1)^2(\\lambda+2)\\). 1은 이중근 → \\(e^x,xe^x\\), −2 → \\(e^{-2x}\\). \\(e^x\\)를 두 번 쓰면 1차종속이라 기저가 아니다.", "choices": [{"html": "\\(c_1e^x+c_2e^{x}+c_3e^{-2x}\\)", "ok": false, "k": 2}, {"html": "\\(c_1e^x+c_2e^{-2x}\\)", "ok": false, "k": 1}, {"html": "\\((c_1+c_2x)e^{-2x}+c_3e^x\\)", "ok": false, "k": 3}, {"html": "\\((c_1+c_2x)e^x+c_3e^{-2x}\\)", "ok": true, "k": 0}], "exam": []}, {"id": "p5-b3", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-3 · 3×3 론스키안", "html": "<p>\\(1,\\ x,\\ x^2\\)의 론스키안은?</p>", "ans": "\\(W=\\begin{vmatrix}1&x&x^2\\\\0&1&2x\\\\0&0&2\\end{vmatrix}\\) — 아래 삼각 부분이 0이라 대각선 곱 \\(1\\cdot1\\cdot2=2\\neq0\\) → 1차독립(\\(y'''=0\\)의 기저).", "choices": [{"html": "0", "ok": false, "k": 1}, {"html": "\\(2x\\)", "ok": false, "k": 2}, {"html": "2", "ok": true, "k": 0}, {"html": "\\(x^2\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p5-b4", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-4 · 고계 오일러-코시", "html": "<p>\\(x^3y'''+3x^2y''-2xy'+2y=0\\)(\\(x&gt;0\\))의 일반해는?</p>", "ans": "\\(y=x^m\\): \\(m(m-1)(m-2)+3m(m-1)-2m+2=m^3-3m+2=(m-1)^2(m+2)=0\\) → 중근 1, 단순근 −2 → \\(x,\\ (\\ln x)x,\\ x^{-2}\\). 상수계수처럼 \\(e^{x}\\)를 쓰면 안 된다.", "choices": [{"html": "\\(c_1x+c_2x^2+c_3x^{-2}\\)", "ok": false, "k": 1}, {"html": "\\(c_1x+c_2x\\ln x+c_3x^{-2}\\)", "ok": true, "k": 0}, {"html": "\\(c_1x+c_2x^{-1}+c_3x^{2}\\)", "ok": false, "k": 3}, {"html": "\\(c_1e^x+c_2xe^x+c_3e^{-2x}\\)", "ok": false, "k": 2}], "exam": []}, {"id": "p5-a5", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-1 · 3계 초기값 문제", "html": "<p>\\(y'''+y'=0\\), \\(y(0)=2\\), \\(y'(0)=1\\), \\(y''(0)=-1\\)을 풀어라.</p>", "ans": "Step 1: \\(\\lambda^3+\\lambda=\\lambda(\\lambda^2+1)=0\\) → \\(0,\\ \\pm i\\) → \\(y=c_1+c_2\\cos x+c_3\\sin x\\). Step 2 초기조건: \\(y(0)=c_1+c_2=2\\). \\(y'=-c_2\\sin x+c_3\\cos x\\) → \\(y'(0)=c_3=1\\). \\(y''=-c_2\\cos x-c_3\\sin x\\) → \\(y''(0)=-c_2=-1\\) → \\(c_2=1\\), \\(c_1=1\\). ∴ \\(y=1+\\cos x+\\sin x\\).", "choices": null, "exam": []}, {"id": "p5-a6", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-2 · 론스키안으로 기저 판정", "html": "<p>\\(e^x,\\ e^{2x},\\ e^{3x}\\)의 론스키안을 구하고, 이 셋이 \\(y'''-6y''+11y'-6y=0\\)의 기저인지 판정하라.</p>", "ans": "\\(W=\\begin{vmatrix}e^x&e^{2x}&e^{3x}\\\\e^x&2e^{2x}&3e^{3x}\\\\e^x&4e^{2x}&9e^{3x}\\end{vmatrix}=e^{6x}\\begin{vmatrix}1&1&1\\\\1&2&3\\\\1&4&9\\end{vmatrix}\\)(각 열에서 공통인수를 뺀다). 1행 전개: \\(1(18-12)-1(9-3)+1(4-2)=6-6+2=2\\) → \\(W=2e^{6x}\\neq0\\). 셋 다 해(특성근 1, 2, 3)이고 1차독립 → 기저.", "choices": null, "exam": []}, {"id": "p5-result", "type": "result", "part": 5, "title": "3.1~3.2 고계 제차 선형 ODE — n계 이론 · 상수계수 · 고계 오일러-코시"}, {"id": "p6-cover", "type": "cover", "part": 6, "no": "파트 6 · 교재 선행", "title": "3.3 고계 비제차 선형 ODE — 미정계수법 · 매개변수변환법의 일반화", "star": false}, {"id": "p6-concept", "type": "concept", "part": 6, "title": "y = y_h + y_p — y_p 는 미정계수(곱의 원리 포함) 또는 y_p = Σ y_k∫(W_k/W) r dx (1/4)", "html": "<div class=\"why\">2.7·2.10을 n계로 넓힌다. 미정계수법의 규칙은 그대로(겹치면 \\(x\\)를 곱한다), 매개변수변환법은 론스키안 \\(W\\)와 \\(W_k\\)(한 열을 바꾼 행렬식)로 공식이 일반화된다.</div>\n  <div class=\"concept\"><p><b>n계 비제차</b>: \\(y^{(n)}+p_{n-1}y^{(n-1)}+\\dots+p_0y=r(x)\\), 일반해 \\(y=y_h+y_p\\)(\\(y_h\\): 제차 일반해, \\(y_p\\): 상수 없는 비제차 해 하나).</p></div>", "exam": []}, {"id": "p6-concept-2", "type": "concept", "part": 6, "title": "y = y_h + y_p — y_p 는 미정계수(곱의 원리 포함) 또는 y_p = Σ y_k∫(W_k/W) r dx (2/4)", "html": "<div class=\"concept\"><p><b>미정계수법(교수님 표, 상수계수 방정식)</b>: 기본 원리 — \\(r\\)이 다항식·사인·코사인·지수함수면 같은 꼴로. 중첩의 원리 — \\(r=\\sum r_k\\)이면 \\(y_p=\\sum y_{pk}\\). 곱의 원리 — \\(r\\)의 꼴이 보조해(\\(y_h\\))의 일부와 겹치면 겹치지 않을 때까지 \\(x\\)를 곱해 고친다(m중근이면 \\(x^m\\)).</p></div>", "exam": []}, {"id": "p6-concept-3", "type": "concept", "part": 6, "title": "y = y_h + y_p — y_p 는 미정계수(곱의 원리 포함) 또는 y_p = Σ y_k∫(W_k/W) r dx (3/4)", "html": "<div class=\"concept\"><p><b>매개변수변환법의 일반화</b>(표준형에서): \\[y_p(x)=\\sum_{k=1}^{n}y_k(x)\\int\\frac{W_k(x)}{W(x)}r(x)\\,dx\\] \\(W\\) = 기저 \\(y_1,\\dots,y_n\\)의 론스키안, \\(W_k\\) = \\(W\\)의 \\(k\\)번째 열을 열벡터 \\([0\\ 0\\ \\cdots\\ 0\\ 1]^T\\)로 바꾼 행렬식. n = 2이면 2.10 공식과 같다(\\(W_1=-y_2\\), \\(W_2=y_1\\)).</p></div><div class=\"concept\"><p><b>교수님 Ex.2 흐름</b>(비제차 오일러-코시 \\(x^3y'''-3x^2y''+6xy'-6y=x^4\\ln x\\), \\(x&gt;0\\)): Step 1 보조방정식 \\(m(m-1)(m-2)-3m(m-1)+6m-6=0\\) → \\(m=1,2,3\\) → \\(y_h=c_1x+c_2x^2+c_3x^3\\). Step 2 행렬식 \\(W=2x^3\\), \\(W_1=x^4\\), \\(W_2=-2x^3\\), \\(W_3=x^2\\).</p></div>", "exam": []}, {"id": "p6-concept-4", "type": "concept", "part": 6, "title": "y = y_h + y_p — y_p 는 미정계수(곱의 원리 포함) 또는 y_p = Σ y_k∫(W_k/W) r dx (4/4)", "html": "<div class=\"concept\"><p>Step 3 적분: 표준형으로 \\(x^3\\)을 나눠 \\(r=x\\ln x\\)를 넣으면 \\(y_p=\\frac16x^4\\left(\\ln x-\\frac{11}6\\right)\\). <b>표준형 \\(r\\)</b>을 쓰는 것이 핵심이다(\\(x^4\\ln x\\)를 그대로 넣으면 틀린다).</p></div><div class=\"concept\"><p><b>탄성보(교수님 Ex.3)</b>: 들보의 처짐 \\(y\\)는 \\(EIy^{(4)}=f(x)\\)(\\(f\\): 단위 길이당 하중) — 4계 비제차 ODE. 지지 조건이 경계조건: 단순지지 \\(y=y''=0\\), 고정 \\(y=y'=0\\), 자유단 \\(y''=y'''=0\\).</p></div><div class=\"one\">한 줄: \\(y=y_h+y_p\\) · 미정계수: 기본·중첩·곱(겹치면 \\(x^m\\)) · 매개변수변환: \\(y_p=\\sum y_k\\int\\frac{W_k}{W}r\\,dx\\), \\(W_k\\)는 k열을 \\([0\\cdots01]^T\\)로 · 반드시 표준형 \\(r\\).</div>\n  ", "exam": []}, {"id": "p6-mu", "type": "mu", "part": 6, "title": "3.3 고계 비제차 선형 ODE — 미정계수법 · 매개변수변환법의 일반화", "mem": ["\\(y_p=\\sum y_k\\int\\dfrac{W_k}{W}r\\,dx\\)", "\\(W_k\\): \\(W\\)의 k번째 열 → \\([0,\\dots,0,1]^T\\)", "곱의 원리: 겹치면 \\(x\\)(m중근이면 \\(x^m\\))", "표준형으로 나눈 \\(r(x)\\)를 쓴다"], "und": ["n = 2일 때 2.10 공식과 같아지는 것", "\\(W_k\\)가 크래머 법칙에서 나오는 이유", "탄성보 식이 4계인 이유와 경계조건의 뜻"]}, {"id": "p6-b1", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-1 · 곱의 원리", "html": "<p>\\(y'''-y'=2x\\)의 특수해는?</p>", "ans": "특성근 \\(\\lambda(\\lambda^2-1)=0\\) → \\(0,\\pm1\\). \\(r=2x\\)(다항식)의 꼴 \\(K_1x+K_0\\)의 상수항이 \\(\\lambda=0\\)의 해 1과 겹침 → \\(x\\)를 곱해 \\(y_p=x(K_1x+K_0)=K_1x^2+K_0x\\). \\(y_p'=2K_1x+K_0\\), \\(y_p'''=0\\) → \\(-(2K_1x+K_0)=2x\\) → \\(K_1=-1\\), \\(K_0=0\\).", "choices": [{"html": "\\(-x^2\\)", "ok": true, "k": 0}, {"html": "\\(x^2\\)", "ok": false, "k": 2}, {"html": "\\(-2x\\)", "ok": false, "k": 1}, {"html": "\\(-x^2+x\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p6-b2", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-2 · 기본 원리", "html": "<p>\\(y'''-2y''-y'+2y=e^{3x}\\)의 특수해는?</p>", "ans": "특성근은 1, −1, 2라 3과 겹치지 않는다. \\(y_p=Ce^{3x}\\) → \\((27-18-3+2)C=8C=1\\) → \\(C=\\frac18\\).", "choices": [{"html": "\\(xe^{3x}\\)", "ok": false, "k": 3}, {"ht /* ---------- 수식: KaTeX (지침 §1). 렌더 끝나기 전엔 작업 영역을 감춘다(§0 raw LaTeX 노출 금지) ---------- */
function typeset(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true},{left:"$$",right:"$$",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  }
  const cl=el.cloneNode(true); cl.querySelectorAll(".katex,.katex-display").forEach(k=>k.remove());
  const raw=/\\\(|\\\[|\\frac|\\vec|\\begin\{|\$\$/.test(cl.textContent||"");
  el.dataset.raw=raw?"1":"0";
  if(raw&&el.id==="body"){ el.dataset.ready="false"; el.innerHTML='<div class="kicker">수식 오류</div><h2>이 장의 수식이 그대로 드러나 표시를 멈췄습니다</h2><p>정리노트의 수식 표기를 고쳐 다시 만들어야 합니다.</p>'; }
  el.dataset.ready="true";

}

/* ---------- 풀이 메모장 (손글씨 캔버스 · 애플펜슬) ---------- */
const PAD={tool:"pen",cv:null,ctx:null,id:null,cur:null,ro:null,dpr:1,W:0,H:0};
function padStrokes(id){ ST.ink=ST.ink||{}; if(!ST.ink[id]) ST.ink[id]={strokes:[]}; return ST.ink[id].strokes; }
function padResize(){ const cv=PAD.cv; if(!cv||!cv.isConnected) return; const r=cv.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  PAD.dpr=Math.min(3,window.devicePixelRatio||1); PAD.W=r.width; PAD.H=r.height; cv.width=Math.round(r.width*PAD.dpr); cv.height=Math.round(r.height*PAD.dpr);
  PAD.ctx=cv.getContext("2d"); PAD.ctx.setTransform(PAD.dpr,0,0,PAD.dpr,0,0); PAD.ctx.lineCap="round"; PAD.ctx.lineJoin="round"; padRedraw(); }
function padLine(ctx,t,x0,y0,x1,y1,p){ if(!ctx) return; const W=PAD.W; ctx.globalCompositeOperation=t==="e"?"destination-out":"source-over"; ctx.strokeStyle="#111111";
  ctx.lineWidth=t==="e"?W*0.03:Math.max(1.2,W*0.0035*(0.6+(p||0.5)*1.2)); ctx.beginPath(); ctx.moveTo(x0*W,y0*W); ctx.lineTo(x1*W,y1*W); ctx.stroke(); }
function padRedraw(){ const ctx=PAD.ctx; if(!ctx) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,PAD.cv.width,PAD.cv.height); ctx.restore();
  for(const st of padStrokes(PAD.id)){ const c=st.c; if(c.length<3) continue; if(c.length===3){ padLine(ctx,st.t,c[0],c[1],c[0]+0.0005,c[1],c[2]); continue; }
    for(let i=3;i<c.length;i+=3) padLine(ctx,st.t,c[i-3],c[i-2],c[i],c[i+1],c[i+2]); } }
function padPt(e){ const r=PAD.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/PAD.W*1000)/1000, Math.round((e.clientY-r.top)/PAD.W*1000)/1000, Math.round((e.pressure||0.5)*100)/100]; }
function padAllowed(e){ return e.pointerType==="pen"||e.pointerType==="mouse"||(e.pointerType==="touch"&&ST.finger); }
function mountPad(id){
  const cv=$("#pad"); if(!cv) return; PAD.cv=cv; PAD.id=id; PAD.cur=null;
  cv.onpointerdown=e=>{ if(!padAllowed(e)) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} const pt=padPt(e); PAD.cur={t:PAD.tool==="eraser"?"e":"p",c:pt.slice()}; padLine(PAD.ctx,PAD.cur.t,pt[0],pt[1],pt[0]+0.0005,pt[1],pt[2]); };
  cv.onpointermove=e=>{ if(!PAD.cur||!padAllowed(e)) return; e.preventDefault(); const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(const ev of evs){ const pt=padPt(ev), c=PAD.cur.c, n=c.length; padLine(PAD.ctx,PAD.cur.t,c[n-3],c[n-2],pt[0],pt[1],pt[2]); c.push(pt[0],pt[1],pt[2]); } };
  const end=()=>{ if(!PAD.cur) return; padStrokes(id).push(PAD.cur); PAD.cur=null; save(); };
  cv.onpointerup=end; cv.onpointercancel=end; cv.onpointerleave=e=>{ if(PAD.cur&&e.pointerType!=="pen") end(); };
  cv.oncontextmenu=e=>e.preventDefault();
  const bar=cv.previousElementSibling;
  bar.querySelectorAll("[data-tool]").forEach(b=>{ b.onclick=()=>{ PAD.tool=b.dataset.tool; bar.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b)); }; });
  bar.querySelector('[data-act="undo"]').onclick=()=>{ padStrokes(id).pop(); save(); padRedraw(); };
  bar.querySelector('[data-act="clear"]').onclick=()=>{ if(!padStrokes(id).length||confirm("이 문제의 풀이 메모를 지울까요?")){ ST.ink[id]={strokes:[]}; save(); padRedraw(); } };
  bar.querySelector('[data-act="finger"]').onclick=function(){ ST.finger=!ST.finger; save(); this.classList.toggle("on",ST.finger); };
  if(window.ResizeObserver){ PAD.ro=new ResizeObserver(()=>padResize()); PAD.ro.observe(cv); }
  setTimeout(padResize,30);
}

/* ---------- 상단 진행점 (파트 안의 단계 · 시험 언급은 핑크) ---------- */

      '<p>'+(wrong.length?'틀린 문제: '+wrong.slice(0,6).map(w=>esc(w.qn)).join(", ")+(wrong.length>6?' 외 '+num(wrong.length-6)+'개':''):'틀린 문제가 없습니다.')+'</p>';

    $("#retry").onclick=()=>{ if(!wrong.length) return; wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; }); ST.idx=SLIDES.indexOf(wrong[0]); save(); render(); };
    $("#first").onclick=()=>{ ST.idx=0; save(); render(); };

  }
  renderSrc(s);
  const h=hintFor(s); const hb=$("#hintBtn"); hb.disabled=!h; hb.title=h?"":"이 장에는 힌트가 없습니다";
  const nxt=$("#next"), prv=$("#prev");

function go(d){ const n=ST.idx+d; if(n<0||n>=SLIDES.length) return; ST.idx=n; save(); render(); }

document.addEventListener("keydown",e=>{ const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||(t&&t.isContentEditable)) return; if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); });

/* ---------- 검사 모드 (#check): 전 장을 돌며 오버플로·raw LaTeX를 잰다. 빌드 뒤 헤드리스로 캡처해 확인한다 ---------- */
async function runCheck(){
  try{ await document.fonts.ready; }catch(e){}
  const body=$("#body"); const fails=[]; const saved=JSON.stringify(ST);
  const foot=$("#foot"), stage=$("#stage");
  const measure=(tag)=>{ const over=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(body.scrollHeight>body.clientHeight||body.scrollWidth>body.clientWidth); const fo=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(foot.scrollWidth>foot.clientWidth||stage.scrollHeight>stage.clientHeight); const raw=body.dataset.raw==="1"; if(over||fo||raw) fails.push(SLIDES[ST.idx].id+tag+(over?" 넘침 "+body.scrollHeight+">"+body.clientHeight:"")+(fo?" 하단/무대 넘침":"")+(raw?" rawLaTeX":"")); };
  for(let i=0;i<SLIDES.length;i++){
    const s=SLIDES[i];
    ST.idx=i; delete ST.revealed[s.id]; render(); await new Promise(r=>setTimeout(r,20)); measure("");
    if(s.type==="q"){ /* 답 공개 상태 */ ST.revealed[s.id]=true; ST.answer[s.id]=Array.isArray(s.choices)&&s.choices.length?"0":"x"; ST.correct[s.id]=false; render(); await new Promise(r=>setTimeout(r,20)); measure(" [답공개]"); { const al=$("#anslb"); if(al&&al.classList.contains("on")){ const a=al.querySelector(".ans"); if(a&&(a.scrollHeight>a.clientHeight||al.scrollHeight>al.clientHeight)) fails.push(s.id+" [풀이판] 넘침 "+a.scrollHeight+">"+a.clientHeight); al.classList.remove("on"); } }
      /* 힌트 열림 */ $("#hintBtn").click(); await new Promise(r=>setTimeout(r,20)); const hb=$("#hintBox"); if(!hb.hidden&&hb.getBoundingClientRect().top<body.getBoundingClientRect().top) fails.push(s.id+" [힌트] 상단 침범"); hb.hidden=true; }
  }
  try{ ST=JSON.parse(saved); }catch(e){}
  const c=$("#chk"); c.style.display="block";
  c.innerHTML='<h2 id="chkTitle">검사: '+SLIDES.length+'장 · 실패 '+fails.length+'</h2><pre id="chkList">'+esc(fails.join("\n"))+'</pre>';
  window.CHECK_RESULT={n:SLIDES.length,fails};
}
/* V5B-CTX: 학습 질문 패널용 문맥 (아토 2026-09-21). 앱이 gen 을 주기 전엔 보내지 않는다 — 이전 창의 늦은 메시지를 앱이 gen 으로 걸러낸다 */
let CTX_GEN=null;
const ctxPlain=(h,n)=>{ const t=String(h||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim(); return t.length>n?t.slice(0,n)+"…(잘림)":t; };
function postCtx(){
  try{
    if(location.hash==="#check"||!CTX_GEN||window.parent===window) return;
    const s=SLIDES[Math.max(0,Math.min(ST.idx,SLIDES.length-1))]; if(!s) return;
    const p=s.part?PARTS.find(x=>x.n===s.part):null; const li=lastInfo()||{};
    const msg={type:"mc-slide",v:1,gen:CTX_GEN,deck:DECK_ID,title:String(document.title).slice(0,80),sid:s.id,stype:s.type,part:s.part||null,
      partTitle:p?String(p.title).replace(/[\s★]+$/,"").slice(0,60):"",label:String(li.where||"").slice(0,80),q:null};
    if(s.type==="q"){
      const rev=!!ST.revealed[s.id], mc=Array.isArray(s.choices)&&s.choices.length>0, my=(ST.answer||{})[s.id];
      msg.q={qn:String(s.qn||"").slice(0,80),kind:String(s.kind||"").slice(0,10),text:ctxPlain(s.html,600),
        choices:mc?s.choices.slice(0,6).map(c=>ctxPlain(c.html,120)):[],
        my: my==null||my===""?null:(mc?(cpick(s,my)>=0?ctxPlain(s.choices[cpick(s,my)].html,120):null):String(my).slice(0,200)),
        revealed:rev, correct: rev&&typeof ST.correct[s.id]==="boolean"?ST.correct[s.id]:null,
        answer: rev&&mc?(s.choices.map((c,i)=>c.ok?i+1:0).filter(Boolean).join(",")||null):null};
    } else if(s.type==="concept"||s.type==="mu"){ msg.q={qn:String(s.title||"").slice(0,80),kind:s.type==="mu"?"암기·이해":"개념",text:ctxPlain(s.type==="mu"?[].concat(s.mem||[],s.und||[]).join(" · "):s.html,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }
    window.parent.postMessage(msg, location.origin);
  }catch(e){}
}
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; postCtx(); } });
const _renderV5b=render; render=function(){ _renderV5b(); postCtx(); };
function boot(){
  { const m=/^#(from|done|at)=([\w-]+)(?:,pad)?$/.exec(location.hash||""); if(m){ startFrom(m[2], m[1]==="from"?"skip":m[1]); if(/,pad$/.test(location.hash)) setTimeout(()=>$("#padBtn").click(),300); return; } }
  if(location.hash==="#check"){ runCheck(); return; }
  if(location.hash==="#resume"){ render(); save(); return; }   /* V5A: 저장된 위치 그대로 */
  render();
  if(location.hash==="#src"){ setTimeout(()=>{ const b=$("#srcs .src-th"); if(b) b.click(); },400); }
}
function fontCheck(){ try{ const ok=document.fonts.check("22px 'Gowun Dodum'"); if(ok){ const w0=$("#fontWarn"); if(w0) w0.hidden=true; return; } setTimeout(fontCheck,3000); /* V6B: 늦게 로드되면 경고를 지운다 */ if(!ok){ let w=$("#fontWarn"); if(!w){ w=document.createElement("div"); w.id="fontWarn"; $("#stage").appendChild(w); } w.hidden=false; w.textContent="손글씨 글꼴을 불러오지 못해 대체 글꼴로 보입니다. 인터넷 연결을 확인하고 새로 고침하세요."; } }catch(e){} }
function whenReady(){ if(window.renderMathInElement){ fontCheck(); boot(); } else setTimeout(whenReady,40); }
document.addEventListener("DOMContentLoaded",()=>{ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(whenReady,whenReady); });
</script>
