<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정역학 · 1~3주차 임시 정리</title>
<!-- 학습게임 지침(학습게임_미적분2.md) v4 템플릿 · 오타 디자인 검토(2026-09-17, RED 14건) 반영
     폰트 2종: 본문 손글씨(Nanum Pen Script, display=block) + 수식·숫자 정자(KaTeX). 5색 고정. 16:10. 상단 진행점·챕터명·n/N, 하단 [힌트] [확인/다음]. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root{
  /* 5색 고정 (지침 §2) */
  --memory:#FFE45C; --caution:#E03131; --concept:#1971C2; --exam:#FF4D8D; --example:#2F9E44;
  /* 무채색 — 종이·글자·선 (의미색 아님) */
  --paper:#FFFFFF; --ink:#111111; --muted:#5F5F5F; --line:#D8D8D8; --soft:#F5F5F5; --bg:#EDEDED;
  /* 폰트 2종 (지침 §1) */
  --font-hand:'Nanum Pen Script','NanumPen',sans-serif;
  --font-num:'KaTeX_Main','Times New Roman',serif;
  /* 글자 크기 3단계 (지침 §1) */
  --fs-title:31px; --fs-body:22px; --fs-note:17px;
}
*{box-sizing:border-box}
:where(h1,h2,h3,h4,p,ul,ol,li,dl,dt,dd,pre,blockquote,figure,figcaption,table,th,td,button,input,textarea,label){margin:0;padding:0;text-indent:0;word-break:keep-all;overflow-wrap:break-word}
html,body{height:100%;width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-hand);font-size:var(--fs-body);line-height:1.45;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
body{display:grid;place-items:center;padding:12px}
.katex{font-size:1em}
#stage{position:relative;width:min(calc(100vw - 24px),calc((100dvh - 24px) * 1.6));aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
/* 상단: 진행점 · 챕터명 · n/N */
#top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) auto;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:var(--fs-note)}
#progress{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.dot{flex:0 0 12px;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.dot.done{background:var(--ink)}
.dot.exam{border-color:var(--exam);background:var(--exam)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
#chapter{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pos{font-family:var(--font-num);white-space:nowrap}
/* 작업 영역 */
#body{min-height:0;overflow:hidden;padding:18px 24px 12px;font-size:var(--fs-body);line-height:1.45}
#body[data-ready="false"]{visibility:hidden}
#body.scrollable{overflow:auto}   /* 시작 위치 장만 — 학습 내용이 아니라 목록이라 스크롤 허용 */
#body h1,#body h2{font-size:var(--fs-title);line-height:1.2;margin-bottom:8px}
#body h3{font-size:var(--fs-body)}
.num{font-family:var(--font-num)}
#fontWarn{position:absolute;left:22px;right:22px;top:58px;border:2px solid var(--caution);background:var(--paper);padding:6px 12px;font-size:var(--fs-note);z-index:12}
#fontWarn[hidden]{display:none}
#body .kicker{font-size:var(--fs-note);color:var(--muted)}
#body p,#body li{margin:0}
#body p+p{margin-top:6px}
#body ul,#body ol{padding-left:22px}
#body :is(.why,.concept,.one,.say,.extra),.ans,.myans-show,.mu>div{margin:8px 0 0;padding:10px 14px}
#body .why,#body .concept{border:2px solid var(--concept)}
#body .say{border-left:4px solid var(--concept);background:var(--soft)}
#body .say b{color:var(--concept)}
#body .one{border-left:4px solid var(--ink);background:var(--soft)}
#body .term{color:var(--concept);border-bottom:1px dashed var(--concept)}
#body .hl{background:var(--memory);padding:0 4px}
#body .red{color:var(--caution)}
#body .star{color:var(--exam)}
#body .tw{overflow:hidden;margin:8px 0 0;border:1px solid var(--line)}
#body table{border-collapse:collapse;width:100%;font-size:var(--fs-body)}
#body th,#body td{padding:3px 10px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
#body thead th{border-top:0;font-size:var(--fs-note);color:var(--muted)}
#body pre{white-space:pre-wrap;font-family:var(--font-num);font-size:var(--fs-note);line-height:1.35}
#body code{font-family:var(--font-num)}
/* 시험 언급 — 최우선 (지침 §3) */
.exam-callout{border:4px solid var(--exam);padding:10px 14px;margin:0 0 10px;background:var(--paper)}
.exam-label{font-size:var(--fs-note);color:var(--exam)}
.exam-label b{color:var(--ink)}
.exam-quote{font-size:var(--fs-body)}
/* 표지·결과 */
.cover .big{font-size:var(--fs-title);line-height:1.2;margin:6px 0 10px}
.cover .sub{font-size:var(--fs-body)}
.score{display:flex;gap:14px;margin:10px 0}
.score .c{border:2px solid var(--ink);padding:10px 16px}
.score .c b{display:block;font-family:var(--font-num);font-size:var(--fs-title)}
/* 암기 vs 이해 */
.mu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mu>div{min-width:0}
.mu-mem{background:var(--memory);border:2px solid var(--memory)}
.mu-und{border:2px solid var(--concept)}
.mu-h{margin-bottom:4px}.mu-h .hint{font-size:var(--fs-note);color:var(--muted);margin-left:6px}
.mu li{margin:2px 0}
/* 문제 */
.q-kind{display:inline-block;font-size:var(--fs-note);border:1px solid var(--ink);padding:0 8px;margin-right:8px;vertical-align:middle}
#body.q-mode{display:flex;flex-direction:column}
#body.q-mode>*{flex:0 0 auto}
.pad{flex:1 1 auto!important;min-height:100px;display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);overflow:hidden;background:var(--paper)}
.pad-bar{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:var(--fs-note);background:var(--soft);flex-wrap:wrap}
.pad-bar .hint{color:var(--muted);margin-right:auto}
.pad-bar button{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.pad-bar button.on{background:var(--ink);color:var(--paper)}
.pad canvas{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:24px 24px}
/* V4-PADPANEL 필기 판 — 「+ 필기」로 여닫음, 문제 아래쪽을 덮는다 */
#padPanel{position:absolute;left:24px;right:24px;top:38%;bottom:72px;background:var(--paper);border:2px solid var(--ink);display:none;flex-direction:column;z-index:16}
#padPanel.on{display:flex}
#padPanel .pad{flex:1 1 auto;margin:0;border:0;min-height:0}
#padBtn.on{background:var(--ink);color:var(--paper)}
/* V4-ANSLB 답·풀이 판 — 작업 영역 전체 */
#anslb{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);display:none;flex-direction:column;z-index:18;padding:14px 24px;overflow:hidden}
#anslb.on{display:flex}
#anslb .ans{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:8px}
#anslb .ans-top{display:flex;align-items:center;gap:10px}
#anslb .ans-top .kicker{margin-right:auto}
.myans{margin-top:8px}.myans label{display:block;font-size:var(--fs-note);color:var(--muted)}
.myans textarea{width:100%;font-family:var(--font-num);font-size:var(--fs-body);line-height:1.35;padding:6px 12px;border:2px solid var(--ink);background:var(--paper);resize:none;outline:none}
.myans textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.myans-show{border:2px dashed var(--ink)}
.myans-txt{font-family:var(--font-num);white-space:pre-wrap}
.ans{border:2px solid var(--example)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;font:inherit;font-size:var(--fs-body);padding:6px 12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:48px}
.choice .cn{flex:0 0 28px;height:28px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:var(--fs-note)}
.choice .ct{min-width:0}
.choice.sel{border-color:var(--ink);border-width:3px}
.choice.ok{border-color:var(--example)}.choice.ok .cn{background:var(--example);border-color:var(--example);color:var(--paper)}
.choice.bad{border-color:var(--caution)}.choice.bad .cn{background:var(--caution);border-color:var(--caution);color:var(--paper)}
.choice[disabled]{cursor:default}
.verdict{padding:6px 14px;border:2px solid var(--ink)}.verdict.ok{border-color:var(--example)}.verdict.bad{border-color:var(--caution);color:var(--caution)}
/* 시작 위치 */
.jump-h{font-size:var(--fs-note);color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jump-part{display:flex;gap:10px;align-items:flex-start;margin:2px 0}
.jump-pt{flex:0 0 220px;font-size:var(--fs-note);padding-top:6px}
.jump-items{display:flex;flex-wrap:wrap;gap:4px}
.jp{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.jp.done{background:var(--ink);color:var(--paper)}.jp.skip{color:var(--muted);text-decoration:line-through;border-color:var(--line)}.jp.cur{border:3px solid var(--ink)}
/* 하단: [이전] [힌트] · 출처 · 동작 · [확인/다음] */
#foot{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:var(--fs-body);min-height:48px;padding:4px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.xs{font-size:var(--fs-note);min-height:36px;padding:2px 12px}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#act{display:flex;gap:8px;align-items:center;margin-left:auto}
#next{margin-left:8px}
#next.undone{background:var(--paper);color:var(--ink);border-style:dashed}
#doneTag{font-size:var(--fs-note);color:var(--muted)}
/* 출처 썸네일 · 확대 */
#srcs{display:flex;gap:6px}
.src-th{position:relative;width:48px;height:48px;padding:0;border:2px solid var(--ink);overflow:hidden;background:var(--paper);cursor:pointer;flex:0 0 auto}
.src-th img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.src-th .src-n{position:absolute;right:0;bottom:0;font-family:var(--font-num);font-size:var(--fs-note);background:var(--ink);color:var(--paper);padding:0 4px}
#srclb{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:20;padding:12px 18px}
#srclb.on{display:flex}
.src-top{display:flex;align-items:center;gap:10px;font-size:var(--fs-note);padding-bottom:8px}.src-top b{color:var(--ink)}.src-top .src-pos{margin-left:auto;font-family:var(--font-num)}
.src-x{font:inherit;font-size:var(--fs-body);min-width:48px;min-height:44px;border:2px solid var(--ink);background:var(--paper);cursor:pointer}
.src-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);touch-action:pan-x pan-y pinch-zoom}
.src-body img{width:100%;height:auto;display:block;cursor:zoom-in}
.src-body img.zoom{width:190%;max-width:none;cursor:zoom-out}
.src-foot{display:flex;align-items:center;gap:10px;padding-top:8px}.src-foot .hint{margin:0 auto;font-size:var(--fs-note);color:var(--muted)}
/* 힌트 상자 */
#hintBox{position:absolute;left:22px;right:22px;bottom:76px;background:var(--paper);border:2px solid var(--ink);padding:10px 14px;z-index:15}
#hintBox[hidden]{display:none}
/* 검사 모드 표시 */
#chk{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);overflow:auto;padding:20px;z-index:30;font-size:var(--fs-note);display:none}
</style>
</head>
<body>
<div id="stage">
  <header id="top"><div id="progress" aria-label="학습 진행"></div><span id="chapter"></span><span id="pos"></span></header>
  <main id="body" data-ready="false"></main>
  <footer id="foot">
    <button class="btn xs" id="prev" aria-label="이전">← 이전</button>
    <button class="btn xs" id="hintBtn">힌트</button>
    <button class="btn xs" id="padBtn" aria-label="필기 영역 열기">+ 필기</button>
    <div id="srcs"></div>
    <div id="act"></div>
    <span id="doneTag"></span>
    <button class="btn primary" id="next" aria-label="다음">다음 →</button>
  </footer>
  <div id="hintBox" hidden></div>
  <div id="padPanel"><div class="pad"><div class="pad-bar"><span>풀이 메모장</span><span class="hint">애플펜슬로 쓰세요</span><button data-tool="pen" class="on">펜</button><button data-tool="eraser">지우개</button><button data-act="undo">되돌리기</button><button data-act="clear">지우기</button><button data-act="finger">손가락도</button><button data-act="close">닫기</button></div><canvas id="pad"></canvas></div></div>
  <div id="chk"></div>
</div>
<script>
const DECK_ID="statics-w1-3";
const SLIDES=[{"id": "start", "type": "start"}, {"id": "jump", "type": "jump", "part": 0}, {"id": "p1-cover", "type": "cover", "part": 1, "no": "파트 1 · 9/7", "title": "Ch.1 Introduction 마무리 + Ch.2 Vectors", "star": false}, {"id": "p1-exam-1", "type": "concept", "part": 1, "title": "시험 언급 (1/8)", "html": "", "exam": [{"level": "강조", "when": "09/07", "quote": "스칼라: 숫자 하나로 완전히 기술되는 물리량. 방향 불필요"}, {"level": "강조", "when": "09/07", "quote": "벡터: 크기(magnitude)와 방향(direction) 둘 다 같아야 같은 벡터"}]}, {"id": "p1-exam-2", "type": "concept", "part": 1, "title": "시험 언급 (2/8)", "html": "", "exam": [{"level": "강조", "when": "09/07", "quote": "벡터는 볼드체 (u). 손글씨로는 화살표나 밑줄"}, {"level": "강조", "when": "09/07", "quote": "크기는 절대값 기호 |u| — 방향이 사라지고 크기만 남는다"}]}, {"id": "p1-exam-3", "type": "concept", "part": 1, "title": "시험 언급 (3/8)", "html": "", "exam": [{"level": "강조", "when": "09/07", "quote": "그림으로는 화살표. 화살표 길이 ∝ 크기, 화살표 방향 = 벡터 방향"}, {"level": "강조", "when": "09/07", "quote": "삼각형 법칙: u 의 꼬리에서 v 의 머리까지"}]}, {"id": "p1-exam-4", "type": "concept", "part": 1, "title": "시험 언급 (4/8)", "html": "", "exam": [{"level": "강조", "when": "09/07", "quote": "평행사변형 법칙"}, {"level": "강조", "when": "09/07", "quote": "성질: 교환법칙(commutative) u+v = v+u · 결합법칙(associative) — 어떤 순서로 묶어 더하든 결과 같음"}]}, {"id": "p1-exam-5", "type": "concept", "part": 1, "title": "시험 언급 (5/8)", "html": "", "exam": [{"level": "강조", "when": "09/07", "quote": "r_AC = r_AB + r_BC"}, {"level": "강조", "when": "09/07", "quote": "aU 도 벡터. 방향은 a 의 부호에 따라 (a<0 이면 반대 방향)"}]}, {"id": "p1-exam-6", "type": "concept", "part": 1, "title": "시험 언급 (6/8)", "html": "", "exam": [{"level": "강조", "when": "09/07", "quote": "성질: 결합법칙 · 분배법칙"}, {"level": "강조", "when": "09/07", "quote": "스칼라로 나누기 = 1/a 를 곱하기"}]}, {"id": "p1-exam-7", "type": "concept", "part": 1, "title": "시험 언급 (7/8)", "html": "", "exam": [{"level": "강조", "when": "09/07", "quote": "크기가 1 인 벡터"}, {"level": "강조", "when": "09/07", "quote": "쓰는 이유: 방향만 지정하기 위해. 크기가 1이라 곱해도 크기가 안 바뀐다"}]}, {"id": "p1-exam-8", "type": "concept", "part": 1, "title": "시험 언급 (8/8)", "html": "", "exam": [{"level": "강조", "when": "09/07", "quote": "u = |u| · e (크기 × 방향)"}]}, {"id": "p1-concept", "type": "concept", "part": 1, "title": "Ch.1 Introduction 마무리 + Ch.2 Vectors (1/5)", "html": "<div class=\"concept\"><p><b>② 단위 (Units)</b></p></div><div class=\"concept\"><ul><li><b>SI 단위</b>를 주로 쓴다 (US customary 는 참고만)</li></ul></div><div class=\"concept\"><ul><li>힘의 단위: <b>1 N = 1 kg·m/s²</b> — 1kg 물체에 1 m/s² 가속도를 만드는 힘</li></ul></div><div class=\"concept\"><ul><li>접두어: kN = 10³ N, MN = 10⁶ N</li></ul></div><div class=\"concept\"><ul><li>각도: degree, <b>radian</b> — 한 바퀴 = 2π rad = 360°</li></ul></div><div class=\"concept\"><p><b>③ 속도와 가속도 (복습)</b></p></div><div class=\"concept\"><ul><li>velocity = <b>rate of change in position</b></li></ul></div>", "exam": [], "scroll": true}, {"id": "p1-concept-2", "type": "concept", "part": 1, "title": "Ch.1 Introduction 마무리 + Ch.2 Vectors (2/5)", "html": "<div class=\"concept\"><ul><li>acceleration = <b>rate of change in velocity</b></li></ul></div><div class=\"concept\"><p><b>④ 뉴턴의 법칙 — 정역학의 출발점</b></p></div><div class=\"concept\"><div class=\"tw\"><table><thead><tr><th></th><th>내용</th><th>정역학에서의 의미</th></tr></thead><tbody><tr><td><b>1법칙</b></td><td>ΣF = 0 이면 속도가 일정하게 유지</td><td>정지해 있으면 계속 정지. <b>정역학은 항상 ΣF = 0</b></td></tr><tr><td><b>2법칙</b></td><td>ΣF = 선운동량의 변화율 (dp/dt)</td><td>정역학에선 합력이 0이라 안 쓴다. 동역학 개념</td></tr></tbody></table></div></div>", "exam": []}, {"id": "p1-concept-3", "type": "concept", "part": 1, "title": "Ch.1 Introduction 마무리 + Ch.2 Vectors (3/5)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th></th><th>내용</th><th>정역학에서의 의미</th></tr></thead><tbody><tr><td><b>3법칙</b></td><td>F(A→B) = −F(B→A), 크기 같고 방향 반대</td><td>자유물체도의 근거</td></tr></tbody></table></div></div><div class=\"concept\"><p>&gt; \"we study statics right so <b>always the summation of forces will be zero</b>\"</p></div><div class=\"concept\"><p><b><span class=\"star\">★</span> 왜 \"입자(particle)\"라고 하는가 — 교수가 질문으로 짚은 포인트</b></p></div><div class=\"concept\"><p>&gt; \"부피가 있으면 <b>힘의 작용선이 달라져</b> 버리면 얘가 회전을 하게 되겠죠. <b>모멘트가 생기기 때문에.</b>\"</p></div>", "exam": []}, {"id": "p1-concept-4", "type": "concept", "part": 1, "title": "Ch.1 Introduction 마무리 + Ch.2 Vectors (4/5)", "html": "<div class=\"concept\"><p>→ 크기가 있는 물체는 힘의 작용선 위치에 따라 회전한다. 그래서 1장에서는 입자로 단순화하고, <b>모멘트는 나중에</b> 다룬다.</p></div><div class=\"concept\"><p><b>⑤ 만유인력</b></p></div><div class=\"concept\"><p><code>F = G·m₁m₂/r²</code> — 두 입자 사이, 크기 같고 방향 반대. &gt; \"이 중력이 <b>사실상 만유인력이랑 똑같잖아요.</b>\"</p></div><div class=\"concept\"><p><b>① 역학(Mechanics)이란 — 교수가 가장 강조한 정의</b></p></div><div class=\"concept\"><p>&gt; \"역학의 <b>역</b>이 힘 力 자거든요. 힘이 물체에 가해졌을 때 그 물체가 운동을 할 수도 있고, 버티면서 스트레스를 받을 수도 있고, 변형이 될 수도 있고 — 힘이 가해졌을 때 <b>물체에 변하는 것들을 통틀어서</b> 역학이라고 합니다.\"</p></div><div class=\"concept\"><p>&gt; \"저희 기계공학이지만 <b>Machine이 아니고 Mechanical Engineering</b>이잖아요. Mechanics의 정의를 꼭 알고 가셔야 됩니다.\"</p></div>", "exam": [], "scroll": true}, {"id": "p1-concept-5", "type": "concept", "part": 1, "title": "Ch.1 Introduction 마무리 + Ch.2 Vectors (5/5)", "html": "<div class=\"concept\"><pre>Mechanics\n ├─ Statics  (정역학) ← 이번 학기. 정지해 있는 것\n └─ Dynamics (동역학) ← 나중. 운동(motion)</pre></div><div class=\"concept\"><p><b>정역학에서 제일 중요한 것 — 교수가 두 번 말함</b> &gt; \"결국에는 <b>평형(equilibrium)이 가장 중요합니다. 평형방정식을 잘 세우는 것</b>이 제일 중요하고요. 그리고 <b>모멘트</b>, 이 두 가지 가지고 한 학기 동안 하는 거예요.\"</p></div><div class=\"one\">한 줄: Ch.1 전체(역학 정의 · 단위 · 뉴턴 법칙 · 만유인력) → Ch.2 벡터 시작(단위벡터까지)</div>\n", "exam": []}, {"id": "p1-result", "type": "result", "part": 1, "title": "Ch.1 Introduction 마무리 + Ch.2 Vectors"}, {"id": "p2-cover", "type": "cover", "part": 2, "no": "파트 2 · 9/9", "title": "Ch.2 벡터 — 성분(2D·3D) · 위치벡터 · 방향여현 · 내적 정의", "star": false}, {"id": "p2-concept", "type": "concept", "part": 2, "title": "Ch.2 벡터 — 성분(2D·3D) · 위치벡터 · 방향여현 · 내적 정의 (1/7)", "html": "<div class=\"concept\"><p><b>④ 강의자료 정리 — 교수 필기본 W12 (p.2~11)</b></p></div><div class=\"concept\"><p><b>4-1. 2차원 성분 (p.2) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li>벡터 = x성분 + y성분 (<b>Cartesian components</b>). <code>U = Uₓ + U_y</code>.</li></ul></div><div class=\"concept\"><ul><li>i = +x 방향 단위벡터, j = +y 방향 단위벡터 → <b><code>U = Uₓ i + U_y j</code></b> (Uₓ, U_y = U의 <b>스칼라 성분</b>).</li></ul></div>", "exam": [{"level": "강조", "when": "09/09", "quote": "이날 결석은 −2점 확정(인정 안 됨)."}]}, {"id": "p2-concept-2", "type": "concept", "part": 2, "title": "Ch.2 벡터 — 성분(2D·3D) · 위치벡터 · 방향여현 · 내적 정의 (2/7)", "html": "<div class=\"concept\"><ul><li>크기 <b><code>|U| = √(Uₓ² + U_y²)</code></b>.</li></ul></div><div class=\"concept\"><p><b>4-2. 성분으로 덧셈·스칼라배 (p.3)</b></p></div><div class=\"concept\"><ul><li><code>U + V = (Uₓ + Vₓ) i + (U_y + V_y) j</code> — 같은 성분끼리.</li></ul></div><div class=\"concept\"><ul><li><code>aU = (aUₓ) i + (aU_y) j</code> — 분배법칙.</li></ul></div><div class=\"concept\"><p><b>4-3. 두 점 사이 위치벡터 (p.4) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li>A(x_A, y_A), B(x_B, y_B) → A에서 B로 가는 위치벡터 <b><code>r_AB = (x_B − x_A) i + (y_B − y_A) j</code></b> — \"끝점 − 시작점\".</li></ul></div><div class=\"concept\"><p><b>4-4. 3차원 성분·크기 (p.5~6)</b></p></div>", "exam": [], "scroll": true}, {"id": "p2-concept-3", "type": "concept", "part": 2, "title": "Ch.2 벡터 — 성분(2D·3D) · 위치벡터 · 방향여현 · 내적 정의 (3/7)", "html": "<div class=\"concept\"><ul><li><code>U = Uₓ i + U_y j + U_z k</code>, 축 배치 = 오른손 좌표계(그림: z 위, x 오른쪽, y 앞).</li></ul></div><div class=\"concept\"><ul><li><b><code>|U| = √(Uₓ² + U_y² + U_z²)</code></b>.</li></ul></div><div class=\"concept\"><p><b>4-5. 방향여현 Direction Cosines (p.6~7) <span class=\"star\">★</span><span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li>2D는 각 하나로 방향이 정해지지만, <b>3D는 +x, +y, +z 축과 이루는 각 θₓ, θ_y, θ_z 셋</b>으로 방향을 기술.</li></ul></div><div class=\"concept\"><ul><li><b><code>Uₓ = |U|cos θₓ</code>, <code>U_y = |U|cos θ_y</code>, <code>U_z = |U|cos θ_z</code></b> — cos θₓ, cos θ_y, cos θ_z 를 <b>방향여현</b>이라 부른다.</li></ul></div>", "exam": []}, {"id": "p2-concept-4", "type": "concept", "part": 2, "title": "Ch.2 벡터 — 성분(2D·3D) · 위치벡터 · 방향여현 · 내적 정의 (4/7)", "html": "<div class=\"concept\"><ul><li><b>관계식</b>: 세 방향여현은 독립이 아니다. <code>|U|² = Uₓ² + U_y² + U_z² = |U|²(cos²θₓ + cos²θ_y + cos²θ_z)</code> → <b><code>cos²θₓ + cos²θ_y + cos²θ_z = 1</code></b> (필기 빨강 강조). → 각 둘을 알면 나머지 하나가 정해진다(부호 제외).</li></ul></div><div class=\"concept\"><p><b>4-6. 단위벡터의 성분 = 방향여현 (p.8) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li>U 방향의 단위벡터 e: <code>U = |U| e</code>(크기 × 방향), <code>e = U/|U|</code>.</li></ul></div>", "exam": []}, {"id": "p2-concept-5", "type": "concept", "part": 2, "title": "Ch.2 벡터 — 성분(2D·3D) · 위치벡터 · 방향여현 · 내적 정의 (5/7)", "html": "<div class=\"concept\"><ul><li><code>e = (Uₓ/|U|) i + (U_y/|U|) j + (U_z/|U|) k</code> → <b><code>e = cos θₓ i + cos θ_y j + cos θ_z k</code></b> (빨강). 즉 <b>단위벡터를 알면 방향여현을 다 안 것</b>.</li></ul></div><div class=\"concept\"><p><b>4-7. 3D 위치벡터·단위벡터 (p.9) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li><code>r_AB = (x_B − x_A) i + (y_B − y_A) j + (z_B − z_A) k</code>, <code>|r_AB| = √(Δx² + Δy² + Δz²)</code>.</li></ul></div>", "exam": []}, {"id": "p2-concept-6", "type": "concept", "part": 2, "title": "Ch.2 벡터 — 성분(2D·3D) · 위치벡터 · 방향여현 · 내적 정의 (6/7)", "html": "<div class=\"concept\"><ul><li>A→B 단위벡터 <code>e_AB = r_AB / |r_AB|</code> → <b>A에서 B를 향하는 크기 |U|의 벡터 = <code>U = |U| e_AB = |U| · r_AB/|r_AB|</code></b> — 케이블·로프 힘을 성분으로 쓰는 정역학 기본 동작(Ch.3 평형에서 계속 씀).</li></ul></div><div class=\"concept\"><p><b>4-8. 내적 정의·의미 (p.10~11) — 9/14의 앞부분</b></p></div><div class=\"concept\"><ul><li>내적이 쓰이는 곳: ① 두 벡터 사이 <b>각</b> 구하기 ② 벡터를 어떤 선에 <b>평행·수직 성분으로 분해</b>(→ 9/14 정사영).</li></ul></div><div class=\"concept\"><ul><li>정의 <b><code>U·V = |U||V| cos θ</code></b> — 결과는 <b>스칼라</b>. 단위는 두 벡터 단위의 곱(둘 다 힘이면 N²).</li></ul></div>", "exam": []}, {"id": "p2-concept-7", "type": "concept", "part": 2, "title": "Ch.2 벡터 — 성분(2D·3D) · 위치벡터 · 방향여현 · 내적 정의 (7/7)", "html": "<div class=\"concept\"><ul><li>의미: \"두 벡터가 얼마나 같은 방향을 향하는가\"의 척도. θ = 0° → <code>|U||V|</code>(최대, 양수) · θ = 90° → <b>0</b> · θ = 180° → <code>−|U||V|</code>.</li></ul></div><div class=\"one\">한 줄: 2.2 성분 — 2D 성분·크기 → 성분으로 덧셈·스칼라배 → 두 점 사이 위치벡터 → 3D 성분 → 크기 → 방향여현(direction cosines)과 그 관계식 → 단위벡터 = 방향여현 → 3D 위치벡터·단위벡터 → 2.3 내적 정의·의미(9/14로 이어짐)</div>\n", "exam": []}, {"id": "p2-result", "type": "result", "part": 2, "title": "Ch.2 벡터 — 성분(2D·3D) · 위치벡터 · 방향여현 · 내적 정의"}, {"id": "p3-cover", "type": "cover", "part": 3, "no": "파트 3 · 9/14", "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product)", "star": false}, {"id": "p3-exam-1", "type": "concept", "part": 3, "title": "시험 언급 (1/2)", "html": "", "exam": [{"level": "강조", "when": "09/14", "quote": "(18:38) 정사영(평행/수직 성분) — \"재료역학·동역학 다 똑같이 쓴다\"."}, {"level": "강조", "when": "09/14", "quote": "(29:57) 외적 = 모멘트 계산 도구 → Ch.4 모멘트(중간고사 범위 Ch.3~5의 핵심)로 바로 이어짐."}]}, {"id": "p3-exam-2", "type": "concept", "part": 3, "title": "시험 언급 (2/2)", "html": "", "exam": [{"level": "강조", "when": "09/14", "quote": "(56:05) 행렬식 전개 부호 조심."}, {"level": "강조", "when": "09/14", "quote": "기존(9/2 OT): 중간 30% Ch.3~5 (10/19) · 과제 1~2문제가 시험에 그대로 · 결석 1회 −2점."}]}, {"id": "p3-concept", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (1/12)", "html": "<div class=\"concept\"><p><b>③ 녹음본 정리 (교정 + 중요도 재구성)</b></p></div><div class=\"concept\"><p><b>3-1. 내적 이어서 — 성질 (02:53~06:35)</b></p></div><div class=\"concept\"><ul><li>\"지난 시간에 내적 배우다 말았는데 이어서.\"</li></ul></div><div class=\"concept\"><ul><li>성질(교재 2.3): ① 교환 <code>u·v = v·u</code> ② 스칼라배 결합 <code>a(u·v) = (au)·v = u·(av)</code> (\"second property: associative with respect to scalar multiplication\" 단편) ③ 분배 <code>u·(v+w) = u·v + u·w</code>.</li></ul></div>", "exam": []}, {"id": "p3-concept-2", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (2/12)", "html": "<div class=\"concept\"><ul><li>단위벡터끼리: <b><code>i·i = j·j = k·k = 1</code>, <code>i·j = j·k = k·i = 0</code></b> — \"방향이 같으면 1이고 수직이면 무조건 0\" (06:35).</li></ul></div><div class=\"concept\"><p><b>3-2. 성분으로 내적 계산 · 두 벡터 사이 각 (10:01~15:52) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li><code>u = uₓi + u_yj + u_zk</code>, <code>v = vₓi + v_yj + v_zk</code> → 전개하면 교차항은 0, 같은 성분끼리만 남음: <b><code>u·v = uₓvₓ + u_yv_y + u_zv_z</code></b> — \"i 성분끼리 곱하고 j 성분끼리 곱하고 k 성분끼리 곱해서 더하면 됩니다.\" (12:58)</li></ul></div>", "exam": []}, {"id": "p3-concept-3", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (3/12)", "html": "<div class=\"concept\"><ul><li>정의 <code>u·v = |u||v|cosθ</code> 와 합치면 <b><code>cosθ = (uₓvₓ + u_yv_y + u_zv_z) / (|u||v|)</code></b> — \"this formula determines the angle between two vectors (or two lines in space)\" (15:52). <span class=\"star\">★</span>복원: 두 직선 사이의 각도 구하는 데 씀.</li></ul></div><div class=\"concept\"><p><b>3-3. 벡터의 선에 대한 정사영 — 평행 성분·수직 성분 (16:46~29:31) <span class=\"star\">★</span></b></p></div>", "exam": []}, {"id": "p3-concept-4", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (4/12)", "html": "<div class=\"concept\"><ul><li>왜: 합·뺄셈 때 x·y로 분해하듯, <b>어떤 직선 L에 평행한 성분과 수직인 성분</b>으로 나누면 계산이 쉽다. 공학 응용(engineering application) — \"2학년 올라가서 배울 재료역학·동역학 다 똑같다\" (18:38).</li></ul></div><div class=\"concept\"><ul><li>2D에서 벡터 u와 직선 L이 있으면 항상 <b><code>u = u_p + u_n</code></b> (parallel + normal). 완전히 수직이면 u_p = 0, 평행이면 u_n = 0.</li></ul></div><div class=\"concept\"><ul><li>직선 L 방향의 <b>단위벡터 e</b> (양의 방향, |e| = 1), u와 L 사이 각 θ:</li></ul></div>", "exam": []}, {"id": "p3-concept-5", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (5/12)", "html": "<div class=\"concept\"><ul><li><b><code>u·e = |u||e|cosθ = |u|cosθ</code></b> = 평행 성분의 <b>크기(스칼라)</b> — \"내적은 스칼라니까\" (26:02). <span class=\"star\">★</span>복원 교재 표기: <code>u_p = (e·u) e</code>.</li></ul></div><div class=\"concept\"><ul><li><b>평행 성분(벡터) <code>u_p = (u·e) e</code></b> — 크기는 내적으로, 방향은 단위벡터 e로 (27:25).</li></ul></div><div class=\"concept\"><ul><li><b>수직 성분 <code>u_n = u − u_p</code></b> — \"normal component: subtract the parallel component from the original vector\" (27:57~28:54).</li></ul></div><div class=\"concept\"><p><b>3-4. 외적(cross product) — 왜 배우나 (29:31~29:57)</b></p></div>", "exam": []}, {"id": "p3-concept-6", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (6/12)", "html": "<div class=\"concept\"><p>&gt; \"외적은 왜 배우는지 아시나요? — 외적은 <b>모멘트(moment)</b> 를 계산할 때 쓴다.\" (29:57, 단편 \"cross product … moment\")</p></div><div class=\"concept\"><p><b>3-5. 외적의 정의·방향 (33:37~41:50) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li><b><code>u × v = |u||v| sinθ · e</code></b> — 내적은 스칼라였는데 <b>외적은 벡터</b>. 그래서 vector product라고도 부름 (34:27).</li></ul></div><div class=\"concept\"><ul><li>e = u에도 수직, v에도 수직인 단위벡터 = <b>u, v가 이루는 평면에 수직</b>. 그 평면의 위/아래 둘 중 어느 쪽인지는 <b>오른손 법칙(right-hand rule)</b> — 손가락을 u에서 v로 감을 때 엄지 방향 (36:06~39:11).</li></ul></div>", "exam": []}, {"id": "p3-concept-7", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (7/12)", "html": "<div class=\"concept\"><ul><li><b><code>v × u = −(u × v)</code></b> — 방향이 반대. <b>교환법칙 불성립</b> (39:53).</li></ul></div><div class=\"concept\"><p><b>3-6. 외적의 크기·성질 (42:49~49:46)</b></p></div><div class=\"concept\"><ul><li>크기 <code>|u||v|sinθ</code> = u를 밑변, <code>|v|sinθ</code>를 높이로 하는 <b>평행사변형의 넓이</b> (삼각형은 그 절반) (42:49).</li></ul></div><div class=\"concept\"><ul><li><b>평행이면 0</b>: θ = 0 또는 180° → sinθ = 0. \"방향이 같아 평행사변형이 안 그려지면 0\" (44:23).</li></ul></div>", "exam": []}, {"id": "p3-concept-8", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (8/12)", "html": "<div class=\"concept\"><ul><li><span class=\"star\">★</span>복원 성질(교재): 스칼라배 <code>a(u×v) = (au)×v = u×(av)</code> · 분배 <code>u×(v+w) = u×v + u×w</code> (46:02~47:16 단편 \"scalar … distributive\").</li></ul></div><div class=\"concept\"><ul><li>단위벡터: <b><code>i×i = j×j = k×k = 0</code></b>, <b><code>i×j = k, j×k = i, k×i = j</code></b>, 거꾸로는 <b>마이너스</b> (<code>j×i = −k</code> …). \"i→j→k 순환하고 있다고 생각하면 된다. 같은 방향은 0, 반대로 가면 마이너스\" (49:28).</li></ul></div><div class=\"concept\"><p><b>3-7. 성분으로 외적 계산 → 행렬식 (50:32~56:05) <span class=\"star\">★</span></b></p></div>", "exam": []}, {"id": "p3-concept-9", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (9/12)", "html": "<div class=\"concept\"><ul><li><code>u × v = (uₓi + u_yj + u_zk) × (vₓi + v_yj + v_zk)</code> 를 전부 전개(9항 중 3항은 0): <b><code>u × v = (u_y v_z − u_z v_y) i − (uₓ v_z − u_z vₓ) j + (uₓ v_y − u_y vₓ) k</code></b> (52:25 단편과 일치)</li></ul></div>", "exam": []}, {"id": "p3-concept-10", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (10/12)", "html": "<div class=\"concept\"><ul><li>\"행렬 배우셨죠?\" → <b>3×3 행렬식(determinant)</b> 으로 간단히: ``<code> | i    j    k  | u × v = | uₓ   u_y  u_z | | vₓ   v_y  v_z | </code>`` i·j·k 각각에 대해 그 행·열을 지우고 남는 2×2 행렬식(소행렬식)으로 전개 — \"j 할 때는 여기랑 여기, k 할 때는 여기랑 여기 지우고\" (54:57).</li></ul></div><div class=\"concept\"><p>&gt; \"<b>부호(minus)가 많이 쓰이니까 조심하셔야 돼요.</b>\" (56:05 — 클로바 '무기가 많이 쓰인')</p></div><div class=\"concept\"><p><b>여담·판독 불가 구간</b></p></div>", "exam": []}, {"id": "p3-concept-11", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (11/12)", "html": "<div class=\"concept\"><ul><li>00:06~02:53 출석 호명(이름 나열) · 03:26~06:29, 29:57~33:37, 37:10~39:11, 46:02~47:39 영어 설명 구간 — 클로바노트가 받아 적지 못함 → <b>LMS 수업 영상으로 보충</b>.</li></ul></div><div class=\"concept\"><p><b>④ 강의자료 정리 — 미보유</b></p></div><div class=\"concept\"><ul><li>교수가 9/7에 \"PDF는 올려드릴게요\"라고 한 뒤로 <code>강의자료_W11</code>, <code>W12</code> 확보. 이날(W2-1?) PDF와 <b>교수님 필기본</b>이 LMS에 올라오는지 확인 → <code>교수필기_2026-09-14_*.pdf</code> 로 저장(학습앱 하단 항목).</li></ul></div><div class=\"concept\"><p><b>① 전공 교재 파일 정리 — 미보유</b></p></div>", "exam": []}, {"id": "p3-concept-12", "type": "concept", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product) (12/12)", "html": "<div class=\"concept\"><ul><li>범위 = Bedford &amp; Fowler 5판 Ch.2 Vectors: 2.3 Dot Products(성분·각·정사영 <code>Vector Components Parallel and Normal to a Line</code>) · 2.4 Cross Products(정의·성질·성분·determinant). 이날 교재 예제 번호는 녹음에서 판독 불가.</li></ul></div><div class=\"one\">한 줄: 2.3 내적(dot product) 성질·성분 계산·각도 → 벡터의 선에 대한 정사영(평행/수직 성분) → 2.4 외적(cross product) 정의·오른손 법칙·성질·성분 전개·행렬식 표현</div>\n", "exam": []}, {"id": "p3-result", "type": "result", "part": 3, "title": "Ch.2 벡터 — 내적 마무리 · 정사영 · 외적(Cross Product)"}, {"id": "final", "type": "final"}];

try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&typeof s==="object") ST=Object.assign(ST,s); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const partOf=n=>PARTS.find(p=>p.n===n)||null;
const num=v=>'<span class="num">'+esc(v)+'</span>';   /* UI 숫자는 정자(지침 §1) */
function partScore(p){ ST.skip=ST.skip||{}; const qs=SLIDES.filter(s=>s.type==="q"&&s.part===p&&!ST.skip[s.id]); const b=qs.filter(q=>q.kind==="기초"), a=qs.filter(q=>q.kind==="응용");
  const cnt=arr=>({n:arr.length,ok:arr.filter(q=>ST.correct[q.id]===true).length,done:arr.filter(q=>ST.done[q.id]).length});
  return {b:cnt(b),a:cnt(a)}; }
function partDone(p){ return SLIDES.filter(s=>s.part===p&&s.type!=="result").every(s=>ST.done[s.id]); }

/* ---------- 수식: KaTeX (지침 §1). 렌더 끝나기 전엔 작업 영역을 감춘다(§0 raw LaTeX 노출 금지) ---------- */
function typeset(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true},{left:"$$",right:"$$",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  }
  const cl=el.cloneNode(true); cl.querySelectorAll(".katex,.katex-display").forEach(k=>k.remove());
  const raw=/\\\(|\\\[|\\frac|\\vec|\\begin\{|\$\$/.test(cl.textContent||"");
  el.dataset.raw=raw?"1":"0";
  if(raw&&el.id==="body"){ el.dataset.ready="false"; el.innerHTML='<div class="kicker">수식 오류</div><h2>이 장의 수식이 그대로 드러나 표시를 멈췄습니다</h2><p>정리노트의 수식 표기를 고쳐 다시 만들어야 합니다.</p>'; }
  el.dataset.ready="true";
  return !raw;
}

/* ---------- 풀이 메모장 (손글씨 캔버스 · 애플펜슬) ---------- */
const PAD={tool:"pen",cv:null,ctx:null,id:null,cur:null,ro:null,dpr:1,W:0,H:0};
function padStrokes(id){ ST.ink=ST.ink||{}; if(!ST.ink[id]) ST.ink[id]={strokes:[]}; return ST.ink[id].strokes; }
function padResize(){ const cv=PAD.cv; if(!cv||!cv.isConnected) return; const r=cv.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  PAD.dpr=Math.min(3,window.devicePixelRatio||1); PAD.W=r.width; PAD.H=r.height; cv.width=Math.round(r.width*PAD.dpr); cv.height=Math.round(r.height*PAD.dpr);
  PAD.ctx=cv.getContext("2d"); PAD.ctx.setTransform(PAD.dpr,0,0,PAD.dpr,0,0); PAD.ctx.lineCap="round"; PAD.ctx.lineJoin="round"; padRedraw(); }
function padLine(ctx,t,x0,y0,x1,y1,p){ if(!ctx) return; const W=PAD.W; ctx.globalCompositeOperation=t==="e"?"destination-out":"source-over"; ctx.strokeStyle="#111111";
  ctx.lineWidth=t==="e"?W*0.03:Math.max(1.2,W*0.0035*(0.6+(p||0.5)*1.2)); ctx.beginPath(); ctx.moveTo(x0*W,y0*W); ctx.lineTo(x1*W,y1*W); ctx.stroke(); }
function padRedraw(){ const ctx=PAD.ctx; if(!ctx) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,PAD.cv.width,PAD.cv.height); ctx.restore();
  for(const st of padStrokes(PAD.id)){ const c=st.c; if(c.length<3) continue; if(c.length===3){ padLine(ctx,st.t,c[0],c[1],c[0]+0.0005,c[1],c[2]); continue; }
    for(let i=3;i<c.length;i+=3) padLine(ctx,st.t,c[i-3],c[i-2],c[i],c[i+1],c[i+2]); } }
function padPt(e){ const r=PAD.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/PAD.W*1000)/1000, Math.round((e.clientY-r.top)/PAD.W*1000)/1000, Math.round((e.pressure||0.5)*100)/100]; }
function padAllowed(e){ return e.pointerType==="pen"||e.pointerType==="mouse"||(e.pointerType==="touch"&&ST.finger); }
function mountPad(id){
  const cv=$("#pad"); if(!cv) return; PAD.cv=cv; PAD.id=id; PAD.cur=null;
  cv.onpointerdown=e=>{ if(!padAllowed(e)) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} const pt=padPt(e); PAD.cur={t:PAD.tool==="eraser"?"e":"p",c:pt.slice()}; padLine(PAD.ctx,PAD.cur.t,pt[0],pt[1],pt[0]+0.0005,pt[1],pt[2]); };
  cv.onpointermove=e=>{ if(!PAD.cur||!padAllowed(e)) return; e.preventDefault(); const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(const ev of evs){ const pt=padPt(ev), c=PAD.cur.c, n=c.length; padLine(PAD.ctx,PAD.cur.t,c[n-3],c[n-2],pt[0],pt[1],pt[2]); c.push(pt[0],pt[1],pt[2]); } };
  const end=()=>{ if(!PAD.cur) return; padStrokes(id).push(PAD.cur); PAD.cur=null; save(); };
  cv.onpointerup=end; cv.onpointercancel=end; cv.onpointerleave=e=>{ if(PAD.cur&&e.pointerType!=="pen") end(); };
  cv.oncontextmenu=e=>e.preventDefault();
  const bar=cv.previousElementSibling;
  bar.querySelectorAll("[data-tool]").forEach(b=>{ b.onclick=()=>{ PAD.tool=b.dataset.tool; bar.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b)); }; });
  bar.querySelector('[data-act="undo"]').onclick=()=>{ padStrokes(id).pop(); save(); padRedraw(); };
  bar.querySelector('[data-act="clear"]').onclick=()=>{ if(!padStrokes(id).length||confirm("이 문제의 풀이 메모를 지울까요?")){ ST.ink[id]={strokes:[]}; save(); padRedraw(); } };
  bar.querySelector('[data-act="finger"]').onclick=function(){ ST.finger=!ST.finger; save(); this.classList.toggle("on",ST.finger); };
  if(window.ResizeObserver){ PAD.ro=new ResizeObserver(()=>padResize()); PAD.ro.observe(cv); }
  setTimeout(padResize,30);
}

/* ---------- 필기 판 여닫기 (V4-PADPANEL) ---------- */
function openPad(id){ const pp=$("#padPanel"); pp.classList.add("on"); $("#padBtn").classList.add("on"); const fb=pp.querySelector('[data-act="finger"]'); if(fb) fb.classList.toggle("on",!!ST.finger); mountPad(id); const cb=pp.querySelector('[data-act="close"]'); if(cb) cb.onclick=closePad; }
function closePad(){ const pp=$("#padPanel"); if(pp) pp.classList.remove("on"); const b=$("#padBtn"); if(b) b.classList.remove("on"); if(PAD.ro){ PAD.ro.disconnect(); PAD.ro=null; } }
/* ---------- 시험 언급 상자 (지침 §3) ---------- */
function examHTML(s){
  const list=Array.isArray(s.exam)?s.exam:[]; if(!list.length) return "";
  return list.map(x=>'<aside class="exam-callout" aria-label="시험 언급"><div class="exam-label"><b>📌 시험 언급</b> · '+esc(x.level||"강조")+(x.when?' · '+esc(x.when):'')+'</div><blockquote class="exam-quote">"'+esc(x.quote||"")+'"</blockquote></aside>').join("");
}

/* ---------- 시작 위치 점프 ---------- */
function startFrom(id,mode){
  const n=SLIDES.findIndex(x=>x.id===id); if(n<0) return;
  ST.skip=ST.skip||{}; mode=mode||"skip";
  if(mode!=="at") SLIDES.forEach((x,i)=>{ if(i<n&&x.type!=="start"&&x.type!=="jump"&&!ST.done[x.id]){ ST.done[x.id]=true; if(mode==="skip") ST.skip[x.id]=true; } });
  ST.idx=n; save(); render();
}
function unskipAll(){ ST.skip=ST.skip||{}; Object.keys(ST.skip).forEach(k=>{ delete ST.done[k]; }); ST.skip={}; save(); render(); }
function jumpListHTML(){
  ST.skip=ST.skip||{};
  const rows=[]; let cur=null;
  SLIDES.forEach((x,i)=>{
    if(x.type==="cover"){ cur={part:x.part,title:x.title,items:[]}; rows.push(cur); return; }
    if(!cur) return;
    if(x.type==="concept"||x.type==="mu"||x.type==="q"){
      const lab= x.type==="concept"?(x.title||"개념"): x.type==="mu"?"암기 vs 이해": x.qn;
      const st= ST.skip[x.id]?"skip": ST.done[x.id]?"done": (i===ST.idx?"cur":"");
      cur.items.push('<button class="jp '+st+'" data-jump="'+x.id+'">'+esc(lab)+'</button>');
    }
  });
  const nSkip=Object.keys(ST.skip).length;
  return '<div class="jump"><div class="jump-h">아는 부분은 건너뛰고 막히는 곳부터. 누른 장 앞은 전부 「건너뜀」이 되고 채점에서 빠진다.'+
    (nSkip?'<button class="btn xs" id="unskip">건너뜀 '+num(nSkip)+'장 되돌리기</button>':'')+'</div>'+
    rows.map(r=>'<div class="jump-part"><div class="jump-pt">파트 '+num(r.part)+' · '+esc(String(r.title).replace(/[\s★]+$/,""))+'</div><div class="jump-items">'+r.items.join("")+'</div></div>').join("")+'</div>';
}

/* ---------- 출처 발췌 ---------- */
function renderSrc(s){
  const box=$("#srcs"); const list=Array.isArray(s.src)?s.src:[];
  box.innerHTML=list.map((x,i)=>'<button class="src-th" data-si="'+i+'" title="'+esc(x.label||"출처")+'"><img src="'+esc(x.img)+'" alt="" loading="lazy"><span class="src-n">'+(i+1)+'</span></button>').join("");
  box.querySelectorAll(".src-th").forEach(b=>{ b.onclick=()=>openSrc(list,+b.dataset.si); });
}
function openSrc(list,i){
  let lb=$("#srclb"); if(!lb){ lb=document.createElement("div"); lb.id="srclb"; $("#stage").appendChild(lb); }
  const x=list[i];
  lb.innerHTML='<div class="src-top"><b>출처</b><span>'+esc(x.label||"")+'</span><span class="src-pos">'+(i+1)+' / '+list.length+'</span><button class="src-x" aria-label="닫기">✕</button></div>'+
    '<div class="src-body"><img src="'+esc(x.img)+'" alt="'+esc(x.label||"")+'"></div>'+
    '<div class="src-foot"><button class="btn xs" id="srcPrev"'+(i<=0?" disabled":"")+'>← 이전 출처</button><span class="hint">사진을 누르면 확대 · 드래그로 이동</span><button class="btn xs" id="srcNext"'+(i>=list.length-1?" disabled":"")+'>다음 출처 →</button></div>';
  lb.classList.add("on");
  const img=lb.querySelector(".src-body img"), bd=lb.querySelector(".src-body");
  img.onclick=()=>{ const z=img.classList.toggle("zoom"); if(!z) bd.scrollTo(0,0); };
  lb.querySelector(".src-x").onclick=()=>lb.classList.remove("on");
  const p=$("#srcPrev"), n=$("#srcNext"); if(p) p.onclick=()=>openSrc(list,i-1); if(n) n.onclick=()=>openSrc(list,i+1);
}

/* ---------- 답·풀이 판 ---------- */
function openAns(s){
  let lb=$("#anslb"); if(!lb){ lb=document.createElement("div"); lb.id="anslb"; $("#stage").appendChild(lb); }
  const my=(ST.answer||{})[s.id]; const mc=Array.isArray(s.choices)&&s.choices.length>0;
  const mine= mc ? (s.choices[+my]?'<span class="num">'+(+my+1)+'</span>번 — '+s.choices[+my].html:'') : esc(my||"");
  lb.innerHTML='<div class="ans-top"><span class="kicker">'+esc(s.qn)+'</span><span class="verdict '+(ST.correct[s.id]===true?"ok":ST.correct[s.id]===false?"bad":"")+'">'+(ST.correct[s.id]===true?"정답":ST.correct[s.id]===false?"오답":"내 답")+'</span><button class="src-x" id="ansX" aria-label="닫기">✕</button></div>'+
    '<div class="myans-show"><div class="kicker">내 답</div><div class="myans-txt">'+mine+'</div></div>'+
    '<div class="ans"><div class="kicker">답 · 풀이</div>'+s.ans+'</div>';
  lb.classList.add("on"); $("#ansX").onclick=()=>lb.classList.remove("on"); typeset(lb);
}
/* ---------- 상단 진행점 (파트 안의 단계 · 시험 언급은 핑크) ---------- */
function renderTop(s){
  const inPart=s.part?SLIDES.filter(x=>x.part===s.part&&x.type!=="cover"&&x.type!=="result"):[];
  $("#progress").innerHTML=inPart.map(x=>'<span class="dot'+(ST.done[x.id]?" done":"")+(Array.isArray(x.exam)&&x.exam.length?" exam":"")+(x.id===s.id?" cur":"")+'"></span>').join("");
  const p=partOf(s.part); $("#chapter").textContent=p?("파트 "+p.n+" · "+String(p.title).replace(/[\s★]+$/,"")):"정역학 · 1~3주차 임시 정리";
  $("#pos").textContent=(ST.idx+1)+" / "+SLIDES.length;
}

/* ---------- 힌트: 문제 장에서는 그 파트의 한 줄 요약, 개념 장에서는 없음 ---------- */
function hintFor(s){ const p=partOf(s.part); if(s.type==="q"&&p&&p.hint) return p.hint; return null; }

function render(){
  const i=Math.max(0,Math.min(ST.idx,SLIDES.length-1)); ST.idx=i; const s=SLIDES[i]; const body=$("#body"), act=$("#act");
  body.dataset.ready="false"; $("#hintBox").hidden=true; { const al=$("#anslb"); if(al) al.classList.remove("on"); } /* V4-ANSLB */
  act.innerHTML=""; ST.skip=ST.skip||{}; $("#doneTag").textContent=ST.skip[s.id]?"건너뜀":ST.done[s.id]?"완료":"";
  body.classList.remove("q-mode","rev","scrollable"); closePad(); $("#padBtn").hidden=true;
  renderTop(s); if(s.scroll) body.classList.add("scrollable");   /* --soft 임시 덱: 넘친 장만 스크롤 */
  if(s.type==="start"){
    body.innerHTML='<div class="cover"><div class="kicker">학습 슬라이드 · 가로 화면</div><div class="big">정역학 · 1~3주차 임시 정리</div>'+
      '<div class="sub">오른쪽 아래 「다음」으로 언제든 넘어갈 수 있고, 페이지를 끝내면 「다음」이 실선이 됩니다. 기초 문제는 보기를 누르고, 답이 여러 개인 문제는 답을 씁니다. 왼쪽 아래 「힌트」는 그 파트의 한 줄 요약, 작은 사진은 출처(학습지·내 풀이본)입니다.</div>'+
      '<div class="sub">파트 '+num(PARTS.length)+'개 · 문제 '+num(SLIDES.filter(x=>x.type==="q").length)+'개</div></div>';
    act.innerHTML='<button class="btn xs" id="reset">진행 기록 지우기</button>';
    $("#reset").onclick=()=>{ if(confirm("진행 기록을 지울까요?")){ ST={idx:0,done:{},correct:{},revealed:{},answer:{},ink:{},finger:false,padBig:false,skip:{}}; save(); render(); } };
    ST.done[s.id]=true;
  } else if(s.type==="jump"){
    body.classList.add("scrollable"); body.innerHTML='<div class="kicker">시작 위치</div><h2>어디서부터 할까?</h2>'+jumpListHTML();
    body.querySelectorAll("[data-jump]").forEach(b=>{ b.onclick=()=>startFrom(b.dataset.jump); }); const u=$("#unskip"); if(u) u.onclick=unskipAll;
    act.innerHTML='<button class="btn" id="ok">처음부터 차례로</button>'; $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };
    ST.done[s.id]=true;
  } else if(s.type==="cover"){
    body.innerHTML=examHTML(s)+'<div class="cover"><div class="kicker">'+esc(s.no)+'</div><div class="big">'+esc(String(s.title).replace(/[\s★]+$/,""))+'</div><div class="sub">개념 → 암기 vs 이해 → 기초 문제 → 응용 문제 순서로 갑니다.</div></div>';
    act.innerHTML='<button class="btn" id="ok">시작</button>'; $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };
  } else if(s.type==="concept"){
    body.innerHTML=examHTML(s)+'<div class="kicker">'+(s.part?'파트 '+num(s.part)+' · 개념':'')+'</div><h2>'+esc(s.title)+'</h2>'+s.html;
    act.innerHTML='<button class="btn" id="ok">'+(ST.done[s.id]?"다시 읽음 표시":"읽었어요 — 이해했습니다")+'</button>';
    $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); render(); };
  } else if(s.type==="mu"){
    const li=xs=>xs.map(x=>'<li>'+x+'</li>').join("");
    body.innerHTML=examHTML(s)+'<div class="kicker">파트 '+num(s.part)+' · 암기 vs 이해</div><h2>'+esc(String(s.title).replace(/[\s★]+$/,""))+' — 무엇을 외우고 무엇을 이해하나</h2>'+
      '<div class="mu"><div class="mu-mem"><div class="mu-h">암기할 것 <span class="hint">외워서 바로 나와야</span></div><ul>'+li(s.mem)+'</ul></div>'+
      '<div class="mu-und"><div class="mu-h">이해할 것 <span class="hint">왜 그런지 설명할 수 있어야</span></div><ul>'+li(s.und)+'</ul></div></div>';
    act.innerHTML='<button class="btn" id="ok">'+(ST.done[s.id]?"다시 확인 표시":"구분했어요")+'</button>';
    $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); render(); };
  } else if(s.type==="q"){
    const rev=!!ST.revealed[s.id];
    ST.answer=ST.answer||{}; ST.ink=ST.ink||{}; const my=ST.answer[s.id]||"";
    const mc=Array.isArray(s.choices)&&s.choices.length>0;
    body.classList.add("q-mode"); body.classList.toggle("rev",rev);
    const choiceHTML=()=>'<div class="choices'+(rev?" rev":"")+'">'+s.choices.map((c,i)=>{ const sel=String(my)===String(i); const cls=(sel?" sel":"")+(rev?(c.ok?" ok":(sel?" bad":"")):"");
      return '<button class="choice'+cls+'" data-ci="'+i+'"'+(rev?" disabled":"")+'><span class="cn">'+(i+1)+'</span><span class="ct">'+c.html+'</span></button>'; }).join("")+'</div>';
    body.innerHTML=examHTML(s)+'<div class="kicker">파트 '+num(s.part)+'</div><h2><span class="q-kind">'+s.kind+'</span>'+esc(s.qn)+'</h2><div class="qbody">'+s.html+'</div>'+
      (mc ? choiceHTML() : rev
        ? '<div class="myans-show"><div class="kicker">내 답</div><div class="myans-txt">'+esc(my)+'</div></div>'
        : '<div class="myans"><label for="myans">내 답 — 답만. 행렬은 [1 2; 3 4]처럼, 여러 개면 쉼표로</label><textarea id="myans" rows="2" placeholder="여기에 답을 쓰고 「답 확인」">'+esc(my)+'</textarea></div>')+
      (rev?'<div class="myans-note"><button class="btn xs" id="showAns">답 · 풀이 다시 보기</button></div>':'');
    if(rev){ openAns(s); const sa=$("#showAns"); if(sa) sa.onclick=()=>openAns(s); }
    closePad(); $("#padBtn").hidden=false;
    if(mc&&!rev){
      act.innerHTML='<button class="btn primary" id="reveal" disabled>답 확인</button>';
      const rb=$("#reveal"); let my2=my; const upd=()=>{ rb.disabled=!(String(my2)!==""); };
      body.querySelectorAll(".choice").forEach(b=>{ b.onclick=()=>{ my2=b.dataset.ci; ST.answer[s.id]=my2; save(); body.querySelectorAll(".choice").forEach(x=>x.classList.toggle("sel",x===b)); upd(); }; });
      upd();
      rb.onclick=()=>{ if(String(my2)==="") return; const ok=!!(s.choices[+my2]&&s.choices[+my2].ok); ST.answer[s.id]=my2; ST.revealed[s.id]=true; ST.correct[s.id]=ok; ST.done[s.id]=true; save(); render(); };
    } else if(mc&&rev){
      const c=ST.correct[s.id];
      act.innerHTML='<span class="verdict '+(c?"ok":"bad")+'">'+(c?"정답":"오답 — 풀이를 읽고 다시")+'</span><button class="btn xs" id="retry1">다시 풀기</button>';
      $("#retry1").onclick=()=>{ delete ST.revealed[s.id]; delete ST.done[s.id]; delete ST.correct[s.id]; delete ST.answer[s.id]; save(); render(); };
    } else if(!rev){
      act.innerHTML='<button class="btn primary" id="reveal" disabled>답 확인</button>';
      const ta=$("#myans"), rb=$("#reveal");
      const sync=()=>{ ST.answer[s.id]=ta.value; rb.disabled=!ta.value.trim(); };
      ta.oninput=sync; ta.onchange=()=>{ sync(); save(); }; sync();
      rb.onclick=()=>{ if(!ta.value.trim()){ ta.focus(); return; } ST.answer[s.id]=ta.value.trim(); ST.revealed[s.id]=true; save(); render(); };
      ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); rb.click(); } };
      setTimeout(()=>{ try{ ta.focus({preventScroll:true}); }catch(e){} },50);
    } else {
      const c=ST.correct[s.id];
      act.innerHTML='<button class="btn" id="yes">맞았어요'+(c===true?" ✓":"")+'</button><button class="btn" id="no">틀렸어요 · 다시'+(c===false?" ✓":"")+'</button>';
      $("#yes").onclick=()=>{ ST.correct[s.id]=true; ST.done[s.id]=true; save(); render(); };
      $("#no").onclick=()=>{ ST.correct[s.id]=false; ST.done[s.id]=true; save(); render(); };
    }
  } else if(s.type==="result"){
    const sc=partScore(s.part), pct=(o)=>o.n?Math.round(o.ok/o.n*100):0;
    const passB=sc.b.n===0||sc.b.ok===sc.b.n, passA=sc.a.n===0||sc.a.ok*3>=sc.a.n*2;
    body.innerHTML='<div class="kicker">파트 '+num(s.part)+' 결과</div><h1>'+esc(String(s.title).replace(/[\s★]+$/,""))+'</h1><div class="score">'+
      '<div class="c"><b>'+sc.b.ok+'/'+sc.b.n+'</b>기초 · '+num(pct(sc.b)+'%')+' · '+(passB?"통과":"미달")+'</div>'+
      '<div class="c"><b>'+sc.a.ok+'/'+sc.a.n+'</b>응용 · '+num(pct(sc.a)+'%')+' · '+(passA?"통과":"미달")+'</div></div>'+
      '<p>'+(passB&&passA?'파트 완료. 기준(기초 전부 + 응용 2/3 이상)을 넘었습니다.':'기준은 기초 전부 + 응용 2/3 이상. 틀린 문제는 개념 페이지로 돌아가 다시 읽고 풀어 보세요.')+'</p>';
    act.innerHTML='<button class="btn xs" id="back">이 파트 처음으로</button><button class="btn" id="ok">확인</button>';
    $("#back").onclick=()=>{ ST.idx=SLIDES.findIndex(x=>x.id==="p"+s.part+"-cover"); save(); render(); };
    $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };
  } else if(s.type==="final"){
    const qs=SLIDES.filter(x=>x.type==="q"&&!(ST.skip||{})[x.id]); const ok=qs.filter(q=>ST.correct[q.id]===true).length, done=qs.filter(q=>ST.done[q.id]).length;
    const wrong=SLIDES.filter(x=>x.type==="q"&&ST.correct[x.id]===false);
    body.innerHTML='<div class="kicker">전체 결과</div><h1>정역학 · 1~3주차 임시 정리</h1><div class="score"><div class="c"><b>'+ok+'/'+qs.length+'</b>정답 · 푼 문제 '+num(done)+'</div><div class="c"><b>'+wrong.length+'</b>틀린 문제</div></div>'+
      '<p>'+(wrong.length?'틀린 문제: '+wrong.slice(0,6).map(w=>esc(w.qn)).join(", ")+(wrong.length>6?' 외 '+num(wrong.length-6)+'개':''):'틀린 문제가 없습니다.')+'</p>';
    act.innerHTML='<button class="btn xs" id="retry"'+(wrong.length?"":" disabled")+'>틀린 문제만 다시</button><button class="btn xs" id="first">처음으로</button>';
    $("#retry").onclick=()=>{ if(!wrong.length) return; wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; }); ST.idx=SLIDES.indexOf(wrong[0]); save(); render(); };
    $("#first").onclick=()=>{ ST.idx=0; save(); render(); };
    ST.done[s.id]=true; save();
  }
  renderSrc(s);
  const h=hintFor(s); const hb=$("#hintBtn"); hb.disabled=!h; hb.title=h?"":"이 장에는 힌트가 없습니다";
  const nxt=$("#next"), prv=$("#prev");
  const unlocked=i<SLIDES.length-1;
  nxt.disabled=!unlocked; nxt.classList.toggle("undone",!ST.done[s.id]&&unlocked); prv.disabled=(i===0);
  typeset(body);
  body.scrollTop=0;
}
function go(d){ const n=ST.idx+d; if(n<0||n>=SLIDES.length) return; ST.idx=n; save(); render(); }
$("#next").onclick=()=>go(1); $("#prev").onclick=()=>go(-1);
$("#padBtn").onclick=()=>{ const s=SLIDES[ST.idx]; if(s.type!=="q") return; if($("#padPanel").classList.contains("on")) closePad(); else openPad(s.id); };
$("#hintBtn").onclick=()=>{ const s=SLIDES[ST.idx], h=hintFor(s); if(!h) return; const hb=$("#hintBox"); if(!hb.hidden){ hb.hidden=true; return; } hb.innerHTML='<div class="kicker">힌트 · 파트 '+num(s.part)+' 한 줄</div><div>'+esc(h)+'</div>'; hb.hidden=false; typeset(hb); };
document.addEventListener("keydown",e=>{ const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||(t&&t.isContentEditable)) return; if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); });

/* ---------- 검사 모드 (#check): 전 장을 돌며 오버플로·raw LaTeX를 잰다. 빌드 뒤 헤드리스로 캡처해 확인한다 ---------- */
async function runCheck(){
  try{ await document.fonts.ready; }catch(e){}
  const body=$("#body"); const fails=[]; const saved=JSON.stringify(ST);
  const foot=$("#foot"), stage=$("#stage");
  const measure=(tag)=>{ const over=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(body.scrollHeight>body.clientHeight||body.scrollWidth>body.clientWidth); const fo=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(foot.scrollWidth>foot.clientWidth||stage.scrollHeight>stage.clientHeight); const raw=body.dataset.raw==="1"; if(over||fo||raw) fails.push(SLIDES[ST.idx].id+tag+(over?" 넘침 "+body.scrollHeight+">"+body.clientHeight:"")+(fo?" 하단/무대 넘침":"")+(raw?" rawLaTeX":"")); };
  for(let i=0;i<SLIDES.length;i++){
    const s=SLIDES[i];
    ST.idx=i; delete ST.revealed[s.id]; render(); await new Promise(r=>setTimeout(r,20)); measure("");
    if(s.type==="q"){ /* 답 공개 상태 */ ST.revealed[s.id]=true; ST.answer[s.id]=Array.isArray(s.choices)&&s.choices.length?"0":"x"; ST.correct[s.id]=false; render(); await new Promise(r=>setTimeout(r,20)); measure(" [답공개]"); { const al=$("#anslb"); if(al&&al.classList.contains("on")){ const a=al.querySelector(".ans"); if(a&&(a.scrollHeight>a.clientHeight||al.scrollHeight>al.clientHeight)) fails.push(s.id+" [풀이판] 넘침 "+a.scrollHeight+">"+a.clientHeight); al.classList.remove("on"); } }
      /* 힌트 열림 */ $("#hintBtn").click(); await new Promise(r=>setTimeout(r,20)); const hb=$("#hintBox"); if(!hb.hidden&&hb.getBoundingClientRect().top<body.getBoundingClientRect().top) fails.push(s.id+" [힌트] 상단 침범"); hb.hidden=true; }
  }
  try{ ST=JSON.parse(saved); }catch(e){}
  const c=$("#chk"); c.style.display="block";
  c.innerHTML='<h2 id="chkTitle">검사: '+SLIDES.length+'장 · 실패 '+fails.length+'</h2><pre id="chkList">'+esc(fails.join("\n"))+'</pre>';
  window.CHECK_RESULT={n:SLIDES.length,fails};
}
function boot(){
  { const m=/^#(from|done|at)=([\w-]+)(?:,pad)?$/.exec(location.hash||""); if(m){ startFrom(m[2], m[1]==="from"?"skip":m[1]); if(/,pad$/.test(location.hash)) setTimeout(()=>$("#padBtn").click(),300); return; } }
  if(location.hash==="#check"){ runCheck(); return; }
  render();
  if(location.hash==="#src"){ setTimeout(()=>{ const b=$("#srcs .src-th"); if(b) b.click(); },400); }
}
function fontCheck(){ try{ const ok=document.fonts.check("22px 'Nanum Pen Script'"); if(!ok){ let w=$("#fontWarn"); if(!w){ w=document.createElement("div"); w.id="fontWarn"; $("#stage").appendChild(w); } w.hidden=false; w.textContent="손글씨 글꼴을 불러오지 못해 대체 글꼴로 보입니다. 인터넷 연결을 확인하고 새로 고침하세요."; } }catch(e){} }
function whenReady(){ if(window.renderMathInElement){ fontCheck(); boot(); } else setTimeout(whenReady,40); }
document.addEventListener("DOMContentLoaded",()=>{ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(whenReady,whenReady); });
</script>
</body>
