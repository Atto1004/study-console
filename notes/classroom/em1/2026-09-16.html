<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1장을 닫고 2장을 열다 — 베르누이 연습, 해법 총정리, 중첩 원리와 기저</title>
<!-- 교실 모드 템플릿 v1.1 (캐릭터 = docs/tools/tutor.svg 인라인, 이름 김주영 스앵님) (대표님 2026-09-26 결정: 초록 칠판 + 스앵님(김주영 미니버전) 캐릭터가 알려주는 느낌 · 목차/챕터 · 듀오링고식 XP·스트릭·하트·호감도 · 시스템은 최대한 심플)
     build_classroom.py 가 제목·자료(JSON)·교재 경로 자리를 채운다. 저장: localStorage mc-tutor(전역 XP·스트릭·하트·호감도·회차 위치) + mc-lesson-<id>(읽음·문제, 교재 페이지·앱 V52 와 공유) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--wall:#F4EEE2;--wood:#7A4E2B;--wood-2:#5C3A1E;--green:#2F5F4E;--green-2:#25503F;--chalk:#F5F2E9;--chalk-2:rgba(245,242,233,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --ink:#1F2A44;--ink-2:#55627A;--ink-3:#66727F;--du-green:#58CC02;--du-green-2:#46A302;--du-blue:#1CB0F6;--du-blue-2:#1899D6;--du-blue-text:#0A7BBF;--du-red:#D42020;--du-red-2:#A61B1B;--du-gray:#E5E5E5;--du-gray-2:#CFCFCF;--du-yel:#FFC800;--du-orange:#FF9600;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--pen:"Nanum Pen Script","Pretendard Variable",sans-serif;--fs:19px;--hud:56px}
*{box-sizing:border-box}
html{background:var(--wall)}
body{margin:0;font-family:var(--f);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.6;
  background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.7),transparent 42%),radial-gradient(circle at 80% 90%,rgba(255,225,170,.35),transparent 46%),var(--wall);min-height:100vh}
button{font-family:inherit}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:2px solid rgba(31,42,68,.08)}
#hud .in{max-width:1000px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
#hud .chp{font-size:12.5px;font-weight:800;color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
#hud .pbar{flex:1;height:14px;border-radius:99px;background:#E6E2D6;overflow:hidden;position:relative}
#hud .pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7ED957,#58CC02);transition:width .45s cubic-bezier(.2,.8,.2,1)}
#hud .pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
#hud .hr{display:flex;align-items:center;gap:10px}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--ink-2);padding:4px 8px;border-radius:12px;background:rgba(255,255,255,.7);border:2px solid rgba(31,42,68,.06);position:relative}
.stat svg{width:18px;height:18px;display:block}
.stat small{font-weight:700;color:var(--ink-3);font-size:11px}
.stat.xp{color:#9A5B00}.stat.sk{color:#C2410C}.stat.hp{color:#C92A2A;gap:2px}.stat.af{color:#B8286A}  /* 흰 바탕 4.5:1 이상 (오타 v54 D) */
.stat.hp svg{width:17px}
.stat .gauge{display:inline-block;width:56px;height:9px;border-radius:99px;background:#F1D4E0;overflow:hidden}
.stat .gauge b{display:block;height:100%;width:0;background:linear-gradient(90deg,#F783AC,#D0397A);transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#1F7A32;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#C92A2A}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:0;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer;border-bottom:3px solid #000}
#hToc:active{transform:translateY(1px);border-bottom-width:2px}
/* ---------- 교실 ---------- */
main{max-width:1000px;margin:0 auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - var(--hud))}
#board{position:relative;flex:1;display:flex;flex-direction:column;min-height:360px}
.frame{flex:1;display:flex;padding:14px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 18px 40px rgba(60,40,20,.22),inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.25);position:relative}
.frame::before{content:"";position:absolute;inset:6px;border-radius:10px;border:2px solid rgba(255,255,255,.08);pointer-events:none}
.green{flex:1;position:relative;border-radius:6px;background:
  radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.07),transparent 42%),radial-gradient(ellipse at 78% 74%,rgba(255,255,255,.05),transparent 40%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chk{position:absolute;left:18px;top:12px;font-family:var(--pen);font-size:22px;color:var(--yel);letter-spacing:.02em;opacity:.95;z-index:2;text-shadow:0 0 2px rgba(255,226,122,.35)}
.chk small{font-family:var(--f);font-size:11.5px;font-weight:800;color:var(--chalk-2);margin-left:8px;letter-spacing:.06em;vertical-align:middle}
#bwrap{flex:1;overflow:auto;padding:46px 34px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bc{margin:auto 0;width:100%}  /* 짧은 판서는 세로 가운데, 긴 판서는 위에서부터 스크롤 */
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-size:var(--fs);line-height:1.75;text-shadow:0 0 1px rgba(255,255,255,.28);max-width:840px}
#bc>*{animation:write .5s ease-out both}
#bc>*:nth-child(2){animation-delay:.15s}#bc>*:nth-child(3){animation-delay:.3s}#bc>*:nth-child(4){animation-delay:.45s}#bc>*:nth-child(n+5){animation-delay:.6s}
@keyframes write{from{opacity:0;transform:translateY(6px);filter:blur(1px)}to{opacity:1;transform:none;filter:none}}
#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc p{margin:0 0 12px}
#bc .sub{font-family:var(--pen);font-size:28px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .tk{font-size:calc(var(--fs) + 1px)}
#bc .katex{color:var(--chalk);font-size:1.06em}#bc .katex-display{margin:12px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
#bc a{color:var(--sky)}
#bc table{border-collapse:collapse;margin:8px 0;font-size:.92em}#bc td,#bc th{border:1px dashed rgba(245,242,233,.45);padding:5px 10px;text-align:left}#bc th{color:var(--yel)}
#bc ul,#bc ol{margin:6px 0 10px;padding-left:24px}
/* 상자들: 분필 테두리 */
#bc .bx{margin:6px 0 14px;padding:14px 18px 12px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative;font-size:var(--fs)}
#bc .bx>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;line-height:1;margin-bottom:8px;letter-spacing:.02em}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}
#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75);background:rgba(255,255,255,.05)}#bc .bx.formula>i{color:var(--mint)}
#bc .bx.pitfall{border-color:rgba(255,163,199,.7);background:rgba(255,120,160,.07)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7);background:rgba(255,255,255,.05)}#bc .bx.memo>i{color:var(--chalk)}
#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
/* 붙임 자료(그림): 칠판에 붙인 종이 — 그림은 교재와 같은 원본 그대로(색·글자 검증 유지) */
#bc .paper{background:#FFFDF7;color:var(--ink);text-shadow:none;border-radius:6px;padding:14px 16px 10px;margin:8px auto 16px;max-width:600px;box-shadow:0 10px 24px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.6) inset;transform:rotate(-.8deg);position:relative;text-align:center}
#bc .paper::before{content:"";position:absolute;left:50%;top:-10px;width:78px;height:20px;margin-left:-39px;background:rgba(255,224,130,.75);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}
#bc .paper figcaption,#bc .paper .cap{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.5;text-align:center}
#bc .paper b{color:var(--ink)}#bc .paper .katex{color:var(--ink)}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
/* 예제 */
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}
#bc .ex .exq>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--yel);line-height:1;margin-bottom:6px}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}
#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz .qn{font-family:var(--pen);font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:calc(var(--fs) + 1px)}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-weight:900;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12);transform:translateY(-1px)}
#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz .cb .katex{color:inherit}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}
#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--pen);font-size:44px;line-height:1.15;color:var(--chalk);margin:0 0 6px;text-shadow:0 0 3px rgba(255,255,255,.2)}
#bc .lead{color:var(--chalk-2);font-size:calc(var(--fs) - 1px);margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
#bc .toc li{display:flex;align-items:center;gap:12px;font-size:var(--fs);padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-size:13px;font-weight:900}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}
#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;padding:10px 0 0}
#bc .res .big{font-family:var(--pen);font-size:64px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:var(--fs);margin:6px 0 12px}
#bc .res .stats b{display:block;font-size:34px;line-height:1.1}
#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700;letter-spacing:.04em}
#bc .res .badge{margin:4px auto 0;width:140px;height:140px}
#bc .res .bl{font-size:13px;font-weight:800;color:var(--chalk-2);letter-spacing:.04em;margin-top:4px}
#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
/* 분필 받침 */
.tray{height:20px;margin:0 30px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:8px;width:48px;border-radius:4px;background:#F5F2E9;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tray i.y{left:80px;background:var(--yel)}.tray i.p{left:140px;background:var(--pink)}.tray i.w{left:24px}
.tray i.er{left:auto;right:30px;width:64px;height:12px;top:3px;border-radius:3px;background:linear-gradient(180deg,#2B2B33,#111);}
/* ---------- 대화 ---------- */
#dlg{display:flex;align-items:flex-end;gap:14px;min-height:170px}
#tutor{flex:0 0 170px;width:170px;height:200px;margin-bottom:-6px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
.box{flex:1;min-width:0;background:#fff;border:2px solid rgba(31,42,68,.12);border-radius:18px;padding:16px 18px 14px;box-shadow:0 12px 30px rgba(31,42,68,.10);position:relative;min-height:150px;display:flex;flex-direction:column}
.box::before{content:"";position:absolute;left:-12px;bottom:46px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.name{position:absolute;left:16px;top:-14px;background:var(--ink);color:#FFE27A;font-family:var(--pen);font-size:22px;line-height:1;padding:5px 14px 4px;border-radius:10px;letter-spacing:.03em;border-bottom:3px solid #000}
.name.prof{background:#7A2E52;color:#FFD6E7}
.text{flex:1;font-size:18px;line-height:1.65;padding:8px 0 10px;min-height:56px;cursor:pointer}
.text .cur{display:inline-block;width:.55em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.choices{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* 선택지 버튼 — 글자 대비 4.5:1 이상: 질문 = 흰 바탕 파란 글자, 기본 = 밝은 초록 바탕 짙은 초록 글자(7.2:1), 틀림 = 진한 빨강 바탕 흰 글자(5.0:1) */
.cbt{font:inherit;font-weight:800;font-size:15.5px;padding:11px 18px;border-radius:14px;cursor:pointer;color:var(--du-blue-text);background:#fff;border:2px solid #84D8FF;border-bottom:4px solid #84D8FF;transition:transform .08s,filter .15s;letter-spacing:-.01em;min-height:46px}
.cbt:hover{filter:brightness(.97)}.cbt:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.cbt.p{background:var(--du-green);color:#0B2E00;border-color:var(--du-green);border-bottom-color:var(--du-green-2)}
.cbt.g{background:#fff;color:var(--ink-2);border:2px solid var(--du-gray);border-bottom:4px solid var(--du-gray)}
.cbt.r{background:var(--du-red);color:#fff;border-color:var(--du-red);border-bottom-color:var(--du-red-2)}
.cbt.y{background:var(--du-yel);border-bottom-color:#E5A800;color:#4A3600}
.cbt kbd{font:inherit;font-size:11px;opacity:.7;margin-left:6px}
.choices .sp{flex:1}
.tip{font-size:12.5px;color:var(--ink-3);margin-left:auto}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.55);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-size:22px}
#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:#F7F7F7;border:2px solid #EEE;border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--du-blue)}
#ov li .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #CFCFCF;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--ink-3)}
#ov li.done .st{background:var(--du-green);border-color:var(--du-green);color:#fff}
#ov li.cur button{border-color:var(--du-yel);background:#FFF8DC}
#ov li small{margin-left:auto;color:var(--ink-3);font-weight:700;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* ---------- 폰 ---------- */
@media(max-width:640px){
  :root{--fs:16.5px;--hud:50px}

<script>
const D={"id": "em1-2026-09-16", "slug": "em1", "course": "공업수학1", "date": "2026-09-16", "sess": "9/16(수) · 3주차", "title": "1장을 닫고 2장을 열다 — 베르누이 연습, 해법 총정리, 중첩 원리와 기저", "lead": "앞 20분은 지난 시간 예고한 <b>베르누이·치환 연습 3제<\/b>, 그다음 \"1장이 다 끝났다\"며 <b>해법 여섯 가지<\/b>를 한 표로 정리했다. 후반은 <b>2.1 2계 선형 ODE<\/b>: 표준형, 제차만 성립하는 <b>중첩 원리<\/b>, 초기값 문제(조건 2개), <b>1차독립·기저<\/b>(교수님이 정정한 판별), 그리고 <b>차수축소법<\/b> 공식까지. 진도가 빠른 이유도 말했다 — 중간까지 실질 7주.", "minutes": 22, "chapters": [{"id": "s1", "title": "베르누이 복습 + 연습 1 (전형)", "steps": [{"t": "talk", "html": "<p>복습: 표준형 \\(y'+p(x)y=r(x)\\) → \\(h=\\int p\\,dx\\), \\(y=e^{-h}[\\int e^hr\\,dx+c]\\). 베르누이 \\(y'+p(x)y=g(x)y^a\\)는 \\(a=0,1\\)이면 선형, 아니면 <b>\\(u=y^{1-a}\\)<\/b> 치환으로 선형이 된다.<\/p>", "sub": null}, {"t": "say", "html": "\"꼭 \\(y^{1-a}\\)로 치환해야 되느냐, 꼭 그렇지는 않아요. <b>형태를 따라서 여러분들이 취사선택<\/b>을 해야 돼요.\""}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 160\" width=\"560\" height=\"160\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"30\" width=\"150\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"89.0\" y=\"56.0\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">xy′ + y = 1/y²<\/text><text x=\"89.0\" y=\"72.0\" font-size=\"8.7\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">÷x → y′ + (1/x)y = (1/x)y⁻²<\/text><line x1=\"166\" y1=\"58\" x2=\"200\" y2=\"58\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><text x=\"183\" y=\"46\" font-size=\"11.5\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a = −2<\/text><rect x=\"204\" y=\"30\" width=\"120\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"264.0\" y=\"56.0\" font-size=\"15\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = y³<\/text><text x=\"264.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u′ = 3y²y′<\/text><line x1=\"326\" y1=\"58\" x2=\"360\" y2=\"58\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"364\" y=\"30\" width=\"186\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"457.0\" y=\"56.0\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u′ + (3/x)u = 3/x<\/text><text x=\"457.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">「착한」 선형 — 또는 변수분리<\/text><line x1=\"457\" y1=\"88\" x2=\"457\" y2=\"108\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"330\" y=\"110\" width=\"220\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"440.0\" y=\"135.0\" font-size=\"11.7\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = 1 + c/x³  →  y³ = 1 + c/x³<\/text><text x=\"165\" y=\"134\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">두 길: 변수분리 du/(u−1) = −3dx/x · 선형 공식 h = 3 ln x<\/text><\/svg><figcaption>연습 1 — 전형적인 베르누이. 마지막에 u 를 y 로 되돌린다.<\/figcaption>"}, {"t": "ex", "q": "연습 1 \\(xy'+y=1/y^2\\) — 교수님 순서 그대로", "a": "<p>① \\(1/y^2\\) → 비선형. \\(x\\)로 나눠 표준형 \\(y'+\\frac1xy=\\frac1xy^{-2}\\) → \\(a=-2\\). ② \\(u=y^{1-(-2)}=y^3\\), \\(u'=3y^2y'=3y^2\\big(-\\frac yx+\\frac{y^{-2}}x\\big)=-\\frac{3y^3}x+\\frac3x\\) → ③ <b>\\(u'+\\frac3xu=\\frac3x\\)<\/b> — \"아침에 배웠던 착한 형태\". ④ (a) 변수분리 \\(\\frac{du}{u-1}=-\\frac{3\\,dx}x\\) → \\(\\ln|u-1|=-3\\ln x+c\\) → \\(u-1=c/x^3\\). (b) 선형 공식 \\(h=3\\ln x\\), \\(u=x^{-3}[\\int x^3\\cdot\\frac3x\\,dx+c]=x^{-3}[x^3+c]\\). 같은 답. ⑤ 되돌리기 <b>\\(y^3=1+c/x^3\\)<\/b>.<\/p>"}, {"t": "say", "html": "\"착한 선형 1계 미방으로 풀어도 되고 변수분리로 풀어도 된다. 여러분들이 선택해서 하는 거예요.\" · \"해를 구할 때는 <b>예쁘게 좀 정리<\/b>를 해보는 게 좋죠. 정리하면 강점이 되겠지.\""}, {"t": "why", "html": "치환의 목적은 \"\\(y^{-2}\\)이 붙은 비선형\"을 \"\\(u\\)의 1차식\"으로 바꾸는 것. \\(u'\\) 계산에 원래 식의 \\(y'\\)을 대입하는 것이 핵심 한 줄이고, 판서에서 \\(-\\frac1x\\) 항의 \\(y\\)를 생략해 적었으니 필기는 \\(-\\frac1xy\\)로 고쳐 둘 것."}, {"t": "analogy", "html": "외국 돈(\\(y\\))으로는 계산이 안 되는 가게 — 환전(\\(u=y^3\\))해서 계산하고, 나올 때 다시 환전(\\(y=u^{1/3}\\))한다. 환전을 안 하고 나오면 답이 아니다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(u=y^{1-a}\\) · \\(u'\\)에 원식의 \\(y'\\) 대입 · 선형 또는 변수분리 · 되돌리기 · 연습 1 답 \\(y^3=1+c/x^3\\)"}], "say": null}, {"id": "s2", "title": "연습 2·3 — 덩어리를 통째로 치환", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"26\" width=\"250\" height=\"50\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"139.0\" y=\"49.0\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(2) y′ = (x + y + 2)²<\/text><text x=\"139.0\" y=\"65.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = x + y + 2 → u′ = 1 + y′ = 1 + u²<\/text><line x1=\"139\" y1=\"78\" x2=\"139\" y2=\"98\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><rect x=\"14\" y=\"100\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"139.0\" y=\"125.0\" font-size=\"12.3\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">∫du/(1+u²) = ∫dx → tan⁻¹u = x + c<\/text><rect x=\"296\" y=\"26\" width=\"250\" height=\"50\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"421.0\" y=\"49.0\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(3) y′ = 1 + e^(y − x + 3)<\/text><text x=\"421.0\" y=\"65.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = y − x + 3 → u′ = y′ − 1 = e^u<\/text><line x1=\"421\" y1=\"78\" x2=\"421\" y2=\"98\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><rect x=\"296\" y=\"100\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"421.0\" y=\"125.0\" font-size=\"12.2\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">∫e^(−u)du = ∫dx → −e^(−u) = x + c<\/text><\/svg><figcaption>연습 2·3 — 식 안의 덩어리를 통째로 u 로 놓으면 변수분리형이 된다. 베르누이 꼴은 아니다.<\/figcaption>"}, {"t": "formula", "html": "\\[(2)\\ \\tan^{-1}(x+y+2)=x+c\\ \\Rightarrow\\ y=\\tan(x+c)-x-2\\qquad (3)\\ -e^{-(y-x+3)}=x+c\\ \\Rightarrow\\ e^{-(y-x+3)}+x+c=0\\]"}, {"t": "why", "html": "(2)는 \\(y^2\\)이 있어 비선형이지만 \\(x+y+2\\)가 한 덩어리로만 나온다 → \\(u\\)로 놓으면 \\(u'=1+y'\\)이 \\(1+u^2\\)로 닫힌다. (3)도 지수 안 덩어리 \\(y-x+3\\). 이것이 슬라이드 표의 ⑥ 치환형 \\(y'=f(ax+by+c)\\). \"굉장히 간단해지죠.\""}, {"t": "say", "html": "정리(19:04): \"1번 = 전형 베르누이, 2번 = 치환 후 변수분리(베르누이 꼴 아님), 3번 = 치환.\" · \"지난번 숙제에서는 베르누이는 안 내줬죠\" → 이번 과제에 포함."}, {"t": "analogy", "html": "긴 문장에서 반복되는 구절을 \"그것\"으로 줄여 부르면 문장이 짧아지듯, 반복되는 덩어리를 \\(u\\)로 부르면 식이 한 변수짜리가 된다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(y'=f(ax+by+c)\\) → \\(u=ax+by+c\\), \\(u'=a+by'\\) · 적분상수는 한쪽에 · 과제 1.5 #23(베르누이) · #28(\\(y^2=z\\) 치환)"}], "say": null}, {"id": "s3", "title": "1장 해법 총정리 — \"1장이 다 끝났다\"", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 250\" width=\"560\" height=\"250\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"16\" y=\"20\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"141.0\" y=\"45.0\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">① 변수분리  g(y)dy = f(x)dx<\/text><rect x=\"16\" y=\"66\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"141.0\" y=\"91.0\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">② 동차  y = ux (또는 x = vy)<\/text><rect x=\"16\" y=\"112\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"141.0\" y=\"137.0\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">③ 완전미방  M<tspan baseline-shift=\"sub\" font-size=\"72%\">y<\/tspan> = N<tspan baseline-shift=\"sub\" font-size=\"72%\">x<\/tspan> → u = c<\/text><rect x=\"16\" y=\"158\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#8A97A6\" stroke-width=\"1.6\"><\/rect><text x=\"141.0\" y=\"183.0\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">   완전 아니면 적분인자 F(x)·F(y)<\/text><rect x=\"294\" y=\"20\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"419.0\" y=\"45.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">④ 선형  y′ + py = r → 공식<\/text><rect x=\"294\" y=\"66\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"419.0\" y=\"91.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">⑤ 베르누이  u = y^(1−a) → ④<\/text><rect x=\"294\" y=\"112\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"419.0\" y=\"137.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">⑥ 치환  dy/dx = f(ax + by + c)<\/text><text x=\"419\" y=\"178\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = ax + by + c<\/text><text x=\"280\" y=\"228\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">「1장이 다 끝났다」 — 형태를 보고 어느 칸인지 고르는 것이 실력의 반<\/text><\/svg><figcaption>1장 해법 총정리(슬라이드 p.10 표). 시험 문제는 이 여섯 중 하나로 풀린다.<\/figcaption>"}, {"t": "talk", "html": "<table><tr><th>#<\/th><th>형태<\/th><th>방법<\/th><\/tr>\n<tr><td>①<\/td><td>\\(x\\)는 \\(x\\)끼리, \\(y\\)는 \\(y\\)끼리 갈라짐<\/td><td>변수분리 → 양변 적분<\/td><\/tr>\n<tr><td>②<\/td><td>갈라지진 않지만 각 항이 동차<\/td><td>\\(u=y/x\\)(또는 \\(x=vy\\)) → ①<\/td><\/tr>\n<tr><td>③<\/td><td>\\(M\\,dx+N\\,dy=0\\), \\(M_y=N_x\\)<\/td><td>\\(u(x,y)=c\\); 아니면 적분인자 \\(R=\\frac1Q(P_y-Q_x)\\), \\(\\tilde R=\\frac1P(Q_x-P_y)\\)<\/td><\/tr>\n<tr><td>④<\/td><td>\\(y'+py=r\\)<\/td><td>\\(y=e^{-h}[\\int e^hr\\,dx+c]\\), \\(h=\\int p\\,dx\\)<\/td><\/tr>\n<tr><td>⑤<\/td><td>\\(y'+py=gy^a\\)<\/td><td>\\(u=y^{1-a}\\) → ④ 또는 ①<\/td><\/tr>\n<tr><td>⑥<\/td><td>\\(y'=f(ax+by+c)\\)<\/td><td>\\(u=ax+by+c\\) → ①<\/td><\/tr><\/table>", "sub": null}, {"t": "say", "html": "\"수학도 <b>일정 부분은 외워야<\/b> 돼요. 핀란드식으로 유도가 중요하다고 배웠겠지만, 일정 부분은 외워야.\" · \"1장이 조금 어려워, 여러 종류가 있어서. 2장으로 가면 오히려 쉬워져요.\""}, {"t": "why", "html": "외울 것은 셋: 적분인자 공식 2개, 선형 해 공식, 베르누이 치환. 나머지는 \"어느 칸인지 알아보는 눈\" — 9/11 플로차트가 이 표의 순서다."}, {"t": "analogy", "html": "도구함 여섯 칸. 못(문제)을 보고 망치인지 드라이버인지 고르는 것이 먼저, 쓰는 법은 칸마다 정해져 있다."}, {"t": "memo", "html": "<b>외울 것<\/b> 여섯 칸 순서 ①~⑥ · 외울 공식: \\(R\\)·\\(\\tilde R\\)·\\(y=e^{-h}[\\dots]\\)·\\(u=y^{1-a}\\)"}], "say": null}, {"id": "s4", "title": "2.1 2계 선형 ODE — 표준형 · 제차/비제차 · 중첩 원리 ★", "steps": [{"t": "formula", "html": "\\[y''+p(x)y'+q(x)y=r(x)\\quad(\\text{표준형: }y''\\text{ 계수 1}),\\qquad r=0\\ \\text{제차},\\ r\\ne0\\ \\text{비제차}\\]"}, {"t": "talk", "html": "<p>예: \\(y''+25y=e^{-x}\\cos x\\) 비제차 · \\(xy''+y'+xy=0\\) → \\(x\\)로 나눠 \\(y''+\\frac1xy'+y=0\\) 제차 · \\(yy''+y'^2=0\\) 계수에 \\(y\\), \\(y'\\)의 제곱 → <b>비선형<\/b>(\"정말 쉽지가 않아\").<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"60\" y1=\"170\" x2=\"300\" y2=\"170\" stroke=\"#1971C2\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"><\/line><text x=\"300\" y=\"190\" font-size=\"12\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ 방향<\/text><line x1=\"60\" y1=\"170\" x2=\"150\" y2=\"40\" stroke=\"#E03131\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"><\/line><text x=\"120\" y=\"34\" font-size=\"12\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂ 방향<\/text><line x1=\"150\" y1=\"40\" x2=\"390\" y2=\"40\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"><\/line><line x1=\"300\" y1=\"170\" x2=\"390\" y2=\"40\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"><\/line><line x1=\"60\" y1=\"170\" x2=\"390\" y2=\"40\" stroke=\"#2F9E44\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"262\" y=\"128\" font-size=\"14\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">c₁y₁ + c₂y₂<\/text><text x=\"180\" y=\"182\" font-size=\"12\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">c₁y₁<\/text><text x=\"80\" y=\"100\" font-size=\"12\" fill=\"#E03131\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">c₂y₂<\/text><text x=\"470\" y=\"90\" font-size=\"13.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">해의 중첩 원리<\/text><text x=\"470\" y=\"112\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">해끼리 더해도 해,<\/text><text x=\"470\" y=\"130\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">상수배도 해<\/text><text x=\"470\" y=\"160\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">제차 선형에만!<\/text><\/svg><figcaption>판서 ④의 그림: 두 해 y₁, y₂ 가 만드는 평행사변형 안이 전부 해(해 공간). 비제차·비선형에서는 무너진다.<\/figcaption>"}, {"t": "formula", "html": "\\[\\textbf{정리 1(중첩·선형성의 원리)}:\\ y_1,y_2\\text{ 가 제차 선형 ODE의 해이면 }c_1y_1+c_2y_2\\text{ 도 해}\\]"}, {"t": "why", "html": "2계는 두 번 적분 → 상수 2개 → 해가 2개(\\(y_1,y_2\\))이고, 그 1차결합 전체가 해 공간. <b>빨간 글씨<\/b>: 제차 선형에만. 비제차 반례 \\(y''+y=1\\): \\(1+\\cos x\\), \\(1+\\sin x\\)는 각각 해지만 합(\\(2+\\cos x+\\sin x\\))이나 \\(2(1+\\cos x)\\)는 해가 아니다. 비선형 반례 \\(y''y-xy'=0\\): \\(x^2\\), \\(1\\)은 해지만 \\(x^2+1\\), \\(-x^2\\)은 아니다."}, {"t": "say", "html": "\"진도가 빠른 이유: 2학기는 추석·10월 휴일이 많아 중간까지 8주 강의가 <b>실질 7주<\/b>.\" · 2계 선형의 쓰임: 3학년 <b>진동공학·제어공학 → 로봇<\/b>, 라플라스 변환, 회로 해석."}, {"t": "analogy", "html": "제차 선형은 \"레고\": 해 두 개를 붙이거나 늘려도 여전히 조립품(해). 비제차·비선형은 \"찰흙\": 두 덩이를 합치면 다른 것이 된다."}, {"t": "memo", "html": "<b>외울 것<\/b> 표준형 \\(y''+py'+qy=r\\) · 중첩 원리는 <b>제차 선형에만<\/b> · 반례 \\(y''+y=1\\), \\(y''y-xy'=0\\)"}], "say": null}, {"id": "s5", "title": "초기값 문제 · 1차독립 · 기저 ★ (교수님 정정)", "steps": [{"t": "formula", "html": "\\[\\text{IVP: }y(x_0)=K_0,\\ y'(x_0)=K_1\\qquad \\text{Ex.4 }y''+y=0,\\ y(0)=3.0,\\ y'(0)=-0.5:\\ y=c_1\\cos x+c_2\\sin x\\ \\Rightarrow\\ y=3.0\\cos x-0.5\\sin x\\]"}, {"t": "why", "html": "상수 2개 → 초기조건 2개(값과 기울기). 공학에서 초기치 = 시간 \\(t=0\\) 문제, 공간이면(\\(x=0\\)과 \\(x=L\\)) <b>경계치 문제<\/b>(2·3학년). 일반해 \\(c_1y_1+c_2y_2\\)가 \"모든 해\"이려면 \\(y_1,y_2\\)가 <b>1차독립<\/b>이어야 하고, 그런 쌍을 <b>기저(basis)<\/b>·기본계라 한다."}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 190\" width=\"560\" height=\"190\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"60\" y1=\"160\" x2=\"300\" y2=\"160\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"60\" y1=\"160\" x2=\"60\" y2=\"160\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"296\" y=\"178\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x<\/text><text x=\"54\" y=\"164\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y<\/text><line x1=\"60\" y1=\"160\" x2=\"60\" y2=\"20\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><path d=\"M60.0 157.6 L62.8 157.4 L65.6 157.3 L68.5 157.2 L71.3 157.0 L74.1 156.9 L76.9 156.7 L79.7 156.5 L82.5 156.3 L85.4 156.1 L88.2 155.9 L91.0 155.7 L93.8 155.5 L96.6 155.3 L99.5 155.0 L102.3 154.7 L105.1 154.5 L107.9 154.2 L110.7 153.9 L113.6 153.5 L116.4 153.2 L119.2 152.9 L122.0 152.5 L124.8 152.1 L127.7 151.7 L130.5 151.2 L133.3 150.8 L136.1 150.3 L138.9 149.8 L141.7 149.2 L144.6 148.7 L147.4 148.1 L150.2 147.4 L153.0 146.8 L155.8 146.1 L158.7 145.4 L161.5 144.6 L164.3 143.8 L167.1 142.9 L169.9 142.0 L172.8 141.1 L175.6 140.1 L178.4 139.0 L181.2 137.9 L184.0 136.8 L186.8 135.6 L189.7 134.3 L192.5 132.9 L195.3 131.5 L198.1 130.0 L200.9 128.4 L203.8 126.7 L206.6 125.0 L209.4 123.2 L212.2 121.2 L215.0 119.2 L217.8 117.0 L220.7 114.8 L223.5 112.4 L226.3 109.9 L229.1 107.3 L231.9 104.5 L234.8 101.6 L237.6 98.5 L240.4 95.3 L243.2 91.9 L246.0 88.3 L248.9 84.5 L251.7 80.5 L254.5 76.4 L257.3 72.0 L260.1 67.3 L262.9 62.4 L265.8 57.3 L268.6 51.9 L271.4 46.2 L274.2 40.3 L277.0 34.0 L279.9 27.3\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"2.4\"><\/path><path d=\"M60.1 27.3 L63.0 34.0 L65.8 40.3 L68.6 46.2 L71.4 51.9 L74.2 57.3 L77.0 62.4 L79.9 67.3 L82.7 72.0 L85.5 76.4 L88.3 80.5 L91.1 84.5 L94.0 88.3 L96.8 91.9 L99.6 95.3 L102.4 98.5 L105.2 101.6 L108.1 104.5 L110.9 107.3 L113.7 109.9 L116.5 112.4 L119.3 114.8 L122.1 117.0 L125.0 119.2 L127.8 121.2 L130.6 123.2 L133.4 125.0 L136.2 126.7 L139.1 128.4 L141.9 130.0 L144.7 131.5 L147.5 132.9 L150.3 134.3 L153.2 135.6 L156.0 136.8 L158.8 137.9 L161.6 139.0 L164.4 140.1 L167.2 141.1 L170.1 142.0 L172.9 142.9 L175.7 143.8 L178.5 144.6 L181.3 145.4 L184.2 146.1 L187.0 146.8 L189.8 147.4 L192.6 148.1 L195.4 148.7 L198.3 149.2 L201.1 149.8 L203.9 150.3 L206.7 150.8 L209.5 151.2 L212.3 151.7 L215.2 152.1 L218.0 152.5 L220.8 152.9 L223.6 153.2 L226.4 153.5 L229.3 153.9 L232.1 154.2 L234.9 154.5 L237.7 154.7 L240.5 155.0 L243.4 155.3 L246.2 155.5 L249.0 155.7 L251.8 155.9 L254.6 156.1 L257.4 156.3 L260.3 156.5 L263.1 156.7 L265.9 156.9 L268.7 157.0 L271.5 157.2 L274.4 157.3 L277.2 157.4 L280.0 157.6\" fill=\"none\" stroke=\"#E03131\" stroke-width=\"2.4\"><\/path><text x=\"200\" y=\"36\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ = eˣ<\/text><text x=\"70\" y=\"40\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂ = e⁻ˣ<\/text><text x=\"430\" y=\"50\" font-size=\"13.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁/y₂ = e^(2x)  — 상수 아님<\/text><text x=\"430\" y=\"74\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">→ 비례 관계 X → 1차독립 → 기저<\/text><text x=\"430\" y=\"110\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ = eˣ, y₂ = 3eˣ 라면 y₁/y₂ = 1/3<\/text><text x=\"430\" y=\"130\" font-size=\"12.5\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">→ 비례 → 1차종속 (기저 못 됨)<\/text><text x=\"430\" y=\"166\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">「비례하면 종속, 안 하면 독립」 (교수 정정)<\/text><\/svg><figcaption>1차독립 판별: 두 해의 비가 상수인지 본다. 기저가 있어야 일반해 c₁y₁ + c₂y₂ 가 「모든」 해를 덮는다.<\/figcaption>"}, {"t": "formula", "html": "\\[\\text{1차독립: }k_1y_1+k_2y_2=0\\ \\Rightarrow\\ k_1=k_2=0\\ \\text{일 때만}\\qquad\\Leftrightarrow\\qquad y_1/y_2\\ne\\text{const}\\]"}, {"t": "say", "html": "(50:14 정정) \"비례 관계가 되면 1차 <b>종속<\/b>이 되고, 비례 관계가 없으면 1차 <b>독립<\/b>이에요. <b>반대로 얘기했어요.<\/b>\" — 판서 ⑤에 취소선과 별표로 남은 자리."}, {"t": "ex", "q": "예제 — \\(y''-y=0\\)의 기저임을 보이시오: (a) \\(e^x, e^{-x}\\) (b) \\(\\cosh x, \\sinh x\\)", "a": "<p>(a) 대입하면 각각 해. \\(y_1/y_2=e^{2x}\\) 상수 아님 → 독립 → 기저. (b) \\((\\cosh x)''=\\cosh x\\) ✓, \\((\\sinh x)''=\\sinh x\\) ✓. \\(y_1^*/y_2^*=\\coth x\\)(판서는 \\(-k_2/k_1=\\tanh x\\) 꼴) 상수 아님 → 기저. 같은 방정식에 기저가 여럿 있을 수 있다.<\/p>"}, {"t": "analogy", "html": "지도의 두 축이 같은 방향이면(비례) 평면을 못 덮는다. 서로 다른 방향 두 개(독립)라야 모든 점(모든 해)에 닿는다."}, {"t": "memo", "html": "<b>외울 것<\/b> IVP 조건 2개 · 비례 → 종속, 비례 아님 → 독립 · 독립인 두 해 = 기저 · Ex.4 \\(3\\cos x-0.5\\sin x\\) · \"공수2에서도 1차독립 나온다\""}], "say": null}, {"id": "s6", "title": "차수축소법(Reduction of order) — 해 하나를 알면 둘째 해", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"30\" width=\"120\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"74.0\" y=\"56.0\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ 을 안다<\/text><text x=\"74.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">예: y₁ = x<\/text><line x1=\"136\" y1=\"58\" x2=\"170\" y2=\"58\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"174\" y=\"30\" width=\"120\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"234.0\" y=\"56.0\" font-size=\"14\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂ = u·y₁<\/text><text x=\"234.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u 를 찾는다<\/text><line x1=\"296\" y1=\"58\" x2=\"330\" y2=\"58\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"334\" y=\"20\" width=\"216\" height=\"76\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"442.0\" y=\"56.0\" font-size=\"11.2\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂ = y₁ ∫ (1/y₁²)·e^(−∫p dx) dx<\/text><text x=\"442.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">☆ 판서 ⑧·⑨ (지수에 − 있음)<\/text><text x=\"280\" y=\"130\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">2계 식이 u′ 에 대한 1계 식으로 「낮아진다」 — 그래서 차수축소<\/text><\/svg><figcaption>차수축소법. 표준형에서 p(x) 를 읽고 공식에 넣는다. 예제 1 은 설정까지, 계산은 9/18.<\/figcaption>"}, {"t": "formula", "html": "\\[y_2=u\\,y_1\\ \\Rightarrow\\ u''y_1+u'(2y_1'+py_1)+u\\underbrace{(y_1''+py_1'+qy_1)}_{=0}=0\\ \\Rightarrow\\ U=u':\\ U'+\\Big(\\frac{2y_1'}{y_1}+p\\Big)U=0\\ \\Rightarrow\\ \\boxed{\\,y_2=y_1\\int\\frac{1}{y_1^2}e^{-\\int p\\,dx}dx\\,}\\]"}, {"t": "why", "html": "\\(y_1\\)이 해라서 \\(u\\)의 계수가 0으로 사라지고, \\(u'\\)에 대한 1계 변수분리형만 남는다 — 2계가 1계로 \"낮아진다\". 적분해 \\(U\\), 다시 적분해 \\(u\\), 곱해서 \\(y_2\\). 이 공식은 9/18 2.2 중근(Case II)과 9/23 오일러-코시 중근에서 그대로 다시 쓰인다."}, {"t": "ex", "q": "예제 1 \\((x^2-x)y''-xy'+y=0\\), \\(y_1=x\\) — 설정까지(계산은 9/18)", "a": "<p>표준형: \\(y''-\\dfrac{x}{x^2-x}y'+\\dfrac{1}{x^2-x}y=0\\) → \\(p=-\\dfrac{x}{x^2-x}=-\\dfrac{1}{x-1}\\), \\(q=\\dfrac{1}{x^2-x}\\), \\(y_1=x\\), \\(y_1^2=x^2\\). (슬라이드 p.19 답: \\(y_2=x\\ln|x|+1\\).)<\/p>"}, {"t": "say", "html": "\"이 해(\\(y_1\\))를 알면 여기에 집어넣고 \\(y_2\\)를 만들어낼 수 있다.\" · \"이걸 기억하고 있는 게 낫겠죠.\" · 금요일(9/18)에 유도 다시 + 상수계수로."}, {"t": "analogy", "html": "한쪽 신발(\\(y_1\\))을 찾았으면 짝(\\(y_2\\))은 그 모양에 맞춰 만들 수 있다 — 공식이 그 \"맞추는 법\"."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(y_2=y_1\\int\\frac1{y_1^2}e^{-\\int p\\,dx}dx\\)(지수에 −) · 표준형에서 \\(p\\) 읽기 · 과제: 1.5 #23·#28 (2.1 #6·#9는 \"한번 해보세\")"}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 연습 1", "html": "\\(xy'+y=1/y^2\\)의 일반해는?", "choices": [{"html": "\\(y^3=1+c/x^3\\)", "ok": true}, {"html": "\\(y=1+c/x^3\\)", "ok": false}, {"html": "\\(y^3=1+cx^3\\)", "ok": false}, {"html": "\\(y^{-2}=1+c/x^3\\)", "ok": false}], "ans": "\\(u=y^3\\), \\(u'+\\frac3xu=\\frac3x\\) → \\(u=1+c/x^3\\) → 되돌리기. 2번은 되돌리지 않은 것."}, {"id": "q2", "qn": "확인 2 · 치환", "html": "\\(y'=(x+y+2)^2\\)의 일반해는?", "choices": [{"html": "\\(\\tan^{-1}(x+y+2)=x+c\\)", "ok": true}, {"html": "\\(\\tan^{-1}(x+y+2)=c\\)", "ok": false}, {"html": "\\(\\ln(x+y+2)=x+c\\)", "ok": false}, {"html": "\\(x+y+2=ce^x\\)", "ok": false}], "ans": "\\(u=x+y+2\\), \\(u'=1+u^2\\) → \\(\\int\\frac{du}{1+u^2}=\\int dx\\)."}, {"id": "q3", "qn": "확인 3 · 중첩 원리", "html": "\"두 해의 1차결합도 해\"가 성립하는 경우는?", "choices": [{"html": "제차 선형 ODE에서만", "ok": true}, {"html": "모든 선형 ODE(비제차 포함)", "ok": false}, {"html": "모든 ODE", "ok": false}, {"html": "비선형 ODE에서만", "ok": false}], "ans": "빨간 글씨. \\(y''+y=1\\)(비제차), \\(y''y-xy'=0\\)(비선형)이 반례."}, {"id": "q4", "qn": "확인 4 · 1차독립", "html": "두 해 \\(y_1,y_2\\)가 1차독립인지 판별하는 기준은?", "choices": [{"html": "\\(y_1/y_2\\)가 상수가 아니면(비례하지 않으면) 독립", "ok": true}, {"html": "\\(y_1/y_2\\)가 상수이면 독립", "ok": false}, {"html": "\\(y_1+y_2\\)가 해이면 독립", "ok": false}, {"html": "\\(y_1y_2=0\\)이면 독립", "ok": false}], "ans": "교수님이 정정한 지점: 비례 → 종속, 비례 아님 → 독립."}, {"id": "q5", "qn": "확인 5 · Ex.4", "html": "\\(y''+y=0\\), \\(y(0)=3.0\\), \\(y'(0)=-0.5\\)의 해는?", "choices": [{"html": "\\(y=3.0\\cos x-0.5\\sin x\\)", "ok": true}, {"html": "\\(y=3.0\\sin x-0.5\\cos x\\)", "ok": false}, {"html": "\\(y=3.0e^{x}-0.5e^{-x}\\)", "ok": false}, {"html": "\\(y=-0.5\\cos x+3.0\\sin x\\)", "ok": false}], "ans": "\\(y=c_1\\cos x+c_2\\sin x\\), \\(y(0)=c_1\\), \\(y'(0)=c_2\\)."}, {"id": "q6", "qn": "확인 6 · 차수축소", "html": "차수축소법 공식을 쓰고, \\((x^2-x)y''-xy'+y=0\\), \\(y_1=x\\)에서 \\(p(x)\\)와 \\(y_2\\)를 구하라.", "choices": null, "ans": "\\(y_2=y_1\\int\\frac1{y_1^2}e^{-\\int p\\,dx}dx\\). \\(p=-\\frac{x}{x^2-x}=-\\frac1{x-1}\\) → \\(e^{-\\int p}=e^{\\ln|x-1|}=x-1\\) → \\(U=\\frac{x-1}{x^2}=\\frac1x-\\frac1{x^2}\\) → \\(y_2=x(\\ln|x|+\\frac1x)=x\\ln|x|+1\\)."}]};

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
function pick(pool,seed,vars){ const arr=LINES[pool]||[]; if(!arr.length) return ""; const t=arr[hash(D.id+"|"+pool+"|"+seed)%arr.length]; return t.replace(/\{(\w+)\}/g,(m,k)=>(vars&&k in vars)?vars[k]:m); }
const warm=()=>T.aff>=60;
/* ---------- 타자 ---------- */
let typing=null, fullText="";
function say(text,face,name){
  const ch=$("#tutor .chibi"); if(ch) ch.setAttribute("data-face",face||"neutral");
  const nm=$("#dName"); nm.textContent=name||"김주영 스앵님"; nm.classList.toggle("prof",name==="교수님");
  const el=$("#dText"); if(typing){ clearInterval(typing); typing=null; }
  fullText=text; el.innerHTML=""; let i=0; const cur=document.createElement("i"); cur.className="cur";
  typing=setInterval(()=>{ i++; el.textContent=text.slice(0,i); if(i<text.length) el.appendChild(cur); else { clearInterval(typing); typing=null; } },22);
}
$("#dText").onclick=()=>{ if(typing){ clearInterval(typing); typing=null; $("#dText").textContent=fullText; } };
function choices(list){ const box=$("#dCh"); box.innerHTML=""; list.forEach(c=>{ if(c.tip){ const s=document.createElement("span"); s.className="tip"; s.textContent=c.tip; box.appendChild(s); return; }
  const b=document.createElement("button"); b.type="button"; b.className="cbt "+(c.cls||"g"); b.innerHTML=esc(c.t)+(c.key?'<kbd>'+c.key+'</kbd>':''); b.onclick=c.f; if(c.primary) b.dataset.primary="1"; box.appendChild(b); }); }
/* ---------- 칠판 ---------- */
function typeset(el){ try{ renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){} }
function board(html,tag){ $("#chk").innerHTML=tag||""; const bc=$("#bc"); bc.innerHTML=html; typeset(bc); $("#bwrap").scrollTop=0; }
const BOX={why:"왜 그런가",analogy:"비유",formula:"외울 것",pitfall:"함정",memo:"정리",say:"교수님 말"};
function stepHTML(st,rev){
  const sub=st.sub?'<div class="sub">'+esc(st.sub)+'</div>':'';
  switch(st.t){
    case "talk": return sub+'<div class="tk">'+st.html+'</div>';
    case "fig": return sub+'<figure class="paper">'+st.html+'</figure>';
    case "board": return sub+'<figure class="paper photo"><img src="'+esc(st.src)+'" alt="판서 사진" onerror="this.closest(\'figure\').style.display=\'none\'">'+(st.cap?'<div class="cap">'+st.cap+'</div>':'')+'</figure>';
    case "ex": return sub+'<div class="ex"><div class="exq"><i>예제</i>'+st.q+'</div>'+(rev?'<div class="exa"><i>풀이</i>'+st.a+'</div>':'<div class="exhide">풀이는 생각한 뒤에 엽니다.</div>')+'</div>';
    default: return sub+'<div class="bx '+esc(st.t)+'"><i>'+(BOX[st.t]||"")+'</i>'+st.html+'</div>';
  }
}
function tocHTML(){
  const dc=CH.filter(c=>L.ch[c.id]).length;
  let h='<ul class="toc">'+CH.map((c,i)=>{ const done=!!L.ch[c.id], cur=S.mode==="step"&&S.ci===i; return '<li class="'+(done?"done":"")+(cur?" cur":"")+'"><span class="st">'+(done?"✓":i+1)+'</span><span>'+esc(c.title)+'</span><small>'+c.steps.length+'단계</small></li>'; }).join("");
  if(QZ.length){ const qd=QZ.filter(q=>ST.done[q.id]).length, qo=QZ.filter(q=>ST.correct[q.id]===true).length; h+='<li class="'+(qd>=QZ.length?"done":"")+(S.mode==="quiz"?" cur":"")+'"><span class="st">'+(qd>=QZ.length?"✓":"?")+'</span><span>확인 문제</span><small>'+(qd?qo+"/"+qd+" 정답":QZ.length+"문제")+'</small></li>'; }
  return h+'</ul>';
}
/* ---------- 화면 ---------- */
function render(){
  hud(); L.pos=(S.mode==="step"||S.mode==="quiz")?{mode:S.mode,ci:S.ci,si:S.si,qi:S.qi}:L.pos; save();
  if(S.mode==="intro") return renderIntro();
  if(S.mode==="step") return renderStep();
  if(S.mode==="quiz") return renderQuiz();
  if(S.mode==="nohearts") return renderNoHearts();
  if(S.mode==="result") return renderResult();
}
function renderIntro(){
  const dc=CH.filter(c=>L.ch[c.id]).length, resume=L.pos&&!L.done&&(dc>0||QZ.some(q=>ST.done[q.id]));
  board('<div class="ttl">'+esc(D.title)+'</div>'+(D.lead?'<div class="lead">'+D.lead+'</div>':'')+'<div class="sub">오늘의 목차</div>'+tocHTML(),'<span>오늘 수업</span><small>'+esc(D.course)+'</small>');
  const line= L.done? pick("done_intro","i") : resume? pick("again_intro","i") : pick("intro","i",{n:CH.length,min:D.minutes||18});
  say(line, L.done?"proud":"neutral");
  const cs=[];
  if(resume) cs.push({t:"이어서 하기",cls:"p",primary:1,key:"Enter",f:()=>{ S=Object.assign(S,{mode:L.pos.mode||"step",ci:L.pos.ci||0,si:L.pos.si||0,qi:L.pos.qi||0,rev:false,again:0}); if(S.mode==="quiz"){ const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; } render(); }});
  cs.push({t:resume?"처음부터":"시작하기",cls:resume?"g":"p",primary:resume?0:1,key:resume?"":"Enter",f:()=>{ S=Object.assign(S,{mode:"step",ci:0,si:0,rev:false,again:0}); render(); }});
  cs.push({t:"교재 보기",cls:"g",f:()=>openBook((CH[0]||{}).id)});
  choices(cs);
}
function renderStep(){
  const ch=CH[S.ci]; if(!ch){ S.mode=QZ.length?"quiz":"result"; return render(); }
  /* 단계 번호가 범위를 벗어나면(재빌드로 단계 수가 줄었거나 저장값 손상) 마지막 단계로 보정 — 안 읽은 챕터를 완료로 치지 않는다 (오타 v54 A③) */
  if(S.si<0||S.si>=ch.steps.length) S.si=Math.max(0,ch.steps.length-1);
  const st=ch.steps[S.si]; if(!st){ S.mode="intro"; return render(); }
  board(stepHTML(st,S.rev),'<span>CH '+(S.ci+1)+' · '+esc(ch.title)+'</span><small>'+(S.si+1)+' / '+ch.steps.length+'</small>');
  const seed=S.ci+":"+S.si+":"+S.again;
  let line, face=LINES.chapter_face[st.t]||"neutral", name="스앵님";
  if(S.again>0){ line=pick("again",seed); face="sharp"; }
  else if(st.say){ line=st.say; }
  else if(S.si===0){ line=pick("chapter",seed,{c:S.ci+1,title:ch.title}); face="sharp"; }
  else if(st.t==="ex"&&S.rev){ line=pick("exopen",seed); }
  else line=pick(st.t in LINES?st.t:"talk",seed);
  say(line,face,name);
  const cs=[];
  if(st.t==="ex"&&!S.rev) cs.push({t:"풀이 보기",cls:"p",primary:1,key:"Enter",f:()=>{ S.rev=true; S.again=0; render(); }});
  else cs.push({t:"이해했어요",cls:"p",primary:1,key:"Enter",f:()=>next()});
  cs.push({t:"다시 설명",cls:"g",f:()=>{ S.again++; render(); }});
  cs.push({t:"질문할게요",cls:"",f:ask});
  cs.push({tip:"Enter = 다음 · 클릭하면 대사 건너뜀"});
  choices(cs);
}
function next(){ S.again=0; S.rev=false; const ch=CH[S.ci]; if(!ch||S.si+1>=ch.steps.length) return finishChapter(); S.si++; render(); }
function finishChapter(){
  const ch=CH[S.ci]; if(!ch){ S.mode="intro"; return render(); } const was=!!L.ch[ch.id]; dayReset();
  L.ch[ch.id]=true; ST.read[ch.id]=true; touchStreak();
  let extra="";
  if(!was){ gainXP(10); gainAff(2); } else if(T.hearts<3){ T.hearts++; extra=" "+pick("heartback",S.ci); pop("#hHearts","+1"); }
  save(); hud();
  S.si=0; S.ci++;
  if(S.ci>=CH.length){ if(QZ.length){ S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; } else S.mode="result"; }
  const line=(warm()?pick("chdone_warm",S.ci):pick("chdone",S.ci,{c:S.ci}))+extra;
  if(S.mode==="quiz"&&S.ci===CH.length){ render(); say(pick("quiz","q",{n:QZ.length,h:T.hearts}),"sharp"); return; }
  render(); say(line,"proud");
}
function renderQuiz(){
  const q=QZ[S.qi]; if(!q){ S.mode="result"; return render(); }
  dayReset(); if(T.hearts<=0&&!ST.done[q.id]){ S.mode="nohearts"; return render(); }   /* 하트 0: 입력형도 답 보기 전에 막는다 */
  const mc=Array.isArray(q.choices)&&q.choices.length, rev=!!ST.done[q.id], my=ST.answer[q.id], c=ST.correct[q.id];
  let h='<div class="qz"><div class="qn">'+esc(q.qn||("문제 "+(S.qi+1)))+'</div><div class="qb">'+q.html+'</div>';
  if(mc) h+='<ol class="ch">'+q.choices.map((x,i)=>'<li><button type="button" class="cb'+(rev?(x.ok?" ok":(String(my)===String(i)?" bad":"")):"")+'" data-i="'+i+'"'+(rev?" disabled":"")+'><span class="n">'+(i+1)+'</span><span>'+x.html+'</span></button></li>').join("")+'</ol>';
  else h+= rev? '<div class="my"><b>내 답</b> '+esc(my||"(빈칸)")+'</div>' : '<textarea id="myans" placeholder="답만 간단히">'+esc(my||"")+'</textarea><div class="row"><button type="button" class="cbt p" id="reveal">답 보기</button></div>';
  if(rev){ h+='<span class="vd '+(c===true?"ok":c===false?"bad":"wait")+'">'+(c===true?"정답":c===false?"오답":"채점 전")+'</span>';
    if(!mc&&c==null) h+='<div class="row"><button type="button" class="cbt p" data-g="1">맞았어요</button><button type="button" class="cbt r" data-g="0">틀렸어요</button></div>';
    h+='<div class="ans"><i>해설</i>'+(q.ans||"")+'</div>'; }
  h+='</div>';
  board(h,'<span>확인 문제</span><small>'+(S.qi+1)+' / '+QZ.length+'</small>');
  $$("#bc .cb").forEach(b=>{ b.onclick=()=>answer(q,+b.dataset.i); });
  const rv=$("#reveal"); if(rv) rv.onclick=()=>{ dayReset(); if(T.hearts<=0){ S.mode="nohearts"; return render(); } const ta=$("#myans"); ST.answer[q.id]=(ta&&ta.value.trim())||""; ST.done[q.id]=true; delete ST.correct[q.id]; save(); render(); say("해설과 비교하세요. 스스로 채점합니다. 봐주지 마세요.","sharp"); };
  $$("#bc [data-g]").forEach(b=>{ b.onclick=()=>grade(q,b.dataset.g==="1"); });
  if(!rev){ say(mc?pick("q",S.qi,{k:S.qi+1}):pick("qin",S.qi),"neutral"); choices([{t:"질문할게요",cls:"",f:ask},{tip:mc?"숫자 키 1~"+q.choices.length+" 로 고를 수 있습니다":""}]); }
  else { const last=S.qi>=QZ.length-1;
    choices([{t:last?"결과 보기":"다음 문제",cls:"p",primary:1,key:"Enter",f:()=>{ if(last){ S.mode="result"; } else S.qi++; render(); }},{t:"다시 풀기",cls:"g",f:()=>{ delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; save(); render(); }},{t:"질문할게요",cls:"",f:ask}]); }
}
/* 채점 뒤 공통: 첫 정답에만 XP·호감도(다시 풀어도 한 번), 오답은 하트 −1 (객관식·자기 채점 같은 규칙) */
function settle(q,ok){
  ST.correct[q.id]=ok; touchStreak();
  if(ok){ if(!L.rew[q.id]){ L.rew[q.id]=true; gainXP(15); gainAff(3); } }
  else { T.hearts=Math.max(0,T.hearts-1); gainAff(-1); pop("#hHearts","-1",true); }
  save(); render(); say(ok?(warm()?pick("ok_warm",S.qi):pick("ok",S.qi)):pick("bad",S.qi), ok?(warm()?"proud":"smile"):"angry");
}
function answer(q,i){
  if(ST.done[q.id]) return; dayReset();
  if(T.hearts<=0){ S.mode="nohearts"; return render(); }
  ST.answer[q.id]=i; ST.done[q.id]=true; settle(q,!!(q.choices[i]&&q.choices[i].ok));
}
function grade(q,ok){
  if(typeof ST.correct[q.id]==="boolean") return; dayReset();
  if(T.hearts<=0){ S.mode="nohearts"; return render(); }   /* 하트 0이면 자기 채점도 막는다 — 객관식과 같은 규칙 (오타 v54 A④) */
  settle(q,ok);
}
function renderNoHearts(){
  board('<div class="ttl">하트 0</div><div class="lead">챕터 하나를 다시 읽고 끝까지 가면 하트 하나가 돌아옵니다. 하트는 매일 3개로 채워집니다.</div><div class="sub">목차</div>'+tocHTML(),'<span>잠깐</span>');
  say(pick("nohearts","nh"),"angry");
  choices([{t:"목차에서 챕터 고르기",cls:"p",primary:1,key:"Enter",f:openToc},{t:"교재 보기",cls:"g",f:()=>openBook((CH[0]||{}).id)}]);
}
function renderResult(){
  const n=QZ.length, ok=QZ.filter(q=>ST.correct[q.id]===true).length, wrong=QZ.filter(q=>ST.correct[q.id]===false), dn=QZ.filter(q=>ST.done[q.id]).length;
  const first=!L.done&&dn>=n; if(first){ L.done=true; gainXP(20); touchStreak(); save(); }
  const ratio=n?ok/n:1, good=ratio>=.8, mid=ratio>=.5;
  const badge='<svg class="badge" viewBox="0 0 120 120" fill="none" stroke="#FFE27A" stroke-width="2.5" stroke-linejoin="round"><circle cx="60" cy="60" r="50" stroke-dasharray="4 3"/><circle cx="60" cy="60" r="40"/><path d="M60 30l8.8 18 19.8 2.9-14.3 13.9 3.4 19.7L60 75.2l-17.7 9.3 3.4-19.7L31.4 50.9l19.8-2.9z" fill="rgba(255,226,122,.18)"/></svg><div class="bl">'+esc(D.course)+' · '+esc(D.sess)+' · 챕터 '+CH.length+'</div>';
  board('<div class="res"><div class="big">'+(good?"수고했습니다":mid?"절반은 넘겼습니다":"다시 합니다")+'</div><div class="stats"><div><b>'+ok+'/'+n+'</b><span>정답</span></div><div><b>+'+(L.xp||0)+'</b><span>이 회차 XP</span></div><div><b>'+T.streak+'</b><span>연속일</span></div><div><b>'+T.aff+'</b><span>호감도 · '+affName()+'</span></div></div>'+badge+(wrong.length?'<div class="wrong">틀린 문제 '+wrong.length+'개 — 해설을 읽고 다시 푸세요.</div>':'')+'</div>','<span>오늘의 결과</span>');
  say(pick(good?"res_good":mid?"res_mid":"res_bad","r",{ok:ok,n:n}), good?"proud":mid?"sharp":"angry");
  const cs=[];
  if(wrong.length) cs.push({t:"틀린 문제 다시 ("+wrong.length+")",cls:"p",primary:1,key:"Enter",f:()=>{ wrong.forEach(q=>{ delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; }); save(); S.mode="quiz"; S.qi=QZ.findIndex(q=>!ST.done[q.id]); render(); }});
  cs.push({t:"교재 보기",cls:"g",f:()=>openBook(null)});
  cs.push({t:"목차",cls:"g",f:openToc});
  if(EMB) cs.push({t:"앱으로",cls:wrong.length?"g":"p",primary:wrong.length?0:1,f:()=>post({type:"mc-close",v:1})});
  choices(cs);
}
/* ---------- 목차 · 교재 · 질문 ---------- */
function openToc(){ const ov=$("#ov"); $("#ovMeta").textContent=D.course+" · "+D.sess+" · XP "+(L.xp||0);
  $("#ovList").innerHTML=CH.map((c,i)=>'<li class="'+(L.ch[c.id]?"done":"")+(S.mode==="step"&&S.ci===i?" cur":"")+'"><button type="button" data-ci="'+i+'"><span class="st">'+(L.ch[c.id]?"✓":i+1)+'</span><span>'+esc(c.title)+'</span><small>'+c.steps.length+'단계</small></button></li>').join("")
    +(QZ.length?'<li class="'+(QZ.every(q=>ST.done[q.id])?"done":"")+(S.mode==="quiz"?" cur":"")+'"><button type="button" data-q="1"><span class="st">?</span><span>확인 문제</span><small>'+QZ.filter(q=>ST.done[q.id]).length+'/'+QZ.length+'</small></button></li>':"");
  $$("#ovList [data-ci]").forEach(b=>{ b.onclick=()=>{ ov.classList.remove("on"); S=Object.assign(S,{mode:"step",ci:+b.dataset.ci,si:0,rev:false,again:0}); render(); }; });
  const qb=$("#ovList [data-q]"); if(qb) qb.onclick=()=>{ ov.classList.remove("on"); if(T.hearts<=0&&QZ.some(q=>!ST.done[q.id])){ S.mode="nohearts"; return render(); } S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; render(); };
  ov.classList.add("on"); }
$("#hToc").onclick=openToc; $("#ovClose").onclick=()=>$("#ov").classList.remove("on"); $("#ov").onclick=e=>{ if(e.target.id==="ov") $("#ov").classList.remove("on"); };
$("#ovBook").onclick=()=>openBook(S.mode==="step"?(CH[S.ci]||{}).id:null);
$("#ovReset").onclick=()=>{ if(!confirm("이 회차의 챕터·문제 기록을 지울까요? (XP·스트릭은 남습니다)")) return; L={pos:null,ch:{},done:false,xp:0,rew:{}}; ST={read:{},done:{},correct:{},answer:{},ts:0}; S=Object.assign(S,{mode:"intro",ci:0,si:0,qi:0,rev:false,again:0}); $("#ov").classList.remove("on"); render(); };
function post(m){ try{ window.parent.postMessage(m,location.origin); }catch(e){} }
function openBook(sid){ const hash=sid?"#s="+sid:""; if(EMB){ post({type:"mc-open",v:1,file:LESSON_APP+hash,title:document.title}); } else location.href=LESSON_REL+hash; }
function ask(){ if(EMB){ post({type:"mc-ask",v:1}); say(pick("ask",S.ci+":"+S.si),"wide"); gainAff(1); save(); hud(); } else say(pick("askoff",S.ci),"sharp"); }
/* ---------- 앱 질문 패널 문맥 (V45 규약) ---------- */
let CTX_GEN=null;
function ctx(){ if(!CTX_GEN||!EMB) return; let label="", q=null, sid="";
  if(S.mode==="step"){ const ch=CH[S.ci]||{}, st=(ch.steps||[])[S.si]||{}; sid=ch.id||""; label="CH "+(S.ci+1)+" · "+(ch.title||""); const tmp=document.createElement("div"); tmp.innerHTML=st.t==="ex"?(st.q+" "+(S.rev?st.a:"")):(st.html||""); q={qn:(ch.title||"").slice(0,80),kind:"개념",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }
  else if(S.mode==="quiz"){ const qq=QZ[S.qi]; if(qq){ const tmp=document.createElement("div"); tmp.innerHTML=qq.html; label="확인 문제 "+(S.qi+1); const tc=x=>{ const d=document.createElement("div"); d.innerHTML=x; return (d.textContent||"").trim(); };
    q={qn:qq.qn,kind:"문제",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:(qq.choices||[]).map(c=>tc(c.html)),my:(ST.answer[qq.id]==null?null:String(ST.answer[qq.id])),revealed:!!ST.done[qq.id],correct:(typeof ST.correct[qq.id]==="boolean"?ST.correct[qq.id]:null),answer:null}; } }
  else label=S.mode;
  post({type:"mc-slide",v:1,gen:CTX_GEN,deck:D.id,title:document.title.slice(0,80),sid:sid,stype:S.mode==="quiz"?"quiz":"concept",part:null,partTitle:document.title.slice(0,60),label:("교실 · "+label).slice(0,80),q:q}); }
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; ctx(); } });
const _render=render; render=function(){ _render(); ctx(); };
/* ---------- 키보드 ---------- */
document.addEventListener("keydown",e=>{ if(e.target&&/TEXTAREA|INPUT/.test(e.target.tagName)) return; if($("#ov").classList.contains("on")){ if(e.key==="Escape") $("#ov").classList.remove("on"); return; }
  if(e.key==="Enter"||e.key===" "){ if(typing){ clearInterval(typing); typing=null; $("#dText").textContent=fullText; return; } const b=$("#dCh [data-primary]"); if(b){ e.preventDefault(); b.click(); } }
  else if(/^[1-6]$/.test(e.key)&&S.mode==="quiz"){ const b=$$("#bc .cb")[+e.key-1]; if(b&&!b.disabled) b.click(); } });
/* ---------- 시작 ---------- */
/* 해시: #resume(저장 위치) · #ch=2(챕터 2) · #ch=2.5(챕터 2의 5단계) · #quiz · #result */
function boot(){ const m=/^#(resume|ch=(\d+)(?:\.(\d+))?|quiz|result)$/.exec(location.hash||"");
  if(m&&m[1]==="resume"&&L.pos&&!L.done){ S=Object.assign(S,{mode:L.pos.mode||"step",ci:+L.pos.ci||0,si:+L.pos.si||0,qi:+L.pos.qi||0}); if(S.mode==="quiz"){ const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; if(k<0&&QZ.every(q=>ST.done[q.id])) S.mode="result"; }
    if(S.mode==="step"){ if(!CH[S.ci]) S.mode="intro"; else if(S.si<0||S.si>=CH[S.ci].steps.length) S.si=Math.max(0,CH[S.ci].steps.length-1); }   /* 재빌드로 단계 수가 바뀐 저장값 보정 (오타 v54 A③) */
    if(S.mode!=="step"&&S.mode!=="quiz"&&S.mode!=="result") S.mode="intro"; }
  else if(m&&m[2]){ const ci=Math.max(0,Math.min(CH.length-1,+m[2]-1)); const si=m[3]?Math.max(0,Math.min(CH[ci].steps.length-1,+m[3]-1)):0; S=Object.assign(S,{mode:"step",ci:ci,si:si,rev:(CH[ci].steps[si]||{}).t==="ex"&&/\.\d+r$/.test(location.hash)}); }
  else if(m&&m[1]==="quiz"&&QZ.length){ S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; }
  else if(m&&m[1]==="result"){ S.mode="result"; }
  render(); }
window.__cr={get D(){return D;},get S(){return S;},set S(v){S=v;},get T(){return T;},get L(){return L;},set L(v){L=v;T.lessons[D.id]=L;},get ST(){return ST;},set ST(v){ST=v;},get fullText(){return fullText;},render:function(){ return render(); },next:function(){ return next(); },boot:function(){ return boot(); }};  /* 검사기(classroom_check.cjs)용 창구 */
(function wait(){ if(window.renderMathInElement) boot(); else setTimeout(wait,40); })();
