<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1장을 닫고 2장을 열다 — 베르누이 연습, 해법 총정리, 중첩 원리와 기저</title>
<!-- 교실 모드 템플릿 v3 (대표님 2026-09-28: 메가스터디처럼 세련·깔끔 — 흰 강의 슬라이드 + 네이비 머리띠, 판서 = 단계별 핵심 카드(형광펜·식 카드·함정 카드), 그림 = 단계 애니메이션(선 그리기·페이드·맥동) + 다시 보기, 글꼴 = 제목 Gothic A1 · 본문 Pretendard · 말풍선 Gowun Dodum · 숫자 Inter · 말투 = 일타강사 구어체 존댓말)
     v2 회차(D.v===2)는 판서 파일(BOARD)로 만든 단계(판서 줄 누적 + 그림 단계 + 대사), v1 회차는 원문 문단 그대로(「구버전 판서」 표시).
     저장: mc-tutor(전역 XP·연속일·하트·호감도 + 회차 위치 {mode,cid,sid,qi,ver}) + mc-lesson-<id>(챕터 읽음·문제, 수업 노트·앱 V52 와 공유). 오타 설계 회의 1·2차 + 구현 검수 1~6차 조건 반영. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gothic+A1:wght@700;800&family=Inter:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--bg:#F3F4F7;--card:#fff;--line:#E6E8EE;--ink:#151A24;--ink-2:#5B6373;--ink-3:#8A92A3;--navy:#0F1B33;--navy2:#1D2C4D;--green:#1B7A2E;--green-soft:#E8F7EA;--blue:#1F5FBF;--blue-soft:#EEF3FC;--amber:#C2780A;--amber-soft:#FFF6E5;--red:#D9342B;--red-soft:#FFF3F2;--mark:#FFF3A3;
  --fh:"Gothic A1","Gowun Dodum",Pretendard,sans-serif;--fb:"Gowun Dodum","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--ft:"Gowun Dodum","Pretendard Variable",Pretendard,sans-serif;--fn:Inter,"Pretendard Variable",Pretendard,sans-serif;--hud:56px}   /* 본문 = 앱과 같은 Gowun Dodum (대표님 2026-09-28 「앱과 같은 걸로」) */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:var(--fb);font-size:16px;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(15,27,51,.05)}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
#hud .in{max-width:1040px;margin:0 auto;height:100%;padding:0 20px;display:flex;align-items:center;gap:16px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-family:var(--fh);font-weight:800;font-size:15px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hud .chp{font-family:var(--fn);font-weight:600;font-size:12px;color:var(--ink-2);white-space:nowrap;letter-spacing:.04em}
#hud .seg{display:flex;gap:4px;flex:1;max-width:300px}#hud .seg i{display:block;flex:1;height:6px;border-radius:3px;background:#E3E6ED}#hud .seg i.on{background:var(--green)}#hud .seg i.cur{background:var(--navy)}
#hud .hr{display:flex;align-items:center;gap:8px}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--fn);font-weight:600;font-size:12.5px;padding:4px 10px;border-radius:999px;position:relative;white-space:nowrap;background:#F3F4F7;color:var(--ink)}
.stat svg{width:15px;height:15px;display:block}
.stat.xp{background:#FFF8DC;color:#8A5A00}.stat.sk{background:#FFF0E6;color:#C2410C}.stat.hp{background:#FFECEC;color:#C92A2A;gap:3px}.stat.af{background:#F7E4EE;color:#B8286A}
.stat .gauge{display:inline-block;width:52px;height:8px;border-radius:99px;background:#F0D0DF;overflow:hidden}.stat .gauge b{display:block;height:100%;width:0;background:#B8286A;transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#1F7A32;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#C92A2A}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer}
/* ---------- 강의 슬라이드(교실 v3: 흰 슬라이드 + 네이비 머리띠, 대표님 2026-09-28 「메가스터디처럼 세련·깔끔」) ---------- */
main{max-width:1040px;margin:0 auto;padding:16px 20px 24px}
#room{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
#board{position:relative}
.slide{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(15,27,51,.06);display:flex;flex-direction:column;min-height:560px;max-height:max(560px,76vh)}
.chk{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:13px 22px;background:var(--navy);color:#fff;white-space:nowrap;overflow:hidden}
.chk>span:first-child{font-family:var(--fh);font-weight:800;font-size:18px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.chk small{font-family:var(--fn);font-size:12px;font-weight:600;color:#C9D3EA;letter-spacing:.06em;margin-left:auto;flex:0 0 auto}
.chk .old{font-family:var(--fb);font-size:11px;color:#FFD5D0;border:1px dashed rgba(255,213,208,.6);border-radius:6px;padding:1px 6px;flex:0 0 auto}
#bwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 22px 22px;scrollbar-width:thin;scrollbar-color:#C9CED8 transparent;display:flex;flex-direction:column}
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:#D5D9E2;border-radius:99px}
#bc{font-family:var(--fb);font-weight:500;font-size:17px;line-height:1.6;width:100%;margin:0}
#bc.v1{font-weight:400;font-size:16.5px;line-height:1.75}
#bc .katex-display{margin:8px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* 판서 = 단계별 핵심 카드 */
.bd-title{font-family:var(--fh);font-weight:800;font-size:15px;color:var(--ink-3);margin:0 0 10px;letter-spacing:.02em}
.bl{position:relative;display:flex;gap:12px;align-items:flex-start;padding:10px 12px;margin:0 0 8px;border-radius:12px;border:1px solid transparent;opacity:0;transform:translateY(8px);transition:opacity .4s ease-out,transform .4s ease-out}
.bl.on,.bl.now{opacity:1;transform:none}.bl.now{transition:none}
.bl::before{content:attr(data-n);flex:0 0 26px;height:26px;border-radius:8px;background:#F3F4F7;color:var(--ink-2);display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:12.5px;line-height:1}
.bl>.bt{flex:1;min-width:0}
.bl.k-li.cur{background:#F7FBF8;border-color:#CDE9D3}.bl.k-li.cur::before{background:var(--green);color:#fff}
.bl.k-h{padding:8px 4px 2px;margin-top:6px}.bl.k-h::before{content:"";display:none}.bl.k-h>.bt{font-family:var(--fh);font-weight:800;font-size:18px;color:var(--navy)}
.bl.k-f{padding:12px 16px;background:#F5F7FB;border-color:#E1E6F0;display:block}.bl.k-f::before{display:none}.bl.k-f .katex-display{margin:2px 0}.bl.k-f .katex{font-size:1.25em}
.bl.k-pit{background:var(--red-soft);border-color:#F3C9C5}.bl.k-pit::before{content:"!";background:var(--red);color:#fff;font-size:15px}
.bl.k-star{background:var(--amber-soft);border-color:#F1DDB4}.bl.k-star::before{content:"★";background:var(--amber);color:#fff;font-size:13px}
.bl.k-res{background:var(--blue-soft);border-color:#CFDCF5}.bl.k-res::before{content:"→";background:var(--blue);color:#fff;font-size:15px}
.bl.k-memo{background:var(--green-soft);border-color:#CDE9D3}.bl.k-memo::before{content:"✓";background:var(--green);color:#fff;font-size:14px}
.bl b,.bl strong{font-weight:800}
.bl .ul{background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px;font-weight:800;text-decoration:none}
.bl.dim{opacity:.62}.bl.dim.on,.bl.dim.now{opacity:.62}
/* 그림 카드 + 단계 애니메이션 */
.bd-fig{margin:12px 0 4px;border:1px solid var(--line);border-radius:14px;padding:10px 14px 8px;background:#fff}
.bd-fig .fh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.bd-fig .fh .pl{margin-left:auto;display:flex;gap:6px}.bd-fig .fh button{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;cursor:pointer;color:var(--ink)}.bd-fig .fh button.a{background:var(--navy);color:#fff;border-color:var(--navy)}
.bd-fig figure{margin:0}.bd-fig svg{width:100%;height:auto;display:block;overflow:visible;max-width:640px;margin:0 auto}.bd-fig figcaption{font-size:13px;color:var(--ink-2);margin-top:6px;text-align:center}
.bd-fig [data-step][hidden]{display:none}
.bd-fig .pre{opacity:0}
.bd-fig .draw{transition:stroke-dashoffset var(--dur,1s) ease-out}
.bd-fig .fade{opacity:0;transition:opacity .35s ease-out}.bd-fig .fade.on{opacity:1}
.bd-fig .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@media (prefers-reduced-motion: reduce){.bl{transition:none}.bd-fig .draw,.bd-fig .fade{transition:none}.bd-fig .pulse{animation:none}}
/* v1(구버전) 판서 상자 */
#bc .tk{font-size:17px}#bc p{margin:0 0 10px}#bc b,#bc strong{font-weight:800}
#bc .sub{font-family:var(--fh);font-weight:800;font-size:18px;color:var(--navy);margin:0 0 8px;line-height:1.3}
#bc .bx{margin:6px 0 14px;padding:12px 16px 10px;border:1px solid var(--line);border-radius:12px;position:relative;background:#FAFBFC}
#bc .bx>i{display:block;font-style:normal;font-family:var(--fh);font-weight:800;font-size:12.5px;line-height:1;margin-bottom:6px;color:var(--ink-2);letter-spacing:.02em}
#bc .bx.why{background:var(--blue-soft);border-color:#CFDCF5}#bc .bx.why>i{color:var(--blue)}#bc .bx.analogy{background:var(--amber-soft);border-color:#F1DDB4}#bc .bx.analogy>i{color:var(--amber)}
#bc .bx.formula{background:#F5F7FB;border-color:#E1E6F0}#bc .bx.formula>i{color:var(--navy)}#bc .bx.pitfall{background:var(--red-soft);border-color:#F3C9C5}#bc .bx.pitfall>i{color:var(--red)}
#bc .bx.memo{background:var(--green-soft);border-color:#CDE9D3}#bc .bx.memo>i{color:var(--green)}#bc .bx.say{border:0;border-left:4px solid var(--amber);border-radius:0;padding:4px 16px;font-style:italic;background:transparent}#bc .bx.say>i{color:var(--amber);font-style:normal}
#bc .paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px 8px;margin:8px auto 14px;max-width:640px;text-align:center}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}#bc .paper figcaption,#bc .paper .cap{font-size:13px;color:var(--ink-2);margin-top:6px}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:8px;background:#111}
#bc .ex .exq{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px;background:#FAFBFC}#bc .ex .exq>i,#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--fh);font-weight:800;font-size:12.5px;line-height:1;margin-bottom:6px;color:var(--navy)}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--green)}#bc .ex .exa>i{color:var(--green)}#bc .ex .exhide{color:var(--ink-3);font-style:italic;font-size:14px}
/* 문제 */
#bc .qz{font-size:17px}
#bc .qz .qn{font-family:var(--fh);font-weight:800;font-size:18px;color:var(--navy);line-height:1.3;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:17.5px}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 30px;height:30px;border-radius:9px;background:#F3F4F7;color:var(--ink-2);display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:14px}
#bc .qz .cb:hover:not([disabled]){background:#F7F8FA}#bc .qz .cb[disabled]{cursor:default;opacity:.8}
#bc .qz .cb.ok{border-color:#9AD9A8;background:var(--green-soft);opacity:1}#bc .qz .cb.ok .n{background:var(--green);color:#fff}
#bc .qz .cb.bad{border-color:#F0B3AE;background:var(--red-soft);opacity:1}#bc .qz .cb.bad .n{background:var(--red);color:#fff}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:var(--ink-3)}#bc .qz .my{margin:8px 0;color:var(--ink-2)}#bc .qz .my b{color:var(--ink)}
#bc .qz .vd{display:inline-block;font-weight:800;font-size:13.5px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:var(--green);color:#fff}#bc .qz .vd.bad{background:var(--red);color:#fff}#bc .qz .vd.wait{background:#F3F4F7;color:var(--ink-2)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--green);background:var(--green-soft);border-radius:0 12px 12px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--fh);font-weight:800;font-size:12.5px;color:var(--green);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--fh);font-weight:800;font-size:26px;line-height:1.25;color:var(--navy);margin:0 0 6px}
#bc .lead{color:var(--ink-2);font-size:16px;margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-size:16px}
#bc .toc li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#FAFBFC}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:9px;background:#F3F4F7;color:var(--ink-2);display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700}
#bc .toc li.done .st{background:var(--green);color:#fff}#bc .toc li.cur{border-color:#B9C6E4;background:var(--blue-soft)}#bc .toc li.cur .st{background:var(--navy);color:#fff}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-family:var(--fn);font-weight:600}
#bc .res{text-align:center}#bc .res .big{font-family:var(--fh);font-weight:800;font-size:34px;line-height:1.15;color:var(--navy);margin:10px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:15px;margin:6px 0 12px}#bc .res .stats b{display:block;font-family:var(--fn);font-size:28px;line-height:1.1}#bc .res .stats span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600}
#bc .res .badge{margin:4px auto 0;width:130px;height:130px;display:block}#bc .res .bl2{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-top:4px}#bc .res .wrong{margin-top:8px;color:var(--red);font-size:14.5px}
#bc .res .stk{display:block;width:150px;height:150px;margin:2px auto 0;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(15,27,51,.18))}
#chpills{margin-top:12px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#chpills .lb{font-size:12px;color:var(--ink-2);font-weight:700;margin-right:4px}
.pill{border:1px solid var(--line);background:#F3F4F7;color:var(--ink-3);font-family:var(--fn);font-weight:600;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.pill.done{background:var(--green-soft);color:var(--green);border-color:transparent}.pill.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
/* ---------- 오른쪽: 스앵님 · 말풍선 · 선택지 ---------- */
#side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--hud) + 16px)}
#tutorCard{padding:12px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
#tutorCard .nm{align-self:flex-start;display:flex;align-items:center;gap:8px;width:100%}
#tutorCard .nm b{font-family:var(--fh);font-weight:800;font-size:13px}#tutorCard .nm span{font-size:11px;color:var(--ink-3);margin-left:auto}
#tutor{width:150px;height:176px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.14));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
#tutorImg{display:none;width:100%;height:100%;object-fit:contain;object-position:center bottom;-webkit-user-select:none;user-select:none}
#tutor.raster #tutorImg{display:block}#tutor.raster svg{display:none}
#tutor.raster.pose{width:170px;height:330px;animation:none}
.box{padding:14px 16px 12px;position:relative;min-height:120px}
.box::before{content:"";position:absolute;left:50%;top:-9px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.name{font-family:var(--fh);font-weight:800;font-size:12px;color:var(--green);margin-bottom:4px}.name.prof{color:var(--amber)}
.text{font-family:var(--ft);font-size:15.5px;line-height:1.65;min-height:48px;cursor:pointer}
.text .cur{display:inline-block;width:.5em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.tip{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.cbt{font:inherit;font-weight:800;font-size:15px;padding:13px 16px;border-radius:12px;cursor:pointer;color:var(--ink);background:#fff;border:1px solid var(--line);transition:transform .08s,filter .15s;width:100%;text-align:center;min-height:46px}
.cbt:hover{filter:brightness(.97)}.cbt:active{transform:translateY(1px)}
.cbt.p{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 6px 16px rgba(15,27,51,.22)}
.cbt.t{background:var(--green-soft);color:var(--green);border-color:transparent}
.cbt.r{background:var(--red);color:#fff;border-color:var(--red)}
.cbt.g{background:#F3F4F7;color:var(--ink-2);border-color:transparent}
.cbt kbd{font-family:var(--fn);font-size:10.5px;opacity:.55;margin-left:6px}
#prog{padding:12px 14px}#prog .k{font-size:12px;color:var(--ink-2);font-weight:700}#prog .v{font-family:var(--fh);font-weight:800;font-size:16px;margin:2px 0 6px}#prog .bar{height:6px;border-radius:3px;background:#E3E6ED;overflow:hidden}#prog .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}#prog .h{font-size:11.5px;color:var(--ink-3);margin-top:6px}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(15,27,51,.55);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-family:var(--fh);font-weight:800;font-size:20px}#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--blue)}#ov li .st{flex:0 0 30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700;color:var(--ink-3)}
#ov li.done .st{background:var(--green);border-color:var(--green);color:#fff}#ov li.cur button{border-color:var(--navy);background:var(--blue-soft)}#ov li small{margin-left:auto;color:var(--ink-3);font-weight:600;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}#ov .row .cbt{width:auto}
/* ---------- 아이패드 세로(768~900) ---------- */
@media(max-width:900px) and (min-width:761px){
  #room{grid-template-columns:minmax(0,1fr) 240px;gap:12px}#tutor{width:120px;height:140px}#tutor.raster.pose{width:130px;height:250px}
  #bc{font-size:16px}.bl.k-h>.bt{font-size:17px}.chk>span:first-child{font-size:16px}#bwrap{padding:14px 16px 18px}
  .cbt{font-size:14px;padding:11px 12px}.text{font-size:14.5px}
}
/* ---------- 폰 ---------- */
@media(max-width:760px){
  :root{--hud:50px}
  #hud .in{gap:6px;padding:0 8px}#hud .hl{display:none}#hud .hc{flex:1 1 auto;min-width:70px;gap:6px}#hud .chp{font-size:11px}#hud .hr{gap:4px;flex:0 0 auto}.stat{padding:3px 6px;font-size:11.5px;gap:3px}.stat svg{width:13px;height:13px}.stat .gauge{width:30px;height:7px}#hToc{padding:5px 8px;font-size:12px}
  main{padding:10px 8px 12px}#room{grid-template-columns:minmax(0,1fr);gap:10px}#board,#side{min-width:0}
  .slide{min-height:340px;max-height:max(340px,60vh);border-radius:14px}.chk{padding:10px 14px;gap:8px}.chk>span:first-child{font-size:15px}#bwrap{padding:12px 12px 16px}
  #bc{font-size:15.5px}.bl{padding:8px 10px;gap:10px}.bl.k-h>.bt{font-size:16px}#bc .ttl{font-size:22px}#bc .res .big{font-size:26px}
  #bc .paper{overflow-x:auto}#bc .paper svg{min-width:460px}.bd-fig{overflow-x:auto}.bd-fig svg{min-width:420px}
  #side{position:static;flex-direction:column}#tutorCard{flex-direction:row;align-items:flex-end;gap:10px;padding:8px 10px}#tutorCard .nm{width:auto;flex-direction:column;align-items:flex-start;gap:0}#tutor{width:84px;height:98px}#tutor.raster.pose{width:96px;height:180px}
  .box::before{display:none}.text{font-size:15px}.cbt{font-size:14px;min-height:42px}.tip{display:none}#prog{display:none}#chpills{display:none}
}

<script>
const D={"id": "em1-2026-09-16", "slug": "em1", "course": "공업수학1", "date": "2026-09-16", "sess": "9/16(수) · 3주차", "title": "1장을 닫고 2장을 열다 — 베르누이 연습, 해법 총정리, 중첩 원리와 기저", "lead": "앞 20분은 지난 시간 예고한 <b>베르누이·치환 연습 3제<\/b>, 그다음 \"1장이 다 끝났다\"며 <b>해법 여섯 가지<\/b>를 한 표로 정리했다. 후반은 <b>2.1 2계 선형 ODE<\/b>: 표준형, 제차만 성립하는 <b>중첩 원리<\/b>, 초기값 문제(조건 2개), <b>1차독립·기저<\/b>(교수님이 정정한 판별), 그리고 <b>차수축소법<\/b> 공식까지. 진도가 빠른 이유도 말했다 — 중간까지 실질 7주.", "minutes": 22, "chapters": [{"id": "s1", "title": "베르누이 복습 + 연습 1 (전형)", "steps": [{"t": "talk", "html": "<p>복습: 표준형 \\(y'+p(x)y=r(x)\\) → \\(h=\\int p\\,dx\\), \\(y=e^{-h}[\\int e^hr\\,dx+c]\\). 베르누이 \\(y'+p(x)y=g(x)y^a\\)는 \\(a=0,1\\)이면 선형, 아니면 <b>\\(u=y^{1-a}\\)<\/b> 치환으로 선형이 된다.<\/p>", "sub": null}, {"t": "say", "html": "\"꼭 \\(y^{1-a}\\)로 치환해야 되느냐, 꼭 그렇지는 않아요. <b>형태를 따라서 여러분들이 취사선택<\/b>을 해야 돼요.\""}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 160\" width=\"560\" height=\"160\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"30\" width=\"150\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"89.0\" y=\"56.0\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">xy′ + y = 1/y²<\/text><text x=\"89.0\" y=\"72.0\" font-size=\"8.7\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">÷x → y′ + (1/x)y = (1/x)y⁻²<\/text><line x1=\"166\" y1=\"58\" x2=\"200\" y2=\"58\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><text x=\"183\" y=\"46\" font-size=\"11.5\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a = −2<\/text><rect x=\"204\" y=\"30\" width=\"120\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"264.0\" y=\"56.0\" font-size=\"15\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = y³<\/text><text x=\"264.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u′ = 3y²y′<\/text><line x1=\"326\" y1=\"58\" x2=\"360\" y2=\"58\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"364\" y=\"30\" width=\"186\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"457.0\" y=\"56.0\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u′ + (3/x)u = 3/x<\/text><text x=\"457.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">「착한」 선형 — 또는 변수분리<\/text><line x1=\"457\" y1=\"88\" x2=\"457\" y2=\"108\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"330\" y=\"110\" width=\"220\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"440.0\" y=\"135.0\" font-size=\"11.7\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = 1 + c/x³  →  y³ = 1 + c/x³<\/text><text x=\"165\" y=\"134\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">두 길: 변수분리 du/(u−1) = −3dx/x · 선형 공식 h = 3 ln x<\/text><\/svg><figcaption>연습 1 — 전형적인 베르누이. 마지막에 u 를 y 로 되돌린다.<\/figcaption>"}, {"t": "ex", "q": "연습 1 \\(xy'+y=1/y^2\\) — 교수님 순서 그대로", "a": "<p>① \\(1/y^2\\) → 비선형. \\(x\\)로 나눠 표준형 \\(y'+\\frac1xy=\\frac1xy^{-2}\\) → \\(a=-2\\). ② \\(u=y^{1-(-2)}=y^3\\), \\(u'=3y^2y'=3y^2\\big(-\\frac yx+\\frac{y^{-2}}x\\big)=-\\frac{3y^3}x+\\frac3x\\) → ③ <b>\\(u'+\\frac3xu=\\frac3x\\)<\/b> — \"아침에 배웠던 착한 형태\". ④ (a) 변수분리 \\(\\frac{du}{u-1}=-\\frac{3\\,dx}x\\) → \\(\\ln|u-1|=-3\\ln x+c\\) → \\(u-1=c/x^3\\). (b) 선형 공식 \\(h=3\\ln x\\), \\(u=x^{-3}[\\int x^3\\cdot\\frac3x\\,dx+c]=x^{-3}[x^3+c]\\). 같은 답. ⑤ 되돌리기 <b>\\(y^3=1+c/x^3\\)<\/b>.<\/p>"}, {"t": "say", "html": "\"착한 선형 1계 미방으로 풀어도 되고 변수분리로 풀어도 된다. 여러분들이 선택해서 하는 거예요.\" · \"해를 구할 때는 <b>예쁘게 좀 정리<\/b>를 해보는 게 좋죠. 정리하면 강점이 되겠지.\""}, {"t": "why", "html": "치환의 목적은 \"\\(y^{-2}\\)이 붙은 비선형\"을 \"\\(u\\)의 1차식\"으로 바꾸는 것. \\(u'\\) 계산에 원래 식의 \\(y'\\)을 대입하는 것이 핵심 한 줄이고, 판서에서 \\(-\\frac1x\\) 항의 \\(y\\)를 생략해 적었으니 필기는 \\(-\\frac1xy\\)로 고쳐 둘 것."}, {"t": "analogy", "html": "외국 돈(\\(y\\))으로는 계산이 안 되는 가게 — 환전(\\(u=y^3\\))해서 계산하고, 나올 때 다시 환전(\\(y=u^{1/3}\\))한다. 환전을 안 하고 나오면 답이 아니다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(u=y^{1-a}\\) · \\(u'\\)에 원식의 \\(y'\\) 대입 · 선형 또는 변수분리 · 되돌리기 · 연습 1 답 \\(y^3=1+c/x^3\\)"}], "say": null}, {"id": "s2", "title": "연습 2·3 — 덩어리를 통째로 치환", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"26\" width=\"250\" height=\"50\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"139.0\" y=\"49.0\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(2) y′ = (x + y + 2)²<\/text><text x=\"139.0\" y=\"65.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = x + y + 2 → u′ = 1 + y′ = 1 + u²<\/text><line x1=\"139\" y1=\"78\" x2=\"139\" y2=\"98\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><rect x=\"14\" y=\"100\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"139.0\" y=\"125.0\" font-size=\"12.3\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">∫du/(1+u²) = ∫dx → tan⁻¹u = x + c<\/text><rect x=\"296\" y=\"26\" width=\"250\" height=\"50\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"421.0\" y=\"49.0\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(3) y′ = 1 + e^(y − x + 3)<\/text><text x=\"421.0\" y=\"65.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = y − x + 3 → u′ = y′ − 1 = e^u<\/text><line x1=\"421\" y1=\"78\" x2=\"421\" y2=\"98\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><rect x=\"296\" y=\"100\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"421.0\" y=\"125.0\" font-size=\"12.2\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">∫e^(−u)du = ∫dx → −e^(−u) = x + c<\/text><\/svg><figcaption>연습 2·3 — 식 안의 덩어리를 통째로 u 로 놓으면 변수분리형이 된다. 베르누이 꼴은 아니다.<\/figcaption>"}, {"t": "formula", "html": "\\[(2)\\ \\tan^{-1}(x+y+2)=x+c\\ \\Rightarrow\\ y=\\tan(x+c)-x-2\\qquad (3)\\ -e^{-(y-x+3)}=x+c\\ \\Rightarrow\\ e^{-(y-x+3)}+x+c=0\\]"}, {"t": "why", "html": "(2)는 \\(y^2\\)이 있어 비선형이지만 \\(x+y+2\\)가 한 덩어리로만 나온다 → \\(u\\)로 놓으면 \\(u'=1+y'\\)이 \\(1+u^2\\)로 닫힌다. (3)도 지수 안 덩어리 \\(y-x+3\\). 이것이 슬라이드 표의 ⑥ 치환형 \\(y'=f(ax+by+c)\\). \"굉장히 간단해지죠.\""}, {"t": "say", "html": "정리(19:04): \"1번 = 전형 베르누이, 2번 = 치환 후 변수분리(베르누이 꼴 아님), 3번 = 치환.\" · \"지난번 숙제에서는 베르누이는 안 내줬죠\" → 이번 과제에 포함."}, {"t": "analogy", "html": "긴 문장에서 반복되는 구절을 \"그것\"으로 줄여 부르면 문장이 짧아지듯, 반복되는 덩어리를 \\(u\\)로 부르면 식이 한 변수짜리가 된다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(y'=f(ax+by+c)\\) → \\(u=ax+by+c\\), \\(u'=a+by'\\) · 적분상수는 한쪽에 · 과제 1.5 #23(베르누이) · #28(\\(y^2=z\\) 치환)"}], "say": null}, {"id": "s3", "title": "1장 해법 총정리 — \"1장이 다 끝났다\"", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 250\" width=\"560\" height=\"250\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"16\" y=\"20\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"141.0\" y=\"45.0\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">① 변수분리  g(y)dy = f(x)dx<\/text><rect x=\"16\" y=\"66\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"141.0\" y=\"91.0\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">② 동차  y = ux (또는 x = vy)<\/text><rect x=\"16\" y=\"112\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"141.0\" y=\"137.0\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">③ 완전미방  M<tspan baseline-shift=\"sub\" font-size=\"72%\">y<\/tspan> = N<tspan baseline-shift=\"sub\" font-size=\"72%\">x<\/tspan> → u = c<\/text><rect x=\"16\" y=\"158\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#8A97A6\" stroke-width=\"1.6\"><\/rect><text x=\"141.0\" y=\"183.0\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">   완전 아니면 적분인자 F(x)·F(y)<\/text><rect x=\"294\" y=\"20\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"419.0\" y=\"45.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">④ 선형  y′ + py = r → 공식<\/text><rect x=\"294\" y=\"66\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"419.0\" y=\"91.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">⑤ 베르누이  u = y^(1−a) → ④<\/text><rect x=\"294\" y=\"112\" width=\"250\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"419.0\" y=\"137.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">⑥ 치환  dy/dx = f(ax + by + c)<\/text><text x=\"419\" y=\"178\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = ax + by + c<\/text><text x=\"280\" y=\"228\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">「1장이 다 끝났다」 — 형태를 보고 어느 칸인지 고르는 것이 실력의 반<\/text><\/svg><figcaption>1장 해법 총정리(슬라이드 p.10 표). 시험 문제는 이 여섯 중 하나로 풀린다.<\/figcaption>"}, {"t": "talk", "html": "<table><tr><th>#<\/th><th>형태<\/th><th>방법<\/th><\/tr>\n<tr><td>①<\/td><td>\\(x\\)는 \\(x\\)끼리, \\(y\\)는 \\(y\\)끼리 갈라짐<\/td><td>변수분리 → 양변 적분<\/td><\/tr>\n<tr><td>②<\/td><td>갈라지진 않지만 각 항이 동차<\/td><td>\\(u=y/x\\)(또는 \\(x=vy\\)) → ①<\/td><\/tr>\n<tr><td>③<\/td><td>\\(M\\,dx+N\\,dy=0\\), \\(M_y=N_x\\)<\/td><td>\\(u(x,y)=c\\); 아니면 적분인자 \\(R=\\frac1Q(P_y-Q_x)\\), \\(\\tilde R=\\frac1P(Q_x-P_y)\\)<\/td><\/tr>\n<tr><td>④<\/td><td>\\(y'+py=r\\)<\/td><td>\\(y=e^{-h}[\\int e^hr\\,dx+c]\\), \\(h=\\int p\\,dx\\)<\/td><\/tr>\n<tr><td>⑤<\/td><td>\\(y'+py=gy^a\\)<\/td><td>\\(u=y^{1-a}\\) → ④ 또는 ①<\/td><\/tr>\n<tr><td>⑥<\/td><td>\\(y'=f(ax+by+c)\\)<\/td><td>\\(u=ax+by+c\\) → ①<\/td><\/tr><\/table>", "sub": null}, {"t": "say", "html": "\"수학도 <b>일정 부분은 외워야<\/b> 돼요. 핀란드식으로 유도가 중요하다고 배웠겠지만, 일정 부분은 외워야.\" · \"1장이 조금 어려워, 여러 종류가 있어서. 2장으로 가면 오히려 쉬워져요.\""}, {"t": "why", "html": "외울 것은 셋: 적분인자 공식 2개, 선형 해 공식, 베르누이 치환. 나머지는 \"어느 칸인지 알아보는 눈\" — 9/11 플로차트가 이 표의 순서다."}, {"t": "analogy", "html": "도구함 여섯 칸. 못(문제)을 보고 망치인지 드라이버인지 고르는 것이 먼저, 쓰는 법은 칸마다 정해져 있다."}, {"t": "memo", "html": "<b>외울 것<\/b> 여섯 칸 순서 ①~⑥ · 외울 공식: \\(R\\)·\\(\\tilde R\\)·\\(y=e^{-h}[\\dots]\\)·\\(u=y^{1-a}\\)"}], "say": null}, {"id": "s4", "title": "2.1 2계 선형 ODE — 표준형 · 제차/비제차 · 중첩 원리 ★", "steps": [{"t": "formula", "html": "\\[y''+p(x)y'+q(x)y=r(x)\\quad(\\text{표준형: }y''\\text{ 계수 1}),\\qquad r=0\\ \\text{제차},\\ r\\ne0\\ \\text{비제차}\\]"}, {"t": "talk", "html": "<p>예: \\(y''+25y=e^{-x}\\cos x\\) 비제차 · \\(xy''+y'+xy=0\\) → \\(x\\)로 나눠 \\(y''+\\frac1xy'+y=0\\) 제차 · \\(yy''+y'^2=0\\) 계수에 \\(y\\), \\(y'\\)의 제곱 → <b>비선형<\/b>(\"정말 쉽지가 않아\").<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"60\" y1=\"170\" x2=\"300\" y2=\"170\" stroke=\"#1971C2\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"><\/line><text x=\"300\" y=\"190\" font-size=\"12\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ 방향<\/text><line x1=\"60\" y1=\"170\" x2=\"150\" y2=\"40\" stroke=\"#E03131\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"><\/line><text x=\"120\" y=\"34\" font-size=\"12\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂ 방향<\/text><line x1=\"150\" y1=\"40\" x2=\"390\" y2=\"40\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"><\/line><line x1=\"300\" y1=\"170\" x2=\"390\" y2=\"40\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"><\/line><line x1=\"60\" y1=\"170\" x2=\"390\" y2=\"40\" stroke=\"#2F9E44\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"262\" y=\"128\" font-size=\"14\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">c₁y₁ + c₂y₂<\/text><text x=\"180\" y=\"182\" font-size=\"12\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">c₁y₁<\/text><text x=\"80\" y=\"100\" font-size=\"12\" fill=\"#E03131\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">c₂y₂<\/text><text x=\"470\" y=\"90\" font-size=\"13.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">해의 중첩 원리<\/text><text x=\"470\" y=\"112\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">해끼리 더해도 해,<\/text><text x=\"470\" y=\"130\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">상수배도 해<\/text><text x=\"470\" y=\"160\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">제차 선형에만!<\/text><\/svg><figcaption>판서 ④의 그림: 두 해 y₁, y₂ 가 만드는 평행사변형 안이 전부 해(해 공간). 비제차·비선형에서는 무너진다.<\/figcaption>"}, {"t": "formula", "html": "\\[\\textbf{정리 1(중첩·선형성의 원리)}:\\ y_1,y_2\\text{ 가 제차 선형 ODE의 해이면 }c_1y_1+c_2y_2\\text{ 도 해}\\]"}, {"t": "why", "html": "2계는 두 번 적분 → 상수 2개 → 해가 2개(\\(y_1,y_2\\))이고, 그 1차결합 전체가 해 공간. <b>빨간 글씨<\/b>: 제차 선형에만. 비제차 반례 \\(y''+y=1\\): \\(1+\\cos x\\), \\(1+\\sin x\\)는 각각 해지만 합(\\(2+\\cos x+\\sin x\\))이나 \\(2(1+\\cos x)\\)는 해가 아니다. 비선형 반례 \\(y''y-xy'=0\\): \\(x^2\\), \\(1\\)은 해지만 \\(x^2+1\\), \\(-x^2\\)은 아니다."}, {"t": "say", "html": "\"진도가 빠른 이유: 2학기는 추석·10월 휴일이 많아 중간까지 8주 강의가 <b>실질 7주<\/b>.\" · 2계 선형의 쓰임: 3학년 <b>진동공학·제어공학 → 로봇<\/b>, 라플라스 변환, 회로 해석."}, {"t": "analogy", "html": "제차 선형은 \"레고\": 해 두 개를 붙이거나 늘려도 여전히 조립품(해). 비제차·비선형은 \"찰흙\": 두 덩이를 합치면 다른 것이 된다."}, {"t": "memo", "html": "<b>외울 것<\/b> 표준형 \\(y''+py'+qy=r\\) · 중첩 원리는 <b>제차 선형에만<\/b> · 반례 \\(y''+y=1\\), \\(y''y-xy'=0\\)"}], "say": null}, {"id": "s5", "title": "초기값 문제 · 1차독립 · 기저 ★ (교수님 정정)", "steps": [{"t": "formula", "html": "\\[\\text{IVP: }y(x_0)=K_0,\\ y'(x_0)=K_1\\qquad \\text{Ex.4 }y''+y=0,\\ y(0)=3.0,\\ y'(0)=-0.5:\\ y=c_1\\cos x+c_2\\sin x\\ \\Rightarrow\\ y=3.0\\cos x-0.5\\sin x\\]"}, {"t": "why", "html": "상수 2개 → 초기조건 2개(값과 기울기). 공학에서 초기치 = 시간 \\(t=0\\) 문제, 공간이면(\\(x=0\\)과 \\(x=L\\)) <b>경계치 문제<\/b>(2·3학년). 일반해 \\(c_1y_1+c_2y_2\\)가 \"모든 해\"이려면 \\(y_1,y_2\\)가 <b>1차독립<\/b>이어야 하고, 그런 쌍을 <b>기저(basis)<\/b>·기본계라 한다."}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 190\" width=\"560\" height=\"190\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"60\" y1=\"160\" x2=\"300\" y2=\"160\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"60\" y1=\"160\" x2=\"60\" y2=\"160\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"296\" y=\"178\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x<\/text><text x=\"54\" y=\"164\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y<\/text><line x1=\"60\" y1=\"160\" x2=\"60\" y2=\"20\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><path d=\"M60.0 157.6 L62.8 157.4 L65.6 157.3 L68.5 157.2 L71.3 157.0 L74.1 156.9 L76.9 156.7 L79.7 156.5 L82.5 156.3 L85.4 156.1 L88.2 155.9 L91.0 155.7 L93.8 155.5 L96.6 155.3 L99.5 155.0 L102.3 154.7 L105.1 154.5 L107.9 154.2 L110.7 153.9 L113.6 153.5 L116.4 153.2 L119.2 152.9 L122.0 152.5 L124.8 152.1 L127.7 151.7 L130.5 151.2 L133.3 150.8 L136.1 150.3 L138.9 149.8 L141.7 149.2 L144.6 148.7 L147.4 148.1 L150.2 147.4 L153.0 146.8 L155.8 146.1 L158.7 145.4 L161.5 144.6 L164.3 143.8 L167.1 142.9 L169.9 142.0 L172.8 141.1 L175.6 140.1 L178.4 139.0 L181.2 137.9 L184.0 136.8 L186.8 135.6 L189.7 134.3 L192.5 132.9 L195.3 131.5 L198.1 130.0 L200.9 128.4 L203.8 126.7 L206.6 125.0 L209.4 123.2 L212.2 121.2 L215.0 119.2 L217.8 117.0 L220.7 114.8 L223.5 112.4 L226.3 109.9 L229.1 107.3 L231.9 104.5 L234.8 101.6 L237.6 98.5 L240.4 95.3 L243.2 91.9 L246.0 88.3 L248.9 84.5 L251.7 80.5 L254.5 76.4 L257.3 72.0 L260.1 67.3 L262.9 62.4 L265.8 57.3 L268.6 51.9 L271.4 46.2 L274.2 40.3 L277.0 34.0 L279.9 27.3\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"2.4\"><\/path><path d=\"M60.1 27.3 L63.0 34.0 L65.8 40.3 L68.6 46.2 L71.4 51.9 L74.2 57.3 L77.0 62.4 L79.9 67.3 L82.7 72.0 L85.5 76.4 L88.3 80.5 L91.1 84.5 L94.0 88.3 L96.8 91.9 L99.6 95.3 L102.4 98.5 L105.2 101.6 L108.1 104.5 L110.9 107.3 L113.7 109.9 L116.5 112.4 L119.3 114.8 L122.1 117.0 L125.0 119.2 L127.8 121.2 L130.6 123.2 L133.4 125.0 L136.2 126.7 L139.1 128.4 L141.9 130.0 L144.7 131.5 L147.5 132.9 L150.3 134.3 L153.2 135.6 L156.0 136.8 L158.8 137.9 L161.6 139.0 L164.4 140.1 L167.2 141.1 L170.1 142.0 L172.9 142.9 L175.7 143.8 L178.5 144.6 L181.3 145.4 L184.2 146.1 L187.0 146.8 L189.8 147.4 L192.6 148.1 L195.4 148.7 L198.3 149.2 L201.1 149.8 L203.9 150.3 L206.7 150.8 L209.5 151.2 L212.3 151.7 L215.2 152.1 L218.0 152.5 L220.8 152.9 L223.6 153.2 L226.4 153.5 L229.3 153.9 L232.1 154.2 L234.9 154.5 L237.7 154.7 L240.5 155.0 L243.4 155.3 L246.2 155.5 L249.0 155.7 L251.8 155.9 L254.6 156.1 L257.4 156.3 L260.3 156.5 L263.1 156.7 L265.9 156.9 L268.7 157.0 L271.5 157.2 L274.4 157.3 L277.2 157.4 L280.0 157.6\" fill=\"none\" stroke=\"#E03131\" stroke-width=\"2.4\"><\/path><text x=\"200\" y=\"36\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ = eˣ<\/text><text x=\"70\" y=\"40\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂ = e⁻ˣ<\/text><text x=\"430\" y=\"50\" font-size=\"13.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁/y₂ = e^(2x)  — 상수 아님<\/text><text x=\"430\" y=\"74\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">→ 비례 관계 X → 1차독립 → 기저<\/text><text x=\"430\" y=\"110\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ = eˣ, y₂ = 3eˣ 라면 y₁/y₂ = 1/3<\/text><text x=\"430\" y=\"130\" font-size=\"12.5\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">→ 비례 → 1차종속 (기저 못 됨)<\/text><text x=\"430\" y=\"166\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">「비례하면 종속, 안 하면 독립」 (교수 정정)<\/text><\/svg><figcaption>1차독립 판별: 두 해의 비가 상수인지 본다. 기저가 있어야 일반해 c₁y₁ + c₂y₂ 가 「모든」 해를 덮는다.<\/figcaption>"}, {"t": "formula", "html": "\\[\\text{1차독립: }k_1y_1+k_2y_2=0\\ \\Rightarrow\\ k_1=k_2=0\\ \\text{일 때만}\\qquad\\Leftrightarrow\\qquad y_1/y_2\\ne\\text{const}\\]"}, {"t": "say", "html": "(50:14 정정) \"비례 관계가 되면 1차 <b>종속<\/b>이 되고, 비례 관계가 없으면 1차 <b>독립<\/b>이에요. <b>반대로 얘기했어요.<\/b>\" — 판서 ⑤에 취소선과 별표로 남은 자리."}, {"t": "ex", "q": "예제 — \\(y''-y=0\\)의 기저임을 보이시오: (a) \\(e^x, e^{-x}\\) (b) \\(\\cosh x, \\sinh x\\)", "a": "<p>(a) 대입하면 각각 해. \\(y_1/y_2=e^{2x}\\) 상수 아님 → 독립 → 기저. (b) \\((\\cosh x)''=\\cosh x\\) ✓, \\((\\sinh x)''=\\sinh x\\) ✓. \\(y_1^*/y_2^*=\\coth x\\)(판서는 \\(-k_2/k_1=\\tanh x\\) 꼴) 상수 아님 → 기저. 같은 방정식에 기저가 여럿 있을 수 있다.<\/p>"}, {"t": "analogy", "html": "지도의 두 축이 같은 방향이면(비례) 평면을 못 덮는다. 서로 다른 방향 두 개(독립)라야 모든 점(모든 해)에 닿는다."}, {"t": "memo", "html": "<b>외울 것<\/b> IVP 조건 2개 · 비례 → 종속, 비례 아님 → 독립 · 독립인 두 해 = 기저 · Ex.4 \\(3\\cos x-0.5\\sin x\\) · \"공수2에서도 1차독립 나온다\""}], "say": null}, {"id": "s6", "title": "차수축소법(Reduction of order) — 해 하나를 알면 둘째 해", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"30\" width=\"120\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"74.0\" y=\"56.0\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ 을 안다<\/text><text x=\"74.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">예: y₁ = x<\/text><line x1=\"136\" y1=\"58\" x2=\"170\" y2=\"58\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"174\" y=\"30\" width=\"120\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"234.0\" y=\"56.0\" font-size=\"14\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂ = u·y₁<\/text><text x=\"234.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u 를 찾는다<\/text><line x1=\"296\" y1=\"58\" x2=\"330\" y2=\"58\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"334\" y=\"20\" width=\"216\" height=\"76\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"442.0\" y=\"56.0\" font-size=\"11.2\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂ = y₁ ∫ (1/y₁²)·e^(−∫p dx) dx<\/text><text x=\"442.0\" y=\"72.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">☆ 판서 ⑧·⑨ (지수에 − 있음)<\/text><text x=\"280\" y=\"130\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">2계 식이 u′ 에 대한 1계 식으로 「낮아진다」 — 그래서 차수축소<\/text><\/svg><figcaption>차수축소법. 표준형에서 p(x) 를 읽고 공식에 넣는다. 예제 1 은 설정까지, 계산은 9/18.<\/figcaption>"}, {"t": "formula", "html": "\\[y_2=u\\,y_1\\ \\Rightarrow\\ u''y_1+u'(2y_1'+py_1)+u\\underbrace{(y_1''+py_1'+qy_1)}_{=0}=0\\ \\Rightarrow\\ U=u':\\ U'+\\Big(\\frac{2y_1'}{y_1}+p\\Big)U=0\\ \\Rightarrow\\ \\boxed{\\,y_2=y_1\\int\\frac{1}{y_1^2}e^{-\\int p\\,dx}dx\\,}\\]"}, {"t": "why", "html": "\\(y_1\\)이 해라서 \\(u\\)의 계수가 0으로 사라지고, \\(u'\\)에 대한 1계 변수분리형만 남는다 — 2계가 1계로 \"낮아진다\". 적분해 \\(U\\), 다시 적분해 \\(u\\), 곱해서 \\(y_2\\). 이 공식은 9/18 2.2 중근(Case II)과 9/23 오일러-코시 중근에서 그대로 다시 쓰인다."}, {"t": "ex", "q": "예제 1 \\((x^2-x)y''-xy'+y=0\\), \\(y_1=x\\) — 설정까지(계산은 9/18)", "a": "<p>표준형: \\(y''-\\dfrac{x}{x^2-x}y'+\\dfrac{1}{x^2-x}y=0\\) → \\(p=-\\dfrac{x}{x^2-x}=-\\dfrac{1}{x-1}\\), \\(q=\\dfrac{1}{x^2-x}\\), \\(y_1=x\\), \\(y_1^2=x^2\\). (슬라이드 p.19 답: \\(y_2=x\\ln|x|+1\\).)<\/p>"}, {"t": "say", "html": "\"이 해(\\(y_1\\))를 알면 여기에 집어넣고 \\(y_2\\)를 만들어낼 수 있다.\" · \"이걸 기억하고 있는 게 낫겠죠.\" · 금요일(9/18)에 유도 다시 + 상수계수로."}, {"t": "analogy", "html": "한쪽 신발(\\(y_1\\))을 찾았으면 짝(\\(y_2\\))은 그 모양에 맞춰 만들 수 있다 — 공식이 그 \"맞추는 법\"."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(y_2=y_1\\int\\frac1{y_1^2}e^{-\\int p\\,dx}dx\\)(지수에 −) · 표준형에서 \\(p\\) 읽기 · 과제: 1.5 #23·#28 (2.1 #6·#9는 \"한번 해보세\")"}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 연습 1", "html": "\\(xy'+y=1/y^2\\)의 일반해는?", "choices": [{"html": "\\(y^3=1+c/x^3\\)", "ok": true}, {"html": "\\(y=1+c/x^3\\)", "ok": false}, {"html": "\\(y^3=1+cx^3\\)", "ok": false}, {"html": "\\(y^{-2}=1+c/x^3\\)", "ok": false}], "ans": "\\(u=y^3\\), \\(u'+\\frac3xu=\\frac3x\\) → \\(u=1+c/x^3\\) → 되돌리기. 2번은 되돌리지 않은 것."}, {"id": "q2", "qn": "확인 2 · 치환", "html": "\\(y'=(x+y+2)^2\\)의 일반해는?", "choices": [{"html": "\\(\\tan^{-1}(x+y+2)=x+c\\)", "ok": true}, {"html": "\\(\\tan^{-1}(x+y+2)=c\\)", "ok": false}, {"html": "\\(\\ln(x+y+2)=x+c\\)", "ok": false}, {"html": "\\(x+y+2=ce^x\\)", "ok": false}], "ans": "\\(u=x+y+2\\), \\(u'=1+u^2\\) → \\(\\int\\frac{du}{1+u^2}=\\int dx\\)."}, {"id": "q3", "qn": "확인 3 · 중첩 원리", "html": "\"두 해의 1차결합도 해\"가 성립하는 경우는?", "choices": [{"html": "제차 선형 ODE에서만", "ok": true}, {"html": "모든 선형 ODE(비제차 포함)", "ok": false}, {"html": "모든 ODE", "ok": false}, {"html": "비선형 ODE에서만", "ok": false}], "ans": "빨간 글씨. \\(y''+y=1\\)(비제차), \\(y''y-xy'=0\\)(비선형)이 반례."}, {"id": "q4", "qn": "확인 4 · 1차독립", "html": "두 해 \\(y_1,y_2\\)가 1차독립인지 판별하는 기준은?", "choices": [{"html": "\\(y_1/y_2\\)가 상수가 아니면(비례하지 않으면) 독립", "ok": true}, {"html": "\\(y_1/y_2\\)가 상수이면 독립", "ok": false}, {"html": "\\(y_1+y_2\\)가 해이면 독립", "ok": false}, {"html": "\\(y_1y_2=0\\)이면 독립", "ok": false}], "ans": "교수님이 정정한 지점: 비례 → 종속, 비례 아님 → 독립."}, {"id": "q5", "qn": "확인 5 · Ex.4", "html": "\\(y''+y=0\\), \\(y(0)=3.0\\), \\(y'(0)=-0.5\\)의 해는?", "choices": [{"html": "\\(y=3.0\\cos x-0.5\\sin x\\)", "ok": true}, {"html": "\\(y=3.0\\sin x-0.5\\cos x\\)", "ok": false}, {"html": "\\(y=3.0e^{x}-0.5e^{-x}\\)", "ok": false}, {"html": "\\(y=-0.5\\cos x+3.0\\sin x\\)", "ok": false}], "ans": "\\(y=c_1\\cos x+c_2\\sin x\\), \\(y(0)=c_1\\), \\(y'(0)=c_2\\)."}, {"id": "q6", "qn": "확인 6 · 차수축소", "html": "차수축소법 공식을 쓰고, \\((x^2-x)y''-xy'+y=0\\), \\(y_1=x\\)에서 \\(p(x)\\)와 \\(y_2\\)를 구하라.", "choices": null, "ans": "\\(y_2=y_1\\int\\frac1{y_1^2}e^{-\\int p\\,dx}dx\\). \\(p=-\\frac{x}{x^2-x}=-\\frac1{x-1}\\) → \\(e^{-\\int p}=e^{\\ln|x-1|}=x-1\\) → \\(U=\\frac{x-1}{x^2}=\\frac1x-\\frac1{x^2}\\) → \\(y_2=x(\\ln|x|+\\frac1x)=x\\ln|x|+1\\)."}], "v": 1, "ver": ""};

/* ---------- 저장 위치: 정수·범위 정리 + v2 는 고정 id·버전 (오타 v55 1 · 설계 2차 5) ----------
   규칙: v2 — ver 불일치 → 그 챕터 처음(cid 없으면 목차) · sid 없음 → 챕터 처음 · v1 저장값(ci/si) 은 범위 안이면 그대로 · qi 는 항상 범위로 · fs 는 저장하지 않고 단계에서 다시 계산 */
const toInt=v=>Number.isInteger(v)?v:((typeof v==="string"&&/^-?\d+$/.test(v))?parseInt(v,10):NaN);   /* "1junk" 같은 값은 숫자로 안 본다 */
function posOf(){ const p=(L.pos&&typeof L.pos==="object")?L.pos:{}; const mode=(p.mode==="quiz"||p.mode==="step"||p.mode==="result")?p.mode:"step";
  let qi=toInt(p.qi); if(!Number.isInteger(qi)||qi<0||qi>=QZ.length) qi=0;

  if(V2){ const v2save=("ver" in p)||("cid" in p)||("sid" in p);   /* v2 저장값(손상 포함)과 구버전(v1: ci/si 만) 저장값을 구분 */
    if(v2save){ if(typeof p.cid==="string") ci=CH.findIndex(c=>c.id===p.cid);
      if(ci<0) return {mode:mode==="quiz"?"quiz":"intro",ci:0,si:0,qi:qi,note:"챕터 못 찾음"};
      if(String(p.ver||"")!==VER){ si=0; note="판서가 바뀌어 챕터 처음부터"; }
      else if(typeof p.sid==="string"){ si=CH[ci].steps.findIndex(s=>s.id===p.sid); if(si<0){ si=0; note="단계 못 찾음"; } }
      else { si=0; note="단계 못 찾음"; } }
    else { const c2=toInt(p.ci); if(!Number.isInteger(c2)||c2<0||c2>=CH.length) return {mode:mode==="quiz"?"quiz":"intro",ci:0,si:0,qi:qi,note:"구버전 저장값"};
      ci=c2; si=0; note="구버전 저장값이라 챕터 처음부터"; } }
  else { ci=toInt(p.ci); if(!Number.isInteger(ci)||ci<0||ci>=CH.length) ci=0;
    const n=(CH[ci]||{steps:[]}).steps.length; si=toInt(p.si); if(!Number.isInteger(si)||si<0) si=0; else if(si>=n) si=Math.max(0,n-1); }
  return {mode:mode,ci:ci,si:si,qi:qi,note:note}; }
/* 저장 위치로 화면을 옮긴다 — #resume 해시와 목차의 「이어서 하기」가 같은 함수를 쓴다(오타 R4). 문제 위치는 저장한 qi 그대로(범위는 posOf 가 정리), 전부 채점됐으면 결과 */
function resumeTo(p){ cancelAll(); S=Object.assign(S,{mode:p.mode,ci:p.ci,si:p.si,qi:p.qi,rev:false,again:0,resume:true,pre:"",preFace:""});
  if(S.mode==="quiz"){ if(!QZ.length) S.mode="result"; else if(QZ.every(q=>typeof ST.correct[q.id]==="boolean")) S.mode="result"; }
  if(S.mode==="step"&&!CH.length) S.mode="intro";

function renderResult(){

  { const [rl,rf]=preLine(ung.length?"채점을 안 한 문제가 있어요. 봐주지 말고 본인이 채점해 주세요. 그래야 오늘 공부가 끝난 거예요.":pick(good?"res_good":mid?"res_mid":"res_bad","r",{ok:ok,n:n}), ung.length?"sharp":good?"proud":mid?"sharp":"angry"); say(rl,rf); }
  const cs=[];

  if(wrong.length) cs.push({t:"틀린 문제 다시 ("+wrong.length+")",cls:ung.length?"g":"p",primary:ung.length?0:1,key:ung.length?"":"Enter",f:()=>{ wrong.forEach(q=>{ delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; }); save(); S.mode="quiz"; S.qi=QZ.findIndex(q=>!ST.done[q.id]); render(); }});

function openToc(){ const ov=$("#ov"); $("#ovMeta").textContent=D.course+" · "+D.sess+" · XP "+(L.xp||0)+(V2?" · 판서 v2":" · 구버전 판서");
