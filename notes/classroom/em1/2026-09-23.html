<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2.5 오일러-코시 — 지수 대신 거듭제곱, 그리고 2.6 론스키안</title>
<!-- 교실 모드 템플릿 v2 (대표님 2026-09-27 확정: 듀오링고×애플 융합 · 판서는 짧게(Gaegu) + 말풍선은 일타강사 구어체 · 그림은 분필 · 단계 애니메이션 · 글꼴 Gowun Dodum/Gothic A1/Inter)
     v2 회차(D.v===2)는 판서 파일(BOARD)로 만든 단계(판서 줄 누적 + 그림 단계 + 대사), v1 회차는 원문 문단 그대로(「구버전 판서」 표시).
     저장: mc-tutor(전역 XP·연속일·하트·호감도 + 회차 위치 {mode,cid,sid,qi,ver}) + mc-lesson-<id>(챕터 읽음·문제, 수업 노트·앱 V52 와 공유). 오타 설계 회의 1·2차 조건 반영. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Gothic+A1:wght@700;800&family=Inter:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--bg:#F5F5F7;--card:rgba(255,255,255,.86);--line:rgba(0,0,0,.08);--ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#8E8E93;--green:#1B7A2E;--green-soft:#E8F7EA;--blue:#0A84FF;--amber:#B25E00;--red:#D42020;
  --board:#2F5D4B;--wood:#7A4E2B;--chalk:#F4F1E8;--chalk-2:rgba(244,241,232,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --fb:"Gowun Dodum","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fh:"Gothic A1","Gowun Dodum",sans-serif;--fn:Inter,"Gothic A1",sans-serif;--fk:Gaegu,"Gowun Dodum",sans-serif;--hud:56px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:var(--fb);font-size:16px;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
#hud .in{max-width:1040px;margin:0 auto;height:100%;padding:0 20px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-family:var(--fh);font-weight:800;font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hud .chp{font-family:var(--fn);font-weight:700;font-size:12px;color:var(--ink-2);white-space:nowrap}
#hud .seg{display:flex;gap:4px;flex:1;max-width:280px}#hud .seg i{display:block;flex:1;height:6px;border-radius:3px;background:#E5E5EA}#hud .seg i.on{background:var(--green)}#hud .seg i.cur{background:var(--blue)}
#hud .hr{display:flex;align-items:center;gap:8px}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--fn);font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:999px;position:relative;white-space:nowrap}
.stat svg{width:15px;height:15px;display:block}
.stat.xp{background:#FFF8DC;color:#8A5A00}.stat.sk{background:#FFF0E6;color:#C2410C}.stat.hp{background:#FFECEC;color:#C92A2A;gap:3px}.stat.af{background:#F7E4EE;color:#B8286A}
.stat .gauge{display:inline-block;width:52px;height:8px;border-radius:99px;background:#F0D0DF;overflow:hidden}.stat .gauge b{display:block;height:100%;width:0;background:#B8286A;transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#1F7A32;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#C92A2A}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer}
/* ---------- 교실 ---------- */
main{max-width:1040px;margin:0 auto;padding:16px 20px 24px}
#room{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:16px;align-items:start}
#board{position:relative}
.frame{padding:12px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 14px 34px rgba(60,40,20,.2),inset 0 2px 0 rgba(255,255,255,.18);position:relative}
.green{position:relative;border-radius:6px;min-height:560px;background:radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.06),transparent 42%),repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);overflow:hidden}
/* 칠판 머리표(챕터·단계): 스크롤 칸 안에 sticky — 판서가 스크롤돼도 글자가 머리표와 겹치지 않는다(2026-09-27 캡처에서 겹침) */
.chk{position:sticky;top:0;z-index:2;margin:0 -30px 10px;padding:12px 30px 8px;font-family:var(--fk);font-weight:700;font-size:20px;color:var(--yel);background:linear-gradient(180deg,#2E5B49 78%,rgba(46,91,73,0));flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk small{font-family:var(--fn);font-size:11px;font-weight:700;color:var(--chalk-2);margin-left:8px;letter-spacing:.04em;vertical-align:middle}
.chk .old{font-family:var(--fb);font-size:11px;color:var(--pink);margin-left:8px;vertical-align:middle;border:1px dashed var(--pink);border-radius:6px;padding:1px 6px}
#bwrap{max-height:70vh;min-height:560px;overflow:auto;padding:0 30px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-family:var(--fk);font-weight:700;font-size:24px;line-height:1.5;width:100%;margin:auto 0}
#bc.v1{font-family:var(--fb);font-weight:400;font-size:18px;line-height:1.75}
#bc .katex{color:var(--sky)}#bc .katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* v2 판서 줄 */
.bd-title{font-size:30px;color:var(--yel);margin:0 0 10px;line-height:1.2;text-decoration:underline wavy rgba(255,226,122,.55) 2px;text-underline-offset:6px}
.bl{margin:0 0 8px;padding-left:34px;position:relative;clip-path:inset(0 100% 0 0);transition:clip-path .45s ease-out}
.bl.on{clip-path:inset(0 0 0 0)}.bl.now{clip-path:inset(0 0 0 0);transition:none}
.bl::before{position:absolute;left:4px;top:0;font-size:1em}
.bl.k-li::before{content:"•"}.bl.k-h{padding-left:0;font-size:28px;color:var(--yel);margin-top:6px}.bl.k-h::before{content:""}
.bl.k-f{padding-left:0;text-align:center;font-size:24px}.bl.k-f::before{content:""}.bl.k-f .katex-display{margin:6px 0}.bl.k-f .katex{font-size:1.2em}
.bl.k-pit{color:var(--pink);border:2px dashed rgba(255,163,199,.6);border-radius:10px;padding:6px 12px 6px 38px;margin:6px 0 10px}.bl.k-pit::before{content:"!";left:14px;top:6px;color:var(--pink)}
.bl.k-star{color:var(--yel)}.bl.k-star::before{content:"☆";color:var(--yel)}
.bl.k-res{color:var(--yel)}.bl.k-res::before{content:"→";color:var(--yel)}
.bl.k-memo{border:2px solid rgba(244,241,232,.6);border-radius:10px;padding:6px 12px;margin:10px 0 6px;background:rgba(255,255,255,.05)}.bl.k-memo::before{content:""}
.bl .ul{text-decoration:underline wavy var(--yel) 2px;text-underline-offset:5px}
.bl .katex{color:var(--sky);font-size:.92em}
/* 그림(분필) */
.bd-fig{margin:14px auto 4px;max-width:640px;width:100%}
.bd-fig figure{margin:0}.bd-fig svg{width:100%;height:auto;display:block;overflow:visible}.bd-fig figcaption{display:none}
.bd-fig [data-step][hidden]{display:none}
.bd-fig .ck{stroke-linecap:round;stroke-linejoin:round}
.bd-fig .draw{transition:stroke-dashoffset var(--dur,1s) ease-out}
.bd-fig .fade{opacity:0;transition:opacity .35s ease-out}.bd-fig .fade.on{opacity:1}
@media (prefers-reduced-motion: reduce){.bl{transition:none}.bd-fig .draw,.bd-fig .fade{transition:none}}
/* v1(구버전) 판서 상자 */
#bc .tk{font-size:19px}#bc p{margin:0 0 10px}#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc .sub{font-family:var(--fk);font-size:26px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .bx{margin:6px 0 14px;padding:12px 16px 10px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative}
#bc .bx>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75)}#bc .bx.formula>i{color:var(--mint)}#bc .bx.pitfall{border-color:rgba(255,163,199,.7)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7)}#bc .bx.memo>i{color:var(--chalk)}#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
#bc .paper{background:#FFFDF7;color:#1F2A44;border-radius:6px;padding:12px 14px 8px;margin:8px auto 14px;max-width:560px;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}#bc .paper figcaption,#bc .paper .cap{font-size:13.5px;color:#55627A;margin-top:6px}#bc .paper .katex{color:#1F2A44}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}#bc .ex .exq>i,#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px;color:var(--yel)}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}#bc .ex .exa>i{color:var(--mint)}#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz{font-family:var(--fb);font-weight:400;font-size:18px}
#bc .qz .qn{font-family:var(--fk);font-weight:700;font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:19px}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12)}#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--fk);font-weight:700;font-size:22px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--fk);font-size:40px;line-height:1.15;color:var(--chalk);margin:0 0 6px}
#bc .lead{font-family:var(--fb);font-weight:400;color:var(--chalk-2);font-size:17px;margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-family:var(--fb);font-weight:400;font-size:17px}
#bc .toc li{display:flex;align-items:center;gap:12px;padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;font-family:var(--fb);font-weight:400}#bc .res .big{font-family:var(--fk);font-weight:700;font-size:60px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:17px;margin:6px 0 12px}#bc .res .stats b{display:block;font-family:var(--fn);font-size:32px;line-height:1.1}#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700}
#bc .res .badge{margin:4px auto 0;width:130px;height:130px}#bc .res .bl2{font-size:13px;font-weight:700;color:var(--chalk-2);margin-top:4px}#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
.tray{height:18px;margin:0 26px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:7px;width:44px;border-radius:4px;background:var(--chalk)}.tray i.y{left:76px;background:var(--yel)}.tray i.p{left:132px;background:var(--pink)}.tray i.w{left:22px}.tray i.er{left:auto;right:26px;width:60px;height:11px;top:3px;border-radius:3px;background:#1E1E22}
#chpills{margin-top:12px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#chpills .lb{font-size:12px;color:var(--ink-2);font-weight:700;margin-right:4px}
.pill{border:1px solid var(--line);background:#F2F2F7;color:var(--ink-3);font-family:var(--fn);font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.pill.done{background:var(--green-soft);color:var(--green);border-color:transparent}.pill.cur{background:var(--green);color:#fff;border-color:var(--green)}
/* ---------- 오른쪽: 스앵님 · 말풍선 · 선택지 ---------- */
#side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--hud) + 16px)}
#tutorCard{padding:12px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
#tutorCard .nm{align-self:flex-start;display:flex;align-items:center;gap:8px;width:100%}
#tutorCard .nm b{font-family:var(--fh);font-weight:800;font-size:13px}#tutorCard .nm span{font-size:11px;color:var(--ink-3);margin-left:auto}
#tutor{width:150px;height:176px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.14));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
.box{padding:14px 16px 12px;position:relative;min-height:120px}
.box::before{content:"";position:absolute;left:50%;top:-9px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.name{font-family:var(--fh);font-weight:800;font-size:12px;color:var(--green);margin-bottom:4px}.name.prof{color:#7A2E52}
.text{font-size:15.5px;line-height:1.6;min-height:48px;cursor:pointer}
.text .cur{display:inline-block;width:.5em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.tip{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.cbt{font:inherit;font-weight:700;font-size:14.5px;padding:11px 16px;border-radius:12px;cursor:pointer;color:var(--ink);background:#fff;border:1px solid var(--line);transition:transform .08s,filter .15s;width:100%;text-align:center;min-height:44px}
.cbt:hover{filter:brightness(.97)}.cbt:active{transform:translateY(1px)}
.cbt.p{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 10px rgba(27,122,46,.25)}
.cbt.t{background:var(--green-soft);color:var(--green);border-color:transparent}
.cbt.r{background:var(--red);color:#fff;border-color:var(--red)}
.cbt.g{background:#F2F2F7;color:var(--ink-2);border-color:transparent}
.cbt kbd{font-family:var(--fn);font-size:10.5px;opacity:.6;margin-left:6px}
#prog{padding:12px 14px}#prog .k{font-size:12px;color:var(--ink-2);font-weight:700}#prog .v{font-family:var(--fh);font-weight:800;font-size:15px;margin:2px 0 6px}#prog .bar{height:6px;border-radius:3px;background:#E5E5EA;overflow:hidden}#prog .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}#prog .h{font-size:11.5px;color:var(--ink-3);margin-top:6px}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.5);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}

 152.8 L117.3 152.2 L120.2 151.5 L123.1 150.8 L126.1 150.0 L129.0 149.2 L131.9 148.4 L134.8 147.6 L137.8 146.7 L140.7 145.8 L143.6 144.9 L146.5 143.9 L149.4 142.9 L152.4 141.9 L155.3 140.8 L158.2 139.8 L161.1 138.6 L164.1 137.5 L167.0 136.3 L169.9 135.1 L172.8 133.9 L175.8 132.7 L178.7 131.4 L181.6 130.1 L184.6 128.7 L187.5 127.3 L190.4 125.9 L193.3 124.5 L196.2 123.0 L199.2 121.5 L202.1 120.0 L205.0 118.5 L208.0 116.9 L210.9 115.3 L213.8 113.6 L216.7 112.0 L219.7 110.3 L222.6 108.5 L225.5 106.8 L228.4 105.0 L231.4 103.2 L234.3 101.3 L237.2 99.4 L240.1 97.5 L243.1 95.6 L246.0 93.6 L248.9 91.6 L251.8 89.6 L254.8 87.5 L257.7 85.5 L260.6 83.3 L263.5 81.2 L266.5 79.0 L269.4 76.8 L272.3 74.6 L275.2 72.3 L278.1 70.0 L281.1 67.7 L284.0 65.4\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"2.4\"><\/path><path d=\"M50.0 160.0 L52.5 160.0 L55.0 160.0 L57.4 160.0 L59.9 160.0 L62.4 160.0 L64.8 159.9 L67.3 159.9 L69.8 159.9 L72.3 159.8 L74.8 159.7 L77.2 159.6 L79.7 159.5 L82.2 159.4 L84.7 159.2 L87.1 159.0 L89.6 158.8 L92.1 158.6 L94.5 158.3 L97.0 158.0 L99.5 157.7 L102.0 157.3 L104.5 156.9 L106.9 156.5 L109.4 156.0 L111.9 155.5 L114.4 154.9 L116.8 154.3 L119.3 153.6 L121.8 152.9 L124.2 152.1 L126.7 151.3 L129.2 150.5 L131.7 149.5 L134.2 148.6 L136.6 147.5 L139.1 146.4 L141.6 145.3 L144.1 144.0 L146.5 142.7 L149.0 141.4 L151.5 139.9 L153.9 138.4 L156.4 136.9 L158.9 135.2 L161.4 133.5 L163.9 131.7 L166.3 129.8 L168.8 127.8 L171.3 125.7 L173.8 123.6 L176.2 121.4 L178.7 119.1 L181.2 116.7 L183.7 114.2 L186.1 111.6 L188.6 108.9 L191.1 106.1 L193.6 103.2 L196.0 100.2 L198.5 97.1 L201.0 93.9 L203.5 90.6 L205.9 87.2 L208.4 83.7 L210.9 80.0 L213.4 76.3 L215.8 72.4 L218.3 68.5 L220.8 64.4 L223.2 60.1 L225.7 55.8 L228.2 51.3 L230.7 46.7 L233.2 42.0 L235.6 37.2 L238.1 32.2 L240.6 27.1\" fill=\"none\" stroke=\"#E03131\" stroke-width=\"2.4\"><\/path><text x=\"300\" y=\"68\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x²<\/text><text x=\"252\" y=\"40\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x³<\/text><text x=\"430\" y=\"50\" font-size=\"14.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x²y″ + axy′ + by = 0<\/text><text x=\"430\" y=\"76\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y = xᵐ 대입 → x 가 전부 빠진다<\/text><text x=\"430\" y=\"104\" font-size=\"15\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">m² + (a − 1)m + b = 0<\/text><text x=\"430\" y=\"126\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">보조방정식 (auxiliary equation)<\/text><text x=\"430\" y=\"158\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(1) 실근 m₁ ≠ m₂ → y = c₁x^m₁ + c₂x^m₂<\/text><\/svg><figcaption>오일러-코시: 계수가 x², x, 1 로 「차수를 맞춘」 변수계수 방정식. 거듭제곱 xᵐ 이 e^λx 의 자리를 맡는다.<\/figcaption>"}, {"t": "formula", "html": "\\[x^2y''+axy'+by=0,\\quad y=x^m:\\ x^2m(m-1)x^{m-2}+axmx^{m-1}+bx^m=0\\ \\Rightarrow\\ \\boxed{m^2+(a-1)m+b=0}\\]"}, {"t": "why", "html": "\\(x^m\\)을 미분할 때마다 \\(x\\)의 차수가 하나씩 내려가는데, 계수 \\(x^2, x, 1\\)이 그것을 정확히 되돌려 모든 항이 \\(x^m\\)으로 맞춰진다 → \\(x^m\\)이 빠지고 \\(m\\)의 2차방정식만 남는다. 2.2의 \\(e^{\\lambda x}\\)와 같은 원리(미분해도 꼴이 유지되는 함수). (1) 서로 다른 실근 \\(m_1,m_2\\)면 \\(y=c_1x^{m_1}+c_2x^{m_2}\\) — 이 부분은 사진 이전이라 교재 그대로."}, {"t": "pitfall", "html": "\\(a-1\\)을 잊지 말 것: \\(m(m-1)+am+b\\)에서 \\(-m\\)이 나온다. 표준형으로 나누면 \\(p=a/x\\), \\(q=b/x^2\\)(판서에는 \\(b/x\\)로 적혔으나 \\(x^2\\)으로 나누었으니 \\(b/x^2\\)이 맞다)."}, {"t": "analogy", "html": "2.2가 \"시간 \\(t\\)로 자라는\" 지수 세계라면 2.5는 \"배율 \\(x\\)로 자라는\" 거듭제곱 세계. \\(x=e^t\\)로 치환하면 실제로 2.2로 돌아간다 — 그래서 결과가 짝을 이룬다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(x^2y''+axy'+by=0\\) → \\(m^2+(a-1)m+b=0\\) · (1) \\(c_1x^{m_1}+c_2x^{m_2}\\) · \\(x&gt;0\\)에서 생각"}], "say": null}, {"id": "s2", "title": "(2) 중근 — 차수축소로 ln x가 붙는다 (판서 ①·③)", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 140\" width=\"560\" height=\"140\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"26\" width=\"130\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"79.0\" y=\"52.0\" font-size=\"12.9\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">중근 m = (1−a)/2<\/text><text x=\"79.0\" y=\"68.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ = x^m 하나뿐<\/text><line x1=\"146\" y1=\"54\" x2=\"178\" y2=\"54\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"182\" y=\"26\" width=\"130\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"247.0\" y=\"52.0\" font-size=\"13.5\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂ = u·y₁<\/text><text x=\"247.0\" y=\"68.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">차수축소 (2.1)<\/text><line x1=\"314\" y1=\"54\" x2=\"346\" y2=\"54\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"350\" y=\"26\" width=\"96\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"398.0\" y=\"52.0\" font-size=\"10.0\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u″x² + u′x = 0<\/text><text x=\"398.0\" y=\"68.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">→ u′ = 1/x<\/text><line x1=\"448\" y1=\"54\" x2=\"480\" y2=\"54\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"484\" y=\"26\" width=\"66\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"517.0\" y=\"59.0\" font-size=\"11.2\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = ln x<\/text><text x=\"280\" y=\"118\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y = (c₁ + c₂ ln x)·x^((1−a)/2)   —   2.2 의 「x 가 붙는다」가 여기서는 「ln x 가 붙는다」<\/text><\/svg><figcaption>(2) 중근 유도의 뼈대. 판서에서 괄호 계산 2xy₁′ + ay₁ 이 정확히 y₁ 이 되어 식이 u″x² + u′x = 0 으로 줄었다.<\/figcaption>"}, {"t": "formula", "html": "\\[m_1=m_2=\\tfrac{1-a}{2},\\ y_1=x^{(1-a)/2}\\quad y_2=uy_1:\\ u''x^2y_1+u'x\\underbrace{(2xy_1'+ay_1)}_{=y_1}+u\\underbrace{(x^2y_1''+axy_1'+by_1)}_{=0}=0\\ \\Rightarrow\\ u''x^2+u'x=0\\]"}, {"t": "formula", "html": "\\[\\int\\frac{u''}{u'}=\\int-\\frac1x\\ \\Rightarrow\\ \\ln u'=-\\ln x\\ \\Rightarrow\\ u'=\\frac1x\\ \\Rightarrow\\ u=\\ln x\\qquad\\therefore\\ y=(c_1+c_2\\ln x)\\,x^{(1-a)/2}\\]"}, {"t": "why", "html": "괄호 계산이 판서의 핵심: \\(2xy_1'+ay_1=2x\\cdot\\tfrac{1-a}{2}x^{(-a-1)/2}+ax^{(1-a)/2}=(1-a)x^{(1-a)/2}+ax^{(1-a)/2}=x^{(1-a)/2}=y_1\\). 그래서 식이 \\((u''x^2+u'x)y_1=0\\)으로 줄고 \\(u'=1/x\\). 2.2에서 \\(u''=0\\Rightarrow u=x\\)였던 자리가 여기서는 \\(u=\\ln x\\)."}, {"t": "analogy", "html": "2.2의 쌍둥이에게 \\(x\\)라는 명찰을 붙였다면, 거듭제곱 세계의 쌍둥이 명찰은 \\(\\ln x\\). \\(x=e^t\\)로 보면 \\(\\ln x=t\\) — 같은 명찰이다."}, {"t": "memo", "html": "<b>외울 것<\/b> 중근 \\(m=\\tfrac{1-a}2\\) · \\(y=(c_1+c_2\\ln x)x^m\\) · 유도 = 차수축소, \\(2xy_1'+ay_1=y_1\\)"}], "say": null}, {"id": "s3", "title": "(3) 공액복소근 — x^{iq} = cos(q ln x) + i sin(q ln x) ☆ (판서 ④~⑥)", "steps": [{"t": "formula", "html": "\\[m=p\\pm iq:\\ y_{1,2}=x^{p\\pm iq}=x^p\\,x^{\\pm iq},\\qquad x^{iq}=e^{\\ln x^{iq}}=e^{iq\\ln x}=\\cos(q\\ln x)+i\\sin(q\\ln x)\\]"}, {"t": "formula", "html": "\\[y_3=\\tfrac12y_1+\\tfrac12y_2=x^p\\cos(q\\ln x),\\quad y_4=\\tfrac1{2i}y_1-\\tfrac1{2i}y_2=x^p\\sin(q\\ln x)\\qquad\\therefore\\ y=x^p\\big[c_1\\cos(q\\ln x)+c_2\\sin(q\\ln x)\\big]\\]"}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"40\" y1=\"100\" x2=\"540\" y2=\"100\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"40\" y1=\"100\" x2=\"40\" y2=\"100\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"536\" y=\"118\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x<\/text><text x=\"34\" y=\"104\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\" III와 완전히 같은 논리, \\(x\\)만 \\(\\ln x\\)로. 그래프는 진동하되 \\(x\\)가 커질수록 느려진다."}, {"t": "analogy", "html": "진동수가 일정한 시계(2.2)와, 갈수록 느려지는 시계(2.5). 눈금이 \\(\\ln x\\)라서 오른쪽으로 갈수록 한 주기가 길어진다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(x^{iq}=e^{iq\\ln x}\\) ☆ · \\(y=x^p[c_1\\cos(q\\ln x)+c_2\\sin(q\\ln x)]\\) · 2.2 Case III에서 \\(x\\to\\ln x\\)"}], "say": null}, {"id": "s4", "title": "예제 세 개 — 세 경우 한 번씩 (판서 ⑦~⑨) + 4주차 과제", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"20\" width=\"200\" height=\"50\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"114.0\" y=\"50.0\" font-size=\"11.2\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">보조방정식 m² + (a−1)m + b = 0<\/text><line x1=\"214\" y1=\"45\" x2=\"250\" y2=\"45\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><rect x=\"254\" y=\"8\" width=\"296\" height=\"36\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"402.0\" y=\"31.0\" font-size=\"12.5\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(1) 실근 둘 → c₁x^m₁ + c₂x^m₂<\/text><rect x=\"254\" y=\"50\" width=\"296\" height=\"36\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"402.0\" y=\"73.0\" font-size=\"12.5\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(2) 중근 → (c₁ + c₂ ln x)x^m<\/text><rect x=\"254\" y=\"92\" width=\"296\" height=\"36\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"402.0\" y=\"115.0\" font-size=\"10.4\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(3) p ± iq → x^p[c₁cos(q ln x) + c₂sin(q ln x)]<\/text><text x=\"114\" y=\"100\" font-size=\"11.5\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">예제 (1) m²−4m+4 → 중근 2<\/text><text x=\"114\" y=\"118\" font-size=\"11.5\" fill=\"#2F9E44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(2) m²−5m+6 → 2, 3<\/text><text x=\"114\" y=\"136\" font-size=\"11.5\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(3) m²+6m+13 → −3 ± 2i<\/text><\/svg><figcaption>예제 세 개가 세 경우를 하나씩. 4주차 과제 2.5 #3·5·7·13 도 이 흐름.<\/figcaption>"}, {"t": "ex", "q": "보조방정식으로 바로", "a": "\n<p><b>(1)<\/b> \\(x^2y''-3xy'+4y=0\\) → \\(m^2-4m+4=(m-2)^2=0\\) → 중근 2 → <b>\\(y=(c_1+c_2\\ln x)x^2\\)<\/b>.<\/p>\n<p><b>(2)<\/b> \\(x^2y''-4xy'+6y=0\\) → \\(m^2-5m+6=(m-2)(m-3)=0\\) → <b>\\(y=c_1x^2+c_2x^3\\)<\/b>.<\/p>\n<p><b>(3)<\/b> \\(x^2y''+7xy'+13y=0\\) → \\(m^2+6m+13=0\\) → \\(m=-3\\pm2i\\) → <b>\\(y=x^{-3}[c_1\\cos(2\\ln x)+c_2\\sin(2\\ln x)]\\)<\/b>.<\/p>"}, {"t": "why", "html": "계산은 2차방정식 하나. 실수는 \\(a-1\\)에서 나온다: (1)은 \\(a=-3\\)이라 \\(a-1=-4\\), (3)은 \\(a=7\\)이라 \\(a-1=6\\). 검산: 중근 공식 \\(m=(1-a)/2=(1+3)/2=2\\) ✓."}, {"t": "analogy", "html": "2.2 예제와 \"같은 문제, 다른 옷\". 옷(계수의 꼴)만 보고 어느 세계인지 알아채면 나머지는 기계적."}, {"t": "memo", "html": "<b>외울 것<\/b> (1) 중근 2 (2) 2, 3 (3) \\(-3\\pm2i\\) · <b>4주차 과제 2.5 #3·5·7·13<\/b>(판서 ⑩, 마감은 과목 규칙대로 다음 주 수요일 수업 전 ❓)"}], "say": null}, {"id": "s5", "title": "2.6 론스키안 — 1차독립을 행렬식으로 ☆ (판서 ⑪~⑮)", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 170\" width=\"560\" height=\"170\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><text x=\"120\" y=\"40\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">W(y₁, y₂) =<\/text><line x1=\"196\" y1=\"22\" x2=\"196\" y2=\"62\" stroke=\"#1F2A44\" stroke-width=\"2\"><\/line><line x1=\"300\" y1=\"22\" x2=\"300\" y2=\"62\" stroke=\"#1F2A44\" stroke-width=\"2\"><\/line><text x=\"222\" y=\"36\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁<\/text><text x=\"274\" y=\"36\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂<\/text><text x=\"222\" y=\"58\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁′<\/text><text x=\"274\" y=\"58\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂′<\/text><text x=\"400\" y=\"42\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= y₁y₂′ − y₂y₁′<\/text><rect x=\"40\" y=\"90\" width=\"230\" height=\"44\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"155.0\" y=\"117.0\" font-size=\"13.5\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">W ≠ 0  →  1차독립 (기저)  ☆<\/text><rect x=\"300\" y=\"90\" width=\"230\" height=\"44\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"415.0\" y=\"117.0\" font-size=\"13.5\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">W = 0  →  1차종속<\/text><text x=\"280\" y=\"156\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">eg1) cos ωx, sin ωx: W = ω ≠ 0      eg2) eˣ, xeˣ: W = e^(2x) ≠ 0<\/text><\/svg><figcaption>2.6 론스키안(Wronskian). 비례 판정을 행렬식 하나로 — 판서 별표 자리.<\/figcaption>"}, {"t": "formula", "html": "\\[W(y_1,y_2)=\\begin{vmatrix}y_1&amp;y_2\\\\y_1'&amp;y_2'\\end{vmatrix}=y_1y_2'-y_2y_1'\\qquad W\\ne0\\ \\Rightarrow\\ \\text{1차독립(기저)},\\quad W=0\\ \\Rightarrow\\ \\text{1차종속}\\]"}, {"t": "why", "html": "9/16의 판별 \"비례하면 종속\": \\(k_1y_1+k_2y_2=0\\)에서 \\(y_2/y_1=-k_1/k_2\\)(상수)면 \\(y_2=cy_1\\), \\(y_2'=cy_1'\\) → \\(W=y_1cy_1'-cy_1y_1'=0\\). 거꾸로 \\(W\\ne0\\)이면 비례할 수 없다 → 독립. 미분 한 번과 곱셈 둘로 끝나니 비를 직접 살피는 것보다 기계적이다. 일반해 \\(y=c_1y_1+c_2y_2\\)는 \\(y_1,y_2\\)가 기저일 때만 \"모든 해\"(판서 동그라미 강조)."}, {"t": "ex", "q": "eg1) \\(y''+\\omega^2y=0\\), \\(y_1=\\cos\\omega x\\), \\(y_2=\\sin\\omega x\\) / eg2) \\(y''-2y'+y=0\\)", "a": "<p>eg1) \\(W=\\begin{vmatrix}\\cos\\omega x&amp;\\sin\\omega x\\\\-\\omega\\sin\\omega x&amp;\\omega\\cos\\omega x\\end{vmatrix}=\\omega(\\cos^2+\\sin^2)=\\omega\\ne0\\) → 독립. eg2) \\((\\lambda-1)^2=0\\) → \\(y_1=e^x\\), \\(y_2=xe^x\\): \\(W=\\begin{vmatrix}e^x&amp;xe^x\\\\e^x&amp;(x+1)e^x\\end{vmatrix}=e^{2x}(x+1-x)=e^{2x}\\ne0\\) → 독립. (판서는 계수 \\(c_1,c_2\\)를 붙였다가 동그라미로 뺐다 — \\(W\\)는 기저 자체로 계산.)<\/p>"}, {"t": "analogy", "html": "두 벡터가 평행이면 평행사변형 넓이가 0(정역학 외적) — 론스키안은 두 함수 버전의 \"넓이\". 0이면 같은 방향(종속)."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(W=y_1y_2'-y_2y_1'\\) · \\(W\\ne0\\) ⇔ 독립 ☆ · eg1 \\(W=\\omega\\) · eg2 \\(W=e^{2x}\\) · 정리 1~4(존재·유일성)는 슬라이드 대조 때"}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 보조방정식", "html": "\\(x^2y''+axy'+by=0\\)에 \\(y=x^m\\)을 넣으면 나오는 식은?", "choices": [{"html": "\\(m^2+(a-1)m+b=0\\)", "ok": true}, {"html": "\\(m^2+am+b=0\\)", "ok": false}, {"html": "\\(m^2+(a+1)m+b=0\\)", "ok": false}, {"html": "\\(am^2+bm+1=0\\)", "ok": false}], "ans": "\\(m(m-1)+am+b\\). 2번은 2.2의 특성방정식과 혼동."}, {"id": "q2", "qn": "확인 2 · 예제 (2)", "html": "\\(x^2y''-4xy'+6y=0\\)의 일반해는?", "choices": [{"html": "\\(y=c_1x^2+c_2x^3\\)", "ok": true}, {"html": "\\(y=c_1e^{2x}+c_2e^{3x}\\)", "ok": false}, {"html": "\\(y=(c_1+c_2\\ln x)x^2\\)", "ok": false}, {"html": "\\(y=c_1x^{-2}+c_2x^{-3}\\)", "ok": false}], "ans": "\\(m^2-5m+6=(m-2)(m-3)\\)."}, {"id": "q3", "qn": "확인 3 · 중근", "html": "\\(x^2y''-3xy'+4y=0\\)의 일반해는?", "choices": [{"html": "\\(y=(c_1+c_2\\ln x)x^2\\)", "ok": true}, {"html": "\\(y=(c_1+c_2x)x^2\\)", "ok": false}, {"html": "\\(y=(c_1+c_2x)e^{2x}\\)", "ok": false}, {"html": "\\(y=c_1x^2+c_2x^{-2}\\)", "ok": false}], "ans": "\\((m-2)^2=0\\) → 거듭제곱 세계의 중근은 \\(\\ln x\\)가 붙는다(2번은 2.2식 착각)."}, {"id": "q4", "qn": "확인 4 · 복소근", "html": "\\(x^2y''+7xy'+13y=0\\)의 일반해는?", "choices": [{"html": "\\(y=x^{-3}[c_1\\cos(2\\ln x)+c_2\\sin(2\\ln x)]\\)", "ok": true}, {"html": "\\(y=e^{-3x}[c_1\\cos2x+c_2\\sin2x]\\)", "ok": false}, {"html": "\\(y=x^{3}[c_1\\cos(2\\ln x)+c_2\\sin(2\\ln x)]\\)", "ok": false}, {"html": "\\(y=x^{-3}[c_1\\cos2x+c_2\\sin2x]\\)", "ok": false}], "ans": "\\(m^2+6m+13=0\\) → \\(m=-3\\pm2i\\): \\(p=-3\\), \\(q=2\\), 인수는 \\(\\ln x\\)."}, {"id": "q5", "qn": "확인 5 · 론스키안", "html": "\\(y_1=\\cos\\omega x\\), \\(y_2=\\sin\\omega x\\)의 론스키안은?", "choices": [{"html": "\\(W=\\omega\\) (≠ 0 → 1차독립)", "ok": true}, {"html": "\\(W=0\\) (1차종속)", "ok": false}, {"html": "\\(W=\\cos^2\\omega x-\\sin^2\\omega x\\)", "ok": false}, {"html": "\\(W=1\\)", "ok": false}], "ans": "\\(\\omega\\cos^2\\omega x+\\omega\\sin^2\\omega x=\\omega\\)."}, {"id": "q6", "qn": "확인 6 · eg2", "html": "\\(y''-2y'+y=0\\)의 기저를 구하고 론스키안으로 1차독립임을 보여라.", "choices": null, "ans": "\\((\\lambda-1)^2=0\\) → \\(y_1=e^x\\), \\(y_2=xe^x\\). \\(W=e^x(x+1)e^x-xe^x\\cdot e^x=e^{2x}\\ne0\\) → 독립 → 일반해 \\((c_1+c_2x)e^x\\)."}], "v": 1, "ver": ""};
