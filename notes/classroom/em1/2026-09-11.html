<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1.5 선형 ODE — "이거 하고 이거는 기억을 하라"</title>
<!-- 교실 모드 템플릿 v2 (대표님 2026-09-27 확정: 듀오링고×애플 융합 · 판서는 짧게(Gaegu) + 말풍선은 일타강사 구어체 · 그림은 분필 · 단계 애니메이션 · 글꼴 Gowun Dodum/Gothic A1/Inter)
     v2 회차(D.v===2)는 판서 파일(BOARD)로 만든 단계(판서 줄 누적 + 그림 단계 + 대사), v1 회차는 원문 문단 그대로(「구버전 판서」 표시).
     저장: mc-tutor(전역 XP·연속일·하트·호감도 + 회차 위치 {mode,cid,sid,qi,ver}) + mc-lesson-<id>(챕터 읽음·문제, 수업 노트·앱 V52 와 공유). 오타 설계 회의 1·2차 조건 반영. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Gothic+A1:wght@700;800&family=Inter:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--bg:#F5F5F7;--card:rgba(255,255,255,.86);--line:rgba(0,0,0,.08);--ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#8E8E93;--green:#1B7A2E;--green-soft:#E8F7EA;--blue:#0A84FF;--amber:#B25E00;--red:#D42020;
  --board:#2F5D4B;--wood:#7A4E2B;--chalk:#F4F1E8;--chalk-2:rgba(244,241,232,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --fb:"Gowun Dodum","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fh:"Gothic A1","Gowun Dodum",sans-serif;--fn:Inter,"Gothic A1",sans-serif;--fk:Gaegu,"Gowun Dodum",sans-serif;--hud:56px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:var(--fb);font-size:16px;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
#hud .in{max-width:1040px;margin:0 auto;height:100%;padding:0 20px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-family:var(--fh);font-weight:800;font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hud .chp{font-family:var(--fn);font-weight:700;font-size:12px;color:var(--ink-2);white-space:nowrap}
#hud .seg{display:flex;gap:4px;flex:1;max-width:280px}#hud .seg i{display:block;flex:1;height:6px;border-radius:3px;background:#E5E5EA}#hud .seg i.on{background:var(--green)}#hud .seg i.cur{background:var(--blue)}
#hud .hr{display:flex;align-items:center;gap:8px}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--fn);font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:999px;position:relative;white-space:nowrap}
.stat svg{width:15px;height:15px;display:block}
.stat.xp{background:#FFF8DC;color:#8A5A00}.stat.sk{background:#FFF0E6;color:#C2410C}.stat.hp{background:#FFECEC;color:#C92A2A;gap:3px}.stat.af{background:#F7E4EE;color:#B8286A}
.stat .gauge{display:inline-block;width:52px;height:8px;border-radius:99px;background:#F0D0DF;overflow:hidden}.stat .gauge b{display:block;height:100%;width:0;background:#B8286A;transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#1F7A32;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#C92A2A}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer}
/* ---------- 교실 ---------- */
main{max-width:1040px;margin:0 auto;padding:16px 20px 24px}
#room{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:16px;align-items:start}
#board{position:relative}
.frame{padding:12px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 14px 34px rgba(60,40,20,.2),inset 0 2px 0 rgba(255,255,255,.18);position:relative}
.green{position:relative;border-radius:6px;min-height:560px;max-height:max(560px,70vh);display:flex;flex-direction:column;background:radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.06),transparent 42%),repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);overflow:hidden}
/* 칠판 머리표(챕터·단계): 스크롤 칸(#bwrap) 밖, 칠판 위쪽 고정 띠 — 판서가 어디까지 스크롤돼도 글자가 머리표 밑으로 지나가지 않는다(대표님 2026-09-27 「글자 겹쳤다」: sticky 반투명 띠 밑으로 식 윗부분이 비쳤음) */
.chk{flex:0 0 auto;padding:12px 30px 8px;font-family:var(--fk);font-weight:700;font-size:20px;line-height:1.3;color:var(--yel);border-bottom:1px dashed rgba(244,241,232,.22);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk small{font-family:var(--fn);font-size:11px;font-weight:700;color:var(--chalk-2);margin-left:8px;letter-spacing:.04em;vertical-align:middle}
.chk .old{font-family:var(--fb);font-size:11px;color:var(--pink);margin-left:8px;vertical-align:middle;border:1px dashed var(--pink);border-radius:6px;padding:1px 6px}
#bwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 30px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-family:var(--fk);font-weight:700;font-size:24px;line-height:1.5;width:100%;margin:auto 0}
#bc.v1{font-family:var(--fb);font-weight:400;font-size:18px;line-height:1.75}
#bc .katex{color:var(--sky)}#bc .katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* v2 판서 줄 */
.bd-title{font-size:30px;color:var(--yel);margin:0 0 10px;line-height:1.2;text-decoration:underline wavy rgba(255,226,122,.55) 2px;text-underline-offset:6px}
.bl{margin:0 0 8px;padding-left:34px;position:relative;clip-path:inset(0 100% 0 0);transition:clip-path .45s ease-out}
.bl.on{clip-path:inset(0 0 0 0)}.bl.now{clip-path:inset(0 0 0 0);transition:none}
.bl::before{position:absolute;left:4px;top:0;font-size:1em}
.bl.k-li::before{content:"•"}.bl.k-h{padding-left:0;font-size:28px;color:var(--yel);margin-top:6px}.bl.k-h::before{content:""}
.bl.k-f{padding-left:0;text-align:center;font-size:24px}.bl.k-f::before{content:""}.bl.k-f .katex-display{margin:6px 0}.bl.k-f .katex{font-size:1.2em}
.bl.k-pit{color:var(--pink);border:2px dashed rgba(255,163,199,.6);border-radius:10px;padding:6px 12px 6px 38px;margin:6px 0 10px}.bl.k-pit::before{content:"!";left:14px;top:6px;color:var(--pink)}
.bl.k-star{color:var(--yel)}.bl.k-star::before{content:"☆";color:var(--yel)}
.bl.k-res{color:var(--yel)}.bl.k-res::before{content:"→";color:var(--yel)}
.bl.k-memo{border:2px solid rgba(244,241,232,.6);border-radius:10px;padding:6px 12px;margin:10px 0 6px;background:rgba(255,255,255,.05)}.bl.k-memo::before{content:""}
.bl .ul{text-decoration:underline wavy var(--yel) 2px;text-underline-offset:5px}
.bl .katex{color:var(--sky);font-size:.92em}
/* 그림(분필) */
.bd-fig{margin:14px auto 4px;max-width:640px;width:100%}
.bd-fig figure{margin:0}.bd-fig svg{width:100%;height:auto;display:block;overflow:visible}.bd-fig figcaption{display:none}
.bd-fig [data-step][hidden]{display:none}
.bd-fig .pre{opacity:0}   /* 이 단계에서 새로 나올 그림 단계는 그림 차례까지 가림 */
.bd-fig .ck{stroke-linecap:round;stroke-linejoin:round}
.bd-fig .draw{transition:stroke-dashoffset var(--dur,1s) ease-out}
.bd-fig .fade{opacity:0;transition:opacity .35s ease-out}.bd-fig .fade.on{opacity:1}
@media (prefers-reduced-motion: reduce){.bl{transition:none}.bd-fig .draw,.bd-fig .fade{transition:none}}
/* v1(구버전) 판서 상자 */
#bc .tk{font-size:19px}#bc p{margin:0 0 10px}#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc .sub{font-family:var(--fk);font-size:26px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .bx{margin:6px 0 14px;padding:12px 16px 10px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative}
#bc .bx>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75)}#bc .bx.formula>i{color:var(--mint)}#bc .bx.pitfall{border-color:rgba(255,163,199,.7)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7)}#bc .bx.memo>i{color:var(--chalk)}#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
#bc .paper{background:#FFFDF7;color:#1F2A44;border-radius:6px;padding:12px 14px 8px;margin:8px auto 14px;max-width:560px;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}#bc .paper figcaption,#bc .paper .cap{font-size:13.5px;color:#55627A;margin-top:6px}#bc .paper .katex{color:#1F2A44}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}#bc .ex .exq>i,#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px;color:var(--yel)}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}#bc .ex .exa>i{color:var(--mint)}#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz{font-family:var(--fb);font-weight:400;font-size:18px}
#bc .qz .qn{font-family:var(--fk);font-weight:700;font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:19px}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12)}#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--fk);font-weight:700;font-size:22px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--fk);font-size:40px;line-height:1.15;color:var(--chalk);margin:0 0 6px}
#bc .lead{font-family:var(--fb);font-weight:400;color:var(--chalk-2);font-size:17px;margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-family:var(--fb);font-weight:400;font-size:17px}
#bc .toc li{display:flex;align-items:center;gap:12px;padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;font-family:var(--fb);font-weight:400}#bc .res .big{font-family:var(--fk);font-weight:700;font-size:60px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:17px;margin:6px 0 12px}#bc .res .stats b{display:block;font-family:var(--fn);font-size:32px;line-height:1.1}#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700}
#bc .res .badge{margin:4px auto 0;width:130px;height:130px}#bc .res .bl2{font-size:13px;font-weight:700;color:var(--chalk-2);margin-top:4px}#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
.tray{height:18px;margin:0 26px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:7px;width:44px;border-radius:4px;background:var(--chalk)}.tray i.y{left:76px;background:var(--yel)}.tray i.p{left:132px;background:var(--pink)}.tray i.w{left:22px}.tray i.er{left:auto;right:26px;width:60px;height:11px;top:3px;border-radius:3px;background:#1E1E22}
#chpills{margin-top:12px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#chpills .lb{font-size:12px;color:var(--ink-2);font-weight:700;margin-right:4px}
.pill{border:1px solid var(--line);background:#F2F2F7;color:var(--ink-3);font-family:var(--fn);font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.pill.done{background:var(--green-soft);color:var(--green);border-color:transparent}.pill.cur{background:var(--green);color:#fff;border-color:var(--green)}
/* ---------- 오른쪽: 스앵님 · 말풍선 · 선택지 ---------- */
#side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--hud) + 16px)}
#tutorCard{padding:12px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
#tutorCard .nm{align-self:flex-start;display:flex;align-items:center;gap:8px;width:100%}
#tutorCard .nm b{font-family:var(--fh);font-weight:800;font-size:13px}#tutorCard .nm span{font-size:11px;color:var(--ink-3);margin-left:auto}
#tutor{width:150px;height:176px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.14));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
.box{padding:14px 16px 12px;position:relative;min-height:120px}
.box::before{content:"";position:absolute;left:50%;top:-9px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.name{font-family:var(--fh);font-weight:800;font-size:12px;color:var(--green);margin-bottom:4px}.name.prof{color:#7A2E52}
.text{font-size:15.5px;line-height:1.6;min-height:48px;cursor:pointer}
.text .cur{display:inline-block;width:.5em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.tip{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.cbt{font:inherit;font-weight:700;font-size:14.5px;padding:11px 16px;border-radius:12px;cursor:pointer;color:var(--ink);background:#fff;border:1px solid var(--line);transition:transform .08s,filter .15s;width:100%;text-align:center;min-height:44px}
.cbt:hover{filter:brightness(.97)}.cbt:active{transform:translateY(1px)}
.cbt.p{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 10px rgba(27,122,46,.25)}
.cbt.t{background:var(--green-soft);color:var(--green);border-color:transparent}
.cbt.r{background:var(--red);color:#fff;border-color:var(--red)}
.cbt.g{background:#F2F2F7;color:var(--ink-2);border-color:transparent}
.cbt kbd{font-family:var(--fn);font-size:10.5px;opacity:.6;margin-left:6px}
#prog{padding:12px 14px}#prog .k{font-size:12px;color:var(--ink-2);font-weight:700}#prog .v{font-family:var(--fh);font-weight:800;font-size:15px;margin:2px 0 6px}#prog .bar{height:6px;border-radius:3px;background:#E5E5EA;overflow:hidden}#prog .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}#prog .h{font-size:11.5px;color:var(--ink-3);margin-top:6px}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.5);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-family:var(--fh);font-weight:800;font-size:20px}#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#F7F7F7;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--blue)}#ov li .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #CFCFCF;display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700;color:var(--ink-3)}
#ov li.done .st{background:var(--green);border-color:var(--green);color:#fff}#ov li.cur button{border-color:var(--amber);background:#FFF8DC}#ov li small{margin-left:auto;color:var(--ink-3);font-weight:700;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}#ov .row .cbt{width:auto}
/* ---------- 아이패드 세로(768~900): 두 칸은 유지하되 옆 칸을 줄이고 판서 글자를 한 단계 낮춘다 ---------- */
@media(max-width:900px) and (min-width:761px){
  #room{grid-template-columns:minmax(0,1fr) 240px;gap:12px}#tutor{width:120px;height:140px}
  #bc{font-size:21px}.bl.k-h{font-size:25px}.bd-title{font-size:26px}.bl.k-f{font-size:22px}.bl.k-f .katex{font-size:1.05em}.chk{font-size:18px;padding:10px 22px 6px}#bwrap{padding:10px 22px 22px}
  .cbt{font-size:14px;padding:10px 12px}.text{font-size:14.5px}
}
/* ---------- 폰 ---------- */
@media(max-width:760px){
  :root{--hud:50px}
  #hud .in{gap:6px;padding:0 8px}#hud .hl{display:none}#hud .hc{flex:1 1 auto;min-width:70px;gap:6px}#hud .chp{font-size:11px}#hud .hr{gap:4px;flex:0 0 auto}.stat{padding:3px 6px;font-size:11.5px;gap:3px}.stat svg{width:13px;height:13px}.stat .gauge{width:30px;height:7px}#hToc{padding:5px 8px;font-size:12px}
  main{padding:10px 8px 12px}#room{grid-template-columns:minmax(0,1fr);gap:10px}#board,#side{min-width:0}
  .frame{padding:8px;border-radius:10px}.green{min-height:340px;max-height:max(340px,56vh)}#bwrap{padding:8px 14px 18px}.chk{padding:8px 14px 6px;font-size:17px}
  #bc{font-size:19px}.bl.k-h{font-size:23px}.bd-title{font-size:24px}#bc.v1{font-size:16.5px}#bc .ttl{font-size:32px}#bc .res .big{font-size:44px}
  #bc .paper{overflow-x:auto}#bc .paper svg{min-width:460px}.bd-fig{overflow-x:auto}.bd-fig svg{min-width:420px}.bl.k-f .katex{font-size:1em}.bl.k-f{font-size:21px}
  #side{position:static;flex-direction:column}#tutorCard{flex-direction:row;align-items:flex-end;gap:10px;padding:8px 10px}#tutorCard .nm{width:auto;flex-direction:column;align-items:flex-start;gap:0}#tutor{width:84px;height:98px}
  .box::before{display:none}.text{font-size:15px}.cbt{font-size:14px;min-height:42px}.tip{display:none}#prog{display:none}#chpills{display:none}
}

const D={"id": "em1-2026-09-11", "slug": "em1", "course": "공업수학1", "date": "2026-09-11", "sess": "9/11(금) · 2주차", "title": "1.5 선형 ODE — \"이거 하고 이거는 기억을 하라\"", "lead": "이 수업의 전부는 상자 하나다: 표준형 \\(y'+p(x)y=r(x)\\)과 해 공식 \\(y=e^{-h}[\\int e^hr\\,dx+c]\\), \\(h=\\int p\\,dx\\). 교수님은 이것을 네모로 묶고 별표까지 쳤다. 나머지는 <b>어느 해법을 쓸지 고르는 순서<\/b>(플로차트), 예제 넷, RL 회로 응용, 그리고 다음 주 베르누이 예고.", "minutes": 20, "chapters": [{"id": "s1", "title": "지난 시간 정정 · 선형이란 · 표준형", "steps": [{"t": "say", "html": "\"지난 시간에 강의하고 나가는데… 교수님 틀린 게 하나 있어요. <b>이게 p가 아니라 q로 고치세요.<\/b>\" — 1.4 적분인자 정리 1(\\(F(x)\\))의 분모는 \\(Q\\)(9/9 노트 §5)."}, {"t": "talk", "html": "<p><b>선형<\/b> = \\(y\\)와 그 도함수가 1차식으로만(\"첫 시간에 얘기했죠\"). \\(y'+p(x)y=r(x)y^2\\)은 \\(y^2\\) 때문에 비선형. 선형이면 먼저 <b>표준형<\/b>으로 — \\(y'\\)에 어떤 계수도 붙지 않게 나눈다.<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 180\" width=\"560\" height=\"180\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"20\" y=\"30\" width=\"150\" height=\"54\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"95.0\" y=\"55.0\" font-size=\"13.5\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">입력 r(x)<\/text><text x=\"95.0\" y=\"71.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">구동함수 · 힘 · 기전력<\/text><line x1=\"172\" y1=\"57\" x2=\"212\" y2=\"57\" stroke=\"#1F2A44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"216\" y=\"22\" width=\"190\" height=\"70\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"311.0\" y=\"55.0\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y′ + p(x)y = r(x)<\/text><text x=\"311.0\" y=\"71.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">계(system) — 표준형<\/text><line x1=\"408\" y1=\"57\" x2=\"448\" y2=\"57\" stroke=\"#1F2A44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"452\" y=\"30\" width=\"98\" height=\"54\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"501.0\" y=\"55.0\" font-size=\"13.5\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">출력 y<\/text><text x=\"501.0\" y=\"71.0\" font-size=\"9.1\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">응답 · 변위 · 전류<\/text><text x=\"310\" y=\"120\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r(x) = 0 → 제차(homogeneous) · r(x) ≠ 0 → 비제차(nonhomogeneous)<\/text><text x=\"310\" y=\"145\" font-size=\"12.5\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y′ 에 계수가 붙어 있으면 먼저 나눠서 표준형으로<\/text><\/svg><figcaption>선형 1계 ODE 의 공학적 그림: 입력(r)을 넣으면 계(p)가 출력(y)을 내놓는다.<\/figcaption>"}, {"t": "why", "html": "\\(r(x)\\)는 <b>입력<\/b>(구동함수: 외부에서 가한 힘·기전력), 해 \\(y\\)는 <b>출력<\/b>(응답: 변위·전류). 그래서 \\(r=0\\)인 제차는 \"외부 입력 없이 계가 스스로 하는 운동\", 비제차는 \"밀어 줬을 때의 반응\"이다."}, {"t": "analogy", "html": "스피커(계 \\(p\\))에 음원(입력 \\(r\\))을 넣으면 소리(출력 \\(y\\))가 난다. 음원이 0이면(제차) 잔향만 남는다."}, {"t": "memo", "html": "<b>외울 것<\/b> 표준형 \\(y'+p(x)y=r(x)\\) · \\(r=0\\) 제차, \\(r\\ne0\\) 비제차 · \\(r\\)=입력, \\(y\\)=출력"}], "say": null}, {"id": "s2", "title": "해 공식 — 제차는 변수분리, 비제차는 이것 하나 ★★", "steps": [{"t": "formula", "html": "\\[\\text{제차 }y'=-p(x)y:\\ \\frac{dy}{y}=-p\\,dx\\ \\Rightarrow\\ y=c\\,e^{-\\int p\\,dx}\\]"}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"30\" y=\"40\" width=\"130\" height=\"60\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"95.0\" y=\"75.0\" font-size=\"15\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">h = ∫p(x)dx<\/text><line x1=\"162\" y1=\"70\" x2=\"202\" y2=\"70\" stroke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><rect x=\"206\" y=\"30\" width=\"324\" height=\"80\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"368.0\" y=\"68.0\" font-size=\"15.5\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y = e^(−h) [ ∫ e^h · r(x) dx + c ]<\/text><text x=\"368.0\" y=\"84.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">적분인자 F = e^h 를 곱해 완전미분형으로 만든 결과<\/text><text x=\"280\" y=\"136\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">☆ 교수님이 네모로 묶고 별표 — 「이거 하고 이거는 기억을 하라」<\/text><\/svg><figcaption>1.5 절의 전부. p 와 r 만 읽어 내면 대입으로 끝난다.<\/figcaption>"}, {"t": "formula", "html": "\\[h=\\int p(x)\\,dx,\\qquad y(x)=e^{-h}\\Big[\\int e^{h}\\,r(x)\\,dx+c\\Big]\\]"}, {"t": "why", "html": "유도(슬라이드 p.3): \\((py-r)dx+dy=0\\)은 완전이 아니지만 정리 1의 \\(R=\\frac1Q(P_y-Q_x)=p\\) → 적분인자 \\(F=e^{\\int p\\,dx}=e^h\\). 곱하면 \\((e^hy)'=e^hr\\) → 적분해 \\(e^h\\)로 나눈 것이 공식. 1.4가 1.5의 바탕이라는 뜻."}, {"t": "say", "html": "\"<b>이거 하고 이거는 기억을 하라.<\/b> 이게 기억을 못하는데 이제 못 푸는 거야.\" · \"수학의 <b>일정 부분은 외워야 돼요.<\/b> 형태를 — 완전미방이냐 동차냐 선형이냐 비제차 선형이냐 — 잘 보고서 나가야 된다.\" · \"유도 과정은 알면 좋지만 필수는 아니다.\""}, {"t": "analogy", "html": "자판기 공식: 동전 \\(p\\)와 \\(r\\)만 넣으면 \\(y\\)가 나온다. 자판기 내부(유도)는 한 번 들여다보면 되지만, 버튼 위치(공식)는 외워야 한다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(h=\\int p\\,dx\\) · \\(y=e^{-h}[\\int e^hr\\,dx+c]\\) · 특수 함수 적분(\\(\\int\\tan x=\\ln|\\sec x|\\))은 시험에서 준다"}], "say": null}, {"id": "s3", "title": "풀이 흐름도 — 어느 해법을 쓸지 고르는 순서", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 250\" width=\"560\" height=\"250\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><path d=\"M90 24.0 L165.0 50 L90 76.0 L15.0 50 Z\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/path><text x=\"90\" y=\"55\" font-size=\"11.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">M dx + N dy = 0 ?<\/text><line x1=\"165\" y1=\"50\" x2=\"210\" y2=\"50\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"187.5\" y=\"44.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\">예<\/text><path d=\"M300 24.0 L380.0 50 L300 76.0 L220.0 50 Z\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/path><text x=\"300\" y=\"55\" font-size=\"11.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">∂M/∂y = ∂N/∂x ?<\/text><line x1=\"380\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"405.0\" y=\"44.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\">예<\/text><rect x=\"434\" y=\"32\" width=\"116\" height=\"36\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"492.0\" y=\"55.0\" font-size=\"12.5\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">완전미방<\/text><line x1=\"300\" y1=\"76\" x2=\"300\" y2=\"100\" stroke=\"#E03131\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"330.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#E03131\">아니오<\/text><path d=\"M300 102.0 L375.0 126 L300 150.0 L225.0 126 Z\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/path><text x=\"300\" y=\"131\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">동차인가?<\/text><line x1=\"375\" y1=\"126\" x2=\"430\" y2=\"126\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"402.5\" y=\"120.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\">예<\/text><rect x=\"434\" y=\"108\" width=\"116\" height=\"36\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#2F9E44\" stroke-width=\"1.6\"><\/rect><text x=\"492.0\" y=\"131.0\" font-size=\"12.5\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y/x = u 치환<\/text><line x1=\"300\" y1=\"150\" x2=\"300\" y2=\"172\" stroke=\"#E03131\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"330.0\" y=\"161.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#E03131\">아니오<\/text><rect x=\"210\" y=\"174\" width=\"180\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#8A97A6\" stroke-width=\"1.6\"><\/rect><text x=\"300.0\" y=\"199.0\" font-size=\"11.9\" fill=\"#8A97A6\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">적분인자 F (시간 많이 걸림)<\/text><line x1=\"90\" y1=\"76\" x2=\"90\" y2=\"170\" stroke=\"#E03131\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"58.0\" y=\"123.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#E03131\">아니오<\/text><rect x=\"20\" y=\"174\" width=\"140\" height=\"40\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"90.0\" y=\"199.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y′ + p y = r ?<\/text><line x1=\"90\" y1=\"216\" x2=\"90\" y2=\"236\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"90\" y=\"246\" font-size=\"12\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">★ 공식 한 방 (h 구하고 대입)<\/text><\/svg><figcaption>교수님의 판별 순서 — 「머릿속에 그림을 쫙 그려가면서. 플로차트를 그리는 건 어려운 게 아니에요.」<\/figcaption>"}, {"t": "say", "html": "\"이거(적분인자)는 <b>너무 시간이 많이 걸려.<\/b> 딱 보니까 \\(y'+p(x)y=r(x)\\) 이런 선형 비제차면 <b>공식을 이용하면 된다.<\/b>\" · \"머릿속에 그림을 쫙 그려가면서 공부를 해라.\""}, {"t": "why", "html": "1장은 해법이 여러 개라 \"어떤 문제인지 알아보는 눈\"이 실력의 반이다. 완전 판별(\\(M_y=N_x\\))은 한 줄이라 먼저 보고, 동차(\\(y/x\\)), 선형 표준형 순으로 체크한다. 9/16에 \"1장 해법 총정리\"로 다시 정리된다."}, {"t": "analogy", "html": "병원 분류(triage): 증상을 보고 진료과를 정한다. 어느 과인지 맞히면 치료(공식)는 정해져 있다."}, {"t": "memo", "html": "<b>외울 것<\/b> 완전? → 동차? → 적분인자 → 선형 표준형이면 공식 · 형태를 먼저 본다"}], "say": null}, {"id": "s4", "title": "예제 — 별표 예제 1과 연습 3제 ★", "steps": [{"t": "ex", "q": "★ 교재 예제 1 \\(y'+y\\tan x=\\sin2x\\), \\(y(0)=1\\) — 판서에 별표", "a": "<p>\\(p=\\tan x\\), \\(r=\\sin2x=2\\sin x\\cos x\\). \\(h=\\int\\tan x\\,dx=-\\ln\\cos x=\\ln|\\sec x|\\), \\(e^h=\\sec x\\), \\(e^{-h}=\\cos x\\).<\/p><p>\\(y=\\cos x\\Big[\\int\\sec x\\cdot2\\sin x\\cos x\\,dx+c\\Big]=\\cos x\\Big[2\\int\\sin x\\,dx+c\\Big]=\\cos x(-2\\cos x+c)=c\\cos x-2\\cos^2x\\).<\/p><p>\\(y(0)=c-2=1\\) → \\(c=3\\) → <b>\\(y=3\\cos x-2\\cos^2x\\)<\/b>.<\/p>"}, {"t": "say", "html": "\"탄젠트 적분이 \\(\\ln\\sec x\\)라는 거, <b>외울 필요는 없어요.<\/b> 중간·기말에 나오면 <b>내가 공식을 알려줄 거예요.<\/b>\""}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"20\" y=\"40\" width=\"200\" height=\"60\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"120.0\" y=\"68.0\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y′ = 1/(x + y²)<\/text><text x=\"120.0\" y=\"84.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y 에 대해 비선형 (y² 이 분모에)<\/text><line x1=\"222\" y1=\"70\" x2=\"282\" y2=\"70\" stroke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><text x=\"252\" y=\"56\" font-size=\"12\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">역수를 취한다<\/text><rect x=\"286\" y=\"40\" width=\"260\" height=\"60\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"416.0\" y=\"68.0\" font-size=\"14.0\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">dx/dy = x + y²  →  x′ − x = y²<\/text><text x=\"416.0\" y=\"84.0\" font-size=\"9.2\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x 를 y 의 함수로 보면 선형!  p(y) = −1, r(y) = y²<\/text><text x=\"280\" y=\"130\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">「이것만 봐서는 비선형인데 이렇게 바꿔버리면 선형이 된다」<\/text><\/svg><figcaption>연습 2 의 핵심 기술: 독립변수와 종속변수를 바꿔 본다.<\/figcaption>"}, {"t": "ex", "q": "연습 3제 (p.5)", "a": "\n<p><b>1<\/b> \\(x\\,dy/dx+2y=3\\) → 표준형 \\(y'+\\frac2xy=\\frac3x\\), \\(h=2\\ln x\\), \\(e^h=x^2\\): \\(y=x^{-2}[\\int x^2\\cdot\\frac3x\\,dx+c]=x^{-2}[\\frac32x^2+c]\\) → <b>\\(y=\\frac32+\\frac c{x^2}\\)<\/b>.<\/p>\n<p><b>2<\/b> \\(y'=\\frac1{x+y^2}\\) → 역수: \\(\\frac{dx}{dy}=x+y^2\\) → \\(x'-x=y^2\\) (\\(y\\)에 대한 선형). \\(p(y)=-1\\), \\(r(y)=y^2\\), \\(h=-y\\): \\(x=e^{y}[\\int e^{-y}y^2\\,dy+c]=e^y[-e^{-y}(y^2+2y+2)+c]\\) → <b>\\(x=-y^2-2y-2+ce^{y}\\)<\/b>.<\/p>\n<p><b>3<\/b> \\((1+e^x)y'+e^xy=0\\) → \\(y'+\\frac{e^x}{1+e^x}y=0\\), \\(h=\\ln(1+e^x)\\), \\(r=0\\) → <b>\\(y=\\frac{c}{1+e^x}\\)<\/b>.<\/p>"}, {"t": "why", "html": "2번이 핵심 기술: \\(y\\)에 대해 풀면 비선형이지만 <b>\\(x\\)를 \\(y\\)의 함수로 보면<\/b> 선형. 독립변수를 바꿔 보는 눈 — \"이것만 봐서는 비선형인데 이렇게 바꿔버리면 선형이 된다\"."}, {"t": "analogy", "html": "사진을 90° 돌려 보면 다른 그림이 보이듯, \\(x\\)-\\(y\\) 역할을 바꾸면 풀리는 문제가 있다."}, {"t": "memo", "html": "<b>외울 것<\/b> 예제 1 답 \\(3\\cos x-2\\cos^2x\\) · 연습 2의 역수 기술 · 표준형으로 나누기(연습 1·3) · 과제 1.5 #9·#12 = 같은 유형(\"굉장히 쉬워\")"}], "say": null}, {"id": "s5", "title": "공학 응용 — RL 회로", "steps": [{"t": "talk", "html": "<p>키르히호프 두 법칙: <b>전류 법칙(KCL)<\/b> 한 노드에서 들어오는 전류 합 = 나가는 전류 합, <b>전압 법칙(KVL)<\/b> 폐회로에서 전압강하의 합 = 가해진 기전력.<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 220\" width=\"560\" height=\"220\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"40\" y=\"40\" width=\"200\" height=\"130\" rx=\"0\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2.2\"><\/rect><line x1=\"40\" y1=\"95\" x2=\"40\" y2=\"115\" stroke=\"#fff\" stroke-width=\"6\"><\/line><line x1=\"30\" y1=\"95\" x2=\"50\" y2=\"95\" stroke=\"#1F2A44\" stroke-width=\"2.5\"><\/line><line x1=\"35\" y1=\"115\" x2=\"45\" y2=\"115\" stroke=\"#1F2A44\" stroke-width=\"3.5\"><\/line><text x=\"18\" y=\"110\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">E<\/text><text x=\"4\" y=\"126\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">48 V<\/text><rect x=\"120\" y=\"30\" width=\"50\" height=\"20\" rx=\"0\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"2\"><\/rect><text x=\"145\" y=\"22\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">R = 11 Ω<\/text><text x=\"145\" y=\"66\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전압강하 iR<\/text><path d=\"M240 80 c 12 0 12 14 0 14 c 12 0 12 14 0 14 c 12 0 12 14 0 14\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2.5\"><\/path><text x=\"268\" y=\"104\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">L = 0.1 H<\/text><text x=\"268\" y=\"120\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">L·di/dt<\/text><line x1=\"80\" y1=\"170\" x2=\"120\" y2=\"170\" stroke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><text x=\"100.0\" y=\"184.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\">i(t)<\/text><line x1=\"330\" y1=\"180\" x2=\"540\" y2=\"180\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"330\" y1=\"180\" x2=\"330\" y2=\"180\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"536\" y=\"198\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">t<\/text><text x=\"324\" y=\"184\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i<\/text><line x1=\"330\" y1=\"180\" x2=\"330\" y2=\"60\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><path d=\"M330.0 180.0 L332.5 173.0 L335.0 166.6 L337.5 160.5 L340.0 154.8 L342.5 149.6 L345.0 144.6 L347.5 140.0 L350.0 135.7 L352.5 131.7 L355.0 128.0 L357.5 124.5 L360.0 121.2 L362.5 118.2 L365.0 115.3 L367.5 112.7 L370.0 110.2 L372.5 107.9 L375.0 105.7 L377.5 103.7 L380.0 101.8 L382.5 100.1 L385.0 98.4 L387.5 96.9 L390.0 95.5 L392.5 94.1 L395.0 92.9 L397.5 91.7 L400.0 90.6 L402.5 89.6 L405.0 88.7 L407.5 87.8 L410.0 87.0 L412.5 86.2 L415.0 85.5 L417.5 84.8 L420.0 84.2 L422.5 83.6 L425.0 83.0 L427.5 82.5 L430.0 82.0 L432.5 81.6 L435.0 81.2 L437.5 80.8 L440.0 80.4 L442.5 80.1 L445.0 79.8 L447.5 79.5 L450.0 79.2 L452.5 79.0 L455.0 78.7 L457.5 78.5 L460.0 78.3 L462.5 78.1 L465.0 77.9 L467.5 77.7 L470.0 77.6 L472.5 77.4 L475.0 77.3 L477.5 77.2 L480.0 77.1 L482.5 76.9 L485.0 76.8 L487.5 76.7 L490.0 76.6 L492.5 76.6 L495.0 76.5 L497.5 76.4 L500.0 76.3 L502.5 76.3 L505.0 76.2 L507.5 76.2 L510.0 76.1 L512.5 76.1 L515.0 76.0 L517.5 76.0 L520.0 75.9 L522.5 75.9 L525.0 75.9 L527.5 75.8 L530.0 75.8\" fill=\"none\" stroke=\"#E03131\" stroke-width=\"2.6\"><\/path><line x1=\"330\" y1=\"75.35999999999999\" x2=\"540\" y2=\"75.35999999999999\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><text x=\"536\" y=\"69.35999999999999\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">E/R = 4.36 A<\/text><text x=\"435\" y=\"210\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">L·i′ + R·i = E  →  i′ + (R/L)i = E/L<\/text><\/svg><figcaption>RL 회로(KVL): 전압강하 합 = 기전력. 독립변수만 t 로 바뀐 같은 선형 공식. 전류는 E/R 로 수렴.<\/figcaption>"}, {"t": "formula", "html": "\\[Li'+Ri=E\\ \\Rightarrow\\ i'+\\frac RLi=\\frac EL,\\quad h=\\frac RLt,\\quad i(t)=e^{-h}\\Big[\\int e^{h}\\frac EL\\,dt+c\\Big]=\\frac ER+ce^{-Rt/L}\\ \\xrightarrow{i(0)=0}\\ i(t)=\\frac ER\\big(1-e^{-Rt/L}\\big)\\]"}, {"t": "why", "html": "저항의 전압강하 \\(iR\\), 코일의 전압강하 \\(L\\,di/dt\\)를 KVL로 더하면 바로 선형 1계. 독립변수가 \\(t\\)일 뿐 \\(p=R/L\\), \\(r=E/L\\)로 \"똑같은 공식\". \\(R=11\\,\\Omega\\), \\(E=48\\) V, \\(L=0.1\\) H면 \\(E/R=4.36\\) A로 수렴하고 시간상수 \\(L/R\\approx9\\) ms — 최종식은 판서에 없어 슬라이드 Ex.2 흐름으로 아톰이 마무리했다."}, {"t": "say", "html": "\"기계공학과인데 회로를 공부해요. … 2학년 혹은 3학년 때 전기전자 과목도 하나 있을 거야.\""}, {"t": "analogy", "html": "수도꼭지를 확 틀어도 호스 끝의 물줄기는 천천히 세진다 — 코일(L)이 전류의 급변을 막는 \"관성\"이고, 그래서 지수 곡선으로 올라간다."}, {"t": "memo", "html": "<b>외울 것<\/b> KVL: \\(Li'+Ri=E\\) · 정상 전류 \\(E/R\\) · 시간상수 \\(L/R\\) · 같은 공식(변수만 \\(t\\))"}], "say": null}, {"id": "s6", "title": "베르누이 방정식 예고 — 비선형이지만 치환으로 선형", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 140\" width=\"560\" height=\"140\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"20\" y=\"34\" width=\"180\" height=\"60\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"110.0\" y=\"62.0\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y′ + p y = g·y^a<\/text><text x=\"110.0\" y=\"78.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a ≠ 0, 1 이면 비선형<\/text><line x1=\"202\" y1=\"64\" x2=\"250\" y2=\"64\" stroke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><text x=\"226\" y=\"24\" font-size=\"12\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = y^(1−a)<\/text><rect x=\"254\" y=\"34\" width=\"200\" height=\"60\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"354.0\" y=\"62.0\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u′ + (1−a)p·u = (1−a)g<\/text><text x=\"354.0\" y=\"78.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u 에 대한 비제차 선형 → 공식<\/text><line x1=\"456\" y1=\"64\" x2=\"500\" y2=\"64\" stroke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><text x=\"478\" y=\"50\" font-size=\"11.5\" fill=\"#2F9E44\" text-anchor=\"middle\" =1\\)의 해는?", "choices": [{"html": "\\(y=3\\cos x-2\\cos^2x\\)", "ok": true}, {"html": "\\(y=\\cos x-2\\cos^2x\\)", "ok": false}, {"html": "\\(y=3\\cos x+2\\cos^2x\\)", "ok": false}, {"html": "\\(y=3\\sin x-2\\sin^2x\\)", "ok": false}], "ans": "\\(y=c\\cos x-2\\cos^2x\\), \\(y(0)=c-2=1\\)."}, {"id": "q4", "qn": "확인 4 · 역수 기술", "html": "\\(y'=\\dfrac{1}{x+y^2}\\)를 푸는 첫 단계로 옳은 것은?", "choices": [{"html": "역수를 취해 \\(dx/dy=x+y^2\\), 즉 \\(x'-x=y^2\\) — \\(y\\)에 대한 선형", "ok": true}, {"html": "\\(y=ux\\) 치환(동차형)", "ok": false}, {"html": "변수분리 \\(dy=dx/(x+y^2)\\)", "ok": false}, {"html": "완전미분방정식 판별 후 적분인자", "ok": false}], "ans": "\\(x\\)를 \\(y\\)의 함수로 보면 선형. 결과 \\(x=-y^2-2y-2+ce^y\\)."}, {"id": "q5", "qn": "확인 5 · RL 회로", "html": "\\(Li'+Ri=E\\), \\(i(0)=0\\)의 해는?", "choices": [{"html": "\\(i=\\dfrac ER\\big(1-e^{-Rt/L}\\big)\\)", "ok": true}, {"html": "\\(i=\\dfrac ER e^{-Rt/L}\\)", "ok": false}, {"html": "\\(i=\\dfrac EL t\\)", "ok": false}, {"html": "\\(i=\\dfrac ER\\big(1-e^{-Lt/R}\\big)\\)", "ok": false}], "ans": "\\(p=R/L\\), \\(r=E/L\\), \\(h=Rt/L\\). 정상값 \\(E/R\\), 지수는 \\(R/L\\)(4번은 뒤집힘)."}, {"id": "q6", "qn": "확인 6 · 베르누이", "html": "\\(y'+p(x)y=g(x)y^a\\)를 선형으로 만드는 치환과, 로지스틱 \\(y'=Ay-By^2\\)에 적용한 결과를 쓰라.", "choices": null, "ans": "\\(u=y^{1-a}\\) → \\(u'+(1-a)pu=(1-a)g\\). 로지스틱은 \\(a=2\\), \\(u=1/y\\) → \\(u'+Au=B\\)(\\(p=A\\), \\(r=B\\), \\(h=Ax\\)). 마지막에 \\(y=1/u\\)로 되돌린다."}], "v": 1, "ver": ""};
