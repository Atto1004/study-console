<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2.2 상수계수 제차 선형 ODE — 특성방정식 하나로 세 가지 해</title>
<!-- 교실 모드 템플릿 v1.1 (캐릭터 = docs/tools/tutor.svg 인라인, 이름 김주영 스앵님) (대표님 2026-09-26 결정: 초록 칠판 + 스앵님(김주영 미니버전) 캐릭터가 알려주는 느낌 · 목차/챕터 · 듀오링고식 XP·스트릭·하트·호감도 · 시스템은 최대한 심플)
     build_classroom.py 가 제목·자료(JSON)·교재 경로 자리를 채운다. 저장: localStorage mc-tutor(전역 XP·스트릭·하트·호감도·회차 위치) + mc-lesson-<id>(읽음·문제, 교재 페이지·앱 V52 와 공유) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--wall:#F4EEE2;--wood:#7A4E2B;--wood-2:#5C3A1E;--green:#2F5F4E;--green-2:#25503F;--chalk:#F5F2E9;--chalk-2:rgba(245,242,233,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --ink:#1F2A44;--ink-2:#55627A;--ink-3:#7C889B;--du-green:#58CC02;--du-green-2:#46A302;--du-blue:#1CB0F6;--du-blue-2:#1899D6;--du-red:#FF4B4B;--du-red-2:#EA2B2B;--du-gray:#E5E5E5;--du-gray-2:#CFCFCF;--du-yel:#FFC800;--du-orange:#FF9600;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--pen:"Nanum Pen Script","Pretendard Variable",sans-serif;--fs:19px;--hud:56px}
*{box-sizing:border-box}
html{background:var(--wall)}
body{margin:0;font-family:var(--f);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.6;
  background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.7),transparent 42%),radial-gradient(circle at 80% 90%,rgba(255,225,170,.35),transparent 46%),var(--wall);min-height:100vh}
button{font-family:inherit}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:2px solid rgba(31,42,68,.08)}
#hud .in{max-width:1000px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
#hud .chp{font-size:12.5px;font-weight:800;color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
#hud .pbar{flex:1;height:14px;border-radius:99px;background:#E6E2D6;overflow:hidden;position:relative}
#hud .pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7ED957,#58CC02);transition:width .45s cubic-bezier(.2,.8,.2,1)}
#hud .pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
#hud .hr{display:flex;align-items:center;gap:10px}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--ink-2);padding:4px 8px;border-radius:12px;background:rgba(255,255,255,.7);border:2px solid rgba(31,42,68,.06);position:relative}
.stat svg{width:18px;height:18px;display:block}
.stat small{font-weight:700;color:var(--ink-3);font-size:11px}
.stat.xp{color:#B26A00}.stat.sk{color:#E8590C}.stat.hp{color:#E03131;gap:2px}.stat.af{color:#D0397A}
.stat.hp svg{width:17px}
.stat .gauge{display:inline-block;width:56px;height:9px;border-radius:99px;background:#F1D4E0;overflow:hidden}
.stat .gauge b{display:block;height:100%;width:0;background:linear-gradient(90deg,#F783AC,#D0397A);transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#2B8A3E;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#E03131}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:0;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer;border-bottom:3px solid #000}
#hToc:active{transform:translateY(1px);border-bottom-width:2px}
/* ---------- 교실 ---------- */
main{max-width:1000px;margin:0 auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - var(--hud))}
#board{position:relative;flex:1;display:flex;flex-direction:column;min-height:360px}
.frame{flex:1;display:flex;padding:14px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 18px 40px rgba(60,40,20,.22),inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.25);position:relative}
.frame::before{content:"";position:absolute;inset:6px;border-radius:10px;border:2px solid rgba(255,255,255,.08);pointer-events:none}
.green{flex:1;position:relative;border-radius:6px;background:
  radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.07),transparent 42%),radial-gradient(ellipse at 78% 74%,rgba(255,255,255,.05),transparent 40%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chk{position:absolute;left:18px;top:12px;font-family:var(--pen);font-size:22px;color:var(--yel);letter-spacing:.02em;opacity:.95;z-index:2;text-shadow:0 0 2px rgba(255,226,122,.35)}
.chk small{font-family:var(--f);font-size:11.5px;font-weight:800;color:var(--chalk-2);margin-left:8px;letter-spacing:.06em;vertical-align:middle}
#bwrap{flex:1;overflow:auto;padding:46px 34px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bc{margin:auto 0;width:100%}  /* 짧은 판서는 세로 가운데, 긴 판서는 위에서부터 스크롤 */
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-size:var(--fs);line-height:1.75;text-shadow:0 0 1px rgba(255,255,255,.28);max-width:840px}
#bc>*{animation:write .5s ease-out both}
#bc>*:nth-child(2){animation-delay:.15s}#bc>*:nth-child(3){animation-delay:.3s}#bc>*:nth-child(4){animation-delay:.45s}#bc>*:nth-child(n+5){animation-delay:.6s}
@keyframes write{from{opacity:0;transform:translateY(6px);filter:blur(1px)}to{opacity:1;transform:none;filter:none}}
#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc p{margin:0 0 12px}
#bc .sub{font-family:var(--pen);font-size:28px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .tk{font-size:calc(var(--fs) + 1px)}
#bc .katex{color:var(--chalk);font-size:1.06em}#bc .katex-display{margin:12px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
#bc a{color:var(--sky)}
#bc table{border-collapse:collapse;margin:8px 0;font-size:.92em}#bc td,#bc th{border:1px dashed rgba(245,242,233,.45);padding:5px 10px;text-align:left}#bc th{color:var(--yel)}
#bc ul,#bc ol{margin:6px 0 10px;padding-left:24px}
/* 상자들: 분필 테두리 */
#bc .bx{margin:6px 0 14px;padding:14px 18px 12px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative;font-size:var(--fs)}
#bc .bx>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;line-height:1;margin-bottom:8px;letter-spacing:.02em}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}
#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75);background:rgba(255,255,255,.05)}#bc .bx.formula>i{color:var(--mint)}
#bc .bx.pitfall{border-color:rgba(255,163,199,.7);background:rgba(255,120,160,.07)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7);background:rgba(255,255,255,.05)}#bc .bx.memo>i{color:var(--chalk)}
#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
/* 붙임 자료(그림): 칠판에 붙인 종이 — 그림은 교재와 같은 원본 그대로(색·글자 검증 유지) */
#bc .paper{background:#FFFDF7;color:var(--ink);text-shadow:none;border-radius:6px;padding:14px 16px 10px;margin:8px auto 16px;max-width:600px;box-shadow:0 10px 24px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.6) inset;transform:rotate(-.8deg);position:relative;text-align:center}
#bc .paper::before{content:"";position:absolute;left:50%;top:-10px;width:78px;height:20px;margin-left:-39px;background:rgba(255,224,130,.75);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}
#bc .paper figcaption,#bc .paper .cap{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.5;text-align:center}
#bc .paper b{color:var(--ink)}#bc .paper .katex{color:var(--ink)}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
/* 예제 */
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}
#bc .ex .exq>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--yel);line-height:1;margin-bottom:6px}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}
#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz .qn{font-family:var(--pen);font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:calc(var(--fs) + 1px)}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-weight:900;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12);transform:translateY(-1px)}
#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz .cb .katex{color:inherit}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}
#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--pen);font-size:44px;line-height:1.15;color:var(--chalk);margin:0 0 6px;text-shadow:0 0 3px rgba(255,255,255,.2)}
#bc .lead{color:var(--chalk-2);font-size:calc(var(--fs) - 1px);margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
#bc .toc li{display:flex;align-items:center;gap:12px;font-size:var(--fs);padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-size:13px;font-weight:900}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}
#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;padding:10px 0 0}
#bc .res .big{font-family:var(--pen);font-size:64px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:var(--fs);margin:6px 0 12px}
#bc .res .stats b{display:block;font-size:34px;line-height:1.1}
#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700;letter-spacing:.04em}
#bc .res .badge{margin:4px auto 0;width:140px;height:140px}
#bc .res .bl{font-size:13px;font-weight:800;color:var(--chalk-2);letter-spacing:.04em;margin-top:4px}
#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
/* 분필 받침 */
.tray{height:20px;margin:0 30px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:8px;width:48px;border-radius:4px;background:#F5F2E9;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tray i.y{left:80px;background:var(--yel)}.tray i.p{left:140px;background:var(--pink)}.tray i.w{left:24px}
.tray i.er{left:auto;right:30px;width:64px;height:12px;top:3px;border-radius:3px;background:linear-gradient(180deg,#2B2B33,#111);}
/* ---------- 대화 ---------- */
#dlg{display:flex;align-items:flex-end;gap:14px;min-height:170px}
#tutor{flex:0 0 170px;width:170px;height:200px;margin-bottom:-6px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
.box{flex:1;min-width:0;background:#fff;border:2px solid rgba(31,42,68,.12);border-radius:18px;padding:16px 18px 14px;box-shadow:0 12px 30px rgba(31,42,68,.10);position:relative;min-height:150px;display:flex;flex-direction:column}
.box::before{content:"";position:absolute;left:-12px;bottom:46px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.name{position:absolute;left:16px;top:-14px;background:var(--ink);color:#FFE27A;font-family:var(--pen);font-size:22px;line-height:1;padding:5px 14px 4px;border-radius:10px;letter-spacing:.03em;border-bottom:3px solid #000}
.name.prof{background:#7A2E52;color:#FFD6E7}
.text{flex:1;font-size:18px;line-height:1.65;padding:8px 0 10px;min-height:56px;cursor:pointer}
.text .cur{display:inline-block;width:.55em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.choices{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cbt{border:0;font:inherit;font-weight:800;font-size:15.5px;padding:11px 18px;border-radius:14px;cursor:pointer;color:#fff;background:var(--du-blue);border-bottom:4px solid var(--du-blue-2);transition:transform .08s,filter .15s;letter-spacing:-.01em;min-height:46px}
.cbt:hover{filter:brightness(1.05)}.cbt:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.cbt.p{background:var(--du-green);border-bottom-color:var(--du-green-2)}
.cbt.g{background:#fff;color:var(--ink-2);border:2px solid var(--du-gray);border-bottom:4px solid var(--du-gray)}
.cbt.g:active{border-bottom-width:2px}
.cbt.r{background:var(--du-red);border-bottom-color:var(--du-red-2)}
.cbt.y{background:var(--du-yel);border-bottom-color:#E5A800;color:#4A3600}
.cbt kbd{font:inherit;font-size:11px;opacity:.7;margin-left:6px}
.choices .sp{flex:1}
.tip{font-size:12.5px;color:var(--ink-3);margin-left:auto}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.55);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-size:22px}
#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:#F7F7F7;border:2px solid #EEE;border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--du-blue)}
#ov li .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #CFCFCF;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--ink-3)}
#ov li.done .st{background:var(--du-green);border-color:var(--du-green);color:#fff}
#ov li.cur button{border-color:var(--du-yel);background:#FFF8DC}
#ov li small{margin-left:auto;color:var(--ink-3);font-weight:700;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* ---------- 폰 ---------- */
@media(max-width:640px){
  :root{--fs:16.5px;--hud:50px}
  /* 폰 HUD: 과목 이름은 칠판 위 태그에 있으니 숨기고 CH n/m + 진행 막대 + 수치만 */

<script>
const D={"id": "em1-2026-09-18", "slug": "em1", "course": "공업수학1", "date": "2026-09-18", "sess": "9/18(금) · 3주차", "title": "2.2 상수계수 제차 선형 ODE — 특성방정식 하나로 세 가지 해", "lead": "이 회차는 결석이라 슬라이드 p.19~26으로 재구성했다(교수님 발언 없음). 내용은 2장의 심장: \\(y''+ay'+by=0\\)에 \\(y=e^{\\lambda x}\\)를 넣으면 <b>특성방정식<\/b> \\(\\lambda^2+a\\lambda+b=0\\)이 나오고, 근이 <b>실근 둘 / 중근 / 복소근<\/b>인지에 따라 일반해가 세 가지로 갈린다. 표 하나만 외우면 나머지는 대입. 앞에 9/16 예제 1의 마무리, 뒤에 2.3 미분연산자.", "minutes": 20, "chapters": [{"id": "s1", "title": "2.1 Ex.7 마무리 — 차수축소로 기저 완성", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 140\" width=\"560\" height=\"140\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"26\" width=\"118\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"73.0\" y=\"52.0\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₁ = x<\/text><text x=\"73.0\" y=\"68.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">p = −1/(x−1)<\/text><line x1=\"134\" y1=\"54\" x2=\"166\" y2=\"54\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"170\" y=\"26\" width=\"150\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"245.0\" y=\"52.0\" font-size=\"11.1\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">U = (1/y₁²)e^(−∫p dx)<\/text><text x=\"245.0\" y=\"68.0\" font-size=\"10.3\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= (x−1)/x² = 1/x − 1/x²<\/text><line x1=\"322\" y1=\"54\" x2=\"354\" y2=\"54\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"358\" y=\"26\" width=\"90\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"403.0\" y=\"52.0\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">u = ∫U dx<\/text><text x=\"403.0\" y=\"68.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ln|x| + 1/x<\/text><line x1=\"450\" y1=\"54\" x2=\"482\" y2=\"54\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"486\" y=\"26\" width=\"64\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"518.0\" y=\"52.0\" font-size=\"15\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y₂<\/text><text x=\"518.0\" y=\"68.0\" font-size=\"8.1\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x ln|x| + 1<\/text><text x=\"280\" y=\"120\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">기저 {x, x ln|x| + 1} → 일반해 y = c₁x + c₂(x ln|x| + 1)<\/text><\/svg><figcaption>2.1 Ex.7 마무리 — 9/16 에 설정한 예제 1 의 계산.<\/figcaption>"}, {"t": "formula", "html": "\\[p=-\\frac{x}{x^2-x}=-\\frac1{x-1},\\quad e^{-\\int p\\,dx}=e^{\\ln|x-1|}=x-1,\\quad U=\\frac{x-1}{x^2}=\\frac1x-\\frac1{x^2},\\quad y_2=x\\int U\\,dx=x\\Big(\\ln|x|+\\frac1x\\Big)=x\\ln|x|+1\\]"}, {"t": "why", "html": "검산: \\(y_2'=\\ln|x|+1\\), \\(y_2''=1/x\\) → \\((x^2-x)\\cdot\\frac1x-x(\\ln|x|+1)+(x\\ln|x|+1)=(x-1)-x\\ln|x|-x+x\\ln|x|+1=0\\) ✓. \\(y_2/y_1=\\ln|x|+1/x\\)는 상수가 아니므로 \\(\\{x,\\ x\\ln|x|+1\\}\\)는 기저. 과제 2.1 #6·#9가 이 유형."}, {"t": "analogy", "html": "퍼즐 조각 하나(\\(y_1\\))의 모양을 알면 옆 조각(\\(y_2\\))의 모양이 정해진다 — 공식은 그 \"맞물림 규칙\", 검산은 끼워 보는 것."}, {"t": "memo", "html": "<b>외울 것<\/b> 표준형에서 \\(p\\) → \\(e^{-\\int p}\\) → \\(U=e^{-\\int p}/y_1^2\\) → \\(y_2=y_1\\int U\\) · 결과는 반드시 대입 검산"}], "say": null}, {"id": "s2", "title": "2.2 특성방정식과 세 경우 ★★ (중간 핵심)", "steps": [{"t": "formula", "html": "\\[y''+ay'+by=0,\\quad y=e^{\\lambda x}\\ \\Rightarrow\\ (\\lambda^2+a\\lambda+b)e^{\\lambda x}=0\\ \\Rightarrow\\ \\boxed{\\lambda^2+a\\lambda+b=0}\\quad(\\text{특성방정식})\\]"}, {"t": "talk", "html": "<table><tr><th>판별식 \\(a^2-4b\\)<\/th><th>근<\/th><th>일반해<\/th><\/tr>\n<tr><td>\\(&gt;0\\)<\/td><td>서로 다른 실근 \\(\\lambda_1,\\lambda_2\\)<\/td><td><b>\\(y=c_1e^{\\lambda_1x}+c_2e^{\\lambda_2x}\\)<\/b><\/td><\/tr>\n<tr><td>\\(=0\\)<\/td><td>실 이중근 \\(\\lambda=-a/2\\)<\/td><td><b>\\(y=(c_1+c_2x)e^{-ax/2}\\)<\/b><\/td><\/tr>\n<tr><td>\\(&lt;0\\)<\/td><td>공액복소근 \\(-\\tfrac a2\\pm i\\omega\\), \\(\\omega=\\sqrt{b-a^2/4}\\)<\/td><td><b>\\(y=e^{-ax/2}(A\\cos\\omega x+B\\sin\\omega x)\\)<\/b><\/td><\/tr><\/table>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 185\" width=\"560\" height=\"185\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"20\" y1=\"150\" x2=\"170\" y2=\"150\" stroke=\"#8A97A6\" stroke-width=\"1\"><\/line><line x1=\"20.0\" y1=\"50\" x2=\"20.0\" y2=\"150\" stroke=\"#8A97A6\" stroke-width=\"1\"><\/ 89.4 88.6 L491.2 87.2 L493.1 87.6 L495.0 89.7 L496.9 93.1 L498.8 97.2 L500.6 101.5 L502.5 105.4 L504.4 108.4 L506.2 110.1 L508.1 110.3 L510.0 109.1 L511.9 106.8 L513.8 103.6 L515.6 100.1 L517.5 96.7 L519.4 94.0 L521.2 92.2 L523.1 91.6 L525.0 92.1 L526.9 93.7 L528.8 96.1 L530.6 98.9 L532.5 101.7 L534.4 104.1 L536.2 105.9 L538.1 106.8 L540.0 106.7\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"2.4\"><\/path><text x=\"465\" y=\"36\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">III  복소근 (진동)<\/text><text x=\"465\" y=\"172\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y = e^(−0.2x) sin 3x (Ex.5)<\/text><\/svg><figcaption>특성방정식의 근이 세 가지 → 해의 모양이 세 가지. 감쇠 진동 시스템(2.4)의 과감쇠·임계·저감쇠가 바로 이 셋.<\/figcaption>"}, {"t": "why", "html": "왜 \\(e^{\\lambda x}\\)를 넣나: 미분해도 모양이 안 변하는 유일한 함수라, 상수계수 식에 넣으면 \\(e^{\\lambda x}\\)가 공통으로 빠지고 <b>2차방정식<\/b>만 남는다. 미분방정식이 중학교 2차방정식으로 바뀌는 순간. 근이 둘이면 기저가 바로 나오고(중첩 원리로 일반해), 하나(중근)면 차수축소로 둘째 해를 만들고, 복소면 오일러 공식으로 실수 해를 뽑는다."}, {"t": "analogy", "html": "스프링에 매단 추(2.4): 기름이 걸쭉하면 스르륵 멈추고(과감쇠, I), 딱 맞으면 가장 빨리 멈추고(임계, II), 묽으면 흔들리며 잦아든다(저감쇠, III). 세 경우가 그림 그대로다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\lambda^2+a\\lambda+b=0\\) · I \\(c_1e^{\\lambda_1x}+c_2e^{\\lambda_2x}\\) · II \\((c_1+c_2x)e^{-ax/2}\\) · III \\(e^{-ax/2}(A\\cos\\omega x+B\\sin\\omega x)\\), \\(\\omega=\\sqrt{b-a^2/4}\\)"}], "say": null}, {"id": "s3", "title": "왜 그런가 — Case II 유도(차수축소) · Case III 유도(오일러 공식)", "steps": [{"t": "formula", "html": "\\[\\text{II: }\\lambda_1=\\lambda_2=-\\tfrac a2\\ \\Rightarrow\\ y_1=e^{-ax/2}\\text{ 하나뿐}\\ \\Rightarrow\\ y_2=u\\,y_1,\\ \\text{차수축소하면 }u''=0\\ \\Rightarrow\\ u=x\\ \\Rightarrow\\ y_2=xe^{-ax/2}\\]"}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 190\" width=\"560\" height=\"190\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"120\" cy=\"100\" r=\"70\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/circle><line x1=\"40\" y1=\"100\" x2=\"200\" y2=\"100\" stroke=\"#8A97A6\" stroke-width=\"1\"><\/line><line x1=\"120\" y1=\"20\" x2=\"120\" y2=\"180\" stroke=\"#8A97A6\" stroke-width=\"1\"><\/line><line x1=\"120\" y1=\"100\" x2=\"157.82116141076978\" y2=\"41.09703106344725\" stroke=\"#E03131\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"><\/line><circle cx=\"157.82116141076978\" cy=\"41.09703106344725\" r=\"5\" fill=\"#E03131\"><\/circle><line x1=\"157.82116141076978\" y1=\"100\" x2=\"157.82116141076978\" y2=\"41.09703106344725\" stroke=\"#2F9E44\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"><\/line><text x=\"172\" y=\"46\" font-size=\"11.5\" fill=\"#2F9E44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">sin t<\/text><text x=\"139\" y=\"114\" font-size=\"11.5\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">cos t<\/text><path d=\"M134.2 78.2 A 26 26 0 0 1 146.0 100.0\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"1.2\"><\/path><text x=\"151.6\" y=\"86.8\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">t<\/text><text x=\"163.82116141076978\" y=\"27.097031063447247\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">e^(it)<\/text><text x=\"390\" y=\"60\" font-size=\"16\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">e^(it) = cos t + i sin t<\/text><text x=\"390\" y=\"90\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">e^((p ± iq)x) = e^(px)(cos qx ± i sin qx)<\/text><text x=\"390\" y=\"118\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">실수 해 둘: e^(px)cos qx,  e^(px)sin qx<\/text><text x=\"390\" y=\"148\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(합과 차를 2, 2i 로 나눠 — 중첩 원리)<\/text><\/svg><figcaption>오일러 공식: 복소 지수는 단위원 위의 회전. 그래서 복소근이면 해가 진동(cos·sin)한다.<\/figcaption>"}, {"t": "formula", "html": "\\[\\text{III: }e^{(p\\pm iq)x}=e^{px}(\\cos qx\\pm i\\sin qx)\\ \\Rightarrow\\ \\tfrac12(y_1+y_2)=e^{px}\\cos qx,\\ \\tfrac1{2i}(y_1-y_2)=e^{px}\\sin qx\\]"}, {"t": "why", "html": "중근이면 해가 하나라 기저가 안 된다 → 9/16 차수축소법이 여기서 바로 쓰인다(그래서 배웠다). \\(p=-a/2\\)에서 \\(2y_1'+py_1=-ay_1+ay_1=0\\)이 되어 \\(u''=0\\) — \\(u=x\\)가 가장 간단한 둘째 해. 복소근은 \\(e^{i\\theta}=\\cos\\theta+i\\sin\\theta\\)로 풀면 실수부·허수부가 각각 해(중첩 원리로 합·차를 취한 것)라, 결국 <b>진동 × 지수 감쇠<\/b>."}, {"t": "analogy", "html": "쌍둥이 근(중근)은 한 명처럼 보이니 \\(x\\)라는 명찰을 붙여 구별하고, 복소근은 \"회전\"이라 cos·sin으로 번역한다."}, {"t": "memo", "html": "<b>외울 것<\/b> 중근 → \\(x\\) 붙는 이유 = 차수축소 \\(u''=0\\) · 오일러 \\(e^{it}=\\cos t+i\\sin t\\) · 복소근 = 지수 감쇠 × 진동"}], "say": null}, {"id": "s4", "title": "Ex.2 · Ex.4 · Ex.5 — 초기값 문제 세 경우 한 번씩", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 120\" width=\"560\" height=\"120\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"24\" width=\"118\" height=\"54\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"73.0\" y=\"49.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">① 특성방정식<\/text><text x=\"73.0\" y=\"65.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">λ² + aλ + b = 0<\/text><line x1=\"134\" y1=\"51\" x2=\"160\" y2=\"51\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><rect x=\"164\" y=\"24\" width=\"110\" height=\"54\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"219.0\" y=\"49.0\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">② 경우 판별<\/text><text x=\"219.0\" y=\"65.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a² − 4b 의 부호<\/text><line x1=\"276\" y1=\"51\" x2=\"302\" y2=\"51\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><rect x=\"306\" y=\"24\" width=\"110\" height=\"54\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"361.0\" y=\"49.0\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">③ 일반해<\/text><text x=\"361.0\" y=\"65.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">표에서 꼴 선택<\/text><line x1=\"418\" y1=\"51\" x2=\"444\" y2=\"51\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><rect x=\"448\" y=\"24\" width=\"100\" height=\"54\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"498.0\" y=\"49.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">④ c₁, c₂<\/text><text x=\"498.0\" y=\"65.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y(0), y′(0)<\/text><text x=\"280\" y=\"106\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y′(0) 조건은 y′ 을 먼저 정리해 두고 대입 — Case II·III 에서 곱의 미분 주의<\/text><\/svg><figcaption>초기값 문제 수순. Ex.2·4·5 가 세 경우를 하나씩 보여 준다.<\/figcaption>"}, {"t": "ex", "q": "Ex.2 \\(y''+y'-2y=0\\), \\(y(0)=4\\), \\(y'(0)=-5\\) (Case I)", "a": "<p>\\(\\lambda^2+\\lambda-2=(\\lambda-1)(\\lambda+2)=0\\) → \\(y=c_1e^x+c_2e^{-2x}\\). \\(y(0)=c_1+c_2=4\\), \\(y'(0)=c_1-2c_2=-5\\) → \\(c_1=1\\), \\(c_2=3\\) → <b>\\(y=e^x+3e^{-2x}\\)<\/b>.<\/p>"}, {"t": "ex", "q": "Ex.4 \\(y''+y'+0.25y=0\\), \\(y(0)=3.0\\), \\(y'(0)=-3.5\\) (Case II)", "a": "<p>\\(\\lambda^2+\\lambda+0.25=(\\lambda+0.5)^2\\) → \\(y=(c_1+c_2x)e^{-0.5x}\\). \\(y(0)=c_1=3\\), \\(y'=c_2e^{-0.5x}-0.5(c_1+c_2x)e^{-0.5x}\\) → \\(y'(0)=c_2-1.5=-3.5\\) → \\(c_2=-2\\) → <b>\\(y=(3-2x)e^{-0.5x}\\)<\/b>.<\/p>"}, {"t": "ex", "q": "Ex.5 \\(y''+0.4y'+9.04y=0\\), \\(y(0)=0\\), \\(y'(0)=3\\) (Case III)", "a": "<p>\\(\\lambda=-0.2\\pm\\sqrt{0.04-9.04}=-0.2\\pm3i\\) → \\(y=e^{-0.2x}(A\\cos3x+B\\sin3x)\\). \\(y(0)=A=0\\), \\(y'(0)=-0.2A+3B=3\\) → \\(B=1\\) → <b>\\(y=e^{-0.2x}\\sin3x\\)<\/b>.<\/p>"}, {"t": "why", "html": "세 문제의 수순은 같다: <b>특성방정식 → 경우 판별 → 일반해 → 조건 2개로 \\(c_1,c_2\\)<\/b>. \\(y'(0)\\) 조건에서 곱의 미분(Case II)·지수와 삼각의 곱(Case III)을 틀리기 쉬우니 \\(y'\\)을 먼저 정리해 두고 대입한다."}, {"t": "analogy", "html": "같은 요리 세 번 — 재료(근의 종류)만 다르다. 손이 익으면 3분짜리."}, {"t": "memo", "html": "<b>외울 것<\/b> 수순 4단계 · Ex.2 \\(e^x+3e^{-2x}\\) · Ex.4 \\((3-2x)e^{-0.5x}\\) · Ex.5 \\(e^{-0.2x}\\sin3x\\) · 과제 2.2 #4·8·14"}], "say": null}, {"id": "s5", "title": "2.3 미분연산자 — 같은 것을 기호로", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 130\" width=\"560\" height=\"130\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"30\" width=\"70\" height=\"50\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"49.0\" y=\"60.0\" font-size=\"16\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y<\/text><line x1=\"86\" y1=\"55\" x2=\"116\" y2=\"55\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"120\" y=\"30\" width=\"70\" height=\"50\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"155.0\" y=\"53.0\" font-size=\"16\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">D<\/text><text x=\"155.0\" y=\"69.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">d/dx<\/text><line x1=\"192\" y1=\"55\" x2=\"222\" y2=\"55\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"226\" y=\"30\" width=\"70\" height=\"50\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"261.0\" y=\"60.0\" font-size=\"16\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y′<\/text><text x=\"430\" y=\"44\" font-size=\"13.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y″ − 3y′ − 40y = 0<\/text><text x=\"430\" y=\"66\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(D² − 3D − 40)y = (D − 8)(D + 5)y = 0<\/text><text x=\"430\" y=\"92\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">→ y = c₁e^(8x) + c₂e^(−5x)<\/text><text x=\"280\" y=\"116\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">연산자 = 함수를 다른 함수로 바꾸는 변환. P(D) 의 인수분해 = 특성근<\/text><\/svg><figcaption>2.3 미분연산자 D. 새 내용이 아니라 2.2 를 기호로 다시 쓴 것(과제 2.3 #8 유형).<\/figcaption>"}, {"t": "formula", "html": "\\[D=\\frac{d}{dx},\\quad Dy=y',\\ D^2y=y''\\qquad y''+ay'+by=0\\ \\Leftrightarrow\\ (D^2+aD+b)y=P(D)y=0\\qquad \\text{Ex.1 }P(D)=D^2-3D-40I=(D-8)(D+5)\\]"}, {"t": "why", "html": "연산자는 함수를 다른 함수로 바꾸는 변환. \\(P(D)\\)를 다항식처럼 인수분해하면 인수 \\((D-\\lambda)\\)의 \\(\\lambda\\)가 곧 특성근 — 2.2와 같은 답 \\(y=c_1e^{8x}+c_2e^{-5x}\\). 새 계산이 아니라 <b>표기법<\/b>이고, 3장 고계·6장 라플라스에서 이 기호가 편해진다. 과제 2.3 #8이 이 유형."}, {"t": "analogy", "html": "\"x로 미분\"이라는 긴 말을 D라는 도장으로 찍는 것. 도장을 두 번 찍으면 \\(D^2\\), 도장끼리는 다항식처럼 곱하고 나눈다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(D=d/dx\\) · \\(P(D)y=0\\) · 인수분해 \\((D-\\lambda_1)(D-\\lambda_2)\\) = 특성근 · 과제 2.3 #8"}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 특성방정식", "html": "\\(y''+y'-2y=0\\)의 특성근은?", "choices": [{"html": "\\(\\lambda=1,\\ -2\\)", "ok": true}, {"html": "\\(\\lambda=-1,\\ 2\\)", "ok": false}, {"html": "\\(\\lambda=1,\\ 2\\)", "ok": false}, {"html": "\\(\\lambda=-1\\)(중근)", "ok": false}], "ans": "\\(\\lambda^2+\\lambda-2=(\\lambda-1)(\\lambda+2)\\)."}, {"id": "q2", "qn": "확인 2 · Ex.2", "html": "위 방정식에서 \\(y(0)=4\\), \\(y'(0)=-5\\)인 해는?", "choices": [{"html": "\\(y=e^x+3e^{-2x}\\)", "ok": true}, {"html": "\\(y=3e^x+e^{-2x}\\)", "ok": false}, {"html": "\\(y=4e^x-5e^{-2x}\\)", "ok": false}, {"html": "\\(y=e^{-x}+3e^{2x}\\)", "ok": false}], "ans": "\\(c_1+c_2=4\\), \\(c_1-2c_2=-5\\) → \\(c_1=1,c_2=3\\)."}, {"id": "q3", "qn": "확인 3 · 중근", "html": "특성방정식이 실 이중근 \\(\\lambda\\)를 가질 때 일반해는?", "choices": [{"html": "\\(y=(c_1+c_2x)e^{\\lambda x}\\)", "ok": true}, {"html": "\\(y=c_1e^{\\lambda x}+c_2e^{\\lambda x}\\)", "ok": false}, {"html": "\\(y=c_1e^{\\lambda x}+c_2e^{-\\lambda x}\\)", "ok": false}, {"html": "\\(y=c_1\\cos\\lambda x+c_2\\sin\\lambda x\\)", "ok": false}], "ans": "둘째 해 \\(xe^{\\lambda x}\\)는 차수축소(\\(u''=0\\Rightarrow u=x\\)). 2번은 사실상 해 하나."}, {"id": "q4", "qn": "확인 4 · Ex.5", "html": "\\(y''+0.4y'+9.04y=0\\), \\(y(0)=0\\), \\(y'(0)=3\\)의 해는?", "choices": [{"html": "\\(y=e^{-0.2x}\\sin3x\\)", "ok": true}, {"html": "\\(y=e^{-0.2x}\\cos3x\\)", "ok": false}, {"html": "\\(y=e^{0.2x}\\sin3x\\)", "ok": false}, {"html": "\\(y=3e^{-0.2x}\\sin x\\)", "ok": false}], "ans": "\\(\\lambda=-0.2\\pm3i\\), \\(A=0\\), \\(3B=3\\)."}, {"id": "q5", "qn": "확인 5 · 미분연산자", "html": "\\((D^2-3D-40)y=0\\)의 일반해는?", "choices": [{"html": "\\(y=c_1e^{8x}+c_2e^{-5x}\\)", "ok": true}, {"html": "\\(y=c_1e^{-8x}+c_2e^{5x}\\)", "ok": false}, {"html": "\\(y=(c_1+c_2x)e^{8x}\\)", "ok": false}, {"html": "\\(y=c_1e^{3x}+c_2e^{40x}\\)", "ok": false}], "ans": "\\((D-8)(D+5)\\) → \\(\\lambda=8,-5\\)."}, {"id": "q6", "qn": "확인 6 · Ex.4", "html": "\\(y''+y'+0.25y=0\\), \\(y(0)=3.0\\), \\(y'(0)=-3.5\\)를 풀라.", "choices": null, "ans": "\\((\\lambda+0.5)^2=0\\) → \\(y=(c_1+c_2x)e^{-0.5x}\\). \\(c_1=3\\), \\(y'(0)=c_2-0.5c_1=-3.5\\) → \\(c_2=-2\\) → \\(y=(3-2x)e^{-0.5x}\\)."}]};

const KEY="mc-tutor", LKEY="mc-lesson-"+D.id;
const load=(k,def)=>{ try{ const v=JSON.parse(localStorage.getItem(k)||"null"); return (v&&typeof v==="object")?Object.assign(def,v):def; }catch(e){ return def; } };
let T=load(KEY,{v:1,xp:0,streak:0,last:"",hearts:3,hday:"",aff:20,lessons:{}});
if(!T.lessons||typeof T.lessons!=="object") T.lessons={};
if(T.hday!==TODAY){ T.hearts=3; T.hday=TODAY; }
if(T.last&&T.last!==TODAY&&T.last!==YDAY) T.streak=0;
let L=T.lessons[D.id]||(T.lessons[D.id]={pos:null,ch:{},done:false,xp:0});
let ST=load(LKEY,{read:{},done:{},correct:{},answer:{},ts:0});
const CH=D.chapters, QZ=D.quiz||[], NCH=CH.length+(QZ.length?1:0);

function save(){
  T.lessons[D.id]=L; try{ localStorage.setItem(KEY,JSON.stringify(T)); ST.ts=Date.now(); localStorage.setItem(LKEY,JSON.stringify(ST)); }catch(e){}

const lvl=xp=>1+Math.floor(xp/150), lvlPct=xp=>Math.round((xp%150)/150*100);
function hud(){
  $("#hCourse").textContent=D.course; $("#hSess").textContent=D.sess;
  const dc=CH.filter(c=>L.ch[c.id]).length, qAll=QZ.length&&QZ.every(q=>ST.done[q.id]);
  const cur= S.mode==="quiz"||S.mode==="result"? NCH : S.mode==="step"? S.ci+1 : Math.min(NCH,dc+1);
  $("#hCh").textContent="CH "+cur+"/"+NCH;
  const prog=(dc+(qAll?1:0))/NCH*100; $("#hBar").style.width=Math.round(prog)+"%";

}
function affName(){ return T.aff>=85?"전적으로 믿는":T.aff>=60?"인정":T.aff>=30?"지켜보는 중":"무관심"; }
function pop(sel,txt,bad){ const el=$(sel); if(!el) return; const p=document.createElement("span"); p.className="pop"+(bad?" bad":""); p.textContent=txt; el.appendChild(p); setTimeout(()=>p.remove(),1200); }
function gainXP(n){ T.xp+=n; L.xp=(L.xp||0)+n; pop("#sXp","+"+n+" XP"); }
function gainAff(n){ T.aff=Math.max(0,Math.min(100,T.aff+n)); pop("#sAf",(n>0?"+":"")+n,n<0); }

function boot(){ const m=/^#(resume|ch=(\d+)(?:\.(\d+))?|quiz|result)$/.exec(location.hash||"");
