<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>12.3 방향각·방향코사인 → 12.4 외적 — "두 벡터에 수직인 벡터"</title>
<!-- 교실 모드 템플릿 v1.1 (캐릭터 = docs/tools/tutor.svg 인라인, 이름 김주영 스앵님) (대표님 2026-09-26 결정: 초록 칠판 + 스앵님(김주영 미니버전) 캐릭터가 알려주는 느낌 · 목차/챕터 · 듀오링고식 XP·스트릭·하트·호감도 · 시스템은 최대한 심플)
     build_classroom.py 가 제목·자료(JSON)·교재 경로 자리를 채운다. 저장: localStorage mc-tutor(전역 XP·스트릭·하트·호감도·회차 위치) + mc-lesson-<id>(읽음·문제, 교재 페이지·앱 V52 와 공유) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--wall:#F4EEE2;--wood:#7A4E2B;--wood-2:#5C3A1E;--green:#2F5F4E;--green-2:#25503F;--chalk:#F5F2E9;--chalk-2:rgba(245,242,233,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --ink:#1F2A44;--ink-2:#55627A;--ink-3:#7C889B;--du-green:#58CC02;--du-green-2:#46A302;--du-blue:#1CB0F6;--du-blue-2:#1899D6;--du-red:#FF4B4B;--du-red-2:#EA2B2B;--du-gray:#E5E5E5;--du-gray-2:#CFCFCF;--du-yel:#FFC800;--du-orange:#FF9600;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--pen:"Nanum Pen Script","Pretendard Variable",sans-serif;--fs:19px;--hud:56px}
*{box-sizing:border-box}
html{background:var(--wall)}
body{margin:0;font-family:var(--f);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.6;
  background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.7),transparent 42%),radial-gradient(circle at 80% 90%,rgba(255,225,170,.35),transparent 46%),var(--wall);min-height:100vh}
button{font-family:inherit}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:2px solid rgba(31,42,68,.08)}
#hud .in{max-width:1000px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
#hud .chp{font-size:12.5px;font-weight:800;color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
#hud .pbar{flex:1;height:14px;border-radius:99px;background:#E6E2D6;overflow:hidden;position:relative}
#hud .pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7ED957,#58CC02);transition:width .45s cubic-bezier(.2,.8,.2,1)}
#hud .pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
#hud .hr{display:flex;align-items:center;gap:10px}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--ink-2);padding:4px 8px;border-radius:12px;background:rgba(255,255,255,.7);border:2px solid rgba(31,42,68,.06);position:relative}
.stat svg{width:18px;height:18px;display:block}
.stat small{font-weight:700;color:var(--ink-3);font-size:11px}
.stat.xp{color:#B26A00}.stat.sk{color:#E8590C}.stat.hp{color:#E03131;gap:2px}.stat.af{color:#D0397A}
.stat.hp svg{width:17px}
.stat .gauge{display:inline-block;width:56px;height:9px;border-radius:99px;background:#F1D4E0;overflow:hidden}
.stat .gauge b{display:block;height:100%;width:0;background:linear-gradient(90deg,#F783AC,#D0397A);transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#2B8A3E;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#E03131}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:0;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer;border-bottom:3px solid #000}
#hToc:active{transform:translateY(1px);border-bottom-width:2px}
/* ---------- 교실 ---------- */
main{max-width:1000px;margin:0 auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - var(--hud))}
#board{position:relative;flex:1;display:flex;flex-direction:column;min-height:360px}
.frame{flex:1;display:flex;padding:14px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 18px 40px rgba(60,40,20,.22),inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.25);position:relative}
.frame::before{content:"";position:absolute;inset:6px;border-radius:10px;border:2px solid rgba(255,255,255,.08);pointer-events:none}
.green{flex:1;position:relative;border-radius:6px;background:
  radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.07),transparent 42%),radial-gradient(ellipse at 78% 74%,rgba(255,255,255,.05),transparent 40%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chk{position:absolute;left:18px;top:12px;font-family:var(--pen);font-size:22px;color:var(--yel);letter-spacing:.02em;opacity:.95;z-index:2;text-shadow:0 0 2px rgba(255,226,122,.35)}
.chk small{font-family:var(--f);font-size:11.5px;font-weight:800;color:var(--chalk-2);margin-left:8px;letter-spacing:.06em;vertical-align:middle}
#bwrap{flex:1;overflow:auto;padding:46px 34px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bc{margin:auto 0;width:100%}  /* 짧은 판서는 세로 가운데, 긴 판서는 위에서부터 스크롤 */
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-size:var(--fs);line-height:1.75;text-shadow:0 0 1px rgba(255,255,255,.28);max-width:840px}
#bc>*{animation:write .5s ease-out both}
#bc>*:nth-child(2){animation-delay:.15s}#bc>*:nth-child(3){animation-delay:.3s}#bc>*:nth-child(4){animation-delay:.45s}#bc>*:nth-child(n+5){animation-delay:.6s}
@keyframes write{from{opacity:0;transform:translateY(6px);filter:blur(1px)}to{opacity:1;transform:none;filter:none}}
#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc p{margin:0 0 12px}
#bc .sub{font-family:var(--pen);font-size:28px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .tk{font-size:calc(var(--fs) + 1px)}
#bc .katex{color:var(--chalk);font-size:1.06em}#bc .katex-display{margin:12px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
#bc a{color:var(--sky)}
#bc table{border-collapse:collapse;margin:8px 0;font-size:.92em}#bc td,#bc th{border:1px dashed rgba(245,242,233,.45);padding:5px 10px;text-align:left}#bc th{color:var(--yel)}
#bc ul,#bc ol{margin:6px 0 10px;padding-left:24px}
/* 상자들: 분필 테두리 */
#bc .bx{margin:6px 0 14px;padding:14px 18px 12px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative;font-size:var(--fs)}
#bc .bx>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;line-height:1;margin-bottom:8px;letter-spacing:.02em}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}
#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75);background:rgba(255,255,255,.05)}#bc .bx.formula>i{color:var(--mint)}
#bc .bx.pitfall{border-color:rgba(255,163,199,.7);background:rgba(255,120,160,.07)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7);background:rgba(255,255,255,.05)}#bc .bx.memo>i{color:var(--chalk)}
#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
/* 붙임 자료(그림): 칠판에 붙인 종이 — 그림은 교재와 같은 원본 그대로(색·글자 검증 유지) */
#bc .paper{background:#FFFDF7;color:var(--ink);text-shadow:none;border-radius:6px;padding:14px 16px 10px;margin:8px auto 16px;max-width:600px;box-shadow:0 10px 24px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.6) inset;transform:rotate(-.8deg);position:relative;text-align:center}
#bc .paper::before{content:"";position:absolute;left:50%;top:-10px;width:78px;height:20px;margin-left:-39px;background:rgba(255,224,130,.75);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}
#bc .paper figcaption,#bc .paper .cap{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.5;text-align:center}
#bc .paper b{color:var(--ink)}#bc .paper .katex{color:var(--ink)}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
/* 예제 */
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}
#bc .ex .exq>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--yel);line-height:1;margin-bottom:6px}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}
#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz .qn{font-family:var(--pen);font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:calc(var(--fs) + 1px)}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-weight:900;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12);transform:translateY(-1px)}
#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz .cb .katex{color:inherit}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}
#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--pen);font-size:44px;line-height:1.15;color:var(--chalk);margin:0 0 6px;text-shadow:0 0 3px rgba(255,255,255,.2)}
#bc .lead{color:var(--chalk-2);font-size:calc(var(--fs) - 1px);margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
#bc .toc li{display:flex;align-items:center;gap:12px;font-size:var(--fs);padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-size:13px;font-weight:900}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}
#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;padding:10px 0 0}
#bc .res .big{font-family:var(--pen);font-size:64px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:var(--fs);margin:6px 0 12px}
#bc .res .stats b{display:block;font-size:34px;line-height:1.1}
#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700;letter-spacing:.04em}
#bc .res .badge{margin:4px auto 0;width:140px;height:140px}
#bc .res .bl{font-size:13px;font-weight:800;color:var(--chalk-2);letter-spacing:.04em;margin-top:4px}
#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
/* 분필 받침 */
.tray{height:20px;margin:0 30px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:8px;width:48px;border-radius:4px;background:#F5F2E9;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tray i.y{left:80px;background:var(--yel)}.tray i.p{left:140px;background:var(--pink)}.tray i.w{left:24px}
.tray i.er{left:auto;right:30px;width:64px;height:12px;top:3px;border-radius:3px;background:linear-gradient(180deg,#2B2B33,#111);}
/* ---------- 대화 ---------- */
#dlg{display:flex;align-items:flex-end;gap:14px;min-height:170px}
#tutor{flex:0 0 170px;width:170px;height:200px;margin-bottom:-6px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
.box{flex:1;min-width:0;background:#fff;border:2px solid rgba(31,42,68,.12);border-radius:18px;padding:16px 18px 14px;box-shadow:0 12px 30px rgba(31,42,68,.10);position:relative;min-height:150px;display:flex;flex-direction:column}
.box::before{content:"";position:absolute;left:-12px;bottom:46px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.name{position:absolute;left:16px;top:-14px;background:var(--ink);color:#FFE27A;font-family:var(--pen);font-size:22px;line-height:1;padding:5px 14px 4px;border-radius:10px;letter-spacing:.03em;border-bottom:3px solid #000}
.name.prof{background:#7A2E52;color:#FFD6E7}
.text{flex:1;font-size:18px;line-height:1.65;padding:8px 0 10px;min-height:56px;cursor:pointer}
.text .cur{display:inline-block;width:.55em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.choices{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cbt{border:0;font:inherit;font-weight:800;font-size:15.5px;padding:11px 18px;border-radius:14px;cursor:pointer;color:#fff;background:var(--du-blue);border-bottom:4px solid var(--du-blue-2);transition:transform .08s,filter .15s;letter-spacing:-.01em;min-height:46px}
.cbt:hover{filter:brightness(1.05)}.cbt:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.cbt.p{background:var(--du-green);border-bottom-color:var(--du-green-2)}
.cbt.g{background:#fff;color:var(--ink-2);border:2px solid var(--du-gray);border-bottom:4px solid var(--du-gray)}
.cbt.g:active{border-bottom-width:2px}
.cbt.r{background:var(--du-red);border-bottom-color:var(--du-red-2)}
.cbt.y{background:var(--du-yel);border-bottom-color:#E5A800;color:#4A3600}
.cbt kbd{font:inherit;font-size:11px;opacity:.7;margin-left:6px}
.choices .sp{flex:1}
.tip{font-size:12.5px;color:var(--ink-3);margin-left:auto}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.55);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-size:22px}
#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:#F7F7F7;border:2px solid #EEE;border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--du-blue)}
#ov li .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #CFCFCF;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--ink-3)}
#ov li.done .st{background:var(--du-green);border-color:var(--du-green);color:#fff}
#ov li.cur button{border-color:var(--du-yel);background:#FFF8DC}
#ov li small{margin-left:auto;color:var(--ink-3);font-weight:700;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* ---------- 폰 ---------- */
@media(max-width:640px){
  :root{--fs:16.5px;--hud:50px}
  /* 폰 HUD: 과목 이름은 칠판 위 태그에 있으니 숨기고 CH n/m + 진행 막대 + 수치만 */

<script>
const D={"id": "calc2-2026-09-22", "slug": "calc2", "course": "미분적분학2", "date": "2026-09-22", "sess": "9/22(화) · 4주차", "title": "12.3 방향각·방향코사인 → 12.4 외적 — \"두 벡터에 수직인 벡터\"", "lead": "9:45 지각으로 앞 40분(12.3 정리 1의 증명으로 추정)은 못 들었고 녹음도 없어, 그 부분은 교재 증명으로 채웠다. 판서 6장(09:45~10:13)의 내용: <b>방향각·방향코사인<\/b>(사이각 공식에 i, j, k를 넣은 것)과 Ex04, 그리고 <b>12.4 외적<\/b>의 정의(2×2 행렬식 셋)와 <b>유도<\/b>(두 벡터에 수직인 벡터를 내적 0 조건으로). 정역학 9/9(방향여현)·9/14(외적)와 같은 내용이라 서로 예습·복습이 된다.", "minutes": 20, "chapters": [{"id": "s1", "title": "Thm 01 증명 — 코사인 제2법칙에서 a·b = |a||b|cos θ (지각 구간 보충)", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 190\" width=\"560\" height=\"190\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"70\" cy=\"150\" r=\"5\" fill=\"#1F2A44\"><\/circle><text x=\"56\" y=\"168\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">O<\/text><circle cx=\"270\" cy=\"50\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"270\" y=\"38\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">A<\/text><circle cx=\"400\" cy=\"140\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"412\" y=\"144\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">B<\/text><line x1=\"76\" y1=\"146\" x2=\"264\" y2=\"54\" stroke=\"#1971C2\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"150\" y=\"92\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>|<\/text><line x1=\"76\" y1=\"149\" x2=\"394\" y2=\"141\" stroke=\"#E03131\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"230\" y=\"162\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|<tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>|<\/text><line x1=\"394\" y1=\"136\" x2=\"276\" y2=\"56\" stroke=\"#2F9E44\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"><\/line><text x=\"307\" y=\"138\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> − <tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>|<\/text><path d=\"M109.2 130.0 A 44 44 0 0 1 114.0 148.5\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"1.5\"><\/path><text x=\"122.3\" y=\"140.5\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">θ<\/text><text x=\"452\" y=\"40\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">코사인 제2법칙 (일각삼변)<\/text><text x=\"452\" y=\"62\" font-size=\"11\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|a−b|² = |a|² + |b|² − 2|a||b|cos θ<\/text><text x=\"452\" y=\"96\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">한편 |a−b|² = (a−b)·(a−b)<\/text><text x=\"452\" y=\"116\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= |a|² − 2 a·b + |b|²<\/text><text x=\"452\" y=\"174\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">∴ <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>·<tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = |<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>||<tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| cos θ<\/text><\/svg><figcaption>Thm 01 의 증명(교재) — 지각 구간(9:05~9:45)의 내용으로 추정. 두 식의 |a|², |b|² 이 지워지고 내적만 남는다.<\/figcaption>"}, {"t": "formula", "html": "\\[|\\vec a-\\vec b|^2=|\\vec a|^2+|\\vec b|^2-2|\\vec a||\\vec b|\\cos\\theta\\quad\\text{와}\\quad |\\vec a-\\vec b|^2=(\\vec a-\\vec b)\\cdot(\\vec a-\\vec b)=|\\vec a|^2-2\\,\\vec a\\cdot\\vec b+|\\vec b|^2\\ \\Rightarrow\\ \\vec a\\cdot\\vec b=|\\vec a||\\vec b|\\cos\\theta\\]"}, {"t": "why", "html": "9/17 마지막에 세운 삼각형 OAB(\\(\\overrightarrow{BA}=\\vec a-\\vec b\\)). 한 각 \\(\\theta\\)와 세 변을 아는 삼각형 = <b>코사인 제2법칙<\/b>. 같은 변 \\(|\\vec a-\\vec b|^2\\)을 내적의 분배법칙으로도 전개하면 \\(|\\vec a|^2,|\\vec b|^2\\)이 지워지고 \\(\\vec a\\cdot\\vec b\\)만 남는다. 이 부분은 판서에 없어(9:45 이전) 교재 증명 — 녹음이 오면 교수님 순서로 고친다."}, {"t": "analogy", "html": "같은 물건을 두 저울(기하: 코사인법칙, 대수: 성분 전개)로 재서 눈금을 맞추면 미지의 항(내적)이 정해진다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\vec a\\cdot\\vec b=|\\vec a||\\vec b|\\cos\\theta\\) · \\(\\cos\\theta=\\vec a\\cdot\\vec b/(|\\vec a||\\vec b|)\\) · 증명 = 코사인법칙 + 분배 전개"}], "say": null}, {"id": "s2", "title": "방향각과 방향코사인 (판서 ①②) ★", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 220\" width=\"560\" height=\"220\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"150\" y1=\"160\" x2=\"250\" y2=\"160\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"160\" x2=\"150\" y2=\"60\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"160\" x2=\"90.0\" y2=\"210.0\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"256\" y=\"165\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y<\/text><text x=\"146\" y=\"54\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">z<\/text><text x=\"84.0\" y=\"200.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x<\/text><line x1=\"150\" y1=\"160\" x2=\"218.0\" y2=\"102.5\" stroke=\"#2F9E44\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><circle cx=\"218.0\" cy=\"102.5\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"226.0\" y=\"96.5\" font-size=\"12.5\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (a₁, a₂, a₃)<\/text><text x=\"196\" y=\"150\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">β<\/text><text x=\"146\" y=\"100\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">γ<\/text><text x=\"120\" y=\"172\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">α<\/text><text x=\"430\" y=\"44\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">방향각 α, β, γ = <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> 가 x·y·z 축(i, j, k)과 이루는 각<\/text><text x=\"430\" y=\"74\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">cos α = (<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>·<tspan font-weight=\"700\">i<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>)/(|<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>||<tspan font-weight=\"700\">i<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>|) = a₁/|<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>|<\/text><text x=\"430\" y=\"96\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">cos β = a₂/|<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>|,   cos γ = a₃/|<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>|<\/text><text x=\"430\" y=\"126\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ㄱ cos²α + cos²β + cos²γ = 1<\/text><text x=\"430\" y=\"148\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ㄴ <tspan font-weight=\"700\">u<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>/|<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| = (cos α, cos β, cos γ)<\/text><text x=\"430\" y=\"180\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">사이각 공식에 b = i, j, k 를 넣은 것 (|i| = 1 이 지워진다)<\/text><\/svg><figcaption>방향각·방향코사인(판서 ①②). 단위벡터의 성분이 곧 방향코사인 — 정역학 9/9 와 같은 내용.<\/figcaption>"}, {"t": "formula", "html": "\\[\\cos\\alpha=\\frac{\\vec a\\cdot\\vec i}{|\\vec a||\\vec i|}=\\frac{a_1}{|\\vec a|},\\quad \\cos\\beta=\\frac{a_2}{|\\vec a|},\\quad \\cos\\gamma=\\frac{a_3}{|\\vec a|}\\qquad \\text{ㄱ }\\cos^2\\alpha+\\cos^2\\beta+\\cos^2\\gamma=1\\qquad \\text{ㄴ }\\vec u=\\frac{\\vec a}{|\\vec a|}=(\\cos\\alpha,\\cos\\beta,\\cos\\gamma)\\]"}, {"t": "why", "html": "방향각 = 벡터가 \\(x,y,z\\)축과 이루는 각. 사이각 공식에 \\(\\vec b=\\vec i,\\vec j,\\vec k\\)를 넣으면 분모의 \\(|\\vec i|=1\\)이 지워져(판서에서 1로 그어 지움) <b>성분/크기<\/b>만 남는다. ㄴ: \\(\\vec a\\)와 같은 방향의 단위벡터(9/17 ★⑤)의 성분이 곧 방향코사인, ㄱ: 그 단위벡터의 크기가 1이라는 뜻. 정역학 9/9 방향여현 \\(\\cos^2\\theta_x+\\cos^2\\theta_y+\\cos^2\\theta_z=1\\)과 같은 식."}, {"t": "analogy", "html": "손전등을 세 방향에서 비춘 그림자 길이 ÷ 막대 길이 = 방향코사인. 세 그림자의 제곱합이 막대 길이의 제곱이라 코사인 제곱합이 1."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\cos\\alpha=a_1/|\\vec a|\\) 등 · ㄱ 제곱합 = 1 · ㄴ 단위벡터 = (cos α, cos β, cos γ)"}], "say": null}, {"id": "s3", "title": "Ex04 — a = (3, 4, 5)의 방향각 (판서 ②③)", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"26\" width=\"120\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"74.0\" y=\"52.0\" font-size=\"12.9\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (3, 4, 5)<\/text><text x=\"74.0\" y=\"68.0\" font-size=\"10.2\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i) |a| = √50 = 5√2<\/text><line x1=\"136\" y1=\"54\" x2=\"166\" y2=\"54\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"170\" y=\"20\" width=\"380\" height=\"68\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"360.0\" y=\"52.0\" font-size=\"8.4\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">cos α = 3/(5√2) = 3√2/10 · cos β = 4/(5√2) = 2√2/5 · cos γ = 5/(5√2) = √2/2<\/text><text x=\"360.0\" y=\"68.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">α = cos⁻¹(3√2/10), β = cos⁻¹(2√2/5), γ = π/4<\/text><text x=\"280\" y=\"122\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">검산 ㄱ: 18/100 + 32/100 + 50/100 = 1 ✓ · 답은 cos⁻¹( ) 꼴 그대로, 특수각만 값으로<\/text><\/svg><figcaption>Ex04 (판서 ②③, 답 분홍 박스). 분모의 근호는 유리화해 정리.<\/figcaption>"}, {"t": "formula", "html": "\\[|\\vec a|=\\sqrt{50}=5\\sqrt2,\\quad \\cos\\alpha=\\frac{3}{5\\sqrt2}=\\frac{3\\sqrt2}{10},\\ \\cos\\beta=\\frac{4}{5\\sqrt2}=\\frac{2\\sqrt2}{5},\\ \\cos\\gamma=\\frac{5}{5\\sqrt2}=\\frac{\\sqrt2}{2}\\ \\Rightarrow\\ \\alpha=\\cos^{-1}\\tfrac{3\\sqrt2}{10},\\ \\beta=\\cos^{-1}\\tfrac{2\\sqrt2}{5},\\ \\gamma=\\tfrac\\pi4\\]"}, {"t": "why", "html": "sol. i) 크기 ii) 세 방향코사인 — 9/17의 단계 번호 형식. 분모의 근호는 유리화(9/15 \"근호 정리 안 하면 감점\"), 답은 \\(\\cos^{-1}(\\ )\\) 꼴 그대로 두고 <b>특수각만 값으로<\/b>(\\(\\sqrt2/2\\to\\pi/4\\)). 검산 ㄱ: \\(18/100+32/100+50/100=1\\) ✓ — 세 코사인의 제곱합으로 스스로 확인할 수 있다."}, {"t": "say", "html": "판서 ③ 옆 cf. \\(\\cos\\theta=\\vec a\\cdot\\vec b/(|\\vec a||\\vec b|)\\) — 방향각은 이 공식의 특수한 경우라는 표시."}, {"t": "analogy", "html": "셋 중 하나(\\(\\gamma=\\pi/4\\))가 특수각으로 떨어지면 나머지는 역코사인으로 두는 것이 정상 — 억지로 소수로 바꾸지 않는다."}, {"t": "memo", "html": "<b>외울 것<\/b> 수순: 크기 → 성분/크기 → 유리화 → \\(\\cos^{-1}\\) · 검산 ㄱ · Ex04 \\(\\gamma=\\pi/4\\)"}], "say": null}, {"id": "s4", "title": "12.4 외적(Cross Product) — 정의는 2×2 행렬식 셋 (판서 ④) ★", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 230\" width=\"560\" height=\"230\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><path d=\"M50 195 L 270 195 L 330 135 L 110 135 Z\" fill=\"rgba(138,151,166,.12)\" stroke=\"#8A97A6\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"><\/path><line x1=\"110\" y1=\"178\" x2=\"250\" y2=\"178\" stroke=\"#1971C2\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"180\" y=\"214\" font-size=\"15\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"110\" y1=\"178\" x2=\"190\" y2=\"142\" stroke=\"#E03131\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"150\" y=\"150\" font-size=\"15\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"110\" y1=\"178\" x2=\"110\" y2=\"40\" stroke=\"#2F9E44\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"124\" y=\"46\" font-size=\"14\" fill=\"#2F9E44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">c<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> × <tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>  ⊥ <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>, ⊥ <tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"440\" y=\"60\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">[Def 01] 외적 (cross / outer product)<\/text><text x=\"440\" y=\"88\" font-size=\"10.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> × <tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (a₂b₃ − a₃b₂,  a₃b₁ − a₁b₃,  a₁b₂ − a₂b₁)<\/text><line x1=\"340\" y1=\"104\" x2=\"340\" y2=\"152\" stroke=\"#1F2A44\" stroke-width=\"1.8\"><\/line><line x1=\"400\" y1=\"104\" x2=\"400\" y2=\"152\" stroke=\"#1F2A44\" stroke-width=\"1.8\"><\/line><text x=\"355.0\" y=\"121.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">2<\/tspan><\/text><text x=\"385.0\" y=\"121.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">3<\/tspan><\/text><text x=\"355.0\" y=\"145.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b<tspan baseline-shift=\"sub\" font-size=\"72%\">2<\/tspan><\/text><text x=\"385.0\" y=\"145.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b<tspan baseline-shift=\"sub\" font-size=\"72%\">3<\/tspan><\/text><line x1=\"410\" y1=\"104\" x2=\"410\" y2=\"152\" stroke=\"#1F2A44\" stroke-width=\"1.8\"><\/line><line x1=\"470\" y1=\"104\" x2=\"470\" y2=\"152\" stroke=\"#1F2A44\" stroke-width=\"1.8\"><\/line><text x=\"425.0\" y=\"121.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">3<\/tspan><\/text><text x=\"455.0\" y=\"121.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">1<\/tspan><\/text><text x=\"425.0\" y=\"145.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b<tspan baseline-shift=\"sub\" font-size=\"72%\">3<\/tspan><\/text><text x=\"455.0\" y=\"145.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b<tspan baseline-shift=\"sub\" font-size=\"72%\">1<\/tspan><\/text><line x1=\"480\" y1=\"104\" x2=\"480\" y2=\"152\" stroke=\"#1F2A44\" stroke-width=\"1.8\"><\/line><line x1=\"540\" y1=\"104\" x2=\"540\" y2=\"152\" stroke=\"#1F2A44\" stroke-width=\"1.8\"><\/line><text x=\"495.0\" y=\"121.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">1<\/tspan><\/text><text x=\"525.0\" y=\"121.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">2<\/tspan><\/text><text x=\"495.0\" y=\"145.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b<tspan baseline-shift=\"sub\" font-size=\"72%\">1<\/tspan><\/text><text x=\"525.0\" y=\"145.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b<tspan baseline-shift=\"sub\" font-size=\"72%\">2<\/tspan><\/text><text x=\"440\" y=\"176\" font-size=\"11.5\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">결과는 벡터 — 내적(스칼라)과 다르다<\/text><text x=\"440\" y=\"196\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">자기 번호 뺀 두 번호 = 순환 (2,3)(3,1)(1,2)<\/text><\/svg><figcaption>12.4 외적의 정의(판서 ④). 2×2 행렬식 세 개 — 9/3 의 ad − bc 가 여기서 쓰인다.<\/figcaption>"}, {"t": "formula", "html": "\\[\\vec a\\times\\vec b=\\langle a_2b_3-a_3b_2,\\ a_3b_1-a_1b_3,\\ a_1b_2-a_2b_1\\rangle=\\Big(\\begin{vmatrix}a_2&amp;a_3\\\\b_2&amp;b_3\\end{vmatrix},\\ \\begin{vmatrix}a_3&amp;a_1\\\\b_3&amp;b_1\\end{vmatrix},\\ \\begin{vmatrix}a_1&amp;a_2\\\\b_1&amp;b_2\\end{vmatrix}\\Big)\\]"}, {"t": "why", "html": "내적은 스칼라, <b>외적은 벡터<\/b>. 성분마다 자기 번호를 뺀 나머지 두 번호가 <b>순환 순서<\/b>(2→3, 3→1, 1→2)로 2×2 행렬식(↘ 곱 − ↗ 곱)에 들어간다. 9/3의 \\(ad-bc\\)가 여기서 다시 쓰인다. 정역학 9/14는 같은 것을 3×3 행렬식 \\(\\begin{vmatrix}\\mathbf i&amp;\\mathbf j&amp;\\mathbf k\\\\a_1&amp;a_2&amp;a_3\\\\b_1&amp;b_2&amp;b_3\\end{vmatrix}\\)로 썼다 — 둘째 성분의 부호(\\(-(a_1b_3-a_3b_1)=a_3b_1-a_1b_3\\))가 같은 것임을 확인해 둘 것."}, {"t": "ex", "q": "연습 — \\(\\vec a=(1,2,3)\\), \\(\\vec b=(4,5,6)\\)", "a": "<p>\\((2\\cdot6-3\\cdot5,\\ 3\\cdot4-1\\cdot6,\\ 1\\cdot5-2\\cdot4)=(-3,\\ 6,\\ -3)\\). 검산 \\(\\vec a\\cdot(\\vec a\\times\\vec b)=-3+12-9=0\\) ✓ — 외적은 두 벡터에 수직(§5).<\/p>"}, {"t": "analogy", "html": "나사를 \\(\\vec a\\)에서 \\(\\vec b\\)로 돌릴 때 나사가 나아가는 방향(정역학 9/14) — 이번 시간은 그 방향의 벡터를 성분으로 쓰는 법."}, {"t": "memo", "html": "<b>외울 것<\/b> 세 성분 = 2×2 행렬식 셋, 순환 (2,3)(3,1)(1,2) · 결과는 벡터 · 검산 \\(\\vec a\\cdot(\\vec a\\times\\vec b)=0\\)"}], "say": null}, {"id": "s5", "title": "[유도] 왜 그 성분인가 — 두 벡터에 수직인 벡터 (판서 ⑤⑥)", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"14\" y=\"24\" width=\"150\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1F2A44\" stroke-width=\"1.6\"><\/rect><text x=\"89.0\" y=\"50.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> ⊥ <tspan font-weight=\"700\">c<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>, <tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> ⊥ <tspan font-weight=\"700\">c<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"89.0\" y=\"66.0\" font-size=\"9.2\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a·c = 0 (ㄱ), b·c = 0 (ㄴ)<\/text><line x1=\"166\" y1=\"52\" x2=\"196\" y2=\"52\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"200\" y=\"24\" width=\"150\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#1971C2\" stroke-width=\"1.6\"><\/rect><text x=\"275.0\" y=\"50.0\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ㄱ×b₃ − ㄴ×a₃<\/text><text x=\"275.0\" y=\"66.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">c₃ 항 소거<\/text><line x1=\"352\" y1=\"52\" x2=\"382\" y2=\"52\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><rect x=\"386\" y=\"24\" width=\"164\" height=\"56\" rx=\"9\" fill=\"rgba(255,255,255,.75)\" stroke=\"#E03131\" stroke-width=\"1.6\"><\/rect><text x=\"468.0\" y=\"50.0\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">p·c₁ + q·c₂ = 0<\/text><text x=\"468.0\" y=\"66.0\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">c₁ = q, c₂ = −p 로 택함<\/text><text x=\"280\" y=\"118\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">p = a₁b₃ − a₃b₁,  q = a₂b₃ − a₃b₂  →  c = (a₂b₃−a₃b₂, a₃b₁−a₁b₃, a₁b₂−a₂b₁) = Def 01 ✓<\/text><\/svg><figcaption>[유도] (판서 ⑤⑥) 외적 = 두 벡터에 모두 수직인 벡터를 내적 0 조건으로 구한 것. 칠판의 「ㄱ×b₂」는 ×b₃ 가 맞다.<\/figcaption>"}, {"t": "formula", "html": "\\[\\vec a\\perp\\vec c,\\ \\vec b\\perp\\vec c\\ \\Leftrightarrow\\ \\begin{cases}a_1c_1+a_2c_2+a_3c_3=0&amp;\\cdots\\text{ㄱ}\\\\b_1c_1+b_2c_2+b_3c_3=0&amp;\\cdots\\text{ㄴ}\\end{cases}\\ \\xrightarrow{\\text{ㄱ}\\times b_3-\\text{ㄴ}\\times a_3}\\ \\underbrace{(a_1b_3-a_3b_1)}_{p}c_1+\\underbrace{(a_2b_3-a_3b_2)}_{q}c_2=0\\]"}, {"t": "why", "html": "미지수 \\(c_1,c_2,c_3\\) 셋에 식이 둘 — 해가 한 방향으로 무수히 많다(수직인 벡터는 길이만 다르게 무한). \\(c_3\\)을 소거하면 \\(pc_1+qc_2=0\\); 한 해로 \\(c_1=q,\\ c_2=-p=a_3b_1-a_1b_3\\)을 택하고 되돌려 넣으면 \\(c_3=a_1b_2-a_2b_1\\) — 정확히 Def 01. 즉 <b>외적의 정의는 \"둘 다에 수직\"에서 나온 것<\/b>. 칠판의 「ㄱ×b₂」는 \\(c_3\\)을 지우려면 <b>×b₃<\/b>가 맞다(옆 주황 주석과 같다)."}, {"t": "say", "html": "판서 ⑤: \\(c_1,c_2,c_3\\) 밑줄(노랑) = unknown. 교수님이 판서 앞에 서 있어 \\(c_3\\) 유도 과정은 사진에 없음(결론만). 다음(9/24): 외적의 성질 — \\(\\vec a\\times\\vec b\\perp\\vec a,\\vec b\\) · \\(|\\vec a\\times\\vec b|=|\\vec a||\\vec b|\\sin\\theta\\) · 평행사변형 넓이 · \\(\\vec b\\times\\vec a=-\\vec a\\times\\vec b\\)(예상)."}, {"t": "analogy", "html": "두 벽(\\(\\vec a,\\vec b\\))에 동시에 수직인 기둥의 방향은 하나뿐(길이는 자유). 연립 두 식이 그 기둥의 방향을 정하고, \"길이\"를 정해 준 것이 Def 01의 성분."}, {"t": "memo", "html": "<b>외울 것<\/b> 외적 = 두 벡터에 수직 · 유도 = 내적 0 두 식에서 \\(c_3\\) 소거 · 판서 오타 ×b₂ → ×b₃ · 할 일: 임의 \\(\\vec a,\\vec b\\)로 계산 후 \\(\\vec a\\cdot(\\vec a\\times\\vec b)=0\\) 확인"}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 방향코사인", "html": "\\(\\vec a=(a_1,a_2,a_3)\\)의 방향각 \\(\\alpha\\)(x축과의 각)에 대해 \\(\\cos\\alpha\\)는?", "choices": [{"html": "\\(a_1/|\\vec a|\\)", "ok": true}, {"html": "\\(a_1\\)", "ok": false}, {"html": "\\(|\\vec a|/a_1\\)", "ok": false}, {"html": "\\(a_1/|\\vec a|^2\\)", "ok": false}], "ans": "\\(\\cos\\alpha=\\vec a\\cdot\\vec i/(|\\vec a||\\vec i|)\\), \\(|\\vec i|=1\\). 필기의 \\(|a|^2\\)처럼 보이는 곳은 오독 — 제곱 아님."}, {"id": "q2", "qn": "확인 2 · Ex04", "html": "\\(\\vec a=(3,4,5)\\)의 방향각 \\(\\gamma\\)(z축과의 각)는?", "choices": [{"html": "\\(\\pi/4\\)", "ok": true}, {"html": "\\(\\cos^{-1}(3\\sqrt2/10)\\)", "ok": false}, {"html": "\\(\\pi/3\\)", "ok": false}, {"html": "\\(\\cos^{-1}(1/\\sqrt{50})\\)", "ok": false}], "ans": "\\(\\cos\\gamma=5/(5\\sqrt2)=\\sqrt2/2\\) → 특수각 \\(\\pi/4\\). 2번은 \\(\\alpha\\)."}, {"id": "q3", "qn": "확인 3 · 성질 ㄱ", "html": "방향코사인 사이에 항상 성립하는 식은?", "choices": [{"html": "\\(\\cos^2\\alpha+\\cos^2\\beta+\\cos^2\\gamma=1\\)", "ok": true}, {"html": "\\(\\cos\\alpha+\\cos\\beta+\\cos\\gamma=1\\)", "ok": false}, {"html": "\\(\\alpha+\\beta+\\gamma=\\pi\\)", "ok": false}, {"html": "\\(\\cos\\alpha\\cos\\beta\\cos\\gamma=1\\)", "ok": false}], "ans": "단위벡터 \\((\\cos\\alpha,\\cos\\beta,\\cos\\gamma)\\)의 크기가 1."}, {"id": "q4", "qn": "확인 4 · 외적 정의", "html": "\\(\\vec a\\times\\vec b\\)의 첫째 성분은?", "choices": [{"html": "\\(a_2b_3-a_3b_2\\)", "ok": true}, {"html": "\\(a_1b_1\\)", "ok": false}, {"html": "\\(a_3b_2-a_2b_3\\)", "ok": false}, {"html": "\\(a_1b_2-a_2b_1\\)", "ok": false}], "ans": "자기 번호(1)를 뺀 (2,3) 순환 행렬식. 3번은 부호 반대(\\(\\vec b\\times\\vec a\\)), 4번은 셋째 성분."}, {"id": "q5", "qn": "확인 5 · 유도의 뜻", "html": "외적 \\(\\vec c=\\vec a\\times\\vec b\\)를 유도할 때 출발한 조건은?", "choices": [{"html": "\\(\\vec c\\)가 \\(\\vec a\\)와 \\(\\vec b\\) 둘 다에 수직 — \\(\\vec a\\cdot\\vec c=0,\\ \\vec b\\cdot\\vec c=0\\)", "ok": true}, {"html": "\\(\\vec c\\)가 \\(\\vec a\\)와 평행", "ok": false}, {"html": "\\(|\\vec c|=|\\vec a||\\vec b|\\)", "ok": false}, {"html": "\\(\\vec c=\\vec a+\\vec b\\)", "ok": false}], "ans": "두 내적 0 식에서 \\(c_3\\)을 소거해 성분을 정했다."}, {"id": "q6", "qn": "확인 6 · 계산과 검산", "html": "\\(\\vec a=(1,2,3)\\), \\(\\vec b=(4,5,6)\\)의 \\(\\vec a\\times\\vec b\\)를 구하고 \\(\\vec a\\cdot(\\vec a\\times\\vec b)=0\\)임을 확인하라.", "choices": null, "ans": "\\((2\\cdot6-3\\cdot5,\\ 3\\cdot4-1\\cdot6,\\ 1\\cdot5-2\\cdot4)=(-3,6,-3)\\). \\(\\vec a\\cdot(-3,6,-3)=-3+12-9=0\\) ✓ (정역학 9/14 연습과 같은 답)."}]};

let T=load(KEY,{v:1,xp:0,streak:0,last:"",hearts:3,hday:"",aff:20,lessons:{}});

if(T.last&&T.last!==TODAY&&T.last!==YDAY) T.streak=0;

  T.lessons[D.id]=L; try{ localStorage.setItem(KEY,JSON.stringify(T)); ST.ts=Date.now(); localStorage.setItem(LKEY,JSON.stringify(ST)); }catch(e){}

function affName(){ return T.aff>=85?"전적으로 믿는":T.aff>=60?"인정":T.aff>=30?"지켜보는 중":"무관심"; }
function pop(sel,txt,bad){ const el=$(sel); if(!el) return; const p=document.createElement("span"); p.className="pop"+(bad?" bad":""); p.textContent=txt; el.appendChild(p); setTimeout(()=>p.remove(),1200); }
function gainXP(n){ T.xp+=n; L.xp=(L.xp||0)+n; pop("#sXp","+"+n+" XP"); }

function ctx(){ if(!CTX_GEN||!EMB) return; let label="", q=null, sid="";
  if(S.mode==="step"){ const ch=CH[S.ci]||{}, st=(ch.steps||[])[S.si]||{}; sid=ch.id||""; label="CH "+(S.ci+1)+" · "+(ch.title||""); const tmp=document.createElement("div"); tmp.innerHTML=st.t==="ex"?(st.q+" "+(S.rev?st.a:"")):(st.html||""); q={qn:(ch.title||"").slice(0,80),kind:"개념",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }
  else if(S.mode==="quiz"){ const qq=QZ[S.qi]; if(qq){ const tmp=document.createElement("div"); tmp.innerHTML=qq.html; label="확인 문제 "+(S.qi+1); const tc=x=>{ const d=document.createElement("div"); d.innerHTML=x; return (d.textContent||"").trim(); };
    q={qn:qq.qn,kind:"문제",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:(qq.choices||[]).map(c=>tc(c.html)),my:(ST.answer[qq.id]==null?null:String(ST.answer[qq.id])),revealed:!!ST.done[qq.id],correct:(typeof ST.correct[qq.id]==="boolean"?ST.correct[qq.id]:null),answer:null}; } }
  else label=S.mode;
  post({type:"mc-slide",v:1,gen:CTX_GEN,deck:D.id,title:document.title.slice(0,80),sid:sid,stype:S.mode==="quiz"?"quiz":"concept",part:null,partTitle:document.title.slice(0,60),label:("교실 · "+label).slice(0,80),q:q}); }
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; ctx(); } });
const _render=render; render=function(){ _render(); ctx(); };
/* ---------- 키보드 ---------- */
document.addEventListener("keydown",e=>{ if(e.target&&/TEXTAREA|INPUT/.test(e.target.tagName)) return; if($("#ov").classList.contains("on")){ if(e.key==="Escape") $("#ov").classList.remove("on"); return; }
  if(e.key==="Enter"||e.key===" "){ if(typing){ clearInterval(typing); typing=null; $("#dText").textContent=fullText; return; } const b=$("#dCh [data-primary]"); if(b){ e.preventDefault(); b.click(); } }
  else if(/^[1-6]$/.test(e.key)&&S.mode==="quiz"){ const b=$$("#bc .cb")[+e.key-1]; if(b&&!b.disabled) b.click(); } });
/* ---------- 시작 ---------- */
/* 해시: #resume(저장 위치) · #ch=2(챕터 2) · #ch=2.5(챕터 2의 5단계) · #quiz · #result */
function boot(){ const m=/^#(resume|ch=(\d+)(?:\.(\d+))?|quiz|result)$/.exec(location.hash||"");
  if(m&&m[1]==="resume"&&L.pos&&!L.done){ S=Object.assign(S,{mode:L.pos.mode||"step",ci:L.pos.ci||0,si:L.pos.si||0,qi:L.pos.qi||0}); if(S.mode==="quiz"){ const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; if(k<0&&QZ.every(q=>ST.done[q.id])) S.mode="result"; } if(S.mode==="step"&&!CH[S.ci]) S.mode="intro"; }
  else if(m&&m[2]){ const ci=Math.max(0,Math.min(CH.length-1,+m[2]-1)); const si=m[3]?Math.max(0,Math.min(CH[ci].steps.length-1,+m[3]-1)):0; S=Object.assign(S,{mode:"step",ci:ci,si:si,rev:(CH[ci].steps[si]||{}).t==="ex"&&/\.\d+r$/.test(location.hash)}); }
  else if(m&&m[1]==="quiz"&&QZ.length){ S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; }
  else if(m&&m[1]==="result"){ S.mode="result"; }
  render(); }
window.__cr={get D(){return D;},get S(){return S;},set S(v){S=v;},get T(){return T;},get L(){return L;},get ST(){return ST;},get fullText(){return fullText;},render:function(){ return render(); }};  /* 검사기(classroom_check.cjs)용 창구 */
