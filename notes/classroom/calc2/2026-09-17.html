<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벡터 계산 — 두 점 벡터, 크기, 표준기저벡터 i j k, 단위벡터</title>
<!-- 교실 모드 템플릿 v1.1 (캐릭터 = docs/tools/tutor.svg 인라인, 이름 김주영 스앵님) (대표님 2026-09-26 결정: 초록 칠판 + 스앵님(김주영 미니버전) 캐릭터가 알려주는 느낌 · 목차/챕터 · 듀오링고식 XP·스트릭·하트·호감도 · 시스템은 최대한 심플)
     build_classroom.py 가 제목·자료(JSON)·교재 경로 자리를 채운다. 저장: localStorage mc-tutor(전역 XP·스트릭·하트·호감도·회차 위치) + mc-lesson-<id>(읽음·문제, 교재 페이지·앱 V52 와 공유) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--wall:#F4EEE2;--wood:#7A4E2B;--wood-2:#5C3A1E;--green:#2F5F4E;--green-2:#25503F;--chalk:#F5F2E9;--chalk-2:rgba(245,242,233,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --ink:#1F2A44;--ink-2:#55627A;--ink-3:#7C889B;--du-green:#58CC02;--du-green-2:#46A302;--du-blue:#1CB0F6;--du-blue-2:#1899D6;--du-red:#FF4B4B;--du-red-2:#EA2B2B;--du-gray:#E5E5E5;--du-gray-2:#CFCFCF;--du-yel:#FFC800;--du-orange:#FF9600;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--pen:"Nanum Pen Script","Pretendard Variable",sans-serif;--fs:19px;--hud:56px}
*{box-sizing:border-box}
html{background:var(--wall)}
body{margin:0;font-family:var(--f);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.6;
  background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.7),transparent 42%),radial-gradient(circle at 80% 90%,rgba(255,225,170,.35),transparent 46%),var(--wall);min-height:100vh}
button{font-family:inherit}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:2px solid rgba(31,42,68,.08)}
#hud .in{max-width:1000px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
#hud .chp{font-size:12.5px;font-weight:800;color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
#hud .pbar{flex:1;height:14px;border-radius:99px;background:#E6E2D6;overflow:hidden;position:relative}
#hud .pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7ED957,#58CC02);transition:width .45s cubic-bezier(.2,.8,.2,1)}
#hud .pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
#hud .hr{display:flex;align-items:center;gap:10px}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--ink-2);padding:4px 8px;border-radius:12px;background:rgba(255,255,255,.7);border:2px solid rgba(31,42,68,.06);position:relative}
.stat svg{width:18px;height:18px;display:block}
.stat small{font-weight:700;color:var(--ink-3);font-size:11px}
.stat.xp{color:#B26A00}.stat.sk{color:#E8590C}.stat.hp{color:#E03131;gap:2px}.stat.af{color:#D0397A}
.stat.hp svg{width:17px}
.stat .gauge{display:inline-block;width:56px;height:9px;border-radius:99px;background:#F1D4E0;overflow:hidden}
.stat .gauge b{display:block;height:100%;width:0;background:linear-gradient(90deg,#F783AC,#D0397A);transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#2B8A3E;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#E03131}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:0;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer;border-bottom:3px solid #000}
#hToc:active{transform:translateY(1px);border-bottom-width:2px}
/* ---------- 교실 ---------- */
main{max-width:1000px;margin:0 auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - var(--hud))}
#board{position:relative;flex:1;display:flex;flex-direction:column;min-height:360px}
.frame{flex:1;display:flex;padding:14px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 18px 40px rgba(60,40,20,.22),inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.25);position:relative}
.frame::before{content:"";position:absolute;inset:6px;border-radius:10px;border:2px solid rgba(255,255,255,.08);pointer-events:none}
.green{flex:1;position:relative;border-radius:6px;background:
  radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.07),transparent 42%),radial-gradient(ellipse at 78% 74%,rgba(255,255,255,.05),transparent 40%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chk{position:absolute;left:18px;top:12px;font-family:var(--pen);font-size:22px;color:var(--yel);letter-spacing:.02em;opacity:.95;z-index:2;text-shadow:0 0 2px rgba(255,226,122,.35)}
.chk small{font-family:var(--f);font-size:11.5px;font-weight:800;color:var(--chalk-2);margin-left:8px;letter-spacing:.06em;vertical-align:middle}
#bwrap{flex:1;overflow:auto;padding:46px 34px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bc{margin:auto 0;width:100%}  /* 짧은 판서는 세로 가운데, 긴 판서는 위에서부터 스크롤 */
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-size:var(--fs);line-height:1.75;text-shadow:0 0 1px rgba(255,255,255,.28);max-width:840px}
#bc>*{animation:write .5s ease-out both}
#bc>*:nth-child(2){animation-delay:.15s}#bc>*:nth-child(3){animation-delay:.3s}#bc>*:nth-child(4){animation-delay:.45s}#bc>*:nth-child(n+5){animation-delay:.6s}
@keyframes write{from{opacity:0;transform:translateY(6px);filter:blur(1px)}to{opacity:1;transform:none;filter:none}}
#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc p{margin:0 0 12px}
#bc .sub{font-family:var(--pen);font-size:28px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .tk{font-size:calc(var(--fs) + 1px)}
#bc .katex{color:var(--chalk);font-size:1.06em}#bc .katex-display{margin:12px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
#bc a{color:var(--sky)}
#bc table{border-collapse:collapse;margin:8px 0;font-size:.92em}#bc td,#bc th{border:1px dashed rgba(245,242,233,.45);padding:5px 10px;text-align:left}#bc th{color:var(--yel)}
#bc ul,#bc ol{margin:6px 0 10px;padding-left:24px}
/* 상자들: 분필 테두리 */
#bc .bx{margin:6px 0 14px;padding:14px 18px 12px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative;font-size:var(--fs)}
#bc .bx>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;line-height:1;margin-bottom:8px;letter-spacing:.02em}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}
#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75);background:rgba(255,255,255,.05)}#bc .bx.formula>i{color:var(--mint)}
#bc .bx.pitfall{border-color:rgba(255,163,199,.7);background:rgba(255,120,160,.07)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7);background:rgba(255,255,255,.05)}#bc .bx.memo>i{color:var(--chalk)}
#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
/* 붙임 자료(그림): 칠판에 붙인 종이 — 그림은 교재와 같은 원본 그대로(색·글자 검증 유지) */
#bc .paper{background:#FFFDF7;color:var(--ink);text-shadow:none;border-radius:6px;padding:14px 16px 10px;margin:8px auto 16px;max-width:600px;box-shadow:0 10px 24px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.6) inset;transform:rotate(-.8deg);position:relative;text-align:center}
#bc .paper::before{content:"";position:absolute;left:50%;top:-10px;width:78px;height:20px;margin-left:-39px;background:rgba(255,224,130,.75);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}
#bc .paper figcaption,#bc .paper .cap{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.5;text-align:center}
#bc .paper b{color:var(--ink)}#bc .paper .katex{color:var(--ink)}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
/* 예제 */
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}
#bc .ex .exq>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--yel);line-height:1;margin-bottom:6px}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}
#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz .qn{font-family:var(--pen);font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:calc(var(--fs) + 1px)}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-weight:900;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12);transform:translateY(-1px)}
#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz .cb .katex{color:inherit}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}
#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--pen);font-size:44px;line-height:1.15;color:var(--chalk);margin:0 0 6px;text-shadow:0 0 3px rgba(255,255,255,.2)}
#bc .lead{color:var(--chalk-2);font-size:calc(var(--fs) - 1px);margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
#bc .toc li{display:flex;align-items:center;gap:12px;font-size:var(--fs);padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-size:13px;font-weight:900}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}
#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;padding:10px 0 0}
#bc .res .big{font-family:var(--pen);font-size:64px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:var(--fs);margin:6px 0 12px}
#bc .res .stats b{display:block;font-size:34px;line-height:1.1}
#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700;letter-spacing:.04em}
#bc .res .badge{margin:4px auto 0;width:140px;height:140px}
#bc .res .bl{font-size:13px;font-weight:800;color:var(--chalk-2);letter-spacing:.04em;margin-top:4px}
#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
/* 분필 받침 */
.tray{height:20px;margin:0 30px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:8px;width:48px;border-radius:4px;background:#F5F2E9;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tray i.y{left:80px;background:var(--yel)}.tray i.p{left:140px;background:var(--pink)}.tray i.w{left:24px}
.tray i.er{left:auto;right:30px;width:64px;height:12px;top:3px;border-radius:3px;background:linear-gradient(180deg,#2B2B33,#111);}
/* ---------- 대화 ---------- */
#dlg{display:flex;align-items:flex-end;gap:14px;min-height:170px}
#tutor{flex:0 0 170px;width:170px;height:200px;margin-bottom:-6px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
.box{flex:1;min-width:0;background:#fff;border:2px solid rgba(31,42,68,.12);border-radius:18px;padding:16px 18px 14px;box-shadow:0 12px 30px rgba(31,42,68,.10);position:relative;min-height:150px;display:flex;flex-direction:column}
.box::before{content:"";position:absolute;left:-12px;bottom:46px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.name{position:absolute;left:16px;top:-14px;background:var(--ink);color:#FFE27A;font-family:var(--pen);font-size:22px;line-height:1;padding:5px 14px 4px;border-radius:10px;letter-spacing:.03em;border-bottom:3px solid #000}
.name.prof{background:#7A2E52;color:#FFD6E7}
.text{flex:1;font-size:18px;line-height:1.65;padding:8px 0 10px;min-height:56px;cursor:pointer}
.text .cur{display:inline-block;width:.55em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.choices{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cbt{border:0;font:inherit;font-weight:800;font-size:15.5px;padding:11px 18px;border-radius:14px;cursor:pointer;color:#fff;background:var(--du-blue);border-bottom:4px solid var(--du-blue-2);transition:transform .08s,filter .15s;letter-spacing:-.01em;min-height:46px}
.cbt:hover{filter:brightness(1.05)}.cbt:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.cbt.p{background:var(--du-green);border-bottom-color:var(--du-green-2)}
.cbt.g{background:#fff;color:var(--ink-2);border:2px solid var(--du-gray);border-bottom:4px solid var(--du-gray)}
.cbt.g:active{border-bottom-width:2px}
.cbt.r{background:var(--du-red);border-bottom-color:var(--du-red-2)}
.cbt.y{background:var(--du-yel);border-bottom-color:#E5A800;color:#4A3600}
.cbt kbd{font:inherit;font-size:11px;opacity:.7;margin-left:6px}
.choices .sp{flex:1}
.tip{font-size:12.5px;color:var(--ink-3);margin-left:auto}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.55);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-size:22px}
#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:#F7F7F7;border:2px solid #EEE;border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--du-blue)}
#ov li .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #CFCFCF;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--ink-3)}
#ov li.done .st{background:var(--du-green);border-color:var(--du-green);color:#fff}
#ov li.cur button{border-color:var(--du-yel);background:#FFF8DC}
#ov li small{margin-left:auto;color:var(--ink-3);font-weight:700;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* ---------- 폰 ---------- */
@media(max-width:640px){
  :root{--fs:16.5px;--hud:50px}
  /* 폰 HUD: 과목 이름은 칠판 위 태그에 있으니 숨기고 CH n/m + 진행 막대 + 수치만 */

<script>
const D={"id": "calc2-2026-09-17", "slug": "calc2", "course": "미분적분학2", "date": "2026-09-17", "sess": "9/17(목) · 3주차", "title": "벡터 계산 — 두 점 벡터, 크기, 표준기저벡터 i j k, 단위벡터", "lead": "12.2를 끝내는 날. 개념 ①~⑤(위치벡터 → 두 점 벡터 = \\(\\overrightarrow{OB}-\\overrightarrow{OA}\\) → 크기 → 연산 → ★표준기저벡터 → ★단위벡터)와 예제 넷, 마지막 10분에 12.3 <b>내적<\/b>의 정의와 정리 1 도입. 교수님: \"시험 문제와 연관되는 건 <b>④ 표준기저벡터부터<\/b>\", \"\\(|2\\vec a-3\\vec b|\\) 유형은 <b>퀴즈<\/b>\", \"i, j, k로 주어진 문제는 답도 i, j, k로 써야 <b>만점<\/b>\".", "minutes": 22, "chapters": [{"id": "s1", "title": "두 점으로 정한 벡터 — 끝점 − 시작점 ★", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"80\" cy=\"160\" r=\"5\" fill=\"#1F2A44\"><\/circle><text x=\"64\" y=\"178\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">O<\/text><circle cx=\"220\" cy=\"60\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"196\" y=\"44\" font-size=\"12\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">A(x₁, y₁, z₁)<\/text><circle cx=\"420\" cy=\"120\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"430\" y=\"116\" font-size=\"12\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">B(x₂, y₂, z₂)<\/text><line x1=\"86\" y1=\"156\" x2=\"214\" y2=\"64\" stroke=\"#F59F00\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"><\/line><text x=\"130\" y=\"100\" font-size=\"13\" fill=\"#B26A00\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">OA<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"86\" y1=\"158\" x2=\"414\" y2=\"121\" stroke=\"#F59F00\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"><\/line><text x=\"250\" y=\"152\" font-size=\"13\" fill=\"#B26A00\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">OB<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"226\" y1=\"62\" x2=\"414\" y2=\"118\" stroke=\"#2F9E44\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"330\" y=\"60\" font-size=\"14\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">AB<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">OB<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> − <tspan font-weight=\"700\">OA<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"330\" y=\"184\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= (x₂−x₁, y₂−y₁, z₂−z₁)   「끝점 − 시작점」 — 거리 공식에서 루트만 안 씌운 것<\/text><\/svg><figcaption>원점이 없는 두 점 벡터를 위치벡터로 환원(판서 ①). BA 로 읽으면 안 된다 — 확 바뀐다.<\/figcaption>"}, {"t": "formula", "html": "\\[\\overrightarrow{AB}=\\overrightarrow{OB}-\\overrightarrow{OA}=\\langle x_2-x_1,\\ y_2-y_1,\\ z_2-z_1\\rangle\\qquad \\text{Ex01 }A(2,-3,4),\\ B(-2,1,1):\\ \\overrightarrow{AB}=\\langle-4,4,-3\\rangle\\]"}, {"t": "say", "html": "\"두 점 A, B의 벡터라 하면 <b>자동으로 앞이 시작점, 뒤가 끝점<\/b>. BA로 읽으면 안 됨 — 확 바뀐다.\" · \"어디서 많이 본 것? 거리 공식과 똑같다 — <b>루트만 안 씌운 것<\/b>.\""}, {"t": "why", "html": "모든 벡터의 시작점을 원점으로 두면(위치벡터) 성분 = 좌표. 원점이 시작점이 아닌 \\(\\overrightarrow{AB}\\)는 두 위치벡터의 차로 환원한다. Ex01의 그림: \\(\\langle-4,4,-3\\rangle\\)은 원점에서 그은 위치벡터 자리에 있고 A→B 화살표는 그것을 <b>평행 이동<\/b>한 것 — \"꼭 그 위에 있어야 하는 게 아니라 방향이 같다\"(뒤의 공간 직선의 방향벡터 암시)."}, {"t": "analogy", "html": "A 집에서 B 집으로 가는 길 = (원점에서 B까지) − (원점에서 A까지). 지도의 원점이 어디든 차이는 같다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\overrightarrow{AB}=\\overrightarrow{OB}-\\overrightarrow{OA}\\) · 끝 − 시작 · Ex01 \\(\\langle-4,4,-3\\rangle\\) · 유향선분(有向) = 방향 있는 선분"}], "say": null}, {"id": "s2", "title": "크기 = 거리 · 연산은 덧셈·뺄셈·실수배에만 닫혀 있다", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 190\" width=\"560\" height=\"190\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"150\" y1=\"150\" x2=\"235\" y2=\"150\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"150\" y2=\"65\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"99.0\" y2=\"192.5\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"241\" y=\"155\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y<\/text><text x=\"146\" y=\"59\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">z<\/text><text x=\"93.0\" y=\"182.5\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x<\/text><line x1=\"150\" y1=\"150\" x2=\"210.0\" y2=\"105.0\" stroke=\"#2F9E44\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><circle cx=\"210.0\" cy=\"105.0\" r=\"5\" fill=\"#FF4D8D\"><\/circle><line x1=\"210.0\" y1=\"175.0\" x2=\"210.0\" y2=\"105.0\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><line x1=\"120.0\" y1=\"175.0\" x2=\"210.0\" y2=\"175.0\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><line x1=\"240.0\" y1=\"150.0\" x2=\"210.0\" y2=\"175.0\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><text x=\"218.0\" y=\"101.0\" font-size=\"12\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(a₁, a₂, a₃)<\/text><text x=\"400\" y=\"60\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| = √(a₁² + a₂² + a₃²)<\/text><text x=\"400\" y=\"86\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= 원점에서 끝점까지 거리<\/text><text x=\"400\" y=\"116\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">읽기: 「a 벡터의 크기」<\/text><text x=\"400\" y=\"140\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">성분 → 크기는 성분 제곱합의 제곱근<\/text><\/svg><figcaption>벡터의 크기(magnitude) = 직육면체의 대각선 = 거리 공식(판서 ②).<\/figcaption>"}, {"t": "formula", "html": "\\[|\\vec a|=\\sqrt{a_1^2+a_2^2+a_3^2}\\qquad \\vec a=\\vec b\\Leftrightarrow a_i=b_i,\\quad \\vec a\\pm\\vec b=\\langle a_1\\pm b_1,a_2\\pm b_2,a_3\\pm b_3\\rangle,\\quad k\\vec a=\\langle ka_1,ka_2,ka_3\\rangle\\]"}, {"t": "why", "html": "크기(magnitude)는 \\(|\\vec a|\\)로 쓰고 \"a 벡터의 크기\"라 읽는다(절댓값 a 벡터 ✗). 연산은 <b>같은 차원끼리<\/b>(행렬처럼), 앞으로는 말 안 해도 전부 R³. 벡터는 덧셈·뺄셈·실수배에만 닫혀 있고 곱셈·나눗셈은 없다(내적·외적은 별도) — 여담: 사칙연산 전부에 닫힌 것이 미적1의 극한, 그래서 미분·적분이 가능."}, {"t": "say", "html": "\"상등은 대학에서 물어보면 <b>2점짜리<\/b>.\" · \"<b>클리닉 센터에서 벡터 연산과 크기 구하기를 물어본다<\/b> — 기본 중 기본.\""}, {"t": "analogy", "html": "같은 종류 동전끼리만 더한다(x는 x끼리). 실수배는 모든 동전을 k배로. 벡터끼리 \"곱하기\"는 없다 — 그 자리를 내적(9/22)이 다른 뜻으로 채운다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(|\\vec a|=\\sqrt{\\sum a_i^2}\\) · 상등·합차·실수배는 성분끼리 · 곱셈·나눗셈 없음 · 클리닉 질문 항목"}], "say": null}, {"id": "s3", "title": "★④ 표준기저벡터 i, j, k — 시험은 여기부터", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"150\" y1=\"150\" x2=\"240\" y2=\"150\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"150\" y2=\"60\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"96.0\" y2=\"195.0\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"246\" y=\"155\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y<\/text><text x=\"146\" y=\"54\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">z<\/text><text x=\"90.0\" y=\"185.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x<\/text><line x1=\"150\" y1=\"150\" x2=\"190.0\" y2=\"150.0\" stroke=\"#E03131\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"192.0\" y=\"168.0\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">j<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"150\" y1=\"150\" x2=\"150.0\" y2=\"110.0\" stroke=\"#E03131\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"138.0\" y=\"114.0\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">k<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"150\" y1=\"150\" x2=\"126.0\" y2=\"170.0\" stroke=\"#E03131\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"112.0\" y=\"174.0\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">i<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"400\" y=\"46\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">i<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (1,0,0),  <tspan font-weight=\"700\">j<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (0,1,0),  <tspan font-weight=\"700\">k<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (0,0,1)<\/text><text x=\"400\" y=\"76\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (a₁, a₂, a₃) = (a₁,0,0) + (0,a₂,0) + (0,0,a₃)<\/text><text x=\"400\" y=\"98\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= a₁(1,0,0) + a₂(0,1,0) + a₃(0,0,1)<\/text><text x=\"400\" y=\"126\" font-size=\"15\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= a₁ <tspan font-weight=\"700\">i<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> + a₂ <tspan font-weight=\"700\">j<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> + a₃ <tspan font-weight=\"700\">k<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"400\" y=\"160\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">★ 「시험 문제와 연관되는 건 여기부터」<\/text><\/svg><figcaption>표준기저벡터(standard basis vector): 각 축에서 크기 1 인 점. i, j, k 앞의 값이 곧 성분 — 두 표기를 자유롭게 오간다.<\/figcaption>"}, {"t": "say", "html": "(20:46) \"시험 문제와 연관되는 건 네 번째부터.\" · \"고등과정에 없는 대학 내용. <b>문제가 이 표현으로 나온다<\/b> → 알아야 한다.\" · \"i, j, k 앞의 값이 곧 성분 → <b>두 표기를 자유롭게 왔다 갔다<\/b>.\""}, {"t": "why", "html": "standard(표준) + basis(기저, 기본) + vector. 각 축에서 크기 1인 점 \\((1,0,0),(0,1,0),(0,0,1)\\). 성분 표기를 실수배·덧셈으로 풀면 \\(\\vec a=a_1\\vec i+a_2\\vec j+a_3\\vec k\\) — 어떤 벡터든 세 기저의 1차결합. \\(\\vec b=4\\vec i+7\\vec k\\)처럼 \\(\\vec j\\)가 없으면 <b>0·j<\/b>가 있는 것(성분으로 \\((4,0,7)\\))."}, {"t": "ex", "q": "Ex03 \\(\\vec a=\\vec i+2\\vec j-3\\vec k\\), \\(\\vec b=4\\vec i+7\\vec k\\) → \\(2\\vec a+3\\vec b\\)", "a": "<p>풀이 1(권장): \\(2\\vec a=2\\vec i+4\\vec j-6\\vec k\\), \\(3\\vec b=12\\vec i+21\\vec k\\) → i끼리·j끼리·k끼리: <b>\\(14\\vec i+4\\vec j+15\\vec k\\)<\/b>. 풀이 2: 성분 \\((1,2,-3),(4,0,7)\\) → \\((14,4,15)\\) → 다시 기저로. \"답은 같지만 왔다 갔다는 <b>시간 낭비<\/b>. <b>i, j, k로 주어지면 답도 i, j, k로<\/b> 써야 만점 — 출제자가 원하는 형태를 따라가라.\"<\/p>"}, {"t": "analogy", "html": "동·서·남·북·위·아래 같은 기준 방향(기저)이 있으면 어떤 이동도 \"동쪽 3, 북쪽 2, 위 1\"처럼 쓸 수 있다. i, j, k가 그 기준 방향."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\vec a=a_1\\vec i+a_2\\vec j+a_3\\vec k\\) · 성분 ↔ 기저 자유롭게 · 문제 표기대로 답 · Ex03 \\(14\\vec i+4\\vec j+15\\vec k\\)"}], "say": null}, {"id": "s4", "title": "★⑤ 단위벡터 — 방향은 같고 크기만 1로", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"40\" cy=\"110\" r=\"5\" fill=\"#1F2A44\"><\/circle><text x=\"30\" y=\"128\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">O<\/text><line x1=\"46\" y1=\"107\" x2=\"300\" y2=\"40\" stroke=\"#1971C2\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"232\" y=\"96\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = 2i − j − 2k,  |<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| = 3<\/text><line x1=\"46\" y1=\"107\" x2=\"130\" y2=\"85\" stroke=\"#2F9E44\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"88\" y=\"130\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">u<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (1/|a|) <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"88\" y=\"146\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">같은 방향, 원점에서 1/3 지점<\/text><text x=\"430\" y=\"60\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">★⑤ 단위벡터 = 크기 1<\/text><text x=\"430\" y=\"84\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">u<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> / |<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| = ⅔i − ⅓j − ⅔k (Ex04)<\/text><text x=\"430\" y=\"112\" font-size=\"11.5\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">「u 라고만 쓰면 일반 벡터 — (1/|a|)a 꼴로 써야」<\/text><\/svg><figcaption>어떤 벡터든 자기 크기로 나누면 같은 방향의 단위벡터. i, j, k 도 단위벡터.<\/figcaption>"}, {"t": "formula", "html": "\\[|\\vec i|=|\\vec j|=|\\vec k|=1,\\qquad \\vec u=\\frac{1}{|\\vec a|}\\vec a\\ (\\text{a 와 같은 방향의 단위벡터})\\qquad \\text{Ex04: }\\vec a=2\\vec i-\\vec j-2\\vec k,\\ |\\vec a|=3,\\ \\vec u=\\tfrac23\\vec i-\\tfrac13\\vec j-\\tfrac23\\vec k\\]"}, {"t": "say", "html": "\"u라고만 쓰면 그냥 일반 벡터(v, w처럼). 단위벡터로 쓰려면 앞에 단위벡터라고 밝히거나 \\((1/|\\vec a|)\\vec a\\) 꼴을 써야 한다.\" · \"④⑤는 별거 아니지만 머릿속에 기억 — 뒤에서 공식이 왜 그렇게 나오는지 설명할 때 필요.\""}, {"t": "why", "html": "벡터를 자기 크기로 나누면 방향은 그대로, 크기는 1. 그림으로: 점 \\(P(2,-1,-2)\\)까지가 \\(\\vec a\\)(크기 3), 단위벡터는 <b>같은 방향 위, 원점에서 1/3 지점<\/b>. 검산 \\(|\\vec u|=\\sqrt{4/9+1/9+4/9}=1\\). \"계산만 하면 안 되고 이 그림을 이해해야 뒤 문제가 쉬워진다.\""}, {"t": "ex", "q": "Ex02 \\(\\vec a=(2,1,3)\\), \\(\\vec b=(3,-2,1)\\), \\(|2\\vec a-3\\vec b|\\) — \"퀴즈 문제로 나온다\"", "a": "<p>i) \\(2\\vec a-3\\vec b=(4,2,6)-(9,-6,3)=(-5,8,3)\\) (실수배는 숫자만 곱하고 빼기는 그대로 두면 안 헷갈린다) ii) \\(|\\cdot|=\\sqrt{25+64+9}=\\sqrt{98}=\\sqrt{2\\cdot49}=\\mathbf{7\\sqrt2}\\). √ 안은 반드시 소인수분해 — √98로 끝내면 감점. (아토 필기의 −8은 +8로 고칠 것.)<\/p>"}, {"t": "analogy", "html": "단위벡터는 \"방향만 남긴 나침반 바늘\"(정역학 9/7과 같은 말). 길이를 1로 맞춰 두면 \"얼마나\"는 따로 곱한다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\vec u=\\vec a/|\\vec a|\\) · 표기: 단위벡터라 밝히거나 \\((1/|a|)a\\) · Ex02 \\(7\\sqrt2\\) · Ex04 \\(\\frac23\\vec i-\\frac13\\vec j-\\frac23\\vec k\\) · sol. i) ii) 단계 번호 형식"}], "say": null}, {"id": "s5", "title": "12.3 내적 도입 — 정의(성분 합)와 정리 1(코사인) ★", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 230\" width=\"560\" height=\"230\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"70\" cy=\"170\" r=\"5\" fill=\"#1F2A44\"><\/circle><text x=\"56\" y=\"188\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">O<\/text><circle cx=\"260\" cy=\"60\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"260\" y=\"46\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">A<\/text><circle cx=\"390\" cy=\"150\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"402\" y=\"156\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">B<\/text><line x1=\"76\" y1=\"166\" x2=\"254\" y2=\"64\" stroke=\"#1971C2\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"128\" y=\"96\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">OA<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"76\" y1=\"168\" x2=\"384\" y2=\"151\" stroke=\"#E03131\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"230\" y=\"182\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">OB<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"384\" y1=\"146\" x2=\"266\" y2=\"66\" stroke=\"#2F9E44\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"><\/line><text x=\"346\" y=\"74\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">BA<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> − <tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><path d=\"M108.1 148.0 A 44 44 0 0 1 113.9 167.7\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"1.5\"><\/path><text x=\"121.8\" y=\"158.7\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">θ<\/text><text x=\"445\" y=\"34\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">[Def 01] <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>·<tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = a₁b₁ + a₂b₂ + a₃b₃<\/text><text x=\"445\" y=\"54\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">결과는 실수(스칼라) → scalar product<\/text><text x=\"445\" y=\"190\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">[Thm 01] <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>·<tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = |<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>||<tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| cos θ<\/text><text x=\"445\" y=\"210\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">삼각형 OAB, 일각삼변 → 코사인 제2법칙<\/text><\/svg><figcaption>12.3 내적 도입. 점은 진하게(× 금지), 순서 무관. 증명(코사인 법칙)은 9/22.<\/figcaption>"}, {"t": "formula", "html": "\\[\\textbf{Def 01}\\ \\vec a\\cdot\\vec b=a_1b_1+a_2b_2+a_3b_3\\ (\\text{실수})\\qquad \\textbf{Thm 01}\\ \\vec a\\cdot\\vec b=|\\vec a||\\vec b|\\cos\\theta\\ \\Rightarrow\\ \\cos\\theta=\\frac{\\vec a\\cdot\\vec b}{|\\vec a||\\vec b|}\\ \\Rightarrow\\ \\theta\\]"}, {"t": "say", "html": "\"dot product = 점의 곱 → 내적(inner product). 스칼라 프로덕트라고도 — <b>결과가 항상 실수<\/b>.\" · \"점을 <b>진하게<\/b> 찍는다. 연필로 살짝 ✗, ×나 다른 기호 ✗. 순서 무관.\" · (58:40) \"<b>중간고사 문제 관련 내용.<\/b>\""}, {"t": "why", "html": "정의는 같은 성분끼리 곱해 전부 더한 것(정역학 9/14와 같다). 정리 1은 삼각형 OAB에서 \\(\\overrightarrow{OA}=\\vec a\\), \\(\\overrightarrow{OB}=\\vec b\\), \\(\\overrightarrow{BA}=\\vec a-\\vec b\\)(뒤 − 앞)로 세 변의 길이 \\(|\\vec a|,|\\vec b|,|\\vec a-\\vec b|\\)와 사이각 \\(\\theta\\) — <b>일각삼변 = 코사인 제2법칙<\/b>. 증명은 9/22. 필기에는 결론 \\(\\cos\\theta=\\vec a\\cdot\\vec b/(|\\vec a||\\vec b|)\\)까지."}, {"t": "analogy", "html": "정역학 9/9·9/14의 내적(정의·성질·정사영)이 그대로 예습 자료 — 두 과목이 같은 내용을 같은 주에 다룬다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\vec a\\cdot\\vec b=\\sum a_ib_i\\) · 스칼라 · 점 진하게, × 금지 · \\(\\cos\\theta=\\vec a\\cdot\\vec b/|\\vec a||\\vec b|\\) · 다음(9/22) 증명·방향각"}, {"t": "talk", "html": "<p>출결·과제(00:00): 아파서 빠지면 처방전 사진을 이메일로. 결석 1회 −1점, 11회 = F. <b>레포트(중간·기말 때) 반드시 제출<\/b>. 12.2 교재 연습문제는 각자.<\/p>", "sub": null}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 두 점 벡터", "html": "\\(A(2,-3,4)\\), \\(B(-2,1,1)\\)일 때 \\(\\overrightarrow{AB}\\)는?", "choices": [{"html": "\\(\\langle-4,4,-3\\rangle\\)", "ok": true}, {"html": "\\(\\langle4,-4,3\\rangle\\)", "ok": false}, {"html": "\\(\\langle0,-2,5\\rangle\\)", "ok": false}, {"html": "\\(\\langle-4,-2,4\\rangle\\)", "ok": false}], "ans": "끝 − 시작: \\((-2-2,\\ 1+3,\\ 1-4)\\). 2번은 \\(\\overrightarrow{BA}\\)."}, {"id": "q2", "qn": "확인 2 · Ex02", "html": "\\(\\vec a=(2,1,3)\\), \\(\\vec b=(3,-2,1)\\)일 때 \\(|2\\vec a-3\\vec b|\\)는?", "choices": [{"html": "\\(7\\sqrt2\\)", "ok": true}, {"html": "\\(\\sqrt{98}\\)", "ok": false}, {"html": "\\(\\sqrt{50}\\)", "ok": false}, {"html": "\\(14\\)", "ok": false}], "ans": "\\((-5,8,3)\\), \\(\\sqrt{98}=7\\sqrt2\\). √98로 끝내면 감점."}, {"id": "q3", "qn": "확인 3 · 표준기저", "html": "\\(\\vec a=\\vec i+2\\vec j-3\\vec k\\), \\(\\vec b=4\\vec i+7\\vec k\\)일 때 \\(2\\vec a+3\\vec b\\)를 만점 형식으로 쓰면?", "choices": [{"html": "\\(14\\vec i+4\\vec j+15\\vec k\\)", "ok": true}, {"html": "\\((14,4,15)\\)", "ok": false}, {"html": "\\(14\\vec i+15\\vec k\\)", "ok": false}, {"html": "\\(6\\vec i+4\\vec j+4\\vec k\\)", "ok": false}], "ans": "i, j, k로 주어졌으니 답도 i, j, k로. \\(\\vec b\\)의 j 성분은 0이지만 \\(\\vec a\\)의 \\(4\\vec j\\)는 남는다."}, {"id": "q4", "qn": "확인 4 · 단위벡터", "html": "\\(\\vec a=2\\vec i-\\vec j-2\\vec k\\)와 같은 방향의 단위벡터는?", "choices": [{"html": "\\(\\tfrac23\\vec i-\\tfrac13\\vec j-\\tfrac23\\vec k\\)", "ok": true}, {"html": "\\(2\\vec i-\\vec j-2\\vec k\\)", "ok": false}, {"html": "\\(\\tfrac13\\vec i-\\tfrac13\\vec j-\\tfrac13\\vec k\\)", "ok": false}, {"html": "\\(\\tfrac29\\vec i-\\tfrac19\\vec j-\\tfrac29\\vec k\\)", "ok": false}], "ans": "\\(|\\vec a|=3\\), \\(\\vec u=\\vec a/3\\). 4번은 \\(|\\vec a|^2\\)으로 나눈 것."}, {"id": "q5", "qn": "확인 5 · 내적의 정의", "html": "\\(\\vec a\\cdot\\vec b\\)의 정의(Def 01)와 결과의 종류는?", "choices": [{"html": "\\(a_1b_1+a_2b_2+a_3b_3\\), 결과는 실수(스칼라)", "ok": true}, {"html": "\\(\\langle a_1b_1,a_2b_2,a_3b_3\\rangle\\), 결과는 벡터", "ok": false}, {"html": "\\(|\\vec a||\\vec b|\\), 항상 양수", "ok": false}, {"html": "\\(a_1b_2-a_2b_1\\), 스칼라", "ok": false}], "ans": "같은 성분끼리 곱해 더한다 → 실수. 그래서 scalar product."}, {"id": "q6", "qn": "확인 6 · 닫힘", "html": "벡터가 닫혀 있는 연산 세 가지와, 상등의 정의를 쓰라.", "choices": null, "ans": "덧셈·뺄셈·실수배(곱셈·나눗셈 ✗). \\(\\vec a=\\vec b\\Leftrightarrow a_1=b_1,\\ a_2=b_2,\\ a_3=b_3\\) — 같은 차원에서 모든 성분이 같다."}]};

function answer(q,i){

function grade(q,ok){
