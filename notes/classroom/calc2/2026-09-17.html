<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벡터 계산 — 두 점 벡터, 크기, 표준기저벡터 i j k, 단위벡터</title>
<!-- 교실 모드 템플릿 v3 (대표님 2026-09-28: 메가스터디처럼 세련·깔끔 — 흰 강의 슬라이드 + 네이비 머리띠, 판서 = 단계별 핵심 카드(형광펜·식 카드·함정 카드), 그림 = 단계 애니메이션(선 그리기·페이드·맥동) + 다시 보기, 글꼴 = 제목 Gothic A1 · 본문 Pretendard · 말풍선 Gowun Dodum · 숫자 Inter · 말투 = 일타강사 구어체 존댓말)
     v2 회차(D.v===2)는 판서 파일(BOARD)로 만든 단계(판서 줄 누적 + 그림 단계 + 대사), v1 회차는 원문 문단 그대로(「구버전 판서」 표시).
     저장: mc-tutor(전역 XP·연속일·하트·호감도 + 회차 위치 {mode,cid,sid,qi,ver}) + mc-lesson-<id>(챕터 읽음·문제, 수업 노트·앱 V52 와 공유). 오타 설계 회의 1·2차 + 구현 검수 1~6차 조건 반영. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gothic+A1:wght@700;800&family=Inter:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--bg:#F3F4F7;--card:#fff;--line:#E6E8EE;--ink:#151A24;--ink-2:#5B6373;--ink-3:#8A92A3;--navy:#0F1B33;--navy2:#1D2C4D;--green:#1B7A2E;--green-soft:#E8F7EA;--blue:#1F5FBF;--blue-soft:#EEF3FC;--amber:#C2780A;--amber-soft:#FFF6E5;--red:#D9342B;--red-soft:#FFF3F2;--mark:#FFF3A3;
  --fh:"Gothic A1","Pretendard Variable",Pretendard,sans-serif;--fb:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--ft:"Gowun Dodum","Pretendard Variable",Pretendard,sans-serif;--fn:Inter,"Pretendard Variable",Pretendard,sans-serif;--hud:56px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:var(--fb);font-size:16px;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(15,27,51,.05)}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
#hud .in{max-width:1040px;margin:0 auto;height:100%;padding:0 20px;display:flex;align-items:center;gap:16px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-family:var(--fh);font-weight:800;font-size:15px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hud .chp{font-family:var(--fn);font-weight:600;font-size:12px;color:var(--ink-2);white-space:nowrap;letter-spacing:.04em}
#hud .seg{display:flex;gap:4px;flex:1;max-width:300px}#hud .seg i{display:block;flex:1;height:6px;border-radius:3px;background:#E3E6ED}#hud .seg i.on{background:var(--green)}#hud .seg i.cur{background:var(--navy)}
#hud .hr{display:flex;align-items:center;gap:8px}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--fn);font-weight:600;font-size:12.5px;padding:4px 10px;border-radius:999px;position:relative;white-space:nowrap;background:#F3F4F7;color:var(--ink)}
.stat svg{width:15px;height:15px;display:block}
.stat.xp{background:#FFF8DC;color:#8A5A00}.stat.sk{background:#FFF0E6;color:#C2410C}.stat.hp{background:#FFECEC;color:#C92A2A;gap:3px}.stat.af{background:#F7E4EE;color:#B8286A}
.stat .gauge{display:inline-block;width:52px;height:8px;border-radius:99px;background:#F0D0DF;overflow:hidden}.stat .gauge b{display:block;height:100%;width:0;background:#B8286A;transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#1F7A32;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#C92A2A}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer}
/* ---------- 강의 슬라이드(교실 v3: 흰 슬라이드 + 네이비 머리띠, 대표님 2026-09-28 「메가스터디처럼 세련·깔끔」) ---------- */
main{max-width:1040px;margin:0 auto;padding:16px 20px 24px}
#room{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
#board{position:relative}
.slide{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(15,27,51,.06);display:flex;flex-direction:column;min-height:560px;max-height:max(560px,76vh)}
.chk{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:13px 22px;background:var(--navy);color:#fff;white-space:nowrap;overflow:hidden}
.chk>span:first-child{font-family:var(--fh);font-weight:800;font-size:18px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.chk small{font-family:var(--fn);font-size:12px;font-weight:600;color:#C9D3EA;letter-spacing:.06em;margin-left:auto;flex:0 0 auto}
.chk .old{font-family:var(--fb);font-size:11px;color:#FFD5D0;border:1px dashed rgba(255,213,208,.6);border-radius:6px;padding:1px 6px;flex:0 0 auto}
#bwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 22px 22px;scrollbar-width:thin;scrollbar-color:#C9CED8 transparent;display:flex;flex-direction:column}
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:#D5D9E2;border-radius:99px}
#bc{font-family:var(--fb);font-weight:500;font-size:17px;line-height:1.6;width:100%;margin:0}
#bc.v1{font-weight:400;font-size:16.5px;line-height:1.75}
#bc .katex-display{margin:8px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* 판서 = 단계별 핵심 카드 */
.bd-title{font-family:var(--fh);font-weight:800;font-size:15px;color:var(--ink-3);margin:0 0 10px;letter-spacing:.02em}
.bl{position:relative;display:flex;gap:12px;align-items:flex-start;padding:10px 12px;margin:0 0 8px;border-radius:12px;border:1px solid transparent;opacity:0;transform:translateY(8px);transition:opacity .4s ease-out,transform .4s ease-out}
.bl.on,.bl.now{opacity:1;transform:none}.bl.now{transition:none}
.bl::before{content:attr(data-n);flex:0 0 26px;height:26px;border-radius:8px;background:#F3F4F7;color:var(--ink-2);display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:12.5px;line-height:1}
.bl>.bt{flex:1;min-width:0}
.bl.k-li.cur{background:#F7FBF8;border-color:#CDE9D3}.bl.k-li.cur::before{background:var(--green);color:#fff}
.bl.k-h{padding:8px 4px 2px;margin-top:6px}.bl.k-h::before{content:"";display:none}.bl.k-h>.bt{font-family:var(--fh);font-weight:800;font-size:18px;color:var(--navy)}
.bl.k-f{padding:12px 16px;background:#F5F7FB;border-color:#E1E6F0;display:block}.bl.k-f::before{display:none}.bl.k-f .katex-display{margin:2px 0}.bl.k-f .katex{font-size:1.25em}
.bl.k-pit{background:var(--red-soft);border-color:#F3C9C5}.bl.k-pit::before{content:"!";background:var(--red);color:#fff;font-size:15px}
.bl.k-star{background:var(--amber-soft);border-color:#F1DDB4}.bl.k-star::before{content:"★";background:var(--amber);color:#fff;font-size:13px}
.bl.k-res{background:var(--blue-soft);border-color:#CFDCF5}.bl.k-res::before{content:"→";background:var(--blue);color:#fff;font-size:15px}
.bl.k-memo{background:var(--green-soft);border-color:#CDE9D3}.bl.k-memo::before{content:"✓";background:var(--green);color:#fff;font-size:14px}
.bl b,.bl strong{font-weight:800}
.bl .ul{background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px;font-weight:800;text-decoration:none}
.bl.dim{opacity:.62}.bl.dim.on,.bl.dim.now{opacity:.62}
/* 그림 카드 + 단계 애니메이션 */
.bd-fig{margin:12px 0 4px;border:1px solid var(--line);border-radius:14px;padding:10px 14px 8px;background:#fff}
.bd-fig .fh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.bd-fig .fh .pl{margin-left:auto;display:flex;gap:6px}.bd-fig .fh button{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;cursor:pointer;color:var(--ink)}.bd-fig .fh button.a{background:var(--navy);color:#fff;border-color:var(--navy)}
.bd-fig figure{margin:0}.bd-fig svg{width:100%;height:auto;display:block;overflow:visible;max-width:640px;margin:0 auto}.bd-fig figcaption{font-size:13px;color:var(--ink-2);margin-top:6px;text-align:center}
.bd-fig [data-step][hidden]{display:none}
.bd-fig .pre{opacity:0}
.bd-fig .draw{transition:stroke-dashoffset var(--dur,1s) ease-out}
.bd-fig .fade{opacity:0;transition:opacity .35s ease-out}.bd-fig .fade.on{opacity:1}
.bd-fig .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@media (prefers-reduced-motion: reduce){.bl{transition:none}.bd-fig .draw,.bd-fig .fade{transition:none}.bd-fig .pulse{animation:none}}
/* v1(구버전) 판서 상자 */
#bc .tk{font-size:17px}#bc p{margin:0 0 10px}#bc b,#bc strong{font-weight:800}
#bc .sub{font-family:var(--fh);font-weight:800;font-size:18px;color:var(--navy);margin:0 0 8px;line-height:1.3}
#bc .bx{margin:6px 0 14px;padding:12px 16px 10px;border:1px solid var(--line);border-radius:12px;position:relative;background:#FAFBFC}
#bc .bx>i{display:block;font-style:normal;font-family:var(--fh);font-weight:800;font-size:12.5px;line-height:1;margin-bottom:6px;color:var(--ink-2);letter-spacing:.02em}
#bc .bx.why{background:var(--blue-soft);border-color:#CFDCF5}#bc .bx.why>i{color:var(--blue)}#bc .bx.analogy{background:var(--amber-soft);border-color:#F1DDB4}#bc .bx.analogy>i{color:var(--amber)}
#bc .bx.formula{background:#F5F7FB;border-color:#E1E6F0}#bc .bx.formula>i{color:var(--navy)}#bc .bx.pitfall{background:var(--red-soft);border-color:#F3C9C5}#bc .bx.pitfall>i{color:var(--red)}
#bc .bx.memo{background:var(--green-soft);border-color:#CDE9D3}#bc .bx.memo>i{color:var(--green)}#bc .bx.say{border:0;border-left:4px solid var(--amber);border-radius:0;padding:4px 16px;font-style:italic;background:transparent}#bc .bx.say>i{color:var(--amber);font-style:normal}
#bc .paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px 8px;margin:8px auto 14px;max-width:640px;text-align:center}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}#bc .paper figcaption,#bc .paper .cap{font-size:13px;color:var(--ink-2);margin-top:6px}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:8px;background:#111}
#bc .ex .exq{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px;background:#FAFBFC}#bc .ex .exq>i,#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--fh);font-weight:800;font-size:12.5px;line-height:1;margin-bottom:6px;color:var(--navy)}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--green)}#bc .ex .exa>i{color:var(--green)}#bc .ex .exhide{color:var(--ink-3);font-style:italic;font-size:14px}
/* 문제 */
#bc .qz{font-size:17px}
#bc .qz .qn{font-family:var(--fh);font-weight:800;font-size:18px;color:var(--navy);line-height:1.3;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:17.5px}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 30px;height:30px;border-radius:9px;background:#F3F4F7;color:var(--ink-2);display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:14px}
#bc .qz .cb:hover:not([disabled]){background:#F7F8FA}#bc .qz .cb[disabled]{cursor:default;opacity:.8}
#bc .qz .cb.ok{border-color:#9AD9A8;background:var(--green-soft);opacity:1}#bc .qz .cb.ok .n{background:var(--green);color:#fff}
#bc .qz .cb.bad{border-color:#F0B3AE;background:var(--red-soft);opacity:1}#bc .qz .cb.bad .n{background:var(--red);color:#fff}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:var(--ink-3)}#bc .qz .my{margin:8px 0;color:var(--ink-2)}#bc .qz .my b{color:var(--ink)}
#bc .qz .vd{display:inline-block;font-weight:800;font-size:13.5px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:var(--green);color:#fff}#bc .qz .vd.bad{background:var(--red);color:#fff}#bc .qz .vd.wait{background:#F3F4F7;color:var(--ink-2)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--green);background:var(--green-soft);border-radius:0 12px 12px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--fh);font-weight:800;font-size:12.5px;color:var(--green);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--fh);font-weight:800;font-size:26px;line-height:1.25;color:var(--navy);margin:0 0 6px}
#bc .lead{color:var(--ink-2);font-size:16px;margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-size:16px}
#bc .toc li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#FAFBFC}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:9px;background:#F3F4F7;color:var(--ink-2);display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700}
#bc .toc li.done .st{background:var(--green);color:#fff}#bc .toc li.cur{border-color:#B9C6E4;background:var(--blue-soft)}#bc .toc li.cur .st{background:var(--navy);color:#fff}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-family:var(--fn);font-weight:600}
#bc .res{text-align:center}#bc .res .big{font-family:var(--fh);font-weight:800;font-size:34px;line-height:1.15;color:var(--navy);margin:10px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:15px;margin:6px 0 12px}#bc .res .stats b{display:block;font-family:var(--fn);font-size:28px;line-height:1.1}#bc .res .stats span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600}
#bc .res .badge{margin:4px auto 0;width:130px;height:130px;display:block}#bc .res .bl2{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-top:4px}#bc .res .wrong{margin-top:8px;color:var(--red);font-size:14.5px}
#bc .res .stk{display:block;width:150px;height:150px;margin:2px auto 0;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(15,27,51,.18))}
#chpills{margin-top:12px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#chpills .lb{font-size:12px;color:var(--ink-2);font-weight:700;margin-right:4px}
.pill{border:1px solid var(--line);background:#F3F4F7;color:var(--ink-3);font-family:var(--fn);font-weight:600;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.pill.done{background:var(--green-soft);color:var(--green);border-color:transparent}.pill.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
/* ---------- 오른쪽: 스앵님 · 말풍선 · 선택지 ---------- */
#side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--hud) + 16px)}
#tutorCard{padding:12px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
#tutorCard .nm{align-self:flex-start;display:flex;align-items:center;gap:8px;width:100%}
#tutorCard .nm b{font-family:var(--fh);font-weight:800;font-size:13px}#tutorCard .nm span{font-size:11px;color:var(--ink-3);margin-left:auto}
#tutor{width:150px;height:176px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.14));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
#tutorImg{display:none;width:100%;height:100%;object-fit:contain;object-position:center bottom;-webkit-user-select:none;user-select:none}
#tutor.raster #tutorImg{display:block}#tutor.raster svg{display:none}
#tutor.raster.pose{width:170px;height:330px;animation:none}
.box{padding:14px 16px 12px;position:relative;min-height:120px}
.box::before{content:"";position:absolute;left:50%;top:-9px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.name{font-family:var(--fh);font-weight:800;font-size:12px;color:var(--green);margin-bottom:4px}.name.prof{color:var(--amber)}
.text{font-family:var(--ft);font-size:15.5px;line-height:1.65;min-height:48px;cursor:pointer}
.text .cur{display:inline-block;width:.5em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.tip{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.cbt{font:inherit;font-weight:800;font-size:15px;padding:13px 16px;border-radius:12px;cursor:pointer;color:var(--ink);background:#fff;border:1px solid var(--line);transition:transform .08s,filter .15s;width:100%;text-align:center;min-height:46px}
.cbt:hover{filter:brightness(.97)}.cbt:active{transform:translateY(1px)}
.cbt.p{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 6px 16px rgba(15,27,51,.22)}
.cbt.t{background:var(--green-soft);color:var(--green);border-color:transparent}
.cbt.r{background:var(--red);color:#fff;border-color:var(--red)}
.cbt.g{background:#F3F4F7;color:var(--ink-2);border-color:transparent}
.cbt kbd{font-family:var(--fn);font-size:10.5px;opacity:.55;margin-left:6px}
#prog{padding:12px 14px}#prog .k{font-size:12px;color:var(--ink-2);font-weight:700}#prog .v{font-family:var(--fh);font-weight:800;font-size:16px;margin:2px 0 6px}#prog .bar{height:6px;border-radius:3px;background:#E3E6ED;overflow:hidden}#prog .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}#prog .h{font-size:11.5px;color:var(--ink-3);margin-top:6px}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(15,27,51,.55);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-family:var(--fh);font-weight:800;font-size:20px}#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--blue)}#ov li .st{flex:0 0 30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700;color:var(--ink-3)}
#ov li.done .st{background:var(--green);border-color:var(--green);color:#fff}#ov li.cur button{border-color:var(--navy);background:var(--blue-soft)}#ov li small{margin-left:auto;color:var(--ink-3);font-weight:600;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}#ov .row .cbt{width:auto}
/* ---------- 아이패드 세로(768~900) ---------- */
@media(max-width:900px) and (min-width:761px){
  #room{grid-template-columns:minmax(0,1fr) 240px;gap:12px}#tutor{width:120px;height:140px}#tutor.raster.pose{width:130px;height:250px}
  #bc{font-size:16px}.bl.k-h>.bt{font-size:17px}.chk>span:first-child{font-size:16px}#bwrap{padding:14px 16px 18px}
  .cbt{font-size:14px;padding:11px 12px}.text{font-size:14.5px}
}
/* ---------- 폰 ---------- */
@media(max-width:760px){
  :root{--hud:50px}
  #hud .in{gap:6px;padding:0 8px}#hud .hl{display:none}#hud .hc{flex:1 1 auto;min-width:70px;gap:6px}#hud .chp{font-size:11px}#hud .hr{gap:4px;flex:0 0 auto}.stat{padding:3px 6px;font-size:11.5px;gap:3px}.stat svg{width:13px;height:13px}.stat .gauge{width:30px;height:7px}#hToc{padding:5px 8px;font-size:12px}
  main{padding:10px 8px 12px}#room{grid-template-columns:minmax(0,1fr);gap:10px}#board,#side{min-width:0}
  .slide{min-height:340px;max-height:max(340px,60vh);border-radius:14px}.chk{padding:10px 14px;gap:8px}.chk>span:first-child{font-size:15px}#bwrap{padding:12px 12px 16px}
  #bc{font-size:15.5px}.bl{padding:8px 10px;gap:10px}.bl.k-h>.bt{font-size:16px}#bc .ttl{font-size:22px}#bc .res .big{font-size:26px}
  #bc .paper{overflow-x:auto}#bc .paper svg{min-width:460px}.bd-fig{overflow-x:auto}.bd-fig svg{min-width:420px}
  #side{position:static;flex-direction:column}#tutorCard{flex-direction:row;align-items:flex-end;gap:10px;padding:8px 10px}#tutorCard .nm{width:auto;flex-direction:column;align-items:flex-start;gap:0}#tutor{width:84px;height:98px}#tutor.raster.pose{width:96px;height:180px}
  .box::before{display:none}.text{font-size:15px}.cbt{font-size:14px;min-height:42px}.tip{display:none}#prog{display:none}#chpills{display:none}
}

const D={"id": "calc2-2026-09-17", "slug": "calc2", "course": "미분적분학2", "date": "2026-09-17", "sess": "9/17(목) · 3주차", "title": "벡터 계산 — 두 점 벡터, 크기, 표준기저벡터 i j k, 단위벡터", "lead": "12.2를 끝내는 날. 개념 ①~⑤(위치벡터 → 두 점 벡터 = \\(\\overrightarrow{OB}-\\overrightarrow{OA}\\) → 크기 → 연산 → ★표준기저벡터 → ★단위벡터)와 예제 넷, 마지막 10분에 12.3 <b>내적<\/b>의 정의와 정리 1 도입. 교수님: \"시험 문제와 연관되는 건 <b>④ 표준기저벡터부터<\/b>\", \"\\(|2\\vec a-3\\vec b|\\) 유형은 <b>퀴즈<\/b>\", \"i, j, k로 주어진 문제는 답도 i, j, k로 써야 <b>만점<\/b>\".", "minutes": 22, "chapters": [{"id": "s1", "title": "두 점으로 정한 벡터 — 끝점 − 시작점 ★", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"80\" cy=\"160\" r=\"5\" fill=\"#1F2A44\"><\/circle><text x=\"64\" y=\"178\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">O<\/text><circle cx=\"220\" cy=\"60\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"196\" y=\"44\" font-size=\"12\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">A(x₁, y₁, z₁)<\/text><circle cx=\"420\" cy=\"120\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"430\" y=\"116\" font-size=\"12\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">B(x₂, y₂, z₂)<\/text><line x1=\"86\" y1=\"156\" x2=\"214\" y2=\"64\" stroke=\"#F59F00\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"><\/line><text x=\"130\" y=\"100\" font-size=\"13\" fill=\"#B26A00\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">OA<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"86\" y1=\"158\" x2=\"414\" y2=\"121\" stroke=\"#F59F00\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"><\/line><text x=\"250\" y=\"152\" font-size=\"13\" fill=\"#B26A00\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">OB<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"226\" y1=\"62\" x2=\"414\" y2=\"118\" stroke=\"#2F9E44\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"330\" y=\"60\" font-size=\"14\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">AB<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">OB<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> − <tspan font-weight=\"700\">OA<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"330\" y=\"184\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= (x₂−x₁, y₂−y₁, z₂−z₁)   「끝점 − 시작점」 — 거리 공식에서 루트만 안 씌운 것<\/text><\/svg><figcaption>원점이 없는 두 점 벡터를 위치벡터로 환원(판서 ①). BA 로 읽으면 안 된다 — 확 바뀐다.<\/figcaption>"}, {"t": "formula", "html": "\\[\\overrightarrow{AB}=\\overrightarrow{OB}-\\overrightarrow{OA}=\\langle x_2-x_1,\\ y_2-y_1,\\ z_2-z_1\\rangle\\qquad \\text{Ex01 }A(2,-3,4),\\ B(-2,1,1):\\ \\overrightarrow{AB}=\\langle-4,4,-3\\rangle\\]"}, {"t": "say", "html": "\"두 점 A, B의 벡터라 하면 <b>자동으로 앞이 시작점, 뒤가 끝점<\/b>. BA로 읽으면 안 됨 — 확 바뀐다.\" · \"어디서 많이 본 것? 거리 공식과 똑같다 — <b>루트만 안 씌운 것<\/b>.\""}, {"t": "why", "html": "모든 벡터의 시작점을 원점으로 두면(위치벡터) 성분 = 좌표. 원점이 시작점이 아닌 \\(\\overrightarrow{AB}\\)는 두 위치벡터의 차로 환원한다. Ex01의 그림: \\(\\langle-4,4,-3\\rangle\\)은 원점에서 그은 위치벡터 자리에 있고 A→B 화살표는 그것을 <b>평행 이동<\/b>한 것 — \"꼭 그 위에 있어야 하는 게 아니라 방향이 같다\"(뒤의 공간 직선의 방향벡터 암시)."}, {"t": "analogy", "html": "A 집에서 B 집으로 가는 길 = (원점에서 B까지) − (원점에서 A까지). 지도의 원점이 어디든 차이는 같다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\overrightarrow{AB}=\\overrightarrow{OB}-\\overrightarrow{OA}\\) · 끝 − 시작 · Ex01 \\(\\langle-4,4,-3\\rangle\\) · 유향선분(有向) = 방향 있는 선분"}], "say": null}, {"id": "s2", "title": "크기 = 거리 · 연산은 덧셈·뺄셈·실수배에만 닫혀 있다", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 190\" width=\"560\" height=\"190\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"150\" y1=\"150\" x2=\"235\" y2=\"150\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"150\" y2=\"65\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"99.0\" y2=\"192.5\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"241\" y=\"155\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y<\/text><text x=\"146\" y=\"59\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">z<\/text><text x=\"93.0\" y=\"182.5\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x<\/text><line x1=\"150\" y1=\"150\" x2=\"210.0\" y2=\"105.0\" stroke=\"#2F9E44\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><circle cx=\"210.0\" cy=\"105.0\" r=\"5\" fill=\"#FF4D8D\"><\/circle><line x1=\"210.0\" y1=\"175.0\" x2=\"210.0\" y2=\"105.0\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><line x1=\"120.0\" y1=\"175.0\" x2=\"210.0\" y2=\"175.0\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><line x1=\"240.0\" y1=\"150.0\" x2=\"210.0\" y2=\"175.0\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><text x=\"218.0\" y=\"101.0\" font-size=\"12\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">(a₁, a₂, a₃)<\/text><text x=\"400\" y=\"60\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| = √(a₁² + a₂² + a₃²)<\/text><text x=\"400\" y=\"86\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= 원점에서 끝점까지 거리<\/text><text x=\"400\" y=\"116\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">읽기: 「a 벡터의 크기」<\/text><text x=\"400\" y=\"140\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">성분 → 크기는 성분 제곱합의 제곱근<\/text><\/svg><figcaption>벡터의 크기(magnitude) = 직육면체의 대각선 = 거리 공식(판서 ②).<\/figcaption>"}, {"t": "formula", "html": "\\[|\\vec a|=\\sqrt{a_1^2+a_2^2+a_3^2}\\qquad \\vec a=\\vec b\\Leftrightarrow a_i=b_i,\\quad \\vec a\\pm\\vec b=\\langle a_1\\pm b_1,a_2\\pm b_2,a_3\\pm b_3\\rangle,\\quad k\\vec a=\\langle ka_1,ka_2,ka_3\\rangle\\]"}, {"t": "why", "html": "크기(magnitude)는 \\(|\\vec a|\\)로 쓰고 \"a 벡터의 크기\"라 읽는다(절댓값 a 벡터 ✗). 연산은 <b>같은 차원끼리<\/b>(행렬처럼), 앞으로는 말 안 해도 전부 R³. 벡터는 덧셈·뺄셈·실수배에만 닫혀 있고 곱셈·나눗셈은 없다(내적·외적은 별도) — 여담: 사칙연산 전부에 닫힌 것이 미적1의 극한, 그래서 미분·적분이 가능."}, {"t": "say", "html": "\"상등은 대학에서 물어보면 <b>2점짜리<\/b>.\" · \"<b>클리닉 센터에서 벡터 연산과 크기 구하기를 물어본다<\/b> — 기본 중 기본.\""}, {"t": "analogy", "html": "같은 종류 동전끼리만 더한다(x는 x끼리). 실수배는 모든 동전을 k배로. 벡터끼리 \"곱하기\"는 없다 — 그 자리를 내적(9/22)이 다른 뜻으로 채운다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(|\\vec a|=\\sqrt{\\sum a_i^2}\\) · 상등·합차·실수배는 성분끼리 · 곱셈·나눗셈 없음 · 클리닉 질문 항목"}], "say": null}, {"id": "s3", "title": "★④ 표준기저벡터 i, j, k — 시험은 여기부터", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"150\" y1=\"150\" x2=\"240\" y2=\"150\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"150\" y2=\"60\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"96.0\" y2=\"195.0\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"246\" y=\"155\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y<\/text><text x=\"146\" y=\"54\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">z<\/text><text x=\"90.0\" y=\"185.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x<\/text><line x1=\"150\" y1=\"150\" x2=\"190.0\" y2=\"150.0\" stroke=\"#E03131\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"192.0\" y=\"168.0\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">j<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"150\" y1=\"150\" x2=\"150.0\" y2=\"110.0\" stroke=\"#E03131\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"138.0\" y=\"114.0\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">k<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"150\" y1=\"150\" x2=\"126.0\" y2=\"170.0\" stroke=\"#E03131\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"112.0\" y=\"174.0\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">i<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"400\" y=\"46\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">i<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (1,0,0),  <tspan font-weight=\"700\">j<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (0,1,0),  <tspan font-weight=\"700\">k<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (0,0,1)<\/text><text x=\"400\" y=\"76\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (a₁, a₂, a₃) = (a₁,0,0) + (0,a₂,0) + (0,0,a₃)<\/text><text x=\"400\" y=\"98\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= a₁(1,0,0) + a₂(0,1,0) + a₃(0,0,1)<\/text><text x=\"400\" y=\"126\" font-size=\"15\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">= a₁ <tspan font-weight=\"700\">i<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> + a₂ <tspan font-weight=\"700\">j<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> + a₃ <tspan font-weight=\"700\">k<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"400\" y=\"160\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">★ 「시험 문제와 연관되는 건 여기부터」<\/text><\/svg><figcaption>표준기저벡터(standard basis vector): 각 축에서 크기 1 인 점. i, j, k 앞의 값이 곧 성분 — 두 표기를 자유롭게 오간다.<\/figcaption>"}, {"t": "say", "html": "(20:46) \"시험 문제와 연관되는 건 네 번째부터.\" · \"고등과정에 없는 대학 내용. <b>문제가 이 표현으로 나온다<\/b> → 알아야 한다.\" · \"i, j, k 앞의 값이 곧 성분 → <b>두 표기를 자유롭게 왔다 갔다<\/b>.\""}, {"t": "why", "html": "standard(표준) + basis(기저, 기본) + vector. 각 축에서 크기 1인 점 \\((1,0,0),(0,1,0),(0,0,1)\\). 성분 표기를 실수배·덧셈으로 풀면 \\(\\vec a=a_1\\vec i+a_2\\vec j+a_3\\vec k\\) — 어떤 벡터든 세 기저의 1차결합. \\(\\vec b=4\\vec i+7\\vec k\\)처럼 \\(\\vec j\\)가 없으면 <b>0·j<\/b>가 있는 것(성분으로 \\((4,0,7)\\))."}, {"t": "ex", "q": "Ex03 \\(\\vec a=\\vec i+2\\vec j-3\\vec k\\), \\(\\vec b=4\\vec i+7\\vec k\\) → \\(2\\vec a+3\\vec b\\)", "a": "<p>풀이 1(권장): \\(2\\vec a=2\\vec i+4\\vec j-6\\vec k\\), \\(3\\vec b=12\\vec i+21\\vec k\\) → i끼리·j끼리·k끼리: <b>\\(14\\vec i+4\\vec j+15\\vec k\\)<\/b>. 풀이 2: 성분 \\((1,2,-3),(4,0,7)\\) → \\((14,4,15)\\) → 다시 기저로. \"답은 같지만 왔다 갔다는 <b>시간 낭비<\/b>. <b>i, j, k로 주어지면 답도 i, j, k로<\/b> 써야 만점 — 출제자가 원하는 형태를 따라가라.\"<\/p>"}, {"t": "analogy", "html": "동·서·남·북·위·아래 같은 기준 방향(기저)이 있으면 어떤 이동도 \"동쪽 3, 북쪽 2, 위 1\"처럼 쓸 수 있다. i, j, k가 그 기준 방향."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\vec a=a_1\\vec i+a_2\\vec j+a_3\\vec k\\) · 성분 ↔ 기저 자유롭게 · 문제 표기대로 답 · Ex03 \\(14\\vec i+4\\vec j+15\\vec k\\)"}], "say": null}, {"id": "s4", "title": "★⑤ 단위벡터 — 방향은 같고 크기만 1로", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"40\" cy=\"110\" r=\"5\" fill=\"#1F2A44\"><\/circle><text x=\"30\" y=\"128\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">O<\/text><line x1=\"46\" y1=\"107\" x2=\"300\" y2=\"40\" stroke=\"#1971C2\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"232\" y=\"96\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = 2i − j − 2k,  |<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| = 3<\/text><line x1=\"46\" y1=\"107\" x2=\"130\" y2=\"85\" stroke=\"#2F9E44\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"88\" y=\"130\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">u<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = (1/|a|) <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"88\" y=\"146\" font-size=\"11\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">같은 방향, 원점에서 1/3 지점<\/text><text x=\"430\" y=\"60\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">★⑤ 단위벡터 = 크기 1<\/text><text x=\"430\" y=\"84\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">u<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> / |<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| = ⅔i − ⅓j − ⅔k (Ex04)<\/text><text x=\"430\" y=\"112\" font-size=\"11.5\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">「u 라고만 쓰면 일반 벡터 — (1/|a|)a 꼴로 써야」<\/text><\/svg><figcaption>어떤 벡터든 자기 크기로 나누면 같은 방향의 단위벡터. i, j, k 도 단위벡터.<\/figcaption>"}, {"t": "formula", "html": "\\[|\\vec i|=|\\vec j|=|\\vec k|=1,\\qquad \\vec u=\\frac{1}{|\\vec a|}\\vec a\\ (\\text{a 와 같은 방향의 단위벡터})\\qquad \\text{Ex04: }\\vec a=2\\vec i-\\vec j-2\\vec k,\\ |\\vec a|=3,\\ \\vec u=\\tfrac23\\vec i-\\tfrac13\\vec j-\\tfrac23\\vec k\\]"}, {"t": "say", "html": "\"u라고만 쓰면 그냥 일반 벡터(v, w처럼). 단위벡터로 쓰려면 앞에 단위벡터라고 밝히거나 \\((1/|\\vec a|)\\vec a\\) 꼴을 써야 한다.\" · \"④⑤는 별거 아니지만 머릿속에 기억 — 뒤에서 공식이 왜 그렇게 나오는지 설명할 때 필요.\""}, {"t": "why", "html": "벡터를 자기 크기로 나누면 방향은 그대로, 크기는 1. 그림으로: 점 \\(P(2,-1,-2)\\)까지가 \\(\\vec a\\)(크기 3), 단위벡터는 <b>같은 방향 위, 원점에서 1/3 지점<\/b>. 검산 \\(|\\vec u|=\\sqrt{4/9+1/9+4/9}=1\\). \"계산만 하면 안 되고 이 그림을 이해해야 뒤 문제가 쉬워진다.\""}, {"t": "ex", "q": "Ex02 \\(\\vec a=(2,1,3)\\), \\(\\vec b=(3,-2,1)\\), \\(|2\\vec a-3\\vec b|\\) — \"퀴즈 문제로 나온다\"", "a": "<p>i) \\(2\\vec a-3\\vec b=(4,2,6)-(9,-6,3)=(-5,8,3)\\) (실수배는 숫자만 곱하고 빼기는 그대로 두면 안 헷갈린다) ii) \\(|\\cdot|=\\sqrt{25+64+9}=\\sqrt{98}=\\sqrt{2\\cdot49}=\\mathbf{7\\sqrt2}\\). √ 안은 반드시 소인수분해 — √98로 끝내면 감점. (아토 필기의 −8은 +8로 고칠 것.)<\/p>"}, {"t": "analogy", "html": "단위벡터는 \"방향만 남긴 나침반 바늘\"(정역학 9/7과 같은 말). 길이를 1로 맞춰 두면 \"얼마나\"는 따로 곱한다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\vec u=\\vec a/|\\vec a|\\) · 표기: 단위벡터라 밝히거나 \\((1/|a|)a\\) · Ex02 \\(7\\sqrt2\\) · Ex04 \\(\\frac23\\vec i-\\frac13\\vec j-\\frac23\\vec k\\) · sol. i) ii) 단계 번호 형식"}], "say": null}, {"id": "s5", "title": "12.3 내적 도입 — 정의(성분 합)와 정리 1(코사인) ★", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 230\" width=\"560\" height=\"230\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"70\" cy=\"170\" r=\"5\" fill=\"#1F2A44\"><\/circle><text x=\"56\" y=\"188\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">O<\/text><circle cx=\"260\" cy=\"60\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"260\" y=\"46\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">A<\/text><circle cx=\"390\" cy=\"150\" r=\"5\" fill=\"#FF4D8D\"><\/circle><text x=\"402\" y=\"156\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">B<\/text><line x1=\"76\" y1=\"166\" x2=\"254\" y2=\"64\" stroke=\"#1971C2\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"128\" y=\"96\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">OA<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"76\" y1=\"168\" x2=\"384\" y2=\"151\" stroke=\"#E03131\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"230\" y=\"182\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">OB<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"384\" y1=\"146\" x2=\"266\" y2=\"66\" stroke=\"#2F9E44\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"><\/line><text x=\"346\" y=\"74\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"><tspan font-weight=\"700\">BA<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> − <tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><path d=\"M108.1 148.0 A 44 44 0 0 1 113.9 167.7\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"1.5\"><\/path><text x=\"121.8\" y=\"158.7\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">θ<\/text><text x=\"445\" y=\"34\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">[Def 01] <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>·<tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = a₁b₁ + a₂b₂ + a₃b₃<\/text><text x=\"445\" y=\"54\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">결과는 실수(스칼라) → scalar product<\/text><text x=\"445\" y=\"190\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">[Thm 01] <tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>·<tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan> = |<tspan font-weight=\"700\">a<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>||<tspan font-weight=\"700\">b<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan>| cos θ<\/text><text x=\"445\" y=\"210\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">삼각형 OAB, 일각삼변 → 코사인 제2법칙<\/text><\/svg><figcaption>12.3 내적 도입. 점은 진하게(× 금지), 순서 무관. 증명(코사인 법칙)은 9/22.<\/figcaption>"}, {"t": "formula", "html": "\\[\\textbf{Def 01}\\ \\vec a\\cdot\\vec b=a_1b_1+a_2b_2+a_3b_3\\ (\\text{실수})\\qquad \\textbf{Thm 01}\\ \\vec a\\cdot\\vec b=|\\vec a||\\vec b|\\cos\\theta\\ \\Rightarrow\\ \\cos\\theta=\\frac{\\vec a\\cdot\\vec b}{|\\vec a||\\vec b|}\\ \\Rightarrow\\ \\theta\\]"}, {"t": "say", "html": "\"dot product = 점의 곱 → 내적(inner product). 스칼라 프로덕트라고도 — <b>결과가 항상 실수<\/b>.\" · \"점을 <b>진하게<\/b> 찍는다. 연필로 살짝 ✗, ×나 다른 기호 ✗. 순서 무관.\" · (58:40) \"<b>중간고사 문제 관련 내용.<\/b>\""}, {"t": "why", "html": "정의는 같은 성분끼리 곱해 전부 더한 것(정역학 9/14와 같다). 정리 1은 삼각형 OAB에서 \\(\\overrightarrow{OA}=\\vec a\\), \\(\\overrightarrow{OB}=\\vec b\\), \\(\\overrightarrow{BA}=\\vec a-\\vec b\\)(뒤 − 앞)로 세 변의 길이 \\(|\\vec a|,|\\vec b|,|\\vec a-\\vec b|\\)와 사이각 \\(\\theta\\) — <b>일각삼변 = 코사인 제2법칙<\/b>. 증명은 9/22. 필기에는 결론 \\(\\cos\\theta=\\vec a\\cdot\\vec b/(|\\vec a||\\vec b|)\\)까지."}, {"t": "analogy", "html": "정역학 9/9·9/14의 내적(정의·성질·정사영)이 그대로 예습 자료 — 두 과목이 같은 내용을 같은 주에 다룬다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\vec a\\cdot\\vec b=\\sum a_ib_i\\) · 스칼라 · 점 진하게, × 금지 · \\(\\cos\\theta=\\vec a\\cdot\\vec b/|\\vec a||\\vec b|\\) · 다음(9/22) 증명·방향각"}, {"t": "talk", "html": "<p>출결·과제(00:00): 아파서 빠지면 처방전 사진을 이메일로. 결석 1회 −1점, 11회 = F. <b>레포트(중간·기말 때) 반드시 제출<\/b>. 12.2 교재 연습문제는 각자.<\/p>", "sub": null}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 두 점 벡터", "html": "\\(A(2,-3,4)\\), \\(B(-2,1,1)\\)일 때 \\(\\overrightarrow{AB}\\)는?", "choices": [{"html": "\\(\\langle-4,4,-3\\rangle\\)", "ok": true}, {"html": "\\(\\langle4,-4,3\\rangle\\)", "ok": false}, {"html": "\\(\\langle0,-2,5\\rangle\\)", "ok": false}, {"html": "\\(\\langle-4,-2,4\\rangle\\)", "ok": false}], "ans": "끝 − 시작: \\((-2-2,\\ 1+3,\\ 1-4)\\). 2번은 \\(\\overrightarrow{BA}\\)."}, {"id": "q2", "qn": "확인 2 · Ex02", "html": "\\(\\vec a=(2,1,3)\\), \\(\\vec b=(3,-2,1)\\)일 때 \\(|2\\vec a-3\\vec b|\\)는?", "choices": [{"html": "\\(7\\sqrt2\\)", "ok": true}, {"html": "\\(\\sqrt{98}\\)", "ok": false}, {"html": "\\(\\sqrt{50}\\)", "ok": false}, {"html": "\\(14\\)", "ok": false}], "ans": "\\((-5,8,3)\\), \\(\\sqrt{98}=7\\sqrt2\\). √98로 끝내면 감점."}, {"id": "q3", "qn": "확인 3 · 표준기저", "html": "\\(\\vec a=\\vec i+2\\vec j-3\\vec k\\), \\(\\vec b=4\\vec i+7\\vec k\\)일 때 \\(2\\vec a+3\\vec b\\)를 만점 형식으로 쓰면?", "choices": [{"html": "\\(14\\vec i+4\\vec j+15\\vec k\\)", "ok": true}, {"html": "\\((14,4,15)\\)", "ok": false}, {"html": "\\(14\\vec i+15\\vec k\\)", "ok": false}, {"html": "\\(6\\vec i+4\\vec j+4\\vec k\\)", "ok": false}], "ans": "i, j, k로 주어졌으니 답도 i, j, k로. \\(\\vec b\\)의 j 성분은 0이지만 \\(\\vec a\\)의 \\(4\\vec j\\)는 남는다."}, {"id": "q4", "qn": "확인 4 · 단위벡터", "html": "\\(\\vec a=2\\vec i-\\vec j-2\\vec k\\)와 같은 방향의 단위벡터는?", "choices": [{"html": "\\(\\tfrac23\\vec i-\\tfrac13\\vec j-\\tfrac23\\vec k\\)", "ok": true}, {"html": "\\(2\\vec i-\\vec j-2\\vec k\\)", "ok": false}, {"html": "\\(\\tfrac13\\vec i-\\tfrac13\\vec j-\\tfrac13\\vec k\\)", "ok": false}, {"html": "\\(\\tfrac29\\vec i-\\tfrac19\\vec j-\\tfrac29\\vec k\\)", "ok": false}], "ans": "\\(|\\vec a|=3\\), \\(\\vec u=\\vec a/3\\). 4번은 \\(|\\vec a|^2\\)으로 나눈 것."}, {"id": "q5", "qn": "확인 5 · 내적의 정의", "html": "\\(\\vec a\\cdot\\vec b\\)의 정의(Def 01)와 결과의 종류는?", "choices": [{"html": "\\(a_1b_1+a_2b_2+a_3b_3\\), 결과는 실수(스칼라)", "ok": true}, {"html": "\\(\\langle a_1b_1,a_2b_2,a_3b_3\\rangle\\), 결과는 벡터", "ok": false}, {"html": "\\(|\\vec a||\\vec b|\\), 항상 양수", "ok": false}, {"html": "\\(a_1b_2-a_2b_1\\), 스칼라", "ok": false}], "ans": "같은 성분끼리 곱해 더한다 → 실수. 그래서 scalar product."}, {"id": "q6", "qn": "확인 6 · 닫힘", "html": "벡터가 닫혀 있는 연산 세 가지와, 상등의 정의를 쓰라.", "choices": null, "ans": "덧셈·뺄셈·실수배(곱셈·나눗셈 ✗). \\(\\vec a=\\vec b\\Leftrightarrow a_1=b_1,\\ a_2=b_2,\\ a_3=b_3\\) — 같은 차원에서 모든 성분이 같다."}], "v": 1, "ver": ""};

/* ---------- 저장 위치: 정수·범위 정리 + v2 는 고정 id·버전 (오타 v55 1 · 설계 2차 5) ----------
   규칙: v2 — ver 불일치 → 그 챕터 처음(cid 없으면 목차) · sid 없음 → 챕터 처음 · v1 저장값(ci/si) 은 범위 안이면 그대로 · qi 는 항상 범위로 · fs 는 저장하지 않고 단계에서 다시 계산 */
const toInt=v=>Number.isInteger(v)?v:((typeof v==="string"&&/^-?\d+$/.test(v))?parseInt(v,10):NaN);   /* "1junk" 같은 값은 숫자로 안 본다 */
function posOf(){ const p=(L.pos&&typeof L.pos==="object")?L.pos:{}; const mode=(p.mode==="quiz"||p.mode==="step"||p.mode==="result")?p.mode:"step";
  let qi=toInt(p.qi); if(!Number.isInteger(qi)||qi<0||qi>=QZ.length) qi=0;
  let ci=-1, si=0, note="";
  if(V2){ const v2save=("ver" in p)||("cid" in p)||("sid" in p);   /* v2 저장값(손상 포함)과 구버전(v1: ci/si 만) 저장값을 구분 */
    if(v2save){ if(typeof p.cid==="string") ci=CH.findIndex(c=>c.id===p.cid);
      if(ci<0) return {mode:mode==="quiz"?"quiz":"intro",ci:0,si:0,qi:qi,note:"챕터 못 찾음"};
      if(String(p.ver||"")!==VER){ si=0; note="판서가 바뀌어 챕터 처음부터"; }
      else if(typeof p.sid==="string"){ si=CH[ci].steps.findIndex(s=>s.id===p.sid); if(si<0){ si=0; note="단계 못 찾음"; } }
      else { si=0; note="단계 못 찾음"; } }
    else { const c2=toInt(p.ci); if(!Number.isInteger(c2)||c2<0||c2>=CH.length) return {mode:mode==="quiz"?"quiz":"intro",ci:0,si:0,qi:qi,note:"구버전 저장값"};
      ci=c2; si=0; note="구버전 저장값이라 챕터 처음부터"; } }
  else { ci=toInt(p.ci); if(!Number.isInteger(ci)||ci<0||ci>=CH.length) ci=0;
    const n=(CH[ci]||{steps:[]}).steps.length; si=toInt(p.si); if(!Number.isInteger(si)||si<0) si=0; else if(si>=n) si=Math.max(0,n-1); }
  return {mode:mode,ci:ci,si:si,qi:qi,note:note}; }
/* 저장 위치로 화면을 옮긴다 — #resume 해시와 목차의 「이어서 하기」가 같은 함수를 쓴다(오타 R4). 문제 위치는 저장한 qi 그대로(범위는 posOf 가 정리), 전부 채점됐으면 결과 */
function resumeTo(p){ cancelAll(); S=Object.assign(S,{mode:p.mode,ci:p.ci,si:p.si,qi:p.qi,rev:false,again:0,resume:true,pre:"",preFace:""});
  if(S.mode==="quiz"){ if(!QZ.length) S.mode="result"; else if(QZ.every(q=>typeof ST.correct[q.id]==="boolean")) S.mode="result"; }
  if(S.mode==="step"&&!CH.length) S.mode="intro";
  if(S.mode==="intro"||S.mode==="result") S.resume=false;
  render(); if(p.note) $("#dTip").textContent=p.note; }
/* 안내 대사(챕터 완료·문제 시작)는 다음 화면 대사 앞에 붙인다 — render 뒤 say() 를 또 부르면 단계의 완료 콜백이 사라진다(오타 R2) */
function preLine(line,face){ if(S.pre){ line=S.pre+" "+line; face=S.preFace||face; S.pre=""; S.preFace=""; } return [line,face]; }
