<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내적으로 각과 정사영을, 외적으로 모멘트를 — 벡터의 두 곱셈</title>
<!-- 교실 모드 템플릿 v1 (대표님 2026-09-26 결정: 초록 칠판 + 스앵님(김주영 미니버전) 캐릭터가 알려주는 느낌 · 목차/챕터 · 듀오링고식 XP·스트릭·하트·호감도 · 시스템은 최대한 심플)
     build_classroom.py 가 제목·자료(JSON)·교재 경로 자리를 채운다. 저장: localStorage mc-tutor(전역 XP·스트릭·하트·호감도·회차 위치) + mc-lesson-<id>(읽음·문제, 교재 페이지·앱 V52 와 공유) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--wall:#F4EEE2;--wood:#7A4E2B;--wood-2:#5C3A1E;--green:#2F5F4E;--green-2:#25503F;--chalk:#F5F2E9;--chalk-2:rgba(245,242,233,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --ink:#1F2A44;--ink-2:#55627A;--ink-3:#7C889B;--du-green:#58CC02;--du-green-2:#46A302;--du-blue:#1CB0F6;--du-blue-2:#1899D6;--du-red:#FF4B4B;--du-red-2:#EA2B2B;--du-gray:#E5E5E5;--du-gray-2:#CFCFCF;--du-yel:#FFC800;--du-orange:#FF9600;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--pen:"Nanum Pen Script","Pretendard Variable",sans-serif;--fs:19px;--hud:56px}
*{box-sizing:border-box}
html{background:var(--wall)}
body{margin:0;font-family:var(--f);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.6;
  background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.7),transparent 42%),radial-gradient(circle at 80% 90%,rgba(255,225,170,.35),transparent 46%),var(--wall);min-height:100vh}
button{font-family:inherit}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:2px solid rgba(31,42,68,.08)}
#hud .in{max-width:1000px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
#hud .chp{font-size:12.5px;font-weight:800;color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
#hud .pbar{flex:1;height:14px;border-radius:99px;background:#E6E2D6;overflow:hidden;position:relative}
#hud .pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7ED957,#58CC02);transition:width .45s cubic-bezier(.2,.8,.2,1)}
#hud .pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
#hud .hr{display:flex;align-items:center;gap:10px}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--ink-2);padding:4px 8px;border-radius:12px;background:rgba(255,255,255,.7);border:2px solid rgba(31,42,68,.06);position:relative}
.stat svg{width:18px;height:18px;display:block}
.stat small{font-weight:700;color:var(--ink-3);font-size:11px}
.stat.xp{color:#B26A00}.stat.sk{color:#E8590C}.stat.hp{color:#E03131;gap:2px}.stat.af{color:#D0397A}
.stat.hp svg{width:17px}
.stat .gauge{display:inline-block;width:56px;height:9px;border-radius:99px;background:#F1D4E0;overflow:hidden}
.stat .gauge b{display:block;height:100%;width:0;background:linear-gradient(90deg,#F783AC,#D0397A);transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#2B8A3E;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#E03131}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:0;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer;border-bottom:3px solid #000}
#hToc:active{transform:translateY(1px);border-bottom-width:2px}
/* ---------- 교실 ---------- */
main{max-width:1000px;margin:0 auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - var(--hud))}
#board{position:relative;flex:1;display:flex;flex-direction:column;min-height:360px}
.frame{flex:1;display:flex;padding:14px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 18px 40px rgba(60,40,20,.22),inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.25);position:relative}
.frame::before{content:"";position:absolute;inset:6px;border-radius:10px;border:2px solid rgba(255,255,255,.08);pointer-events:none}
.green{flex:1;position:relative;border-radius:6px;background:
  radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.07),transparent 42%),radial-gradient(ellipse at 78% 74%,rgba(255,255,255,.05),transparent 40%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chk{position:absolute;left:18px;top:12px;font-family:var(--pen);font-size:22px;color:var(--yel);letter-spacing:.02em;opacity:.95;z-index:2;text-shadow:0 0 2px rgba(255,226,122,.35)}
.chk small{font-family:var(--f);font-size:11.5px;font-weight:800;color:var(--chalk-2);margin-left:8px;letter-spacing:.06em;vertical-align:middle}
#bwrap{flex:1;overflow:auto;padding:46px 34px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bc{margin:auto 0;width:100%}  /* 짧은 판서는 세로 가운데, 긴 판서는 위에서부터 스크롤 */
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-size:var(--fs);line-height:1.75;text-shadow:0 0 1px rgba(255,255,255,.28);max-width:840px}
#bc>*{animation:write .5s ease-out both}
#bc>*:nth-child(2){animation-delay:.15s}#bc>*:nth-child(3){animation-delay:.3s}#bc>*:nth-child(4){animation-delay:.45s}#bc>*:nth-child(n+5){animation-delay:.6s}
@keyframes write{from{opacity:0;transform:translateY(6px);filter:blur(1px)}to{opacity:1;transform:none;filter:none}}
#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc p{margin:0 0 12px}
#bc .sub{font-family:var(--pen);font-size:28px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .tk{font-size:calc(var(--fs) + 1px)}
#bc .katex{color:var(--chalk);font-size:1.06em}#bc .katex-display{margin:12px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
#bc a{color:var(--sky)}
#bc table{border-collapse:collapse;margin:8px 0;font-size:.92em}#bc td,#bc th{border:1px dashed rgba(245,242,233,.45);padding:5px 10px;text-align:left}#bc th{color:var(--yel)}
#bc ul,#bc ol{margin:6px 0 10px;padding-left:24px}
/* 상자들: 분필 테두리 */
#bc .bx{margin:6px 0 14px;padding:14px 18px 12px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative;font-size:var(--fs)}
#bc .bx>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;line-height:1;margin-bottom:8px;letter-spacing:.02em}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}
#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75);background:rgba(255,255,255,.05)}#bc .bx.formula>i{color:var(--mint)}
#bc .bx.pitfall{border-color:rgba(255,163,199,.7);background:rgba(255,120,160,.07)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7);background:rgba(255,255,255,.05)}#bc .bx.memo>i{color:var(--chalk)}
#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
/* 붙임 자료(그림): 칠판에 붙인 종이 — 그림은 교재와 같은 원본 그대로(색·글자 검증 유지) */
#bc .paper{background:#FFFDF7;color:var(--ink);text-shadow:none;border-radius:6px;padding:14px 16px 10px;margin:8px auto 16px;max-width:600px;box-shadow:0 10px 24px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.6) inset;transform:rotate(-.8deg);position:relative;text-align:center}
#bc .paper::before{content:"";position:absolute;left:50%;top:-10px;width:78px;height:20px;margin-left:-39px;background:rgba(255,224,130,.75);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}
#bc .paper figcaption,#bc .paper .cap{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.5;text-align:center}
#bc .paper b{color:var(--ink)}#bc .paper .katex{color:var(--ink)}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
/* 예제 */
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}
#bc .ex .exq>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--yel);line-height:1;margin-bottom:6px}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}
#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz .qn{font-family:var(--pen);font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:calc(var(--fs) + 1px)}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-weight:900;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12);transform:translateY(-1px)}
#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz .cb .katex{color:inherit}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;font-size:var(--fs);color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}
#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--pen);font-size:24px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--pen);font-size:44px;line-height:1.15;color:var(--chalk);margin:0 0 6px;text-shadow:0 0 3px rgba(255,255,255,.2)}
#bc .lead{color:var(--chalk-2);font-size:calc(var(--fs) - 1px);margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
#bc .toc li{display:flex;align-items:center;gap:12px;font-size:var(--fs);padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-size:13px;font-weight:900}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}
#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;padding:10px 0 0}
#bc .res .big{font-family:var(--pen);font-size:64px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:var(--fs);margin:6px 0 12px}
#bc .res .stats b{display:block;font-size:34px;line-height:1.1}
#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700;letter-spacing:.04em}
#bc .res .badge{margin:4px auto 0;width:140px;height:140px}
#bc .res .bl{font-size:13px;font-weight:800;color:var(--chalk-2);letter-spacing:.04em;margin-top:4px}
#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
/* 분필 받침 */
.tray{height:20px;margin:0 30px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:8px;width:48px;border-radius:4px;background:#F5F2E9;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tray i.y{left:80px;background:var(--yel)}.tray i.p{left:140px;background:var(--pink)}.tray i.w{left:24px}
.tray i.er{left:auto;right:30px;width:64px;height:12px;top:3px;border-radius:3px;background:linear-gradient(180deg,#2B2B33,#111);}
/* ---------- 대화 ---------- */
#dlg{display:flex;align-items:flex-end;gap:14px;min-height:170px}
#tutor{flex:0 0 170px;width:170px;height:200px;margin-bottom:-6px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
.box{flex:1;min-width:0;background:#fff;border:2px solid rgba(31,42,68,.12);border-radius:18px;padding:16px 18px 14px;box-shadow:0 12px 30px rgba(31,42,68,.10);position:relative;min-height:150px;display:flex;flex-direction:column}
.box::before{content:"";position:absolute;left:-12px;bottom:46px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.name{position:absolute;left:16px;top:-14px;background:var(--ink);color:#FFE27A;font-family:var(--pen);font-size:22px;line-height:1;padding:5px 14px 4px;border-radius:10px;letter-spacing:.03em;border-bottom:3px solid #000}
.name.prof{background:#7A2E52;color:#FFD6E7}
.text{flex:1;font-size:18px;line-height:1.65;padding:8px 0 10px;min-height:56px;cursor:pointer}
.text .cur{display:inline-block;width:.55em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.choices{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cbt{border:0;font:inherit;font-weight:800;font-size:15.5px;padding:11px 18px;border-radius:14px;cursor:pointer;color:#fff;background:var(--du-blue);border-bottom:4px solid var(--du-blue-2);transition:transform .08s,filter .15s;letter-spacing:-.01em;min-height:46px}
.cbt:hover{filter:brightness(1.05)}.cbt:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.cbt.p{background:var(--du-green);border-bottom-color:var(--du-green-2)}
.cbt.g{background:#fff;color:var(--ink-2);border:2px solid var(--du-gray);border-bottom:4px solid var(--du-gray)}
.cbt.g:active{border-bottom-width:2px}
.cbt.r{background:var(--du-red);border-bottom-color:var(--du-red-2)}
.cbt.y{background:var(--du-yel);border-bottom-color:#E5A800;color:#4A3600}
.cbt kbd{font:inherit;font-size:11px;opacity:.7;margin-left:6px}
.choices .sp{flex:1}
.tip{font-size:12.5px;color:var(--ink-3);margin-left:auto}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.55);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-size:22px}
#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:#F7F7F7;border:2px solid #EEE;border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--du-blue)}
#ov li .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #CFCFCF;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--ink-3)}
#ov li.done .st{background:var(--du-green);border-color:var(--du-green);color:#fff}
#ov li.cur button{border-color:var(--du-yel);background:#FFF8DC}
#ov li small{margin-left:auto;color:var(--ink-3);font-weight:700;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* ---------- 스앵님 ---------- */
.chibi .f{display:none}
.chibi[data-face="neutral"] .f-neutral,.chibi[data-face="sharp"] .f-sharp,.chibi[data-face="smile"] .f-smile,.chibi[data-face="angry"] .f-angry,.chibi[data-face="wide"] .f-wide,.chibi[data-face="proud"] .f-proud{display:block}
.chibi .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s ease-in-out infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
/* ---------- 폰 ---------- */
@media(max-width:640px){
  :root{--fs:16.5px;--hud:50px}
  /* 폰 HUD: 과목 이름은 칠판 위 태그에 있으니 숨기고 CH n/m + 진행 막대 + 수치만 */

<script>
const D={"id": "statics-2026-09-14", "slug": "statics", "course": "정역학", "date": "2026-09-14", "sess": "9/14(월) · 3주차", "title": "내적으로 각과 정사영을, 외적으로 모멘트를 — 벡터의 두 곱셈", "lead": "앞 30분은 지난 시간 정의만 한 <b>내적<\/b>을 끝낸다: 성질 → 단위벡터 표 → 성분 공식 → 사이각 → <b>직선 위 정사영<\/b>. 뒤 25분은 <b>외적<\/b>을 정의부터 행렬식까지 한 번에. 교수님이 먼저 답한 질문 — \"외적은 왜 배우나? <b>모멘트<\/b>를 계산할 때 쓴다(4장).\"", "minutes": 20, "chapters": [{"id": "s1", "title": "내적의 성질과 단위벡터 표", "steps": [{"t": "formula", "html": "\\[\\mathbf U\\cdot\\mathbf V=\\mathbf V\\cdot\\mathbf U\\ (\\text{교환}),\\quad a(\\mathbf U\\cdot\\mathbf V)=(a\\mathbf U)\\cdot\\mathbf V=\\mathbf U\\cdot(a\\mathbf V),\\quad \\mathbf U\\cdot(\\mathbf V+\\mathbf W)=\\mathbf U\\cdot\\mathbf V+\\mathbf U\\cdot\\mathbf W\\ (\\text{분배})\\]"}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"150\" y1=\"150\" x2=\"240\" y2=\"150\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"150\" y2=\"60\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><line x1=\"150\" y1=\"150\" x2=\"96.0\" y2=\"195.0\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"><\/line><text x=\"246\" y=\"155\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y<\/text><text x=\"146\" y=\"54\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">z<\/text><text x=\"90.0\" y=\"185.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x<\/text><line x1=\"150\" y1=\"150\" x2=\"150\" y2=\"92\" stroke=\"#E03131\" stroke-width=\"3.2\" marker-end=\"url(#ah)\"><\/line><text x=\"160\" y=\"96\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">k<\/text><line x1=\"150\" y1=\"150\" x2=\"210\" y2=\"150\" stroke=\"#E03131\" stroke-width=\"3.2\" marker-end=\"url(#ah)\"><\/line><text x=\"206\" y=\"170\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">j<\/text><line x1=\"150\" y1=\"150\" x2=\"114\" y2=\"180\" stroke=\"#E03131\" stroke-width=\"3.2\" marker-end=\"url(#ah)\"><\/line><text x=\"102\" y=\"196\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i<\/text><text x=\"400\" y=\"50\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i·i = j·j = k·k = 1<\/text><text x=\"400\" y=\"76\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i·j = j·k = k·i = 0<\/text><text x=\"400\" y=\"110\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">같은 방향 → cos 0° = 1<\/text><text x=\"400\" y=\"130\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">수직 → cos 90° = 0<\/text><text x=\"400\" y=\"168\" font-size=\"12.5\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">그래서 성분 전개에서 교차항이 사라진다<\/text><\/svg><figcaption>단위벡터끼리의 내적 표. 필기본에서 x·y·z 축에 \\(\\mathbf i,\\mathbf j,\\mathbf k\\)를 빨간색으로 표시한 그림.<\/figcaption>"}, {"t": "say", "html": "\"방향이 같으면 1이고 수직이면 무조건 0\" — 교수님이 9개를 하나씩 다 읽었다."}, {"t": "why", "html": "이 표가 다음 절의 전부다. \\(\\mathbf U\\cdot\\mathbf V\\)를 성분으로 전개하면 9개 항이 나오는데, 서로 다른 축끼리(\\(\\mathbf i\\cdot\\mathbf j\\) 등) 6개는 0으로 사라지고 같은 축끼리 3개만 남는다."}, {"t": "analogy", "html": "동서남북으로 곧게 난 길 위에서 \"동쪽 길과 북쪽 길이 겹치는 정도\"는 0, \"동쪽 길과 동쪽 길\"은 100%. 단위벡터 표는 그 겹침표다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\mathbf i\\cdot\\mathbf i=\\mathbf j\\cdot\\mathbf j=\\mathbf k\\cdot\\mathbf k=1\\) · 서로 다른 것끼리 0 · 교환·분배 성립"}], "say": null}, {"id": "s2", "title": "성분으로 내적 → 두 벡터 사이의 각 ★", "steps": [{"t": "formula", "html": "\\[\\mathbf U\\cdot\\mathbf V=U_xV_x+U_yV_y+U_zV_z\\qquad\\Rightarrow\\qquad \\cos\\theta=\\frac{U_xV_x+U_yV_y+U_zV_z}{|\\mathbf U||\\mathbf V|},\\quad \\theta=\\cos^{-1}\\!\\left(\\frac{\\mathbf U\\cdot\\mathbf V}{|\\mathbf U||\\mathbf V|}\\right)\\]"}, {"t": "say", "html": "\"<b>i 성분끼리 곱하고, j 성분끼리 곱하고, k 성분끼리 곱해서<\/b> 더하면 됩니다.\" · \"이 공식은 <b>공간에서 두 벡터 또는 두 직선 사이의 각<\/b>을 구할 때 쓴다.\""}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 205\" width=\"560\" height=\"205\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><text x=\"60\" y=\"52\" font-size=\"15\" fill=\"#1971C2\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">U =<\/text><text x=\"60\" y=\"96\" font-size=\"15\" fill=\"#E03131\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">V =<\/text><text x=\"60\" y=\"150\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">곱 =<\/text><text x=\"130\" y=\"52\" font-size=\"17\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">1<\/text><text x=\"220\" y=\"52\" font-size=\"17\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">2<\/text><text x=\"310\" y=\"52\" font-size=\"17\" fill=\"#1971C2\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">2<\/text><text x=\"130\" y=\"96\" font-size=\"17\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">2<\/text><text x=\"220\" y=\"96\" font-size=\"17\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">0<\/text><text x=\"310\" y=\"96\" font-size=\"17\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">1<\/text><line x1=\"130\" y1=\"62\" x2=\"130\" y2=\"84\" stroke=\"#8A97A6\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"><\/line><line x1=\"220\" y1=\"62\" x2=\"220\" y2=\"84\" stroke=\"#8A97A6\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"><\/line><line x1=\"310\" y1=\"62\" x2=\"310\" y2=\"84\" stroke=\"#8A97A6\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"><\/line><line x1=\"130\" y1=\"106\" x2=\"130\" y2=\"132\" stroke=\"#8A97A6\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"><\/line><line x1=\"220\" y1=\"106\" x2=\"220\" y2=\"132\" stroke=\"#8A97A6\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"><\/line><line x1=\"310\" y1=\"106\" x2=\"310\" y2=\"132\" stroke=\"#8A97A6\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"><\/line><text x=\"130\" y=\"150\" font-size=\"17\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">2<\/text><text x=\"220\" y=\"150\" font-size=\"17\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">0<\/text><text x=\"310\" y=\"150\" font-size=\"17\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">2<\/text><text x=\"130\" y=\"30\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i 끼리<\/text><text x=\"220\" y=\"30\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">j 끼리<\/text><text x=\"310\" y=\"30\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">k 끼리<\/text><text x=\"370\" y=\"150\" font-size=\"15\" fill=\"#2F9E44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">→ 더하면 U·V = 4<\/text><text x=\"440\" y=\"60\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|U| = √(1+4+4) = 3<\/text><text x=\"440\" y=\"84\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|V| = √(4+0+1) = √5<\/text><text x=\"440\" y=\"118\" font-size=\"13.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">cos θ = 4 / (3√5) = 0.596<\/text><text x=\"440\" y=\"166\" font-size=\"15\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">θ ≈ 53.4°<\/text><text x=\"280\" y=\"190\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">성분끼리 곱해서 더한다 — 교차항(i·j 등)은 0이라 사라졌다<\/text><\/svg><figcaption>성분 내적의 흐름: 같은 축 성분끼리 곱해 더하면 스칼라 하나. 정의식과 붙이면 사이각이 나온다.<\/figcaption>"}, {"t": "why", "html": "정의식 \\(|\\mathbf U||\\mathbf V|\\cos\\theta\\)와 성분식이 같은 값이므로 둘을 붙이면 \\(\\cos\\theta\\)가 나온다. 각도기를 못 대는 3차원 공간의 두 선(케이블 두 가닥, 축과 힘)의 각을 좌표만으로 구하는 도구."}, {"t": "ex", "q": "연습 — \\(\\mathbf U=(1,2,2)\\), \\(\\mathbf V=(2,0,1)\\)의 사이각", "a": "<p>\\(\\mathbf U\\cdot\\mathbf V=1\\cdot2+2\\cdot0+2\\cdot1=4\\), \\(|\\mathbf U|=\\sqrt{1+4+4}=3\\), \\(|\\mathbf V|=\\sqrt{4+0+1}=\\sqrt5\\approx2.236\\).<\/p><p>\\(\\cos\\theta=\\dfrac{4}{3\\times2.236}=0.596\\) → \\(\\theta\\approx53.4^\\circ\\).<\/p>"}, {"t": "analogy", "html": "두 사람이 각자 \"동·북·위로 몇 걸음\" 갔는지만 알려 주면, 만나지 않아도 두 사람의 진행 방향 사이 각을 계산할 수 있다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\mathbf U\\cdot\\mathbf V=U_xV_x+U_yV_y+U_zV_z\\) · \\(\\theta=\\cos^{-1}\\big(\\mathbf U\\cdot\\mathbf V/|\\mathbf U||\\mathbf V|\\big)\\)"}], "say": null}, {"id": "s3", "title": "직선에 평행·수직한 성분 — 정사영 ★★", "steps": [{"t": "talk", "html": "<p>덧셈 때 \\(x\\)·\\(y\\)로 나눴듯, 공학 문제에서는 <b>어떤 직선 L에 평행한 성분과 수직한 성분<\/b>으로 나누면 계산이 쉽다. 벡터 \\(\\mathbf U\\)와 직선 L이 있으면 항상 \\(\\mathbf U=\\mathbf U_p+\\mathbf U_n\\).<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 230\" width=\"560\" height=\"230\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"40\" y1=\"170\" x2=\"520\" y2=\"170\" stroke=\"#1F2A44\" stroke-width=\"2.2\"><\/line><text x=\"500\" y=\"192\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">직선 L<\/text><line x1=\"120\" y1=\"170\" x2=\"200\" y2=\"170\" stroke=\"#2F9E44\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"160\" y=\"192\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">e (|e| = 1)<\/text><line x1=\"120\" y1=\"170\" x2=\"380\" y2=\"50\" stroke=\"#1971C2\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"240\" y=\"96\" font-size=\"16\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">U<\/text><path d=\"M161.7 150.6 A 46 46 0 0 1 166.0 170.0\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"1.5\"><\/path><text x=\"176.6\" y=\"161.4\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">θ<\/text><line x1=\"380\" y1=\"50\" x2=\"380\" y2=\"170\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"><\/line><line x1=\"120\" y1=\"156\" x2=\"380\" y2=\"156\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"><\/line><text x=\"250\" y=\"146\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">U<tspan baseline-shift=\"sub\" font-size=\"72%\">p<\/tspan> = (U·e) e<\/text><text x=\"300\" y=\"196\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|U<tspan baseline-shift=\"sub\" font-size=\"72%\">p<\/tspan>| = |U| cos θ<\/text><line x1=\"394\" y1=\"170\" x2=\"394\" y2=\"50\" stroke=\"#FF4D8D\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"><\/line><text x=\"408\" y=\"112\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">U<tspan baseline-shift=\"sub\" font-size=\"72%\">n<\/tspan> = U − U<tspan baseline-shift=\"sub\" font-size=\"72%\">p<\/tspan><\/text><\/svg><figcaption>정사영: 벡터 \\(\\mathbf U\\)를 직선 L에 <b>평행한 성분<\/b> \\(\\mathbf U_p\\)와 <b>수직한 성분<\/b> \\(\\mathbf U_n\\)으로. 크기는 내적으로, 방향은 단위벡터 \\(\\mathbf e\\)로.<\/figcaption>"}, {"t": "formula", "html": "\\[|\\mathbf U_p|=|\\mathbf U|\\cos\\theta,\\qquad \\mathbf e\\cdot\\mathbf U=|\\mathbf e||\\mathbf U|\\cos\\theta=|\\mathbf U|\\cos\\theta\\ (\\text{L 방향 스칼라 성분})\\] \\[\\boxed{\\ \\mathbf U_p=(\\mathbf U\\cdot\\mathbf e)\\,\\mathbf e\\ }\\qquad \\mathbf U_n=\\mathbf U-\\mathbf U_p\\]"}, {"t": "say", "html": "\"내적은 스칼라니까\" 크기가 나오고, 방향은 단위벡터 \\(\\mathbf e\\)로 — \"<b>이게 크기, 이게 방향<\/b>.\" · 수직 성분은 \"평행 성분을 구했으면 원래 벡터에서 빼면\" 된다. · \"2학년 올라가서 배울 <b>재료역학·동역학 다 똑같다<\/b>.\""}, {"t": "why", "html": "\\((\\mathbf U\\cdot\\mathbf e)\\)는 부호 있는 길이(L의 + 방향이면 +, 반대면 −), 여기에 \\(\\mathbf e\\)를 곱하면 방향이 붙어 벡터가 된다. 완전히 수직이면 \\(\\mathbf U_p=0\\), 평행이면 \\(\\mathbf U_n=0\\). 필기본에서 <b>빨간 박스<\/b>를 친 시험 공식."}, {"t": "ex", "q": "연습 — \\(\\mathbf U=4\\mathbf i+3\\mathbf j\\)를 직선 L(방향 \\(\\mathbf i+\\mathbf j\\))에 대해 분해", "a": "<p>① \\(\\mathbf e=(\\mathbf i+\\mathbf j)/\\sqrt2\\) ② \\(\\mathbf U\\cdot\\mathbf e=(4+3)/\\sqrt2=7/\\sqrt2\\approx4.95\\) ③ \\(\\mathbf U_p=(7/\\sqrt2)\\,(\\mathbf i+\\mathbf j)/\\sqrt2=3.5\\mathbf i+3.5\\mathbf j\\) ④ \\(\\mathbf U_n=\\mathbf U-\\mathbf U_p=0.5\\mathbf i-0.5\\mathbf j\\). 검산: \\(\\mathbf U_n\\cdot\\mathbf e=(0.5-0.5)/\\sqrt2=0\\) ✓ 수직.<\/p>"}, {"t": "analogy", "html": "햇빛이 직선 L 방향으로 비칠 때 막대 \\(\\mathbf U\\)의 그림자 길이가 \\(|\\mathbf U|\\cos\\theta\\). 그림자가 평행 성분, 막대에서 그림자를 뺀 나머지가 수직 성분."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\mathbf U_p=(\\mathbf U\\cdot\\mathbf e)\\mathbf e\\) · \\(\\mathbf U_n=\\mathbf U-\\mathbf U_p\\) · \\(\\mathbf e\\)는 반드시 단위벡터 · 검산 \\(\\mathbf U_n\\cdot\\mathbf e=0\\)"}], "say": null}, {"id": "s4", "title": "외적(cross product) — 정의 · 오른손 법칙 · 넓이", "steps": [{"t": "say", "html": "\"외적은 왜 배우는지 아시나요? — 외적은 <b>모멘트(moment)<\/b>를 계산할 때 쓴다.\" (4장: \\(\\mathbf M=\\mathbf r\\times\\mathbf F\\))"}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 250\" width=\"560\" height=\"250\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><path d=\"M120 200 L 300 200 L 380 120 L 200 120 Z\" fill=\"rgba(138,151,166,.12)\" stroke=\"#8A97A6\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"><\/path><line x1=\"120\" y1=\"200\" x2=\"300\" y2=\"200\" stroke=\"#1971C2\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"210\" y=\"222\" font-size=\"15\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">U<\/text><line x1=\"120\" y1=\"200\" x2=\"200\" y2=\"120\" stroke=\"#E03131\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\/line><text x=\"146\" y=\"150\" font-size=\"15\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">V<\/text><path d=\"M151.1 168.9 A 44 44 0 0 1 164.0 200.0\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"1.5\"><\/path><text x=\"171.7\" y=\"182.6\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">θ<\/text><line x1=\"200\" y1=\"120\" x2=\"200\" y2=\"200\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"><\/line><text x=\"214\" y=\"166\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|V| sin θ<\/text><line x1=\"120\" y1=\"200\" x2=\"120\" y2=\"40\" stroke=\"#2F9E44\" stroke-width=\"3.4\" marker-end=\"url(#ah)\"><\/line><text x=\"134\" y=\"46\" font-size=\"14\" fill=\"#2F9E44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">U × V = |U||V| sin θ · e<\/text><text x=\"134\" y=\"66\" font-size=\"12\" fill=\"#2F9E44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">e ⊥ U, e ⊥ V (평면에 수직)<\/text><text x=\"250\" y=\"90\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">|U × V| = 평행사변형의 넓이<\/text><text x=\"470\" y=\"150\" font-size=\"13.5\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">오른손 법칙<\/text><text x=\"470\" y=\"170\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">손가락 U → V 로 감으면<\/text><text x=\"470\" y=\"188\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">엄지가 U × V<\/text><text x=\"470\" y=\"218\" font-size=\"13.5\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">V × U = −(U × V)<\/text><\/svg><figcaption>외적은 <b>벡터<\/b>. 크기 = 두 벡터가 만드는 평행사변형의 넓이, 방향 = 두 벡터가 이루는 평면에 수직(오른손 법칙). 평행이면 sin θ = 0 → 0.<\/figcaption>"}, {"t": "formula", "html": "\\[\\mathbf U\\times\\mathbf V=|\\mathbf U||\\mathbf V|\\sin\\theta\\ \\mathbf e\\qquad(\\mathbf e\\perp\\mathbf U,\\ \\mathbf e\\perp\\mathbf V,\\ |\\mathbf e|=1)\\] \\[\\mathbf V\\times\\mathbf U=-(\\mathbf U\\times\\mathbf V),\\qquad \\mathbf U\\parallel\\mathbf V\\Rightarrow\\mathbf U\\times\\mathbf V=0\\]"}, {"t": "why", "html": "내적은 스칼라였는데 외적은 <b>벡터<\/b>라 vector product라고도 부른다. 방향은 두 벡터가 이루는 평면에 수직인데 위·아래 둘 중 하나 — <b>오른손 법칙<\/b>: 손가락을 \\(\\mathbf U\\)에서 \\(\\mathbf V\\)로 감을 때 엄지 방향. 순서를 바꾸면 엄지가 반대로 → 교환법칙 불성립. 크기 \\(|\\mathbf U||\\mathbf V|\\sin\\theta\\)는 \\(\\mathbf U\\)를 밑변, \\(|\\mathbf V|\\sin\\theta\\)를 높이로 한 <b>평행사변형의 넓이<\/b>(삼각형은 절반). 평행이면 평행사변형이 안 그려지니 0."}, {"t": "analogy", "html": "나사를 \\(\\mathbf U\\)에서 \\(\\mathbf V\\) 쪽으로 돌리면 나사가 나아가는 방향이 \\(\\mathbf U\\times\\mathbf V\\). 반대로 돌리면 빠진다(−). 렌치로 볼트를 돌리는 힘(모멘트)이 이 방향으로 정의되는 이유."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(|\\mathbf U\\times\\mathbf V|=|\\mathbf U||\\mathbf V|\\sin\\theta\\) = 평행사변형 넓이 · 방향 = 평면에 수직, 오른손 · \\(\\mathbf V\\times\\mathbf U=-\\mathbf U\\times\\mathbf V\\) · 평행 ⇔ 0"}], "say": null}, {"id": "s5", "title": "성질 · 단위벡터 순환 · 성분 전개 · 행렬식 ★★", "steps": [{"t": "formula", "html": "\\[a(\\mathbf U\\times\\mathbf V)=(a\\mathbf U)\\times\\mathbf V=\\mathbf U\\times(a\\mathbf V),\\qquad \\mathbf U\\times(\\mathbf V+\\mathbf W)=\\mathbf U\\times\\mathbf V+\\mathbf U\\times\\mathbf W\\]"}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 190\" width=\"560\" height=\"190\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"150\" cy=\"95\" r=\"60\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"><\/circle><text x=\"150\" y=\"30\" font-size=\"16\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i<\/text><text x=\"214\" y=\"136\" font-size=\"16\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">j<\/text><text x=\"86\" y=\"136\" font-size=\"16\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">k<\/text><path d=\"M180.0 43.0 A 60 60 0 0 1 206.4 115.5\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"2.5\"><\/path><path d=\"M180.0 147.0 A 60 60 0 0 1 104.0 133.6\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"2.5\"><\/path><path d=\"M90.0 95.0 A 60 60 0 0 1 139.6 35.9\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"2.5\"><\/path><text x=\"150\" y=\"100\" font-size=\"12.5\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">순환 → +<\/text><text x=\"400\" y=\"50\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">i × j = k,  j × k = i,  k × i = j<\/text><text x=\"400\" y=\"80\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">거꾸로 가면 −:  j × i = −k,  k × j = −i,  i × k = −j<\/text><text x=\"400\" y=\"110\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">같은 것끼리: i × i = j × j = k × k = 0<\/text><text x=\"400\" y=\"150\" font-size=\"12.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">\"같은 방향은 0, 반대로 하면 마이너스\"<\/text><\/svg><figcaption>i → j → k → i 순환 순서대로면 +, 거꾸로면 −. 오른손으로 확인해도 된다.<\/figcaption>"}, {"t": "talk", "html": "<p>\\((U_x\\mathbf i+U_y\\mathbf j+U_z\\mathbf k)\\times(V_x\\mathbf i+V_y\\mathbf j+V_z\\mathbf k)\\)를 위 표로 전개하면 9항 중 3항이 0:<\/p>", "sub": null}, {"t": "formula", "html": "\\[\\mathbf U\\times\\mathbf V=(U_yV_z-U_zV_y)\\,\\mathbf i-(U_xV_z-U_zV_x)\\,\\mathbf j+(U_xV_y-U_yV_x)\\,\\mathbf k=\\begin{vmatrix}\\mathbf i&amp;\\mathbf j&amp;\\mathbf k\\\\U_x&amp;U_y&amp;U_z\\\\V_x&amp;V_y&amp;V_z\\end{vmatrix}\\]"}, {"t": "why", "html": "\"행렬 배우셨죠?\" — 3×3 행렬식을 첫 행으로 전개하면 위 식이 그대로 나온다. \\(\\mathbf i\\)·\\(\\mathbf j\\)·\\(\\mathbf k\\) 각각에 대해 그 행·열을 지우고 남는 2×2 행렬식(\\(\\begin{vmatrix}a&amp;b\\\\c&amp;d\\end{vmatrix}=ad-bc\\))을 붙인다. <b>\\(\\mathbf j\\) 항의 부호가 −<\/b>."}, {"t": "say", "html": "\"<b>j 항은 마이너스다. 플러스가 아니라 마이너스. 조심해라<\/b>\" — 두 번 반복. \"부호(minus)가 많이 쓰이니까 조심하셔야 돼요.\""}, {"t": "ex", "q": "연습 — \\(\\mathbf U=(1,2,3)\\), \\(\\mathbf V=(4,5,6)\\)", "a": "<p>\\(\\mathbf i\\): \\(2\\cdot6-3\\cdot5=-3\\) · \\(\\mathbf j\\): \\(-(1\\cdot6-3\\cdot4)=-(6-12)=+6\\) · \\(\\mathbf k\\): \\(1\\cdot5-2\\cdot4=-3\\) → \\(\\mathbf U\\times\\mathbf V=-3\\mathbf i+6\\mathbf j-3\\mathbf k\\).<\/p><p>검산: \\(\\mathbf U\\cdot(\\mathbf U\\times\\mathbf V)=-3+12-9=0\\) ✓ (결과는 \\(\\mathbf U\\)에 수직).<\/p>"}, {"t": "analogy", "html": "행렬식은 \"지우고 곱하기\" 놀이다. \\(\\mathbf j\\) 차례에만 부호를 뒤집는 것을 잊으면 답의 한 성분이 통째로 틀린다 — 검산은 결과를 \\(\\mathbf U\\)와 내적해 0이 나오는지."}, {"t": "memo", "html": "<b>외울 것<\/b> 행렬식 \\(\\begin{vmatrix}\\mathbf i&amp;\\mathbf j&amp;\\mathbf k\\\\U_x&amp;U_y&amp;U_z\\\\V_x&amp;V_y&amp;V_z\\end{vmatrix}\\) · <b>j 항은 −<\/b> · 순환 i→j→k는 +, 거꾸로 − · 검산: 결과 · U = 0"}, {"t": "talk", "html": "<p>\"수요일에 보자\" — 9/16: 혼합삼중적, 그리고 Ch.3 힘(중간고사 범위 시작).<\/p>", "sub": null}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 성분 내적", "html": "\\(\\mathbf U=(1,2,2)\\), \\(\\mathbf V=(2,0,1)\\)일 때 \\(\\mathbf U\\cdot\\mathbf V\\)는?", "choices": [{"html": "4", "ok": true}, {"html": "2", "ok": false}, {"html": "\\((2,0,2)\\)", "ok": false}, {"html": "6", "ok": false}], "ans": "\\(1\\cdot2+2\\cdot0+2\\cdot1=4\\). 3번은 성분끼리 곱만 하고 안 더한 것(내적은 스칼라)."}, {"id": "q2", "qn": "확인 2 · 사이각", "html": "위 두 벡터의 사이각은 약?", "choices": [{"html": "53°", "ok": true}, {"html": "37°", "ok": false}, {"html": "90°", "ok": false}, {"html": "0°", "ok": false}], "ans": "\\(\\cos\\theta=4/(3\\sqrt5)=0.596\\) → \\(53.4^\\circ\\)."}, {"id": "q3", "qn": "확인 3 · 정사영", "html": "직선 L 방향의 단위벡터가 \\(\\mathbf e\\)일 때, \\(\\mathbf U\\)의 L에 평행한 <b>벡터<\/b> 성분은?", "choices": [{"html": "\\(\\mathbf U_p=(\\mathbf U\\cdot\\mathbf e)\\,\\mathbf e\\)", "ok": true}, {"html": "\\(\\mathbf U_p=\\mathbf U\\cdot\\mathbf e\\)", "ok": false}, {"html": "\\(\\mathbf U_p=\\mathbf U/|\\mathbf e|\\)", "ok": false}, {"html": "\\(\\mathbf U_p=(\\mathbf U\\times\\mathbf e)\\,\\mathbf e\\)", "ok": false}], "ans": "크기 \\((\\mathbf U\\cdot\\mathbf e)\\)에 방향 \\(\\mathbf e\\). 2번은 스칼라 성분(크기)일 뿐."}, {"id": "q4", "qn": "확인 4 · 외적의 성질", "html": "외적에 대해 옳은 것은?", "choices": [{"html": "\\(\\mathbf V\\times\\mathbf U=-(\\mathbf U\\times\\mathbf V)\\) — 교환법칙이 성립하지 않는다", "ok": true}, {"html": "\\(\\mathbf U\\times\\mathbf V=\\mathbf V\\times\\mathbf U\\)", "ok": false}, {"html": "두 벡터가 평행일 때 크기가 최대다", "ok": false}, {"html": "결과는 스칼라다", "ok": false}], "ans": "오른손 법칙에서 순서를 바꾸면 엄지가 반대. 평행이면 \\(\\sin\\theta=0\\) → 0. 결과는 벡터."}, {"id": "q5", "qn": "확인 5 · 행렬식", "html": "\\(\\mathbf U=(1,2,3)\\), \\(\\mathbf V=(4,5,6)\\)일 때 \\(\\mathbf U\\times\\mathbf V\\)는?", "choices": [{"html": "\\((-3,\\,6,\\,-3)\\)", "ok": true}, {"html": "\\((-3,\\,-6,\\,-3)\\)", "ok": false}, {"html": "\\((3,\\,-6,\\,3)\\)", "ok": false}, {"html": "\\((4,\\,10,\\,18)\\)", "ok": false}], "ans": "2번은 \\(\\mathbf j\\) 항 부호를 빠뜨린 것, 3번은 \\(\\mathbf V\\times\\mathbf U\\), 4번은 성분끼리 곱한 것(외적 아님)."}, {"id": "q6", "qn": "확인 6 · 정사영 계산", "html": "\\(\\mathbf U=4\\mathbf i+3\\mathbf j\\)를 방향 \\(\\mathbf i+\\mathbf j\\)인 직선에 대해 \\(\\mathbf U_p\\), \\(\\mathbf U_n\\)으로 분해하라.", "choices": null, "ans": "\\(\\mathbf e=(\\mathbf i+\\mathbf j)/\\sqrt2\\), \\(\\mathbf U\\cdot\\mathbf e=7/\\sqrt2\\), \\(\\mathbf U_p=3.5\\mathbf i+3.5\\mathbf j\\), \\(\\mathbf U_n=0.5\\mathbf i-0.5\\mathbf j\\). 검산 \\(\\mathbf U_n\\cdot\\mathbf e=0\\)."}]};

function renderStep(){
  const ch=CH[S.ci]; if(!ch){ S.mode=QZ.length?"quiz":"result"; return render(); }
  const st=ch.steps[S.si]; if(!st){ return finishChapter(); }
  board(stepHTML(st,S.rev),'<span>CH '+(S.ci+1)+' · '+esc(ch.title)+'</span><small>'+(S.si+1)+' / '+ch.steps.length+'</small>');
  const seed=S.ci+":"+S.si+":"+S.again;
  let line, face=LINES.chapter_face[st.t]||"neutral", name="스앵님";
  if(S.again>0){ line=pick("again",seed); face="sharp"; }
  else if(st.say){ line=st.say; }
  else if(S.si===0){ line=pick("chapter",seed,{c:S.ci+1,title:ch.title}); face="sharp"; }
  else if(st.t==="ex"&&S.rev){ line=pick("exopen",seed); }
  else line=pick(st.t in LINES?st.t:"talk",seed);
  say(line,face,name);
  const cs=[];
  if(st.t==="ex"&&!S.rev) cs.push({t:"풀이 보기",cls:"p",primary:1,key:"Enter",f:()=>{ S.rev=true; S.again=0; render(); }});

}

function finishChapter(){
  const ch=CH[S.ci]; const was=!!L.ch[ch.id];
  L.ch[ch.id]=true; ST.read[ch.id]=true; touchStreak();
  let extra="";
  if(!was){ gainXP(10); gainAff(2); } else if(T.hearts<3){ T.hearts++; extra=" "+pick("heartback",S.ci); pop("#hHearts","+1"); }
  save(); hud();
  S.si=0; S.ci++;
  if(S.ci>=CH.length){ if(QZ.length){ S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; } else S.mode="result"; }
  const line=(warm()?pick("chdone_warm",S.ci):pick("chdone",S.ci,{c:S.ci}))+extra;
  if(S.mode==="quiz"&&S.ci===CH.length){ render(); say(pick("quiz","q",{n:QZ.length,h:T.hearts}),"sharp"); return; }
  render(); say(line,"proud");
}
function renderQuiz(){
  const q=QZ[S.qi]; if(!q){ S.mode="result"; return render(); }
  const mc=Array.isArray(q.choices)&&q.choices.length, rev=!!ST.done[q.id], my=ST.answer[q.id], c=ST.correct[q.id];
  let h='<div class="qz"><div class="qn">'+esc(q.qn||("문제 "+(S.qi+1)))+'</div><div class="qb">'+q.html+'</div>';
  if(mc) h+='<ol class="ch">'+q.choices.map((x,i)=>'<li><button type="button" class="cb'+(rev?(x.ok?" ok":(String(my)===String(i)?" bad":"")):"")+'" data-i="'+i+'"'+(rev?" disabled":"")+'><span class="n">'+(i+1)+'</span><span>'+x.html+'</span></button></li>').join("")+'</ol>';
  else h+= rev? '<div class="my"><b>내 답</b> '+esc(my||"(빈칸)")+'</div>' : '<textarea id="myans" placeholder="답만 간단히">'+esc(my||"")+'</textarea><div class="row"><button type="button" class="cbt p" id="reveal">답 보기</button></div>';
  if(rev){ h+='<span class="vd '+(c===true?"ok":c===false?"bad":"wait")+'">'+(c===true?"정답":c===false?"오답":"채점 전")+'</span>';
    if(!mc&&c==null) h+='<div class="row"><button type="button" class="cbt p" data-g="1">맞았어요</button><button type="button" class="cbt r" data-g="0">틀렸어요</button></div>';
    h+='<div class="ans"><i>해설</i>'+(q.ans||"")+'</div>'; }
  h+='</div>';
  board(h,'<span>확인 문제</span><small>'+(S.qi+1)+' / '+QZ.length+'</small>');
  $$("#bc .cb").forEach(b=>{ b.onclick=()=>answer(q,+b.dataset.i); });
  const rv=$("#reveal"); if(rv) rv.onclick=()=>{ const ta=$("#myans"); ST.answer[q.id]=(ta&&ta.value.trim())||""; ST.done[q.id]=true; delete ST.correct[q.id]; save(); render(); say("해설과 비교하세요. 스스로 채점합니다. 봐주지 마세요.","sharp"); };
  $$("#bc [data-g]").forEach(b=>{ b.onclick=()=>grade(q,b.dataset.g==="1"); });
  if(!rev){ say(mc?pick("q",S.qi,{k:S.qi+1}):pick("qin",S.qi),"neutral"); choices([{t:"질문할게요",cls:"",f:ask},{tip:mc?"숫자 키 1~"+q.choices.length+" 로 고를 수 있습니다":""}]); }
  else { const last=S.qi>=QZ.length-1;
    choices([{t:last?"결과 보기":"다음 문제",cls:"p",primary:1,key:"Enter",f:()=>{ if(last){ S.mode="result"; } else S.qi++; render(); }},{t:"다시 풀기",cls:"g",f:()=>{ delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; save(); render(); }},{t:"질문할게요",cls:"",f:ask}]); }
}
function answer(q,i){
  if(ST.done[q.id]) return;
  if(T.hearts<=0){ S.mode="nohearts"; return render(); }
  ST.answer[q.id]=i; ST.done[q.id]=true; const ok=!!(q.choices[i]&&q.choices[i].ok); ST.correct[q.id]=ok; touchStreak();
  if(ok){ gainXP(15); gainAff(3); } else { T.hearts=Math.max(0,T.hearts-1); gainAff(-1); pop("#hHearts","-1",true); }
  save(); render(); say(ok?(warm()?pick("ok_warm",S.qi):pick("ok",S.qi)):pick("bad",S.qi), ok?(warm()?"proud":"smile"):"angry");
}
function grade(q,ok){
  if(T.hearts<=0&&!ok){ S.mode="nohearts"; return render(); }
  ST.correct[q.id]=ok; touchStreak();
  if(ok){ gainXP(15); gainAff(3); } else { T.hearts=Math.max(0,T.hearts-1); gainAff(-1); pop("#hHearts","-1",true); }
  save(); render(); say(ok?(warm()?pick("ok_warm",S.qi):pick("ok",S.qi)):pick("bad",S.qi), ok?"smile":"angry");
}
function renderNoHearts(){
  board('<div class="ttl">하트 0</div><div class="lead">챕터 하나를 다시 읽고 끝까지 가면 하트 하나가 돌아옵니다. 하트는 매일 3개로 채워집니다.</div><div class="sub">목차</div>'+tocHTML(),'<span>잠깐</span>');
  say(pick("nohearts","nh"),"angry");
  choices([{t:"목차에서 챕터 고르기",cls:"p",primary:1,key:"Enter",f:openToc},{t:"교재 보기",cls:"g",f:()=>openBook((CH[0]||{}).id)}]);
}
function renderResult(){
  const n=QZ.length, ok=QZ.filter(q=>ST.correct[q.id]===true).length, wrong=QZ.filter(q=>ST.correct[q.id]===false), dn=QZ.filter(q=>ST.done[q.id]).length;
  const first=!L.done&&dn>=n; if(first){ L.done=true; gainXP(20); touchStreak(); save(); }
  const ratio=n?ok/n:1, good=ratio>=.8, mid=ratio>=.5;
  const badge='<svg class="badge" viewBox="0 0 120 120" fill="none" stroke="#FFE27A" stroke-width="2.5" stroke-linejoin="round"><circle cx="60" cy="60" r="50" stroke-dasharray="4 3"/><circle cx="60" cy="60" r="40"/><path d="M60 30l8.8 18 19.8 2.9-14.3 13.9 3.4 19.7L60 75.2l-17.7 9.3 3.4-19.7L31.4 50.9l19.8-2.9z" fill="rgba(255,226,122,.18)"/></svg><div class="bl">'+esc(D.course)+' · '+esc(D.sess)+' · 챕터 '+CH.length+'</div>';
  board('<div class="res"><div class="big">'+(good?"수고했습니다":mid?"절반은 넘겼습니다":"다시 합니다")+'</div><div class="stats"><div><b>'+ok+'/'+n+'</b><span>정답</span></div><div><b>+'+(L.xp||0)+'</b><span>이 회차 XP</span></div><div><b>'+T.streak+'</b><span>연속일</span></div><div><b>'+T.aff+'</b><span>호감도 · '+affName()+'</span></div></div>'+badge+(wrong.length?'<div class="wrong">틀린 문제 '+wrong.length+'개 — 해설을 읽고 다시 푸세요.</div>':'')+'</div>','<span>오늘의 결과</span>');
  say(pick(good?"res_good":mid?"res_mid":"res_bad","r",{ok:ok,n:n}), good?"proud":mid?"sharp":"angry");
  const cs=[];
  if(wrong.length) cs.push({t:"틀린 문제 다시 ("+wrong.length+")",cls:"p",primary:1,key:"Enter",f:()=>{ wrong.forEach(q=>{ delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; }); save(); S.mode="quiz"; S.qi=QZ.findIndex(q=>!ST.done[q.id]); render(); }});
  cs.push({t:"교재 보기",cls:"g",f:()=>openBook(null)});
  cs.push({t:"목차",cls:"g",f:openToc});
  if(EMB) cs.push({t:"앱으로",cls:wrong.length?"g":"p",primary:wrong.length?0:1,f:()=>post({type:"mc-close",v:1})});
  choices(cs);
}
/* ---------- 목차 · 교재 · 질문 ---------- */
function openToc(){ const ov=$("#ov"); $("#ovMeta").textContent=D.course+" · "+D.sess+" · XP "+(L.xp||0);
  $("#ovList").innerHTML=CH.map((c,i)=>'<li class="'+(L.ch[c.id]?"done":"")+(S.mode==="step"&&S.ci===i?" cur":"")+'"><button type="button" data-ci="'+i+'"><span class="st">'+(L.ch[c.id]?"✓":i+1)+'</span><span>'+esc(c.title)+'</span><small>'+c.steps.length+'단계</small></button></li>').join("")
    +(QZ.length?'<li class="'+(QZ.every(q=>ST.done[q.id])?"done":"")+(S.mode==="quiz"?" cur":"")+'"><button type="button" data-q="1"><span class="st">?</span><span>확인 문제</span><small>'+QZ.filter(q=>ST.done[q.id]).length+'/'+QZ.length+'</small></button></li>':"");
  $$("#ovList [data-ci]").forEach(b=>{ b.onclick=()=>{ ov.classList.remove("on"); S=Object.assign(S,{mode:"step",ci:+b.dataset.ci,si:0,rev:false,again:0}); render(); }; });
  const qb=$("#ovList [data-q]"); if(qb) qb.onclick=()=>{ ov.classList.remove("on"); if(T.hearts<=0&&QZ.some(q=>!ST.done[q.id])){ S.mode="nohearts"; return render(); } S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; render(); };
  ov.classList.add("on"); }
$("#hToc").onclick=openToc; $("#ovClose").onclick=()=>$("#ov").classList.remove("on"); $("#ov").onclick=e=>{ if(e.target.id==="ov") $("#ov").classList.remove("on"); };
$("#ovBook").onclick=()=>openBook(S.mode==="step"?(CH[S.ci]||{}).id:null);
$("#ovReset").onclick=()=>{ if(!confirm("이 회차의 챕터·문제 기록을 지울까요? (XP·스트릭은 남습니다)")) return; L={pos:null,ch:{},done:false,xp:0}; ST={read:{},done:{},correct:{},answer:{},ts:0}; S=Object.assign(S,{mode:"intro",ci:0,si:0,qi:0,rev:false,again:0}); $("#ov").classList.remove("on"); render(); };
function post(m){ try{ window.parent.postMessage(m,location.origin); }catch(e){} }
function openBook(sid){ const hash=sid?"#s="+sid:""; if(EMB){ post({type:"mc-open",v:1,file:LESSON_APP+hash,title:document.title}); } else location.href=LESSON_REL+hash; }
function ask(){ if(EMB){ post({type:"mc-ask",v:1}); say(pick("ask",S.ci+":"+S.si),"wide"); gainAff(1); save(); hud(); } else say(pick("askoff",S.ci),"sharp"); }
/* ---------- 앱 질문 패널 문맥 (V45 규약) ---------- */
let CTX_GEN=null;
function ctx(){ if(!CTX_GEN||!EMB) return; let label="", q=null, sid="";
  if(S.mode==="step"){ const ch=CH[S.ci]||{}, st=(ch.steps||[])[S.si]||{}; sid=ch.id||""; label="CH "+(S.ci+1)+" · "+(ch.title||""); const tmp=document.createElement("div"); tmp.innerHTML=st.t==="ex"?(st.q+" "+(S.rev?st.a:"")):(st.html||""); q={qn:(ch.title||"").slice(0,80),kind:"개념",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }
  else if(S.mode==="quiz"){ const qq=QZ[S.qi]; if(qq){ const tmp=document.createElement("div"); tmp.innerHTML=qq.html; label="확인 문제 "+(S.qi+1); const tc=x=>{ const d=document.createElement("div"); d.innerHTML=x; return (d.textContent||"").trim(); };
    q={qn:qq.qn,kind:"문제",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:(qq.choices||[]).map(c=>tc(c.html)),my:(ST.answer[qq.id]==null?null:String(ST.answer[qq.id])),revealed:!!ST.done[qq.id],correct:(typeof ST.correct[qq.id]==="boolean"?ST.correct[qq.id]:null),answer:null}; } }
  else label=S.mode;
  post({type:"mc-slide",v:1,gen:CTX_GEN,deck:D.id,title:document.title.slice(0,80),sid:sid,stype:S.mode==="quiz"?"quiz":"concept",part:null,partTitle:document.title.slice(0,60),label:("교실 · "+label).slice(0,80),q:q}); }
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; ctx(); } });
const _render=render; render=function(){ _render(); ctx(); };
/* ---------- 키보드 ---------- */
document.addEventListener("keydown",e=>{ if(e.target&&/TEXTAREA|INPUT/.test(e.target.tagName)) return; if($("#ov").classList.contains("on")){ if(e.key==="Escape") $("#ov").classList.remove("on"); return; }
  if(e.key==="Enter"||e.key===" "){ if(typing){ clearInterval(typing); typing=null; $("#dText").textContent=fullText; return; } const b=$("#dCh [data-primary]"); if(b){ e.preventDefault(); b.click(); } }
  else if(/^[1-6]$/.test(e.key)&&S.mode==="quiz"){ const b=$$("#bc .cb")[+e.key-1]; if(b&&!b.disabled) b.click(); } });
/* ---------- 시작 ---------- */
/* 해시: #resume(저장 위치) · #ch=2(챕터 2) · #ch=2.5(챕터 2의 5단계) · #quiz · #result */
function boot(){ const m=/^#(resume|ch=(\d+)(?:\.(\d+))?|quiz|result)$/.exec(location.hash||"");
  if(m&&m[1]==="resume"&&L.pos&&!L.done){ S=Object.assign(S,{mode:L.pos.mode||"step",ci:L.pos.ci||0,si:L.pos.si||0,qi:L.pos.qi||0}); if(S.mode==="quiz"){ const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; if(k<0&&QZ.every(q=>ST.done[q.id])) S.mode="result"; } if(S.mode==="step"&&!CH[S.ci]) S.mode="intro"; }
  else if(m&&m[2]){ const ci=Math.max(0,Math.min(CH.length-1,+m[2]-1)); const si=m[3]?Math.max(0,Math.min(CH[ci].steps.length-1,+m[3]-1)):0; S=Object.assign(S,{mode:"step",ci:ci,si:si,rev:(CH[ci].steps[si]||{}).t==="ex"&&/\.\d+r$/.test(location.hash)}); }
  else if(m&&m[1]==="quiz"&&QZ.length){ S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; }
  else if(m&&m[1]==="result"){ S.mode="result"; }
  render(); }
