<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>25장 축전기 — 전기 용량 세 가지와 유전체</title>
<!-- 교실 모드 템플릿 v2 (대표님 2026-09-27 확정: 듀오링고×애플 융합 · 판서는 짧게(Gaegu) + 말풍선은 일타강사 구어체 · 그림은 분필 · 단계 애니메이션 · 글꼴 Gowun Dodum/Gothic A1/Inter)
     v2 회차(D.v===2)는 판서 파일(BOARD)로 만든 단계(판서 줄 누적 + 그림 단계 + 대사), v1 회차는 원문 문단 그대로(「구버전 판서」 표시).
     저장: mc-tutor(전역 XP·연속일·하트·호감도 + 회차 위치 {mode,cid,sid,qi,ver}) + mc-lesson-<id>(챕터 읽음·문제, 수업 노트·앱 V52 와 공유). 오타 설계 회의 1·2차 조건 반영. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Gothic+A1:wght@700;800&family=Inter:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--bg:#F5F5F7;--card:rgba(255,255,255,.86);--line:rgba(0,0,0,.08);--ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#8E8E93;--green:#1B7A2E;--green-soft:#E8F7EA;--blue:#0A84FF;--amber:#B25E00;--red:#D42020;
  --board:#2F5D4B;--wood:#7A4E2B;--chalk:#F4F1E8;--chalk-2:rgba(244,241,232,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --fb:"Gowun Dodum","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fh:"Gothic A1","Gowun Dodum",sans-serif;--fn:Inter,"Gothic A1",sans-serif;--fk:Gaegu,"Gowun Dodum",sans-serif;--hud:56px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:var(--fb);font-size:16px;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
#hud .in{max-width:1040px;margin:0 auto;height:100%;padding:0 20px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-family:var(--fh);font-weight:800;font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hud .chp{font-family:var(--fn);font-weight:700;font-size:12px;color:var(--ink-2);white-space:nowrap}
#hud .seg{display:flex;gap:4px;flex:1;max-width:280px}#hud .seg i{display:block;flex:1;height:6px;border-radius:3px;background:#E5E5EA}#hud .seg i.on{background:var(--green)}#hud .seg i.cur{background:var(--blue)}
#hud .hr{display:flex;align-items:center;gap:8px}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--fn);font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:999px;position:relative;white-space:nowrap}
.stat svg{width:15px;height:15px;display:block}
.stat.xp{background:#FFF8DC;color:#8A5A00}.stat.sk{background:#FFF0E6;color:#C2410C}.stat.hp{background:#FFECEC;color:#C92A2A;gap:3px}.stat.af{background:#F7E4EE;color:#B8286A}
.stat .gauge{display:inline-block;width:52px;height:8px;border-radius:99px;background:#F0D0DF;overflow:hidden}.stat .gauge b{display:block;height:100%;width:0;background:#B8286A;transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#1F7A32;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#C92A2A}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer}
/* ---------- 교실 ---------- */
main{max-width:1040px;margin:0 auto;padding:16px 20px 24px}
#room{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:16px;align-items:start}
#board{position:relative}
.frame{padding:12px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 14px 34px rgba(60,40,20,.2),inset 0 2px 0 rgba(255,255,255,.18);position:relative}
.green{position:relative;border-radius:6px;min-height:560px;max-height:max(560px,70vh);display:flex;flex-direction:column;background:radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.06),transparent 42%),repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);overflow:hidden}
/* 칠판 머리표(챕터·단계): 스크롤 칸(#bwrap) 밖, 칠판 위쪽 고정 띠 — 판서가 어디까지 스크롤돼도 글자가 머리표 밑으로 지나가지 않는다(대표님 2026-09-27 「글자 겹쳤다」: sticky 반투명 띠 밑으로 식 윗부분이 비쳤음) */
.chk{flex:0 0 auto;padding:12px 30px 8px;font-family:var(--fk);font-weight:700;font-size:20px;line-height:1.3;color:var(--yel);border-bottom:1px dashed rgba(244,241,232,.22);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk small{font-family:var(--fn);font-size:11px;font-weight:700;color:var(--chalk-2);margin-left:8px;letter-spacing:.04em;vertical-align:middle}
.chk .old{font-family:var(--fb);font-size:11px;color:var(--pink);margin-left:8px;vertical-align:middle;border:1px dashed var(--pink);border-radius:6px;padding:1px 6px}
#bwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 30px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-family:var(--fk);font-weight:700;font-size:24px;line-height:1.5;width:100%;margin:auto 0}
#bc.v1{font-family:var(--fb);font-weight:400;font-size:18px;line-height:1.75}
#bc .katex{color:var(--sky)}#bc .katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* v2 판서 줄 */
.bd-title{font-size:30px;color:var(--yel);margin:0 0 10px;line-height:1.2;text-decoration:underline wavy rgba(255,226,122,.55) 2px;text-underline-offset:6px}
.bl{margin:0 0 8px;padding-left:34px;position:relative;clip-path:inset(0 100% 0 0);transition:clip-path .45s ease-out}
.bl.on{clip-path:inset(0 0 0 0)}.bl.now{clip-path:inset(0 0 0 0);transition:none}
.bl::before{position:absolute;left:4px;top:0;font-size:1em}
.bl.k-li::before{content:"•"}.bl.k-h{padding-left:0;font-size:28px;color:var(--yel);margin-top:6px}.bl.k-h::before{content:""}
.bl.k-f{padding-left:0;text-align:center;font-size:24px}.bl.k-f::before{content:""}.bl.k-f .katex-display{margin:6px 0}.bl.k-f .katex{font-size:1.2em}
.bl.k-pit{color:var(--pink);border:2px dashed rgba(255,163,199,.6);border-radius:10px;padding:6px 12px 6px 38px;margin:6px 0 10px}.bl.k-pit::before{content:"!";left:14px;top:6px;color:var(--pink)}
.bl.k-star{color:var(--yel)}.bl.k-star::before{content:"☆";color:var(--yel)}
.bl.k-res{color:var(--yel)}.bl.k-res::before{content:"→";color:var(--yel)}
.bl.k-memo{border:2px solid rgba(244,241,232,.6);border-radius:10px;padding:6px 12px;margin:10px 0 6px;background:rgba(255,255,255,.05)}.bl.k-memo::before{content:""}
.bl .ul{text-decoration:underline wavy var(--yel) 2px;text-underline-offset:5px}
.bl .katex{color:var(--sky);font-size:.92em}
/* 그림(분필) */
.bd-fig{margin:14px auto 4px;max-width:640px;width:100%}
.bd-fig figure{margin:0}.bd-fig svg{width:100%;height:auto;display:block;overflow:visible}.bd-fig figcaption{display:none}
.bd-fig [data-step][hidden]{display:none}
.bd-fig .pre{opacity:0}   /* 이 단계에서 새로 나올 그림 단계는 그림 차례까지 가림 */
.bd-fig .ck{stroke-linecap:round;stroke-linejoin:round}
.bd-fig .draw{transition:stroke-dashoffset var(--dur,1s) ease-out}
.bd-fig .fade{opacity:0;transition:opacity .35s ease-out}.bd-fig .fade.on{opacity:1}
@media (prefers-reduced-motion: reduce){.bl{transition:none}.bd-fig .draw,.bd-fig .fade{transition:none}}
/* v1(구버전) 판서 상자 */
#bc .tk{font-size:19px}#bc p{margin:0 0 10px}#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc .sub{font-family:var(--fk);font-size:26px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .bx{margin:6px 0 14px;padding:12px 16px 10px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative}
#bc .bx>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75)}#bc .bx.formula>i{color:var(--mint)}#bc .bx.pitfall{border-color:rgba(255,163,199,.7)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7)}#bc .bx.memo>i{color:var(--chalk)}#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
#bc .paper{background:#FFFDF7;color:#1F2A44;border-radius:6px;padding:12px 14px 8px;margin:8px auto 14px;max-width:560px;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}#bc .paper figcaption,#bc .paper .cap{font-size:13.5px;color:#55627A;margin-top:6px}#bc .paper .katex{color:#1F2A44}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}#bc .ex .exq>i,#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px;color:var(--yel)}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}#bc .ex .exa>i{color:var(--mint)}#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz{font-family:var(--fb);font-weight:400;font-size:18px}
#bc .qz .qn{font-family:var(--fk);font-weight:700;font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:19px}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12)}#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--fk);font-weight:700;font-size:22px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--fk);font-size:40px;line-height:1.15;color:var(--chalk);margin:0 0 6px}
#bc .lead{font-family:var(--fb);font-weight:400;color:var(--chalk-2);font-size:17px;margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-family:var(--fb);font-weight:400;font-size:17px}
#bc .toc li{display:flex;align-items:center;gap:12px;padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;font-family:var(--fb);font-weight:400}#bc .res .big{font-family:var(--fk);font-weight:700;font-size:60px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:17px;margin:6px 0 12px}#bc .res .stats b{display:block;font-family:var(--fn);font-size:32px;line-height:1.1}#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700}
#bc .res .badge{margin:4px auto 0;width:130px;height:130px}#bc .res .bl2{font-size:13px;font-weight:700;color:var(--chalk-2);margin-top:4px}#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
.tray{height:18px;margin:0 26px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:7px;width:44px;border-radius:4px;background:var(--chalk)}.tray i.y{left:76px;background:var(--yel)}.tray i.p{left:132px;background:var(--pink)}.tray i.w{left:22px}.tray i.er{left:auto;right:26px;width:60px;height:11px;top:3px;border-radius:3px;background:#1E1E22}
#chpills{margin-top:12px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#chpills .lb{font-size:12px;color:var(--ink-2);font-weight:700;margin-right:4px}
.pill{border:1px solid var(--line);background:#F2F2F7;color:var(--ink-3);font-family:var(--fn);font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.pill.done{background:var(--green-soft);color:var(--green);border-color:transparent}.pill.cur{background:var(--green);color:#fff;border-color:var(--green)}
/* ---------- 오른쪽: 스앵님 · 말풍선 · 선택지 ---------- */
#side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--hud) + 16px)}
#tutorCard{padding:12px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
#tutorCard .nm{align-self:flex-start;display:flex;align-items:center;gap:8px;width:100%}
#tutorCard .nm b{font-family:var(--fh);font-weight:800;font-size:13px}#tutorCard .nm span{font-size:11px;color:var(--ink-3);margin-left:auto}
#tutor{width:150px;height:176px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.14));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
/* 실사풍 일러스트(힉스필드, 2026-09-28): ../assets/tutor/<face>.png 이 열리면 그림, 아니면 SVG 치비. 끄기 ?tutor=svg */
#tutorImg{display:none;width:100%;height:100%;object-fit:contain;object-position:center bottom;-webkit-user-select:none;user-select:none}
#tutor.raster #tutorImg{display:block}#tutor.raster svg{display:none}
/* 목차·결과 화면은 전신 포즈(pose-point · pose-cross), 단계·문제는 흉상 표정 */
#tutor.raster.pose{width:170px;height:330px;animation:none}
/* 결과 화면 배지 = 스티커(트로피·월계관), 없으면 SVG 배지 */
#bc .res .stk{display:block;width:150px;height:150px;margin:2px auto 0;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.box{padding:14px 16px 12px;position:relative;min-height:120px}
.box::before{content:"";position:absolute;left:50%;top:-9px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.name{font-family:var(--fh);font-weight:800;font-size:12px;color:var(--green);margin-bottom:4px}.name.prof{color:#7A2E52}
.text{font-size:15.5px;line-height:1.6;min-height:48px;cursor:pointer}
.text .cur{display:inline-block;width:.5em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.tip{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.cbt{font:inherit;font-weight:700;font-size:14.5px;padding:11px 16px;border-radius:12px;cursor:pointer;color:var(--ink);background:#fff;border:1px solid var(--line);transition:transform .08s,filter .15s;width:100%;text-align:center;min-height:44px}
.cbt:hover{filter:brightness(.97)}.cbt:active{transform:translateY(1px)}
.cbt.p{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 10px rgba(27,122,46,.25)}
.cbt.t{background:var(--green-soft);color:var(--green);border-color:transparent}
.cbt.r{background:var(--red);color:#fff;border-color:var(--red)}
.cbt.g{background:#F2F2F7;color:var(--ink-2);border-color:transparent}
.cbt kbd{font-family:var(--fn);font-size:10.5px;opacity:.6;margin-left:6px}
#prog{padding:12px 14px}#prog .k{font-size:12px;color:var(--ink-2);font-weight:700}#prog .v{font-family:var(--fh);font-weight:800;font-size:15px;margin:2px 0 6px}#prog .bar{height:6px;border-radius:3px;background:#E5E5EA;overflow:hidden}#prog .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}#prog .h{font-size:11.5px;color:var(--ink-3);margin-top:6px}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.5);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-family:var(--fh);font-weight:800;font-size:20px}#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#F7F7F7;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--blue)}#ov li .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #CFCFCF;display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700;color:var(--ink-3)}
#ov li.done .st{background:var(--green);border-color:var(--green);color:#fff}#ov li.cur button{border-color:var(--amber);background:#FFF8DC}#ov li small{margin-left:auto;color:var(--ink-3);font-weight:700;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}#ov .row .cbt{width:auto}
/* ---------- 아이패드 세로(768~900): 두 칸은 유지하되 옆 칸을 줄이고 판서 글자를 한 단계 낮춘다 ---------- */
@media(max-width:900px) and (min-width:761px){
  #room{grid-template-columns:minmax(0,1fr) 240px;gap:12px}#tutor{width:120px;height:140px}
  #bc{font-size:21px}.bl.k-h{font-size:25px}.bd-title{font-size:26px}.bl.k-f{font-size:22px}.bl.k-f .katex{font-size:1.05em}.chk{font-size:18px;padding:10px 22px 6px}#bwrap{padding:10px 22px 22px}
  .cbt{font-size:14px;padding:10px 12px}.text{font-size:14.5px}
}
/* ---------- 폰 ---------- */
@media(max-width:760px){
  :root{--hud:50px}
  #hud .in{gap:6px;padding:0 8px}#hud .hl{display:none}#hud .hc{flex:1 1 auto;min-width:70px;gap:6px}#hud .chp{font-size:11px}#hud .hr{gap:4px;flex:0 0 auto}.stat{padding:3px 6px;font-size:11.5px;gap:3px}.stat svg{width:13px;height:13px}.stat .gauge{width:30px;height:7px}#hToc{padding:5px 8px;font-size:12px}
  main{padding:10px 8px 12px}#room{grid-template-columns:minmax(0,1fr);gap:10px}#board,#side{min-width:0}
  .frame{padding:8px;border-radius:10px}.green{min-height:340px;max-height:max(340px,56vh)}#bwrap{padding:8px 14px 18px}.chk{padding:8px 14px 6px;font-size:17px}
  #bc{font-size:19px}.bl.k-h{font-size:23px}.bd-title{font-size:24px}#bc.v1{font-size:16.5px}#bc .ttl{font-size:32px}#bc .res .big{font-size:44px}
  #bc .paper{overflow-x:auto}#bc .paper svg{min-width:460px}.bd-fig{overflow-x:auto}.bd-fig svg{min-width:420px}.bl.k-f .katex{font-size:1em}.bl.k-f{font-size:21px}
  #side{position:static;flex-direction:column}#tutorCard{flex-direction:row;align-items:flex-end;gap:10px;padding:8px 10px}#tutorCard .nm{width:auto;flex-direction:column;align-items:flex-start;gap:0}#tutor{width:84px;height:98px}
  .box::before{display:none}.text{font-size:15px}.cbt{font-size:14px;min-height:42px}.tip{display:none}#prog{display:none}#chpills{display:none}
}

const D={"id": "phys2-2026-09-23", "slug": "phys2", "course": "일반물리학2", "date": "2026-09-23", "sess": "9/23(수) · 4주차", "title": "25장 축전기 — 전기 용량 세 가지와 유전체", "lead": "전기 용량을 구하는 순서는 하나다: <b>가우스 법칙으로 E → 선적분으로 ΔV → C = q/ΔV<\/b>. 가우스면 3종이 곧 축전기 3종(평행판·원통형·구형). 마지막에 유전체를 끼우면 왜 용량이 느는지까지. 이 회차는 녹음이 없어 판서 6장으로 정리했다.", "minutes": 18, "chapters": [{"id": "s1", "title": "전기 용량의 일반식 — 분자는 가우스, 분모는 선적분", "steps": [{"t": "formula", "html": "\\[C=\\frac{q}{\\Delta V}=\\frac{\\varepsilon_0\\oint\\vec E\\cdot\\hat n\\,dA}{-\\int_i^f\\vec E\\cdot d\\vec r}\\]"}, {"t": "why", "html": "분자: 가우스 법칙 \\(\\oint\\vec E\\cdot\\hat n\\,dA=q/\\varepsilon_0\\)을 \\(q\\)에 대해 푼 것. 분모: 일 \\(W=\\int_i^f q\\vec E\\cdot d\\vec r=-\\Delta U\\) → \\(\\Delta V=\\Delta U/q=-\\int_i^f\\vec E\\cdot d\\vec r\\)(24장 끝에 유도). 즉 23장(가우스)과 24장(전위)을 한 식에 합친 것이 25장이다."}, {"t": "say", "html": "판서 강조: 분자와 분모를 각각 원으로 묶고 「가우스 법칙」 화살표. 가우스면 3종 → ① 면 → 평행판 ② 원통 → 원통형 ③ 구 → 구형."}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 195\" width=\"560\" height=\"195\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"40\" y=\"44\" width=\"90\" height=\"60\" rx=\"0\" fill=\"rgba(255,77,141,.06)\" stroke=\"#FF4D8D\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/rect><text x=\"85\" y=\"120\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">면 A<\/text><line x1=\"85\" y1=\"126\" x2=\"85\" y2=\"146\" stroke=\"#8A97A6\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"><\/line><rect x=\"45\" y=\"152\" width=\"80\" height=\"8\" rx=\"0\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"1.5\"><\/rect><text x=\"53.0\" y=\"158.7 paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"85\" y=\"30\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">평행판<\/text><ellipse cx=\"280\" cy=\"50\" rx=\"30\" ry=\"10\" fill=\"rgba(255,77,141,.06)\" stroke=\"#FF4D8D\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/ellipse><ellipse cx=\"280\" cy=\"98\" rx=\"30\" ry=\"10\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/ellipse><line x1=\"250\" y1=\"50\" x2=\"250\" y2=\"98\" stroke=\"#FF4D8D\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/line><line x1=\"310\" y1=\"50\" x2=\"310\" y2=\"98\" stroke=\"#FF4D8D\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/line><text x=\"280\" y=\"122\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">원통 2πrL<\/text><line x1=\"280\" y1=\"128\" x2=\"280\" y2=\"146\" stroke=\"#8A97A6\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"><\/line><line x1=\"230\" y1=\"154\" x2=\"330\" y2=\"154\" stroke=\"#1F2A44\" stroke-width=\"2.5\"><\/line><line x1=\"230\" y1=\"180\" x2=\"330\" y2=\"180\" stroke=\"#1F2A44\" stroke-width=\"2.5\"><\/line><rect x=\"230\" y=\"164\" width=\"100\" height=\"6\" rx=\"0\" fill=\"rgba(224,49,49,.3)\" stroke=\"#E03131\" stroke-width=\"1\"><\/rect><text x=\"280\" y=\"30\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">원통형(동축)<\/text><circle cx=\"470\" cy=\"74\" r=\"32\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/circle><text x=\"470\" y=\"122\" font-size=\"13\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">구 4πr²<\/text><line x1=\"470\" y1=\"128\" x2=\"470\" y2=\"146\" stroke=\"#8A97A6\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"><\/line><circle cx=\"470\" cy=\"168\" r=\"17\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"><\/circle><circle cx=\"470\" cy=\"168\" r=\"6\" fill=\"rgba(224,49,49,.3)\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"470\" y=\"30\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">구형(동심)<\/text><\/svg><figcaption>가우스면 3종이 곧 축전기 3종. 순서는 늘 같다: 가우스로 \\(E\\) → 선적분으로 \\(\\Delta V\\) → \\(C=q/\\Delta V\\).<\/figcaption>"}, {"t": "memo", "html": "<b>외울 것<\/b> \\(C=q/\\Delta V\\) [F = C/V] · 순서: 가우스 → 선적분 → 나누기 · 결과는 \\(q\\)가 약분되어 <b>모양(기하)만<\/b> 남는다 · \\(1\\,\\mu\\)F = \\(10^{-6}\\) F"}, {"t": "analogy", "html": "물통의 용량이 \"같은 수압으로 얼마나 담기느냐\"이듯, 축전기 용량은 <b>같은 전압으로 얼마나 많은 전하를 담느냐<\/b>. 판이 넓고(A↑) 가까우면(d↓) 많이 담긴다."}, {"t": "board", "src": "../../lessons/_private/phys2/2026-09-23/판서_1_전기용량정의_평행판.jpg", "cap": "판서 ① 일반식 + 평행판 (10:46)"}], "say": null}, {"id": "s2", "title": "평행판 축전기 — C = ε₀A/d", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 210\" width=\"560\" height=\"210\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"150\" y=\"50\" width=\"260\" height=\"18\" rx=\"0\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"1.5\"><\/rect><text x=\"164.44444444444446\" y=\"62.74\" font-size=\"11\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"193.33333333333334\" y=\"62.74\" font-size=\"11\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"222.22222222222223\" y=\"62.74\" font-size=\"11\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"251.11111111111111\" y=\"62.74\" font-size=\"11\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"280.0\" y=\"62.74\" font-size=\"11\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"308.8888888888889\" y=\"62.74\" font-size=\"11\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"337.77777777777777\" y=\"62.74\" font-size=\"11\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"366.66666666666663\" y=\"62.74\" font-size=\"11\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"395.55555555555554\" y=\"62.74\" font-size=\"11\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><rect x=\"150\" y=\"140\" width=\"260\" height=\"18\" rx=\"0\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"1.5\"><\/rect><text x=\"164.44444444444446\" y=\"152.74\" font-size=\"11\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"193.33333333333334\" y=\"152.74\" font-size=\"11\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"222.22222222222223\" y=\"152.74\" font-size=\"11\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"251.11111111111111\" y=\"152.74\" font-size=\"11\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"280.0\" y=\"152.74\" font-size=\"11\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"308.8888888888889\" y=\"152.74\" font-size=\"11\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"337.77777777777777\" y=\"152.74\" font-size=\"11\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"366.66666666666663\" y=\"152.74\" font-size=\"11\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"395.55555555555554\" y=\"152.74\" font-size=\"11\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−<\/text><text x=\"120\" y=\"63\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+q, 넓이 A<\/text><text x=\"120\" y=\"153\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">−q<\/text><rect x=\"230\" y=\"36\" width=\"100\" height=\"50\" rx=\"0\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/rect><text x=\"345\" y=\"44\" font-size=\"12\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">가우스면(위판 감쌈)<\/text><line x1=\"200\" y1=\"72\" x2=\"200\" y2=\"136\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><line x1=\"280\" y1=\"72\" x2=\"280\" y2=\"136\" stroke=\"#2F9E44\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"><\/line><text x=\"294.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\">E<\/text><line x1=\"360\" y1=\"72\" x2=\"360\" y2=\"136\" stroke=\"#2F9E44\" stroke-width=\"2\" marker-end=\"url(#ah)\"><\/line><line x1=\"430\" y1=\"68\" x2=\"430\" y2=\"140\" stroke=\"#8A97A6\" stroke-width=\"1.2\"><\/line><text x=\"442\" y=\"108\" font-size=\"13\" fill=\"#8A97A6\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">d<\/text><text x=\"280\" y=\"190\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">EA = q/ε₀ → E = σ/ε₀ · ΔV = Ed → C = ε₀A/d<\/text><\/svg><figcaption>평행판: 위판을 감싸는 가우스면(전기력선은 아래로만) → \\(E=\\sigma/\\varepsilon_0\\). 전위차는 \\(E\\)를 간격만큼 적분.<\/figcaption>"}, {"t": "formula", "html": "\\[EA=\\frac{q}{\\varepsilon_0}\\Rightarrow E=\\frac{\\sigma}{\\varepsilon_0},\\qquad \\Delta V=-\\int_d^0E\\,ds=Ed,\\qquad C=\\frac{q}{\\Delta V}=\\frac{\\varepsilon_0EA}{Ed}=\\varepsilon_0\\frac{A}{d}\\ [\\mathrm F]\\]"}, {"t": "why", "html": "가우스면이 위판만 감싸고 전기력선은 판 사이로만 내려가므로 넓이는 \\(A\\)(무한 평면의 \\(2A\\)와 다르다 — 도체판 한쪽). \\(q\\)가 약분되어 <b>기하(A, d)만 남는다<\/b>. 용량은 전하를 얼마나 넣었느냐와 무관한 \"그릇의 크기\"."}, {"t": "analogy", "html": "얇은 종이 한 장을 사이에 두고 손바닥 둘을 마주 대면, 멀리 떨어져 있을 때보다 상대 손의 전하를 훨씬 세게 붙잡아 둔다. 가까울수록(\\(d\\)↓)·넓을수록(\\(A\\)↑) 같은 전압으로 더 많은 전하를 담는다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(C=\\varepsilon_0A/d\\) · \\(E=\\sigma/\\varepsilon_0\\)(도체판 한쪽) · \\(V=Ed\\) · \\(\\varepsilon_0=8.85\\times10^{-12}\\) F/m"}, {"t": "ex", "q": "넓이 \\(0.010\\ \\mathrm{m^2}\\), 간격 1.0 mm인 평행판의 용량", "a": "<p>\\(C=8.85\\times10^{-12}\\times\\dfrac{0.010}{0.0010}=8.85\\times10^{-11}\\) F \\(\\approx89\\) pF. mm를 m로 바꾸는 것을 잊지 말 것. 1 μF을 만들려면 판이 100 m²쯤 필요하다 — 그래서 유전체와 말아 감는 구조를 쓴다.<\/p>"}], "say": null}, {"id": "s3", "title": "원통형 축전기 — C = 2πε₀L / ln(b/a)", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 220\" width=\"560\" height=\"220\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><line x1=\"90\" y1=\"60\" x2=\"470\" y2=\"60\" stroke=\"#1F2A44\" stroke-width=\"3\"><\/line><line x1=\"90\" y1=\"160\" x2=\"470\" y2=\"160\" stroke=\"#1F2A44\" stroke-width=\"3\"><\/line><text x=\"470\" y=\"50\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">바깥 도체 (반지름 b)<\/text><rect x=\"90\" y=\"102\" width=\"380\" height=\"16\" rx=\"0\" fill=\"rgba(224,49,49,.25)\" stroke=\"#E03131\" stroke-width=\"1.5\"><\/rect><text x=\"476\" y=\"132\" font-size=\"12\" fill=\"#E03131\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">안쪽 도체 a, +q<\/text><rect x=\"150\" y=\"82\" width=\"200\" height=\"56\" rx=\"6\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/rect><text x=\"250\" y=\"76\" font-size=\"12\" fill=\"#FF4D8D\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">가우스면: 반지름 r, 길이 L<\/text><line x1=\"200\" y1=\"100\" x2=\"200\" y2=\"86\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><line x1=\"300\" y1=\"120\" x2=\"300\" y2=\"134\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><line x1=\"250\" y1=\"100\" x2=\"250\" y2=\"86\" stroke=\"#2F9E44\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"><\/line><text x=\"262.0\" y=\"97.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\">E<\/text><line x1=\"90\" y1=\"190\" x2=\"470\" y2=\"190\" stroke=\"#8A97A6\" stroke-width=\"1.2\"><\/line><line x1=\"90\" y1=\"186\" x2=\"90\" y2=\"194\" stroke=\"#8A97A6\" stroke-width=\"1.2\"><\/line><line x1=\"470\" y1=\"186\" x2=\"470\" y2=\"194\" stroke=\"#8A97A6\" stroke-width=\"1.2\"><\/line><text x=\"280.0\" y=\"206\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">L<\/text><\/svg><figcaption>원통형(동축): 옆면 \\(2\\pi rL\\)로 \\(E=\\frac{q}{2\\pi\\varepsilon_0L}\\frac1r\\) → \\(\\Delta V=\\frac{q}{2\\pi\\varepsilon_0L}\\ln\\frac ba\\).<\/figcaption>"}, {"t": "formula", "html": "\\[E\\cdot2\\pi rL=\\frac{q}{\\varepsilon_0}\\Rightarrow E=\\frac{q}{2\\pi\\varepsilon_0L}\\frac1r,\\quad \\Delta V=-\\int_b^a\\frac{q}{2\\pi\\varepsilon_0L}\\frac{dr}{r}=\\frac{q}{2\\pi\\varepsilon_0L}\\ln\\frac ba,\\quad C=\\frac{2\\pi\\varepsilon_0L}{\\ln(b/a)}\\]"}, {"t": "why", "html": "전기장이 \\(1/r\\)이라 적분하면 \\(\\ln\\)이 나온다. 적분 구간이 \\(b\\)에서 \\(a\\)(바깥에서 안쪽으로)라 부호가 정리되어 양수 \\(\\ln(b/a)\\). 판서에서 \\(q\\)를 취소선으로 약분한 자리."}, {"t": "say", "html": "판서 강조: \\(E=\\dfrac{q}{2\\pi\\varepsilon_0L}\\cdot\\dfrac1r\\)에 물결 밑줄, 최종 \\(C\\) 위에 「2πε₀L」 메모."}, {"t": "analogy", "html": "TV 안테나선(동축 케이블)이 바로 이 축전기다 — 가운데 심선(\\(a\\))과 바깥 그물망(\\(b\\)). 길이 \\(L\\)이 길수록 용량이 커지고, 반지름은 <b>비율 \\(b/a\\)<\/b>로만 들어간다(둘을 같이 2배 해도 용량은 그대로)."}, {"t": "memo", "html": "<b>외울 것<\/b> 원통형 \\(C=\\dfrac{2\\pi\\varepsilon_0L}{\\ln(b/a)}\\) — \\(1/r\\)을 적분하면 \\(\\ln\\) · 적분 방향은 바깥(\\(b\\))에서 안(\\(a\\))으로 → 양수"}, {"t": "board", "src": "../../lessons/_private/phys2/2026-09-23/판서_2_원통형축전기_구형도입.jpg", "cap": "판서 ② 원통형 축전기 (10:54)"}], "say": null}, {"id": "s4", "title": "구형 축전기 — 그리고 고립 도체구 4πε₀a", "steps": [{"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 220\" width=\"560\" height=\"220\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"160\" cy=\"110\" r=\"90\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2.5\"><\/circle><text x=\"160\" y=\"214\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">바깥 도체 껍질 b<\/text><circle cx=\"160\" cy=\"110\" r=\"40\" fill=\"rgba(224,49,49,.1)\" stroke=\"#E03131\" stroke-width=\"2.5\"><\/circle><text x=\"160\" y=\"114\" font-size=\"13\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">a, +q<\/text><circle cx=\"160\" cy=\"110\" r=\"65\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/circle><text x=\"232\" y=\"74\" font-size=\"12\" fill=\"#FF4D8D\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r<\/text><line x1=\"204.0\" y1=\"110.0\" x2=\"222.0\" y2=\"110.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"191.1\" y1=\"141.1\" x2=\"203.8\" y2=\"153.8\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"160.0\" y1=\"154.0\" x2=\"160.0\" y2=\"172.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"128.9\" y1=\"141.1\" x2=\"116.2\" y2=\"153.8\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"116.0\" y1=\"110.0\" x2=\"98.0\" y2=\"110.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"128.9\" y1=\"78.9\" x2=\"116.2\" y2=\"66.2\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"160.0\" y1=\"66.0\" x2=\"160.0\" y2=\"48.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"191.1\" y1=\"78.9\" x2=\"203.8\" y2=\"66.2\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"400\" y=\"80\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">E·4πr² = q/ε₀<\/text><text x=\"400\" y=\"105\" font-size=\"14\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">ΔV = (q/4πε₀)(1/a − 1/b)<\/text><text x=\"400\" y=\"135\" font-size=\"15\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">C = 4πε₀·ab/(b−a)<\/text><text x=\"400\" y=\"165\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">b → ∞ : C = 4πε₀a (고립 도체구)<\/text><\/svg><figcaption>구형: 안쪽 구와 바깥 껍질 사이의 전위차. 바깥 껍질을 무한대로 보내면 <b>고립 도체구<\/b>의 용량이 된다.<\/figcaption>"}, {"t": "formula", "html": "\\[E=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r^2},\\quad \\Delta V=\\frac{q}{4\\pi\\varepsilon_0}\\Big(\\frac1a-\\frac1b\\Big)=\\frac{q}{4\\pi\\varepsilon_0}\\frac{b-a}{ab},\\quad C=4\\pi\\varepsilon_0\\frac{ab}{b-a}=\\frac{4\\pi\\varepsilon_0a}{1-a/b}\\ \\xrightarrow{b\\to\\infty}\\ 4\\pi\\varepsilon_0a\\]"}, {"t": "why", "html": "\\(\\dfrac{ab}{b-a}\\)를 \\(b\\)로 나누면 \\(\\dfrac{a}{1-a/b}\\). 바깥 껍질을 무한대로 보내면 \\(a/b\\to0\\) → <b>도체구 하나<\/b>의 용량 \\(4\\pi\\varepsilon_0a\\). 단위 확인: \\(\\varepsilon_0\\)[F/m] × m = F."}, {"t": "analogy", "html": "지구도 고립 도체구다: \\(a=6.4\\times10^6\\) m → \\(C\\approx7\\times10^{-4}\\) F. 행성만 한 공이 고작 0.7 mF — 패럿이 얼마나 큰 단위인지 감이 온다."}, {"t": "memo", "html": "<b>외울 것<\/b> 구형 \\(C=4\\pi\\varepsilon_0\\dfrac{ab}{b-a}\\) · 고립 도체구 \\(C=4\\pi\\varepsilon_0a\\)(\\(b\\to\\infty\\)) · 세 축전기 모두 \\(\\varepsilon_0\\times\\)길이 차원"}, {"t": "board", "src": "../../lessons/_private/phys2/2026-09-23/판서_3_구형축전기_고립도체구.jpg", "cap": "판서 ③ 구형 결과 → b→∞ 고립 도체구 (10:58)"}], "say": null}, {"id": "s5", "title": "유전체 — 분극 · 유전 상수 κ · 유도 전하", "steps": [{"t": "talk", "html": "<p>誘電體(dielectric)의 D → \"두 극(two)\". 판 사이에 절연체(종이)를 끼우면 분자들이 <b>분극<\/b>되어 유전체 표면에 판과 반대 부호의 <b>유도 전하 ∓q′<\/b>가 생긴다.<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 236\" width=\"560\" height=\"236\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"140\" y=\"40\" width=\"280\" height=\"16\" rx=\"0\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"1.5\"><\/rect><text x=\"155.55555555555554\" y=\"51.4\" font-size=\"10\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"186.66666666666666\" y=\"51.4\" font-size=\"10\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"217.77777777777777\" y=\"51.4\" font-size=\"10\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">+<\/text><text x=\"248.88888888888889\" y=\"51.4\" font-size=\"10\" roke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><text x=\"168\" y=\"116\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">E₀<\/text><line x1=\"400\" y1=\"140\" x2=\"400\" y2=\"90\" stroke=\"#1971C2\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><text x=\"392\" y=\"118\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">E′<\/text><text x=\"280\" y=\"205\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">E = E₀ − E′ = E₀/κ  → V 줄고 C = κC₀ 늘어난다<\/text><text x=\"280\" y=\"226\" font-size=\"11.5\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">E₀ = 판의 전하가 만드는 장 · E′ = 유도 전하가 만드는 반대 방향의 장<\/text><\/svg><figcaption>유전체를 넣으면 분극으로 표면에 유도 전하가 생겨 판의 장을 일부 상쇄한다. 판의 \\(q\\)는 그대로인데 전위차가 줄어 용량이 는다.<\/figcaption>"}, {"t": "formula", "html": "\\[E=\\frac{q-q'}{\\varepsilon_0A}=\\frac{E_0}{\\kappa},\\qquad \\kappa=\\frac{\\varepsilon}{\\varepsilon_0}&gt;1\\ (\\text{유전 상수}),\\qquad V=\\frac{V_0}{\\kappa},\\quad C=\\kappa C_0,\\qquad q'=\\Big(1-\\frac1\\kappa\\Big)q\\]"}, {"t": "why", "html": "판의 전하 \\(q\\)를 고정한 채(전지를 뗀 상태) 유전체를 넣으면 가우스면 안 알짜는 \\(q-q'\\)로 줄어 \\(E\\)가 준다 → 같은 간격이니 \\(V=Ed\\)도 준다 → \\(C=q/V\\)는 \\(\\kappa\\)배 <b>는다<\/b>. 9/4에 나온 \"유전율이 크면 전기장이 작아진다\"가 여기서 식이 된다."}, {"t": "say", "html": "판서 강조: 「내부 전기장」 물결 밑줄 · 「분극」 동그라미 · \\(\\kappa=\\varepsilon/\\varepsilon_0\\) → 상대 유전율 ⇒ 「유전상수」 동그라미 · \\(q'=\\dfrac{\\kappa-1}{\\kappa}q\\) 물결 밑줄."}, {"t": "analogy", "html": "유전체는 판 사이에 끼운 스펀지 완충재다. 판의 전하가 만드는 장을 일부 흡수(상쇄)해, 같은 전하로도 전압이 덜 걸린다 → 같은 전압까지 채우려면 전하를 더 넣을 수 있다 = 용량이 는다. 9/4의 \"커튼(유전율)이 두꺼우면 전기장이 준다\"가 여기서 식이 된다."}, {"t": "pitfall", "html": "\"전하 고정\"(전지를 뗀 뒤 삽입)과 \"전압 고정\"(전지를 연결한 채 삽입)을 구별한다. 전하 고정: \\(q\\) 그대로, \\(E\\)·\\(V\\)가 \\(1/\\kappa\\). 전압 고정: \\(V\\) 그대로, 전지가 전하를 더 보내 \\(q=\\kappa q_0\\). 어느 쪽이든 \\(C=\\kappa C_0\\) — 용량은 그릇의 성질이라 조건과 무관."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\kappa=\\varepsilon/\\varepsilon_0&gt;1\\) · \\(E=E_0/\\kappa\\), \\(V=V_0/\\kappa\\), \\(C=\\kappa C_0\\)(전하 고정) · 유도 전하 \\(q'=(1-1/\\kappa)q\\) · 진공 \\(\\kappa=1\\), 종이 ≈ 3.5, 물 ≈ 80"}, {"t": "ex", "q": "\\(q=6.0\\,\\mu\\)C으로 충전된 평행판에 \\(\\kappa=3\\)인 유전체를 채우면 유도 전하 \\(q'\\)와 전기장 배율은?", "a": "<p>\\(q'=(1-\\tfrac13)\\times6.0=4.0\\,\\mu\\)C. \\(E=E_0/3\\) — 원래의 1/3. 내부 장을 \\((q-q')/\\varepsilon_0A=2.0\\,\\mu\\mathrm C/\\varepsilon_0A\\)로 확인해도 같다.<\/p>"}, {"t": "board", "src": "../../lessons/_private/phys2/2026-09-23/판서_5_유전체_분극_유전상수.jpg", "cap": "판서 ⑤ 유전체 — 분극·유도 전하·유전 상수 (11:14)"}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 단위", "html": "\\(1\\,\\mu\\)F는 몇 F인가?", "choices": [{"html": "\\(10^{-6}\\) F", "ok": true}, {"html": "\\(10^{-3}\\) F", "ok": false}, {"html": "\\(10^{-9}\\) F", "ok": false}, {"html": "\\(10^{6}\\) F", "ok": false}], "ans": "μ = \\(10^{-6}\\). \"정확히 기억해라\"(9/18)."}, {"id": "q2", "qn": "확인 2 · 평행판", "html": "판 넓이 \\(A=0.010\\ \\mathrm{m^2}\\), 간격 \\(d=1.0\\) mm인 평행판 축전기의 용량은? (\\(\\varepsilon_0=8.85\\times10^{-12}\\))", "choices": [{"html": "약 \\(8.9\\times10^{-11}\\) F (89 pF)", "ok": true}, {"html": "약 \\(8.9\\times10^{-14}\\) F", "ok": false}, {"html": "약 \\(8.9\\times10^{-8}\\) F", "ok": false}, {"html": "약 \\(1.1\\times10^{10}\\) F", "ok": false}], "ans": "\\(C=\\varepsilon_0A/d\\), \\(d=0.0010\\) m."}, {"id": "q3", "qn": "확인 3 · 용량 구하는 순서", "html": "축전기의 전기 용량을 구하는 세 단계의 올바른 순서는?", "choices": [{"html": "가우스 법칙으로 \\(E\\) → \\(\\Delta V=-\\int\\vec E\\cdot d\\vec r\\) → \\(C=q/\\Delta V\\)", "ok": true}, {"html": "\\(C=q/\\Delta V\\) → 가우스 법칙 → 선적분", "ok": false}, {"html": "선적분으로 \\(q\\) → 가우스 법칙으로 \\(V\\) → 나눈다", "ok": false}, {"html": "쿨롱 법칙으로 힘 → 일 → \\(C\\)", "ok": false}], "ans": "분자(전하)는 가우스, 분모(전위차)는 선적분. 세 축전기 모두 이 순서."}, {"id": "q4", "qn": "확인 4 · 고립 도체구", "html": "반지름 \\(a\\)인 고립 도체구의 전기 용량은?", "choices": [{"html": "\\(4\\pi\\varepsilon_0a\\)", "ok": true}, {"html": "\\(4\\pi\\varepsilon_0a^2\\)", "ok": false}, {"html": "\\(\\varepsilon_0/a\\)", "ok": false}, {"html": "\\(2\\pi\\varepsilon_0a\\)", "ok": false}], "ans": "구형 \\(4\\pi\\varepsilon_0\\frac{ab}{b-a}\\)에서 \\(b\\to\\infty\\)."}, {"id": "q5", "qn": "확인 5 · 유전체", "html": "전하 \\(q\\)를 고정한 평행판에 유전 상수 \\(\\kappa\\)인 유전체를 채우면?", "choices": [{"html": "전기장은 \\(E_0/\\kappa\\)로 줄고 전기 용량은 \\(\\kappa C_0\\)로 는다", "ok": true}, {"html": "전기장이 \\(\\kappa E_0\\)로 늘고 용량은 \\(C_0/\\kappa\\)로 준다", "ok": false}, {"html": "둘 다 변하지 않는다", "ok": false}, {"html": "전하가 \\(\\kappa q\\)로 는다", "ok": false}], "ans": "유도 전하가 판의 장을 상쇄 → \\(E\\)↓ → \\(V\\)↓ → \\(C=q/V\\)↑."}, {"id": "q6", "qn": "확인 6 · 원통형 유도", "html": "길이 \\(L\\), 안쪽 반지름 \\(a\\), 바깥 반지름 \\(b\\)인 동축 원통 축전기의 용량을 유도하라(세 단계).", "choices": null, "ans": "① \\(E\\cdot2\\pi rL=q/\\varepsilon_0\\) → \\(E=\\frac{q}{2\\pi\\varepsilon_0L}\\frac1r\\) ② \\(\\Delta V=\\frac{q}{2\\pi\\varepsilon_0L}\\ln\\frac ba\\) ③ \\(C=\\frac{2\\pi\\varepsilon_0L}{\\ln(b/a)}\\). \\(q\\)가 약분되어 기하만 남는다."}], "v": 1, "ver": ""};

  if(wrong.length) cs.push({t:"틀린 문제 다시 ("+wrong.length+")",cls:ung.length?"g":"p",primary:ung.length?0:1,key:ung.length?"":"Enter",f:()=>{ wrong.forEach(q=>{ delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; }); save(); S.mode="quiz"; S.qi=QZ.findIndex(q=>!ST.done[q.id]); render(); }});
  cs.push({t:"교재 보기",cls:"g",f:()=>openBook(null)}); cs.push({t:"목차",cls:"g",f:openToc});
  if(EMB) cs.push({t:"앱으로",cls:wrong.length?"g":"p",primary:wrong.length?0:1,f:()=>post({type:"mc-close",v:1})});
  choices(cs);
}
/* ---------- 목차 · 교재 · 질문 ---------- */
function openToc(){ const ov=$("#ov"); $("#ovMeta").textContent=D.course+" · "+D.sess+" · XP "+(L.xp||0)+(V2?" · 판서 v2":" · 구버전 판서");
  $("#ovList").innerHTML=CH.map((c,i)=>'<li class="'+(L.ch[c.id]?"done":"")+(S.mode==="step"&&S.ci===i?" cur":"")+'"><button type="button" data-ci="'+i+'"><span class="st">'+(L.ch[c.id]?"✓":i+1)+'</span><span>'+esc(c.title)+'</span><small>'+c.steps.length+'단계</small></button></li>').join("")
    +(QZ.length?'<li class="'+(QZ.every(q=>ST.done[q.id])?"done":"")+(S.mode==="quiz"?" cur":"")+'"><button type="button" data-q="1"><span class="st">?</span><span>확인 문제</span><small>'+QZ.filter(q=>ST.done[q.id]).length+'/'+QZ.length+'</small></button></li>':"");
  $$("#ovList [data-ci]").forEach(b=>{ b.onclick=()=>{ ov.classList.remove("on"); cancelAll(); S=Object.assign(S,{mode:"step",ci:+b.dataset.ci,si:0,rev:false,again:0,resume:false}); render(); }; });
  const qb=$("#ovList [data-q]"); if(qb) qb.onclick=()=>{ ov.classList.remove("on"); cancelAll(); if(T.hearts<=0&&QZ.some(q=>!ST.done[q.id])){ S.mode="nohearts"; return render(); } S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; render(); };
  ov.classList.add("on"); }

$("#ovReset").onclick=()=>{ if(!confirm("이 회차의 챕터·문제 기록을 지울까요? (XP·연속일과 이미 받은 보상은 그대로 — 같은 챕터·문제로 XP 를 다시 받지는 않습니다)")) return; cancelAll(); L={pos:null,ch:{},done:false,xp:L.xp||0,rew:(L.rew&&typeof L.rew==="object")?L.rew:{}}; ST={read:{},done:{},correct:{},answer:{},ts:0}; S=Object.assign(S,{mode:"intro",ci:0,si:0,qi:0,rev:false,again:0,resume:false,pre:"",preFace:""}); $("#ov").classList.remove("on"); render(); };

function openBook(sid){ const hash=sid?"#s="+sid:""; if(EMB){ post({type:"mc-open",v:1,file:LESSON_APP+hash,title:document.title}); } else location.href=LESSON_REL+hash; }
function ask(){ if(anim||typing) finishNow();   /* 질문 대사가 진행 중인 단계의 완료 콜백을 지우지 않게 먼저 즉시 완료(오타 R2) */

function ctx(){ if(!CTX_GEN||!EMB) return; let label="", q=null, sid="";

    q={qn:qq.qn,kind:"문제",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:(qq.choices||[]).map(c=>tc(c.html)),my:(ST.answer[qq.id]==null?null:String(ST.answer[qq.id])),revealed:!!ST.done[qq.id],correct:(typeof ST.correct[qq.id]==="boolean"?ST.correct[qq.id]:null),answer:null}; } }

/* 해시: #resume(저장 위치) · #ch=N(챕터 N) · #ch=N.M(챕터 N 의 M 단계) · #quiz · #result */
function boot(){ const m=/^#(resume|ch=(\d+)(?:\.(\d+))?|quiz|result)$/.exec(location.hash||"");
  if(m&&m[1]==="resume"&&L.pos&&!L.done){ return resumeTo(posOf()); }
  else if(m&&m[2]){ const ci=Math.max(0,Math.min(CH.length-1,+m[2]-1)); const si=m[3]?Math.max(0,Math.min(CH[ci].steps.length-1,+m[3]-1)):0; S=Object.assign(S,{mode:"step",ci:ci,si:si,rev:(CH[ci].steps[si]||{}).t==="ex"&&/\.\d+r$/.test(location.hash),resume:!!m[3]}); }
  else if(m&&m[1]==="quiz"&&QZ.length){ S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; }
  else if(m&&m[1]==="result"){ S.mode="result"; }
  render(); }
