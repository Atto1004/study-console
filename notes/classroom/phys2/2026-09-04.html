<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전하와 전기장 — "전기와 자기는 똑같다"</title>
<!-- 교실 모드 템플릿 v2 (대표님 2026-09-27 확정: 듀오링고×애플 융합 · 판서는 짧게(Gaegu) + 말풍선은 일타강사 구어체 · 그림은 분필 · 단계 애니메이션 · 글꼴 Gowun Dodum/Gothic A1/Inter)
     v2 회차(D.v===2)는 판서 파일(BOARD)로 만든 단계(판서 줄 누적 + 그림 단계 + 대사), v1 회차는 원문 문단 그대로(「구버전 판서」 표시).
     저장: mc-tutor(전역 XP·연속일·하트·호감도 + 회차 위치 {mode,cid,sid,qi,ver}) + mc-lesson-<id>(챕터 읽음·문제, 수업 노트·앱 V52 와 공유). 오타 설계 회의 1·2차 조건 반영. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Gothic+A1:wght@700;800&family=Inter:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--bg:#F5F5F7;--card:rgba(255,255,255,.86);--line:rgba(0,0,0,.08);--ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#8E8E93;--green:#1B7A2E;--green-soft:#E8F7EA;--blue:#0A84FF;--amber:#B25E00;--red:#D42020;
  --board:#2F5D4B;--wood:#7A4E2B;--chalk:#F4F1E8;--chalk-2:rgba(244,241,232,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --fb:"Gowun Dodum","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fh:"Gothic A1","Gowun Dodum",sans-serif;--fn:Inter,"Gothic A1",sans-serif;--fk:Gaegu,"Gowun Dodum",sans-serif;--hud:56px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:var(--fb);font-size:16px;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
#hud .in{max-width:1040px;margin:0 auto;height:100%;padding:0 20px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-family:var(--fh);font-weight:800;font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hud .chp{font-family:var(--fn);font-weight:700;font-size:12px;color:var(--ink-2);white-space:nowrap}
#hud .seg{display:flex;gap:4px;flex:1;max-width:280px}#hud .seg i{display:block;flex:1;height:6px;border-radius:3px;background:#E5E5EA}#hud .seg i.on{background:var(--green)}#hud .seg i.cur{background:var(--blue)}
#hud .hr{display:flex;align-items:center;gap:8px}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--fn);font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:999px;position:relative;white-space:nowrap}
.stat svg{width:15px;height:15px;display:block}
.stat.xp{background:#FFF8DC;color:#8A5A00}.stat.sk{background:#FFF0E6;color:#C2410C}.stat.hp{background:#FFECEC;color:#C92A2A;gap:3px}.stat.af{background:#F7E4EE;color:#B8286A}
.stat .gauge{display:inline-block;width:52px;height:8px;border-radius:99px;background:#F0D0DF;overflow:hidden}.stat .gauge b{display:block;height:100%;width:0;background:#B8286A;transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#1F7A32;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#C92A2A}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer}
/* ---------- 교실 ---------- */
main{max-width:1040px;margin:0 auto;padding:16px 20px 24px}
#room{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:16px;align-items:start}
#board{position:relative}
.frame{padding:12px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 14px 34px rgba(60,40,20,.2),inset 0 2px 0 rgba(255,255,255,.18);position:relative}
.green{position:relative;border-radius:6px;min-height:560px;background:radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.06),transparent 42%),repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);overflow:hidden}
/* 칠판 머리표(챕터·단계): 스크롤 칸 안에 sticky — 판서가 스크롤돼도 글자가 머리표와 겹치지 않는다(2026-09-27 캡처에서 겹침) */
.chk{position:sticky;top:0;z-index:2;margin:0 -30px 10px;padding:12px 30px 8px;font-family:var(--fk);font-weight:700;font-size:20px;color:var(--yel);background:linear-gradient(180deg,#2E5B49 78%,rgba(46,91,73,0));flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk small{font-family:var(--fn);font-size:11px;font-weight:700;color:var(--chalk-2);margin-left:8px;letter-spacing:.04em;vertical-align:middle}
.chk .old{font-family:var(--fb);font-size:11px;color:var(--pink);margin-left:8px;vertical-align:middle;border:1px dashed var(--pink);border-radius:6px;padding:1px 6px}
#bwrap{max-height:70vh;min-height:560px;overflow:auto;padding:0 30px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-family:var(--fk);font-weight:700;font-size:24px;line-height:1.5;width:100%;margin:auto 0}
#bc.v1{font-family:var(--fb);font-weight:400;font-size:18px;line-height:1.75}
#bc .katex{color:var(--sky)}#bc .katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* v2 판서 줄 */
.bd-title{font-size:30px;color:var(--yel);margin:0 0 10px;line-height:1.2;text-decoration:underline wavy rgba(255,226,122,.55) 2px;text-underline-offset:6px}
.bl{margin:0 0 8px;padding-left:34px;position:relative;clip-path:inset(0 100% 0 0);transition:clip-path .45s ease-out}
.bl.on{clip-path:inset(0 0 0 0)}.bl.now{clip-path:inset(0 0 0 0);transition:none}
.bl::before{position:absolute;left:4px;top:0;font-size:1em}
.bl.k-li::before{content:"•"}.bl.k-h{padding-left:0;font-size:28px;color:var(--yel);margin-top:6px}.bl.k-h::before{content:""}
.bl.k-f{padding-left:0;text-align:center;font-size:24px}.bl.k-f::before{content:""}.bl.k-f .katex-display{margin:6px 0}.bl.k-f .katex{font-size:1.2em}
.bl.k-pit{color:var(--pink);border:2px dashed rgba(255,163,199,.6);border-radius:10px;padding:6px 12px 6px 38px;margin:6px 0 10px}.bl.k-pit::before{content:"!";left:14px;top:6px;color:var(--pink)}
.bl.k-star{color:var(--yel)}.bl.k-star::before{content:"☆";color:var(--yel)}
.bl.k-res{color:var(--yel)}.bl.k-res::before{content:"→";color:var(--yel)}
.bl.k-memo{border:2px solid rgba(244,241,232,.6);border-radius:10px;padding:6px 12px;margin:10px 0 6px;background:rgba(255,255,255,.05)}.bl.k-memo::before{content:""}
.bl .ul{text-decoration:underline wavy var(--yel) 2px;text-underline-offset:5px}
.bl .katex{color:var(--sky);font-size:.92em}
/* 그림(분필) */
.bd-fig{margin:14px auto 4px;max-width:640px;width:100%}
.bd-fig figure{margin:0}.bd-fig svg{width:100%;height:auto;display:block;overflow:visible}.bd-fig figcaption{display:none}
.bd-fig [data-step][hidden]{display:none}
.bd-fig .pre{opacity:0}   /* 이 단계에서 새로 나올 그림 단계는 그림 차례까지 가림 */
.bd-fig .ck{stroke-linecap:round;stroke-linejoin:round}
.bd-fig .draw{transition:stroke-dashoffset var(--dur,1s) ease-out}
.bd-fig .fade{opacity:0;transition:opacity .35s ease-out}.bd-fig .fade.on{opacity:1}
@media (prefers-reduced-motion: reduce){.bl{transition:none}.bd-fig .draw,.bd-fig .fade{transition:none}}
/* v1(구버전) 판서 상자 */
#bc .tk{font-size:19px}#bc p{margin:0 0 10px}#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc .sub{font-family:var(--fk);font-size:26px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .bx{margin:6px 0 14px;padding:12px 16px 10px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative}
#bc .bx>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75)}#bc .bx.formula>i{color:var(--mint)}#bc .bx.pitfall{border-color:rgba(255,163,199,.7)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7)}#bc .bx.memo>i{color:var(--chalk)}#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
#bc .paper{background:#FFFDF7;color:#1F2A44;border-radius:6px;padding:12px 14px 8px;margin:8px auto 14px;max-width:560px;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}#bc .paper figcaption,#bc .paper .cap{font-size:13.5px;color:#55627A;margin-top:6px}#bc .paper .katex{color:#1F2A44}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}#bc .ex .exq>i,#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px;color:var(--yel)}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}#bc .ex .exa>i{color:var(--mint)}#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz{font-family:var(--fb);font-weight:400;font-size:18px}
#bc .qz .qn{font-family:var(--fk);font-weight:700;font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:19px}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12)}#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--fk);font-weight:700;font-size:22px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--fk);font-size:40px;line-height:1.15;color:var(--chalk);margin:0 0 6px}
#bc .lead{font-family:var(--fb);font-weight:400;color:var(--chalk-2);font-size:17px;margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-family:var(--fb);font-weight:400;font-size:17px}
#bc .toc li{display:flex;align-items:center;gap:12px;padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;font-family:var(--fb);font-weight:400}#bc .res .big{font-family:var(--fk);font-weight:700;font-size:60px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:17px;margin:6px 0 12px}#bc .res .stats b{display:block;font-family:var(--fn);font-size:32px;line-height:1.1}#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700}
#bc .res .badge{margin:4px auto 0;width:130px;height:130px}#bc .res .bl2{font-size:13px;font-weight:700;color:var(--chalk-2);margin-top:4px}#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
.tray{height:18px;margin:0 26px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:7px;width:44px;border-radius:4px;background:var(--chalk)}.tray i.y{left:76px;background:var(--yel)}.tray i.p{left:132px;background:var(--pink)}.tray i.w{left:22px}.tray i.er{left:auto;right:26px;width:60px;height:11px;top:3px;border-radius:3px;background:#1E1E22}
#chpills{margin-top:12px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#chpills .lb{font-size:12px;color:var(--ink-2);font-weight:700;margin-right:4px}
.pill{border:1px solid var(--line);background:#F2F2F7;color:var(--ink-3);font-family:var(--fn);font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.pill.done{background:var(--green-soft);color:var(--green);border-color:transparent}.pill.cur{background:var(--green);color:#fff;border-color:var(--green)}
/* ---------- 오른쪽: 스앵님 · 말풍선 · 선택지 ---------- */
#side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--hud) + 16px)}
#tutorCard{padding:12px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
#tutorCard .nm{align-self:flex-start;display:flex;align-items:center;gap:8px;width:100%}
#tutorCard .nm b{font-family:var(--fh);font-weight:800;font-size:13px}#tutorCard .nm span{font-size:11px;color:var(--ink-3);margin-left:auto}
#tutor{width:150px;height:176px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.14));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
.box{padding:14px 16px 12px;position:relative;min-height:120px}
.box::before{content:"";position:absolute;left:50%;top:-9px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.name{font-family:var(--fh);font-weight:800;font-size:12px;color:var(--green);margin-bottom:4px}.name.prof{color:#7A2E52}
.text{font-size:15.5px;line-height:1.6;min-height:48px;cursor:pointer}
.text .cur{display:inline-block;width:.5em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.tip{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.cbt{font:inherit;font-weight:700;font-size:14.5px;padding:11px 16px;border-radius:12px;cursor:pointer;color:var(--ink);background:#fff;border:1px solid var(--line);transition:transform .08s,filter .15s;width:100%;text-align:center;min-height:44px}
.cbt:hover{filter:brightness(.97)}.cbt:active{transform:translateY(1px)}
.cbt.p{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 10px rgba(27,122,46,.25)}
.cbt.t{background:var(--green-soft);color:var(--green);border-color:transparent}
.cbt.r{background:var(--red);color:#fff;border-color:var(--red)}
.cbt.g{background:#F2F2F7;color:var(--ink-2);border-color:transparent}
.cbt kbd{font-family:var(--fn);font-size:10.5px;opacity:.6;margin-left:6px}
#prog{padding:12px 14px}#prog .k{font-size:12px;color:var(--ink-2);font-weight:700}#prog .v{font-family:var(--fh);font-weight:800;font-size:15px;margin:2px 0 6px}#prog .bar{height:6px;border-radius:3px;background:#E5E5EA;overflow:hidden}#prog .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}#prog .h{font-size:11.5px;color:var(--ink-3);margin-top:6px}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.5);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-family:var(--fh);font-weight:800;font-size:20px}#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}

<script>
const D={"id": "phys2-2026-09-04", "slug": "phys2", "course": "일반물리학2", "date": "2026-09-04", "sess": "9/4(금) · 1주차", "title": "전하와 전기장 — \"전기와 자기는 똑같다\"", "lead": "이번 학기 전기 파트(21~25장)는 한 줄이다: <b>전하 → 전기장 → 가우스 법칙 → 전위 → 축전기<\/b>. 오늘은 계산이 아니라 그 뼈대를 세우는 날. 교수님은 \"다다음 시간부터 전기장 계산에 치일 것\"이라고 예고했다.", "minutes": 18, "chapters": [{"id": "s1", "title": "전기의 소스는 전하 — 세는 습관부터", "steps": [{"t": "talk", "html": "<p>전기 현상을 일으키는 근원은 <b>전하(charge)<\/b>다. 전하는 낱개로 세어진다: 전자 하나가 \\(-e\\), 양성자 하나가 \\(+e\\), \\(e=1.6\\times10^{-19}\\) C.<\/p>", "sub": null}, {"t": "formula", "html": "\\[q = n\\,e\\qquad (n = \\text{개수},\\ e = 1.6\\times10^{-19}\\ \\mathrm{C})\\] 전하량을 보면 <b>개수<\/b>가 보여야 한다. \\(3.2\\times10^{-19}\\) C → 2개."}, {"t": "why", "html": "전하는 전자·양성자라는 알갱이로만 존재하기 때문에 \\(e\\)의 정수배로만 나온다. 이걸 <b>양자화<\/b>라고 부르지만, 수업에서는 \"덩어리로 묶여 있다\"는 뜻 이상으로 의미를 두지 말라고 했다."}, {"t": "talk", "html": "<p>물체 안에는 양성자와 전자가 섞여 있다. 같은 수만큼은 서로 상쇄되고 <b>남는 것<\/b>만 전기를 만든다 — 그것이 <b>알짜 전하(net charge)<\/b>다.<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"80\" cy=\"70\" r=\"11\" fill=\"#fff\"><\/circle><circle cx=\"80\" cy=\"70\" r=\"11\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"80\" y=\"74.2\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#E03131\">+<\/text><circle cx=\"112\" cy=\"70\" r=\"11\" fill=\"#fff\"><\/circle><circle cx=\"112\" cy=\"70\" r=\"11\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"112\" y=\"74.2\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#E03131\">+<\/text><circle cx=\"64\" cy=\"118\" r=\"11\" fill=\"#fff\"><\/circle><circle cx=\"64\" cy=\"118\" r=\"11\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"><\/circle><text x=\"64\" y=\"122.2\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1971C2\">−<\/text><circle cx=\"96\" cy=\"118\" r=\"11\" fill=\"#fff\"><\/circle><circle cx=\"96\" cy=\"118\" r=\"11\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"><\/circle><text x=\"96\" y=\"122.2\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1971C2\">−<\/text><circle cx=\"128\" cy=\"118\" r=\"11\" fill=\"#fff\"><\/circle><circle cx=\"128\" cy=\"118\" r=\"11\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"><\/circle><text x=\"128\" y=\"122.2\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1971C2\">−<\/text><circle cx=\"80\" cy=\"160\" r=\"11\" fill=\"#fff\"><\/circle><circle cx=\"80\" cy=\"160\" r=\"11\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"><\/circle><text x=\"80\" y=\"164.2\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1971C2\">−<\/text><circle cx=\"112\" cy=\"160\" r=\"11\" fill=\"#fff\"><\/circle><circle cx=\"112\" cy=\"160\" r=\"11\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"><\/circle><text x=\"112\" y=\"164.2\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1971C2\">−<\/text><rect x=\"40\" y=\"40\" width=\"112\" height=\"145\" rx=\"14\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"2\" stroke-dasharray=\"4 4\"><\/rect><text x=\"96\" y=\"32\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">q₁ = 양성자 2 + 전자 5<\/text><line x1=\"200\" y1=\"112\" x2=\"250\" y2=\"112\" stroke=\"#1F2A44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"225\" y=\"100\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">상쇄<\/text><circle cx=\"320\" cy=\"100\" r=\"22\" fill=\"#fff\"><\/circle><circle cx=\"320\" cy=\"100\" r=\"22\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"><\/circle><text x=\"320\" y=\"105.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#1971C2\">−<\/text><text x=\"320\" y=\"170\" font-size=\"14\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">알짜 −3e<\/text><line x1=\"348.0\" y1=\"100.0\" x2=\"364.0\" y2=\"100.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"334.0\" y1=\"124.2\" x2=\"342.0\" y2=\"138.1\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"306.0\" y1=\"124.2\" x2=\"298.0\" y2=\"138.1\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"292.0\" y1=\"100.0\" x2=\"276.0\" y2=\"100.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"306.0\" y1=\"75.8\" x2=\"298.0\" y2=\"61.9\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"334.0\" y1=\"75.8\" x2=\"342.0\" y2=\"61.9\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"320\" y=\"190\" font-size=\"12\" fill=\"#2F9E44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">전기력선 3개가 들어온다<\/text><circle cx=\"470\" cy=\"100\" r=\"22\" fill=\"#fff\"><\/circle><circle cx=\"470\" cy=\"100\" r=\"22\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"470\" y=\"105.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#E03131\">+<\/text><text x=\"470\" y=\"170\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">알짜 +9e<\/text><line x1=\"498.0\" y1=\"100.0\" x2=\"518.0\" y2=\"100.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"491.4\" y1=\"118.0\" x2=\"506.8\" y2=\"130.9\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"474.9\" y1=\"127.6\" x2=\"478.3\" y2=\"147.3\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"456.0\" y1=\"124.2\" x2=\"446.0\" y2=\"141.6\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"443.7\" y1=\"109.6\" x2=\"424.9\" y2=\"116.4\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"443.7\" y1=\"90.4\" x2=\"424.9\" y2=\"83.6\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"456.0\" y1=\"75.8\" x2=\"446.0\" y2=\"58.4\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"474.9\" y1=\"72.4\" x2=\"478.3\" y2=\"52.7\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"491.4\" y1=\"82.0\" x2=\"506.8\" y2=\"69.1\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"470\" y=\"190\" font-size=\"12\" fill=\"#2F9E44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">9개가 나간다<\/text><\/svg><figcaption>양성자 2개 + 전자 5개 → 2쌍은 중성으로 상쇄, 전자 3개만 남는다. 앞으로 「전하」는 전부 이 알짜(net) 전하다.<\/figcaption>"}, {"t": "analogy", "html": "통장에 +100만 원 재산과 −100만 원 빚이 같이 있으면 남는 건 0이다. 전하도 마찬가지 — 앞으로 \"전하 q\"라고 하면 언제나 <b>상쇄하고 남은 알짜<\/b>를 뜻한다."}, {"t": "say", "html": "\"이 얘기(알짜 전하와 전기력선 개수)만 딱 있으면 전기는 끝이야.\" — 강의노트 뒤의 합력 문제는 전부 이 그림에서 벡터 합만 하면 된다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(q=ne\\), \\(e=1.6\\times10^{-19}\\) C · 전하 = 알짜(net) · 전자 하나 = 전기력선 하나"}], "say": null}, {"id": "s2", "title": "전기장 = \"+1 C을 놓았을 때 받는 힘\"", "steps": [{"t": "talk", "html": "<p>어떤 전하가 주변 공간에 미치는 영향을 지도로 그린 것이 <b>전기장 \\(\\vec E\\)<\/b>다. 기준은 언제나 <b>+1 C의 시험전하<\/b>(test charge). 그 자리에 +1 C을 놓았을 때 받는 힘의 크기와 방향이 곧 그 점의 전기장이다.<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 210\" width=\"560\" height=\"210\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"150\" cy=\"105\" r=\"20\" fill=\"#fff\"><\/circle><circle cx=\"150\" cy=\"105\" r=\"20\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"150\" y=\"110.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#E03131\">+<\/text><text x=\"150\" y=\"141\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">+q<\/text><line x1=\"178.0\" y1=\"105.0\" x2=\"220.0\" y2=\"105.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"172.7\" y1=\"121.5\" x2=\"206.6\" y2=\"146.1\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"158.7\" y1=\"131.6\" x2=\"171.6\" y2=\"171.6\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"141.3\" y1=\"131.6\" x2=\"128.4\" y2=\"171.6\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"127.3\" y1=\"121.5\" x2=\"93.4\" y2=\"146.1\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"122.0\" y1=\"105.0\" x2=\"80.0\" y2=\"105.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"127.3\" y1=\"88.5\" x2=\"93.4\" y2=\"63.9\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"141.3\" y1=\"78.4\" x2=\"128.4\" y2=\"38.4\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"158.7\" y1=\"78.4\" x2=\"171.6\" y2=\"38.4\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"172.7\" y1=\"88.5\" x2=\"206.6\" y2=\"63.9\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"150\" y=\"195\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">양전하: 밖으로<\/text><circle cx=\"410\" cy=\"105\" r=\"20\" fill=\"#fff\"><\/circle><circle cx=\"410\" cy=\"105\" r=\"20\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"><\/circle><text x=\"410\" y=\"110.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#1971C2\">−<\/text><text x=\"410\" y=\"141\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">−q<\/text><line x1=\"438.0\" y1=\"105.0\" x2=\"480.0\" y2=\"105.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"432.7\" y1=\"121.5\" x2=\"466.6\" y2=\"146.1\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"418.7\" y1=\"131.6\" x2=\"431.6\" y2=\"171.6\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"401.3\" y1=\"131.6\" x2=\"388.4\" y2=\"171.6\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"387.3\" y1=\"121.5\" x2=\"353.4\" y2=\"146.1\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"382.0\" y1=\"105.0\" x2=\"340.0\" y2=\"105.0\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"387.3\" y1=\"88.5\" x2=\"353.4\" y2=\"63.9\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"401.3\" y1=\"78.4\" x2=\"388.4\" y2=\"38.4\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"418.7\" y1=\"78.4\" x2=\"431.6\" y2=\"38.4\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><line x1=\"432.7\" y1=\"88.5\" x2=\"466.6\" y2=\"63.9\" stroke=\"#2F9E44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><text x=\"410\" y=\"195\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">음전하: 안으로<\/text><circle cx=\"280\" cy=\"40\" r=\"5\" fill=\"#1F2A44\"><\/circle><text x=\"268\" y=\"30\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">P에 +1 C<\/text><line x1=\"280\" y1=\"40\" x2=\"340\" y2=\"40\" stroke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><text x=\"310.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\">E = 받는 힘<\/text><\/svg><figcaption>전기장 \\(ec E\\) = 그 점에 +1 C 시험전하를 두었을 때 받는 힘. 화살표(전기력선)의 밀도가 세기, 접선이 방향.<\/figcaption>"}, {"t": "why", "html": "힘 \\(\\vec F\\)는 놓은 시험전하 \\(q_0\\)에 비례한다. 시험전하가 2배면 힘도 2배. 그래서 힘을 시험전하로 나눈 \\(\\vec E=\\vec F/q_0\\)를 쓰면 \"누가 와서 재든 같은 값\"이 된다 — 전하가 만든 공간의 성질만 남는다. 시험전하는 원래 장을 흐트러뜨리지 않도록 아주 작다고 본다(\\(q_0\\to0\\))."}, {"t": "analogy", "html": "바람 지도. 깃발(시험전하)을 어디에 꽂아도 \"그 자리의 바람\"은 정해져 있다. 큰 깃발은 더 세게 밀리지만 바람 자체가 세진 건 아니다. 전기장은 그 \"바람\"이다."}, {"t": "talk", "html": "<p>+1 C에는 전자 약 \\(6\\times10^{18}\\)개 분량의 전하가 있다(교수님 표현 \"600경 개\"). 양성자 하나에서 전기력선이 하나 나온다고 보면 +1 C에서는 전기력선이 \\(6\\times10^{18}\\)개 뻗어 나간다. 전기장을 구한다 = <b>그 점을 지나는 전기력선을 센다<\/b>.<\/p>", "sub": null}, {"t": "say", "html": "\"그러면 이 n개를 어떻게 카운트할 거냐가 핵심 내용인 거예요.\" — 이 과목의 전기 파트 전체가 \"상황별로 전기력선 개수를 세는 법\"이다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(\\vec E=\\vec F/q_0\\) [N/C] · 기준은 <b>+1 C<\/b> · 전기력선은 +에서 나와 −로 들어간다 · 선의 밀도 = 세기, 접선 = 방향 · +1 C = 전기력선 \\(6\\times10^{18}\\)개"}], "say": null}, {"id": "s3", "title": "세는 방법은 둘뿐 — 합(Σ) 아니면 적분(∫)", "steps": [{"t": "talk", "html": "<p>전하가 <b>몇 개<\/b>로 떨어져 있으면 하나씩 구해서 더한다(Σ). 전하가 도선·판처럼 <b>연속으로 퍼져<\/b> 있으면 아주 작은 조각 \\(dq\\)가 만드는 장을 적분한다(∫).<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 170\" width=\"560\" height=\"170\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"30\" y=\"30\" width=\"230\" height=\"120\" rx=\"12\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\/rect><text x=\"145\" y=\"52\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">불연속 → Σ (하나씩 더한다)<\/text><circle cx=\"80\" cy=\"100\" r=\"12\" fill=\"#fff\"><\/circle><circle cx=\"80\" cy=\"100\" r=\"12\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"80\" y=\"104.5\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#E03131\">+<\/text><text x=\"80\" y=\"128\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">점전하<\/text><circle cx=\"145\" cy=\"100\" r=\"10\" fill=\"#fff\"><\/circle><circle cx=\"145\" cy=\"100\" r=\"10\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"145\" y=\"103.8\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#E03131\">+<\/text><circle cx=\"175\" cy=\"100\" r=\"10\" fill=\"#fff\"><\/circle><circle cx=\"175\" cy=\"100\" r=\"10\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"><\/circle><text x=\"175\" y=\"103.8\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1971C2\">−<\/text><text x=\"175\" y=\"126\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">점전하군<\/text><circle cx=\"225\" cy=\"92\" r=\"9\" fill=\"#fff\"><\/circle><circle cx=\"225\" cy=\"92\" r=\"9\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"225\" y=\"95.2\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E03131\">+<\/text><circle cx=\"225\" cy=\"114\" r=\"9\" fill=\"#fff\"><\/circle><circle cx=\"225\" cy=\"114\" r=\"9\" fill=\"#1971C2\" fill-opacity=\".15\" stroke=\"#1971C2\" stroke-width=\"2\"><\/circle><text x=\"225\" y=\"117.2\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1971C2\">−<\/text><text x=\"225\" y=\"139\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">쌍극자<\/text><rect x=\"300\" y=\"30\" width=\"230\" height=\"120\" rx=\"12\" fill=\"none\" stroke=\"#8A97A6\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\/rect><text x=\"415\" y=\"52\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">연속 → ∫dq (조각을 적분)<\/text><rect x=\"320\" y=\"96\" width=\"60\" height=\"8\" rx=\"0\" fill=\"rgba(224,49,49,.25)\" stroke=\"#E03131\" stroke-width=\"1\"><\/rect><text x=\"350\" y=\"126\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">직선 λ<\/text><circle cx=\"430\" cy=\"100\" r=\"18\" fill=\"none\" stroke=\"#E03131\" stroke-width=\"2.5\"><\/circle><text x=\"430\" y=\"136\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">고리 λ<\/text><circle cx=\"500\" cy=\"100\" r=\"20\" fill=\"rgba(224,49,49,.15)\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"500\" y=\"136\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">원판 σ<\/text><\/svg><figcaption>22장의 목차 = 세는 방법 두 가지. 재료(전하 분포)만 바뀌고 레시피는 같다: 조각의 장 → 대칭 → 더하기.<\/figcaption>"}, {"t": "memo", "html": "<b>외울 것<\/b> <b>불연속 → Σ<\/b>: 점전하 · 점전하군 · 전기쌍극자<br><b>연속 → ∫dq<\/b>: 직선 도선(\\(\\lambda\\)) · 원형 도선(\\(\\lambda\\)) · 원판(\\(\\sigma\\)) · \\(dq=\\lambda\\,ds=\\sigma\\,dA=\\rho\\,dV\\)"}, {"t": "talk", "html": "<p>연속 분포에는 \"단위 길이·면적·부피당 전하\"인 <b>밀도<\/b> 기호가 붙는다: 선 \\(\\lambda=dq/ds\\), 면 \\(\\sigma=dq/dA\\), 부피 \\(\\rho\\). 답에 어느 기호를 쓰는지 틀리면 감점이다.<\/p>", "sub": null}, {"t": "analogy", "html": "사탕 다섯 개는 하나씩 세면 되지만(Σ), 설탕 한 봉지는 \"1 g당 몇 알\" 같은 밀도로 다뤄야 한다(∫). 직선 도선은 설탕을 한 줄로 뿌린 것, 원판은 접시에 편 것."}, {"t": "talk", "html": "<p>이 여섯 가지가 22장의 목차 그대로다. 앞의 셋은 9/9, 뒤의 셋은 9/9~9/11에 하나씩 나온다.<\/p>", "sub": null}], "say": null}, {"id": "s4", "title": "쿨롱 법칙 — 1학기 만유인력과 같은 꼴", "steps": [{"t": "talk", "html": "<p>두 점전하 사이 힘은 1학기 13장 만유인력 \\(F=G\\dfrac{Mm}{r^2}\\)과 똑같은 <b>역제곱 법칙<\/b>이다. 질량 자리에 전하가 들어갈 뿐.<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 150\" width=\"560\" height=\"150\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"120\" cy=\"75\" r=\"18\" fill=\"#fff\"><\/circle><circle cx=\"120\" cy=\"75\" r=\"18\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"120\" y=\"80.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#E03131\">+<\/text><text x=\"120\" y=\"109\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">q₁<\/text><circle cx=\"440\" cy=\"75\" r=\"18\" fill=\"#fff\"><\/circle><circle cx=\"440\" cy=\"75\" r=\"18\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"440\" y=\"80.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#E03131\">+<\/text><text x=\"440\" y=\"109\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">q₂<\/text><line x1=\"138\" y1=\"75\" x2=\"422\" y2=\"75\" stroke=\"#8A97A6\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"><\/line><line x1=\"140\" y1=\"118\" x2=\"420\" y2=\"118\" stroke=\"#8A97A6\" stroke-width=\"1.2\"><\/line><line x1=\"140\" y1=\"114\" x2=\"140\" y2=\"122\" stroke=\"#8A97A6\" stroke-width=\"1.2\"><\/line><line x1=\"420\" y1=\"114\" x2=\"420\" y2=\"122\" stroke=\"#8A97A6\" stroke-width=\"1.2\"><\/line><text x=\"280.0\" y=\"134\" font-size=\"12\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r<\/text><line x1=\"100\" y1=\"75\" x2=\"40\" y2=\"75\" stroke=\"#2F9E44\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"><\/line><text x=\"70.0\" y=\"65.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\"><tspan font-weight=\"700\">F<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><line x1=\"460\" y1=\"75\" x2=\"520\" y2=\"75\" stroke=\"#2F9E44\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"><\/line><text x=\"490.0\" y=\"65.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F9E44\"><tspan font-weight=\"700\">F<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">→<\/tspan><\/text><text x=\"280\" y=\"40\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">같은 부호 → 밀어낸다 (척력) · 다른 부호 → 당긴다 (인력)<\/text><\/svg><figcaption>쿨롱 법칙: 힘은 두 전하 곱에 비례, 거리 제곱에 반비례. 만유인력과 똑같은 꼴(역제곱 법칙).<\/figcaption>"}, {"t": "formula", "html": "\\[\\vec F=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q_1q_2}{r^2}\\hat r,\\qquad \\frac{1}{4\\pi\\varepsilon_0}=k\\approx9\\times10^{9}\\ \\mathrm{N\\,m^2/C^2},\\quad \\varepsilon_0=8.854\\times10^{-12}\\ \\mathrm{C^2/N\\,m^2}\\]"}, {"t": "pitfall", "html": "고등학교에서는 \\(k\\)로 썼지만 이 수업에서는 <b>무조건 \\(\\dfrac{1}{4\\pi\\varepsilon_0}\\)<\/b>로 쓴다. 가우스 법칙(23장)에서 \\(\\varepsilon_0\\)가 그대로 나오기 때문에, 처음부터 이 꼴에 익숙해져야 한다."}, {"t": "talk", "html": "<p>誘電率의 誘는 <b>유혹할 유<\/b>. +극에서 −극으로 전기력선이 갈 때 매질이 그 진행을 얼마나 붙잡느냐를 나타낸다. 진공은 100% 통과시킨다 → 그 값이 \\(\\varepsilon_0\\), <b>가장 작은 유전율<\/b>. 종이가 끼면 90%, 나무·쇠면 더 적게 → \\(\\varepsilon\\)이 커진다 → 전기장이 작아진다.<\/p>", "sub": "ε₀ — 진공의 유전율, \"전기를 꼬시는 정도\""}, {"t": "why", "html": "\\(\\varepsilon_0\\)가 가장 작으니 그 역수인 \\(k\\)는 가장 크다 → <b>진공에서 전기력이 가장 세다<\/b>. 유전체를 넣으면 전기장이 줄어드는 25장 내용이 여기서 예고된다."}, {"t": "analogy", "html": "유전율은 창문에 친 <b>커튼의 두께<\/b>. 진공은 커튼이 없는 창(\\(\\varepsilon_0\\), 최소)이라 빛(전기력선)이 다 들어오고, 종이·나무·쇠는 커튼이 두꺼워질수록 덜 들어온다. 커튼이 없을 때 힘이 가장 세다."}, {"t": "say", "html": "\"소리의 매질은 공기다. 그럼 빛(전자기파)의 매질은?\" — 진공. 아무도 답을 못 해서 교수님이 한참 기다렸다."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(F=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q_1q_2}{r^2}\\) — \\(k\\) 대신 \\(1/4\\pi\\varepsilon_0\\) · \\(\\varepsilon_0=8.854\\times10^{-12}\\)(최소) · 같은 부호 척력, 다른 부호 인력"}], "say": null}, {"id": "s5", "title": "자기의 소스는 왜 전류인가 — 그리고 빛의 속도", "steps": [{"t": "talk", "html": "<p>전기에 \\(\\varepsilon_0\\)(유전율)가 있으면 자기에는 \\(\\mu_0=4\\pi\\times10^{-7}\\)(<b>투자율<\/b>)이 있다. N극에서 S극으로 자기력선이 갈 때 진공이 가장 적게 방해하는 값.<\/p>", "sub": null}, {"t": "fig", "html": "<svg class=\"fig-svg\" viewbox=\"0 0 560 160\" width=\"560\" height=\"160\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><rect x=\"60\" y=\"60\" width=\"160\" height=\"40\" rx=\"0\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"1.5\"><\/rect><text x=\"95\" y=\"86\" font-size=\"16\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">N<\/text><text x=\"185\" y=\"86\" font-size=\"16\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">S<\/text><line x1=\"140\" y1=\"50\" x2=\"140\" y2=\"110\" stroke=\"#E03131\" stroke-width=\"2\" stroke-dasharray=\"4 3\"><\/line><text x=\"140\" y=\"130\" font-size=\"13\" fill=\"#8A97A6\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">자르면?<\/text><line x1=\"240\" y1=\"80\" x2=\"290\" y2=\"80\" stroke=\"#1F2A44\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"><\/line><rect x=\"310\" y=\"60\" width=\"100\" height=\"40\" rx=\"0\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"1.5\"><\/rect><text x=\"335\" y=\"86\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">N<\/text><text x=\"385\" y=\"86\" font-size=\"14\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">S<\/text><rect x=\"430\" y=\"60\" width=\"100\" height=\"40\" rx=\"0\" fill=\"#F1F3F5\" stroke=\"#1F2A44\" stroke-width=\"1.5\"><\/rect><text x=\"455\" y=\"86\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">N<\/text><text x=\"505\" y=\"86\" font-size=\"14\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">S<\/text><text x=\"420\" y=\"130\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">또 N·S — 자하는 혼자 못 산다<\/text><\/svg><figcaption>자석은 아무리 잘라도 N·S가 붙어 나온다. 그래서 자기의 소스는 자하가 아니라 전류(I = dq/dt).<\/figcaption>"}, {"t": "why", "html": "자기의 알갱이(자하, monopole)는 N·S가 붙어서만 존재한다. 붙어 있으면 거리 \\(r=0\\) → 역제곱 법칙이 \\(1/0^2=\\infty\\)로 터진다. 그래서 자기에서는 자하 대신 <b>전류 \\(I=dq/dt\\)<\/b> [A = C/s]를 소스로 삼는다."}, {"t": "memo", "html": "<b>정전기학<\/b>(21~25장): 소스 = 전하 \\(q\\), 시간과 무관 · <b>동전기학<\/b>(26장~): 소스 = 전류 \\(I=dq/dt\\), 시간과 관련"}, {"t": "talk", "html": "<p>두 상수를 합치면 놀라운 것이 나온다:<\/p>", "sub": null}, {"t": "formula", "html": "\\[c=\\frac{1}{\\sqrt{\\varepsilon_0\\,\\mu_0}}\\approx3\\times10^{8}\\ \\mathrm{m/s}\\] \"가장 작은 값 두 개를 곱해 루트 씌우고 역수를 취했으니 가장 큰 값\" — 빛의 속도."}, {"t": "analogy", "html": "전기와 자기는 같은 동전의 양면이라, 두 상수만으로 빛이 얼마나 빨리 달리는지가 정해진다. 마지막 시간에 맥스웰 방정식에서 이 식을 직접 유도한다."}, {"t": "say", "html": "\"전기와 자기는 똑같다. 전기만 제대로 하면 자기는 저절로 된다.\" — 전하 \\(q\\) 자리에 전류 \\(I\\)만 바꿔 넣으면 자기 파트가 된다는 뜻."}], "say": null}, {"id": "s6", "title": "예제 — 슬라이드 01~05 (답은 슬라이드에 없어 아톰이 계산)", "steps": [{"t": "ex", "q": "01 · 구리 동전 1.0 g의 총 양전하량은?", "a": "<p>구리 원자 하나에 양성자 29개. 1 g은 \\(\\dfrac{1}{63.5}\\) mol \\(=9.5\\times10^{21}\\)개 원자 → 양성자 \\(2.7\\times10^{23}\\)개.<\/p><p>\\(q=ne=2.7\\times10^{23}\\times1.6\\times10^{-19}\\approx4.3\\times10^{4}\\) C. 동전 하나에 4만 쿨롱 — 전자가 같은 양만큼 있어 상쇄될 뿐이다.<\/p>"}, {"t": "ex", "q": "02 · 동일한 두 이온이 \\(7.0\\times10^{-10}\\) m 떨어져 \\(1.88\\times10^{-9}\\) N의 힘 → 각 이온의 전하는?", "a": "<p>같은 이온이라 전하가 같다(\\(q_1=q_2=q\\)): \\(F=k\\dfrac{q^2}{r^2}\\) → \\(q^2=\\dfrac{Fr^2}{k}=\\dfrac{1.88\\times10^{-9}\\times(7.0\\times10^{-10})^2}{8.99\\times10^9}=1.02\\times10^{-37}\\) → \\(q=3.2\\times10^{-19}\\) C \\(=2e\\). 즉 각 이온은 전자 2개를 잃거나 얻었다(부호가 같으니 척력).<\/p><p>핵심: 답이 나오면 <b>\\(e\\)로 나눠 개수로<\/b> 바꿔 본다. 정수가 안 나오면 계산이 틀린 것.<\/p>"}, {"t": "ex", "q": "03 · 핵 속 두 양성자 사이 반발력(거리 \\(4\\times10^{-15}\\) m)", "a": "<p>\\(F=9\\times10^9\\times\\dfrac{(1.6\\times10^{-19})^2}{(4\\times10^{-15})^2}\\approx14\\) N. 원자핵 크기에서 14 N은 어마어마한 힘 — 그런데도 핵이 안 터지는 이유는 더 센 핵력이 있기 때문.<\/p>"}, {"t": "ex", "q": "04 · 세 전하가 120° 간격 — \\(q_1\\)에 작용하는 알짜 힘", "a": "<figure class=\"fig\"><svg class=\"fig-svg\" viewbox=\"0 0 560 250\" width=\"560\" height=\"250\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><circle cx=\"280\" cy=\"70\" r=\"16\" fill=\"#fff\"><\/circle><circle cx=\"280\" cy=\"70\" r=\"16\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"280\" y=\"75.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#E03131\">+<\/text><text x=\"280\" y=\"102\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">q₁<\/text><circle cx=\"170\" cy=\"180\" r=\"16\" fill=\"#fff\"><\/circle><circle cx=\"170\" cy=\"180\" r=\"16\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"170\" y=\"185.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#E03131\">+<\/text><text x=\"170\" y=\"212\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">q₂<\/text><circle cx=\"390\" cy=\"180\" r=\"16\" fill=\"#fff\"><\/circle><circle cx=\"390\" cy=\"180\" r=\"16\" fill=\"#E03131\" fill-opacity=\".15\" stroke=\"#E03131\" stroke-width=\"2\"><\/circle><text x=\"390\" y=\"185.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#E03131\">+<\/text><text x=\"390\" y=\"212\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1F2A44\">q₃<\/text><line x1=\"266\" y1=\"84\" x2=\"184\" y2=\"166\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><line x1=\"294\" y1=\"84\" x2=\"376\" y2=\"166\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><line x1=\"190\" y1=\"180\" x2=\"370\" y2=\"180\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\/line><line x1=\"290\" y1=\"58\" x2=\"345\" y2=\"38\" stroke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><text x=\"352\" y=\"44\" font-size=\"12\" fill=\"#2F9E44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">F₃ (q₃가 밀어냄)<\/text><line x1=\"270\" y1=\"58\" x2=\"215\" y2=\"38\" stroke=\"#2F9E44\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"><\/line><text x=\"200\" y=\"32\" font-size=\"12\" fill=\"#2F9E44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">F₂ (q₂가 밀어냄)<\/text><line x1=\"280\" y1=\"52\" x2=\"280\" y2=\"14\" stroke=\"#F59F00\" stroke-width=\"2.6\" marker-end=\"url(#ah)\" stroke-dasharray=\"5 4\"><\/line><text x=\"296\" y=\"12\" font-size=\"12\" fill=\"#B26A00\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">합력 = 성분 합 (위쪽)<\/text><text x=\"280\" y=\"236\" font-size=\"12.5\" fill=\"#1F2A44\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">크기를 더하지 말고 x·y 성분으로 나눠 더한다 → 좌우는 상쇄, 위쪽만 남는다<\/text><\/svg><figcaption>예제 04 배치의 예(세 전하가 120° 간격, 전부 같은 부호일 때): \\(q_1\\)이 받는 두 힘은 좌우 성분이 지워지고 위쪽 성분만 더해진다.<\/figcaption><\/figure><p>각 힘을 \\(\\hat i,\\hat j\\) 성분으로 나눠 더한다. 슬라이드 수치로 \\(\\approx2.6\\) N. 방법이 중요: <b>크기를 더하지 말고 성분을 더한다<\/b>.<\/p>"}, {"t": "ex", "q": "05 · 수소 원자에서 전기력 ÷ 중력", "a": "<p>\\(\\dfrac{F_e}{F_g}=\\dfrac{ke^2}{Gm_em_p}\\) — 거리는 약분된다. \\(=\\dfrac{9\\times10^9\\times(1.6\\times10^{-19})^2}{6.67\\times10^{-11}\\times9.11\\times10^{-31}\\times1.67\\times10^{-27}}\\approx2.3\\times10^{39}\\). 원자 세계에서 중력은 완전히 무시한다.<\/p>"}, {"t": "analogy", "html": "예제 다섯 개는 전부 \"단위 환산 + 개수 세기\"다. 답이 쿨롱으로 나오면 반드시 \\(e\\)로 나눠 \"전자 몇 개\"로 바꿔 본다 — 돈을 원 단위로 받았으면 지폐 몇 장인지 세어 보는 습관."}, {"t": "memo", "html": "<b>외울 것<\/b> \\(e=1.6\\times10^{-19}\\) C · \\(k=9\\times10^9\\) · 1 C = \\(6\\times10^{18}\\) e · 힘은 <b>성분으로<\/b> 더한다 · mm·μC 같은 접두어는 계산 전에 SI로"}, {"t": "memo", "html": "강의노트 p.8~9 <b>필수문제 1~6<\/b>(답 있음)이 이 회차의 연습이다. 1번(점전하군 합력 \\(k(\\tfrac{15}{4}\\hat i+\\tfrac{80}{9}\\hat j)\\))은 9/9 노트에서 푼다."}], "say": null}], "quiz": [{"id": "q1", "qn": "확인 1 · 전하의 양자화", "html": "어떤 물체의 알짜 전하가 \\(-3.2\\times10^{-19}\\) C이다. 이 물체는?", "choices": [{"html": "전자 2개가 남는다(잉여)", "ok": true}, {"html": "전자 2개가 부족하다", "ok": false}, {"html": "전자 1개가 남는다", "ok": false}, {"html": "전자 20개가 남는다", "ok": false}], "ans": "\\(q=ne\\) → \\(n=3.2/1.6=2\\). 음전하이므로 전자가 <b>남는<\/b> 것."}, {"id": "q2", "qn": "확인 2 · 전기장의 정의", "html": "어떤 점의 전기장 \\(\\vec E\\)란?", "choices": [{"html": "그 점에 놓인 <b>+1 C 시험전하<\/b>가 받는 전기력", "ok": true}, {"html": "그 점에 놓인 −1 C 시험전하가 받는 전기력", "ok": false}, {"html": "그 점을 지나는 전기력선의 총 개수", "ok": false}, {"html": "그 점에 전하를 놓는 데 필요한 에너지", "ok": false}], "ans": "\\(\\vec E=\\vec F/q_0\\), 기준은 양의 시험전하. 방향 = 양전하가 받는 힘의 방향."}, {"id": "q3", "qn": "확인 3 · 쿨롱 힘", "html": "\\(+1\\,\\mu\\)C 점전하 두 개가 1 m 떨어져 있다. 서로에게 작용하는 힘은?", "choices": [{"html": "\\(9\\times10^{-3}\\) N, 척력", "ok": true}, {"html": "\\(9\\times10^{-9}\\) N, 척력", "ok": false}, {"html": "\\(9\\times10^{3}\\) N, 인력", "ok": false}, {"html": "\\(9\\times10^{-3}\\) N, 인력", "ok": false}], "ans": "\\(F=9\\times10^9\\times\\dfrac{(10^{-6})^2}{1^2}=9\\times10^{-3}\\) N. 같은 부호 → 척력."}, {"id": "q4", "qn": "확인 4 · 유전율", "html": "진공의 유전율 \\(\\varepsilon_0\\)가 모든 매질 중 <b>가장 작은<\/b> 것의 뜻은?", "choices": [{"html": "진공에서 전기력선이 가장 잘 통과해 전기력이 가장 세다", "ok": true}, {"html": "진공에서는 전기력이 가장 약하다", "ok": false}, {"html": "진공에서는 전기장이 생기지 않는다", "ok": false}, {"html": "유전율은 힘과 관계없다", "ok": false}], "ans": "\\(k=1/4\\pi\\varepsilon_0\\)라 \\(\\varepsilon_0\\)가 작을수록 \\(k\\)가 크다. 매질(종이·나무)이 끼면 \\(\\varepsilon\\)이 커져 전기장이 준다(25장 유전체)."}, {"id": "q5", "qn": "확인 5 · 밀도 기호", "html": "전하 밀도 기호의 짝이 맞는 것은?", "choices": [{"html": "선 \\(\\lambda\\) · 면 \\(\\sigma\\) · 부피 \\(\\rho\\)", "ok": true}, {"html": "선 \\(\\sigma\\) · 면 \\(\\lambda\\) · 부피 \\(\\rho\\)", "ok": false}, {"html": "선 \\(\\rho\\) · 면 \\(\\sigma\\) · 부피 \\(\\lambda\\)", "ok": false}, {"html": "선 \\(\\lambda\\) · 면 \\(\\rho\\) · 부피 \\(\\sigma\\)", "ok": false}], "ans": "직선·고리는 \\(\\lambda=dq/ds\\), 원판·평면은 \\(\\sigma=dq/dA\\), 부도체구는 \\(\\rho\\). 답에 기호를 바꿔 쓰면 감점."}, {"id": "q6", "qn": "확인 6 · 자기의 소스", "html": "자기 현상의 소스를 자하(N·S 홀극)가 아니라 전류로 삼는 이유를 한 줄로 쓰라.", "choices": null, "ans": "자하는 N·S가 항상 붙어 있어 분리되지 않는다 → 거리 0 → 역제곱 법칙이 무한대로 터진다. 그래서 역제곱을 만족하는 <b>전류 \\(I=dq/dt\\)<\/b>를 소스로 쓴다."}], "v": 1, "ver": ""};

/* ---------- 저장 위치: 정수·범위 정리 + v2 는 고정 id·버전 (오타 v55 1 · 설계 2차 5) ----------
   규칙: v2 — ver 불일치 → 그 챕터 처음(cid 없으면 목차) · sid 없음 → 챕터 처음 · v1 저장값(ci/si) 은 범위 안이면 그대로 · qi 는 항상 범위로 · fs 는 저장하지 않고 단계에서 다시 계산 */
const toInt=v=>Number.isInteger(v)?v:((typeof v==="string"&&/^-?\d+$/.test(v))?parseInt(v,10):NaN);   /* "1junk" 같은 값은 숫자로 안 본다 */
function posOf(){ const p=(L.pos&&typeof L.pos==="object")?L.pos:{}; const mode=(p.mode==="quiz"||p.mode==="step"||p.mode==="result")?p.mode:"step";
  let qi=toInt(p.qi); if(!Number.isInteger(qi)||qi<0||qi>=QZ.length) qi=0;
  let ci=-1, si=0, note="";
  if(V2){ const v2save=("ver" in p)||("cid" in p)||("sid" in p);   /* v2 저장값(손상 포함)과 구버전(v1: ci/si 만) 저장값을 구분 */
    if(v2save){ if(typeof p.cid==="string") ci=CH.findIndex(c=>c.id===p.cid);
      if(ci<0) return {mode:mode==="quiz"?"quiz":"intro",ci:0,si:0,qi:qi,note:"챕터 못 찾음"};
      if(String(p.ver||"")!==VER){ si=0; note="판서가 바뀌어 챕터 처음부터"; }
      else if(typeof p.sid==="string"){ si=CH[ci].steps.findIndex(s=>s.id===p.sid); if(si<0){ si=0; note="단계 못 찾음"; } }
      else { si=0; note="단계 못 찾음"; } }
    else { const c2=toInt(p.ci); if(!Number.isInteger(c2)||c2<0||c2>=CH.length) return {mode:mode==="quiz"?"quiz":"intro",ci:0,si:0,qi:qi,note:"구버전 저장값"};
      ci=c2; si=0; note="구버전 저장값이라 챕터 처음부터"; } }
  else { ci=toInt(p.ci); if(!Number.isInteger(ci)||ci<0||ci>=CH.length) ci=0;
    const n=(CH[ci]||{steps:[]}).steps.length; si=toInt(p.si); if(!Number.isInteger(si)||si<0) si=0; else if(si>=n) si=Math.max(0,n-1); }
  return {mode:mode,ci:ci,si:si,qi:qi,note:note}; }
/* 저장 위치로 화면을 옮긴다 — #resume 해시와 목차의 「이어서 하기」가 같은 함수를 쓴다(오타 R4). 문제 위치는 저장한 qi 그대로(범위는 posOf 가 정리), 전부 채점됐으면 결과 */
function resumeTo(p){ cancelAll(); S=Object.assign(S,{mode:p.mode,ci:p.ci,si:p.si,qi:p.qi,rev:false,again:0,resume:true,pre:"",preFace:""});
  if(S.mode==="quiz"){ if(!QZ.length) S.mode="result"; else if(QZ.every(q=>typeof ST.correct[q.id]==="boolean")) S.mode="result"; }
  if(S.mode==="step"&&!CH.length) S.mode="intro";
  if(S.mode==="intro"||S.mode==="result") S.resume=false;
  render(); if(p.note) $("#dTip").textContent=p.note; }

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
function pick(pool,seed,vars){ const arr=LINES[pool]||[]; if(!arr.length) return ""; const t=arr[hash(D.id+"|"+pool+"|"+seed)%arr.length]; return t.replace(/\{(\w+)\}/g,(m,k)=>(vars&&k in vars)?vars[k]:m); }

/* ---------- 애니메이션 예약 관리: 타이머·RAF·전환 콜백을 한 곳에서 취소 (설계 2차 4) ---------- */
const pend={t:[],raf:[],tr:[]}; let anim=null;   /* anim = {phase, finish} 진행 중 단계 */
/* 실행된 예약은 목록에서 빼서 pending 이 실제 미실행 수가 되게 한다(오타 구현 검수 1차) */
function later(fn,ms){ const id=setTimeout(()=>{ const k=pend.t.indexOf(id); if(k>=0) pend.t.splice(k,1); fn(); },ms); pend.t.push(id); return id; }
function raf(fn){ const id=requestAnimationFrame(()=>{ const k=pend.raf.indexOf(id); if(k>=0) pend.raf.splice(k,1); fn(); }); pend.raf.push(id); return id; }
/* fn(real): real=true 는 실제 transitionend, false 는 예비 타임아웃(탭이 숨겨져 RAF·전환이 멈춘 경우) */
function onEnd(el,dur,fn){ let done=false; const ent={el:el,fn:null}; const go=real=>{ if(done) return; done=true; el.removeEventListener("transitionend",ent.fn); const k=pend.tr.indexOf(ent); if(k>=0) pend.tr.splice(k,1); fn(real); }; ent.fn=e=>{ if(e.target===el) go(true); }; el.addEventListener("transitionend",ent.fn); pend.tr.push(ent); later(()=>go(false),dur+80); }
function cancelAll(){ pend.t.forEach(clearTimeout); pend.t=[]; pend.raf.forEach(id=>cancelAnimationFrame(id)); pend.raf=[]; pend.tr.forEach(x=>x.el.removeEventListener("transitionend",x.fn)); pend.tr=[]; if(typing){ clearInterval(typing); typing=null; } anim=null; }
function finishNow(){ const a=anim; if(typing){ clearInterval(typing); typing=null; $("#dText").textContent=fullText; typeDone=null; } cancelAll(); if(a&&a.finish) a.finish(); }

let typing=null, fullText="", typeDone=null, TYPE_MS=22;   /* TYPE_MS 는 검사기가 빠르게 돌릴 때 줄인다(__cr.speed) */

  board('<div class="res"><div class="big">'+(ung.length?"채점이 남았습니다":good?"수고했습니다":mid?"절반은 넘겼습니다":"다시 합니다")+'</div><div class="stats"><div><b>'+ok+'/'+n+'</b><span>정답</span></div><div><b>+'+(L.xp||0)+'</b><span>이 회차 XP</span></div><div><b>'+T.streak+'</b><span>연속일</span></div><div><b>'+T.aff+'</b><span>호감도 · '+affName()+'</span></div></div>'+badge+(ung.length?'<div class="wrong">채점 전 '+ung.length+'개 — 답 보기 뒤 「맞았어요/틀렸어요」까지 눌러야 완료입니다.</div>':'')+(wrong.length?'<div class="wrong">틀린 문제 '+wrong.length+'개 — 해설을 읽고 다시 푸세요.</div>':'')+'</div>','<span>오늘의 결과</span>',true);
  { const [rl,rf]=preLine(ung.length?"채점을 안 한 문제가 있습니다. 봐주지 말고 스스로 채점하세요. 그래야 끝난 겁니다.":pick(good?"res_good":mid?"res_mid":"res_bad","r",{ok:ok,n:n}), ung.length?"sharp":good?"proud":mid?"sharp":"angry"); say(rl,rf); }
  const cs=[];
  if(ung.length) cs.push({t:"채점 안 한 문제 ("+ung.length+")",cls:"p",primary:1,key:"Enter",f:()=>{ S.mode="quiz"; S.qi=QZ.indexOf(ung[0]); render(); }});
  if(wrong.length) cs.push({t:"틀린 문제 다시 ("+wrong.length+")",cls:ung.length?"g":"p",primary:ung.length?0:1,key:ung.length?"":"Enter",f:()=>{ wrong.forEach(q=>{ delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; }); save(); S.mode="quiz"; S.qi=QZ.findIndex(q=>!ST.done[q.id]); render(); }});
  cs.push({t:"교재 보기",cls:"g",f:()=>openBook(null)}); cs.push({t:"목차",cls:"g",f:openToc});
  if(EMB) cs.push({t:"앱으로",cls:wrong.length?"g":"p",primary:wrong.length?0:1,f:()=>post({type:"mc-close",v:1})});
  choices(cs);
}
/* ---------- 목차 · 교재 · 질문 ---------- */
function openToc(){ const ov=$("#ov"); $("#ovMeta").textContent=D.course+" · "+D.sess+" · XP "+(L.xp||0)+(V2?" · 판서 v2":" · 구버전 판서");
  $("#ovList").innerHTML=CH.map((c,i)=>'<li class="'+(L.ch[c.id]?"done":"")+(S.mode==="step"&&S.ci===i?" cur":"")+'"><button type="button" data-ci="'+i+'"><span class="st">'+(L.ch[c.id]?"✓":i+1)+'</span><span>'+esc(c.title)+'</span><small>'+c.steps.length+'단계</small></button></li>').join("")
    +(QZ.length?'<li class="'+(QZ.every(q=>ST.done[q.id])?"done":"")+(S.mode==="quiz"?" cur":"")+'"><button type="button" data-q="1"><span class="st">?</span><span>확인 문제</span><small>'+QZ.filter(q=>ST.done[q.id]).length+'/'+QZ.length+'</small></button></li>':"");
  $$("#ovList [data-ci]").forEach(b=>{ b.onclick=()=>{ ov.classList.remove("on"); cancelAll(); S=Object.assign(S,{mode:"step",ci:+b.dataset.ci,si:0,rev:false,again:0,resume:false}); render(); }; });
  const qb=$("#ovList [data-q]"); if(qb) qb.onclick=()=>{ ov.classList.remove("on"); cancelAll(); if(T.hearts<=0&&QZ.some(q=>!ST.done[q.id])){ S.mode="nohearts"; return render(); } S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; render(); };
  ov.classList.add("on"); }
$("#hToc").onclick=openToc; $("#ovClose").onclick=()=>$("#ov").classList.remove("on"); $("#ov").onclick=e=>{ if(e.target.id==="ov") $("#ov").classList.remove("on"); };
$("#ovBook").onclick=()=>openBook(S.mode==="step"?(CH[S.ci]||{}).id:null);
/* 학습 기록(챕터·문제)과 보상 기록(L.rew·L.xp)을 분리 — 초기화해도 같은 챕터·문제로 XP 를 다시 받지 않는다(오타 R5) */
$("#ovReset").onclick=()=>{ if(!confirm("이 회차의 챕터·문제 기록을 지울까요? (XP·연속일과 이미 받은 보상은 그대로 — 같은 챕터·문제로 XP 를 다시 받지는 않습니다)")) return; cancelAll(); L={pos:null,ch:{},done:false,xp:L.xp||0,rew:(L.rew&&typeof L.rew==="object")?L.rew:{}}; ST={read:{},done:{},correct:{},answer:{},ts:0}; S=Object.assign(S,{mode:"intro",ci:0,si:0,qi:0,rev:false,again:0,resume:false,pre:"",preFace:""}); $("#ov").classList.remove("on"); render(); };
function post(m){ try{ window.parent.postMessage(m,location.origin); }catch(e){} }
function openBook(sid){ const hash=sid?"#s="+sid:""; if(EMB){ post({type:"mc-open",v:1,file:LESSON_APP+hash,title:document.title}); } else location.href=LESSON_REL+hash; }
function ask(){ if(anim||typing) finishNow();   /* 질문 대사가 진행 중인 단계의 완료 콜백을 지우지 않게 먼저 즉시 완료(오타 R2) */
  if(EMB){ post({type:"mc-ask",v:1}); say(pick("ask",S.ci+":"+S.si),"wide"); gainAff(1); save(); hud(); } else say(pick("askoff",S.ci),"sharp"); }
/* ---------- 앱 질문 패널 문맥 (V45 규약) ---------- */
let CTX_GEN=null;
function ctx(){ if(!CTX_GEN||!EMB) return; let label="", q=null, sid="";
  if(S.mode==="step"){ const ch=CH[S.ci]||{}, st=(ch.steps||[])[S.si]||{}; sid=ch.id||""; label="CH "+(S.ci+1)+" · "+(ch.title||""); const tmp=document.createElement("div"); tmp.innerHTML= st.t==="v2"? ((st.b||[]).map(l=>l.h).join(" ")+" "+(st.s||"")) : (st.t==="ex"?(st.q+" "+(S.rev?st.a:"")):(st.html||"")); q={qn:(ch.title||"").slice(0,80),kind:"개념",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }

    q={qn:qq.qn,kind:"문제",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:(qq.choices||[]).map(c=>tc(c.html)),my:(ST.answer[qq.id]==null?null:String(ST.answer[qq.id])),revealed:!!ST.done[qq.id],correct:(typeof ST.correct[qq.id]==="boolean"?ST.correct[qq.id]:null),answer:null}; } }
  else label=S.mode;
  post({type:"mc-slide",v:1,gen:CTX_GEN,deck:D.id,title:document.title.slice(0,80),sid:sid,stype:S.mode==="quiz"?"quiz":"concept",part:null,partTitle:document.title.slice(0,60),label:("교실 · "+label).slice(0,80),q:q}); }
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; ctx(); } });
const _render=render; render=function(){ _render(); ctx(); };
/* ---------- 키보드 ---------- */
document.addEventListener("keydown",e=>{ if(e.target&&/TEXTAREA|INPUT/.test(e.target.tagName)) return; if($("#ov").classList.contains("on")){ if(e.key==="Escape") $("#ov").classList.remove("on"); return; }
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); if(e.repeat) return; enter(); }
  else if(/^[1-6]$/.test(e.key)&&S.mode==="quiz"){ const b=$$("#bc .cb")[+e.key-1]; if(b&&!b.disabled) b.click(); } });
/* ---------- 시작 ---------- */
/* 해시: #resume(저장 위치) · #ch=N(챕터 N) · #ch=N.M(챕터 N 의 M 단계) · #quiz · #result */
function boot(){ const m=/^#(resume|ch=(\d+)(?:\.(\d+))?|quiz|result)$/.exec(location.hash||"");
  if(m&&m[1]==="resume"&&L.pos&&!L.done){ return resumeTo(posOf()); }
  else if(m&&m[2]){ const ci=Math.max(0,Math.min(CH.length-1,+m[2]-1)); const si=m[3]?Math.max(0,Math.min(CH[ci].steps.length-1,+m[3]-1)):0; S=Object.assign(S,{mode:"step",ci:ci,si:si,rev:(CH[ci].steps[si]||{}).t==="ex"&&/\.\d+r$/.test(location.hash),resume:!!m[3]}); }
  else if(m&&m[1]==="quiz"&&QZ.length){ S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; }
  else if(m&&m[1]==="result"){ S.mode="result"; }
  render(); }
