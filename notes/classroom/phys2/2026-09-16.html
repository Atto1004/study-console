<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>23장 가우스 법칙 — 가우스면 3종 · 도체구 · 부도체구</title>
<!-- 교실 모드 템플릿 v2 (대표님 2026-09-27 확정: 듀오링고×애플 융합 · 판서는 짧게(Gaegu) + 말풍선은 일타강사 구어체 · 그림은 분필 · 단계 애니메이션 · 글꼴 Gowun Dodum/Gothic A1/Inter)
     v2 회차(D.v===2)는 판서 파일(BOARD)로 만든 단계(판서 줄 누적 + 그림 단계 + 대사), v1 회차는 원문 문단 그대로(「구버전 판서」 표시).
     저장: mc-tutor(전역 XP·연속일·하트·호감도 + 회차 위치 {mode,cid,sid,qi,ver}) + mc-lesson-<id>(챕터 읽음·문제, 수업 노트·앱 V52 와 공유). 오타 설계 회의 1·2차 조건 반영. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Gothic+A1:wght@700;800&family=Inter:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
:root{--bg:#F5F5F7;--card:rgba(255,255,255,.86);--line:rgba(0,0,0,.08);--ink:#1D1D1F;--ink-2:#6E6E73;--ink-3:#8E8E93;--green:#1B7A2E;--green-soft:#E8F7EA;--blue:#0A84FF;--amber:#B25E00;--red:#D42020;
  --board:#2F5D4B;--wood:#7A4E2B;--chalk:#F4F1E8;--chalk-2:rgba(244,241,232,.72);--yel:#FFE27A;--pink:#FFA3C7;--sky:#9ADCFF;--mint:#B8F2D0;
  --fb:"Gowun Dodum","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fh:"Gothic A1","Gowun Dodum",sans-serif;--fn:Inter,"Gothic A1",sans-serif;--fk:Gaegu,"Gowun Dodum",sans-serif;--hud:56px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:var(--fb);font-size:16px;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:9;height:var(--hud);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
#hud .in{max-width:1040px;margin:0 auto;height:100%;padding:0 20px;display:flex;align-items:center;gap:14px}
#hud .hl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#hud .hl b{font-family:var(--fh);font-weight:800;font-size:14px;white-space:nowrap}
#hud .hl span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hc{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#hud .chp{font-family:var(--fn);font-weight:700;font-size:12px;color:var(--ink-2);white-space:nowrap}
#hud .seg{display:flex;gap:4px;flex:1;max-width:280px}#hud .seg i{display:block;flex:1;height:6px;border-radius:3px;background:#E5E5EA}#hud .seg i.on{background:var(--green)}#hud .seg i.cur{background:var(--blue)}
#hud .hr{display:flex;align-items:center;gap:8px}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--fn);font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:999px;position:relative;white-space:nowrap}
.stat svg{width:15px;height:15px;display:block}
.stat.xp{background:#FFF8DC;color:#8A5A00}.stat.sk{background:#FFF0E6;color:#C2410C}.stat.hp{background:#FFECEC;color:#C92A2A;gap:3px}.stat.af{background:#F7E4EE;color:#B8286A}
.stat .gauge{display:inline-block;width:52px;height:8px;border-radius:99px;background:#F0D0DF;overflow:hidden}.stat .gauge b{display:block;height:100%;width:0;background:#B8286A;transition:width .4s}
.pop{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);font-size:13px;font-weight:900;color:#1F7A32;pointer-events:none;opacity:0;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:#C92A2A}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#hToc{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:7px 12px;border-radius:12px;cursor:pointer}
/* ---------- 교실 ---------- */
main{max-width:1040px;margin:0 auto;padding:16px 20px 24px}
#room{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:16px;align-items:start}
#board{position:relative}
.frame{padding:12px;border-radius:14px;background:linear-gradient(180deg,#8B5A2B,#6E4321);box-shadow:0 14px 34px rgba(60,40,20,.2),inset 0 2px 0 rgba(255,255,255,.18);position:relative}
.green{position:relative;border-radius:6px;min-height:560px;max-height:max(560px,70vh);display:flex;flex-direction:column;background:radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.06),transparent 42%),repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),linear-gradient(160deg,#366B57,#2A5847 55%,#254E3F);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 90px rgba(0,0,0,.28);overflow:hidden}
/* 칠판 머리표(챕터·단계): 스크롤 칸(#bwrap) 밖, 칠판 위쪽 고정 띠 — 판서가 어디까지 스크롤돼도 글자가 머리표 밑으로 지나가지 않는다(대표님 2026-09-27 「글자 겹쳤다」: sticky 반투명 띠 밑으로 식 윗부분이 비쳤음) */
.chk{flex:0 0 auto;padding:12px 30px 8px;font-family:var(--fk);font-weight:700;font-size:20px;line-height:1.3;color:var(--yel);border-bottom:1px dashed rgba(244,241,232,.22);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk small{font-family:var(--fn);font-size:11px;font-weight:700;color:var(--chalk-2);margin-left:8px;letter-spacing:.04em;vertical-align:middle}
.chk .old{font-family:var(--fb);font-size:11px;color:var(--pink);margin-left:8px;vertical-align:middle;border:1px dashed var(--pink);border-radius:6px;padding:1px 6px}
#bwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 30px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column}
#bwrap::-webkit-scrollbar{width:8px}#bwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}
#bc{color:var(--chalk);font-family:var(--fk);font-weight:700;font-size:24px;line-height:1.5;width:100%;margin:auto 0}
#bc.v1{font-family:var(--fb);font-weight:400;font-size:18px;line-height:1.75}
#bc .katex{color:var(--sky)}#bc .katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* v2 판서 줄 */
.bd-title{font-size:30px;color:var(--yel);margin:0 0 10px;line-height:1.2;text-decoration:underline wavy rgba(255,226,122,.55) 2px;text-underline-offset:6px}
.bl{margin:0 0 8px;padding-left:34px;position:relative;clip-path:inset(0 100% 0 0);transition:clip-path .45s ease-out}
.bl.on{clip-path:inset(0 0 0 0)}.bl.now{clip-path:inset(0 0 0 0);transition:none}
.bl::before{position:absolute;left:4px;top:0;font-size:1em}
.bl.k-li::before{content:"•"}.bl.k-h{padding-left:0;font-size:28px;color:var(--yel);margin-top:6px}.bl.k-h::before{content:""}
.bl.k-f{padding-left:0;text-align:center;font-size:24px}.bl.k-f::before{content:""}.bl.k-f .katex-display{margin:6px 0}.bl.k-f .katex{font-size:1.2em}
.bl.k-pit{color:var(--pink);border:2px dashed rgba(255,163,199,.6);border-radius:10px;padding:6px 12px 6px 38px;margin:6px 0 10px}.bl.k-pit::before{content:"!";left:14px;top:6px;color:var(--pink)}
.bl.k-star{color:var(--yel)}.bl.k-star::before{content:"☆";color:var(--yel)}
.bl.k-res{color:var(--yel)}.bl.k-res::before{content:"→";color:var(--yel)}
.bl.k-memo{border:2px solid rgba(244,241,232,.6);border-radius:10px;padding:6px 12px;margin:10px 0 6px;background:rgba(255,255,255,.05)}.bl.k-memo::before{content:""}
.bl .ul{text-decoration:underline wavy var(--yel) 2px;text-underline-offset:5px}
.bl .katex{color:var(--sky);font-size:.92em}
/* 그림(분필) */
.bd-fig{margin:14px auto 4px;max-width:640px;width:100%}
.bd-fig figure{margin:0}.bd-fig svg{width:100%;height:auto;display:block;overflow:visible}.bd-fig figcaption{display:none}
.bd-fig [data-step][hidden]{display:none}
.bd-fig .pre{opacity:0}   /* 이 단계에서 새로 나올 그림 단계는 그림 차례까지 가림 */
.bd-fig .ck{stroke-linecap:round;stroke-linejoin:round}
.bd-fig .draw{transition:stroke-dashoffset var(--dur,1s) ease-out}
.bd-fig .fade{opacity:0;transition:opacity .35s ease-out}.bd-fig .fade.on{opacity:1}
@media (prefers-reduced-motion: reduce){.bl{transition:none}.bd-fig .draw,.bd-fig .fade{transition:none}}
/* v1(구버전) 판서 상자 */
#bc .tk{font-size:19px}#bc p{margin:0 0 10px}#bc b,#bc strong{color:var(--yel);font-weight:800}
#bc .sub{font-family:var(--fk);font-size:26px;color:var(--sky);margin:0 0 6px;line-height:1.2}
#bc .bx{margin:6px 0 14px;padding:12px 16px 10px;border:2px dashed rgba(245,242,233,.55);border-radius:10px;position:relative}
#bc .bx>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px}
#bc .bx.why{border-color:rgba(154,220,255,.6)}#bc .bx.why>i{color:var(--sky)}#bc .bx.analogy{border-color:rgba(255,226,122,.6)}#bc .bx.analogy>i{color:var(--yel)}
#bc .bx.formula{border-style:solid;border-color:rgba(184,242,208,.75)}#bc .bx.formula>i{color:var(--mint)}#bc .bx.pitfall{border-color:rgba(255,163,199,.7)}#bc .bx.pitfall>i{color:var(--pink)}
#bc .bx.memo{border-color:rgba(245,242,233,.7)}#bc .bx.memo>i{color:var(--chalk)}#bc .bx.say{border:0;border-left:4px solid var(--pink);border-radius:0;padding:4px 16px;font-style:italic}#bc .bx.say>i{color:var(--pink);font-style:normal}
#bc .paper{background:#FFFDF7;color:#1F2A44;border-radius:6px;padding:12px 14px 8px;margin:8px auto 14px;max-width:560px;box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}
#bc .paper svg{max-width:100%;height:auto;display:block;margin:0 auto}#bc .paper figcaption,#bc .paper .cap{font-size:13.5px;color:#55627A;margin-top:6px}#bc .paper .katex{color:#1F2A44}
#bc .paper.photo img{max-width:100%;max-height:420px;object-fit:contain;border-radius:4px;background:#111}
#bc .ex .exq{border:2px solid rgba(245,242,233,.6);border-radius:10px;padding:12px 16px;margin-bottom:12px}#bc .ex .exq>i,#bc .ex .exa>i{display:block;font-style:normal;font-family:var(--fk);font-size:22px;line-height:1;margin-bottom:6px;color:var(--yel)}
#bc .ex .exa{padding:4px 6px 0 16px;border-left:3px solid var(--mint)}#bc .ex .exa>i{color:var(--mint)}#bc .ex .exhide{color:var(--chalk-2);font-style:italic;font-size:15px}
/* 문제 */
#bc .qz{font-family:var(--fb);font-weight:400;font-size:18px}
#bc .qz .qn{font-family:var(--fk);font-weight:700;font-size:26px;color:var(--yel);line-height:1.2;margin-bottom:8px}
#bc .qz .qb{margin-bottom:14px;font-size:19px}
#bc .qz ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#bc .qz .cb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px solid rgba(245,242,233,.5);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .1s,background .15s;line-height:1.5;min-height:52px}
#bc .qz .cb .n{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid rgba(245,242,233,.7);display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:15px}
#bc .qz .cb:hover:not([disabled]){background:rgba(255,255,255,.12)}#bc .qz .cb[disabled]{cursor:default;opacity:.75}
#bc .qz .cb.ok{border-color:#7ED957;background:rgba(88,204,2,.22);opacity:1}#bc .qz .cb.ok .n{background:#58CC02;border-color:#58CC02;color:#0B2E00}
#bc .qz .cb.bad{border-color:#FF6B6B;background:rgba(255,75,75,.2);opacity:1}#bc .qz .cb.bad .n{background:#FF4B4B;border-color:#FF4B4B;color:#fff}
#bc .qz textarea{width:100%;min-height:74px;font:inherit;color:var(--chalk);background:rgba(255,255,255,.06);border:2px dashed rgba(245,242,233,.55);border-radius:12px;padding:10px 14px;resize:vertical}
#bc .qz textarea::placeholder{color:rgba(245,242,233,.45)}#bc .qz .my{margin:8px 0;color:var(--chalk-2)}#bc .qz .my b{color:var(--chalk)}
#bc .qz .vd{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:99px;margin:10px 0 4px}
#bc .qz .vd.ok{background:#58CC02;color:#0B2E00}#bc .qz .vd.bad{background:#FF4B4B;color:#fff}#bc .qz .vd.wait{background:rgba(255,255,255,.18);color:var(--chalk)}
#bc .qz .ans{margin-top:10px;padding:12px 16px;border-left:3px solid var(--mint);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0}
#bc .qz .ans>i{display:block;font-style:normal;font-family:var(--fk);font-weight:700;font-size:22px;color:var(--mint);line-height:1;margin-bottom:6px}
#bc .qz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* 목차 · 결과 */
#bc .ttl{font-family:var(--fk);font-size:40px;line-height:1.15;color:var(--chalk);margin:0 0 6px}
#bc .lead{font-family:var(--fb);font-weight:400;color:var(--chalk-2);font-size:17px;margin:0 0 14px}
#bc .toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-family:var(--fb);font-weight:400;font-size:17px}
#bc .toc li{display:flex;align-items:center;gap:12px;padding:6px 4px;border-bottom:1px dashed rgba(245,242,233,.25)}
#bc .toc .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid rgba(245,242,233,.6);display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700}
#bc .toc li.done .st{background:#58CC02;border-color:#58CC02;color:#0B2E00}#bc .toc li.cur .st{border-color:var(--yel);color:var(--yel)}#bc .toc li.cur{color:var(--yel)}
#bc .toc small{margin-left:auto;font-size:12.5px;color:var(--chalk-2);white-space:nowrap;font-weight:700}
#bc .res{text-align:center;font-family:var(--fb);font-weight:400}#bc .res .big{font-family:var(--fk);font-weight:700;font-size:60px;line-height:1;color:var(--yel);margin:6px 0 10px}
#bc .res .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:17px;margin:6px 0 12px}#bc .res .stats b{display:block;font-family:var(--fn);font-size:32px;line-height:1.1}#bc .res .stats span{display:block;font-size:13px;color:var(--chalk-2);font-weight:700}
#bc .res .badge{margin:4px auto 0;width:130px;height:130px}#bc .res .bl2{font-size:13px;font-weight:700;color:var(--chalk-2);margin-top:4px}#bc .res .wrong{margin-top:8px;color:var(--pink);font-size:15px}
.tray{height:18px;margin:0 26px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6E4321,#4E2E14);box-shadow:0 8px 14px rgba(60,40,20,.25);position:relative}
.tray i{position:absolute;top:5px;height:7px;width:44px;border-radius:4px;background:var(--chalk)}.tray i.y{left:76px;background:var(--yel)}.tray i.p{left:132px;background:var(--pink)}.tray i.w{left:22px}.tray i.er{left:auto;right:26px;width:60px;height:11px;top:3px;border-radius:3px;background:#1E1E22}
#chpills{margin-top:12px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#chpills .lb{font-size:12px;color:var(--ink-2);font-weight:700;margin-right:4px}
.pill{border:1px solid var(--line);background:#F2F2F7;color:var(--ink-3);font-family:var(--fn);font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.pill.done{background:var(--green-soft);color:var(--green);border-color:transparent}.pill.cur{background:var(--green);color:#fff;border-color:var(--green)}
/* ---------- 오른쪽: 스앵님 · 말풍선 · 선택지 ---------- */
#side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--hud) + 16px)}
#tutorCard{padding:12px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
#tutorCard .nm{align-self:flex-start;display:flex;align-items:center;gap:8px;width:100%}
#tutorCard .nm b{font-family:var(--fh);font-weight:800;font-size:13px}#tutorCard .nm span{font-size:11px;color:var(--ink-3);margin-left:auto}
#tutor{width:150px;height:176px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.14));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#tutor svg{width:100%;height:100%;display:block;overflow:visible}
.box{padding:14px 16px 12px;position:relative;min-height:120px}
.box::before{content:"";position:absolute;left:50%;top:-9px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--line);border-top:0}
.name{font-family:var(--fh);font-weight:800;font-size:12px;color:var(--green);margin-bottom:4px}.name.prof{color:#7A2E52}
.text{font-size:15.5px;line-height:1.6;min-height:48px;cursor:pointer}
.text .cur{display:inline-block;width:.5em;height:1.05em;background:var(--ink);vertical-align:-.15em;margin-left:2px;animation:blinkc .8s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.tip{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.cbt{font:inherit;font-weight:700;font-size:14.5px;padding:11px 16px;border-radius:12px;cursor:pointer;color:var(--ink);background:#fff;border:1px solid var(--line);transition:transform .08s,filter .15s;width:100%;text-align:center;min-height:44px}
.cbt:hover{filter:brightness(.97)}.cbt:active{transform:translateY(1px)}
.cbt.p{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 10px rgba(27,122,46,.25)}
.cbt.t{background:var(--green-soft);color:var(--green);border-color:transparent}
.cbt.r{background:var(--red);color:#fff;border-color:var(--red)}
.cbt.g{background:#F2F2F7;color:var(--ink-2);border-color:transparent}
.cbt kbd{font-family:var(--fn);font-size:10.5px;opacity:.6;margin-left:6px}
#prog{padding:12px 14px}#prog .k{font-size:12px;color:var(--ink-2);font-weight:700}#prog .v{font-family:var(--fh);font-weight:800;font-size:15px;margin:2px 0 6px}#prog .bar{height:6px;border-radius:3px;background:#E5E5EA;overflow:hidden}#prog .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}#prog .h{font-size:11.5px;color:var(--ink-3);margin-top:6px}
/* ---------- 목차 오버레이 ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.5);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .pn{background:#fff;border-radius:20px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#ov h2{margin:0 0 4px;font-family:var(--fh);font-weight:800;font-size:20px}#ov .mt{font-size:13px;color:var(--ink-3);margin-bottom:12px}
#ov ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#ov li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#F7F7F7;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
#ov li button:hover{border-color:var(--blue)}#ov li .st{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #CFCFCF;display:grid;place-items:center;font-family:var(--fn);font-size:13px;font-weight:700;color:var(--ink-3)}
#ov li.done .st{background:var(--green);border-color:var(--green);color:#fff}#ov li.cur button{border-color:var(--amber);background:#FFF8DC}#ov li small{margin-left:auto;color:var(--ink-3);font-weight:700;white-space:nowrap}
#ov .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}#ov .row .cbt{width:auto}
/* ---------- 아이패드 세로(768~900): 두 칸은 유지하되 옆 칸을 줄이고 판서 글자를 한 단계 낮춘다 ---------- */
@media(max-width:900px) and (min-width:761px){
  #room{grid-template-columns:minmax(0,1fr) 240px;gap:12px}#tutor{width:120px;height:140px}
  #bc{font-size:21px}.bl.k-h{font-size:25px}.bd-title{font-size:26px}.bl.k-f{font-size:22px}.bl.k-f .katex{font-size:1.05em}.chk{font-size:18px;padding:10px 22px 6px}#bwrap{padding:10px 22px 22px}
  .cbt{font-size:14px;padding:10px 12px}.text{font-size:14.5px}
}
/* ---------- 폰 ---------- */
@media(max-width:760px){
  :root{--hud:50px}
  #hud .in{gap:6px;padding:0 8px}#hud .hl{display:none}#hud .hc{flex:1 1 auto;min-width:70px;gap:6px}#hud .chp{font-size:11px}#hud .hr{gap:4px;flex:0 0 auto}.stat{padding:3px 6px;font-size:11.5px;gap:3px}.stat svg{width:13px;height:13px}.stat .gauge{width:30px;height:7px}#hToc{padding:5px 8px;font-size:12px}
  main{padding:10px 8px 12px}#room{grid-template-columns:minmax(0,1fr);gap:10px}#board,#side{min-width:0}
  .frame{padding:8px;border-radius:10px}.green{min-height:340px;max-height:max(340px,56vh)}#bwrap{padding:8px 14px 18px}.chk{padding:8px 14px 6px;font-size:17px}
  #bc{font-size:19px}.bl.k-h{font-size:23px}.bd-title{font-size:24px}#bc.v1{font-size:16.5px}#bc .ttl{font-size:32px}#bc .res .big{font-size:44px}
  #bc .paper{overflow-x:auto}#bc .paper svg{min-width:460px}.bd-fig{overflow-x:auto}.bd-fig svg{min-width:420px}.bl.k-f .katex{font-size:1em}.bl.k-f{font-size:21px}
  #side{position:static;flex-direction:column}#tutorCard{flex-direction:row;align-items:flex-end;gap:10px;padding:8px 10px}#tutorCard .nm{width:auto;flex-direction:column;align-items:flex-start;gap:0}#tutor{width:84px;height:98px}
  .box::before{display:none}.text{font-size:15px}.cbt{font-size:14px;min-height:42px}.tip{display:none}#prog{display:none}#chpills{display:none}
}

const D={"id": "phys2-2026-09-16", "slug": "phys2", "course": "일반물리학2", "date": "2026-09-16", "sess": "9/16(수) · 3주차", "title": "23장 가우스 법칙 — 가우스면 3종 · 도체구 · 부도체구", "lead": "지난 시간 축구공 비유로 세운 식 \\(\\oint\\vec E\\cdot\\hat n\\,dA=q_{enc}/\\varepsilon_0\\)을 실제로 써 본다. 앞부분(3종 재유도)은 \"교과서\", 뒷부분(도체구·부도체구)은 \"응용\" — 교수님은 <b>시험은 응용에서 나온다<\/b>고 못 박았다.", "minutes": 18, "chapters": [{"id": "s1", "title": "한 줄 복습 — 폐곡면에 전기력선을 세면 전하가 나온다", "steps": [{"id": "s1-1", "t": "v2", "b": [{"k": "h", "h": "가우스 법칙 — 오늘의 식 하나"}, {"k": "f", "h": "\\[\\oint \\vec E\\cdot\\hat n\\,dA=\\dfrac{q_{enc}}{\\varepsilon_0}\\]"}], "braw": ["# 가우스 법칙 — 오늘의 식 하나", "= \\oint \\vec E\\cdot\\hat n\\,dA=\\dfrac{q_{enc}}{\\varepsilon_0}"], "s": "자, 오늘 식은 이거 하나입니다. 지난 시간 축구공으로 세운 식을 오늘은 실제로 써 봅니다. 기호부터 읽어 볼게요.", "fig": null, "fs": 0}, {"id": "s1-2", "t": "v2", "b": [{"k": "li", "h": "∮ = 닫힌 면 (모양은 상관없다)"}, {"k": "li", "h": "n̂ = 미소면적의 법선벡터"}, {"k": "li", "h": "q_enc = 면 <span class=\"ul\">안<\/span>의 알짜전하"}], "braw": ["• ∮ = 닫힌 면 (모양은 상관없다)", "• n̂ = 미소면적의 법선벡터", "• q_enc = 면 __안__의 알짜전하"], "s": "동그라미 붙은 적분은 닫힌 면이라는 뜻이에요. 공이든 상자든 닫혀만 있으면 됩니다. n̂은 그 면 조각이 바깥을 보는 방향, q_enc는 면 안에 갇힌 전하. 밖에 있는 전하는 들어왔다 나가서 0으로 상쇄돼요.", "fig": null, "fs": 0}, {"id": "s1-3", "t": "v2", "b": [{"k": "li", "h": "크기 E = |E| · 법선 성분 E_n = E·n̂ = E cosθ"}, {"k": "li", "h": "면마다 각이 다르면 E_n 을 적분 (일반식)"}, {"k": "li", "h": "대칭 좋은 면 → 전기력선 ∥ 법선 : <span class=\"ul\">평행<\/span>"}, {"k": "li", "h": "나가면(+q) E_n = +E · 들어오면(−q) E_n = −E"}], "braw": ["• 크기 E = |E| · 법선 성분 E_n = E·n̂ = E cosθ", "• 면마다 각이 다르면 E_n 을 적분 (일반식)", "• 대칭 좋은 면 → 전기력선 ∥ 법선 : __평행__", "• 나가면(+q) E_n = +E · 들어오면(−q) E_n = −E"], "s": "교수님이 물으셨죠. 법선벡터와 전기력선은 수직입니까, 평행입니까? 평행입니다. 단, 이건 대칭에 맞게 면을 잡았을 때 얘기예요. 일반식은 E cosθ 를 면마다 적분하는 거고, 평행이 되게 면을 고르는 게 실력입니다. 그리고 부호. 선이 바깥으로 나가면 플러스 E, 음전하라서 안으로 들어오면 마이너스 E 예요.", "fig": "da", "fs": 1}, {"id": "s1-4", "t": "v2", "b": [{"k": "li", "h": "면 위에서 E_n 일정 (평행 + 크기 같음) 이면"}, {"k": "res", "h": "E_n · (표면적) = q_enc / ε₀"}, {"k": "pit", "h": "크기 E 일정해도 E_n 은 면마다 다를 수 있다 : 균일 외부장 속 빈 상자"}, {"k": "li", "h": "앞면 +E · 뒷면 −E · 옆면 0 → 알짜 전속 0"}, {"k": "res", "h": "E_n 이 일정한 면에서는 남는 건 넓이 계산뿐!"}], "braw": ["• 면 위에서 E_n 일정 (평행 + 크기 같음) 이면", "→ E_n · (표면적) = q_enc / ε₀", "! 크기 E 일정해도 E_n 은 면마다 다를 수 있다 : 균일 외부장 속 빈 상자", "   앞면 +E · 뒷면 −E · 옆면 0 → 알짜 전속 0", "→ E_n 이 일정한 면에서는 남는 건 넓이 계산뿐!"], "s": "크기 E 와 법선 성분 E_n 을 구분하세요. E_n 이 면 위에서 똑같으면, 그러니까 선이 법선과 나란하고 크기도 같으면 적분 밖으로 빼낼 수 있어요. 그러면 E_n 곱하기 넓이. 음전하면 E_n 도 q_enc 도 마이너스라 부호가 맞습니다. 조건 하나 빼먹으면 틀립니다. 균일한 외부장 속에 전하 없는 상자를 두면 크기는 일정해도 E_n 은 앞면 플러스, 뒷면 마이너스, 옆면 0이라 알짜 전속은 0이에요. 그래서 E_n 이 일정하고 넓이를 쉽게 아는 면 세 가지만 씁니다.", "fig": "da", "fs": 2}, {"id": "s1-5", "t": "v2", "b": [{"k": "star", "h": "비유 : 그물 속 물고기 수 세기"}, {"k": "star", "h": "= 그물 밖으로 새는 냄새 줄기 수"}, {"k": "li", "h": "(그물 모양 무관 · 밖의 물고기는 0)"}], "braw": ["☆ 비유 : 그물 속 물고기 수 세기", "☆ = 그물 밖으로 새는 냄새 줄기 수", "   (그물 모양 무관 · 밖의 물고기는 0)"], "s": "이해가 안 되면 이 그림을 잡으세요. 그물 안 물고기가 몇 마리인지 알고 싶으면 그물 밖으로 새어 나오는 냄새 줄기를 세면 됩니다. 그물 모양은 상관없고, 그물 밖 물고기는 들어왔다 나가서 안 세죠.", "fig": null, "fs": 0}, {"id": "s1-6", "t": "v2", "b": [{"k": "memo", "h": "외울 것 : ∮ 폐곡면 · n̂ 법선 · q_enc 안의 알짜 · E_n = E·n̂ (±E) 일정이면 E_n·A = q_enc/ε₀"}], "braw": ["■ 외울 것 : ∮ 폐곡면 · n̂ 법선 · q_enc 안의 알짜 · E_n = E·n̂ (±E) 일정이면 E_n·A = q_enc/ε₀"], "s": "정리합니다. 네 가지, 눈 감고 말할 수 있어야 합니다. 못 하면 다음 챕터로 못 갑니다.", "fig": null, "fs": 0}], "figs": {"da": {"svg": "<figure class=\"fig chalk\" data-fig=\"da\"><svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Gaegu,Pretendard,sans-serif\" font-size=\"14\" fill=\"#F4F1E8\" id=\"fig-phys2-2026-09-16-s1-da\"><defs><filter id=\"chalk-phys2-2026-09-16-s1-da\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\" color-interpolation-filters=\"sRGB\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.06\" numOctaves=\"2\" seed=\"7\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"1.6\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><style>#fig-phys2-2026-09-16-s1-da .ck{filter:url(#chalk-phys2-2026-09-16-s1-da);stroke-linecap:round;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){#fig-phys2-2026-09-16-s1-da .ck{filter:none}}<\/style><defs><marker id=\"ah-phys2-2026-09-16-s1-da\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><g data-step=\"1\"><path class=\"ck\" d=\"M120 40 C 220 10, 330 30, 390 70 C 450 105, 430 180, 340 185 C 240 190, 130 175, 100 120 C 80 85, 90 55, 120 40 Z\" fill=\"rgba(255,255,255,.07)\" stroke=\"#FFA3C7\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\"><\/path><circle class=\"ck\" cx=\"230\" cy=\"110\" r=\"12\" fill=\"#2F5D4B\"><\/circle><circle class=\"ck\" cx=\"230\" cy=\"110\" r=\"12\" fill=\"#FFB09C\" fill-opacity=\".15\" stroke=\"#FFB09C\" stroke-width=\"2\"><\/circle><text x=\"230\" y=\"114.5\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#FFB09C\">+<\/text><circle class=\"ck\" cx=\"290\" cy=\"95\" r=\"12\" fill=\"#2F5D4B\"><\/circle><circle class=\"ck\" cx=\"290\" cy=\"95\" r=\"12\" fill=\"#FFB09C\" fill-opacity=\".15\" stroke=\"#FFB09C\" stroke-width=\"2\"><\/circle><text x=\"290\" y=\"99.5\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#FFB09C\">+<\/text><circle class=\"ck\" cx=\"260\" cy=\"140\" r=\"12\" fill=\"#2F5D4B\"><\/circle><circle class=\"ck\" cx=\"260\" cy=\"140\" r=\"12\" fill=\"#9ADCFF\" fill-opacity=\".15\" stroke=\"#9ADCFF\" stroke-width=\"2\"><\/circle><text x=\"260\" y=\"144.5\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#9ADCFF\">−<\/text><text x=\"260\" y=\"172\" font-size=\"12\" fill=\"#F4F1E8\" text-anchor=\"middle\">q<tspan baseline-shift=\"sub\" font-size=\"72%\">enc<\/tspan> = 안의 알짜 (+e)<\/text><rect class=\"ck\" x=\"386\" y=\"72\" width=\"16\" height=\"16\" rx=\"0\" fill=\"#2F5D4B\" stroke=\"#F4F1E8\" stroke-width=\"1.5\"><\/rect><text x=\"394\" y=\"106\" font-size=\"12\" fill=\"#F4F1E8\" text-anchor=\"middle\">dA<\/text><line class=\"ck\" x1=\"402\" y1=\"72\" x2=\"450\" y2=\"44\" stroke=\"#F4F1E8\" stroke-width=\"2\" marker-end=\"url(#ah-phys2-2026-09-16-s1-da)\"><\/line><text x=\"442.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#F4F1E8\"><tspan font-weight=\"700\">n<\/tspan><tspan baseline-shift=\"super\" font-size=\"62%\">^<\/tspan><\/text><line class=\"ck\" x1=\"330\" y1=\"110\" x2=\"378\" y2=\"84\" stroke=\"#B8F2D0\" stroke-width=\"2\" marker-end=\"url(#ah-phys2-2026-09-16-s1-da)\"><\/line><text x=\"348.0\" y=\"87.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#B8F2D0\">E<\/text><\/g><g data-step=\"2\"><text x=\"496\" y=\"150\" font-size=\"13\" fill=\"#FFA3C7\" text-anchor=\"middle\">모양은 아무거나<\/text><text x=\"496\" y=\"170\" font-size=\"13\" fill=\"#F4F1E8\" text-anchor=\"middle\">안의 알짜전하만 센다<\/text><\/g><\/svg><figcaption>폐곡면(가우스면)은 모양이 어떻든 상관없다. 미소면적 \\(dA\\)의 법선벡터 \\(\\hat n\\)과 그곳의 전기력선이 평행이면 \\(\\vec E\\cdot\\hat n=E\\).<\/figcaption><\/figure>", "max": 2}}, "say": null}, {"id": "s2", "title": "3종으로 지난 결과를 한 줄에 다시 얻는다", "steps": [{"id": "s2-1", "t": "v2", "b": [{"k": "h", "h": "가우스면 3종 — 넓이를 아는 면만"}, {"k": "li", "h": "구 4πr² · 원통 옆면 2πrL · 판 A (또는 2A)"}, {"k": "li", "h": "약속 : 이하 σ·λ·q &gt; 0 (양전하), 크기 E 만 쓴다"}, {"k": "li", "h": "전속이 나가는 면 E_n = +E · 음전하면 방향만 반대"}], "braw": ["# 가우스면 3종 — 넓이를 아는 면만", "• 구 4πr² · 원통 옆면 2πrL · 판 A (또는 2A)", "• 약속 : 이하 σ·λ·q > 0 (양전하), 크기 E 만 쓴다", "   전속이 나가는 면 E_n = +E · 음전하면 방향만 반대"], "s": "가우스면은 세 종류만 씁니다. 구, 원통, 판. 교수님 말씀대로 네 개 다섯 개 만들 수 있냐고요? 만들 수는 있는데 아무도 안 합니다. 넓이를 모르니까요. 그리고 약속 하나. 이제부터는 전하를 양으로 놓고 크기만 씁니다. 나가는 면에서 E_n 은 플러스 E 니까요. 음전하면 크기는 그대로, 방향만 뒤집으면 됩니다.", "fig": "re", "fs": 1}, {"id": "s2-2", "t": "v2", "b": [{"k": "li", "h": "무한 평면 (부도체, σ) : 선이 <span class=\"ul\">양쪽<\/span>으로 → 면 2A"}, {"k": "f", "h": "\\[E\\cdot 2A=\\dfrac{q}{\\varepsilon_0}\\ \\Rightarrow\\ E=\\dfrac{\\sigma}{2\\varepsilon_0}\\]"}], "braw": ["• 무한 평면 (부도체, σ) : 선이 __양쪽__으로 → 면 2A", "= E\\cdot 2A=\\dfrac{q}{\\varepsilon_0}\\ \\Rightarrow\\ E=\\dfrac{\\sigma}{2\\varepsilon_0}"], "s": "지난 시간 원판을 무한히 키워서 얻은 σ/2ε₀, 기억나시죠? 오늘은 한 줄입니다. 판 앞뒤로 선이 나가니까 면이 두 장, 2A. 여기서 반이 틀립니다. 2A인 이유를 말로 설명하세요.", "fig": "re", "fs": 2}, {"id": "s2-3", "t": "v2", "b": [{"k": "li", "h": "무한 직선 도선 (λ) : 원통 옆면 2πrL, 안의 전하 λL"}, {"k": "f", "h": "\\[E\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}\\ \\Rightarrow\\ E=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}\\]"}], "braw": ["• 무한 직선 도선 (λ) : 원통 옆면 2πrL, 안의 전하 λL", "= E\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}\\ \\Rightarrow\\ E=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}"], "s": "도선은 원통으로 감쌉니다. 뚜껑 두 장은 선이 안 지나가니 0, 옆면만 2πrL. 적분으로 하면 반 페이지, 가우스로는 한 줄이에요. 단, 9/9에 한 유한 도선 문제와는 배치가 다릅니다. 이건 옆에서 본 무한 도선.", "fig": "re", "fs": 3}, {"id": "s2-4", "t": "v2", "b": [{"k": "li", "h": "구 4πr² : E·4πr² = q/ε₀"}, {"k": "res", "h": "E = q/4πε₀r² (점전하 그대로)"}, {"k": "li", "h": "도체 표면 한쪽 : 면 A 한 장 → E = σ/ε₀"}, {"k": "pit", "h": "무한 평면 σ/2ε₀ 과 두 배 차이 = 양쪽이냐 한쪽이냐"}], "braw": ["• 구 4πr² : E·4πr² = q/ε₀", "→ E = q/4πε₀r² (점전하 그대로)", "• 도체 표면 한쪽 : 면 A 한 장 → E = σ/ε₀", "! 무한 평면 σ/2ε₀ 과 두 배 차이 = 양쪽이냐 한쪽이냐"], "s": "구는 4πr². 점전하 공식이 그대로 나오죠. 그리고 도체 표면은 선이 한쪽으로만 나가요. 그래서 A 한 장, σ/ε₀. 무한 평면과 딱 두 배 차이. 시험에서 이 둘을 섞으면 그대로 틀립니다.", "fig": "re", "fs": 4}, {"id": "s2-5", "t": "v2", "b": [{"k": "star", "h": "비유 : 적분 = 벽돌 한 장씩 쌓기"}, {"k": "star", "h": "가우스 = 대칭 좋은 집을 통째로 들기"}, {"k": "res", "h": "법칙은 항상 성립"}, {"k": "res", "h": "E 가 바로 나오는 건 대칭(면·원통·구)일 때만!"}], "braw": ["☆ 비유 : 적분 = 벽돌 한 장씩 쌓기", "☆ 가우스 = 대칭 좋은 집을 통째로 들기", "→ 법칙은 항상 성립", "→ E 가 바로 나오는 건 대칭(면·원통·구)일 때만!"], "s": "적분은 벽돌 한 장씩, 가우스는 집을 통째로 들어 올리는 겁니다. 대신 조건이 있어요. 대칭. 법칙 자체는 어떤 닫힌 면에서도 성립하지만, 대칭이 없으면 E 를 적분 밖으로 못 꺼내서 답이 안 나와요. 그때는 적분으로 돌아갑니다.", "fig": null, "fs": 0}, {"id": "s2-6", "t": "v2", "b": [{"k": "memo", "h": "외울 것 : 2A → σ/2ε₀ · 2πrL → λ/2πε₀r · 4πr² → q/4πε₀r² · A → σ/ε₀"}], "braw": ["■ 외울 것 : 2A → σ/2ε₀ · 2πrL → λ/2πε₀r · 4πr² → q/4πε₀r² · A → σ/ε₀"], "s": "넷을 한 줄로 외우세요. 면적과 결과를 짝으로. 다음이 오늘의 본론, 시험이 나오는 곳입니다.", "fig": null, "fs": 0}], "figs": {"re": {"svg": "<figure class=\"fig chalk\" data-fig=\"re\"><svg class=\"fig-svg\" viewbox=\"0 0 560 200\" width=\"560\" height=\"200\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Gaegu,Pretendard,sans-serif\" font-size=\"14\" fill=\"#F4F1E8\" id=\"fig-phys2-2026-09-16-s2-re\"><defs><filter id=\"chalk-phys2-2026-09-16-s2-re\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\" color-interpolation-filters=\"sRGB\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.06\" numOctaves=\"2\" seed=\"7\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"1.6\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><style>#fig-phys2-2026-09-16-s2-re .ck{filter:url(#chalk-phys2-2026-09-16-s2-re);stroke-linecap:round;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){#fig-phys2-2026-09-16-s2-re .ck{filter:none}}<\/style><defs><marker id=\"ah-phys2-2026-09-16-s2-re\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><g data-step=\"1\"><rect class=\"ck\" x=\"70\" y=\"60\" width=\"8\" height=\"90\" rx=\"0\" fill=\"rgba(255,255,255,.07)\" stroke=\"#FFB09C\" stroke-width=\"1\"><\/rect><text x=\"74\" y=\"50\" font-size=\"12\" fill=\"#FFB09C\" text-anchor=\"middle\">+판(σ)<\/text><rect class=\"ck\" x=\"30\" y=\"70\" width=\"88\" height=\"70\" rx=\"0\" fill=\"none\" stroke=\"#FFA3C7\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/rect><line class=\"ck\" x1=\"280\" y1=\"55\" x2=\"280\" y2=\"155\" stroke=\"#FFB09C\" stroke-width=\"3\"><\/line><text x=\"280\" y=\"45\" font-size=\"12\" fill=\"#FFB09C\" text-anchor=\"middle\">직선 도선(λ)<\/text><rect class=\"ck\" x=\"245\" y=\"70\" width=\"70\" height=\"70\" rx=\"10\" fill=\"none\" stroke=\"#FFA3C7\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/rect><circle class=\"ck\" cx=\"460\" cy=\"105\" r=\"14\" fill=\"#2F5D4B\"><\/circle><circle class=\"ck\" cx=\"460\" cy=\"105\" r=\"14\" fill=\"#FFB09C\" fill-opacity=\".15\" stroke=\"#FFB09C\" stroke-width=\"2\"><\/circle><text x=\"460\" y=\"110.1\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#FFB09C\">+<\/text><circle class=\"ck\" cx=\"460\" cy=\"105\" r=\"42\" fill=\"none\" stroke=\"#FFA3C7\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/circle><\/g><g data-step=\"2\"><line class=\"ck\" x1=\"74\" y1=\"105\" x2=\"24\" y2=\"105\" stroke=\"#B8F2D0\" stroke-width=\"2\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><line class=\"ck\" x1=\"74\" y1=\"105\" x2=\"124\" y2=\"105\" stroke=\"#B8F2D0\" stroke-width=\"2\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><text x=\"74\" y=\"168\" font-size=\"13\" fill=\"#F4F1E8\" text-anchor=\"middle\">면 2A<\/text><text x=\"74\" y=\"186\" font-size=\"12\" fill=\"#F4F1E8\" text-anchor=\"middle\">E·2A = q/ε₀ → σ/2ε₀<\/text><\/g><g data-step=\"3\"><line class=\"ck\" x1=\"285\" y1=\"105\" x2=\"335\" y2=\"105\" stroke=\"#B8F2D0\" stroke-width=\"2\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><line class=\"ck\" x1=\"275\" y1=\"105\" x2=\"225\" y2=\"105\" stroke=\"#B8F2D0\" stroke-width=\"2\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><text x=\"280\" y=\"168\" font-size=\"13\" fill=\"#F4F1E8\" text-anchor=\"middle\">원통 옆면 2πrL<\/text><text x=\"280\" y=\"186\" font-size=\"12\" fill=\"#F4F1E8\" text-anchor=\"middle\">E·2πrL = λL/ε₀ → λ/2πε₀r<\/text><\/g><g data-step=\"4\"><line class=\"ck\" x1=\"480.0\" y1=\"105.0\" x2=\"510.0\" y2=\"105.0\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><line class=\"ck\" x1=\"470.0\" y1=\"122.3\" x2=\"485.0\" y2=\"148.3\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><line class=\"ck\" x1=\"450.0\" y1=\"122.3\" x2=\"435.0\" y2=\"148.3\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><line class=\"ck\" x1=\"440.0\" y1=\"105.0\" x2=\"410.0\" y2=\"105.0\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><line class=\"ck\" x1=\"450.0\" y1=\"87.7\" x2=\"435.0\" y2=\"61.7\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><line class=\"ck\" x1=\"470.0\" y1=\"87.7\" x2=\"485.0\" y2=\"61.7\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s2-re)\"><\/line><text x=\"460\" y=\"168\" font-size=\"13\" fill=\"#F4F1E8\" text-anchor=\"middle\">구 4πr²<\/text><text x=\"460\" y=\"186\" font-size=\"12\" fill=\"#F4F1E8\" text-anchor=\"middle\">E·4πr² = q/ε₀ → q/4πε₀r²<\/text><\/g><\/svg><figcaption>가우스면 3종으로 지난 시간 적분 결과를 한 줄에 다시 얻는다. 무한 평면은 전기력선이 양쪽으로 나가므로 2A.<\/figcaption><\/figure>", "max": 4}}, "say": null}, {"id": "s3", "title": "여기까지가 교과서 — 응용은 도체구·부도체구", "steps": [{"id": "s3-1", "t": "v2", "b": [{"k": "h", "h": "여기까지가 교과서 — 시험은 응용에서"}, {"k": "li", "h": "도체 = 전기가 흐름 (자유전자 O) · 부도체 = 안 흐름"}, {"k": "pit", "h": "둘 다 전하는 <span class=\"ul\">있다<\/span>"}], "braw": ["# 여기까지가 교과서 — 시험은 응용에서", "• 도체 = 전기가 흐름 (자유전자 O) · 부도체 = 안 흐름", "! 둘 다 전하는 __있다__"], "s": "교수님이 못 박으셨어요. 앞은 안 나오고 도체구·부도체구 응용에서 산수 문제가 나온다고. 용어부터 갑니다. 도체는 흐르고 부도체는 안 흐르는데, 둘 다 전하는 있습니다. 부도체엔 전하가 없다고 착각하면 오늘 끝까지 헷갈립니다.", "fig": null, "fs": 0}, {"id": "s3-2", "t": "v2", "b": [{"k": "li", "h": "고립도체 = 밖과 전하를 안 주고받는 도체"}, {"k": "li", "h": "정전평형 : 전하가 안 움직임 → 도체 안 E = 0"}, {"k": "res", "h": "과잉 전하는 <span class=\"ul\">표면에만<\/span> · 안쪽 알짜 전하밀도 0"}], "braw": ["• 고립도체 = 밖과 전하를 안 주고받는 도체", "• 정전평형 : 전하가 안 움직임 → 도체 안 E = 0", "→ 과잉 전하는 __표면에만__ · 안쪽 알짜 전하밀도 0"], "s": "책의 고립도체는 밖과 전하를 주고받지 않는 도체예요. 수업에서 본 실에 매단 도체구는 전기장을 걸어 플러스 마이너스를 갈라 놓은 그림이고, 장을 없애면 전하는 다시 섞입니다. 핵심은 정전평형. 도체 안에서 전하가 더 안 움직이려면 안의 E 가 0이어야 하고, 그러면 과잉 전하는 표면으로만 갑니다.", "fig": "cond", "fs": 1}, {"id": "s3-3", "t": "v2", "b": [{"k": "f", "h": "\\[r&lt;R:\\ E=0\\]"}, {"k": "f", "h": "\\[r\\ge R:\\ E\\cdot4\\pi r^2=\\dfrac{q}{\\varepsilon_0}\\]"}, {"k": "f", "h": "\\[\\Rightarrow\\ E=\\dfrac{q}{4\\pi\\varepsilon_0 r^2}\\]"}], "braw": ["= r<R:\\ E=0", "= r\\ge R:\\ E\\cdot4\\pi r^2=\\dfrac{q}{\\varepsilon_0}", "= \\Rightarrow\\ E=\\dfrac{q}{4\\pi\\varepsilon_0 r^2}"], "s": "순서가 중요해요. 정전평형이라 도체 안 E 가 0이고, 안쪽에 가우스면을 잡으면 왼쪽이 0이니 q_enc 도 0. 그래서 과잉 전하가 전부 표면에 있다는 게 나오는 겁니다. 바깥에 잡으면 q 를 전부 품으니까 중심에 점전하 q 가 있는 것과 구별이 안 됩니다. 여기서도 q 는 양으로 두고 크기만 쓴 식이에요.", "fig": "cond", "fs": 2}, {"id": "s3-4", "t": "v2", "b": [{"k": "star", "h": "'반지름 R인 도체구' 보이면 (제일 중요)"}, {"k": "res", "h": "안 E = 0 / 밖 점전하"}], "braw": ["☆ '반지름 R인 도체구' 보이면 (제일 중요)", "→ 안 E = 0 / 밖 점전하"], "s": "문제에 반지름 R인 도체구가 나오면 이 정리가 바로 떠올라야 합니다. 교수님이 제일 중요하다고 한 부분이에요. 여기서 반은 틀립니다.", "fig": "cond", "fs": 3}, {"id": "s3-5", "t": "v2", "b": [{"k": "star", "h": "비유 : 도체 = 광장 (가장자리로 흩어짐)"}, {"k": "star", "h": "부도체 = 좌석 고정된 극장"}], "braw": ["☆ 비유 : 도체 = 광장 (가장자리로 흩어짐)", "☆ 부도체 = 좌석 고정된 극장"], "s": "도체는 사람들이 자유롭게 걷는 광장이에요. 같은 부호끼리 밀어내니 최대한 멀리, 가장자리로 흩어지고 가운데는 빕니다. 부도체는 좌석이 고정된 극장. 전하가 자리에 박혀 안에도 그대로 있어요.", "fig": null, "fs": 0}, {"id": "s3-6", "t": "v2", "b": [{"k": "memo", "h": "외울 것 : 도체구 → 표면에만 · 안 E=0 · 밖 q/4πε₀r² · 둘 다 전하는 있다"}], "braw": ["■ 외울 것 : 도체구 → 표면에만 · 안 E=0 · 밖 q/4πε₀r² · 둘 다 전하는 있다"], "s": "정리. 이 네 줄이 도체구의 전부입니다.", "fig": null, "fs": 0}], "figs": {"cond": {"svg": "<figure class=\"fig chalk\" data-fig=\"cond\"><svg class=\"fig-svg\" viewbox=\"0 0 560 240\" width=\"560\" height=\"240\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Gaegu,Pretendard,sans-serif\" font-size=\"14\" fill=\"#F4F1E8\" id=\"fig-phys2-2026-09-16-s3-cond\"><defs><filter id=\"chalk-phys2-2026-09-16-s3-cond\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\" color-interpolation-filters=\"sRGB\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.06\" numOctaves=\"2\" seed=\"7\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" "ck\" cx=\"410\" cy=\"120\" r=\"100\" fill=\"none\" stroke=\"#FFA3C7\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\/circle><line class=\"ck\" x1=\"484.0\" y1=\"120.0\" x2=\"518.0\" y2=\"120.0\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s3-cond)\"><\/line><line class=\"ck\" x1=\"462.3\" y1=\"172.3\" x2=\"486.4\" y2=\"196.4\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s3-cond)\"><\/line><line class=\"ck\" x1=\"410.0\" y1=\"194.0\" x2=\"410.0\" y2=\"228.0\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s3-cond)\"><\/line><line class=\"ck\" x1=\"357.7\" y1=\"172.3\" x2=\"333.6\" y2=\"196.4\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s3-cond)\"><\/line><line class=\"ck\" x1=\"336.0\" y1=\"120.0\" x2=\"302.0\" y2=\"120.0\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s3-cond)\"><\/line><line class=\"ck\" x1=\"357.7\" y1=\"67.7\" x2=\"333.6\" y2=\"43.6\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s3-cond)\"><\/line><line class=\"ck\" x1=\"410.0\" y1=\"46.0\" x2=\"410.0\" y2=\"12.0\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s3-cond)\"><\/line><line class=\"ck\" x1=\"462.3\" y1=\"67.7\" x2=\"486.4\" y2=\"43.6\" stroke=\"#B8F2D0\" stroke-width=\"1.6\" marker-end=\"url(#ah-phys2-2026-09-16-s3-cond)\"><\/line><\/g><g data-step=\"3\"><text x=\"410\" y=\"236\" font-size=\"12.5\" fill=\"#F4F1E8\" text-anchor=\"middle\">r ≥ R: E·4πr² = q/ε₀ → 점전하와 같다<\/text><\/g><\/svg><figcaption>고립 도체구: 정전평형이라 도체 안 \\(E=0\\) → 안쪽 가우스면의 \\(q_{enc}=0\\)(과잉 전하는 표면에만). 바깥에서는 중심에 점전하 \\(q\\)가 있는 것과 같다.<\/figcaption><\/figure>", "max": 3}}, "say": null}, {"id": "s4", "title": "부도체구 — 제일 어렵고 마지막: 안에서는 r에 비례", "steps": [{"id": "s4-1", "t": "v2", "b": [{"k": "h", "h": "부도체구 — 제일 어렵고 마지막"}, {"k": "li", "h": "반지름 R, 전하 q(&gt;0) 가 <span class=\"ul\">부피에 균일<\/span>"}, {"k": "li", "h": "밖 (r ≥ R) : 도체구와 같다 → q/4πε₀r²"}, {"k": "li", "h": "안 (r &lt; R) : 가우스면 <span class=\"ul\">안의 전하 q'<\/span> 만 센다"}], "braw": ["# 부도체구 — 제일 어렵고 마지막", "• 반지름 R, 전하 q(>0) 가 __부피에 균일__", "• 밖 (r ≥ R) : 도체구와 같다 → q/4πε₀r²", "• 안 (r < R) : 가우스면 __안의 전하 q'__ 만 센다"], "s": "부도체구는 전하가 안까지 고르게 퍼져 있어요. 밖은 도체구와 똑같습니다. 문제는 안. 안에서는 가우스면 안에 든 전하만 세야 합니다.", "fig": "ins", "fs": 1}, {"id": "s4-2", "t": "v2", "b": [{"k": "li", "h": "균일 → ρ = q/V 어디서나 같다"}, {"k": "f", "h": "\\[\\dfrac{q}{\\frac43\\pi R^3}=\\dfrac{q'}{\\frac43\\pi r^3}\\ \\Rightarrow\\ q'=\\dfrac{r^3}{R^3}q\\]"}], "braw": ["• 균일 → ρ = q/V 어디서나 같다", "= \\dfrac{q}{\\frac43\\pi R^3}=\\dfrac{q'}{\\frac43\\pi r^3}\\ \\Rightarrow\\ q'=\\dfrac{r^3}{R^3}q"], "s": "균일하다는 말은 밀도가 어디서나 같다는 뜻이에요. 전체 부피 분의 q와 작은 공 부피 분의 q'가 같으니, q'는 r 세제곱 나누기 R 세제곱 곱하기 q. 여기까지 되면 다 된 겁니다.", "fig": "ins", "fs": 2}, {"id": "s4-3", "t": "v2", "b": [{"k": "f", "h": "\\[E\\cdot4\\pi r^2=\\dfrac{q'}{\\varepsilon_0}\\]"}, {"k": "f", "h": "\\[E_{in}=\\dfrac{q\\,r}{4\\pi\\varepsilon_0R^3}\\ (\\propto r)\\]"}], "braw": ["= E\\cdot4\\pi r^2=\\dfrac{q'}{\\varepsilon_0}", "= E_{in}=\\dfrac{q\\,r}{4\\pi\\varepsilon_0R^3}\\ (\\propto r)"], "s": "가우스 법칙에 넣으면 r 세제곱 나누기 r 제곱, r 하나가 남습니다. 안에서는 E가 r에 비례해요. 중심에서 0, 표면에서 최대.", "fig": "ins", "fs": 3}, {"id": "s4-4", "t": "v2", "b": [{"k": "li", "h": "그래프 : 원점부터 직선 ↗ (안)"}, {"k": "li", "h": "r = R 에서 꺾여 1/r² 로 ↘ (밖)"}, {"k": "pit", "h": "도체구는 안에서 0 → 표면에서 갑자기 최대 (개념 문제 후보)"}], "braw": ["• 그래프 : 원점부터 직선 ↗ (안)", "• r = R 에서 꺾여 1/r² 로 ↘ (밖)", "! 도체구는 안에서 0 → 표면에서 갑자기 최대 (개념 문제 후보)"], "s": "그래프로 보면 원점에서 직선으로 올라가다 표면에서 꺾여 1/r²로 내려옵니다. 도체구는 안에서 0이었다가 표면에서 갑자기 최대죠. 이 둘의 차이를 그림으로 그리게 하는 개념 문제, 나옵니다.", "fig": "ins", "fs": 4}, {"id": "s4-5", "t": "v2", "b": [{"k": "star", "h": "비유 : 안개 속으로 걸어갈수록"}, {"k": "star", "h": "'내 뒤에 남은 안개'가 는다 (r³ ÷ r² = r)"}, {"k": "li", "h": "교수님 : '가우스에서 나오는 값은 다 스칼라'"}], "braw": ["☆ 비유 : 안개 속으로 걸어갈수록", "☆ '내 뒤에 남은 안개'가 는다 (r³ ÷ r² = r)", "• 교수님 : '가우스에서 나오는 값은 다 스칼라'"], "s": "안개 속을 걸어 들어가면 내 뒤에 남는 안개가 점점 늘죠. 안에 든 전하가 r 세제곱으로 늘고 넓이 r 제곱으로 나누니 r만큼 커지는 겁니다. 그리고 교수님 말씀 하나. 가우스에서 나오는 값은 다 스칼라. 방향은 대칭이 정합니다.", "fig": null, "fs": 0}, {"id": "s4-6", "t": "v2", "b": [{"k": "memo", "h": "외울 것 : 안 qr/4πε₀R³ (∝ r) · 밖 q/4πε₀r² · q' = (r³/R³)q · 표면 최대"}], "braw": ["■ 외울 것 : 안 qr/4πε₀R³ (∝ r) · 밖 q/4πε₀r² · q' = (r³/R³)q · 표면 최대"], "s": "정리. 안은 r에 비례, 밖은 점전하. 이제 시험 유형으로 갑니다.", "fig": null, "fs": 0}], "figs": {"ins": {"svg": "<figure class=\"fig chalk\" data-fig=\"ins\"><svg class=\"fig-svg\" viewbox=\"0 0 560 250\" width=\"560\" height=\"250\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Gaegu,Pretendard,sans-serif\" font-size=\"14\" fill=\"#F4F1E8\" id=\"fig-phys2-2026-09-16-s4-ins\"><defs><filter id=\"chalk-phys2-2026-09-16-s4-ins\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\" color-interpolation-filters=\"sRGB\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.06\" numOctaves=\"2\" seed=\"7\" result=\"n\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"1.6\" xChannelSelector=\"R\" yChannelSelector=\"G\"/><\/filter><\/defs><style>#fig-phys2-2026-09-16-s4-ins .ck{filter:url(#chalk-phys2-2026-09-16-s4-ins);stroke-linecap:round;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){#fig-phys2-2026-09-16-s4-ins .ck{filter:none}}<\/style><defs><marker id=\"ah-phys2-2026-09-16-s4-ins\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\/path><\/marker><\/defs><g data-step=\"1\"><circle class=\"ck\" cx=\"150\" cy=\"120\" r=\"75\" fill=\"rgba(255,255,255,.07)\" stroke=\"#FFB09C\" stroke-width=\"2.5\"><\/circle><text x=\"169.6\" y=\"148.7\" font-size=\"11\" fill=\"#FFB09C\" text-anchor=\"middle\">+<\/text><text x=\"146.4\" y=\"155.3\" font-size=\"11\" fill=\"#FFB09C\" text-anchor=\"middle\">+<\/text><text x=\"125.3\" y=\"143.6\" font-size=\"11\" fill=\"#FFB09C\" text-anchor=\"middle\">+<\/text><text x=\"1 질 (b=2a · c=2.4a · 알짜 −q)", "• 규칙 : 반지름 r 구면 → __그 안의 알짜전하만__ 센다"], "s": "교수님이 백 퍼센트 나온다고 한 유형입니다. 부도체 공에 도체 껍질을 씌운 구조. 규칙은 하나예요. 반지름 r인 구면을 잡고 그 안의 알짜전하만 셉니다. 영역이 바뀔 때마다 새로 세요.", "fig": "shell", "fs": 1}, {"id": "s5-2", "t": "v2", "b": [{"k": "li", "h": "(a) r = a/2 부도체 안 : q_enc = q/8"}, {"k": "f", "h": "\\[E=\\dfrac{q\\,(a/2)}{4\\pi\\varepsilon_0a^3}=\\dfrac{q}{8\\pi\\varepsilon_0a^2}\\]"}], "braw": ["(a) r = a/2 부도체 안 : q_enc = q/8", "= E=\\dfrac{q\\,(a/2)}{4\\pi\\varepsilon_0a^3}=\\dfrac{q}{8\\pi\\varepsilon_0a^2}"], "s": "첫 영역, 부도체 안. 부피 비로 8분의 1이 갇혀 있죠. 부도체구 공식에 r 대신 a/2를 넣으면 끝입니다.", "fig": "shell", "fs": 2}, {"id": "s5-3", "t": "v2", "b": [{"k": "li", "h": "(b) r = 1.5a 공과 껍질 사이 : q_enc = q"}, {"k": "f", "h": "\\[E=\\dfrac{q}{4\\pi\\varepsilon_0(1.5a)^2}=\\dfrac{q}{9\\pi\\varepsilon_0a^2}\\]"}], "braw": ["(b) r = 1.5a 공과 껍질 사이 : q_enc = q", "= E=\\dfrac{q}{4\\pi\\varepsilon_0(1.5a)^2}=\\dfrac{q}{9\\pi\\varepsilon_0a^2}"], "s": "공을 벗어나면 q 전부. 점전하처럼 계산하면 됩니다. 여기까지는 산수예요.", "fig": "shell", "fs": 3}, {"id": "s5-4", "t": "v2", "b": [{"k": "li", "h": "(c) r = 2.3a 도체 껍질 안 : E = 0"}, {"k": "res", "h": "껍질 <span class=\"ul\">안쪽 표면에 −q<\/span> 가 유도돼야 (안의 알짜 0)"}], "braw": ["(c) r = 2.3a 도체 껍질 안 : E = 0", "→ 껍질 __안쪽 표면에 −q__ 가 유도돼야 (안의 알짜 0)"], "s": "도체 안이니 E는 0. 그런데 그러려면 가우스면 안 알짜가 0이어야 하죠. 그래서 껍질 안쪽 표면에 −q가 붙습니다. 이걸 못 쓰면 다음 문항도 같이 틀립니다.", "fig": "shell", "fs": 4}, {"id": "s5-5", "t": "v2", "b": [{"k": "li", "h": "(d) r = 3.5a 바깥 : q_enc = q + (−q) = 0"}, {"k": "res", "h": "E = 0"}, {"k": "res", "h": "알짜 −q 를 안쪽에 다 썼으니 <span class=\"ul\">바깥 표면은 0<\/span>"}], "braw": ["(d) r = 3.5a 바깥 : q_enc = q + (−q) = 0", "→ E = 0", "→ 알짜 −q 를 안쪽에 다 썼으니 __바깥 표면은 0__"], "s": "바깥은 공의 q와 껍질의 −q를 합쳐 0. 껍질의 알짜 −q를 안쪽 표면이 다 썼으니 바깥 표면엔 아무것도 안 남습니다. 강의노트 필수문제 1·2도 숫자만 다르고 구조가 같아요.", "fig": "shell", "fs": 5}, {"id": "s5-6", "t": "v2", "b": [{"k": "star", "h": "비유 : 양파 한 겹씩 벗기기"}, {"k": "star", "h": "겹이 바뀔 때마다 q_enc 다시 세기"}, {"k": "memo", "h": "외울 것 : 영역마다 q_enc 새로 · 도체 안 0 ⇒ 안쪽 표면 −q_안 · 바     if(v2save){ if(typeof p.cid==="string") ci=CH.findIndex(c=>c.id===p.cid);
      if(ci<0) return {mode:mode==="quiz"?"quiz":"intro",ci:0,si:0,qi:qi,note:"챕터 못 찾음"};
      if(String(p.ver||"")!==VER){ si=0; note="판서가 바뀌어 챕터 처음부터"; }
      else if(typeof p.sid==="string"){ si=CH[ci].steps.findIndex(s=>s.id===p.sid); if(si<0){ si=0; note="단계 못 찾음"; } }
      else { si=0; note="단계 못 찾음"; } }
    else { const c2=toInt(p.ci); if(!Number.isInteger(c2)||c2<0||c2>=CH.length) return {mode:mode==="quiz"?"quiz":"intro",ci:0,si:0,qi:qi,note:"구버전 저장값"};

  board('<div class="res"><div class="big">'+(ung.length?"채점이 남았습니다":good?"수고했습니다":mid?"절반은 넘겼습니다":"다시 합니다")+'</div><div class="stats"><div><b>'+ok+'/'+n+'</b><span>정답</span></div><div><b>+'+(L.xp||0)+'</b><span>이 회차 XP</span></div><div><b>'+T.streak+'</b><span>연속일</span></div><div><b>'+T.aff+'</b><span>호감도 · '+affName()+'</span></div></div>'+badge+(ung.length?'<div class="wrong">채점 전 '+ung.length+'개 — 답 보기 뒤 「맞았어요/틀렸어요」까지 눌러야 완료입니다.</div>':'')+(wrong.length?'<div class="wrong">틀린 문제 '+wrong.length+'개 — 해설을 읽고 다시 푸세요.</div>':'')+'</div>','<span>오늘의 결과</span>',true);
  { const [rl,rf]=preLine(ung.length?"채점을 안 한 문제가 있습니다. 봐주지 말고 스스로 채점하세요. 그래야 끝난 겁니다.":pick(good?"res_good":mid?"res_mid":"res_bad","r",{ok:ok,n:n}), ung.length?"sharp":good?"proud":mid?"sharp":"angry"); say(rl,rf); }
  const cs=[];
  if(ung.length) cs.push({t:"채점 안 한 문제 ("+ung.length+")",cls:"p",primary:1,key:"Enter",f:()=>{ S.mode="quiz"; S.qi=QZ.indexOf(ung[0]); render(); }});
  if(wrong.length) cs.push({t:"틀린 문제 다시 ("+wrong.length+")",cls:ung.length?"g":"p",primary:ung.length?0:1,key:ung.length?"":"Enter",f:()=>{ wrong.forEach(q=>{ delete ST.done[q.id]; delete ST.correct[q.id]; delete ST.answer[q.id]; }); save(); S.mode="quiz"; S.qi=QZ.findIndex(q=>!ST.done[q.id]); render(); }});
  cs.push({t:"교재 보기",cls:"g",f:()=>openBook(null)}); cs.push({t:"목차",cls:"g",f:openToc});
  if(EMB) cs.push({t:"앱으로",cls:wrong.length?"g":"p",primary:wrong.length?0:1,f:()=>post({type:"mc-close",v:1})});
  choices(cs);
}
/* ---------- 목차 · 교재 · 질문 ---------- */
function openToc(){ const ov=$("#ov"); $("#ovMeta").textContent=D.course+" · "+D.sess+" · XP "+(L.xp||0)+(V2?" · 판서 v2":" · 구버전 판서");
  $("#ovList").innerHTML=CH.map((c,i)=>'<li class="'+(L.ch[c.id]?"done":"")+(S.mode==="step"&&S.ci===i?" cur":"")+'"><button type="button" data-ci="'+i+'"><span class="st">'+(L.ch[c.id]?"✓":i+1)+'</span><span>'+esc(c.title)+'</span><small>'+c.steps.length+'단계</small></button></li>').join("")
    +(QZ.length?'<li class="'+(QZ.every(q=>ST.done[q.id])?"done":"")+(S.mode==="quiz"?" cur":"")+'"><button type="button" data-q="1"><span class="st">?</span><span>확인 문제</span><small>'+QZ.filter(q=>ST.done[q.id]).length+'/'+QZ.length+'</small></button></li>':"");
  $$("#ovList [data-ci]").forEach(b=>{ b.onclick=()=>{ ov.classList.remove("on"); cancelAll(); S=Object.assign(S,{mode:"step",ci:+b.dataset.ci,si:0,rev:false,again:0,resume:false}); render(); }; });
  const qb=$("#ovList [data-q]"); if(qb) qb.onclick=()=>{ ov.classList.remove("on"); cancelAll(); if(T.hearts<=0&&QZ.some(q=>!ST.done[q.id])){ S.mode="nohearts"; return render(); } S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; render(); };
  ov.classList.add("on"); }
$("#hToc").onclick=openToc; $("#ovClose").onclick=()=>$("#ov").classList.remove("on"); $("#ov").onclick=e=>{ if(e.target.id==="ov") $("#ov").classList.remove("on"); };
$("#ovBook").onclick=()=>openBook(S.mode==="step"?(CH[S.ci]||{}).id:null);
/* 학습 기록(챕터·문제)과 보상 기록(L.rew·L.xp)을 분리 — 초기화해도 같은 챕터·문제로 XP 를 다시 받지 않는다(오타 R5) */
$("#ovReset").onclick=()=>{ if(!confirm("이 회차의 챕터·문제 기록을 지울까요? (XP·연속일과 이미 받은 보상은 그대로 — 같은 챕터·문제로 XP 를 다시 받지는 않습니다)")) return; cancelAll(); L={pos:null,ch:{},done:false,xp:L.xp||0,rew:(L.rew&&typeof L.rew==="object")?L.rew:{}}; ST={read:{},done:{},correct:{},answer:{},ts:0}; S=Object.assign(S,{mode:"intro",ci:0,si:0,qi:0,rev:false,again:0,resume:false,pre:"",preFace:""}); $("#ov").classList.remove("on"); render(); };
function post(m){ try{ window.parent.postMessage(m,location.origin); }catch(e){} }
function openBook(sid){ const hash=sid?"#s="+sid:""; if(EMB){ post({type:"mc-open",v:1,file:LESSON_APP+hash,title:document.title}); } else location.href=LESSON_REL+hash; }
function ask(){ if(anim||typing) finishNow();   /* 질문 대사가 진행 중인 단계의 완료 콜백을 지우지 않게 먼저 즉시 완료(오타 R2) */
  if(EMB){ post({type:"mc-ask",v:1}); say(pick("ask",S.ci+":"+S.si),"wide"); gainAff(1); save(); hud(); } else say(pick("askoff",S.ci),"sharp"); }
/* ---------- 앱 질문 패널 문맥 (V45 규약) ---------- */
let CTX_GEN=null;
function ctx(){ if(!CTX_GEN||!EMB) return; let label="", q=null, sid="";
  if(S.mode==="step"){ const ch=CH[S.ci]||{}, st=(ch.steps||[])[S.si]||{}; sid=ch.id||""; label="CH "+(S.ci+1)+" · "+(ch.title||""); const tmp=document.createElement("div"); tmp.innerHTML= st.t==="v2"? ((st.b||[]).map(l=>l.h).join(" ")+" "+(st.s||"")) : (st.t==="ex"?(st.q+" "+(S.rev?st.a:"")):(st.html||"")); q={qn:(ch.title||"").slice(0,80),kind:"개념",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }

    q={qn:qq.qn,kind:"문제",text:(tmp.textContent||"").replace(/\s+/g," ").trim().slice(0,600),choices:(qq.choices||[]).map(c=>tc(c.html)),my:(ST.answer[qq.id]==null?null:String(ST.answer[qq.id])),revealed:!!ST.done[qq.id],correct:(typeof ST.correct[qq.id]==="boolean"?ST.correct[qq.id]:null),answer:null}; } }
  else label=S.mode;
  post({type:"mc-slide",v:1,gen:CTX_GEN,deck:D.id,title:document.title.slice(0,80),sid:sid,stype:S.mode==="quiz"?"quiz":"concept",part:null,partTitle:document.title.slice(0,60),label:("교실 · "+label).slice(0,80),q:q}); }
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; ctx(); } });
const _render=render; render=function(){ _render(); ctx(); };
/* ---------- 키보드 ---------- */
document.addEventListener("keydown",e=>{ if(e.target&&/TEXTAREA|INPUT/.test(e.target.tagName)) return; if($("#ov").classList.contains("on")){ if(e.key==="Escape") $("#ov").classList.remove("on"); return; }
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); if(e.repeat) return; enter(); }
  else if(/^[1-6]$/.test(e.key)&&S.mode==="quiz"){ const b=$$("#bc .cb")[+e.key-1]; if(b&&!b.disabled) b.click(); } });
/* ---------- 시작 ---------- */
/* 해시: #resume(저장 위치) · #ch=N(챕터 N) · #ch=N.M(챕터 N 의 M 단계) · #quiz · #result */
function boot(){ const m=/^#(resume|ch=(\d+)(?:\.(\d+))?|quiz|result)$/.exec(location.hash||"");
  if(m&&m[1]==="resume"&&L.pos&&!L.done){ return resumeTo(posOf()); }
  else if(m&&m[2]){ const ci=Math.max(0,Math.min(CH.length-1,+m[2]-1)); const si=m[3]?Math.max(0,Math.min(CH[ci].steps.length-1,+m[3]-1)):0; S=Object.assign(S,{mode:"step",ci:ci,si:si,rev:(CH[ci].steps[si]||{}).t==="ex"&&/\.\d+r$/.test(location.hash),resume:!!m[3]}); }
  else if(m&&m[1]==="quiz"&&QZ.length){ S.mode="quiz"; const k=QZ.findIndex(q=>!ST.done[q.id]); S.qi=k<0?0:k; }
  else if(m&&m[1]==="result"){ S.mode="result"; }
  render(); }
