<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공업수학1 · 1~3주차 임시 정리</title>
<!-- 학습게임 지침(학습게임_미적분2.md) v4 템플릿 · 오타 디자인 검토(2026-09-17, RED 14건) 반영
     폰트 2종: 본문 손글씨(Nanum Pen Script, display=block) + 수식·숫자 정자(KaTeX). 5색 고정. 16:10. 상단 진행점·챕터명·n/N, 하단 [힌트] [확인/다음]. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 5색 고정 (지침 §2) */
  --memory:#FFE45C; --caution:#E03131; --concept:#1971C2; --exam:#FF4D8D; --example:#2F9E44;
  /* 무채색 — 종이·글자·선 (의미색 아님) */
  --paper:#FFFFFF; --ink:#111111; --muted:#5F5F5F; --line:#D8D8D8; --soft:#F5F5F5; --bg:#EDEDED;
  /* 폰트 2종 (지침 §1) */
  --font-hand:'Nanum Pen Script','NanumPen',sans-serif;
  --font-num:'KaTeX_Main','Times New Roman',serif;
  /* 글자 크기 3단계 (지침 §1) */
  --fs-title:31px; --fs-body:22px; --fs-note:17px;
}
*{box-sizing:border-box}
:where(h1,h2,h3,h4,p,ul,ol,li,dl,dt,dd,pre,blockquote,figure,figcaption,table,th,td,button,input,textarea,label){margin:0;padding:0;text-indent:0;word-break:keep-all;overflow-wrap:break-word}
html,body{height:100%;width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-hand);font-size:var(--fs-body);line-height:1.45;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
body{display:grid;place-items:center;padding:12px}
.katex{font-size:1em}
#stage{position:relative;width:min(calc(100vw - 24px),calc((100dvh - 24px) * 1.6));aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
/* 상단: 진행점 · 챕터명 · n/N */
#top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) auto;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:var(--fs-note)}
#progress{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.dot{flex:0 0 12px;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.dot.done{background:var(--ink)}
.dot.exam{border-color:var(--exam);background:var(--exam)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
#chapter{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pos{font-family:var(--font-num);white-space:nowrap}
/* 작업 영역 */
#body{min-height:0;overflow:hidden;padding:18px 24px 12px;font-size:var(--fs-body);line-height:1.45}
#body[data-ready="false"]{visibility:hidden}
#body.scrollable{overflow:auto}   /* 시작 위치 장만 — 학습 내용이 아니라 목록이라 스크롤 허용 */
#body h1,#body h2{font-size:var(--fs-title);line-height:1.2;margin-bottom:8px}
#body h3{font-size:var(--fs-body)}
.num{font-family:var(--font-num)}
#fontWarn{position:absolute;left:22px;right:22px;top:58px;border:2px solid var(--caution);background:var(--paper);padding:6px 12px;font-size:var(--fs-note);z-index:12}
#fontWarn[hidden]{display:none}
#body .kicker{font-size:var(--fs-note);color:var(--muted)}
#body p,#body li{margin:0}
#body p+p{margin-top:6px}
#body ul,#body ol{padding-left:22px}
#body :is(.why,.concept,.one,.say,.extra),.ans,.myans-show,.mu>div{margin:8px 0 0;padding:10px 14px}
#body .why,#body .concept{border:2px solid var(--concept)}
#body .say{border-left:4px solid var(--concept);background:var(--soft)}
#body .say b{color:var(--concept)}
#body .one{border-left:4px solid var(--ink);background:var(--soft)}
#body .term{color:var(--concept);border-bottom:1px dashed var(--concept)}
#body .hl{background:var(--memory);padding:0 4px}
#body .red{color:var(--caution)}
#body .star{color:var(--exam)}
#body .tw{overflow:hidden;margin:8px 0 0;border:1px solid var(--line)}
#body table{border-collapse:collapse;width:100%;font-size:var(--fs-body)}
#body th,#body td{padding:3px 10px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
#body thead th{border-top:0;font-size:var(--fs-note);color:var(--muted)}
#body pre{white-space:pre-wrap;font-family:var(--font-num);font-size:var(--fs-note);line-height:1.35}
#body code{font-family:var(--font-num)}
/* 시험 언급 — 최우선 (지침 §3) */
.exam-callout{border:4px solid var(--exam);padding:10px 14px;margin:0 0 10px;background:var(--paper)}
.exam-label{font-size:var(--fs-note);color:var(--exam)}
.exam-label b{color:var(--ink)}
.exam-quote{font-size:var(--fs-body)}
/* 표지·결과 */
.cover .big{font-size:var(--fs-title);line-height:1.2;margin:6px 0 10px}
.cover .sub{font-size:var(--fs-body)}
.score{display:flex;gap:14px;margin:10px 0}
.score .c{border:2px solid var(--ink);padding:10px 16px}
.score .c b{display:block;font-family:var(--font-num);font-size:var(--fs-title)}
/* 암기 vs 이해 */
.mu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mu>div{min-width:0}
.mu-mem{background:var(--memory);border:2px solid var(--memory)}
.mu-und{border:2px solid var(--concept)}
.mu-h{margin-bottom:4px}.mu-h .hint{font-size:var(--fs-note);color:var(--muted);margin-left:6px}
.mu li{margin:2px 0}
/* 문제 */
.q-kind{display:inline-block;font-size:var(--fs-note);border:1px solid var(--ink);padding:0 8px;margin-right:8px;vertical-align:middle}
#body.q-mode{display:flex;flex-direction:column}
#body.q-mode>*{flex:0 0 auto}
.pad{flex:1 1 auto!important;min-height:100px;display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);overflow:hidden;background:var(--paper)}
.pad-bar{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:var(--fs-note);background:var(--soft);flex-wrap:wrap}
.pad-bar .hint{color:var(--muted);margin-right:auto}
.pad-bar button{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.pad-bar button.on{background:var(--ink);color:var(--paper)}
.pad canvas{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:24px 24px}
/* V4-PADPANEL 필기 판 — 「+ 필기」로 여닫음, 문제 아래쪽을 덮는다 */
#padPanel{position:absolute;left:24px;right:24px;top:38%;bottom:72px;background:var(--paper);border:2px solid var(--ink);display:none;flex-direction:column;z-index:16}
#padPanel.on{display:flex}
#padPanel .pad{flex:1 1 auto;margin:0;border:0;min-height:0}
#padBtn.on{background:var(--ink);color:var(--paper)}
/* V4-ANSLB 답·풀이 판 — 작업 영역 전체 */
#anslb{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);display:none;flex-direction:column;z-index:18;padding:14px 24px;overflow:hidden}
#anslb.on{display:flex}
#anslb .ans{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:8px}
#anslb .ans-top{display:flex;align-items:center;gap:10px}
#anslb .ans-top .kicker{margin-right:auto}
.myans{margin-top:8px}.myans label{display:block;font-size:var(--fs-note);color:var(--muted)}
.myans textarea{width:100%;font-family:var(--font-num);font-size:var(--fs-body);line-height:1.35;padding:6px 12px;border:2px solid var(--ink);background:var(--paper);resize:none;outline:none}
.myans textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.myans-show{border:2px dashed var(--ink)}
.myans-txt{font-family:var(--font-num);white-space:pre-wrap}
.ans{border:2px solid var(--example)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;font:inherit;font-size:var(--fs-body);padding:6px 12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:48px}
.choice .cn{flex:0 0 28px;height:28px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:var(--fs-note)}
.choice .ct{min-width:0}
.choice.sel{border-color:var(--ink);border-width:3px}
.choice.ok{border-color:var(--example)}.choice.ok .cn{background:var(--example);border-color:var(--example);color:var(--paper)}
.choice.bad{border-color:var(--caution)}.choice.bad .cn{background:var(--caution);border-color:var(--caution);color:var(--paper)}
.choice[disabled]{cursor:default}
.verdict{padding:6px 14px;border:2px solid var(--ink)}.verdict.ok{border-color:var(--example)}.verdict.bad{border-color:var(--caution);color:var(--caution)}
/* 시작 위치 */
.jump-h{font-size:var(--fs-note);color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jump-part{display:flex;gap:10px;align-items:flex-start;margin:2px 0}
.jump-pt{flex:0 0 220px;font-size:var(--fs-note);padding-top:6px}
.jump-items{display:flex;flex-wrap:wrap;gap:4px}
.jp{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.jp.done{background:var(--ink);color:var(--paper)}.jp.skip{color:var(--muted);text-decoration:line-through;border-color:var(--line)}.jp.cur{border:3px solid var(--ink)}
/* 하단: [이전] [힌트] · 출처 · 동작 · [확인/다음] */
#foot{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:var(--fs-body);min-height:48px;padding:4px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.xs{font-size:var(--fs-note);min-height:36px;padding:2px 12px}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#act{display:flex;gap:8px;align-items:center;margin-left:auto}#act .hint{font-size:var(--fs-note);color:var(--muted)}
#next{margin-left:8px}
#next.undone{background:var(--paper);color:var(--ink);border-style:dashed}
#doneTag{font-size:var(--fs-note);color:var(--muted)}
/* 출처 썸네일 · 확대 */
#srcs{display:flex;gap:6px}
.src-th{position:relative;width:48px;height:48px;padding:0;border:2px solid var(--ink);overflow:hidden;background:var(--paper);cursor:pointer;flex:0 0 auto}
.src-th img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.src-th .src-n{position:absolute;right:0;bottom:0;font-family:var(--font-num);font-size:var(--fs-note);background:var(--ink);color:var(--paper);padding:0 4px}
#srclb{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:20;padding:12px 18px}
#srclb.on{display:flex}
.src-top{display:flex;align-items:center;gap:10px;font-size:var(--fs-note);padding-bottom:8px}.src-top b{color:var(--ink)}.src-top .src-pos{margin-left:auto;font-family:var(--font-num)}
.src-x{font:inherit;font-size:var(--fs-body);min-width:48px;min-height:44px;border:2px solid var(--ink);background:var(--paper);cursor:pointer}
.src-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);touch-action:pan-x pan-y pinch-zoom}
.src-body img{width:100%;height:auto;display:block;cursor:zoom-in}
.src-body img.zoom{width:190%;max-width:none;cursor:zoom-out}
.src-foot{display:flex;align-items:center;gap:10px;padding-top:8px}.src-foot .hint{margin:0 auto;font-size:var(--fs-note);color:var(--muted)}
/* 힌트 상자 */
#hintBox{position:absolute;left:22px;right:22px;bottom:76px;background:var(--paper);border:2px solid var(--ink);padding:10px 14px;z-index:15}
#hintBox[hidden]{display:none}
/* 검사 모드 표시 */
#chk{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);overflow:auto;padding:20px;z-index:30;font-size:var(--fs-note);display:none}

/* ===== V6 UI — 조작부 재설계 (아토 2026-09-21). 본문(손글씨·5색)은 그대로, 조작부만 정자·평면 ===== */
:root{--ui:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;--accent:#4F9A35;--accent-soft:#EAF4E6;--bad:#D23B3B;--bad-soft:#FBEAEA;--line:#E3E8E5;--soft:#F4F6F5;--bg:#EEF1EF;--muted:#6B7570;--ink-3:#8A9490}
body{background:var(--bg)}
#stage{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
/* 상단: 분절 진행 막대 + 정자 라벨 */
#top{padding:12px 20px;gap:14px;font-family:var(--ui);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:#fff}
#progress{gap:3px;flex-wrap:nowrap;overflow:hidden}
.dot{flex:1 1 0;width:auto;min-width:6px;max-width:28px;height:6px;border:0;border-radius:3px;background:var(--line)}
.dot.done{background:var(--accent)}.dot.cur{background:#B7DBA8;outline:0;box-shadow:inset 0 0 0 1px var(--accent)}.dot.exam{background:#FFC2D8}.dot.exam.done{background:var(--exam)}
#chapter{font-family:var(--ui);font-size:13px;font-weight:600;color:#1F2A24}
#pos{font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
/* 본문 상자: 두꺼운 파란 테두리 → 좌측 바 */
#body .why,#body .concept{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
#body .one{border-radius:0 10px 10px 0}#body .say{border-radius:0 10px 10px 0}
#body .tw{border-radius:10px}
.mu-mem{border:0;border-left:3px solid #E5C400;background:#FFF9D6;border-radius:0 10px 10px 0}.mu-und{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
.q-kind{font-family:var(--ui);font-size:12px;font-weight:600;border:0;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
#body .kicker{font-family:var(--ui);font-size:12px;letter-spacing:0;color:var(--ink-3)}
/* 보기 카드 */
.choices{gap:10px;margin-top:12px}
.choice{font-family:var(--font-hand);border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;min-height:56px;transition:border-color .12s,background .12s}
.choice:hover{border-color:#B9C4BE;background:var(--soft)}
.choice .cn{flex:0 0 28px;width:28px;height:28px;border:0;border-radius:50%;background:var(--soft);color:#1F2A24;font-family:var(--ui);font-size:13px;font-weight:600}
.choice.sel{border:2px solid var(--accent);padding:11px 13px}.choice.sel .cn{background:var(--accent);color:#fff}
.choice.ok{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}.choice.ok .cn{background:var(--accent);color:#fff}
.choice.bad{border:2px solid var(--bad);background:var(--bad-soft);padding:11px 13px}.choice.bad .cn{background:var(--bad);color:#fff}
.choice[disabled]:not(.ok):not(.bad){opacity:.55}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 주관식 */
.myans label{font-family:var(--ui);font-size:12px;color:var(--muted)}
.myans textarea{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--ui);font-size:16px;background:#fff}
.myans textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.myans-show{border:1px dashed #B9C4BE;border-radius:12px;background:var(--soft)}
.myans-txt{font-family:var(--ui);font-size:16px}
.myans-note{margin-top:8px}
/* 판정·안내 */
.verdict{font-family:var(--ui);font-size:13px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:var(--soft);color:#1F2A24}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}
#act .hint{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
#doneTag{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
/* 하단 바 · 버튼 */
#foot{padding:10px 16px;gap:8px;border-top:1px solid var(--line);background:#fff}
.btn{font-family:var(--ui);font-size:14px;font-weight:600;min-height:40px;padding:6px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1F2A24;box-shadow:none}
.btn:hover{background:var(--soft)}
.btn.xs{font-size:13px;min-height:36px;padding:4px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
#next{min-width:96px}
#next.undone{background:#fff;color:var(--accent);border:1px solid var(--accent);border-style:solid}
.btn[disabled]{opacity:.35}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#padBtn.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
/* 출처 썸네일 */
#srcs{gap:6px}
.src-th{width:40px;height:40px;border:1px solid var(--line);border-radius:8px}
.src-th .src-n{font-family:var(--ui);font-size:11px;padding:0 5px;border-radius:6px 0 6px 0}
.src-x{font-family:var(--ui);font-size:14px;border:1px solid var(--line);border-radius:10px;min-height:40px}
.src-top{font-family:var(--ui);font-size:13px}.src-body{border-radius:12px}
.src-foot .hint{font-family:var(--ui);font-size:12px}
/* 힌트 · 필기 · 풀이 판 · 글꼴 경고 */
#hintBox{border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
#padPanel{border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
.pad-bar{font-family:var(--ui);font-size:12px;padding:6px 10px;background:var(--soft);border-radius:14px 14px 0 0}
.pad-bar button{font-family:var(--ui);font-size:12px;font-weight:600;min-height:32px;padding:2px 10px;border:1px solid var(--line);border-radius:8px}
.pad-bar button.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
#anslb{padding:16px 24px}
#anslb .ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
.ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
#anslb .ans-top .kicker{font-family:var(--ui);font-size:12px}
#fontWarn{border:1px solid var(--bad);border-radius:10px;font-family:var(--ui);font-size:12px}

<script>
const DECK_ID="em1-w1-3";
const SLIDES=[{"id": "start", "type": "start"}, {"id": "jump", "type": "jump", "part": 0}, {"id": "p1-cover", "type": "cover", "part": 1, "no": "파트 1 · 9/9", "title": "1.4 완전상미분방정식 · 적분인자", "star": false}, {"id": "p1-concept", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (1/14)", "html": "<div class=\"concept\"><p><b>② 칠판 판서 이미지 정리 — 수업 판서 없음</b></p></div><div class=\"concept\"><p><b><code>과제_1.4_판서.jpg</code> — 아토 필기(덱 위)</b></p></div>", "exam": [{"level": "강조", "when": "09/09", "quote": "9/16 \"1장 해법 총정리\"에서 완전미분·적분인자가 1계 해법 5종 중 하나로 재등장. 중간(8주차) 범위."}, {"level": "강조", "when": "09/09", "quote": "정리 1·2 공식과 Ex.5 유형(적분인자 → 초기값)은 공식 암기 + Step 형식이 그대로 점수."}]}, {"id": "p1-concept-2", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (2/14)", "html": "<div class=\"concept\"><pre>9/9 H.W &lt;1.4&gt;  4, 11, 12\n… (eˣ + y)dx + (x − e⁻ʸ)dy = 0    du/… = M = eˣ + …   ← Ex.5 변환 뒤 식</pre></div><div class=\"concept\"><p>→ <b>2주차 과제 = 1.4 #4·11·12</b>(9/11에 1.5 #9·12 추가 → 9/16 제출 완료).</p></div><div class=\"concept\"><p><b>④ 강의자료 정리 (p.29~36)</b></p></div><div class=\"concept\"><p><b>4-1. 완전미분방정식이란 (p.29) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li><code>M(x,y)dx + N(x,y)dy = 0</code> 꼴로 놓았을 때 좌변이 어떤 <b>u(x,y)의 전미분</b> <code>du = u_x dx + u_y dy</code>와 같으면 <b>완전(exact)</b>. 즉 <code>M = ∂u/∂x</code>, <code>N = ∂u/∂y</code>.</li></ul></div>", "exam": []}, {"id": "p1-concept-3", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (3/14)", "html": "<div class=\"concept\"><ul><li>완전이면 <code>du = 0 ⇒ u(x,y) = c</code> — 해가 바로 나온다(음함수 꼴).</li></ul></div><div class=\"concept\"><ul><li>용어: <b>전미분(total differential)</b> — 2변수 함수 u=f(x,y)가 연속 편도함수를 가질 때 <code>du = u_x dx + u_y dy</code>.</li></ul></div><div class=\"concept\"><p><b>4-2. 필요충분조건과 해법 (p.30) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li><b>판별: <code>∂M/∂y = ∂N/∂x</code></b> (∵ 둘 다 u_xy = u_yx).</li></ul></div><div class=\"concept\"><ul><li><b>Case 1</b> (x로 적분): <code>u = ∫M dx + k(y)</code> → <code>∂u/∂y = N</code> 에서 <code>dk/dy</code> → k(y).</li></ul></div>", "exam": []}, {"id": "p1-concept-4", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (4/14)", "html": "<div class=\"concept\"><ul><li><b>Case 2</b> (y로 적분): <code>u = ∫N dy + l(x)</code> → <code>∂u/∂x = M</code> 에서 <code>dl/dx</code> → l(x).</li></ul></div><div class=\"concept\"><ul><li>둘 중 적분이 쉬운 쪽을 고른다.</li></ul></div><div class=\"concept\"><p><b>4-3. Ex.1 (p.31) — <code>cos(x+y)dx + (3y² + 2y + cos(x+y))dy = 0</code></b></p></div><div class=\"concept\"><ul><li>Step 1 판별: M_y = −sin(x+y) = N_x ✓ 완전.</li></ul></div>", "exam": []}, {"id": "p1-concept-5", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (5/14)", "html": "<div class=\"concept\"><ul><li>Step 2: <code>u = ∫cos(x+y)dx + k(y) = sin(x+y) + k(y)</code> → <code>u_y = cos(x+y) + k' = N</code> → <code>k' = 3y² + 2y</code> → <code>k = y³ + y² + c*</code>. <b>∴ u = sin(x+y) + y³ + y² = c</b></li></ul></div><div class=\"concept\"><ul><li>Step 3 검증: u를 x로 미분(y=y(x)) → 원식으로 돌아옴.</li></ul></div><div class=\"concept\"><ul><li><b>교수 풀이 Step 형식(판별 → 해 → 검증)이 곧 채점 형식</b> (과제 제출용 규칙과 동일).</li></ul></div><div class=\"concept\"><p><b>4-4. 예제 (p.32) — 수업 중 풀이 여부 불명(결석)</b></p></div>", "exam": []}, {"id": "p1-concept-6", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (6/14)", "html": "<div class=\"concept\"><ul><li>(1) <code>(x³ + y³)dx + 3xy²dy = 0</code> → M_y = 3y² = N_x ✓ → <code>u = x⁴/4 + xy³ = c</code>.</li></ul></div><div class=\"concept\"><ul><li>(2) <code>(sin y − y sin x)dx + (cos x + x cos y + 2y)dy = 0</code> → M_y = cos y − sin x = N_x ✓ → <code>u = x sin y + y cos x + y² = c</code>. (아톰 계산 — 검산: (1) u_x = x³ + y³, u_y = 3xy² ✓ / (2) u_x = sin y − y sin x, u_y = x cos y + cos x + 2y ✓)</li></ul></div><div class=\"concept\"><p><b>4-5. 적분인자 (p.33) <span class=\"star\">★</span></b></p></div>", "exam": []}, {"id": "p1-concept-7", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (7/14)", "html": "<div class=\"concept\"><ul><li>완전이 아닌 식에 <b>어떤 함수 F(x,y)를 곱해 완전으로 만드는 것</b> = Reduction to Exact Form. 그 F = <b>적분인자(integrating factor)</b>.</li></ul></div><div class=\"concept\"><ul><li>Ex.3: <code>−y dx + x dy = 0</code> — M_y = −1 ≠ N_x = 1 → not exact. <b>1/x²</b> 을 곱하면 <code>−(y/x²)dx + (1/x)dy = 0</code> → M_y = −1/x² = N_x ✓ exact. (u = y/x = c)</li></ul></div><div class=\"concept\"><p><b>4-6. 적분인자 구하기 — 정리 1·2 (p.34) <span class=\"star\">★</span><span class=\"star\">★</span> (시험 공식)</b></p></div>", "exam": []}, {"id": "p1-concept-8", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (8/14)", "html": "<div class=\"concept\"><ul><li>일반적으로 F(x,y)를 찾기는 어렵고, <b>한 변수만의 함수인 적분인자</b>는 쉽다. 식을 <code>P dx + Q dy = 0</code>으로 쓴다.</li></ul></div><div class=\"concept\"><ul><li><b>정리 1 — F = F(x)</b>: <code>FP_y = F'Q + FQ_x</code> 를 FQ로 나누면 <b><code>R(x) = (1/Q)(∂P/∂y − ∂Q/∂x)</code>, <code>F(x) = exp(∫R dx)</code></b> — R이 <b>x만의 함수</b>여야 적용 가능.</li></ul></div><div class=\"concept\"><ul><li><b>정리 2 — F = F(y)</b>: <b><code>R<i>(y) = (1/P)(∂Q/∂x − ∂P/∂y)</i></code>, <code>F(y) = exp(∫R<i> dy)</i></code></b> — R이 <b>y만의 함수</b>여야.</li></ul></div>", "exam": []}, {"id": "p1-concept-9", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (9/14)", "html": "<div class=\"concept\"><ul><li>외우는 법: 분모는 <b>\"곱해지지 않는 쪽\"</b> — F(x)면 x로 미분되는 항이 Q쪽에 붙으니 Q로 나누고, F(y)면 P로 나눈다. 괄호 안 부호는 <code>(P_y − Q_x)</code>와 <code>(Q_x − P_y)</code>로 서로 반대.</li></ul></div>", "exam": []}, {"id": "p1-concept-10", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (10/14)", "html": "<div class=\"concept\"><ul><li>⚠ <b>9/11 교수 정정 \"p가 아니라 q로 고치세요\"</b>: 9/11 정리에는 \"y만의 함수일 때 분모가 q\"로 적혀 있었는데, 이는 <b>위 유도와 Kreyszig 정리 2(1/P)에 어긋난다</b>. 유도해 보면 F(y)일 때 <code>F'P + FP_y = FQ_x ⇒ F'/F = (Q_x − P_y)/P</code> 로 분모는 P가 맞다. 교수의 정정은 <b>정리 1(F(x))의 분모를 판서에서 p로 잘못 쓴 것을 q로 고친 것</b>으로 보는 게 맞다(슬라이드 인쇄본은 처음부터 1/Q). → 9/11 정리 ①을 이 내용으로 고침(2026-09-17).</li></ul></div><div class=\"concept\"><p><b>4-7. Ex.5 (p.35~36) — 초기값 문제 <span class=\"star\">★</span> (과제·시험 유형)</b></p></div>", "exam": []}, {"id": "p1-concept-11", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (11/14)", "html": "<div class=\"concept\"><p><code>(e^(x+y) + ye^y)dx + (xe^y − 1)dy = 0, y(0) = −1</code></p></div><div class=\"concept\"><ul><li>Step 1 판별: P_y = e^(x+y) + e^y + ye^y, Q_x = e^y → 다름 → 완전 아님.</li></ul></div>", "exam": []}, {"id": "p1-concept-12", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (12/14)", "html": "<div class=\"concept\"><ul><li>Step 2 적분인자: R = (1/Q)(P_y − Q_x) = (e^(x+y) + ye^y)/(xe^y − 1) → x만의 함수 아님 → <b>정리 1 적용 불가</b>. R<i> = (1/P)(Q_x − P_y) = (e^y − e^(x+y) − e^y − ye^y)/(e^(x+y) + ye^y) = <b>−1</b> → <code>F</code></i>(y) = e^(−y). 곱하면 <b><code>(eˣ + y)dx + (x − e^(−y))dy = 0</code></b> (← 아토 과제 판서의 식). 검증: ∂/∂y(eˣ + y) = 1 = ∂/∂x(x − e^(−y)) ✓.</li></ul></div>", "exam": []}, {"id": "p1-concept-13", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (13/14)", "html": "<div class=\"concept\"><ul><li>Step 3 일반해: <code>u = ∫(eˣ + y)dx = eˣ + xy + k(y)</code> → <code>u_y = x + k' = x − e^(−y)</code> → <code>k = e^(−y)</code>. <b>일반해 <code>u = eˣ + xy + e^(−y) = c</code></b>.</li></ul></div><div class=\"concept\"><ul><li>Step 4 특수해: y(0) = −1 → <code>u(0, −1) = 1 + 0 + e = 3.72</code>. <b><code>eˣ + xy + e^(−y) = 3.72</code></b> (= 1 + e).</li></ul></div><div class=\"concept\"><ul><li>풀이 수순 = <b>판별 → R 시도 → 안 되면 R* → 곱해서 재검증 → 일반해 → 특수해</b>. 과제 1.4 #4·11·12도 이 틀.</li></ul></div>", "exam": []}, {"id": "p1-concept-14", "type": "concept", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자 (14/14)", "html": "<div class=\"one\">한 줄: 1.4 완전미분방정식 정의 → 필요충분조건 M_y = N_x → 해법 Case 1·2 → Ex.1 → 예제 (1)(2) → 적분인자(Reduction to Exact Form) Ex.3 → 정리 1(F(x))·정리 2(F(y)) → Ex.5 초기값 문제</div>\n", "exam": []}, {"id": "p1-result", "type": "result", "part": 1, "title": "1.4 완전상미분방정식 · 적분인자"}, {"id": "p2-cover", "type": "cover", "part": 2, "no": "파트 2 · 9/11", "title": "1.5 선형 상미분방정식 + 베르누이", "star": false}, {"id": "p2-concept", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (1/16)", "html": "<div class=\"concept\"><p><b>② 1.5 선형 상미분방정식 — 이 수업의 전부</b></p></div><div class=\"concept\"><p><b>선형 판별 (1주차 내용 재확인)</b></p></div>", "exam": [{"level": "강조", "when": "09/11", "quote": "a = 0 또는 1 → 그냥 선형 (이미 배운 공식)"}, {"level": "강조", "when": "09/11", "quote": "그 외 → 비선형. 일반적 해법이 없지만 이건 치환으로 선형이 된다."}]}, {"id": "p2-concept-2", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (2/16)", "html": "<div class=\"concept\"><p>&gt; \"선형과 비선형을 구분하는 방법은 내가 <b>첫 시간에</b> 얘기했죠.\"</p></div><div class=\"concept\"><p><b>y와 그 도함수의 관계가 선형</b> = y의 거듭제곱이 없다. <code>y'+p(x)y = r(x)y²</code> 는 y² 때문에 <b>비선형</b>.</p></div><div class=\"concept\"><p><b>표준형 (standard form) — 먼저 이 꼴로 고친다</b></p></div><div class=\"concept\"><pre>y' + p(x)y = r(x)</pre></div><div class=\"concept\"><p>&gt; \"y' 에 어떤 계수도 붙지 않아야 돼. <b>표준형을 여러분이 일단 알고 있어야 돼요.</b>\"</p></div><div class=\"concept\"><ul><li><code>r(x) = 0</code> → <b>제차(homogeneous)</b> 선형 미방</li></ul></div><div class=\"concept\"><ul><li><code>r(x) ≠ 0</code> → <b>비제차(nonhomogeneous)</b> 선형 미방</li></ul></div><div class=\"concept\"><p><b>r(x)의 공학적 의미</b></p></div>", "exam": [], "scroll": true}, {"id": "p2-concept-3", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (3/16)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>수학</th><th>공학</th></tr></thead><tbody><tr><td>r(x) = 입력 (input) · 구동함수 (driving function)</td><td>외부에서 가한 힘, 기전력</td></tr><tr><td>해 y = 출력 (output) · 응답 (response)</td><td>변위, 전류</td></tr></tbody></table></div></div><div class=\"concept\"><p><b>제차 해 (쉬움 — 변수분리)</b></p></div><div class=\"concept\"><p><code>y' = −p(x)y</code> → <code>dy/y = −p dx</code> →</p></div><div class=\"concept\"><pre>y = c·e^(−∫p dx)</pre></div><div class=\"concept\"><p><b>비제차 해 <span class=\"star\">★</span> 이것만 외우면 된다</b></p></div><div class=\"concept\"><p>적분인자 <code>F = e^(∫p dx)</code> 를 곱해 완전미분형으로 만든 결과.</p></div>", "exam": [], "scroll": true}, {"id": "p2-concept-4", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (4/16)", "html": "<div class=\"concept\"><pre>h = ∫ p(x) dx\n\ny = e^(−h) [ ∫ e^h · r(x) dx + c ]</pre></div><div class=\"concept\"><p>&gt; \"<b>이거 하고 이거는 기억을 하라.</b> ... 저거는 기억하고 있어요. 이게 기억을 못하는데 이제 못 푸는 거야.\" &gt; \"수학의 <b>일정 부분은 외워야 돼요.</b> 형태를 — 완전미방이냐 동차냐 선형이냐 비제차 선형이냐 — 잘 보고서 나가야 된다.\"</p></div><div class=\"concept\"><p><b>③ 풀이 흐름도 — 교수님이 강조한 판별 순서</b></p></div>", "exam": []}, {"id": "p2-concept-5", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (5/16)", "html": "<div class=\"concept\"><pre>MDX + NDY = 0 꼴인가?\n ├─ ∂M/∂y = ∂N/∂x ?  → 예: 완전미방으로 푼다\n │                      아니오 ↓\n ├─ 동차인가?          → 예: y/x = u 치환\n │                      아니오 ↓\n ├─ 적분인자 F 구하기   → x만의 함수? y만의 함수? (시간 많이 걸림)</pre></div><div class=\"concept\"><pre> └─ y' + p(x)y = r(x) 꼴인가?  → 예: ★ 공식 한 방 (h 구하고 대입)</pre></div>", "exam": []}, {"id": "p2-concept-6", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (6/16)", "html": "<div class=\"concept\"><p>&gt; \"이거는 <b>너무 시간이 많이 걸려.</b> 딱 보니까 y'+p(x)y=r(x) 이런 선형 비제차면 <b>공식을 이용하면 된다.</b>\" &gt; \"머릿속에 그림을 쫙 그려가면서 공부를 해라. <b>플로차트</b>를 그려나가기는 어려운 게 아니에요.\"</p></div><div class=\"concept\"><p><b>④ 예제</b></p></div><div class=\"concept\"><p><b><span class=\"star\">★</span> 교재 예제 1 — <b>판서에 별표(☆)가 그려져 있다</b></b></p></div><div class=\"concept\"><p><code>y' + y·tan x = sin 2x</code>, <code>y(0) = 1</code></p></div><div class=\"concept\"><ul><li>p(x) = <b>tan x</b>, r(x) = <b>sin 2x</b> (둘 다 판서에서 동그라미 표시)</li></ul></div><div class=\"concept\"><ul><li>판서 형태: <code>h = ∫p(x)dx = ∫tan x dx = <b>−ln cos x</b></code> (= ln|sec x| 와 같은 식)</li></ul></div>", "exam": [], "scroll": true}, {"id": "p2-concept-7", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (7/16)", "html": "<div class=\"concept\"><ul><li>대입: <code>y(x) = e^(−h)[∫e^h·r dx + c] = e^(−ln cos x)[∫e^(−ln cos x)·sin 2x dx + c]</code></li></ul></div><div class=\"concept\"><ul><li>초기조건 y(0)=1 로 c 결정 → 특수해</li></ul></div><div class=\"concept\"><p>&gt; 교수님이 표준형과 해 공식을 <b>네모로 묶고 별표</b>까지 해 두셨다. 이 한 칸이 1.5절의 전부다.</p></div><div class=\"concept\"><p>&gt; \"탄젠트 적분이 ln sec x 라는 거, <b>외울 필요는 없어요.</b> 중간·기말에 나오면 <b>내가 공식을 알려줄 거예요.</b>\"</p></div><div class=\"concept\"><p><b>연습 3문제 (쉬운 예제)</b></p></div>", "exam": []}, {"id": "p2-concept-8", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (8/16)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th></th><th>문제</th><th>처리</th><th>결과</th></tr></thead><tbody><tr><td>1</td><td><code>x·dy/dx + 2y = 3</code></td><td>x로 나눠 표준형 <code>y' + (2/x)y = 3/x</code>, h = 2 ln x</td><td><code>y = 3/2 + c/x²</code></td></tr><tr><td>2</td><td><span class=\"star\">★</span>정정 <code>y' = 1/(x + y²)</code></td><td>역수를 취해 뒤집는다 <code>dy/dx → dx/dy = x + y²</code>, 정리하면 <code>x' − x = y²</code> → <b>y에 대한 선형</b></td><td><code>x = −y² − 2y − 2 + c·e^y</code></td></tr></tbody></table></div></div>", "exam": []}, {"id": "p2-concept-9", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (9/16)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th></th><th>문제</th><th>처리</th><th>결과</th></tr></thead><tbody><tr><td>3</td><td><code>(1+e^x)y' + e^x·y = 0</code></td><td>표준형 <code>y' + [e^x/(1+e^x)]y = 0</code>, h = ln(1+e^x), r(x)=0</td><td><code>y = c/(1+e^x)</code></td></tr></tbody></table></div></div>", "exam": []}, {"id": "p2-concept-10", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (10/16)", "html": "<div class=\"concept\"><p><b>2번이 핵심 기술.</b> <code>y' = 1/(x+y²)</code> 는 y 에 대해 풀면 선형이 아니다. 그런데 <b>역수를 취해 x 를 y 의 함수로 보면</b> <code>x' − x = y²</code> 라는 깨끗한 선형 방정식이 된다. &gt; \"이것만 봐서는 비선형인데 이렇게 바꿔버리면 선형이 된다라는 거야.\"</p></div><div class=\"concept\"><p>판서 전개: <code>p(y) = −1</code>, <code>r(y) = y²</code> → <code>h = ∫p(y)dy = ∫(−1)dy = −y</code> → <code>x = e^(−h)[∫e^h·r dy + c] = e^(+y)[∫e^(−y)y² dy + c]</code> → <b><code>x = −y² − 2y − 2 + c·e^y</code></b></p></div>", "exam": []}, {"id": "p2-concept-11", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (11/16)", "html": "<div class=\"concept\"><p><b>④(추가 2026-09-16) 강의자료 — 슬라이드 p.1~6 이 9/11 범위 (<code>_강의자료/제1장5절_제2장_2계선형ODE_이기영_61p_아토회차태그.pdf</code>, 아토 태그 <code>(4일차) 9/11(금) [9:10-]</code>~<code>[-10:05]</code>)</b></p></div><div class=\"concept\"><ul><li>p.1 선형/비선형·제차/비제차 분류도. p.2 표준형 <code>y'+py=r</code>, 입력 r(구동함수)·출력 y(응답), 제차 해 <code>y=ce^(−∫p dx)</code>.</li></ul></div><div class=\"concept\"><ul><li>p.3 비제차 해법 = 완전미방 응용: <code>(py−r)dx+dy=0</code> 불완전 → 적분인자 <code>R=(1/Q)(∂P/∂y−∂Q/∂x)=p</code> → <code>F=e^∫p dx</code> → <b><code>y=e^(−h)[∫e^h r dx+c]</code>, <code>h=∫p dx</code></b> (필기체 메모 포함).</li></ul></div>", "exam": []}, {"id": "p2-concept-12", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (12/16)", "html": "<div class=\"concept\"><ul><li>p.4 <b>Ex.1 <code>y'+y tan x=sin 2x, y(0)=1</code></b> → <code>p=tan x, r=2sin x cos x, h=ln|sec x|</code> → <code>y=cos x[2∫sin x dx+c]=c cos x−2cos²x</code> → 초기조건 <code>1=c−2</code> → <b><code>y=3cos x−2cos²x</code></b>. 아래에 <code>∫tan x dx=ln|sec x|=−ln cos x</code> 메모 + 판서 사진(별표 예제) 삽입 — 9/11 정리 ④ 예제 1의 답.</li></ul></div><div class=\"concept\"><ul><li>p.5 예제) (1) <code>x dy/dx+2y=3</code> (2) <code>y'=1/(x+y²)</code> (3) <code>(1+e^x)y'+e^x y=0</code> — 9/11 연습 3문제 원문(연습 3의 원문 확인: <code>(1+e^x)y' + e^x y = 0</code>).</li></ul></div>", "exam": []}, {"id": "p2-concept-13", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (13/16)", "html": "<div class=\"concept\"><ul><li>p.6 Ex.2 RL 회로 모델(그림 19), 초기 전류 0.</li></ul></div><div class=\"concept\"><p><b>⑤ 공학 응용 — RL 회로</b></p></div><div class=\"concept\"><p>키르히호프 법칙 두 개를 먼저 설명:</p></div><div class=\"concept\"><ul><li><b>전류 법칙(KCL)</b>: 한 노드에 들어가고 나가는 전류의 합 = 0. <code>Σi_in = Σi_out</code></li></ul></div><div class=\"concept\"><ul><li><b>전압 법칙(KVL)</b>: 폐회로에서 전압강하의 합 = 가해진 기전력</li></ul></div><div class=\"concept\"><p>예제: <span class=\"star\">★</span>정정 <b>R = 11Ω</b>, E = 48V, L = 0.1H, i(0) = 0 (판서 확인. 녹음에는 \"10일 기록\"으로 잘못 들어갔다)</p></div><div class=\"concept\"><pre>L·i' + R·i = E        →  i' + (R/L)i = E/L</pre></div><div class=\"concept\"><p>독립변수가 t 이므로 p(t) = R/L, r(t) = E/L. <b>똑같은 공식 적용.</b></p></div>", "exam": [], "scroll": true}, {"id": "p2-concept-14", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (14/16)", "html": "<div class=\"concept\"><p>&gt; \"기계공학과인데 회로를 공부해요. ... 2학년 혹은 3학년 때 전기전자 과목도 하나 있을 거야.\"</p></div><div class=\"concept\"><p><b>① 지난 시간 정정 — 교수님이 직접 밝힘</b></p></div><div class=\"concept\"><p>&gt; \"지난 시간에 강의하고 나가는데 ... 교수님 틀린 게 하나 있어요. <b>이게 p가 아니라 q로 고치세요.</b>\"</p></div>", "exam": []}, {"id": "p2-concept-15", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (15/16)", "html": "<div class=\"concept\"><p>1.4 적분인자 공식의 분모 정정. <span class=\"star\">★</span>정정(2026-09-17, 9/9 정리 작성 중 유도로 확인): 처음엔 \"y만의 함수일 때 분모가 q\"로 적었으나 그건 <b>틀린 해석</b>이다. 유도하면 <b>F(x)일 때 <code>R(x) = (1/Q)(∂P/∂y − ∂Q/∂x)</code>(분모 Q)</b>, <b>F(y)일 때 <code>R*(y) = (1/P)(∂Q/∂x − ∂P/∂y)</code>(분모 P)</b> 이고 슬라이드 p.34 인쇄본도 그렇다(Kreyszig 정리 1·2와 동일). 교수의 \"p가 아니라 q\"는 <b>정리 1(F(x))의 분모를 9/9 판서에서 p로 잘못 쓴 것을 q로 고친 것</b>으로 본다. 필기에 R(x)의 분모가 p로 적혀 있으면 q로 고칠 것. 근거·유도: <code>../2026-09-09/정리.md</code> 4-6.</p></div>", "exam": []}, {"id": "p2-concept-16", "type": "concept", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이 (16/16)", "html": "<div class=\"one\">한 줄: 1.4 마무리(적분인자 정정) → 1.5 선형 ODE → 베르누이 방정식 예고</div>\n", "exam": []}, {"id": "p2-result", "type": "result", "part": 2, "title": "1.5 선형 상미분방정식 + 베르누이"}, {"id": "p3-cover", "type": "cover", "part": 3, "no": "파트 3 · 9/16", "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작", "star": false}, {"id": "p3-exam-1", "type": "concept", "part": 3, "title": "시험 언급 (1/3)", "html": "", "exam": [{"level": "강조", "when": "09/16", "quote": "(24:32) \"수학도 일정 부분은 외워야 돼요\" — 외울 것: 적분인자 공식 2개, 선형 해 공식 y = e^(−h)[∫e^h r dx + c], 베르누이 치환 u = y^(1−a)."}, {"level": "강조", "when": "09/16", "quote": "(36:42) 정리 1(중첩 원리)은 교재에 빨간 글씨 — \"제차 선형에만 성립, 비제차·비선형은 안 된다\"를 반례와 함께 강조."}]}, {"id": "p3-exam-2", "type": "concept", "part": 3, "title": "시험 언급 (2/3)", "html": "", "exam": [{"level": "강조", "when": "09/16", "quote": "(50:14) 1차독립 판별 = 비례하면 종속, 안 하면 독립 — 교수가 정정까지 한 지점. 시험용 개념."}, {"level": "강조", "when": "09/16", "quote": "(1:02:07) 차수축소법 예제 1의 표준형·p·q 설정 — \"이걸 기억하고 있는 게 낫겠죠.\""}]}, {"id": "p3-exam-3", "type": "concept", "part": 3, "title": "시험 언급 (3/3)", "html": "", "exam": [{"level": "강조", "when": "09/16", "quote": "진도 메모: 중간까지 실질 7주라 진도를 당김 → 중간고사 범위가 계획(8주차)보다 앞설 수 있음(추정, 확인 필요)."}]}, {"id": "p3-concept", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (1/42)", "html": "<div class=\"concept\"><p><b>② 칠판 판서 이미지 정리 — 9장 (아토 2026-09-16 전달)</b></p></div><div class=\"concept\"><p><b>판서 1 <code>판서_연습1_베르누이_xy프라임더하기y.jpg</code></b></p></div>", "exam": []}, {"id": "p3-concept-2", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (2/42)", "html": "<div class=\"concept\"><pre>                                      y' + p(x)y = r(x)          ← 우상단, 기준형\n(1) xy' + y = 1/y²  →  y' + (1/x)y = (1/x)(1/y²) = (1/x)y⁻²  →  y' = −(1/x) + (1/x)y⁻²   [판서: y 항 계수 −1/x 로 줄임]\n    u ≝ y^(1−a) = y^(1−(−2)) = (y³)                ← 동그라미\n    u' = 3y²(y') = 3y²(−(1/x) + (1/x)y⁻²)\n    (u' + (3/x)u = 3/x)  →  ∫ du/(u−1) = −∫ (3/x) dx        ← 동그라미, 아래에 p(x), r(x) 표시\n        ↳ ln(u−1) = −3 ln x + C</pre></div>", "exam": []}, {"id": "p3-concept-3", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (3/42)", "html": "<div class=\"concept\"><pre>          ln(y³ − 1) = −3 ln x + C = ln(C/x³)\n          y³ = 1 + C/x³                                        ← 밑줄(최종)\n좌측 (선형 공식 경로):\n    h = ∫p(x)dx = ∫(3/x)dx = 3 ln x                             ← 동그라미\n    u = e^(−h)[∫e^h r(x)dx + C] = e^(−3ln x)[∫e^(3ln x)(3/x)dx + C]</pre></div>", "exam": []}, {"id": "p3-concept-4", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (4/42)", "html": "<div class=\"concept\"><ul><li>녹음 복원과 일치. 판서에서 <code>y' = −(1/x) + (1/x)y⁻²</code> 는 실제로는 <code>−(1/x)y</code> 여야 맞다(u' 계산에서 −3y³/x 가 나와야 함). 판서 축약으로 본다.</li></ul></div><div class=\"concept\"><p><b>판서 2 <code>판서_연습2_치환_x더하기y더하기2제곱.jpg</code></b></p></div>", "exam": []}, {"id": "p3-concept-5", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (5/42)", "html": "<div class=\"concept\"><pre>(2) y' = (x + y + 2)²          ← (y) 에 동그라미, 밑줄\n    let u = x + y + 2\n    du/dx = u' = 1 + y' = 1 + u²      ← u', 1+y', 1+u² 각각 동그라미\n    u' − 1 = u²\n    du/dx = u² + 1\n    ∫ du/(u²+1) = ∫ dx                 ← 동그라미</pre></div>", "exam": []}, {"id": "p3-concept-6", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (6/42)", "html": "<div class=\"concept\"><pre>우측: tan⁻¹u = x + C\n      tan⁻¹(x+y+2) = x + C\n      x + y + 2 = tan(x + C)            ← 밑줄(최종)</pre></div><div class=\"concept\"><p><b>판서 3 <code>판서_연습3_치환_지수형.jpg</code></b></p></div>", "exam": []}, {"id": "p3-concept-7", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (7/42)", "html": "<div class=\"concept\"><pre>(3) y' = 1 + e^(y − x + 3)      ← 지수에 동그라미, 밑줄\n    u = y − x + 3\n    u' = (y') − 1 = 1 + e^u − 1 = e^u\n    du/dx = e^u\n    ∫ e^(−u) du = ∫ dx\n우측: −e^(−u) = x + C</pre></div>", "exam": []}, {"id": "p3-concept-8", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (8/42)", "html": "<div class=\"concept\"><pre>      −e^(−(y−x+3)) = x + C\n      e^(−(y−x+3)) + x + C = 0          ← 밑줄(최종, 교수는 이 꼴로 정리)</pre></div><div class=\"concept\"><p><b>판서 4 <code>판서_중첩원리_해공간.jpg</code></b></p></div><div class=\"concept\"><pre>해의 중첩원리 (Superposition principal)        ← 교수 철자 그대로(principle)\n선형성원리 (linearity principal)\ny = (c₁)y₁ + c₂y₂\n그림: 평행사변형 — 축 y₁ · y₂, 꼭짓점 c₁y₁ · c₂y₂, 안쪽 곡선(해 공간)</pre></div>", "exam": []}, {"id": "p3-concept-9", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (9/42)", "html": "<div class=\"concept\"><p><b>판서 5 <code>판서_1차독립_비례판별_정정.jpg</code></b></p></div>", "exam": []}, {"id": "p3-concept-10", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (10/42)", "html": "<div class=\"concept\"><pre>k₁y₁ + k₂y₂ = 0        k₁ = 0, k₂ = 0     ← 밑줄\nk₁y₁ = −k₂y₂\n  y₁ = −(k₂/k₁) y₂     ← 네모+동그라미\n  ↳ 비례관계 → 1차 종속            ← 밑줄 (정정 후)\n  ✗ 비례관계 X → 1차 독립           ← 별표·취소선 = 처음 반대로 적은 것을 지우고 바로잡은 흔적\n가운데: 해 공간 그림 y₁ · y₂ · c₁y₁ + c₂y₂</pre></div>", "exam": []}, {"id": "p3-concept-11", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (11/42)", "html": "<div class=\"concept\"><pre>우측: y₁ = eˣ, y₂ = e⁻ˣ\n      k₁eˣ + k₂e⁻ˣ = 0 , k₁ = k₂ = 0\n      y₁ = −(k₂/k₁) e⁻ˣ → 비례 X        (상수 × e⁻ˣ 는 eˣ 와 비례 안 함 → 1차 독립)\n      옆 칸: 3rd Week H.W. &lt;1.5&gt; 23, 28.</pre></div><div class=\"concept\"><p><b>판서 7 <code>판서_1차독립_예제_지수_쌍곡.jpg</code></b></p></div>", "exam": []}, {"id": "p3-concept-12", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (12/42)", "html": "<div class=\"concept\"><pre>y₁/y₂ = eˣ/e⁻ˣ                      ← (= e^(2x), 상수 아님)\nk₁y₁ + k₂y₂ = 0        k₁ = 0, k₂ = 0\nk₁y₁ = −k₂y₂\n  y₁ = −(k₂/k₁) y₂  = −k₂/k₁        ← 네모+동그라미 (비례상수)\n  y₁*/y₂* = −k₂/k₁ = −sinh x / cosh x   ✗ → 1차 독립     ← 동그라미\n우측: y₁ = eˣ, y₂ = e⁻ˣ / k₁eˣ + k₂e⁻ˣ = 0, k₁ = k₂ = 0 / y₁ = −(k₂/k₁)e⁻ˣ → 비례 ✗</pre></div>", "exam": []}, {"id": "p3-concept-13", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (13/42)", "html": "<div class=\"concept\"><ul><li>쌍곡 예제: 교수는 <code>y₁<i>/y₂</i></code>를 <code>−sinh x/cosh x</code>(= −tanh x) 꼴로 적음. 상수가 아니므로 비례 아님 → 1차 독립 → 기저. (녹음 3-8과 일치)</li></ul></div><div class=\"concept\"><p><b>판서 8 <code>판서_차수축소법_공식.jpg</code></b></p></div><div class=\"concept\"><pre>y₂(x) = (y₁(x)) ∫  e^(−∫p(x)dx) / y₁²(x)  dx        ← y₁(x) 동그라미, 전체 밑줄</pre></div><div class=\"concept\"><p><b>판서 9 <code>판서_차수축소법_예제1_표준형.jpg</code> <span class=\"star\">★</span></b></p></div>", "exam": []}, {"id": "p3-concept-14", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (14/42)", "html": "<div class=\"concept\"><pre>☆ [네모] y₂(x) = (y₁(x)) ∫ e^(−∫p(x)dx) / (y₁²(x)) dx\n              ‖ x                         ‖ x²          ← 예제 1 대입 준비: y₁ = x, y₁² = x²\ny'' − (x/(x²−x)) y' + (1/(x²−x)) y = 0                  ← 동그라미 둘, 아래에 p(x), q(x)\n       ‖ p(x)            ‖ q(x)\n   −x/(x²−x) = −1/(x−1)                                  ← 동그라미</pre></div>", "exam": []}, {"id": "p3-concept-15", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (15/42)", "html": "<div class=\"concept\"><ul><li><b><span class=\"star\">★</span>복원이었던 차수축소법 공식이 판서로 확정.</b> 지수는 <code>−∫p dx</code>(마이너스 있음). 예제 1은 p, q, y₁, y₁²까지 대입 준비만 하고 계산은 금요일.</li></ul></div><div class=\"concept\"><p><b>판서 6 <code>과제_3주차_판서.jpg</code></b></p></div><div class=\"concept\"><pre>3rd Week H.W.\n&lt;1.5&gt;\n   23, 28.</pre></div><div class=\"concept\"><p>→ <b>3주차 정식 과제 = 1.5 #23·#28</b> 두 문제. 2.1 #6·#9는 판서에 없고 구두로 \"한번 해보세\"(1:03:51) — 연습 권장이지 제출 과제로 확인되지 않음.</p></div><div class=\"concept\"><p><b>③ 녹음본 정리 (교정 + 중요도 재구성)</b></p></div><div class=\"concept\"><p><b>3-1. 복습 — 1계 선형 공식과 베르누이 (02:55~05:05)</b></p></div>", "exam": [], "scroll": true}, {"id": "p3-concept-16", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (16/42)", "html": "<div class=\"concept\"><ul><li>표준형 <code>y' + p(x)y = r(x)</code> → <code>h = ∫p dx</code>, <b><code>y = e^(−h)[∫e^h r dx + c]</code></b>. 유도는 r을 넘겨 적분인자로 완전미분형을 만든 것(\"중간 과정은 지난 시간에\").</li></ul></div><div class=\"concept\"><ul><li>베르누이 <code>y' + p(x)y = g(x)·y^a</code>: a = 0, 1이면 선형. 아니면 비선형이지만 <b><code>u = y^(1−a)</code></b> 치환으로 선형이 된다. 비선형 ODE는 일반 해법이 없고, 베르누이는 \"특별한 경우\".</li></ul></div><div class=\"concept\"><p>&gt; \"꼭 y^(1−a)로 치환해야 되느냐, 꼭 그렇지는 않아요. 형태를 따라서 여러분들이 취사선택을 해야 돼요.\" (05:05)</p></div><div class=\"concept\"><p><b>3-2. 연습 3문제 — \"다음 방정식의 해를 치환을 통해 구하시오\" (06:01~19:04)</b></p></div>", "exam": []}, {"id": "p3-concept-17", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (17/42)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>#</th><th>문제</th><th>유형</th><th>치환</th><th>결과</th></tr></thead><tbody><tr><td>1</td><td><code>x·y' + y = 1/y²</code></td><td><b>전형적인 베르누이</b> (a = −2)</td><td><code>u = y³</code></td><td><code>y³ = 1 + c/x³</code></td></tr><tr><td>2</td><td><code>y' = (x + y + 2)²</code></td><td>치환 → 변수분리</td><td><code>u = x + y + 2</code></td><td><code>arctan(x+y+2) = x + c</code> → <code>y = tan(x+c) − x − 2</code></td></tr></tbody></table></div></div>", "exam": []}, {"id": "p3-concept-18", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (18/42)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>#</th><th>문제</th><th>유형</th><th>치환</th><th>결과</th></tr></thead><tbody><tr><td>3</td><td><code>y' = 1 + e^(y − x + 3)</code></td><td>치환 → 변수분리</td><td><code>u = y − x + 3</code></td><td><code>e^(−(y−x+3)) + x + c = 0</code> (판서 최종형)</td></tr></tbody></table></div></div><div class=\"concept\"><p><b>1번 풀이 (교수 순서 그대로)</b></p></div><div class=\"concept\"><ul><li>비선형 확인(<code>1/y²</code>) → x로 나눠 <b>표준형</b>: <code>y' + (1/x)y = (1/x)·y^(−2)</code> → a = −2.</li></ul></div>", "exam": []}, {"id": "p3-concept-19", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (19/42)", "html": "<div class=\"concept\"><ul><li><code>u = y^(1−a) = y³</code>, <code>u' = 3y²y'</code>. <code>y' = −(1/x)y + (1/x)y^(−2)</code> 를 대입: <code>u' = 3y²(−y/x + y^(−2)/x) = −3y³/x + 3/x</code>.</li></ul></div><div class=\"concept\"><ul><li>정리: <b><code>u' + (3/x)u = 3/x</code></b> — \"우리 아침에 배웠던 착한 형태(선형)\".</li></ul></div>", "exam": []}, {"id": "p3-concept-20", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (20/42)", "html": "<div class=\"concept\"><ul><li>두 길 다 됨. (a) <b>변수분리</b>: <code>du/(u−1) = −3 dx/x</code> → <code>ln|u−1| = −3 ln x + c</code> → <code>u − 1 = c/x³</code>. (b) <b>선형 공식</b>: <code>h = ∫3/x dx = 3 ln x</code>, <code>u = e^(−3ln x)[∫e^(3ln x)(3/x)dx + c] = x^(−3)[x³ + c]</code>. 같은 답.</li></ul></div><div class=\"concept\"><ul><li><code>u = y³</code> 되돌리기: <b><code>y³ = 1 + c/x³</code></b>.</li></ul></div>", "exam": []}, {"id": "p3-concept-21", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (21/42)", "html": "<div class=\"concept\"><p>&gt; \"이거 착한 선형 1계 미방으로 풀어도 되고 변수분리로 풀어도 된다. 그거는 여러분들이 선택해서 하는 거예요.\" (11:30) &gt; \"해를 구할 때는 예쁘게 좀 정리를 해보는 게 좋죠. 여기까지 했다고 아주 틀린 건 아니지만 정리하면 강점이 되겠지.\" (15:22)</p></div><div class=\"concept\"><p><b>2번</b>: y²이 있으니 비선형. <code>u = x + y + 2</code> → <code>u' = 1 + y' = 1 + u²</code> → <code>du/(1+u²) = dx</code> → <code>arctan u = x + c</code>. (적분상수는 한쪽에 합침) <b>3번</b>: <code>u = y − x + 3</code> → <code>u' = y' − 1 = e^u</code> → <code>e^(−u)du = dx</code> → <code>−e^(−u) = x + c</code>. \"굉장히 간단해지죠.\"</p></div>", "exam": []}, {"id": "p3-concept-22", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (22/42)", "html": "<div class=\"concept\"><p>정리(19:04): <b>1번 = 전형 베르누이, 2번 = 치환 후 변수분리(베르누이 꼴 아님), 3번 = 치환.</b> \"지난번 숙제에서는 베르누이는 안 내줬죠\" → 이번 과제에 포함(⑦).</p></div><div class=\"concept\"><p><b>3-3. 1장 해법 총정리 (22:11~25:33) — \"1장이 다 끝났다\"</b></p></div><div class=\"concept\"><ul><li><b>변수분리</b> — x는 x끼리, y는 y끼리 → 양변 적분.</li></ul></div><div class=\"concept\"><ul><li><b>동차</b> — 변수분리가 안 되지만 각 항이 동차이면 <code>u = y/x</code> (또는 <code>x = vy</code>) 치환 → 변수분리형.</li></ul></div><div class=\"concept\"><ul><li><b>완전미분방정식</b> — <code>M dx + N dy = 0</code>, <code>∂M/∂y = ∂N/∂x</code> 이면 <code>u(x,y) = const</code>, <code>∂u/∂x = M</code>, <code>∂u/∂y = N</code>.</li></ul></div>", "exam": []}, {"id": "p3-concept-23", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (23/42)", "html": "<div class=\"concept\"><ul><li>완전이 아니면 <b>적분인자</b>: x만의 함수 <code>R(x) = (1/Q)(∂P/∂y − ∂Q/∂x)</code> → <code>F = e^(∫R dx)</code>; y만의 함수 <code>R̃(y) = (1/P)(∂Q/∂x − ∂P/∂y)</code> (9/11에 p→q 정정한 그 공식).</li></ul></div><div class=\"concept\"><ul><li><b>선형</b> <code>y' + p y = r</code> → <code>y = e^(−h)[∫e^h r dx + c]</code>, <code>h = ∫p dx</code>.</li></ul></div><div class=\"concept\"><ul><li><b>베르누이</b> <code>y' + p y = g y^a</code> → <code>u = y^(1−a)</code> → 변수분리 또는 선형.</li></ul></div><div class=\"concept\"><ul><li><b>치환</b> — 식 형태 그대로 묶어 치환(2번·3번처럼).</li></ul></div>", "exam": []}, {"id": "p3-concept-24", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (24/42)", "html": "<div class=\"concept\"><p>&gt; \"수학도 일정 부분은 외워야 돼요. 핀란드식으로 유도가 중요하다고 배웠겠지만, 일정 부분은 외워야.\" (24:32)</p></div><div class=\"concept\"><p><b>3-4. 2장 도입 — 왜 배우나 (26:15~30:19, 응용 이야기)</b></p></div><div class=\"concept\"><ul><li>진도가 빠른 이유: 2학기는 추석·10월 휴일이 많아 <b>중간까지 8주 강의가 실질 7주</b>. 그에 맞춰 당김.</li></ul></div><div class=\"concept\"><ul><li>2계 선형 ODE의 공학적 쓰임: 3학년 <b>진동공학·제어공학 → 로봇</b>, 라플라스 변환도 미분방정식 풀이 도구, 전기전자의 회로 해석. 이번 장에서 자유진동·강제진동·오일러-코시 방정식은 \"맛만 보여줄\" 예정.</li></ul></div><div class=\"concept\"><p><b>3-5. 2.1 2계 선형 ODE — 표준형·분류 (30:19~33:28)</b></p></div>", "exam": []}, {"id": "p3-concept-25", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (25/42)", "html": "<div class=\"concept\"><ul><li><b>표준형</b> <code>y'' + p(x)y' + q(x)y = r(x)</code>. 문제를 풀 땐 <b>먼저 표준형으로</b>(y'' 계수를 1로).</li></ul></div><div class=\"concept\"><ul><li><code>r(x) = 0</code> → <b>제차(homogeneous)</b>, <code>r ≠ 0</code> → <b>비제차</b>. 제차가 쉬우니 제차부터.</li></ul></div><div class=\"concept\"><ul><li>예: <code>y'' + 25y = e^(−x)cos x</code>(슬라이드 기준, 녹음은 sin으로 들림) → 비제차. <code>xy'' + y' + xy = 0</code> → x로 나눠 <code>y'' + (1/x)y' + y = 0</code> → 제차. <code>y·y'' + y'² = 0</code> → 계수에 y, y'의 제곱 → <b>비선형</b>(\"정말 쉽지가 않아\").</li></ul></div><div class=\"concept\"><p><b>3-6. 정리 1 — 중첩(선형성)의 원리 (33:28~38:54) <span class=\"star\">★</span></b></p></div>", "exam": []}, {"id": "p3-concept-26", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (26/42)", "html": "<div class=\"concept\"><ul><li>2계 ODE는 두 번 적분 → 적분상수 2개 → <b>해가 2개</b>(y₁, y₂).</li></ul></div><div class=\"concept\"><ul><li><b>정리 1</b>: 제차 선형 ODE의 두 해 y₁, y₂에 대해 <b>1차결합 <code>c₁y₁ + c₂y₂</code>도 해</b>다. 합도, 상수배도 해. = <b>중첩의 원리(superposition principle) = 선형성의 원리(linearity principle)</b>. 해 공간.</li></ul></div><div class=\"concept\"><ul><li><b>빨간 글씨</b>: 이 정리는 <b>제차 선형에만</b> 성립. 비제차·비선형에서는 안 된다.</li></ul></div><div class=\"concept\"><ul><li>비제차 반례: <code>y'' + y = 1</code> — <code>y₁ = 1 + cos x</code>, <code>y₂ = 1 + sin x</code> 각각은 해지만 합이나 상수배는 해가 아님.</li></ul></div>", "exam": []}, {"id": "p3-concept-27", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (27/42)", "html": "<div class=\"concept\"><ul><li>비선형 반례: <code>y''·y − x·y' = 0</code> — <code>y₁ = x²</code>, <code>y₂ = 1</code> 각각은 해지만 1차결합은 해가 아님.</li></ul></div><div class=\"concept\"><p><b>3-7. 초기치 문제 IVP (38:54~43:30)</b></p></div><div class=\"concept\"><ul><li>적분상수 2개 → <b>초기조건 2개</b>: <code>y(x₀) = K₀</code>, <code>y'(x₀) = K₁</code>. 독립변수는 x(공간) 또는 t(시간).</li></ul></div><div class=\"concept\"><ul><li>공학에서 <b>초기치 = 시간(t=0)</b> 문제. <b>공간</b>이면 <b>경계치 문제(BVP)</b> — <code>x=0</code>과 <code>x=L</code>에서 조건. \"인셜 밸류 중에 바운더리 밸류가 있어요\"는 2·3학년에서.</li></ul></div>", "exam": []}, {"id": "p3-concept-28", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (28/42)", "html": "<div class=\"concept\"><ul><li>예: <code>y'' + y = 0</code>, y(0), y'(0) 주어짐 → 일반해 <code>y = c₁cos x + c₂sin x</code> (y₁ = cos x, y₂ = sin x) → 초기조건 대입해 c₁, c₂ → <b>특수해</b>. (슬라이드 Ex.4: <code>y(0)=3.0, y'(0)=−0.5</code> → <code>y=3.0cos x−0.5sin x</code>)</li></ul></div><div class=\"concept\"><p><b>3-8. 일반해·1차독립·기저 (43:30~54:39) <span class=\"star\">★</span> 교수 정정 있음</b></p></div><div class=\"concept\"><ul><li>제차 일반해 = <code>c₁y₁ + c₂y₂</code>. c₁, c₂는 초기조건으로 → 특수해.</li></ul></div>", "exam": []}, {"id": "p3-concept-29", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (29/42)", "html": "<div class=\"concept\"><ul><li><b>1차독립</b> 정의: 구간 I에서 <code>k₁y₁ + k₂y₂ = 0</code> 이 <b>k₁ = k₂ = 0 일 때만</b> 성립하면 y₁, y₂는 1차독립. 0 아닌 k가 있으면 1차종속.</li></ul></div><div class=\"concept\"><ul><li>판별법(50:14 <b>정정</b>): 처음엔 반대로 말했다가 바로잡음 — &gt; \"비례 관계가 되면 1차 <b>종속</b>이 되고, 비례 관계가 없으면 1차 <b>독립</b>이에요. 반대로 얘기했어요.\" 즉 <code>y₁/y₂ = const</code>(비례)면 종속, 상수가 아니면 독립.</li></ul></div><div class=\"concept\"><ul><li>1차독립인 두 해 = 제차 방정식의 <b>기저(basis) / 기본계(fundamental system)</b>. 기저의 1차결합 전체가 해 공간.</li></ul></div>", "exam": []}, {"id": "p3-concept-30", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (30/42)", "html": "<div class=\"concept\"><ul><li>예제: <code>y'' − y = 0</code>의 기저임을 보여라 — (a) <code>y₁ = e^x, y₂ = e^(−x)</code>: 대입하면 각각 해, <code>y₁/y₂ = e^(2x)</code> 상수 아님 → 독립 → 기저. (b) <code>y₁<i> = cosh x, y₂</i> = sinh x</code>: 대입하면 해, <code>y₁<i>/y₂</i> = coth x</code>(교수는 <code>−k₂/k₁ = tanh x</code> 꼴로) 상수 아님 → 독립 → 기저.</li></ul></div><div class=\"concept\"><ul><li>\"공수2에서도 1차독립·1차종속 얘기를 들어볼 거예요.\"</li></ul></div><div class=\"concept\"><p><b>3-9. 차수축소법 (Reduction of order) 소개 (54:39~1:03:41)</b></p></div>", "exam": []}, {"id": "p3-concept-31", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (31/42)", "html": "<div class=\"concept\"><ul><li>상황: 제차 <code>y'' + p y' + q y = 0</code>에서 <b>한 해 y₁을 안다</b> → 둘째 해 <b><code>y₂ = u·y₁</code></b> 로 놓고 구한다.</li></ul></div><div class=\"concept\"><ul><li>유도: <code>y₂' = u'y₁ + uy₁'</code>, <code>y₂'' = u''y₁ + 2u'y₁' + uy₁''</code>. 대입·정리하면 <code>u''y₁ + u'(2y₁' + p y₁) + u(y₁'' + p y₁' + q y₁) = 0</code>. 마지막 괄호는 y₁이 해이므로 <b>0</b>. → <code>u''y₁ + u'(2y₁' + p y₁) = 0</code>.</li></ul></div><div class=\"concept\"><ul><li><code>U = u'</code> 로 놓으면 <b>1계 선형 = 변수분리형</b> <code>U' + (2y₁'/y₁ + p)U = 0</code> → 적분해 U → 다시 적분해 u → <code>y₂ = u y₁</code>.</li></ul></div>", "exam": []}, {"id": "p3-concept-32", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (32/42)", "html": "<div class=\"concept\"><ul><li>공식(58:57, 판서 8·9로 확정): <b><code>y₂ = y₁ ∫ (1/y₁²)·e^(−∫p dx) dx</code></b>. \"이 해(y₁)를 알면 여기에 집어넣고 y₂를 만들어낼 수 있다.\"</li></ul></div><div class=\"concept\"><ul><li><b>예제 1(교재 2.1 예제)</b>: <code>(x² − x)y'' − xy' + y = 0</code>, <code>y₁ = x</code>. 표준형: <code>y'' − x/(x²−x)·y' + 1/(x²−x)·y = 0</code> → <code>p = −x/(x²−x) = −1/(x−1)</code>, <code>q = 1/(x²−x)</code>. 여기까지 설정하고 <b>계산은 금요일</b>. \"이걸 기억하고 있는 게 낫겠죠.\" (슬라이드 p.19에는 답 <code>y₂ = x ln|x| + 1</code>까지 있음 — ④)</li></ul></div>", "exam": []}, {"id": "p3-concept-33", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (33/42)", "html": "<div class=\"concept\"><ul><li>다음 금요일(9/18): 차수축소법 유도 다시 + 이를 이용한 일반 해법(상수계수 등) 전개.</li></ul></div><div class=\"concept\"><p><b>여담 시간대 (학습 내용 아님)</b></p></div><div class=\"concept\"><ul><li>24:32~25:10 핀란드식 교육·암기 이야기 · 26:15~30:19 진동·제어·로봇·라플라스 응용 안내(개념만) · 38:54 \"수학 배우는 느낌\".</li></ul></div><div class=\"concept\"><p><b>④ 강의자료 정리 — 교수 슬라이드 <code>_강의자료/제1장5절_제2장_2계선형ODE_이기영_61p_아토회차태그.pdf</code></b></p></div><div class=\"concept\"><p>아토가 슬라이드에 회차 태그를 붙여 뒀다: <code>(4일차) 9/11(금) [9:10-]</code> p.1 · <code>[-10:05]</code> p.6 · <code>(5일차) 9/16(수) [9:00-]</code> p.7 · <code>[9:00-10:10]</code> p.19. <b>이날 범위 = p.7~19.</b></p></div>", "exam": []}, {"id": "p3-concept-34", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (34/42)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>p</th><th>슬라이드</th><th>녹음·판서와의 대응</th></tr></thead><tbody><tr><td>7</td><td>1.5 Bernoulli — <code>y'+py=gy^a< 원리</b>(빨간 박스) + \"비제차·비선형에서는 성립하지 않는다\"(빨강). Ex.2 <code>y''+y=1</code>: <code>1+cos x</code>, <code>1+sin x</code> 각각 해, 합·<code>2(1+cos x)</code>·<code>5(1+sin x)</code>는 해 아님. Ex.3 <code>y''y−xy'=0</code>: <code>x²</code>, <code>1</code> 해, 합·<code>−x²</code>는 해 아님. 아토 필기 <code>y=c₁y₁+c₂y₂</code></td><td>3-6 = 판서 4</td></tr><tr><td>15</td><td>초기값 문제: <code>y(x₀)=K₀, y'(x₀)=K₁</code>. <b>Ex.4 <code>y''+y=0, y(0)=3.0, y'(0)=−0.5</code></b> → Step1 일반해 <code>c₁cos x+c₂sin x</code> → Step2 <code>c₁=3.0, c₂=−0.5</code> → <b><code>y=3.0cos x−0.5sin x</code></b></td><td>3-7 (녹음에 없던 초기값 확정)</td></tr></tbody></table></div></div>", "exam": []}, {"id": "p3-concept-38", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (38/42)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>p</th><th>슬라이드</th><th>녹음·판서와의 대응</th></tr></thead><tbody><tr><td>16</td><td>(정의) 일반해 <code>y=c₁y₁+c₂y₂</code>(비례하지 않는 y₁,y₂) · 특수해 · 기저/기본계 · <b>1차독립</b> <code>k₁y₁+k₂y₂=0 ⇒ k₁=k₂=0</code> · 1차종속</td><td>3-8 = 판서 5·7</td></tr><tr><td>17</td><td>예제) <code>y''−y=0</code>의 기저임을 보이시오 (1) <code>e^x, e^(−x)</code> (2) <code>cosh x, sinh x</code></td><td>판서 7</td></tr></tbody></table></div></div>", "exam": []}, {"id": "p3-concept-39", "type": "concept", "part": 3, "title": "베르누이 연습 3제 + 1장 총정리 → 2장 2계 선형 ODE 시작 (39/42)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>p</th><th>슬라이드</th><th>녹음·판서와의 대응</th></tr></thead><tbody><tr><td>18</td><td><b>차수축소법</b> 유도: <code>y₂=uy₁</code> → <code>u''y₁+u'(2y₁'+py₁)=0</code> (∵ y₁ 해) → <code>U=u'</code> → <code>U'+(2y₁'/y₁+p)U=0</code> 변수분리 → `ln</td><td>U</td><td>=−2ln</td><td>y₁</td><td>−∫p dx<code> → <b></b></code>U=(1/y₁²)e^(−∫p dx)<code>, </code>y₂=y₁∫U dx`</td><td>3-9 = 판서 8</td></tr><tr><td>19</td><td><b>Ex.7</b> <code>(x²−x)y''−xy'+y=0</code>, <code>y₁=x</code> → <code>p=−x/(x²−x)=−1/(x−1)</code> → `U=(1/x²)e^(∫dx/(x−1))=(1/x²)e^(ln</td><td>x−1</td><td>)=(x−1)/x²=1/x−1/x²<code> → **</cod /* V5A-RESUME: 마지막 학습 위치 — 앱의 「이어서 학습하기」 카드가 읽는다 (아토 2026-09-21). #check(빌드 검사) 중에는 쓰지 않는다 */
const LAST_KEY="mc-slides-last";
function lastInfo(){
  const s=SLIDES[Math.max(0,Math.min(ST.idx,SLIDES.length-1))]; if(!s) return null;
  const p=s.part?PARTS.find(x=>x.n===s.part):null; const qs=SLIDES.filter(x=>x.type==="q");

  const where= s.type==="q"?((s.kind||"")+" 문제 · "+(s.qn||"")).trim() : s.type==="concept"?("개념 · "+clean(s.title)) : s.type==="mu"?"암기 vs 이해" : s.type==="cover"?"파트 시작" : s.type==="result"?"파트 결과" : s.type==="final"?"전체 결과" : s.type==="jump"?"시작 위치 고르기" : "표지";
  return {deck:DECK_ID,title:document.title,href:location.href.split("#")[0],idx:ST.idx,n:SLIDES.length,sid:s.id,part:s.part||null,partTitle:p?clean(p.title):"",where:where,qDone:qs.filter(q=>ST.done[q.id]).length,qN:qs.length,ts:Date.now()};
}
const save=()=>{ if(location.hash==="#check") return; /* 빌드 검사 상태는 저장하지 않는다(오타 RED 2026-09-21) */ try{ localStorage.setItem(KEY,JSON.stringify(ST)); const li=lastInfo(); if(li){ const j=JSON.stringify(li); localStorage.setItem(LAST_KEY,j); localStorage.setItem(LAST_KEY+"-"+DECK_ID,j); } }catch(e){} };
window.addEventListener("pagehide",()=>{ try{ save(); }catch(e){} });
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const partOf=n=>PARTS.find(p=>p.n===n)||null;
const num=v=>'<span class="num">'+esc(v)+'</span>';   /* UI 숫자는 정자(지침 §1) */
function partScore(p){ ST.skip=ST.skip||{}; const qs=SLIDES.filter(s=>s.type==="q"&&s.part===p&&!ST.skip[s.id]); const b=qs.filter(q=>q.kind==="기초"), a=qs.filter(q=>q.kind==="응용");
  const cnt=arr=>({n:arr.length,ok:arr.filter(q=>ST.correct[q.id]===true).length,done:arr.filter(q=>ST.done[q.id]).length});
  return {b:cnt(b),a:cnt(a)}; }
function partDone(p){ return SLIDES.filter(s=>s.part===p&&s.type!=="result").every(s=>ST.done[s.id]); }

/* ---------- 수식: KaTeX (지침 §1). 렌더 끝나기 전엔 작업 영역을 감춘다(§0 raw LaTeX 노출 금지) ---------- */
function typeset(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true},{left:"$$",right:"$$",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  }
  const cl=el.cloneNode(true); cl.querySelectorAll(".katex,.katex-display").forEach(k=>k.remove());
  const raw=/\\\(|\\\[|\\frac|\\vec|\\begin\{|\$\$/.test(cl.textContent||"");
  el.dataset.raw=raw?"1":"0";
  if(raw&&el.id==="body"){ el.dataset.ready="false"; el.innerHTML='<div class="kicker">수식 오류</div><h2>이 장의 수식이 그대로 드러나 표시를 멈췄습니다</h2><p>정리노트의 수식 표기를 고쳐 다시 만들어야 합니다.</p>'; }
  el.dataset.ready="true";
  return !raw;
}

/* ---------- 풀이 메모장 (손글씨 캔버스 · 애플펜슬) ---------- */
const PAD={tool:"pen",cv:null,ctx:null,id:null,cur:null,ro:null,dpr:1,W:0,H:0};
function padStrokes(id){ ST.ink=ST.ink||{}; if(!ST.ink[id]) ST.ink[id]={strokes:[]}; return ST.ink[id].strokes; }
function padResize(){ const cv=PAD.cv; if(!cv||!cv.isConnected) return; const r=cv.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  PAD.dpr=Math.min(3,window.devicePixelRatio||1); PAD.W=r.width; PAD.H=r.height; cv.width=Math.round(r.width*PAD.dpr); cv.height=Math.round(r.height*PAD.dpr);
  PAD.ctx=cv.getContext("2d"); PAD.ctx.setTransform(PAD.dpr,0,0,PAD.dpr,0,0); PAD.ctx.lineCap="round"; PAD.ctx.lineJoin="round"; padRedraw(); }
function padLine(ctx,t,x0,y0,x1,y1,p){ if(!ctx) return; const W=PAD.W; ctx.globalCompositeOperation=t==="e"?"destination-out":"source-over"; ctx.strokeStyle="#111111";
  ctx.lineWidth=t==="e"?W*0.03:Math.max(1.2,W*0.0035*(0.6+(p||0.5)*1.2)); ctx.beginPath(); ctx.moveTo(x0*W,y0*W); ctx.lineTo(x1*W,y1*W); ctx.stroke(); }
function padRedraw(){ const ctx=PAD.ctx; if(!ctx) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,PAD.cv.width,PAD.cv.height); ctx.restore();
  for(const st of padStrokes(PAD.id)){ const c=st.c; if(c.length<3) continue; if(c.length===3){ padLine(ctx,st.t,c[0],c[1],c[0]+0.0005,c[1],c[2]); continue; }
    for(let i=3;i<c.length;i+=3) padLine(ctx,st.t,c[i-3],c[i-2],c[i],c[i+1],c[i+2]); } }
function padPt(e){ const r=PAD.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/PAD.W*1000)/1000, Math.round((e.clientY-r.top)/PAD.W*1000)/1000, Math.round((e.pressure||0.5)*100)/100]; }
function padAllowed(e){ return e.pointerType==="pen"||e.pointerType==="mouse"||(e.pointerType==="touch"&&ST.finger); }
function mountPad(id){
  const cv=$("#pad"); if(!cv) return; PAD.cv=cv; PAD.id=id; PAD.cur=null;
  cv.onpointerdown=e=>{ if(!padAllowed(e)) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} const pt=padPt(e); PAD.cur={t:PAD.tool==="eraser"?"e":"p",c:pt.slice()}; padLine(PAD.ctx,PAD.cur.t,pt[0],pt[1],pt[0]+0.0005,pt[1],pt[2]); };
  cv.onpointermove=e=>{ if(!PAD.cur||!padAllowed(e)) return; e.preventDefault(); const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(const ev of evs){ const pt=padPt(ev), c=PAD.cur.c, n=c.length; padLine(PAD.ctx,PAD.cur.t,c[n-3],c[n-2],pt[0],pt[1],pt[2]); c.push(pt[0],pt[1],pt[2]); } };
  const end=()=>{ if(!PAD.cur) return; padStrokes(id).push(PAD.cur); PAD.cur=null; save(); };
  cv.onpointerup=end; cv.onpointercancel=end; cv.onpointerleave=e=>{ if(PAD.cur&&e.pointerType!=="pen") end(); };
  cv.oncontextmenu=e=>e.preventDefault();
  const bar=cv.previousElementSibling;
  bar.querySelectorAll("[data-tool]").forEach(b=>{ b.onclick=()=>{ PAD.tool=b.dataset.tool; bar.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b)); }; });
  bar.querySelector('[data-act="undo"]').onclick=()=>{ padStrokes(id).pop(); save(); padRedraw(); };
  bar.querySelector('[data-act="clear"]').onclick=()=>{ if(!padStrokes(id).length||confirm("이 문제의 풀이 메모를 지울까요?")){ ST.ink[id]={strokes:[]}; save(); padRedraw(); } };
  bar.querySelector('[data-act="finger"]').onclick=function(){ ST.finger=!ST.finger; save(); this.classList.toggle("on",ST.finger); };
  if(window.ResizeObserver){ PAD.ro=new ResizeObserver(()=>padResize()); PAD.ro.observe(cv); }
  setTimeout(padResize,30);
}

/* ---------- 필기 판 여닫기 (V4-PADPANEL) ---------- */
function openPad(id){ const pp=$("#padPanel"); pp.classList.add("on"); $("#padBtn").classList.add("on"); const fb=pp.querySelector('[data-act="finger"]'); if(fb) fb.classList.toggle("on",!!ST.finger); mountPad(id); const cb=pp.querySelector('[data-act="close"]'); if(cb) cb.onclick=closePad; }

/* ---------- 시험 언급 상자 (지침 §3) ---------- */
function examHTML(s){
  const list=Array.isArray(s.exam)?s.exam:[]; if(!list.length) return "";
  return list.map(x=>'<aside class="exam-callout" aria-label="시험 언급"><div class="exam-label"><b>📌 시험 언급</b> · '+esc(x.level||"강조")+(x.when?' · '+esc(x.when):'')+'</div><blockquote class="exam-quote">"'+esc(x.quote||"")+'"</blockquote></aside>').join("");
}

/* ---------- 시작 위치 점프 ---------- */
function startFrom(id,mode){
  const n=SLIDES.findIndex(x=>x.id===id); if(n<0) return;
  ST.skip=ST.skip||{}; mode=mode||"skip";
  if(mode!=="at") SLIDES.forEach((x,i)=>{ if(i<n&&x.type!=="start"&&x.type!=="jump"&&!ST.done[x.id]){ ST.done[x.id]=true; if(mode==="skip") ST.skip[x.id]=true; } });
  ST.idx=n; save(); render();
}
function unskipAll(){ ST.skip=ST.skip||{}; Object.keys(ST.skip).forEach(k=>{ delete ST.done[k]; }); ST.skip={}; save(); render(); }
function jumpListHTML(){
  ST.skip=ST.skip||{};
  const rows=[]; let cur=null;
  SLIDES.forEach((x,i)=>{
    if(x.type==="cover"){ cur={part:x.part,title:x.title,items:[]}; rows.push(cur); return; }
    if(!cur) return;
    if(x.type==="concept"||x.type==="mu"||x.type==="q"){
      const lab= x.type==="concept"?(x.title||"개념"): x.type==="mu"?"암기 vs 이해": x.qn;
      const st= ST.skip[x.id]?"skip": ST.done[x.id]?"done": (i===ST.idx?"cur":"");
      cur.items.push('<button class="jp '+st+'" data-jump="'+x.id+'">'+esc(lab)+'</button>');
    }
  });
  const nSkip=Object.keys(ST.skip).length;
  return '<div class="jump"><div class="jump-h">아는 부분은 건너뛰고 막히는 곳부터. 누른 장 앞은 전부 「건너뜀」이 되고 채점에서 빠진다.'+
    (nSkip?'<button class="btn xs" id="unskip">건너뜀 '+num(nSkip)+'장 되돌리기</button>':'')+'</div>'+
    rows.map(r=>'<div class="jump-part"><div class="jump-pt">파트 '+num(r.part)+' · '+esc(String(r.title).replace(/[\s★]+$/,""))+'</div><div class="jump-items">'+r.items.join("")+'</div></div>').join("")+'</div>';
}

/* ---------- 출처 발췌 ---------- */
function renderSrc(s){

  box.innerHTML=list.map((x,i)=>'<button class="src-th" data-si="'+i+'" title="'+esc(x.label||"출처")+'"><img src="'+esc(x.img)+'" alt="" loading="lazy"><span class="src-n">'+(i+1)+'</span></button>').join("");
  box.querySelectorAll(".src-th").forEach(b=>{ b.onclick=()=>openSrc(list,+b.dataset.si); });
}
function openSrc(list,i){
  let lb=$("#srclb"); if(!lb){ lb=document.createElement("div"); lb.id="srclb"; $("#stage").appendChild(lb); }
  const x=list[i];
  lb.innerHTML='<div class="src-top"><b>출처</b><span>'+esc(x.label||"")+'</span><span class="src-pos">'+(i+1)+' / '+list.length+'</span><button class="src-x" aria-label="닫기">✕</button></div>'+
    '<div class="src-body"><img src="'+esc(x.img)+'" alt="'+esc(x.label||"")+'"></div>'+
    '<div class="src-foot"><button class="btn xs" id="srcPrev"'+(i<=0?" disabled":"")+'>← 이전 출처</button><span class="hint">사진을 누르면 확대 · 드래그로 이동</span><button class="btn xs" id="srcNext"'+(i>=list.length-1?" disabled":"")+'>다음 출처 →</button></div>';

/* ---------- 답·풀이 판 ---------- */
function openAns(s){
  let lb=$("#anslb"); if(!lb){ lb=document.createElement("div"); lb.id="anslb"; $("#stage").appendChild(lb); }
  const my=(ST.answer||{})[s.id]; const mc=Array.isArray(s.choices)&&s.choices.length>0;
  const mine= mc ? (s.choices[+my]?'<span class="num">'+(+my+1)+'</span>번 — '+s.choices[+my].html:'') : esc(my||"");
  lb.innerHTML='<div class="ans-top"><span class="kicker">'+esc(s.qn)+'</span><span class="verdict '+(ST.correct[s.id]===true?"ok":ST.correct[s.id]===false?"bad":"")+'">'+(ST.correct[s.id]===true?"정답":ST.correct[s.id]===false?"오답":"내 답")+'</span><button class="src-x" id="ansX" aria-label="닫기">✕</button></div>'+
    '<div class="myans-show"><div class="kicker">내 답</div><div class="myans-txt">'+mine+'</div></div>'+
    '<div class="ans"><div class="kicker">답 · 풀이</div>'+s.ans+'</div>';
  lb.classList.add("on"); $("#ansX").onclick=()=>lb.classList.remove("on"); typeset(lb);
}
/* ---------- 상단 진행점 (파트 안의 단계 · 시험 언급은 핑크) ---------- */
function renderTop(s){
  const inPart=s.part?SLIDES.filter(x=>x.part===s.part&&x.type!=="cover"&&x.type!=="result"):[];
  $("#progress").innerHTML=inPart.map(x=>'<span class="dot'+(ST.done[x.id]?" done":"")+(Array.isArray(x.exam)&&x.exam.length?" exam":"")+(x.id===s.id?" cur":"")+'"></span>').join("");
  const p=partOf(s.part); $("#chapter").textContent=p?("파트 "+p.n+" · "+String(p.title).replace(/[\s★]+$/,"")):"공업수학1 · 1~3주차 임시 정리";
  $("#pos").textContent=(ST.idx+1)+" / "+SLIDES.length;
}

/* ---------- 힌트: 문제 장에서는 그 파트의 한 줄 요약, 개념 장에서는 없음 ---------- */
function hintFor(s){ const p=partOf(s.part); if(s.type==="q"&&p&&p.hint) return p.hint; return null; }

function render(){
  const i=Math.max(0,Math.min(ST.idx,SLIDES.length-1)); ST.idx=i; const s=SLIDES[i]; const body=$("#body"), act=$("#act");
  body.dataset.ready="false"; $("#hintBox").hidden=true; { const al=$("#anslb"); if(al) al.classList.remove("on"); } /* V4-ANSLB */
  act.innerHTML=""; ST.skip=ST.skip||{}; $("#doneTag").textContent=ST.skip[s.id]?"건너뜀":ST.done[s.id]?"완료":"";
  body.classList.remove("q-mode","rev","scrollable"); closePad(); $("#padBtn").hidden=true;
  renderTop(s); if(s.scroll) body.classList.add("scrollable");   /* --soft 임시 덱: 넘친 장만 스크롤 */
  if(s.type==="start"){
    body.innerHTML='<div class="cover"><div class="kicker">학습 슬라이드 · 가로 화면</div><div class="big">공업수학1 · 1~3주차 임시 정리</div>'+
      '<div class="sub">오른쪽 아래 「다음」으로 언제든 넘어갈 수 있고, 페이지를 끝내면 「다음」이 실선이 됩니다. 기초 문제는 보기를 누르고, 답이 여러 개인 문제는 답을 씁니다. 왼쪽 아래 「힌트」는 그 파트의 한 줄 요약, 작은 사진은 출처(학습지·내 풀이본)입니다.</div>'+
      '<div class="sub">파트 '+num(PARTS.length)+'개 · 문제 '+num(SLIDES.filter(x=>x.type==="q").length)+'개</div></div>';
    act.innerHTML='<button class="btn xs" id="reset">진행 기록 지우기</button>';
    $("#reset").onclick=()=>{ if(confirm("진행 기록을 지울까요?")){ ST={idx:0,done:{},correct:{},revealed:{},answer:{},ink:{},finger:false,padBig:false,skip:{}}; save(); render(); } };
    ST.done[s.id]=true;
  } else if(s.type==="jump"){
    body.classList.add("scrollable"); body.innerHTML='<div class="kicker">시작 위치</div><h2>어디서부터 할까?</h2>'+jumpListHTML();
    body.querySelectorAll("[data-jump]").forEach(b=>{ b.onclick=()=>startFrom(b.dataset.jump); }); const u=$("#unskip"); if(u) u.onclick=unskipAll;
    act.innerHTML='<button class="btn" id="ok">처음부터 차례로</button>'; $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };
    ST.done[s.id]=true;
  } else if(s.type==="cover"){
    body.innerHTML=examHTML(s)+'<div class="cover"><div class="kicker">'+esc(s.no)+'</div><div class="big">'+esc(String(s.title).replace(/[\s★]+$/,""))+'</div><div class="sub">개념 → 암기 vs 이해 → 기초 문제 → 응용 문제 순서로 갑니다.</div></div>';
    act.innerHTML='<button class="btn" id="ok">시작</button>'; $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); go(1); };
  } else if(s.type==="concept"){
    body.innerHTML=examHTML(s)+'<div class="kicker">'+(s.part?'파트 '+num(s.part)+' · 개념':'')+'</div><h2>'+esc(s.title)+'</h2>'+s.html;
    act.innerHTML='<button class="btn" id="ok">'+(ST.done[s.id]?"다시 읽음 표시":"읽었어요 — 이해했습니다")+'</button>';
    $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); render(); };
  } else if(s.type==="mu"){
    const li=xs=>xs.map(x=>'<li>'+x+'</li>').join("");
    body.innerHTML=examHTML(s)+'<div class="kicker">파트 '+num(s.part)+' · 암기 vs 이해</div><h2>'+esc(String(s.title).replace(/[\s★]+$/,""))+' — 무엇을 외우고 무엇을 이해하나</h2>'+
      '<div class="mu"><div class="mu-mem"><div class="mu-h">암기할 것 <span class="hint">외워서 바로 나와야</span></div><ul>'+li(s.mem)+'</ul></div>'+
      '<div class="mu-und"><div class="mu-h">이해할 것 <span class="hint">왜 그런지 설명할 수 있어야</span></div><ul>'+li(s.und)+'</ul></div></div>';
    act.innerHTML='<button class="btn" id="ok">'+(ST.done[s.id]?"다시 확인 표시":"구분했어요")+'</button>';
    $("#ok").onclick=()=>{ ST.done[s.id]=true; save(); render(); };
  } else if(s.type==="q"){
    const rev=!!ST.revealed[s.id];
    ST.answer=ST.answer||{}; ST.ink=ST.ink||{}; const my=ST.answer[s.id]||"";
    const mc=Array.isArray(s.choices)&&s.choices.length>0;
    body.classList.add("q-mode"); body.classList.toggle("rev",rev);
    const choiceHTML=()=>'<div class="choices'+(rev?" rev":"")+'">'+s.choices.map((c,i)=>{ const sel=String(my)===String(i); const cls=(sel?" sel":"")+(rev?(c.ok?" ok":(sel?" bad":"")):"");
      return '<button class="choice'+cls+'" data-ci="'+i+'"'+(rev?" disabled":"")+'><span class="cn">'+(i+1)+'</span><span class="ct">'+c.html+'</span></button>'; }).join("")+'</div>';
    body.innerHTML=examHTML(s)+'<div class="kicker">파트 '+num(s.part)+'</div><h2><span class="q-kind">'+s.kind+'</span>'+esc(s.qn)+'</h2><div class="qbody">'+s.html+'</div>'+
