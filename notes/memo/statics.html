<script>/* 김주영 스앵님 판정 (대표님 2026-09-29 「개념 마인드맵은 스앵님이 학습을 통해 내가 뭘 알고 뭘 모르는지 알아서 파악」) — 원본은 이 파일 하나.
   빌더가 교실·수업 노트·학습 덱·암기노트 페이지에 그대로 넣고(__JUDGE__), learn.html 은 patch_learn_judge.py 가 TJ-START~TJ-END 사이를 이 파일로 갈아 끼운다.
   기록 = localStorage atto.evidence [{t, k, n:[노드], ok, v, lid, sid, qid, a, clean}] (최대 4000건 — 넘치면 읽기·질문 기록부터 버리고 노드마다 최근 문제 6건은 남긴다)
     k: quiz(ok) 확인 문제 · read(clean) 챕터·섹션 끝(다시 설명·질문 없이 끝났으면 clean) · again 다시 설명 · ask 질문 · memo(ok) 암기노트 외움 · self(v) 카드 자가평가
     a: 같은 시도 표시(카드 「다시 저장」) — 같은 a·qid 는 새 기록으로 바꿔 넣는다(정답 수가 늘지 않는다)
   판정 = 노드마다 atto.mastery[id] = {quiz:{correct,total,ts}, self, sts, ts, score, state, auto} — learn.html 은 TJ.score 로 같은 식을 쓴다.
     quiz = 최근 6번 · self(설명할 수 있나 1~5) = 읽음 4 · 다시 설명·질문 2번 이상이면 3 · 외움 +1 · 카드 자가평가가 더 최근이면 그 값
     → 문제 없이 읽기만 하면 최대 「흔들림」, 「안다」는 문제로만. 점수식 = (0.5·정답률·감쇠(quiz.ts) + 0.2·self/5·감쇠(sts))/0.7, 문제 없으면 self/5·0.6·감쇠(sts)
     감쇠 = 60일에 걸쳐 1 → 0.4 (최저 0.4). 정답 근거와 읽기·암기 근거를 따로 감쇠한다 — 오늘 암기 체크 하나로 90일 전 정답이 새것처럼 되지 않게(오타 .91 설계 검수 ⑦)
   저장이 막히면(용량·사생활 모드) 이 페이지 안에서는 메모리 사본으로 이어 가고 rec 은 false 를 돌려준다. */
(function(g){
  var EK="atto.evidence", MK="atto.mastery", CAP=4000, KEEPQ=6, MEM={}, DIRTY={};
  function rd(k,d){ if(DIRTY[k]) return MEM[k]; try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return v==null?d:v; }catch(e){ return DIRTY[k]?MEM[k]:d; } }
  function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); DIRTY[k]=false; return true; }catch(e){ MEM[k]=v; DIRTY[k]=true; return false; } }
  function decay(ts){ if(!ts) return 1; var d=Math.max(0,(Date.now()/1000-ts)/86400); return Math.max(.4,1-d/60); }
  function score(e){ if(!e||typeof e!=="object") return {score:0,state:"unrated"};
    var q=e.quiz||{}, tot=+q.total||0, cor=+q.correct||0, sv=e.self==null?null:Math.max(1,Math.min(5,+e.self));
    if(tot<=0&&sv==null) return {score:0,state:"unrated"};
    var dq=decay(+q.ts||+e.ts||0), ds=decay(+e.sts||+e.ts||0);
    var raw=tot>0?(0.5*(cor/tot)*dq+0.2*((sv||0)/5)*ds)/0.7:(sv/5)*0.6*ds, s=Math.min(1,raw), st;
    if(tot<=0) st=(sv>=4&&s>=.4)?"shaky":"unknown"; else st=s>=.7?"known":s>=.4?"shaky":"unknown";
    return {score:Math.round(s*1000)/1000,state:st}; }
  function why(evs){ var qz=evs.filter(function(e){return e.k==="quiz";}).slice(-KEEPQ), r={q:qz.length,c:qz.filter(function(e){return e.ok;}).length,
      read:evs.filter(function(e){return e.k==="read";}).length, clean:evs.filter(function(e){return e.k==="read"&&e.clean;}).length,
      conf:evs.filter(function(e){return (e.k==="again"||e.k==="ask")&&Date.now()-e.t<21*864e5;}).length,
      memo:null, self:null, last:0, selfLast:0};
    evs.forEach(function(e){ if(e.k==="memo") r.memo=!!e.ok; if(e.k==="self") r.self={v:+e.v,t:e.t}; if(e.t>r.last) r.last=e.t; if(e.k!=="quiz"&&e.t>r.selfLast) r.selfLast=e.t; });
    return r; }
  function judgeOne(id,L,M){ var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); if(!evs.length) return;
    var r=why(evs), e=Object.assign({},M[id]||{}), qz=evs.filter(function(x){return x.k==="quiz";}).slice(-KEEPQ);
    var self=null; if(r.read||r.conf||r.memo!=null){ self=r.read?4:3; if(r.conf>=2) self=3; if(r.memo) self=Math.min(5,self+1); }
    var autoLast=0; evs.forEach(function(x){ if(x.k!=="self"&&x.t>autoLast) autoLast=x.t; });
    if(r.self&&r.self.t>=autoLast) self=r.self.v;
    e.quiz=qz.length?{correct:r.c,total:qz.length,ts:Math.round(qz[qz.length-1].t/1000)}:undefined; if(!e.quiz) delete e.quiz;
    e.self=self; if(self==null){ delete e.self; delete e.sts; } else e.sts=Math.round(r.selfLast/1000);
    e.ts=Math.round(r.last/1000); e.auto={by:"tutor",q:r.q,c:r.c,read:r.read,clean:r.clean,conf:r.conf,memo:r.memo};
    var s=score(e); e.score=s.score; e.state=s.state; M[id]=e; }
  function judge(ids){ var L=rd(EK,[]), M=rd(MK,{}); if(!Array.isArray(L)) L=[]; if(!M||typeof M!=="object") M={}; (ids||[]).forEach(function(id){ judgeOne(id,L,M); });
    wr(MK,M); return M; }
  function all(){ var L=rd(EK,[]), o={}; if(Array.isArray(L)) L.forEach(function(e){ (e&&e.n||[]).forEach(function(i){ o[i]=1; }); }); return judge(Object.keys(o)); }
  /* 상한 넘침: 노드마다 최근 문제 KEEPQ 건은 지키고, 나머지(읽기·질문·오래된 문제)에서 오래된 것부터 버린다 — 다른 노드 활동으로 정답 기록이 사라지지 않게 */
  function trim(L,cap){ cap=cap||CAP; if(L.length<=cap) return L; var seen={}, keep=[], rest=[], i;
    for(i=L.length-1;i>=0;i--){ var e=L[i], k=false; if(e&&e.k==="quiz") (e.n||[]).forEach(function(id){ seen[id]=(seen[id]||0)+1; if(seen[id]<=KEEPQ) k=true; }); (k?keep:rest).push(e); }
    keep.reverse(); rest.reverse(); rest=rest.slice(Math.max(0,rest.length-Math.max(0,cap-keep.length)));
    return keep.concat(rest).sort(function(a,b){ return (a.t||0)-(b.t||0); }); }
  function rec(ev){ if(!ev||!Array.isArray(ev.n)||!ev.n.length) return false; var L=rd(EK,[]); if(!Array.isArray(L)) L=[];
    ev.t=Date.now();
    if(ev.a!=null&&ev.qid!=null){ for(var i=L.length-1;i>=0;i--){ var x=L[i]; if(x&&x.k===ev.k&&x.qid===ev.qid&&x.a===ev.a){ L.splice(i,1); break; } } }
    L.push(ev); L=trim(L);
    /* 저장 실패 → 절반 상한으로 다시(이때도 노드마다 최근 정답은 지킨다, 오타 설계 2차) · 그래도 실패면 메모리 사본은 자르지 않은 전체로 */
    var ok=wr(EK,L); if(!ok){ var half=trim(L,Math.floor(CAP/2)); if(wr(EK,half)){ L=half; ok=true; } else { MEM[EK]=L; DIRTY[EK]=true; } }
    judge(ev.n); return ok; }
  function reasons(id){ var L=rd(EK,[]); if(!Array.isArray(L)) return null; var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); return evs.length?why(evs):null; }
  g.TJ={rec:rec,judge:judge,all:all,score:score,reasons:reasons,trim:trim};
})(typeof window!=="undefined"?window:this);
</script>
<script>/* 여러 식을 이은 식 줄 나누기(대표님 2026-09-29 「수식 한 줄로, 배치구조 신경」) — 원본은 이 파일 하나(수업 노트·암기노트 템플릿에 빌더가 넣는다, __SPLITTEX__).
   \[ A,\qquad B \] 처럼 서로 다른 식을 \qquad 또는 「,\quad」로 이어 붙인 줄은 식마다 한 줄(\[A\]\[B\])로 — 한 식 안은 가르지 않는다.
   괄호 { } 와 \begin…\end 안의 구분자는 건드리지 않고, 연결 기호만 남은 조각(\Rightarrow·\to·\Leftrightarrow·\therefore)은 다음 식 앞에 붙인다. */
/* 괄호 깊이: ( ) [ ] 와 \left…\right 안에서는 나누지 않는다 — \left(a\qquad b\right) 가 갈렸다(오타 .91 설계 검수 ④) */
function parenStep(t,i,p){
  if(t.startsWith("\\left",i)&&!/[a-zA-Z]/.test(t[i+5]||"")) return p+1;
  if(t.startsWith("\\right",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) return Math.max(0,p-1);
  const c=t[i]; if(c==="("||c==="[") return p+1; if(c===")"||c==="]") return Math.max(0,p-1); return p;
}
function splitTex(t){
  const parts=[]; let d=0, env=0, p=0, cur="", i=0;
  while(i<t.length){
    if(t.startsWith("\\begin{",i)) env++;
    else if(t.startsWith("\\end{",i)) env=Math.max(0,env-1);
    const c=t[i];
    if(c==="\\"&&(t[i+1]==="{"||t[i+1]==="}")){ cur+=t.slice(i,i+2); i+=2; continue; }
    if(c==="{") d++; else if(c==="}") d=Math.max(0,d-1);
    p=parenStep(t,i,p);
    if(!d&&!env&&!p){
      let m=0;
      if(t.startsWith("\\qquad",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) m=6;
      else if(t.startsWith(",\\quad",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) m=6;
      if(m){ parts.push(cur); cur=""; i+=m; continue; }
    }
    cur+=c; i++;
  }
  parts.push(cur);
  const out=[]; let carry="";
  parts.map(p=>p.trim().replace(/^,\s*/,"").replace(/,\s*$/,"")).forEach(p=>{
    if(!p) return;
    if(/^(\\(Rightarrow|Leftarrow|Leftrightarrow|to|therefore|because|implies|iff)\s*)+$/.test(p)){ carry+=p+" "; return; }
    out.push(carry+p); carry="";
  });
  if(carry&&out.length) out[out.length-1]+=" "+carry.trim();
  return out.length?out:[t];
}
/* 좁은 화면(폰)에서만: 글자 덩어리(\text{…})를 화살표(\to·\Rightarrow)로 이은 「흐름」 줄은 화살표 단위로 줄을 나눈다 — 수식이 아니라 단계 나열이라 나눠도 식이 갈리지 않는다 */
function splitFlow(t){
  const segs=[]; let d=0, p=0, cur="", i=0;
  while(i<t.length){ const c=t[i];
    if(c==="\\"&&(t[i+1]==="{"||t[i+1]==="}")){ cur+=t.slice(i,i+2); i+=2; continue; }
    if(c==="{") d++; else if(c==="}") d=Math.max(0,d-1);
    p=parenStep(t,i,p);
    if(!d&&!p){ const m=/^\\ ?\\(to|Rightarrow)(?![a-zA-Z])\\ ?/.exec(t.slice(i))||/^\s*\\(to|Rightarrow)(?![a-zA-Z])\s*/.exec(t.slice(i)); if(m&&cur.trim()){ segs.push(cur); cur="\\"+m[1]+"\\ "; i+=m[0].length; continue; } }
    cur+=c; i++; }
  segs.push(cur);
  const ok=segs.length>=3&&segs.every(s=>/^(\\(to|Rightarrow)\\ )?\s*\\text\{/.test(s.trim()));
  return ok?segs.map(s=>s.trim()):[t];
}
function splitDisplays(html,narrow){
  return String(html).replace(/\\\[([\s\S]*?)\\\]/g,(m,tex)=>{ let ps=splitTex(tex); if(narrow) ps=[].concat(...ps.map(splitFlow)); return ps.length>1?ps.map(p=>"\\["+p+"\\]").join(""):m; });
}

\\qquad |\\mathbf r_{AB}|=\\sqrt{\\Delta x^2+\\Delta y^2+\\Delta z^2}\\]", "id": "2026-09-09-s2-1"}, {"t": "m", "k": "\\(\\mathbf r_{AB}\\)", "s": "=", "a": "(B 좌표) − (A 좌표), 성분마다", "id": "2026-09-09-s2-2"}, {"t": "m", "k": "", "s": "", "a": "크기는 \\(\\sqrt{\\Delta x^2+\\Delta y^2+\\Delta z^2}\\)", "id": "2026-09-09-s2-3"}]}, {"sid": "s3", "title": "3차원 성분과 방향여현 ★★", "n": ["mech.force_3d", "mech.dot_apps"], "items": [{"t": "f", "a": "\\[U_x=|\\mathbf U|\\cos\\theta_x,\\quad U_y=|\\mathbf U|\\cos\\theta_y,\\quad U_z=|\\mathbf U|\\cos\\theta_z\\qquad\\Rightarrow\\qquad \\cos^2\\theta_x+\\cos^2\\theta_y+\\cos^2\\theta_z=1\\]", "id": "2026-09-09-s3-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\cos^2\\theta_x+\\cos^2\\theta_y+\\cos^2\\theta_z=1\\)", "id": "2026-09-09-s3-2"}, {"t": "m", "k": "성분", "s": "=", "a": "크기 × 방향여현 · 오른손 좌표계", "id": "2026-09-09-s3-3"}]}, {"sid": "s4", "title": "단위벡터의 성분 = 방향여현 → 케이블 힘 쓰기 ★", "n": ["mech.force_3d"], "items": [{"t": "f", "a": "\\[\\mathbf e=\\frac{\\mathbf U}{|\\mathbf U|}=\\frac{U_x}{|\\mathbf U|}\\mathbf i+\\frac{U_y}{|\\mathbf U|}\\mathbf j+\\frac{U_z}{|\\mathbf U|}\\mathbf k=\\cos\\theta_x\\,\\mathbf i+\\cos\\theta_y\\,\\mathbf j+\\cos\\theta_z\\,\\mathbf k\\]", "id": "2026-09-09-s4-1"}, {"t": "f", "a": "\\[\\mathbf e_{AB}=\\frac{\\mathbf r_{AB}}{|\\mathbf r_{AB}|},\\qquad \\mathbf F=|\\mathbf F|\\,\\mathbf e_{AB}=|\\mathbf F|\\,\\frac{\\mathbf r_{AB}}{|\\mathbf r_{AB}|}\\]", "id": "2026-09-09-s4-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf e=\\cos\\theta_x\\mathbf i+\\cos\\theta_y\\mathbf j+\\cos\\theta_z\\mathbf k\\)", "id": "2026-09-09-s4-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf F=|\\mathbf F|\\,\\mathbf r_{AB}/|\\mathbf r_{AB}|\\)", "id": "2026-09-09-s4-4"}, {"t": "m", "k": "단위벡터 검산: 성분 제곱합", "s": "=", "a": "1", "id": "2026-09-09-s4-5"}]}, {"sid": "s5", "title": "내적(dot product)의 정의 — \"왜 배우나\"부터", "n": ["mech.dot_apps", "mech.projection"], "items": [{"t": "f", "a": "\\[\\mathbf U\\cdot\\mathbf V=|\\mathbf U||\\mathbf V|\\cos\\theta\\qquad(\\text{결과는 스칼라})\\]", "id": "2026-09-09-s5-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U\\cdot\\mathbf V=|\\mathbf U||\\mathbf V|\\cos\\theta\\) · 스칼라 · 수직 ⇔ 0 · 쓰임: 사이각", "id": "2026-09-09-s5-2"}, {"t": "m", "k": "", "s": "", "a": "평행/수직 분해(9/14 정사영)", "id": "2026-09-09-s5-3"}]}], "classroom": "../classroom/statics/2026-09-09.html"}, {"date": "2026-09-14", "label": "9/14(월) · 3주차", "title": "내적으로 각과 정사영을, 외적으로 모멘트를 — 벡터의 두 곱셈", "chs": [{"sid": "s1", "title": "내적의 성질과 단위벡터 표", "n": ["mech.dot_apps", "mech.particle_3d", "mech.projection"], "items": [{"t": "f", "a": "\\[\\mathbf U\\cdot\\mathbf V=\\mathbf V\\cdot\\mathbf U\\ (\\text{교환}),\\quad a(\\mathbf U\\cdot\\mathbf V)=(a\\mathbf U)\\cdot\\mathbf V=\\mathbf U\\cdot(a\\mathbf V),\\quad \\mathbf U\\cdot(\\mathbf V+\\mathbf W)=\\mathbf U\\cdot\\mathbf V+\\mathbf U\\cdot\\mathbf W\\ (\\text{분배})\\]", "id": "2026-09-14-s1-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf i\\cdot\\mathbf i=\\mathbf j\\cdot\\mathbf j=\\mathbf k\\cdot\\mathbf k=1\\)", "id": "2026-09-14-s1-2"}, {"t": "m", "k": "", "s": "", "a": "서로 다른 것끼리 0", "id": "2026-09-14-s1-3"}, {"t": "m", "k": "", "s": "", "a": "교환·분배 성립", "id": "2026-09-14-s1-4"}]}, {"sid": "s2", "title": "성분으로 내적 → 두 벡터 사이의 각 ★", "n": ["mech.dot_apps", "mech.projection"], "items": [{"t": "f", "a": "\\[\\mathbf U\\cdot\\mathbf V=U_xV_x+U_yV_y+U_zV_z\\qquad\\Rightarrow\\qquad \\cos\\theta=\\frac{U_xV_x+U_yV_y+U_zV_z}{|\\mathbf U||\\mathbf V|},\\quad \\theta=\\cos^{-1}\\!\\left(\\frac{\\mathbf U\\cdot\\mathbf V}{|\\mathbf U||\\mathbf V|}\\right)\\]", "id": "2026-09-14-s2-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U\\cdot\\mathbf V=U_xV_x+U_yV_y+U_zV_z\\)", "id": "2026-09-14-s2-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\theta=\\cos^{-1}\\big(\\mathbf U\\cdot\\mathbf V/|\\mathbf U||\\mathbf V|\\big)\\)", "id": "2026-09-14-s2-3"}]}, {"sid": "s3", "title": "직선에 평행·수직한 성분 — 정사영 ★★", "n": ["mech.projection"], "items": [{"t": "f", "a": "\\[|\\mathbf U_p|=|\\mathbf U\\cdot\\mathbf e|=|\\mathbf U||\\cos\\theta|,\\qquad \\mathbf e\\cdot\\mathbf U=|\\mathbf e||\\mathbf U|\\cos\\theta=|\\mathbf U|\\cos\\theta\\ (\\text{L 방향 스칼라 성분})\\] \\[\\boxed{\\ \\mathbf U_p=(\\mathbf U\\cdot\\mathbf e)\\,\\mathbf e\\ }\\qquad \\mathbf U_n=\\mathbf U-\\mathbf U_p\\]", "id": "2026-09-14-s3-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U_p=(\\mathbf U\\cdot\\mathbf e)\\mathbf e\\)", "id": "2026-09-14-s3-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U_n=\\mathbf U-\\mathbf U_p\\)", "id": "2026-09-14-s3-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf e\\)는 반드시 단위벡터", "id": "2026-09-14-s3-4"}, {"t": "m", "k": "", "s": "", "a": "검산 \\(\\mathbf U_n\\cdot\\mathbf e=0\\)", "id": "2026-09-14-s3-5"}]}, {"sid": "s4", "title": "외적(cross product) — 정의 · 오른손 법칙 · 넓이", "n": ["mech.cross_apps"], "items": [{"t": "f", "a": "\\[\\mathbf U\\times\\mathbf V=|\\mathbf U||\\mathbf V|\\sin\\theta\\ \\mathbf e\\qquad(\\mathbf e\\perp\\mathbf U,\\ \\mathbf e\\perp\\mathbf V,\\ |\\mathbf e|=1)\\] \\[\\mathbf V\\times\\mathbf U=-(\\mathbf U\\times\\mathbf V),\\qquad \\mathbf U\\parallel\\mathbf V\\Rightarrow\\mathbf U\\times\\mathbf V=0\\]", "id": "2026-09-14-s4-1"}, {"t": "m", "k": "", "s": "", "a": "\\(|\\mathbf U\\times\\mathbf V|=|\\mathbf U||\\mathbf V|\\sin\\theta\\) = 평행사변형 넓이", "id": "2026-09-14-s4-2"}, {"t": "m", "k": "방향", "s": "=", "a": "평면에 수직, 오른손", "id": "2026-09-14-s4-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf V\\times\\mathbf U=-\\mathbf U\\times\\mathbf V\\) · 평행 ⇔ 0", "id": "2026-09-14-s4-4"}]}, {"sid": "s5", "title": "성질 · 단위벡터 순환 · 성분 전개 · 행렬식 ★★", "n": ["mech.cross_apps"], "items": [{"t": "f", "a": "\\[a(\\mathbf U\\times\\mathbf V)=(a\\mathbf U)\\times\\mathbf V=\\mathbf U\\times(a\\mathbf V),\\qquad \\mathbf U\\times(\\mathbf V+\\mathbf W)=\\mathbf U\\times\\mathbf V+\\mathbf U\\times\\mathbf W\\]", "id": "2026-09-14-s5-1"}, {"t": "f", "a": "\\[\\mathbf U\\times\\mathbf V=(U_yV_z-U_zV_y)\\,\\mathbf i-(U_xV_z-U_zV_x)\\,\\mathbf j+(U_xV_y-U_yV_x)\\,\\mathbf k=\\begin{vmatrix}\\mathbf i&amp;\\mathbf j&amp;\\mathbf k\\\\U_x&amp;U_y&amp;U_z\\\\V_x&amp;V_y&amp;V_z\\end{vmatrix}\\]", "id": "2026-09-14-s5-2"}, {"t": "m", "k": "", "s": "", "a": "행렬식 \\(\\begin{vmatrix}\\mathbf i&\\mathbf j&\\mathbf k\\\\U_x&U_y&U_z\\\\V_x&V_y&V_z\\end{vmatrix}\\) · <b>j 항은 −<\/b>", "id": "2026-09-14-s5-3"}, {"t": "m", "k": "순환 i→j→k는 +, 거꾸로 − · 검산: 결과 · U", "s": "=", "a": "0", "id": "2026-09-14-s5-4"}]}], "classroom": "../classroom/statics/2026-09-14.html"}, {"date": "2026-09-16", "label": "9/16(수) · 3주차", "title": "벡터의 마지막 도구, 그리고 \"여기서부터 중간고사\" — 힘의 종류와 자유물체도", "chs": [{"sid": "s1", "title": "혼합삼중적 U·(V×W) — 행렬식 · 부피 · 공면이면 0", "n": ["mech.triple_product"], "items": [{"t": "f", "a": "\\[\\mathbf U\\cdot(\\mathbf V\\times\\mathbf W)=\\begin{vmatrix}U_x&amp;U_y&amp;U_z\\\\V_x&amp;V_y&amp;V_z\\\\W_x&amp;W_y&amp;W_z\\end{vmatrix},\\qquad \\mathbf U\\cdot(\\mathbf V\\times\\mathbf W)=-\\mathbf V\\cdot(\\mathbf U\\times\\mathbf W)\\ (\\text{두 벡터를 바꾸면 부호 반대})\\]", "id": "2026-09-16-s1-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U\\cdot(\\mathbf V\\times\\mathbf W)=\\det[\\mathbf U;\\mathbf V;\\mathbf W]\\) · 스칼라", "id": "2026-09-16-s1-2"}, {"t": "m", "k": "절댓값", "s": "=", "a": "평행육면체 부피 · <b>공면이면 0<\/b>", "id": "2026-09-16-s1-3"}, {"t": "m", "k": "", "s": "", "a": "두 벡터 바꾸면 부호 반대", "id": "2026-09-16-s1-4"}]}, {"sid": "s2", "title": "Ch.3 힘 — \"여기서부터 중간고사 범위\" · 외력/내력 · 체적력/표면력", "n": ["mech.equilibrium_particle"], "items": [{"t": "m", "k": "중간고사", "s": "=", "a": "Ch.3·4·5 (10/19)", "id": "2026-09-16-s2-1"}, {"t": "m", "k": "Ch.3 핵심", "s": "=", "a": "평형 + 자유물체도", "id": "2026-09-16-s2-2"}, {"t": "m", "k": "", "s": "", "a": "외력/내력은 물체의 정의에 따라", "id": "2026-09-16-s2-3"}, {"t": "m", "k": "", "s": "", "a": "체적력(중력)/표면력(접촉)", "id": "2026-09-16-s2-4"}, {"t": "m", "k": "", "s": "", "a": "\\(W=mg\\)", "id": "2026-09-16-s2-5"}]}, {"sid": "s3", "title": "접촉력 = 수직력 N + 마찰력 f · 뉴턴 제3법칙", "n": [  ["mech.moment"], "items": [{"t": "f", "a": "\\[\\sum M_P=M_{P,1}+M_{P,2}+M_{P,3}+\\cdots\\qquad M_P(\\mathbf F)=M_P(F_x)+M_P(F_y)\\]", "id": "2026-09-21-s4-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\sum M_P=M_{P,1}+M_{P,2}+\\cdots\\) (부호 붙여)", "id": "2026-09-21-s4-2"}, {"t": "m", "k": "", "s": "", "a": "\\(M_P(\\mathbf F)=M_P(F_x)+M_P(F_y)\\)", "id": "2026-09-21-s4-3"}, {"t": "m", "k": "\\(F_x\\) 의 팔", "s": "=", "a": "\\(y\\), \\(F_y\\) 의 팔 = \\(x\\)", "id": "2026-09-21-s4-4"}]}, {"sid": "s5", "title": "모멘트 벡터 M_P = r × F — 크기 rF sinθ = DF · 방향은 오른손", "n": ["mech.moment", "mech.cross_apps", "vec.cross"], "items": [{"t": "f", "a": "\\[\\mathbf M_P=\\mathbf r\\times\\mathbf F\\qquad(\\mathbf r:\\ \\text{점 P 에서 F 의 작용선 위 아무 점까지의 위치벡터})\\]", "id": "2026-09-21-s5-1"}, {"t": "f", "a": "\\[|\\mathbf M_P|=rF\\sin\\theta=DF,\\qquad D=r\\sin\\theta\\]", "id": "2026-09-21-s5-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf M_P=\\mathbf r\\times\\mathbf F\\), \\(\\mathbf r\\) = P → <b>작용선 위 아무 점<\/b>", "id": "2026-09-21-s5-3"}, {"t": "m", "k": "", "s": "", "a": "\\(|\\mathbf M_P|=rF\\sin\\theta=DF\\) (\\(\\theta\\) 는 꼬리끼리)", "id": "2026-09-21-s5-4"}, {"t": "m", "k": "방향", "s": "=", "a": "평면에 수직, 오른손 r → F", "id": "2026-09-21-s5-5"}, {"t": "m", "k": "반시계", "s": "=", "a": "+z", "id": "2026-09-21-s5-6"}]}, {"sid": "s6", "title": "r 은 작용선 위 아무 점 — 같은 모멘트", "n": ["mech.moment", "mech.cross_apps"], "items": [{"t": "f", "a": "\\[\\mathbf r'\\times\\mathbf F=(\\mathbf r+\\mathbf u)\\times\\mathbf F=\\mathbf r\\times\\mathbf F+\\mathbf u\\times\\mathbf F=\\mathbf r\\times\\mathbf F\\qquad(\\mathbf u\\parallel\\mathbf F\\ \\Rightarrow\\ \\mathbf u\\times\\mathbf F=0)\\]", "id": "2026-09-21-s6-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf r'=\\mathbf r+\\mathbf u\\), \\(\\mathbf u\\parallel\\mathbf F\\) → \\(\\mathbf u\\times\\mathbf F=0\\) → <b>같은 모멘트<\/b>", "id": "2026-09-21-s6-2"}, {"t": "m", "k": "", "s": "", "a": "2D: \\(\\mathbf r\\times\\mathbf F=(xF_y-yF_x)\\mathbf k\\)", "id": "2026-09-21-s6-3"}, {"t": "m", "k": "", "s": "", "a": "계산 쉬운 점을 고른다", "id": "2026-09-21-s6-4"}]}], "classroom": "../classroom/statics/2026-09-21.html"}, {"date": "2026-09-23", "label": "9/23(수) · 4주차", "title": "\"점은 r × F, 직선은 삼중곱\" — 바리뇽 정리와 직선(축)에 대한 모멘트", "chs": [{"sid": "s1", "title": "예제 — 점 (4, 2, 0) 에 10j N, 원점에 대한 모멘트를 두 방법으로", "n": ["mech.moment"], "items": [{"t": "f", "a": "\\[\\text{방법 1}:\\ |\\mathbf M_O|=DF=4\\ \\mathrm{m}\\times10\\ \\mathrm{N}=40\\ \\mathrm{N\\cdot m},\\ \\text{반시계}\\Rightarrow+z\\qquad \\text{방법 2}:\\ \\mathbf r\\times\\mathbf F=(4\\mathbf i+2\\mathbf j)\\times10\\mathbf j=40\\mathbf k+20(\\mathbf j\\times\\mathbf j)=40\\mathbf k\\]", "id": "2026-09-23-s1-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf M_O=40\\mathbf k\\) N·m (두 방법 같음)", "id": "2026-09-23-s1-2"}, {"t": "m", "k": "\\(D\\)", "s": "=", "a": "작용선까지", "id": "2026-09-23-s1-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf j\\times\\mathbf j=0\\), \\(\\mathbf i\\times\\mathbf j=\\mathbf k\\)", "id": "2026-09-23-s1-4"}, {"t": "m", "k": "반시계", "s": "=", "a": "+z", "id": "2026-09-23-s1-5"}]}, {"sid": "s2", "title": "바리뇽 정리 (Varignon's theorem) — 합력의 모멘트 = 각 힘 모멘트의 합", "n": ["mech.moment", "mech.moment_line"], "items": [{"t": "f", "a": "\\[\\sum\\mathbf M_P=\\mathbf r_{PQ}\\times\\mathbf F_1+\\mathbf r_{PQ}\\times\\mathbf F_2+\\cdots+\\mathbf r_{PQ}\\times\\mathbf F_N=\\mathbf r_{PQ}\\times(\\mathbf F_1+\\cdots+\\mathbf F_N)=\\mathbf r_{PQ}\\times\\sum\\mathbf F\\]", "id": "2026-09-23-s2-1"}, {"t": "f", "a": "\\[M_P(\\mathbf F)=M_P(F_x)+M_P(F_y)+M_P(F_z)\\]", "id": "2026-09-23-s2-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\sum\\mathbf M_P=\\mathbf r_{PQ}\\times\\sum\\mathbf F\\) (공점력, 분배법칙)", "id": "2026-09-23-s2-3"}, {"t": "m", "k": "합력의 모멘트", "s": "=", "a": "각 힘 모멘트의 합", "id": "2026-09-23-s2-4"}, {"t": "m", "k": "", "s": "", "a": "\\(M_P(\\mathbf F)=M_P(F_x)+M_P(F_y)+M_P(F_z)\\)", "id": "2026-09-23-s2-5"}, {"t": "m", "k": "쪼개는 이유", "s": "=", "a": "0 인 성분 날리기", "id": "2026-09-23-s2-6"}]}, {"sid": "s3", "title": "직선에 대한 힘의 모멘트 — M_P 중 L 과 평행한 성분", "n": ["mech.moment_line", "mech.projection"], "items": [{"t": "f", "a": "\\[\\mathbf M_L=(\\mathbf e\\cdot\\mathbf M_P)\\,\\mathbf e\\qquad(\\mathbf e:\\ \\text{L 방향 단위벡터})\\]", "id": "2026-09-23-s3-1"}, {"t": "m", "k": "L 에 대한 모멘트", "s": "=", "a": "\\(\\mathbf M_P\\)(P 는 L 위 아무 점) 의 <b>L 평행 성분<\/b>", "id": "2026-09-23-s3-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf M_L=(\\mathbf e\\cdot\\mathbf M_P)\\mathbf e\\) = 정사영", "id": "2026-09-23-s3-3"}, {"t": "m", "k": "", "s": "", "a": "2장 평행·수직 성분 복습", "id": "2026-09-23-s3-4"}]}, {"sid": "s4", "title": "M_L = [e·(r × F)] e — 혼합삼중적 · 행렬식 · 부호", "n": ["mech.moment_line", "mech.triple_product"], "items": [{"t": "f", "a": "\\[\\mathbf M_L=[\\mathbf e\\cdot(\\mathbf r\\times\\mathbf F)]\\,\\mathbf e,\\qquad \\mathbf e\\cdot(\\mathbf r\\times\\mathbf F)=\\begin{vmatrix}e_x&amp;e_y&amp;e_z\\\\r_x&amp;r_y&amp;r_z\\\\F_x&amp;F_y&amp;F_z\\end{vmatrix}\\]", "id": "2026-09-23-s4-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf M_L=[\\mathbf e\\cdot(\\mathbf r\\times\\mathbf F)]\\mathbf e\\)", "id": "2026-09-23-s4-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf e\\cdot(\\mathbf r\\times\\mathbf F)=\\det[\\mathbf e;\\mathbf r;\\mathbf F]\\) (스칼라)", "id": "2026-09-23-s4-3"}, {"t": "m", "k": "양수", "s": "→", "a": "\\(\\mathbf e\\) 방향, 음수 → 반대", "id": "2026-09-23-s4-4"}, {"t": "m", "k": "", "s": "", "a": "점은 \\(\\mathbf r\\times\\mathbf F\\), 직선은 삼중곱", "id": "2026-09-23-s4-5"}]}, {"sid": "s5", "title": "직선 위 어느 점을 골라도 같다 (Independence of the point chosen on the line)", "n": ["mech.moment_line", "mech.triple_product"], "items": [{"t": "f", "a": "\\[\\mathbf M_L=[\\mathbf e\\cdot(\\mathbf r'\\times\\mathbf F)]\\mathbf e=[\\mathbf e\\cdot(\\mathbf r\\times\\mathbf F)+\\mathbf e\\cdot(\\mathbf u\\times\\mathbf F)]\\mathbf e=[\\mathbf e\\cdot(\\mathbf r\\times\\mathbf F)]\\mathbf e\\]", "id": "2026-09-23-s5-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf r'=\\mathbf r+\\mathbf u\\), \\(\\mathbf u\\parallel\\mathbf e\\) → \\(\\mathbf e\\cdot(\\mathbf u\\times\\mathbf F)=0\\)(부피 0) → <b>M_L 은 L 위 점 선택과 무관<\/b>", "id": "2026-09-23-s5-2"}, {"t": "m", "k": "", "s": "", "a": "0 이 많은 점을 고른다", "id": "2026-09-23-s5-3"}]}, {"sid": "s6", "title": "예제 1 — 터빈 (교재 Fig 4.14) : M_L = aF_y k", "n": ["mech.moment_line"], "items": [{"t": "f", "a": "\\[\\mathbf M_Q=\\mathbf r\\times\\mathbf F=(a\\mathbf i-b\\mathbf k)\\times(F_x\\mathbf i+F_y\\mathbf j+F_z\\mathbf k)=bF_y\\,\\mathbf i-(aF_z+bF_x)\\,\\mathbf j+aF_y\\,\\mathbf k\\]", "id": "2026-09-23-s6-1"}, {"t": "f", "a": "\\[\\mathbf e=\\mathbf k\\ \\Rightarrow\\ \\mathbf M_L=(\\mathbf k\\cdot\\mathbf M_Q)\\,\\mathbf k=aF_y\\,\\mathbf k\\]", "id": "2026-09-23-s6-2"}, {"t": "m", "k": "", "s": "", "a": "터빈(L = z 축): \\(\\mathbf M_Q=bF_y\\mathbf i-(aF_z+bF_x)\\mathbf j+aF_y\\mathbf k\\) → \\(\\mathbf M_L=aF_y\\mathbf k\\)", "id": "2026-09-23-s6-3"}, {"t": "m", "k": "", "s": "", "a": "축 모멘트는 \\(F_y\\) 만 (\\(F_x\\)·\\(F_z\\) 는 0)", "id": "2026-09-23-s6-4"}]}, {"sid": "s7", "title": "예제 2 — 두 점으로 정한 직선 (교재 Fig 4.15) : M_L = 109 e_AB N·m", "n": ["mech.moment_line"], "items": [{"t": "f", "a": "\\[\\text{②}\\ \\mathbf M_A=\\mathbf r_{AQ}\\times\\mathbf F=\\begin{vmatrix}\\mathbf i&amp;\\mathbf j&amp;\\mathbf k\\\\6&amp;6&amp;0\\\\10&amp;60&amp;-20\\end{vmatrix}=-120\\mathbf i+120\\mathbf j+300\\mathbf k\\ \\ \\mathrm{N\\cdot m}\\]", "id": "2026-09-23-s7-1"}, {"t": "f", "a": "\\[\\mathbf e_{AB}=-\\tfrac{9}{11}\\mathbf i+\\tfrac{6}{11}\\mathbf j-\\tfrac{2}{11}\\mathbf k,\\qquad \\text{④}\\ \\mathbf e_{AB}\\cdot\\mathbf M_A=\\tfrac{(-9)(-120)+6(120)+(-2)(300)}{11}=\\tfrac{1200}{11}\\approx109\\]", "id": "2026-09-23-s7-2"}, {"t": "f", "a": "\\[\\text{⑤}\\ \\mathbf M_L=109\\,\\mathbf e_{AB}\\ \\mathrm{N\\cdot m}\\ \\approx-89.3\\mathbf i+59.5\\mathbf j-19.8\\mathbf k\\ \\mathrm{N\\cdot m}\\]", "id": "2026-09-23-s7-3"}, {"t": "m", "k": "5단계: ① L 위 점(0 많은 점) ② \\(\\mathbf r\\)", "s": "→", "a": "\\(\\mathbf M_P=\\mathbf r\\times\\mathbf F\\) ③ \\(\\mathbf e=\\mathbf r_{AB}/|\\mathbf r_{AB}|\\) (B − A) ④ \\(\\mathbf e\\cdot\\mathbf M_P\\) ⑤ \\(\\mathbf M_L=(\\cdot)\\mathbf e\\)", "id": "2026-09-23-s7-4"}, {"t": "m", "k": "", "s": "", "a": "Fig 4.15 답 \\(109\\,\\mathbf e_{AB}\\) N·m", "id": "2026-09-23-s7-5"}]}, {"sid": "s8", "title": "유용한 특수한 경우 3 — 수직이면 FD, 평행이면 0, 만나면 0", "n": ["mech.moment_line"], "items": [{"t": "f", "a": "\\[\\text{① 작용선이 L 을 포함하는 평면에 수직}\\Rightarrow|\\mathbf M_L|=FD\\qquad \\text{② 작용선}\\parallel L\\Rightarrow\\mathbf M_L=0\\qquad \\text{③ 작용선이 L 과 만남}\\Rightarrow\\mathbf M_L=0\\]", "id": "2026-09-23-s8-1"}, {"t": "m", "k": "특수한 경우: 수직", "s": "→", "a": "\\(|\\mathbf M_L|=FD\\) · <b>평행 → 0<\/b>", "id": "2026-09-23-s8-2"}, {"t": "m", "k": "", "s": "", "a": "<b>만남(연장선 포함) → 0<\/b>", "id": "2026-09-23-s8-3"}, {"t": "m", "k": "", "s": "", "a": "계산 전에 먼저 0 인 성분부터 지운다", "id": "2026-09-23-s8-4"}]}], "classroom": "../classroom/statics/2026-09-23.html"}, {"date": "2026-09-28", "label": "9/28(월) · 5주차", "title": "알짜힘 없이 돌리기 — 우력, 등가계, 그리고 렌치", "chs": [{"sid": "s1", "title": "우력(couple) — ΣF = 0 인데 ΣM ≠ 0", "n": ["mech.couple", "mech.moment"], "items": [{"t": "f", "a": "\\[\\mathbf M=\\mathbf r_1\\times\\mathbf F+\\mathbf r_2\\times(-\\mathbf F)=(\\mathbf r_1-\\mathbf r_2)\\times\\mathbf F=\\mathbf r\\times\\mathbf F\\]", "id": "2026-09-28-s1-1"}, {"t": "m", "k": "우력", "s": "=", "a": "같은 크기 · 반대 방향 · 다른 작용선", "id": "2026-09-28-s1-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\sum\\mathbf F=0\\), \\(\\sum\\mathbf M\\ne0\\)", "id": "2026-09-28-s1-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf M=\\mathbf r\\times\\mathbf F\\)(\\(\\mathbf r\\): \\(-\\mathbf F\\) 쪽 → \\(\\mathbf F\\) 쪽)", "id": "2026-09-28-s1-4"}, {"t": "m", "k": "", "s": "", "a": "어느 점에 대해서나 같다", "id": "2026-09-28-s1-5"}]}, {"sid": "s2", "title": "우력 모멘트의 크기 |M| = DF · Example 4.18", "n": ["mech.couple", "mech.cross_apps"], "items": [{"t": "f", "a": "\\[|\\mathbf M|=D const $=s=>document.querySelector(s), $$=(s,el)=>Array.from((el||document).querySelectorAll(s));

function fit(){ $$(".katex-display").forEach(k=>{ k.style.fontSize=""; const cw=k.clientWidth, sw=k.scrollWidth; if(!(cw>0&&sw>cw+1)) return; const kx=k.querySelector(".katex"), fz=parseFloat(getComputedStyle(kx||k).fontSize)||20, lo=Math.min(1,Math.max(.6,14/fz)); k.style.fontSize=Math.max(lo,Math.floor(cw/sw*100)/100)+"em"; });

function stat(){ const all=$$(".it"), dn=all.filter(x=>x.classList.contains("done")).length; $("#cnt").textContent="외움 "+dn+"/"+all.length; $("#barI").style.width=(all.length?Math.round(dn/all.length*100):0)+"%";
