<script>/* 김주영 스앵님 판정 (대표님 2026-09-29 「개념 마인드맵은 스앵님이 학습을 통해 내가 뭘 알고 뭘 모르는지 알아서 파악」) — 원본은 이 파일 하나.
   빌더가 교실·수업 노트·학습 덱·암기노트 페이지에 그대로 넣고(__JUDGE__), learn.html·앱(V57)은 같은 글을 붙여 쓴다(docs/tools/sync_judge.py).
   기록 = localStorage atto.evidence [{t, k, n:[노드], ok, v, lid, sid, qid, clean}] (최대 4000건)
     k: quiz(ok) 확인 문제 · read(clean) 챕터·섹션 끝(다시 설명·질문 없이 끝났으면 clean) · again 다시 설명 · ask 질문 · memo(ok) 암기노트 외움 · self(v) 카드 자가평가
   판정 = 노드마다 atto.mastery[id] = {quiz:{correct,total,ts}, self, ts, score, state, auto} — learn.html · 앱 V47 · server.py 의 점수식이 그대로 읽는다.
     quiz = 최근 6번 · self(설명할 수 있나 1~5) = 읽음 4 · 다시 설명·질문 2번 이상이면 3 · 외움 +1 · 카드 자가평가가 더 최근이면 그 값
     → 문제 없이 읽기만 하면 최대 「흔들림」, 「안다」는 문제로만. 점수식 = (0.5·정답률 + 0.2·self/5)/0.7, 문제 없으면 self/5·0.6, 60일 감쇠(최저 0.4) */
(function(g){
  var EK="atto.evidence", MK="atto.mastery", CAP=4000;
  function rd(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return v==null?d:v; }catch(e){ return d; } }
  function decay(ts){ if(!ts) return 1; var d=Math.max(0,(Date.now()/1000-ts)/86400); return Math.max(.4,1-d/60); }
  function score(e){ var q=e.quiz||{}, tot=+q.total||0, cor=+q.correct||0, sv=e.self==null?null:Math.max(1,Math.min(5,+e.self));
    if(tot<=0&&sv==null) return {score:0,state:"unrated"};
    var raw=tot>0?(0.5*(cor/tot)+0.2*((sv||0)/5))/0.7:(sv/5)*0.6, s=Math.min(1,raw)*decay(Math.max(+e.ts||0,+q.ts||0)), st;
    if(tot<=0) st=(sv>=4&&s>=.4)?"shaky":"unknown"; else st=s>=.7?"known":s>=.4?"shaky":"unknown";
    return {score:Math.round(s*1000)/1000,state:st}; }
  function why(evs){ var qz=evs.filter(function(e){return e.k==="quiz";}).slice(-6), r={q:qz.length,c:qz.filter(function(e){return e.ok;}).length,
      read:evs.filter(function(e){return e.k==="read";}).length, clean:evs.filter(function(e){return e.k==="read"&&e.clean;}).length,
      conf:evs.filter(function(e){return (e.k==="again"||e.k==="ask")&&Date.now()-e.t<21*864e5;}).length,
      memo:null, self:null, last:0};
    evs.forEach(function(e){ if(e.k==="memo") r.memo=!!e.ok; if(e.k==="self") r.self={v:+e.v,t:e.t}; if(e.t>r.last) r.last=e.t; });
    return r; }
  function judgeOne(id,L,M){ var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); if(!evs.length) return;
    var r=why(evs), e=Object.assign({},M[id]||{}), qz=evs.filter(function(x){return x.k==="quiz";}).slice(-6);
    var self=null; if(r.read||r.conf||r.memo!=null){ self=r.read?4:3; if(r.conf>=2) self=3; if(r.memo) self=Math.min(5,self+1); }
    var autoLast=0; evs.forEach(function(x){ if(x.k!=="self"&&x.t>autoLast) autoLast=x.t; });
    if(r.self&&r.self.t>=autoLast) self=r.self.v;
    e.quiz=qz.length?{correct:r.c,total:qz.length,ts:Math.round(qz[qz.length-1].t/1000)}:undefined; if(!e.quiz) delete e.quiz;
    e.self=self; if(self==null) delete e.self;
    e.ts=Math.round(r.last/1000); e.auto={by:"tutor",q:r.q,c:r.c,read:r.read,clean:r.clean,conf:r.conf,memo:r.memo};
    var s=score(e); e.score=s.score; e.state=s.state; M[id]=e; }
  function judge(ids){ var L=rd(EK,[]), M=rd(MK,{}); if(!Array.isArray(L)) L=[]; (ids||[]).forEach(function(id){ judgeOne(id,L,M); });
    try{ localStorage.setItem(MK,JSON.stringify(M)); }catch(e){} return M; }
  function all(){ var L=rd(EK,[]), o={}; if(Array.isArray(L)) L.forEach(function(e){ (e&&e.n||[]).forEach(function(i){ o[i]=1; }); }); return judge(Object.keys(o)); }
  function rec(ev){ if(!ev||!Array.isArray(ev.n)||!ev.n.length) return; var L=rd(EK,[]); if(!Array.isArray(L)) L=[];
    ev.t=Date.now(); L.push(ev); if(L.length>CAP) L=L.slice(L.length-CAP);
    try{ localStorage.setItem(EK,JSON.stringify(L)); }catch(e){ try{ L=L.slice(-Math.floor(CAP/2)); localStorage.setItem(EK,JSON.stringify(L)); }catch(x){} }
    judge(ev.n); }
  function reasons(id){ var L=rd(EK,[]); if(!Array.isArray(L)) return null; var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); return evs.length?why(evs):null; }
  g.TJ={rec:rec,judge:judge,all:all,score:score,reasons:reasons};
})(typeof window!=="undefined"?window:this);
</script>
<script>/* 여러 식을 이은 식 줄 나누기(대표님 2026-09-29 「수식 한 줄로, 배치구조 신경」) — 원본은 이 파일 하나(수업 노트·암기노트 템플릿에 빌더가 넣는다, __SPLITTEX__).
   \[ A,\qquad B \] 처럼 서로 다른 식을 \qquad 또는 「,\quad」로 이어 붙인 줄은 식마다 한 줄(\[A\]\[B\])로 — 한 식 안은 가르지 않는다.
   괄호 { } 와 \begin…\end 안의 구분자는 건드리지 않고, 연결 기호만 남은 조각(\Rightarrow·\to·\Leftrightarrow·\therefore)은 다음 식 앞에 붙인다. */
function splitTex(t){
  const parts=[]; let d=0, env=0, cur="", i=0;
  while(i<t.length){
    if(t.startsWith("\\begin{",i)) env++;
    else if(t.startsWith("\\end{",i)) env=Math.max(0,env-1);
    const c=t[i];
    if(c==="\\"&&(t[i+1]==="{"||t[i+1]==="}")){ cur+=t.slice(i,i+2); i+=2; continue; }
    if(c==="{") d++; else if(c==="}") d=Math.max(0,d-1);
    if(!d&&!env){
      let m=0;
      if(t.startsWith("\\qquad",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) m=6;
      else if(t.startsWith(",\\quad",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) m=6;
      if(m){ parts.push(cur); cur=""; i+=m; continue; }
    }
    cur+=c; i++;
  }
  parts.push(cur);
  const out=[]; let carry="";
  parts.map(p=>p.trim().replace(/^,\s*/,"").replace(/,\s*$/,"")).forEach(p=>{
    if(!p) return;
    if(/^(\\(Rightarrow|Leftarrow|Leftrightarrow|to|therefore|because|implies|iff)\s*)+$/.test(p)){ carry+=p+" "; return; }
    out.push(carry+p); carry="";
  });
  if(carry&&out.length) out[out.length-1]+=" "+carry.trim();
  return out.length?out:[t];
}
/* 좁은 화면(폰)에서만: 글자 덩어리(\text{…})를 화살표(\to·\Rightarrow)로 이은 「흐름」 줄은 화살표 단위로 줄을 나눈다 — 수식이 아니라 단계 나열이라 나눠도 식이 갈리지 않는다 */
function splitFlow(t){
  const segs=[]; let d=0, cur="", i=0;
  while(i<t.length){ const c=t[i];
    if(c==="\\"&&(t[i+1]==="{"||t[i+1]==="}")){ cur+=t.slice(i,i+2); i+=2; continue; }
    if(c==="{") d++; else if(c==="}") d=Math.max(0,d-1);
    if(!d){ const m=/^\\ ?\\(to|Rightarrow)(?![a-zA-Z])\\ ?/.exec(t.slice(i))||/^\s*\\(to|Rightarrow)(?![a-zA-Z])\s*/.exec(t.slice(i)); if(m&&cur.trim()){ segs.push(cur); cur="\\"+m[1]+"\\ "; i+=m[0].length; continue; } }
    cur+=c; i++; }
  segs.push(cur);
  const ok=segs.length>=3&&segs.every(s=>/^(\\(to|Rightarrow)\\ )?\s*\\text\{/.test(s.trim()));
  return ok?segs.map(s=>s.trim()):[t];
}
function splitDisplays(html,narrow){
  return String(html).replace(/\\\[([\s\S]*?)\\\]/g,(m,tex)=>{ let ps=splitTex(tex); if(narrow) ps=[].concat(...ps.map(splitFlow)); return ps.length>1?ps.map(p=>"\\["+p+"\\]").join(""):m; });
}
</script>

const D={"slug": "statics", "course": "정역학", "lessons": [{"date": "2026-09-07", "label": "9/7(월) · 2주차", "title": "역학이란 무엇인가 — 그리고 벡터의 첫걸음", "chs": [{"sid": "s1", "title": "역학 = \"힘이 가해졌을 때 물체에 생기는 변화\"", "n": ["mech.statics_intro"], "items": [{"t": "m", "k": "Mechanics", "s": "=", "a": "Statics(평형) + Dynamics(운동)", "id": "2026-09-07-s1-1"}, {"t": "m", "k": "정역학의 두 기둥", "s": "=", "a": "<b>평형방정식<\/b> · <b>모멘트<\/b>", "id": "2026-09-07-s1-2"}, {"t": "m", "k": "이번 학기", "s": "=", "a": "정역학", "id": "2026-09-07-s1-3"}]}, {"sid": "s2", "title": "단위 — 뉴턴은 kg·m/s²", "n": ["mech.statics_intro", "mech.force_types"], "items": [{"t": "f", "a": "\\[1\\ \\mathrm{N}=1\\ \\mathrm{kg\\cdot m/s^2},\\qquad \\mathrm{kN}=10^3\\ \\mathrm N,\\quad \\mathrm{MN}=10^6\\ \\mathrm N,\\qquad 2\\pi\\ \\mathrm{rad}=360^\\circ\\]", "id": "2026-09-07-s2-1"}, {"t": "m", "k": "", "s": "", "a": "\\(1\\ \\mathrm N=1\\ \\mathrm{kg\\,m/s^2}\\)", "id": "2026-09-07-s2-2"}, {"t": "m", "k": "속도", "s": "=", "a": "위치의 변화율, 가속도 = 속도의 변화율 · 각도는 rad", "id": "2026-09-07-s2-3"}]}, {"sid": "s3", "title": "뉴턴의 법칙 — 정역학은 항상 ΣF = 0", "n": ["mech.statics_intro"], "items": [{"t": "m", "k": "정역학", "s": "=", "a": "\\(\\sum\\mathbf F=0\\)", "id": "2026-09-07-s3-1"}, {"t": "m", "k": "입자", "s": "=", "a": "크기 없음 → 모멘트 없음", "id": "2026-09-07-s3-2"}, {"t": "m", "k": "3법칙", "s": "=", "a": "작용·반작용(자유물체도)", "id": "2026-09-07-s3-3"}, {"t": "m", "k": "", "s": "", "a": "\\(W=mg\\)", "id": "2026-09-07-s3-4"}]}, {"sid": "s4", "title": "Ch.2 벡터 — 스칼라와 벡터, 표기, 위치벡터", "n": ["mech.force_vector"], "items": [{"t": "m", "k": "벡터", "s": "=", "a": "크기 + 방향", "id": "2026-09-07-s4-1"}, {"t": "m", "k": "\\(|\\mathbf u|\\)", "s": "=", "a": "크기(스칼라)", "id": "2026-09-07-s4-2"}, {"t": "m", "k": "\\(\\mathbf r_{AB}\\): A", "s": "→", "a": "B", "id": "2026-09-07-s4-3"}]}, {"sid": "s5", "title": "덧셈 · 스칼라배 · 뺄셈", "n": ["mech.force_vector"], "items": [{"t": "f", "a": "\\[\\mathbf u+\\mathbf v=\\mathbf v+\\mathbf u\\ (\\text{교환}),\\quad (\\mathbf u+\\mathbf v)+\\mathbf w=\\mathbf u+(\\mathbf v+\\mathbf w)\\ (\\text{결합}),\\qquad \\mathbf r_{AC}=\\mathbf r_{AB}+\\mathbf r_{BC}\\]", "id": "2026-09-07-s5-1"}, {"t": "m", "k": "삼각형 법칙(꼬리→머리)", "s": "=", "a": "평행사변형 법칙", "id": "2026-09-07-s5-2"}, {"t": "m", "k": "", "s": "", "a": "\\(a\\mathbf u\\): 부호가 방향", "id": "2026-09-07-s5-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf u-\\mathbf v=\\mathbf u+(-\\mathbf v)\\)", "id": "2026-09-07-s5-4"}]}, {"sid": "s6", "title": "단위벡터 — 크기 1, 방향만 남긴다 ★", "n": ["mech.force_vector"], "items": [{"t": "f", "a": "\\[\\mathbf e=\\frac{\\mathbf u}{|\\mathbf u|}\\ (\\mathbf u\\ne\\mathbf 0),\\quad |\\mathbf e|=1,\\qquad \\mathbf u=|\\mathbf u|\\,\\mathbf e\\ (\\text{크기}\\times\\text{방향})\\]", "id": "2026-09-07-s6-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf e=\\mathbf u/|\\mathbf u|\\)", "id": "2026-09-07-s6-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf u=|\\mathbf u|\\mathbf e\\)", "id": "2026-09-07-s6-3"}]}], "classroom": "../classroom/statics/2026-09-07.html"}, {"date": "2026-09-09", "label": "9/9(수) · 2주차", "title": "벡터를 숫자로 다루기 — 성분 · 방향여현 · 내적의 정의", "chs": [{"sid": "s1", "title": "2차원 성분 — 벡터를 두 숫자로", "n": ["mech.force_vector", "mech.force_3d", "mech.dot_apps"], "items": [{"t": "f", "a": "\\[\\mathbf U=U_x\\,\\mathbf i+U_y\\,\\mathbf j,\\qquad |\\mathbf U|=\\sqrt{U_x^2+U_y^2}\\] \\[\\mathbf U+\\mathbf V=(U_x+V_x)\\mathbf i+(U_y+V_y)\\mathbf j,\\qquad a\\mathbf U=aU_x\\,\\mathbf i+aU_y\\,\\mathbf j\\]", "id": "2026-09-09-s1-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U=U_x\\mathbf i+U_y\\mathbf j\\)", "id": "2026-09-09-s1-2"}, {"t": "m", "k": "", "s": "", "a": "\\(|\\mathbf U|=\\sqrt{U_x^2+U_y^2}\\)", "id": "2026-09-09-s1-3"}, {"t": "m", "k": "", "s": "", "a": "덧셈은 같은 성분끼리", "id": "2026-09-09-s1-4"}]}, {"sid": "s2", "title": "두 점 사이의 위치벡터 = \"끝점 − 시작점\" ★", "n": ["mech.dot_apps", "mech.force_vector"], "items": [{"t": "f", "a": "\\[\\mathbf r_{AB}=(x_B-x_A)\\mathbf i+(y_B-y_A)\\mathbf j\\ \\ (+(z_B-z_A)\\mathbf k),\\qquad |\\mathbf r_{AB}|=\\sqrt{\\Delta x^2+\\Delta y^2+\\Delta z^2}\\]", "id": "2026-09-09-s2-1"}, {"t": "m", "k": "\\(\\mathbf r_{AB}\\)", "s": "=", "a": "(B 좌표) − (A 좌표), 성분마다", "id": "2026-09-09-s2-2"}, {"t": "m", "k": "", "s": "", "a": "크기는 \\(\\sqrt{\\Delta x^2+\\Delta y^2+\\Delta z^2}\\)", "id": "2026-09-09-s2-3"}]}, {"sid": "s3", "title": "3차원 성분과 방향여현 ★★", "n": ["mech.force_3d", "mech.dot_apps"], "items": [{"t": "f", "a": "\\[U_x=|\\mathbf U|\\cos\\theta_x,\\quad U_y=|\\mathbf U|\\cos\\theta_y,\\quad U_z=|\\mathbf U|\\cos\\theta_z\\qquad\\Rightarrow\\qquad \\cos^2\\theta_x+\\cos^2\\theta_y+\\cos^2\\theta_z=1\\]", "id": "2026-09-09-s3-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\cos^2\\theta_x+\\cos^2\\theta_y+\\cos^2\\theta_z=1\\)", "id": "2026-09-09-s3-2"}, {"t": "m", "k": "성분", "s": "=", "a": "크기 × 방향여현 · 오른손 좌표계", "id": "2026-09-09-s3-3"}]}, {"sid": "s4", "title": "단위벡터의 성분 = 방향여현 → 케이블 힘 쓰기 ★", "n": ["mech.force_3d"], "items": [{"t": "f", "a": "\\[\\mathbf e=\\frac{\\mathbf U}{|\\mathbf U|}=\\frac{U_x}{|\\mathbf U|}\\mathbf i+\\frac{U_y}{|\\mathbf U|}\\mathbf j+\\frac{U_z}{|\\mathbf U|}\\mathbf k=\\cos\\theta_x\\,\\mathbf i+\\cos\\theta_y\\,\\mathbf j+\\cos\\theta_z\\,\\mathbf k\\]", "id": "2026-09-09-s4-1"}, {"t": "f", "a": "\\[\\mathbf e_{AB}=\\frac{\\mathbf r_{AB}}{|\\mathbf r_{AB}|},\\qquad \\mathbf F=|\\mathbf F|\\,\\mathbf e_{AB}=|\\mathbf F|\\,\\frac{\\mathbf r_{AB}}{|\\mathbf r_{AB}|}\\]", "id": "2026-09-09-s4-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf e=\\cos\\theta_x\\mathbf i+\\cos\\theta_y\\mathbf j+\\cos\\theta_z\\mathbf k\\)", "id": "2026-09-09-s4-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf F=|\\mathbf F|\\,\\mathbf r_{AB}/|\\mathbf r_{AB}|\\)", "id": "2026-09-09-s4-4"}, {"t": "m", "k": "단위벡터 검산: 성분 제곱합", "s": "=", "a": "1", "id": "2026-09-09-s4-5"}]}, {"sid": "s5", "title": "내적(dot product)의 정의 — \"왜 배우나\"부터", "n": ["mech.dot_apps", "mech.projection"], "items": [{"t": "f", "a": "\\[\\mathbf U\\cdot\\mathbf V=|\\mathbf U||\\mathbf V|\\cos\\theta\\qquad(\\text{결과는 스칼라})\\]", "id": "2026-09-09-s5-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U\\cdot\\mathbf V=|\\mathbf U||\\mathbf V|\\cos\\theta\\) · 스칼라 · 수직 ⇔ 0 · 쓰임: 사이각", "id": "2026-09-09-s5-2"}, {"t": "m", "k": "", "s": "", "a": "평행/수직 분해(9/14 정사영)", "id": "2026-09-09-s5-3"}]}], "classroom": "../classroom/statics/2026-09-09.html"}, {"date": "2026-09-14", "label": "9/14(월) · 3주차", "title": "내적으로 각과 정사영을, 외적으로 모멘트를 — 벡터의 두 곱셈", "chs": [{"sid": "s1", "title": "내적의 성질과 단위벡터 표", "n": ["mech.dot_apps", "mech.projection"], "items": [{"t": "f", "a": "\\[\\mathbf U\\cdot\\mathbf V=\\mathbf V\\cdot\\mathbf U\\ (\\text{교환}),\\quad a(\\mathbf U\\cdot\\mathbf V)=(a\\mathbf U)\\cdot\\mathbf V=\\mathbf U\\cdot(a\\mathbf V),\\quad \\mathbf U\\cdot(\\mathbf V+\\mathbf W)=\\mathbf U\\cdot\\mathbf V+\\mathbf U\\cdot\\mathbf W\\ (\\text{분배})\\]", "id": "2026-09-14-s1-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf i\\cdot\\mathbf i=\\mathbf j\\cdot\\mathbf j=\\mathbf k\\cdot\\mathbf k=1\\)", "id": "2026-09-14-s1-2"}, {"t": "m", "k": "", "s": "", "a": "서로 다른 것끼리 0", "id": "2026-09-14-s1-3"}, {"t": "m", "k": "", "s": "", "a": "교환·분배 성립", "id": "2026-09-14-s1-4"}]}, {"sid": "s2", "title": "성분으로 내적 → 두 벡터 사이의 각 ★", "n": ["mech.dot_apps", "mech.projection"], "items": [{"t": "f", "a": "\\[\\mathbf U\\cdot\\mathbf V=U_xV_x+U_yV_y+U_zV_z\\qquad\\Rightarrow\\qquad \\cos\\theta=\\frac{U_xV_x+U_yV_y+U_zV_z}{|\\mathbf U||\\mathbf V|},\\quad \\theta=\\cos^{-1}\\!\\left(\\frac{\\mathbf U\\cdot\\mathbf V}{|\\mathbf U||\\mathbf V|}\\right)\\]", "id": "2026-09-14-s2-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U\\cdot\\mathbf V=U_xV_x+U_yV_y+U_zV_z\\)", "id": "2026-09-14-s2-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\theta=\\cos^{-1}\\big(\\mathbf U\\cdot\\mathbf V/|\\mathbf U||\\mathbf V|\\big)\\)", "id": "2026-09-14-s2-3"}]}, {"sid": "s3", "title": "직선에 평행·수직한 성분 — 정사영 ★★", "n": ["mech.projection"], "items": [{"t": "f", "a": "\\[|\\mathbf U_p|=|\\mathbf U\\cdot\\mathbf e|=|\\mathbf U||\\cos\\theta|,\\qquad \\mathbf e\\cdot\\mathbf U=|\\mathbf e||\\mathbf U|\\cos\\theta=|\\mathbf U|\\cos\\theta\\ (\\text{L 방향 스칼라 성분})\\] \\[\\boxed{\\ \\mathbf U_p=(\\mathbf U\\cdot\\mathbf e)\\,\\mathbf e\\ }\\qquad \\mathbf U_n=\\mathbf U-\\mathbf U_p\\]", "id": "2026-09-14-s3-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U_p=(\\mathbf U\\cdot\\mathbf e)\\mathbf e\\)", "id": "2026-09-14-s3-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf U_n=\\mathbf U-\\mathbf U_p\\)", "id": "2026-09-14-s3-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf e\\)는 반드시 단위벡터", "id": "2026-09-14-s3-4"}, {"t": "m", "k": "", "s": "", "a": "검산 \\(\\mathbf U_n\\cdot\\mathbf e=0\\)", "id": "2026-09-14-s3-5"}]}, {"sid": "s4", "title": "외적(cross product) — 정의 · 오른손 법칙 · 넓이", "n": ["mech.cross_apps"], "items": [{"t": "f", "a": "\\[\\mathbf U\\times\\mathbf V=|\\mathbf U||\\mathbf V|\\sin\\theta\\ \\mathbf e\\qquad(\\mathbf e\\perp\\mathbf U,\\ \\mathbf e\\perp\\mathbf V,\\ |\\mathbf e|=1)\\] \\[\\mathbf V\\times\\mathbf U=-(\\mathbf U\\times\\mathbf V),\\qquad \\mathbf U\\parallel\\mathbf V\\Rightarrow\\mathbf U\\times\\mathbf V=0\\]", "id": "2026-09-14-s4-1"}, {"t": "m", "k": "", "s": "", "a": "\\(|\\mathbf U\\times\\mathbf V|=|\\mathbf U||\\mathbf V|\\sin\\theta\\) = 평행사변형 넓이", "id": "2026-09-14-s4-2"}, {"t": "m", "k": "방향", "s": "=", "a": "평면에 수직, 오른손", "id": "2026-09-14-s4-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf V\\times\\mathbf U=-\\mathbf U\\times\\mathbf V\\) · 평행 ⇔ 0", "id": "2026-09-14-s4-4"}]}, {"sid": "s5", "title": "성질 · 단위벡터 순환 · 성분 전개 · 행렬식 ★★", "n": ["mech.cross_apps"], "items": [{"t": "f", "a": "\\[a(\\mathbf U\\times\\mathbf V)=(a\\mathbf U)\\times\\mathbf V=\\mathbf U\\times(a\\mathbf V),\\qquad \\mathbf U\\times(\\mathbf V+\\mathbf W)=\\mathbf U\\times\\mathbf V+\\mathbf U\\times\\mathbf W\\]", "id": "2026-09-14-s5-1"}, {"t": "f", "a": "\\[\\mathbf U\\times\\mathbf V=(U_yV_z-U_zV_y)\\,\\mathbf i-(U_xV_z-U_zV_x)\\,\ cle"], "items": [{"t": "f", "a": "\\[\\mathbf F=\\mathbf N+\\mathbf f\\qquad(\\mathbf N\\perp\\text{면},\\ \\mathbf f\\parallel\\text{면}),\\qquad \\mathbf F_{손\\to벽}=-\\mathbf F_{벽\\to손}\\]", "id": "2026-09-16-s3-1"}, {"t": "m", "k": "", "s": "", "a": "접촉력 \\(\\mathbf F=\\mathbf N+\\mathbf f\\)", "id": "2026-09-16-s3-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf N\\) 수직", "id": "2026-09-16-s3-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\mathbf f\\) 평행 · 곡면은 접평면", "id": "2026-09-16-s3-4"}, {"t": "m", "k": "", "s": "", "a": "3법칙 \\(\\mathbf F_{A\\to B}=-\\mathbf F_{B\\to A}\\)", "id": "2026-09-16-s3-5"}]}, {"sid": "s4", "title": "장력 · 도르래 · 스프링", "n": ["mech.equilibrium_particle"], "items": [{"t": "m", "k": "장력 작용선", "s": "=", "a": "케이블 방향", "id": "2026-09-16-s4-1"}, {"t": "m", "k": "", "s": "", "a": "이상적인 도르래 \\(T_1=T_2\\)", "id": "2026-09-16-s4-2"}, {"t": "m", "k": "", "s": "", "a": "스프링 \\(F=k|L-L_0|\\)(F 는 N, k 는 N/m)", "id": "2026-09-16-s4-3"}, {"t": "m", "k": "늘림", "s": "→", "a": "당김, 압축 → 밈", "id": "2026-09-16-s4-4"}]}, {"sid": "s5", "title": "입자의 평형 ⇔ ΣF = 0 · 자유물체도 3단계 ★★", "n": ["mech.fbd"], "items": [{"t": "f", "a": "\\[\\text{입자의 평형}\\ \\Leftrightarrow\\ \\sum\\mathbf F_{\\text{외력}}=0\\] <b>자유물체도 3단계<\/b>: ① 분리할 물체를 정한다 → ② 주변에서 떼어내 그 물체만 그린다 → ③ 모든 외력을 표시한다", "id": "2026-09-16-s5-1"}, {"t": "m", "k": "평형", "s": "=", "a": "가속도 0 = 정지 또는 등속", "id": "2026-09-16-s5-2"}, {"t": "m", "k": "", "s": "", "a": "입자는 \\(\\sum\\mathbf F=0\\)(강체는 \\(\\sum\\mathbf M=0\\)도)", "id": "2026-09-16-s5-3"}, {"t": "m", "k": "", "s": "", "a": "FBD ① 물체 정하기 ② 떼어내 그리기 ③ 모든 외력", "id": "2026-09-16-s5-4"}]}], "classroom": "../classroom/statics/2026-09-16.html"}]}, KEY="mc-memo-"+D.slug;

let ST={}; try{ ST=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ ST={}; }
let UI={hide:false,left:false}; try{ UI=Object.assign(UI,JSON.parse(localStorage.getItem(KEY+"-ui")||"{}")); }catch(e){}
const CH={}; D.lessons.forEach(l=>l.chs.forEach(c=>{ CH[l.date+"|"+c.sid]=c; }));
function ev(k,x){ try{ if(window.TJ){ const o=Object.assign({k:k},x||{}); if(o.n&&o.n.length) TJ.rec(o); } }catch(e){} }
function itemHTML(it){ return '<div class="it '+(it.t==="f"?"f":"m")+(ST[it.id]?" done":"")+'" data-id="'+esc(it.id)+'"><div class="c">'+(it.k?'<span class="k">'+it.k+'</span><span class="sep">'+esc(it.s)+'</span> ':'')+'<span class="ans">'+splitDisplays(it.a,innerWidth<700)+'</span></div><button type="button" class="ck" aria-label="외움" aria-pressed="'+(ST[it.id]?"true":"false")+'"></button></div>'; }
function render(){
  $("#dates").innerHTML=D.lessons.map(l=>'<a href="#d'+l.date+'">'+esc(l.label.split(" · ")[0])+'</a>').join("");
  $("#list").innerHTML=D.lessons.map(l=>'<section class="ls" id="d'+l.date+'" data-date="'+l.date+'"><h2><span class="dt">'+esc(l.label)+'</span>'+esc(l.title)+'<a class="go" href="'+esc(l.classroom)+'">교실</a></h2>'+
    l.chs.map(c=>'<div class="ch" data-k="'+l.date+"|"+esc(c.sid)+'"><h3>'+esc(c.title)+'</h3>'+c.items.map(itemHTML).join("")+'</div>').join("")+'</section>').join("");
  try{ renderMathInElement($("#list"),{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  fit(); bind(); stat(); }
/* 식은 한 줄 — 넘치면 글자를 줄여서(14px 까지), 그래도 넘치면 식 안에서 밀어 본다 */
function fit(){ $$(".katex-display").forEach(k=>{ k.style.fontSize=""; const cw=k.clientWidth, sw=k.scrollWidth; if(!(cw>0&&sw>cw+1)) return; const kx=k.querySelector(".katex"), fz=parseFloat(getComputedStyle(kx||k).fontSize)||20, lo=Math.min(1,Math.max(.6,14/fz)); k.style.fontSize=Math.max(lo,Math.floor(cw/sw*100)/100)+"em"; });
  $$(".katex").forEach(k=>{ if(k.closest(".katex-display")) return; k.style.fontSize=""; const box=k.closest(".c"); if(!box) return; const cw=box.clientWidth, w=k.getBoundingClientRect().width; if(cw>0&&w>cw-2){ const fs=parseFloat(getComputedStyle(k).fontSize)||17; k.style.fontSize=Math.max(14,Math.floor(fs*(cw-6)/w))+"px"; } }); }
function stat(){ const all=$$(".it"), dn=all.filter(x=>x.classList.contains("done")).length; $("#cnt").textContent="외움 "+dn+"/"+all.length; $("#barI").style.width=(all.length?Math.round(dn/all.length*100):0)+"%";
  $$(".ch").forEach(c=>c.classList.toggle("alldone",$$(".it",c).every(x=>x.classList.contains("done"))));
  $$(".ls").forEach(l=>l.classList.toggle("alldone",$$(".ch",l).every(c=>c.classList.contains("alldone"))));
  document.body.classList.toggle("none",all.length>0&&dn===all.length); }
function bind(){ $$(".it").forEach(el=>{ const id=el.dataset.id, ch=el.closest(".ch"), c=CH[ch.dataset.k]||{}, date=ch.dataset.k.split("|")[0];
  el.querySelector(".c").onclick=()=>{ if(document.body.classList.contains("hide")) el.classList.toggle("show"); };
  el.querySelector(".ck").onclick=()=>{ const on=!ST[id]; if(on) ST[id]=1; else delete ST[id]; try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){}
    el.classList.toggle("done",on); el.querySelector(".ck").setAttribute("aria-pressed",on?"true":"false"); stat();
    ev("memo",{ok:on,n:c.n||[],lid:D.slug+"-"+date,sid:c.sid}); }; }); }
function ui(){ document.body.classList.toggle("hide",UI.hide); document.body.classList.toggle("left",UI.left); $("#bHide").setAttribute("aria-pressed",UI.hide?"true":"false"); $("#bLeft").setAttribute("aria-pressed",UI.left?"true":"false");
  $$(".it.show").forEach(x=>x.classList.remove("show")); try{ localStorage.setItem(KEY+"-ui",JSON.stringify(UI)); }catch(e){} }
$("#bHide").onclick=()=>{ UI.hide=!UI.hide; ui(); }; $("#bLeft").onclick=()=>{ UI.left=!UI.left; ui(); };
window.addEventListener("resize",fit,{passive:true});
function boot(){ render(); ui(); const h=location.hash; if(h&&/^#d\d{4}-\d{2}-\d{2}$/.test(h)){ const el=document.querySelector(h); if(el) setTimeout(()=>el.scrollIntoView(),60); }
  try{ document.fonts.ready.then(fit); }catch(e){} }
(function wait(){ if(window.renderMathInElement) boot(); else setTimeout(wait,40); })();
</script>
</body>
</html>
