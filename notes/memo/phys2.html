<script>/* 김주영 스앵님 판정 (대표님 2026-09-29 「개념 마인드맵은 스앵님이 학습을 통해 내가 뭘 알고 뭘 모르는지 알아서 파악」) — 원본은 이 파일 하나.
   빌더가 교실·수업 노트·학습 덱·암기노트 페이지에 그대로 넣고(__JUDGE__), learn.html 은 patch_learn_judge.py 가 TJ-START~TJ-END 사이를 이 파일로 갈아 끼운다.
   기록 = localStorage atto.evidence [{t, k, n:[노드], ok, v, lid, sid, qid, a, clean}] (최대 4000건 — 넘치면 읽기·질문 기록부터 버리고 노드마다 최근 문제 6건은 남긴다)
     k: quiz(ok) 확인 문제 · read(clean) 챕터·섹션 끝(다시 설명·질문 없이 끝났으면 clean) · again 다시 설명 · ask 질문 · memo(ok) 암기노트 외움 · self(v) 카드 자가평가
     a: 같은 시도 표시(카드 「다시 저장」) — 같은 a·qid 는 새 기록으로 바꿔 넣는다(정답 수가 늘지 않는다)
   판정 = 노드마다 atto.mastery[id] = {quiz:{correct,total,ts}, self, sts, ts, score, state, auto} — learn.html 은 TJ.score 로 같은 식을 쓴다.
     quiz = 최근 6번 · self(설명할 수 있나 1~5) = 읽음 4 · 다시 설명·질문 2번 이상이면 3 · 외움 +1 · 카드 자가평가가 더 최근이면 그 값
     → 문제 없이 읽기만 하면 최대 「흔들림」, 「안다」는 문제로만. 점수식 = (0.5·정답률·감쇠(quiz.ts) + 0.2·self/5·감쇠(sts))/0.7, 문제 없으면 self/5·0.6·감쇠(sts)
     감쇠 = 60일에 걸쳐 1 → 0.4 (최저 0.4). 정답 근거와 읽기·암기 근거를 따로 감쇠한다 — 오늘 암기 체크 하나로 90일 전 정답이 새것처럼 되지 않게(오타 .91 설계 검수 ⑦)
   저장이 막히면(용량·사생활 모드) 이 페이지 안에서는 메모리 사본으로 이어 가고 rec 은 false 를 돌려준다. */
(function(g){
  var EK="atto.evidence", MK="atto.mastery", CAP=4000, KEEPQ=6, MEM={}, DIRTY={};
  function rd(k,d){ if(DIRTY[k]) return MEM[k]; try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return v==null?d:v; }catch(e){ return DIRTY[k]?MEM[k]:d; } }
  function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); DIRTY[k]=false; return true; }catch(e){ MEM[k]=v; DIRTY[k]=true; return false; } }
  function decay(ts){ if(!ts) return 1; var d=Math.max(0,(Date.now()/1000-ts)/86400); return Math.max(.4,1-d/60); }
  function score(e){ if(!e||typeof e!=="object") return {score:0,state:"unrated"};
    var q=e.quiz||{}, tot=+q.total||0, cor=+q.correct||0, sv=e.self==null?null:Math.max(1,Math.min(5,+e.self));
    if(tot<=0&&sv==null) return {score:0,state:"unrated"};
    var dq=decay(+q.ts||+e.ts||0), ds=decay(+e.sts||+e.ts||0);
    var raw=tot>0?(0.5*(cor/tot)*dq+0.2*((sv||0)/5)*ds)/0.7:(sv/5)*0.6*ds, s=Math.min(1,raw), st;
    if(tot<=0) st=(sv>=4&&s>=.4)?"shaky":"unknown"; else st=s>=.7?"known":s>=.4?"shaky":"unknown";
    return {score:Math.round(s*1000)/1000,state:st}; }
  function why(evs){ var qz=evs.filter(function(e){return e.k==="quiz";}).slice(-KEEPQ), r={q:qz.length,c:qz.filter(function(e){return e.ok;}).length,
      read:evs.filter(function(e){return e.k==="read";}).length, clean:evs.filter(function(e){return e.k==="read"&&e.clean;}).length,
      conf:evs.filter(function(e){return (e.k==="again"||e.k==="ask")&&Date.now()-e.t<21*864e5;}).length,
      memo:null, self:null, last:0, selfLast:0};
    evs.forEach(function(e){ if(e.k==="memo") r.memo=!!e.ok; if(e.k==="self") r.self={v:+e.v,t:e.t}; if(e.t>r.last) r.last=e.t; if(e.k!=="quiz"&&e.t>r.selfLast) r.selfLast=e.t; });
    return r; }
  function judgeOne(id,L,M){ var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); if(!evs.length) return;
    var r=why(evs), e=Object.assign({},M[id]||{}), qz=evs.filter(function(x){return x.k==="quiz";}).slice(-KEEPQ);
    var self=null; if(r.read||r.conf||r.memo!=null){ self=r.read?4:3; if(r.conf>=2) self=3; if(r.memo) self=Math.min(5,self+1); }
    var autoLast=0; evs.forEach(function(x){ if(x.k!=="self"&&x.t>autoLast) autoLast=x.t; });
    if(r.self&&r.self.t>=autoLast) self=r.self.v;
    e.quiz=qz.length?{correct:r.c,total:qz.length,ts:Math.round(qz[qz.length-1].t/1000)}:undefined; if(!e.quiz) delete e.quiz;
    e.self=self; if(self==null){ delete e.self; delete e.sts; } else e.sts=Math.round(r.selfLast/1000);
    e.ts=Math.round(r.last/1000); e.auto={by:"tutor",q:r.q,c:r.c,read:r.read,clean:r.clean,conf:r.conf,memo:r.memo};
    var s=score(e); e.score=s.score; e.state=s.state; M[id]=e; }
  function judge(ids){ var L=rd(EK,[]), M=rd(MK,{}); if(!Array.isArray(L)) L=[]; if(!M||typeof M!=="object") M={}; (ids||[]).forEach(function(id){ judgeOne(id,L,M); });
    wr(MK,M); return M; }
  function all(){ var L=rd(EK,[]), o={}; if(Array.isArray(L)) L.forEach(function(e){ (e&&e.n||[]).forEach(function(i){ o[i]=1; }); }); return judge(Object.keys(o)); }
  /* 상한 넘침: 노드마다 최근 문제 KEEPQ 건은 지키고, 나머지(읽기·질문·오래된 문제)에서 오래된 것부터 버린다 — 다른 노드 활동으로 정답 기록이 사라지지 않게 */
  function trim(L,cap){ cap=cap||CAP; if(L.length<=cap) return L; var seen={}, keep=[], rest=[], i;
    for(i=L.length-1;i>=0;i--){ var e=L[i], k=false; if(e&&e.k==="quiz") (e.n||[]).forEach(function(id){ seen[id]=(seen[id]||0)+1; if(seen[id]<=KEEPQ) k=true; }); (k?keep:rest).push(e); }
    keep.reverse(); rest.reverse(); rest=rest.slice(Math.max(0,rest.length-Math.max(0,cap-keep.length)));
    return keep.concat(rest).sort(function(a,b){ return (a.t||0)-(b.t||0); }); }
  function rec(ev){ if(!ev||!Array.isArray(ev.n)||!ev.n.length) return false; var L=rd(EK,[]); if(!Array.isArray(L)) L=[];
    ev.t=Date.now();
    if(ev.a!=null&&ev.qid!=null){ for(var i=L.length-1;i>=0;i--){ var x=L[i]; if(x&&x.k===ev.k&&x.qid===ev.qid&&x.a===ev.a){ L.splice(i,1); break; } } }
    L.push(ev); L=trim(L);
    /* 저장 실패 → 절반 상한으로 다시(이때도 노드마다 최근 정답은 지킨다, 오타 설계 2차) · 그래도 실패면 메모리 사본은 자르지 않은 전체로 */
    var ok=wr(EK,L); if(!ok){ var half=trim(L,Math.floor(CAP/2)); if(wr(EK,half)){ L=half; ok=true; } else { MEM[EK]=L; DIRTY[EK]=true; } }
    judge(ev.n); return ok; }
  function reasons(id){ var L=rd(EK,[]); if(!Array.isArray(L)) return null; var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); return evs.length?why(evs):null; }
  g.TJ={rec:rec,judge:judge,all:all,score:score,reasons:reasons,trim:trim};
})(typeof window!=="undefined"?window:this);
</script>
<script>/* 여러 식을 이은 식 줄 나누기(대표님 2026-09-29 「수식 한 줄로, 배치구조 신경」) — 원본은 이 파일 하나(수업 노트·암기노트 템플릿에 빌더가 넣는다, __SPLITTEX__).
   \[ A,\qquad B \] 처럼 서로 다른 식을 \qquad 또는 「,\quad」로 이어 붙인 줄은 식마다 한 줄(\[A\]\[B\])로 — 한 식 안은 가르지 않는다.
   괄호 { } 와 \begin…\end 안의 구분자는 건드리지 않고, 연결 기호만 남은 조각(\Rightarrow·\to·\Leftrightarrow·\therefore)은 다음 식 앞에 붙인다. */
/* 괄호 깊이: ( ) [ ] 와 \left…\right 안에서는 나누지 않는다 — \left(a\qquad b\right) 가 갈렸다(오타 .91 설계 검수 ④) */
function parenStep(t,i,p){
  if(t.startsWith("\\left",i)&&!/[a-zA-Z]/.test(t[i+5]||"")) return p+1;
  if(t.startsWith("\\right",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) return Math.max(0,p-1);
  const c=t[i]; if(c==="("||c==="[") return p+1; if(c===")"||c==="]") return Math.max(0,p-1); return p;
}
function splitTex(t){
  const parts=[]; let d=0, env=0, p=0, cur="", i=0;
  while(i<t.length){
    if(t.startsWith("\\begin{",i)) env++;
    else if(t.startsWith("\\end{",i)) env=Math.max(0,env-1);
    const c=t[i];
    if(c==="\\"&&(t[i+1]==="{"||t[i+1]==="}")){ cur+=t.slice(i,i+2); i+=2; continue; }
    if(c==="{") d++; else if(c==="}") d=Math.max(0,d-1);
    p=parenStep(t,i,p);
    if(!d&&!env&&!p){
      let m=0;
      if(t.startsWith("\\qquad",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) m=6;
      else if(t.startsWith(",\\quad",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) m=6;
      if(m){ parts.push(cur); cur=""; i+=m; continue; }
    }
    cur+=c; i++;
  }
  parts.push(cur);
  const out=[]; let carry="";
  parts.map(p=>p.trim().replace(/^,\s*/,"").replace(/,\s*$/,"")).forEach(p=>{
    if(!p) return;
    if(/^(\\(Rightarrow|Leftarrow|Leftrightarrow|to|therefore|because|implies|iff)\s*)+$/.test(p)){ carry+=p+" "; return; }
    out.push(carry+p); carry="";
  });
  if(carry&&out.length) out[out.length-1]+=" "+carry.trim();
  return out.length?out:[t];
}
/* 좁은 화면(폰)에서만: 글자 덩어리(\text{…})를 화살표(\to·\Rightarrow)로 이은 「흐름」 줄은 화살표 단위로 줄을 나눈다 — 수식이 아니라 단계 나열이라 나눠도 식이 갈리지 않는다 */
function splitFlow(t){
  const segs=[]; let d=0, p=0, cur="", i=0;
  while(i<t.length){ const c=t[i];
    if(c==="\\"&&(t[i+1]==="{"||t[i+1]==="}")){ cur+=t.slice(i,i+2); i+=2; continue; }
    if(c==="{") d++; else if(c==="}") d=Math.max(0,d-1);
    p=parenStep(t,i,p);
    if(!d&&!p){ const m=/^\\ ?\\(to|Rightarrow)(?![a-zA-Z])\\ ?/.exec(t.slice(i))||/^\s*\\(to|Rightarrow)(?![a-zA-Z])\s*/.exec(t.slice(i)); if(m&&cur.trim()){ segs.push(cur); cur="\\"+m[1]+"\\ "; i+=m[0].length; continue; } }
    cur+=c; i++; }
  segs.push(cur);
  const ok=segs.length>=3&&segs.every(s=>/^(\\(to|Rightarrow)\\ )?\s*\\text\{/.test(s.trim()));
  return ok?segs.map(s=>s.trim()):[t];
}
function splitDisplays(html,narrow){
  return String(html).replace(/\\\[([\s\S]*?)\\\]/g,(m,tex)=>{ let ps=splitTex(tex); if(narrow) ps=[].concat(...ps.map(splitFlow)); return ps.length>1?ps.map(p=>"\\["+p+"\\]").join(""):m; });
}

<script>
const D={"slug": "phys2", "course": "일반물리학2", "lessons": [{"date": "2026-09-04", "label": "9/4(금) · 1주차", "title": "전하와 전기장 — \"전기와 자기는 똑같다\"", "chs": [{"sid": "s1", "title": "전기의 소스는 전하 — 세는 습관부터", "n": ["em.charge"], "items": [{"t": "f", "a": "\\[q = n\\,e\\qquad (n = \\text{개수},\\ e = 1.6\\times10^{-19}\\ \\mathrm{C})\\] 전하량을 보면 <b>개수<\/b>가 보여야 한다. \\(3.2\\times10^{-19}\\) C → 2개.", "id": "2026-09-04-s1-1"}, {"t": "m", "k": "", "s": "", "a": "\\(q=ne\\), \\(e=1.6\\times10^{-19}\\) C", "id": "2026-09-04-s1-2"}, {"t": "m", "k": "전하", "s": "=", "a": "알짜(net)", "id": "2026-09-04-s1-3"}, {"t": "m", "k": "전자 하나", "s": "=", "a": "전기력선 하나", "id": "2026-09-04-s1-4"}]}, {"sid": "s2", "title": "전기장 = \"+1 C을 놓았을 때 받는 힘\"", "n": ["em.field", "em.field_lines"], "items": [{"t": "m", "k": "", "s": "", "a": "\\(\\vec E=\\vec F/q_0\\) [N/C]", "id": "2026-09-04-s2-1"}, {"t": "m", "k": "", "s": "", "a": "기준은 <b>+1 C<\/b>", "id": "2026-09-04-s2-2"}, {"t": "m", "k": "", "s": "", "a": "전기력선은 +에서 나와 −로 들어간다", "id": "2026-09-04-s2-3"}, {"t": "m", "k": "선의 밀도", "s": "=", "a": "세기, 접선 = 방향", "id": "2026-09-04-s2-4"}, {"t": "m", "k": "+1 C", "s": "=", "a": "전기력선 \\(6\\times10^{18}\\)개", "id": "2026-09-04-s2-5"}]}, {"sid": "s3", "title": "세는 방법은 둘뿐 — 합(Σ) 아니면 적분(∫)", "n": ["em.continuous", "em.superposition"], "items": [{"t": "m", "k": "", "s": "", "a": "<b>불연속 → Σ<\/b>: 점전하 · 점전하군", "id": "2026-09-04-s3-1"}, {"t": "m", "k": "", "s": "", "a": "전기쌍극자<br><b>연속 → ∫dq<\/b>: 직선 도선(\\(\\lambda\\))", "id": "2026-09-04-s3-2"}, {"t": "m", "k": "", "s": "", "a": "원형 도선(\\(\\lambda\\))", "id": "2026-09-04-s3-3"}, {"t": "m", "k": "", "s": "", "a": "원판(\\(\\sigma\\))", "id": "2026-09-04-s3-4"}, {"t": "m", "k": "", "s": "", "a": "\\(dq=\\lambda\\,ds=\\sigma\\,dA=\\rho\\,dV\\)", "id": "2026-09-04-s3-5"}]}, {"sid": "s4", "title": "쿨롱 법칙 — 1학기 만유인력과 같은 꼴", "n": ["em.coulomb"], "items": [{"t": "f", "a": "\\[\\vec F=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q_1q_2}{r^2}\\hat r,\\qquad \\frac{1}{4\\pi\\varepsilon_0 ) — 벡터 \\(\\vec r\\)로 쓰기", "id": "2026-09-09-s1-2"}, {"t": "m", "k": "", "s": "", "a": "\\(q\\)의 부호 그대로 · 단위 N/C", "id": "2026-09-09-s1-3"}, {"t": "m", "k": "", "s": "", "a": "\\(\\hat r=\\vec r/r\\)", "id": "2026-09-09-s1-4"}]}, {"sid": "s2", "title": "점전하군 — 겹치면 벡터로 더한다 (중첩 원리)", "n": ["em.superposition", "em.potential", "em.field"], "items": [{"t": "f", "a": "\\[\\vec E=\\sum_i\\vec E_i=\\frac{1}{4\\pi\\varepsilon_0}\\sum_i\\frac{q_i}{r_i^2}\\hat r_i\\]", "id": "2026-09-09-s2-1"}]}, {"sid": "s3", "title": "전기 쌍극자 — 멀리서는 1/z³으로 사라진다", "n": ["em.dipole"], "items": [{"t": "f", "a": "\\[E=\\frac{1}{4\\pi\\varepsilon_0}\\left[\\frac{q}{(z-d/2)^2}-\\frac{q}{(z+d/2)^2}\\right]\\ \\xrightarrow{\\ z\\gg d\\ }\\ \\frac{1}{4\\pi\\varepsilon_0}\\frac{2qd}{z^3}=\\frac{1}{2\\pi\\varepsilon_0}\\frac{p}{z^3}\\]", "id": "2026-09-09-s3-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\vec p=q\\vec d\\)(방향은 −에서 +로)", "id": "2026-09-09-s3-2"}, {"t": "m", "k": "", "s": "", "a": "축 위 멀리서 \\(E=\\dfrac{1}{2\\pi\\varepsilon_0}\\dfrac{p}{z^3}\\)", "id": "2026-09-09-s3-3"}, {"t": "m", "k": "", "s": "", "a": "균일한 장 안에서 토크 \\(\\vec\\tau=\\vec p\\times\\vec E\\), 위치 에너지 \\(U=-\\vec p\\cdot\\vec E\\)(강의노트 p.8 — 장과 나란할 때 에너지 최소)", "id": "2026-09-09-s3-4"}]}, {"sid": "s4", "title": "직선 도선 — 연속 분포의 첫 예: 조각 → 적분", "n": ["em.continuous"], "items": [{"t": "f", "a": "\\[dE_x=\\frac{1}{4\\pi\\varepsilon_0}\\frac{\\lambda\\,dx}{x^2},\\qquad E=\\int_a^{a+L}\\frac{1}{4\\pi\\varepsilon_0}\\frac{\\lambda}{x^2}dx=\\frac{\\lambda}{4\\pi\\varepsilon_0}\\left[-\\frac1x\\right]_a^{a+L}=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{a(a+L)}\\]", "id": "2026-09-09-s4-1"}]}], "classroom": "../classroom/phys2/2026-09-09.html"}, {"date": "2026-09-11", "label": "9/11(금) · 2주차", "title": "원형 도선 · 원판의 전기장 — 그리고 가우스 법칙의 축구공", "chs": [{"sid": "s1", "title": "지도 다시 보기 — Σ와 ∫, 그리고 밀도 기호", "n": ["em.continuous"], "items": [{"t": "m", "k": "", "s": "", "a": "불연속 Σ 3개 · 연속 ∫ 3개", "id": "2026-09-11-s1-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\lambda=dq/ds\\), \\(\\sigma=dq/dA\\), \\(\\rho=dq/dV\\)", "id": "2026-09-11-s1-2"}, {"t": "m", "k": "", "s": "", "a": "조각의 장은 늘 점전하 식 \\(\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{dq}{r^2}\\)", "id": "2026-09-11-s1-3"}]}, {"sid": "s2", "title": "원형 도선 — \"직선 도선을 휜 것\", 살아남는 건 z 성분뿐", "n": ["em.continuous"], "items": [{"t": "f", "a": "\\[dE=\\frac{1}{4\\pi\\varepsilon_0}\\frac{\\lambda\\,ds}{z^2+R^2},\\quad \\cos\\theta=\\frac{z}{\\sqrt{z^2+R^2}}\\ \\Rightarrow\\ E_z=\\frac{1}{4\\pi\\varepsilon_0}\\frac{\\lambda z}{(z^2+R^2)^{3/2}}\\int_0^{2\\pi R}ds=\\frac{1}{4\\pi\\varepsilon_0}\\frac{qz}{(z^2+R^2)^{3/2}}\\]", "id": "2026-09-11-s2-1"}]}, {"sid": "s3", "title": "원판 — 고리를 쌓는다, 그리고 무한 평면", "n": ["em.continuous"], "items": [{"t": "f", "a": "\\[dE_z=\\frac{1}{4\\pi\\varepsilon_0}\\frac{\\sigma\\,2\\pi r\\,dr}{r^2+z^2}\\cdot\\frac{z}{\\sqrt{r^2+z^2}}=\\frac{\\sigma z}{2\\varepsilon_0}\\frac{r\\,dr}{(r^2+z^2)^{3/2}}\\] 치환 \\(A^2=r^2+z^2\\), \\(A\\,dA=r\\,dr\\); \\(r=0\\to A=z\\), \\(r=R\\to A=\\sqrt{z^2+R^2}\\): \\[E=\\frac{\\sigma z}{2\\varepsilon_0}\\int_z^{\\sqrt{z^2+R^2}}\\frac{dA}{A^2}=\\frac{\\sigma}{2\\varepsilon_0}\\left(1-\\frac{z}{\\sqrt{z^2+R^2}}\\right)\\]", "id": "2026-09-11-s3-1"}, {"t": "f", "a": "\\[R\\to\\infty:\\quad E=\\frac{\\sigma}{2\\varepsilon_0}=\\frac{q}{2\\varepsilon_0A}\\]", "id": "2026-09-11-s3-2"}, {"t": "m", "k": "", "s": "", "a": "원판 \\(E=\\dfrac{\\sigma}{2\\varepsilon_0}\\Big(1-\\dfrac{z}{\\sqrt{z^2+R^2}}\\Big)\\)", "id": "2026-09-11-s3-3"}, {"t": "m", "k": "", "s": "", "a": "치환 \\(A^2=r^2+z^2\\), 구간 \\(z\\to\\sqrt{z^2+R^2}\\)", "id": "2026-09-11-s3-4"}, {"t": "m", "k": "", "s": "", "a": "무한 평면 \\(\\sigma/2\\varepsilon_0\\)(거리 무관)", "id": "2026-09-11-s3-5"}]}, {"sid": "s4", "title": "가우스 법칙 서론 — 축구공 하나로", "n": ["em.gauss", "em.gauss_apps"], "items": [{"t": "f", "a": "\\[\\oint\\vec E\\cdot\\hat n\\,dA=\\frac{q_{enc}}{\\varepsilon_0}\\]", "id": "2026-09-11-s4-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\oint\\vec E\\cdot\\hat n\\,dA=q_{e   el.querySelector(".ck").onclick=()=>{ const on=!ST[id]; if(on) ST[id]=1; else delete ST[id]; try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){}
    el.classList.toggle("done",on); el.querySelector(".ck").setAttribute("aria-pressed",on?"true":"false"); stat();
    ev("memo",{ok:on,n:c.n||[],lid:D.slug+"-"+date,sid:c.sid}); }; }); }
function ui(){ document.body.classList.toggle("hide",UI.hide); document.body.classList.toggle("left",UI.left); $("#bHide").setAttribute("aria-pressed",UI.hide?"true":"false"); $("#bLeft").setAttribute("aria-pressed",UI.left?"true":"false");
  $$(".it.show").forEach(x=>x.classList.remove("show")); try{ localStorage.setItem(KEY+"-ui",JSON.stringify(UI)); }catch(e){} }
$("#bHide").onclick=()=>{ UI.hide=!UI.hide; ui(); }; $("#bLeft").onclick=()=>{ UI.left=!UI.left; ui(); };
window.addEventListener("resize",fit,{passive:true});
function boot(){ render(); ui(); const h=location.hash; if(h&&/^#d\d{4}-\d{2}-\d{2}$/.test(h)){ const el=document.querySelector(h); if(el) setTimeout(()=>el.scrollIntoView(),60); }
  try{ document.fonts.ready.then(fit); }catch(e){} }
(function wait(){ if(window.renderMathInElement) boot(); else setTimeout(wait,40); })();
</script>
