<script>/* 김주영 스앵님 판정 (대표님 2026-09-29 「개념 마인드맵은 스앵님이 학습을 통해 내가 뭘 알고 뭘 모르는지 알아서 파악」) — 원본은 이 파일 하나.
   빌더가 교실·수업 노트·학습 덱·암기노트 페이지에 그대로 넣고(__JUDGE__), learn.html 은 patch_learn_judge.py 가 TJ-START~TJ-END 사이를 이 파일로 갈아 끼운다.
   기록 = localStorage atto.evidence [{t, k, n:[노드], ok, v, lid, sid, qid, a, clean}] (최대 4000건 — 넘치면 읽기·질문 기록부터 버리고 노드마다 최근 문제 6건은 남긴다)
     k: quiz(ok) 확인 문제 · read(clean) 챕터·섹션 끝(다시 설명·질문 없이 끝났으면 clean) · again 다시 설명 · ask 질문 · memo(ok) 암기노트 외움 · self(v) 카드 자가평가
     a: 같은 시도 표시(카드 「다시 저장」) — 같은 a·qid 는 새 기록으로 바꿔 넣는다(정답 수가 늘지 않는다)
   판정 = 노드마다 atto.mastery[id] = {quiz:{correct,total,ts}, self, sts, ts, score, state, auto} — learn.html 은 TJ.score 로 같은 식을 쓴다.
     quiz = 최근 6번 · self(설명할 수 있나 1~5) = 읽음 4 · 다시 설명·질문 2번 이상이면 3 · 외움 +1 · 카드 자가평가가 더 최근이면 그 값
     → 문제 없이 읽기만 하면 최대 「흔들림」, 「안다」는 문제로만. 점수식 = (0.5·정답률·감쇠(quiz.ts) + 0.2·self/5·감쇠(sts))/0.7, 문제 없으면 self/5·0.6·감쇠(sts)
     감쇠 = 60일에 걸쳐 1 → 0.4 (최저 0.4). 정답 근거와 읽기·암기 근거를 따로 감쇠한다 — 오늘 암기 체크 하나로 90일 전 정답이 새것처럼 되지 않게(오타 .91 설계 검수 ⑦)
   저장이 막히면(용량·사생활 모드) 이 페이지 안에서는 메모리 사본으로 이어 가고 rec 은 false 를 돌려준다. */
(function(g){
  var EK="atto.evidence", MK="atto.mastery", CAP=4000, KEEPQ=6, MEM={}, DIRTY={};
  function rd(k,d){ if(DIRTY[k]) return MEM[k]; try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return v==null?d:v; }catch(e){ return DIRTY[k]?MEM[k]:d; } }
  function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); DIRTY[k]=false; return true; }catch(e){ MEM[k]=v; DIRTY[k]=true; return false; } }
  function decay(ts){ if(!ts) return 1; var d=Math.max(0,(Date.now()/1000-ts)/86400); return Math.max(.4,1-d/60); }
  function score(e){ if(!e||typeof e!=="object") return {score:0,state:"unrated"};
    var q=e.quiz||{}, tot=+q.total||0, cor=+q.correct||0, sv=e.self==null?null:Math.max(1,Math.min(5,+e.self));
    if(tot<=0&&sv==null) return {score:0,state:"unrated"};
    var dq=decay(+q.ts||+e.ts||0), ds=decay(+e.sts||+e.ts||0);
    var raw=tot>0?(0.5*(cor/tot)*dq+0.2*((sv||0)/5)*ds)/0.7:(sv/5)*0.6*ds, s=Math.min(1,raw), st;
    if(tot<=0) st=(sv>=4&&s>=.4)?"shaky":"unknown"; else st=s>=.7?"known":s>=.4?"shaky":"unknown";
    return {score:Math.round(s*1000)/1000,state:st}; }
  function why(evs){ var qz=evs.filter(function(e){return e.k==="quiz";}).slice(-KEEPQ), r={q:qz.length,c:qz.filter(function(e){return e.ok;}).length,
      read:evs.filter(function(e){return e.k==="read";}).length, clean:evs.filter(function(e){return e.k==="read"&&e.clean;}).length,
      conf:evs.filter(function(e){return (e.k==="again"||e.k==="ask")&&Date.now()-e.t<21*864e5;}).length,
      memo:null, self:null, last:0, selfLast:0};
    evs.forEach(function(e){ if(e.k==="memo") r.memo=!!e.ok; if(e.k==="self") r.self={v:+e.v,t:e.t}; if(e.t>r.last) r.last=e.t; if(e.k!=="quiz"&&e.t>r.selfLast) r.selfLast=e.t; });
    return r; }
  function judgeOne(id,L,M){ var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); if(!evs.length) return;
    var r=why(evs), e=Object.assign({},M[id]||{}), qz=evs.filter(function(x){return x.k==="quiz";}).slice(-KEEPQ);
    var self=null; if(r.read||r.conf||r.memo!=null){ self=r.read?4:3; if(r.conf>=2) self=3; if(r.memo) self=Math.min(5,self+1); }
    var autoLast=0; evs.forEach(function(x){ if(x.k!=="self"&&x.t>autoLast) autoLast=x.t; });
    if(r.self&&r.self.t>=autoLast) self=r.self.v;
    e.quiz=qz.length?{correct:r.c,total:qz.length,ts:Math.round(qz[qz.length-1].t/1000)}:undefined; if(!e.quiz) delete e.quiz;
    e.self=self; if(self==null){ delete e.self; delete e.sts; } else e.sts=Math.round(r.selfLast/1000);
    e.ts=Math.round(r.last/1000); e.auto={by:"tutor",q:r.q,c:r.c,read:r.read,clean:r.clean,conf:r.conf,memo:r.memo};
    var s=score(e); e.score=s.score; e.state=s.state; M[id]=e; }
  function judge(ids){ var L=rd(EK,[]), M=rd(MK,{}); if(!Array.isArray(L)) L=[]; if(!M||typeof M!=="object") M={}; (ids||[]).forEach(function(id){ judgeOne(id,L,M); });
    wr(MK,M); return M; }
  function all(){ var L=rd(EK,[]), o={}; if(Array.isArray(L)) L.forEach(function(e){ (e&&e.n||[]).forEach(function(i){ o[i]=1; }); }); return judge(Object.keys(o)); }
  /* 상한 넘침: 노드마다 최근 문제 KEEPQ 건은 지키고, 나머지(읽기·질문·오래된 문제)에서 오래된 것부터 버린다 — 다른 노드 활동으로 정답 기록이 사라지지 않게 */
  function trim(L,cap){ cap=cap||CAP; if(L.length<=cap) return L; var seen={}, keep=[], rest=[], i;
    for(i=L.length-1;i>=0;i--){ var e=L[i], k=false; if(e&&e.k==="quiz") (e.n||[]).forEach(function(id){ seen[id]=(seen[id]||0)+1; if(seen[id]<=KEEPQ) k=true; }); (k?keep:rest).push(e); }
    keep.reverse(); rest.reverse(); rest=rest.slice(Math.max(0,rest.length-Math.max(0,cap-keep.length)));
    return keep.concat(rest).sort(function(a,b){ return (a.t||0)-(b.t||0); }); }
  function rec(ev){ if(!ev||!Array.isArray(ev.n)||!ev.n.length) return false; var L=rd(EK,[]); if(!Array.isArray(L)) L=[];
    ev.t=Date.now();
    if(ev.a!=null&&ev.qid!=null){ for(var i=L.length-1;i>=0;i--){ var x=L[i]; if(x&&x.k===ev.k&&x.qid===ev.qid&&x.a===ev.a){ L.splice(i,1); break; } } }
    L.push(ev); L=trim(L);
    /* 저장 실패 → 절반 상한으로 다시(이때도 노드마다 최근 정답은 지킨다, 오타 설계 2차) · 그래도 실패면 메모리 사본은 자르지 않은 전체로 */
    var ok=wr(EK,L); if(!ok){ var half=trim(L,Math.floor(CAP/2)); if(wr(EK,half)){ L=half; ok=true; } else { MEM[EK]=L; DIRTY[EK]=true; } }
    judge(ev.n); return ok; }
  function reasons(id){ var L=rd(EK,[]); if(!Array.isArray(L)) return null; var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); return evs.length?why(evs):null; }
  g.TJ={rec:rec,judge:judge,all:all,score:score,reasons:reasons,trim:trim};
})(typeof window!=="undefined"?window:this);
</script>
<script>/* 여러 식을 이은 식 줄 나누기(대표님 2026-09-29 「수식 한 줄로, 배치구조 신경」) — 원본은 이 파일 하나(수업 노트·암기노트 템플릿에 빌더가 넣는다, __SPLITTEX__).
   \[ A,\qquad B \] 처럼 서로 다른 식을 \qquad 또는 「,\quad」로 이어 붙인 줄은 식마다 한 줄(\[A\]\[B\])로 — 한 식 안은 가르지 않는다.
   괄호 { } 와 \begin…\end 안의 구분자는 건드리지 않고, 연결 기호만 남은 조각(\Rightarrow·\to·\Leftrightarrow·\therefore)은 다음 식 앞에 붙인다. */
/* 괄호 깊이: ( ) [ ] 와 \left…\right 안에서는 나누지 않는다 — \left(a\qquad b\right) 가 갈렸다(오타 .91 설계 검수 ④) */
function parenStep(t,i,p){
  if(t.startsWith("\\left",i)&&!/[a-zA-Z]/.test(t[i+5]||"")) return p+1;
  if(t.startsWith("\\right",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) return Math.max(0,p-1);
  const c=t[i]; if(c==="("||c==="[") return p+1; if(c===")"||c==="]") return Math.max(0,p-1); return p;
}
function splitTex(t){
  const parts=[]; let d=0, env=0, p=0, cur="", i=0;
  while(i<t.length){
    if(t.startsWith("\\begin{",i)) env++;
    else if(t.startsWith("\\end{",i)) env=Math.max(0,env-1);
    const c=t[i];
    if(c==="\\"&&(t[i+1]==="{"||t[i+1]==="}")){ cur+=t.slice(i,i+2); i+=2; continue; }
    if(c==="{") d++; else if(c==="}") d=Math.max(0,d-1);
    p=parenStep(t,i,p);
    if(!d&&!env&&!p){
      let m=0;
      if(t.startsWith("\\qquad",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) m=6;
      else if(t.startsWith(",\\quad",i)&&!/[a-zA-Z]/.test(t[i+6]||"")) m=6;
      if(m){ parts.push(cur); cur=""; i+=m; continue; }
    }
    cur+=c; i++;
  }
  parts.push(cur);
  const out=[]; let carry="";
  parts.map(p=>p.trim().replace(/^,\s*/,"").replace(/,\s*$/,"")).forEach(p=>{
    if(!p) return;
    if(/^(\\(Rightarrow|Leftarrow|Leftrightarrow|to|therefore|because|implies|iff)\s*)+$/.test(p)){ carry+=p+" "; return; }
    out.push(carry+p); carry="";
  });
  if(carry&&out.length) out[out.length-1]+=" "+carry.trim();
  return out.length?out:[t];
}
/* 좁은 화면(폰)에서만: 글자 덩어리(\text{…})를 화살표(\to·\Rightarrow)로 이은 「흐름」 줄은 화살표 단위로 줄을 나눈다 — 수식이 아니라 단계 나열이라 나눠도 식이 갈리지 않는다 */
function splitFlow(t){
  const segs=[]; let d=0, p=0, cur="", i=0;
  while(i<t.length){ const c=t[i];
    if(c==="\\"&&(t[i+1]==="{"||t[i+1]==="}")){ cur+=t.slice(i,i+2); i+=2; continue; }
    if(c==="{") d++; else if(c==="}") d=Math.max(0,d-1);
    p=parenStep(t,i,p);
    if(!d&&!p){ const m=/^\\ ?\\(to|Rightarrow)(?![a-zA-Z])\\ ?/.exec(t.slice(i))||/^\s*\\(to|Rightarrow)(?![a-zA-Z])\s*/.exec(t.slice(i)); if(m&&cur.trim()){ segs.push(cur); cur="\\"+m[1]+"\\ "; i+=m[0].length; continue; } }
    cur+=c; i++; }
  segs.push(cur);
  const ok=segs.length>=3&&segs.every(s=>/^(\\(to|Rightarrow)\\ )?\s*\\text\{/.test(s.trim()));
  return ok?segs.map(s=>s.trim()):[t];
}
function splitDisplays(html,narrow){
  return String(html).replace(/\\\[([\s\S]*?)\\\]/g,(m,tex)=>{ let ps=splitTex(tex); if(narrow) ps=[].concat(...ps.map(splitFlow)); return ps.length>1?ps.map(p=>"\\["+p+"\\]").join(""):m; });
}

<script>
const D={"slug": "em1", "course": "공업수학1", "lessons": [{"date": "2026-09-02", "label": "9/2(수) · 1주차", "title": "미분방정식이란 — 모델화 3단계와 분류 (ODE · 계 · 선형)", "chs": [{"sid": "s1", "title": "모델화(modeling) 3단계 — 이 과목의 뼈대", "n": ["ode.modeling"], "items": [{"t": "f", "a": "\\[\\text{① 모델 설정(물리 → 식)}\\ \\to\\ \\text{② 해법(식 → 해)}\\ \\to\\ \\text{③ 해석(해 → 물리적 답)}\\]", "id": "2026-09-02-s1-1"}, {"t": "m", "k": "모델화", "s": "=", "a": "설정 → 해법 → 해석", "id": "2026-09-02-s1-2"}, {"t": "m", "k": "변화율", "s": "=", "a": "도함수 → 물리 법칙은 미분방정식이 된다", "id": "2026-09-02-s1-3"}]}, {"sid": "s2", "title": "공학 문제의 수학적 모델 세 가지", "n": ["ode.modeling"], "items": [{"t": "f", "a": "\\[\\text{뉴턴 냉각: }\\frac{dT}{dt}=-k(T-T_a)\\qquad \\text{낙하+공기저항: }m\\frac{dv}{dt}=mg-kv\\qquad \\text{투사체: }\\frac{d^2x}{dt^2}=0,\\ \\frac{d^2y}{dt^2}=-g\\]", "id": "2026-09-02-s2-1"}, {"t": "m", "k": "", "s": "", "a": "냉각 \\(T'=-k(T-T_a)\\)", "id": "2026-09-02-s2-2"}, {"t": "m", "k": "", "s": "", "a": "낙하 \\(mv'=mg-kv\\)", "id": "2026-09-02-s2-3"}, {"t": "m", "k": "", "s": "", "a": "부호: 줄어드는 양은 −k, 늘어나는 양은 +k", "id": "2026-09-02-s2-4"}]}, {"sid": "s3", "title": "미분방정식 · ODE와 PDE · 계(order)", "n": ["ode.concept"], "items": [{"t": "f", "a": "\\[\\text{ODE: }y'=\\cos x,\\quad y''+9y=e^{-2x},\\quad y'y^{\\prime\\prime\\prime}-\\tfrac32y'^2=0\\qquad \\text{PDE: }\\frac{\\partial^2u}{\\partial x^2}+\\frac{\\partial^2u}{\\partial y^2}=0\\]", "id": "2026-09-02-s3-1"}, {"t": "m", "k": "ODE", "s": "=", "a": "독립변수 1개 · PDE = ∂", "id": "2026-09-02-s3-2"}, {"t": "m", "k": "계", "s": "=", "a": "최고 도함수의 차수(거듭제곱 아님)", "id": "2026-09-02-s3-3"}]}, {"sid": "s4", "title": "양함수·음함수 형태 / 선형 vs 비선형 ★", "n": ["ode.linearity", "ode.linear1", "ode.superposition"], "items": [{"t": "f", "a": "\\[\\text{선형 1계의 표준형: }y'+p(x)\\,y=r(x)\\qquad(\\text{y 쪽은 1차, 계수는 x 만})\\]", "id": "2026-09-02-s4-1"}, {"t": "m", "k": "선형", "s": "=", "a": "\\(y,y',y''\\) 각각 1제곱 + 계수는 \\(x\\)만", "id": "2026-09-02-s4-2"}, {"t": "m", "k": "", "s": "", "a": "비선형 신호: \\(y^2\\), \\(yy'\\), \\((y')^3\\), \\(\\sin y\\), \\(e^y\\)", "id": "2026-09-02-s4-3"}]}, {"sid": "s5", "title": "해(solution)란 — 가족 하나", "n": ["ode.solution"], "items": [{"t": "m", "k": "해", "s": "=", "a": "대입하면 항등식", "id": "2026-09-02-s5-1"}, {"t": "m", "k": "일반해(상수 \\(c\\))", "s": "→", "a": "초기조건 → 특수해", "id": "2026-09-02-s5-2"}]}], "classroom": "../classroom/em1/2026-09-02.html"}, {"date": "2026-09-04", "label": "9/4(금) · 1주차", "title": "해의 가족에서 하나를 고르기 — 초기값 문제, 변수분리, y = ux 치환", "chs": [{"sid": "s1", "title": "해의 종류와 초기값 문제(IVP) ★", "n": ["ode.ivp", "ode.solution"], "items": [{"t": "f", "a": "\\[y'=3y,\\ y(0)=5.7:\\quad \\frac{dy}{y}=3\\,dx\\ \\to\\ \\ln y=3x+c\\ \\to\\ y=e^{c}e^{3x}=c\\,e^{3x}\\ \\to\\ c=5.7\\ \\Rightarrow\\ y=5.7e^{3x}\\]", "id": "2026-09-04-s1-1"}, {"t": "m", "k": "일반해(상수 c)", "s": "→", "a": "초기조건 → 특수해", "id": "2026-09-04-s1-2"}, {"t": "m", "k": "n계", "s": "=", "a": "상수 n개 = 조건 n개", "id": "2026-09-04-s1-3"}, {"t": "m", "k": "", "s": "", "a": "특이해는 거의 안 다룸", "id": "2026-09-04-s1-4"}]}, {"sid": "s2", "title": "모델화 실전 — 방사능 붕괴 (Ex.5)", "n": ["ode.exp_model", "ode.modeling"], "items": [{"t": "f", "a": "\\[\\text{① 설정: }\\frac{dy}{dt}=-ky\\qquad \\text{② 해법: }y=ce^{-kt},\\ y(0)=0.5\\Rightarrow y=0.5e^{-kt}\\qquad \\text{③ 해석: }\\text{초기 양에서 출발해 }k\\text{ 에 따라 감소}\\]", "id": "2026-09-04-s2-1"}, {"t": "m", "k": "", "s": "", "a": "\\(y'=-ky\\Rightarrow y=y_0e^{-kt}\\)", "id": "2026-09-04-s2-2"}, {"t": "m", "k": "", "s": "", "a": "반감기 \\(T=\\ln2/k\\)", "id": "2026-09-04-s2-3"}, {"t": "m", "k": "", "s": "", "a": "해를 구하면 대입 검토", "id": "2026-09-04-s2-4"}]}, {"sid": "s3", "title": "1.3 변수분리형 — 분리 → 양변 적분 ★★", "n": ["ode.separable"], "items": [{"t": "f", "a": "\\[\\text{Ex.1 }y'=1+y^2:\\ \\frac{dy}{1+y^2}=dx\\ \\to\\ \\tan^{-1}y=x+c\\ \\to\\ y=\\tan(x+c)\\qquad\\Big(\\int\\frac{du}{u^2+a^2}=\\frac1a\\tan^{-1}\\frac ua\\Big)\\]", "id": "2026-09-04-s3-1"}, {"t": "m", "k": "\\(g(y)dy=f(x)dx\\)", "s": "→", "a": "양변 적분 → \\(c\\) 한쪽", "id": "2026-09-04-s3-2"}, {"t": "m", "k": "", "s": "", "a": "\\(\\int\\frac{du}{u^2+a^2}=\\frac1a\\tan^{-1}\\frac ua\\) · 부분분수 · 부분적분", "id": "2026-09-04-s3-3"}]}, {"sid": "s4", "title": "모델화 Ex.7 — 토리첼리의 법칙(탱크 비우기)", "n": ["ode.modeling", "ode.separable"], "items": [{"t": "f", "a": "\\[\\text{유출 속도 }v=0.600\\sqrt{2gh}\\ \\Rightarrow\\ B\\,\\frac{dh}{dt}=-0.600\\,A\\sqrt{2gh}\\ \\Rightarrow\\ \\frac{dh}{\\sqrt h}=-0.000664\\,dt\\ \\Rightarrow\\ 2\\sqrt h=-0.000664\\,t+c\\]", "id": "2026-09-04-s4-1"}, {"t": "m", "k": "", "s": "", "a": "모델 설정의 핵심은 <b>부피 보존<\/b>(줄어든 부피 = 빠져나간 부피)", "id": "2026-09-04-s4-2"}, {"t": "m", "k": "", "s": "", "a": "\\(v=0.6\\sqrt{2gh}\\)", "id": "2026-09-04-s4-3"}, {"t": "m", "k": "", "s": "", "a": "결과 \\(h=(\\sqrt{h_0}-\\alpha t)^2\\)", "id": "2026-09-04-s4-4"}]}, {"sid": "s5", "title": "확장 — 동차형: y = ux 치환으로 분리형 만들기 ★", "n": ["ode.homogeneous"], "items": [{"t": "f", "a": "\\[u'x+u=f(u)\\ \\Rightarrow\\ \\frac{du}{f(u)-u}=\\frac{dx}{x}\\qquad(\\text{변수분리형이 된다})\\] \\(f(u)-u=0\\)인 상수 \\(u\\)는 나누기 전에 따로 확인한다.", "id": "2026-09-04-s5-1"}, {"t": "m", "k": "\\(y'=f(y/x)\\)", "s": "→", "a": "\\(y=ux\\), \\(y'=u'x+u\\) → \\(\\frac{du}{f(u)-u}=\\frac{dx}x\\) → 되돌리기(\\(f(u)=u\\)인 상수 \\(u\\)는 따로)", "id": "2026-09-04-s5-2"}, {"t": "m", "k": "", "s": "", "a": "동차 판정 \\(f(tx,ty)=t^nf\\)", "id": "2026-09-04-s5-3"}]}], "classroom": "../classroom/em1/2026-09-04.html"}, {"date": "2026-09-09", "label": "9/9(수) · 2주차", "title": "완전미분방정식 — \"어떤 함수 u의 등고선인가\", 그리고 적분인자", "chs": [{"sid": "s1", "title": "완전미분방정식이란 — 전미분 du", "n": ["ode.exact"], "items": [{"t": "f", "a": "\\[M(x,y)\\,dx+N(x,y)\\,dy=0\\ \\text{이 완전}\\ \\Leftrightarrow\\ M=\\frac{\\partial u}{\\partial x},\\ N=\\frac{\\partial u}{\\partial y}\\ \\Rightarrow\\ du=0\\ \\Rightarrow\\ u(x,y)=c\\]", "id": "2026-09-09-s1-1"}, {"t": "m", "k": "", "s": "", "a": "전미분 \\(du=u_xdx+u_ydy\\)", "id": "2026-09-09-s1-2"}, {"t": "m", "k": "", "s": "", "a": "완전 ⇔ \\(M=u_x,\\ N=u_y\\)", "id": "2026-09-09-s1-3"}, {"t": "m", "k": "", "s": "", "a": "해 \\(u(x,y)=c\\)", "id": "2026-09-09-s1-4"}]}, {"sid": "s2", "title": "판별 M_y = N_x 와 해법 Case 1·2 ★", "n": ["ode.exact"], "items": [{"t": "f", "a": "\\[\\text{판별(M, N 의 1계 편도함수가 연속인 단일연결 영역): }\\frac{\\partial M}{\\partial y}=\\frac{\\partial N}{\\partial x}\\quad(\\because u_{xy}=u_{yx})\\qquad \\text{Case 1: }u=\\int M\\,dx+k(y),\\ \\frac{\\partial u}{\\partial y}=N\\Rightarrow k\\qquad \\text{Case 2: }u=\\int N\\,dy+l(x),\\ \\frac{\\partial u}{\\partial x}=M\\Rightarrow l\\]", "id": "2026-09-09-s2-1"}, {"t": "m", "k": "\\(M_y=N_x\\)", "s": "→", "a": "Case 1 \\(u=\\int Mdx+k(y)\\) → \\(u_y=N\\) → \\(k\\) → \\(u=c\\) → 검산", "id": "2026-09-09-s2-2"}, {"t": "m", "k": "판별", "s": "→", "a": "퍼텐셜 → 해 → 검산 순서", "id": "2026-09-09-s2-3"}]}, {"sid": "s3", "title": "예제 (1)(2) — 손에 익히기", "n": ["ode.exact"], "items": [{"t": "m", "k": "", "s": "", "a": "\\(k'(y)\\)에 \\(x\\)가 남으면 오류 신호", "id": "2026-09-09-s3-1"}, {"t": "m", "k": "", "s": "", "a": "최종 답은 \\(u(x,y)=c\\) 꼴(양함수로 안 풀어도 됨)", "id": "2026-09-09-s3-2"}]}, {"sid": "s4", "title": "적분인자(integrating factor) — 완전이 아니면 곱해서 완전으로", "n": ["ode.integrating_factor"], "items": [{"t": "m", "k": "적분인자", "s": "=", "a": "곱해서 완전으로 만드는 함수", "id": "2026-09-09-s4-1"}, {"t": "m", "k": "", "s": "", "a": "\\(-y\\,dx+x\\,dy\\)에는 \\(1/x^2\\) (\\(x\\ne0\\) 인 영역)", "id": "2026-09-09-s4-2"}, {"t": "m", "k": "", "s": "", "a": "또는 \\(1/y^2\\)(\\(y\\ne0\\))", "id": "2026-09-09-s4-3"}, {"t": "m", "k": "", "s": "", "a": "\\(1/(x^2+y^2)\\)는 원점을 피하는 단일연결 영역으로 제한", "id": "2026-09-09-s4-4"}]}, {"sid": "s5", "title": "정리 1·2 — 한 변수만의 적분인자 ★★ (시험 공식)", "n": ["ode.integrating_factor"], "items": [{"t": "f", "a": "\\[\\text{정리 1: }R(x)=\\frac1Q\\Big(\\frac{\\partial P}{\\partial y}-\\frac{\\partial Q}{\\partial x}\\Big),\\ F(x)=e^{\\int R\\,dx}\\qquad \\text{정리 2: }R^*(y)=\\frac1P\\Big(\\frac{\\partial Q}{\\partial x}-\\frac{\\partial P}{\\partial y}\\Big),\\ F^*(y)=e^{\\int R^*dy}\\]", "id": "2026-09-09-s5-1"}, {"t": "m", "k": "", "s": "", "a": "\\(R=\\frac1Q(P_y-Q_x)\\), \\(F=e^{\\int R dx}\\)", "id": "2026-09-09-s5-2"}, {"t": "m", "k": "", "s": "", "a": "\\(R^*=\\frac1P(Q_x-P_y)\\), \\(F^*=e^{\\int R^*dy}\\)", "id": "2026-09-09-s5-3"}, {"t": "m", "k": "", "s": "", "a": "한 변수만 남아야 적용", "id": "2026-09-09-s5-4"}]}, {"sid": "s6", "title": "Ex.5 — 적분인자 → 일반해 → 초기값 (과제·시험 유형) ★", "n": ["ode.integrating_factor", "ode.ivp"], "items": [{"t": "f", "a": "\\[(e^{x+y}+ye^y)\\,dx+(xe^y-1)\\,dy=0,\\qquad y(0)=-1\\]", "id": "2026-09-09-s6-1"}, {"t": "m", "k": "", "s": "", "a": "Ex.5 수순 6단계", "id": "2026-09-09-s6-2"}, {"t": "m", "k": "", "s": "", "a": "\\(R^*\\)이 상수면 바로 \\(F^*=e^{R^*y}\\)", "id": "2026-09-09-s6-3"}]}], "classroom": "../classroom/em1/2026-09-09.html"}, {"date": "2026-09-11", "label": "9/11(금) · 2주차", "title": "1.5 선형 ODE — \"이거 하고 이거는 기억을 하라\"", "chs": [{"sid": "s1", "title": "지난 시간 정정 · 선형이란 · 표준형", "n": ["ode.linear1", "ode.linearity", "ode.integrating_factor"], "items": [{"t": "m", "k": "", "s": "", "a": "표준형 \\(y'+p(x)y=r(x)\\)", "id": "2026-09-11-s1-1"}, {"t": "m", "k": "", "s": "", "a": "\\(r=0\\) 제차, \\(r\\ne0\\) 비제차", "id": "2026-09-11-s1-2"}, {"t": "m", "k": "", "s": "", "a": "\\(r\\)=입력, \\(y\\)=출력", "id": "2026-09-11-s1-3"}]}, {"sid": "s2", "title": "해 공식 — 제차는 변수분리, 비제차는 이것 하나 ★★", "n": ["ode.linear1"], "items": [{"t": "f", "a": "\\[\\text{제차 }y'=-p(x)y:\\ \\frac{dy}{y}=-p\\,dx\\ \\Rightarrow\\ y=c\\,e^{-\\int p\\,dx}\\]", "id": "2026-09-11-s2-1"}, {"t": "f", "a": "\\[h=\\int p(x)\\,dx,\\qquad y(x)=e^{-h}\\Big[\\int e^{h}\\,r(x)\\,dx+c\\Big]\\]", "id": "2026-09-11-s2-2"}, {"t": "m", "k": "", "s": "", "a": "\\(h=\\int p\\,dx\\)", "id": "2026-09-11-s2-3"}, {"t": "m", "k": "", "s": "", "a": "\\(y=e^{-h}[\\int e^hr\\,dx+c]\\)", "id": "2026-09-11-s2-4"}, {"t": "m", "k": "", "s": "", "a": "탄젠트 적분 공식(\\(\\int\\tan x=\\ln|\\sec x|\\))은 중간·기말에 나오면 제공한다고 했다", "id": "2026-09-11-s2-5"}]}, {"sid": "s3", "title": "풀이 흐름도 — 어느 해법을 쓸지 고르는 순서", "n": ["ode.linear1"], "items": [{"t": "m", "k": "완전?", "s": "→", "a": "동차? → 적분인자 → 선형 표준형이면 공식", "id": "2026-09-11-s3-1"}, {"t": "m", "k": "", "s": "", "a": "형태를 먼저 본다", "id": "2026-09-11-s3-2"}]}, {"sid": "s4", "title": "예제 — 별표 예제 1과 연습 3제 ★", "n": ["ode.linear1"], "items": [{"t": "m", "k": "", "s": "", "a": "예제 1 답 \\(3\\cos x-2\\cos^2x\\)", "id": "2026-09-11-s4-1"}, {"t": "m", "k": "", "s": "", "a": "연습 2의 역수 기술", "id": "2026-09-11-s4-2"}, {"t": "m", "k": "", "s": "", "a": "표준형으로 나누기(연습 1·3)", "id": "2026-09-11-s4-3"}]}, {"sid": "s5", "title": "공학 응용 — RL 회로", "n": ["ode.rlc", "ode.linear1", "ode.solution"], "items": [{"t": "f", "a": "\\[Li'+Ri=E\\ \\Rightarrow\\ i'+\\frac RLi=\\frac EL,\\quad h=\\frac RLt,\\quad i(t)=e^{-h}\\Big[\\int e^{h}\\frac EL\\,dt+c\\Big]=\\frac ER+ce^{-Rt/L}\\ \\xrightarrow{i(0)=0}\\ i(t)=\\frac ER\\big(1-e^{-Rt/L}\\big)\\]", "id": "2026-09-11-s5-1"}, {"t": "m", "k": "", "s": "", "a": "KVL: \\(Li'+Ri=E\\)", "id": "2026-09-11-s5-2"}, {"t": "m", "k": "", "s": "", "a": "정상 전류 \\(E/R\\)", "id": "2026-09-11-s5-3"}, {"t": "m", "k": "", "s": "", "a": "시간상수 \\(L/R\\)", "id": "2026-09-11-s5-4"}, {"t": "m", "k": "", "s": "", "a": "같은 공식(변수만 \\(t\\))", "id": "2026-09-11-s5-5"}]}, {"sid": "s6", "title": "베르누이 방정식 예고 — 비선형이지만 치환으로 선형", "n": ["ode.bernoulli"], "items": [{"t": "f", "a": "\\[y'+p(x)y=g(x)y^a\\ \\xrightarrow{u=y^{1-a}}\\ u'+(1-a)p(x)\\,u=(1-a)g(x)\\qquad \\text{예 로지스틱 }y'=Ay-By^2:\\ u=y^{-1},\\ u'+Au=B\\]", "id": "2026-09-11-s6-1"}, {"t": "m", "k": "베르누이 \\(u=y^{1-a}\\)", "s": "→", "a": "선형 → 되돌리기", "id": "2026-09-11-s6-2"}, {"t": "m", "k": "", "s": "", "a": "로지스틱 \\(u=1/y\\)", "id": "2026-09-11-s6-3"}, {"t": "m", "k": "", "s": "", "a": "\"1계가 어렵지, 2계로 가면 오히려 쉬워진다\"", "id": "2026-09-11-s6-4"}]}], "classroom": "../classroom/em1/2026-09-11.html"}, {"date": "2026-09-16", "label": "9/16(수) · 3주차", "title": "1장을 닫고 2장을 열다 — 베르누이 연습, 해법 총정리, 중첩 원리와 기저", "chs": [{"sid": "s1", "title": "베르누이 복습 + 연습 1 (전형)", "n": ["ode.bernoulli"], "items": [{"t": "m", "k": "", "s": "", "a": "\\(u=y^{1-a}\\)", "id": "2026-09-16-s1-1"}, {"t": "m", "k": "", "s": "", "a": "\\(u'\\)에 원식의 \\(y'\\) 대입", "id": "2026-09-16-s1-2"}, {"t": "m", "k": "", "s": "", "a": "선형 또는 변수분리 · 되돌리기", "id": "2026-09-16-s1-3"}, {"t": "m", "k": "", "s": "", "a": "연습 1 답 \\(y^3=1+c/x^3\\)", "id": "2026-09-16-s1-4"}]}, {"sid": "s2", "title": "연습 2·3 — 덩어리를 통째로 치환", "n": ["calc.substitution", "ode.bernoulli", "ode.homogeneous"], "items": [{"t": "f", "a": "\\[(2)\\ \\tan^{-1}(x+y+2)=x+c\\ \\Rightarrow\\ y=\\tan(x+c)-x-2\\qquad (3)\\ -e^{-(y-x+3)}=x+c\\ \\Rightarrow\\ e^{-(y-x+3)}+x+c=0\\]", "id": "2026-09-16-s2-1"}, {"t": "m", "k": "\\(y'=f(ax+by+c)\\)", "s": "→", "a": "\\(u=ax+by+c\\), \\(u'=a+by'\\)", "id": "2026-09-16-s2-2"}, {"t": "m", "k": "", "s": "", "a": "적분상수는 한쪽에", "id": "2026-09-16-s2-3"}, {"t": "m", "k": "", "s": "", "a": "#28(\\(y^2=z\\) 치환)", "id": "2026-09-16-s2-4"}]}, {"sid": "s3", "title": "1장 해법 총정리 — \"1장이 다 끝났다\"", "n": ["ode.integrating_factor", "ode.separable", "ode.bernoulli"], "items": [{"t": "m", "k": "", "s": "", "a": "여섯 칸 순서 ①~⑥", "id": "2026-09-16-s3-1"}, {"t": "m", "k": "", "s": "", "a": "외울 공식: \\(R\\)·\\(\\tilde R\\)·\\(y=e^{-h}[\\dots]\\)·\\(u=y^{1-a}\\)", "id": "2026-09-16-s3-2"}]}, {"sid": "s4", "title": "2.1 2계 선형 ODE — 표준형 · 제차/비제차 · 중첩 원리 ★", "n": ["ode.superposition", "ode.linear1"], "items": [{"t": "f", "a": "\\[y''+p(x)y'+q(x)y=r(x)\\quad(\\text{표준형: }y''\\text{ 계수 1}),\\qquad r=0\\ \\text{제차},\\ r\\ne0\\ \\text{비제차}\\]", "id": "2026-09-16-s4-1"}, {"t": "f", "a": "\\[\\textbf{정리 1(중첩·선형성의 원리)}:\\ y_1,y_2\\text{ 가 제차 선형 ODE의 해이면 }c_1y_1+c_2y_2\\text{ 도 해}\\]", "id": "2026-09-16-s4-2"}, {"t": "m", "k": "", "s": "", "a": "표준형 \\(y''+py'+qy=r\\)", "id": "2026-09-16-s4-3"}, {"t": "m", "k": "", "s": "", "a": "중첩 원리는 <b>제차 선형에만<\/b>", "id": "2026-09-16-s4-4"}, {"t": "m", "k": "", "s": "", "a": "반례 \\(y''+y=1\\), \\(y''y-xy'=0\\)", "id": "2026-09-16-s4-5"}]}, {"sid": "s5", "title": "초기값 문제 · 1차독립 · 기저 ★ (교수님 정정)", "n": ["ode.basis", "ode.ivp"], "items": [{"t": "f", "a": "\\[\\text{IVP: }y(x_0)=K_0,\\ y'(x_0)=K_1\\qquad \\text{Ex.4 }y''+y=0,\\ y(0)=3.0,\\ y'(0)=-0.5:\\ y=c_1\\cos x+c_2\\sin x\\ \\Rightarrow\\ y=3.0\\cos x-0.5\\sin x\\]", "id": "2026-09-16-s5-1"}, {"t": "f", "a": "\\[\\text{1차독립: }k_1y_1+k_2y_2=0\\ \\Rightarrow\\ k_1=k_2=0\\ \\text{일 때만}\\qquad\\Leftrightarrow\\qquad y_1/y_2\\ne\\text{const}\\]", "id": "2026-09-16-s5-2"}, {"t": "m", "k": "", "s": "", "a": "IVP 조건 2개", "id": "2026-09-16-s5-3"}, {"t": "m", "k": "비례", "s": "→", "a": "종속, 비례 아님 → 독립", "id": "2026-09-16-s5-4"}, {"t": "m", "k": "독립인 두 해", "s": "=", "a": "기저", "id": "2026-09-16-s5-5"}, {"t": "m", "k": "", "s": "", "a": "Ex.4 \\(3\\cos x-0.5\\sin x\\)", "id": "2026-09-16-s5-6"}, {"t": "m", "k": "", "s": "", "a": "\"공수2에서도 1차독립 나온다\"", "id": "2026-09-16-s5-7"}]}, {"sid": "s6", "title": "차수축소법(Reduction of order) — 해 하나를 알면 둘째 해", "n": ["ode.reduction_order"], "items": [{"t": "f", "a": "\\[y_2=u\\,y_1\\ \\Rightarrow\\ u''y_1+u'(2y_1'+py_1)+u\\underbrace{(y_1''+py_1'+qy_1)}_{=0}=0\\ \\Rightarrow\\ U=u':\\ U'+\\Big(\\frac{2y_1'}{y_1}+p\\Big)U=0\\ \\Rightarrow\\ \\boxed{\\,y_2=y_1\\int\\frac{1}{y_1^2}e^{-\\int p\\,dx}dx\\,}\\]", "id": "2026-09-16-s6-1"}, {"t": "m", "k": "", "s": "", "a": "\\(y_2=y_1\\int\\frac1{y_1^2}e^{-\\int p\\,dx}dx\\)(지수에 −)", "id": "2026-09-16-s6-2"}, {"t": "m", "k": "", "s": "", "a": "표준형에서 \\(p\\) 읽기", "id": "2026-09-16-s6-3"}, {"t": "m", "k": "", "s": "", "a": "과제: 1.5 #23·#28 (2.1 #6·#9는 \"한번 해보세\")", "id": "2026-09-16-s6-4"}]}], "classroom": "../classroom/em1/2026-09-16.html"}, {"date": "2026-09-18", "label": "9/18(금) · 3주차", "title": "2.2 상수계수 제차 선형 ODE — 특성방정식 하나로 세 가지 해", "chs": [{"sid": "s1", "title": "2.1 Ex.7 마무리 — 차수축소로 기저 완성", "n": ["ode.reduction_order", "ode.basis"], "items": [{"t": "f", "a": "\\[p=-\\frac{x}{x^2-x}=-\\frac1{x-1},\\quad e^{-\\int p\\,dx}=e^{\\ln|x-1|}=|x-1|=x-1\\ (x&gt;1),\\quad U=\\frac{x-1}{x^2}=\\frac1x-\\frac1{x^2},\\quad y_2=x\\int U\\,dx=x\\Big(\\ln|x|+\\frac1x\\Big)=x\\ln|x|+1\\]", "id": "2026-09-18-s1-1"}, {"t": "m", "k": "표준형에서 \\(p\\)", "s": "→", "a": "\\(e^{-\\int p}\\) → \\(U=e^{-\\int p}/y_1^2\\) → \\(y_2=y_1\\int U\\)", "id": "2026-09-18-s1-2"}, {"t": "m", "k": "", "s": "", "a": "결과는 반드시 대입 검산", "id": "2026-09-18-s1-3"}]}, {"sid": "s2", "title": "2.2 특성방정식과 세 경우 ★★ (중간 핵심)", "n": ["ode.const_coeff"], "items": [{"t": "f", "a": "\\[y''+ay'+by=0,\\quad y=e^{\\lambda x}\\ \\Rightarrow\\ (\\lambda^2+a\\lambda+b)e^{\\lambda x}=0\\ \\Rightarrow\\ \\boxed{\\lambda^2+a\\lambda+b=0}\\quad(\\text{특성방정식})\\]", "id": "2026-09-18-s2-1"}, {"t": "m", "k": "", "s": "", "a": "\\(\\lambda^2+a\\lambda+b=0\\)", "id": "2026-09-18-s2-2"}, {"t": "m", "k": "", "s": "", "a": "I \\(c_1e^{\\lambda_1x}+c_2e^{\\lambda_2x}\\)", "id": "2026-09-18-s2-3"}, {"t": "m", "k": "", "s": "", "a": "II \\((c_1+c_2x)e^{-ax/2}\\)", "id": "2026-09-18-s2-4"}, {"t": "m", "k": "", "s": "", "a": "III \\(e^{-ax/2}(A\\cos\\omega x+B\\sin\\omega x)\\), \\(\\omega=\\sqrt{b-a^2/4}\\)", "id": "2026-09-18-s2-5"}]}, {"sid": "s3", "title": "왜 그런가 — Case II 유도(차수축소) · Case III 유도(오일러 공식)", "n": ["ode.const_coeff", "ode.reduction_order"], "items": [{"t": "f", "a": "\\[\\text{II: }\\lambda_1=\\lambda_2=-\\tfrac a2\\ \\Rightarrow\\ y_1=e^{-ax/2}\\text{ 하나뿐}\\ \\Rightarrow\\ y_2=u\\,y_1,\\ \\text{차수축소하면 }u''=0\\ \\Rightarrow\\ u=x\\ \\Rightarrow\\ y_2=xe^{-ax/2}\\]", "id": "2026-09-18-s3-1"}, {"t": "f", "a": "\\[\\text{III: }e^{(p\\pm iq)x}=e^{px}(\\cos qx\\pm i\\sin qx)\\ \\Rightarrow\\ \\tfrac12(y_1+y_2)=e^{px}\\cos qx,\\ \\tfrac1{2i}(y_1-y_2)=e^{px}\\sin qx\\]", "id": "2026-09-18-s3-2"}, {"t": "m", "k": "중근 → \\(x\\) 붙는 이유", "s": "=", "a": "차수축소 \\(u''=0\\)", "id": "2026-09-18-s3-3"}, {"t": "m", "k": "", "s": "", "a": "오일러 \\(e^{it}=\\cos t+i\\sin t\\)", "id": "2026-09-18-s3-4"}, {"t": "m", "k": "복소근", "s": "=", "a": "지수 인자 × 진동(\\(a&gt;0\\)이면 감쇠)", "id": "2026-09-18-s3-5"}]}, {"sid": "s4", "title": "Ex.2 · Ex.4 · Ex.5 — 초기값 문제 세 경우 한 번씩", "n": ["ode.const_coeff", "ode.ivp"], "items": [{"t": "m", "k": "", "s": "", "a": "수순 4단계", "id": "2026-09-18-s4-1"}, {"t": "m", "k": "", "s": "", "a": "Ex.2 \\(e^x+3e^{-2x}\\)", "id": "2026-09-18-s4-2"}, {"t": "m", "k": "", "s": "", "a": "Ex.4 \\((3-2x)e^{-0.5x}\\)", "id": "2026-09-18-s4-3"}, {"t": "m", "k": "", "s": "", "a": "Ex.5 \\(e^{-0.2x}\\sin3x\\)", "id": "2026-09-18-s4-4"}]}, {"sid": "s5", "title": "2.3 미분연산자 — 같은 것을 기호로", "n": ["ode.diff_operator"], "items": [{"t": "f", "a": "\\[D=\\frac{d}{dx},\\quad Dy=y',\\ D^2y=y''\\qquad y''+ay'+by=0\\ \\Leftrightarrow\\ (D^2+aD+b)y=P(D)y=0\\qquad \\text{Ex.1 }P(D)=D^2-3D-40I=(D-8)(D+5)\\]", "id": "2026-09-18-s5-1"}, {"t": "m", "k": "", "s": "", "a": "\\(D=d/dx\\)", "id": "2026-09-18-s5-2"}, {"t": "m", "k": "", "s": "", "a": "\\(P(D)y=0\\)", "id": "2026-09-18-s5-3"}, {"t": "m", "k": "인수분해 \\((D-\\lambda_1)(D-\\lambda_2)\\)", "s": "=", "a": "특성근", "id": "2026-09-18-s5-4"}]}], "classroom": "../classroom/em1/2026-09-18.html"}, {"date": "2026-09-23", "label": "9/23(수) · 4주차", "title": "2.5 오일러-코시 — 지수 대신 거듭제곱, 그리고 2.6 론스키안", "chs": [{"sid": "s1", "title": "오일러-코시 방정식 — y = xᵐ을 넣는다", "n": ["ode.euler_cauchy"], "items": [{"t": "f", "a": "\\[x^2y''+axy'+by=0,\\quad y=x^m:\\ x^2m(m-1)x^{m-2}+axmx^{m-1}+bx^m=0\\ \\Rightarrow\\ \\boxed{m^2+(a-1)m+b=0}\\]", "id": "2026-09-23-s1-1"}, {"t": "m", "k": "\\(x^2y''+axy'+by=0\\)", "s": "→", "a": "\\(m^2+(a-1)m+b=0\\)", "id": "2026-09-23-s1-2"}, {"t": "m", "k": "", "s": "", "a": "(1) \\(c_1x^{m_1}+c_2x^{m_2}\\)", "id": "2026-09-23-s1-3"}, {"t": "m", "k": "", "s": "", "a": "\\(x&gt;0\\)에서 생각", "id": "2026-09-23-s1-4"}]}, {"sid": "s2", "title": "(2) 중근 — 차수축소로 ln x가 붙는다 (판서 ①·③)", "n": ["ode.euler_cauchy", "ode.reduction_order"], "items": [{"t": "f", "a": "\\[m_1=m_2=\\tfrac{1-a}{2},\\ y_1=x^{(1-a)/2}\\quad y_2=uy_1:\\ u''x^2y_1+u'x\\underbrace{(2xy_1'+ay_1)}_{=y_1}+u\\underbrace{(x^2y_1''+axy_1'+by_1)}_{=0}=0\\ \\Rightarrow\\ u''x^2+u'x=0\\]", "id": "2026-09-23-s2-1"}, {"t": "f", "a": "\\[\\int\\frac{u''}{u'}=\\int-\\frac1x\\ \\Rightarrow\\ \\ln u'=-\\ln x\\ \\Rightarrow\\ u'=\\frac1x\\ \\Rightarrow\\ u=\\ln x\\qquad\\therefore\\ y=(c_1+c_2\\ln x)\\,x^{(1-a)/2}\\]", "id": "2026-09-23-s2-2"}, {"t": "m", "k": "", "s": "", "a": "중근 \\(m=\\tfrac{1-a}2\\)", "id": "2026-09-23-s2-3"}, {"t": "m", "k": "", "s": "", "a": "\\(y=(c_1+c_2\\ln x)x^m\\)", "id": "2026-09-23-s2-4"}, {"t": "m", "k": "유도", "s": "=", "a": "차수축소, \\(2xy_1'+ay_1=y_1\\)", "id": "2026-09-23-s2-5"}]}, {"sid": "s3", "title": "(3) 공액복소근 — x^{iq} = cos(q ln x) + i sin(q ln x) ☆ (판서 ④~⑥)", "n": ["ode.euler_cauchy"], "items": [{"t": "f", "a": "\\[m=p\\pm iq:\\ y_{1,2}=x^{p\\pm iq}=x^p\\,x^{\\pm iq},\\qquad x^{iq}=e^{\\ln x^{iq}}=e^{iq\\ln x}=\\cos(q\\ln x)+i\\sin(q\\ln x)\\]", "id": "2026-09-23-s3-1"}, {"t": "f", "a": "\\[y_3=\\tfrac12y_1+\\tfrac12y_2=x^p\\cos(q\\ln x),\\quad y_4=\\tfrac1{2i}y_1-\\tfrac1{2i}y_2=x^p\\sin(q\\ln x)\\qquad\\therefore\\ y=x^p\\big[c_1\\cos(q\\ln x)+c_2\\sin(q\\ln x)\\big]\\]", "id": "2026-09-23-s3-2"}, {"t": "m", "k": "", "s": "", "a": "\\(x^{iq}=e^{iq\\ln x}\\) ☆", "id": "2026-09-23-s3-3"}, {"t": "m", "k": "", "s": "", "a": "\\(y=x^p[c_1\\cos(q\\ln x)+c_2\\sin(q\\ln x)]\\)", "id": "2026-09-23-s3-4"}, {"t": "m", "k": "", "s": "", "a": "2.2 Case III에서 \\(x\\to\\ln x\\)", "id": "2026-09-23-s3-5"}]}, {"sid": "s4", "title": "예제 세 개 — 세 경우 한 번씩 (판서 ⑦~⑨) + 4주차 과제", "n": ["ode.euler_cauchy", "ode.const_coeff"], "items": [{"t": "m", "k": "", "s": "", "a": "(1) 중근 2 (2) 2, 3 (3) \\(-3\\pm2i\\)", "id": "2026-09-23-s4-1"}]}, {"sid": "s5", "title": "2.6 론스키안 — 1차독립을 행렬식으로 ☆ (판서 ⑪~⑮)", "n": ["ode.wronskian", "ode.basis"], "items": [{"t": "f", "a": "\\[W(y_1,y_2)=\\begin{vmatrix}y_1&amp;y_2\\\\y_1'&amp;y_2'\\end{vmatrix}=y_1y_2'-y_2y_1'\\qquad W\\ne0\\ \\Rightarrow\\ \\text{1차독립(기저)},\\quad W=0\\ \\Rightarrow\\ \\text{1차종속}\\] 같은 표준형 \\(y''+p(x)y'+q(x)y=0\\)의 두 해이고 \\(p,q\\)가 구간 \\(I\\)에서 연속일 때, \\(I\\) 안 한 점의 \\(W\\)로 판정한다 — 아무 두 함수에나 쓰면 안 된다(\\(x\\)와 \\(x^2\\)는 독립인데 \\(W(0)=0\\)).", "id": "2026-09-23-s5-1"}, {"t": "m", "k": "", "s": "", "a": "\\(W=y_1y_2'-y_2y_1'\\)", "id": "2026-09-23-s5-2"}, {"t": "m", "k": "", "s": "", "a": "(같은 방정식의 두 해) \\(W\\ne0\\) ⇔ 독립 ☆", "id": "2026-09-23-s5-3"}, {"t": "m", "k": "", "s": "", "a": "eg1 \\(W=\\omega\\)", "id": "2026-09-23-s5-4"}, {"t": "m", "k": "", "s": "", "a": "eg2 \\(W=e^{2x}\\)", "id": "2026-09-23-s5-5"}, {"t": "m", "k": "", "s": "", "a": "정리 1~4(존재·유일성)는 슬라이드 대조 때", "id": "2026-09-23-s5-6"}]}], "classroom": "../classroom/em1/2026-09-23.html"}]}, KEY="mc-memo-"+D.slug;
const $=s=>document.querySelector(s), $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ST={}; try{ ST=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ ST={}; }
let UI={hide:false,left:false}; try{ UI=Object.assign(UI,JSON.parse(localStorage.getItem(KEY+"-ui")||"{}")); }catch(e){}
const CH={}; D.lessons.forEach(l=>l.chs.forEach(c=>{ CH[l.date+"|"+c.sid]=c; }));
function ev(k,x){ try{ if(window.TJ){ const o=Object.assign({k:k},x||{}); if(o.n&&o.n.length) TJ.rec(o); } }catch(e){} }
function itemHTML(it){ return '<div class="it '+(it.t==="f"?"f":"m")+(ST[it.id]?" done":"")+'" data-id="'+esc(it.id)+'"><div class="c">'+(it.k?'<span class="k">'+it.k+'</span><span class="sep">'+esc(it.s)+'</span> ':'')+'<span class="ans">'+splitDisplays(it.a,innerWidth<700)+'</span></div><button type="button" class="ck" aria-label="외움" aria-pressed="'+(ST[it.id]?"true":"false")+'"></button></div>'; }
function render(){
  $("#dates").innerHTML=D.lessons.map(l=>'<a href="#d'+l.date+'">'+esc(l.label.split(" · ")[0])+'</a>').join("");
  $("#list").innerHTML=D.lessons.map(l=>'<section class="ls" id="d'+l.date+'" data-date="'+l.date+'"><h2><span class="dt">'+esc(l.label)+'</span>'+esc(l.title)+'<a class="go" href="'+esc(l.classroom)+'">교실</a></h2>'+
    l.chs.map(c=>'<div class="ch" data-k="'+l.date+"|"+esc(c.sid)+'"><h3>'+esc(c.title)+'</h3>'+c.items.map(itemHTML).join("")+'</div>').join("")+'</section>').join("");
  try{ renderMathInElement($("#list"),{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  fit(); bind(); stat(); }
/* 식은 한 줄 — 넘치면 글자를 줄여서(14px 까지), 그래도 넘치면 식 안에서 밀어 본다 */
function fit(){ $$(".katex-display").forEach(k=>{ k.style.fontSize=""; const cw=k.clientWidth, sw=k.scrollWidth; if(!(cw>0&&sw>cw+1)) return; const kx=k.querySelector(".katex"), fz=parseFloat(getComputedStyle(kx||k).fontSize)||20, lo=Math.min(1,Math.max(.6,14/fz)); k.style.fontSize=Math.max(lo,Math.floor(cw/sw*100)/100)+"em"; });
  $$(".katex").forEach(k=>{ if(k.closest(".katex-display")) return; k.style.fontSize=""; const box=k.closest(".c"); if(!box) return; const cw=box.clientWidth, w=k.getBoundingClientRect().width; if(cw>0&&w>cw-2){ const fs=parseFloat(getComputedStyle(k).fontSize)||17; k.style.fontSize=Math.max(14,Math.floor(fs*(cw-6)/w))+"px"; } }); }
function stat(){ const all=$$(".it"), dn=all.filter(x=>x.classList.contains("done")).length; $("#cnt").textContent="외움 "+dn+"/"+all.length; $("#barI").style.width=(all.length?Math.round(dn/all.length*100):0)+"%";
  $$(".ch").forEach(c=>c.classList.toggle("alldone",$$(".it",c).every(x=>x.classList.contains("done"))));
  $$(".ls").forEach(l=>l.classList.toggle("alldone",$$(".ch",l).every(c=>c.classList.contains("alldone"))));
  document.body.classList.toggle("none",all.length>0&&dn===all.length); }
function bind(){ $$(".it").forEach(el=>{ const id=el.dataset.id, ch=el.closest(".ch"), c=CH[ch.dataset.k]||{}, date=ch.dataset.k.split("|")[0];
  el.querySelector(".c").onclick=()=>{ if(document.body.classList.contains("hide")) el.classList.toggle("show"); };
  el.querySelector(".ck").onclick=()=>{ const on=!ST[id]; if(on) ST[id]=1; else delete ST[id]; try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){}
    el.classList.toggle("done",on); el.querySelector(".ck").setAttribute("aria-pressed",on?"true":"false"); stat();
    ev("memo",{ok:on,n:c.n||[],lid:D.slug+"-"+date,sid:c.sid}); }; }); }
function ui(){ document.body.classList.toggle("hide",UI.hide); document.body.classList.toggle("left",UI.left); $("#bHide").setAttribute("aria-pressed",UI.hide?"true":"false"); $("#bLeft").setAttribute("aria-pressed",UI.left?"true":"false");
  $$(".it.show").forEach(x=>x.classList.remove("show")); try{ localStorage.setItem(KEY+"-ui",JSON.stringify(UI)); }catch(e){} }
$("#bHide").onclick=()=>{ UI.hide=!UI.hide; ui(); }; $("#bLeft").onclick=()=>{ UI.left=!UI.left; ui(); };
window.addEventListener("resize",fit,{passive:true});
function boot(){ render(); ui(); const h=location.hash; if(h&&/^#d\d{4}-\d{2}-\d{2}$/.test(h)){ const el=document.querySelector(h); if(el) setTimeout(()=>el.scrollIntoView(),60); }
  try{ document.fonts.ready.then(fit); }catch(e){} }
(function wait(){ if(window.renderMathInElement) boot(); else setTimeout(wait,40); })();
</script>
