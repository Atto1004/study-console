<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일반물리학2 · 1~3주차 임시 정리</title>
<!-- 학습게임 지침(학습게임_미적분2.md) v4 템플릿 · 오타 디자인 검토(2026-09-17, RED 14건) 반영
     폰트 2종: 본문 손글씨(Nanum Pen Script, display=block) + 수식·숫자 정자(KaTeX). 5색 고정. 16:10. 상단 진행점·챕터명·n/N, 하단 [힌트] [확인/다음]. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 5색 고정 (지침 §2) */
  --memory:#FFE45C; --caution:#E03131; --concept:#1971C2; --exam:#FF4D8D; --example:#2F9E44;
  /* 무채색 — 종이·글자·선 (의미색 아님) */
  --paper:#FFFFFF; --ink:#111111; --muted:#5F5F5F; --line:#D8D8D8; --soft:#F5F5F5; --bg:#EDEDED;
  /* 폰트 2종 (지침 §1) */
  --font-hand:'Nanum Pen Script','NanumPen',sans-serif;
  --font-num:'KaTeX_Main','Times New Roman',serif;
  /* 글자 크기 3단계 (지침 §1) */
  --fs-title:31px; --fs-body:22px; --fs-note:17px;
}
*{box-sizing:border-box}
:where(h1,h2,h3,h4,p,ul,ol,li,dl,dt,dd,pre,blockquote,figure,figcaption,table,th,td,button,input,textarea,label){margin:0;padding:0;text-indent:0;word-break:keep-all;overflow-wrap:break-word}
html,body{height:100%;width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-hand);font-size:var(--fs-body);line-height:1.45;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
body{display:grid;place-items:center;padding:12px}
.katex{font-size:1em}
#stage{position:relative;width:min(calc(100vw - 24px),calc((100dvh - 24px) * 1.6));aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
/* 상단: 진행점 · 챕터명 · n/N */
#top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) auto;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:var(--fs-note)}
#progress{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.dot{flex:0 0 12px;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.dot.done{background:var(--ink)}
.dot.exam{border-color:var(--exam);background:var(--exam)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
#chapter{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pos{font-family:var(--font-num);white-space:nowrap}
/* 작업 영역 */
#body{min-height:0;overflow:hidden;padding:18px 24px 12px;font-size:var(--fs-body);line-height:1.45}
#body[data-ready="false"]{visibility:hidden}
#body.scrollable{overflow:auto}   /* 시작 위치 장만 — 학습 내용이 아니라 목록이라 스크롤 허용 */
#body h1,#body h2{font-size:var(--fs-title);line-height:1.2;margin-bottom:8px}
#body h3{font-size:var(--fs-body)}
.num{font-family:var(--font-num)}
#fontWarn{position:absolute;left:22px;right:22px;top:58px;border:2px solid var(--caution);background:var(--paper);padding:6px 12px;font-size:var(--fs-note);z-index:12}
#fontWarn[hidden]{display:none}
#body .kicker{font-size:var(--fs-note);color:var(--muted)}
#body p,#body li{margin:0}
#body p+p{margin-top:6px}
#body ul,#body ol{padding-left:22px}
#body :is(.why,.concept,.one,.say,.extra),.ans,.myans-show,.mu>div{margin:8px 0 0;padding:10px 14px}
#body .why,#body .concept{border:2px solid var(--concept)}
#body .say{border-left:4px solid var(--concept);background:var(--soft)}
#body .say b{color:var(--concept)}
#body .one{border-left:4px solid var(--ink);background:var(--soft)}
#body .term{color:var(--concept);border-bottom:1px dashed var(--concept)}
#body .hl{background:var(--memory);padding:0 4px}
#body .red{color:var(--caution)}
#body .star{color:var(--exam)}
#body .tw{overflow:hidden;margin:8px 0 0;border:1px solid var(--line)}
#body table{border-collapse:collapse;width:100%;font-size:var(--fs-body)}
#body th,#body td{padding:3px 10px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
#body thead th{border-top:0;font-size:var(--fs-note);color:var(--muted)}
#body pre{white-space:pre-wrap;font-family:var(--font-num);font-size:var(--fs-note);line-height:1.35}
#body code{font-family:var(--font-num)}
/* 시험 언급 — 최우선 (지침 §3) */
.exam-callout{border:4px solid var(--exam);padding:10px 14px;margin:0 0 10px;background:var(--paper)}
.exam-label{font-size:var(--fs-note);color:var(--exam)}
.exam-label b{color:var(--ink)}
.exam-quote{font-size:var(--fs-body)}
/* 표지·결과 */
.cover .big{font-size:var(--fs-title);line-height:1.2;margin:6px 0 10px}
.cover .sub{font-size:var(--fs-body)}
.score{display:flex;gap:14px;margin:10px 0}
.score .c{border:2px solid var(--ink);padding:10px 16px}
.score .c b{display:block;font-family:var(--font-num);font-size:var(--fs-title)}
/* 암기 vs 이해 */
.mu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mu>div{min-width:0}
.mu-mem{background:var(--memory);border:2px solid var(--memory)}
.mu-und{border:2px solid var(--concept)}
.mu-h{margin-bottom:4px}.mu-h .hint{font-size:var(--fs-note);color:var(--muted);margin-left:6px}
.mu li{margin:2px 0}
/* 문제 */
.q-kind{display:inline-block;font-size:var(--fs-note);border:1px solid var(--ink);padding:0 8px;margin-right:8px;vertical-align:middle}
#body.q-mode{display:flex;flex-direction:column}
#body.q-mode>*{flex:0 0 auto}
.pad{flex:1 1 auto!important;min-height:100px;display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);overflow:hidden;background:var(--paper)}
.pad-bar{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:var(--fs-note);background:var(--soft);flex-wrap:wrap}
.pad-bar .hint{color:var(--muted);margin-right:auto}
.pad-bar button{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.pad-bar button.on{background:var(--ink);color:var(--paper)}
.pad canvas{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:24px 24px}
/* V4-PADPANEL 필기 판 — 「+ 필기」로 여닫음, 문제 아래쪽을 덮는다 */
#padPanel{position:absolute;left:24px;right:24px;top:38%;bottom:72px;background:var(--paper);border:2px solid var(--ink);display:none;flex-direction:column;z-index:16}
#padPanel.on{display:flex}
#padPanel .pad{flex:1 1 auto;margin:0;border:0;min-height:0}
#padBtn.on{background:var(--ink);color:var(--paper)}
/* V4-ANSLB 답·풀이 판 — 작업 영역 전체 */
#anslb{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);display:none;flex-direction:column;z-index:18;padding:14px 24px;overflow:hidden}
#anslb.on{display:flex}
#anslb .ans{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:8px}
#anslb .ans-top{display:flex;align-items:center;gap:10px}
#anslb .ans-top .kicker{margin-right:auto}
.myans{margin-top:8px}.myans label{display:block;font-size:var(--fs-note);color:var(--muted)}
.myans textarea{width:100%;font-family:var(--font-num);font-size:var(--fs-body);line-height:1.35;padding:6px 12px;border:2px solid var(--ink);background:var(--paper);resize:none;outline:none}
.myans textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.myans-show{border:2px dashed var(--ink)}
.myans-txt{font-family:var(--font-num);white-space:pre-wrap}
.ans{border:2px solid var(--example)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;font:inherit;font-size:var(--fs-body);padding:6px 12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:48px}
.choice .cn{flex:0 0 28px;height:28px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:var(--fs-note)}
.choice .ct{min-width:0}
.choice.sel{border-color:var(--ink);border-width:3px}
.choice.ok{border-color:var(--example)}.choice.ok .cn{background:var(--example);border-color:var(--example);color:var(--paper)}
.choice.bad{border-color:var(--caution)}.choice.bad .cn{background:var(--caution);border-color:var(--caution);color:var(--paper)}
.choice[disabled]{cursor:default}
.verdict{padding:6px 14px;border:2px solid var(--ink)}.verdict.ok{border-color:var(--example)}.verdict.bad{border-color:var(--caution);color:var(--caution)}
/* 시작 위치 */
.jump-h{font-size:var(--fs-note);color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jump-part{display:flex;gap:10px;align-items:flex-start;margin:2px 0}
.jump-pt{flex:0 0 220px;font-size:var(--fs-note);padding-top:6px}
.jump-items{display:flex;flex-wrap:wrap;gap:4px}
.jp{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.jp.done{background:var(--ink);color:var(--paper)}.jp.skip{color:var(--muted);text-decoration:line-through;border-color:var(--line)}.jp.cur{border:3px solid var(--ink)}
/* 하단: [이전] [힌트] · 출처 · 동작 · [확인/다음] */
#foot{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:var(--fs-body);min-height:48px;padding:4px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.xs{font-size:var(--fs-note);min-height:36px;padding:2px 12px}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#act{display:flex;gap:8px;align-items:center;margin-left:auto}#act .hint{font-size:var(--fs-note);color:var(--muted)}
#next{margin-left:8px}
#next.undone{background:var(--paper);color:var(--ink);border-style:dashed}
#doneTag{font-size:var(--fs-note);color:var(--muted)}
/* 출처 썸네일 · 확대 */
#srcs{display:flex;gap:6px}
.src-th{position:relative;width:48px;height:48px;padding:0;border:2px solid var(--ink);overflow:hidden;background:var(--paper);cursor:pointer;flex:0 0 auto}
.src-th img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.src-th .src-n{position:absolute;right:0;bottom:0;font-family:var(--font-num);font-size:var(--fs-note);background:var(--ink);color:var(--paper);padding:0 4px}
#srclb{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:20;padding:12px 18px}
#srclb.on{display:flex}
.src-top{display:flex;align-items:center;gap:10px;font-size:var(--fs-note);padding-bottom:8px}.src-top b{color:var(--ink)}.src-top .src-pos{margin-left:auto;font-family:var(--font-num)}
.src-x{font:inherit;font-size:var(--fs-body);min-width:48px;min-height:44px;border:2px solid var(--ink);background:var(--paper);cursor:pointer}
.src-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);touch-action:pan-x pan-y pinch-zoom}
.src-body img{width:100%;height:auto;display:block;cursor:zoom-in}
.src-body img.zoom{width:190%;max-width:none;cursor:zoom-out}
.src-foot{display:flex;align-items:center;gap:10px;padding-top:8px}.src-foot .hint{margin:0 auto;font-size:var(--fs-note);color:var(--muted)}
/* 힌트 상자 */
#hintBox{position:absolute;left:22px;right:22px;bottom:76px;background:var(--paper);border:2px solid var(--ink);padding:10px 14px;z-index:15}
#hintBox[hidden]{display:none}
/* 검사 모드 표시 */
#chk{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);overflow:auto;padding:20px;z-index:30;font-size:var(--fs-note);display:none}

/* ===== V6 UI — 조작부 재설계 (아토 2026-09-21). 본문(손글씨·5색)은 그대로, 조작부만 정자·평면 ===== */
:root{--ui:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;--accent:#4F9A35;--accent-soft:#EAF4E6;--bad:#D23B3B;--bad-soft:#FBEAEA;--line:#E3E8E5;--soft:#F4F6F5;--bg:#EEF1EF;--muted:#6B7570;--ink-3:#8A9490}
body{background:var(--bg)}
#stage{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
/* 상단: 분절 진행 막대 + 정자 라벨 */
#top{padding:12px 20px;gap:14px;font-family:var(--ui);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:#fff}
#progress{gap:3px;flex-wrap:nowrap;overflow:hidden}
.dot{flex:1 1 0;width:auto;min-width:6px;max-width:28px;height:6px;border:0;border-radius:3px;background:var(--line)}
.dot.done{background:var(--accent)}.dot.cur{background:#B7DBA8;outline:0;box-shadow:inset 0 0 0 1px var(--accent)}.dot.exam{background:#FFC2D8}.dot.exam.done{background:var(--exam)}
#chapter{font-family:var(--ui);font-size:13px;font-weight:600;color:#1F2A24}
#pos{font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
/* 본문 상자: 두꺼운 파란 테두리 → 좌측 바 */
#body .why,#body .concept{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
#body .one{border-radius:0 10px 10px 0}#body .say{border-radius:0 10px 10px 0}
#body .tw{border-radius:10px}
.mu-mem{border:0;border-left:3px solid #E5C400;background:#FFF9D6;border-radius:0 10px 10px 0}.mu-und{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
.q-kind{font-family:var(--ui);font-size:12px;font-weight:600;border:0;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
#body .kicker{font-family:var(--ui);font-size:12px;letter-spacing:0;color:var(--ink-3)}
/* 보기 카드 */
.choices{gap:10px;margin-top:12px}
.choice{font-family:var(--font-hand);border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;min-height:56px;transition:border-color .12s,background .12s}
.choice:hover{border-color:#B9C4BE;background:var(--soft)}
.choice .cn{flex:0 0 28px;width:28px;height:28px;border:0;border-radius:50%;background:var(--soft);color:#1F2A24;font-family:var(--ui);font-size:13px;font-weight:600}
.choice.sel{border:2px solid var(--accent);padding:11px 13px}.choice.sel .cn{background:var(--accent);color:#fff}
.choice.ok{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}.choice.ok .cn{background:var(--accent);color:#fff}
.choice.bad{border:2px solid var(--bad);background:var(--bad-soft);padding:11px 13px}.choice.bad .cn{background:var(--bad);color:#fff}
.choice[disabled]:not(.ok):not(.bad){opacity:.55}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 주관식 */
.myans label{font-family:var(--ui);font-size:12px;color:var(--muted)}
.myans textarea{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--ui);font-size:16px;background:#fff}
.myans textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.myans-show{border:1px dashed #B9C4BE;border-radius:12px;background:var(--soft)}
.myans-txt{font-family:var(--ui);font-size:16px}
.myans-note{margin-top:8px}
/* 판정·안내 */
.verdict{font-family:var(--ui);font-size:13px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:var(--soft);color:#1F2A24}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}
#act .hint{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
#doneTag{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
/* 하단 바 · 버튼 */
#foot{padding:10px 16px;gap:8px;border-top:1px solid var(--line);background:#fff}
.btn{font-family:var(--ui);font-size:14px;font-weight:600;min-height:40px;padding:6px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1F2A24;box-shadow:none}
.btn:hover{background:var(--soft)}
.btn.xs{font-size:13px;min-height:36px;padding:4px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
#next{min-width:96px}
#next.undone{background:#fff;color:var(--accent);border:1px solid var(--accent);border-style:solid}
.btn[disabled]{opacity:.35}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#padBtn.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
/* 출처 썸네일 */
#srcs{gap:6px}
.src-th{width:40px;height:40px;border:1px solid var(--line);border-radius:8px}
.src-th .src-n{font-family:var(--ui);font-size:11px;padding:0 5px;border-radius:6px 0 6px 0}
.src-x{font-family:var(--ui);font-size:14px;border:1px solid var(--line);border-radius:10px;min-height:40px}
.src-top{font-family:var(--ui);font-size:13px}.src-body{border-radius:12px}
.src-foot .hint{font-family:var(--ui);font-size:12px}
/* 힌트 · 필기 · 풀이 판 · 글꼴 경고 */
#hintBox{border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
#padPanel{border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
.pad-bar{font-family:var(--ui);font-size:12px;padding:6px 10px;background:var(--soft);border-radius:14px 14px 0 0}
.pad-bar button{font-family:var(--ui);font-size:12px;font-weight:600;min-height:32px;padding:2px 10px;border:1px solid var(--line);border-radius:8px}
.pad-bar button.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
#anslb{padding:16px 24px}
#anslb .ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
.ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
#anslb .ans-top .kicker{font-family:var(--ui);font-size:12px}
#fontWarn{border:1px solid var(--bad);border-radius:10px;font-family:var(--ui);font-size:12px}

<script>
const DECK_ID="phys2-w1-3";
const SLIDES=[{"id": "start", "type": "start"}, {"id": "jump", "type": "jump", "part": 0}, {"id": "p1-cover", "type": "cover", "part": 1, "no": "파트 1 · 9/4", "title": "전기장 시작", "star": false}, {"id": "p1-concept", "type": "concept", "part": 1, "title": "전기장 시작", "html": "<div class=\"one\">한 줄: 이 회차 정리를 읽고 다음으로.</div>\n", "exam": []}, {"id": "p1-result", "type": "result", "part": 1, "title": "전기장 시작"}, {"id": "p2-cover", "type": "cover", "part": 2, "no": "파트 2 · 9/9", "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫)", "star": false}, {"id": "p2-exam-1", "type": "concept", "part": 2, "title": "시험 언급 (1/2)", "html": "", "exam": [{"level": "강조", "when": "09/09", "quote": "(9/11) 점전하 벡터식 (1/4πε₀)(q/r³)r⃗ 은 시험에 반드시. (9/4) 중간 범위 21~27장, \"중간고사를 포기하면 뒤를 포기하는 것\"."}, {"level": "강조", "when": "09/09", "quote": "(9/11) 밀도 기호 λ·σ·ρ 구분 — 답에 어느 기호로 쓰는지 틀리기 쉬움."}]}, {"id": "p2-exam-2", "type": "concept", "part": 2, "title": "시험 언급 (2/2)", "html": "", "exam": [{"level": "강조", "when": "09/09", "quote": "유형 예상: 점전하군 벡터 합(필수문제 1) · 직선/고리/원판 유도 서술 · 쌍극자 1/z³."}]}, {"id": "p2-concept", "type": "concept", "part": 2, "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫) (1/8)", "html": "<div class=\"concept\"><p><b>③ 녹음본 정리 — 없음. 9/11 녹음에서 이날을 가리킨 대목:</b></p></div><div class=\"concept\"><ul><li>(00:xx) \"불연속일 때는 점전하·쌍극자(Σ), <b>연속일 때는 직선·원형·원판</b> — 얘는 λ, σ 로 식·답을 쓸 거예요.\"</li></ul></div><div class=\"concept\"><ul><li>\"직선 도선일 때 요만한 길이의 전하량을 소문자 q라고 했는지 대문자 Q라고 했는지… 앞에 거는 소문자 q.\"</li></ul></div><div class=\"concept\"><ul><li>\"a에서 a+L까지 ∫dEₓ 해서 나오는 결과가 뭐다라고까지 <b>지난 시간에 한 것 같아요</b>. 그래서 이제 원형 도선.\"</li></ul></div><div class=\"concept\"><ul><li><span class=\"star\">★</span> \"<b>E⃗ = (1/4πε₀)(q/r³) r⃗</b> — 시험 문제 내면 반드시 써야 된다.\"</li></ul></div>", "exam": []}, {"id": "p2-concept-2", "type": "concept", "part": 2, "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫) (2/8)", "html": "<div class=\"concept\"><p><b>④ 강의자료 정리 — 강의노트 p.6~7</b></p></div><div class=\"concept\"><p><b>4-1. 전기장 구하기의 틀 (p.6 표 머리) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li>\"다음과 같은 형태의 전하 분포에 <b>시험전하를 가져왔을 경우</b> 각각에 대한 전기장을 구하라.\" — 전기장 = <b>단위 양전하(+1 C)에 작용하는 전기력</b>. <code>F⃗ = (1/4πε₀)(qq'/r²) r̂ ⇒ E⃗ = lim_{q'→0} F⃗/q' = (1/4πε₀)(q/r²) r̂</code></li></ul></div><div class=\"concept\"><ul><li>☞ 시험전하의 크기는 <b>미소전하(infinitesimal charge)</b> — 원래 장을 흐트러뜨리지 않기 위해 극한.</li></ul></div>", "exam": []}, {"id": "p2-concept-3", "type": "concept", "part": 2, "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫) (3/8)", "html": "<div class=\"concept\"><ul><li>분류: <b>불연속 분포 = Σ</b>(①②③) / <b>연속 분포 = ∫</b>(④⑤⑥). 밀도 기호: 선 λ = dq/ds · 면 σ = dq/dA · 부피 ρ(가우스 법칙).</li></ul></div><div class=\"concept\"><p><b>4-2. ① 점전하 (p.6) <span class=\"star\">★</span><span class=\"star\">★</span> 시험 필수</b></p></div><div class=\"concept\"><ul><li><b><code>E⃗ = (1/4πε₀)(q/r²) r̂ = (1/4πε₀)(q/r³) r⃗</code></b> — 벡터 꼴로 쓸 것. r̂ = r⃗/|r⃗|. 방향: q&gt;0이면 밖으로, q&lt;0이면 안으로.</li></ul></div><div class=\"concept\"><ul><li>k 대신 <b>1/4πε₀</b> 표기(교수 9/4).</li></ul></div><div class=\"concept\"><p><b>4-3. ② 점전하군 (p.6) <span class=\"star\">★</span> — 중첩 원리</b></p></div>", "exam": []}, {"id": "p2-concept-4", "type": "concept", "part": 2, "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫) (4/8)", "html": "<div class=\"concept\"><ul><li><b><code>E⃗ = Σᵢ E⃗ᵢ = E⃗₁ + E⃗₂ + … + E⃗_N = (1/4πε₀) Σᵢ (qᵢ/rᵢ²) r̂ᵢ</code></b> — 각 전하가 만드는 장을 <b>벡터로</b> 더한다(크기 더하기 ✗).</li></ul></div><div class=\"concept\"><ul><li>계산 수순: 각 전하 → P까지 거리 rᵢ와 방향 r̂ᵢ → 성분(x, y)으로 나눠 합 → 크기·각. p.8 <b>필수문제 1</b>(q₁=20C, q₂=−3C, q₃=−4C at (0,0),(4,0),(0,3)) 이 이 유형: <code>F⃗ = k_e(15/4 î + 80/9 ĵ)</code>.</li></ul></div><div class=\"concept\"><p><b>4-4. ③ 전기쌍극자 (p.6) <span class=\"star\">★</span> — 축 위의 장</b></p></div>", "exam": []}, {"id": "p2-concept-5", "type": "concept", "part": 2, "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫) (5/8)", "html": "<div class=\"concept\"><ul><li>+q, −q 가 거리 d 로 놓인 것. 쌍극자 모멘트 <b><code>p⃗ = q d⃗</code></b> (−q에서 +q 방향, 그림 (b)).</li></ul></div><div class=\"concept\"><ul><li>축 위 점 P(중심에서 z): <code>E = E₍₊₎ − E₍₋₎ = (1/4πε₀)[q/(z−d/2)² − q/(z+d/2)²]</code></li></ul></div><div class=\"concept\"><ul><li><span class=\"star\">★</span>복원(교재 유도): z ≫ d 이면 <b><code>E ≈ (1/4πε₀)·2qd/z³ = (1/4πε₀)·2p/z³ = (1/2πε₀)·p/z³</code></b> — 점전하의 1/r²이 아니라 <b>1/z³으로 감소</b>(멀리서는 ±q가 상쇄되기 때문). 방향 = p⃗ 방향.</li></ul></div>", "exam": []}, {"id": "p2-concept-6", "type": "concept", "part": 2, "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫) (6/8)", "html": "<div class=\"concept\"><ul><li>쌍극자가 균일한 전기장 안에 있을 때의 토크·에너지(p.8 「4. 전기장 안의 전기쌍극자」)는 9/11 이후.</li></ul></div><div class=\"concept\"><p><b>4-5. ④ 직선 도선 (p.7 상단) <span class=\"star\">★</span> — 연속 분포의 첫 예</b></p></div><div class=\"concept\"><ul><li>길이 L, 총 전하 q(균일)인 직선 도선. 선전하밀도 <b><code>λ = dq/dx = q/L</code></b>, 미소 전하 <b><code>dq = λ dx</code></b>.</li></ul></div><div class=\"concept\"><ul><li>도선 연장선 위, 도선 끝에서 <b>a</b> 떨어진 점 P. 위치 x의 미소 전하가 P에 만드는 장(도선 방향 성분만): <b><code>dEₓ = (1/4πε₀)·dq/x² = (1/4πε₀)·λ dx/x²</code></b></li></ul></div>", "exam": []}, {"id": "p2-concept-7", "type": "concept", "part": 2, "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫) (7/8)", "html": "<div class=\"concept\"><ul><li>P에서 도선의 가까운 끝까지 a, 먼 끝까지 a+L → <b><code>Eₓ = ∫ₐ^(a+L) (1/4πε₀)(λ/x²) dx</code></b> (강의노트 <span class=\"star\">★</span> 자리 = 이 적분값) <code>= (λ/4πε₀)[−1/x]ₐ^(a+L) = (λ/4πε₀)(1/a − 1/(a+L)) = (λ/4πε₀)·L/(a(a+L))</code> <b><code>∴ E = (1/4πε₀)·q/(a(a+L))</code></b> (λL = q). 방향: 도선에서 멀어지는 쪽(q&gt;0).</li></ul></div><div class=\"concept\"><ul><li>검산: a ≫ L 이면 <code>E → (1/4πε₀) q/a²</code> — 점전하로 돌아감 ✓ (극한 확인은 시험 서술에 넣을 만함).</li></ul></div>", "exam": []}, {"id": "p2-concept-8", "type": "concept", "part": 2, "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫) (8/8)", "html": "<div class=\"concept\"><ul><li>이 수순(dq = λdx → dE → 구간 정해 ∫)이 <b>원형 도선(ds, 대칭으로 z성분만)·원판(dA = 2πr dr)</b> 으로 그대로 이어짐 → 9/11 정리 ④⑤.</li></ul></div><div class=\"one\">한 줄: 22장 전기장 계산 — 불연속 분포(Σ): ① 점 >dq = λ ds</code></li></ul></div><div class=\"concept\"><ul><li>점 P 까지 거리: <code>r = √(z² + R²)</code></li></ul></div>", "exam": [], "scroll": true}, {"id": "p3-concept-4", "type": "concept", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론 (4/12)", "html": "<div class=\"concept\"><p><b>대칭성 논증 <span class=\"star\">★</span> 이게 전부다</b> &gt; \"가운데를 중심으로 <b>정반대쪽에 똑같은 게 또 하나 있네.</b> 얘네들은 벡터니까 서로 반대 방향으로 상쇄되네. <b>살아남는 건 z 성분만.</b>\"</p></div><div class=\"concept\"><ul><li>수평(반지름) 성분은 정반대편 짝과 <b>상쇄</b></li></ul></div><div class=\"concept\"><ul><li><b>z 성분만 살아남음</b>: <code>dE_z = dE·cos θ</code>, <code>cos θ = z/√(z²+R²)</code></li></ul></div><div class=\"concept\"><p><b>계산</b></p></div><div class=\"concept\"><pre>E_z = (1/4πε₀) · λ z /(z²+R²)^(3/2) · ∫₀^(2πR) ds\n    = (1/4πε₀) · λ(2πR) z /(z²+R²)^(3/2)</pre></div><div class=\"concept\"><p><code>λ·2πR = q</code> 이므로</p></div><div class=\"concept\"><pre>E_z = (1/4πε₀) · q z /(z²+R²)^(3/2)</pre></div>", "exam": [], "scroll": true}, {"id": "p3-concept-5", "type": "concept", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론 (5/12)", "html": "<div class=\"concept\"><p>&gt; \"이 원형 도선의 핵심은 <b>좌우 대칭으로 수평 성분은 싹 없어지고 수직 성분만 남는데, 한 바퀴 삥 도니까 0에서 2πR 까지 적분</b>해 버리면 된다는 사실만 딱 이해되면 돼.\"</p></div><div class=\"concept\"><p><b>⑤ 원판 — 원형 도선을 쌓은 것</b></p></div><div class=\"concept\"><p>&gt; \"원판은 더 어려워. <b>0에서 R 까지 원형 도선을 적분하는 거다</b>라고 하는 것만 알면 돼.\"</p></div><div class=\"concept\"><ul><li>전하가 <b>면</b>에 퍼져 있으므로 <b>σ</b> 를 쓴다</li></ul></div><div class=\"concept\"><ul><li>반지름 r 인 <b>고리 띠</b>의 면적: <code>dA = 2πr dr</code></li></ul></div><div class=\"concept\"><ul><li><code>dq = σ dA = σ·2πr dr</code></li></ul></div>", "exam": [], "scroll": true}, {"id": "p3-concept-6", "type": "concept", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론 (6/12)", "html": "<div class=\"concept\"><pre>dE = (1/4πε₀)·(σ·2πr dr)/(r²+z²)\ndE_z = dE·cos θ,   cos θ = z/√(r²+z²)\n\nE_z = (σz/2ε₀) ∫₀^R  r dr /(r²+z²)^(3/2)</pre></div><div class=\"concept\"><p><b>치환</b>: <code>a² = r² + z²</code> → <code>a da = r dr</code></p></div><div class=\"concept\"><ul><li>r=0 → a=z</li></ul></div><div class=\"concept\"><ul><li>r=R → a=√(z²+R²)</li></ul></div><div class=\"concept\"><pre>E_z = (σz/2ε₀) ∫ da/a² = (σz/2ε₀)[1/z − 1/√(z²+R²)]</pre></div><div class=\"concept\"><p><b><span class=\"star\">★</span> 결과</b></p></div><div class=\"concept\"><pre>E = (σ/2ε₀) [ 1 − z/√(z²+R²) ]</pre></div>", "exam": [], "scroll": true}, {"id": "p3-concept-7", "type": "concept", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론 (7/12)", "html": "<div class=\"concept\"><p><b><span class=\"star\">★</span><span class=\"star\">★</span> 무한 평면 — 물리적 의미</b></p></div><div class=\"concept\"><p><code>R → ∞</code> 이면 둘째 항이 0 이 되어</p></div><div class=\"concept\"><pre>E = σ/2ε₀   (= q/2ε₀A)</pre></div><div class=\"concept\"><p>&gt; \"<b>무한 평면의 전기장</b>이에요. z 에 안 들어가. 거리와 무관하다.\"</p></div><div class=\"concept\"><p><b>⑤(추가 2026-09-16) 필기 업데이트 — <code>필기_강의노트_p7-8_원형도선_원판_유도.pdf</code> (아토 태블릿 필기, 태그 \"9/11(금) 10:30-\")</b></p></div><div class=\"concept\"><ul><li><b>p.7 직선도선</b>: 불연속(점전하·점전하군·전기쌍극자) / 연속(선·면·부피) 구분 메모, <code>λ = dq/ds = q/L</code>, <code>dE_x = (1/4πε₀)(dq/x²) = (1/4πε₀)(λdx/x²)</code>, <code>∫ₐ^(a+L) dE_x</code> <span class=\"star\">★</span>(9/9 내용 복습).</li></ul></div>", "exam": [], "scroll": true}, {"id": "p3-concept-8", "type": "concept", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론 (8/12)", "html": "<div class=\"concept\"><ul><li><b>p.7 원형도선</b>: <code>dE = (1/4πε₀)(dq/r²) = (1/4πε₀)(λds/(z²+R²))</code>, <code>dE_z = dE cosθ</code>, <code>cosθ = z/√(z²+R²)</code> → <code>E_z = (1/4πε₀)·λz/(z²+R²)^(3/2)·∫₀^(2πR)ds = (1/4πε₀)·qz/(z²+R²)^(3/2)</code> (λ·2πR = q). 녹음 ④와 일치.</li></ul></div>", "exam": []}, {"id": "p3-concept-9", "type": "concept", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론 (9/12)", "html": "<div class=\"concept\"><ul><li><b>p.8 원판</b>: 원판 = <code>∫₀^R (원형도선)</code>. <code>dq = σ dA = σ·2πr dr</code>, <code>dE_z = (σz/2ε₀)·r dr/(r²+z²)^(3/2)</code>, 치환 <code>A² = r²+z²</code>, <code>A dA = r dr</code>, 구간 z→√(z²+R²) → <code>E = (σ/2ε₀)(1 − z/√(z²+R²))</code>. 아래 인쇄 \"의미 2\" 옆 메모: <code>R→∞이면(무한평면) E = σ/2ε₀ = q/2ε₀A</code>. 녹음 ⑤와 일치.</li></ul></div><div class=\"concept\"><p><b>① 이 단원의 전체 지도 — 교수가 첫머리에 다시 짚음</b></p></div><div class=\"concept\"><p>전기장 구하기는 <b>전하 분포가 불연속이냐 연속이냐</b>로 갈린다.</p></div>", "exam": []}, {"id": "p3-concept-10", "type": "concept", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론 (10/12)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th></th><th>방법</th><th>대상</th></tr></thead><tbody><tr><td><b>불연속</b></td><td>Σ (합)</td><td>점전하, 전기 쌍극자</td></tr><tr><td><b>연속</b></td><td>∫ (적분)</td><td>직선 도선(λ) · 원형 도선(λ) · 원판(σ)</td></tr></tbody></table></div></div>", "exam": []}, {"id": "p3-concept-11", "type": "concept", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론 (11/12)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th></th><th>방법</th><th>대상</th></tr></thead><tbody><tr><td>(다음)</td><td>가우스 법칙</td><td>부피 전하밀도 ρ</td></tr></tbody></table></div></div><div class=\"concept\"><p>&gt; \"6개 다 했어. 직선 도선, 원형 도선, 원판 — 그걸 전하의 분포가 썸이냐 인테그럴이냐 한 거잖아.\"</p></div><div class=\"concept\"><p><b>전하밀도 기호 구분 — 시험에서 틀리기 쉬움</b></p></div><div class=\"concept\"><ul><li>선 → <b>λ</b> (람다), <code>λ = dq/ds</code></li></ul></div><div class=\"concept\"><ul><li>면 → <b>σ</b> (시그마), <code>σ = dq/dA</code></li></ul></div>", "exam": []}, {"id": "p3-concept-12", "type": "concept", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론 (12/12)", "html": "<div class=\"concept\"><ul><li>부피 → <b>ρ</b> (로) — 가우스 법칙에서 나옴</li></ul></div><div class=\"one\">한 줄: 22장 완료(연속 전하분포 6종 마무리) → 23장 가우스 법칙 서론</div>\n", "exam": []}, {"id": "p3-result", "type": "result", "part": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론"}, {"id": "p4-cover", "type": "cover", "part": 4, "no": "파트 4 · 9/16", "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구", "star": false}, {"id": "p4-exam-1", "type": "concept", "part": 4, "title": "시험 언급 (1/4)", "html": "", "exam": [{"level": "강조", "when": "09/16", "quote": "(19:09) \"도체구와 부도체구의 응용을 하면 시험 문제는 이거에서 산수 계산하는 거에서 많이 나와요. 이 앞에서 했던 건 안 나와.\""}, {"level": "강조", "when": "09/16", "quote": "(30:05·40:51) 다른 반 유형 \"반지름 1/3 → 9배 / 27배\" 같은 의미 없는 산수·증명 문제는 안 낸다."}]}, {"id": "p4-exam-2", "type": "concept", "part": 4, "title": "시험 언급 (2/4)", "html": "", "exam": [{"level": "강조", "when": "09/16", "quote": "(42:24) 교재 670페이지 연습문제 + 강의노트 문제(가운데 부도체구 – 도체 껍질 – 부도체… 범위별로 전기장 구하기): \"모든 책에 가장 많이 나와. 그건 100% 시험 문제 나올 거야. 내가 이렇게 얘기하면 100% 나오는 거 알죠.\" 단, 강의노트 문제 그대로는 아님(\"포인트 안 올려놨어요\") → 이해해야 푸는 변형. 알짜전하 계산 예: 부도체구 q, 껍질 −2q면 껍질 밖 알짜 −q… 범위마다 q_enc가 달라진다."}, {"level": "강조", "when": "09/16", "quote": "(44:55) \"시험 문제는 그것밖에 안 나올 거예요. 별로 없어요.\" — 23장에서는 도체구·부도체구 범위별 전기장이 사실상 전부."}]}, {"id": "p4-exam-3", "type": "concept", "part": 4, "title": "시험 언급 (3/4)", "html": "", "exam": [{"level": "강조", "when": "09/16", "quote": "(38:18) \"가우스 법칙에서 나오는 값은 다 스칼라\" — 개념 문제 후보."}, {"level": "강조", "when": "09/16", "quote": "아토 캡션 \"시험대비\"(판서 7): 고립도체 → 도체구 r<R E=0 / r≥R q/(4πε₀r²)."}]}, {"id": "p4-exam-4", "type": "concept", "part": 4, "title": "시험 언급 (4/4)", "html": "", "exam": [{"level": "강조", "when": "09/16", "quote": "기존: 중간 범위 27장까지(9/4), 점전하 벡터식 필수(9/11)."}]}, {"id": "p4-concept", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (1/28)", "html": "<div class=\"concept\"><p><b>② 칠판 판서 이미지 정리 — 8장 (칠판, 흰·노란 분필)</b></p></div><div class=\"concept\"><p><b>판서 1 <code>판서_1_가우스법칙_정의_축구공.jpg</code> (02:05~07:31)</b></p></div>", "exam": []}, {"id": "p4-concept-2", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (2/28)", "html": "<div class=\"concept\"><pre>Gauss 법칙\n∮ (E⃗) · n̂ (da) = q_enc / ε₀          ε₀ = 8.854×10⁻¹² (C²/N·m²)\n ↑     ↑     ↑    ↑        ↑\nclosed  전기장  미소면적  미소면적   알짜전하\nface(폐곡면)   법선벡터\n축구공 그림(구 + 격자, 중심 +1C, 화살표 밖으로) → \"da 60경개\"   (노란 분필)</pre></div>", "exam": []}, {"id": "p4-concept-3", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (3/28)", "html": "<div class=\"concept\"><pre>E⃗·n̂ = E·1·cos0° = E              ∮ da  (노란 원)\n오른쪽 스케치: 곡면 위 한 점에서 E⃗ 와 n̂ 이 나란히</pre></div><div class=\"concept\"><p><b>판서 2 <code>판서_2_폐곡면적분_가우스면3종.jpg</code> (07:31~13:27)</b></p></div>", "exam": []}, {"id": "p4-concept-4", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (4/28)", "html": "<div class=\"concept\"><pre>∮ E⃗·n̂ da = E ∮ da        ← 폐곡면 적분 = **Gauss 면 (가상)**\n 임의 곡면(✗ 취소) vs 구 r → 4πr²\n설정하는 가우스면:  면 → A · 원통 → 2πrl(옆면, 길이 L) · 구 → 4πr²\n면 A 앞에 +전하(q) 전기력선 → E·A = q/ε₀ → E = q/(ε₀A)\n2A(앞뒤 두 장) → E·2A = q/ε₀ → E = q/(2ε₀A)    R→∞ (무한평면)</pre></div><div class=\"concept\"><p><b>판서 3 <code>판서_3_가우스면3종_무한평면_클로즈업.jpg</code> (13:27~17:24)</b></p></div>", "exam": []}, {"id": "p4-concept-5", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (5/28)", "html": "<div class=\"concept\"><pre>면 / 원통 / 구 그림 + 넓이 A · 2πrL · 4πr²\nEA = q/ε₀ → E = q/(ε₀A)\nE·2A = q/ε₀ → R→∞ : E = q/(2ε₀A)\n우측: 원판 결과 (q/2ε₀A)(1 − z/√(z²+R²)) → R→∞ → σ/2ε₀    ← 지난 시간 식과 연결\n(칠판 위 \"4977\" — 판독 불가 메모)</pre></div><div class=\"concept\"><p><b>판서 4 <code>판서_4_무한평면_도체_부도체_고립도체.jpg</code> (14:47~28:31)</b></p></div>", "exam": []}, {"id": "p4-concept-6", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (6/28)", "html": "<div class=\"concept\"><pre>E·A  = q/ε₀ → E = q/(ε₀A) = σ/ε₀        (한쪽 면)\nE·2A = q/ε₀ → E = (σ/2ε₀)  ← 동그라미   (양쪽, 무한평면)\n가운데 그림: +판 앞 평면 가우스면(격자), 전기력선 왼쪽으로\n도체구 Conductor      : 전기 O , 전하 O\n부도체구 nonconductor : 전기 X , 전하 (X→O 정정, 동그라미)   자유전자 → 유동속도(26장)\n맨 오른쪽: 평행판(+ | −) 사이 도체구, − 전하가 한쪽 표면에 몰린 그림(고립도체 설명), 아래 ⊣⊢ 전지 기호</pre></div>", "exam": []}, {"id": "p4-concept-7", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (7/28)", "html": "<div class=\"concept\"><p><b>판서 5·6 <code>판서_5_부도체구_전기선속_도체부도체_전경.jpg</code> · <code>판서_6_부도체구_내외부_유도_그래프.jpg</code> (31:45~37:37)</b></p></div>", "exam": []}, {"id": "p4-concept-8", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (8/28)", "html": "<div class=\"concept\"><pre>[부도체구]  그림: 반지름 R 구(전하 q 균일), 안에 반지름 r 가우스면(노란 점선), 그 안 전하 q'\nr ≥ R :  E·4πr² = q/ε₀   →  E_out = (1/4πε₀)·q/r²        ← 물결 밑줄\nr &lt; R :  E·4πr² = q'/ε₀  →  E_in  = (1/4πε₀)·q'/r² = (1/4πε₀)·(r/R³)·q   ← 물결 밑줄\n  부피전하밀도  ρ_외부 = ρ_내부   (ρ = q/V)\n  q/(4/3·πR³) = q'/(4/3·πr³)   ∴ q' = (r³/R³)·q\n그래프 E–r : 0→R 직선 증가(∝ r), R 이후 1/r² 감소</pre></div>", "exam": []}, {"id": "p4-concept-9", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (9/28)", "html": "<div class=\"concept\"><pre>우상단: electric flux(전기선속)  Φ_E ≡ ∮ E⃗·n̂ da = q_enc/ε₀     (σ/ε₀ 동그라미 = 앞 판서 무한평면 결과)\n도체구 Conductor 전기 O 전하 O / 부도체구 nonconductor 전기 X 전하 (X→O)  자유전자 → 유동속도</pre></div><div class=\"concept\"><p><b>판서 7·8 <code>판서_7_고립도체_도체구_시험대비.jpg</code>(아토 캡션 <b>\"시험대비\"</b>) · <code>판서_8_…원본.jpg</code> (25:19~31:33)</b></p></div>", "exam": []}, {"id": "p4-concept-10", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (10/28)", "html": "<div class=\"concept\"><pre>평행판 + | − 사이에 실로 매단 도체구(반지름 R): 왼쪽 표면 ⊖⊖⊖, 오른쪽 표면 ⊕⊕⊕ (전하 분리)\n아래 전지·스위치 회로 기호,  → 도체구 → 갑자기 (전기 ✗ 취소) ⇒ (고립) 도체\n\"반지름 R인 도체구가 있다\"\n  r &lt; R (도체 내부)  E = 0                         ← 밑줄\n  r ≥ R (도체 외부)  E·4πr² = q/ε₀ → E = (1/4πε₀)·q/r²   ← 동그라미</pre></div>", "exam": []}, {"id": "p4-concept-11", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (11/28)", "html": "<div class=\"concept\"><ul><li>아토가 사진에 \"시험대비\"라고 캡션을 달았다 → ⑥과 같은 판단. 도체구 내부 0 / 외부 점전하 식이 시험 기본.</li></ul></div><div class=\"concept\"><ul><li>녹음 3-1~3-7 전부 판서와 일치.</li></ul></div><div class=\"concept\"><p><b>③ 녹음본 정리 (교정 + 중요도 재구성)</b></p></div><div class=\"concept\"><p><b>3-1. 가우스 법칙 한 줄로 이해하기 (02:05~09:18) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><pre>∮ E⃗ · n̂ da = q_enc / ε₀</pre></div><div class=\"concept\"><ul><li>기호: 폐곡면(closed surface — 선이 이어져 닫힌 면이면 모양은 상관없음) · E⃗ 전기장 · da 미소면적 · <b>n̂ 미소면적 법선벡터(가장 핵심)</b> · ε₀ 진공 유전율 · q 알짜전하.</li></ul></div>", "exam": [], "scroll": true}, {"id": "p4-concept-12", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (12/28)", "html": "<div class=\"concept\"><ul><li><b>축구공 비유</b>: 내가 구 중심의 +1C. 전기력선이 N개 뻗어 나간다. 구(폐곡면)를 미소면적 da N개로 나누면 각 da마다 법선벡터 n̂이 하나씩 → <b>전기력선 하나 ↔ 법선벡터 하나, 1:1 대응</b>.</li></ul></div><div class=\"concept\"><p>&gt; \"미소면적 법선벡터 하나와 전기력선 하나는 수직해요, 평행해요? — <b>평행</b>. 이것만 답을 하면 다 해결이 돼.\" (05:52)</p></div><div class=\"concept\"><ul><li>평행 ⇒ 사이각 0° ⇒ <code>E⃗·n̂ = E·1·cos0° = E</code> (스칼라) ⇒ <code>E ∮ da = q/ε₀</code>.</li></ul></div><div class=\"concept\"><ul><li>그 폐곡면 = <b>가우스면</b>. <b>가상</b>이다(진공에 아무것도 없는데 우리가 설정한 것). 가상이지만 가우스 법칙에서는 거기에만 전기력선이 걸린다고 본다.</li></ul></div>", "exam": []}, {"id": "p4-concept-13", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (13/28)", "html": "<div class=\"concept\"><p><b>3-2. 가우스면은 딱 3개 (09:18~12:53) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li>폐곡면 적분 = 표면적 구하기. 균일하면 E를 적분 밖으로 → 표면적만 구하면 된다. 반지름 r 구는 4πr²로 쉬운데 임의 곡면은 난감 → <b>표면적을 쉽게 구할 수 있는 3개만 쓴다.</b></li></ul></div><div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>가우스면</th><th>넓이</th><th>비고</th></tr></thead><tbody><tr><td>면</td><td>A</td><td></td></tr><tr><td>원통</td><td><b>옆면만</b> 2πrl</td><td>윗면·아랫면은 가우스면으로 안 잡음</td></tr></tbody></table></div></div>", "exam": []}, {"id": "p4-concept-14", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (14/28)", "html": "<div class=\"concept\"><div class=\"tw\"><table><thead><tr><th>가우스면</th><th>넓이</th><th>비고</th></tr></thead><tbody><tr><td>구</td><td>4πr²</td><td></td></tr></tbody></table></div></div><div class=\"concept\"><p>&gt; \"4개, 5개 만들 수 있냐? 있다. 그런데 그딴 짓은 안 한다. 한 번도 본 적이 없다.\" (39:27)</p></div><div class=\"concept\"><p><b>3-3. 3종으로 지난 시간 결과 재유도 (13:27~17:24)</b></p></div><div class=\"concept\"><ul><li><b>면</b>: 전하 q 앞에 가우스면 A → <code>E·A = q/ε₀</code> → <code>E = q/(ε₀A)</code>.</li></ul></div>", "exam": []}, {"id": "p4-concept-15", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (15/28)", "html": "<div class=\"concept\"><ul><li><b>무한평면 = 원판 R→∞</b>: 지난 시간 <code>E = (σ/2ε₀)(1 − z/√(z²+R²))</code> → R→∞ → <code>σ/2ε₀ = q/(2ε₀A)</code>. 왜 2가 붙나: 전기력선이 <b>양쪽</b>으로 나가므로 가우스면을 앞뒤 두 장, 넓이 <b>2A</b> → <code>E·2A = q/ε₀</code> → <code>E = q/(2ε₀A) = σ/2ε₀</code> ✓ (원판 때는 한쪽 면만 봤던 것).</li></ul></div><div class=\"concept\"><ul><li><b>원통(직선도선)</b>: <code>E·2πrl = q/ε₀</code> → <code>E = q/(2πε₀ r l) = λ/(2πε₀ r)</code> ✓ (9/9 직선도선 결과와 일치).</li></ul></div><div class=\"concept\"><p>&gt; \"이 말이 이해가 되면 가우스 법칙 진짜 쉽게 설명이 될 텐데.\" (14:47)</p></div><div class=\"concept\"><p><b>3-4. 여기까지가 교과서, 응용은 도체구·부도체구 (19:09) <span class=\"star\">★</span></b></p></div>", "exam": []}, {"id": "p4-concept-16", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (16/28)", "html": "<div class=\"concept\"><ul><li>1학기 비유: 등가속도 운동(공식)까지가 책 내용이고 응용이 포사체·상대운동·등속원운동이었듯, 가우스 법칙까지가 책이고 <b>응용 = 도체구·부도체구</b>.</li></ul></div><div class=\"concept\"><p>&gt; \"도체구와 부도체구의 응용을 하면 <b>시험 문제는 이거에서 산수 계산하는 거에서 많이 나와요. 이 앞에서 했던 건 안 나와.</b>\" (19:09)</p></div><div class=\"concept\"><p><b>3-5. 도체 vs 부도체 (20:48~25:19) — 학생 문답, 교수가 정정</b></p></div><div class=\"concept\"><ul><li>도체(conductor)는 전기가 흐르고 부도체(nonconductor)는 안 흐른다. <b>둘 다 전하는 있다.</b> 흐르냐 안 흐르냐는 <b>자유전자(free electron) 유무</b>. (유동속도는 26장 전류 파트에서.)</li></ul></div>", "exam": []}, {"id": "p4-concept-17", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (17/28)", "html": "<div class=\"concept\"><p>&gt; \"이거 모르면 안 돼요. 계산 안 돼요.\" (22:14)</p></div><div class=\"concept\"><p><b>3-6. 도체구 = 고립도체 (25:19~31:33)</b></p></div><div class=\"concept\"><ul><li>실에 매단 도체구에 전기장을 걸면 + − 전하가 양끝으로 분리, 가운데는 비게 됨. 그 상태에서 실을 확 들어 올리거나 전기장을 갑자기 없애면 → <b>고립도체</b>(책의 \"고립도체\"가 이것).</li></ul></div><div class=\"concept\"><ul><li>결론: <b>도체의 전하는 표면에만, 내부에는 없다</b> — \"이게 제일 중요한 내용\". 문제에 \"반지름 R인 도체구\"가 나오면 바로 이 정리가 떠올라야 한다.</li></ul></div><div class=\"concept\"><ul><li>가우스면(구, 중심에서 거리 r)으로:</li></ul></div>", "exam": []}, {"id": "p4-concept-18", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (18/28)", "html": "<div class=\"concept\"><ul><li><code>r &lt; R</code> (내부): 안에 전하 없음 → <b>E = 0</b></li></ul></div><div class=\"concept\"><ul><li><code>r ≥ R</code> (외부): <code>E·4πr² = q/ε₀</code> → <b>E = q/(4πε₀r²)</b> = 점전하와 같음(중심에 시험전하 q가 있는 꼴)</li></ul></div><div class=\"concept\"><ul><li>다른 반 시험 예: \"도체구 반지름을 1/3로 줄이면 전기장은?\" → 내부 0, 외부 1/r²라 <b>9배</b>. 김민수 교수: \"그런 의미 없는 문제는 안 낸다.\"</li></ul></div><div class=\"concept\"><p><b>3-7. 부도체구 — 제일 어렵고 마지막 (31:45~36:50) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li>반지름 R, 전하 q가 <b>균일하게</b> 퍼져 있음(안에도 전하 있음 → 내부 E ≠ 0).</li></ul></div>", "exam": []}, {"id": "p4-concept-19", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (19/28)", "html": "<div class=\"concept\"><ul><li><b>외부 <code>r ≥ R</code></b>: <code>E·4πr² = q/ε₀</code> → <b>E_out = q/(4πε₀r²)</b> (도체구 외부와 같은 식).</li></ul></div><div class=\"concept\"><ul><li><b>내부 <code>r &lt; R</code></b>: 가우스면 안 전하만 q' → <code>E·4πr² = q'/ε₀</code>. 균일하니 <b>전하밀도 ρ</b>가 일정: <code>ρ = q/(4/3·πR³) = q'/(4/3·πr³)</code> → <code>q' = (r³/R³)·q</code> → <b>E_in = q·r/(4πε₀R³)</b></li></ul></div><div class=\"concept\"><ul><li>그래프(E–r): 내부는 <b>r에 비례</b>(직선), 외부는 <b>1/r²</b>로 감소, r = R에서 꺾임. (강의노트 p.11 그래프)</li></ul></div>", "exam": []}, {"id": "p4-concept-20", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (20/28)", "html": "<div class=\"concept\"><ul><li>전기 선속(electric flux) Φ = ∮E⃗·n̂ da: 전기력선이 얼마나 많이 지나가느냐 (37:28).</li></ul></div><div class=\"concept\"><p><b>3-8. 교수 요약 (38:18~40:51)</b></p></div><div class=\"concept\"><ul><li>가우스 법칙 = 전기장을 구하는 법칙 = 전하량을 구하는 것. Σ·∫ 대신 <b>대칭성</b>으로.</li></ul></div><div class=\"concept\"><ul><li>가상의 폐곡면 <b>가우스면</b>에만 전기력선이 걸린다고 보고, 법선벡터와 전기력선이 평행 → <b>가우스 법칙에서 나오는 값은 전부 스칼라</b> (\"이 말이 중요한 말이야\").</li></ul></div><div class=\"concept\"><ul><li>가우스면 3개. 무한평면은 2A.</li></ul></div>", "exam": []}, {"id": "p4-concept-21", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (21/28)", "html": "<div class=\"concept\"><ul><li>응용: 도체구 내부 0 / 외부 q/(4πε₀r²) · 부도체구 외부 q/(4πε₀r²) / 내부 qr/(4πε₀R³). \"반지름 3배 줄이면 27배\" 류 산수 문제는 안 냄.</li></ul></div><div class=\"concept\"><ul><li>가우스 법칙은 <b>25장(전기용량) 응용에서 다시 쓴다</b>. 23장 끝.</li></ul></div><div class=\"concept\"><p><b>여담 시간대 (학습 내용 아님)</b></p></div><div class=\"concept\"><ul><li>00:05~02:05 앞자리 앉으라는 잔소리 · 20:48~24:00 학생 지목 문답(도체/부도체) · 38:02 \"왜 이렇게 빨리 끝났어\" · 44:55~ 출석 정정 안내(⑦).</li></ul></div><div class=\"concept\"><p><b>④ 강의자료 정리 — 강의노트 p.10~12</b></p></div>", "exam": []}, {"id": "p4-concept-22", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (22/28)", "html": "<div class=\"concept\"><ul><li>p.10 [Part-03] 1. 전기 선속 정의 · 2. 가우스면 정의 · 3. 가우스 법칙 정의·계산 ① 원통 대칭 ② 면 대칭 → 녹음 3-1~3-3.</li></ul></div><div class=\"concept\"><ul><li>p.11 ③ 구 대칭 · ④ 부도체 — 구 외부(r&gt;a)·내부(r&lt;a) 빈칸 = 녹음 3-7의 <code>q/(4πε₀r²)</code>, <code>qr/(4πε₀a³)</code>. \"도체 구 내부 전기장은 거리에 비례하고 외부는 거리의 제곱에 반비례\" E–r 그래프.</li></ul></div>", "exam": []}, {"id": "p4-concept-23", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (23/28)", "html": "<div class=\"concept\"><ul><li>p.12 〈필수문제〉 1. 도체 구 껍질(−Q) 속 부도체 구(+2Q) 영역 I~IV 전기장·전위 · 2. 부도체 구(ρ,Q)+도체 껍질, <code>E=k·5Q/r²</code> → q_b=−Q, q_c=5Q · 3. 무한 도체 평면 σ → <code>E=σ/2ε₀</code>, 두 평면 사이 <code>−(σ/ε₀)ĵ</code>. → <b>⑥의 \"100% 시험\" 유형</b>.</li></ul></div><div class=\"concept\"><p><b>⑤ 강의자료 위 필기 업데이트 — p.10 (빨간 펜, <code>필기_강의노트_p10-11_가우스법칙.pdf</code>)</b></p></div>", "exam": []}, {"id": "p4-concept-24", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (24/28)", "html": "<div class=\"concept\"><pre>Gauss 법칙   ∮ E⃗ · n̂ da = q_enc/ε₀     (E⃗ 전기장 · n̂ 미소면적 법선벡터 · da 미소면적 · q_enc 알짜전하 · ε₀ = 8.854×10⁻¹²)\n  ↳ closed surface(폐곡면)\n[E ∮ da]                       ← E 를 적분 밖으로\nE⃗·n̂ = E·1·cos0° = E\n스케치: 면 → A · 원통 → 2πrl · 구 → 4πr²</pre></div>", "exam": []}, {"id": "p4-concept-25", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (25/28)", "html": "<div class=\"concept\"><ul><li>p.11 타이핑 메모: \"*도체구, 부도체구 계산문제 시험에 잘나온다고 하심\" — 녹음 19:09·42:24와 일치.</li></ul></div><div class=\"concept\"><p><b>① 전공 교재 파일 정리 — 23장 연습문제 사진 <code>교재_23장_연습문제_29-33_31번표시.jpg</code> (교수가 톡에 올리라 한 \"670페이지\")</b></p></div>", "exam": []}, {"id": "p4-concept-26", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (26/28)", "html": "<div class=\"concept\"><ul><li><b>31번(M) — 아토가 동그라미</b>: 반지름 <code>a = 2.00 cm</code> 속이 찬 공 + 안쪽 반지름 <code>b = 2.00a</code>, 바깥 반지름 <code>c = 2.40a</code>인 <b>도체공 껍질</b>, 중심 같음. 공의 전하 <code>q₁ = +7.00 fC</code> 균일, 껍질 알짜전하 <code>q₂ = −q₁</code>. (a) r=0 (b) r=a/2 (c) r=a (d) r=1.50a (e) r=2.30a (f) r=3.50a 에서 <b>E의 크기</b>, (g) 껍질 안쪽 표면 (h) 바깥쪽 표면의 <b>알짜전하</b>. → 녹음 42:24 \"가운데 부도체구 – 도체 껍질, 범위별 전기장 = <b>100% 시험</b>\" 유형 그 자체. 강의노트 p.12 필수문제 1·2와 같은 구조.</li></ul></div>", "exam": []}, {"id": "p4-concept-27", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (27/28)", "html": "<div class=\"concept\"><ul><li>풀이 뼈대(⑥ 참고): r&lt;a 부도체 내부 <code>E = q₁r/(4πε₀a³)</code> · a≤r&lt;b <code>E = q₁/(4πε₀r²)</code> · b≤r≤c 도체 내부 <code>E = 0</code> · r&gt;c 알짜 <code>q₁+q₂ = 0</code> → <code>E = 0</code> · 안쪽 표면 <code>−q₁</code>, 바깥 표면 <code>0</code>.</li></ul></div><div class=\"concept\"><ul><li>30번(M): 음전하 직선도선 λ = 5.0 nC/m + 반지름 1.5 cm 부도체 원통 껍질(σ) → 바깥 알짜 E = 0이 되는 σ. (원통 가우스면 2πrl 유형)</li></ul></div><div class=\"concept\"><ul><li>32번(M): 면적 0.60 m² 두 금속판 5.0 cm 간격, ±q, 사이 E = 55 N/C → |q|. (평행판 σ/ε₀ 유형)</li></ul></div>", "exam": []}, {"id": "p4-concept-28", "type": "concept", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구 (28/28)", "html": "<div class=\"concept\"><ul><li>33번(E): 한 변 3.2 mm 정사각형 평면, E = 760 N/C 균일 → 선속(그림 23.16).</li></ul></div><div class=\"one\">한 줄: 23장 가우스 법칙 전부 — 정의(∮E⃗·n̂ da = q/ε₀) → 가우스면 3종(면·원통·구) → 무한평면(원판 R→∞)·직선도선 재유도 → 응용: 도체구(고립도체) · 부도체구(내부 ∝ r, 외부 ∝ 1/r²) → 전기 선속. \"23장 끝\".</div>\n", "exam": []}, {"id": "p4-result", "type": "result", "part": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구"}, {"id": "p5-cover", "type": "cover", "part": 5, "no": "파트 5 · 9/18", "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입", "star": false}, {"id": "p5-exam-1", "type": "concept", "part": 5, "title": "시험 언급 (1/4)", "html": "", "exam": [{"level": "강조", "when": "09/18", "quote": "(12:43) 여러 점전하의 전위 V = (1/4πε₀)Σqᵢ/rᵢ — \"책에 전하 4개 그림 많이 나오지? 시험 문제 많이 나오는 놈, 내겠다는 얘기.\" (계산 문제)"}, {"level": "강조", "when": "09/18", "quote": "(17:27·27:00·29:23) 증명 3제 — 전기 쌍극자의 전위 · 직선 도선의 전위 · 원판의 전위 — 중 하나 반드시 출제, 20점, 주관식(과정을 쭉 써야 점수). 물리적 의미까지: 원판 R→∞ = 무한 평면 E = σ/2ε₀(가우스 법칙 연결)."}]}, {"id": "p5-exam-2", "type": "concept", "part": 5, "title": "시험 언급 (2/4)", "html": "", "exam": [{"level": "강조", "when": "09/18", "quote": "(19:03) 직선 도선 적분 ∫dx/√(x²+a²) 공식은 시험지에 준다."}, {"level": "강조", "when": "09/18", "quote": "(36:52) 1 μF = 10⁻⁶ F 정확히 기억."}]}, {"id": "p5-exam-3", "type": "concept", "part": 5, "title": "시험 언급 (3/4)", "html": "", "exam": [{"level": "강조", "when": "09/18", "quote": "(40:48) 중간고사 범위 27장 RC 회로까지(28장 제외). 문제는 강의노트에서 응용."}, {"level": "강조", "when": "09/18", "quote": "(40:48) \"당장 시험이면 25장만\" — 25장이 가우스 법칙·전위 계산의 종합."}]}, {"id": "p5-exam-4", "type": "concept", "part": 5, "title": "시험 언급 (4/4)", "html": "", "exam": [{"level": "강조", "when": "09/18", "quote": "(29:23) 1학기 시험도 \"제일 중요하고 기본적인 것\"만 냈다 — 유형 힌트."}]}, {"id": "p5-concept", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (1/16)", "html": "<div class=\"concept\"><p><b>② 칠판 판서 이미지 정리 — 미수신</b></p></div><div class=\"concept\"><ul><li>오늘 수업은 판서 유도가 전부(중력 → 전기 위치 에너지 → 전위 → 쌍극자 → 직선 → 원판 → 축전기). 사진이 오면 아래 ③의 식과 대조해 덧붙인다.</li></ul></div><div class=\"concept\"><p><b>③ 녹음본 정리 (교정 + 중요도 재구성)</b></p></div><div class=\"concept\"><p><b>3-1. 복습 — 중력 위치 에너지 (1학기 13장) (00:00~02:12)</b></p></div><div class=\"concept\"><ul><li>질량 M 중심에서 거리 r에 m. 힘은 중심을 향해(안쪽) <code>F = GMm/r²</code>. r에서 <b>무한대까지</b> 올리는 일: <code>W = ∫ᵣ^∞ F⃗·dr⃗ = −∫ᵣ^∞ GMm/r² dr = −GMm[−1/r]ᵣ^∞ = −GMm/r</code></li></ul></div>", "exam": []}, {"id": "p5-concept-2", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (2/16)", "html": "<div class=\"concept\"><ul><li><code>W = −ΔU = −(U_f − U_i)</code>, 무한대의 위치 에너지를 0으로 두면 <b><code>U(r) = −GMm/r</code></b>.</li></ul></div><div class=\"concept\"><ul><li>\"이탈 속도·구속 조건도 이때 했다. 2학년부터 13장 수업을 안 한다더라.\" → 전기도 <b>같은 틀</b>로 간다는 것이 오늘의 요점.</li></ul></div><div class=\"concept\"><p><b>3-2. 흐름 정리 — 왜 전위를 배우나 (02:25)</b></p></div><div class=\"concept\"><ul><li>21장 전하 → 22장 전기장 → 23장 가우스 법칙(전기장 쉽게 구하기) → <b>24장 전기 퍼텐셜</b> → 25장 축전기.</li></ul></div><div class=\"concept\"><ul><li>\"축전기(전기 용량)를 하려면 <b>반드시 전위와 전기장이 필요</b>\" — 24장은 25장의 부품.</li></ul></div>", "exam": []}, {"id": "p5-concept-3", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (3/16)", "html": "<div class=\"concept\"><p><b>3-3. 전기 위치 에너지 U(r) (02:25~06:50) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li>점전하 q 옆, 거리 r에 시험전하 q₀. 중력과 다른 점: 중력은 <b>안쪽</b>으로 당기지만 전기력(같은 부호)은 <b>바깥쪽</b>으로 민다.</li></ul></div><div class=\"concept\"><ul><li><code>F_E = (1/4πε₀)·q₀q/r²</code> (r̂ 방향), <code>dW = F⃗_E·dr⃗</code> → 스칼라로 <code>dW = (1/4πε₀)(q₀q/r²)dr</code></li></ul></div><div class=\"concept\"><ul><li>r에서 무한대까지: <code>W = (q₀q/4πε₀)∫ᵣ^∞ dr/r² = (q₀q/4πε₀)[−1/r]ᵣ^∞ = (1/4πε₀)·q₀q/r</code></li></ul></div>", "exam": []}, {"id": "p5-concept-4", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (4/16)", "html": "<div class=\"concept\"><ul><li><code>W = −ΔU = −(U_f − U_i)</code>, U(∞) = 0 → <b><code>U(r) = (1/4πε₀)·q₀q/r</code> [J]</b></li></ul></div><div class=\"concept\"><ul><li>이름: <b>정전기 에너지 = 전기 에너지 U_E</b>. \"정(靜)\" = <b>시간에 무관</b> — \"전류가 나오기 전까지 전하는 시간에 무관하다\"(계속 강조해 온 말). 나중에 자기 에너지 U_B와 합쳐 총 전자기 에너지(보존/비보존)로 다시 나옴(마지막 장).</li></ul></div><div class=\"concept\"><p><b>3-4. 전위 V(r) — 점전하의 전위 (06:50~08:41) <span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li>U를 시험전하 q₀로 나눈 것: <b><code>V(r) = U/q₀ = (1/4πε₀)·q/r</code></b></li></ul></div>", "exam": []}, {"id": "p5-concept-5", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (5/16)", "html": "<div class=\"concept\"><ul><li>단위 <b>J/C = V(볼트)</b>. \"전위 = 전압. 실질적으로는 뒤에 '차'를 붙여 <b>전위차</b>라고 하는 게 낫다.\"</li></ul></div><div class=\"concept\"><ul><li>정의는 정확히는 <code>ΔV = ΔU/q₀</code>(U_f 기준). \"수학적으로 −ΔU를 그냥 나누면 안 되지만, 하여튼 이렇게 정의한다.\"</li></ul></div><div class=\"concept\"><ul><li>이름: <b>점전하의 전위</b>. \"여섯 가지 중 한 가지 했다\"(오늘 다룰 전위 유형: 점전하·여러 점전하·쌍극자·직선 도선·원형 도선·원판).</li></ul></div><div class=\"concept\"><p><b>3-5. 여러 점전하의 전위 (12:43) <span class=\"star\">★</span><span class=\"star\">★</span></b></p></div><div class=\"concept\"><ul><li><b><code>V = (1/4πε₀) Σᵢ qᵢ/rᵢ</code></b> — <b>단위벡터 붙이면 안 된다. 방향 없는 스칼라 값.</b></li></ul></div>", "exam": []}, {"id": "p5-concept-6", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (6/16)", "html": "<div class=\"concept\"><ul><li>\"책에 전하 4개 놓고 전기 퍼텐셜(에너지) 구하라는 그림 많이 나오지? <b>이거 시험 문제 많이 나오는 놈. 내겠다는 얘기랑 똑같다.</b>\"</li></ul></div><div class=\"concept\"><p><b>3-6. 전기 쌍극자의 전위 (13:30~17:27) <span class=\"star\">★</span><span class=\"star\">★</span> 증명 후보 1</b></p></div><div class=\"concept\"><ul><li>+q, −q가 거리 d. 점 P까지 r₊, r₋. \"d는 무지무지하게 작다\" — 그런데도 <b>거리 차(r₋ − r₊)</b> 때문에 전위가 생긴다. 이 그림을 기억해야 하는 이유.</li></ul></div><div class=\"concept\"><ul><li>겹침 원리: <code>V = V₊ + V₋ = (q/4πε₀)(1/r₊ − 1/r₋) = (q/4πε₀)·(r₋ − r₊)/(r₊r₋)</code></li></ul></div>", "exam": []}, {"id": "p5-concept-7", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (7/16)", "html": "<div class=\"concept\"><ul><li><b>핵심(교수)</b>: +q에서 r₋ 선에 수선을 내리면 거리 차가 <code>d cosθ</code>가 되어야 하는데, 삼각형이 <b>이등변이라 그 자리가 정확히 수직이 아니다</b>. 그래서 근사가 필요 — \"그걸 어떻게 처리하느냐가 이 문제의 핵심\".</li></ul></div><div class=\"concept\"><ul><li>r ≫ d 근사: <code>r₊r₋ ≈ r²</code>, <code>r₋ − r₊ ≈ d cosθ</code> → <b><code>V = (1/4πε₀)·q d cosθ/r² = (1/4πε₀)·p cosθ/r²</code></b>, <code>p = qd</code> = 전기 쌍극자 모멘트.</li></ul></div>", "exam": []}, {"id": "p5-concept-8", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (8/16)", "html": "<div class=\"concept\"><ul><li>\"깔끔하게 떨어지지. 시험 문제 한 문제 해결했다. <b>증명 3개 중 하나 나온다.</b> 주관식이라 쭉쭉 써 놔야 점수 받는다. 이건 틀리면 절대 안 된다. <b>물리적 의미는 없다</b>(가우스 법칙 쪽은 물리적 의미가 있고).\"</li></ul></div><div class=\"concept\"><p><b>3-7. 직선 도선의 전위 (17:27~21:10) <span class=\"star\">★</span><span class=\"star\">★</span> 증명 후보 2</b></p></div><div class=\"concept\"><ul><li>전기장 때(22장)와 배치를 바꿈: 도선을 x축에 놓고 시험점을 <b>위쪽</b> 수직거리 a에. 도선 위 x에서 시험점까지 <code>√(x²+a²)</code>.</li></ul></div><div class=\"concept\"><ul><li><code>dV = (1/4πε₀)·dq/√(x²+a²)</code>, <code>dq = λ dx</code> → \"점전하의 전위와 똑같다. 굳이 쉽다.\"</li></ul></div>", "exam": []}, {"id": "p5-concept-9", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (9/16)", "html": "<div class=\"concept\"><ul><li><code>V = (λ/4πε₀)∫₀^L dx/√(x²+a²)</code> — 적분 공식 <code>∫dx/√(x²+a²) = ln(x + √(x²+a²))</code> <b>시험에 공식을 준다</b>(책에도 있음).</li></ul></div><div class=\"concept\"><ul><li><b><code>V = (λ/4πε₀)·ln[(L + √(L²+a²))/a]</code></b></li></ul></div><div class=\"concept\"><p><b>3-8. 원형 도선(고리)의 전위 — 교재에 없는 이유 (21:23~24:00)</b></p></div><div class=\"concept\"><ul><li>전기장 때는 좌우 성분이 상쇄되어 축 성분 하나만 남았다. 전위는 <b>스칼라</b>라 상쇄 없이 그냥 더하고, 고리 위 모든 dq에서 축 위 점까지 거리가 <b>전부 <code>√(z²+R²)</code>로 같다</b>.</li></ul></div>", "exam": []}, {"id": "p5-concept-10", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (10/16)", "html": "<div class=\"concept\"><ul><li>→ <b><code>V = (1/4πε₀)·q/√(z²+R²)</code></b> — \"점전하의 전위와 똑같다. r 제곱이 아니다(전기장과 헷갈리지 말 것).\" 그래서 교재에 따로 없다.</li></ul></div><div class=\"concept\"><p><b>3-9. 원판의 전위 (24:00~27:00) <span class=\"star\">★</span><span class=\"star\">★</span> 증명 후보 3</b></p></div><div class=\"concept\"><ul><li>반지름 R 원판, 축 위 z. 고리 조각: <code>dV = (1/4πε₀)·dq/u</code>, <code>u = √(z²+r²)</code>, <code>dq = σ dA = σ·2πr dr</code></li></ul></div><div class=\"concept\"><ul><li><code>V = (1/4πε₀)∫₀^R σ·2πr dr/√(z²+r²) = (σ/2ε₀)∫₀^R r dr/√(z²+r²)</code></li></ul></div>", "exam": []}, {"id": "p5-concept-11", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (11/16)", "html": "<div class=\"concept\"><ul><li>치환 <code>a² = z²+r²</code> → <code>a da = r dr</code>; r=0일 때 a=z, r=R일 때 a=√(z²+R²) → <code>∫ da = a</code></li></ul></div><div class=\"concept\"><ul><li><b><code>V = (σ/2ε₀)·(√(z²+R²) − z)</code></b></li></ul></div><div class=\"concept\"><ul><li><b>물리적 의미</b>(시험에 같이 쓰라): R → ∞ 무한 평면이면 전기장 <code>E = σ/2ε₀</code>(23장 가우스 법칙과 연결) — \"이 말을 알아들어야 한다. 전체 에너지·전기장 개념까지 쓰는 게 시험 문제.\"</li></ul></div><div class=\"concept\"><p><b>3-10. 24장 정리 — 시험 (27:00~30:35)</b></p></div>", "exam": []}, {"id": "p5-concept-12", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (12/16)", "html": "<div class=\"concept\"><ul><li>\"<b>세 개(쌍극자·직선 도선·원판) 중 하나가 20점짜리 문제.</b> 어떤 게 나올지는 모른다. 전부 증명하고 물리적 의미까지.\"</li></ul></div><div class=\"concept\"><ul><li>\"오늘 이론은 하나뿐 — <b>무한대로 보내서 가져온다, 그게 전위</b>. 용어를 정확히: U_E 정전기(전기) 에너지, V 전위.\"</li></ul></div><div class=\"concept\"><ul><li>\"1학기 때 낸 시험 문제도 전부 제일 중요하고 기본적인 것. 이런 게 힌트.\"</li></ul></div><div class=\"concept\"><p><b>3-11. 25장 도입 — 전기 용량·축전기 (30:35~41:44)</b></p></div>", "exam": []}, {"id": "p5-concept-13", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (13/16)", "html": "<div class=\"concept\"><ul><li>비교 구도: <b>축전기 C(전기 에너지 저장)</b> ↔ <b>유도기 L, 인덕터(자기 에너지 저장)</b>. 기호도 나란히. 축전기 전위차 <code>V_C = q/C</code>; 유도기는 전하가 없어 <code>V_L = ε_L = −L·dI/dt</code>(유도 기전력, 패러데이 법칙) — <b>기말 범위</b>.</li></ul></div><div class=\"concept\"><ul><li><b>전기 용량 <code>C = q/V_C</code></b>, 단위 C/V = <b>F(패럿)</b>. <b>\"1 μF = 10⁻⁶ F — 정확히 기억해라\"</b>(제일 중요하다고 강조).</li></ul></div><div class=\"concept\"><ul><li>축전기 전기 용량 구하는 순서: ① 전하 q는 <b>가우스 법칙</b>으로(가우스면 3종 = 면·원통·구 → <b>평행판·원통형·구형 축전기 세 가지</b>) ② 전위차는 <b><code>ΔV = −∫ᵢ^f E⃗·dr⃗</code></b></li></ul></div>", "exam": []}, {"id": "p5-concept-14", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (14/16)", "html": "<div class=\"concept\"><ul><li>유도: <code>W = ∫ᵢ^f F⃗·dr⃗ = q∫ᵢ^f E⃗·dr⃗ = −ΔU</code> → <code>ΔU/q = −∫ᵢ^f E⃗·dr⃗ = ΔV</code> (전기력 = 전하량 × 전기장).</li></ul></div><div class=\"concept\"><ul><li>\"당장 시험이면 <b>25장만 공부하면 된다</b> — 가우스 법칙도 전위 계산도 다 25장에 들어 있다.\" 다음 시간: 축전기 3종 + 유전체.</li></ul></div><div class=\"concept\"><p><b>3-12. 시험 범위·기타 (40:48~)</b></p></div><div class=\"concept\"><ul><li><b>중간고사 범위: 27장 RC 회로까지. 28장 안 본다.</b> \"27장까지 할 게 무지무지 많다.\"</li></ul></div><div class=\"concept\"><ul><li>\"시험 문제는 준 강의노트에서 조금씩 응용해서 낸다.\" 추석 연휴에 공부하라는 당부.</li></ul></div>", "exam": []}, {"id": "p5-concept-15", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (15/16)", "html": "<div class=\"concept\"><ul><li>(08:41~12:43) 교수 잡담(학생 여자친구 에피소드) — 학습 내용 아님, 제외.</li></ul></div><div class=\"concept\"><p><b>④ 강의자료 정리 — 강의노트 24장 부분 (쪽 미확인)</b></p></div><div class=\"concept\"><ul><li>오늘 유도는 강의노트 순서를 따랐다고 봄(점전하 → 여러 점전하 → 쌍극자 → 직선 → 원형(없음) → 원판). 아토 필기본 <code>_교재/강의노트_전자기학_63p_아토필기_2026-09-16.pdf</code>에서 24장 쪽을 찾아 대조 필요.</li></ul></div><div class=\"concept\"><p><b>① 전공 교재 파일 정리 — 미보유</b></p></div><div class=\"concept\"><ul><li>교수: \"원형 도선의 전위는 교재에 없다 — 왜 없는지 확인해 보자\"(21:23). 교재 대신 강의노트로 수업.</li></ul></div>", "exam": []}, {"id": "p5-concept-16", "type": "concept", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입 (16/16)", "html": "<div class=\"one\">한 줄: 24장 전기 퍼텐셜 전부 — 중력 위치 에너지 복습(13장) → 전기 위치 에너지 U(r) → 전위 V(r) → 여러 점전하 → 전기 쌍극자 전위 → 직선 도선 전위 → 원형 도선(교재에 없는 이유) → 원판 전위 → 25장 도입(전기 용량 정의·단위·축전기 3종 예고·ΔV = −∫E·dr)</div>\n", "exam": []}, {"id": "p5-result", "type": "result", "part": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입"}, {"id": "final", "type": "final"}];
const PARTS=[{"n": 1, "title": "전기장 시작", "hint": "한 줄: 이 회차 정리를 읽고 다음으로."}, {"n": 2, "title": "22장 전기장 계산 — 점전하·점전하군·쌍극자(Σ) → 직선 도선(∫)", "hint": "한 줄: 22장 전기장 계산 — 불연속 분포(Σ): ① 점전하 ② 점전하군 ③ 전기쌍극자 → 연속 분포(∫) 시작: ④ 직선 도선"}, {"n": 3, "title": "원형 도선·원판의 전기장 + 가우스 법칙 서론", "hint": "한 줄: 22장 완료(연속 전하분포 6종 마무리) → 23장 가우스 법칙 서론"}, {"n": 4, "title": "23장 가우스 법칙 — 정의·가우스면 3종·도체구·부도체구", "hint": "한 줄: 23장 가우스 법칙 전부 — 정의(∮E⃗·n̂ da = q/ε₀) → 가우스면 3종(면·원통·구) → 무한평면(원판 R→∞)·직선도선 재유도 → 응용: 도체구(고립도체) · 부도체구(내부 ∝ r, 외부 ∝ 1/r²) → 전기 선속. \"23장 끝\"."}, {"n": 5, "title": "24장 전기 퍼텐셜(전위) — 점전하·쌍극자·직선 도선·원판 + 25장 축전기 도입", "hint": "한 줄: 24장 전기 퍼텐셜 전부 — 중력 위치 에너지 복습(13장) → 전기 위치 에너지 U(r) → 전위 V(r) → 여러 점전하 → 전기 쌍극자 전위 → 직선 도선 전위 → 원형 도선(교재에 없는 이유) → 원판 전위 → 25장 도입(전기 용량 정의·단위·축전기 3종 예고·ΔV = −∫E·dr)"}];
/* 진행 저장: 지침 §0은 브라우저 저장소 금지. 저장 방식(앱 상태 vs 저장 안 함)은 아토 결정 대기라 그때까지 localStorage 유지 (2026-09-17). */
const KEY="mc-slides-"+DECK_ID;

try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&typeof s==="object") ST=Object.assign(ST,s); }catch(e){}
/* V5A-RESUME: 마지막 학습 위치 — 앱의 「이어서 학습하기」 카드가 읽는다 (아토 2026-09-21). #check(빌드 검사) 중에는 쓰지 않는다 */
const LAST_KEY="mc-slides-last";
function lastInfo(){
  const s=SLIDES[Math.max(0,Math.min(ST.idx,SLIDES.length-1))]; if(!s) return null;
  const p=s.part?PARTS.find(x=>x.n===s.part):null; const qs=SLIDES.filter(x=>x.type==="q");
  const clean=t=>String(t||"").replace(/[\s★]+$/,"");
  const where= s.type==="q"?((s.kind||"")+" 문제 · "+(s.qn||"")).trim() : s.type==="concept"?("개념 · "+clean(s.title)) : s.type==="mu"?"암기 vs 이해" : s.type==="cover"?"파트 시작" : s.type==="result"?"파트 결과" : s.type==="final"?"전체 결과" : s.type==="jump"?"시작 위치 고르기" : "표지";
  return {deck:DECK_ID,title:document.title,href:location.href.split("#")[0],idx:ST.idx,n:SLIDES.length,sid:s.id,part:s.part||null,partTitle:p?clean(p.title):"",where:where,qDone:qs.filter(q=>ST.done[q.id]).length,qN:qs.length,ts:Date.now()};
}
const save=()=>{ if(location.hash==="#check") return; /* 빌드 검사 상태는 저장하지 않는다(오타 RED 2026-09-21) */ try{ localStorage.setItem(KEY,JSON.stringify(ST)); const li=lastInfo(); if(li){ const j=JSON.stringify(li); localStorage.setItem(LAST_KEY,j); localStorage.setItem(LAST_KEY+"-"+DECK_ID,j); } }catch(e){} };
window.addEventListener("pagehide",()=>{ try{ save(); }catch(e){} });
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const partOf=n=>PARTS.find(p=>p.n===n)||null;
const num=v=>'<span class="num">'+esc(v)+'</span>';   /* UI 숫자는 정자(지침 §1) */
function partScore(p){ ST.skip=ST.skip||{}; const qs=SLIDES.filter(s=>s.type==="q"&&s.part===p&&!ST.skip[s.id]); const b=qs.filter(q=>q.kind==="기초"), a=qs.filter(q=>q.kind==="응용");
  const cnt=arr=>({n:arr.length,ok:arr.filter(q=>ST.correct[q.id]===true).length,done:arr.filter(q=>ST.done[q.id]).length});
  return {b:cnt(b),a:cnt(a)}; }
function partDone(p){ return SLIDES.filter(s=>s.part===p&&s.type!=="result").every(s=>ST.done[s.id]); }

/* ---------- 수식: KaTeX (지침 §1). 렌더 끝나기 전엔 작업 영역을 감춘다(§0 raw LaTeX 노출 금지) ---------- */
function typeset(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true},{left:"$$",right:"$$",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  }
  const cl=el.cloneNode(true); cl.querySelectorAll(".katex,.katex-display").forEach(k=>k.remove());
  const raw=/\\\(|\\\[|\\frac|\\vec|\\begin\{|\$\$/.test(cl.textContent||"");
  el.dataset.raw=raw?"1":"0";
  if(raw&&el.id==="body"){ el.dataset.ready="false"; el.innerHTML='<div class="kicker">수식 오류</div><h2>이 장의 수식이 그대로 드러나 표시를 멈췄습니다</h2><p>정리노트의 수식 표기를 고쳐 다시 만들어야 합니다.</p>'; }
  el.dataset.ready="true";
  return !raw;
}

/* ---------- 풀이 메모장 (손글씨 캔버스 · 애플펜슬) ---------- */
const PAD={tool:"pen",cv:null,ctx:null,id:null,cur:null,ro:null,dpr:1,W:0,H:0};
function padStrokes(id){ ST.ink=ST.ink||{}; if(!ST.ink[id]) ST.ink[id]={strokes:[]}; return ST.ink[id].strokes; }
function padResize(){ const cv=PAD.cv; if(!cv||!cv.isConnected) return; const r=cv.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  PAD.dpr=Math.min(3,window.devicePixelRatio||1); PAD.W=r.width; PAD.H=r.height; cv.width=Math.round(r.width*PAD.dpr); cv.height=Math.round(r.height*PAD.dpr);
  PAD.ctx=cv.getContext("2d"); PAD.ctx.setTransform(PAD.dpr,0,0,PAD.dpr,0,0); PAD.ctx.lineCap="round"; PAD.ctx.lineJoin="round"; padRedraw(); }
function padLine(ctx,t,x0,y0,x1,y1,p){ if(!ctx) return; const W=PAD.W; ctx.globalCompositeOperation=t==="e"?"destination-out":"source-over"; ctx.strokeStyle="#111111";
  ctx.lineWidth=t==="e"?W*0.03:Math.max(1.2,W*0.0035*(0.6+(p||0.5)*1.2)); ctx.beginPath(); ctx.moveTo(x0*W,y0*W); ctx.lineTo(x1*W,y1*W); ctx.stroke(); }
function padRedraw(){ const ctx=PAD.ctx; if(!ctx) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,PAD.cv.width,PAD.cv.height); ctx.restore();
  for(const st of padStrokes(PAD.id)){ const c=st.c; if(c.length<3) continue; if(c.length===3){ padLine(ctx,st.t,c[0],c[1],c[0]+0.0005,c[1],c[2]); continue; }
    for(let i=3;i<c.length;i+=3) padLine(ctx,st.t,c[i-3],c[i-2],c[i],c[i+1],c[i+2]); } }
function padPt(e){ const r=PAD.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/PAD.W*1000)/1000, Math.round((e.clientY-r.top)/PAD.W*1000)/1000, Math.round((e.pressure||0.5)*100)/100]; }
function padAllowed(e){ return e.pointerType==="pen"||e.pointerType==="mouse"||(e.pointerType==="touch"&&ST.finger); }
function mountPad(id){
  const cv=$("#pad"); if(!cv) return; PAD.cv=cv; PAD.id=id; PAD.cur=null;
  cv.onpointerdown=e=>{ if(!padAllowed(e)) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} const pt=padPt(e); PAD.cur={t:PAD.tool==="eraser"?"e":"p",c:pt.slice()}; padLine(PAD.ctx,PAD.cur.t,pt[0],pt[1],pt[0]+0.0005,pt[1],pt[2]); };
  cv.onpointermove=e=>{ if(!PAD.cur||!padAllowed(e)) return; e.preventDefault(); const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(const ev of evs){ const pt=padPt(ev), c=PAD.cur.c, n=c.length; padLine(PAD.ctx,PAD.cur.t,c[n-3],c[n-2],pt[0],pt[1],pt[2]); c.push(pt[0],pt[1],pt[2]); } };
  const end=()=>{ if(!PAD.cur) return; padStrokes(id).push(PAD.cur); PAD.cur=null; save(); };
  cv.onpointerup=end; cv.onpointercancel=end; cv.onpointerleave=e=>{ if(PAD.cur&&e.pointerType!=="pen") end(); };
  cv.oncontextmenu=e=>e.preventDefault();
  const bar=cv.previousElementSibling;
  bar.querySelectorAll("[data-tool]").forEach(b=>{ b.onclick=()=>{ PAD.tool=b.dataset.tool; bar.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b)); }; });
  bar.querySelector('[data-act="undo"]').onclick=()=>{ padStrokes(id).pop(); save(); padRedraw(); };
  bar.querySelector('[data-act="clear"]').onclick=()=>{ if(!padStrokes(id).length||confirm("이 문제의 풀이 메모를 지울까요?")){ ST.ink[id]={strokes:[]}; save(); padRedraw(); } };
  bar.querySelector('[data-act="finger"]').onclick=function(){ ST.finger=!ST.finger; save(); this.classList.toggle("on",ST.finger); };
  if(window.ResizeObserver){ PAD.ro=new ResizeObserver(()=>padResize()); PAD.ro.observe(cv); }
  setTimeout(padResize,30);
}

/* ---------- 필기 판 여닫기 (V4-PADPANEL) ---------- */
function openPad(id){ const pp=$("#padPanel"); pp.classList.add("on"); $("#padBtn").classList.add("on"); const fb=pp.querySelector('[data-act="finger"]'); if(fb) fb.classList.toggle("on",!!ST.finger); mountPad(id); const cb=pp.querySelector('[data-act="close"]'); if(cb) cb.onclick=closePad; }
function closePad(){ const pp=$("#padPanel"); if(pp) pp.classList.remove("on"); const b=$("#padBtn"); if(b) b.classList.remove("on"); if(PAD.ro){ PAD.ro.disconnect(); PAD.ro=null; } }
/* ---------- 시험 언급 상자 (지침 §3) ---------- */
function examHTML(s){
  const list=Array.isArray(s.exam)?s.exam:[]; if(!list.length) return "";
  return list.map(x=>'<aside class="exam-callout" aria-label="시험 언급"><div class="exam-label"><b>📌 시험 언급</b> · '+esc(x.level||"강조")+(x.when?' · '+esc(x.when):'')+'</div><blockquote class="exam-quote">"'+esc(x.quote||"")+'"</blockquote></aside>').join("");
}

/* ---------- 시작 위치 점프 ---------- */
function startFrom(id,mode){
  const n=SLIDES.findIndex(x=>x.id===id); if(n<0) return;
  ST.skip=ST.skip||{}; mode=mode||"skip";
  if(mode!=="at") SLIDES.forEach((x,i)=>{ if(i<n&&x.type!=="start"&&x.type!=="jump"&&!ST.done[x.id]){ ST.done[x.id]=true; if(mode==="skip") ST.skip[x.id]=true; } });
  ST.idx=n; save(); render();
}
function unskipAll(){ ST.skip=ST.skip||{}; Object.keys(ST.skip).forEach(k=>{ delete ST.done[k]; }); ST.skip={}; save(); render(); }
function jumpListHTML(){
  ST.skip=ST.skip||{};

  SLIDES.forEach((x,i)=>{
    if(x.type==="cover"){ cur={part:x.part,title:x.title,items:[]}; rows.push(cur); return; }
    if(!cur) return;
    if(x.type==="concept"||x.type==="mu"||x.type==="q"){
      const lab= x.type==="concept"?(x.title||"개념"): x.type==="mu"?"암기 vs 이해": x.qn;
      const st= ST.skip[x.id]?"skip": ST.done[x.id]?"done": (i===ST.idx?"cur":"");
      cur.items.push('<button class="jp '+st+'" data-jump="'+x.id+'">'+esc(lab)+'</button>');
    }
  });
  const nSkip=Object.keys(ST.skip).length;
  return '<div class="jump"><div class="jump-h">아는 부분은 건너뛰고 막히는 곳부터. 누른 장 앞은 전부 「건너뜀」이 되고 채점에서 빠진다.'+
    (nSkip?'<button class="btn xs" id="unskip">건너뜀 '+num(nSkip)+'장 되돌리기</button>':'')+'</div>'+
    rows.map(r=>'<div class="jump-part"><div class="jump-pt">파트 '+num(r.part)+' · '+esc(String(r.title).replace(/[\s★]+$/,""))+'</div><div class="jump-items">'+r.items.join("")+'</div></div>').join("")+'</div>';

/* ---------- 상단 진행점 (파트 안의 단계 · 시험 언급은 핑크) ---------- */

/* ---------- 힌트: 문제 장에서는 그 파트의 한 줄 요약, 개념 장에서는 없음 ---------- */

  } else if(s.type==="mu"){

    body.innerHTML=examHTML(s)+'<div class="kicker">파트 '+num(s.part)+' · 암기 vs 이해</div><h2>'+esc(String(s.title).replace(/[\s★]+$/,""))+' — 무엇을 외우고 무엇을 이해하나</h2>'+

  } else if(s.type==="q"){
    const rev=!!ST.revealed[s.id];
    ST.answer=ST.answer||{}; ST.ink=ST.ink||{}; const my=ST.answer[s.id]||"";
    const mc=Array.isArray(s.choices)&&s.choices.length>0;
    body.classList.add("q-mode"); body.classList.toggle("rev",rev);
    const choiceHTML=()=>'<div class="choices'+(rev?" rev":"")+'">'+s.choices.map((c,i)=>{ const sel=String(my)===String(i); const cls=(sel?" sel":"")+(rev?(c.ok?" ok":(sel?" bad":"")):"");

      (mc ? choiceHTML() : rev

        : '<div class="myans"><label for="myans">내 답 — 답만. 행렬은 [1 2; 3 4]처럼, 여러 개면 쉼표로</label><textarea id="myans" rows="2" placeholder="여기에 답을 쓰고 「답 확인」">'+esc(my)+'</textarea></div>')+
      (rev?'<div class="myans-note"><button class="btn xs" id="showAns">답 · 풀이 다시 보기</button></div>':'');
    if(rev){ if(ST.correct[s.id]!==true) openAns(s); /* V5A: 정답이면 풀이 판을 띄우지 않는다 (아토 2026-09-21) */ const sa=$("#showAns"); if(sa) sa.onclick=()=>openAns(s); }
    closePad(); $("#padBtn").hidden=false;
    if(mc&&!rev){
      /* V5A: 보기를 누르는 순간 제출·채점 (아토 2026-09-21 "객관식은 고르면 바로 정답으로 제출") */
      act.innerHTML='<span class="hint">보기를 누르면 바로 채점됩니다</span>';
      body.querySelectorAll(".choice").forEach(b=>{ b.onclick=()=>{ const ci=b.dataset.ci; if(ST.revealed[s.id]) return; const ok=!!(s.choices[+ci]&&s.choices[+ci].ok); ST.answer[s.id]=ci; ST.revealed[s.id]=true; ST.correct[s.id]=ok; ST.done[s.id]=true; save(); render(); }; });

      $("#retry1").onclick=()=>{ delete ST.revealed[s.id]; delete ST.done[s.id]; delete ST.correct[s.id]; delete ST.answer[s.id]; save(); render(); };

      const ta=$("#myans"), rb=$("#reveal");

      rb.onclick=()=>{ if(!ta.value.trim()){ ta.focus(); return; } ST.answer[s.id]=ta.value.trim(); ST.revealed[s.id]=true; save(); render(); };
      ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); rb.click(); } };
      setTimeout(()=>{ try{ ta.focus({preventScroll:true}); }catch(e){} },50);
    } else {
      const c=ST.correct[s.id];
      act.innerHTML='<button class="btn" id="yes">맞았어요'+(c===true?" ✓":"")+'</button><button class="btn" id="no">틀렸어요 · 다시'+(c===false?" ✓":"")+'</button>';
      $("#yes").onclick=()=>{ ST.correct[s.id]=true; ST.done[s.id]=true; save(); render(); };
      $("#no").onclick=()=>{ ST.correct[s.id]=false; ST.done[s.id]=true; save(); render(); };
    }
  } else if(s.type==="result"){
    /* V6B-RESULT: 정답·오답·안 푼 3칸 + 숫자 기준 + 틀린 문제 목록 + 주버튼 하나 (브리프 v49 r3 §3) */
    const sc=partScore(s.part);

    const wrong=qs.filter(q=>ST.correct[q.id]===false), left=qs.filter(q=>!ST.done[q.id]||ST.correct[q.id]==null&&!ST.revealed[q.id]);
    const okN=qs.filter(q=>ST.correct[q.id]===true).length;
    const passB=sc.b.n===0||sc.b.ok===sc.b.n, needA=Math.ceil(sc.a.n*2/3), passA=sc.a.n===0||sc.a.ok>=needA;
    const rule=(sc.b.n?'기초 '+sc.b.n+'문제 전부 정답':'')+(sc.b.n&&sc.a.n?' + ':'')+(sc.a.n?'응용 '+sc.a.n+'문제 중 '+needA+'문제 이상':'');

      (left.length&&!wrong.length?'<div class="rs-list"><div class="kicker">안 푼 문제</div>'+left.map(q=>'<button class="rs-q" data-go="'+q.id+'"><span class="q-kind">'+esc(q.kind||"")+'</span>'+esc(q.qn||q.id)+'</button>').join("")+'</div>':'');
    body.querySelectorAll(".rs-q").forEach(b=>{ b.onclick=()=>startFrom(b.dataset.go,"at"); });

      else if(left.length) startFrom(left[0].id,"at");
      else go(1); };
  } else if(s.type==="final"){
    const qs=SLIDES.filter(x=>x.type==="q"&&!(ST.skip||{})[x.id]); const ok=qs.filter(q=>ST.correct[q.id]===true).length, done=qs.filter(q=>ST.done[q.id]).length;
    const wrong=SLIDES.filter(x=>x.type==="q"&&ST.correct[x.id]===false);
    body.innerHTML='<div class="kicker">전체 결과</div><h1>일반물리학2 · 1~3주차 임시 정리</h1><div class="score"><div class="c"><b>'+ok+'/'+qs.length+'</b>정답 · 푼 문제 '+num(done)+'</div><div class="c"><b>'+wrong.length+'</b>틀린 문제</div></div>'+
      '<p>'+(wrong.length?'틀린 문제: '+wrong.slice(0,6).map(w=>esc(w.qn)).join(", ")+(wrong.length>6?' 외 '+num(wrong.length-6)+'개':''):'틀린 문제가 없습니다.')+'</p>';
    act.innerHTML='<button class="btn xs" id="retry"'+(wrong.length?"":" disabled")+'>틀린 문제만 다시</button><button class="btn xs" id="first">처음으로</button>';
    $("#retry").onclick=()=>{ if(!wrong.length) return; wrong.forEach(q=>{ delete ST.revealed[q.id]; delete ST.done[q.id]; delete ST.correct[q.id]; }); ST.idx=SLIDES.indexOf(wrong[0]); save(); render(); };
    $("#first").onclick=()=>{ ST.idx=0; save(); render(); };
    ST.done[s.id]=true; save();
  }
  renderSrc(s);
  const h=hintFor(s); const hb=$("#hintBtn"); hb.disabled=!h; hb.title=h?"":"이 장에는 힌트가 없습니다";
  const nxt=$("#next"), prv=$("#prev");

  nxt.disabled=!unlocked; nxt.classList.toggle("undone",!ST.done[s.id]&&unlocked); prv.disabled=(i===0);

}
function go(d){ const n=ST.idx+d; if(n<0||n>=SLIDES.length) return; ST.idx=n; save(); render(); }
$("#next").onclick=()=>go(1); $("#prev").onclick=()=>go(-1);
$("#padBtn").onclick=()=>{ const s=SLIDES[ST.idx]; if(s.type!=="q") return; if($("#padPanel").classList.contains("on")) closePad(); else openPad(s.id); };
$("#hintBtn").onclick=()=>{ const s=SLIDES[ST.idx], h=hintFor(s); if(!h) return; const hb=$("#hintBox"); if(!hb.hidden){ hb.hidden=true; return; } hb.innerHTML='<div class="kicker">힌트 · 파트 '+num(s.part)+' 한 줄</div><div>'+esc(h)+'</div>'; hb.hidden=false; typeset(hb); };
document.addEventListener("keydown",e=>{ const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||(t&&t.isContentEditable)) return; if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); });

/* ---------- 검사 모드 (#check): 전 장을 돌며 오버플로·raw LaTeX를 잰다. 빌드 뒤 헤드리스로 캡처해 확인한다 ---------- */
async function runCheck(){
  try{ await document.fonts.ready; }catch(e){}
  const body=$("#body"); const fails=[]; const saved=JSON.stringify(ST);
  const foot=$("#foot"), stage=$("#stage");
  const measure=(tag)=>{ const over=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(body.scrollHeight>body.clientHeight||body.scrollWidth>body.clientWidth); const fo=SLIDES[ST.idx].type!=="jump"&&!SLIDES[ST.idx].scroll&&(foot.scrollWidth>foot.clientWidth||stage.scrollHeight>stage.clientHeight); const raw=body.dataset.raw==="1"; if(over||fo||raw) fails.push(SLIDES[ST.idx].id+tag+(over?" 넘침 "+body.scrollHeight+">"+body.clientHeight:"")+(fo?" 하단/무대 넘침":"")+(raw?" rawLaTeX":"")); };
  for(let i=0;i<SLIDES.length;i++){
    const s=SLIDES[i];
    ST.idx=i; delete ST.revealed[s.id]; render(); await new Promise(r=>setTimeout(r,20)); measure("");
    if(s.type==="q"){ /* 답 공개 상태 */ ST.revealed[s.id]=true; ST.answer[s.id]=Array.isArray(s.choices)&&s.choices.length?"0":"x"; ST.correct[s.id]=false; render(); await new Promise(r=>setTimeout(r,20)); measure(" [답공개]"); { const al=$("#anslb"); if(al&&al.classList.contains("on")){ const a=al.querySelector(".ans"); if(a&&(a.scrollHeight>a.clientHeight||al.scrollHeight>al.clientHeight)) fails.push(s.id+" [풀이판] 넘침 "+a.scrollHeight+">"+a.clientHeight); al.classList.remove("on"); } }
      /* 힌트 열림 */ $("#hintBtn").click(); await new Promise(r=>setTimeout(r,20)); const hb=$("#hintBox"); if(!hb.hidden&&hb.getBoundingClientRect().top<body.getBoundingClientRect().top) fails.push(s.id+" [힌트] 상단 침범"); hb.hidden=true; }
  }
  try{ ST=JSON.parse(saved); }catch(e){}
  const c=$("#chk"); c.style.display="block";
  c.innerHTML='<h2 id="chkTitle">검사: '+SLIDES.length+'장 · 실패 '+fails.length+'</h2><pre id="chkList">'+esc(fails.join("\n"))+'</pre>';
  window.CHECK_RESULT={n:SLIDES.length,fails};
}
/* V5B-CTX: 학습 질문 패널용 문맥 (아토 2026-09-21). 앱이 gen 을 주기 전엔 보내지 않는다 — 이전 창의 늦은 메시지를 앱이 gen 으로 걸러낸다 */
let CTX_GEN=null;
const ctxPlain=(h,n)=>{ const t=String(h||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim(); return t.length>n?t.slice(0,n)+"…(잘림)":t; };
function postCtx(){
  try{
    if(location.hash==="#check"||!CTX_GEN||window.parent===window) return;
    const s=SLIDES[Math.max(0,Math.min(ST.idx,SLIDES.length-1))]; if(!s) return;
    const p=s.part?PARTS.find(x=>x.n===s.part):null; const li=lastInfo()||{};
    const msg={type:"mc-slide",v:1,gen:CTX_GEN,deck:DECK_ID,title:String(document.title).slice(0,80),sid:s.id,stype:s.type,part:s.part||null,
      partTitle:p?String(p.title).replace(/[\s★]+$/,"").slice(0,60):"",label:String(li.where||"").slice(0,80),q:null};
    if(s.type==="q"){
      const rev=!!ST.revealed[s.id], mc=Array.isArray(s.choices)&&s.choices.length>0, my=(ST.answer||{})[s.id];
      msg.q={qn:String(s.qn||"").slice(0,80),kind:String(s.kind||"").slice(0,10),text:ctxPlain(s.html,600),
        choices:mc?s.choices.slice(0,6).map(c=>ctxPlain(c.html,120)):[],
        my: my==null||my===""?null:(mc?(s.choices[+my]?ctxPlain(s.choices[+my].html,120):null):String(my).slice(0,200)),
        revealed:rev, correct: rev&&typeof ST.correct[s.id]==="boolean"?ST.correct[s.id]:null,
        answer: rev&&mc?(s.choices.map((c,i)=>c.ok?i+1:0).filter(Boolean).join(",")||null):null};
    } else if(s.type==="concept"||s.type==="mu"){ msg.q={qn:String(s.title||"").slice(0,80),kind:s.type==="mu"?"암기·이해":"개념",text:ctxPlain(s.type==="mu"?[].concat(s.mem||[],s.und||[]).join(" · "):s.html,600),choices:[],my:null,revealed:true,correct:null,answer:null}; }
    window.parent.postMessage(msg, location.origin);
  }catch(e){}
}
window.addEventListener("message",e=>{ if(e.origin!==location.origin||e.source!==window.parent) return; const d=e.data; if(d&&d.type==="mc-ctx?"&&typeof d.gen==="string"&&d.gen.length<64){ CTX_GEN=d.gen; postCtx(); } });
const _renderV5b=render; render=function(){ _renderV5b(); postCtx(); };
function boot(){
  { const m=/^#(from|done|at)=([\w-]+)(?:,pad)?$/.exec(location.hash||""); if(m){ startFrom(m[2], m[1]==="from"?"skip":m[1]); if(/,pad$/.test(location.hash)) setTimeout(()=>$("#padBtn").click(),300); return; } }
  if(location.hash==="#check"){ runCheck(); return; }
  if(location.hash==="#resume"){ render(); save(); return; }   /* V5A: 저장된 위치 그대로 */
  render();
  if(location.hash==="#src"){ setTimeout(()=>{ const b=$("#srcs .src-th"); if(b) b.click(); },400); }
}
function fontCheck(){ try{ const ok=document.fonts.check("22px 'Gowun Dodum'"); if(ok){ const w0=$("#fontWarn"); if(w0) w0.hidden=true; return; } setTimeout(fontCheck,3000); /* V6B: 늦게 로드되면 경고를 지운다 */ if(!ok){ let w=$("#fontWarn"); if(!w){ w=document.createElement("div"); w.id="fontWarn"; $("#stage").appendChild(w); } w.hidden=false; w.textContent="손글씨 글꼴을 불러오지 못해 대체 글꼴로 보입니다. 인터넷 연결을 확인하고 새로 고침하세요."; } }catch(e){} }
function whenReady(){ if(window.renderMathInElement){ fontCheck(); boot(); } else setTimeout(whenReady,40); }
document.addEventListener("DOMContentLoaded",()=>{ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(whenReady,whenReady); });
</script>
