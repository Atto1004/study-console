<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미분적분학2 · 중간고사 대비 2 (12.4 외적 계산 · 12.5 직선과 평면 · 12.6 기둥면 · 13.1~13.2 벡터함수)</title>
<!-- 학습게임 지침(학습게임_미적분2.md) v4 템플릿 · 오타 디자인 검토(2026-09-17, RED 14건) 반영
     폰트 2종: 본문 손글씨(Nanum Pen Script, display=block) + 수식·숫자 정자(KaTeX). 5색 고정. 16:10. 상단 진행점·챕터명·n/N, 하단 [힌트] [확인/다음]. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 5색 고정 (지침 §2) */
  --memory:#FFE45C; --caution:#E03131; --concept:#1971C2; --exam:#FF4D8D; --example:#2F9E44;
  /* 무채색 — 종이·글자·선 (의미색 아님) */
  --paper:#FFFFFF; --ink:#111111; --muted:#5F5F5F; --line:#D8D8D8; --soft:#F5F5F5; --bg:#EDEDED;
  /* 폰트 2종 (지침 §1) */
  --font-hand:'Nanum Pen Script','NanumPen',sans-serif;
  --font-num:'KaTeX_Main','Times New Roman',serif;
  /* 글자 크기 3단계 (지침 §1) */
  --fs-title:31px; --fs-body:22px; --fs-note:17px;
}
*{box-sizing:border-box}
:where(h1,h2,h3,h4,p,ul,ol,li,dl,dt,dd,pre,blockquote,figure,figcaption,table,th,td,button,input,textarea,label){margin:0;padding:0;text-indent:0;word-break:keep-all;overflow-wrap:break-word}
html,body{height:100%;width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-hand);font-size:var(--fs-body);line-height:1.45;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
body{display:grid;place-items:center;padding:12px}
.katex{font-size:1em}
#stage{position:relative;width:min(calc(100vw - 24px),calc((100dvh - 24px) * 1.6));aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
/* 상단: 진행점 · 챕터명 · n/N */
#top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) auto;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:var(--fs-note)}
#progress{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.dot{flex:0 0 12px;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.dot.done{background:var(--ink)}
.dot.exam{border-color:var(--exam);background:var(--exam)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
#chapter{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pos{font-family:var(--font-num);white-space:nowrap}
/* 작업 영역 */
#body{min-height:0;overflow:hidden;padding:18px 24px 12px;font-size:var(--fs-body);line-height:1.45}
#body[data-ready="false"]{visibility:hidden}
#body.scrollable{overflow:auto}   /* 시작 위치 장만 — 학습 내용이 아니라 목록이라 스크롤 허용 */
#body h1,#body h2{font-size:var(--fs-title);line-height:1.2;margin-bottom:8px}
#body h3{font-size:var(--fs-body)}
.num{font-family:var(--font-num)}
#fontWarn{position:absolute;left:22px;right:22px;top:58px;border:2px solid var(--caution);background:var(--paper);padding:6px 12px;font-size:var(--fs-note);z-index:12}
#fontWarn[hidden]{display:none}
#body .kicker{font-size:var(--fs-note);color:var(--muted)}
#body p,#body li{margin:0}
#body p+p{margin-top:6px}
#body ul,#body ol{padding-left:22px}
#body :is(.why,.concept,.one,.say,.extra),.ans,.myans-show,.mu>div{margin:8px 0 0;padding:10px 14px}
#body .why,#body .concept{border:2px solid var(--concept)}
#body .say{border-left:4px solid var(--concept);background:var(--soft)}
#body .say b{color:var(--concept)}
#body .one{border-left:4px solid var(--ink);background:var(--soft)}
#body .term{color:var(--concept);border-bottom:1px dashed var(--concept)}
#body .hl{background:var(--memory);padding:0 4px}
#body .red{color:var(--caution)}
#body .star{color:var(--exam)}
#body .tw{overflow:hidden;margin:8px 0 0;border:1px solid var(--line)}
#body table{border-collapse:collapse;width:100%;font-size:var(--fs-body)}
#body th,#body td{padding:3px 10px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
#body thead th{border-top:0;font-size:var(--fs-note);color:var(--muted)}
#body pre{white-space:pre-wrap;font-family:var(--font-num);font-size:var(--fs-note);line-height:1.35}
#body code{font-family:var(--font-num)}
/* 시험 언급 — 최우선 (지침 §3) */
.exam-callout{border:4px solid var(--exam);padding:10px 14px;margin:0 0 10px;background:var(--paper)}
.exam-label{font-size:var(--fs-note);color:var(--exam)}
.exam-label b{color:var(--ink)}
.exam-quote{font-size:var(--fs-body)}
/* 표지·결과 */
.cover .big{font-size:var(--fs-title);line-height:1.2;margin:6px 0 10px}
.cover .sub{font-size:var(--fs-body)}
.score{display:flex;gap:14px;margin:10px 0}
.score .c{border:2px solid var(--ink);padding:10px 16px}
.score .c b{display:block;font-family:var(--font-num);font-size:var(--fs-title)}
/* 암기 vs 이해 */
.mu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mu>div{min-width:0}
.mu-mem{background:var(--memory);border:2px solid var(--memory)}
.mu-und{border:2px solid var(--concept)}
.mu-h{margin-bottom:4px}.mu-h .hint{font-size:var(--fs-note);color:var(--muted);margin-left:6px}
.mu li{margin:2px 0}
/* 문제 */
.q-kind{display:inline-block;font-size:var(--fs-note);border:1px solid var(--ink);padding:0 8px;margin-right:8px;vertical-align:middle}
#body.q-mode{display:flex;flex-direction:column}
#body.q-mode>*{flex:0 0 auto}
.pad{flex:1 1 auto!important;min-height:100px;display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);overflow:hidden;background:var(--paper)}
.pad-bar{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:var(--fs-note);background:var(--soft);flex-wrap:wrap}
.pad-bar .hint{color:var(--muted);margin-right:auto}
.pad-bar button{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 12px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.pad-bar button.on{background:var(--ink);color:var(--paper)}
.pad canvas{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:24px 24px}
/* V4-PADPANEL 필기 판 — 「+ 필기」로 여닫음, 문제 아래쪽을 덮는다 */
#padPanel{position:absolute;left:24px;right:24px;top:38%;bottom:72px;background:var(--paper);border:2px solid var(--ink);display:none;flex-direction:column;z-index:16}
#padPanel.on{display:flex}
#padPanel .pad{flex:1 1 auto;margin:0;border:0;min-height:0}
#padBtn.on{background:var(--ink);color:var(--paper)}
/* V4-ANSLB 답·풀이 판 — 작업 영역 전체 */
#anslb{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);display:none;flex-direction:column;z-index:18;padding:14px 24px;overflow:hidden}
#anslb.on{display:flex}
#anslb .ans{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:8px}
#anslb .ans-top{display:flex;align-items:center;gap:10px}
#anslb .ans-top .kicker{margin-right:auto}
.myans{margin-top:8px}.myans label{display:block;font-size:var(--fs-note);color:var(--muted)}
.myans textarea{width:100%;font-family:var(--font-num);font-size:var(--fs-body);line-height:1.35;padding:6px 12px;border:2px solid var(--ink);background:var(--paper);resize:none;outline:none}
.myans textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.myans-show{border:2px dashed var(--ink)}
.myans-txt{font-family:var(--font-num);white-space:pre-wrap}
.ans{border:2px solid var(--example)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;font:inherit;font-size:var(--fs-body);padding:6px 12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:48px}
.choice .cn{flex:0 0 28px;height:28px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:var(--fs-note)}
.choice .ct{min-width:0}
.choice.sel{border-color:var(--ink);border-width:3px}
.choice.ok{border-color:var(--example)}.choice.ok .cn{background:var(--example);border-color:var(--example);color:var(--paper)}
.choice.bad{border-color:var(--caution)}.choice.bad .cn{background:var(--caution);border-color:var(--caution);color:var(--paper)}
.choice[disabled]{cursor:default}
.verdict{padding:6px 14px;border:2px solid var(--ink)}.verdict.ok{border-color:var(--example)}.verdict.bad{border-color:var(--caution);color:var(--caution)}
/* 시작 위치 */
.jump-h{font-size:var(--fs-note);color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jump-part{display:flex;gap:10px;align-items:flex-start;margin:2px 0}
.jump-pt{flex:0 0 220px;font-size:var(--fs-note);padding-top:6px}
.jump-items{display:flex;flex-wrap:wrap;gap:4px}
.jp{font:inherit;font-size:var(--fs-note);min-height:36px;padding:2px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.jp.done{background:var(--ink);color:var(--paper)}.jp.skip{color:var(--muted);text-decoration:line-through;border-color:var(--line)}.jp.cur{border:3px solid var(--ink)}
/* 하단: [이전] [힌트] · 출처 · 동작 · [확인/다음] */
#foot{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:var(--fs-body);min-height:48px;padding:4px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.xs{font-size:var(--fs-note);min-height:36px;padding:2px 12px}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#act{display:flex;gap:8px;align-items:center;margin-left:auto}#act .hint{font-size:var(--fs-note);color:var(--muted)}
#next{margin-left:8px}
#next.undone{background:var(--paper);color:var(--ink);border-style:dashed}
#doneTag{font-size:var(--fs-note);color:var(--muted)}
/* 출처 썸네일 · 확대 */
#srcs{display:flex;gap:6px}
.src-th{position:relative;width:48px;height:48px;padding:0;border:2px solid var(--ink);overflow:hidden;background:var(--paper);cursor:pointer;flex:0 0 auto}
.src-th img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.src-th .src-n{position:absolute;right:0;bottom:0;font-family:var(--font-num);font-size:var(--fs-note);background:var(--ink);color:var(--paper);padding:0 4px}
#srclb{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:20;padding:12px 18px}
#srclb.on{display:flex}
.src-top{display:flex;align-items:center;gap:10px;font-size:var(--fs-note);padding-bottom:8px}.src-top b{color:var(--ink)}.src-top .src-pos{margin-left:auto;font-family:var(--font-num)}
.src-x{font:inherit;font-size:var(--fs-body);min-width:48px;min-height:44px;border:2px solid var(--ink);background:var(--paper);cursor:pointer}
.src-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);touch-action:pan-x pan-y pinch-zoom}
.src-body img{width:100%;height:auto;display:block;cursor:zoom-in}
.src-body img.zoom{width:190%;max-width:none;cursor:zoom-out}
.src-foot{display:flex;align-items:center;gap:10px;padding-top:8px}.src-foot .hint{margin:0 auto;font-size:var(--fs-note);color:var(--muted)}
/* 힌트 상자 */
#hintBox{position:absolute;left:22px;right:22px;bottom:76px;background:var(--paper);border:2px solid var(--ink);padding:10px 14px;z-index:15}
#hintBox[hidden]{display:none}
/* 검사 모드 표시 */
#chk{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--paper);overflow:auto;padding:20px;z-index:30;font-size:var(--fs-note);display:none}

/* ===== V6 UI — 조작부 재설계 (아토 2026-09-21). 본문(손글씨·5색)은 그대로, 조작부만 정자·평면 ===== */
:root{--ui:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;--accent:#4F9A35;--accent-soft:#EAF4E6;--bad:#D23B3B;--bad-soft:#FBEAEA;--line:#E3E8E5;--soft:#F4F6F5;--bg:#EEF1EF;--muted:#6B7570;--ink-3:#8A9490}
body{background:var(--bg)}
#stage{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
/* 상단: 분절 진행 막대 + 정자 라벨 */
#top{padding:12px 20px;gap:14px;font-family:var(--ui);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:#fff}
#progress{gap:3px;flex-wrap:nowrap;overflow:hidden}
.dot{flex:1 1 0;width:auto;min-width:6px;max-width:28px;height:6px;border:0;border-radius:3px;background:var(--line)}
.dot.done{background:var(--accent)}.dot.cur{background:#B7DBA8;outline:0;box-shadow:inset 0 0 0 1px var(--accent)}.dot.exam{background:#FFC2D8}.dot.exam.done{background:var(--exam)}
#chapter{font-family:var(--ui);font-size:13px;font-weight:600;color:#1F2A24}
#pos{font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
/* 본문 상자: 두꺼운 파란 테두리 → 좌측 바 */
#body .why,#body .concept{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
#body .one{border-radius:0 10px 10px 0}#body .say{border-radius:0 10px 10px 0}
#body .tw{border-radius:10px}
.mu-mem{border:0;border-left:3px solid #E5C400;background:#FFF9D6;border-radius:0 10px 10px 0}.mu-und{border:0;border-left:3px solid var(--concept);background:#F5F8FD;border-radius:0 10px 10px 0}
.q-kind{font-family:var(--ui);font-size:12px;font-weight:600;border:0;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
#body .kicker{font-family:var(--ui);font-size:12px;letter-spacing:0;color:var(--ink-3)}
/* 보기 카드 */
.choices{gap:10px;margin-top:12px}
.choice{font-family:var(--font-hand);border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;min-height:56px;transition:border-color .12s,background .12s}
.choice:hover{border-color:#B9C4BE;background:var(--soft)}
.choice .cn{flex:0 0 28px;width:28px;height:28px;border:0;border-radius:50%;background:var(--soft);color:#1F2A24;font-family:var(--ui);font-size:13px;font-weight:600}
.choice.sel{border:2px solid var(--accent);padding:11px 13px}.choice.sel .cn{background:var(--accent);color:#fff}
.choice.ok{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}.choice.ok .cn{background:var(--accent);color:#fff}
.choice.bad{border:2px solid var(--bad);background:var(--bad-soft);padding:11px 13px}.choice.bad .cn{background:var(--bad);color:#fff}
.choice[disabled]:not(.ok):not(.bad){opacity:.55}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 주관식 */
.myans label{font-family:var(--ui);font-size:12px;color:var(--muted)}
.myans textarea{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--ui);font-size:16px;background:#fff}
.myans textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.myans-show{border:1px dashed #B9C4BE;border-radius:12px;background:var(--soft)}
.myans-txt{font-family:var(--ui);font-size:16px}
.myans-note{margin-top:8px}
/* 판정·안내 */
.verdict{font-family:var(--ui);font-size:13px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:var(--soft);color:#1F2A24}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}
#act .hint{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
#doneTag{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
/* 하단 바 · 버튼 */
#foot{padding:10px 16px;gap:8px;border-top:1px solid var(--line);background:#fff}
.btn{font-family:var(--ui);font-size:14px;font-weight:600;min-height:40px;padding:6px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1F2A24;box-shadow:none}
.btn:hover{background:var(--soft)}
.btn.xs{font-size:13px;min-height:36px;padding:4px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
#next{min-width:96px}
#next.undone{background:#fff;color:var(--accent);border:1px solid var(--accent);border-style:solid}
.btn[disabled]{opacity:.35}
.btn:focus-visible,.choice:focus-visible,.jp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#padBtn.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
/* 출처 썸네일 */
#srcs{gap:6px}
.src-th{width:40px;height:40px;border:1px solid var(--line);border-radius:8px}
.src-th .src-n{font-family:var(--ui);font-size:11px;padding:0 5px;border-radius:6px 0 6px 0}
.src-x{font-family:var(--ui);font-size:14px;border:1px solid var(--line);border-radius:10px;min-height:40px}
.src-top{font-family:var(--ui);font-size:13px}.src-body{border-radius:12px}
.src-foot .hint{font-family:var(--ui);font-size:12px}
/* 힌트 · 필기 · 풀이 판 · 글꼴 경고 */
#hintBox{border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
#padPanel{border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);bottom:70px}
.pad-bar{font-family:var(--ui);font-size:12px;padding:6px 10px;background:var(--soft);border-radius:14px 14px 0 0}
.pad-bar button{font-family:var(--ui);font-size:12px;font-weight:600;min-height:32px;padding:2px 10px;border:1px solid var(--line);border-radius:8px}
.pad-bar button.on{background:#1F2A24;border-color:#1F2A24;color:#fff}
#anslb{padding:16px 24px}
#anslb .ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
.ans{border:0;border-left:3px solid var(--example);background:#F3F9F2;border-radius:0 10px 10px 0}
#anslb .ans-top .kicker{font-family:var(--ui);font-size:12px}

:root{--gl:rgba(255,255,255,.60);--gl-2:rgba(255,255,255,.42);--gl-3:rgba(255,255,255,.82);--gl-line:rgba(255,255,255,.80);--gl-hi:inset 0 1px 0 rgba(255,255,255,.85);--gl-blur:blur(18px) saturate(140%);--line:rgba(17,17,17,.14);--soft:rgba(255,255,255,.40)}

<body>
<div id="stage">
  <header id="top"><div id="progress" aria-label="학습 진행"></div><span id="chapter"></span><span id="pos"></span></header>
  <main id="body" data-ready="false"></main>
  <footer id="foot">

    <button class="btn xs" id="hintBtn">힌트</button>

  <div id="padPanel"><div class="pad"><div class="pad-bar"><span>풀이 메모장</span><button data-tool="pen" class="on">펜</button><button data-tool="eraser">지우개</button><button data-act="undo">되돌리기</button><button data-act="clear">지우기</button><button data-act="finger">손가락도</button><button data-act="close">닫기</button></div><canvas id="pad"></canvas></div></div>
  <div id="chk"></div>
</div>
<script>/* 김주영 스앵님 판정 (대표님 2026-09-29 「개념 마인드맵은 스앵님이 학습을 통해 내가 뭘 알고 뭘 모르는지 알아서 파악」) — 원본은 이 파일 하나.
   빌더가 교실·수업 노트·학습 덱·암기노트 페이지에 그대로 넣고(__JUDGE__), learn.html 은 patch_learn_judge.py 가 TJ-START~TJ-END 사이를 이 파일로 갈아 끼운다.
   기록 = localStorage atto.evidence [{t, k, n:[노드], ok, v, lid, sid, qid, a, clean}] (최대 4000건 — 넘치면 읽기·질문 기록부터 버리고 노드마다 최근 문제 6건은 남긴다)
     k: quiz(ok) 확인 문제 · read(clean) 챕터·섹션 끝(다시 설명·질문 없이 끝났으면 clean) · again 다시 설명 · ask 질문 · memo(ok) 암기노트 외움 · self(v) 카드 자가평가
     a: 같은 시도 표시(카드 「다시 저장」) — 같은 a·qid 는 새 기록으로 바꿔 넣는다(정답 수가 늘지 않는다)
   판정 = 노드마다 atto.mastery[id] = {quiz:{correct,total,ts}, self, sts, ts, score, state, auto} — learn.html 은 TJ.score 로 같은 식을 쓴다.
     quiz = 최근 6번 · self(설명할 수 있나 1~5) = 읽음 4 · 다시 설명·질문 2번 이상이면 3 · 외움 +1 · 카드 자가평가가 더 최근이면 그 값
     → 문제 없이 읽기만 하면 최대 「흔들림」, 「안다」는 문제로만. 점수식 = (0.5·정답률·감쇠(quiz.ts) + 0.2·self/5·감쇠(sts))/0.7, 문제 없으면 self/5·0.6·감쇠(sts)
     감쇠 = 60일에 걸쳐 1 → 0.4 (최저 0.4). 정답 근거와 읽기·암기 근거를 따로 감쇠한다 — 오늘 암기 체크 하나로 90일 전 정답이 새것처럼 되지 않게(오타 .91 설계 검수 ⑦)
   저장이 막히면(용량·사생활 모드) 이 페이지 안에서는 메모리 사본으로 이어 가고 rec 은 false 를 돌려준다. */
(function(g){
  var EK="atto.evidence", MK="atto.mastery", CAP=4000, KEEPQ=6, MEM={}, DIRTY={};
  function rd(k,d){ if(DIRTY[k]) return MEM[k]; try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return v==null?d:v; }catch(e){ return DIRTY[k]?MEM[k]:d; } }
  function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); DIRTY[k]=false; return true; }catch(e){ MEM[k]=v; DIRTY[k]=true; return false; } }
  function decay(ts){ if(!ts) return 1; var d=Math.max(0,(Date.now()/1000-ts)/86400); return Math.max(.4,1-d/60); }
  function score(e){ if(!e||typeof e!=="object") return {score:0,state:"unrated"};
    var q=e.quiz||{}, tot=+q.total||0, cor=+q.correct||0, sv=e.self==null?null:Math.max(1,Math.min(5,+e.self));
    if(tot<=0&&sv==null) return {score:0,state:"unrated"};
    var dq=decay(+q.ts||+e.ts||0), ds=decay(+e.sts||+e.ts||0);
    var raw=tot>0?(0.5*(cor/tot)*dq+0.2*((sv||0)/5)*ds)/0.7:(sv/5)*0.6*ds, s=Math.min(1,raw), st;
    if(tot<=0) st=(sv>=4&&s>=.4)?"shaky":"unknown"; else st=s>=.7?"known":s>=.4?"shaky":"unknown";
    return {score:Math.round(s*1000)/1000,state:st}; }
  function why(evs){ var qz=evs.filter(function(e){return e.k==="quiz";}).slice(-KEEPQ), r={q:qz.length,c:qz.filter(function(e){return e.ok;}).length,
      read:evs.filter(function(e){return e.k==="read";}).length, clean:evs.filter(function(e){return e.k==="read"&&e.clean;}).length,
      conf:evs.filter(function(e){return (e.k==="again"||e.k==="ask")&&Date.now()-e.t<21*864e5;}).length,
      memo:null, self:null, last:0, selfLast:0};
    evs.forEach(function(e){ if(e.k==="memo") r.memo=!!e.ok; if(e.k==="self") r.self={v:+e.v,t:e.t}; if(e.t>r.last) r.last=e.t; if(e.k!=="quiz"&&e.t>r.selfLast) r.selfLast=e.t; });
    return r; }
  function judgeOne(id,L,M){ var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); if(!evs.length) return;
    var r=why(evs), e=Object.assign({},M[id]||{}), qz=evs.filter(function(x){return x.k==="quiz";}).slice(-KEEPQ);
    var self=null; if(r.read||r.conf||r.memo!=null){ self=r.read?4:3; if(r.conf>=2) self=3; if(r.memo) self=Math.min(5,self+1); }
    var autoLast=0; evs.forEach(function(x){ if(x.k!=="self"&&x.t>autoLast) autoLast=x.t; });
    if(r.self&&r.self.t>=autoLast) self=r.self.v;
    e.quiz=qz.length?{correct:r.c,total:qz.length,ts:Math.round(qz[qz.length-1].t/1000)}:undefined; if(!e.quiz) delete e.quiz;
    e.self=self; if(self==null){ delete e.self; delete e.sts; } else e.sts=Math.round(r.selfLast/1000);
    e.ts=Math.round(r.last/1000); e.auto={by:"tutor",q:r.q,c:r.c,read:r.read,clean:r.clean,conf:r.conf,memo:r.memo};
    var s=score(e); e.score=s.score; e.state=s.state; M[id]=e; }
  function judge(ids){ var L=rd(EK,[]), M=rd(MK,{}); if(!Array.isArray(L)) L=[]; if(!M||typeof M!=="object") M={}; (ids||[]).forEach(function(id){ judgeOne(id,L,M); });
    wr(MK,M); return M; }
  function all(){ var L=rd(EK,[]), o={}; if(Array.isArray(L)) L.forEach(function(e){ (e&&e.n||[]).forEach(function(i){ o[i]=1; }); }); return judge(Object.keys(o)); }
  /* 상한 넘침: 노드마다 최근 문제 KEEPQ 건은 지키고, 나머지(읽기·질문·오래된 문제)에서 오래된 것부터 버린다 — 다른 노드 활동으로 정답 기록이 사라지지 않게 */
  function trim(L,cap){ cap=cap||CAP; if(L.length<=cap) return L; var seen={}, keep=[], rest=[], i;
    for(i=L.length-1;i>=0;i--){ var e=L[i], k=false; if(e&&e.k==="quiz") (e.n||[]).forEach(function(id){ seen[id]=(seen[id]||0)+1; if(seen[id]<=KEEPQ) k=true; }); (k?keep:rest).push(e); }
    keep.reverse(); rest.reverse(); rest=rest.slice(Math.max(0,rest.length-Math.max(0,cap-keep.length)));
    return keep.concat(rest).sort(function(a,b){ return (a.t||0)-(b.t||0); }); }
  function rec(ev){ if(!ev||!Array.isArray(ev.n)||!ev.n.length) return false; var L=rd(EK,[]); if(!Array.isArray(L)) L=[];
    ev.t=Date.now();
    if(ev.a!=null&&ev.qid!=null){ for(var i=L.length-1;i>=0;i--){ var x=L[i]; if(x&&x.k===ev.k&&x.qid===ev.qid&&x.a===ev.a){ L.splice(i,1); break; } } }
    L.push(ev); L=trim(L);
    /* 저장 실패 → 절반 상한으로 다시(이때도 노드마다 최근 정답은 지킨다, 오타 설계 2차) · 그래도 실패면 메모리 사본은 자르지 않은 전체로 */
    var ok=wr(EK,L); if(!ok){ var half=trim(L,Math.floor(CAP/2)); if(wr(EK,half)){ L=half; ok=true; } else { MEM[EK]=L; DIRTY[EK]=true; } }
    judge(ev.n); return ok; }
  function reasons(id){ var L=rd(EK,[]); if(!Array.isArray(L)) return null; var evs=L.filter(function(e){ return e&&e.n&&e.n.indexOf(id)>=0; }); return evs.length?why(evs):null; }
  g.TJ={rec:rec,judge:judge,all:all,score:score,reasons:reasons,trim:trim};
})(typeof window!=="undefined"?window:this);
</script>
<script>
const DECK_ID="calc2-mid2";

const SLIDES=[{"id": "start", "type": "start"}, {"id": "jump", "type": "jump", "part": 0}, {"id": "p1-cover", "type": "cover", "part": 1, "no": "파트 1 · 9/29", "title": "12.4 외적 계산 — 3×3 행렬식 1행 여인수 전개 · 넓이", "star": false}, {"id": "p1-concept", "type": "concept", "part": 1, "title": "a × b = |i j k ; a₁ a₂ a₃ ; b₁ b₂ b₃| — 1행 기준 + − + 로 전개 (1/4)", "html": "<div class=\"why\">9/22에 외적을 성분식 [Def 01]로 정의했다. 외우기 어려운 그 식을 1학기 행렬식 [Def 02]로 바꿔 쓰면 규칙 하나로 계산된다. 결과는 두 벡터에 동시에 수직인 벡터다.</div>\n  ", "exam": [{"level": "강조", "when": "9/29 19:54·23:11", "quote": "「사라스 적용할 필요 없어요. 무조건 여인수 전개」 · j 성분 「마이너스가 있으니까 조심」"}, {"level": "범위", "when": "9/29 29:19", "quote": "외적의 의미(두 벡터에 동시에 수직) 「뒤에 시험하고 연관된 내용이 나온다」 · 스칼라 삼중곱은 이번 학기 패스"}]}, {"id": "p1-concept-2", "type": "concept", "part": 1, "title": "a × b = |i j k ; a₁ a₂ a₃ ; b₁ b₂ b₃| — 1행 기준 + − + 로 전개 (2/4)", "html": "<div class=\"concept\"><p><b>[Def 01] 성분식</b>: \\(\\vec a\\times\\vec b=(a_2b_3-a_3b_2,\\ a_3b_1-a_1b_3,\\ a_1b_2-a_2b_1)\\) — 각 성분이 2×2 행렬식이다. 가운데(\\(y\\)) 성분의 순서 3·1이 헷갈린다.</p></div><div class=\"concept\"><p><b>[Def 02] 3×3 행렬식 1행 여인수 전개</b>: 1행의 원소마다, 그 원소의 행과 열을 지운 2×2 행렬식(소행렬식)을 곱하고 부호 + − +를 붙인다. \\[\\begin{vmatrix}a_1&amp;a_2&amp;a_3\\\\b_1&amp;b_2&amp;b_3\\\\c_1&amp;c_2&amp;c_3\\end{vmatrix}=a_1\\begin{vmatrix}b_2&amp;b_3\\\\c_2&amp;c_3\\end{vmatrix}-a_2\\begin{vmatrix}b_1&amp;b_3\\\\c_1&amp;c_3\\end{vmatrix}+a_3\\begin{vmatrix}b_1&amp;b_2\\\\c_1&amp;c_2\\end{vmatrix}\\]</p></div>", "exam": []}, {"id": "p1-concept-3", "type": "concept", "part": 1, "title": "a × b = |i j k ; a₁ a₂ a₃ ; b₁ b₂ b₃| — 1행 기준 + − + 로 전개 (3/4)", "html": "<div class=\"concept\"><p><b>둘을 잇기(교수님 판서)</b>: \\(\\vec a=a_1\\vec i+a_2\\vec j+a_3\\vec k\\)로 쓰면 [Def 01]의 가운데 항 \\(\\begin{vmatrix}a_3&amp;a_1\\\\b_3&amp;b_1\\end{vmatrix}\\)은 두 열을 바꾸면 부호가 바뀌어 \\(-\\begin{vmatrix}a_1&amp;a_3\\\\b_1&amp;b_3\\end{vmatrix}\\) → + − + 모양이 된다. 그래서 \\[\\vec a\\times\\vec b=\\begin{vmatrix}\\vec i&amp;\\vec j&amp;\\vec k\\\\a_1&amp;a_2&amp;a_3\\\\b_1&amp;b_2&amp;b_3\\end{vmatrix}\\]</p></div><div class=\"concept\"><p><b>[1학기 복습] 2×2 행렬식</b>: \\(\\begin{vmatrix}p&amp;q\\\\r&amp;s\\end{vmatrix}=ps-qr\\). 행렬식 성질: 두 행(또는 두 열)을 바꾸면 −1배.</p></div>", "exam": []}, {"id": "p1-concept-4", "type": "concept", "part": 1, "title": "a × b = |i j k ; a₁ a₂ a₃ ; b₁ b₂ b₃| — 1행 기준 + − + 로 전개 (4/4)", "html": "<div class=\"concept\"><p><b>교수님 Ex01 흐름</b>: \\(\\vec a=(1,3,4)\\), \\(\\vec b=(2,7,-5)\\) → \\(\\vec i\\) 항 \\(3\\cdot(-5)-4\\cdot7=-43\\), \\(\\vec j\\) 항 \\(-(1\\cdot(-5)-4\\cdot2)=+13\\), \\(\\vec k\\) 항 \\(1\\cdot7-3\\cdot2=1\\) → \\((-43,13,1)\\). 검산: \\(\\vec a\\cdot(\\vec a\\times\\vec b)=-43+39+4=0\\) — 수직.</p></div><div class=\"concept\"><p><b>[교재 보충] 성질과 크기</b>: \\(\\vec b\\times\\vec a=-\\vec a\\times\\vec b\\), \\(\\vec a\\times\\vec a=\\vec0\\), \\(\\vec i\\times\\vec j=\\vec k\\), \\(\\vec j\\times\\vec k=\\vec i\\), \\(\\vec k\\times\\vec i=\\vec j\\). 크기 \\(|\\vec a\\times\\vec b|=|\\vec a||\\vec b|\\sin\\theta\\) = 두 벡터가 만드는 평행사변형의 넓이(삼각형은 그 절반). 방향은 오른손 법칙.</p></div><div class=\"one\">한 줄: \\(\\vec a\\times\\vec b=|\\,\\vec i\\ \\vec j\\ \\vec k;\\ \\vec a;\\ \\vec b\\,|\\)를 1행 + − +로 전개(사라스 금지) · 결과는 \\(\\vec a,\\vec b\\)에 수직 · \\(|\\vec a\\times\\vec b|\\) = 평행사변형 넓이.</div>\n  ", "exam": []}, {"id": "p1-mu", "type": "mu", "part": 1, "title": "12.4 외적 계산 — 3×3 행렬식 1행 여인수 전개 · 넓이", "mem": ["1행 여인수 전개 + − +, \\(\\vec j\\) 항 앞 −", "\\(\\vec a\\times\\vec b=|\\vec i\\ \\vec j\\ \\vec k;\\vec a;\\vec b|\\)", "\\(\\vec b\\times\\vec a=-\\vec a\\times\\vec b\\), \\(\\vec i\\times\\vec j=\\vec k\\)", "\\(|\\vec a\\times\\vec b|=|\\vec a||\\vec b|\\sin\\theta\\) = 평행사변형 넓이"], "und": ["[Def 01]이 [Def 02] 모양이 되는 이유(열 교환 → −1배)", "외적이 두 벡터에 수직인지 내적으로 확인하는 법"]}, {"id": "p1-b1", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-1 · 외적 계산", "html": "<p>\\(\\vec a=(2,1,0)\\), \\(\\vec b=(1,3,2)\\)일 때 \\(\\vec a\\times\\vec b\\)는?</p>", "ans": "\\(\\begin{vmatrix}\\vec i&\\vec j&\\vec k\\\\2&1&0\\\\1&3&2\\end{vmatrix}=(1\\cdot2-0\\cdot3)\\vec i-(2\\cdot2-0\\cdot1)\\vec j+(2\\cdot3-1\\cdot1)\\vec k=2\\vec i-4\\vec j+5\\vec k\\). \\(\\vec j\\) 항의 −를 빼먹으면 \\((2,4,5)\\).", "choices": [{"html": "\\((-2,4,-5)\\)", "ok": false, "k": 2}, {"html": "\\((2,-4,-5)\\)", "ok": false, "k": 3}, {"html": "\\((2,-4,5)\\)", "ok": true, "k": 0}, {"html": "\\((2,4,5)\\)", "ok": false, "k": 1}], "exam": []}, {"id": "p1-b2", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-2 · j 성분 부호", "html": "<p>\\(\\vec a=(1,2,3)\\), \\(\\vec b=(4,5,6)\\)일 때 \\(\\vec a\\times\\vec b\\)는?</p>", "ans": "\\(\\vec i\\): \\(2\\cdot6-3\\cdot5=-3\\), \\(\\vec j\\): \\(-(1\\cdot6-3\\cdot4)=-(-6)=6\\), \\(\\vec k\\): \\(1\\cdot5-2\\cdot4=-3\\). 검산 \\(\\vec a\\cdot(-3,6,-3)=-3+12-9=0\\) ✓.", "choices": [{"html": "\\((3,-6,3)\\)", "ok": false, "k": 2}, {"html": "\\((0,0,0)\\)", "ok": false, "k": 3}, {"html": "\\((-3,-6,-3)\\)", "ok": false, "k": 1}, {"html": "\\((-3,6,-3)\\)", "ok": true, "k": 0}], "exam": []}, {"id": "p1-b3", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-3 · 성질", "html": "<p>옳은 것은?</p>", "ans": "\\(\\vec i\\times\\vec j=\\vec k\\)이고 순서를 바꾸면 부호가 바뀐다. \\(\\vec a\\times\\vec a=\\vec0\\)(사이각 0), 외적은 교환법칙이 안 된다.", "choices": [{"html": "\\(\\vec j\\times\\vec i=-\\vec k\\)", "ok": true, "k": 0}, {"html": "\\(\\vec a\\times\\vec a=|\\vec a|^2\\)", "ok": false, "k": 2}, {"html": "\\(\\vec a\\times\\vec b=\\vec b\\times\\vec a\\)", "ok": false, "k": 3}, {"html": "\\(\\vec j\\times\\vec i=\\vec k\\)", "ok": false, "k": 1}], "exam": []}, {"id": "p1-b4", "type": "q", "part": 1, "kind": "기초", "qn": "기초 1-4 · 평행사변형 넓이", "html": "<p>\\(\\vec a=(3,0,0)\\), \\(\\vec b=(1,2,0)\\)이 만드는 평행사변형의 넓이는?</p>", "ans": "\\(\\vec a\\times\\vec b=(0\\cdot0-0\\cdot2)\\vec i-(3\\cdot0-0\\cdot1)\\vec j+(3\\cdot2-0\\cdot1)\\vec k=(0,0,6)\\) → 넓이 6. 3은 삼각형 넓이.", "choices": [{"html": "\\(\\sqrt{45}\\)", "ok": false, "k": 2}, {"html": "6", "ok": true, "k": 0}, {"html": "12", "ok": false, "k": 3}, {"html": "3", "ok": false, "k": 1}], "exam": []}, {"id": "p1-a5", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-1 · 두 벡터에 수직인 단위벡터", "html": "<p>\\(\\vec a=(1,-1,2)\\), \\(\\vec b=(3,0,1)\\)에 동시에 수직인 단위벡터를 모두 구하라.</p>", "ans": "① \\(\\vec a\\times\\vec b=\\begin{vmatrix}\\vec i&\\vec j&\\vec k\\\\1&-1&2\\\\3&0&1\\end{vmatrix}=(-1\\cdot1-2\\cdot0)\\vec i-(1\\cdot1-2\\cdot3)\\vec j+(1\\cdot0-(-1)\\cdot3)\\vec k=(-1,5,3)\\). ② 검산 \\(\\vec a\\cdot(-1,5,3)=-1-5+6=0\\), \\(\\vec b\\cdot(-1,5,3)=-3+0+3=0\\) ✓. ③ 크기 \\(\\sqrt{1+25+9}=\\sqrt{35}\\) → 단위벡터 \\(\\pm\\frac{1}{\\sqrt{35}}(-1,5,3)\\)(두 개).", "choices": null, "exam": []}, {"id": "p1-a6", "type": "q", "part": 1, "kind": "응용", "qn": "응용 1-2 · 세 점이 만드는 삼각형", "html": "<p>세 점 P\\((1,0,0)\\), Q\\((0,2,0)\\), R\\((0,0,3)\\)이 만드는 삼각형의 넓이를 구하라.</p>", "ans": "① \\(\\overrightarrow{PQ}=(-1,2,0)\\), \\(\\overrightarrow{PR}=(-1,0,3)\\). ② \\(\\overrightarrow{PQ}\\times\\overrightarrow{PR}=(2\\cdot3-0\\cdot0)\\vec i-((-1)\\cdot3-0\\cdot(-1))\\vec j+((-1)\\cdot0-2\\cdot(-1))\\vec k=(6,3,2)\\). ③ 크기 \\(\\sqrt{36+9+4}=7\\) = 평행사변형 넓이 → 삼각형 \\(\\frac72\\).", "choices": null, "exam": []}, {"id": "p1-result", "type": "result", "part": 1, "title": "12.4 외적 계산 — 3×3 행렬식 1행 여인수 전개 · 넓이"}, {"id": "p2-cover", "type": "cover", "part": 2, "no": "파트 2 · 9/29", "title": "12.5 ① 직선의 방정식 — 방향코사인 · 방향비 · 매개방정식 · 대칭방정식", "star": false}, {"id": "p2-concept", "type": "concept", "part": 2, "title": "P₀P = t v 한 줄에서 매개방정식과 대칭방정식이 나온다 (1/5)", "html": "<div class=\"why\">평면(\\(\\mathbb R^2\\))에서는 직선을 기울기로 썼다. 공간(\\(\\mathbb R^3\\))에서는 기울기 하나로 방향을 못 나타내서 방향벡터를 쓴다. 공식을 외우지 말고 그림(\\(\\overrightarrow{P_0P}\\parallel\\vec v\\))에서 매번 유도할 수 있어야 한다.</div>\n  ", "exam": [{"level": "강조", "when": "9/29 32:24~34:52", "quote": "「직선·평면의 방정식 = 중간고사 문제에 관련된 내용 … 잘 체크해서 집중적으로」 · 암기한 공식만으로는 「응용하는 문제는 안 먹혀」 — 그림에서 유도"}]}, {"id": "p2-concept-2", "type": "concept", "part": 2, "title": "P₀P = t v 한 줄에서 매개방정식과 대칭방정식이 나온다 (2/5)", "html": "<div class=\"concept\"><p><b>① 방향코사인</b>(교수님 판서): 원점 O와 점 \\(P_0(x_0,y_0,z_0)\\)을 지나는 직선 g의 방향은 단위벡터 \\(\\frac{1}{|\\overrightarrow{OP_0}|}\\overrightarrow{OP_0}\\). \\(x\\)축 단위벡터 \\(\\vec E_x=(1,0,0)\\)과의 내적 \\(\\vec E_x\\cdot\\overrightarrow{OP_0}=x_0=|\\overrightarrow{OP_0}|\\cos\\alpha\\) → \\[\\cos\\alpha=\\frac{x_0}{|\\overrightarrow{OP_0}|},\\ \\cos\\beta=\\frac{y_0}{|\\overrightarrow{OP_0}|},\\ \\cos\\gamma=\\frac{z_0}{|\\overrightarrow{OP_0}|}\\] 이것을 \\(l,m,n\\)으로 부른다(9/22 방향코사인과 같은 식).</p></div><div class=\"concept\"><p><b>ㄴ 부호 ±</b>: 직선은 반대로도 뻗으니 각에 \\(\\pi\\)를 더한 방향도 같은 직선이고 \\(\\cos(\\pi+\\alpha)=-\\cos\\alpha\\) → \\(l=\\pm\\frac{x_0}{|\\overrightarrow{OP_0}|}\\), \\(m\\), \\(n\\)도 ±.</p></div><div class=\"concept\"><p><b>ㄷ 방향비</b>: ±와 분모는 셋이 같으니 비는 고정 — \\(l:m:n=x_0:y_0:z_0\\)(direction ratio).</p></div>", "exam": []}, {"id": "p2-concept-3", "type": "concept", "part": 2, "title": "P₀P = t v 한 줄에서 매개방정식과 대칭방정식이 나온다 (3/5)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"line\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 500 250\" width=\"500\" height=\"250\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><line x1=\"150\" y1=\"190\" x2=\"270\" y2=\"190\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><line x1=\"150\" y1=\"190\" x2=\"150\" y2=\"70\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><line x1=\"150\" y1=\"190\" x2=\"78.0\" y2=\"250.0\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><text x=\"276\" y=\"195\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y</text><text x=\"146\" y=\"64\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">z</text><text x=\"72.0\" y=\"240.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x</text><text x=\"158\" y=\"206\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">O</text><line x1=\"109.4\" y1=\"186.8\" x2=\"299.4\" y2=\"81.2\" stroke=\"#F59F00\" stroke-width=\"3\"></line><line x1=\"150\" y1=\"190\" x2=\"161.2\" y2=\"158.0\" stroke=\"#8A97A6\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"></line><line x1=\"150\" y1=\"190\" x2=\"253.4\" y2=\"106.8\" stroke=\"#8A97A6\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"></line><line x1=\"161.2\" y1=\"158.0\" x2=\"253.4\" y2=\"106.8\" stroke=\"#E03131\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"></line><line x1=\"231.1\" y1=\"61.6\" x2=\"272.59000000000003\" y2=\"38.56\" stroke=\"#2F9E44\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"></line><text x=\"278.59000000000003\" y=\"34.56\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">v = (A, B, C)</text><circle cx=\"161.2\" cy=\"158.0\" r=\"4\" fill=\"#1F2A44\"></circle><text x=\"151.2\" y=\"150.0\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">P₀(x₀, y₀, z₀)</text><circle cx=\"253.4\" cy=\"106.8\" r=\"4\" fill=\"#1F2A44\"></circle><text x=\"261.4\" y=\"120.8\" font-size=\"12\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">P(x, y, z)</text><text x=\"470\" y=\"40\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">P₀P = t v</text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">직선 위의 점 P는 \\(\\overrightarrow{P_0P}\\parallel\\vec v\\), 즉 \\(\\overrightarrow{P_0P}=t\\vec v\\)인 실수 \\(t\\)가 있다 — 여기서 매개방정식과 대칭방정식이 나온다.</figcaption></figure></div>", "exam": []}, {"id": "p2-concept-4", "type": "concept", "part": 2, "title": "P₀P = t v 한 줄에서 매개방정식과 대칭방정식이 나온다 (4/5)", "html": "<div class=\"concept\"><p><b>② 한 점과 방향벡터</b>: \\(P_0(x_0,y_0,z_0)\\)를 지나고 방향벡터 \\(\\vec v=(A,B,C)\\)에 평행한 직선. 직선 위 점 \\(P(x,y,z)\\)이면 \\(\\overrightarrow{P_0P}=(x-x_0,\\,y-y_0,\\,z-z_0)\\parallel\\vec v\\) ⇔ \\(\\overrightarrow{P_0P}=t\\vec v\\)인 실수 \\(t\\)가 있다.</p></div><div class=\"concept\"><p><b>매개방정식</b>: 성분끼리 같다고 놓으면 \\[x=x_0+tA,\\qquad y=y_0+tB,\\qquad z=z_0+tC\\] \\(t\\)(매개변수)가 모든 실수를 돌면 직선 전체가 그려진다.</p></div><div class=\"concept\"><p><b>대칭방정식</b>: 세 식을 \\(t\\)에 대해 풀어 같다고 놓으면 \\[\\frac{x-x_0}{A}=\\frac{y-y_0}{B}=\\frac{z-z_0}{C}\\ (=t)\\] 분모 \\(A,B,C\\)가 방향비 역할. <b>[교재 보충]</b> 성분 하나가 0이면(예 \\(B=0\\)) 그 좌표는 상수: \\(\\frac{x-x_0}{A}=\\frac{z-z_0}{C},\\ y=y_0\\).</p></div>", "exam": []}, {"id": "p2-concept-5", "type": "concept", "part": 2, "title": "P₀P = t v 한 줄에서 매개방정식과 대칭방정식이 나온다 (5/5)", "html": "<div class=\"concept\"><p><b>[교재 보충] 두 점을 지나는 직선</b>: A, B를 지나면 \\(\\vec v=\\overrightarrow{AB}\\). <b>두 직선의 위치</b>: 방향벡터가 평행하면 평행(또는 일치), 아니면 연립해서 해가 있으면 한 점에서 만나고, 없으면 <b>꼬인 위치</b>(평행하지도 만나지도 않음 — 공간에서만).</p></div><div class=\"one\">한 줄: \\(l,m,n=\\pm\\frac{x_0,y_0,z_0}{|\\overrightarrow{OP_0}|}\\), 방향비 \\(x_0:y_0:z_0\\) · \\(\\overrightarrow{P_0P}=t\\vec v\\) → 매개 \\(x=x_0+tA\\) … → 대칭 \\(\\frac{x-x_0}A=\\frac{y-y_0}B=\\frac{z-z_0}C\\).</div>\n  ", "exam": []}, {"id": "p2-mu", "type": "mu", "part": 2, "title": "12.5 ① 직선의 방정식 — 방향코사인 · 방향비 · 매개방정식 · 대칭방정식", "mem": ["\\(\\cos\\alpha=x_0/|\\overrightarrow{OP_0}|\\) … (\\(l,m,n\\)), 부호 ±", "방향비 \\(l:m:n=x_0:y_0:z_0\\)", "매개방정식 · 대칭방정식", "공간의 두 직선: 평행 · 교차 · 꼬인 위치"], "und": ["\\(\\overrightarrow{P_0P}=t\\vec v\\) 그림에서 두 방정식을 유도하는 과정", "방향코사인이 ±까지만 정해지는 이유", "방향벡터 성분이 0일 때 대칭방정식을 고쳐 쓰는 이유"]}, {"id": "p2-b1", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-1 · 방향코사인", "html": "<p>원점과 \\(P_0(2,-1,2)\\)를 지나는 직선의 방향코사인 \\((l,m,n)\\)은?</p>", "ans": "\\(|\\overrightarrow{OP_0}|=\\sqrt{4+1+4}=3\\) → \\(l=\\pm\\frac23\\), \\(m=\\mp\\frac13\\), \\(n=\\pm\\frac23\\)(복부호 동순). 제곱하지 않은 거리 9로 나누면 틀린다.", "choices": [{"html": "\\((2,-1,2)\\)", "ok": false, "k": 1}, {"html": "\\(\\left(\\frac23,\\frac13,\\frac23\\right)\\)", "ok": false, "k": 3}, {"html": "\\(\\pm\\left(\\frac29,-\\frac19,\\frac29\\right)\\)", "ok": false, "k": 2}, {"html": "\\(\\pm\\left(\\frac23,-\\frac13,\\frac23\\right)\\)", "ok": true, "k": 0}], "exam": []}, {"id": "p2-b2", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-2 · 매개방정식", "html": "<p>점 \\((1,2,-1)\\)을 지나고 \\(\\vec v=(3,0,4)\\)에 평행한 직선의 매개방정식은?</p>", "ans": "\\(x=x_0+tA\\) 꼴: \\(1+3t\\), \\(2+0\\cdot t=2\\), \\(-1+4t\\). 점과 방향을 바꿔 넣으면 다른 직선.", "choices": [{"html": "\\(x=3+t,\\ y=2t,\\ z=4-t\\)", "ok": false, "k": 1}, {"html": "\\(x=1+3t,\\ y=2+t,\\ z=-1+4t\\)", "ok": false, "k": 2}, {"html": "\\(x=1+3t,\\ y=2,\\ z=-1+4t\\)", "ok": true, "k": 0}, {"html": "\\(x=3t,\\ y=0,\\ z=4t\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p2-b3", "type": "q", "part": 2, "kind": "기초", "qn": "기초 2-3 · 두 점과 대칭방정식", "html": "<p>A\\((1,0,2)\\), B\\((3,4,1)\\)을 지나는 직선의 대칭방정식은?</p>", "ans": "\\(\\vec v=\\overrightarrow{AB}=(2,4,-1)\\), 점 A → \\(\\frac{x-1}{2}=\\frac{y-0}{4}=\\frac{z-2}{-1}\\). B의 좌표를 분모에 쓰면 틀린다.", "choices": [{"html": "\\(\\frac{x-1}{2}=\\frac{y}{4}=\\frac{z-2}{-1}\\)", "ok": true, "k": 0}, {"html": "\\(\\frac{x-2}{1}=\\frac{y-4}{0}=\\frac{z+1}{2}\\)", "ok": false, "k": 3}, {"html": "\\(\\frac{x-1}{3}=\\frac{y}{4}=\\frac{z-2}{1}\\)", "ok": false, "k": 1}, {"html": "\\(\\frac{x+1}{2}=\\frac{y}{4}=\\frac{z+2}{-1}\\)", "ok": false, "k": 2}], "exam": []}, {"id": "p2-a4", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-1 · xy평면과 만나는 점", "html": "<p>A\\((1,3,-2)\\), B\\((2,1,2)\\)를 지나는 직선이 \\(xy\\)평면과 만나는 점을 구하라.</p>", "ans": "① \\(\\vec v=\\overrightarrow{AB}=(1,-2,4)\\) → 매개 \\(x=1+t,\\ y=3-2t,\\ z=-2+4t\\). ② \\(xy\\)평면은 \\(z=0\\) → \\(-2+4t=0\\) → \\(t=\\frac12\\). ③ \\((1.5,\\ 2,\\ 0)\\).", "choices": null, "exam": []}, {"id": "p2-a5", "type": "q", "part": 2, "kind": "응용", "qn": "응용 2-2 · 두 직선의 위치 관계", "html": "<p>\\(L_1:\\ x=1+2t,\\ y=t,\\ z=3-t\\)과 \\(L_2:\\ x=s,\\ y=2+s,\\ z=1+2s\\)가 평행한지, 만나는지, 꼬인 위치인지 판정하라.</p>", "ans": "① 방향 \\(\\vec v_1=(2,1,-1)\\), \\(\\vec v_2=(1,1,2)\\) — 한쪽이 다른 쪽의 실수배가 아니므로 평행 아님. ② 만나는지: \\(1+2t=s\\), \\(t=2+s\\)를 풀면 \\(t=-3,\\ s=-5\\). ③ 셋째 좌표: \\(3-t=6\\), \\(1+2s=-9\\) → 다르다 → 공통점 없음. ∴ 평행하지도 만나지도 않는 <b>꼬인 위치</b>.", "choices": null, "exam": []}, {"id": "p2-result", "type": "result", "part": 2, "title": "12.5 ① 직선의 방정식 — 방향코사인 · 방향비 · 매개방정식 · 대칭방정식"}, {"id": "p3-cover", "type": "cover", "part": 3, "no": "파트 3 · 교재 선행", "title": "12.5 ② 평면의 방정식 — 법선벡터 · 두 평면 · 점과 평면 사이 거리", "star": false}, {"id": "p3-concept", "type": "concept", "part": 3, "title": "n · (r − r₀) = 0 → a(x−x₀) + b(y−y₀) + c(z−z₀) = 0 (1/4)", "html": "<div class=\"why\">직선은 방향벡터 하나로 정해졌다. 평면은 「평면에 수직인 방향」 하나(법선벡터)와 한 점으로 정해진다. 세 점이 주어지면 법선을 외적으로 만든다 — 파트 1의 외적(두 벡터에 동시에 수직)이 여기서 쓰인다.</div>\n  <div class=\"concept\"><p><b>법선벡터</b>: 평면에 수직인 벡터 \\(\\vec n=(a,b,c)\\). 평면 위의 한 점 \\(P_0(x_0,y_0,z_0)\\)과 임의의 점 \\(P(x,y,z)\\)에 대해 \\(\\overrightarrow{P_0P}=\\vec r-\\vec r_0\\)는 평면 안의 벡터라 \\(\\vec n\\)과 수직(내적 0).</p></div>", "exam": []}, {"id": "p3-concept-2", "type": "concept", "part": 3, "title": "n · (r − r₀) = 0 → a(x−x₀) + b(y−y₀) + c(z−z₀) = 0 (2/4)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"plane\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 460 196\" width=\"460\" height=\"196\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M90.0 170.0 L330.0 170.0 L420.0 90.0 L180.0 90.0 Z\" fill=\"rgba(25,113,194,.07)\" stroke=\"#1F2A44\" stroke-width=\"1.8\"></path><circle cx=\"220\" cy=\"140\" r=\"4\" fill=\"#1F2A44\"></circle><text x=\"212\" y=\"158\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">P₀</text><circle cx=\"320\" cy=\"118\" r=\"4\" fill=\"#1F2A44\"></circle><text x=\"328\" y=\"134\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">P</text><line x1=\"220\" y1=\"140\" x2=\"317\" y2=\"119\" stroke=\"#E03131\" stroke-width=\"2.2\" marker-end=\"url(#ah)\"></line><text x=\"270\" y=\"146\" font-size=\"12\" fill=\"#E03131\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r − r₀</text><line x1=\"220\" y1=\"140\" x2=\"220\" y2=\"26\" stroke=\"#2F9E44\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"></line><text x=\"228\" y=\"36\" font-size=\"13\" fill=\"#2F9E44\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">n = (a, b, c)</text><path d=\"M220 128 L231 125.5 L231 137.5\" fill=\"none\" stroke=\"#2F9E44\" stroke-width=\"1.3\"></path></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">평면: 법선벡터 \\(\\vec n\\)이 평면 위 모든 벡터 \\(\\vec r-\\vec r_0\\)와 수직 → \\(\\vec n\\cdot(\\vec r-\\vec r_0)=0\\).</figcaption></figure></div>", "exam": []}, {"id": "p3-concept-3", "type": "concept", "part": 3, "title": "n · (r − r₀) = 0 → a(x−x₀) + b(y−y₀) + c(z−z₀) = 0 (3/4)", "html": "<div class=\"concept\"><p><b>평면의 방정식</b>: \\[\\vec n\\cdot(\\vec r-\\vec r_0)=0\\iff a(x-x_0)+b(y-y_0)+c(z-z_0)=0\\] 전개하면 \\(ax+by+cz+d=0\\)(일차방정식). 거꾸로 \\(ax+by+cz+d=0\\)의 법선은 계수 \\((a,b,c)\\).</p></div><div class=\"concept\"><p><b>세 점을 지나는 평면</b>: P, Q, R이면 \\(\\vec n=\\overrightarrow{PQ}\\times\\overrightarrow{PR}\\)(두 벡터에 동시에 수직 = 평면에 수직), 점은 셋 중 아무거나.</p></div><div class=\"concept\"><p><b>두 평면</b>: 법선이 평행하면 평면도 평행. 두 평면이 이루는 각 = 법선 사이 각 \\(\\cos\\theta=\\dfrac{|\\vec n_1\\cdot\\vec n_2|}{|\\vec n_1||\\vec n_2|}\\). 평행하지 않은 두 평면의 교선은 직선이고, 방향은 \\(\\vec n_1\\times\\vec n_2\\)(두 법선 모두에 수직).</p></div><div class=\"concept\"><p><b>직선과 평면의 교점</b>: 직선의 매개방정식을 평면 식에 넣어 \\(t\\)를 구한다.</p></div>", "exam": []}, {"id": "p3-concept-4", "type": "concept", "part": 3, "title": "n · (r − r₀) = 0 → a(x−x₀) + b(y−y₀) + c(z−z₀) = 0 (4/4)", "html": "<div class=\"concept\"><p><b>점과 평면 사이 거리</b>: 점 \\((x_1,y_1,z_1)\\)에서 평면 \\(ax+by+cz+d=0\\)까지 \\[D=\\frac{|ax_1+by_1+cz_1+d|}{\\sqrt{a^2+b^2+c^2}}\\] (평면 위 한 점에서 그 점으로 가는 벡터를 법선 방향으로 정사영한 길이 — 12.3 정사영.)</p></div><div class=\"one\">한 줄: \\(a(x-x_0)+b(y-y_0)+c(z-z_0)=0\\), 법선 = 계수 · 세 점 → \\(\\vec n=\\overrightarrow{PQ}\\times\\overrightarrow{PR}\\) · 두 평면 각 = 법선 각, 교선 방향 \\(\\vec n_1\\times\\vec n_2\\) · 거리 \\(\\frac{|ax_1+by_1+cz_1+d|}{\\sqrt{a^2+b^2+c^2}}\\).</div>\n  ", "exam": []}, {"id": "p3-mu", "type": "mu", "part": 3, "title": "12.5 ② 평면의 방정식 — 법선벡터 · 두 평면 · 점과 평면 사이 거리", "mem": ["\\(\\vec n\\cdot(\\vec r-\\vec r_0)=0\\), \\(ax+by+cz+d=0\\)의 법선 \\((a,b,c)\\)", "세 점 평면의 법선 = 외적", "교선 방향 \\(\\vec n_1\\times\\vec n_2\\)", "점-평면 거리 공식"], "und": ["평면 위 벡터가 모두 법선과 수직인 이유", "두 평면의 각을 법선으로 재는 이유", "거리 공식이 정사영인 이유"]}, {"id": "p3-b1", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-1 · 평면의 방정식", "html": "<p>점 \\((1,-2,3)\\)을 지나고 법선벡터가 \\((2,1,-1)\\)인 평면은?</p>", "ans": "\\(2(x-1)+(y+2)-(z-3)=0\\) → \\(2x-2+y+2-z+3=0\\) → \\(2x+y-z+3=0\\). 검산: 점을 넣으면 \\(2-2-3+3=0\\) ✓.", "choices": [{"html": "\\(x-2y+3z=0\\)", "ok": false, "k": 2}, {"html": "\\(2x+y-z+3=0\\)", "ok": true, "k": 0}, {"html": "\\(2x+y-z=0\\)", "ok": false, "k": 3}, {"html": "\\(2x+y-z-3=0\\)", "ok": false, "k": 1}], "exam": []}, {"id": "p3-b2", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-2 · 법선벡터 읽기", "html": "<p>평면 \\(3x-y+2z=5\\)의 법선벡터는?</p>", "ans": "\\(ax+by+cz+d=0\\)의 \\(x,y,z\\) 계수 \\((3,-1,2)\\). 오른쪽 상수 5는 위치(평행 이동)만 바꾼다.", "choices": [{"html": "\\((3,-1,5)\\)", "ok": false, "k": 1}, {"html": "\\((-1,2,5)\\)", "ok": false, "k": 2}, {"html": "\\((3,1,2)\\)", "ok": false, "k": 3}, {"html": "\\((3,-1,2)\\)", "ok": true, "k": 0}], "exam": []}, {"id": "p3-b3", "type": "q", "part": 3, "kind": "기초", "qn": "기초 3-3 · 점과 평면 사이 거리", "html": "<p>점 \\((1,2,3)\\)과 평면 \\(2x-y+2z=10\\) 사이의 거리는?</p>", "ans": "\\(2x-y+2z-10=0\\)으로 옮겨 \\(D=\\frac{|2-2+6-10|}{\\sqrt{4+1+4}}=\\frac{4}{3}\\). 분모에 제곱근을 빼먹으면 \\(\\frac49\\).", "choices": [{"html": "4", "ok": false, "k": 1}, {"html": "\\(\\frac43\\)", "ok": true, "k": 0}, {"html": "\\(\\frac{4}{9}\\)", "ok": false, "k": 2}, {"html": "\\(\\frac{10}{3}\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p3-a4", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-1 · 세 점을 지나는 평면", "html": "<p>P\\((1,0,0)\\), Q\\((0,2,0)\\), R\\((0,0,3)\\)을 지나는 평면의 방정식을 구하라.</p>", "ans": "① \\(\\overrightarrow{PQ}=(-1,2,0)\\), \\(\\overrightarrow{PR}=(-1,0,3)\\). ② \\(\\vec n=\\overrightarrow{PQ}\\times\\overrightarrow{PR}=(6,3,2)\\). ③ 점 P: \\(6(x-1)+3y+2z=0\\) → \\(6x+3y+2z=6\\). 검산: Q \\(6=6\\), R \\(6=6\\) ✓(양변 6으로 나누면 \\(\\frac x1+\\frac y2+\\frac z3=1\\) — 절편형).", "choices": null, "exam": []}, {"id": "p3-a5", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-2 · 두 평면의 각과 교선", "html": "<p>두 평면 \\(x+y+z=2\\)와 \\(x-y+2z=1\\)이 이루는 각의 코사인과 교선의 매개방정식을 구하라.</p>", "ans": "① \\(\\vec n_1=(1,1,1)\\), \\(\\vec n_2=(1,-1,2)\\), \\(\\vec n_1\\cdot\\vec n_2=1-1+2=2\\) → \\(\\cos\\theta=\\frac{2}{\\sqrt3\\sqrt6}=\\frac{\\sqrt2}{3}\\)(약 62°). ② 교선 방향 \\(\\vec n_1\\times\\vec n_2=(1\\cdot2-1\\cdot(-1),\\ -(1\\cdot2-1\\cdot1),\\ 1\\cdot(-1)-1\\cdot1)=(3,-1,-2)\\). ③ 교선 위 한 점: \\(z=0\\)으로 두면 \\(x+y=2,\\ x-y=1\\) → \\((1.5,0.5,0)\\). ∴ \\(x=1.5+3t,\\ y=0.5-t,\\ z=-2t\\).", "choices": null, "exam": []}, {"id": "p3-a6", "type": "q", "part": 3, "kind": "응용", "qn": "응용 3-3 · 직선과 평면의 교점", "html": "<p>직선 \\(x=1+t,\\ y=2-t,\\ z=3t\\)와 평면 \\(2x+y+z=7\\)의 교점을 구하라.</p>", "ans": "평면 식에 넣으면 \\(2(1+t)+(2-t)+3t=7\\) → \\(4+4t=7\\) → \\(t=\\frac34\\). 교점 \\(\\left(\\frac74,\\frac54,\\frac94\\right)\\). 검산 \\(\\frac{14}{4}+\\frac54+\\frac94=\\frac{28}{4}=7\\) ✓.", "choices": null, "exam": []}, {"id": "p3-result", "type": "result", "part": 3, "title": "12.5 ② 평면의 방정식 — 법선벡터 · 두 평면 · 점과 평면 사이 거리"}, {"id": "p4-cover", "type": "cover", "part": 4, "no": "파트 4 · 교재 선행", "title": "12.6 기둥면과 이차곡면 — 자취(단면)로 모양 알아보기", "star": false}, {"id": "p4-concept", "type": "concept", "part": 4, "title": "빠진 변수 방향으로 민 곡면 = 기둥면 · x·y·z 의 2차식 = 이차곡면 (1/5)", "html": "<div class=\"why\">\\(\\mathbb R^3\\)에서 방정식 하나는 곡면을 나타낸다. 곡면의 모양은 좌표평면과 평행한 평면으로 잘라 본 단면(자취)으로 알아낸다. 강의계획서에는 「기둥면」까지만 적혀 있어 이차곡면을 어디까지 다룰지는 수업을 봐야 안다.</div>\n  <div class=\"concept\"><p><b>기둥면(cylinder)</b>: 평면 곡선 하나와, 그 곡선을 지나며 한 직선에 평행한 모든 직선으로 이루어진 곡면. 방정식에 <b>변수 하나가 빠지면</b> 그 변수 축 방향의 기둥면이다.</p></div>", "exam": []}, {"id": "p4-concept-2", "type": "concept", "part": 4, "title": "빠진 변수 방향으로 민 곡면 = 기둥면 · x·y·z 의 2차식 = 이차곡면 (2/5)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"cyl\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 470 226\" width=\"470\" height=\"226\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><ellipse cx=\"150\" cy=\"50\" rx=\"70\" ry=\"18\" fill=\"rgba(25,113,194,.08)\" stroke=\"#1F2A44\" stroke-width=\"2\"></ellipse><line x1=\"80\" y1=\"50\" x2=\"80\" y2=\"170\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><line x1=\"220\" y1=\"50\" x2=\"220\" y2=\"170\" stroke=\"#1F2A44\" stroke-width=\"2\"></line><path d=\"M80 170 A 70 18 0 0 0 220 170\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"2\"></path><path d=\"M80 170 A 70 18 0 0 1 220 170\" fill=\"none\" stroke=\"#1F2A44\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"></path><line x1=\"110\" y1=\"61\" x2=\"110\" y2=\"183\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 4\"></line><line x1=\"150\" y1=\"64\" x2=\"150\" y2=\"186\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 4\"></line><line x1=\"190\" y1=\"61\" x2=\"190\" y2=\"183\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 4\"></line><text x=\"150\" y=\"214\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x² + y² = 1 (원기둥)</text><path d=\"M252.0 61.7 L254.6 69.5 L257.2 76.9 L259.8 84.2 L262.4 91.1 L265.0 97.8 L267.6 104.3 L270.2 110.5 L272.8 116.4 L275.4 122.0 L278.0 127.4 L280.6 132.5 L283.2 137.4 L285.8 142.0 L288.4 146.4 L291.0 150.4 L293.6 154.2 L296.2 157.8 L298.8 161.1 L301.4 164.1 L304.0 166.9 L306.6 169.4 L309.2 171.6 L311.8 173.6 L314.4 175.3 L317.0 176.7 L319.6 177.9 L322.2 178.8 L324.8 179.5 L327.4 179.9 L330.0 180.0 L332.6 179.9 L335.2 179.5 L337.8 178.8 L340.4 177.9 L343.0 176.7 L345.6 175.3 L348.2 173.6 L350.8 171.6 L353.4 169.4 L356.0 166.9 L358.6 164.1 L361.2 161.1 L363.8 157.8 L366.4 154.2 L369.0 150.4 L371.6 146.4 L374.2 142.0 L376.8 137.4 L379.4 132.5 L382.0 127.4 L384.6 122.0 L387.2 116.4 L389.8 110.5 L392.4 104.3 L395.0 97.8 L397.6 91.1 L400.2 84.2 L402.8 76.9 L405.4 69.5 L408.0 61.7\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"2.2\"></path><path d=\"M312.0 31.7 L314.6 39.5 L317.2 46.9 L319.8 54.2 L322.4 61.1 L325.0 67.8 L327.6 74.3 L330.2 80.5 L332.8 86.4 L335.4 92.0 L338.0 97.4 L340.6 102.5 L343.2 107.4 L345.8 112.0 L348.4 116.4 L351.0 120.4 L353.6 124.2 L356.2 127.8 L358.8 131.1 L361.4 134.1 L364.0 136.9 L366.6 139.4 L369.2 141.6 L371.8 143.6 L374.4 145.3 L377.0 146.7 L379.6 147.9 L382.2 148.8 L384.8 149.5 L387.4 149.9 L390.0 150.0 L392.6 149.9 L395.2 149.5 L397.8 148.8 L400.4 147.9 L403.0 146.7 L405.6 145.3 L408.2 143.6 L410.8 141.6 L413.4 139.4 L416.0 136.9 L418.6 134.1 L421.2 131.1 L423.8 127.8 L426.4 124.2 L429.0 120.4 L431.6 116.4 L434.2 112.0 L436.8 107.4 L439.4 102.5 L442.0 97.4 L444.6 92.0 L447.2 86.4 L449.8 80.5 L452.4 74.3 L455.0 67.8 L457.6 61.1 L460.2 54.2 L462.8 46.9 L465.4 39.5 L468.0 31.7\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"></path><line x1=\"258.0\" y1=\"79.2\" x2=\"318.0\" y2=\"49.2\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 4\"></line><line x1=\"330\" y1=\"180\" x2=\"390\" y2=\"150\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 4\"></line><line x1=\"402.0\" y1=\"79.2\" x2=\"462.0\" y2=\"49.2\" stroke=\"#8A97A6\" stroke-width=\"1\" stroke-dasharray=\"4 4\"></line><text x=\"360\" y=\"214\" font-size=\"13\" fill=\"#1971C2\" text-anchor=\"middle\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">z = y² (포물기둥)</text></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">기둥면: 식에 빠진 변수 방향으로 곡선을 그대로 민 곡면. \\(x^2+y^2=1\\)은 \\(z\\)가 빠져 \\(z\\)축 방향, \\(z=y^2\\)은 \\(x\\)가 빠져 \\(x\\)축 방향으로 민다.</figcaption></figure></div>", "exam": []}, {"id": "p4-concept-3", "type": "concept", "part": 4, "title": "빠진 변수 방향으로 민 곡면 = 기둥면 · x·y·z 의 2차식 = 이차곡면 (3/5)", "html": "<div class=\"concept\"><p><b>예</b>: \\(x^2+y^2=1\\)은 \\(\\mathbb R^2\\)에서는 원이지만 \\(\\mathbb R^3\\)에서는 \\(z\\)가 무엇이든 성립 → 원을 \\(z\\)축 방향으로 민 원기둥. \\(z=y^2\\)은 \\(x\\)가 빠져 포물선을 \\(x\\)축 방향으로 민 포물기둥.</p></div><div class=\"concept\"><p><b>자취(trace)</b>: \\(z=k\\)(수평) 또는 \\(x=k,\\ y=k\\)(수직) 평면으로 잘랐을 때의 곡선. 이 단면들을 모아 입체를 떠올린다.</p></div><div class=\"concept\"><p><b>이차곡면</b>: \\(x,y,z\\)의 2차방정식이 나타내는 곡면. 평행 이동·회전으로 아래 표준형 중 하나가 된다.</p></div>", "exam": []}, {"id": "p4-concept-4", "type": "concept", "part": 4, "title": "빠진 변수 방향으로 민 곡면 = 기둥면 · x·y·z 의 2차식 = 이차곡면 (4/5)", "html": "<div class=\"concept\"><table><tr><th>이름</th><th>표준형(예)</th><th>자취(단면)</th></tr>\n<tr><td>타원면</td><td>\\(\\frac{x^2}{a^2}+\\frac{y^2}{b^2}+\\frac{z^2}{c^2}=1\\)</td><td>모두 타원</td></tr>\n<tr><td>원뿔(타원뿔)</td><td>\\(\\frac{z^2}{c^2}=\\frac{x^2}{a^2}+\\frac{y^2}{b^2}\\)</td><td>수평 단면 타원, 수직 단면 두 직선·쌍곡선</td></tr>\n<tr><td>타원포물면</td><td>\\(\\frac zc=\\frac{x^2}{a^2}+\\frac{y^2}{b^2}\\)</td><td>수평 타원, 수직 포물선</td></tr>\n<tr><td>쌍곡포물면(말안장)</td><td>\\(\\frac zc=\\frac{x^2}{a^2}-\\frac{y^2}{b^2}\\)</td><td>수평 쌍곡선, 수직 포물선</td></tr>\n<tr><td>일엽쌍곡면</td><td>\\(\\frac{x^2}{a^2}+\\frac{y^2}{b^2}-\\frac{z^2}{c^2}=1\\)</td><td>수평 타원, 수직 쌍곡선(한 덩어리)</td></tr>\n<tr><td>이엽쌍곡면</td><td>\\(-\\frac{x^2}{a^2}-\\frac{y^2}{b^2}+\\frac{z^2}{c^2}=1\\)</td><td>수평 타원(\\(|z|\\ge c\\)), 두 덩어리</td></tr></table></div>", "exam": []}, {"id": "p4-concept-5", "type": "concept", "part": 4, "title": "빠진 변수 방향으로 민 곡면 = 기둥면 · x·y·z 의 2차식 = 이차곡면 (5/5)", "html": "<div class=\"concept\"><p><b>알아보는 요령</b>: ① 1차로 들어간 변수가 있으면 포물면(부호가 같으면 타원포물면, 다르면 쌍곡포물면) ② 모두 2차면 = 1의 부호를 센다: + 셋이면 타원면, − 하나면 일엽쌍곡면, − 둘이면 이엽쌍곡면, 우변이 0이면 원뿔.</p></div><div class=\"one\">한 줄: 빠진 변수 방향으로 민 것 = 기둥면 · 자취로 모양 판단 · 이차곡면 6종(타원면·원뿔·타원포물면·쌍곡포물면·일엽·이엽쌍곡면).</div>\n  ", "exam": []}, {"id": "p4-mu", "type": "mu", "part": 4, "title": "12.6 기둥면과 이차곡면 — 자취(단면)로 모양 알아보기", "mem": ["변수 하나가 빠지면 그 축 방향 기둥면", "이차곡면 6종의 표준형", "부호로 구별: 1차 변수 → 포물면, − 개수 → 일엽/이엽"], "und": ["\\(\\mathbb R^2\\)의 원이 \\(\\mathbb R^3\\)에서 원기둥이 되는 이유", "자취로 입체를 그리는 방법"]}, {"id": "p4-b1", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-1 · 기둥면", "html": "<p>\\(\\mathbb R^3\\)에서 \\(x^2+y^2=4\\)가 나타내는 도형은?</p>", "ans": "\\(z\\)가 빠져 있어 모든 \\(z\\)에서 성립 → \\(xy\\)평면의 원 \\(x^2+y^2=4\\)를 \\(z\\)축 방향으로 민 원기둥. 원으로 답하면 \\(\\mathbb R^2\\)의 답이다.", "choices": [{"html": "\\(z\\)축 방향으로 뻗은 반지름 2인 원기둥", "ok": true, "k": 0}, {"html": "반지름 2인 원", "ok": false, "k": 1}, {"html": "반지름 2인 구", "ok": false, "k": 2}, {"html": "\\(z=4\\)인 평면", "ok": false, "k": 3}], "exam": []}, {"id": "p4-b2", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-2 · 이차곡면 이름", "html": "<p>\\(z=y^2-x^2\\)이 나타내는 곡면은?</p>", "ans": "\\(z\\)가 1차 → 포물면. \\(x^2\\)과 \\(y^2\\)의 부호가 다르다 → 쌍곡포물면. 수평 자취 \\(y^2-x^2=k\\)는 쌍곡선, 수직 자취는 포물선.", "choices": [{"html": "원뿔", "ok": false, "k": 2}, {"html": "타원포물면", "ok": false, "k": 1}, {"html": "쌍곡포물면(말안장)", "ok": true, "k": 0}, {"html": "일엽쌍곡면", "ok": false, "k": 3}], "exam": []}, {"id": "p4-b3", "type": "q", "part": 4, "kind": "기초", "qn": "기초 4-3 · 부호 세기", "html": "<p>\\(x^2+y^2-z^2=1\\)이 나타내는 곡면은?</p>", "ans": "모두 2차이고 우변 1, − 부호가 하나 → 일엽쌍곡면(한 덩어리). 수평 자취 \\(x^2+y^2=1+k^2\\)는 어떤 높이에서도 원이 있다. − 둘이면 이엽, 우변 0이면 원뿔.", "choices": [{"html": "원뿔", "ok": false, "k": 3}, {"html": "타원면", "ok": false, "k": 2}, {"html": "일엽쌍곡면", "ok": true, "k": 0}, {"html": "이엽쌍곡면", "ok": false, "k": 1}], "exam": []}, {"id": "p4-a4", "type": "q", "part": 4, "kind": "응용", "qn": "응용 4-1 · 자취로 모양 알기", "html": "<p>곡면 \\(z=4x^2+y^2\\)의 자취를 (a) \\(z=4\\) (b) \\(x=0\\)에서 구하고 곡면 이름을 쓰라.</p>", "ans": "(a) \\(4x^2+y^2=4\\) → \\(x^2+\\frac{y^2}{4}=1\\) — 타원. (b) \\(z=y^2\\) — 포물선. 수평 자취가 타원, 수직 자취가 포물선이고 \\(z\\)가 1차 → <b>타원포물면</b>(\\(z\\ge0\\), 원점이 꼭짓점).", "choices": null, "exam": []}, {"id": "p4-result", "type": "result", "part": 4, "title": "12.6 기둥면과 이차곡면 — 자취(단면)로 모양 알아보기"}, {"id": "p5-cover", "type": "cover", "part": 5, "no": "파트 5 · 교재 선행", "title": "13.1 벡터함수와 공간곡선", "star": false}, {"id": "p5-concept", "type": "concept", "part": 5, "title": "r(t) = ⟨f(t), g(t), h(t)⟩ — 실수 t 하나에 벡터 하나, 끝점이 그리는 것이 공간곡선 (1/4)", "html": "<div class=\"why\">12.5의 직선 \\(\\vec r=\\vec r_0+t\\vec v\\)가 사실 벡터함수의 가장 간단한 예다. 성분을 \\(t\\)의 아무 함수로 바꾸면 공간의 곡선(나선, 교선 등)을 나타낼 수 있다. 계산은 늘 「성분별로」다.</div>\n  <div class=\"concept\"><p><b>벡터함수</b>: 정의역이 실수, 값이 벡터인 함수 \\(\\vec r(t)=\\langle f(t),g(t),h(t)\\rangle=f(t)\\vec i+g(t)\\vec j+h(t)\\vec k\\). \\(f,g,h\\)를 성분함수라 한다. 정의역은 세 성분함수가 <b>모두</b> 정의되는 \\(t\\).</p></div><div class=\"concept\"><p><b>극한</b>: 성분별로 \\(\\lim_{t\\to a}\\vec r(t)=\\left\\langle\\lim f,\\lim g,\\lim h\\right\\rangle\\)(셋 다 존재할 때). <b>연속</b>: \\(\\lim_{t\\to a}\\vec r(t)=\\vec r(a)\\) ⇔ 세 성분이 모두 연속.</p></div><div class=\"concept\"><p><b>공간곡선</b>: \\(x=f(t),\\ y=g(t),\\ z=h(t)\\)(매개방정식)를 만족하는 점들의 모임. \\(\\vec r(t)\\)는 원점에서 곡선 위 점까지의 위치벡터.</p></div>", "exam": []}, {"id": "p5-concept-2", "type": "concept", "part": 5, "title": "r(t) = ⟨f(t), g(t), h(t)⟩ — 실수 t 하나에 벡터 하나, 끝점이 그리는 것이 공간곡선 (2/4)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"helix\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 480 258\" width=\"480\" height=\"258\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><line x1=\"150\" y1=\"190\" x2=\"270\" y2=\"190\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><line x1=\"150\" y1=\"190\" x2=\"150\" y2=\"70\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><line x1=\"150\" y1=\"190\" x2=\"78.0\" y2=\"250.0\" stroke=\"#1F2A44\" stroke-width=\"1.5\" marker-end=\"url(#ah)\"></line><text x=\"276\" y=\"195\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">y</text><text x=\"146\" y=\"64\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">z</text><text x=\"72.0\" y=\"240.0\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">x</text><path d=\"M111.6 222.0 L115.0 221.3 L118.5 220.6 L122.1 219.8 L125.7 218.8 L129.5 217. \vec r_1,\\ 0\\le t\\le1\\).</p></div><div class=\"concept\"><p><b>두 곡면의 교선 매개화</b>: 원기둥 \\(x^2+y^2=R^2\\)이 들어 있으면 \\(x=R\\cos t,\\ y=R\\sin t\\)로 두고 나머지 식에서 \\(z\\)를 \\(t\\)로 쓴다.</p></div><div class=\"concept\"><p><b>[고등 수학 복습]</b> \\(\\lim_{t\\to0}\\frac{\\sin t}{t}=1\\), \\(\\lim_{t\\to0}\\frac{e^t-1}{t}=1\\), \\(\\ln u\\)는 \\(u&gt;0\\)에서만, \\(\\sqrt u\\)는 \\(u\\ge0\\)에서만 정의된다.</p></div>", "exam": []}, {"id": "p5-concept-4", "type": "concept", "part": 5, "title": "r(t) = ⟨f(t), g(t), h(t)⟩ — 실수 t 하나에 벡터 하나, 끝점이 그리는 것이 공간곡선 (4/4)", "html": "<div class=\"one\">한 줄: \\(\\vec r(t)=\\langle f,g,h\\rangle\\) · 정의역은 세 성분 공통 · 극한·연속은 성분별 · 선분 \\((1-t)\\vec r_0+t\\vec r_1\\) · 원기둥 교선은 \\(x=R\\cos t,\\ y=R\\sin t\\).</div>\n  ", "exam": []}, {"id": "p5-mu", "type": "mu", "part": 5, "title": "13.1 벡터함수와 공간곡선", "mem": ["정의역 = 성분함수 정의역의 교집합", "극한·연속은 성분별", "선분 \\((1-t)\\vec r_0+t\\vec r_1\\), \\(0\\le t\\le1\\)", "나선 \\(\\langle\\cos t,\\sin t,t\\rangle\\)"], "und": ["직선 \\(\\vec r_0+t\\vec v\\)도 벡터함수인 것", "교선을 매개화할 때 원기둥을 \\(\\cos,\\sin\\)으로 두는 이유"]}, {"id": "p5-b1", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-1 · 정의역", "html": "<p>\\(\\vec r(t)=\\left\\langle e^t,\\ \\ln(t-1),\\ \\sqrt{5-t}\\right\\rangle\\)의 정의역은?</p>", "ans": "\\(e^t\\)는 모든 \\(t\\), \\(\\ln(t-1)\\)은 \\(t>1\\), \\(\\sqrt{5-t}\\)는 \\(t\\le5\\) → 교집합 \\(1\\lt t\\le5\\).", "choices": [{"html": "\\(t>1\\)", "ok": false, "k": 2}, {"html": "\\(1\\lt t\\le5\\)", "ok": true, "k": 0}, {"html": "\\(1\\le t\\le5\\)", "ok": false, "k": 1}, {"html": "\\(t\\le5\\)", "ok": false, "k": 3}], "exam": []}, {"id": "p5-b2", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-2 · 극한", "html": "<p>\\(\\lim_{t\\to0}\\left\\langle\\cos t,\\ \\frac{e^t-1}{t},\\ t^2+2\\right\\rangle\\)은?</p>", "ans": "성분별: \\(\\cos0=1\\), \\(\\lim\\frac{e^t-1}{t}=1\\), \\(0+2=2\\). 가운데를 그냥 넣으면 \\(\\frac00\\)이라 막히는데 알려진 극한 1이다.", "choices": [{"html": "\\(\\langle0,1,2\\rangle\\)", "ok": false, "k": 2}, {"html": "존재하지 않는다", "ok": false, "k": 3}, {"html": "\\(\\langle1,0,2\\rangle\\)", "ok": false, "k": 1}, {"html": "\\(\\langle1,1,2\\rangle\\)", "ok": true, "k": 0}], "exam": []}, {"id": "p5-b3", "type": "q", "part": 5, "kind": "기초", "qn": "기초 5-3 · 곡선 알아보기", "html": "<p>\\(\\vec r(t)=\\langle\\cos t,\\sin t,t\\rangle\\)이 그리는 곡선은?</p>", "ans": "\\(x^2+y^2=1\\)을 늘 만족하고 \\(z=t\\)가 계속 늘어난다 → 나선. \\(z\\)가 없으면 원이 된다.", "choices": [{"html": "원기둥 \\(x^2+y^2=1\\) 둘레를 돌며 올라가는 나선", "ok": true, "k": 0}, {"html": "원점을 지나는 직선", "ok": false, "k": 2}, {"html": "\\(xy\\)평면의 원", "ok": false, "k": 1}, {"html": "구면에 놓인 원", "ok": false, "k": 3}], "exam": []}, {"id": "p5-a4", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-1 · 선분의 벡터함수", "html": "<p>P\\((1,3,-2)\\)에서 Q\\((2,-1,3)\\)까지의 선분을 벡터함수로 나타내라.</p>", "ans": "\\(\\vec r(t)=(1-t)\\langle1,3,-2\\rangle+t\\langle2,-1,3\\rangle=\\langle1+t,\\ 3-4t,\\ -2+5t\\rangle\\), \\(0\\le t\\le1\\). 검산: \\(t=0\\)이면 P, \\(t=1\\)이면 Q ✓. 이것은 방향벡터 \\(\\overrightarrow{PQ}=(1,-4,5)\\)인 직선의 일부.", "choices": null, "exam": []}, {"id": "p5-a5", "type": "q", "part": 5, "kind": "응용", "qn": "응용 5-2 · 교선의 매개화", "html": "<p>원기둥 \\(x^2+y^2=4\\)와 평면 \\(z=1+x\\)가 만나는 곡선을 벡터함수로 나타내라.</p>", "ans": "① 원기둥: \\(x=2\\cos t,\\ y=2\\sin t\\)(\\(x^2+y^2=4\\cos^2t+4\\sin^2t=4\\) ✓). ② 평면: \\(z=1+x=1+2\\cos t\\). ∴ \\(\\vec r(t)=\\langle2\\cos t,\\ 2\\sin t,\\ 1+2\\cos t\\rangle\\), \\(0\\le t\\le2\\pi\\) — 기울어진 타원.", "choices": null, "exam": []}, {"id": "p5-result", "type": "result", "part": 5, "title": "13.1 벡터함수와 공간곡선"}, {"id": "p6-cover", "type": "cover", "part": 6, "no": "파트 6 · 교재 선행", "title": "13.2 벡터함수의 미분과 적분 — 접선벡터 · 단위접선벡터 · 미분 규칙", "star": false}, {"id": "p6-concept", "type": "concept", "part": 6, "title": "r′(t) = ⟨f′, g′, h′⟩ — 곡선의 접선 방향. 적분도 성분별 (1/4)", "html": "<div class=\"why\">1학기 미분을 성분마다 한 번씩 하면 된다. 새로 생기는 뜻은 방향: \\(\\vec r'(t)\\)는 곡선에 접하는 벡터라 접선의 방정식을 만들 수 있다.</div>\n  <div class=\"concept\"><p><b>도함수</b>: \\(\\vec r'(t)=\\lim_{h\\to0}\\dfrac{\\vec r(t+h)-\\vec r(t)}{h}=\\langle f'(t),g'(t),h'(t)\\rangle\\). 성분별로 미분한다.</p></div>", "exam": []}, {"id": "p6-concept-2", "type": "concept", "part": 6, "title": "r′(t) = ⟨f′, g′, h′⟩ — 곡선의 접선 방향. 적분도 성분별 (2/4)", "html": "<div class=\"concept\"><figure class=\"fig\" data-fig=\"tangent\"><svg class=\"fig-svg\" style=\"max-width:100%;height:auto\" viewbox=\"0 0 470 212\" width=\"470\" height=\"212\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Pretendard,-apple-system,sans-serif\" font-size=\"14\" fill=\"#1F2A44\"><defs><marker id=\"ah\" viewbox=\"0 0 10 10\" refx=\"9\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"></path></marker></defs><path d=\"M70.0 135.0 L74.7 131.6 L79.3 128.1 L84.0 124.7 L88.7 121.3 L93.4 117.9 L98.0 114.6 L102.7 111.3 L107.4 108.0 L112.1 104.8 L116.8 101.6 L121.4 98.5 L126.1 95.5 L130.8 92.5 L135.4 89.6 L140.1 86.8 L144.8 84.1 L149.5 81.4 L154.1 78.9 L158.8 76.5 L163.5 74.1 L168.2 71.9 L172.8 69.8 L177.5 67.8 L182.2 66.0 L186.9 64.2 L191.6 62.6 L196.2 61.1 L200.9 59.8 L205.6 58.6 L210.2 57.5 L214.9 56.6 L219.6 55.8 L224.3 55.1 L228.9 54.6 L233.6 54.3 L238.3 54.1 L243.0 54.0 L247.6 54.1 L252.3 54.3 L257.0 54.7 L261.7 55.2 L266.3 55.9 L271.0 56.7 L275.7 57.6 L280.4 58.7 L285.1 59.9 L289.7 61.3 L294.4 62.8 L299.1 64.4 L303.8 66.1 L308.4 68.0 L313.1 70.0 L317.8 72.1 L322.4 74.3 L327.1 76.7 L331.8 79.1 L336.5 81.6 L341.1 84.3 L345.8 87.0 L350.5 89.8 L355.2 92.7 L359.8 95.7 L364.5 98.7 L369.2 101.9 L373.9 105.0 L378.6 108.2 L383.2 111.5 L387.9 114.8 L392.6 118.2 L397.2 121.6 L401.9 125.0 L406.6 128.4 L411.3 131.8 L415.9 135.3 L420.6 138.7 L425.3 142.2 L430.0 145.6 L434.6 149.0 L439.3 152.4 L444.0 155.7\" fill=\"none\" stroke=\"#1971C2\" stroke-width=\"2.4\"></path><circle cx=\"40\" cy=\"196\" r=\"4\" fill=\"#1F2A44\"></circle><text x=\"34\" y=\"200\" font-size=\"13\" fill=\"#1F2A44\" text-anchor=\"end\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">O</text><line x1=\"40\" y1=\"196\" x2=\"158.0\" y2=\"76.89415663713865\" stroke=\"#8A97A6\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"></line><line x1=\"40\" y1=\"196\" x2=\"218.5\" y2=\"55.96640801604062\" stroke=\"#8A97A6\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"></line><text x=\"78\" y=\"128\" font-size=\"13\" fill=\"#8A97A6\" text-anchor=\"end\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r(t)</text><text x=\"186\" y=\"170\" font-size=\"13\" fill=\"#8A97A6\" text-anchor=\"start\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r(t+h)</text><line x1=\"158.0\" y1=\"76.89415663713865\" x2=\"238.07677595056566\" y2=\"35.81240943277904\" stroke=\"#E03131\" stroke-width=\"2.6\" marker-end=\"url(#ah)\"></line><text x=\"242.07677595056566\" y=\"29.81240943277904\" font-size=\"14\" fill=\"#E03131\" text-anchor=\"start\" font-weight=\"700\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">r′(t)</text><circle cx=\"158.0\" cy=\"76.89415663713865\" r=\"4\" fill=\"#1F2A44\"></circle></svg><figcaption style=\"font-size:.86em;opacity:.85;margin-top:4px\">\\(\\vec r'(t)=\\lim_{h\\to0}\\dfrac{\\vec r(t+h)-\\vec r(t)}{h}\\) — 곡선에 접하는 방향(접선벡터).</figcaption></figure></div>", "exam": []}, {"id": "p6-concept-3", "type": "concept", "part": 6, "title": "r′(t) = ⟨f′, g′, h′⟩ — 곡선의 접선 방향. 적분도 성분별 (3/4)", "html": "<div class=\"concept\"><p><b>접선벡터</b>: \\(\\vec r'(t)\\neq\\vec0\\)이면 점 \\(\\vec r(t)\\)에서 곡선에 접하는 방향. <b>단위접선벡터</b> \\(\\vec T(t)=\\dfrac{\\vec r'(t)}{|\\vec r'(t)|}\\). <b>접선</b>: 점 \\(\\vec r(t_0)\\)을 지나고 방향 \\(\\vec r'(t_0)\\)인 직선(12.5 매개방정식).</p></div><div class=\"concept\"><p><b>미분 규칙</b>(\\(\\vec u,\\vec v\\): 벡터함수, \\(c\\): 상수, \\(f\\): 실수함수): \\((\\vec u+\\vec v)'=\\vec u'+\\vec v'\\) · \\((c\\vec u)'=c\\vec u'\\) · \\((f\\vec u)'=f'\\vec u+f\\vec u'\\) · \\((\\vec u\\cdot\\vec v)'=\\vec u'\\cdot\\vec v+\\vec u\\cdot\\vec v'\\) · \\((\\vec u\\times\\vec v)'=\\vec u'\\times\\vec v+\\vec u\\times\\vec v'\\)(외적은 순서 유지) · \\(\\vec u(f(t))'=f'(t)\\,\\vec u'(f(t))\\).</p></div><div class=\"concept\"><p><b>중요한 결과</b>: \\(|\\vec r(t)|=c\\)(일정)이면 \\(\\vec r(t)\\cdot\\vec r'(t)=0\\) — 구면 위를 움직이면 위치와 접선이 늘 수직. 이유: \\(\\vec r\\cdot\\vec r=c^2\\)을 미분하면 \\(2\\vec r\\cdot\\vec r'=0\\).</p></div>", "exam": []}, {"id": "p6-concept-4", "type": "concept", "part": 6, "title": "r′(t) = ⟨f′, g′, h′⟩ — 곡선의 접선 방향. 적분도 성분별 (4/4)", "html": "<div class=\"concept\"><p><b>적분</b>: 성분별로 \\(\\int_a^b\\vec r(t)\\,dt=\\left\\langle\\int_a^bf,\\int_a^bg,\\int_a^bh\\right\\rangle\\). 부정적분은 \\(\\vec R(t)+\\vec C\\)(\\(\\vec C\\): 상수 벡터), 미적분학의 기본정리 \\(\\int_a^b\\vec r\\,dt=\\vec R(b)-\\vec R(a)\\)도 그대로.</p></div><div class=\"one\">한 줄: \\(\\vec r'=\\langle f',g',h'\\rangle\\) = 접선 방향 · \\(\\vec T=\\vec r'/|\\vec r'|\\) · 내적·외적의 곱 미분(외적은 순서 유지) · \\(|\\vec r|\\) 일정 → \\(\\vec r\\cdot\\vec r'=0\\) · 적분은 성분별 + 상수 벡터.</div>\n  ", "exam": []}, {"id": "p6-mu", "type": "mu", "part": 6, "title": "13.2 벡터함수의 미분과 적분 — 접선벡터 · 단위접선벡터 · 미분 규칙", "mem": ["\\(\\vec r'(t)\\), \\(\\vec T(t)=\\vec r'/|\\vec r'|\\)", "\\((\\vec u\\cdot\\vec v)'\\), \\((\\vec u\\times\\vec v)'\\) 곱의 미분", "\\(|\\vec r|=c\\Rightarrow\\vec r\\cdot\\vec r'=0\\)", "적분 = 성분별, 부정적분 + \\(\\vec C\\)"], "und": ["\\(\\vec r'\\)가 접선 방향인 이유(할선 → 접선)", "외적 미분에서 순서를 바꾸면 안 되는 이유"]}, {"id": "p6-b1", "type": "q", "part": 6, "kind": "기초", "qn": "기초 6-1 · 도함수", "html": "<p>\\(\\vec r(t)=\\langle t^3,\\ e^{2t},\\ \\sin3t\\rangle\\)의 \\(\\vec r'(t)\\)는?</p>", "ans": "성분별로: \\((t^3)'=3t^2\\), \\((e^{2t})'=2e^{2t}\\)(합성함수), \\((\\sin3t)'=3\\cos3t\\).", "choices": [{"html": "\\(\\langle3t^2,\\ e^{2t},\\ \\cos3t\\rangle\\)", "ok": false, "k": 1}, {"html": "\\(\\langle t^2,\\ 2e^{t},\\ -3\\cos3t\\rangle\\)", "ok": false, "k": 2}, {"html": "\\(\\langle3t^2,\\ 2e^{2t},\\ 3\\cos3t\\rangle\\)", "ok": true, "k": 0}, {"html": "\\(\\langle3t^2,\\ 2e^{2t},\\ -3\\cos3t\\rangle\\)", "ok": false, "k": 3}], "exam" /* ---------- 수식: KaTeX (지침 §1). 렌더 끝나기 전엔 작업 영역을 감춘다(§0 raw LaTeX 노출 금지) ---------- */
function typeset(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true},{left:"$$",right:"$$",display:true}],throwOnError:false,strict:"ignore"}); }catch(e){}
  }
  const cl=el.cloneNode(true); cl.querySelectorAll(".katex,.katex-display").forEach(k=>k.remove());
  const raw=/\\\(|\\\[|\\frac|\\vec|\\begin\{|\$\$/.test(cl.textContent||"");
  el.dataset.raw=raw?"1":"0";
  if(raw&&el.id==="body"){ el.dataset.ready="false"; el.innerHTML='<div class="kicker">수식 오류</div><h2>이 장의 수식이 그대로 드러나 표시를 멈췄습니다</h2><p>정리노트의 수식 표기를 고쳐 다시 만들어야 합니다.</p>'; }
  el.dataset.ready="true";
  return !raw;
}

/* ---------- 풀이 메모장 (손글씨 캔버스 · 애플펜슬) ---------- */
const PAD={tool:"pen",cv:null,ctx:null,id:null,cur:null,ro:null,dpr:1,W:0,H:0};
function padStrokes(id){ ST.ink=ST.ink||{}; if(!ST.ink[id]) ST.ink[id]={strokes:[]}; return ST.ink[id].strokes; }
function padResize(){ const cv=PAD.cv; if(!cv||!cv.isConnected) return; const r=cv.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  PAD.dpr=Math.min(3,window.devicePixelRatio||1); PAD.W=r.width; PAD.H=r.height; cv.width=Math.round(r.width*PAD.dpr); cv.height=Math.round(r.height*PAD.dpr);
  PAD.ctx=cv.getContext("2d"); PAD.ctx.setTransform(PAD.dpr,0,0,PAD.dpr,0,0); PAD.ctx.lineCap="round"; PAD.ctx.lineJoin="round"; padRedraw(); }
function padLine(ctx,t,x0,y0,x1,y1,p){ if(!ctx) return; const W=PAD.W; ctx.globalCompositeOperation=t==="e"?"destination-out":"source-over"; ctx.strokeStyle="#111111";
  ctx.lineWidth=t==="e"?W*0.03:Math.max(1.2,W*0.0035*(0.6+(p||0.5)*1.2)); ctx.beginPath(); ctx.moveTo(x0*W,y0*W); ctx.lineTo(x1*W,y1*W); ctx.stroke(); }
function padRedraw(){ const ctx=PAD.ctx; if(!ctx) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,PAD.cv.width,PAD.cv.height); ctx.restore();
  for(const st of padStrokes(PAD.id)){ const c=st.c; if(c.length<3) continue; if(c.length===3){ padLine(ctx,st.t,c[0],c[1],c[0]+0.0005,c[1],c[2]); continue; }
    for(let i=3;i<c.length;i+=3) padLine(ctx,st.t,c[i-3],c[i-2],c[i],c[i+1],c[i+2]); } }
function padPt(e){ const r=PAD.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/PAD.W*1000)/1000, Math.round((e.clientY-r.top)/PAD.W*1000)/1000, Math.round((e.pressure||0.5)*100)/100]; }
function padAllowed(e){ return e.pointerType==="pen"||e.pointerType==="mouse"||(e.pointerType==="touch"&&ST.finger); }
function mountPad(id){
  const cv=$("#pad"); if(!cv) return; PAD.cv=cv; PAD.id=id; PAD.cur=null;
  cv.onpointerdown=e=>{ if(!padAllowed(e)) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} const pt=padPt(e); PAD.cur={t:PAD.tool==="eraser"?"e":"p",c:pt.slice()}; padLine(PAD.ctx,PAD.cur.t,pt[0],pt[1],pt[0]+0.0005,pt[1],pt[2]); };
  cv.onpointermove=e=>{ if(!PAD.cur||!padAllowed(e)) return; e.preventDefault(); const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(const ev of evs){ const pt=padPt(ev), c=PAD.cur.c, n=c.length; padLine(PAD.ctx,PAD.cur.t,c[n-3],c[n-2],pt[0],pt[1],pt[2]); c.push(pt[0],pt[1],pt[2]); } };
  const end=()=>{ if(!PAD.cur) return; padStrokes(id).push(PAD.cur); PAD.cur=null; save(); };
  cv.onpointerup=end; cv.onpointercancel=end; cv.onpointerleave=e=>{ if(PAD.cur&&e.pointerType!=="pen") end(); };
  cv.oncontextmenu=e=>e.preventDefault();
  const bar=cv.previousElementSibling;
  bar.querySelectorAll("[data-tool]").forEach(b=>{ b.onclick=()=>{ PAD.tool=b.dataset.tool; bar.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x===b)); }; });
  bar.querySelector('[data-act="undo"]').onclick=()=>{ padStrokes(id).pop(); save(); padRedraw(); };
  bar.querySelector('[data-act="clear"]').onclick=()=>{ if(!padStrokes(id).length||confirm("이 문제의 풀이 메모를 지울까요?")){ ST.ink[id]={strokes:[]}; save(); padRedraw(); } };
  bar.querySelector('[data-act="finger"]').onclick=function(){ ST.finger=!ST.finger; save(); this.classList.toggle("on",ST.finger); };
  if(window.ResizeObserver){ PAD.ro=new ResizeObserver(()=>padResize()); PAD.ro.observe(cv); }
  setTimeout(padResize,30);
}
